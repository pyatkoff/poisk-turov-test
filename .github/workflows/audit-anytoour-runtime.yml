name: Audit anytoour production runtime

on:
  push:
    branches: [feature/search-core]
    paths:
      - '.github/workflows/audit-anytoour-runtime.yml'
  workflow_dispatch:

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/anytoour_key"
          else
            printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/anytoour_key"
          fi
          chmod 600 "$RUNNER_TEMP/anytoour_key"
          ssh-keygen -y -f "$RUNNER_TEMP/anytoour_key" >/dev/null

      - name: Audit production runtime
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER"
          ssh -i "$RUNNER_TEMP/anytoour_key" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -u

          echo '=== OS / host capacity ==='
          if test -r /etc/os-release; then . /etc/os-release; echo "${PRETTY_NAME:-unknown}"; fi
          uname -srmo || true
          echo "CPU_LOGICAL=$(nproc 2>/dev/null || echo unknown)"
          free -m 2>/dev/null || true
          uptime || true

          echo '=== PHP CLI ==='
          command -v php || true
          php -v || true
          php --ini || true

          echo '=== PHP/FPM binaries ==='
          for bin in php-fpm8.3 php-fpm; do
            if command -v "$bin" >/dev/null 2>&1; then
              command -v "$bin"
              "$bin" -v || true
            fi
          done

          echo '=== PHP extensions used/expected by search ==='
          php -r '
            $required=["curl","mbstring","json","openssl","libxml","zip","gd","mysqli","pdo_mysql","Zend OPcache"];
            $optional=["intl"];
            foreach($required as $ext){echo "required:",$ext,"=",extension_loaded($ext)?"yes":"NO","\n";}
            foreach($optional as $ext){echo "optional:",$ext,"=",extension_loaded($ext)?"yes":"no","\n";}
          ' || true

          echo '=== PHP CLI limits ==='
          php -r '
            $keys=["memory_limit","max_execution_time","max_input_time","max_input_vars","post_max_size","upload_max_filesize","default_socket_timeout","realpath_cache_size","realpath_cache_ttl","opcache.enable","opcache.enable_cli","opcache.memory_consumption","opcache.interned_strings_buffer","opcache.max_accelerated_files","opcache.validate_timestamps","opcache.revalidate_freq","opcache.jit","opcache.jit_buffer_size"];
            foreach($keys as $k){$v=ini_get($k);echo $k,"=",($v===false?"<unavailable>":$v),"\n";}
          ' || true

          echo '=== PHP-FPM effective limits ==='
          if command -v php-fpm8.3 >/dev/null 2>&1; then
            php-fpm8.3 -i 2>/dev/null | grep -E '^(Loaded Configuration File|Scan this dir for additional .ini files|memory_limit =>|max_execution_time =>|max_input_time =>|max_input_vars =>|post_max_size =>|upload_max_filesize =>|default_socket_timeout =>|realpath_cache_size =>|realpath_cache_ttl =>|opcache.enable =>|opcache.memory_consumption =>|opcache.interned_strings_buffer =>|opcache.max_accelerated_files =>|opcache.validate_timestamps =>|opcache.revalidate_freq =>|opcache.jit =>|opcache.jit_buffer_size =>)' || true
          fi

          echo '=== PHP-FPM process footprint ==='
          ps -eo pid,rss,comm,args 2>/dev/null | awk '$3 ~ /^php-fpm/ {print}' || true
          ps -eo rss=,comm= 2>/dev/null | awk '$2 ~ /^php-fpm/ {sum+=$1; n++; if($1>max)max=$1} END {if(n) printf("FPM_PROCESSES=%d FPM_RSS_TOTAL_MB=%.1f FPM_RSS_MAX_MB=%.1f\n",n,sum/1024,max/1024); else print "FPM_PROCESSES=0"}' || true

          echo '=== cURL / OpenSSL ==='
          curl --version | head -n 2 || true
          openssl version -a | head -n 3 || true

          echo '=== Web/database binaries ==='
          nginx -v 2>&1 || true
          apache2 -v 2>/dev/null | head -n 2 || httpd -v 2>/dev/null | head -n 2 || true
          mysql --version 2>/dev/null || true

          echo '=== FPM pool identities/tuning (readable config only) ==='
          if test -d /etc/php/8.3/fpm/pool.d; then
            grep -RHnE '^[[:space:]]*(\[[^]]+\]|listen[[:space:]]*=|pm([.]|[[:space:]]*=)|request_terminate_timeout|php_(admin_)?value\[(memory_limit|max_execution_time)\])' /etc/php/8.3/fpm/pool.d 2>/dev/null || true
          fi

          echo '=== nginx timeout/body tuning (readable config only) ==='
          if test -d /etc/nginx; then
            grep -RhE '^[[:space:]]*(fastcgi_(connect|send|read)_timeout|proxy_(connect|send|read)_timeout|client_max_body_size|keepalive_timeout|worker_processes)' /etc/nginx 2>/dev/null | head -n 80 || true
          fi

          echo '=== Web PHP runtime probe ==='
          root="$HOME/www/anytoour.ru"
          test -d "$root" || { echo "SEARCH_ROOT_MISSING=$root"; exit 20; }
          probe=".runtime-audit-$(openssl rand -hex 16).php"
          probe_path="$root/$probe"
          cleanup_probe(){ rm -f "$probe_path"; }
          trap cleanup_probe EXIT
          cat > "$probe_path" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          $keys = ['memory_limit','max_execution_time','max_input_time','max_input_vars','post_max_size','upload_max_filesize','default_socket_timeout','realpath_cache_size','realpath_cache_ttl','opcache.enable','opcache.memory_consumption','opcache.interned_strings_buffer','opcache.max_accelerated_files','opcache.validate_timestamps','opcache.revalidate_freq'];
          $ini = [];
          foreach ($keys as $key) $ini[$key] = ini_get($key);
          echo json_encode([
            'php_version' => PHP_VERSION,
            'sapi' => PHP_SAPI,
            'ini' => $ini,
            'extensions' => [
              'curl' => extension_loaded('curl'),
              'mbstring' => extension_loaded('mbstring'),
              'json' => extension_loaded('json'),
              'openssl' => extension_loaded('openssl'),
              'intl' => extension_loaded('intl'),
              'opcache' => extension_loaded('Zend OPcache'),
            ],
          ], JSON_UNESCAPED_SLASHES);
          PHP
          chmod 644 "$probe_path"
          web_runtime="$(curl -fsS --max-time 20 "https://anytoour.ru/$probe")"
          printf '%s\n' "$web_runtime"
          WEB_RUNTIME="$web_runtime" php -r '
            $d=json_decode(getenv("WEB_RUNTIME"),true);
            if(!is_array($d)){fwrite(STDERR,"WEB_RUNTIME_INVALID\n");exit(40);}
            if(!isset($d["php_version"]) || !str_starts_with((string)$d["php_version"],"8.3.")){fwrite(STDERR,"WEB_PHP_BASELINE_MISMATCH ".($d["php_version"]??"unknown")."\n");exit(41);}
            echo "WEB_PHP83_OK ",$d["php_version"]," SAPI=",($d["sapi"]??"unknown"),"\n";
          '
          cleanup_probe
          trap - EXIT

          echo '=== Search runtime sanity ==='
          test -f "$root/api-v2.php" || { echo 'API_ENTRY_MISSING'; exit 21; }
          php -l "$root/api-v2.php"
          php -r 'if(PHP_MAJOR_VERSION!==8 || PHP_MINOR_VERSION!==3){fwrite(STDERR,"PRODUCTION_PHP_BASELINE_MISMATCH ".PHP_VERSION."\n");exit(30);} echo "PRODUCTION_PHP83_OK ".PHP_VERSION."\n";'
          REMOTE
