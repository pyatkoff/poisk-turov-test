name: MATCH captured direct CURRENT accept v4
on:
  push:
    branches: [ops/match-captured-direct-current-accept-1971-20260914-v1]
    paths: [.github/workflows/hotel-match-captured-direct-current-accept-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-captured-direct-current-accept-1971-v4, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-captured-direct-current-accept-1971-20260914-v4
  SOURCE_RUN_ID: '34884599885'
  SOURCE_ARTIFACT: match-current-saved-tour-detail-34884599885
  SOURCE_RESULT_SHA256: d26d02edbdb8765083fa5462d22361bc893e06eac3ddfa1b9658c35827b53035
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Offline writer syntax preflight
        run: php -l scripts/diagnostics/hotel_match_captured_direct_current_accept.php
      - name: Reserve before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_result_sha256':os.environ['SOURCE_RESULT_SHA256'],'target_pairs':[[4158,37412],[1767,182],[1768,183]],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'andromeda_calls':0,'no_replay':True},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-captured-direct-current-accept-v4-reservation
          path: ${{ runner.temp }}/hotel-match-captured-direct-current-accept-1971-20260914-v4/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Restore exact sealed evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/source"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" -D "$RUNNER_TEMP/source"
          test "$(sha256sum "$RUNNER_TEMP/source/result.json" | awk '{print $1}')" = "$SOURCE_RESULT_SHA256"
          python3 - <<'PY'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'source/result.json').read_text())
          assert x['status']=='completed' and x['operation_id']=='hotel-match-current-saved-tour-detail-1971-20260914-v1-egypt' and x['source_sha']=='4e7b64a3fdc30be2d740ea22dc0fb8018a573064'
          assert x['direct_confirmed']==3 and x['holds']==2
          direct=[r for r in x['rows'] if r['tier']=='DIRECT']; holds=[(r['expected_anex_hotel_id'],r['reason']) for r in x['rows'] if r['tier']!='DIRECT']
          assert {(r['expected_anex_hotel_id'],r['expected_tourvisor_hotel_id']) for r in direct}=={(4158,37412),(1767,182),(1768,183)}
          assert set(holds)=={(37719,'qualifier_conflict'),(42927,'operator_link_anex_id_mismatch')}
          for r in direct:
            assert r['reason']=='direct_identity_confirmed' and r['operator_name']=='Anex' and r['operator_link_present'] is True
            assert r['expected_anex_hotel_id']==r['operator_identity']['anex_hotel_id'] and r['expected_tourvisor_hotel_id']==r['detail_tourvisor_hotel_id']
            assert r['operator_identity']['mode']=='legacy_hotellist' and r['semantic']['state']=='corroborated' and r['semantic']['ratio']==1
            assert not r['qualifier_conflict'] and not r['numeric_conflict']
          direct.sort(key=lambda r:r['expected_anex_hotel_id'])
          (pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'evidence.json').write_text(json.dumps(direct,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: CURRENT guarded append and readback
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          e="$(base64 -w0 "$out/evidence.json")"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir -p \"\$p\"; test ! -e \"\$p/reservation.json\"; printf '%s\\n' '{\"operation_id\":\"$OPERATION_ID\",\"state\":\"reserved_before_db_access\",\"source_sha\":\"$GITHUB_SHA\",\"run_id\":$GITHUB_RUN_ID,\"no_replay\":true}' > \"\$p/reservation.json\"; sync"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_EVIDENCE_B64='$e' php" < scripts/diagnostics/hotel_match_captured_direct_current_accept.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0 -a -s "$out/server-operation.tgz"; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          result=json.loads((s/'result.json').read_text()) if (s/'result.json').exists() else {}; receipt=json.loads((s/'receipt.json').read_text()) if (s/'receipt.json').exists() else {}
          digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest() if (s/'result.json').exists() else None
          ok=receipt.get('result_sha256')==digest and receipt.get('readback_verified') is True and receipt.get('no_replay') is True
          gate={'operation_id':os.environ['OPERATION_ID'],'remote_exit':int(os.environ['REMOTE_RC']),'status':result.get('status'),'integrity_verified':ok,'database_writes':result.get('database_writes'),'mapping_writes':result.get('mapping_writes'),'accepted':result.get('accepted'),'skipped':result.get('skipped'),'coverage_before':result.get('coverage_before'),'coverage_after':result.get('coverage_after'),'accepted_andromeda_on_targets':result.get('accepted_andromeda_on_targets'),'result_sha256':digest,'no_replay':True}
          (root/'workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok or result.get('status')!='completed' or int(os.environ['REMOTE_RC'])!=0: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-captured-direct-current-accept-v4-result
          path: ${{ runner.temp }}/hotel-match-captured-direct-current-accept-1971-20260914-v4/
          if-no-files-found: warn
          retention-days: 90
