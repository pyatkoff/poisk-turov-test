name: Validate V2 analytics v4
on:
  push:
    branches: [main]
    paths:
      - 'v2/analytics-v4.js'
      - '.github/workflows/validate-analytics-v4.yml'
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and contract check
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/analytics-v4.js
          grep -q "track('search_complete'" v2/analytics-v4.js
          grep -q "track('hotel_open'" v2/analytics-v4.js
          grep -q "track('lead_submitted'" v2/analytics-v4.js
          grep -q "addedResultsCount" v2/analytics-v4.js
