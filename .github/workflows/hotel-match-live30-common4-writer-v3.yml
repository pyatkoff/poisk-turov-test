name: MATCH live30 COMMON4 writer v3
'on':
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_live30_common4_writer_v3.php
      - tests/hotel_match_live30_common4_writer_v3_test.php
      - .github/workflows/hotel-match-live30-common4-writer-v3.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-live30-common4-writer-1971-20260923-v3, cancel-in-progress: false}
env:
  OP: hotel-match-live30-common4-writer-1971-20260923-v3
  AUDIT_OP: hotel-match-live30-common4-current-1971-20260923-v2
  AUDIT_SHA: 69bbd1ab7673f0d5ecd2759604c6a6f7e1182a167ba21f78c3f7aeefe05a069f
  BASE: 538d8fe686c2bbe4edc18a6d8d44450993d574ac
  CLAIM: '5800532992'
jobs:
  unit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/live30-common4-writer-v3-20260923'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: match_c4w}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate isolated transactional writer
        env: {MATCH_C4W_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=match_c4w;charset=utf8mb4'}
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live30_common4_writer_v3.php
          php -l tests/hotel_match_live30_common4_writer_v3_test.php
          php scripts/diagnostics/hotel_match_live30_common4_writer_v3.php --self-test
          php tests/hotel_match_live30_common4_writer_v3_test.php
  live:
    needs: unit
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/live30-common4-writer-v3-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and owner claim
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-live30-common4-writer-v3.yml scripts/diagnostics/hotel_match_live30_common4_writer_v3.php tests/hotel_match_live30_common4_writer_v3_test.php "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'172','SERIALIZABLE',os.environ['AUDIT_SHA'],'rollback']:
              assert x in b,x
          PY
          rm input/claim.json
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(90):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Execute guarded 172-row writer
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077;test -n "$KEY";test -n "$HOST";test -n "$USER"
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          audit=".anytoour-match/operations/$AUDIT_OP";op=".anytoour-match/operations/$OP"
          scp "${opts[@]}" "$remote:$audit/result.json" input/audit-result.json
          scp "${opts[@]}" "$remote:$audit/receipt.json" input/audit-receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          b=pathlib.Path('input/audit-result.json').read_bytes();r=json.loads(b);q=json.load(open('input/audit-receipt.json'))
          assert hashlib.sha256(b).hexdigest()==os.environ['AUDIT_SHA']
          assert q['result_sha256']==os.environ['AUDIT_SHA'] and q['state']=='completed_read_only_current_audit'
          assert r['operation']==os.environ['AUDIT_OP'] and r['state']=='completed_read_only_current_audit'
          assert r['writer_ready_count']==172 and r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          PY
          python3 - <<'PY'
          import json,os,pathlib,datetime
          pathlib.Path('reservation/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_write','source_sha':os.environ['HEAD'],
            'audit_result_sha256':os.environ['AUDIT_SHA'],'provider_calls':0,'database_writes':0,'mapping_writes':0,
            'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json input/audit-result.json scripts/diagnostics/hotel_match_live30_common4_writer_v3.php "$remote:$op/payload/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\";cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_AUDIT_RESULT=\"\$HOME/$op/payload/audit-result.json\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/hotel_match_live30_common4_writer_v3.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";mkdir -p export;for f in reservation.json pre-commit.json commit-attempt.json result.json receipt.json;do test -f \"\$f\"&&cp \"\$f\" export/;done;tar -czf - -C export ." >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  n=m.name.lstrip('./')
                  if m.isfile():pathlib.Path('terminal',n).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          if r['state']!='committed_verified':
              print(json.dumps({'state':r['state'],'reason':r.get('reason'),'database_writes':r.get('database_writes')},sort_keys=True))
              raise SystemExit(2)
          assert r['inserted']==172 and r['database_writes']==r['mapping_writes']==172 and r['readback_verified'] is True
          assert sum(r['inserted_by_namespace'].values())==172 and q['state']=='committed_verified' and q['no_replay'] is True
          print(json.dumps({'state':r['state'],'inserted':172,'inserted_by_namespace':r['inserted_by_namespace'],'unique_targets':r['unique_targets'],'readback_verified':True},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-writer-v3-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
