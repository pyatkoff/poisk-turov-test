name: Read Andromeda autosave state v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/andromeda-autosave-state-readonly-v1.yml'
      - 'scripts/diagnostics/andromeda_autosave_state_owner_gate_v1.py'
      - 'scripts/diagnostics/andromeda_autosave_state_readonly_v1.php'
      - 'tests/andromeda_autosave_state_readonly_v1_test.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

env:
  OWNER_COMMAND: /read-andromeda-autosave-state-2530-v1
  PUBLISHED_SOURCE_SHA: ebc508e31e5294d0e0aa8733dbe271e68efa9502
  PUBLISHED_RUN_ID: '35238884947'

jobs:
  control-contract:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 2530 &&
       github.event.comment.body == '/read-andromeda-autosave-state-2530-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify pure read-only contract
        run: |
          set -euo pipefail
          python3 -B tests/andromeda_autosave_state_readonly_v1_test.py
          python3 -m py_compile scripts/diagnostics/andromeda_autosave_state_owner_gate_v1.py
          php -l scripts/diagnostics/andromeda_autosave_state_readonly_v1.php

  authorize:
    needs: control-contract
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.number == 2530 &&
      github.event.comment.body == '/read-andromeda-autosave-state-2530-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      allowed: ${{ steps.allow.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact fresh owner read command
        id: allow
        run: |
          set -euo pipefail
          python3 -B scripts/diagnostics/andromeda_autosave_state_owner_gate_v1.py
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
      - name: Recheck current main and terminal publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=20) as r: return json.load(r)
          main=get('/branches/main')['commit']['sha']
          if main != os.environ['GITHUB_SHA']: raise SystemExit('main_drift')
          run=get('/actions/runs/'+os.environ['PUBLISHED_RUN_ID'])
          if run.get('status')!='completed' or run.get('conclusion')!='success' or run.get('run_attempt')!=1:
              raise SystemExit('published_run_not_terminal_green')
          if run.get('head_sha')!='c326959de1218c6b42a5b8b4f3952fb7d921944c':
              raise SystemExit('published_control_sha_mismatch')
          source=get('/commits/'+os.environ['PUBLISHED_SOURCE_SHA'])
          if source.get('sha') != os.environ['PUBLISHED_SOURCE_SHA']:
              raise SystemExit('published_source_missing')
          print('ANDROMEDA_AUTOSAVE_READONLY_PINS_OK')
          PY

  inspect:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare ephemeral SSH key on runner
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/andromeda-autosave-readonly"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/andromeda-autosave-readonly/key"
          chmod 600 "$RUNNER_TEMP/andromeda-autosave-readonly/key"
          ssh-keygen -y -f "$RUNNER_TEMP/andromeda-autosave-readonly/key" >/dev/null
      - name: Read retained cohorts and AnyTour DB without server mutation
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/andromeda-autosave-readonly"
          ssh -T -i "$root/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$root/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR \
            -l "$ANYTOOUR_DEPLOY_USER" "$ANYTOOUR_DEPLOY_HOST" \
            'php -d display_errors=0 -d log_errors=0' \
            < scripts/diagnostics/andromeda_autosave_state_readonly_v1.php \
            > "$root/result.json"
          test -s "$root/result.json"
      - name: Validate aggregate result and classify remaining blocker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'andromeda-autosave-readonly/result.json'
          data=json.loads(p.read_text(encoding='utf-8'))
          if data.get('schema_version')!=1 or data.get('source')!='andromeda-autosave-state-readonly-v1':
              raise SystemExit('readonly_result_contract')
          if data.get('published_source_sha')!=os.environ['PUBLISHED_SOURCE_SHA'] or data.get('runtime_hashes_verified') is not True:
              raise SystemExit('runtime_evidence_mismatch')
          for key in ['filesystem_writes','supplier_calls','db_writes','booking_calls','lead_calls']:
              if data.get(key)!=0: raise SystemExit('unexpected_side_effect:'+key)
          cp=data['checkpoints']; co=data['cohorts']; db=data['database']
          if db.get('schema_version') != 2: raise SystemExit('offer_store_schema_not_v2')
          if cp['post_publish_total']>0 and cp['post_publish_ready_offer_sum']>0 and db['andromeda_post_publish_completed_refreshes']>0 and db['andromeda_post_publish_seen_rows']>0:
              assessment='confirmed_real_andromeda_autosave'
          elif cp['post_publish_total']>0 and cp['post_publish_ready_offer_sum']==0 and db['andromeda_post_publish_completed_refreshes']>0:
              assessment='confirmed_authoritative_empty_refresh'
          elif co['post_publish_first_page_total']==0:
              assessment='no_post_publish_andromeda_search'
          elif co['post_publish_complete_total']==0:
              assessment='no_post_publish_complete_cohort'
          elif co['post_publish_owned_offer_total']==0:
              assessment='complete_cohort_owned_by_other_providers_only'
          elif co['post_publish_owned_offer_with_complete_surcharge_total']==0:
              assessment='no_saved_party_surcharge_for_owned_offers'
          elif cp['post_publish_total']==0:
              assessment='ready_cohort_but_no_autosave_checkpoint'
          elif db['andromeda_post_publish_completed_refreshes']==0:
              assessment='autosave_checkpoint_without_completed_db_refresh'
          else:
              assessment='partial_evidence_requires_narrower_readonly_audit'
          data['assessment']=assessment
          p.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('ANDROMEDA_AUTOSAVE_READONLY_ASSESSMENT='+assessment)
          print('post_publish_checkpoints='+str(cp['post_publish_total']))
          print('post_publish_ready_offer_sum='+str(cp['post_publish_ready_offer_sum']))
          print('post_publish_complete_cohorts='+str(co['post_publish_complete_total']))
          print('post_publish_owned_surcharge_ready='+str(co['post_publish_owned_offer_with_complete_surcharge_total']))
          print('db_post_publish_refreshes='+str(db['andromeda_post_publish_completed_refreshes']))
          print('db_post_publish_seen_rows='+str(db['andromeda_post_publish_seen_rows']))
          PY
      - name: Preserve sanitized aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-autosave-readonly-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/andromeda-autosave-readonly/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/andromeda-autosave-readonly/key"
