name: MATCH v9 single-native SAMO chunk2
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_v9_single_native_samo_chunk2_v1.php
      - .github/workflows/hotel-match-v9-single-native-samo-chunk2-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-v9-single-native-samo-chunk2-1971-20260921-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-v9-single-native-samo-chunk2-1971-20260921-v1
  BASE_SHA: 316e5cf1e09c158f35772c8e66e3bd0c5be8561f
  CLAIM: '5759505002'
  INPUT_ARTIFACT: '10634643226'
  PRIOR_ARTIFACT: '10634204615'
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and claim
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import subprocess,os
          want={'.github/workflows/hotel-match-v9-single-native-samo-chunk2-v1.yml','scripts/diagnostics/hotel_match_v9_single_native_samo_chunk2_v1.php'}
          got=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert got==want,(got,want)
          PY
          php -l scripts/diagnostics/hotel_match_v9_single_native_samo_chunk2_v1.php
          php scripts/diagnostics/hotel_match_v9_single_native_samo_chunk2_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'));b=c['body'];lo=b.lower()
          assert c['id']==5759505002 and c['user']['id']==226193297 and c['author_association']=='OWNER'
          for token in [os.environ['OPERATION_ID'],'artifact10634643226','artifact10634204615','at most90 unique TV hotels','CURRENT DB READ ONLY','no supplier/Tourvisor/ANEX/Andromeda HTTP','no DB/mapping writes']:
            assert token.lower() in lo,(token,b)
          PY
      - name: Download immutable v9 and chunk1 inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/pyatkoff/poisk-turov-test/actions/artifacts/$INPUT_ARTIFACT/zip" > input/v9.zip
          test "$(sha256sum input/v9.zip|cut -d' ' -f1)" = 0a4337d6a00f668b643b8babb14867e3cae5189bbb881c724c24e5b74e7baaf0
          unzip -q input/v9.zip -d input/v9
          test "$(sha256sum input/v9/reconciliation.json|cut -d' ' -f1)" = 0995ccbd0c14639a335a644748d6dc5af6b359345328698ea3c0fc1300d88814
          gh api "repos/pyatkoff/poisk-turov-test/actions/artifacts/$PRIOR_ARTIFACT/zip" > input/chunk1.zip
          test "$(sha256sum input/chunk1.zip|cut -d' ' -f1)" = 0a115458ac2fb4608bc62b835fefada979a246a9d891ce96ed4ef725c6dd3d2a
          unzip -q input/chunk1.zip -d input/chunk1
          test "$(sha256sum input/chunk1/result.json|cut -d' ' -f1)" = 488b3b9c28cb6f6fd429a6a1925e86217b90022d9372b142ba6e3981c77bc351
          python3 - <<'PY'
          import json
          v=json.load(open('input/v9/reconciliation.json'));p=json.load(open('input/chunk1/result.json'))
          assert v['operation']=='hotel-match-v9-reconcile-1971-20260921-v1' and v['state']=='completed_read_only_reconciliation'
          assert p['operation']=='hotel-match-v9-single-native-samo-chunk1-1971-20260921-v1' and p['state']=='completed_read_only'
          assert 1<=p['selected_unique_hotels']<=90 and len(p['selected_hotel_ids'])==p['selected_unique_hotels']
          PY
      - name: Reserve before CURRENT DB read
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,datetime,pathlib
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_db','source_sha':os.environ['HEAD_SHA'],'input_artifact':10634643226,'prior_artifact':10634204615,'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'provider_calls':0,'database_writes':0,'mapping_writes':0}
          pathlib.Path('reservation/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'v9-samo-chunk2-reservation-${{ github.run_id }}', path: reservation/reservation.json, retention-days: 90}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD_SHA']+'&per_page=100'
          for _ in range(72):
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(q) as f: xs=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD_SHA']]
            if xs and max(xs,key=lambda x:x['id'])['status']=='completed':
              x=max(xs,key=lambda x:x['id']);assert x['conclusion']=='success',x;break
            time.sleep(5)
          else: raise SystemExit('security_not_green')
          PY
      - name: Execute CURRENT SAMO bridge chunk2 read-only
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_v9_single_native_samo_chunk2_v1.php input/v9/reconciliation.json input/chunk1/result.json reservation/reservation.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_INPUT_PATH=\"\$HOME/$op/payload/reconciliation.json\" MATCH_PRIOR_PATH=\"\$HOME/$op/payload/result.json\" php \"\$HOME/$op/payload/hotel_match_v9_single_native_samo_chunk2_v1.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          ssh "${opts[@]}" "$remote" 'cd "$HOME/'"$op"'" && tar -czf - result.json receipt.json' >terminal/server.tgz
      - name: Verify immutable result
        run: |
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
            for n in ['result.json','receipt.json']: pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['operation']==q['operation']=='hotel-match-v9-single-native-samo-chunk2-1971-20260921-v1'
          assert r['state']==q['state']=='completed_read_only' and r['prior_selected_unique_hotels']<=90
          assert 1<=r['selected_unique_hotels']<=90 and r['selected_edges']>=r['selected_unique_hotels'] and r['source_single_native_edges']==532
          assert r['provider_calls']==r['tourvisor_calls']==r['samo_calls']==r['andromeda_calls']==r['database_writes']==r['mapping_writes']==0
          assert all(x['safe_to_write_now'] is False for x in r['rows'])
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          print(json.dumps({'country':r['selected_country_id'],'hotels':r['selected_unique_hotels'],'edges':r['selected_edges'],'provider':r['provider_classification_counts'],'bridge':r['bridge_classification_counts'],'saved_bridge_ids':r['unique_saved_bridge_ids'],'result_sha256':q['result_sha256']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-v9-samo-chunk2-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
