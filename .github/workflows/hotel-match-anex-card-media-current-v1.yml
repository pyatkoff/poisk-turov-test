name: MATCH ANEX card media CURRENT v1
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-card-media-current-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-anex-card-media-current-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-anex-card-media-current-1971-20260914-v1
  SOURCE_RUN_ID: '34840037385'
  SOURCE_ARTIFACT: match-anex-media-hotelcode-current-v1-result
jobs:
  evidence:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable public-card evidence operation
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","source_run_id":%s,"state":"reserved_before_public_network","database_writes":0,"mapping_writes":0,"tourvisor_calls":0,"historical_operations_replayed":false,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_RUN_ID" > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: match-anex-card-media-current-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-card-media-current-1971-20260914-v1/reservation.json
          retention-days: 90
      - name: Download immutable public API identity evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; mkdir -p "$RUNNER_TEMP/source"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" -D "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/evidence.json"
          test -s "$RUNNER_TEMP/source/receipt.json"
      - name: Crawl official hotel cards and extract files.anextour.ru hotelCode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time,urllib.parse,urllib.request,urllib.error
          state=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          src=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'source'/'evidence.json').read_text())
          rows=[r for r in (src.get('rows') or []) if r.get('identity_confirmed') and isinstance(r.get('evidence'),dict)]
          if len(rows)!=94: raise SystemExit(f'source_identity_contract:{len(rows)}')
          ua='AnyTour-MATCH-ANEX-card-media/1.0'; calls=0
          allowed={'anextour.ru','www.anextour.ru'}
          def fetch(url,maxb=6*1024*1024):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,application/json,text/plain,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                final=resp.geturl(); body=resp.read(maxb); status=int(resp.status); ct=resp.headers.get('content-type')
              return final,body,status,ct,None
            except urllib.error.HTTPError as e:return url,b'',int(e.code),None,'http'
            except Exception as e:return url,b'',0,None,type(e).__name__
          def parser(doc,base):
            p=subprocess.run(['php','scripts/diagnostics/hotel_match_anex_photo_url_extract_v1.php',base],input=doc,capture_output=True)
            if p.returncode:return {'hotel_codes':[],'hotelcode_urls':[],'status':'parser_failed'}
            try:return json.loads(p.stdout)
            except Exception:return {'hotel_codes':[],'hotelcode_urls':[],'status':'parser_invalid'}
          out=[]; api_detail_ok=0; card_ok=0; expected=0; anycode=0; conflicts=0; no_link=0; out_host=0
          for r in rows:
            eid=int(r['anex_hotel_id']); path=(r.get('evidence') or {}).get('path')
            if not isinstance(path,str) or not path.startswith('/hotels/'):
              out.append({'anex_hotel_id':eid,'status':'missing_api_path'});continue
            api='https://api.anextour.ru/b2c/hotel?hotel='+urllib.parse.quote(path,safe='')
            final,body,status,ct,err=fetch(api,4*1024*1024);calls+=1
            rec={'anex_hotel_id':eid,'country_id':r['country_id'],'observed':r['observed'],'search_count':r['search_count'],'api_path':path,'api_http':status,'api_sha256':hashlib.sha256(body).hexdigest() if body else None}
            if status!=200 or not body: rec['status']='api_failed';rec['error']=err;out.append(rec);continue
            try:data=json.loads(body)
            except Exception:rec['status']='api_json';out.append(rec);continue
            if isinstance(data,list) and len(data)==1 and isinstance(data[0],dict) and data[0].get('code')==301 and isinstance(data[0].get('url'),str):
              path=data[0]['url'];api='https://api.anextour.ru/b2c/hotel?hotel='+urllib.parse.quote(path,safe='');final,body,status,ct,err=fetch(api,4*1024*1024);calls+=1
              if status!=200 or not body:rec['status']='api_canonical_failed';out.append(rec);continue
              try:data=json.loads(body)
              except Exception:rec['status']='api_canonical_json';out.append(rec);continue
            info=data[0].get('info') if isinstance(data,list) and data and isinstance(data[0],dict) and isinstance(data[0].get('info'),dict) else None
            if not info or int(info.get('inc') or 0)!=eid:rec['status']='api_identity_changed';rec['returned_inc']=int(info.get('inc') or 0) if info else None;out.append(rec);continue
            api_detail_ok+=1
            link=info.get('b2cLink')
            if not isinstance(link,str) or not link.strip():
              no_link+=1;rec['status']='b2c_link_missing';out.append(rec);continue
            link=link.strip()
            if link.startswith('/'):
              link='https://anextour.ru'+link
            elif not link.startswith('https://'):
              no_link+=1;rec['status']='b2c_link_non_https';out.append(rec);continue
            pp=urllib.parse.urlparse(link)
            if (pp.hostname or '').lower() not in allowed:
              out_host+=1;rec['status']='b2c_link_outside_allowlist';rec['b2c_host']=(pp.hostname or '').lower();out.append(rec);continue
            final2,html,status2,ct2,err2=fetch(link);calls+=1
            rec.update({'b2c_url':link,'b2c_final':final2,'b2c_http':status2,'b2c_bytes':len(html),'b2c_sha256':hashlib.sha256(html).hexdigest() if html else None,'b2c_content_type':ct2})
            fp=urllib.parse.urlparse(final2)
            if status2!=200 or not html or (fp.hostname or '').lower() not in allowed:
              rec['status']='card_failed';rec['error']=err2;out.append(rec);continue
            card_ok+=1
            px=parser(html,final2);codes=sorted(set(int(x) for x in px.get('hotel_codes') or [] if int(x)>0)); urls=[]
            for m in px.get('hotelcode_urls') or []:
              if int(m.get('hotelCode') or 0)==eid:urls.append(m.get('url'))
            rec['hotel_codes']=codes;rec['expected_hotelcode_in_card']=eid in codes;rec['expected_media_urls']=urls[:30];rec['url_count']=px.get('url_count');rec['image_like_url_count']=px.get('image_like_url_count')
            if codes:anycode+=1
            if eid in codes:expected+=1;rec['status']='confirmed_hotelcode'
            elif codes:conflicts+=1;rec['status']='hotelcode_conflict'
            else:rec['status']='card_no_hotelcode'
            out.append(rec);time.sleep(0.04)
          result={'status':'completed','operation_id':os.environ['OPERATION_ID'],'source_identity_count':94,'api_detail_ok':api_detail_ok,'card_ok':card_ok,'public_get_calls':calls,'b2c_link_missing':no_link,'b2c_link_outside_allowlist':out_host,'cards_with_any_hotelcode':anycode,'cards_with_expected_hotelcode':expected,'hotelcode_conflicts':conflicts,'rows':out,'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'supplier_search_calls':0,'guards':{'official_anextour_card_only':True,'strict_files_anextour_ru_hotelcode_parser':True,'historical_operations_replayed':False,'no_replay':True}}
          ep=state/'evidence.json';ep.write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_identity_count':94,'api_detail_ok':api_detail_ok,'card_ok':card_ok,'cards_with_expected_hotelcode':expected,'hotelcode_conflicts':conflicts,'public_get_calls':calls,'evidence_sha256':hashlib.sha256(ep.read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n');print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-card-media-current-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-card-media-current-1971-20260914-v1/
          retention-days: 90
