name: MATCH delta v3 receipt read v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - .github/workflows/hotel-match-new-usersearch-delta-v3-receipt-read-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency:
  group: hotel-match-new-usersearch-delta-v3-receipt-read-1971-20260920-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-new-usersearch-delta-v3-receipt-read-1971-20260920-v1
  BASE_SHA: 9b6242b1ddcc4c1b495dd151566627bcc92006b0
  SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
  CLAIM: '5751145089'
  ARTIFACT_ID: '10608562725'
  ARTIFACT_ZIP_SHA: bdaaa624ebcf89bf387adb224345fd7c3f988f4c857c02f1dc4ef36c7156d8d9
  TERMINAL_OPERATION: hotel-match-new-usersearch-anex-samo-delta-1971-20260920-v3
  TERMINAL_SOURCE: 488d54da9773c55ed299e6528eb231dd7b67d0cb
jobs:
  receive:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/match-new-usersearch-delta-v3-receipt-read-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    name: Receive immutable terminal receipt
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      seed: '${{ steps.parse.outputs.seed }}'
      new: '${{ steps.parse.outputs.new }}'
      routes: '${{ steps.parse.outputs.routes }}'
      result_sha: '${{ steps.parse.outputs.result_sha }}'
      matrix: '${{ steps.parse.outputs.matrix }}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and owner claim
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert actual=={'.github/workflows/hotel-match-new-usersearch-delta-v3-receipt-read-v1.yml'},actual
          PY
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
          for s in (os.environ['OPERATION_ID'],os.environ['BASE_SHA'],os.environ['ARTIFACT_ID'],os.environ['ARTIFACT_ZIP_SHA'],os.environ['TERMINAL_SOURCE'],'Provider/Tourvisor/SAMO/Andromeda/direct-ANEX calls0','DB writes0','mapping writes0','day ledgers untouched'):
              assert s in c['body'],s
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed': assert r['conclusion']=='success'; print('SECURITY_OK',r['id']); break
              time.sleep(5)
          else: raise SystemExit('security_not_available')
          PY
      - name: Download and verify terminal artifact only
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > terminal.zip
          test "$(sha256sum terminal.zip | awk '{print $1}')" = "$ARTIFACT_ZIP_SHA"
          mkdir terminal
          unzip -q terminal.zip -d terminal
          test -f terminal/server/result.json
          test -f terminal/server/receipt.json
          test -f terminal/verified-summary.json
      - name: Verify receipt and expose bounded sanitized facts
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,pathlib
          root=pathlib.Path('terminal')
          rr=(root/'server/result.json').read_bytes(); result=json.loads(rr); receipt=json.loads((root/'server/receipt.json').read_bytes()); verified=json.loads((root/'verified-summary.json').read_bytes())
          digest=hashlib.sha256(rr).hexdigest()
          assert result['operation_id']==receipt['operation_id']==os.environ['TERMINAL_OPERATION']
          assert result['source_sha']==receipt['source_sha']==os.environ['TERMINAL_SOURCE']
          assert result['state']==receipt['state']=='completed_read_only'
          assert receipt['result_sha256']==digest and receipt['readback_verified'] is True
          assert verified['result_sha256']==digest
          for k in ('supplier_calls','provider_calls','tourvisor_calls','samo_calls','andromeda_calls','direct_anex_calls','database_writes','mapping_writes'): assert result[k]==0,(k,result[k])
          assert result['safe_to_query_now'] is False and result['safe_to_write_now'] is False
          n=int(result['new_seed_hotel_count']); dossiers=result['dossiers']; assert n==len(result['new_seed_hotel_ids'])==len(dossiers)
          routes=result.get('route_counts') or {}; route_text=','.join(f"{k}={routes[k]}" for k in sorted(routes)) or 'none'
          items=[]
          for d in dossiers[:100]:
              h=d.get('hotel_raw') or {}; name=str(h.get('name') or '').strip(); name=re.sub(r'[\r\n|]+',' ',name)[:80]
              country=(d.get('country_raw') or {}).get('name') or ''
              native=','.join(str(x) for x in (d.get('anex_native_ids') or [])) or '-'
              items.append({'id':str(d.get('local_hotel_id') or '-'),'name':name or '-','state':str(d.get('state') or '-'),'native':native[:80],'country':str(country).replace('|','/')[:50]})
          out=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a',encoding='utf-8') as f:
              f.write('seed='+str(result['current_seed_hotel_count'])+'\n')
              f.write('new='+str(n)+'\n')
              f.write('routes='+route_text+'\n')
              f.write('result_sha='+digest+'\n')
              f.write('matrix='+json.dumps({'item':items},ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'seed':result['current_seed_hotel_count'],'new':n,'routes':routes,'ids':result['new_seed_hotel_ids'],'result_sha256':digest},ensure_ascii=False))
          PY
  summary:
    needs: receive
    if: always() && needs.receive.result == 'success'
    name: 'SUMMARY seed=${{ needs.receive.outputs.seed }} new=${{ needs.receive.outputs.new }} routes=${{ needs.receive.outputs.routes }}'
    runs-on: ubuntu-latest
    steps:
      - run: 'printf "%s\n" "${{ needs.receive.outputs.result_sha }}"'
  dossiers:
    needs: receive
    if: needs.receive.result == 'success' && needs.receive.outputs.new != '0'
    strategy:
      fail-fast: false
      matrix: '${{ fromJSON(needs.receive.outputs.matrix) }}'
    name: 'DOSS ${{ matrix.item.id }} ${{ matrix.item.name }} | ${{ matrix.item.country }} | ${{ matrix.item.state }} | ANEX ${{ matrix.item.native }}'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
