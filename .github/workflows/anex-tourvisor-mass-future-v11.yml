name: MATCH ANEX Tourvisor mass future v11
run-name: MATCH ANEX Tourvisor mass future #1971 v11

on:
  push:
    branches: ['ops/match-anex-tourvisor-mass-future-1971-20260911-v11']
    paths:
      - '.github/match-anex-tourvisor-mass-future-1971-v11.arm'
      - '.github/workflows/anex-tourvisor-mass-future-v11.yml'

permissions:
  contents: read

concurrency:
  group: match-anex-tourvisor-mass-future-1971-v11
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-anex-tourvisor-mass-future-1971-20260911-v11
  TEMPLATE_OPERATION_ID: hotel-match-anex-tourvisor-mass-future-1971-20260911-v9
  EXPECTED_TEMPLATE_SHA: 9ee040339cb7c77c0861597fd087c2d39dcba1ade8deb28df3ff7483558bfe8f

jobs:
  collect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-tourvisor-mass-future-1971-v11.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/anex_tourvisor_mass_future_v9.php
          php -l scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php
          php -l scripts/diagnostics/anex_hotelcode_evidence.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          php -l v2/data/tourvisor-client-v1.php
          got="$(sha256sum scripts/diagnostics/anex_tourvisor_mass_future_v9.php | awk '{print $1}')"
          test "$got" = "$EXPECTED_TEMPLATE_SHA"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]+' scripts/diagnostics/anex_tourvisor_mass_future_v9.php
          ! grep -Eiq "/continue['\"]|/book|bookTour|createOrder|sendLead" scripts/diagnostics/anex_tourvisor_mass_future_v9.php

      - name: Prepare key, payload and reservation locally
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_match_v11_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          mkdir -m 700 "$STATE"
          export STATE
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          state=Path(os.environ['STATE'])
          reservation={
              'operation_id':os.environ['OPERATION_ID'],
              'state':'reserved_before_db_or_supplier_access',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha':os.environ['GITHUB_SHA'],
              'mode':'current_db_live_tourvisor_anex_mass_future_dates_single_ssh_cooldown',
              'database_writes':0,'mapping_writes':0,'search_continue_calls':0,'booking_calls':0,
              'historical_operations_replayed':False,'lead_day_targets':[14,28,42],
              'transport_connections_planned':1,'cooldown_seconds':45,'no_replay':True,
          }
          (state/'reservation.json').write_text(json.dumps(reservation,sort_keys=True,indent=2)+'\n')
          def body(path):
              out=[]
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  s=line.strip()
                  if s in ('<?php','declare(strict_types=1);',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);"):
                      continue
                  if s.startswith('require_once __DIR__'):
                      continue
                  out.append(line)
              return '\n'.join(out)+'\n'
          parts=[
              body('scripts/diagnostics/hotel_full_catalog_reconcile.php'),
              body('scripts/diagnostics/hotel_match_current_bulk_review.php'),
              body('scripts/diagnostics/anex_hotelcode_evidence.php'),
              body('scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php'),
              body('v2/data/tourvisor-client-v1.php'),
              body('scripts/diagnostics/anex_tourvisor_mass_future_v9.php').replace(os.environ['TEMPLATE_OPERATION_ID'],os.environ['OPERATION_ID']),
          ]
          payload="<?php\ndefine('FC_LIBRARY_ONLY', true);\n"+"\n".join(parts)
          if os.environ['OPERATION_ID'] not in payload: raise SystemExit('operation substitution missing')
          (state/'payload.php').write_text(payload,encoding='utf-8')
          print('payload_sha='+hashlib.sha256(payload.encode()).hexdigest())
          PY
          php -l "$STATE/payload.php"

      - name: Preserve reservation before live access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-tourvisor-mass-future-1971-20260911-v11-reservation
          path: ${{ runner.temp }}/hotel-match-anex-tourvisor-mass-future-1971-20260911-v11/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Cool down SSH admission
        shell: bash
        run: sleep 45

      - name: Execute one-connection CURRENT-DB and Tourvisor evidence pass
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          key="$RUNNER_TEMP/anytoour_match_v11_key"
          set +e
          ssh -T -i "$key" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ConnectionAttempts=2 -o LogLevel=ERROR \
            -l "$USER_VALUE" "$HOST_VALUE" \
            'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' \
            <"$STATE/payload.php" >"$STATE/live.stdout" 2>"$STATE/live.stderr"
          rc=$?
          set -e
          export STATE RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          state=Path(os.environ['STATE']); rc=int(os.environ['RC'])
          stdout=(state/'live.stdout').read_text(encoding='utf-8',errors='replace')
          stderr=(state/'live.stderr').read_text(encoding='utf-8',errors='replace')
          lines=[x for x in stdout.splitlines() if x.strip()]
          data=None
          if lines:
              try:data=json.loads(lines[-1])
              except Exception:data=None
          if not isinstance(data,dict):
              low=stderr.lower()
              if 'kex_exchange_identification' in low: transport='kex_exchange_identification_reset'
              elif 'connection reset' in low: transport='connection_reset'
              elif 'connection timed out' in low or 'operation timed out' in low: transport='connect_timeout'
              elif 'permission denied' in low: transport='permission_denied'
              elif 'connection refused' in low: transport='connection_refused'
              else: transport='ssh_exit_'+str(rc)
              result={
                  'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'ssh_transport_failed',
                  'transport_class':transport,'remote_exit':rc,
                  'stdout_sha256':hashlib.sha256(stdout.encode()).hexdigest(),'stdout_bytes':len(stdout.encode()),
                  'stderr_present':bool(stderr.strip()),'stderr_bytes':len(stderr.encode()),
                  'database_calls_claimed':0,'supplier_calls_claimed':0,
                  'database_writes':0,'mapping_writes':0,'booking_calls':0,'search_continue_calls':0,
                  'token_value_recorded':False,'no_replay':True,
              }
          else:
              if data.get('operation_id') != os.environ['OPERATION_ID']: raise SystemExit('operation id mismatch')
              for key in ('database_writes','mapping_writes','booking_calls','search_continue_calls'):
                  if int(data.get(key,0)) != 0: raise SystemExit('write/action guard failed: '+key)
              if data.get('token_value_recorded',False) is not False: raise SystemExit('token recording guard failed')
              result=data
              result.update(source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),remote_exit=rc,stderr_present=bool(stderr.strip()),no_replay=True)
          (state/'result.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          summary={
              'status':result.get('status'),'reason':result.get('reason'),'transport_class':result.get('transport_class'),
              'coverage':result.get('coverage'),'queue_count':result.get('queue_count'),'queue_by_country':result.get('queue_by_country'),
              'operator_ids':result.get('operator_ids'),'supplier':result.get('supplier'),
              'search_count':len(result.get('searches') or []),'raw_queue_matches':result.get('raw_queue_matches'),
              'matched_unique':result.get('matched_unique'),'ambiguous_count':len(result.get('ambiguous_seed_matches') or []),
              'confirmed_full_path_count':len(result.get('confirmed_full_path') or []),
              'strong_operator_link_count':len(result.get('strong_operator_link') or []),
              'conflict_count':len(result.get('conflicts') or []),'search_only_count':len(result.get('search_only') or []),
              'remote_exit':rc,
          }
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          safe=[]
          for group in ('confirmed_full_path','strong_operator_link'):
              for row in result.get(group) or []:
                  safe.append({k:row.get(k) for k in ('evidence_class','anex_hotel_id','tv_hotel_id','tv_hotel_name','match_rule','distance_m','search_count','operator_hotellist','hotel_code')})
          if safe: print('SAFE_EVIDENCE:'+json.dumps(safe[:100],ensure_ascii=False,sort_keys=True))
          if rc != 0 or result.get('status') != 'completed': raise SystemExit(1)
          PY

      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-tourvisor-mass-future-1971-20260911-v11-result
          path: |
            ${{ runner.temp }}/hotel-match-anex-tourvisor-mass-future-1971-20260911-v11/reservation.json
            ${{ runner.temp }}/hotel-match-anex-tourvisor-mass-future-1971-20260911-v11/result.json
          if-no-files-found: warn
          retention-days: 90
