name: Andromeda Search3 selected quote offline
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-claim-actions.php'
      - 'app/integrations/andromeda-selected-quote.php'
      - 'app/integrations/andromeda-search-surcharge.php'
      - 'tests/andromeda-search-surcharge-smoke.php'
      - 'app/integrations/andromeda-price-observation.php'
      - 'app/integrations/andromeda-quote-attempt-state.php'
      - 'v2/api-andromeda-quote-preview.php'
      - 'v2/api-andromeda-search3-preview.php'
      - 'tests/andromeda-selected-quote-smoke.php'
      - 'tests/andromeda-precalc-fuel-evidence-test.php'
      - 'tests/andromeda-flight-selection-continuation-smoke.php'
      - 'tests/andromeda-price-observation-smoke.php'
      - 'tests/andromeda-quote-attempt-state-test.php'
      - 'tests/andromeda-quote-failure-category-test.php'
      - 'scripts/diagnostics/andromeda_http_flight_selection_e2e_v7.py'
      - 'tests/andromeda_http_flight_selection_e2e_v7_test.py'
      - '.github/workflows/andromeda-search3-quote-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prove pre-calc fuel regression against exact predecessor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess, tempfile
          relative='app/integrations/andromeda-selected-quote.php'
          before="                    'fuel_surcharges_reported' => [],"
          after="                    // Current fuel services are evidence even before calc; neither\n                    // their presence nor flight markup proves a complete total.\n                    'fuel_surcharges_reported' => self::fuelSurcharges($claim),"
          source=Path(relative).read_text()
          assert source.count(after)==1
          with tempfile.TemporaryDirectory() as directory:
              root=Path(directory)
              shutil.copytree('app',root/'app')
              shutil.copytree('tests',root/'tests')
              old=root/relative
              old.write_text(source.replace(after,before))
              blob=subprocess.check_output(['git','hash-object',str(old)],text=True).strip()
              assert blob=='c6bc0d3ca1390967302f1489581ea0ae1fd5ba9f',blob
              check=subprocess.run(['php','-d','allow_url_fopen=0',str(root/'tests/andromeda-precalc-fuel-evidence-test.php')],text=True,capture_output=True)
              assert check.returncode!=0 and 'PRECALC_FUEL_EVIDENCE_LOST' in check.stderr,check.stderr
              print('PRECALC_FUEL_EXACT_PREDECESSOR_RED_OK blob='+blob)
          PY
      - name: Syntax and quote-flow regression
        run: |
          php -l app/integrations/andromeda-claim-actions.php
          php -l app/integrations/andromeda-selected-quote.php
          php -l app/integrations/andromeda-search-surcharge.php
          php -d allow_url_fopen=0 tests/andromeda-search-surcharge-smoke.php
          php -l app/integrations/andromeda-price-observation.php
          php -l app/integrations/andromeda-quote-attempt-state.php
          php -l v2/api-andromeda-quote-preview.php
          php tests/andromeda-selected-quote-smoke.php
          php -d allow_url_fopen=0 tests/andromeda-precalc-fuel-evidence-test.php
          php tests/andromeda-flight-selection-continuation-smoke.php
          php tests/andromeda-price-observation-smoke.php
          php tests/andromeda-quote-attempt-state-test.php
          php tests/andromeda-quote-failure-category-test.php
          python3 -m py_compile scripts/diagnostics/andromeda_http_flight_selection_e2e_v7.py tests/andromeda_http_flight_selection_e2e_v7_test.py
          python3 -B tests/andromeda_http_flight_selection_e2e_v7_test.py
      - name: Enforce read-only boundary
        run: |
          ! grep -RE "action['\"]?[[:space:]]*=>[[:space:]]*['\"]bron['\"]|action=bron(?:&|$)|bron_ticket|booking_enabled[[:space:]]*=>[[:space:]]*true" app/integrations/andromeda-claim-actions.php app/integrations/andromeda-selected-quote.php app/integrations/andromeda-price-observation.php app/integrations/andromeda-quote-attempt-state.php v2/api-andromeda-quote-preview.php
          ! grep -RE "INSERT[[:space:]]+INTO|UPDATE[[:space:]]+|DELETE[[:space:]]+FROM" app/integrations/andromeda-claim-actions.php app/integrations/andromeda-selected-quote.php app/integrations/andromeda-price-observation.php app/integrations/andromeda-quote-attempt-state.php v2/api-andromeda-quote-preview.php
