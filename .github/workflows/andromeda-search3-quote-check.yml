name: Andromeda Search3 selected quote offline
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-claim-actions.php'
      - 'app/integrations/andromeda-selected-quote.php'
      - 'v2/api-andromeda-quote-preview.php'
      - 'tests/andromeda-selected-quote-smoke.php'
      - '.github/workflows/andromeda-search3-quote-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax and quote-flow regression
        run: |
          php -l app/integrations/andromeda-claim-actions.php
          php -l app/integrations/andromeda-selected-quote.php
          php -l v2/api-andromeda-quote-preview.php
          php tests/andromeda-selected-quote-smoke.php
      - name: Enforce read-only boundary
        run: |
          ! grep -RE "action['\"]?[[:space:]]*=>[[:space:]]*['\"]bron['\"]|action=bron(?:&|$)|bron_ticket|booking_enabled[[:space:]]*=>[[:space:]]*true" app/integrations/andromeda-claim-actions.php app/integrations/andromeda-selected-quote.php v2/api-andromeda-quote-preview.php
          ! grep -RE "INSERT[[:space:]]+INTO|UPDATE[[:space:]]+|DELETE[[:space:]]+FROM" app/integrations/andromeda-claim-actions.php app/integrations/andromeda-selected-quote.php v2/api-andromeda-quote-preview.php
