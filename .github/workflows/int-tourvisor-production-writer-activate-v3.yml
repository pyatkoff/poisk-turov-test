name: INT Tourvisor production writer activation v3

on:
  push:
    branches:
      - 'ops/int-tourvisor-production-writer-20260917-v3'
    paths:
      - '.github/workflows/int-tourvisor-production-writer-activate-v3.yml'

permissions:
  contents: read

concurrency:
  group: deploy-anytoour-production
  cancel-in-progress: false

env:
  BASE_SHA: f61eb807193ba7eb7d692661f56f62c6f051ca7c
  OPERATION_ID: int-tourvisor-production-writer-20260917-v3

jobs:
  activate:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Bind exact fresh release and isolated v3 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/int-tourvisor-production-writer-activate-v3.yml'
          test "${changed[1]}" = 'scripts/ops/int-tourvisor-production-writer-activate-v3.sh'
          test "$(git ls-remote origin refs/heads/release/search3-production-ready-v1 | awk '{print $1}')" = "$BASE_SHA"
          bash -n scripts/ops/int-tourvisor-production-writer-activate-v3.sh
          php -l v2/api-v2.php >/dev/null
          grep -Fq 'tourvisor-anytour-offer-autosave.php' v2/api-v2.php
          grep -Fq 'AnyTourTourvisorOfferAutosaveV1::autosaveSearchResults' v2/api-v2.php
          grep -Fq 'AnyTourIntOfferSnapshotProducerV1::produce' app/integrations/tourvisor-anytour-offer-autosave.php
          grep -Fq "'authoritative_empty' => false" app/integrations/tourvisor-anytour-offer-autosave.php
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "PRODUCTION_WRITER_V3_SOURCE_BOUND release=$BASE_SHA control=$(git rev-parse HEAD)"

      - name: Activate exact production gateway writer with rollback
        id: activate
        continue-on-error: true
        shell: bash
        run: bash scripts/ops/int-tourvisor-production-writer-activate-v3.sh

      - name: Preserve sanitized activation receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/receipt.json" || printf '{"status":"runner_no_receipt","operation":"%s"}\n' "$OPERATION_ID" > "$RUNNER_TEMP/receipt.json"
          cat "$RUNNER_TEMP/receipt.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: int-tourvisor-production-writer-v3-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail after rollback/evidence preservation
        if: steps.activate.outcome != 'success'
        run: exit 1
