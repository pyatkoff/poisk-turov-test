name: MATCH live30 COMMON4 ANEX writer v5
'on':
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_live30_common4_anex_writer_v5.php
      - tests/hotel_match_live30_common4_anex_writer_v5_test.php
      - .github/workflows/hotel-match-live30-common4-anex-writer-v5.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-live30-common4-anex-writer-1971-20260923-v5, cancel-in-progress: false}
env:
  OP: hotel-match-live30-common4-anex-writer-1971-20260923-v5
  BASE: 411640b6ee48fefc8e085cbadaaf0e61c07eb08a
  CLAIM: '5800796615'
  AUDIT_ARTIFACT: '10770560705'
  AUDIT_ARCHIVE_SHA: 82800934f4b4d09a7788cbf193e75d7fd0cc2b6c6f93db8680d9d90d26c6f6d3
jobs:
  unit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/live30-common4-anex-writer-v5-20260923'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: match_anex_writer}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - env: {MATCH_ANEX_WRITER_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=match_anex_writer;charset=utf8mb4'}
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live30_common4_anex_writer_v5.php
          php scripts/diagnostics/hotel_match_live30_common4_anex_writer_v5.php --self-test
          php tests/hotel_match_live30_common4_anex_writer_v5_test.php
  live:
    needs: unit
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/live30-common4-anex-writer-v5-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate source claim Security and immutable audit artifact
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/audit terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-live30-common4-anex-writer-v5.yml scripts/diagnostics/hotel_match_live30_common4_anex_writer_v5.php tests/hotel_match_live30_common4_anex_writer_v5_test.php "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],'10770560705','82800934f4b4d09a7788cbf193e75d7fd0cc2b6c6f93db8680d9d90d26c6f6d3','exactly the 5','owner_exact_operator_key_20260912_v2','exact_operator_key','SERIALIZABLE']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUDIT_ARTIFACT/zip" -o input/audit.zip
          test "$(sha256sum input/audit.zip | awk '{print $1}')" = "$AUDIT_ARCHIVE_SHA"
          unzip -q input/audit.zip -d input/audit
          result="$(find input/audit -type f -name result.json -print -quit)";receipt="$(find input/audit -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/audit-result.json;cp "$receipt" input/audit-receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          b=pathlib.Path('input/audit-result.json').read_bytes();r=json.loads(b);q=json.load(open('input/audit-receipt.json'))
          assert q['result_sha256']==hashlib.sha256(b).hexdigest()
          assert r['operation']=='hotel-match-live30-common4-anex-current-1971-20260923-v4' and r['state']=='completed_read_only_anex_current_audit'
          assert r['input_count']==28 and r['writer_ready_count']==5 and r['database_writes']==r['mapping_writes']==r['supplier_calls']==0
          PY
      - name: Execute exact 5-row ANEX writer
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/app/integrations\" \"\$HOME/$op/payload/scripts/diagnostics\";printf '%s\n' '{\"operation\":\"$OP\",\"state\":\"reserved_before_write\"}' > \"\$HOME/$op/reservation.json\""
          scp "${opts[@]}" input/audit-result.json scripts/diagnostics/hotel_match_live30_common4_anex_writer_v5.php "$remote:$op/payload/scripts/diagnostics/"
          scp "${opts[@]}" app/integrations/anex-search-mapping-registry.php "$remote:$op/payload/app/integrations/"
          ssh "${opts[@]}" "$remote" "mv \"\$HOME/$op/payload/scripts/diagnostics/audit-result.json\" \"\$HOME/$op/payload/audit-result.json\""
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_AUDIT_RESULT=\"\$HOME/$op/payload/audit-result.json\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_live30_common4_anex_writer_v5.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";mkdir -p export;for f in reservation.json pre-commit.json commit-attempt.json result.json receipt.json;do test -f \"\$f\"&&cp \"\$f\" export/;done;tar -czf - -C export ." >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  n=m.name.lstrip('./')
                  if m.isfile():pathlib.Path('terminal',n).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          if r['state']!='committed_verified':
              print(json.dumps({'state':r['state'],'reason':r.get('reason'),'database_writes':r.get('database_writes')},sort_keys=True));raise SystemExit(2)
          assert r['inserted']==5 and r['database_writes']==r['mapping_writes']==5 and r['readback_verified'] is True and r['registry_readback_verified'] is True
          assert q['state']=='committed_verified' and q['no_replay'] is True
          print(json.dumps({'state':r['state'],'inserted':5,'mapping_digest':r['mapping_digest'],'registry_readback_verified':True,'rows':r['rows']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-anex-writer-v5-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
