name: MATCH official Kaila Krizantem apply v1
on:
  push:
    branches: [ops/match-official-hotel-name-proof-apply-1971-20260917-v1]
    paths: [.github/workflows/hotel-match-official-kaila-krizantem-apply-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-official-kaila-krizantem-apply-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-official-kaila-krizantem-apply-1971-20260917-v1
  REPORT: reports/hotel-match-official-kaila-krizantem-20260917-v1.json
  REPORT_BLOB: 34e1bb2181229bcca565c7c8ab42a00ea5aa78d9
  SCRIPT: scripts/diagnostics/hotel_match_official_kaila_krizantem_apply_v1.php
jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify and reserve before DB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$REPORT")" = "$REPORT_BLOB"
          php "$SCRIPT" --self-test
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          raw=pathlib.Path(os.environ['REPORT']).read_bytes(); d=json.loads(raw)
          assert d['operation_id']==os.environ['OPERATION_ID'] and d['external_hotel_id']=='235275' and d['local_hotel_id']==1311
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5714309547,'proof_sha256':hashlib.sha256(raw).hexdigest(),'report_blob':os.environ['REPORT_BLOB'],'planned_count':1,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-kaila-krizantem-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-official-kaila-krizantem-apply-1971-20260917-v1/reservation.json
          retention-days: 90
      - name: Transaction-time guarded apply
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; cat > \"\$p/proof.json\"; sync" < "$REPORT"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < "$SCRIPT" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json proof.json precommit.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'
          r=json.loads((s/'result.json').read_text()); c=json.loads((s/'receipt.json').read_text()); h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          ok=(r.get('state') in ('committed','completed_no_write') and c.get('result_sha256')==h and c.get('readback_verified') is True and c.get('supplier_calls')==0 and c.get('tourvisor_calls')==0 and c.get('samo_andromeda_calls')==0)
          g={'verified':ok,'state':r.get('state'),'committed_count':r.get('committed_count'),'holds':r.get('holds',[]),'readback':r.get('readback'),'result_sha256':h}
          print(json.dumps(g,ensure_ascii=False,sort_keys=True)); (p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-kaila-krizantem-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-official-kaila-krizantem-apply-1971-20260917-v1/
          retention-days: 90
