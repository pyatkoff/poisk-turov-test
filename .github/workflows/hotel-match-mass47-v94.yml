name: MATCH retained mass47 v94
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-mass47-v94.yml
      - scripts/diagnostics/hotel_match_retained_mass47_v94.php
      - tests/hotel_match_retained_mass47_v94_test.php
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: hotel-match-mass47-v94
  cancel-in-progress: false
env:
  OP: hotel-match-retained-mass47-1971-20260928-v94
  CLAIM: '5860603111'
jobs:
  tested-transaction:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.number == 4061 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928' && github.event.pull_request.draft && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: match94-test
          MYSQL_DATABASE: match94_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmatch94-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check one-shot commit and exact source
        id: arm
        run: |
          set -euo pipefail; umask 077; mkdir terminal
          if [ "$(git log -1 --format=%s)" != 'MATCH: arm mass47 v94 once after fixtures' ]; then
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_retained_mass47_v94.php)" = a222d6791a7c98d9a684490dd31d55ae2e7343c5
          test "$(git rev-parse HEAD:tests/hotel_match_retained_mass47_v94_test.php)" = dbbcbbf871f77f41dc167eaec07954569bbedee4
          test "$(sha256sum scripts/diagnostics/hotel_match_retained_mass47_v94.php|cut -d' ' -f1)" = 57acc46055ce1eb21c19d55d28911a8079f9c4d2460d53df3460015353fd1163
          git merge-base --is-ancestor 4dc407265ae170388a9bf6e236b6a6bfe646392d HEAD
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Pure and disposable MySQL rollback conflict and readback tests
        if: steps.arm.outputs.armed == 'true'
        env:
          MATCH94_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=match94_test;charset=utf8mb4
        run: |
          set -euo pipefail
          php -r 'foreach (["mbstring","pdo_mysql"] as $e) { if (!extension_loaded($e)) exit(1); }'
          php -l scripts/diagnostics/hotel_match_retained_mass47_v94.php
          php -l tests/hotel_match_retained_mass47_v94_test.php
          php tests/hotel_match_retained_mass47_v94_test.php | tee terminal/tests.txt
          grep -q '^M94_MYSQL_PASS ' terminal/tests.txt
      - name: Verify owner scope current draft head and Security
        if: steps.arm.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:return json.load(f)
          c=get('/issues/comments/'+os.environ['CLAIM'])
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for text in ['NEW bounded package of47','Maximum47 writes','provider HTTP0','post-COMMIT census','no SEARCH/INT/UI']:assert text in c['body'],text
          pr=get('/pulls/4061');assert pr['state']=='open' and pr['draft'] is True and pr['head']['sha']==os.environ['HEAD']
          for _ in range(100):
              xs=[r for r in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if r['name']=='Security guard']
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed':assert r['conclusion']=='success';break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          with open('terminal/reservation.json','x') as f:
              json.dump({'operation':os.environ['OP'],'source_sha':os.environ['HEAD'],'claim':os.environ['CLAIM'],'state':'reserved_before_guarded_write','maximum_writes':47,'provider_http_calls':0},f)
          PY
      - name: Single guarded mass47 transaction and CURRENT census
        if: steps.arm.outputs.armed == 'true'
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/match94-key"; known="$RUNNER_TEMP/match94-known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; rel=".anytoour-match/operations/$OP"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$rel/payload\""
          scp "${opts[@]}" terminal/reservation.json "$remote:$rel/reservation.json"
          git archive HEAD scripts/diagnostics app/integrations | ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          set +e
          ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=768M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_retained_mass47_v94.php\" --execute" >terminal/stdout.txt 2>terminal/stderr.txt
          rc=$?
          set -e
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['operation']==q['operation']==os.environ['OP'] and r['source_sha']==os.environ['HEAD']
          assert r['provider_http_calls']==r['new_operator_ids']==0
          assert r['state'] in ('committed_readback_verified','completed_no_new_writes') and r['readback_verified'] is True
          assert r['mapping_writes']==r['database_writes'] and 0<=r['mapping_writes']<=47
          assert len(r['rows'])+len(r['direct_rows'])==r['mapping_writes']
          assert r['mapping_writes']+len(r['held'])+len(r['already'])==47
          print(json.dumps({k:r[k] for k in ['state','database_writes','primary_samo_writes','direct_anex_writes','coverage_before','coverage_after']},ensure_ascii=False))
          PY
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-retained-mass47-v94-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
