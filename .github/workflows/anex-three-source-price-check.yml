name: ANEX three-source price parity
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_search3_three_source_price.php'
      - 'scripts/diagnostics/anex_search3_three_source_price.py'
      - 'tests/anex-search3-three-source-price-smoke.php'
      - 'tests/anex_search3_three_source_price_test.py'
      - 'scripts/diagnostics/anex_additional_parity_v3.php'
      - 'scripts/diagnostics/anex_additional_parity_v3.py'
      - 'tests/anex-additional-parity-v3-smoke.php'
      - 'tests/anex_additional_parity_v3_test.py'
      - 'scripts/diagnostics/anex_concrete_fuel_binding.php'
      - 'scripts/diagnostics/anex_concrete_fuel_binding.py'
      - 'tests/anex-concrete-fuel-binding-smoke.php'
      - 'tests/anex_concrete_fuel_binding_test.py'
      - 'app/integrations/anex-additional-prices-client.php'
      - '.github/workflows/anex-three-source-price-check.yml'
  push:
    branches:
      - 'ops/int-anex-three-source-price-v2-20260911'
      - 'ops/int-anex-additional-parity-v3-fixed-20260912'
      - 'ops/int-anex-additional-program2637-20260912'
      - 'ops/int-anex-concrete-fuel-binding-20260912'
    paths:
      - '.github/ops/anex-three-source-price-v2-20260911'
      - '.github/ops/anex-additional-parity-v3-20260912'
      - '.github/ops/anex-additional-program2637-20260912'
      - '.github/ops/anex-concrete-fuel-binding-20260912'
permissions:
  contents: read
concurrency:
  group: anex-three-source-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate parity sources without network
        run: |
          php -l scripts/diagnostics/anex_search3_three_source_price.php
          php -l tests/anex-search3-three-source-price-smoke.php
          php -d allow_url_fopen=0 tests/anex-search3-three-source-price-smoke.php
          python3 -B tests/anex_search3_three_source_price_test.py
          php -l scripts/diagnostics/anex_additional_parity_v3.php
          php -l tests/anex-additional-parity-v3-smoke.php
          php -d allow_url_fopen=0 tests/anex-additional-parity-v3-smoke.php
          python3 -B tests/anex_additional_parity_v3_test.py
          php -l scripts/diagnostics/anex_concrete_fuel_binding.php
          php -l tests/anex-concrete-fuel-binding-smoke.php
          php -d allow_url_fopen=0 tests/anex-concrete-fuel-binding-smoke.php
          python3 -B tests/anex_concrete_fuel_binding_test.py
          python3 - <<'PY'
          from pathlib import Path
          oldphp=Path('scripts/diagnostics/anex_search3_three_source_price.php').read_text()
          oldpy=Path('scripts/diagnostics/anex_search3_three_source_price.py').read_text()
          assert '->bron(' not in oldphp and 'broninit(' not in oldphp and '->calc(' not in oldphp and 'get_flights(' not in oldphp
          assert "ANEX_THREE_PRICE_EXPERIMENT = 'anex_three_source_price_20260911_v2'" in oldphp
          assert "'date':'2026-09-27'" in oldpy
          assert "'ControlMaster=no'" in oldpy and "'ControlPath=none'" in oldpy and 'ControlMaster=auto' not in oldpy
          assert 'array_replace($out' in oldphp and "array_replace($result, ['reused'=>true])" in oldphp
          php=Path('scripts/diagnostics/anex_additional_parity_v3.php').read_text()
          py=Path('scripts/diagnostics/anex_additional_parity_v3.py').read_text()
          assert "ANEX_ADDITIONAL_PARITY_EXPERIMENT = 'anex_additional_parity_20260912_v1'" in php
          assert "ANEX_ADDITIONAL_PARITY_DATE = '2026-10-12'" in php
          assert 'AnyTourAnexAdditionalPricesClient' in php
          assert "'supplier_replay_allowed'=>false" in php
          assert "'price_arithmetic_applied':False" in py and "'universal_formula_verified':False" in py
          for forbidden in ('->bron(', 'bron_ticket', 'broninit(', '->calc(', 'INSERT INTO anex_hotel_search_mappings', 'UPDATE anex_hotel_search_mappings'):
              assert forbidden not in php
          binding=Path('scripts/diagnostics/anex_concrete_fuel_binding.php').read_text()
          binding_py=Path('scripts/diagnostics/anex_concrete_fuel_binding.py').read_text()
          assert "ANEX_CONCRETE_FUEL_EXPERIMENT = 'anex_concrete_fuel_binding_20260912_v1'" in binding
          assert "ANEX_CONCRETE_FUEL_DATE = '2026-10-19'" in binding
          assert '->expand(' in binding and '->flights(' in binding
          assert "'tour_flights_requested'=>false" in binding
          assert "'production_price_arithmetic_applied':False" in binding_py
          for forbidden in ('->bron(', 'bron_ticket', 'broninit(', '->calc(', 'INSERT INTO anex_hotel_search_mappings', 'UPDATE anex_hotel_search_mappings'):
              assert forbidden not in binding
          workflow=Path('.github/workflows/anex-three-source-price-check.yml').read_text()
          assert 'ops/int-anex-three-source-price-v2-20260911' in workflow
          assert 'ops/int-anex-additional-parity-v3-fixed-20260912' in workflow
          assert 'ops/int-anex-concrete-fuel-binding-20260912' in workflow
          assert 'cancel-in-progress: false' in workflow and workflow.count('if: always()') >= 3
          print('ANEX price/additional parity static boundaries: PASS')
          PY
  live_v2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-three-source-price-v2-20260911' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SOURCE_SHA: 393305647af0b3a5eb3812c112d7985bd675d4e5
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact fresh v2 scenario
        run: |
          test "$(cat control/.github/ops/anex-three-source-price-v2-20260911)" = "source=${SOURCE_SHA};operation=read-only-anex-three-source-price-v2;scenario=Turkey-2026-09-27-7n-2a-AI;owner=2026-09-11"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Run fresh v2 provider cases through durable checkpoints
        id: parity
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/three-source-price"
          python3 -B source/scripts/diagnostics/anex_search3_three_source_price.py "$RUNNER_TEMP/three-source-price"
      - name: Preserve sanitized evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-price-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/three-source-price/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when v2 parity did not complete
        if: steps.parity.outcome != 'success'
        run: exit 1
  live_additional_v3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-additional-parity-v3-fixed-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SOURCE_SHA: dbdd2793bdb593e8e0ff01b6b385c884362b96b2
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact new v3 additional-price parity scenario
        run: |
          test "$(cat control/.github/ops/anex-additional-parity-v3-20260912)" = "source=${SOURCE_SHA};operation=read-only-anex-additional-parity-v3;scenario=Turkey-2026-10-12-7n-2a-AI-six-proven-hotels-ANEX-TV-B2B;owner=2026-09-12"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Run one new inventory-backed ANEX to Tourvisor to B2B comparison
        id: parity
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/additional-parity"
          python3 -B source/scripts/diagnostics/anex_additional_parity_v3.py "$RUNNER_TEMP/additional-parity"
      - name: Preserve sanitized v3 evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-parity-v3-${{ github.run_id }}
          path: ${{ runner.temp }}/additional-parity/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when v3 did not complete
        if: steps.parity.outcome != 'success'
        run: exit 1
  live_program2637:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-additional-program2637-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind receipt to its exact reviewed source parent
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-additional-program2637-20260912'
          test "$(cat control/.github/ops/anex-additional-program2637-20260912)" = "source=${SOURCE_SHA};operation=read-only-anex-additional-program2637;date=2026-10-12;nights=7;currency=3;retained=10304537645;owner=2026-09-12"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Read existing sanitized inventory without supplier search
        uses: actions/download-artifact@v4
        with:
          name: anex-additional-parity-v3-34715151815
          run-id: 34715151815
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: retained
      - name: Read one new program supplement from pinned retained evidence
        id: parity
        continue-on-error: true
        run: |
          test "$(git -C source rev-parse HEAD)" = '${{ steps.control.outputs.source }}'
          mkdir -m 700 "$RUNNER_TEMP/additional-program2637"
          python3 -B source/scripts/diagnostics/anex_additional_parity_v3.py "$RUNNER_TEMP/additional-program2637" --program2637 retained/result.json
      - name: Preserve sanitized program evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-program2637-${{ github.run_id }}
          path: ${{ runner.temp }}/additional-program2637/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when program read did not complete
        if: steps.parity.outcome != 'success'
        run: exit 1
  live_concrete_fuel_binding:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-concrete-fuel-binding-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind concrete fuel receipt to exact reviewed source parent
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-concrete-fuel-binding-20260912'
          test "$(cat control/.github/ops/anex-concrete-fuel-binding-20260912)" = "source=${SOURCE_SHA};operation=read-only-anex-concrete-fuel-binding;scenario=Turkey-2026-10-19-7n-2a-AI-GREEN-GOLD-concrete-expand-flights-TV-B2B;owner=2026-09-12"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Run one new concrete-offer fuel binding scenario
        id: binding
        continue-on-error: true
        run: |
          test "$(git -C source rev-parse HEAD)" = '${{ steps.control.outputs.source }}'
          mkdir -m 700 "$RUNNER_TEMP/concrete-fuel-binding"
          python3 -B source/scripts/diagnostics/anex_concrete_fuel_binding.py "$RUNNER_TEMP/concrete-fuel-binding"
      - name: Preserve sanitized concrete binding evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-concrete-fuel-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/concrete-fuel-binding/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when concrete binding did not complete
        if: steps.binding.outcome != 'success'
        run: exit 1
