name: ANEX three-source price parity
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_search3_three_source_price.php'
      - 'scripts/diagnostics/anex_search3_three_source_price.py'
      - 'tests/anex-search3-three-source-price-smoke.php'
      - 'tests/anex_search3_three_source_price_test.py'
      - '.github/workflows/anex-three-source-price-check.yml'
  push:
    branches:
      - 'ops/int-anex-three-source-price-no-mux-20260911'
    paths:
      - '.github/ops/anex-three-source-price-no-mux-20260911'
permissions:
  contents: read
concurrency:
  group: anex-three-source-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate source without network
        run: |
          php -l scripts/diagnostics/anex_search3_three_source_price.php
          php -l tests/anex-search3-three-source-price-smoke.php
          php -d allow_url_fopen=0 tests/anex-search3-three-source-price-smoke.php
          python3 -B tests/anex_search3_three_source_price_test.py
          python3 - <<'PY'
          from pathlib import Path
          php=Path('scripts/diagnostics/anex_search3_three_source_price.php').read_text()
          py=Path('scripts/diagnostics/anex_search3_three_source_price.py').read_text()
          assert '->bron(' not in php and 'broninit(' not in php and '->calc(' not in php and 'get_flights(' not in php
          assert "ANEX_THREE_PRICE_CASES = ['anex','andromeda','tourvisor']" in php
          assert "'ControlMaster=no'" in py and "'ControlPath=none'" in py and 'ControlMaster=auto' not in py
          workflow=Path('.github/workflows/anex-three-source-price-check.yml').read_text()
          assert "ops/int-anex-three-source-price-no-mux-20260911" in workflow
          assert 'cancel-in-progress: false' in workflow and 'if: always()' in workflow
          print('Three-source parity no-mux boundary: PASS')
          PY
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-three-source-price-no-mux-20260911' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SOURCE_SHA: 7f7099abc226b514315d02a524541b0164a6e683
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact no-mux continuation after supplier-free preflight
        run: |
          test "$(cat control/.github/ops/anex-three-source-price-no-mux-20260911)" = "source=${SOURCE_SHA};operation=read-only-anex-three-source-price-no-mux;preflight=34540781410;owner=2026-09-11"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Resume only through durable server case checkpoints
        id: parity
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/three-source-price"
          python3 -B source/scripts/diagnostics/anex_search3_three_source_price.py "$RUNNER_TEMP/three-source-price"
      - name: Preserve sanitized evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-price-${{ github.run_id }}
          path: ${{ runner.temp }}/three-source-price/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when parity did not complete
        if: steps.parity.outcome != 'success'
        run: exit 1
