name: Visual V2 conversion pull request

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/conversion-confidence-v1.js'
      - 'v2/conversion-confidence-v1.css'
      - 'v2/index.php'
      - '.github/workflows/visual-v2-conversion-pr.yml'
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-conversion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-v2-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit conversion confidence at five viewports
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p conversion-visual-artifacts
          cat > conversion-visual.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          const url=process.env.V2_URL;
          const viewports=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const fixture=[{id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,country:{name:'Турция'},region:{name:'Анталья'},tours:[{id:'tour-901-a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'},roomType:'Standard Sea View',placement:'DBL',operator:{name:'ANEX'},isCharter:true}]}];
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
            for(const [name,width,height] of viewports){const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(2500);
              await page.addStyleTag({path:path.resolve('v2/conversion-confidence-v1.css')});
              await page.addScriptTag({path:path.resolve('v2/conversion-confidence-v1.js')});
              const state=await page.evaluate(items=>{window.V2Results.render(items);const btn=document.querySelector('.direct-tour'),note=document.getElementById('v2ResultsConfidence');return{button:String(btn&&btn.textContent||'').trim(),aria:String(btn&&btn.getAttribute('aria-label')||''),noteVisible:!!note&&!note.hidden&&getComputedStyle(note).display!=='none',noteText:String(note&&note.textContent||'').replace(/\s+/g,' ').trim(),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};},fixture);
              await page.waitForTimeout(100);await page.screenshot({path:`conversion-visual-artifacts/${name}-conversion.png`,fullPage:true});const item={name,http:response?.status()||0,errors,state};report.push(item);const bad=item.http!==200||errors.length||state.button!=='Проверить тур'||!state.aria.includes('Проверить тур')||!state.noteVisible||!state.noteText.includes('не является оплатой')||state.overflow;if(bad)failed=true;console.log('CONVERSION_VISUAL',name,JSON.stringify(item));await context.close();}
            fs.writeFileSync('conversion-visual-artifacts/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node conversion-visual.cjs
      - name: Upload conversion visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-conversion-visual-${{ github.event.pull_request.number || 'manual' }}
          path: conversion-visual-artifacts/
          retention-days: 14
