name: MATCH non-ANEX multiop history bridge v1
on:
  push:
    branches: [ops/match-nonanex-multiop-history-bridge-1971-20260916-v1]
    paths: ['.github/workflows/hotel-match-nonanex-multiop-history-bridge-v1.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-nonanex-multiop-history-bridge-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-nonanex-multiop-history-bridge-1971-20260916-v1
  OUT: /tmp/match-nonanex-multiop-history-bridge-v1
jobs:
  census:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Validate immutable read-only scanner
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_nonanex_multiop_history_bridge_v1.php
          php scripts/diagnostics/hotel_match_nonanex_multiop_history_bridge_v1.php --self-test
          grep -Fq 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' scripts/diagnostics/hotel_match_nonanex_multiop_history_bridge_v1.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_nonanex_multiop_history_bridge_v1.php
      - name: Reserve before SSH history and DB access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT']); s=pathlib.Path('scripts/diagnostics/hotel_match_nonanex_multiop_history_bridge_v1.php')
          (p/'runner-reservation.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_ssh_history_db','script_sha256':hashlib.sha256(s.read_bytes()).hexdigest(),'read_only':True,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 'match-nonanex-multiop-history-reservation-${{ github.run_id }}'
          path: '${{ env.OUT }}/runner-reservation.json'
          retention-days: 90
      - name: Run server-CURRENT retained-history census
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          set +e
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0 -d memory_limit=768M" < scripts/diagnostics/hotel_match_nonanex_multiop_history_bridge_v1.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"; rc=$?
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"; trc=$?
          set -e
          rm -f "$key" "$known"
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT'])
          load=lambda n: json.loads((p/n).read_text()) if (p/n).exists() else {}
          r=load('result.json'); c=load('receipt.json'); rr=load('runner-reservation.json')
          rh=hashlib.sha256((p/'result.json').read_bytes()).hexdigest() if (p/'result.json').exists() else None
          ok=(r.get('state')=='completed_read_only' and r.get('held_input_count')==68 and all(r.get(k)==0 for k in ('database_writes','mapping_writes','supplier_calls','tourvisor_calls','booking_calls','lead_calls')) and r.get('no_replay') is True and c.get('result_sha256')==rh and c.get('readback_verified') is True and rr.get('state')=='reserved_before_ssh_history_db' and int(os.environ['RC'])==0 and int(os.environ['TRC'])==0)
          g={'verified':ok,'held_input_count':r.get('held_input_count'),'held_frequency':r.get('held_frequency'),'operation_dirs_scanned':r.get('operation_dirs_scanned'),'json_files_scanned':r.get('json_files_scanned'),'safe_link_evidence_tuples':r.get('safe_link_evidence_tuples'),'transformed_native_evidence_tuples':r.get('transformed_native_evidence_tuples'),'history_native_match_events':r.get('history_native_match_events'),'biblio_strip102_certificate':r.get('biblio_strip102_certificate'),'route_counts':r.get('route_counts'),'prepared_count':r.get('prepared_count'),'prepared_frequency':r.get('prepared_frequency'),'prepared':r.get('prepared'),'result_sha256':rh,'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(g,sort_keys=True,indent=2)+'\n')
          print(json.dumps(g,sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'match-nonanex-multiop-history-${{ github.run_id }}'
          path: '${{ env.OUT }}/'
          retention-days: 90
