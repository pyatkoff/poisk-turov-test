name: One paired877 activation and one bounded saved-price pass
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price877-activation-once.yml']
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'e7d7c675cf6e52aa5f7326a6101db2ad688c58b4'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate guarded runner and read-only checks
        run: php -l tools/price877-activation/paired-install.php && php -l tools/price877-activation/read-journal.php && php -l tools/price877-activation/feeds.php && python3 -m py_compile tools/price877-activation/*.py && python3 tools/price877-activation/test_runner.py && python3 tools/price877-activation/test_postpass_verify.py
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: e47d578bde03698554428016120a22ceb5272baf
          path: hotel-price-publisher
          persist-credentials: false
      - name: Build exact accepted bundle
        run: |
          python3 hotel-price-publisher/tools/direct_demand/operations/build-monitor-price-hook.py "$RUNNER_TEMP/monitor-price-hook.php"
          php -l "$RUNNER_TEMP/monitor-price-hook.php"
          test "$(wc -c < "$RUNNER_TEMP/monitor-price-hook.php")" = 726483
          test "$(sha256sum "$RUNNER_TEMP/monitor-price-hook.php" | cut -d' ' -f1)" = 483f9f1cd853fdf1808523e72d466e2acd0866ec6ae35de049ada38b5cc128f9
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/poisk-turov-test
          ref: f0dddbdb8c8a4f8f8f12aaaad6df12f6d713dc04
          path: price877-consumer
          persist-credentials: false
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Fresh inspect, one paired activation, one default pass
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 tools/price877-activation/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: price877-activation-${{ github.run_id }}
          path: ${{ runner.temp }}/price-result/
          retention-days: 7
          if-no-files-found: error
      - name: Cleanup original connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
