name: Autopilot V2 contract

on:
  pull_request:
    paths:
      - 'autopilot-v2/**'
      - '.autopilot/**'
      - 'AGENTS.md'
      - '.github/workflows/autopilot-v2-contract.yml'
  push:
    branches: [feature/search-core]
    paths:
      - 'autopilot-v2/**'
      - '.autopilot/**'
      - 'AGENTS.md'
      - '.github/workflows/autopilot-v2-contract.yml'
  workflow_dispatch:

concurrency:
  group: autopilot-v2-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable project policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path('autopilot-v2/project-contract.json').read_text())
          assert contract['design_system']['active']=='AnyTour Design System 2.0'
          assert 'AnyTour Design System 1.0' in contract['design_system']['obsolete']
          assert contract['ci_policy']['normal_development']==['Fast CI']
          print('AUTOPILOT_V2_PROJECT_POLICY_OK')
          PY
      - name: Validate authoritative task queue
        shell: bash
        run: |
          set -euo pipefail
          python3 autopilot-v2/controller.py validate
          python3 autopilot-v2/controller.py status
          python3 autopilot-v2/controller.py plan --max-writers 3
