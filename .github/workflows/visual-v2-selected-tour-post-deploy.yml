name: Visual V2 selected tour post-deploy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-v2-selected-tour-post-deploy.yml'
  workflow_run:
    workflows: ["Deploy V2 only"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-selected-tour-postdeploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selected-tour-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit production selected-tour, flights and lead recovery
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p visual-selected-tour-postdeploy-artifacts
          cat > ./selected-tour-postdeploy.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url = process.env.V2_URL;
          const viewports = [
            ['mobile-375',375,812],
            ['mobile-430',430,932],
            ['tablet-768',768,1024],
            ['intermediate-1024',1024,900],
            ['desktop-1440',1440,1000],
          ];
          const fixture = `
            <button type="button" class="back-results">← Вернуться к предложениям</button>
            <div class="selected-head"><div><span class="eyebrow">ВЫБРАННЫЙ ТУР</span><h2>AnyTour Coast Resort & Spa</h2><p>Турция · Анталья · Лара</p></div><div class="selected-price"><small>Стоимость</small>142 000 ₽</div></div>
            <div class="selected-picture"><div style="height:260px;background:#eef3ff;display:grid;place-items:center;font-weight:900">ANYTOUR HOTEL</div></div>
            <div class="facts"><div><span>Вылет из</span><b>Москва</b></div><div><span>Дата</span><b>12.09.2026</b></div><div><span>Ночей</span><b>9</b></div><div><span>Туристы</span><b>2 взр. + 1 дет.</b></div><div><span>Питание</span><b>Ультра всё включено</b></div><div><span>Номер</span><b>Deluxe Sea View</b></div><div><span>Размещение</span><b>2 ADL + CHD</b></div><div><span>Оператор</span><b>PEGAS</b></div><div><span>Перелёт</span><b>Чартер</b></div><div><span>Топливный сбор</span><b>6 000 ₽</b></div></div>
            <div class="hotel-desc">Большой курортный отель у моря с семейной инфраструктурой, бассейнами и удобным расположением. Длинное описание проверяет раскрытие текста и адаптивность checkout-поверхности.</div>
            <div class="tour-flights"><div class="section-heading"><strong>Авиарейсы</strong><span>Выберите подходящий вариант</span></div><div class="flight-variants"><div class="flight-variant is-selected"><label class="flight-choice"><input type="radio" checked><span>Вариант 1</span><b>142 000 ₽</b></label><div class="flight-segment"><div class="flight-segment-title"><strong>Туда</strong><span>Southwind · 2S172 · Boeing 737-800</span></div><div class="flight-route"><div><b>Шереметьево (SVO)</b><span>12.09.2026 · 14:00</span></div><div class="flight-arrow">→</div><div><b>Даламан (DLM)</b><span>12.09.2026 · 18:05</span></div></div><div class="flight-baggage">Багаж: <b>20 кг</b> · Ручная кладь: <b>8 кг</b></div></div></div><div class="flight-variant"><label class="flight-choice"><input type="radio"><span>Вариант 2</span><b>149 500 ₽</b></label><div class="flight-segment"><div class="flight-segment-title"><strong>Туда</strong><span>Turkish Airlines · TK000 · Airbus A321</span></div></div></div></div></div>
            <form class="lead-form"><div class="section-heading"><strong>Оставить заявку</strong><span>Менеджер получит выбранный тур и рейс</span></div><div class="lead-fields"><label>Имя<input name="name" value="Тест"></label><label>Телефон<input name="phone" value="+7 999 123-45-67"></label></div><label>Комментарий<textarea name="comment" rows="3">Тестовая заявка для визуального аудита.</textarea></label><label class="lead-consent"><input type="checkbox" checked><span>Согласен на обработку персональных данных</span></label><button type="submit" class="primary">Отправить заявку</button><p class="lead-message"></p></form>`;

          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];
            let failed=false;
            for(const [name,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e).slice(0,500)));
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(5000);
              const state=await page.evaluate(fixtureHtml=>{
                ['.v2-product-hero','#tourSearch','#status','#resultsTools','#results'].forEach(sel=>{const el=document.querySelector(sel);if(el)el.style.display='none';});
                const selected=document.querySelector('#selectedTour');
                if(!selected)return{selected:false};
                selected.hidden=false;
                selected.innerHTML=fixtureHtml;
                if(window.V2SelectedTourDescription)window.V2SelectedTourDescription.decorate(selected);
                if(window.V2LeadFormGuard){
                  window.V2LeadFormGuard.decorate(selected);
                  window.V2LeadFormGuard.clarifyFlightType({isCharter:true},selected);
                  window.V2LeadFormGuard.clarifyFuelStatus({fuelCharge:6000},selected);
                  window.V2LeadFormGuard.clarifyFlightPricePrompt(selected);
                  window.V2LeadFormGuard.clarifyDefaultFlightLabel(selected);
                  window.V2LeadFormGuard.syncFlightContext(true,selected);
                  window.V2LeadFormGuard.syncLeadSelectionSummary(selected);
                }
                if(window.V2FlightPriceSync){window.V2FlightPriceSync.clarifyVariantPrices();window.V2FlightPriceSync.clarifyVariantChoices();}
                window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'production-audit',price:142000,isCharter:true,fuelCharge:6000,hotel:{name:'AnyTour Coast Resort & Spa'}}}}));
                window.scrollTo(0,0);
                const visible=el=>!!el&&!el.hidden&&getComputedStyle(el).display!=='none';
                const sticky=document.querySelector('.mobile-search-sticky');
                const root=document.documentElement,body=document.body;
                return {
                  selected:true,
                  selectedVisible:visible(selected),
                  facts:selected.querySelectorAll('.facts>div').length,
                  flights:selected.querySelectorAll('.flight-variant').length,
                  lead:!!selected.querySelector('.lead-form'),
                  leadCta:!!selected.querySelector('.selected-lead-cta'),
                  ctaNote:String(selected.querySelector('.selected-lead-cta-note')?.textContent||'').includes('Без оплаты'),
                  leadSummary:!!selected.querySelector('.lead-selection-summary'),
                  trust:String(selected.querySelector('.lead-trust-note')?.textContent||'').includes('не является оплатой'),
                  detailsToggle:!!selected.querySelector('.facts-secondary-toggle'),
                  descToggle:!!selected.querySelector('.hotel-desc-toggle'),
                  stickyVisible:visible(sticky),
                  overflow:root.scrollWidth>root.clientWidth+2||body.scrollWidth>root.clientWidth+2,
                };
              },fixture);
              await page.waitForTimeout(150);
              await page.screenshot({path:`visual-selected-tour-postdeploy-artifacts/${name}-selected-tour.png`,fullPage:true});
              const recovery=await page.evaluate(()=>{
                const selected=document.querySelector('#selectedTour');
                if(window.V2LeadFormGuard)window.V2LeadFormGuard.syncLeadSubmitState('error',selected);
                const msg=selected?.querySelector('.lead-message'),btn=selected?.querySelector('.lead-form button[type="submit"]');
                return {state:msg?.dataset.state||'',role:msg?.getAttribute('role')||'',message:String(msg?.textContent||''),button:String(btn?.textContent||''),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              });
              await page.screenshot({path:`visual-selected-tour-postdeploy-artifacts/${name}-lead-error.png`,fullPage:true});
              const item={name,width,height,http:response?response.status():0,pageErrors,state,recovery};
              report.push(item);
              const badRecovery=recovery.state!=='error'||recovery.role!=='alert'||!recovery.message.includes('Данные остались в форме')||!recovery.button.includes('Повторить')||recovery.overflow;
              const badState=!state.selected||!state.selectedVisible||state.facts!==10||state.flights!==2||!state.lead||!state.leadCta||!state.ctaNote||!state.leadSummary||!state.trust||!state.detailsToggle||!state.descToggle||state.stickyVisible||state.overflow;
              if(item.http!==200||pageErrors.length||badState||badRecovery)failed=true;
              console.log(`SELECTED_POSTDEPLOY ${name} http=${item.http} selected=${state.selectedVisible} facts=${state.facts} flights=${state.flights} lead=${state.lead}/${state.leadCta}/${state.leadSummary} trust=${state.ctaNote}/${state.trust} sticky=${state.stickyVisible} recovery=${recovery.state}/${recovery.role} overflow=${state.overflow}/${recovery.overflow} errors=${pageErrors.length}`);
              await context.close();
            }
            fs.writeFileSync('visual-selected-tour-postdeploy-artifacts/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./selected-tour-postdeploy.cjs

      - name: Upload selected-tour production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-selected-tour-postdeploy-${{ github.event.workflow_run.id || github.run_id }}
          path: visual-selected-tour-postdeploy-artifacts/
          retention-days: 14
