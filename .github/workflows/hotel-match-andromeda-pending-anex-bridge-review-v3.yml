name: MATCH Andromeda pending ANEX bridge review v3
on:
  push:
    branches: ['ops/match-mass-bridge-1971-20260912']
    paths: ['.github/match-andromeda-pending-anex-bridge-review-1971-20260912-v3.arm']
permissions: {contents: read, issues: write}
concurrency: {group: anytour-match-andromeda-pending-anex-bridge-v3, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-andromeda-pending-anex-bridge-review-1971-20260912-v3
  OUT: /tmp/match-andromeda-pending-anex-bridge-v3
jobs:
  review:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build stricter cross-provider review and reserve
        run: |
          set -euo pipefail
          test "$(cat .github/match-andromeda-pending-anex-bridge-review-1971-20260912-v3.arm)" = "$OPERATION_ID"
          mkdir -p "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/diagnostics/hotel_match_andromeda_pending_mass_review_v2.php').read_text()
          p=p.replace("hotel-match-andromeda-pending-mass-review-1971-20260912-v2","hotel-match-andromeda-pending-anex-bridge-review-1971-20260912-v3")
          p=p.replace("elseif($score>=0.94&&$margin>=0.12&&count($meaning)>=2&&$d!==null&&$d<=1&&$geo){$reason='strong_fuzzy_plus_coord_geo';$ok=true;}","elseif($score>=0.94&&$margin>=0.12&&count($meaning)>=2&&$hasAnex&&$geo){$reason='strong_fuzzy_plus_anex_geo';$ok=true;}")
          p=p.replace("AND_PENDING_REVIEW_V2:","AND_PENDING_ANEX_BRIDGE_V3:")
          Path('/tmp/match-andromeda-pending-anex-bridge-v3/program.php').write_text(p)
          PY
          php -l "$OUT/program.php"
          printf '{"operation_id":"%s","state":"reserved_before_db_access","run_id":%s,"database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" > "$OUT/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: 'and-pending-anex-bridge-v3-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Execute CURRENT read-only cross-provider review
        env: {KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20)
          ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M' < "$OUT/program.php" > "$OUT/stdout" 2> "$OUT/stderr"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['OUT']); raw=(d/'stdout').read_bytes(); lines=[x[len(b'AND_PENDING_ANEX_BRIDGE_V3:'):] for x in raw.splitlines() if x.startswith(b'AND_PENDING_ANEX_BRIDGE_V3:')]
          x=json.loads(lines[-1]) if lines else {'status':'failed','safe_message':'marker_missing'}
          (d/'result.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          s=f"MATCH #1971 Andromeda pending ANEX-bridge v3: **{x.get('status')}**; pending **{x.get('pending_rows')}**, safe **{x.get('safe_count')}**, needs-extra **{x.get('needs_extra_count')}**. Reasons `{json.dumps(x.get('reason_counts') or {},ensure_ascii=False,sort_keys=True)}`. Writes/calls 0. Run `{os.environ['GITHUB_RUN_ID']}`."
          (d/'summary.md').write_text(s+'\n'); print(s)
          raise SystemExit(0 if x.get('status')=='completed' and x.get('operation_id')==os.environ['OPERATION_ID'] else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'and-pending-anex-bridge-v3-${{ github.run_id }}-result', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: test -f "$OUT/summary.md" && gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
