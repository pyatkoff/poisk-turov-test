name: Search3 HC1 content readback B1
on:
  pull_request:
    types: [opened]
    branches: [release/search3-production-ready-v1]
    paths: ['.github/workflows/search3-hc1-content-readback-20260925.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: search3-hc1-content-readback-20260925-b1
  cancel-in-progress: false
jobs:
  readback:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/search3-hc1-content-readback-20260925-b1' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout reviewed read-only source, not mutable PR code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 55c033e0d097a06cb67fc14902f5c3c4f2dc3a3b
          persist-credentials: false
      - name: Validate pinned reader and fictional fixture tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/search3_hotel_content_readback.py)" = 8a0d8f0895f3e691578fea7b66ff191d6a5ff817
          test "$(git hash-object tests/search3_hotel_content_readback_test.py)" = c4242f931bb2e01faecda6f631f171fe70c9ea9a
          python3 -m unittest discover -s tests -p 'search3_hotel_content_readback_test.py' -v
      - name: Require exact-head Security guard success
        env:
          GH_TOKEN: ${{ github.token }}
          HC1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          sha = os.environ['HC1_HEAD_SHA']
          query = urllib.parse.urlencode({'head_sha': sha, 'event': 'pull_request', 'per_page': 100})
          url = 'https://api.github.com/repos/pyatkoff/poisk-turov-test/actions/runs?' + query
          for attempt in range(24):
              request = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=15) as response:
                  runs = json.load(response)['workflow_runs']
              guards = [r for r in runs if r['name'] == 'Security guard' and r['head_sha'] == sha]
              if guards:
                  guard = max(guards, key=lambda r:r['id'])
                  if guard['status'] == 'completed':
                      if guard['conclusion'] != 'success':
                          raise SystemExit('Exact-head Security guard did not succeed')
                      print('Security guard', guard['id'], 'SUCCESS')
                      break
              time.sleep(5)
          else:
              raise SystemExit('Exact-head Security guard not confirmed; no AnyTour read')
          PY
      - name: Read the two existing public catalog contracts once
        id: read
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/hc1-readback"
          python3 scripts/diagnostics/search3_hotel_content_readback.py --legacy-ids 102,559,562,563,570,571,572,573,583,584,586,587,606,608,609,615,621,628,632,6319 > "$RUNNER_TEMP/hc1-readback/result.json"
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/hc1-readback/exit-code.txt"
          sha256sum "$RUNNER_TEMP/hc1-readback/result.json" > "$RUNNER_TEMP/hc1-readback/result.sha256"
          cat "$RUNNER_TEMP/hc1-readback/result.json"
          exit "$rc"
      - name: Retain safe public-field presence report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-hc1-readback-20260925-b1-${{ github.run_id }}
          path: ${{ runner.temp }}/hc1-readback/
          if-no-files-found: warn
          retention-days: 30
