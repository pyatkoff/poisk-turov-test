name: SEO2 data readiness production once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo2-data-readiness-prod-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare production SSH key
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Inspect current production monthly data readiness
        env:
          NEW_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEW_HOST" && test -n "$NEW_USER"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$NEW_USER@$NEW_HOST"
          timeout 45s ssh "${opts[@]}" "$remote" \
            'php "$HOME/www/anytoour.ru/data/inspect-seo-data-readiness-v1.php" --countries=1,4,8 --require-countries=3 --require-snapshots=1' \
            | tee "$RUNNER_TEMP/seo-data-readiness.json"
          php -r '$x=json_decode(file_get_contents(getenv("RUNNER_TEMP")."/seo-data-readiness.json"),true); if(($x["state"]??"")!=="review_only_data_readiness") exit(1); if(($x["publication_allowed"]??true)!==false||($x["feed_publish_allowed"]??true)!==false||($x["copy_allowed"]??true)!==false) exit(2); echo "SEO_DATA_READINESS_PROD_OK countries=".($x["country_count"]??0)." snapshots=".($x["snapshot_count"]??0)." usable=".($x["usable_snapshot_count"]??0)." blocked=".($x["blocked_snapshot_count"]??0).PHP_EOL;'
