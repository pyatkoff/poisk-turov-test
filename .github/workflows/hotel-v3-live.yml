name: Hotel observed bulk v3 live
run-name: Hotel observed bulk 1759 v3 live
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/hotel-v3-live.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: andromeda-identity-writes
  cancel-in-progress: false
env:
  SOURCE_SHA: 300403403cc054c6358bb55fe642f05e74686164
  MERGE_SHA: 8d43dd6b75fec05ee84b7eb203ae577e4acd1769
  OPERATION_ID: hotel-observed-bulk-1759-20260911-v3
jobs:
  accept:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 300403403cc054c6358bb55fe642f05e74686164
          path: reviewed
      - name: Verify checked merge and reserve before SSH
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          export STATE="$RUNNER_TEMP/$OPERATION_ID"
          test "$(git -C reviewed rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/pulls/1959" > "$STATE/pr.json"
          for id in 34538666270 34538666224; do gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$STATE/check-$id.json"; done
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$OPERATION_ID-reservation&per_page=100" > "$STATE/prior.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          state=Path(os.environ['STATE'])
          pr=json.loads((state/'pr.json').read_bytes())
          if pr.get('merged_at') is None or pr.get('merge_commit_sha')!=os.environ['MERGE_SHA'] or pr.get('head',{}).get('sha')!=os.environ['SOURCE_SHA']:
              raise ValueError('checked_source_not_merged')
          for run_id in (34538666270,34538666224):
              run=json.loads((state/f'check-{run_id}.json').read_bytes())
              if run.get('head_sha')!=os.environ['SOURCE_SHA'] or run.get('conclusion')!='success': raise ValueError('checked_source_not_green')
          prior=json.loads((state/'prior.json').read_bytes())
          if prior.get('total_count')!=0 or prior.get('artifacts')!=[]: raise ValueError('operation_already_reserved')
          source=Path('reviewed/scripts/diagnostics/hotel_observed_bulk_reconcile_v3.php').read_text()
          if "HB3_OPERATION = 'hotel-observed-bulk-1759-20260911-v3'" not in source: raise ValueError('operation_source_changed')
          for forbidden in ('ANEX_API_TOKEN','Hotels_DETAILS','PRICE','curl_'):
              if forbidden in source: raise ValueError('supplier_surface')
          (state/'reservation.json').write_text(json.dumps({'state':'reserved_before_ssh','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'merge_sha':os.environ['MERGE_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'apply_exactly_once':True,'unknown_requires_receipt_only':True,'supplier_calls':0},sort_keys=True)+'\n')
          PYTHON
      - name: Preserve v3 reservation
        id: reserved
        uses: actions/upload-artifact@v4
        with:
          name: hotel-observed-bulk-1759-20260911-v3-reservation
          path: ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v3/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply v3 exactly once and verify durable receipt
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, shlex, subprocess, tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          source=Path('reviewed/scripts/diagnostics/hotel_observed_bulk_reconcile_v3.php').read_text()
          if not source.startswith('<?php'): raise ValueError('php_source')
          code=source[len('<?php'):]
          required=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          if any(not os.environ.get(k,'').strip() for k in required): raise ValueError('ssh_configuration')
          host=os.environ[required[1]].strip(); user=os.environ[required[2]].strip()
          if host.startswith('-') or user.startswith('-') or any(c.isspace() for c in host+user): raise ValueError('ssh_target')
          with tempfile.TemporaryDirectory(prefix='hotel-bulk-v3-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key'; key.write_text(os.environ[required[0]].rstrip()+'\n'); key.chmod(0o600); known=Path(tmp)/'known_hosts'
              command=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in required and not k.startswith('ANEX_')}
              def call(phase,timeout):
                  p=subprocess.run(command,input=json.dumps({'operation_id':os.environ['OPERATION_ID'],'phase':phase}),text=True,capture_output=True,timeout=timeout,env=clean)
                  try: value=json.loads(p.stdout)
                  except Exception: value={'status':'transport_unparseable'}
                  return p.returncode,value
              _,before=call('receipt',60)
              (state/'server-before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
              if before.get('status')!='not_started': raise ValueError('server_operation_not_pristine')
              try: apply_rc,apply_result=call('apply',180)
              except subprocess.TimeoutExpired: apply_rc=124; apply_result={'status':'apply_reply_timeout'}
              (state/'apply-response.json').write_text(json.dumps({'exit_code':apply_rc,'result':apply_result},ensure_ascii=False,sort_keys=True)+'\n')
              receipt_rc,receipt=call('receipt',60)
              (state/'receipt.json').write_text(json.dumps({'exit_code':receipt_rc,'result':receipt},ensure_ascii=False,sort_keys=True)+'\n')
              if receipt.get('status') not in ('completed','empty'): raise ValueError('operation_unknown_do_not_replay')
              if receipt.get('operation_id')!=os.environ['OPERATION_ID'] or receipt.get('supplier_calls')!=0: raise ValueError('receipt_scope')
              if receipt.get('status')=='completed' and receipt.get('readback_verified') is not True: raise ValueError('readback_unconfirmed')
              summary={k:receipt.get(k) for k in ('status','operation_id','rules','catalog_scope','anex','andromeda','accepted_total','database_writes','readback_verified','before','after','supplier_calls')}
              (state/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True)+'\n')
              print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PYTHON
      - name: Preserve v3 outcome; never auto-retry
        if: always() && steps.reserved.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hotel-observed-bulk-1759-20260911-v3-result
          path: |
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v3/reservation.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v3/server-before.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v3/apply-response.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v3/receipt.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v3/summary.json
          if-no-files-found: warn
          retention-days: 90
