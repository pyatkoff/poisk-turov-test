name: Validate V2 SEO page primitives

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-page-primitives-v1.php'
      - 'v2/seo-page-contract-v1.php'
      - 'v2/seo-page-types-v1.php'
      - 'v2/seo-internal-links-v1.php'
      - '.github/workflows/validate-v2-seo-primitives.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and semantic contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-page-primitives-v1.php
          php -l v2/seo-page-contract-v1.php
          php -l v2/seo-page-types-v1.php
          php -l v2/seo-internal-links-v1.php
          php <<'PHP'
          <?php
          require 'v2/seo-page-types-v1.php';
          function fail($m){fwrite(STDERR,"SEO_PRIMITIVE_FAIL:$m\n"); exit(1);}

          $crumbs=v2_seo_render_breadcrumbs([
              ['label'=>'Главная','href'=>'/'],
              ['label'=>'Турция','href'=>'/country/turkey/'],
              ['label'=>'Анталья'],
          ]);
          if (!str_contains($crumbs,'aria-label="Хлебные крошки"')) fail('breadcrumbs_semantics');
          if (!str_contains($crumbs,'href="/country/turkey/"')) fail('breadcrumbs_internal_link');
          if (!str_contains($crumbs,'aria-current="page"')) fail('breadcrumbs_current');

          $groups=v2_seo_internal_link_groups([
              ['title'=>'Популярные страны','links'=>[
                  ['label'=>'Турция','href'=>'/country/turkey/'],
                  ['label'=>'Дубль','href'=>'/country/turkey/'],
                  ['label'=>'External','href'=>'https://example.com/'],
                  ['label'=>'Search state','href'=>'/poisk-turov-test/v2/?country=4'],
              ]],
              ['title'=>'Курорты','links'=>[['label'=>'Анталья','href'=>'/resort/antalya/']]],
          ]);
          if (count($groups)!==2 || count($groups[0]['links'])!==1) fail('internal_group_filtering');

          $url=v2_seo_search_handoff_url('/poisk-turov-test/v2/',[
              'from'=>2,'country'=>4,'dateFrom'=>'2026-09-15','daysFrom'=>7,
              'hotel'=>82567,'unknown'=>'drop-me','region'=>['bad'],
          ]);
          foreach (['from=2','country=4','dateFrom=2026-09-15','daysFrom=7','hotel=82567'] as $token) {
              if (!str_contains($url,$token)) fail('handoff_'+$token);
          }
          if (str_contains($url,'unknown') || str_contains($url,'region')) fail('handoff_allowlist');

          $page=v2_seo_resort_page([
              'name'=>'Анталья',
              'h1'=>'Туры в Анталью',
              'description'=>'Подбор туров в Анталью с удобным переходом к актуальному поиску AnyTour.',
              'eyebrow'=>'Турция',
              'intro'=>'Курортный регион на Средиземном море.',
              'breadcrumbs'=>[
                  ['label'=>'Главная','href'=>'/'],
                  ['label'=>'Турция','href'=>'/country/turkey/'],
                  ['label'=>'Анталья'],
              ],
              'sections'=>[['id'=>'season','title'=>'Когда ехать','paragraphs'=>['Сезон зависит от ваших планов.']]],
              'related'=>[['label'=>'Турция','href'=>'/country/turkey/']],
              'internal_links'=>[
                  ['title'=>'Другие курорты','links'=>[
                      ['label'=>'Аланья','href'=>'/resort/alanya/'],
                      ['label'=>'Search state','href'=>'/poisk-turov-test/v2/?region=15'],
                  ]],
              ],
              'search_state'=>['country'=>4,'region'=>15,'unknown'=>'drop'],
          ]);
          if ($page['page_type']!=='resort' || $page['entity_name']!=='Анталья') fail('page_type_identity');
          if ($page['h1']!=='Туры в Анталью' || $page['title']!=='Туры в Анталью — AnyTour') fail('page_type_defaults');
          if (count($page['internal_links'])!==1 || count($page['internal_links'][0]['links'])!==1) fail('page_internal_links');

          $html=v2_seo_render_page_content($page,'/poisk-turov-test/v2/');
          if (substr_count($html,'<h1>')!==1 || !str_contains($html,'<h1>Туры в Анталью</h1>')) fail('page_h1');
          if (!str_contains($html,'<h2>Когда ехать</h2>')) fail('page_sections');
          if (!str_contains($html,'href="/resort/alanya/"') || str_contains($html,'?region=15">Search state')) fail('page_internal_link_render');
          if (!str_contains($html,'country=4') || !str_contains($html,'region=15') || str_contains($html,'unknown')) fail('page_handoff');

          $country=v2_seo_country_page(['name'=>'Турция','h1'=>'Туры в Турцию','description'=>'Полезная страница о турах в Турцию и переход к актуальному поиску предложений AnyTour.']);
          if ($country['page_type']!=='country' || $country['h1']!=='Туры в Турцию') fail('country_page');
          $season=v2_seo_seasonal_page(['name'=>'Новый год','h1'=>'Туры на Новый год','description'=>'Сезонная подборка направлений на Новый год с переходом к актуальному поиску туров AnyTour.']);
          if ($season['page_type']!=='seasonal' || $season['h1']!=='Туры на Новый год') fail('seasonal_page');
          try { v2_seo_resort_page(['name'=>'Анталья','description'=>'Достаточно длинное описание, но без готового редакционного H1.']); fail('missing_h1_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_destination_page('hotel',['name'=>'x','h1'=>'Отель','description'=>'Достаточно длинное описание для проверки неизвестного типа страницы.']); fail('unsupported_type_allowed'); }
          catch (InvalidArgumentException $e) {}

          echo "V2_SEO_PRIMITIVES_OK breadcrumbs=1 internalLinks=1 handoff=1 pageContract=1 pageTypes=3 editorialH1=1\n";
          PHP
