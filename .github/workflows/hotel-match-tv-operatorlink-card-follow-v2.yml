name: MATCH TV operatorLink card evidence v2
on:
  push:
    branches: [ops/match-tv-operatorlink-card-follow-1971-20260915-v1]
    paths: [.github/workflows/hotel-match-tv-operatorlink-card-follow-v2.yml]
permissions: {contents: read}
concurrency: {group: match-tv-operatorlink-card-follow-1971-v2, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tv-operatorlink-card-follow-1971-20260915-v2
jobs:
  evidence:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Build bounded evidence probe
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          cat > "$out/probe.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const OP='hotel-match-tv-operatorlink-card-follow-1971-20260915-v2';
          $targets=[
          [13279655300909,70291,32692,'anex','v12'],[13279655300927,43550,32686,'anex','v12'],[13279655300970,17390,29446,'anex','v12'],[13279655300999,67042,39389,'anex','v12'],[13279655301061,17561,14812,'anex','v12'],
          [13279698430708,71266,29430,'default','v15'],[13273717549550,159,44562,'anex','v17'],[13279717762816,293,28396,'anex','v17'],[13279717762824,83106,37012,'anex','v17'],[13278679634412,129,30600,'anex','v17']];
          function js(array $x):string{return json_encode($x,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);}
          function wr(string $p,array $x):string{$r=js($x)."\n";$f=fopen($p,'x');if(!$f)throw new RuntimeException('create_failed');fwrite($f,$r);fflush($f);fclose($f);if(file_get_contents($p)!==$r)throw new RuntimeException('readback_failed');return hash('sha256',$r);}
          function allowed(string $h):bool{$h=strtolower(rtrim($h,'.'));return $h==='anextour.ru'||str_ends_with($h,'.anextour.ru')||$h==='anextour.com'||str_ends_with($h,'.anextour.com');}
          function shape(string $u):array{$p=parse_url($u);return['scheme'=>strtolower((string)($p['scheme']??'')),'host'=>strtolower((string)($p['host']??'')),'path'=>(string)($p['path']??'')];}
          function ids(string $s):array{$v=[];foreach([$s,html_entity_decode($s,ENT_QUOTES|ENT_HTML5,'UTF-8'),rawurldecode(html_entity_decode($s,ENT_QUOTES|ENT_HTML5,'UTF-8'))] as $t){preg_match_all('/(?:hotelCode|HOTELLIST)(?:%3D|\s*[=:]\s*|["\'\s]*:\s*["\']?)([1-9][0-9]{0,12})/iu',$t,$m);foreach($m[1]??[] as $x)$v[(int)$x]=1;} $r=array_keys($v);sort($r,SORT_NUMERIC);return$r;}
          function fetch_public(string $u):array{$p=parse_url($u);$h=strtolower((string)($p['host']??''));if(strtolower((string)($p['scheme']??''))!=='https'||!allowed($h)||isset($p['user'])||isset($p['pass']))return['ok'=>false,'reason'=>'host_not_allowed'];$body='';$ch=curl_init($u);curl_setopt_array($ch,[CURLOPT_FOLLOWLOCATION=>true,CURLOPT_MAXREDIRS=>4,CURLOPT_CONNECTTIMEOUT=>10,CURLOPT_TIMEOUT=>25,CURLOPT_PROTOCOLS=>CURLPROTO_HTTPS,CURLOPT_REDIR_PROTOCOLS=>CURLPROTO_HTTPS,CURLOPT_USERAGENT=>'AnyTour-MATCH/1.0',CURLOPT_WRITEFUNCTION=>static function($c,string $x)use(&$body):int{if(strlen($body)+strlen($x)>5000000)return 0;$body.=$x;return strlen($x);}]);curl_exec($ch);$e=curl_errno($ch);$st=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);$f=(string)curl_getinfo($ch,CURLINFO_EFFECTIVE_URL);curl_close($ch);$fp=parse_url($f);$fh=strtolower((string)($fp['host']??''));if($e!==0)return['ok'=>false,'reason'=>'curl_error','status'=>$st];if(!allowed($fh))return['ok'=>false,'reason'=>'redirect_host_not_allowed','status'=>$st];if($st<200||$st>=400)return['ok'=>false,'reason'=>'http_'.$st,'status'=>$st,'final'=>shape($f)];return['ok'=>true,'status'=>$st,'final'=>shape($f),'ids'=>ids($u."\n".$f."\n".$body)];}
          $sha=(string)getenv('MATCH_SOURCE_SHA');$root=(string)realpath(getcwd());if(!preg_match('/^[0-9a-f]{40}$/',$sha)||$root===''||basename($root)!=='anytoour.ru')throw new RuntimeException('guard');$base=rtrim((string)getenv('HOME'),'/').'/.anytoour-match/operations';$dir=$base.'/'.OP;if(!is_dir($base)||file_exists($dir)||!mkdir($dir,0700))throw new RuntimeException('operation_exists');
          wr($dir.'/reservation.json',['operation_id'=>OP,'source_sha'=>$sha,'state'=>'reserved_before_supplier_access','targets'=>10,'tourvisor_search_calls'=>0,'tourvisor_continue_calls'=>0,'database_connections'=>0,'database_writes'=>0,'mapping_writes'=>0,'no_replay'=>true]);
          $cfg=is_file($root.'/config.php')?$root.'/config.php':$root.'/v2/config.php';require_once $cfg;if(!defined('TOURVISOR_JWT')||!defined('TOURVISOR_ANEX_JWT'))throw new RuntimeException('credentials_missing');$client=is_file($root.'/data/tourvisor-client-v1.php')?$root.'/data/tourvisor-client-v1.php':$root.'/v2/data/tourvisor-client-v1.php';if(!is_file($client))throw new RuntimeException('client_missing');require_once $client;
          $rows=[];$tv=0;$pub=0;foreach($targets as [$tour,$expected,$proposal,$cred,$origin]){$r=['tour_id'=>$tour,'expected_tourvisor_hotel_id'=>$expected,'discovery_proposal_anex_id'=>$proposal,'proposal_is_identity_evidence'=>false,'origin'=>$origin,'credential_source'=>$cred==='anex'?'TOURVISOR_ANEX_JWT':'TOURVISOR_JWT'];putenv('TOURVISOR_JWT='.(string)($cred==='anex'?TOURVISOR_ANEX_JWT:TOURVISOR_JWT));try{$tv++;$d=v2_data_tv_get('/tours/'.$tour,['currency'=>'RUB']);$hid=(int)($d['hotel']['id']??0);$name=trim((string)($d['hotel']['name']??''));$op=trim((string)($d['operator']['name']??''));$link=trim((string)($d['operatorLink']??''));$r+=['tourvisor_hotel_id'=>$hid,'tourvisor_hotel_name'=>$name,'operator_name'=>$op,'operator_link_present'=>$link!==''];if($hid!==$expected){$r+=['tier'=>'HOLD','reason'=>'tourvisor_hotel_changed'];$rows[]=$r;continue;}if(!preg_match('/anex/i',$op)||$link===''){$r+=['tier'=>'HOLD','reason'=>$link===''?'operator_link_missing':'operator_not_anex'];$rows[]=$r;continue;}$r['operator_link_shape']=shape($link);$found=ids($link);if(!$found){$pub++;$f=fetch_public($link);$r['public_follow']=['ok'=>$f['ok']??false,'status'=>$f['status']??null,'reason'=>$f['reason']??null,'final'=>$f['final']??null];if(($f['ok']??false)===true)$found=$f['ids']??[];}$r['observed_anex_ids']=$found;$r['tier']=count($found)===1?'EVIDENCE':'HOLD';$r['reason']=count($found)===1?'native_identity_observed':(count($found)>1?'native_identity_ambiguous':'native_identity_missing');}catch(Throwable $e){$r+=['tier'=>'HOLD','reason'=>'tour_detail_error','error'=>preg_replace('/[^A-Za-z0-9_.-]+/','_',substr($e->getMessage(),0,100))];}$rows[]=$r;}putenv('TOURVISOR_JWT=');
          $c=['EVIDENCE'=>0,'HOLD'=>0];$re=[];foreach($rows as $r){$c[$r['tier']]++;$re[$r['reason']]=($re[$r['reason']]??0)+1;}ksort($re);$result=['operation_id'=>OP,'source_sha'=>$sha,'status'=>'completed','target_count'=>10,'tourvisor_detail_calls'=>$tv,'tourvisor_search_calls'=>0,'tourvisor_continue_calls'=>0,'anex_public_gets'=>$pub,'counts'=>$c,'reason_counts'=>$re,'rows'=>$rows,'database_connections'=>0,'database_queries'=>0,'database_writes'=>0,'mapping_writes'=>0,'booking_calls'=>0,'lead_calls'=>0,'raw_provider_bodies_recorded'=>false,'raw_operator_links_recorded'=>false,'token_values_recorded'=>false,'no_replay'=>true];$h=wr($dir.'/result.json',$result);wr($dir.'/receipt.json',['operation_id'=>OP,'source_sha'=>$sha,'state'=>'completed','result_sha256'=>$h,'readback_verified'=>hash('sha256',(string)file_get_contents($dir.'/result.json'))===$h,'database_writes'=>0,'mapping_writes'=>0,'no_replay'=>true]);echo js(['counts'=>$c,'reason_counts'=>$re,'tourvisor_detail_calls'=>$tv,'anex_public_gets'=>$pub])."\n";
          PHP
          php -l "$out/probe.php"
          grep -F "v2_data_tv_get('/tours/'" "$out/probe.php" >/dev/null
          ! grep -F '/tours/search' "$out/probe.php" >/dev/null
          ! grep -F '/continue' "$out/probe.php" >/dev/null
      - name: Execute evidence operation
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi; chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"; trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          set +e; ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0" < "$out/probe.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"; rc=$?; ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz"; trc=$?; set -e; test $trc -eq 0; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"; test $rc -eq 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/ 'server'; r=json.loads((p/'result.json').read_text()); q=json.loads((p/'receipt.json').read_text()); assert q['readback_verified'] is True and q['result_sha256']==hashlib.sha256((p/'result.json').read_bytes()).hexdigest(); assert r['tourvisor_search_calls']==r['tourvisor_continue_calls']==r['database_connections']==r['database_writes']==r['mapping_writes']==0; print(json.dumps({'counts':r['counts'],'reason_counts':r['reason_counts'],'tourvisor_detail_calls':r['tourvisor_detail_calls'],'anex_public_gets':r['anex_public_gets']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-operatorlink-card-follow-v2-result
          path: ${{ runner.temp }}/hotel-match-tv-operatorlink-card-follow-1971-20260915-v2/
          retention-days: 90
