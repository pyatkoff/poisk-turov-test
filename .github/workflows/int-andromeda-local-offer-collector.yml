name: INT Andromeda local DB collector
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-local-offer-collector.php'
      - 'tests/andromeda-local-offer-collector-test.php'
      - '.github/workflows/int-andromeda-local-offer-collector.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: |
          set -euo pipefail
          php -l app/integrations/andromeda-local-offer-collector.php
          php -l tests/andromeda-local-offer-collector-test.php
          php tests/andromeda-local-offer-collector-test.php
