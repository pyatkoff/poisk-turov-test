name: MATCH global coordinate-nearest rescue
run-name: MATCH global coordinate-nearest rescue #1971
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_global_coordinate_nearest_rescue.php'
      - 'tests/hotel-match-global-coordinate-nearest-rescue-test.php'
      - '.github/workflows/hotel-match-global-coordinate-nearest-rescue.yml'
  push:
    branches: ['feat/match-anex-sellability-20260911']
    paths:
      - '.github/match-global-coordinate-nearest-rescue-1971-v1.arm'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-global-coordinate-nearest-rescue-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-global-coordinate-nearest-rescue-1971-20260911-v1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate coordinate-nearest rescue scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_global_coordinate_nearest_rescue.php
          php -l tests/hotel-match-global-coordinate-nearest-rescue-test.php
          php tests/hotel-match-global-coordinate-nearest-rescue-test.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_global_coordinate_nearest_rescue.php').read_text()
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert 'HMGCN_COORD_BLOCK_M=5000.0' in s and 'HMGCN_SINGLE_M=50.0' in s
          assert "'zero_token_coordinate_only_auto_accept'=>false" in s
          assert "['ANNEX','BEACH','GARDEN','NORTH','SOUTH']" in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl_init','https://','http://'):
              assert bad.lower() not in s.lower(), bad
          print('read-only coordinate-nearest scope verified')
          PYTHON
  review:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify immutable arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-global-coordinate-nearest-rescue-1971-v1.arm)" = "$OPERATION_ID"
      - name: Prepare SSH key
        env: {KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'}
        run: |
          set -euo pipefail; test -n "$KEY_VALUE"; key="$RUNNER_TEMP/anytoour_match_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: SSH/runtime preflight before reservation
        env: {HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail; test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_match_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          out="$(ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'root="$HOME/www/anytoour.ru"; cd "$root"; { test -f data/db-v1.php || test -f v2/data/db-v1.php; }; printf MATCH_SSH_OK')"; test "$out" = MATCH_SSH_OK
      - name: Reserve before CURRENT DB access
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (Path(os.environ['STATE'])/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PYTHON
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-global-coordinate-nearest-rescue-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-match-global-coordinate-nearest-rescue-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run CURRENT read-only coordinate-nearest rescue
        env: {ANYTOOUR_DEPLOY_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', ANYTOOUR_DEPLOY_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PYTHON'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[5:]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          cross=body('scripts/diagnostics/hotel_match_global_cross_provider_rescue.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          review=body('scripts/diagnostics/hotel_match_global_coordinate_nearest_rescue.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_cross_provider_rescue.php';\n",'',1)
          wrapper=r'''
          try{$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMGCN_ROOT');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMGCN_DB_HELPER');require_once $dbHelper;echo fc_json(hmgcn_review(v2_data_db(),HMGCN_OPERATION)),"\n";}catch(Throwable $e){echo json_encode(['status'=>'failed','operation_id'=>HMGCN_OPERATION,'reason'=>'HMGCN_REMOTE_ERROR','message'=>$e->getMessage(),'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0]),"\n";exit(2);}
          '''
          code="<?php\ndefine('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+cross+'\n'+review+'\n'+wrapper
          p=subprocess.run(['ssh','-T','-i',os.path.join(os.environ['RUNNER_TEMP'],'anytoour_match_key'),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',f"{os.environ['ANYTOOUR_DEPLOY_USER'].strip()}@{os.environ['ANYTOOUR_DEPLOY_HOST'].strip()}",'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0'],input=code,text=True,capture_output=True,timeout=840)
          state=Path(os.environ['STATE'])
          try:r=json.loads(p.stdout)
          except Exception:raise RuntimeError('coordinate_nearest_output_unparseable:'+p.stderr[-400:])
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw)
          if p.returncode!=0 or r.get('status')!='completed' or r.get('operation_id')!=os.environ['OPERATION_ID'] or r.get('database_writes')!=0 or r.get('mapping_writes')!=0 or r.get('supplier_calls')!=0 or r.get('historical_operations_replayed') is not False: raise RuntimeError('coordinate_nearest_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True,'stats':r['stats'],'coverage':r['coverage']};(state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          s=r['stats'];c=r['coverage'];summary=f"MATCH #1971 COORDINATE nearest rescue `{r['operation_id']}` completed read-only / NO-REPLAY. CURRENT examined Andromeda **{s['andromeda_examined']}** (source coords **{s['andromeda_source_coords']}**), ANEX observed/staging **{s['anex_observed_examined']}/{s['anex_staging_examined']}** (unresolved source coords **{s['anex_source_coords']}**). Prepared **{s['prepared']}** = Andromeda **{s['prepared_andromeda']}** + ANEX **{s['prepared_anex']}**, live **{s['prepared_live']}**, star-mismatch annotated **{s['prepared_star_mismatch']}**. Routes exact/translit/two-token/single **{s['route_exact']}/{s['route_translit']}/{s['route_two_token']}/{s['route_single']}**. Near **{s['near']}**; local catalog targets with coordinates **{r['catalog_targets_with_coordinates']}**. Coverage ANEX links {c['anex_links']}, ANEX unique {c['anex_unique_local']}, Andromeda unique {c['andromeda_unique_local']}, triple {c['all_three']}. Supplier calls 0; DB/mapping writes 0."
          (state/'summary.md').write_text(summary+'\n');print(summary)
          PYTHON
      - name: Preserve result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-global-coordinate-nearest-rescue-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-global-coordinate-nearest-rescue-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH result
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', ARTIFACT_ID: '${{ steps.artifact.outputs.artifact-id }}'}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"; gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
