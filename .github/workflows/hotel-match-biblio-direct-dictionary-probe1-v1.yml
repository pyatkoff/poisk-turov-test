name: MATCH Biblio direct hotel-dictionary probe1
'on':
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - .github/workflows/hotel-match-biblio-direct-dictionary-probe1-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-biblio-direct-dictionary-probe1-1971-20260922-v1, cancel-in-progress: false}
env:
  OP: hotel-match-biblio-direct-dictionary-probe1-1971-20260922-v1
  BASE: a79f8eb2bae4793e28906564b4ce2a06af3f473a
  CLAIM: '5772178397'
  CLAIM_SHA256: 797b6c0ba0d49d14cc7b85c73eb598adb8896f374a232cecb43d14de635e30b6
  F4: '102625934280'
  TV: '1293'
  URL: 'https://export.bgoperator.ru/yandex?action=hotelsJson&id=102625934280'
jobs:
  probe:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'ops/match-biblio-direct-dictionary-probe1-1971-20260922-v1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact claim and reserve supplier call
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir -p reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE"..HEAD | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-biblio-direct-dictionary-probe1-v1.yml "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > terminal/claim.json
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          c=json.load(open('terminal/claim.json'))
          assert c['id']==int(os.environ['CLAIM']) and c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert c['issue_url']=='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/2530'
          assert hashlib.sha256(c['body'].encode()).hexdigest()==os.environ['CLAIM_SHA256']
          for s in [os.environ['OP'],os.environ['BASE'],os.environ['F4'],os.environ['URL'],'one unauthenticated HTTPS GET only','DB/mapping writes0']:
              assert s in c['body'],s
          r={'operation':os.environ['OP'],'state':'reserved_before_supplier_http','source_sha':os.environ['HEAD'],'provider':'biblio_direct_dictionary','url':os.environ['URL'],'tv':int(os.environ['TV']),'f4':os.environ['F4'],'max_supplier_http_requests':1,'database_writes':0,'mapping_writes':0,'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'no_replay':True}
          pathlib.Path('reservation/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
          rm terminal/claim.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-biblio-direct-dictionary-probe1-reservation-${{ github.run_id }}', path: reservation/, retention-days: 90, if-no-files-found: error}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(60):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as f:r=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if r and max(r,key=lambda x:x['id'])['status']=='completed':
                  assert max(r,key=lambda x:x['id'])['conclusion']=='success';break
              time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Fail closed on concurrent supplier acquisition
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?status=in_progress&per_page=100'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
          blocked=[]
          for r in runs:
              if str(r['id'])==os.environ['GITHUB_RUN_ID'] or r['name']=='Security guard': continue
              text=(r.get('name','')+' '+r.get('path','')+' '+str(r.get('head_branch') or '')).lower()
              if any(x in text for x in ['andromeda','anex','tourvisor','hotel-match','match-biblio','supplier']): blocked.append((r['id'],r['name'],r.get('head_branch')))
          assert not blocked,blocked
          PY
      - name: Execute exactly one official Biblio dictionary request
        env: {HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077
          cp reservation/reservation.json terminal/reservation.json
          set +e
          curl --proto '=https' --tlsv1.2 --compressed --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 1048576 --header 'Accept: application/json' --header 'User-Agent: AnyTour-MATCH/1.0' --output terminal/body.json --write-out '%{http_code}\n%{content_type}\n%{size_download}\n' "$URL" > terminal/curl-meta.txt 2>terminal/curl-stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > terminal/curl-exit.txt
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('terminal'); rc=int((root/'curl-exit.txt').read_text().strip())
          meta=(root/'curl-meta.txt').read_text().splitlines(); http=int(meta[0] or 0) if meta else 0; ctype=meta[1] if len(meta)>1 else ''; sz=float(meta[2] or 0) if len(meta)>2 else 0
          body=(root/'body.json').read_bytes() if (root/'body.json').exists() else b''
          base={'operation':os.environ['OP'],'source_sha':os.environ['HEAD'],'provider':'biblio_direct_dictionary','url':os.environ['URL'],'tv':int(os.environ['TV']),'f4':os.environ['F4'],'supplier_http_requests':1,'tourvisor_calls':0,'anex_calls':0,'andromeda_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True,'curl_exit':rc,'http_status':http,'content_type':ctype[:160],'response_bytes':len(body),'response_sha256':hashlib.sha256(body).hexdigest() if body else None}
          row=None
          if rc!=0: state='transport_error'
          elif http!=200: state='http_non_200'
          elif len(body)>1048576: state='response_too_large'
          else:
              try: data=json.loads(body)
              except Exception: state='invalid_json'
              else:
                  items=data if isinstance(data,list) else []
                  matches=[x for x in items if isinstance(x,dict) and str(x.get('key',''))==os.environ['F4']]
                  if len(matches)==1:
                      x=matches[0]; row={k:x.get(k) for k in ['key','name','stars','countryKey','cityKey','inPr'] if k in x}; state='exact_dictionary_row'
                  elif len(matches)==0: state='not_found'
                  else: state='ambiguous'
          result=base|{'state':state,'row':row}
          b=(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode(); (root/'result.json').write_bytes(b)
          receipt={'operation':os.environ['OP'],'source_sha':os.environ['HEAD'],'state':'completed_read_only','result_state':state,'result_sha256':hashlib.sha256(b).hexdigest(),'supplier_http_requests':1,'database_writes':0,'mapping_writes':0,'no_replay':True}
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          (root/'summary.json').write_text(json.dumps({'operation':os.environ['OP'],'state':state,'http_status':http,'supplier_http_requests':1,'row':row,'result_sha256':receipt['result_sha256']},ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'state':state,'http_status':http,'row':row},ensure_ascii=False,sort_keys=True))
          PY
          rm -f terminal/body.json terminal/curl-stderr.txt terminal/curl-meta.txt terminal/curl-exit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-biblio-direct-dictionary-probe1-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
