name: SEO2 selected seasonal readiness once
on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-seasonal-selected-readiness-v1.php'
      - 'tests/seo-seasonal-selected-readiness-smoke.php'
      - '.github/workflows/seo2-seasonal-selected-readiness-once.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate selected readiness
        run: |
          set -euo pipefail
          php -l v2/seo-seasonal-selected-readiness-v1.php >/dev/null
          php -l tests/seo-seasonal-selected-readiness-smoke.php >/dev/null
          php tests/seo-seasonal-selected-readiness-smoke.php
