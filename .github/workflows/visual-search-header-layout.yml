name: Visual search header layout

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/header-current-site.css'
      - 'v2/search-header-layout-guard-v1.css'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/visual-search-header-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-header-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build branch bundles
        shell: bash
        run: |
          set -euo pipefail
          php -r '$_GET=["type"=>"css"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/branch-bundle.css"
          php -r '$_GET=["type"=>"js"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/branch-bundle.js"
          test -s "$RUNNER_TEMP/branch-bundle.css"
          test -s "$RUNNER_TEMP/branch-bundle.js"
          grep -Fq 'search-header-layout-guard-v1.css' "$RUNNER_TEMP/branch-bundle.css"
      - name: Verify one-row desktop header and mobile collapse
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
          BRANCH_CSS: ${{ runner.temp }}/branch-bundle.css
          BRANCH_JS: ${{ runner.temp }}/branch-bundle.js
        run: |
          set -euo pipefail
          mkdir -p header-layout-artifacts
          cat > search-header-layout.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const css=fs.readFileSync(process.env.BRANCH_CSS);
          const js=fs.readFileSync(process.env.BRANCH_JS);
          const sizes=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const close=(a,b,t=3)=>Math.abs(a-b)<=t;
          (async()=>{
            const browser=await chromium.launch({headless:true}); let failed=false; const report=[];
            for(const [name,width,height] of sizes){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',async route=>{
                const u=new URL(route.request().url());
                if(u.pathname.endsWith('/bundle-v1.php')){
                  const type=u.searchParams.get('type');
                  if(type==='css')return route.fulfill({status:200,contentType:'text/css; charset=UTF-8',body:css});
                  if(type==='js')return route.fulfill({status:200,contentType:'application/javascript; charset=UTF-8',body:js});
                }
                return route.continue();
              });
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}'});
              const state=await page.evaluate(()=>{
                const r=e=>e?(()=>{const x=e.getBoundingClientRect();return {top:x.top,bottom:x.bottom,left:x.left,right:x.right,width:x.width,height:x.height,display:getComputedStyle(e).display,position:getComputedStyle(e).position}})():null;
                return {header:r(document.querySelector('.at-site-header')),top:r(document.querySelector('.at-site-header__top')),navWrap:r(document.querySelector('.at-site-nav-wrap')),nav:r(document.querySelector('.at-site-nav')),logo:r(document.querySelector('.at-site-logo')),phone:r(document.querySelector('.at-site-phone')),order:r(document.querySelector('.at-site-order')),mobile:r(document.querySelector('.at-mobile-menu-wrap')),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};
              });
              await page.screenshot({path:`header-layout-artifacts/${name}.png`,fullPage:false,animations:'disabled'});
              let bad=!response||response.status()!==200||errors.length||state.overflow||!state.header||!state.logo;
              if(width>=901){
                bad ||= !close(state.header.height,78,2) || !state.navWrap || state.navWrap.display==='none' || !state.nav || state.nav.display==='none' || !close(state.navWrap.top,state.header.top,2) || !close(state.navWrap.bottom,state.header.bottom,2) || state.logo.top<state.header.top-1 || state.logo.bottom>state.header.bottom+1 || !state.order || state.order.top<state.header.top-1 || state.order.bottom>state.header.bottom+1 || (state.mobile&&state.mobile.display!=='none');
              } else {
                bad ||= state.navWrap?.display!=='none' || !state.mobile || state.mobile.display==='none' || state.logo.top<state.header.top-1 || state.logo.bottom>state.header.bottom+1 || state.mobile.left<=state.logo.right || state.mobile.right>state.header.right+1;
              }
              report.push({name,width,http:response?.status()||0,errors,state,bad}); if(bad)failed=true;
              console.log(name,JSON.stringify({bad,state})); await context.close();
            }
            fs.writeFileSync('header-layout-artifacts/report.json',JSON.stringify(report,null,2)); await browser.close(); if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node search-header-layout.cjs
      - name: Upload header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-header-layout-${{ github.event.pull_request.number || github.sha }}
          path: header-layout-artifacts/
          retention-days: 30
