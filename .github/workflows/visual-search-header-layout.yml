name: Visual search header layout

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/design-system-v1.css'
      - 'v2/site-header-v2.css'
      - 'v2/header-current-site.css'
      - 'v2/header-current-site.js'
      - 'v2/search-header-layout-guard-v1.css'
      - 'v2/search-header-shared-shell-v1.css'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/visual-search-header-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-header-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build branch bundles
        shell: bash
        run: |
          set -euo pipefail
          php -r '$_GET=["type"=>"css"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/branch-bundle.css"
          php -r '$_GET=["type"=>"js"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/branch-bundle.js"
          test -s "$RUNNER_TEMP/branch-bundle.css"
          test -s "$RUNNER_TEMP/branch-bundle.js"
          grep -Fq 'search-header-layout-guard-v1.css' "$RUNNER_TEMP/branch-bundle.css"
          grep -Fq -- '--at-header-height:78px' "$RUNNER_TEMP/branch-bundle.css"
          grep -Fq 'normalizeSearchNavigation' "$RUNNER_TEMP/branch-bundle.js"
      - name: Verify one-row desktop header and mobile collapse
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
          BRANCH_CSS: ${{ runner.temp }}/branch-bundle.css
          BRANCH_JS: ${{ runner.temp }}/branch-bundle.js
        run: |
          set -euo pipefail
          mkdir -p header-layout-artifacts
          cat > search-header-layout.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const css=fs.readFileSync(process.env.BRANCH_CSS);
          const js=fs.readFileSync(process.env.BRANCH_JS);
          const sizes=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const expectedOrder=['/poisk-turov/','/country/','/hot/','/rb/','/how-to-buy/','/contacts/'];
          const expectedLabels=['Поиск туров','Страны','Горящие туры','Раннее бронирование','Как купить','Контакты'];
          const close=(a,b,t=3)=>Math.abs(a-b)<=t;
          const center=e=>(e.top+e.bottom)/2;
          const isPainted=s=>s&&s!=='transparent'&&s!=='rgba(0, 0, 0, 0)';
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          (async()=>{
            const browser=await chromium.launch({headless:true}); let failed=false; const report=[];
            for(const [name,width,height] of sizes){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',async route=>{
                const u=new URL(route.request().url());
                if(u.pathname.endsWith('/bundle-v1.php')){
                  const type=u.searchParams.get('type');
                  if(type==='css')return route.fulfill({status:200,contentType:'text/css; charset=UTF-8',body:css});
                  if(type==='js')return route.fulfill({status:200,contentType:'application/javascript; charset=UTF-8',body:js});
                }
                return route.continue();
              });
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(1800);
              await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}'});
              const state=await page.evaluate(()=>{
                const r=e=>e?(()=>{const x=e.getBoundingClientRect();return {top:x.top,bottom:x.bottom,left:x.left,right:x.right,width:x.width,height:x.height,display:getComputedStyle(e).display,position:getComputedStyle(e).position}})():null;
                const painted=e=>e?(()=>{const s=getComputedStyle(e);return {background:s.backgroundColor,color:s.color}})():null;
                const root=getComputedStyle(document.documentElement);
                const navData=selector=>Array.from(document.querySelectorAll(selector)).map(a=>({path:new URL(a.href,location.origin).pathname,label:(a.textContent||'').trim()}));
                const desktopItems=navData('.at-site-nav>ul>li>a');
                const mobileItems=navData('.at-mobile-menu>li>a');
                return {header:r(document.querySelector('.at-site-header')),top:r(document.querySelector('.at-site-header__top')),navWrap:r(document.querySelector('.at-site-nav-wrap')),nav:r(document.querySelector('.at-site-nav')),logo:r(document.querySelector('.at-site-logo')),phone:r(document.querySelector('.at-site-phone')),order:r(document.querySelector('.at-site-order')),mobile:r(document.querySelector('.at-mobile-menu-wrap')),currentDesktop:painted(document.querySelector('.at-site-nav>ul>li>a[href="/poisk-turov/"]')),currentMobile:painted(document.querySelector('.at-mobile-menu a[href="/poisk-turov/"]')),desktopOrder:desktopItems.map(x=>x.path),desktopLabels:desktopItems.map(x=>x.label),mobileOrder:mobileItems.map(x=>x.path),mobileLabels:mobileItems.map(x=>x.label),tokens:{desktop:root.getPropertyValue('--at-header-height').trim(),mobile:root.getPropertyValue('--at-header-mobile-height').trim(),compact:root.getPropertyValue('--at-header-compact-height').trim()},overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};
              });
              await page.screenshot({path:`header-layout-artifacts/${name}.png`,fullPage:false,animations:'disabled'});
              let bad=!response||response.status()!==200||errors.length||state.overflow||!state.header||!state.logo||state.tokens.desktop!=='78px'||state.tokens.mobile!=='68px'||state.tokens.compact!=='64px'||!same(state.desktopOrder,expectedOrder)||!same(state.desktopLabels,expectedLabels)||!same(state.mobileOrder,expectedOrder)||!same(state.mobileLabels,expectedLabels);
              if(width>1024){
                bad ||= !state.currentDesktop || !isPainted(state.currentDesktop.background) || !close(state.header.height,78,2) || !state.navWrap || state.navWrap.display==='none' || !state.nav || state.nav.display==='none' || !close(state.navWrap.top,state.header.top,2) || !close(state.navWrap.bottom,state.header.bottom,2) || state.logo.top<state.header.top-1 || state.logo.bottom>state.header.bottom+1 || !state.order || state.order.top<state.header.top-1 || state.order.bottom>state.header.bottom+1 || !close(center(state.logo),center(state.header),2) || !close(center(state.phone),center(state.header),2) || !close(center(state.order),center(state.header),2) || (state.mobile&&state.mobile.display!=='none');
              } else {
                const expectedHeight=width<=520?64:68;
                bad ||= !state.currentMobile || !isPainted(state.currentMobile.background) || !close(state.header.height,expectedHeight,2) || state.navWrap?.display!=='none' || !state.mobile || state.mobile.display==='none' || !state.phone || state.phone.display==='none' || state.logo.top<state.header.top-1 || state.logo.bottom>state.header.bottom+1 || state.mobile.left<=state.logo.right || state.mobile.right>state.header.right+1 || state.phone.left<=state.logo.right+4 || state.phone.right>=state.mobile.left-4 || !close(center(state.logo),center(state.header),2) || !close(center(state.phone),center(state.header),2) || !close(center(state.mobile),center(state.header),2);
              }
              report.push({name,width,http:response?.status()||0,errors,state,bad}); if(bad)failed=true;
              console.log(name,JSON.stringify({bad,state})); await context.close();
            }
            fs.writeFileSync('header-layout-artifacts/report.json',JSON.stringify(report,null,2)); await browser.close(); if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node search-header-layout.cjs
      - name: Upload header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-header-layout-${{ github.event.pull_request.number || github.sha }}
          path: header-layout-artifacts/
          retention-days: 30
