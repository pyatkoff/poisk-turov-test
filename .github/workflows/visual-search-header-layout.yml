name: Visual search header layout

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.php'
      - 'v2/design-system-v2.css'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/visual-search-header-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-header-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start branch search shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/images
          curl -fsSL --max-time 30 https://anytoour.ru/images/logo.svg -o v2/images/logo.svg
          grep -qi '<svg' v2/images/logo.svg
          php -S 127.0.0.1:8098 -t v2 >"$RUNNER_TEMP/search-header-php.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/search-header-php.pid"
          ready=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8098/index.php -o "$RUNNER_TEMP/search-header.html"; then ready=1; break; fi
            sleep .2
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/search-header-php.log" >&2 || true; exit 12; fi
          grep -Fq 'class="at-global-header"' "$RUNNER_TEMP/search-header.html"
          ! grep -Fq 'class="at-site-header"' "$RUNNER_TEMP/search-header.html"
      - name: Verify canonical header across responsive widths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p header-layout-artifacts
          cat > search-header-layout.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const sizes=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const expectedOrder=['/poisk-turov/','/country/','/hot/','/rb/','/how-to-buy/','/contacts/'];
          const expectedLabels=['Поиск туров','Страны','Горящие туры','Раннее бронирование','Как купить','Контакты'];
          const close=(a,b,t=3)=>Math.abs(a-b)<=t;
          const center=e=>(e.top+e.bottom)/2;
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const px=v=>parseFloat(v)||0;
          (async()=>{
            const browser=await chromium.launch({headless:true}); let failed=false; const report=[];
            for(const [name,width,height] of sizes){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage(); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto('http://127.0.0.1:8098/index.php',{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForSelector('.at-global-header',{timeout:10000});
              await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}'});
              const state=await page.evaluate(()=>{
                const r=e=>e?(()=>{const x=e.getBoundingClientRect();return {top:x.top,bottom:x.bottom,left:x.left,right:x.right,width:x.width,height:x.height,display:getComputedStyle(e).display}})():null;
                const root=getComputedStyle(document.documentElement);
                const navData=selector=>Array.from(document.querySelectorAll(selector)).map(a=>({path:new URL(a.href,location.origin).pathname,label:(a.textContent||'').trim()}));
                const desktopItems=navData('.at-global-header__nav>a');
                const mobileItems=navData('.at-global-header__mobile-panel>a:not(.at-global-header__mobile-phone)');
                return {
                  globalCount:document.querySelectorAll('.at-global-header').length,
                  legacyCount:document.querySelectorAll('.at-site-header').length,
                  header:r(document.querySelector('.at-global-header__inner')),
                  logo:r(document.querySelector('.at-global-header__logo')),
                  phone:r(document.querySelector('.at-global-header__phone')),
                  mobilePhoneCount:document.querySelectorAll('.at-global-header__mobile-panel>a.at-global-header__mobile-phone').length,
                  nav:r(document.querySelector('.at-global-header__nav')),
                  cta:r(document.querySelector('.at-global-header__cta')),
                  mobile:r(document.querySelector('.at-global-header__mobile')),
                  desktopOrder:desktopItems.map(x=>x.path),desktopLabels:desktopItems.map(x=>x.label),
                  mobileOrder:mobileItems.map(x=>x.path),mobileLabels:mobileItems.map(x=>x.label),
                  currentDesktop:document.querySelector('.at-global-header__nav>a[href="/poisk-turov/"]')?.getAttribute('aria-current')||'',
                  currentMobile:document.querySelector('.at-global-header__mobile-panel>a[href="/poisk-turov/"]')?.getAttribute('aria-current')||'',
                  tokens:{desktop:root.getPropertyValue('--at-header-height').trim(),mobile:root.getPropertyValue('--at-header-mobile-height').trim(),compact:root.getPropertyValue('--at-header-compact-height').trim(),pageEdge:root.getPropertyValue('--at-page-edge').trim()},
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2
                };
              });
              await page.screenshot({path:`header-layout-artifacts/${name}.png`,fullPage:false,animations:'disabled'});
              let bad=!response||response.status()!==200||errors.length||state.overflow||state.globalCount!==1||state.legacyCount!==0||!state.header||!state.logo||state.mobilePhoneCount!==1||!same(state.desktopOrder,expectedOrder)||!same(state.desktopLabels,expectedLabels)||!same(state.mobileOrder,expectedOrder)||!same(state.mobileLabels,expectedLabels)||state.currentDesktop!=='page'||state.currentMobile!=='page';
              if(width>1024){
                const expectedHeight=px(state.tokens.desktop);
                bad ||= !expectedHeight||!close(state.header.height,expectedHeight,2)||!state.nav||state.nav.display==='none'||!state.cta||state.cta.display==='none'||(state.mobile&&state.mobile.display!=='none')||!state.phone||state.phone.display==='none'||!close(center(state.logo),center(state.header),3)||!close(center(state.phone),center(state.header),3);
              } else {
                const expectedHeight=px(width<=520?state.tokens.compact:state.tokens.mobile);
                const expectedEdge=px(state.tokens.pageEdge);
                bad ||= !expectedHeight||!close(state.header.height,expectedHeight,2)||state.nav?.display!=='none'||state.cta?.display!=='none'||!state.mobile||state.mobile.display==='none'||state.mobile.left<=state.logo.right||!close(center(state.logo),center(state.header),3)||!close(center(state.mobile),center(state.header),3)||!close(state.logo.left,expectedEdge,1)||!close(width-state.mobile.right,expectedEdge,1);
                if(width<=768){
                  bad ||= !state.phone||state.phone.display!=='none';
                } else {
                  bad ||= !state.phone||state.phone.display==='none'||!close(center(state.phone),center(state.header),3);
                }
              }
              report.push({name,width,http:response?.status()||0,errors,state,bad}); if(bad)failed=true;
              console.log(name,JSON.stringify({bad,state})); await context.close();
            }
            fs.writeFileSync('header-layout-artifacts/report.json',JSON.stringify(report,null,2)); await browser.close(); if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node search-header-layout.cjs
      - name: Stop branch search shell
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/search-header-php.pid" ]; then kill "$(cat "$RUNNER_TEMP/search-header-php.pid")" >/dev/null 2>&1 || true; fi
      - name: Upload header screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-header-layout-${{ github.event.pull_request.number || github.sha }}
          path: header-layout-artifacts/
          retention-days: 30
