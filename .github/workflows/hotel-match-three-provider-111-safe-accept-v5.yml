name: MATCH three-provider 1-1-1 safe accept v5

on:
  push:
    branches: [ops/match-three-provider-111-safe-accept-1971-20260911-v5]

permissions:
  contents: read

concurrency:
  group: anytour-match-three-provider-111-safe-accept-v5
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPERATION_ID: hotel-match-three-provider-111-safe-accept-1971-20260911-v5
      EXPECTED_BASE_SHA: c03641a74c42cd3ce36d42ffa1ecc0c9654bcfa0
      PROGRAM: scripts/diagnostics/hotel_match_three_provider_111_safe_accept_v5.php
      ARTIFACT_DIR: /tmp/match-three-provider-111-safe-accept-v5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false

      - name: Verify scope and reserve immutable operation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/match-three-provider-111-safe-accept-1971-20260911-v5'
          test "$(cat .github/match-three-provider-111-safe-accept-v5.arm)" = "$OPERATION_ID"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort > "$RUNNER_TEMP/paths"
          printf '%s\n' \
            '.github/match-three-provider-111-safe-accept-v5.arm' \
            '.github/workflows/hotel-match-three-provider-111-safe-accept-v5.yml' \
            'scripts/diagnostics/hotel_match_three_provider_111_safe_accept_v5.php' | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/paths"
          php -l "$PROGRAM"
          mkdir -p "$ARTIFACT_DIR"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['PROGRAM']); raw=p.read_bytes()
          forbidden=[b'broninit',b'continue_search',b'send_lead',b'INSERT INTO',b'DELETE FROM']
          for token in forbidden:
              if token.lower() in raw.lower(): raise SystemExit('forbidden token: '+token.decode())
          reservation={
              'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','source_sha':os.environ['GITHUB_SHA'],'base_sha':os.environ['EXPECTED_BASE_SHA'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'program_sha256':hashlib.sha256(raw).hexdigest(),
              'candidate':{'andromeda_external_id':'2000063066','target_local_hotel_id':73475,'anex_hotel_id':29695},
              'source_evidence_run_id':34623973480,'source_evidence_artifact_id':10274360025,'reconcile_run_id':34624801097,
              'max_database_writes':1,'supplier_calls':0,'booking_calls':0,'continue_calls':0,'lead_calls':0,'no_replay':True,
          }
          root=Path(os.environ['ARTIFACT_DIR']);(root/'reservation.json').write_text(json.dumps(reservation,sort_keys=True,indent=2)+'\n')
          PY

      - name: Preserve reservation before DB access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-three-provider-111-safe-accept-v5-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: /tmp/match-three-provider-111-safe-accept-v5/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute one server-current guarded acceptance
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,subprocess,tempfile
          from pathlib import Path
          root=Path(os.environ['ARTIFACT_DIR']); program=Path(os.environ['PROGRAM']).read_text(); raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
          with tempfile.TemporaryDirectory() as td:
              key=Path(td)/'key'; key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw)); key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'known_hosts'),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              x=subprocess.run(cmd,input=program,text=True,capture_output=True,timeout=240)
          marker='MATCH111A_JSON:'; line=next((z[len(marker):] for z in reversed(x.stdout.splitlines()) if z.startswith(marker)),None)
          if line is None: d={'status':'unknown_no_replay','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','remote_exit':x.returncode,'no_replay':True}
          else: d=json.loads(line); d.update(source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),remote_exit=x.returncode,no_replay=True)
          (root/'result.json').write_text(json.dumps(d,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'status':d.get('status'),'row':d.get('row'),'before':d.get('before'),'after':d.get('after'),'remote_exit':x.returncode},ensure_ascii=False,sort_keys=True))
          if x.returncode or d.get('status')!='committed_readback_verified' or int(d.get('database_writes') or 0)!=1 or int(d.get('supplier_calls') or 0)!=0: raise SystemExit('guarded write not verified; inspect immutable receipt and do not replay')
          PY

      - name: Preserve final receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-three-provider-111-safe-accept-v5-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            /tmp/match-three-provider-111-safe-accept-v5/reservation.json
            /tmp/match-three-provider-111-safe-accept-v5/result.json
          if-no-files-found: warn
          retention-days: 90
