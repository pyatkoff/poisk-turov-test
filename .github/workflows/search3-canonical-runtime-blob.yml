name: Retain verified PR2660 frontend blob
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/search3-canonical-runtime-blob.yml'
permissions:
  contents: read
jobs:
  retain-verified-source-object:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.number == 2660 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/search3-current-owner-pass-20260916' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download exact already-verified generated frontend artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10464450833'
          run-id: '35137130327'
          github-token: ${{ github.token }}
          repository: pyatkoff/poisk-turov-test
          path: verified-artifact
          merge-multiple: true
      - name: Store only the pinned inert source object, never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('verified-artifact')
          files = list(root.rglob('*'))
          assert len(files) == 1 and files[0].name == 'search3-shared-runtime.json'
          assert files[0].is_file() and not files[0].is_symlink()
          raw = files[0].read_bytes()
          expected = '3f7549e84cfa68a4f1217ed0a39c12d681b328dd'
          assert len(raw) == 148416
          assert hashlib.sha256(raw).hexdigest() == 'e2c779d127b35d5e6d11cba289aeefac47acedeedb839bc4742739d9357e526d'
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == expected
          data = json.loads(raw)
          assert data['schema_version'] == 1 and data['method'] == 'local-bindings-only'
          assert len(data['entries']) == 17
          assert data['entries']['results-renderer-v5.js']['sourceSha256'] == 'a9d5a734750c62af5ff9ff06fa472ee9f43f3d93e9b46fd1b9f6af6b8066ca06'
          for item in data['entries'].values():
              assert hashlib.sha256(item['code'].encode()).hexdigest() == item['codeSha256']
          # Fixed repository and git/blobs endpoint only. No ref/contents/merge API.
          endpoint = 'https://api.github.com/repos/pyatkoff/poisk-turov-test/git/blobs'
          body = json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
          request = urllib.request.Request(endpoint, data=body, method='POST', headers={
              'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json', 'Content-Type':'application/json',
              'X-GitHub-Api-Version':'2022-11-28', 'User-Agent':'AnyTour-PR2660-generated-source'
          })
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Redirect not allowed for authenticated source-object write')
          with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
              assert response.status == 201
              result = json.load(response)
          assert result['sha'] == expected
          print(json.dumps({'status':'verified_inert_blob_stored','sha':expected,'bytes':len(raw),
              'branch_updates':0,'source_executed':False,'server_access':False,'deployments':0}))
