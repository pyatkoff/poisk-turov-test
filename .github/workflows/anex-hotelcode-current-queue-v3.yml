name: MATCH ANEX current hotelCode queue v3
run-name: MATCH ANEX current hotelCode queue #1971 v3
on:
  push:
    branches: ['ops/match-anex-hotelcode-current-1971-v3']
    paths: ['.github/match-anex-hotelcode-current-queue-v3.arm']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-anex-hotelcode-current-queue-1971-v3
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-hotelcode-current-queue-1971-20260912-v3
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate unchanged CURRENT M3 queue source
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/anex_hotelcode_current_queue.php
          php -l scripts/diagnostics/anex_hotelcode_evidence.php
          php -l tests/anex-hotelcode-current-queue-test.php
          php tests/anex-hotelcode-current-queue-test.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/anex_hotelcode_current_queue.php').read_text(encoding='utf-8')
          assert "const AHQ_OPERATION = 'hotel-match-anex-hotelcode-current-queue-1971-20260911-v1';" in s
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert 'anytour_anex_hotelcode_evidence' in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl_init','https://','http://'):
              assert bad.lower() not in s.lower(), bad
          e=Path('scripts/diagnostics/anex_hotelcode_evidence.php').read_text(encoding='utf-8')
          assert 'files.anextour.ru' in e and 'hotelCode' in e
          print('MATCH_M3_CURRENT_V3_SCOPE_OK')
          PY
  current-queue:
    needs: validate
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify immutable arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-hotelcode-current-queue-v3.arm)" = "$OPERATION_ID"
      - name: Prepare SSH key and bounded zero-DB preflight
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE" && test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          key="$RUNNER_TEMP/anytoour_match_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ok=0
          for attempt in 1 2 3; do
            set +e
            out="$(ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru"; { test -f data/db-v1.php || test -f v2/data/db-v1.php; }; printf MATCH_M3_PREFLIGHT_OK' 2>"$RUNNER_TEMP/m3-preflight.err")"
            rc=$?
            set -e
            if [[ $rc -eq 0 && "$out" == MATCH_M3_PREFLIGHT_OK ]]; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" = 1
      - name: Reserve before CURRENT DB access
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=['scripts/diagnostics/hotel_full_catalog_reconcile.php','scripts/diagnostics/hotel_match_current_bulk_review.php','scripts/diagnostics/anex_hotelcode_evidence.php','scripts/diagnostics/anex_hotelcode_current_queue.php']
          x={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'source_sha':os.environ['GITHUB_SHA'],'runtime_sources_sha256':hashlib.sha256(b''.join(Path(p).read_bytes() for p in paths)).hexdigest(),'mode':'current_db_anex_hotelcode_queue_read_only','database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (Path(os.environ['STATE'])/'reservation.json').write_text(json.dumps(x,sort_keys=True)+'\n')
          PY
      - name: Preserve durable reservation
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-hotelcode-current-queue-1971-20260912-v3-reservation
          path: ${{ runner.temp }}/hotel-match-anex-hotelcode-current-queue-1971-20260912-v3/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Read CURRENT DB and build fresh ANEX M3 queue
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[5:]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          planner=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          parser=body('scripts/diagnostics/anex_hotelcode_evidence.php')
          queue=body('scripts/diagnostics/anex_hotelcode_current_queue.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\nrequire_once __DIR__ . '/anex_hotelcode_evidence.php';\n",'',1)
          old="const AHQ_OPERATION = 'hotel-match-anex-hotelcode-current-queue-1971-20260911-v1';"
          new="const AHQ_OPERATION = 'hotel-match-anex-hotelcode-current-queue-1971-20260912-v3';"
          if queue.count(old)!=1: raise RuntimeError('operation_constant_not_unique')
          queue=queue.replace(old,new,1)
          wrapper=r'''
          try{$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('AHQV3_ROOT');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('AHQV3_DB_HELPER');require_once $dbHelper;echo fc_json(ahq_review(v2_data_db(),AHQ_OPERATION)),"\n";}catch(Throwable $e){echo json_encode(['status'=>'failed','operation_id'=>AHQ_OPERATION,'reason'=>'AHQV3_REMOTE_ERROR','database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_http_calls'=>0]),"\n";exit(2);}
          '''
          code="<?php\ndefine('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+planner+'\n'+parser+'\n'+queue+'\n'+wrapper
          key=os.path.join(os.environ['RUNNER_TEMP'],'anytoour_match_key')
          p=subprocess.run(['ssh','-T','-i',key,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',f"{os.environ['USER_VALUE'].strip()}@{os.environ['HOST_VALUE'].strip()}",'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=2048M'],input=code,text=True,capture_output=True,timeout=600)
          state=Path(os.environ['STATE'])
          try:r=json.loads(p.stdout)
          except Exception:r={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'remote_output_unparseable','remote_exit':p.returncode,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'no_replay':True}
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'queue.json').write_bytes(raw)
          completed=(p.returncode==0 and r.get('status')=='completed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('database_writes')==0 and r.get('supplier_calls')==0)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if completed else 'unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'queue_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'historical_operations_replayed':False,'no_replay':True}
          if completed: receipt.update({'counts':r['counts'],'coverage':r['coverage'],'examined':r['examined']})
          (state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          if completed:
              c=r['counts'];x=r['coverage'];e=r['examined']
              summary=f"MATCH #1971 CURRENT M3 queue `{r['operation_id']}` completed read-only / NO-REPLAY. Seeds **{c['tourvisor_anex_seeds']}** = observed **{c['observed_seeds']}** + staging-only **{c['staging_only_seeds']}**. Saved strict media hotelCode **{c['saved_hotelcode_evidence']}**, conflicts **{c['saved_hotelcode_conflict']}**, invalid **{c['saved_hotelcode_invalid']}**, operator/page evidence still needed **{c['operator_link_required']}**. Examined observed/staging **{e['observed']}/{e['staging_only']}**, protected **{e['protected']}**, current-local-auto skipped **{e['auto_accept_current_rule']}**. Coverage ANEX links **{x['anex_links']}**, ANEX unique **{x['anex_unique_local']}**, Andromeda unique **{x['andromeda_unique_local']}**, triple **{x['all_three']}**. Supplier/Tourvisor HTTP/DB/mapping writes/calls 0."
          else:
              summary=f"MATCH #1971 CURRENT M3 queue `{os.environ['OPERATION_ID']}` is UNKNOWN / NO-REPLAY after durable reservation. Read receipt before any successor; no DB/mapping/supplier/Tourvisor writes/calls were executed by this code path."
          (state/'summary.md').write_text(summary+'\n');print(summary)
          if not completed: raise SystemExit(2)
          PY
      - name: Preserve immutable current queue result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-hotelcode-current-queue-1971-20260912-v3-result
          path: ${{ runner.temp }}/hotel-match-anex-hotelcode-current-queue-1971-20260912-v3/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH queue result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
