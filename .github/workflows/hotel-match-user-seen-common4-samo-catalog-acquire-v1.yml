name: MATCH common4 SAMO catalog acquire v1

on:
  push:
    branches:
      - ops/match-user-seen-common4-samo-catalog-acquire-1971-20260918-v1
    paths:
      - .github/workflows/hotel-match-user-seen-common4-samo-catalog-acquire-v1.yml

permissions:
  contents: read
  issues: read
  actions: read

concurrency:
  group: match-user-seen-common4-samo-catalog-acquire-1971-20260918-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-user-seen-common4-samo-catalog-acquire-1971-20260918-v1
  EXPECTED_BASE: 6fbb0c527c6c997e59412e99140c22529bd09beb
  CLAIM_COMMENT_ID: '5728147752'

jobs:
  live:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/ops/match-user-seen-common4-samo-catalog-acquire-1971-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact MATCH delta and claim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_acquire_v1.php'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/hotel-match-user-seen-common4-samo-catalog-acquire-v1.yml'
          php -l scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_acquire_v1.php
          mkdir -p "$RUNNER_TEMP/hmca"
          cp app/integrations/andromeda-client.php "$RUNNER_TEMP/hmca/andromeda-client.php"
          cp app/integrations/andromeda-transport.php "$RUNNER_TEMP/hmca/andromeda-transport.php"
          cp app/integrations/andromeda-network-transport-failure.php "$RUNNER_TEMP/hmca/andromeda-network-transport-failure.php"
          cp scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_acquire_v1.php "$RUNNER_TEMP/hmca/scan.php"
          php "$RUNNER_TEMP/hmca/scan.php" --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('claim.json'))
          assert c.get('user',{}).get('id')==226193297
          assert c.get('author_association')=='OWNER'
          assert c.get('issue_url','').endswith('/issues/2530')
          b=c.get('body','')
          assert os.environ['OPERATION_ID'] in b
          assert 'no PRICE calls and no Tourvisor calls' in b
          assert 'no DB/mapping write' in b
          PY

      - name: Create durable reservation before provider access
        env:
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reservation
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          deps=[
            'scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_acquire_v1.php',
            'app/integrations/andromeda-client.php',
            'app/integrations/andromeda-transport.php',
            'app/integrations/andromeda-network-transport-failure.php',
            'app/integrations/anex-search-mapping-registry.php',
          ]
          r={
            'operation':os.environ['OPERATION_ID'],'state':'reserved_before_provider_access','source_sha':os.environ['HEAD_SHA'],
            'purpose':'CURRENT common4 real-hotel Andromeda catalog native identity acquisition',
            'provider':'andromeda','max_login_calls':1,'max_catalog_calls':120,'price_calls':0,'tourvisor_calls':0,
            'database_writes':0,'mapping_writes':0,'no_replay_after_provider_access':True,
            'dependencies':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in deps},
          }
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n').encode()
          pathlib.Path('reservation/reservation.json').write_bytes(raw)
          pathlib.Path('reservation/reservation.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  reservation.json\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-common4-samo-catalog-reservation-${{ github.run_id }}
          path: reservation/
          if-no-files-found: error
          retention-days: 90

      - name: Require credentials
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANDROMEDA_USERNAME_VALUE: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD_VALUE: ${{ secrets.ANDROMEDA_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"; test -n "$HOST_VALUE"; test -n "$USER_VALUE"
          test -n "$ANDROMEDA_USERNAME_VALUE"; test -n "$ANDROMEDA_PASSWORD_VALUE"

      - name: Stage exact MATCH payload
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null; test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE"; op=".anytour-match/operations/$OPERATION_ID"; stage="$op/payload"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "umask 077; mkdir -p \"\$HOME/.anytour-match/operations\"; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/$stage\""
          scp "${opts[@]}" reservation/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_acquire_v1.php "$remote:$stage/scan.php"
          scp "${opts[@]}" app/integrations/andromeda-client.php app/integrations/andromeda-transport.php app/integrations/andromeda-network-transport-failure.php app/integrations/anex-search-mapping-registry.php "$remote:$stage/"
          ssh "${opts[@]}" "$remote" "chmod 600 \"\$HOME/$op/reservation.json\" \"\$HOME/$stage/\"*"

      - name: Acquire CURRENT provider-native catalog evidence
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANDROMEDA_USERNAME_VALUE: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD_VALUE: ${{ secrets.ANDROMEDA_PASSWORD }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p terminal
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"; remote="$USER_VALUE@$HOST_VALUE"; op=".anytour-match/operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          set +e
          printf '%s\n%s\n' "$ANDROMEDA_USERNAME_VALUE" "$ANDROMEDA_PASSWORD_VALUE" | ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA=\"$HEAD_SHA\" MATCH_MAPPING_REGISTRY_PATH=\"\$HOME/$op/payload/anex-search-mapping-registry.php\" php -d display_errors=0 -d log_errors=0 \"\$HOME/$op/payload/scan.php\"" > terminal/remote-stdout.txt 2> terminal/remote-stderr.txt
          rc=$?
          ssh "${opts[@]}" "$remote" "p=\"\$HOME/$op\"; test -f \"\$p/reservation.json\"; test -f \"\$p/result.json\"; test -f \"\$p/receipt.json\"; tar -C \"\$p\" -czf - reservation.json result.json receipt.json" > terminal/server-operation.tgz 2>>terminal/remote-stderr.txt
          trc=$?
          set -e
          printf '%s\n' "$rc" > terminal/remote-exit.txt; printf '%s\n' "$trc" > terminal/tar-exit.txt

      - name: Verify terminal receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          p=pathlib.Path('terminal'); server=p/'server'; server.mkdir(exist_ok=True); a=p/'server-operation.tgz'
          if not a.exists() or a.stat().st_size==0: raise SystemExit('missing terminal server operation archive')
          with tarfile.open(a,'r:gz') as t:
            names=sorted(t.getnames()); assert names==['receipt.json','reservation.json','result.json'],names
            for m in t.getmembers():
              assert m.isfile() and m.size<40_000_000
              (server/m.name).write_bytes(t.extractfile(m).read())
          assert pathlib.Path('reservation/reservation.json').read_bytes()==(server/'reservation.json').read_bytes()
          result=json.loads((server/'result.json').read_text()); receipt=json.loads((server/'receipt.json').read_text()); digest=hashlib.sha256((server/'result.json').read_bytes()).hexdigest()
          assert receipt['result_sha256']==digest
          assert receipt['database_writes']==0 and receipt['mapping_writes']==0
          assert receipt['price_calls']==0 and receipt['tourvisor_calls']==0
          assert result['database_writes']==0 and result['mapping_writes']==0 and result['price_calls']==0 and result['tourvisor_calls']==0
          if result['provider_access']:
            assert receipt['no_replay'] is True and result['no_replay'] is True
          if result['state']!='completed_read_only':
            print(json.dumps({'state':result['state'],'reason':result.get('reason'),'provider_calls':result.get('provider_calls'),'result_sha256':digest},sort_keys=True)); raise SystemExit(2)
          assert result['login_calls']<=1 and result['catalog_calls']<=120
          summary={
            'state':result['state'],'frontier_count':result['frontier_count'],'future_real_common4_locals':result['future_real_common4_locals'],
            'context_pair_count':result['context_pair_count'],'bound_departure_count':result['bound_departure_count'],'unbound_departures':result['unbound_departures'],
            'bound_pair_count':result['bound_pair_count'],'unbound_states':result['unbound_states'],'provider_calls':result['provider_calls'],'catalog_calls':result['catalog_calls'],
            'family_potential_unique_hotels':result['family_potential_unique_hotels'],'strict_catalog_candidate_count':result['strict_catalog_candidate_count'],
            'ambiguous_candidate_count':result['ambiguous_candidate_count'],'hold_reason_counts':result['hold_reason_counts'],
            'top_candidates':result['strict_catalog_candidates'][:60],'pair_meta':result['pair_meta'],'result_sha256':digest,'no_replay':True,
          }
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-common4-samo-catalog-result-${{ github.run_id }}
          path: terminal/
          if-no-files-found: error
          retention-days: 90
