name: Three-provider offer contract
on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-offer-contract.php'
      - 'app/integrations/three-provider-anex-offer.php'
      - 'app/integrations/anex-normalizer.php'
      - 'app/integrations/anex-preview-gateway.php'
      - 'app/integrations/anex-search.php'
      - 'app/integrations/anex-client.php'
      - 'v2/api-anex-search3-preview.php'
      - 'tests/anex-search3-preview-smoke.php'
      - 'app/integrations/three-provider-offer-context.php'
      - 'app/integrations/three-provider-room-placement.php'
      - 'app/integrations/three-provider-meal-family.php'
      - 'app/integrations/three-provider-money-facts.php'
      - 'app/integrations/three-provider-availability.php'
      - 'app/integrations/three-provider-flight-details.php'
      - 'app/integrations/three-provider-operator.php'
      - 'app/integrations/andromeda-selected-tour-readiness.php'
      - 'tests/three-provider-offer-contract-test.php'
      - 'tests/three-provider-anex-offer-test.php'
      - 'tests/anex-normalizer-smoke.php'
      - 'tests/anex-search-smoke.php'
      - 'tests/three-provider-offer-context-test.php'
      - 'tests/three-provider-room-placement-test.php'
      - 'tests/three-provider-meal-family-test.php'
      - 'tests/three-provider-availability-test.php'
      - 'tests/three-provider-flight-details-test.php'
      - 'tests/three-provider-operator-test.php'
      - 'tests/andromeda-selected-tour-readiness-test.php'
      - '.github/workflows/three-provider-offer-contract-check.yml'
      - '.github/workflows/three-provider-offer-context-check.yml'
permissions:
  contents: read
# Only offline checks: a newer head supersedes this PR's earlier check run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate offers and retained context without network
        run: |
          php -l app/integrations/anex-preview-gateway.php
          php -l v2/api-anex-search3-preview.php
          php -l app/integrations/three-provider-offer-contract.php
          php -l app/integrations/three-provider-anex-offer.php
          php -l app/integrations/three-provider-offer-context.php
          php -l app/integrations/three-provider-room-placement.php
          php -l app/integrations/three-provider-meal-family.php
          php -l app/integrations/three-provider-availability.php
          php -l app/integrations/three-provider-flight-details.php
          php -l app/integrations/three-provider-operator.php
          php -l app/integrations/andromeda-selected-tour-readiness.php
          # Explicit offline suites; execution also checks each test file's syntax.
          php -d allow_url_fopen=0 tests/anex-search3-preview-smoke.php
          php -d allow_url_fopen=0 tests/anex-search-smoke.php
          php -d allow_url_fopen=0 tests/three-provider-anex-offer-test.php
          php -d allow_url_fopen=0 tests/anex-normalizer-smoke.php
          php -d allow_url_fopen=0 tests/three-provider-offer-contract-test.php
          php -d allow_url_fopen=0 tests/three-provider-offer-context-test.php
          php -d allow_url_fopen=0 tests/three-provider-room-placement-test.php
          php -d allow_url_fopen=0 tests/three-provider-meal-family-test.php
          php -d allow_url_fopen=0 tests/three-provider-availability-test.php
          php -d allow_url_fopen=0 tests/three-provider-flight-details-test.php
          php -d allow_url_fopen=0 tests/three-provider-operator-test.php
          php -d allow_url_fopen=0 tests/andromeda-selected-tour-readiness-test.php
          python3 - <<'PY'
          from pathlib import Path
          # Preserve source-isolation guards; behavior belongs to the PHP suites,
          # not assertions about class member names or exact return statements.
          strict = ('curl_', 'PDO', 'bron', 'booking', 'supplier_offer_id', 'provider_hotel_id')
          evidence = ('curl_', 'PDO', 'bron', 'booking', 'supplier_offer_id', 'provider_hotel_id')
          evidence = ('curl_', 'PDO', '->bron(', 'supplier_offer_id', 'provider_hotel_id')
          boundaries = {
              'three-provider-offer-contract.php': strict,
              'three-provider-offer-context.php': strict,
              'three-provider-room-placement.php': strict,
              'three-provider-availability.php': evidence,
              'three-provider-flight-details.php': evidence,
              'andromeda-selected-tour-readiness.php': (
                  'curl_', 'PDO', 'AnyTourAndromedaClient', '->package(', '->bron(',
              ),
              'three-provider-anex-offer.php': (
                  'curl_', 'PDO', 'supplier_offer_id', '->request(', '->bron(',
                  'file_get_contents', 'file_put_contents', '$_GET', '$_POST',
              ),
          }
          for filename, forbidden in boundaries.items():
              source = (Path('app/integrations') / filename).read_text()
              for token in forbidden:
                  assert token not in source, f'{filename}: forbidden boundary token {token}'
          print('Three-provider offer/context source isolation: PASS')
          PY
