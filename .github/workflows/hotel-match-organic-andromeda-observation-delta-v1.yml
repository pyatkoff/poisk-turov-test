name: MATCH organic Andromeda observation delta v1
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths:
      - scripts/diagnostics/hotel_match_organic_andromeda_observation_delta_v1.php
      - .github/workflows/hotel-match-organic-andromeda-observation-delta-v1.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: match-organic-andromeda-observation-delta-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-organic-andromeda-observation-delta-1971-20260917-v1
jobs:
  current-readonly:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and reserve before DB access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_organic_andromeda_observation_delta_v1.php)" = 85be6571ff51329a2800ad0ce666c4d47bfe7ec7
          php -l scripts/diagnostics/hotel_match_organic_andromeda_observation_delta_v1.php
          php scripts/diagnostics/hotel_match_organic_andromeda_observation_delta_v1.php --self-test
          python3 - <<'PY'
          import json,os,pathlib,re
          src=pathlib.Path('scripts/diagnostics/hotel_match_organic_andromeda_observation_delta_v1.php').read_text()
          assert 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in src
          assert not re.search(r'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',src,re.I)
          assert 'curl_exec' not in src and 'file_get_contents(\'http' not in src
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];p.mkdir(mode=0o700)
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','run_id':os.environ['GITHUB_RUN_ID'],'claim_comment_id':5710890490,'coordination_issue':2530,'queue_issue':1971,'source_blob':'85be6571ff51329a2800ad0ce666c4d47bfe7ec7','cutoff_utc':'2026-09-17T00:00:00Z','no_replay':True,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0}
          (p/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-organic-andromeda-delta-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-organic-andromeda-observation-delta-1971-20260917-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute one CURRENT read-only delta
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/match-organic-andromeda-key"; known="$RUNNER_TEMP/match-organic-andromeda-known"; sock="$RUNNER_TEMP/match-organic-andromeda.sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_organic_andromeda_observation_delta_v1.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"
          trc=$?
          set -e
          export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'; s.mkdir()
          assert int(os.environ['TAR_RC'])==0 and (p/'server-operation.tgz').stat().st_size>0
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size<=16000000
                  (s/m.name).write_bytes(t.extractfile(m).read())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          r=json.loads((s/'result.json').read_bytes()); receipt=json.loads((s/'receipt.json').read_bytes())
          rh=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert int(os.environ['REMOTE_RC'])==0
          assert r['operation_id']==receipt['operation_id']==os.environ['OPERATION_ID']
          assert r['source_sha']==receipt['source_sha']==os.environ['GITHUB_SHA']
          assert r['state']=='completed_read_only' and receipt['readback_verified'] is True and receipt['result_sha256']==rh
          assert r['no_replay'] is True and r['safe_to_write_now'] is False
          assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==0
          summary={k:r.get(k) for k in ('operation_id','source_sha','state','cutoff_utc','pending_total','same_day_observation_rows','same_day_observed_pending','unique_exact_hits_before_guards','strict_clean_candidates','hold_counts','newest_observed_at_utc','read_at_utc')}
          summary.update({'result_sha256':rh,'readback_verified':True,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True})
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-organic-andromeda-delta-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-organic-andromeda-observation-delta-1971-20260917-v1/
          if-no-files-found: warn
          retention-days: 90
