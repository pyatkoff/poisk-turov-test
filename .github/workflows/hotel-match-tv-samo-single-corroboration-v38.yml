name: MATCH TV-SAMO single corroboration v38

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php
      - tests/hotel_match_tv_samo_single_fingerprint_corroboration_v38_test.php
      - .github/workflows/hotel-match-tv-samo-single-corroboration-v38.yml

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: hotel-match-tv-samo-single-corroboration-1971-20260925-v38
  cancel-in-progress: false

env:
  OP: hotel-match-tv-samo-single-fingerprint-corroboration-1971-20260925-v38
  BASE: 786514ccbb4047868a89f00bb2d06dfe5157ffb8
  CLAIM: '5837951768'
  V37_OP: hotel-match-tv-samo-common4-fingerprint-join-1971-20260925-v37
  V37_RESULT_SHA: b7ef6082b8d27ad822ddaf69dd86e9249523f859cd61ee1b547c106118ffc55a

jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/tv-samo-single-corroboration-v38-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: php -l scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php
      - run: php scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php --self-test
      - run: php tests/hotel_match_tv_samo_single_fingerprint_corroboration_v38_test.php
      - run: |
          ! grep -E 'curl_|file_get_contents\(.*https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php

  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/tv-samo-single-corroboration-v38-20260925' && github.event.pull_request.head.sha == '2fadc708425d9d37d0c2067c387fd6697fba7b38'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authority and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-tv-samo-single-corroboration-v38.yml scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php tests/hotel_match_tv_samo_single_fingerprint_corroboration_v38_test.php "
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'9 v37 single_direct','1 support_only','normalized TV/local names + aliases','coordinates <=5km','REPEATABLE READ / READ ONLY','HTTP0','safe_to_write_now=false']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda z:z['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('reservation.json').write_text(json.dumps({
            'operation':os.environ['OP'],'state':'reserved_before_db_read',
            'source_operation':os.environ['V37_OP'],'source_result_sha256':os.environ['V37_RESULT_SHA'],
            'provider_http_calls':0,'database_writes':0,'mapping_writes':0
          },sort_keys=True)+'\n')
          PY

      - name: Execute supplier-free candidate corroboration
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          source=".anytoour-match/operations/$V37_OP/result.json"

          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test -f \"\$HOME/$source\";test \"\$(sha256sum \"\$HOME/$source\"|awk '{print \$1}')\" = '$V37_RESULT_SHA';test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php "$remote:$op/payload/scripts/diagnostics/"

          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_V37_RESULT=\"\$HOME/$source\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_tv_samo_single_fingerprint_corroboration_v38.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e

          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert q['readback_verified'] is True
          assert r['operation']=='hotel-match-tv-samo-single-fingerprint-corroboration-1971-20260925-v38'
          assert r['state']=='completed_read_only_single_fingerprint_corroboration'
          assert r['candidate_count']==10
          for k in ['provider_http_calls','tourvisor_calls','samo_calls','anex_calls','andromeda_calls','database_writes','mapping_writes']:
              assert r[k]==0,(k,r[k])
          assert r['safe_to_write_now'] is False
          print(json.dumps({k:r[k] for k in ['candidate_count','saved_catalog_file_count','saved_candidate_catalog_count','corroborated_count','status_counts','bucket_status_counts']},ensure_ascii=False,sort_keys=True))
          PY
          test "$status" -eq 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-samo-single-corroboration-v38-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: error
