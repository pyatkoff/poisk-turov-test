              target=out/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              manifest['files'].append({'path':name,'git_sha':actual,'sha256':hashlib.sha256(data).hexdigest()})
          (out/'blobs.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('SOURCE_GENERATION_BLOBS_OK files='+str(len(files)))
          PY
      - name: Retain exact generated source and hashes
        uses: actions/upload-artifact@v4
        with:
          name: search3-resume-generated-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/resume-generated/
          if-no-files-found: error
          retention-days: 7
