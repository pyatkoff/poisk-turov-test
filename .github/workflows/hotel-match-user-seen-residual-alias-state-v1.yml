name: MATCH user-seen residual alias-state v1

on:
  push:
    branches:
      - match/user-seen-residual-alias-state-1971-20260918-v1
    paths:
      - .github/workflows/hotel-match-user-seen-residual-alias-state-v1.yml
      - scripts/diagnostics/hotel_match_user_seen_residual_alias_state_v1.php

permissions:
  contents: read
  actions: read
  issues: read

env:
  OPERATION_ID: hotel-match-user-seen-residual-alias-state-country-1971-20260918-v1
  EXPECTED_BASE: ab62528be1c4ccc26057b687a80dba60b166c260
  CLAIM_COMMENT_ID: '5723371488'

jobs:
  scan:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.ref == 'refs/heads/match/user-seen-residual-alias-state-1971-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact read-only residual delta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/diagnostics/hotel_match_user_seen_residual_alias_state_v1.php'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/hotel-match-user-seen-residual-alias-state-v1.yml'

          php -l scripts/diagnostics/hotel_match_user_seen_residual_alias_state_v1.php
          php scripts/diagnostics/hotel_match_user_seen_residual_alias_state_v1.php --self-test
          php -l app/integrations/anex-search-mapping-registry.php

          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json, os
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297
          assert c['author_association']=='OWNER'
          body=c['body']
          assert os.environ['OPERATION_ID'] in body
          assert 'bounded aliases' in body
          assert 'accepted stateKey country consensus' in body
          assert 'DB writes0 / supplier0 / Tourvisor0' in body
          PY

      - name: Require SSH credentials
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          test -n "$HOST_VALUE"
          test -n "$USER_VALUE"

      - name: Run current DB residual scan
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p result
          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null
          test -s "$known"

          remote="$USER_VALUE@$HOST_VALUE"
          op=".anytour-operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)

          ssh "${opts[@]}" "$remote" "umask 077; rm -rf \"\$HOME/$op\"; mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}"             scripts/diagnostics/hotel_match_user_seen_residual_alias_state_v1.php             app/integrations/anex-search-mapping-registry.php             "$remote:$op/payload/"

          ssh "${opts[@]}" "$remote"             "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" php \"\$HOME/$op/payload/hotel_match_user_seen_residual_alias_state_v1.php\""             > result/result.json

          python3 - <<'PY'
          import json, pathlib
          data=json.load(open('result/result.json'))
          assert data['status']=='read_only_complete'
          assert data['database_writes']==0 and data['mapping_writes']==0
          assert data['supplier_calls']==0 and data['tourvisor_calls']==0
          assert data['frontier_count']>0
          assert data['candidate_identity_count']==data['anex_candidate_identities']+data['andromeda_candidate_identities']
          assert data['candidate_unique_local_hotels']==len(data['candidate_targets'])
          assert data['canonical_candidate_identities']+data['alias_candidate_identities']==data['candidate_identity_count']
          summary={
            'frontier':data['frontier_count'],
            'frontier_country_ids':data['frontier_country_ids'],
            'canonical_candidate_identities':data['canonical_candidate_identities'],
            'alias_candidate_identities':data['alias_candidate_identities'],
            'anex_candidate_identities':data['anex_candidate_identities'],
            'andromeda_candidate_identities':data['andromeda_candidate_identities'],
            'candidate_identities':data['candidate_identity_count'],
            'candidate_unique_local_hotels':data['candidate_unique_local_hotels'],
            'candidate_both_provider_local_hotels':data['candidate_both_provider_local_hotels'],
            'accepted_state_keys_unique':data['accepted_state_keys_unique'],
            'accepted_state_keys_conflicted':data['accepted_state_keys_conflicted'],
            'pending_rows_country_derived_from_stateKey':data['pending_rows_country_derived_from_stateKey'],
            'top_targets':data['candidate_targets'][:30],
            'anex_blocked_counts':data['anex_blocked_counts'],
            'andromeda_blocked_counts':data['andromeda_blocked_counts'],
          }
          pathlib.Path('result/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-user-seen-residual-alias-state-${{ github.run_id }}
          path: result/
          if-no-files-found: error
          retention-days: 90
