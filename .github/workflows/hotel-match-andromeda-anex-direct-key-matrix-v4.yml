name: MATCH Andromeda ANEX direct-key matrix v4
on:
  push:
    branches: [ops/match-andromeda-anex-direct-key-matrix-1971-20260912-v1]
    paths: [.github/workflows/hotel-match-andromeda-anex-direct-key-matrix-v4.yml]
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: anytour-match-anexkey-matrix-v4, cancel-in-progress: false}
jobs:
  slice:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {sid: s02, date: '2026-12-25', v10_artifact: '10275587264'}
          - {sid: s04, date: '2027-01-22', v10_artifact: '10275707170'}
    env:
      FAMILY_ID: hotel-match-andromeda-anex-direct-key-matrix-1971-20260912-v4
      OPERATION_ID: hotel-match-andromeda-anex-direct-key-matrix-1971-20260912-v4-${{ matrix.sid }}
      SLICE_ID: ${{ matrix.sid }}
      SEARCH_DATE: ${{ matrix.date }}
      BASE_SHA: 09c2c142c6f29e112f8fa492b8e12e4d6d77fea3
      OUT: /tmp/match-anexkey-v4-${{ matrix.sid }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3, persist-credentials: false}
      - name: Verify source and derive private-credential program
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = '.github/workflows/hotel-match-andromeda-anex-direct-key-matrix-v4.yml'
          mkdir -p "$OUT"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('scripts/diagnostics/hotel_match_andromeda_anex_direct_key_matrix.php').read_text()
          assert p.count('__MATCH_DATE__')==1 and p.count('__MATCH_OPERATION__')==1
          p=p.replace('__MATCH_DATE__',os.environ['SEARCH_DATE']).replace('__MATCH_OPERATION__',os.environ['OPERATION_ID'])
          needle="$preview=$root.'/_preview/search3-anex-candidate';$api=$preview.'/api-andromeda-search3-preview.php';if(!is_file($api))hm_fail('bootstrap','andromeda_runtime_missing');require_once $api;"
          assert p.count(needle)==1
          p=p.replace(needle,needle+"$anexPrivate=$preview.'/.anex-private.php';if(is_file($anexPrivate))require_once $anexPrivate;",1)
          pathlib.Path(os.environ['OUT'],'program.php').write_text(p)
          PY
          php -l "$OUT/program.php"
      - name: Reserve before any provider access
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          d=pathlib.Path(os.environ['OUT']); src=(d/'program.php').read_bytes(); x={'family_id':os.environ['FAMILY_ID'],'operation_id':os.environ['OPERATION_ID'],'slice_id':os.environ['SLICE_ID'],'date':os.environ['SEARCH_DATE'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'program_sha256':hashlib.sha256(src).hexdigest(),'state':'reserved_before_supplier_access','tourvisor_fresh_calls':0,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}; (d/'reservation.json').write_text(json.dumps(x,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'match-anexkey-v4-${{ matrix.sid }}-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Download immutable same-date v10 Tourvisor result
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 34629144442, artifact-ids: '${{ matrix.v10_artifact }}', path: /tmp/v10-saved}
      - name: Execute one fresh Andromeda plus direct ANEX operation
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/ssh.sock"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ok=0
          for n in 1 2 3; do
            if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = 1
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && test -f config.php && test -f _preview/search3-anex-candidate/.anex-private.php'
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M' < "$OUT/program.php" > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr"
          rc=$?
          set -e; export RC="$rc"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']); raw=pathlib.Path(os.environ['RUNNER_TEMP'],'stdout').read_bytes(); vals=[x[len('MATCH_ANEXKEY_JSON:'):] for x in raw.decode(errors='replace').splitlines() if x.startswith('MATCH_ANEXKEY_JSON:')]; x=json.loads(vals[-1]) if vals else {'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','stdout_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'no_replay':True}; x['remote_exit']=int(os.environ['RC']); (d/'provider-result.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); assert x.get('database_writes')==0 and x.get('mapping_writes')==0
          if int(os.environ['RC'])!=0 or x.get('status')!='completed': raise SystemExit(2)
          assert (x.get('provider_calls') or {}).get('tourvisor')==0
          PY
          ssh -S "$sock" -O exit "$HOST" >/dev/null 2>&1 || true
          rm -f "$key" "$known" "$RUNNER_TEMP/stdout" "$RUNNER_TEMP/stderr"
      - name: Join exact ANEX operator keys to saved Tourvisor
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re,unicodedata,collections
          out=pathlib.Path(os.environ['OUT']); fresh=json.loads((out/'provider-result.json').read_text()); fs=list(pathlib.Path('/tmp/v10-saved').rglob('result.json')); assert len(fs)==1; old=json.loads(fs[0].read_text()); assert old['status']=='completed' and old['search_date']==os.environ['SEARCH_DATE']
          drop={'hotel','hotels','resort','resorts','spa','the','and','by','otel','отель','отели','гостиница'}
          def norm(s):
            s=unicodedata.normalize('NFKD',str(s or '').casefold()).replace('ı','i').replace('&',' and '); s=''.join(c for c in s if not unicodedata.combining(c)); return ' '.join(sorted(x for x in re.findall(r'[^\W_]+',s) if x not in drop))
          def forms(s): return {x for v in {str(s or ''),re.sub(r'\([^)]*\)',' ',str(s or ''))} if (x:=norm(v))}
          tv={str(x['id']):x for x in old['providers']['tourvisor']['hotels']}; idx=collections.defaultdict(set)
          for tid,h in tv.items():
            for x in set(h.get('aliases') or [])|forms(h.get('name')): idx[x].add(tid)
          oldtuples={(str(r['tourvisor']['id']),str(r['anex']['id']),str(r['andromeda']['id'])) for r in (((old.get('comparison') or {}).get('unique_alias_triples') or {}).get('rows') or [])}; triples=[]
          for b in fresh.get('bridges') or []:
            if not b.get('direct_anex_present'): continue
            hits=set()
            for x in forms(b.get('direct_anex_name')): hits|=idx.get(x,set())
            if len(hits)!=1: continue
            tid=next(iter(hits)); tup=(tid,str(b['anex_hotel_id']),str(b['andromeda_hotel_id'])); triples.append({'tourvisor_id':tid,'tourvisor_name':tv[tid]['name'],'anex_id':tup[1],'anex_name':b.get('direct_anex_name'),'andromeda_id':tup[2],'andromeda_name':b.get('andromeda_name'),'image_pattern_verified':bool(b.get('image_pattern_verified')),'prior_v10_exact_tuple':tup in oldtuples,'hotel_url':b.get('hotel_url')})
          triples.sort(key=lambda r:(int(r['tourvisor_id']),int(r['anex_id']),int(r['andromeda_id']))); result={'status':'completed','operation_id':os.environ['OPERATION_ID'],'slice_id':os.environ['SLICE_ID'],'date':os.environ['SEARCH_DATE'],'fresh_counts':fresh.get('counts'),'andromeda_pages':fresh['providers']['andromeda']['pages_consumed'],'saved_tourvisor_hotels':len(tv),'operator_key_triple_count':len(triples),'prior_v10_exact_tuple_count':sum(x['prior_v10_exact_tuple'] for x in triples),'triples':triples,'database_writes':0,'mapping_writes':0,'tourvisor_fresh_calls':0,'no_replay':True}; (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps({k:v for k,v in result.items() if k!='triples'},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anexkey-v4-${{ matrix.sid }}-${{ github.run_id }}-final
          path: |
            ${{ env.OUT }}/reservation.json
            ${{ env.OUT }}/provider-result.json
            ${{ env.OUT }}/result.json
          retention-days: 90
  aggregate:
    if: github.run_attempt == 1 && github.run_number == 1
    needs: slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'match-anexkey-v4-*-final', path: /tmp/current, merge-multiple: false}
      - name: Download successful immutable v3 s01
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 34696110868, artifact-ids: '10299280376', path: /tmp/prior/s01}
      - name: Download successful immutable v3 s03
        uses: actions/download-artifact@v4
        with: {github-token: '${{ github.token }}', repository: '${{ github.repository }}', run-id: 34696110868, artifact-ids: '10298981079', path: /tmp/prior/s03}
      - name: Aggregate four synchronized slices
        run: |
          python3 - <<'PY'
          import json,pathlib,collections,os
          files=list(pathlib.Path('/tmp/current').rglob('result.json'))+list(pathlib.Path('/tmp/prior').rglob('result.json')); rows=[json.loads(p.read_text()) for p in files]; assert len(rows)==4 and {x['slice_id'] for x in rows}=={'s01','s02','s03','s04'} and all(x['status']=='completed' for x in rows)
          seen=collections.defaultdict(set); names={}
          for d in rows:
            for r in d['triples']:
              k=(r['tourvisor_id'],r['anex_id'],r['andromeda_id']); seen[k].add(d['date']); names[k]=r
          triples=[]
          for k,dates in seen.items(): r=dict(names[k]); r['dates']=sorted(dates); r['recurrence']=len(dates); triples.append(r)
          triples.sort(key=lambda r:(-r['recurrence'],int(r['tourvisor_id']),int(r['anex_id']))); out={'status':'completed','family_id':'hotel-match-andromeda-anex-direct-key-matrix-1971-20260912-combined-v3-v4','slices':4,'slice_triple_observations':sum(len(x['triples']) for x in rows),'distinct_exact_id_triples':len(triples),'recurring_ge2':sum(x['recurrence']>=2 for x in triples),'recurring_ge3':sum(x['recurrence']>=3 for x in triples),'recurring_all4':sum(x['recurrence']==4 for x in triples),'new_vs_prior_alias_observations':sum(x['operator_key_triple_count']-x['prior_v10_exact_tuple_count'] for x in rows),'slice_summaries':[{k:d[k] for k in ['slice_id','date','fresh_counts','andromeda_pages','saved_tourvisor_hotels','operator_key_triple_count','prior_v10_exact_tuple_count']} for d in sorted(rows,key=lambda x:x['slice_id'])],'triples':triples,'database_writes':0,'mapping_writes':0,'tourvisor_fresh_calls':0,'no_replay':True}; pathlib.Path('aggregate.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); s=f"MATCH #1971 direct operator-key 1-1-1 combined matrix COMPLETE/READ-ONLY: four synchronized Turkey dates. Exact triple observations **{out['slice_triple_observations']}**, distinct exact ID triples **{out['distinct_exact_id_triples']}**, recurring >=2 **{out['recurring_ge2']}**, >=3 **{out['recurring_ge3']}**, all4 **{out['recurring_all4']}**; additional operator-key observations vs old alias triples **{out['new_vs_prior_alias_observations']}**. Fresh Tourvisor0; DB/mapping/booking/lead writes0. v3 s02/s04 ended at SSH handshake before remote/provider access; v4 uses NEW IDs. Run `{os.environ['GITHUB_RUN_ID']}`. Evidence only; conflicts and CURRENT protections remain guarded."; pathlib.Path('summary.md').write_text(s+'\n'); print(s)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'match-anexkey-combined-${{ github.run_id }}-aggregate', path: aggregate.json, retention-days: 90}
      - name: Record result
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file summary.md
