name: Probe Moscow Turkey Tourvisor continue stable

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/probe-market-continue-stable-v1.php'
      - '.github/workflows/probe-moscow-turkey-continue-stable.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/probe-market-continue-stable-v1.php'
      - '.github/workflows/probe-moscow-turkey-continue-stable.yml'

concurrency:
  group: anytour-moscow-turkey-continue-stable-probe
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable continue probe
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/probe-market-continue-stable-v1.php
          grep -Fq "'departureId'=>1" v2/data/probe-market-continue-stable-v1.php
          grep -Fq "'countryId'=>4" v2/data/probe-market-continue-stable-v1.php
          grep -Fq "'nightsFrom'=>5" v2/data/probe-market-continue-stable-v1.php
          grep -Fq "'nightsTo'=>14" v2/data/probe-market-continue-stable-v1.php
          grep -Fq "['limit'=>10000]" v2/data/probe-market-continue-stable-v1.php
          grep -Fq "'/continue'" v2/data/probe-market-continue-stable-v1.php
          grep -Fq 'for ($sample = 1; $sample <= 10; $sample++)' v2/data/probe-market-continue-stable-v1.php
          grep -Fq 'sleep(3)' v2/data/probe-market-continue-stable-v1.php
          grep -Fq 'STABLE_CONTINUE_RESULT' v2/data/probe-market-continue-stable-v1.php

  probe-production:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Run one initial plus one continue and observe 30 seconds
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          scp "${opts[@]}" v2/data/probe-market-continue-stable-v1.php "$remote:$remote_dir/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru/data\"
            trap 'rm -f \"\$root/probe-market-continue-stable-v1.php\"' EXIT
            php -l \"\$root/probe-market-continue-stable-v1.php\" >/dev/null
            php \"\$root/probe-market-continue-stable-v1.php\"
          "
