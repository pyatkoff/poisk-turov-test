name: MATCH CURRENT live-frequency dossier v1
on:
  push:
    branches: [diag/match-current-live-frequency-dossier-1971-20260917-v1]
    paths: [.github/workflows/hotel-match-current-live-frequency-dossier-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-current-live-frequency-dossier-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-current-live-frequency-dossier-1971-20260917-v1
jobs:
  dossier:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Reserve before DB
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5714541073,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-current-live-frequency-dossier-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-current-live-frequency-dossier-1971-20260917-v1/reservation.json
          retention-days: 90
      - name: Build CURRENT dossier
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          cat > "$RUNNER_TEMP/dossier.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const OP='hotel-match-current-live-frequency-dossier-1971-20260917-v1';
          function rq($v,$m){if(!$v)throw new RuntimeException($m);}
          function q(PDO $d,string $s,array $a=[]):array{$p=$d->prepare($s);$p->execute(array_values($a));$r=$p->fetchAll(PDO::FETCH_ASSOC);rq(count($r)<=100000,'row_budget');return$r;}
          function nrm(?string $s):string{$s=mb_strtoupper(trim((string)$s),'UTF-8');$s=preg_replace('/\bEX\.?\s*/u',' ',$s);$s=preg_replace('/[^\pL\pN]+/u',' ',$s);$parts=preg_split('/\s+/u',trim($s))?:[];$parts=array_values(array_filter($parts,fn($x)=>$x!==''&&$x!=='HOTEL'));return implode(' ',$parts);}
          function prot($v,$k='',$z=0):bool{if($z>24)return true;if(is_array($v)){foreach($v as$k2=>$x)if(prot($x,(string)$k2,$z+1))return true;return false;}if(!preg_match('/manual|exclude|exclusion|conflict|reject|review/i',$k))return false;if(is_bool($v))return$v;if(is_numeric($v))return(float)$v!=0;return is_string($v)&&!in_array(mb_strtolower(trim($v),'UTF-8'),['','false','none','no','null','pending'],true);}
          function findv($v,array $keys,int $z=0){if($z>16||!is_array($v))return null;foreach($keys as$k)if(array_key_exists($k,$v)&&!is_array($v[$k])&&$v[$k]!==null&&trim((string)$v[$k])!=='')return$v[$k];foreach($v as$x){if(is_array($x)){ $r=findv($x,$keys,$z+1); if($r!==null)return$r; }}return null;}
          function src(array $e,string $ns):array{
            if(str_starts_with($ns,'operator_')&&isset($e['provider_bridges'][0])&&is_array($e['provider_bridges'][0])){$b=$e['provider_bridges'][0];return['name'=>trim((string)($b['hotel_name']??'')),'country'=>(int)($b['country_id']??0),'place'=>trim((string)($b['subregion_name']??$b['region_name']??$b['place']??'')),'lat'=>is_numeric($b['latitude']??null)?(float)$b['latitude']:null,'lon'=>is_numeric($b['longitude']??null)?(float)$b['longitude']:null];}
            $name=(string)(findv($e,['hotel_name','hotelName','source_hotel_name','supplier_hotel_name'])??'');
            if(trim($name)==='')$name=(string)(findv($e,['name'])??'');
            $country=(int)(findv($e,['country_id','countryId','source_country_id'])??0);
            $place=(string)(findv($e,['subregion_name','subregionName','region_name','regionName','resort_name','resortName','place','town_name','townName'])??'');
            $lat=findv($e,['latitude','lat']);$lon=findv($e,['longitude','lon','lng']);
            return['name'=>trim($name),'country'=>$country,'place'=>trim($place),'lat'=>is_numeric($lat)?(float)$lat:null,'lon'=>is_numeric($lon)?(float)$lon:null];
          }
          function km(?float $a,?float $o,?float $b,?float $p):?float{if($a===null||$o===null||$b===null||$p===null)return null;$r=6371;$d1=deg2rad($b-$a);$d2=deg2rad($p-$o);$x=sin($d1/2)**2+cos(deg2rad($a))*cos(deg2rad($b))*sin($d2/2)**2;return 2*$r*asin(min(1,sqrt($x)));}
          $sha=(string)getenv('MATCH_SOURCE_SHA');rq(getenv('MATCH_OPERATION_ID')===OP&&preg_match('/^[a-f0-9]{40}$/D',$sha),'guard');$dir=(string)getenv('HOME').'/.anytoour-match/operations/'.OP;$rv=json_decode((string)file_get_contents($dir.'/reservation.json'),true,32,JSON_THROW_ON_ERROR);rq(($rv['state']??'')==='reserved_before_db_access'&&($rv['source_sha']??'')===$sha,'reservation');$db=null;$o=['operation_id'=>OP,'source_sha'=>$sha,'state'=>'failed_no_replay','database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0,'no_replay'=>true];
          try{
            $root=realpath(getcwd());rq(is_string($root)&&basename($root)==='anytoour.ru','root');require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY');
            $pending=q($db,"SELECT supplier_namespace,external_hotel_id,evidence_sha256,evidence_json FROM andromeda_hotel_identities WHERE supplier_namespace IN ('andromeda_catalog','operator_315','operator_342','operator_5') AND decision_status='pending' AND local_hotel_id IS NULL ORDER BY supplier_namespace,external_hotel_id");
            $hotels=q($db,"SELECT id,country_id,name,region_name,subregion_name,latitude,longitude FROM catalog_hotels WHERE is_active=1");
            $aliases=q($db,"SELECT a.hotel_id,a.alias,h.country_id FROM hotel_aliases a JOIN catalog_hotels h ON h.id=a.hotel_id WHERE h.is_active=1");
            $freq=q($db,"SELECT hotel_id,COUNT(*) rows_total,COUNT(DISTINCT search_id) searches,MAX(observed_at) last_seen,COUNT(DISTINCT operator_id) operators FROM tour_price_observations WHERE observed_at>=UTC_TIMESTAMP()-INTERVAL 30 DAY GROUP BY hotel_id");
            $occ=q($db,"SELECT supplier_namespace,local_hotel_id,COUNT(*) c FROM andromeda_hotel_identities WHERE supplier_namespace IN ('andromeda_catalog','operator_315','operator_342','operator_5') AND decision_status='accepted' AND local_hotel_id IS NOT NULL GROUP BY supplier_namespace,local_hotel_id");
            $db->exec('ROLLBACK');
            $hm=[];$byId=[];foreach($hotels as$h){$id=(int)$h['id'];$byId[$id]=$h;$k=(int)$h['country_id'].'|'.nrm((string)$h['name']);if(!str_ends_with($k,'|'))$hm[$k][$id]=1;}
            foreach($aliases as$a){$k=(int)$a['country_id'].'|'.nrm((string)$a['alias']);if(!str_ends_with($k,'|'))$hm[$k][(int)$a['hotel_id']]=1;}
            $fm=[];foreach($freq as$f)$fm[(int)$f['hotel_id']]=$f;$om=[];foreach($occ as$x)$om[(string)$x['supplier_namespace'].'|'.(int)$x['local_hotel_id']]=(int)$x['c'];
            $counts=['pending_total'=>count($pending),'source_extractable'=>0,'unique_exact_name_country'=>0,'live_observed_candidate'=>0,'strict_geo_live'=>0,'name_live_needs_geo'=>0,'protected'=>0,'occupied'=>0,'coord_conflict_gt5km'=>0];$rows=[];
            foreach($pending as$p){$e=json_decode((string)$p['evidence_json'],true,64,JSON_THROW_ON_ERROR);rq(is_array($e),'evidence_shape');$s=src($e,(string)$p['supplier_namespace']);if($s['name']===''||$s['country']<=0)continue;$counts['source_extractable']++;$key=$s['country'].'|'.nrm($s['name']);$ids=array_keys($hm[$key]??[]);if(count($ids)!==1)continue;$counts['unique_exact_name_country']++;$id=(int)$ids[0];$f=$fm[$id]??null;if(!$f)continue;$counts['live_observed_candidate']++;$h=$byId[$id]??null;if(!$h)continue;$isProt=prot($e);if($isProt)$counts['protected']++;$occupied=($om[(string)$p['supplier_namespace'].'|'.$id]??0)>0;if($occupied)$counts['occupied']++;$dist=km($s['lat'],$s['lon'],is_numeric($h['latitude'])?(float)$h['latitude']:null,is_numeric($h['longitude'])?(float)$h['longitude']:null);$place=nrm($s['place']);$geo=$place!==''&&($place===nrm((string)$h['region_name'])||$place===nrm((string)$h['subregion_name']));$coordGood=$dist!==null&&$dist<=1.0;$coordBad=$dist!==null&&$dist>5.0;if($coordBad)$counts['coord_conflict_gt5km']++;$strict=(!$isProt&&!$occupied&&!$coordBad&&($coordGood||$geo));if($strict)$counts['strict_geo_live']++;else if(!$isProt&&!$occupied&&!$coordBad)$counts['name_live_needs_geo']++;
              $rows[]=['supplier_namespace'=>(string)$p['supplier_namespace'],'external_hotel_id'=>(string)$p['external_hotel_id'],'source_name'=>$s['name'],'country_id'=>$s['country'],'source_place'=>$s['place']?:null,'candidate_local_id'=>$id,'candidate_name'=>(string)$h['name'],'candidate_region'=>$h['region_name'],'candidate_subregion'=>$h['subregion_name'],'distance_km'=>$dist===null?null:round($dist,3),'geo_name_match'=>$geo,'coord_le1km'=>$coordGood,'coord_gt5km'=>$coordBad,'protected'=>$isProt,'namespace_occupied'=>$occupied,'live_searches'=>(int)$f['searches'],'live_rows'=>(int)$f['rows_total'],'live_operators'=>(int)$f['operators'],'last_seen'=>$f['last_seen'],'classification'=>$strict?'strict_geo_live':((!$isProt&&!$occupied&&!$coordBad)?'name_live_needs_geo':'held'),'source_evidence_sha256'=>(string)$p['evidence_sha256']];
            }
            usort($rows,fn($a,$b)=>[$b['classification']==='strict_geo_live',$b['live_searches'],$b['live_rows']]<=>[$a['classification']==='strict_geo_live',$a['live_searches'],$a['live_rows']]);
            $strict=array_values(array_filter($rows,fn($x)=>$x['classification']==='strict_geo_live'));$need=array_values(array_filter($rows,fn($x)=>$x['classification']==='name_live_needs_geo'));
            $o['state']='completed_read_only';$o['counts']=$counts;$o['strict_geo_live']=$strict;$o['top_name_live_needs_geo']=array_slice($need,0,100);$o['top_all']=array_slice($rows,0,200);$o['read_at_utc']=gmdate('c');
          }catch(Throwable $e){if($db instanceof PDO&&$db->inTransaction())$db->rollBack();$o['error_code']=preg_match('/^[a-z_]{2,100}$/D',$e->getMessage())?$e->getMessage():'sanitized_failure';}
          $raw=json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR)."\n";file_put_contents($dir.'/result.json',$raw,LOCK_EX);$h=hash('sha256',$raw);file_put_contents($dir.'/receipt.json',json_encode(['operation_id'=>OP,'source_sha'=>$sha,'state'=>$o['state'],'result_sha256'=>$h,'readback_verified'=>true,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0,'no_replay'=>true],JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n",LOCK_EX);echo json_encode(['state'=>$o['state'],'counts'=>$o['counts']??[],'strict_geo_live'=>array_slice($o['strict_geo_live']??[],0,25),'top_name_live_needs_geo'=>array_slice($o['top_name_live_needs_geo']??[],0,20),'result_sha256'=>$h],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";if($o['state']!=='completed_read_only')exit(2);
          PHP
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0 -d memory_limit=768M" < "$RUNNER_TEMP/dossier.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';r=json.loads((s/'result.json').read_text());c=json.loads((s/'receipt.json').read_text());h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest();ok=r.get('state')=='completed_read_only' and c.get('result_sha256')==h and c.get('readback_verified') is True and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']);g={'verified':ok,'counts':r.get('counts'),'strict_geo_live':r.get('strict_geo_live'),'top_name_live_needs_geo':r.get('top_name_live_needs_geo'),'result_sha256':h,'no_replay':True};print(json.dumps(g,ensure_ascii=False,sort_keys=True));(p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n');raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-current-live-frequency-dossier-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-current-live-frequency-dossier-1971-20260917-v1/
          retention-days: 90
