name: MATCH COMMON4 context recovery acquire v26
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php'
      - 'tests/hotel_match_common4_context_recovery_acquire_v26_test.php'
      - '.github/workflows/hotel-match-common4-context-recovery-acquire-v26.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-common4-context-recovery-acquire-1971-20260925-v26, cancel-in-progress: false}
env:
  OP: hotel-match-common4-context-recovery-acquire-1971-20260925-v26
  BASE: c3b28595541ecb85286227aa146d70329bf324f3
  CLAIM: '5831087665'
  POST_ARTIFACT: '10859521211'
  POST_ARCHIVE_SHA: 73a9bc1abae746c93945b65daa54ba335cdf29e85a7391f8ae06b320616b9371
  POST_RESULT_SHA: 9830e34afb9bd27439dd7d6a2a0c8b869f05b4c159027ffb1a0da8055bd2c706
  CENSUS_ARTIFACT: '10859143571'
  CENSUS_ARCHIVE_SHA: e591e1d4f2c6dbcacc27fa0941488bcbdd4af4c570e35393c831707c4d72863a
  CENSUS_RESULT_SHA: b57ccaccb1c7e2e14321f39b2060308e5ff264c9cab44da1f45dcc36be22e07a
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-context-recovery-acquire-v26-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: php -l scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php
      - run: php scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php --self-test
      - run: php tests/hotel_match_common4_context_recovery_acquire_v26_test.php
      - run: |
          ! grep -E 'INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-context-recovery-acquire-v26-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim Security inputs and provider lane
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/post input/census terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-common4-context-recovery-acquire-v26.yml scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php tests/hotel_match_common4_context_recovery_acquire_v26_test.php "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'overlap507','overlap126','operation HTTP cap500','DB/mapping writes0']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$POST_ARTIFACT/zip" -o input/post.zip
          test "$(sha256sum input/post.zip|awk '{print $1}')" = "$POST_ARCHIVE_SHA"
          unzip -q input/post.zip -d input/post
          post="$(find input/post -type f -name result.json -print -quit)";test -n "$post";cp "$post" input/post-result.json
          test "$(sha256sum input/post-result.json|awk '{print $1}')" = "$POST_RESULT_SHA"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CENSUS_ARTIFACT/zip" -o input/census.zip
          test "$(sha256sum input/census.zip|awk '{print $1}')" = "$CENSUS_ARCHIVE_SHA"
          unzip -q input/census.zip -d input/census
          census="$(find input/census -type f -name result.json -print -quit)";test -n "$census";cp "$census" input/census-result.json
          test "$(sha256sum input/census-result.json|awk '{print $1}')" = "$CENSUS_RESULT_SHA"
          python3 - <<'PY'
          import json,os,urllib.request
          p=json.load(open('input/post-result.json'));c=json.load(open('input/census-result.json'))
          assert p['operation']=='hotel-match-samo-business-live30-common4-postwrite-1971-20260925-v24'
          assert p['deduped_missing_lane_counts']=={'operator_5':1516,'operator_115':1218,'operator_315':1304,'operator_342':667}
          assert c['operation']=='hotel-match-common4-retained-context-census-1971-20260925-v25'
          assert c['top_contexts_by_operator']['5'][0]['criteria_sha256']=='e3b6c0e8e26aa386e054474b8ce1eeddd3cb916dc4a52be533c2326176020c56'
          assert c['top_contexts_by_operator']['315'][0]['criteria_sha256']=='e314ee9d589d578b1220e86f9ac0e825e8fa8d89d32bc31119c3d74d726d15c7'
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?status=in_progress&per_page=100'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as f:active=json.load(f)['workflow_runs']
          blockers=[x for x in active if x['id']!=int(os.environ['GITHUB_RUN_ID']) and (x['name']=='INT permanent server executor' or ('MATCH' in x['name'] and ('acquire' in x['name'].lower() or 'provider' in x['name'].lower())))]
          assert not blockers,[(x['id'],x['name']) for x in blockers]
          PY
      - name: Execute highest-yield context recovery v26
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_provider','postwrite_result_sha256':os.environ['POST_RESULT_SHA'],'census_result_sha256':os.environ['CENSUS_RESULT_SHA'],'provider':'andromeda','database_writes':0,'mapping_writes':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\" \"\$HOME/$op/payload/app/integrations\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/post-result.json "$remote:$op/payload/postwrite-result.json"
          scp "${opts[@]}" input/census-result.json "$remote:$op/payload/census-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php "$remote:$op/payload/scripts/diagnostics/"
          scp "${opts[@]}" app/integrations/andromeda-client.php app/integrations/andromeda-transport.php app/integrations/andromeda-network-transport-failure.php "$remote:$op/payload/app/integrations/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_POSTWRITE_RESULT=\"\$HOME/$op/payload/postwrite-result.json\" MATCH_POSTWRITE_SHA='$POST_RESULT_SHA' MATCH_CENSUS_RESULT=\"\$HOME/$op/payload/census-result.json\" MATCH_CENSUS_SHA='$CENSUS_RESULT_SHA' MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_common4_context_recovery_acquire_v26.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          set -e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['state'] in ('completed_read_only_context_recovery','completed_read_only_context_recovery_partial')
          assert r['target_counts_by_operator']=={'5':286,'315':1100}
          assert r['target_edge_count']==1386 and r['context_count']==2
          assert r['database_writes']==r['mapping_writes']==0 and r['tourvisor_calls']==r['direct_anex_calls']==0
          print(json.dumps({k:r[k] for k in ['state','target_edge_count','context_count','failed_operator_context_count','provider_http_calls','edge_state_counts','operator_state_counts','single_native_source_collision_count']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-context-recovery-v26-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
