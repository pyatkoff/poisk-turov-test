name: ANEX Green Gold program/fuel evidence
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_three_source_broad_price.php'
      - 'scripts/diagnostics/anex_three_source_broad_price.py'
      - 'tests/anex-three-source-broad-price-smoke.php'
      - 'tests/anex_three_source_broad_price_test.py'
      - '.github/workflows/anex-three-source-broad-price-check.yml'
  push:
    branches:
      - 'ops/int-anex-green-gold-program-v9-20260912'
      - 'ops/int-anex-transport-preflight-v2-20260912'
    paths:
      - '.github/ops/anex-green-gold-program-v9-20260912'
      - '.github/ops/anex-transport-preflight-v2-20260912'
permissions:
  contents: read
concurrency:
  group: anex-green-gold-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate Green Gold v9 source without network
        run: |
          php -l scripts/diagnostics/anex_three_source_broad_price.php
          php -l tests/anex-three-source-broad-price-smoke.php
          php -d allow_url_fopen=0 tests/anex-three-source-broad-price-smoke.php
          python3 -B tests/anex_three_source_broad_price_test.py
          python3 - <<'PY'
          from pathlib import Path
          php=Path('scripts/diagnostics/anex_three_source_broad_price.php').read_text()
          py=Path('scripts/diagnostics/anex_three_source_broad_price.py').read_text()
          for forbidden in ('->bron(', 'broninit(', '->calc(', 'get_flights(', 'INSERT INTO anex_hotel_search_mappings', 'UPDATE anex_hotel_search_mappings', 'AnyTourAnexSearchObservations::record'):
              assert forbidden not in php
          assert "ANEX_BROAD_PRICE_EXPERIMENT = 'anex_green_gold_program_20260912_v9'" in php
          assert "ANEX_BROAD_PRICE_CASES = ['anex']" in php
          assert "ANEX_BROAD_PRICE_DATE = '2026-10-05'" in php and 'ANEX_BROAD_PRICE_NIGHTS = 7' in php
          assert "ANEX_BROAD_PRICE_TARGET_ANEX_HOTEL = '25084'" in php and "'HOTELS'=>ANEX_BROAD_PRICE_TARGET_ANEX_HOTEL" in php
          assert 'anex_broad_price_pause' in php and 'usleep(3200000)' in php
          assert "'andromeda_search_price'=>'119952'" in php and "'tourvisor_fuel_charge'=>'29596'" in php and "'requeried'=>false" in php
          assert "EXPERIMENT='anex_green_gold_program_20260912_v9'" in py and "CASES=('anex',)" in py
          assert "'date':'2026-10-05'" in py and "TARGET_ANEX_HOTEL_ID='25084'" in py
          assert "'additional_prices_called':False" in py and "'tourvisor_requeried':False" in py and "'andromeda_requeried':False" in py
          workflow=Path('.github/workflows/anex-three-source-broad-price-check.yml').read_text()
          assert 'ops/int-anex-green-gold-program-v9-20260912' in workflow and 'ops/int-anex-transport-preflight-v2-20260912' in workflow
          assert 'cancel-in-progress: false' in workflow and 'if: always()' in workflow
          print('Green Gold v9 direct-ANEX static boundary: PASS')
          PY
  transport_preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-transport-preflight-v2-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact transport preflight
        run: |
          test "$(cat .github/ops/anex-transport-preflight-v2-20260912)" = "operation=int-anex-transport-preflight-v2;source=cd4bb352a765b11396070dc69ea9b9fec1589d8d;owner=2026-09-12;suppliers=0"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Verify SSH transport without supplier access
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ANYTOOUR_DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          out="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 "$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST" 'printf "INT_TRANSPORT_OK\\n"; pwd')"
          printf '%s\n' "$out"
          test "$(printf '%s\n' "$out" | sed -n '1p')" = 'INT_TRANSPORT_OK'
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-green-gold-program-v9-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SOURCE_SHA: 179c1caf6625aead61323b90d9eeb1789f5b71ba
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact Green Gold v9 direct-ANEX scenario
        run: |
          test "$(cat control/.github/ops/anex-green-gold-program-v9-20260912)" = "source=${SOURCE_SHA};operation=read-only-anex-green-gold-program-v9;scenario=Turkey-2026-10-05-7n-2a-AI-GreenGold21753-Anex25084-direct-only;owner=2026-09-12"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Run fresh Green Gold v9 direct-ANEX program observation
        id: parity
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/broad-price"
          python3 -B source/scripts/diagnostics/anex_three_source_broad_price.py "$RUNNER_TEMP/broad-price"
      - name: Preserve sanitized Green Gold v9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-green-gold-program-v9-${{ github.run_id }}
          path: ${{ runner.temp }}/broad-price/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when Green Gold v9 did not complete
        if: steps.parity.outcome != 'success'
        run: exit 1
