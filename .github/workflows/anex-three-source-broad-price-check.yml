name: ANEX Green Gold program/fuel evidence
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_three_source_broad_price.php'
      - 'scripts/diagnostics/anex_three_source_broad_price.py'
      - 'tests/anex-three-source-broad-price-smoke.php'
      - 'tests/anex_three_source_broad_price_test.py'
      - '.github/workflows/anex-three-source-broad-price-check.yml'
  push:
    branches:
      - 'ops/int-anex-green-gold-program-v8-20260912'
      - 'ops/int-anex-transport-preflight-v2-20260912'
    paths:
      - '.github/ops/anex-three-source-green-gold-v8-20260912'
      - '.github/ops/anex-transport-preflight-v2-20260912'
permissions:
  contents: read
concurrency:
  group: anex-green-gold-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate Green Gold v8 source without network
        run: |
          php -l scripts/diagnostics/anex_three_source_broad_price.php
          php -l tests/anex-three-source-broad-price-smoke.php
          php -d allow_url_fopen=0 tests/anex-three-source-broad-price-smoke.php
          python3 -B tests/anex_three_source_broad_price_test.py
          python3 - <<'PY'
          from pathlib import Path
          php=Path('scripts/diagnostics/anex_three_source_broad_price.php').read_text()
          py=Path('scripts/diagnostics/anex_three_source_broad_price.py').read_text()
          for forbidden in ('->bron(', 'broninit(', '->calc(', 'get_flights(', 'INSERT INTO anex_hotel_search_mappings', 'UPDATE anex_hotel_search_mappings'):
              assert forbidden not in php
          assert "ANEX_BROAD_PRICE_EXPERIMENT = 'anex_three_source_green_gold_20260912_v8'" in php
          assert "ANEX_BROAD_PRICE_DATE = '2026-09-28'" in php and 'ANEX_BROAD_PRICE_NIGHTS = 7' in php
          assert 'ANEX_BROAD_PRICE_TARGET_LOCAL_HOTEL = 21753' in php and "ANEX_BROAD_PRICE_TARGET_ANEX_HOTEL = '25084'" in php
          assert "'HOTELS'=>ANEX_BROAD_PRICE_TARGET_ANEX_HOTEL" in php
          assert "'hotelIds'=>[ANEX_BROAD_PRICE_TARGET_LOCAL_HOTEL]" in php
          assert "target_filter_stage'=>'local_response_only_protected_request_unchanged'" in php
          assert 'anex_broad_price_raw_programs' in php and "raw SearchTour_PRICES id→tourKey/currencyKey binding" in php
          assert "'reason'=>'pricepage_1_target_hotel_only'" in php and "'reason'=>'status_without_continue_no_growth'" in php
          assert "EXPERIMENT='anex_three_source_green_gold_20260912_v8'" in py and "'date':'2026-09-28'" in py and "'nights':7" in py
          assert "TARGET_LOCAL_HOTEL_ID=21753" in py and "TARGET_ANEX_HOTEL_ID='25084'" in py
          assert 'program_fuel_cohorts' in py and 'anex_program_fuel_cohorts' in py and 'p3_matching_external' in py
          workflow=Path('.github/workflows/anex-three-source-broad-price-check.yml').read_text()
          assert 'ops/int-anex-green-gold-program-v8-20260912' in workflow
          assert 'ops/int-anex-transport-preflight-v2-20260912' in workflow
          assert 'Verify SSH transport without supplier access' in workflow
          assert 'cancel-in-progress: false' in workflow and 'if: always()' in workflow
          print('Green Gold three-source v8 static boundary: PASS')
          PY
  transport_preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-transport-preflight-v2-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact transport preflight
        run: |
          test "$(cat .github/ops/anex-transport-preflight-v2-20260912)" = "operation=int-anex-transport-preflight-v2;source=cd4bb352a765b11396070dc69ea9b9fec1589d8d;owner=2026-09-12;suppliers=0"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Verify SSH transport without supplier access
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$ANYTOOUR_DEPLOY_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          out="$(ssh -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=5 -o ServerAliveCountMax=1 "$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST" 'printf "INT_TRANSPORT_OK\\n"; pwd')"
          printf '%s\n' "$out"
          test "$(printf '%s\n' "$out" | sed -n '1p')" = 'INT_TRANSPORT_OK'
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-green-gold-program-v8-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      SOURCE_SHA: d837937b7eb36c09d0ac3ed4755eee2b52134eea
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact Green Gold v8 scenario
        run: |
          test "$(cat control/.github/ops/anex-three-source-green-gold-v8-20260912)" = "source=${SOURCE_SHA};operation=read-only-anex-green-gold-program-v8;scenario=Turkey-2026-09-28-7n-2a-AI-GreenGold21753-Anex25084;owner=2026-09-12"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - name: Run fresh Green Gold v8 provider cases through durable checkpoints
        id: parity
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/broad-price"
          python3 -B source/scripts/diagnostics/anex_three_source_broad_price.py "$RUNNER_TEMP/broad-price"
      - name: Preserve sanitized Green Gold v8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-green-gold-v8-${{ github.run_id }}
          path: ${{ runner.temp }}/broad-price/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when Green Gold v8 did not complete
        if: steps.parity.outcome != 'success'
        run: exit 1
