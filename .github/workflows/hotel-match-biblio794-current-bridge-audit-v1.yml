name: MATCH Biblio794 CURRENT bridge audit
'on':
  pull_request: {types: [opened], branches: [feature/anex-search-adapter-20260907]}
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: match-biblio794-current-audit-v1, cancel-in-progress: false}
env:
  OP: hotel-match-biblio794-current-bridge-audit-1971-20260921-v1
  BASE: 2321db22b5dede7f1cb9b6d5dc9a098521ed86f6
  SCRIPT: scripts/diagnostics/hotel_match_biblio794_current_bridge_audit_v1.php
  SCRIPT_SHA: 1204814e8a5086fb5a4798ca168cfecc7d230ca8baf9027d5b0bb850946cb4e8
  CLAIM: '5765097071'
jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate and reserve
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir -p input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD"; test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE"..HEAD | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-biblio794-current-bridge-audit-v1.yml scripts/diagnostics/hotel_match_biblio794_current_bridge_audit_v1.php "
          echo "$SCRIPT_SHA  $SCRIPT" | sha256sum -c -; php -l "$SCRIPT"; php "$SCRIPT" --self-test
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json')); assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],'READ ONLY','exactly the794 single-F4','operator_115','database/mapping writes0']: assert x in c['body']
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10634643226/zip" > input/v9.zip
          echo '0a4337d6a00f668b643b8babb14867e3cae5189bbb881c724c24e5b74e7baaf0  input/v9.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,hashlib,pathlib
          with zipfile.ZipFile('input/v9.zip') as z:b=z.read('reconciliation.json')
          assert hashlib.sha256(b).hexdigest()=='0995ccbd0c14639a335a644748d6dc5af6b359345328698ea3c0fc1300d88814';pathlib.Path('input/v9.json').write_bytes(b)
          PY
          python3 - <<'PY'
          import json,os,datetime
          r={'operation':os.environ['OP'],'state':'reserved_before_db','source_sha':os.environ['HEAD'],'script_sha256':os.environ['SCRIPT_SHA'],'input_edges':794,'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'database_writes':0,'mapping_writes':0,'no_replay':True}
          open('reservation/reservation.json','x').write(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-biblio794-reservation-${{ github.run_id }}', path: reservation/, retention-days: 90}
      - name: Require Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(60):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']}),timeout=30) as f:r=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard']
            if r and max(r,key=lambda x:x['id'])['status']=='completed': assert max(r,key=lambda x:x['id'])['conclusion']=='success';break
            time.sleep(5)
          else: raise SystemExit('security')
          PY
      - name: CURRENT read only
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/h"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null; r="$USER@$HOST"; o=".anytoour-match/operations/$OP"; s="${SCRIPT##*/}"; a=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          ssh "${a[@]}" "$r" "set -eu; test ! -e \"\$HOME/$o\"; mkdir -p \"\$HOME/.anytoour-match/operations\"; mkdir \"\$HOME/$o\"; mkdir \"\$HOME/$o/payload\""
          cp reservation/reservation.json input/reservation.json; scp "${a[@]}" "$SCRIPT" input/v9.json input/reservation.json "$r:$o/payload/"
          ssh "${a[@]}" "$r" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$o\" MATCH_INPUT_DIR=\"\$HOME/$o/payload\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$o/payload/$s\" --execute" > terminal/stdout 2>terminal/stderr
          ssh "${a[@]}" "$r" "cd \"\$HOME/$o\" && tar -czf - started.json result.json receipt.json" > terminal/server.tgz
      - name: Verify
        env: {HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib,os
          with tarfile.open('terminal/server.tgz','r:gz') as t:
            for n in ['started.json','result.json','receipt.json']: pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['state']==q['state']=='completed_read_only' and r['source_sha']==os.environ['HEAD'] and len(r['rows'])==794 and sum(r['counts'].values())==794
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['provider_calls']==r['database_writes']==r['mapping_writes']==0
          pathlib.Path('terminal/summary.json').write_text(json.dumps({k:v for k,v in r.items() if k!='rows'},indent=2)+'\n')
          print(r['counts'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-biblio794-current-audit-${{ github.run_id }}', path: terminal/, retention-days: 90}
