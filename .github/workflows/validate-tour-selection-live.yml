name: Validate V2 tour selection live
on:
  push:
    branches: [main]
    paths:
      - 'v2/.tour-selection-smoke'
  workflow_dispatch:
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Live tour contract
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "TOUR_SELECTION_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
            from="$(date -d "+2 day" +%Y-%m-%d)"
            till="$(date -d "+9 day" +%Y-%m-%d)"
            curl -k -L -sS --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB" -o /tmp/v2-ts-start.json
            search_id="$(python3 -c "import json; print(json.load(open(\"/tmp/v2-ts-start.json\")).get(\"searchId\",0))")"
            test "$search_id" -gt 0 || fail search_id
            complete=0
            for attempt in $(seq 1 20); do
              sleep 2
              code="$(curl -k -L -sS -o /tmp/v2-ts-status.json -w "%{http_code}" --max-time 45 "$base?action=search_status&searchId=$search_id")"
              if test "$code" = "200" && grep -Eq "\"progress\"[[:space:]]*:[[:space:]]*100|\"status\"[[:space:]]*:[[:space:]]*\"complete\"" /tmp/v2-ts-status.json; then complete=1; break; fi
            done
            test "$complete" = "1" || fail search_not_complete
            curl -k -L -sS --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25" -o /tmp/v2-ts-results.json
            tour_id="$(python3 -c "import json; d=json.load(open(\"/tmp/v2-ts-results.json\")); print(next((str(t.get(\"id\")) for h in d if isinstance(h,dict) for t in h.get(\"tours\",[]) if isinstance(t,dict) and t.get(\"id\")),\"\"))")"
            test -n "$tour_id" || fail tour_id
            tour_code="$(curl -k -L -sS -o /tmp/v2-ts-tour.json -w "%{http_code}" --max-time 45 --get --data-urlencode "action=tour" --data-urlencode "tourId=$tour_id" --data-urlencode "currency=RUB" "$base")"
            echo "TOUR_HTTP=$tour_code TOUR_ID=$tour_id"
            test "$tour_code" = "200" || fail tour_http
            python3 -c "import json,sys; t=json.load(open(\"/tmp/v2-ts-tour.json\")); required=[\"id\",\"date\",\"nights\",\"price\"]; missing=[k for k in required if t.get(k) in (None,\"\",0)]; print(\"TOUR_FIELDS\",{k:t.get(k) for k in [\"id\",\"date\",\"nights\",\"price\",\"roomType\",\"placement\",\"meal\",\"operator\"]}); sys.exit(1 if missing else 0)" || fail required_tour_fields
            echo "TOUR_SELECTION_OK searchId=$search_id tourId=$tour_id"
          '
