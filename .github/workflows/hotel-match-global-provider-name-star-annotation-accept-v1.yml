name: MATCH GLOBAL provider bridge star-annotation accept v1
on:
  push:
    branches: [ops/match-global-current-review-2333-20260913-v1]
    paths: [.github/match-global-provider-name-star-annotation-accept-v1.arm]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-provider-name-bridge-accept-star-annotation-2333-20260913-v1}
jobs:
  accept:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate guarded writer
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_provider_name_bridge_accept_star_annotation.php
          php -l scripts/diagnostics/hotel_match_provider_name_bridge_review.php
          test "$(cat .github/match-global-provider-name-star-annotation-accept-v1.arm)" = "$OPERATION_ID"
      - name: Reserve immutable write before SSH
        run: |
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          printf '%s\n' '{"operation_id":"hotel-match-provider-name-bridge-accept-star-annotation-2333-20260913-v1","state":"reserved_before_ssh","mode":"server_current_guarded_provider_name_star_annotation_write","no_replay":true,"historical_operations_replayed":false}' > "$RUNNER_TEMP/$OPERATION_ID/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-global-provider-name-star-annotation-accept-v1-reservation, path: '${{ runner.temp }}/hotel-match-provider-name-bridge-accept-star-annotation-2333-20260913-v1/reservation.json', retention-days: 90}
      - name: Prepare SSH key
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Build reviewed payload
        run: |
          set -euo pipefail
          export PAYLOAD="$RUNNER_TEMP/$OPERATION_ID/payload.php"
          python3 - <<'PY'
          import os
          from pathlib import Path
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[5:]
              return s.replace('declare(strict_types=1);','',1)
          parts=[]
          for p in ['scripts/diagnostics/hotel_full_catalog_reconcile.php','scripts/diagnostics/hotel_match_current_bulk_review.php','scripts/diagnostics/hotel_match_live_priority_review.php','scripts/diagnostics/hotel_match_pending_candidate_bridge_review.php','scripts/diagnostics/hotel_match_translit_exact_review.php','scripts/diagnostics/hotel_match_provider_name_bridge_review.php','scripts/diagnostics/hotel_match_provider_name_bridge_accept_star_annotation.php']:
              x=body(p)
              import re
              x=re.sub(r"if \(!defined\('FC_LIBRARY_ONLY'\)\) define\('FC_LIBRARY_ONLY', true\);\n",'',x)
              x=re.sub(r"require_once __DIR__ \. '/[^']+';\n",'',x)
              parts.append(x)
          wrapper="""
          $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');
          $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once $dbHelper;
          $db=v2_data_db();$out=hmpnbsa_accept($db,'hotel-match-provider-name-bridge-accept-star-annotation-2333-20260913-v1');echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          """
          Path(os.environ['PAYLOAD']).write_text("<?php\ndefine('FC_LIBRARY_ONLY',true);\n"+'\n'.join(parts)+'\n'+wrapper,encoding='utf-8')
          PY
      - name: Apply exactly once from CURRENT DB
        env: {SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; remote="/tmp/match-${GITHUB_RUN_ID}.php"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          trap 'ssh "${opts[@]}" "$SSH_USER@$SSH_HOST" "rm -f '$remote'" >/dev/null 2>&1 || true' EXIT
          scp "${opts[@]}" "$STATE/payload.php" "$SSH_USER@$SSH_HOST:$remote"
          ssh "${opts[@]}" "$SSH_USER@$SSH_HOST" "cd \"\$HOME/www/anytoour.ru\" && php -d display_errors=0 -d log_errors=0 -r 'include \"$remote\";'" > "$STATE/result.json"
          export STATE
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          s=Path(os.environ['STATE']); v=json.loads((s/'result.json').read_text())
          ok=v.get('status')=='completed' and v.get('operation_id')==os.environ['OPERATION_ID'] and v.get('committed') is True and v.get('readback_verified') is True and v.get('supplier_calls')==0
          if not ok: raise SystemExit('guarded write failed')
          raw=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'database_writes':v.get('database_writes'),'supplier_calls':0,'accepted':v.get('accepted'),'coverage_before':v.get('coverage_before'),'coverage_after':v.get('coverage_after'),'readback_verified':True,'result_sha256':hashlib.sha256(raw).hexdigest()}
          (s/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-global-provider-name-star-annotation-accept-v1-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-provider-name-bridge-accept-star-annotation-2333-20260913-v1/', retention-days: 90}
