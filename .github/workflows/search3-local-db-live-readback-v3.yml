name: Search3 local DB-first live readback v3
on:
  pull_request:
    types: [opened]
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-local-db-live-readback-v3.yml'
permissions:
  contents: read
jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published bundle and DB-first endpoint
        run: |
          python3 - <<'PY'
          import html,json,re,urllib.parse,urllib.request
          base='https://anytoour.ru/_preview/search3-local-candidate/'
          owner_url=base+'poisk-turov/?from=1&country=4&dateFrom=2026-09-17&dateTo=2026-09-22&daysFrom=7&daysTill=10&count_people=2&child_count=0&stars=5'
          page=urllib.request.urlopen(owner_url,timeout=30)
          body=page.read().decode('utf-8','replace')
          assert page.status==200
          assert re.search(r'<meta\s+name=["\']robots["\'][^>]*noindex',body,re.I), 'preview must be noindex'
          scripts=[html.unescape(x) for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',body,re.I)]
          raw=next((x for x in scripts if 'bundle-v1.php' in x),None)
          assert raw, 'Search3 bundle URL missing'
          bundle_url=urllib.parse.urljoin(owner_url,raw)
          parsed=urllib.parse.urlparse(bundle_url); query=urllib.parse.parse_qs(parsed.query)
          assert query.get('type')==['js'] and query.get('scope')==['search3'], {'bundle_url':bundle_url,'query':query}
          assert 'search3-local-db-provider-v1.js' in parsed.fragment.split(','), 'DB-first owner absent from served bundle closure'
          js=urllib.request.urlopen(bundle_url,timeout=30).read().decode('utf-8','replace')
          assert 'AnyTourLocalDbProviderV1' in js, 'DB-first adapter missing from served Search3 bundle'
          params={
            'departureId':'1','countryId':'4','dateFrom':'2026-09-17','dateTo':'2026-09-22','nightsFrom':'7','nightsTo':'10','adults':'2','childs':[],
            'meal':'','hotelCategory':'5','hotelRating':'','hotelTypes':[],'hotelIds':[],'hotelServices':[],'arrivalId':'','regionIds':[],'subregionIds':[],'operatorIds':[],
            'priceFrom':'','priceTo':'','currency':'RUB','onlyCharter':'false','onlyDirect':'false'
          }
          request=urllib.request.Request(base+'data/search3-local-results-read-v1.php',data=json.dumps({'params':params},separators=(',',':')).encode(),method='POST',headers={'Content-Type':'application/json','Accept':'application/json','X-Requested-With':'AnyTourSearch3'})
          response=urllib.request.urlopen(request,timeout=30); payload=json.loads(response.read())
          assert response.status==200 and payload.get('ok') is True, payload
          result=payload['data']
          assert result['source']=='anytour-db-first-results-v1' and result['scopeVersion']==1 and result['selectionAuthority'] is False
          assert re.fullmatch(r'[a-f0-9]{64}',result['scopeDigest'])
          assert result['scope']['hotelCategory']=='5' and result['scope']['dateFrom']=='2026-09-17' and result['scope']['dateTo']=='2026-09-22'
          assert result['hotelCount']==0 and result['offerCount']==0 and result['storedOfferCount']==0 and result['withheldOfferCount']==0 and result['hotels']==[], result
          print(json.dumps({'status':'live_db_first_v3_ok','page_http':200,'noindex':True,'bundle_scope':'search3','bundle_adapter':True,'db_http':200,'hotelCount':0,'offerCount':0,'selectionAuthority':False,'supplierCalls':0,'leads':0},sort_keys=True))
          PY
