name: MATCH TV-SAMO COMMON4 fingerprint v37

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php
      - tests/hotel_match_tv_samo_common4_fingerprint_join_v37_test.php
      - .github/workflows/hotel-match-tv-samo-common4-fingerprint-join-v37.yml

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: hotel-match-tv-samo-common4-fingerprint-join-1971-20260925-v37
  cancel-in-progress: false

env:
  OP: hotel-match-tv-samo-common4-fingerprint-join-1971-20260925-v37
  BASE: c3b28595541ecb85286227aa146d70329bf324f3
  CLAIM: '5836094916'
  AMEND: '5836118630'
  FRONTIER_ARTIFACT: '10874272775'
  FRONTIER_ARCHIVE_SHA: 56c2df24d247d64a2392d137da95daee229830f9d9b52fa842fda688d27a6e23
  FRONTIER_RESULT_SHA: efaeb33f14a1a2aba4c207254be388e470636e2ad965b461a5a671c3bee72184
  FRONTIER_TARGET_SHA: 5001297e29a920acc2d565e45fec0e4d0a5b2244e0ba60a860941be882ad1c77

jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/tv-samo-common4-fingerprint-v37-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: php -l scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php
      - run: php scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php --self-test
      - run: php tests/hotel_match_tv_samo_common4_fingerprint_join_v37_test.php
      - run: |
          ! grep -E 'curl_|file_get_contents\(.*https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php

  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/tv-samo-common4-fingerprint-v37-20260925' && github.event.pull_request.head.sha == 'fb968e6d81b41c5ff208f8281db0e026b1c787c5'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authority, source and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p input/frontier terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-tv-samo-common4-fingerprint-join-v37.yml scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php tests/hotel_match_tv_samo_common4_fingerprint_join_v37_test.php "
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = "$expected"

          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AMEND" >input/amend.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          for path in ['input/claim.json','input/amend.json']:
              c=json.load(open(path))
              assert c['user']['id']==226193297 and c['author_association']=='OWNER'
              assert c['issue_url'].endswith('/issues/3419')
          body=json.load(open('input/claim.json'))['body']
          amend=json.load(open('input/amend.json'))['body']
          for x in [os.environ['OP'],'1737','operator_315','operator_342','HTTP0','safe_to_write_now=false']:
              assert x in body,x
          for x in ['sealed','$HOME/.anytoour-match/operations','<=5000','<=64MiB','bgoperator','operator_115','anex','operator_5']:
              assert x in amend,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda z:z['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion']
                      break
              time.sleep(3)
          else:
              raise SystemExit('security_not_green')
          PY

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$FRONTIER_ARTIFACT/zip"             -o input/frontier.zip
          test "$(sha256sum input/frontier.zip | awk '{print $1}')" = "$FRONTIER_ARCHIVE_SHA"
          unzip -q input/frontier.zip -d input/frontier
          result="$(find input/frontier -type f -name result.json -print -quit)"
          receipt="$(find input/frontier -type f -name receipt.json -print -quit)"
          test -n "$result"
          test -n "$receipt"
          cp "$result" input/frontier-result.json
          python3 - "$result" "$receipt" <<'PY'
          import json,hashlib,pathlib,sys,os
          r=json.load(open(sys.argv[1]));q=json.load(open(sys.argv[2]))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()==os.environ['FRONTIER_RESULT_SHA']
          assert r['operation']=='hotel-match-business-live30-frontier-plan-1971-20260925-v33'
          assert r['state']=='completed_read_only_business_live30_frontier_plan'
          assert r['non_full_triple_total']==1737
          assert r['bucket_counts']=={'tv_samo_missing_anex':777,'tv_anex_missing_samo':234,'tv_only_missing_both':726}
          assert r['target_set_sha256']==os.environ['FRONTIER_TARGET_SHA']
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          PY

          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({
              'operation':os.environ['OP'],
              'state':'reserved_before_db_read',
              'provider_http_calls':0,
              'database_writes':0,
              'mapping_writes':0,
          },sort_keys=True)+'\n')
          PY

      - name: Execute supplier-free fingerprint join
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known"
          trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY" | tr -d '\r' >"$key"
          else
            printf '%s' "$KEY" | base64 --decode >"$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T15 -t ed25519 "$HOST" >"$known" 2>/dev/null
          remote="$USER@$HOST"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"

          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\" \"\$HOME/$op/input\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/frontier-result.json "$remote:$op/input/frontier-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php "$remote:$op/payload/scripts/diagnostics/"

          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_OPERATIONS_ROOT=\"\$HOME/.anytoour-match/operations\" MATCH_FRONTIER_RESULT=\"\$HOME/$op/input/frontier-result.json\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_tv_samo_common4_fingerprint_join_v37.php\" --execute"             >terminal/remote.stdout 2>terminal/remote.stderr

          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$op/result.json\"" >terminal/result.json
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$op/receipt.json\"" >terminal/receipt.json

          python3 - <<'PY'
          import json,hashlib,pathlib
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['operation']=='hotel-match-tv-samo-common4-fingerprint-join-1971-20260925-v37'
          assert r['state']=='completed_read_only_tv_samo_common4_fingerprint_join'
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert q['readback_verified'] is True
          assert r['frontier_total']==1737
          assert r['frontier_target_sha256']=='5001297e29a920acc2d565e45fec0e4d0a5b2244e0ba60a860941be882ad1c77'
          for k in ['provider_http_calls','tourvisor_calls','samo_calls','anex_calls','andromeda_calls','database_writes','mapping_writes']:
              assert r[k]==0,(k,r[k])
          assert r['safe_to_write_now'] is False
          print(json.dumps({
              'strong_candidate_count':r['strong_candidate_count'],
              'single_direct_review_count':r['single_direct_review_count'],
              'support_only_review_count':r['support_only_review_count'],
              'shared_fingerprint_counts':r['shared_fingerprint_counts'],
              'status_counts':r['status_counts'],
              'bucket_status_counts':r['bucket_status_counts'],
              'evidence_counts':r['evidence_counts'],
              'scan':r['scan'],
          },ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-samo-common4-fingerprint-v37-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: error
