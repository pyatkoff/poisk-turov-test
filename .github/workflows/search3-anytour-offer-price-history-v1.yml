name: Search3 canonical offer price history contract

on:
  pull_request:
    branches:
      - release/search3-production-ready-v1
    paths:
      - 'v2/data/migrations/20260923-anytour-offer-price-history-v1.sql'
      - 'v2/data/anytour-offer-price-history-v1.php'
      - 'tests/anytour-offer-price-history-v1-test.php'
      - '.github/workflows/search3-anytour-offer-price-history-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anytour_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Validate append-only canonical offer price history
        env:
          TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=anytour_test;charset=utf8mb4
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: root
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/anytour-search-scope-v1.php >/dev/null
          php -l v2/data/anytour-offer-price-history-v1.php >/dev/null
          php -l tests/anytour-offer-price-history-v1-test.php >/dev/null
          php tests/anytour-offer-price-history-v1-test.php
