name: Andromeda offline protocol
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-client.php'
      - 'tests/andromeda-client-smoke.php'
      - 'app/integrations/andromeda-transport.php'
      - 'scripts/diagnostics/andromeda-access-probe.php'
      - 'tests/andromeda-transport-smoke.php'
      - '.github/workflows/andromeda-offline.yml'
      - 'scripts/diagnostics/andromeda-catalog-capture.php'
      - 'tests/andromeda-catalog-capture-smoke.php'
      - 'scripts/diagnostics/andromeda-price-probe.php'
      - 'tests/andromeda-price-smoke.php'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and offline fixtures
        run: |
          php -l app/integrations/andromeda-client.php
          php -l tests/andromeda-client-smoke.php
          php tests/andromeda-client-smoke.php
          php -l app/integrations/andromeda-transport.php
          php -l scripts/diagnostics/andromeda-access-probe.php
          php tests/andromeda-transport-smoke.php
          php -l scripts/diagnostics/andromeda-catalog-capture.php
          php tests/andromeda-catalog-capture-smoke.php
          php -l scripts/diagnostics/andromeda-price-probe.php
          php tests/andromeda-price-smoke.php
