name: Andromeda offline protocol

on:
  pull_request:
    paths:
      - '.github/workflows/andromeda-offline.yml'
      - 'app/integrations/andromeda-client.php'
      - 'tests/andromeda-client-smoke.php'

permissions:
  contents: read

concurrency:
  group: andromeda-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate private protocol and existing ANEX normalization offline
        run: |
          php -l app/integrations/andromeda-client.php
          php -l tests/andromeda-client-smoke.php
          php tests/andromeda-client-smoke.php
          php tests/anex-normalizer-smoke.php
