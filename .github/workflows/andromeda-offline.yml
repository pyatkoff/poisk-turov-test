name: Andromeda offline protocol
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-client.php'
      - 'tests/andromeda-client-smoke.php'
      - 'app/integrations/andromeda-transport.php'
      - 'scripts/diagnostics/andromeda-access-probe.php'
      - 'tests/andromeda-transport-smoke.php'
      - '.github/workflows/andromeda-offline.yml'
      - 'scripts/diagnostics/andromeda-catalog-capture.php'
      - 'tests/andromeda-catalog-capture-smoke.php'
      - 'scripts/diagnostics/andromeda-price-probe.php'
      - 'tests/andromeda-price-smoke.php'
      - 'app/integrations/andromeda-normalizer.php'
      - 'tests/andromeda-normalizer-smoke.php'
      - 'app/integrations/andromeda-offer-store.php'
      - 'app/integrations/andromeda-hotel-resolver.php'
      - 'tests/andromeda-hotel-resolver-smoke.php'
      - 'tests/andromeda-offer-store-smoke.php'
      - 'scripts/diagnostics/andromeda_hotel_evidence.py'
      - 'tests/andromeda_hotel_evidence_test.py'
      - 'scripts/diagnostics/andromeda_hotel_candidates.py'
      - 'tests/andromeda_hotel_candidates_test.py'
      - 'scripts/diagnostics/andromeda_hotel_shortlist.py'
      - 'tests/andromeda_hotel_shortlist_test.py'
      - 'v2/api-andromeda-search3-preview.php'
      - 'v2/anex-search3-preview-v1.js'
      - 'v2/catalogs-v2.js'
      - 'tests/catalogs-hydrated-hotel.test.js'
      - 'tests/anex-search3-preview.test.js'
      - 'tests/andromeda-live-search-smoke.php'
      - 'tests/andromeda-pages-smoke.php'
      - 'app/integrations/andromeda-search.php'
      - 'tests/andromeda-search-smoke.php'
      - 'reports/andromeda-hotel-shortlist-20260909.json'
permissions:
  contents: read
  actions: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint and offline fixtures
        run: |
          php -l app/integrations/andromeda-client.php
          php -l tests/andromeda-client-smoke.php
          php tests/andromeda-client-smoke.php
          php -l v2/api-andromeda-search3-preview.php
          php -l scripts/diagnostics/andromeda_preview_install.php
          php tests/andromeda-live-search-smoke.php
          php tests/andromeda-pages-smoke.php
          php tests/andromeda-search-smoke.php
          node --test tests/anex-search3-preview.test.js tests/catalogs-hydrated-hotel.test.js
          php -l app/integrations/andromeda-transport.php
          php -l scripts/diagnostics/andromeda-access-probe.php
          php tests/andromeda-transport-smoke.php
          php -l scripts/diagnostics/andromeda-catalog-capture.php
          php tests/andromeda-catalog-capture-smoke.php
          php -l scripts/diagnostics/andromeda-price-probe.php
          php tests/andromeda-price-smoke.php
          php -l app/integrations/andromeda-normalizer.php
          php tests/andromeda-normalizer-smoke.php
          php -l app/integrations/andromeda-offer-store.php
          php tests/andromeda-offer-store-smoke.php
          php -l app/integrations/andromeda-hotel-resolver.php
          php tests/andromeda-hotel-resolver-smoke.php
          python3 -B tests/andromeda_hotel_evidence_test.py
          python3 -B tests/andromeda_hotel_candidates_test.py
          python3 -B tests/andromeda_hotel_shortlist_test.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: pyatkoff/poisk-turov-test
          run-id: 34365549508
          artifact-ids: 10109677472
          merge-multiple: true
          path: ${{ runner.temp }}/real-price
      - name: Normalize pinned real offers offline
        run: php tests/andromeda-normalizer-smoke.php "$RUNNER_TEMP/real-price/price.json" "$RUNNER_TEMP/normalized.json"
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-normalized-offers
          path: ${{ runner.temp }}/normalized.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: pyatkoff/poisk-turov-test
          run-id: 34362120510
          artifact-ids: 10108261911
          merge-multiple: true
          path: ${{ runner.temp }}/saved-catalog
      - name: Build unresolved hotel evidence from pinned saved inputs
        run: |
          python3 -B scripts/diagnostics/andromeda_hotel_evidence.py \
            --normalized "$RUNNER_TEMP/normalized.json" \
            --normalized-sha256 eef484d6d879181ee478c1b050f3e972b2b1b54daf554d65f6da5e7557f975d6 \
            --catalog "$RUNNER_TEMP/saved-catalog/all.json" \
            --catalog-sha256 01030bb9e23e0c87f8bed7c50628c8f56243b89f3e55a24151430766c1576641 \
            --output "$RUNNER_TEMP/andromeda-hotel-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-hotel-evidence
          path: ${{ runner.temp }}/andromeda-hotel-evidence.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: pyatkoff/poisk-turov-test
          run-id: 34371963910
          artifact-ids: 10112277692
          merge-multiple: true
          path: ${{ runner.temp }}/saved-candidates
      - name: Assemble review queue offline from completed pinned capture
        run: |
          python3 -B scripts/diagnostics/andromeda_hotel_candidates.py review \
            --checkpoint "$RUNNER_TEMP/saved-candidates/andromeda-hotel-candidates.json" \
            --output "$RUNNER_TEMP/andromeda-hotel-review.json"
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-hotel-review
          path: ${{ runner.temp }}/andromeda-hotel-review.json
          if-no-files-found: error
      - name: Bind proposed targets to saved review without accepting mappings
        run: |
          python3 -B scripts/diagnostics/andromeda_hotel_shortlist.py \
            --review "$RUNNER_TEMP/andromeda-hotel-review.json" \
            --decisions reports/andromeda-hotel-shortlist-20260909.json \
            --output "$RUNNER_TEMP/andromeda-hotel-shortlist.json"
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-hotel-shortlist
          path: ${{ runner.temp }}/andromeda-hotel-shortlist.json
          if-no-files-found: error
