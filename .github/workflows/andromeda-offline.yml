name: Andromeda offline protocol

on:
  pull_request:
    paths:
      - '.github/workflows/andromeda-offline.yml'
      - 'app/integrations/andromeda-client.php'
      - 'app/integrations/andromeda-package-capture.php'
      - 'app/integrations/andromeda-selected-offer.php'
      - 'app/integrations/andromeda-offer-store.php'
      - 'app/integrations/andromeda-normalizer.php'
      - 'app/integrations/andromeda-hotel-resolver.php'
      - 'tests/andromeda-client-smoke.php'
      - 'tests/andromeda-package-capture-smoke.php'
      - 'tests/andromeda-selected-offer-smoke.php'
      - 'tests/andromeda-offer-store-smoke.php'

permissions:
  contents: read

concurrency:
  group: andromeda-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate private protocol and existing ANEX normalization offline
        run: |
          php -l app/integrations/andromeda-client.php
          php -l tests/andromeda-client-smoke.php
          php tests/andromeda-client-smoke.php
          php -l app/integrations/andromeda-package-capture.php
          php -l app/integrations/andromeda-selected-offer.php
          php -l tests/andromeda-package-capture-smoke.php
          php -l tests/andromeda-selected-offer-smoke.php
          php tests/andromeda-offer-store-smoke.php
          php tests/andromeda-selected-offer-smoke.php
          php tests/andromeda-package-capture-smoke.php
          php tests/anex-normalizer-smoke.php
