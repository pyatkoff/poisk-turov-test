name: INT ANEX region277 identity read v1
on:
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths: ['.github/workflows/int-anex-region277-identity-read-v1.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read identity coverage only
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/out"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/ssh/key"; fi
          chmod 600 "$RUNNER_TEMP/ssh/key"; ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          opts=(-i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh -T "${opts[@]}" "$REMOTE_USER@$HOST" 'php -d display_errors=0 -r '"'"'
            $root=realpath(getenv("HOME")."/www/anytoour.ru");require $root."/config.php";require (is_file($root."/data/db-v1.php")?$root."/data/db-v1.php":$root."/v2/data/db-v1.php");$db=v2_data_db();
            $db->exec("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ");$db->exec("SET TRANSACTION READ ONLY");$db->beginTransaction();
            $regions=[19,22,277,154,23];$out=[];
            foreach($regions as $region){
              $q=$db->prepare("SELECT COUNT(*) n,MIN(region_name) region_name,SUM(is_active=1) active FROM catalog_hotels WHERE country_id=4 AND region_id=:r");$q->execute(["r"=>$region]);$catalog=$q->fetch(PDO::FETCH_ASSOC);
              $q=$db->prepare("SELECT COUNT(*) n,SUM(m.enabled=1) enabled,SUM(m.enabled=1 AND m.approval_policy IN (\"accepted\",\"manual\")) accepted_manual FROM anex_hotel_search_mappings m JOIN catalog_hotels h ON h.id=m.catalog_hotel_id WHERE h.country_id=4 AND h.region_id=:r");$q->execute(["r"=>$region]);$maps=$q->fetch(PDO::FETCH_ASSOC);
              $q=$db->prepare("SELECT COUNT(DISTINCT o.anex_hotel_id) hotels,COUNT(*) rows,MAX(o.last_seen_utc) latest FROM anex_search_hotel_observations o JOIN catalog_hotels h ON h.id=o.last_catalog_hotel_id WHERE h.country_id=4 AND h.region_id=:r AND o.last_seen_utc>=UTC_TIMESTAMP()-INTERVAL 7 DAY");$q->execute(["r"=>$region]);$obs=$q->fetch(PDO::FETCH_ASSOC);
              $out[(string)$region]=["regionName"=>$catalog["region_name"],"catalogHotels"=>(int)$catalog["n"],"activeCatalogHotels"=>(int)$catalog["active"],"mappingRows"=>(int)$maps["n"],"enabledMappings"=>(int)$maps["enabled"],"acceptedManualMappings"=>(int)$maps["accepted_manual"],"observedAnexHotels7d"=>(int)$obs["hotels"],"observationRows7d"=>(int)$obs["rows"],"latestObservation"=>$obs["latest"]];
            }
            $db->commit();echo json_encode(["source"=>"anex-region-identity-read-v1","regions"=>$out,"supplierCalls"=>0,"databaseWrites"=>0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          '"'"'' > "$RUNNER_TEMP/out/receipt.json"
          jq -e '.supplierCalls==0 and .databaseWrites==0 and (.regions["277"]|type=="object")' "$RUNNER_TEMP/out/receipt.json" >/dev/null
          jq -c . "$RUNNER_TEMP/out/receipt.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: int-anex-region277-identity-read-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/out/receipt.json
          if-no-files-found: warn
          retention-days: 30
