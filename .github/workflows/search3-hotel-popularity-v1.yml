name: Search3 hotel popularity contract

on:
  pull_request:
    paths:
      - 'v2/data/hotel-popularity-v1.php'
      - 'v2/data/top500-anex-priority-v1.php'
      - 'app/integrations/anex-search-mapping-registry.php'
      - 'tests/top500-anex-namespace-smoke.php'
      - 'v2/data/top500-daily-plan-v1.php'
      - 'tests/top500-daily-plan-smoke.php'
      - 'tests/top500-anex-8401-regression.php'
      - 'tests/search3-top500-anex-8401.cjs'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/sales-leaders-v1.php'
      - 'diagnostics/sales_leaders_v1_test.php'
      - 'v2/prototype-search/hotel-popularity-v1.js'
      - 'v2/prototype-search/index.php'
      - 'v2/visual-search/index.php'
      - 'v2/prototype-search/index.html'
      - 'v2/prototype-search/app.js'
      - 'v2/prototype-search/styles.css'
      - 'tests/search3-prototype-hotel-popularity-v1.cjs'
      - '.github/workflows/search3-hotel-popularity-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select changed contract scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed_paths=$(mktemp)
          trap 'rm -f "$changed_paths"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          full=true
          if [[ -s "$changed_paths" ]]; then
            full=false
            while IFS= read -r -d '' path; do
              case "$path" in
                tests/top500-anex-8401-regression.php|tests/search3-top500-anex-8401.cjs|docs/project/top500-identity-audit-20261106.md|.github/workflows/search3-hotel-popularity-v1.yml) ;;
                *) full=true ;;
              esac
            done < "$changed_paths"
          fi
          printf 'full=%s\n' "$full" >> "$GITHUB_OUTPUT"
      - name: Validate unified popularity cohort
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/hotel-popularity-v1.php >/dev/null
          php -l v2/data/top-hotels-v1.php >/dev/null
          php -l v2/sales-leaders-v1.php >/dev/null
          php diagnostics/sales_leaders_v1_test.php
          php tests/top500-daily-plan-smoke.php
          php tests/top500-anex-namespace-smoke.php
          node tests/search3-prototype-hotel-popularity-v1.cjs
      - name: Validate ANEX 8401 identity boundary
        shell: bash
        run: |
          set -euo pipefail
          node tests/search3-top500-anex-8401.cjs
