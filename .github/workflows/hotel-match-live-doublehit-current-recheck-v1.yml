name: MATCH live 15 double-hit CURRENT recheck v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths:
      - .github/workflows/hotel-match-live-doublehit-current-recheck-v1.yml
permissions: {contents: read, actions: read}
concurrency: {group: match-live-doublehit-current-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-live-doublehit-current-recheck-1971-20260917-v1
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Pin retained 15-row evidence and reserve
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_live_doublehit_current_recheck_v1.php)" = 6b2f281a26649da0640227c2ed6f14269675e5cb
          test "$(git hash-object reports/hotel-match-live-residual-cross-provider-plan-20260915.json)" = 5a0d1b14f249d46270ae74b93f103b16ce130c60
          php -l scripts/diagnostics/hotel_match_live_doublehit_current_recheck_v1.php
          php scripts/diagnostics/hotel_match_live_doublehit_current_recheck_v1.php --self-test
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re
          t=pathlib.Path(os.environ['RUNNER_TEMP']); report=json.loads(pathlib.Path('reports/hotel-match-live-residual-cross-provider-plan-20260915.json').read_text())
          rows=report['double_hits']; assert len(rows)==15 and report['mass_summary']['double_hits']==15
          assert sum(x['combined_frequency'] for x in rows)==453
          assert len({x['andromeda_hotel_id'] for x in rows})==15 and len({x['anex_hotel_id'] for x in rows})==15
          manifest={'report_blob':'5a0d1b14f249d46270ae74b93f103b16ce130c60','report_schema':report['schema'],'remaining_frequency':report['mass_summary']['remaining_frequency'],'rows':rows}
          raw=(json.dumps(manifest,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); msha=hashlib.sha256(raw).hexdigest()
          src=pathlib.Path('scripts/diagnostics/hotel_match_live_doublehit_current_recheck_v1.php').read_text(); needle='__DOUBLEHIT_MANIFEST_BASE64__'; assert src.count(needle)==1
          runtime=src.replace(needle,base64.b64encode(raw).decode()); assert 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in runtime
          assert not re.search(r'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',runtime,re.I)
          (t/'runtime.php').write_text(runtime)
          out=t/os.environ['OPERATION_ID'];out.mkdir(mode=0o700)
          res={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','run_id':os.environ['GITHUB_RUN_ID'],'claim_comment_id':5707742396,'coordination_issue':2530,'queue_issue':1971,'manifest_sha256':msha,'runtime_sha256':hashlib.sha256(runtime.encode()).hexdigest(),'report_blob':manifest['report_blob'],'rows':15,'combined_frequency':453,'no_replay':True,'database_writes':0,'supplier_calls':0,'tourvisor_calls':0}
          (out/'manifest.json').write_bytes(raw);(out/'reservation.json').write_text(json.dumps(res,sort_keys=True)+'\n')
          PY
          php -l "$RUNNER_TEMP/runtime.php"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-live-doublehit-current-v1-reservation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hotel-match-live-doublehit-current-recheck-1971-20260917-v1/reservation.json
            ${{ runner.temp }}/hotel-match-live-doublehit-current-recheck-1971-20260917-v1/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: One server CURRENT read-only transaction
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID";key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key";ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$RUNNER_TEMP/runtime.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e;export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size<=8000000;b=t.extractfile(m).read();(s/m.name).write_bytes(b)
          r=json.loads((s/'result.json').read_bytes());receipt=json.loads((s/'receipt.json').read_bytes())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert receipt['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert r['operation_id']==receipt['operation_id']==os.environ['OPERATION_ID'] and r['source_sha']==receipt['source_sha']==os.environ['GITHUB_SHA']
          assert r['state']=='completed_read_only' and receipt['readback_verified'] is True and r['no_replay'] is True
          assert r['examined']==15 and r['prepared']+r['held']==15
          assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==0
          assert os.environ['REMOTE_RC']==os.environ['TAR_RC']=='0'
          summary={'operation_id':r['operation_id'],'source_sha':r['source_sha'],'state':r['state'],'examined':15,'prepared':r['prepared'],'held':r['held'],'prepared_frequency':r['prepared_frequency'],'held_frequency':r['held_frequency'],'hold_counts':r['hold_counts'],'result_sha256':receipt['result_sha256'],'read_at_utc':r['read_at_utc'],'readback_verified':True,'no_replay':True,'database_writes':0,'supplier_calls':0,'tourvisor_calls':0}
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-live-doublehit-current-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-live-doublehit-current-recheck-1971-20260917-v1/
          if-no-files-found: warn
          retention-days: 90
