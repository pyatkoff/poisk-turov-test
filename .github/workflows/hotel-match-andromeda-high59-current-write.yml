name: MATCH Andromeda high59 CURRENT guarded write

on:
  push:
    branches: ['autopilot/hotel-match-andromeda-high59-current-write-20260913']
    paths: ['.github/match-andromeda-high59-current-write-1971-20260913-v1.arm']

permissions:
  contents: read
  actions: read

concurrency:
  group: anytour-match-andromeda-high59-current-write-1971-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-andromeda-high59-current-write-1971-20260913-v1
  OUT: /tmp/match-andromeda-high59-current-write-1971

jobs:
  guarded-write:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '${{ github.sha }}'

      - name: Validate scope and immutable arm
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/match-andromeda-high59-current-write-1971-20260913-v1.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_andromeda_high59_current_write.php >/dev/null
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('scripts/diagnostics/hotel_match_andromeda_high59_current_write.php').read_text()
          assert "const MATCH_OPERATION_ID='hotel-match-andromeda-high59-current-write-1971-20260913-v1'" in p
          block=p.split('const MATCH_PAIRS=[',1)[1].split('];',1)[0]
          pairs=re.findall(r"'([0-9]+)'=>([0-9]+)",block)
          assert len(pairs)==59 and len({a for a,b in pairs})==59 and len({b for a,b in pairs})==59
          assert 'supplier_calls' in p and 'tourvisor_calls' in p
          PY
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path(os.environ['OUT'],'github-reservation.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'candidate_count':59,'state':'reserved_before_server_db_access','no_replay':True},sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        id: reservation
        with:
          name: match-andromeda-high59-current-${{ github.run_id }}-reserved
          path: '${{ env.OUT }}/github-reservation.json'
          retention-days: 90

      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '${{ steps.reservation.outputs.artifact-id }}'
          path: /tmp/match-high59-reservation-readback
          merge-multiple: true

      - name: Execute once and independently read durable receipt
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail
          cmp "$OUT/github-reservation.json" /tmp/match-high59-reservation-readback/github-reservation.json
          test -n "$KEY" && test -n "$HOST" && test -n "$USER"
          key="$RUNNER_TEMP/match-high59-key"; known="$RUNNER_TEMP/match-high59-known"; sock="$RUNNER_TEMP/match-high59.sock"; remote_tmp="/tmp/match-high59-${GITHUB_RUN_ID}.php"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          server_path="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          before="$(ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "if test -e $server_path; then printf EXISTS; else printf ABSENT; fi")"
          test "$before" = ABSENT
          scp -o ControlPath="$sock" -o ControlMaster=no scripts/diagnostics/hotel_match_andromeda_high59_current_write.php "$USER@$HOST:$remote_tmp"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "set -e; ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M '$remote_tmp'; rm -f '$remote_tmp'" > "$OUT/executor-stdout.json" 2> "$OUT/executor-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=$server_path; if test -f \"\$p/result.json\"; then cat \"\$p/result.json\"; elif test -f \"\$p/failure.json\"; then cat \"\$p/failure.json\"; else printf '{\"status\":\"unknown_do_not_replay\",\"operation_id\":\"$OPERATION_ID\"}\n'; fi" > "$OUT/server-result.json"
          rr=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=$server_path/receipt.json; if test -f \"\$p\"; then cat \"\$p\"; else printf '{}\n'; fi" > "$OUT/server-receipt.json"
          sr=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "rm -f '$remote_tmp'" >/dev/null 2>&1 || true
          set -e
          export RC="$rc" RR="$rr" SR="$sr"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def read(name):
              try:return json.loads((out/name).read_text())
              except Exception:return {}
          result=read('server-result.json'); receipt=read('server-receipt.json')
          digest=hashlib.sha256((out/'server-result.json').read_bytes()).hexdigest()
          verified=(int(os.environ['RR'])==0 and int(os.environ['SR'])==0 and result.get('status')=='committed' and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('source_sha')==os.environ['GITHUB_SHA'] and result.get('candidate_count')==59 and result.get('supplier_calls')==0 and result.get('tourvisor_calls')==0 and result.get('post_commit_readback_verified') is True and receipt.get('operation_id')==os.environ['OPERATION_ID'] and receipt.get('result_sha256')==digest and receipt.get('committed') is True and receipt.get('readback_verified') is True and receipt.get('written')==result.get('written'))
          summary={'operation_id':os.environ['OPERATION_ID'],'status':result.get('status','unknown_do_not_replay'),'executor_exit_code':int(os.environ['RC']),'receipt_verified':verified,'candidate_count':result.get('candidate_count'),'written':result.get('written'),'held':result.get('held'),'coverage':result.get('coverage'),'no_replay':True}
          (out/'summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          (out/'summary.md').write_text(f"MATCH #1971 high59 CURRENT write: status={summary['status']}; durable receipt verified={verified}; candidates={summary['candidate_count']}; DB mappings written={summary['written']}; held={summary['held']}; coverage={summary['coverage']}; operation={summary['operation_id']}; NO-REPLAY.\n")
          print((out/'summary.md').read_text(),end='')
          if not verified or int(os.environ['RC'])!=0: raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-andromeda-high59-current-${{ github.run_id }}-result
          path: '${{ env.OUT }}/'
          retention-days: 90
