name: MATCH GLOBAL coordinate review v1
on:
  push:
    branches: [ops/match-global-current-review-2333-20260913-v1]
    paths: [.github/match-global-coordinate-review-2333-20260913-v1.arm]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-global-coordinate-review-2333-20260913-v1}
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Run CURRENT coordinate review read-only
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"; printf '%s\n' '{"operation_id":"hotel-match-global-coordinate-review-2333-20260913-v1","state":"reserved_before_ssh","database_writes":0,"supplier_calls":0,"no_replay":true}' > "$RUNNER_TEMP/$OPERATION_ID/reservation.json"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path;state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(name,dep=None):
            x=P('scripts/diagnostics/'+name+'.php').read_text();x=x[5:] if x.startswith('<?php') else x;x=x.replace('declare(strict_types=1);','',1).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\n",'',1)
            if dep:x=x.replace("require_once __DIR__ . '/"+dep+".php';\n",'',1)
            return x
          parts=[body('hotel_full_catalog_reconcile'),body('hotel_match_current_bulk_review','hotel_full_catalog_reconcile'),body('hotel_match_pending_candidate_bridge_review','hotel_match_current_bulk_review'),body('hotel_match_live_priority_review','hotel_match_pending_candidate_bridge_review'),body('hotel_match_coordinate_current_review','hotel_match_live_priority_review').replace("const HCCR_OPERATION = 'hotel-match-coordinate-current-review-1971-20260911-v2';","const HCCR_OPERATION = 'hotel-match-global-coordinate-review-2333-20260913-v1';",1)]
          wrapper="$root=realpath(getcwd());require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');$out=hccr_review($db,'hotel-match-global-coordinate-review-2333-20260913-v1');$db->commit();echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";"
          source='<?php\n'+"define('FC_LIBRARY_ONLY',true);\n"+'\n'.join(parts)+'\n'+wrapper;raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='hccr-global-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600);p=subprocess.run(['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M'],input=source,text=True,capture_output=True,timeout=720)
          if p.returncode!=0:raise SystemExit(2)
          v=json.loads(p.stdout);raw_result=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(raw_result);ok=v.get('status')=='completed' and v.get('database_writes')==0 and v.get('supplier_calls')==0;state.joinpath('receipt.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if ok else 'invalid','run_id':int(os.environ['GITHUB_RUN_ID']),'result_sha256':hashlib.sha256(raw_result).hexdigest(),'stats':v.get('stats'),'coverage':v.get('coverage'),'database_writes':0,'supplier_calls':0,'no_replay':True},ensure_ascii=False,sort_keys=True)+'\n');print(json.dumps({'stats':v.get('stats'),'coverage':v.get('coverage')},ensure_ascii=False,sort_keys=True));
          if not ok:raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-global-coordinate-review-v1-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-global-coordinate-review-2333-20260913-v1/', retention-days: 90}
