name: MATCH COMMON4 user-search CURRENT frontier v2
on:
  push:
    branches: [ops/match-common4-usersearch-frontier-current-1971-20260919-v2]
    paths:
      - scripts/diagnostics/hotel_match_common4_usersearch_frontier_current_v2.php
      - .github/workflows/hotel-match-common4-usersearch-frontier-current-v2.yml
permissions: {contents: read, actions: read}
concurrency:
  group: hotel-match-common4-usersearch-frontier-current-1971-20260919-v2
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-common4-usersearch-frontier-current-1971-20260919-v2
jobs:
  current:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Validate and reserve before DB
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p result payload
          cp scripts/diagnostics/hotel_match_common4_usersearch_frontier_current_v2.php payload/frontier.php
          php -l payload/frontier.php
          php payload/frontier.php --self-test
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          p=pathlib.Path('payload/frontier.php'); src=p.read_text()
          assert 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in src
          assert not re.search(r'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',src,re.I)
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_calls':0,'no_replay':True}
          raw=json.dumps(r,sort_keys=True)+'\n'
          with pathlib.Path('result/reservation.json').open('x') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          PY
      - name: Require exact-head Security success
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
            xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['GITHUB_SHA']]
            if xs:
              r=max(xs,key=lambda x:x['id'])
              if r['status']=='completed':
                if r['conclusion']!='success':raise SystemExit('security_not_green')
                print('EXACT_SECURITY_GREEN',r['id']);break
            time.sleep(5)
          else:raise SystemExit('security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'common4-usersearch-frontier-v2-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Execute exact uploaded file in one CURRENT read-only snapshot
        shell: bash
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail; umask 077
          test -n "$KEY"; test -n "$HOST"; test -n "$USER"
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null;test -s "$known"
          o=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15); remote="$USER@$HOST"; op=".anytoour-match/operations/$OPERATION_ID"
          ssh "${o[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\"" >result/setup.stdout 2>result/setup.stderr
          scp "${o[@]}" result/reservation.json "$remote:$op/reservation.json" >result/reserve.stdout 2>result/reserve.stderr
          scp "${o[@]}" payload/frontier.php "$remote:$op/frontier.php" >result/copy.stdout 2>result/copy.stderr
          set +e
          ssh "${o[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M \"\$HOME/$op/frontier.php\"" >result/remote.stdout 2>result/remote.stderr
          rc=$?
          ssh "${o[@]}" "$remote" "tar -C \"\$HOME/$op\" -czf - reservation.json result.json receipt.json" >result/server-operation.tgz 2>>result/remote.stderr; trc=$?
          set -e; printf '{"remote":%s,"tar":%s}\n' "$rc" "$trc">result/exit-codes.json;test "$trc" -eq 0
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          p=pathlib.Path('result');s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
            assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
            for m in t.getmembers():assert m.isfile() and m.size<=50_000_000;(s/m.name).write_bytes(t.extractfile(m).read())
          r=json.loads((s/'result.json').read_bytes());q=json.loads((s/'receipt.json').read_bytes());d=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes();assert q['result_sha256']==d and q['readback_verified'] is True
          assert r['state']=='completed_read_only' and r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==r['samo_calls']==0
          assert r['unique_user_search_operator_hotel_edges']==r['accepted_same_provider_edges']+r['missing_same_provider_edges']
          assert r['missing_same_provider_edges']==len(r['missing_edges'])
          summary={k:r[k] for k in ['read_at_utc','today_moscow','raw_user_search_observation_rows','unique_user_search_operator_hotel_edges','opaque_fortuna_roulette_edges_excluded','accepted_same_provider_edges','missing_same_provider_edges','by_operator','actionable_context_groups']};summary['top_contexts']=r['actionable_contexts'][:15];summary['result_sha256']=d
          (p/'verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'common4-usersearch-frontier-v2-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
