name: Temporary Search3 shortlist differences sync
on:
  push:
    branches: [ux/search3-shortlist-differences-20260912]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-shortlist-differences-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded shortlist difference highlights
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/search3/behavior/results/shortlist.js'); s=p.read_text()
          helper="function factRows(item){return [['Вылет',displayDate(item.date)],['Ночей',String(item.nights)],['Туристы',partyLabel(item)],['Питание',item.meal],['Номер',item.room],['Размещение',item.placement||'Уточняется'],['Оператор',item.operator||'Уточняется']];}\nfunction differenceLabels(items){const rows=(Array.isArray(items)?items:[]).map(factRows),different=new Set;if(rows.length<2)return different;rows[0].forEach((pair,index)=>{const values=new Set(rows.map(row=>String(row[index]&&row[index][1]||'').replace(/\\s+/g,' ').trim().toLocaleLowerCase('ru-RU')));if(values.size>1)different.add(pair[0]);});return different;}\n"
          if 'function differenceLabels(' not in s: s=s.replace('function render(){',helper+'function render(){',1)
          s=s.replace("const list=node('div','search3-shortlist__items');saved.forEach(item=>{","const list=node('div','search3-shortlist__items'),differences=differenceLabels(saved);saved.forEach(item=>{",1)
          start="[['Вылет',displayDate(item.date)],['Ночей',String(item.nights)],['Туристы',partyLabel(item)],['Питание',item.meal],['Номер',item.room],['Размещение',item.placement||'Уточняется'],['Оператор',item.operator||'Уточняется']].forEach(pair=>{const wrap=node('div');wrap.append(node('dt','',pair[0]),node('dd','',pair[1]));facts.append(wrap);});"
          repl="factRows(item).forEach(pair=>{const wrap=node('div');if(differences.has(pair[0]))wrap.classList.add('search3-shortlist-item__fact--different');wrap.append(node('dt','',pair[0]),node('dd','',pair[1]));facts.append(wrap);});"
          s=s.replace(start,repl,1)
          if 'differenceLabels(saved)' not in s or 'search3-shortlist-item__fact--different' not in s: raise SystemExit('shortlist semantic patch did not materialize')
          p.write_text(s)
          p=Path('src/search3/styles/results-layout.css'); s=p.read_text(); marker='& .search3-shortlist-item__facts dt{color:#526078;font-size:11px}'
          css="& .search3-shortlist-item__fact--different{padding:7px 8px;border-radius:9px;background:#fff4e8;box-shadow:inset 0 0 0 1px #f2c9a4}\n& .search3-shortlist-item__fact--different dt{color:#8a4b18;font-weight:700}\n"
          if '.search3-shortlist-item__fact--different{' not in s: s=s.replace(marker,css+marker,1)
          if '.search3-shortlist-item__fact--different{' not in s: raise SystemExit('shortlist difference CSS did not materialize')
          p.write_text(s)
          p=Path('tests/search3-shortlist-trip-summary.test.js'); s=p.read_text()
          block="""\nassert.match(source, /differenceLabels\\(saved\\)/, 'comparison derives difference highlights from saved snapshots');
assert.match(source, /search3-shortlist-item__fact--different/, 'differing facts receive the comparison marker');
const differenceSandbox = {};
vm.createContext(differenceSandbox);
vm.runInContext(`${displayDateSource}; ${functionLine('plural')}; ${functionLine('partyLabel')}; ${functionLine('factRows')}; ${functionLine('differenceLabels')}; this.values = Array.from(differenceLabels([
  { date: '2026-09-12', nights: 7, adults: 2, childs: 0, meal: 'BB', room: 'Standard', placement: 'DBL', operator: 'ANEX' },
  { date: '2026-09-12', nights: 10, adults: 2, childs: 0, meal: 'AI', room: 'Standard', placement: 'DBL', operator: 'FUN&SUN' }
]));`, differenceSandbox);
assert.deepEqual(Array.from(differenceSandbox.values), ['Ночей', 'Питание', 'Оператор']);
"""
          if 'const differenceSandbox = {};' not in s: s=s.replace("console.log('search3 shortlist trip summary: ok');",block+"\nconsole.log('search3 shortlist trip summary: ok');",1)
          if 'const differenceSandbox = {};' not in s: raise SystemExit('shortlist difference test did not materialize')
          p.write_text(s)
          PY
      - name: Materialize canonical Search3 assets
        run: |
          set -euo pipefail
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          python3 -B scripts/build/search3_assets.py --write
          python3 -B scripts/build/search3_assets.py --check
          node scripts/build/search3-js/shared-runtime.cjs --check
      - name: Sync reviewed results asset hashes
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('docs/project/search3-production-import.json'); data=json.loads(p.read_text())
          for name in ('search3-results-filters-v1.js','search3-results-filters-v1.css'):
              data['assets'][name]['productionSha256']=hashlib.sha256((Path('v2')/name).read_bytes()).hexdigest()
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Focused checks
        run: |
          set -euo pipefail
          node --check src/search3/behavior/results/shortlist.js
          node tests/search3-shortlist-trip-summary.test.js
          git diff --check
      - name: Commit bounded package and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-search3-shortlist-differences-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/search3/behavior/results/shortlist.js src/search3/styles/results-layout.css tests/search3-shortlist-trip-summary.test.js v2/search3-results-filters-v1.js v2/search3-results-filters-v1.css docs/project/search3-production-import.json .github/workflows/tmp-search3-shortlist-differences-sync.yml
          git diff --cached --check
          git commit -m 'SEARCH: highlight shortlist differences'
          git push origin HEAD:ux/search3-shortlist-differences-20260912
