name: MATCH three-provider recurrence CURRENT accept v2

on:
  pull_request:
    paths:
      - 'reports/match-three-provider-recurrence-evidence-20260912.json'
      - 'scripts/diagnostics/hotel_match_three_provider_recurrence_current_review.php'
      - 'scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept.php'
      - '.github/workflows/hotel-match-three-provider-recurrence-current-accept-v1.yml'
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-three-provider-recurrence-current-accept-1971-20260912-v2.arm']

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: match-three-provider-recurrence-current-accept-1971-v2-${{ github.event_name }}
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-three-provider-recurrence-current-accept-1971-20260912-v2
  SOURCE_OPERATION_ID: hotel-match-three-provider-recurrence-current-accept-1971-20260912-v1
  EVIDENCE_SHA256: e78a092225a3d976345cc6f1eafd9d5d170bcfe34dd608c66de1cd99f843d98f
  STATE_DIR: /tmp/match-three-provider-recurrence-current-accept-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate immutable input and guarded writer source
        run: |
          set -euo pipefail
          test "$(sha256sum reports/match-three-provider-recurrence-evidence-20260912.json | awk '{print $1}')" = "$EVIDENCE_SHA256"
          php -l scripts/diagnostics/hotel_match_three_provider_recurrence_current_review.php
          php -l scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept.php
          php scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept.php --self-test
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          ev=json.loads(Path('reports/match-three-provider-recurrence-evidence-20260912.json').read_text())
          assert ev['v']==1 and ev['summary']==[10,233,71,50,41,32,13,46,40,27] and len(ev['tuples'])==71
          src=Path('scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept.php').read_text()
          assert src.count("HMRCA_OPERATION = 'hotel-match-three-provider-recurrence-current-accept-1971-20260912-v1'")==1
          assert 'SET TRANSACTION ISOLATION LEVEL REPEATABLE READ' in src and 'FOR UPDATE' in src
          assert 'hmrca_plan_locked($db,$ev)' in src and 'foreach($tuples as$t)' in src
          assert "'recurrence_alone_accepts_identity'=>false" in src and "'coordinate_conflict_auto_block_m'=>5000" in src
          assert "'post_commit_per_row_readback'=>true" in src
          assert "'HOTEL','RESORT','SPA'" in src and "'ANNEX','BEACH','GARDEN','NORTH','SOUTH'" in src
          assert 'curl_' not in src and 'stream_socket_client' not in src and 'fsockopen' not in src
          writes=re.findall(r'\b(?:INSERT\s+INTO|UPDATE\s+[A-Za-z_][A-Za-z0-9_]*)',src,re.I)
          assert len(writes)==2,writes
          print('MATCH_RECURRENCE_CURRENT_ACCEPT_V2_SOURCE_OK tuples=71 observations=233 mutations=2')
          PY

  accept:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}

      - name: Verify immutable v2 arm and prepare patched runtime package
        run: |
          set -euo pipefail
          test "$(cat .github/match-three-provider-recurrence-current-accept-1971-20260912-v2.arm)" = "$OPERATION_ID"
          mkdir -m 700 -p "$STATE_DIR/package"
          cp scripts/diagnostics/hotel_match_three_provider_recurrence_current_review.php "$STATE_DIR/package/review.php"
          cp scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept.php "$STATE_DIR/package/accept.php"
          python3 - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          root=Path(os.environ['STATE_DIR'])/'package'
          ev=Path('reports/match-three-provider-recurrence-evidence-20260912.json').read_bytes();assert hashlib.sha256(ev).hexdigest()==os.environ['EVIDENCE_SHA256']
          r=root/'review.php';s=r.read_text();marker='declare(strict_types=1);';assert s.count(marker)==1;s=s.replace(marker,marker+"\ndefine('HMRCR_EVIDENCE_B64','"+base64.b64encode(ev).decode()+"');",1);s=s.replace("if(PHP_SAPI==='cli'&&($argv[1]??'')==='--self-test'){","if(false){",1);s=s.replace("if(PHP_SAPI==='cli'&&($argv[1]??'')==='--live'){","if(false){",1);r.write_text(s)
          a=root/'accept.php';s=a.read_text();old="const HMRCA_OPERATION = 'hotel-match-three-provider-recurrence-current-accept-1971-20260912-v1';";new="const HMRCA_OPERATION = 'hotel-match-three-provider-recurrence-current-accept-1971-20260912-v2';";assert s.count(old)==1;s=s.replace(old,new);s=s.replace("require_once __DIR__ . '/hotel_match_three_provider_recurrence_current_review.php';","require_once __DIR__ . '/review.php';",1);a.write_text(s)
          PY
          php -l "$STATE_DIR/package/review.php"
          php -l "$STATE_DIR/package/accept.php"
          php "$STATE_DIR/package/accept.php" --self-test

      - name: Persist durable reservation before CURRENT DB write access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['STATE_DIR']);a=d/'package'/'accept.php';r=d/'package'/'review.php'
          value={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_write_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'source_sha':os.environ['GITHUB_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA256'],'accept_package_sha256':hashlib.sha256(a.read_bytes()).hexdigest(),'review_package_sha256':hashlib.sha256(r.read_bytes()).hexdigest(),'evidence_tuples':71,'evidence_observations':233,'transaction':'REPEATABLE READ guarded atomic write','database_writes_before_operation':0,'mapping_writes_before_operation':0,'supplier_calls':0,'tourvisor_calls':0,'anex_calls':0,'andromeda_calls':0,'booking_calls':0,'lead_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (d/'reservation.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve durable reservation
        uses: actions/upload-artifact@v4
        with:
          name: match-three-provider-recurrence-current-accept-v2-${{ github.run_id }}-reserved
          path: ${{ env.STATE_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Establish resilient SSH master and upload writer package
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE" && test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          key="$RUNNER_TEMP/hmrca2-key"; sock="$RUNNER_TEMP/hmrca2.sock"; known="$RUNNER_TEMP/hmrca2-known"; remote="/tmp/hmrca2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          connect_master(){ rm -f "$sock"; ssh -M -S "$sock" -fnNT -o ControlPersist=900 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$USER_VALUE@$HOST_VALUE"; }
          ok=0; for attempt in 1 2 3 4 5; do if connect_master; then ok=1; break; fi; sleep $((attempt*4)); done; test "$ok" = 1
          ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && { test -s data/db-v1.php || test -s v2/data/db-v1.php; } && printf HMRCA2_PREFLIGHT_OK' | grep -qx HMRCA2_PREFLIGHT_OK
          tar -C "$STATE_DIR/package" -czf - . | ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote' && mkdir -m 700 '$remote' && tar -xzf - -C '$remote'"
          ssh -S "$sock" -O check "$USER_VALUE@$HOST_VALUE" >/dev/null
          printf '%s\n' "$key" > "$RUNNER_TEMP/hmrca2-keypath";printf '%s\n' "$sock" > "$RUNNER_TEMP/hmrca2-sockpath";printf '%s\n' "$known" > "$RUNNER_TEMP/hmrca2-knownpath";printf '%s\n' "$remote" > "$RUNNER_TEMP/hmrca2-remotepath"

      - name: Revalidate all 71 tuples and atomically apply CURRENT safe delta
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$(cat "$RUNNER_TEMP/hmrca2-keypath")";sock="$(cat "$RUNNER_TEMP/hmrca2-sockpath")";known="$(cat "$RUNNER_TEMP/hmrca2-knownpath")";remote="$(cat "$RUNNER_TEMP/hmrca2-remotepath")"
          cleanup(){ ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote'" >/dev/null 2>&1 || true; ssh -S "$sock" -O exit "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1 || true; };trap cleanup EXIT
          if ! ssh -S "$sock" -O check "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1; then
            rm -f "$sock";ok=0;for attempt in 1 2 3 4 5;do if ssh -M -S "$sock" -fnNT -o ControlPersist=900 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$USER_VALUE@$HOST_VALUE";then ok=1;break;fi;sleep $((attempt*4));done;test "$ok" = 1
          fi
          set +e
          ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" "cd \"\$HOME/www/anytoour.ru\" && php -d display_errors=0 -d log_errors=1 -d memory_limit=1024M '$remote/accept.php' --live" > "$STATE_DIR/live.stdout" 2> "$STATE_DIR/live.stderr"
          rc=$?;set -e;export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          state=Path(os.environ['STATE_DIR']);out=(state/'live.stdout').read_text(errors='replace');err=(state/'live.stderr').read_text(errors='replace');prefix='HMRCA_RESULT:';lines=[x[len(prefix):] for x in out.splitlines() if x.startswith(prefix)]
          if len(lines)!=1:result={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stdout_sha256':hashlib.sha256(out.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),'stderr_tail':err[-2000:],'no_replay':True}
          else:result=json.loads(lines[0])
          raw=(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode();(state/'result.json').write_bytes(raw)
          writes=result.get('mapping_writes');valid=(int(os.environ['RC'])==0 and result.get('status')=='completed' and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('examined')==71 and result.get('input',{}).get('sha256')==os.environ['EVIDENCE_SHA256'] and result.get('committed') is True and isinstance(writes,int) and writes>=0 and result.get('database_writes')==writes and result.get('post_commit_readback_count')==writes and all(result.get(k)==0 for k in ['supplier_calls','tourvisor_calls','anex_calls','andromeda_calls','booking_calls','lead_calls']) and result.get('historical_operations_replayed') is False)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed' if valid else 'unknown','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA256'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':writes if isinstance(writes,int) else None,'mapping_writes':writes if isinstance(writes,int) else None,'post_commit_readback_count':result.get('post_commit_readback_count'),'supplier_calls':result.get('supplier_calls',0),'no_replay':True};(state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          before=result.get('coverage_before',{});after=result.get('coverage_after',{});accepted=result.get('accepted',{});summary=[f"MATCH #1971 recurrence CURRENT writer `{os.environ['OPERATION_ID']}`: **{receipt['state']}** / NO-REPLAY. Run `{os.environ['GITHUB_RUN_ID']}`, source `{os.environ['GITHUB_SHA']}`.",f"Re-read/revalidated all **71** synchronized tuples / **233** observations inside one CURRENT REPEATABLE READ transaction. Planned safe **{result.get('planned_safe',0)}**; committed mappings **{writes if isinstance(writes,int) else 'unknown'}**; post-COMMIT readback **{result.get('post_commit_readback_count','unknown')}/{writes if isinstance(writes,int) else 'unknown'}**. Supplier/Tourvisor/ANEX/Andromeda calls 0."]
          rows=[]
          for provider in ('anex','andromeda'):
            for x in accepted.get(provider,[]):rows.append(f"{provider}:{x.get('external_id')}→local/TV{x.get('target')} ({x.get('observation_count',0)} obs/{x.get('distinct_date_count',0)} dates)")
          if rows:summary.append('Committed identities: '+', '.join(rows)+'.')
          if before or after:summary.append(f"Coverage DB readback: ANEX links {before.get('anex_links')}→{after.get('anex_links')}; Andromeda accepted {before.get('andromeda_accepted')}→{after.get('andromeda_accepted')}, pending {before.get('andromeda_pending')}→{after.get('andromeda_pending')}.")
          (state/'summary.md').write_text('\n'.join(summary)+'\n');print('\n'.join(summary))
          if not valid:raise SystemExit(2)
          PY

      - name: Preserve immutable result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-three-provider-recurrence-current-accept-v2-${{ github.run_id }}-final
          path: |
            ${{ env.STATE_DIR }}/reservation.json
            ${{ env.STATE_DIR }}/result.json
            ${{ env.STATE_DIR }}/receipt.json
            ${{ env.STATE_DIR }}/summary.md
            ${{ env.STATE_DIR }}/live.stderr
          if-no-files-found: warn
          retention-days: 90
      - name: Record sanitized MATCH result
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', ARTIFACT_ID: '${{ steps.artifact.outputs.artifact-id }}'}
        run: |
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE_DIR/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE_DIR/summary.md"
      - name: Remove local key
        if: always()
        run: rm -f "$RUNNER_TEMP/hmrca2-key" "$RUNNER_TEMP/hmrca2-keypath" "$RUNNER_TEMP/hmrca2-sockpath" "$RUNNER_TEMP/hmrca2-knownpath" "$RUNNER_TEMP/hmrca2-remotepath"