name: Publish checked Andromeda projection
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type publish-andromeda-projection-1863"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: anytoour-andromeda-projection-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check explicit invocation and pinned CI
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('Do not replay an unknown publication; inspect its checkpoint.');
            if (context.payload.inputs.confirmation !== 'publish-andromeda-projection-1863') throw new Error('Confirmation mismatch.');
            const gates = [
              [34463350468, 'ac9f16063deadb3b7b2e4fb665c7b51668fe4c6a'],
              [34463350411, 'ac9f16063deadb3b7b2e4fb665c7b51668fe4c6a'],
              [34464751692, 'c816582ab356a191a1c9ebc1cae313f57b3fb32b'],
              [34464751737, 'c816582ab356a191a1c9ebc1cae313f57b3fb32b']
            ];
            for (const [run_id, sha] of gates) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.head_sha !== sha || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error('Pinned CI gate failed: ' + run_id);
              }
            }
      - uses: actions/checkout@v4
        with:
          ref: c816582ab356a191a1c9ebc1cae313f57b3fb32b
          path: publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ac9f16063deadb3b7b2e4fb665c7b51668fe4c6a
          path: candidate
          persist-credentials: false
      - name: Publish only the checked API file
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 -B publisher/scripts/diagnostics/andromeda_projection_publish.py candidate/v2/api-andromeda-search3-preview.php helper
      - name: Preserve publication checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-projection-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/andromeda-projection-publication/
          if-no-files-found: ignore
          retention-days: 14
