name: INT inspect mass ANEX grouping through published local reader

on:
  push:
    branches: ['ops/int-anex-mass-reader-readback-20260918-v1']
    paths: ['.github/workflows/int-anex-mass-reader-readback-v1.yml']

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect published mass-scope grouping
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"params":{"departureId":"1","countryId":"4","dateFrom":"2026-09-19","dateTo":"2026-10-09","nightsFrom":7,"nightsTo":7,"adults":2,"childs":[],"meal":"7","hotelCategory":"","hotelRating":"","hotelTypes":[],"hotelIds":[],"hotelServices":[],"arrivalId":"","regionIds":[],"subregionIds":[],"operatorIds":[],"priceFrom":"","priceTo":"","currency":"RUB","onlyCharter":false,"onlyDirect":false}}
          JSON
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/result/raw.json" -w '%{http_code}'             -H 'Content-Type: application/json' -H 'X-Requested-With: AnyTourSearch3'             --data-binary @"$RUNNER_TEMP/request.json"             'https://anytoour.ru/_preview/search3-local-candidate/data/search3-local-results-read-v1.php')"
          python3 - "$code" <<'PY'
          import json,sys,os,collections
          d=json.load(open(os.environ['RUNNER_TEMP']+'/result/raw.json',encoding='utf-8'))
          assert int(sys.argv[1])==200 and d.get('ok') is True
          x=d['data']; legacy=set(); canon=set(); per_canon=[]; legacy_per_canon=[]
          for h in x.get('hotels',[]):
              canon.add(h.get('anytourHotelId'))
              ls=set()
              for o in h.get('offers',[]):
                  if o.get('provider')=='anex':
                      legacy.add(o.get('legacyHotelId')); ls.add(o.get('legacyHotelId'))
              per_canon.append(len([o for o in h.get('offers',[]) if o.get('provider')=='anex']))
              legacy_per_canon.append(len(ls))
          out={
            'http':200,'matchMode':x.get('matchMode'),'hotelCount':x.get('hotelCount'),
            'offerCount':x.get('offerCount'),'anexOffers':(x.get('providerOfferCounts') or {}).get('anex',0),
            'uniqueCanonicalHotels':len([v for v in canon if v is not None]),
            'uniqueLegacyHotels':len([v for v in legacy if v is not None]),
            'offersPerCanonicalMin':min(per_canon) if per_canon else 0,
            'offersPerCanonicalMax':max(per_canon) if per_canon else 0,
            'legacyIdsPerCanonicalMin':min(legacy_per_canon) if legacy_per_canon else 0,
            'legacyIdsPerCanonicalMax':max(legacy_per_canon) if legacy_per_canon else 0,
            'withheldOfferCount':x.get('withheldOfferCount')
          }
          json.dump(out,open(os.environ['RUNNER_TEMP']+'/result/result.json','w'),sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: int-anex-mass-grouping-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          retention-days: 14
