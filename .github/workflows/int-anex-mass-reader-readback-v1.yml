name: INT read current ANEX and SAMO DB-first scopes

on:
  push:
    branches: ['ops/int-anex-mass-reader-readback-20260918-v1']
    paths: ['.github/workflows/int-anex-mass-reader-readback-v1.yml']

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query published DB-first endpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,tempfile,os
          endpoint='https://anytoour.ru/_preview/search3-local-candidate/data/search3-local-results-read-v1.php'
          scopes=[
            ('anex_regular_charter',{'departureId':'1','countryId':'4','dateFrom':'2026-10-13','dateTo':'2026-10-19','nightsFrom':7,'nightsTo':7,'adults':2,'childs':[],'meal':'7'}),
            ('samo_verified',{'departureId':'1','countryId':'4','dateFrom':'2026-10-25','dateTo':'2026-10-25','nightsFrom':7,'nightsTo':7,'adults':2,'childs':[],'meal':'7'}),
          ]
          base={'hotelCategory':'','hotelRating':'','hotelTypes':[],'hotelIds':[],'hotelServices':[],'arrivalId':'','regionIds':[],'subregionIds':[],'operatorIds':[],'priceFrom':'','priceTo':'','currency':'RUB','onlyCharter':False,'onlyDirect':False}
          out={}
          for name,p in scopes:
              params=base|p
              body=json.dumps({'params':params},separators=(',',':'))
              cp=subprocess.run(['curl','-sS','--max-time','30','-H','Content-Type: application/json','-H','X-Requested-With: AnyTourSearch3','--data-binary',body,endpoint],capture_output=True,text=True,check=True)
              d=json.loads(cp.stdout)
              rec={'ok':d.get('ok')}
              if d.get('ok') is True:
                  x=d['data']; states={}; providers=x.get('providerOfferCounts') or {}
                  for h in x.get('hotels',[]):
                      for o in h.get('offers',[]):
                          listing=o.get('listing') or o.get('offer') or {}
                          st=listing.get('listingPriceState')
                          if st: states[st]=states.get(st,0)+1
                  rec.update({'matchMode':x.get('matchMode'),'hotelCount':x.get('hotelCount'),'offerCount':x.get('offerCount'),'storedOfferCount':x.get('storedOfferCount'),'withheldOfferCount':x.get('withheldOfferCount'),'providerOfferCounts':providers,'listingStates':states})
              else: rec['error']=d.get('error')
              out[name]=rec
          print(json.dumps(out,sort_keys=True))
          os.makedirs(os.environ['RUNNER_TEMP']+'/result',exist_ok=True)
          json.dump(out,open(os.environ['RUNNER_TEMP']+'/result/result.json','w'),sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: int-current-db-first-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          retention-days: 14
