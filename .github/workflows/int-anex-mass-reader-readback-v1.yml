name: INT read mass ANEX scope through published local reader

on:
  push:
    branches: ['ops/int-anex-mass-reader-readback-20260918-v1']
    paths: ['.github/workflows/int-anex-mass-reader-readback-v1.yml']

permissions:
  contents: read

jobs:
  readback:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.ref == 'refs/heads/ops/int-anex-mass-reader-readback-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST exact mass scope to published DB-first endpoint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          cat > "$RUNNER_TEMP/request.json" <<'JSON'
          {"params":{"departureId":"1","countryId":"4","dateFrom":"2026-09-19","dateTo":"2026-10-09","nightsFrom":7,"nightsTo":7,"adults":2,"childs":[],"meal":"7","hotelCategory":"","hotelRating":"","hotelTypes":[],"hotelIds":[],"hotelServices":[],"arrivalId":"","regionIds":[],"subregionIds":[],"operatorIds":[],"priceFrom":"","priceTo":"","currency":"RUB","onlyCharter":false,"onlyDirect":false}}
          JSON
          code="$(curl -sS --max-time 30 -o "$RUNNER_TEMP/result/raw.json" -w '%{http_code}'             -H 'Content-Type: application/json'             -H 'X-Requested-With: AnyTourSearch3'             --data-binary @"$RUNNER_TEMP/request.json"             'https://anytoour.ru/_preview/search3-local-candidate/data/search3-local-results-read-v1.php')"
          python3 - "$code" <<'PY'
          import json,sys,os
          code=int(sys.argv[1]); p=os.environ['RUNNER_TEMP']+'/result/raw.json'
          d=json.load(open(p,encoding='utf-8'))
          out={'http':code,'ok':d.get('ok')}
          if d.get('ok') is True:
              x=d['data']
              out.update({
                'matchMode':x.get('matchMode'),
                'hotelCount':x.get('hotelCount'),
                'offerCount':x.get('offerCount'),
                'storedOfferCount':x.get('storedOfferCount'),
                'withheldOfferCount':x.get('withheldOfferCount'),
                'providerOfferCounts':x.get('providerOfferCounts'),
                'selectionAuthority':x.get('selectionAuthority'),
              })
          else:
              out['error']=d.get('error')
          json.dump(out,open(os.environ['RUNNER_TEMP']+'/result/result.json','w'),sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          assert code==200 and d.get('ok') is True, out
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-anex-mass-reader-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 14
