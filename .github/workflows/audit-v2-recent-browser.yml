name: Audit V2 recent browser traffic

# Paid/public traffic analysis is intentionally disabled during the pre-traffic
# 9/10 product-quality phase. Re-enable only after the owner explicitly starts traffic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-pretraffic:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-traffic mode
        run: echo "Traffic analysis is disabled until paid/public traffic is explicitly enabled."
