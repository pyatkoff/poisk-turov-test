name: Build AnyTour Yandex country feeds

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/build-yandex-country-feeds-v1.php'
      - '.github/workflows/build-yandex-country-feeds.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/build-yandex-country-feeds-v1.php'
      - '.github/workflows/build-yandex-country-feeds.yml'
  workflow_run:
    workflows: ['Collect AnyTour tour observations']
    types: [completed]
  schedule:
    - cron: '25 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: anytour-yandex-country-feeds
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate feed builder
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/build-yandex-country-feeds-v1.php
          grep -Fq "s.page_type='country'" v2/data/build-yandex-country-feeds-v1.php
          grep -Fq "?from=" v2/data/build-yandex-country-feeds-v1.php
          grep -Fq "&country=" v2/data/build-yandex-country-feeds-v1.php
          grep -Fq "seo_offer_snapshots" v2/data/build-yandex-country-feeds-v1.php
          echo ANYTOUR_YANDEX_FEED_TOOLING_OK

  production:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Build production feeds from snapshots
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          root='~/www/anytoour.ru'
          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data" "$HOME/www/anytoour.ru/feed/generated" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" v2/data/db-v1.php v2/data/build-yandex-country-feeds-v1.php "$remote:$root/data/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            php -l \"\$HOME/www/anytoour.ru/data/build-yandex-country-feeds-v1.php\" >/dev/null
            php \"\$HOME/www/anytoour.ru/data/build-yandex-country-feeds-v1.php\" --output-dir=\"\$HOME/www/anytoour.ru/feed/generated\"
            test -s \"\$HOME/www/anytoour.ru/feed/generated/countries.yml\"
            grep -Fq '<yml_catalog' \"\$HOME/www/anytoour.ru/feed/generated/countries.yml\"
            test -s \"\$HOME/www/anytoour.ru/feed/generated/manifest.json\"
            php -r '\$m=json_decode(file_get_contents(getenv("HOME")."/www/anytoour.ru/feed/generated/manifest.json"),true,512,JSON_THROW_ON_ERROR); if((int)(\$m["rows"]??0)<=0) {fwrite(STDERR,"YANDEX_COUNTRY_FEEDS_EMPTY\\n"); exit(1);} echo "YANDEX_COUNTRY_FEEDS_NONEMPTY rows=".(int)\$m["rows"]." files=".count(\$m["files"]??[])."\\n";'
          "
