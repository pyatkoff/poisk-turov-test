name: MATCH SAMO live30 COMMON4 retry v2
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_samo_live30_common4_retry_v2.php'
      - 'tests/hotel_match_samo_live30_common4_retry_v2_test.php'
      - '.github/workflows/hotel-match-samo-live30-common4-retry-v2.yml'
permissions: {contents: read, actions: read, issues: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l scripts/diagnostics/hotel_match_samo_live30_common4_retry_v2.php
      - run: php scripts/diagnostics/hotel_match_samo_live30_common4_retry_v2.php --self-test
      - run: php tests/hotel_match_samo_live30_common4_retry_v2_test.php
      - run: "! grep -E 'INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\\(' scripts/diagnostics/hotel_match_samo_live30_common4_retry_v2.php"
