name: MATCH ANEX public safe apply v1
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-public-safe-apply-v1.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: match-anex-public-safe-apply-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-public-safe-apply-1971-20260914-v1
  SOURCE_EVIDENCE_RUN_ID: '34835601806'
  SOURCE_EVIDENCE_ARTIFACT: match-anex-observed-public-evidence-v1-result
  SOURCE_RECONCILE_RUN_ID: '34835995570'
  SOURCE_RECONCILE_ARTIFACT: match-anex-public-evidence-current-reconcile-v2-result
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '${{ github.sha }}'
      - name: Reserve immutable write operation before SSH
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","source_evidence_run_id":%s,"source_reconcile_run_id":%s,"state":"reserved_before_ssh","database_writes":"unknown_until_receipt","mapping_table":"anex_hotel_search_mappings","historical_operations_replayed":false,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_EVIDENCE_RUN_ID" "$SOURCE_RECONCILE_RUN_ID" >"$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: match-anex-public-safe-apply-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-public-safe-apply-1971-20260914-v1/reservation.json
          retention-days: 90
      - name: Download immutable source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-evidence" "$RUNNER_TEMP/source-reconcile"
          gh run download "$SOURCE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_EVIDENCE_ARTIFACT" -D "$RUNNER_TEMP/source-evidence"
          gh run download "$SOURCE_RECONCILE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_RECONCILE_ARTIFACT" -D "$RUNNER_TEMP/source-reconcile"
          test -s "$RUNNER_TEMP/source-evidence/evidence.json"
          test -s "$RUNNER_TEMP/source-reconcile/reconcile.json"
          test -s "$RUNNER_TEMP/source-reconcile/receipt.json"
      - name: Revalidate CURRENT state, apply SAFE mappings atomically, and read back
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shlex,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          ev=json.loads((Path(os.environ['RUNNER_TEMP'])/'source-evidence'/'evidence.json').read_text())
          rec=json.loads((Path(os.environ['RUNNER_TEMP'])/'source-reconcile'/'reconcile.json').read_text())
          if ev.get('status')!='completed' or rec.get('status')!='completed' or rec.get('database_writes')!=0 or rec.get('mapping_writes')!=0: raise RuntimeError('source_contract')
          details={}
          for row in ev.get('matched',[]):
              hits=row.get('hits') or []
              if hits and (hits[0].get('detail') or {}).get('inc')==row.get('anex_hotel_id'): details[int(row['anex_hotel_id'])]=hits[0]['detail']
          proposals=[]
          for row in rec.get('rows',[]):
              if row.get('bucket')!='safe': continue
              sid=int(row['anex_hotel_id']); d=details.get(sid); safe=row.get('safe') or {}; target=safe.get('target') or {}
