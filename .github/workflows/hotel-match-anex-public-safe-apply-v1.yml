              return t.replace('declare(strict_types=1);','',1)
          helper=body(helper)
          wrapper=r'''
          function aps_similarity($a,$b): array {$l=array_fill_keys(array_unique(fc_tokens($a,true)),true);$r=array_fill_keys(array_unique(fc_tokens($b,true)),true);$shared=count(array_intersect_key($l,$r));$union=count($l+$r);return [$union?$shared/$union:0.0,$shared];}
          function aps_qualifiers(array $names): array {$q=['annex'=>1,'beach'=>1,'garden'=>1,'north'=>1,'south'=>1];$o=[];foreach($names as $n)foreach(fc_tokens($n,false) as $t)if(isset($q[$t]))$o[$t]=true;return array_keys($o);}
          function aps_has_qualifiers(array $qs,array $targets): bool {if(!$qs)return true;$seen=[];foreach($targets as $n)foreach(fc_tokens($n,false) as $t)$seen[$t]=true;foreach($qs as $q)if(!isset($seen[$q]))return false;return true;}
          function aps_star($v): ?int {return preg_match('/([1-5])/',(string)$v,$m)?(int)$m[1]:null;}
          function aps_best_name(array $sourceNames,array $targetNames): array {$s=0.0;$sh=0;$sn='';$tn='';foreach($sourceNames as $a)foreach($targetNames as $b){[$x,$y]=aps_similarity($a,$b);if($x>$s||($x===$s&&$y>$sh)){$s=$x;$sh=$y;$sn=$a;$tn=$b;}}return ['score'=>$s,'shared'=>$sh,'source_name'=>$sn,'target_name'=>$tn];}
          $payload=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR);
          $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper');require_once $dbHelper;
          $db=v2_data_db();fc_require_tables($db);$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET SESSION innodb_lock_wait_timeout=20');$before=fc_coverage($db);$writes=[];$skipped=[];
          try{$db->beginTransaction();[$hotels,$names,$strict,$broad,$scope]=fc_catalog($db);$byCountry=[];foreach($hotels as $hid=>$h)$byCountry[(int)$h['country_id']][]=(int)$hid;
            $manual=array_fill_keys(array_map('intval',$db->query('SELECT anex_hotel_id FROM anex_hotel_decisions ORDER BY anex_hotel_id FOR UPDATE')->fetchAll(PDO::FETCH_COLUMN)),true);$existing=array_fill_keys(array_map('intval',$db->query('SELECT anex_hotel_id FROM anex_hotel_search_mappings ORDER BY anex_hotel_id FOR UPDATE')->fetchAll(PDO::FETCH_COLUMN)),true);$excluded=[];foreach($db->query('SELECT anex_hotel_id,catalog_hotel_id FROM anex_review_pair_exclusions ORDER BY anex_hotel_id,catalog_hotel_id FOR UPDATE')->fetchAll(PDO::FETCH_ASSOC) as $x)$excluded[(int)$x['anex_hotel_id']][(int)$x['catalog_hotel_id']]=true;
            $insert=$db->prepare("INSERT INTO anex_hotel_search_mappings(anex_hotel_id,catalog_hotel_id,match_class,scope,approval_policy,source_row_digest,mapping_digest,enabled) VALUES(?,?,'strong_candidate','preview',?,?,?,1)");
            foreach($payload as $p){$id=(int)$p['anex_hotel_id'];$country=(int)$p['country_id'];$target=(int)$p['expected_target'];if((int)$p['public_inc']!==$id)throw new RuntimeException('public_inc_contract');if(isset($manual[$id])){$skipped[]=['anex_hotel_id'=>$id,'reason'=>'manual_decision_exists'];continue;}if(isset($existing[$id])){$skipped[]=['anex_hotel_id'=>$id,'reason'=>'mapping_exists'];continue;}if(isset($excluded[$id][$target])){$skipped[]=['anex_hotel_id'=>$id,'reason'=>'pair_exclusion_exists'];continue;}if(!isset($hotels[$target])||(int)$hotels[$target]['country_id']!==$country)throw new RuntimeException('target_current_contract');
              $method=(string)$p['expected_method'];$qs=aps_qualifiers($p['source_names']);if(!aps_has_qualifiers($qs,$names[$target]??[]))throw new RuntimeException('qualifier_guard_changed');$validated=false;$validation=[];
              if($method==='baseline_safe'){$strictTarget=fc_resolve($strict,$country,$p['source_names'],false);$broadTarget=fc_resolve($broad,$country,$p['source_names'],true);if($strictTarget===$target){$validated=true;$validation=['rule'=>'current_unique_strict'];}elseif($broadTarget===$target){$d=fc_dist($p['latitude'],$p['longitude'],$hotels[$target]['latitude'],$hotels[$target]['longitude']);$place=fc_place($p['source_places'],[$hotels[$target]['region_name'],$hotels[$target]['subregion_name']]);if(($d!==null&&$d<=1000)||$place){$validated=true;$validation=['rule'=>'current_unique_broad_plus_geo','distance_m'=>$d===null?null:(int)round($d),'place_match'=>$place];}}}
              elseif($method==='coord_name_safe'){$rank=[];foreach($byCountry[$country]??[] as $hid){$d=fc_dist($p['latitude'],$p['longitude'],$hotels[$hid]['latitude'],$hotels[$hid]['longitude']);if($d===null||$d>5000)continue;$bn=aps_best_name($p['source_names'],$names[$hid]??[]);$rank[]=['id'=>$hid,'score'=>$bn['score'],'shared'=>$bn['shared'],'distance_m'=>$d,'qualifier_ok'=>aps_has_qualifiers($qs,$names[$hid]??[])];}usort($rank,static fn($a,$b)=>$b['score']<=>$a['score']?:$b['shared']<=>$a['shared']?:$a['distance_m']<=>$b['distance_m']?:$a['id']<=>$b['id']);$top=$rank[0]??null;$second=$rank[1]??null;if($top&&$top['id']===$target&&$top['qualifier_ok']){$margin=$top['score']-($second['score']??0.0);$d=(float)$top['distance_m'];$s=(float)$top['score'];$sh=(int)$top['shared'];$ok=($d<=100&&$s>=0.55&&$sh>=2&&$margin>=0.15)||($d<=500&&$s>=0.70&&$sh>=2&&$margin>=0.20)||($d<=2000&&$s>=0.90&&$sh>=2&&$margin>=0.15);$ss=aps_star($p['public_star']);$ts=$hotels[$target]['category']===null?null:(int)$hotels[$target]['category'];$starDelta=($ss!==null&&$ts!==null)?abs($ss-$ts):null;if($starDelta!==null&&$starDelta>=2)$ok=false;if($ok){$validated=true;$validation=['rule'=>'current_public_coord_plus_name_large_margin','score'=>$s,'shared'=>$sh,'margin'=>round($margin,6),'distance_m'=>(int)round($d),'star_delta'=>$starDelta];}}}
              else throw new RuntimeException('unexpected_method');
              if(!$validated)throw new RuntimeException('safe_revalidation_failed_'.$id);
              $sourceDigest=fc_hash(['anex_public_info_inc_v1',$id,$p['public_slug'],$p['source_names'],$p['source_places'],$p['latitude'],$p['longitude'],$p['public_star']]);$mappingDigest=fc_hash(['hotel-match-anex-public-safe-apply-1971-20260914-v1',$id,$target,$method,$validation]);$insert->execute([$id,$target,FC_POLICY,$sourceDigest,$mappingDigest]);if($insert->rowCount()!==1)throw new RuntimeException('insert_count');$existing[$id]=true;$writes[]=['anex_hotel_id'=>$id,'catalog_hotel_id'=>$target,'method'=>$method,'validation'=>$validation,'source_row_digest'=>$sourceDigest,'mapping_digest'=>$mappingDigest];
            }$db->commit();
          }catch(Throwable $e){if($db->inTransaction())$db->rollBack();throw $e;}
          $readback=[];$read=$db->prepare("SELECT anex_hotel_id,catalog_hotel_id,match_class,scope,approval_policy,source_row_digest,mapping_digest,enabled FROM anex_hotel_search_mappings WHERE anex_hotel_id=?");foreach($writes as $w){$read->execute([$w['anex_hotel_id']]);$r=$read->fetch(PDO::FETCH_ASSOC);if(!$r||(int)$r['catalog_hotel_id']!==$w['catalog_hotel_id']||(int)$r['enabled']!==1||$r['scope']!=='preview'||$r['approval_policy']!==FC_POLICY||$r['source_row_digest']!==$w['source_row_digest']||$r['mapping_digest']!==$w['mapping_digest'])throw new RuntimeException('post_commit_readback_failed_'.$w['anex_hotel_id']);$readback[]=$r;}
          $after=fc_coverage($db);echo fc_json(['status'=>'completed','operation_id'=>'hotel-match-anex-public-safe-apply-1971-20260914-v1','state'=>'committed_and_read_back','source_proposals'=>count($payload),'database_writes'=>count($writes),'mapping_writes'=>count($writes),'writes'=>$writes,'skipped'=>$skipped,'readback'=>$readback,'coverage_before'=>$before,'coverage_after'=>$after,'guards'=>['public_info_inc_equals_anex_hotel_id'=>true,'current_catalog_revalidated_in_transaction'=>true,'manual_decisions_overwritten'=>false,'existing_mappings_overwritten'=>false,'pair_exclusions_overwritten'=>false,'coordinate_conflict_auto_block_m'=>5000,'meaningful_qualifiers_required'=>['annex','beach','garden','north','south'],'star_delta_ge_2_blocks_new_fuzzy'=>true,'post_commit_per_row_readback'=>true,'historical_operations_replayed'=>false,'no_replay'=>true]]),"\n";
