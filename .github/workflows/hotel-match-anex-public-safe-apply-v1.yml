          print(json.dumps({'mapping_writes':result.get('mapping_writes'),'writes':result.get('writes'),'skipped':result.get('skipped'),'readback':result.get('readback'),'coverage_before':result.get('coverage_before'),'coverage_after':result.get('coverage_after')},ensure_ascii=False))
