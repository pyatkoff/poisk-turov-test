name: SEARCH condition mappings current read-only audit
'on':
  pull_request:
    types: [opened]
    branches: [release/search3-production-ready-v1]
    paths:
      - scripts/diagnostics/search3_condition_mapping_current_audit_v2.php
      - .github/workflows/search3-condition-mapping-current-audit-v2.yml
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: search3-condition-mapping-current-audit-3353-20260921-v2, cancel-in-progress: false}
env:
  OPERATION_ID: search3-condition-mapping-current-audit-3353-20260921-v2
  BASE_SHA: 1ea0e5dc06b3d028288c4a913f4509e4de8cba4b
  SCRIPT_PATH: scripts/diagnostics/search3_condition_mapping_current_audit_v2.php
  CLAIM: '5765089506'
  CLAIM_SHA256: 19b4df46ff79561ab8aab681f986f52942f6e58756ce69b87630cfff51d7ecba
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate source and owner claim
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir input reservation terminal
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | wc -l)" = 2
          php -l "$SCRIPT_PATH"; php "$SCRIPT_PATH" --self-test
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import hashlib,json,os
          c=json.load(open('input/claim.json'))
          assert c['id']==int(os.environ['CLAIM']) and c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert hashlib.sha256(c['body'].encode()).hexdigest()==os.environ['CLAIM_SHA256']
          assert os.environ['OPERATION_ID'] in c['body'] and 'READ ONLY' in c['body']
          PY
          sha256sum "$SCRIPT_PATH" | cut -d' ' -f1 > input/script.sha
      - name: Reserve before DB access
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_db','source_sha':os.environ['HEAD_SHA'],'script_sha256':pathlib.Path('input/script.sha').read_text().strip(),'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'provider_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True}
          pathlib.Path('reservation/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - name: Persist reservation to canonical coordination
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          sha=$(sha256sum reservation/reservation.json | cut -d' ' -f1)
          gh api "repos/$GITHUB_REPOSITORY/issues/2530/comments" --method POST -f body="RESERVATION $OPERATION_ID source=$HEAD_SHA sha256=$sha state=reserved_before_db no_replay=1 database_writes=0 mapping_writes=0 provider_calls=0"
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD_SHA']+'&per_page=100'
          for _ in range(60):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(q,timeout=30) as f:r=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard']
              if r and max(r,key=lambda x:x['id'])['status']=='completed':
                  assert max(r,key=lambda x:x['id'])['conclusion']=='success';break
              time.sleep(5)
          else: raise SystemExit('security_not_green')
          PY
      - name: Execute one read-only CURRENT inspection
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          remote="$USER@$HOST"; op=".anytoour-search/operations/$OPERATION_ID"; script="${SCRIPT_PATH##*/}"
          ssh "${opts[@]}" "$remote" "set -eu; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/.anytoour-search/operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""
          scp "${opts[@]}" "$SCRIPT_PATH" reservation/reservation.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" SEARCH3_OPERATION_DIR=\"\$HOME/$op\" SEARCH3_SOURCE_SHA='$HEAD_SHA' php \"\$HOME/$op/payload/$script\" --execute" > terminal/remote.stdout 2> terminal/remote.stderr
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\" && tar -czf - -- *.json" > terminal/server.tgz
      - name: Verify receipt
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              assert set(t.getnames())=={'started.json','result.json','receipt.json'}
              for n in t.getnames(): pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['state']==q['state']=='completed_read_only' and r['source_sha']==os.environ['HEAD_SHA']
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert all(r[k]==0 for k in ['provider_calls','database_writes','mapping_writes','site_file_writes'])
          print(json.dumps({'meal_rows':len(r['meal_mapping_rows']),'mapping_counts':r['mapping_counts'],'schema_tables':list(r['dictionary_schema'])},ensure_ascii=False))
          PY
      - name: Persist terminal summary to canonical coordination
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          if test -f terminal/result.json; then
            sha=$(sha256sum terminal/result.json | cut -d' ' -f1)
            summary=$(python3 - <<'PY'
          import collections,json
          r=json.load(open('terminal/result.json')); g=collections.Counter((x['namespace'],x['key_kind'],str(x['meal_id']),x['state']) for x in r['meal_mapping_rows'])
          print(json.dumps({'meal_counts':{'|'.join(k):v for k,v in g.items()},'schema_tables':list(r['dictionary_schema']),'schema':r['dictionary_schema'],'runtime_files':r['runtime_files']},ensure_ascii=False,separators=(',',':')))
          PY
            )
            gh api "repos/$GITHUB_REPOSITORY/issues/2530/comments" --method POST -f body="TERMINAL $OPERATION_ID source=$HEAD_SHA state=completed_read_only result_sha256=$sha database_writes=0 mapping_writes=0 provider_calls=0 $summary"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/2530/comments" --method POST -f body="TERMINAL $OPERATION_ID source=$HEAD_SHA state=no-result"
          fi
