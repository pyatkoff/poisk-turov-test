name: ANEX AdditionalPricesDaily specimen
on:
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - 'scripts/diagnostics/anex_additional_prices_specimen.php'
      - '.github/workflows/anex-additional-prices-specimen.yml'
  push:
    branches: ['ops/int-anex-additional-prices-specimen-20260912-v1']
    paths:
      - '.github/ops/int-anex-additional-prices-specimen-20260912-v1'
permissions:
  contents: read
concurrency:
  group: anex-additional-prices-specimen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate bounded specimen source
        run: |
          php -l scripts/diagnostics/anex_additional_prices_specimen.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/anex_additional_prices_specimen.php').read_text()
          assert "$root . '/config.php'" in s
          assert "ANEX_B2B_TOKEN" in s
          assert "new AnyTourAnexAdditionalPricesClient" in s
          assert "'additional_payload_uninterpreted' => true" in s
          assert "'arithmetic_applied' => false" in s
          for forbidden in ('->bron(', 'bron_ticket', 'INSERT INTO', 'UPDATE ', 'DELETE FROM'):
              assert forbidden not in s
          print('ANEX AdditionalPricesDaily specimen static boundary: PASS')
          PY

  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-additional-prices-specimen-20260912-v1' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact one-shot operation
        run: |
          marker="$(cat control/.github/ops/int-anex-additional-prices-specimen-20260912-v1)"
          printf '%s\n' "$marker" | grep -Eq '^source=[0-9a-f]{40};operation=anex-additional-prices-specimen-20260912-v1;owner=2026-09-12$'
          source_sha="${marker#source=}"
          source_sha="${source_sha%%;*}"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Create durable reservation
        run: |
          mkdir -m 700 "$RUNNER_TEMP/specimen"
          printf '%s\n' '{"operation_id":"anex-additional-prices-specimen-20260912-v1","state":"reserved","replay_allowed":false}' > "$RUNNER_TEMP/specimen/reservation.json"
      - name: Preserve reservation before supplier access
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-prices-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/specimen/reservation.json
          if-no-files-found: error
          retention-days: 30
      - name: Run one bounded read-only specimen
        id: specimen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, shlex, subprocess, tempfile
          from pathlib import Path
          client=Path('source/app/integrations/anex-additional-prices-client.php').read_text()
          runner=Path('source/scripts/diagnostics/anex_additional_prices_specimen.php').read_text()
          def body(x):
              assert x.startswith('<?php')
              x=x[5:].lstrip()
              if x.startswith('declare(strict_types=1);'):
                  x=x[len('declare(strict_types=1);'):].lstrip('\r\n')
              return x
          source="declare(strict_types=1);\n"+body(client)+"\n"+body(runner)
          out=Path(os.environ['RUNNER_TEMP'])/'specimen/result.json'
          key=Path(os.environ['RUNNER_TEMP'])/'specimen/ssh_key'
          key.write_text(os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].rstrip()+'\n'); key.chmod(0o600)
          command=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none',
                   '-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(os.environ['RUNNER_TEMP'])/'specimen/known_hosts'),
                   '-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-l',os.environ['ANYTOOUR_DEPLOY_USER'],
                   os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -r '+shlex.quote(source)]
          request={'operation_id':'anex-additional-prices-specimen-20260912-v1','date':'2026-10-31','nights':8,'adults':1}
          result=subprocess.run(command,input=json.dumps(request,ensure_ascii=False),text=True,capture_output=True,timeout=300,
                                env={k:v for k,v in os.environ.items() if not k.startswith('ANEX_')})
          try:
              value=json.loads(result.stdout)
          except Exception:
              value={'schema_version':1,'operation_id':request['operation_id'],'status':'transport_unconfirmed','replay_allowed':False}
          text=json.dumps(value,ensure_ascii=False,sort_keys=True,indent=2)+'\n'
          assert 'Bearer ' not in text and 'ANEX_B2B_TOKEN' not in text
          out.write_text(text)
          if value.get('operation_id')!=request['operation_id'] or value.get('status') not in ('completed','blocked','unknown','transport_unconfirmed'):
              raise SystemExit(1)
          raise SystemExit(0 if result.returncode==0 and value.get('status')=='completed' else 1)
          PY
      - name: Preserve sanitized specimen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-prices-specimen-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/specimen/reservation.json
            ${{ runner.temp }}/specimen/result.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when specimen did not complete
        if: steps.specimen.outcome != 'success'
        run: exit 1
