name: ANEX AdditionalPricesDaily program778 nights evidence
on:
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - 'app/integrations/anex-additional-prices-client.php'
      - 'scripts/diagnostics/anex_additional_prices_specimen.php'
      - 'tests/anex-additional-currency-specimen-test.php'
      - '.github/workflows/anex-additional-prices-specimen.yml'
  push:
    branches: ['ops/int-anex-apd-778-nights-v11-20260915']
    paths: ['.github/ops/int-anex-apd-778-nights-v11-20260915']
permissions:
  contents: read
concurrency:
  group: anex-additional-program778-nights-v11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify focused v11 nights evidence path and exact PHP assembly
        run: |
          php -l app/integrations/anex-additional-prices-client.php
          php -l scripts/diagnostics/anex_additional_prices_specimen.php
          php tests/anex-additional-currency-specimen-test.php
          python3 - <<'PY'
          from pathlib import Path
          strict = 'declare(strict_types=1);'
          def php_body(path, keep_strict):
              text=Path(path).read_text()
              assert text.startswith('<?php')
              body=text[5:].lstrip()
              if not keep_strict:
                  assert body.startswith(strict)
                  body=body[len(strict):].lstrip()
              return body
          client=php_body('app/integrations/anex-additional-prices-client.php', True)
          specimen=php_body('scripts/diagnostics/anex_additional_prices_specimen.php', False)
          code=client+'\n'+specimen
          assert code.count(strict) == 1
          assert len(code.encode()) <= 65536
          Path('/tmp/anex-apd-v11-assembled.php').write_text('<?php\n'+code)
          s=Path('scripts/diagnostics/anex_additional_prices_specimen.php').read_text()
          assert "anex-additional-prices-778-nights-20260915-v11" in s
          assert "ANEX_ADDITIONAL_SPECIMEN_TOUR = 778" in s
          assert "ANEX_ADDITIONAL_SPECIMEN_DATE = '2026-10-18'" in s
          assert "ANEX_ADDITIONAL_SPECIMEN_NIGHTS = [10, 14]" in s
          assert "new AnyTourAnexAdditionalPricesClient" in s
          assert "'arithmetic_applied' => false" in s
          assert "'empty_means_zero' => false" in s
          for x in ('fuelCharge','SearchTour_PRICES','->bron(','bron_ticket','INSERT INTO','UPDATE '):
              assert x not in s
          print('AdditionalPricesDaily v11 nights exact assembly boundary: PASS')
          PY
          php -l /tmp/anex-apd-v11-assembled.php

  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-apd-778-nights-v11-20260915' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SOURCE_SHA: ${{ github.event.before }}
      REQUESTED_OPERATION: anex-additional-prices-778-nights-20260915-v11
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind marker-only control to checked INT source
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C control rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git -C control diff --name-only HEAD^ HEAD)" = ".github/ops/int-anex-apd-778-nights-v11-20260915"
          test "$(cat control/.github/ops/int-anex-apd-778-nights-v11-20260915)" = "source=${SOURCE_SHA};operation=${REQUESTED_OPERATION};tour=778;dateBeg=2026-10-18;nights=10,14;currency=3;owner=2026-09-15;baseline=v10:7"
      - name: Reserve before supplier access
        run: |
          mkdir -m 700 "$RUNNER_TEMP/specimen"
          printf '%s\n' '{"state":"reserved","replay_allowed":false,"operation_id":"'"$REQUESTED_OPERATION"'","source_sha":"'"$SOURCE_SHA"'"}' > "$RUNNER_TEMP/specimen/reservation.json"
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-program778-v11-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/specimen/reservation.json
          retention-days: 30
      - name: Run two new APD night contexts through current runtime client
        id: specimen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, shlex, subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'specimen'; key=p/'key'
          key.write_text(os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].rstrip()+'\n'); key.chmod(0o600)
          strict='declare(strict_types=1);'
          def php_body(path, keep_strict):
              text=Path(path).read_text()
              if not text.startswith('<?php'):
                  raise SystemExit('checked PHP source invalid')
              body=text[5:].lstrip()
              if not keep_strict:
                  if not body.startswith(strict):
                      raise SystemExit('checked PHP strict-types boundary invalid')
                  body=body[len(strict):].lstrip()
              return body
          code=php_body('source/app/integrations/anex-additional-prices-client.php', True)+'\n'+php_body('source/scripts/diagnostics/anex_additional_prices_specimen.php', False)
          if code.count(strict) != 1 or len(code.encode()) > 65536:
              raise SystemExit('checked PHP assembly invalid')
          cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(p/'known_hosts'),'-o','ConnectTimeout=15','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -r '+shlex.quote(code)]
          req={'operation_id':os.environ['REQUESTED_OPERATION'],'source_sha':os.environ['SOURCE_SHA']}
          value={'schema_version':1,**req,'status':'transport_unconfirmed','supplier_replay_allowed':False}; rc=1
          try:
              r=subprocess.run(cmd,input=json.dumps(req),text=True,capture_output=True,timeout=300); rc=r.returncode
              x=json.loads(r.stdout)
              if isinstance(x,dict): value=x
          except Exception:
              pass
          finally:
              key.unlink(missing_ok=True)
          (p/'result.json').write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          raise SystemExit(0 if rc==0 and value.get('status')=='completed' else 1)
          PY
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-program778-v11-${{ github.run_id }}
          path: ${{ runner.temp }}/specimen/
          if-no-files-found: error
          retention-days: 30
      - name: Report sanitized APD comparison
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'specimen'/'result.json'
          if not path.exists():
              print('{"status":"missing_result"}')
              raise SystemExit(0)
          value=json.loads(path.read_text())
          report={
              'status': value.get('status'),
              'additional_prices_requests': value.get('additional_prices_requests'),
              'rows': [],
          }
          for item in value.get('additional_prices_by_nights') or []:
              fact=item.get('additional_prices') or {}
              row=(fact.get('rows') or [None])[0]
              report['rows'].append({
                  'nights': item.get('nights'),
                  'state': fact.get('state'),
                  'price_adult': row.get('price_adult') if isinstance(row,dict) else None,
                  'price_child': row.get('price_child') if isinstance(row,dict) else None,
                  'cashrate': row.get('cashrate') if isinstance(row,dict) else None,
                  'price_converted_adult': row.get('price_converted_adult') if isinstance(row,dict) else None,
                  'price_converted_child': row.get('price_converted_child') if isinstance(row,dict) else None,
              })
          print(json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Fail after preservation
        if: steps.specimen.outcome != 'success'
        run: exit 1
