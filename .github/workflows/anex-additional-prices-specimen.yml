name: ANEX AdditionalPricesDaily specimen
on:
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - 'scripts/diagnostics/anex_additional_prices_specimen.php'
      - 'tests/anex-additional-currency-specimen-test.php'
      - '.github/workflows/anex-additional-prices-specimen.yml'
  push:
    branches: ['ops/int-anex-additional-green-gold-v7-20260912']
    paths: ['.github/ops/anex-additional-green-gold-v7-20260912']
permissions:
  contents: read
concurrency:
  group: anex-additional-green-gold-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify v7 boundary
        run: |
          php -l scripts/diagnostics/anex_additional_prices_specimen.php
          php tests/anex-additional-currency-specimen-test.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/anex_additional_prices_specimen.php').read_text()
          assert "anex-additional-green-gold-20260912-v7" in s
          assert "https://api.anextour.ru/b2b/AdditionalPricesDaily" in s
          assert "CURLOPT_FOLLOWLOCATION => false" in s
          assert "CURLOPT_SSL_VERIFYPEER => true" in s
          assert "CURLOPT_SSL_VERIFYHOST => 2" in s
          assert "CURLOPT_WRITEFUNCTION" in s
          assert "ANEX_ADDITIONAL_GREEN_GOLD_MAX_BYTES = 262144" in s
          assert s.count('curl_exec(') == 1
          for x in ('AnyTourAnexAdditionalPricesClient','SearchTour_PRICES','SearchTour_TOURS','->bron(','INSERT INTO','UPDATE '): assert x not in s
          assert "'arithmetic_applied'=>false" in s
          print('AdditionalPricesDaily v7 static boundary: PASS')
          PY
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-additional-green-gold-v7-20260912' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SOURCE_SHA: 837c219012a7a9bf4f45af9f5d98755040e31025
      REQUESTED_OPERATION: anex-additional-green-gold-20260912-v7
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Bind exact v7 operation
        run: |
          test "$(cat control/.github/ops/anex-additional-green-gold-v7-20260912)" = "source=${SOURCE_SHA};operation=${REQUESTED_OPERATION};tour=2637;dateBeg=2026-10-05;nights=7;currency=3;page=1;pageSize=10;owner=2026-09-12"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Reserve before supplier access
        run: |
          mkdir -m 700 "$RUNNER_TEMP/specimen"
          printf '%s\n' '{"state":"reserved","replay_allowed":false,"operation_id":"'"$REQUESTED_OPERATION"'"}' > "$RUNNER_TEMP/specimen/reservation.json"
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-green-gold-v7-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/specimen/reservation.json
          retention-days: 30
      - name: Run one-shot specimen
        id: specimen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, shlex, subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'specimen'; key=p/'key'
          key.write_text(os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].rstrip()+'\n'); key.chmod(0o600)
          code=Path('source/scripts/diagnostics/anex_additional_prices_specimen.php').read_text()[5:].lstrip()
          cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(p/'known_hosts'),'-o','ConnectTimeout=15','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -r '+shlex.quote(code)]
          req={'operation_id':os.environ['REQUESTED_OPERATION'],'source_sha':os.environ['SOURCE_SHA']}
          value={'schema_version':1,**req,'status':'transport_unconfirmed','supplier_replay_allowed':False}; rc=1
          try:
              r=subprocess.run(cmd,input=json.dumps(req),text=True,capture_output=True,timeout=300); rc=r.returncode
              x=json.loads(r.stdout)
              if isinstance(x,dict): value=x
          except Exception: pass
          finally: key.unlink(missing_ok=True)
          text=json.dumps(value,ensure_ascii=False,sort_keys=True,indent=2)+'\n'
          (p/'result.json').write_text(text)
          raise SystemExit(0 if rc==0 and value.get('status')=='completed' else 1)
          PY
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-additional-green-gold-v7-${{ github.run_id }}
          path: ${{ runner.temp }}/specimen/
          retention-days: 30
      - name: Fail after preservation
        if: steps.specimen.outcome != 'success'
        run: exit 1
