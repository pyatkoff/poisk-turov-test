name: Roll up AnyTour prices

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/rollup-price-daily-v1.php'
      - '.github/workflows/rollup-anytour-prices.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/rollup-price-daily-v1.php'
      - '.github/workflows/rollup-anytour-prices.yml'
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Recent observation days to rebuild (1-31)'
        required: true
        default: '7'
        type: string

concurrency:
  group: anytour-price-rollup-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate rollup tooling
        shell: bash
        env:
          DAYS_VALUE: ${{ inputs.days || '7' }}
        run: |
          set -euo pipefail
          php -l v2/data/rollup-price-daily-v1.php >/dev/null
          [[ "$DAYS_VALUE" =~ ^[0-9]+$ ]]
          test "$DAYS_VALUE" -ge 1 && test "$DAYS_VALUE" -le 31
          grep -Fq 'tour_price_observations' v2/data/rollup-price-daily-v1.php
          grep -Fq 'tour_price_daily' v2/data/rollup-price-daily-v1.php
          grep -Fq 'median_price' v2/data/rollup-price-daily-v1.php
          grep -Fq 'ON DUPLICATE KEY UPDATE' v2/data/rollup-price-daily-v1.php
          echo "ANYTOUR_PRICE_ROLLUP_TOOLING_OK days=$DAYS_VALUE"

  rollup:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Roll up observations on production
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          DAYS_VALUE: ${{ inputs.days || '7' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$DAYS_VALUE" =~ ^[0-9]+$ ]]
          test "$DAYS_VALUE" -ge 1 && test "$DAYS_VALUE" -le 31
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          root='~/www/anytoour.ru'

          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" v2/data/db-v1.php v2/data/rollup-price-daily-v1.php "$remote:$root/data/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru\"
            php -l \"\$root/data/rollup-price-daily-v1.php\" >/dev/null
            php \"\$root/data/rollup-price-daily-v1.php\" --days='$DAYS_VALUE'
            php \"\$root/data/data-doctor-v1.php\"
          "
          echo "ANYTOUR_PRICE_ROLLUP_OK days=$DAYS_VALUE"
