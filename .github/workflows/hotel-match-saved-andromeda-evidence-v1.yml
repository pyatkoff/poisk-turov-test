name: MATCH saved Andromeda hotel evidence v1
on:
  push:
    branches: [ops/match-saved-andromeda-evidence-1971-20260915-v1]
    paths: [.github/workflows/hotel-match-saved-andromeda-evidence-v1.yml]
permissions: {contents: read}
concurrency: {group: match-saved-andromeda-evidence-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-saved-andromeda-evidence-1971-20260915-v1
jobs:
  retained-current-intake:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Check exact source and retained foreign-claim exclusions offline
        run: |
          set -euo pipefail
          php -d allow_url_fopen=0 tests/hotel_match_saved_andromeda_evidence_test.php
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path('.');temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          source=root/'scripts/diagnostics/hotel_match_saved_andromeda_evidence.php'
          test=root/'tests/hotel_match_saved_andromeda_evidence_test.php'
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='262e238421b609a08c6e642c604999ff53be89942838e22349bb03254b7f6760'
          assert hashlib.sha256(test.read_bytes()).hexdigest()=='fa861b7aa944c43e5665571e41eb3f51375198ada7eff873eafbc3821e2e7149'
          raw=(root/'reports/hotel-match-received-union-current-20260915.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='d9a9a9cbbb8b4d3f77600c309fac8aa4334ebcb0812888725504c580bbdba8c6'
          r=json.loads(raw);ids=sorted({str(x['fact']['andromeda_hotel_id']) for key in ['candidates','unresolved_anchors'] for x in r[key]})
          assert len(ids)==179 and all(re.fullmatch('[1-9][0-9]{0,19}',x) for x in ids)
          code=source.read_text();needle='declare(strict_types=1);'
          assert code.count(needle)==1
          code=code.replace(needle,needle+'\nconst MSA_EXCLUDED = '+json.dumps(ids,separators=(',',':'))+';',1)
          assert 'START TRANSACTION READ ONLY' in code
          assert not re.search(r'(?<![$\w])(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',code,re.I)
          (temp/'intake.php').write_text(code)
          (temp/'excluded.json').write_text(json.dumps(ids))
          PY
          php -l "$RUNNER_TEMP/intake.php"
      - name: Reserve immutable operation before any SSH or private data access
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);p=temp/os.environ['OPERATION_ID'];p.mkdir(mode=0o700)
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5681482250,'bundle_sha256':hashlib.sha256((temp/'intake.php').read_bytes()).hexdigest(),'excluded_ids_sha256':hashlib.sha256((temp/'excluded.json').read_bytes()).hexdigest(),'excluded_count':179,'purpose':'one configured saved HOTELS/TOWNTO and completed normalized PRICE metadata intake joined CURRENT pending; no network or mapping writes','catalog_byte_budget':256000000,'search_byte_budget':256000000,'search_file_budget':5000,'database_writes':0,'supplier_calls':0,'no_replay':True}
          (p/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-saved-andromeda-evidence-v1-reservation
          path: ${{ runner.temp }}/hotel-match-saved-andromeda-evidence-1971-20260915-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Supplier-free CURRENT and retained hotel metadata intake
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$RUNNER_TEMP/intake.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server'
          raw=(s/'result.json').read_bytes();r=json.loads(raw);receipt=json.loads((s/'receipt.json').read_text())
          assert receipt['result_sha256']==hashlib.sha256(raw).hexdigest() and receipt['readback_verified'] and receipt['no_replay']
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert all(x['operation_id']==os.environ['OPERATION_ID'] and x['source_sha']==os.environ['GITHUB_SHA'] for x in (r,receipt))
          assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==r['booking_calls']==0
          assert r['safe_to_write_now'] is False and r['prepared_only'] is True
          excluded=set(json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'excluded.json').read_text()))
          assert not excluded.intersection(x['external_hotel_id'] for x in r.get('evidence_rows',[]))
          assert all(x['safe_to_write_now'] is False and x['original_http_response_sha256'] is None for x in r.get('evidence_rows',[]))
          gate={'operation_id':os.environ['OPERATION_ID'],'state':r['state'],'result_sha256':receipt['result_sha256'],'current_pending_total':r.get('current_pending_total'),'covered_pending_count':r.get('covered_pending_count'),'search_unique_metadata':r.get('search_unique_metadata'),'explicit_anex_url_evidence_rows':r.get('explicit_anex_url_evidence_rows'),'readback_verified':True,'database_writes':0,'supplier_calls':0}
          (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True)+'\n');print(json.dumps(gate))
          assert os.environ['REMOTE_RC']=='0' and r['state']=='completed_read_only'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-saved-andromeda-evidence-v1-result
          path: ${{ runner.temp }}/hotel-match-saved-andromeda-evidence-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
