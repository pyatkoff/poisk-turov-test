name: MATCH SAMO live30 COMMON4 plan v1
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_samo_live30_common4_plan_v1.php'
      - 'tests/hotel_match_samo_live30_common4_plan_v1_test.php'
      - '.github/workflows/hotel-match-samo-live30-common4-plan-v1.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-samo-live30-common4-plan-1971-20260924-v1, cancel-in-progress: false}
env:
  OP: hotel-match-samo-live30-common4-plan-1971-20260924-v1
  BASE: 8f224e1e6b70af018c575fc852aa539fab245353
  CLAIM: '5804052007'
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l scripts/diagnostics/hotel_match_samo_live30_common4_plan_v1.php
      - run: php scripts/diagnostics/hotel_match_samo_live30_common4_plan_v1.php --self-test
      - run: php tests/hotel_match_samo_live30_common4_plan_v1_test.php
  live:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim and exact paths
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-samo-live30-common4-plan-v1.yml scripts/diagnostics/hotel_match_samo_live30_common4_plan_v1.php tests/hotel_match_samo_live30_common4_plan_v1_test.php "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],'450','125 unresolved','HTTP0','database_writes0','mapping_writes0','operator_5','operator_115','operator_315','operator_342']: assert x in b,x
          PY
      - name: Execute supplier-free row-level plan
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_db_read'},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_samo_live30_common4_plan_v1.php "$remote:$op/payload/scripts/diagnostics/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_samo_live30_common4_plan_v1.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['state']=='samo_live30_common4_plan_ready' and r['provider_http_calls']==0 and r['database_writes']==0 and r['mapping_writes']==0
          print(json.dumps({k:r[k] for k in ['state','catalog_live30_count','mapped_unique_count','unresolved_or_collision_count','saved_catalog_ready_count','saved_catalog_not_ready_count','acquisition_ready_count','missing_lane_counts','saved_catalog_file_count']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-samo-live30-common4-plan-v1-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
