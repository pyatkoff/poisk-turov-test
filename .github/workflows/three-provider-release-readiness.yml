name: Three-provider INT release readiness
on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-*.php'
      - 'tests/three-provider-*.php'
      - '.github/workflows/three-provider-release-readiness.yml'
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run provider-neutral contract matrix without network
        run: |
          set -euo pipefail
          for test in \
            tests/three-provider-money-facts-test.php \
            tests/three-provider-offer-contract-test.php \
            tests/three-provider-offer-context-test.php \
            tests/three-provider-air-search-filter-test.php \
            tests/three-provider-geography-test.php \
            tests/three-provider-departure-country-test.php \
            tests/three-provider-hotel-category-test.php \
            tests/three-provider-hotel-rating-test.php \
            tests/three-provider-hotel-services-test.php \
            tests/three-provider-hotel-types-test.php \
            tests/three-provider-quote-envelope-test.php \
            tests/three-provider-search-handoff-test.php \
            tests/three-provider-anex-offer-test.php
          do
            php -l "$test"
            php -d allow_url_fopen=0 "$test"
          done
          python3 - <<'PY'
          from pathlib import Path

          boundary_files = [
              'app/integrations/three-provider-money-facts.php',
              'app/integrations/three-provider-offer-contract.php',
              'app/integrations/three-provider-offer-context.php',
              'app/integrations/three-provider-air-search-filter.php',
              'app/integrations/three-provider-geography.php',
              'app/integrations/three-provider-departure-country.php',
              'app/integrations/three-provider-hotel-category.php',
              'app/integrations/three-provider-hotel-rating.php',
              'app/integrations/three-provider-hotel-services.php',
              'app/integrations/three-provider-hotel-types.php',
              'app/integrations/three-provider-quote-envelope.php',
              'app/integrations/three-provider-search-handoff.php',
          ]
          combined = '\n'.join(Path(path).read_text() for path in boundary_files)
          for forbidden in (
              'curl_', 'file_get_contents(', 'PDO', 'mysqli_',
              'bron(', 'bron_ticket', 'Authorization:', 'Bearer ',
          ):
              assert forbidden not in combined, forbidden

          handoff = Path('app/integrations/three-provider-search-handoff.php').read_text()
          assert "'selection_state' => 'disabled'" in handoff
          assert "'booking_enabled' => false" in handoff
          assert 'AnyTourThreeProviderQuoteEnvelope::verified' in handoff
          assert 'AnyTourThreeProviderMoneyFacts::fromSearch' in handoff

          quote = Path('app/integrations/three-provider-quote-envelope.php').read_text()
          assert 'AnyTourThreeProviderMoneyFacts::withVerifiedQuote' in quote
          assert "!== 'andromeda'" in quote

          money = Path('app/integrations/three-provider-money-facts.php').read_text()
          assert "'arithmetic_applied' => false" in money
          assert "'search_price_fuel_relation' => 'unknown'" in money

          air = Path('app/integrations/three-provider-air-search-filter.php').read_text()
          assert "'upstream_search_filter'" in air
          assert "'status' => 'unknown'" in air
          assert "'allowed' => false" in air
          assert "'raw_numeric_id_universal' => false" in air
          assert "'cross_provider_equivalence_verified' => false" in air

          geography = Path('app/integrations/three-provider-geography.php').read_text()
          assert "'status' => 'unknown'" in geography
          assert "'allowed' => false" in geography
          assert "'requires_verified_provider_mapping' => true" in geography
          assert "'provider_specific_mapping_required' => true" in geography
          assert "'supplier_geography_equivalence_verified' => false" in geography
          assert "'raw_supplier_numeric_id_universal' => false" in geography
          assert "'cross_provider_equivalence_verified' => false" in geography
          assert "'identity_proof_from_geography' => false" in geography
          assert "? 'not_implemented'" in geography

          departure_country = Path('app/integrations/three-provider-departure-country.php').read_text()
          assert "'provider_specific_mapping_required' => true" in departure_country
          assert "'local_numeric_id_is_supplier_id' => false" in departure_country
          assert "'raw_supplier_numeric_id_universal' => false" in departure_country
          assert "'cross_provider_equivalence_verified' => false" in departure_country
          assert "'hotel_identity_proof_from_departure_country' => false" in departure_country
          assert "'verified_exact_unique_dictionary_name'" in departure_country
          assert "'verified_departure_scoped_exact_unique_dictionary_name'" in departure_country
          assert "'allowed' => $mappingVerified" in departure_country

          category = Path('app/integrations/three-provider-hotel-category.php').read_text()
          assert "'supplier_label_equivalence_verified' => false" in category
          assert "'raw_supplier_numeric_id_universal' => false" in category
          assert "'cross_provider_equivalence_verified' => false" in category
          assert "'identity_proof_from_category' => false" in category
          assert "'source' => $canonicalKnown ? 'current_local_identity' : null" in category

          rating = Path('app/integrations/three-provider-hotel-rating.php').read_text()
          assert "'status' => 'local_only'" in rating
          assert "'allowed' => false" in rating
          assert "'supplier_rating_equivalence_verified' => false" in rating
          assert "'raw_supplier_numeric_value_universal' => false" in rating
          assert "'cross_provider_equivalence_verified' => false" in rating
          assert "'identity_proof_from_rating' => false" in rating
          assert "'source' => $canonicalKnown ? 'current_local_identity' : null" in rating

          services = Path('app/integrations/three-provider-hotel-services.php').read_text()
          assert "'status' => 'local_only'" in services
          assert "'allowed' => false" in services
          assert "'supplier_service_equivalence_verified' => false" in services
          assert "'raw_supplier_numeric_id_universal' => false" in services
          assert "'cross_provider_equivalence_verified' => false" in services
          assert "'identity_proof_from_services' => false" in services
          assert "'source' => $canonicalKnown ? 'current_local_identity' : null" in services

          types = Path('app/integrations/three-provider-hotel-types.php').read_text()
          assert "'status' => 'local_only'" in types
          assert "'allowed' => false" in types
          assert "'supplier_type_equivalence_verified' => false" in types
          assert "'raw_supplier_numeric_id_universal' => false" in types
          assert "'cross_provider_equivalence_verified' => false" in types
          assert "'identity_proof_from_types' => false" in types
          assert "'source' => $canonicalKnown ? 'current_local_identity' : null" in types
          print('Three-provider INT release readiness static boundary: PASS')
          PY
