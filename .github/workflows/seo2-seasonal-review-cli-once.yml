name: SEO2 seasonal review CLI once

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/report-seo-seasonal-review-plan-v1.php'
      - '.github/workflows/seo2-seasonal-review-cli-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate review-only seasonal plan CLI
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/report-seo-seasonal-review-plan-v1.php >/dev/null
          now=$(date +%s)
          expires=$((now+7200))
          cat >/tmp/readiness.json <<JSON
          {"state":"review_only_data_readiness","evidence_checked_at_epoch":${now},"evidence_valid_until_epoch":${expires},"evidence_clock_valid":true,"countries":[{"country_id":4,"snapshot_count":2,"usable_snapshot_count":2,"types":[{"page_type":"month","snapshot_count":1,"usable_snapshot_count":1,"identity_count":1,"min_offer_count":3,"min_freshness_seconds":7200},{"page_type":"resort_month","snapshot_count":1,"usable_snapshot_count":1,"identity_count":1,"min_offer_count":2,"min_freshness_seconds":7200}]}]}
          JSON
          cat >/tmp/identities.json <<JSON
          {"state":"review_only_seasonal_identity_inventory","identity_count":2,"blocked_count":0,"evidence_checked_at_epoch":${now},"evidence_valid_until_epoch":${expires},"evidence_clock_valid":true,"publication_candidates":[],"publication_allowed":false,"copy_allowed":false,"identities":[{"state":"fresh_review_identity","page_key":"month:1:4:2026-09","page_type":"month","country_id":4,"region_id":null,"departure_id":1,"year":2026,"month":9,"offer_count":3,"evidence_checked_at_epoch":${now},"expires_at_epoch":${expires},"freshness_seconds":7200,"publication_allowed":false,"copy_allowed":false},{"state":"fresh_review_identity","page_key":"resort_month:1:4:22:2026-09","page_type":"resort_month","country_id":4,"region_id":22,"departure_id":1,"year":2026,"month":9,"offer_count":2,"evidence_checked_at_epoch":${now},"expires_at_epoch":${expires},"freshness_seconds":7200,"publication_allowed":false,"copy_allowed":false}],"blocked":[]}
          JSON
          php v2/data/report-seo-seasonal-review-plan-v1.php --readiness=/tmp/readiness.json --identities=/tmp/identities.json --family=turkey --page-keys=month:1:4:2026-09,resort_month:1:4:22:2026-09 --min-month-identities=1 --min-resort-month-identities=1 --min-freshness-seconds=3600 --min-offers-per-snapshot=1 --require-items=2 >/tmp/plan.json
          php -r '$x=json_decode(file_get_contents("/tmp/plan.json"),true,512,JSON_THROW_ON_ERROR); if(($x["state"]??"")!=="review_only_seasonal_plan"||($x["item_count"]??0)!==2||($x["publication_allowed"]??true)!==false||($x["feed_publish_allowed"]??true)!==false||($x["copy_allowed"]??true)!==false||($x["publication_candidates"]??null)!==[]) exit(1); if(($x["family"]??"")!=="turkey"||($x["family_blocked_count"]??-1)!==0) exit(2); echo "SEO_SEASONAL_REVIEW_PLAN_CLI_OK\n";'
          if php v2/data/report-seo-seasonal-review-plan-v1.php --readiness=/tmp/readiness.json --identities=/tmp/identities.json --family=turkey --page-keys=resort_month:1:4:999:2026-09 --min-month-identities=1 --min-resort-month-identities=1 --min-freshness-seconds=3600 --min-offers-per-snapshot=1 >/tmp/bad.json 2>/tmp/bad.err; then
            echo 'SEO_SEASONAL_REVIEW_PLAN_CLI_FAIL:unknown page key passed' >&2; exit 1
          fi
          expired=$((now-1))
          sed "s/\"evidence_valid_until_epoch\":${expires}/\"evidence_valid_until_epoch\":${expired}/" /tmp/identities.json >/tmp/expired.json
          if php v2/data/report-seo-seasonal-review-plan-v1.php --readiness=/tmp/readiness.json --identities=/tmp/expired.json --family=turkey --page-keys=month:1:4:2026-09 --min-month-identities=1 --min-resort-month-identities=1 --min-freshness-seconds=3600 --min-offers-per-snapshot=1 >/tmp/expired-plan.json 2>/tmp/expired.err; then
            echo 'SEO_SEASONAL_REVIEW_PLAN_CLI_FAIL:expired inventory replay passed' >&2; exit 1
          fi
