name: Search3 short desktop filter rail

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/search3/styles/results-layout.css'
      - 'v2/search3-results-filters-v1.css'
      - 'docs/project/search3-production-import.json'
      - 'tests/search3-filter-rail-short-viewport-browser.cjs'
      - '.github/workflows/search3-filter-rail-short-viewport.yml'

permissions:
  contents: write

env:
  PREVIEW_BASE: /_preview/search3-site-candidate

jobs:
  short-desktop-filter-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize canonical Search3 assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          python3 -B scripts/build/search3_assets.py --write
          python3 -B scripts/build/search3_assets.py --check
          node scripts/build/search3-js/shared-runtime.cjs --check

      - name: Persist exact generated materialization on bootstrap branch
        if: github.event.pull_request.draft && github.head_ref == 'ux/search3-shortlist-mobile-carousel-20260912'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- v2/search3-results-filters-v1.css docs/project/search3-production-import.json; then
            echo SEARCH3_BOOTSTRAP_MATERIALIZATION_ALREADY_CURRENT
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/search3-results-filters-v1.css docs/project/search3-production-import.json
          git commit -m 'SEARCH: materialize mobile shortlist generated CSS'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Build local isolated preview
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/search3-filter-rail-site"
          payload="$root$PREVIEW_BASE"
          mkdir -p "$payload"
          rsync -a \
            --exclude='*.md' \
            --exclude='_preview/' \
            --exclude='api.php' \
            --exclude='api-v2.php' \
            --exclude='lead-adapter.php' \
            --exclude='lead-adapter-v2.php' \
            --exclude='lead-bridge-v1.php' \
            --exclude='lead-receiver-v1.php' \
            --exclude='lead-price-v1.php' \
            --exclude='lead-idempotency-v1.php' \
            v2/ "$payload/"
          cp "$payload/index.php" "$payload/search-page-v2.php"
          cp "$payload/home-entry-v1.php" "$payload/index.php"
          python3 -B scripts/build/search3_site_preview_isolation.py "$payload"
          test -f "$payload/poisk-turov/index.php"
          test ! -e "$payload/api-v2.php"
          test ! -e "$payload/lead-adapter-v2.php"
          find "$payload" -type f -name '*.php' -print0 | xargs -0 -r -n 1 -P 2 php -l >/dev/null
          find "$payload" -type f -name '*.js' -print0 | xargs -0 -r -n 1 -P 2 node --check >/dev/null

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/search3-filter-rail-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-filter-rail-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify short desktop filter rail
        shell: bash
        env:
          SEARCH3_VISUAL_BASE: http://127.0.0.1:8099/_preview/search3-site-candidate
          SEARCH3_FILTER_RAIL_OUTPUT: ${{ runner.temp }}/search3-filter-rail-evidence
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/search3-filter-rail-tools/node_modules"
          cat > "$RUNNER_TEMP/search3-filter-rail-router.php" <<'PHP'
          <?php
          $entry = '/_preview/search3-site-candidate/poisk-turov/';
          if (parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) !== $entry) return false;
          $_SERVER['HTTP_HOST'] = 'anytoour.ru';
          $_SERVER['SCRIPT_NAME'] = $entry . 'index.php';
          require $_SERVER['DOCUMENT_ROOT'] . $_SERVER['SCRIPT_NAME'];
          PHP
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/search3-filter-rail-site" "$RUNNER_TEMP/search3-filter-rail-router.php" >"$RUNNER_TEMP/search3-filter-rail-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS "$SEARCH3_VISUAL_BASE/poisk-turov/" -o /dev/null && break; sleep 0.25; done
          node tests/search3-filter-rail-short-viewport-browser.cjs

      - name: Retain exact evidence and generated materialization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-filter-rail-short-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/search3-filter-rail-evidence/
            v2/search3-results-filters-v1.css
            docs/project/search3-production-import.json
          if-no-files-found: error
          retention-days: 30
