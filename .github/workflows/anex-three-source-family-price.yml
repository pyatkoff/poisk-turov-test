name: ANEX three-source family price
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_three_source_family_price.py'
      - 'tests/anex_three_source_family_price_test.py'
      - 'scripts/diagnostics/anex_three_source_party_control.py'
      - 'tests/anex_three_source_party_control_test.py'
      - 'scripts/diagnostics/anex_three_source_party_broad.py'
      - 'tests/anex_three_source_party_broad_test.py'
      - 'scripts/diagnostics/anex_three_source_family_broad.py'
      - 'tests/anex_three_source_family_broad_test.py'
      - '.github/workflows/anex-three-source-family-price.yml'
  push:
    branches:
      - 'ops/int-anex-three-source-party-v2-20260913'
      - 'ops/int-anex-three-source-party-control-v1-20260913'
      - 'ops/int-anex-three-source-party-broad-v1-20260913'
      - 'ops/int-anex-three-source-family-broad-v1-20260913'
    paths:
      - '.github/ops/anex-three-source-party-v2-20260913'
      - '.github/ops/anex-three-source-party-control-v1-20260913'
      - '.github/ops/anex-three-source-party-broad-v1-20260913'
      - '.github/ops/anex-three-source-family-broad-v1-20260913'
permissions:
  contents: read
concurrency:
  group: anex-three-source-family-price-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Focused selected-party and broad scenario regressions
        run: |
          python3 -B tests/anex_three_source_family_price_test.py
          python3 -B tests/anex_three_source_party_control_test.py
          python3 -B tests/anex_three_source_party_broad_test.py
          python3 -B tests/anex_three_source_family_broad_test.py
          python3 -m py_compile scripts/diagnostics/anex_three_source_family_price.py scripts/diagnostics/anex_three_source_party_control.py scripts/diagnostics/anex_three_source_party_broad.py scripts/diagnostics/anex_three_source_family_broad.py
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-three-source-party-v2-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed three-adult source
        id: control
        run: |
          MARKER='control/.github/ops/anex-three-source-party-v2-20260913'
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-three-source-party-v2-20260913'
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(cat "$MARKER")" = "source=${SOURCE_SHA};operation=read-only-anex-three-source-party-v2;scenario=Turkey-2026-10-20-8n-3a-AI;owner=2026-09-13"
          git -C control merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Run one fresh three-adult three-source scenario
        id: family
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/family-price"
          python3 -B source/scripts/diagnostics/anex_three_source_family_price.py "$RUNNER_TEMP/family-price"
      - name: Preserve sanitized three-adult evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-party-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/family-price/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation
        if: steps.family.outcome != 'success'
        run: exit 1
  live_control:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-three-source-party-control-v1-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed two-adult control source
        id: control
        run: |
          MARKER='control/.github/ops/anex-three-source-party-control-v1-20260913'
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-three-source-party-control-v1-20260913'
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(cat "$MARKER")" = "source=${SOURCE_SHA};operation=read-only-anex-three-source-party-control-v1;scenario=Turkey-2026-10-20-8n-2a-AI;owner=2026-09-13"
          git -C control merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Run one fresh two-adult three-source control
        id: control_run
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/party-control"
          python3 -B source/scripts/diagnostics/anex_three_source_party_control.py "$RUNNER_TEMP/party-control"
      - name: Preserve sanitized two-adult control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-party-control-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/party-control/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation
        if: steps.control_run.outcome != 'success'
        run: exit 1
  live_broad:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-three-source-party-broad-v1-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed broad three-adult source
        id: control
        run: |
          MARKER='control/.github/ops/anex-three-source-party-broad-v1-20260913'
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-three-source-party-broad-v1-20260913'
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(cat "$MARKER")" = "source=${SOURCE_SHA};operation=read-only-anex-three-source-party-broad-v1;scenario=Turkey-2026-10-20-8n-3a-AI-broad;owner=2026-09-13"
          git -C control merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Run one fresh broad three-adult three-source scenario
        id: broad_run
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/party-broad"
          python3 -B source/scripts/diagnostics/anex_three_source_party_broad.py "$RUNNER_TEMP/party-broad"
      - name: Preserve sanitized broad three-adult evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-party-broad-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/party-broad/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation
        if: steps.broad_run.outcome != 'success'
        run: exit 1
  live_family_broad:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-three-source-family-broad-v1-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed broad family source
        id: control
        run: |
          MARKER='control/.github/ops/anex-three-source-family-broad-v1-20260913'
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-three-source-family-broad-v1-20260913'
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(cat "$MARKER")" = "source=${SOURCE_SHA};operation=read-only-anex-three-source-family-broad-v1;scenario=Turkey-2026-10-29-9n-2a-child7-AI-broad;owner=2026-09-13"
          git -C control merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Run one fresh broad family three-source scenario
        id: family_broad_run
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/family-broad"
          python3 -B source/scripts/diagnostics/anex_three_source_family_broad.py "$RUNNER_TEMP/family-broad"
      - name: Preserve sanitized broad family evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-three-source-family-broad-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/family-broad/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation
        if: steps.family_broad_run.outcome != 'success'
        run: exit 1
