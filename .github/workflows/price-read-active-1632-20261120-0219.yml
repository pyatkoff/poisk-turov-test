name: PRICE read active server operation 1632
on:
  push:
    branches: ['ops/price-apply-promoted-1632-20261120-0214']
    paths: ['.github/workflows/price-read-active-1632-20261120-0219.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned connection
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST']; user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35); rows=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'): continue
            try: fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception: continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0': rows.append(line)
          assert rows
          pathlib.Path(os.environ['RUNNER_TEMP']+'/known').write_text('\n'.join(rows)+'\n')
          PY
      - name: Read the active PRICE process only
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "set -euo pipefail; echo PRICE_PROCESS_READBACK; ps -eo pid,lstart,etime,args | grep -E 'top500-daily-collector-v1.php|monitor-price-hook.php|apply_promoted_hotel_prices.php' | grep -v grep || true; echo PRICE_JOURNAL_MTIME; stat -c '%y %s' /var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl"
      - if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known"
