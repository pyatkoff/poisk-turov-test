name: PRICE verify predecessor release admission read-only
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-runtime-postdeploy-inspect-20261119.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.before == 'f16558d5729e2fd35bf98fe258c4405506c4c823' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check exact review source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: 774d5bb4d30c4e14ae819e0fbe97c5ea336d600e
          persist-credentials: false
      - name: Verify the predecessor on the normal read-only admission path
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITHUB_REPOSITORY=pyatkoff/max-search-bot node tools/release_priority.js --admit 1631 774d5bb4d30c4e14ae819e0fbe97c5ea336d600e c9b4d97a945f88e068b71a9af6c948013434e050
