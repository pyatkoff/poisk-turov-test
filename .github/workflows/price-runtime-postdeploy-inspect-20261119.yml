name: PRICE 1951 inspect 1945 server timer read-only
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-runtime-postdeploy-inspect-20261119.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '8c245e95e7306353073136bc5511a37adb3eb63c'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify terminal PRICE receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/poisk-turov-test/actions/runs/44563083153 --jq '.status+":"+(.conclusion//"")')" = "completed:success"
      - name: Prepare pinned server connection
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST']; user=os.environ['DEPLOY_USER']
          assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35); matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'): continue
            try: fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception: continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0': matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP'
          pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read timer and active process without writes
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" python3 <<'PY'
          import pathlib,subprocess,hashlib,json
          native=pathlib.Path('/var/www/anytoour/data/www/anytoour.ru/data')
          app=pathlib.Path('/var/www/anytoour/data/www/app.anytoour.ru')
          timer=json.loads(subprocess.check_output(['php',str(native/'hotel-price-timer-v1.php'),'--status']))
          p=subprocess.run(['pgrep','-af','top500-daily-collector-v1.php|hotel-price-timer-v1.php'],capture_output=True,text=True)
          lines=[x for x in p.stdout.splitlines() if 'pgrep -af' not in x]
          pids=[x.split(None,1)[0] for x in lines if x.split(None,1)[0].isdigit()]
          ps=subprocess.run(['ps','-o','pid=,ppid=,stat=,etime=,lstart=,cmd=','-p',','.join(pids)],capture_output=True,text=True) if pids else None
          feeds={}
          for n in ('telegram','max','all'):
            path=app/'feed'/('hotel-posts-'+n+'.xml')
            data=path.read_bytes()
            public=subprocess.check_output(['curl','-fsS','--max-time','40','https://app.anytoour.ru/feed/'+path.name])
            assert data==public
            feeds[n]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          print('PRICE_1945_TIMER_READ='+json.dumps({'as_of_utc':subprocess.check_output(['date','-u','+%Y-%m-%dT%H:%M:%SZ']).decode().strip(),'timer':timer,'processes':lines,'ps':ps.stdout.splitlines() if ps else [],'feeds':feeds},separators=(',',':')))
          PY
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
