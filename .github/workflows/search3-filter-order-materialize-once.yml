name: Search3 filter order one-shot materializer

on:
  push:
    branches:
      - ux/search3-filter-rail-priority-20260911

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'SEARCH3_FILTER_ORDER_MATERIALIZED') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: ux/search3-filter-rail-priority-20260911
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund

      - name: Materialize canonical generated filter asset only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/build/search3_assets.py --write
          python3 -B scripts/build/search3_assets.py --check
          actual_hash="$(sha256sum v2/search3-results-filters-v1.js | awk '{print $1}')"
          python3 - "$actual_hash" <<'PY'
          import json
          import pathlib
          import sys
          expected = sys.argv[1]
          data = json.loads(pathlib.Path('docs/project/search3-production-import.json').read_text())
          actual = data['assets']['search3-results-filters-v1.js']['productionSha256']
          if actual != expected:
              raise SystemExit(f'manifest hash mismatch: {actual} != {expected}')
          PY
          git diff --check -- v2/search3-results-filters-v1.js docs/project/search3-production-import.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/search3-results-filters-v1.js docs/project/search3-production-import.json
          staged="$(git diff --cached --name-only | sort)"
          expected_staged="$(printf '%s\n' docs/project/search3-production-import.json v2/search3-results-filters-v1.js | sort)"
          test "$staged" = "$expected_staged"
          git commit -m 'SEARCH3_FILTER_ORDER_MATERIALIZED canonical asset/hash'
          git push origin HEAD:ux/search3-filter-rail-priority-20260911
