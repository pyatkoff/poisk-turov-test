name: MATCH SAMO original hotelKey writer v1 live

on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/hotel-match-samo-live30-original-hotelkey-writer-v1-live.yml'

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: hotel-match-samo-live30-original-hotelkey-writer-1971-20260924-v1
  cancel-in-progress: false

env:
  OP: hotel-match-samo-live30-original-hotelkey-writer-1971-20260924-v1
  AUDIT_OP: hotel-match-samo-live30-original-hotelkey-current-1971-20260924-v3
  SOURCE: b2af9838cb33b8a9652ce3be9cd2625b106c23a0
  BASE: b2af9838cb33b8a9652ce3be9cd2625b106c23a0
  CLAIM: '5809709950'
  EXPECTED: '39'

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authority, exact scope and Security
        env:
          GH_TOKEN: '${{ github.token }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p input terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-samo-live30-original-hotelkey-writer-v1-live.yml "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json')); b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],os.environ['SOURCE'],'expected writes=39','SERIALIZABLE','insert-only','Provider/Andromeda/Tourvisor/direct-ANEX HTTP0','operation dir already exists, stop no-replay']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed': assert x['conclusion']=='success',x['conclusion']; break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          git show "$SOURCE:scripts/diagnostics/hotel_match_samo_live30_original_hotelkey_writer_v1.php" > input/writer.php
          php -l input/writer.php
          php input/writer.php --self-test

      - name: Execute guarded writer once
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST" > "$known" 2>/dev/null
          remote="$USER@$HOST"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"; audit=".anytoour-match/operations/$AUDIT_OP"
          python3 - <<'PY' > input/reservation.json
          import json,os
          print(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_write','expected_writes':int(os.environ['EXPECTED']),'source_sha':os.environ['SOURCE']},sort_keys=True))
          PY
          ssh "${opts[@]}" "$remote" "set -eu; umask 077; test -d \"\$HOME/$audit\"; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/$op\""
          scp "${opts[@]}" input/reservation.json input/writer.php "$remote:$op/"
          ssh "${opts[@]}" "$remote" "python3 - <<'PY'
          import os,json
          p=os.path.expanduser('~/$op/reservation.json')
          with open(p,'rb') as f: json.load(f)
          fd=os.open(p,os.O_RDONLY); os.fsync(fd); os.close(fd)
          d=os.open(os.path.dirname(p),os.O_RDONLY); os.fsync(d); os.close(d)
          PY
          php -l \"\$HOME/$op/writer.php\" >/dev/null"
          set +e
          ssh "${opts[@]}" "$remote" "MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_AUDIT_DIR=\"\$HOME/$audit\" ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_SOURCE_SHA='$SOURCE' php \"\$HOME/$op/writer.php\" --execute" > terminal/remote.stdout 2> terminal/remote.stderr
          ec=$?
          set -e
          printf '%s\n' "$ec" > terminal/remote.exit
          ssh "${opts[@]}" "$remote" "set -eu; cd \"\$HOME/$op\"; files='reservation.json'; for f in result.json receipt.json pre-commit.json commit-attempt.json; do if [ -f \"\$f\" ]; then files=\"\$files \$f\"; fi; done; tar -czf - \$files" > terminal/server.tgz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile(): pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          ec=int(pathlib.Path('terminal/remote.exit').read_text().strip())
          assert pathlib.Path('terminal/result.json').is_file() and pathlib.Path('terminal/receipt.json').is_file(), 'terminal_result_missing'
          r=json.load(open('terminal/result.json')); q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert ec==0,(ec,r)
          assert r['state']=='committed_verified' and r['inserted']==39 and r['mapping_writes']==39 and r['database_writes']==39
          assert r['readback_verified'] is True and r['inserted_by_namespace']=={'operator_115':39}
          for k in ['provider_http_calls','andromeda_calls','tourvisor_calls','direct_anex_calls']: assert r[k]==0,(k,r[k])
          assert q['state']=='committed_verified' and q['readback_verified'] is True and q['no_replay'] is True
          print(json.dumps(r,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'match-samo-original-hotelkey-writer-v1-${{ github.run_id }}'
          path: terminal/
          retention-days: 90
          if-no-files-found: error
