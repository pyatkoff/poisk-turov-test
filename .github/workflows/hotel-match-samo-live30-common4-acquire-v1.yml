name: MATCH SAMO live30 COMMON4 acquire v1
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php'
      - 'tests/hotel_match_samo_live30_common4_acquire_v1_test.php'
      - '.github/workflows/hotel-match-samo-live30-common4-acquire-v1.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-samo-live30-common4-acquire-1971-20260924-v1, cancel-in-progress: false}
env:
  OP: hotel-match-samo-live30-common4-acquire-1971-20260924-v1
  BASE: f1ac3b4e258dd349b60761072fd8f3916dcfe32a
  CLAIM: '5804146874'
  PLAN_ARTIFACT: '10780093445'
  PLAN_ARCHIVE_SHA: 6e88ad112b7ba53ff3608c80ad9a42683d6cf9ff980e21eb959a20597b326541
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php
      - run: php scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php --self-test
      - run: php tests/hotel_match_samo_live30_common4_acquire_v1_test.php
      - run: "! grep -E 'INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\\(' scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php"
  live:
    needs: focused
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate owner claim Security and immutable plan
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/plan terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-samo-live30-common4-acquire-v1.yml scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php tests/hotel_match_samo-live30-common4-acquire-v1.php "
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-samo-live30-common4-acquire-v1.yml scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php tests/hotel_match_samo_live30_common4_acquire_v1_test.php "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],'434 acquisition-ready','HOTELS batches <=30','operator_5=252','operator_115=426','operator_315=199','operator_342=227','HTTP0','database_writes0','mapping_writes0']:assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAN_ARTIFACT/zip" -o input/plan.zip
          test "$(sha256sum input/plan.zip|awk '{print $1}')" = "$PLAN_ARCHIVE_SHA"
          unzip -q input/plan.zip -d input/plan
          result="$(find input/plan -type f -name result.json -print -quit)"; receipt="$(find input/plan -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/plan-result.json;cp "$receipt" input/plan-receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=json.load(open('input/plan-result.json'));q=json.load(open('input/plan-receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('input/plan-result.json').read_bytes()).hexdigest()
          assert r['operation']=='hotel-match-samo-live30-common4-plan-1971-20260924-v1'
          assert r['state']=='samo_live30_common4_plan_ready'
          assert r['catalog_live30_count']==450 and r['acquisition_ready_count']==434
          assert r['missing_lane_counts']=={'operator_5':252,'operator_115':426,'operator_315':199,'operator_342':227}
          assert r['provider_http_calls']==0 and r['database_writes']==0 and r['mapping_writes']==0
          PY
      - name: Execute mass SAMO COMMON4 acquisition
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_provider','provider':'andromeda','database_writes':0,'mapping_writes':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\" \"\$HOME/$op/payload/app/integrations\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/plan-result.json "$remote:$op/payload/plan-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php "$remote:$op/payload/scripts/diagnostics/"
          scp "${opts[@]}" app/integrations/andromeda-client.php app/integrations/andromeda-transport.php app/integrations/andromeda-network-transport-failure.php "$remote:$op/payload/app/integrations/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_PLAN_RESULT=\"\$HOME/$op/payload/plan-result.json\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_samo_live30_common4_acquire_v1.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['state'] in ('completed_read_only','completed_read_only_partial')
          assert r['tourvisor_calls']==0 and r['direct_anex_calls']==0 and r['database_writes']==0 and r['mapping_writes']==0
          print(json.dumps({k:r[k] for k in ['state','reason','acquisition_ready_count','queried_edge_count','planned_batch_count','completed_batch_count','batch_error_count','samo_http_calls','edge_state_counts','operator_state_counts','single_native_source_unique_count','single_native_source_collision_count']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-samo-live30-common4-acquire-v1-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
