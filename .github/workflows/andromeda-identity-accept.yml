name: Andromeda reviewed identity promotion
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
permissions: {contents: read, actions: read}
concurrency: {group: andromeda-identity-writes, cancel-in-progress: false}
env:
  SOURCE_SHA: f4c67586b3164b6858b0840bafc7ef704073fe93
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify checked identity importer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34382797484" --jq '.head_sha + ":" + .conclusion' > "$RUNNER_TEMP/security"
          test "$(cat "$RUNNER_TEMP/security")" = "$SOURCE_SHA:success"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/34382797482" --jq '.head_sha + ":" + .conclusion' > "$RUNNER_TEMP/protocol"
          test "$(cat "$RUNNER_TEMP/protocol")" = "$SOURCE_SHA:success"
          git diff --exit-code "$SOURCE_SHA" HEAD -- app/ v2/ scripts/diagnostics/ tests/
          php -l scripts/diagnostics/andromeda_identity_accept.php
          python3 -B tests/andromeda_catalog_sync_test.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: pyatkoff/poisk-turov-test
          run-id: 34382304260
          artifact-ids: 10116334310
          merge-multiple: true
          path: ${{ runner.temp }}/saved
      - name: Prepare two owner-authorized identities from saved evidence
        run: python3 -B scripts/diagnostics/andromeda_identity_accept.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-identity-accept-reservation
          path: ${{ runner.temp }}/andromeda-identity-accept
          if-no-files-found: error
      - name: Accept the two pending identities and verify unchanged neighbors
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 -B scripts/diagnostics/andromeda_identity_accept.py apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andromeda-identity-accept-result
          path: ${{ runner.temp }}/andromeda-identity-accept
          if-no-files-found: error
