name: Reviewed hotel identity acceptance
run-name: Hotel observed bulk 1759 v1
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: andromeda-identity-writes
  cancel-in-progress: false
env:
  SOURCE_SHA: 7a3b826686d0f335ef0f6a5e2a6a07b8ed24ac09
  MERGE_SHA: 7f4f8f0f9ea53f4358c31757159d456245e011ea
  OPERATION_ID: hotel-observed-bulk-1759-20260911-v1
jobs:
  accept:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/int-andromeda-live-20260909' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 7a3b826686d0f335ef0f6a5e2a6a07b8ed24ac09
          path: reviewed
      - name: Verify merged checked source and reserve operation
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C reviewed rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          export STATE="$RUNNER_TEMP/$OPERATION_ID"
          gh api "repos/$GITHUB_REPOSITORY/pulls/1951" > "$STATE/pr.json"
          for id in 34535346574 34535346684; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$STATE/check-$id.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$OPERATION_ID-reservation&per_page=100" > "$STATE/prior-reservation.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          state=Path(os.environ['STATE'])
          pr=json.loads((state/'pr.json').read_bytes())
          if pr.get('merged_at') is None or pr.get('merge_commit_sha')!=os.environ['MERGE_SHA'] or pr.get('head',{}).get('sha')!=os.environ['SOURCE_SHA']:
              raise ValueError('checked_source_not_merged')
          for run_id in (34535346574,34535346684):
              value=json.loads((state/f'check-{run_id}.json').read_bytes())
              if value.get('head_sha')!=os.environ['SOURCE_SHA'] or value.get('conclusion')!='success':
                  raise ValueError('checked_source_unconfirmed')
          prior=json.loads((state/'prior-reservation.json').read_bytes())
          if prior.get('total_count')!=0 or prior.get('artifacts')!=[]:
              raise ValueError('prior_operation_do_not_replay')
          script=(Path('reviewed/scripts/diagnostics/hotel_observed_bulk_reconcile.php').read_text())
          if "const HB_OPERATION = 'hotel-observed-bulk-1759-20260911-v1';" not in script:
              raise ValueError('operation_source_changed')
          reservation={'state':'reserved_before_ssh','operation_id':os.environ['OPERATION_ID'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['SOURCE_SHA'],'merge_sha':os.environ['MERGE_SHA'],'rule':'unique_exact_current_name_or_alias_in_country','supplier_calls':0,'apply_must_not_retry':True,'unknown_must_use_receipt_only':True}
          (state/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          PYTHON
      - name: Preserve reservation before any application SSH
        id: reserved
        uses: actions/upload-artifact@v4
        with:
          name: hotel-observed-bulk-1759-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply once and verify server receipt
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, shlex, subprocess, tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          source=Path('reviewed/scripts/diagnostics/hotel_observed_bulk_reconcile.php').read_text()
          if not source.startswith('<?php'):
              raise ValueError('php_source')
          code=source[len('<?php'):]
          required=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          if any(not os.environ.get(k,'').strip() for k in required):
              raise ValueError('ssh_configuration')
          host=os.environ['ANYTOOUR_DEPLOY_HOST'].strip(); user=os.environ['ANYTOOUR_DEPLOY_USER'].strip()
          if host.startswith('-') or user.startswith('-') or any(c.isspace() for c in host+user):
              raise ValueError('ssh_target')
          with tempfile.TemporaryDirectory(prefix='hotel-observed-bulk-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key'; key.write_text(os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].rstrip()+'\n'); key.chmod(0o600)
              known=Path(tmp)/'known_hosts'
              command=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in required and not k.startswith('ANEX_')}
              def call(phase, timeout=180):
                  p=subprocess.run(command,input=json.dumps({'operation_id':os.environ['OPERATION_ID'],'phase':phase}),text=True,capture_output=True,timeout=timeout,env=clean)
                  try: value=json.loads(p.stdout)
                  except Exception: value={'status':'transport_unparseable'}
                  return p.returncode,value
              rc0,before=call('receipt',60)
              (state/'server-before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
              if rc0!=0 or before.get('status')!='not_started':
                  raise ValueError('server_operation_already_started')
              # Exactly one apply attempt. Never replay this call, even on timeout/unknown reply.
              try:
                  apply_rc,apply_result=call('apply',180)
              except subprocess.TimeoutExpired:
                  apply_rc=124; apply_result={'status':'apply_reply_timeout'}
              (state/'apply-response.json').write_text(json.dumps(apply_result,sort_keys=True)+'\n')
              # Safe readback only. This phase never writes or calls a supplier.
              receipt_rc,receipt=call('receipt',60)
              (state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
              if receipt_rc!=0 or receipt.get('status') not in ('completed','empty'):
                  raise ValueError('live_operation_unknown_no_replay')
              if receipt.get('operation_id')!=os.environ['OPERATION_ID'] or receipt.get('supplier_calls')!=0:
                  raise ValueError('receipt_scope')
              if receipt.get('status')=='completed' and receipt.get('readback_verified') is not True:
                  raise ValueError('readback_unconfirmed')
              summary={k:receipt.get(k) for k in ('status','operation_id','rule','catalog_scope','anex','andromeda','accepted_total','database_writes','readback_verified','before','after','supplier_calls')}
              (state/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True)+'\n')
              print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PYTHON
      - name: Preserve live result; no automatic retry
        if: always() && steps.reserved.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hotel-observed-bulk-1759-20260911-v1-result
          path: |
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v1/reservation.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v1/server-before.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v1/apply-response.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v1/receipt.json
            ${{ runner.temp }}/hotel-observed-bulk-1759-20260911-v1/summary.json
          if-no-files-found: warn
          retention-days: 90
