name: Reviewed hotel identity acceptance
run-name: Andromeda 1759 92-identity acceptance v1
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
  pull_request:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml', 'tests/anex_link_operation_test.py']
permissions: {contents: read, actions: read}
concurrency:
  group: ${{ github.event_name == 'push' && 'andromeda-identity-writes' || format('hotel-operation-check-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 030021061ba7595dced08813a7b28b16689cfd5e
  OPERATION_ID: andromeda-1759-validated-92-v1
jobs:
  check-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Check exact operation boundaries without private access
        run: python3 -B tests/anex_link_operation_test.py
  accept:
    needs: check-operation
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/int-andromeda-live-20260909' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 030021061ba7595dced08813a7b28b16689cfd5e
          path: reviewed
      - name: Verify checked source, exact evidence and absence of prior operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C reviewed rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          export STATE="$RUNNER_TEMP/$OPERATION_ID"
          for id in 34501866010 34501866003; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$STATE/check-$id.json"
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?branch=feat%2Fint-andromeda-live-20260909&event=push&per_page=100" > "$STATE/history.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$OPERATION_ID-reservation&per_page=100" > "$STATE/reservations.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10158366247" > "$STATE/input-meta.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10158366247/zip" > "$STATE/input.zip"
          python3 - <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          from zipfile import ZipFile

          def require_new_operation(pages, reservations, current_run):
              if not isinstance(pages, list) or not pages:
                  raise ValueError('operation_history_unavailable')
              runs = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(page.get('workflow_runs'), list):
                      raise ValueError('operation_history_unavailable')
                  runs.extend(page['workflow_runs'])
              if not any(r.get('id') == current_run for r in runs):
                  raise ValueError('current_operation_missing_from_history')
              prior = [r for r in runs if r.get('id') != current_run
                       and r.get('display_title') == 'Andromeda 1759 92-identity acceptance v1']
              if prior or reservations.get('total_count') != 0 or reservations.get('artifacts') != []:
                  raise ValueError('prior_reserved_or_completed_operation_do_not_replay')

          state = Path(os.environ['STATE'])
          require_new_operation(json.loads((state/'history.json').read_bytes()),
                                json.loads((state/'reservations.json').read_bytes()),
                                int(os.environ['GITHUB_RUN_ID']))
          for run_id in (34501866010, 34501866003):
              check = json.loads((state/f'check-{run_id}.json').read_bytes())
              if check.get('head_sha') != os.environ['SOURCE_SHA'] or check.get('conclusion') != 'success':
                  raise ValueError('checked_source_not_verified')
          meta = json.loads((state/'input-meta.json').read_bytes())
          archive_sha = 'cf33f78acb0a0522df8f981a6a7435196927a83206f6e0bc7996ec02b81b0181'
          if meta.get('expired') is not False or meta.get('digest') != 'sha256:'+archive_sha:
              raise ValueError('retained_evidence_unavailable')
          if hashlib.sha256((state/'input.zip').read_bytes()).hexdigest() != archive_sha:
              raise ValueError('evidence_archive_digest_mismatch')
          with ZipFile(state/'input.zip') as archive:
              raw = archive.read('scale-full.json')
          (state/'scale-full.json').write_bytes(raw)
          sys.path.insert(0, str(Path('reviewed/scripts/diagnostics').resolve()))
          import andromeda_identity_batch_accept as batch
          from anex_tourvisor_link_import import save
          payload = batch.request(state/'scale-full.json')
          request_hash = batch.digest(payload)
          if request_hash != '2a83b140e1ba36ad2d41168cd67abb1b3f05329e29793af41f5f5d23b7905024':
              raise ValueError('exact_92_request_changed')
          save(state/'reservation.json', {
              'state': 'reserved_before_ssh', 'operation_id': os.environ['OPERATION_ID'],
              'run_id': int(os.environ['GITHUB_RUN_ID']), 'source_sha': os.environ['SOURCE_SHA'],
              'request_sha256': request_hash, 'source_report_sha256': batch.REPORT_CANONICAL_SHA256,
              'pairs': [[r['external_hotel_id'], r['local_hotel_id']] for r in payload['rows']],
              'supplier_calls': 0, 'database_writes_started': False,
              'unknown_result_requires_readback_not_replay': True
          }, exclusive=True)
          print('Exact 92-identity operation prepared; database not yet contacted.')
          PYTHON
      - name: Preserve durable reservation before the only SSH write
        id: reserved
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-1759-validated-92-v1-reservation
          path: |
            ${{ runner.temp }}/andromeda-1759-validated-92-v1/reservation.json
            ${{ runner.temp }}/andromeda-1759-validated-92-v1/scale-full.json
          if-no-files-found: error
          retention-days: 90
      - name: Accept 92 checked identities through existing SSH and verify post-COMMIT rows
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 -B reviewed/scripts/diagnostics/andromeda_identity_batch_accept.py \
            --report "$RUNNER_TEMP/$OPERATION_ID/scale-full.json" \
            --receipt "$RUNNER_TEMP/$OPERATION_ID/receipt.json" --apply \
            --output "$RUNNER_TEMP/$OPERATION_ID/result.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          state = Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          value = json.loads((state/'receipt.json').read_bytes())
          if value.get('state') != 'finalized':
              raise ValueError('application_import_not_finalized')
          result = value['result']
          print(json.dumps({k: result.get(k) for k in (
              'status','input_count','updated','readback_verified','other_identities_unchanged',
              'counts','live_coverage','supplier_calls')}, ensure_ascii=False))
          PYTHON
      - name: Retain outcome including unknown or failed receipt; never retry automatically
        if: always() && steps.reserved.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-1759-validated-92-v1-result
          path: |
            ${{ runner.temp }}/andromeda-1759-validated-92-v1/reservation.json
            ${{ runner.temp }}/andromeda-1759-validated-92-v1/receipt.json
            ${{ runner.temp }}/andromeda-1759-validated-92-v1/receipt.json.outcome.json
            ${{ runner.temp }}/andromeda-1759-validated-92-v1/result.json
          if-no-files-found: error
          retention-days: 90
