name: Reviewed hotel identity acceptance
run-name: Andromeda 1759 Maldives bridge61 acceptance v1
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
  pull_request:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml', 'tests/anex_link_operation_test.py']
permissions: {contents: read, actions: read}
concurrency:
  group: ${{ github.event_name == 'push' && 'andromeda-identity-writes' || format('hotel-operation-check-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 543d0f0bb5be20fa0810bdf775e7e8c219980b69
  OPERATION_ID: andromeda-1759-maldives-bridge61-20260910-v1
jobs:
  check-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify explicit operation boundaries without private access
        run: python3 -B tests/anex_link_operation_test.py
  accept:
    needs: check-operation
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/int-andromeda-live-20260909' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 543d0f0bb5be20fa0810bdf775e7e8c219980b69
          path: reviewed
      - name: Verify checked source and new operation; prepare exact saved bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C reviewed rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          export STATE="$RUNNER_TEMP/$OPERATION_ID"
          for id in 34509355903 34509355947; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$STATE/check-$id.json"
          done
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?branch=feat%2Fint-andromeda-live-20260909&event=push&per_page=100" > "$STATE/history.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$OPERATION_ID-reservation&per_page=100" > "$STATE/reservations.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10164620676/zip" > "$STATE/pending.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10097668551/zip" > "$STATE/anex.zip"
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path

          def require_new_operation(pages, reservations, current_run):
              if not isinstance(pages,list) or not pages:
                  raise ValueError('operation_history_unavailable')
              runs=[]
              for page in pages:
                  if not isinstance(page,dict) or not isinstance(page.get('workflow_runs'),list):
                      raise ValueError('operation_history_unavailable')
                  runs.extend(page['workflow_runs'])
              if not any(r.get('id')==current_run for r in runs):
                  raise ValueError('current_operation_missing')
              prior=[r for r in runs if r.get('id')!=current_run and r.get('display_title')=='Andromeda 1759 Maldives bridge61 acceptance v1']
              if prior or reservations.get('total_count')!=0 or reservations.get('artifacts')!=[]:
                  raise ValueError('prior_operation_do_not_replay')

          state=Path(os.environ['STATE'])
          require_new_operation(json.loads((state/'history.json').read_bytes()),json.loads((state/'reservations.json').read_bytes()),int(os.environ['GITHUB_RUN_ID']))
          for run_id in (34509355903,34509355947):
              value=json.loads((state/f'check-{run_id}.json').read_bytes())
              if value.get('head_sha')!=os.environ['SOURCE_SHA'] or value.get('conclusion')!='success':
                  raise ValueError('checked_source_unconfirmed')
          sys.path.insert(0,str(Path('reviewed/scripts/diagnostics').resolve()))
          import andromeda_saved_bridge as bridge
          from anex_tourvisor_link_import import save
          payload=bridge.request(state/'pending.zip',state/'anex.zip')
          if bridge.OPERATION_ID!=os.environ['OPERATION_ID'] or bridge.digest(payload)!='941ad3dccbdd4d4c374bcf572016cc1234a535bfe56a5bcacbf1df99e8eac2b4':
              raise ValueError('reviewed_bridge_changed')
          save(state/'request.json',payload,exclusive=True)
          save(state/'reservation.json',{'state':'reserved_before_ssh','operation_id':bridge.OPERATION_ID,'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['SOURCE_SHA'],'request_sha256':bridge.digest(payload),'pairs':[[r['external_hotel_id'],r['local_hotel_id']] for r in payload['rows']],'supplier_calls':0,'unknown_requires_readback_not_replay':True},exclusive=True)
          print('Exactly61 retained Maldives bridges prepared; no supplier calls.')
          PYTHON
      - name: Preserve reservation and exact request before application transaction
        id: reserved
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-1759-maldives-bridge61-20260910-v1-reservation
          path: |
            ${{ runner.temp }}/andromeda-1759-maldives-bridge61-20260910-v1/reservation.json
            ${{ runner.temp }}/andromeda-1759-maldives-bridge61-20260910-v1/request.json
          if-no-files-found: error
          retention-days: 90
      - name: Accept the reviewed pending delta through existing SSH and current guards
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 -B reviewed/scripts/diagnostics/andromeda_saved_bridge.py \
            --pending "$RUNNER_TEMP/$OPERATION_ID/pending.zip" --anex "$RUNNER_TEMP/$OPERATION_ID/anex.zip" \
            --receipt "$RUNNER_TEMP/$OPERATION_ID/receipt.json" --apply --output "$RUNNER_TEMP/$OPERATION_ID/result.json"
      - name: Preserve outcome even when unknown; no automatic retries
        if: always() && steps.reserved.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-1759-maldives-bridge61-20260910-v1-result
          path: |
            ${{ runner.temp }}/andromeda-1759-maldives-bridge61-20260910-v1/reservation.json
            ${{ runner.temp }}/andromeda-1759-maldives-bridge61-20260910-v1/receipt.json
            ${{ runner.temp }}/andromeda-1759-maldives-bridge61-20260910-v1/receipt.json.outcome.json
            ${{ runner.temp }}/andromeda-1759-maldives-bridge61-20260910-v1/result.json
          if-no-files-found: error
          retention-days: 90
