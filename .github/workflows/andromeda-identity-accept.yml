name: Reviewed hotel identity acceptance
run-name: Andromeda 1759 complete saved catalogue read v1
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
  pull_request:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml', 'tests/anex_link_operation_test.py']
permissions: {contents: read, actions: read}
concurrency:
  group: ${{ github.event_name == 'push' && 'andromeda-identity-writes' || format('hotel-operation-check-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  check-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -B tests/anex_link_operation_test.py
  read:
    needs: check-operation
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/int-andromeda-live-20260909' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: d583c38fdbb08c711121b93108a40befeb608f7c, path: reviewed}
      - name: Read only completed private catalogue files; no DB or supplier operations
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('reviewed/scripts/diagnostics').resolve()))
          from anex_search3_owner_decisions import ssh_php
          from anex_tourvisor_link_import import save, digest
          PHP = r'''
          error_reporting(0);ob_start();
          try {
            if(PHP_SAPI!=='cli'||basename(realpath(getcwd()))!=='anytoour.ru')throw new RuntimeException();
            $request=json_decode(file_get_contents('php://stdin'),true,16,JSON_THROW_ON_ERROR);
            if(!isset(CE_COUNTRIES[$request['country']??''])||!in_array($request['part']??'',['catalog','local','plan'],true))throw new RuntimeException();
            $config=require getcwd().'/_preview/search3-anex-candidate/.andromeda-private.php';
            $private=realpath(dirname($config['catalog_path']));if(!$private)throw new RuntimeException();
            $stage=$private.'/'.CE_OPERATION.'-'.$request['country'];
            $capture=ce_read($stage.'/capture.json');$meta=ce_read($stage.'/capture-result.json');$plan=ce_read($stage.'/plan.json');$done=ce_read($stage.'/result.json');
            if(($done['status']??'')!=='imported'||($done['readback_verified']??false)!==true||ce_hash($capture)!==$meta['capture_sha256']||ce_hash($plan)!==$meta['plan_sha256']||ce_hash($capture['catalog'])!==$plan['catalog_sha256'])throw new RuntimeException();
            $data=$request['part']==='plan'?$plan:$capture[$request['part']];
            $result=['status'=>'saved_complete_part','country'=>$request['country'],'part'=>$request['part'],'country_id'=>$capture['country_id'],'country_name'=>$capture['country_name'],'supplier_country_id'=>$capture['supplier_country_id'],'capture_sha256'=>$meta['capture_sha256'],'plan_sha256'=>$meta['plan_sha256'],'data_sha256'=>ce_hash($data),'data'=>$data,'database_writes'=>0,'supplier_calls'=>0];
            $out=ce_json($result);if(strlen($out)>4000000)throw new RuntimeException();
            foreach([$config['username'],$config['password'],rawurlencode($config['username']),rawurlencode($config['password'])] as $secret)if($secret!==''&&strpos($out,$secret)!==false)throw new RuntimeException();
          }catch(Throwable $e){$out='{"status":"saved_read_failed","database_writes":0,"supplier_calls":0}';}
          while(ob_get_level())ob_end_clean();echo $out;
          '''
          source="define('CE_LIBRARY_ONLY',true);\n"+Path('reviewed/scripts/diagnostics/andromeda_country_expansion.php').read_text().removeprefix('<?php')+'\n'+PHP
          root=Path(os.environ['RUNNER_TEMP'])/'saved-full-catalogues';root.mkdir(mode=0o700)
          summary=[]
          for country in ('uae','thailand','vietnam','sri-lanka','maldives','cuba'):
              parts={}
              for part in ('catalog','local','plan'):
                  value=ssh_php(source,{'country':country,'part':part},maximum_bytes=4000000)
                  if value.get('status')!='saved_complete_part' or value.get('country')!=country or value.get('part')!=part or digest(value['data'])!=value['data_sha256']:
                      raise ValueError('saved_complete_part_unverified')
                  save(root/f'{country}-{part}.json',value,exclusive=True);parts[part]=value
              meta=parts['catalog'];capture={k:meta[k] for k in ('country_id','country_name','supplier_country_id')}
              capture.update(catalog=parts['catalog']['data'],local=parts['local']['data'])
              if digest(capture)!=meta['capture_sha256'] or digest(parts['plan']['data'])!=meta['plan_sha256']:
                  raise ValueError('complete_capture_mismatch')
              summary.append({'country':country,'hotels':len(capture['local']['hotels']),'aliases':len(capture['local']['aliases']),'sources':len(capture['catalog']['payload']['HOTELS']),'capture_sha256':meta['capture_sha256']})
          save(root/'summary.json',{'countries':summary,'supplier_calls':0,'database_writes':0},exclusive=True)
          print(json.dumps(summary,ensure_ascii=False))
          PYTHON
      - name: Retain exact tracked diagnostic sources for offline reproduction
        run: |
          test "$(git -C reviewed rev-parse HEAD)" = d583c38fdbb08c711121b93108a40befeb608f7c
          git -C reviewed archive --format=tar HEAD AGENTS.md OWNER_PRIORITY.json scripts/diagnostics app/integrations tests .github/workflows docs/integrations/anex-search3-autopilot.md > "$RUNNER_TEMP/saved-full-catalogues/reviewed-source.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andromeda-1759-complete-saved-catalogues-v1
          path: ${{ runner.temp }}/saved-full-catalogues/
          if-no-files-found: error
          retention-days: 90
