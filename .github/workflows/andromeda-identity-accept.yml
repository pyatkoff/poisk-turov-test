name: Hotel matching stage2 audit
run-name: Hotel matching stage2 live schema audit
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
permissions: {contents: read}
concurrency:
  group: hotel-matching-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current matching schemas and unresolved counts only
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 - <<'PYTHON'
          import json, os, shlex, subprocess, tempfile
          from pathlib import Path
          php=r'''$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException();$helper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once $helper;$pdo=v2_data_db();$pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$pdo->exec('START TRANSACTION READ ONLY');$out=['status'=>'ok','supplier_calls'=>0,'database_writes'=>0,'tables'=>[]];foreach(['anex_hotels','catalog_hotels','catalog_hotel_details','anex_search_hotel_observations','andromeda_search_hotel_observations','andromeda_hotel_identities'] as $t){$q=$pdo->query('SHOW COLUMNS FROM '.$t);$out['tables'][$t]=array_map(fn($r)=>['field'=>$r['Field'],'type'=>$r['Type']],$q->fetchAll(PDO::FETCH_ASSOC));}$out['counts']['anex_unresolved_observed']=(int)$pdo->query("SELECT COUNT(*) FROM anex_search_hotel_observations o LEFT JOIN anex_hotel_search_mappings m ON m.anex_hotel_id=o.anex_hotel_id LEFT JOIN anex_hotel_decisions d ON d.anex_hotel_id=o.anex_hotel_id WHERE m.anex_hotel_id IS NULL AND d.anex_hotel_id IS NULL")->fetchColumn();$out['counts']['andromeda_pending_observed']=(int)$pdo->query("SELECT COUNT(DISTINCT o.external_hotel_id) FROM andromeda_search_hotel_observations o JOIN andromeda_hotel_identities i ON i.supplier_namespace='andromeda_catalog' AND i.external_hotel_id=o.external_hotel_id WHERE o.supplier_namespace='andromeda_catalog' AND i.decision_status='pending' AND i.local_hotel_id IS NULL")->fetchColumn();$out['anex_staging_count']=(int)$pdo->query('SELECT COUNT(*) FROM anex_hotels')->fetchColumn();$pdo->rollBack();echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),"\n";'''
          required=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          with tempfile.TemporaryDirectory(prefix='match-stage2-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key';key.write_text(os.environ[required[0]].rstrip()+'\n');key.chmod(0o600);known=Path(tmp)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',os.environ[required[2]].strip(),os.environ[required[1]].strip(),'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(php)]
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=60,env={k:v for k,v in os.environ.items() if k not in required and not k.startswith('ANEX_')})
              value=json.loads(p.stdout)
              if p.returncode or value.get('status')!='ok' or value.get('supplier_calls')!=0 or value.get('database_writes')!=0: raise ValueError('audit_failed')
              out=Path(os.environ['RUNNER_TEMP'])/'hotel-matching-stage2-schema.json';out.write_text(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True)+'\n');print(json.dumps(value['counts'],sort_keys=True));print('anex_staging_count='+str(value['anex_staging_count']))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: hotel-matching-stage2-schema
          path: ${{ runner.temp }}/hotel-matching-stage2-schema.json
          if-no-files-found: error
          retention-days: 30
