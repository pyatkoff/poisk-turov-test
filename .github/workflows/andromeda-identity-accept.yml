name: Reviewed hotel identity acceptance
run-name: Andromeda 1759 saved-country evidence read v1
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml']
  pull_request:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/andromeda-identity-accept.yml', 'tests/anex_link_operation_test.py']
permissions: {contents: read, actions: read}
concurrency:
  group: ${{ github.event_name == 'push' && 'andromeda-identity-writes' || format('hotel-operation-check-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  SOURCE_SHA: 6a62df9ba2e82651c9a136c044d576f6e59f7205
jobs:
  check-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify bounded saved-file reader without private access
        run: python3 -B tests/anex_link_operation_test.py
  inspect:
    needs: check-operation
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/int-andromeda-live-20260909' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 6a62df9ba2e82651c9a136c044d576f6e59f7205
          path: reviewed
      - name: Verify the completed source and import before reading retained files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C reviewed rev-parse HEAD)" = "$SOURCE_SHA"
          for id in 34506089235 34506089363; do
            test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$id --jq '.head_sha+":"+.conclusion')" = "$SOURCE_SHA:success"
          done
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/34506730438 --jq '.head_sha+":"+.conclusion')" = 'ce0629c23987053f4ed339656b56ba185904cb28:success'
      - name: Read only saved pending rows and dictionary geography without DB or suppliers
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('reviewed/scripts/diagnostics').resolve()))
          from anex_search3_owner_decisions import ssh_php
          from anex_tourvisor_link_import import save, digest
          library = Path('reviewed/scripts/diagnostics/andromeda_country_expansion.php').read_text().removeprefix('<?php')
          reader = r'''
          error_reporting(0);ob_start();
          try {
            $q=json_decode(file_get_contents('php://stdin'),true,8,JSON_THROW_ON_ERROR);
            $country=$q['country']??'';
            if(!isset(CE_COUNTRIES[$country]))throw new RuntimeException();
            $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException();
            $config=require $root.'/_preview/search3-anex-candidate/.andromeda-private.php';
            $private=realpath(dirname($config['catalog_path']));if(!$private)throw new RuntimeException();
            $stage=$private.'/'.CE_OPERATION.'-'.$country;
            $cap=ce_read($stage.'/capture-result.json');$data=ce_read($stage.'/capture.json');
            $plan=ce_read($stage.'/plan.json');$receipt=ce_read($stage.'/result.json');
            if(($receipt['status']??'')!=='imported'||($receipt['readback_verified']??false)!==true||ce_hash($data)!==$cap['capture_sha256']||ce_hash($plan)!==$cap['plan_sha256']||$plan['catalog_sha256']!==ce_hash($data['catalog']))throw new RuntimeException();
            $locals=[];foreach($data['local']['hotels'] as $h)$locals[(int)$h['id']]=$h;
            $rows=[];
            foreach($plan['rows'] as $r){
              if($r['decision_status']!=='pending')continue;
              $e=json_decode($r['evidence_json'],true,64,JSON_THROW_ON_ERROR);$targets=[];
              foreach($e['candidate_ids'] as $id){if(!isset($locals[(int)$id]))throw new RuntimeException();$targets[]=$locals[(int)$id];}
              $rows[]=['identity'=>$r,'evidence'=>$e,'targets'=>$targets,'evidence_sha256'=>hash('sha256',$r['evidence_json'])];
            }
            $value=['status'=>'saved_pending_read','country'=>$country,'country_id'=>$data['country_id'],'supplier_country_id'=>$data['supplier_country_id'],'capture_sha256'=>$cap['capture_sha256'],'plan_sha256'=>$cap['plan_sha256'],'catalog_sha256'=>$plan['catalog_sha256'],'towns'=>$data['catalog']['payload']['TOWNTO'],'rows'=>$rows,'supplier_calls'=>0,'database_writes'=>0];
            $out=ce_json($value);
            foreach([$config['username'],$config['password'],rawurlencode($config['username']),rawurlencode($config['password'])] as $secret)if($secret!==''&&strpos($out,$secret)!==false)throw new RuntimeException();
            if(strlen($out)>4000000)throw new RuntimeException();
          } catch(Throwable $e){$out='{"status":"saved_read_failed","supplier_calls":0,"database_writes":0}';}
          while(ob_get_level())ob_end_clean();echo $out;
          '''
          source = "define('CE_LIBRARY_ONLY',true);\n" + library + '\n' + reader
          dest=Path(os.environ['RUNNER_TEMP'])/'saved-country-review';dest.mkdir(mode=0o700)
          summary=[]
          for country in ('uae','thailand','vietnam','sri-lanka','maldives','cuba'):
              value=ssh_php(source,{'country':country},maximum_bytes=4000000)
              save(dest/(country+'.json'),value,exclusive=True)
              if value.get('status')!='saved_pending_read' or value.get('country')!=country or value.get('supplier_calls')!=0 or value.get('database_writes')!=0:
                  raise ValueError('saved_read_not_confirmed')
              summary.append({'country':country,'pending':len(value['rows']),'sha256':digest(value)})
          save(dest/'summary.json',{'countries':summary,'supplier_calls':0,'database_writes':0},exclusive=True)
          print(json.dumps(summary,ensure_ascii=False))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andromeda-1759-saved-country-review-v1
          path: ${{ runner.temp }}/saved-country-review/
          if-no-files-found: error
          retention-days: 90
