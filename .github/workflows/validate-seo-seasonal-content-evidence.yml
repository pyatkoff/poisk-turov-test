name: Validate SEO seasonal content evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-seasonal-content-evidence-v1.php'
      - 'v2/seo-seasonal-source-registry-v1.php'
      - 'v2/seo-seasonal-verified-content-evidence-v1.php'
      - 'v2/seo-seasonal-editorial-review-v1.php'
      - 'v2/seo-seasonal-review-content-v1.php'
      - 'v2/seo-seasonal-content-packet-v1.php'
      - 'v2/seo-seasonal-review-page-v1.php'
      - 'v2/seo-seasonal-preview-readiness-v1.php'
      - 'v2/seo-seasonal-preview-evidence-readiness-v1.php'
      - 'v2/data/report-seo-seasonal-preview-readiness-v1.php'
      - 'v2/_preview/seo2/seasonal/**'
      - 'tests/seo-seasonal-content-evidence-smoke.php'
      - 'tests/seo-seasonal-source-registry-smoke.php'
      - 'tests/seo-seasonal-verified-content-evidence-smoke.php'
      - 'tests/seo-seasonal-editorial-review-smoke.php'
      - 'tests/seo-seasonal-review-content-smoke.php'
      - 'tests/seo-seasonal-content-packet-smoke.php'
      - 'tests/seo-seasonal-review-page-smoke.php'
      - 'tests/seo-seasonal-preview-publication-boundary-smoke.php'
      - 'tests/seo-seasonal-preview-readiness-smoke.php'
      - 'tests/seo-seasonal-preview-evidence-readiness-smoke.php'
      - '.github/workflows/validate-seo-seasonal-content-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate review-only content evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-seasonal-content-evidence-v1.php >/dev/null
          php -l v2/seo-seasonal-source-registry-v1.php >/dev/null
          php -l v2/seo-seasonal-verified-content-evidence-v1.php >/dev/null
          php -l v2/seo-seasonal-editorial-review-v1.php >/dev/null
          php -l v2/seo-seasonal-review-content-v1.php >/dev/null
          php -l v2/seo-seasonal-content-packet-v1.php >/dev/null
          php -l v2/seo-seasonal-review-page-v1.php >/dev/null
          php -l v2/seo-seasonal-preview-readiness-v1.php >/dev/null
          php -l v2/seo-seasonal-preview-evidence-readiness-v1.php >/dev/null
          php -l v2/data/report-seo-seasonal-preview-readiness-v1.php >/dev/null
          php -l v2/_preview/seo2/seasonal/antalya-september/index.php >/dev/null
          php -l v2/_preview/seo2/seasonal/maldives-september/index.php >/dev/null
          php -l tests/seo-seasonal-content-evidence-smoke.php >/dev/null
          php -l tests/seo-seasonal-source-registry-smoke.php >/dev/null
          php -l tests/seo-seasonal-verified-content-evidence-smoke.php >/dev/null
          php -l tests/seo-seasonal-editorial-review-smoke.php >/dev/null
          php -l tests/seo-seasonal-review-content-smoke.php >/dev/null
          php -l tests/seo-seasonal-content-packet-smoke.php >/dev/null
          php -l tests/seo-seasonal-review-page-smoke.php >/dev/null
          php -l tests/seo-seasonal-preview-publication-boundary-smoke.php >/dev/null
          php -l tests/seo-seasonal-preview-readiness-smoke.php >/dev/null
          php -l tests/seo-seasonal-preview-evidence-readiness-smoke.php >/dev/null
          php tests/seo-seasonal-content-evidence-smoke.php
          php tests/seo-seasonal-source-registry-smoke.php
          php tests/seo-seasonal-verified-content-evidence-smoke.php
          php tests/seo-seasonal-editorial-review-smoke.php
          php tests/seo-seasonal-review-content-smoke.php
          php tests/seo-seasonal-content-packet-smoke.php
          php tests/seo-seasonal-review-page-smoke.php
          php tests/seo-seasonal-preview-publication-boundary-smoke.php
          php tests/seo-seasonal-preview-readiness-smoke.php
          php tests/seo-seasonal-preview-evidence-readiness-smoke.php
