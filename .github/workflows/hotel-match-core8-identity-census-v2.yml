name: MATCH post-mass identity census v2
on:
  push:
    branches: ['ops/match-mass-bridge-1971-20260912']
    paths: ['.github/match-core8-identity-census-1971-20260912-v2.arm']
permissions: {contents: read}
env: {OP: hotel-match-core8-identity-census-1971-20260912-v2, OUT: /tmp/match-census-v2}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Freeze and reserve
        run: |
          set -euo pipefail;test "$GITHUB_RUN_ATTEMPT" = 1;test "$GITHUB_RUN_NUMBER" = 1;test "$(cat .github/match-core8-identity-census-1971-20260912-v2.arm)" = "$OP";mkdir -m 700 -p "$OUT";sed 's/hotel-match-core8-identity-census-1971-20260912-v1/hotel-match-core8-identity-census-1971-20260912-v2/' scripts/diagnostics/hotel_match_core8_identity_census.php > "$OUT/program.php";php -l "$OUT/program.php";printf '{"operation_id":"%s","state":"reserved_before_db_access","run_id":%s,"database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}\n' "$OP" "$GITHUB_RUN_ID" > "$OUT/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: 'census-v2-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Execute CURRENT read-only census
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail;key="$RUNNER_TEMP/k";known="$RUNNER_TEMP/known";if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi;chmod 600 "$key";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15);ok=0;for a in 1 2 3 4 5;do if ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -f config.php';then ok=1;break;fi;sleep $((a*12));done;test "$ok" = 1;ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M' < "$OUT/program.php" > "$OUT/stdout" 2> "$OUT/stderr";grep '^MATCH_CENSUS_JSON:' "$OUT/stdout"|tail -1|sed 's/^MATCH_CENSUS_JSON://' > "$OUT/result.json";grep -q '"status":"completed"' "$OUT/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'census-v2-${{ github.run_id }}-result', path: '${{ env.OUT }}/', retention-days: 90}
