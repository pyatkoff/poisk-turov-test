name: MATCH Tourvisor ANEX operator dictionary
on:
  push:
    branches: [match/manual-live-review-queue-1971-20260914]
    paths:
      - 'scripts/diagnostics/hotel_match_tv_operator_dictionary.php'
      - '.github/workflows/hotel-match-manual-live-queue.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-tv-operator-dictionary-1971-20260915-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-tv-operator-dictionary-1971-20260915-v1
  OUT: /tmp/match-tv-operator-dictionary-1971-v1
jobs:
  one-call-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Offline exact source and scope checks
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_tv_operator_dictionary.php)" = 3f916ce945bc73acd4c9fce2f2e86f5cc650a496
          php -l scripts/diagnostics/hotel_match_tv_operator_dictionary.php
          php scripts/diagnostics/hotel_match_tv_operator_dictionary.php --self-test
          grep -Fq "'endpoint'=>'/operators'" scripts/diagnostics/hotel_match_tv_operator_dictionary.php
          grep -Fq "'max_http_calls'=>1" scripts/diagnostics/hotel_match_tv_operator_dictionary.php
      - name: Reserve immutable operation before SSH or provider access
        run: |
          set -euo pipefail
          mkdir -m 700 "$OUT"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['OUT'])/'reservation.json'
          obj={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'state':'reserved_before_provider_access','endpoint':'/operators','params':{'departureId':1,'countryId':1},'max_http_calls':1,'new_searches':0,'database_writes':0,'mapping_writes':0,'booking_calls':0,'no_replay':True}
          with p.open('x') as f: f.write(json.dumps(obj,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-tv-operator-dictionary-reservation-${{ github.run_id }}
          path: ${{ env.OUT }}/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: One operator-dictionary call and durable readback
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match-dict-key"; known="$RUNNER_TEMP/match-dict-known"; sock="$RUNNER_TEMP/match-dict.sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "set -euo pipefail; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$OUT/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php" < scripts/diagnostics/hotel_match_tv_operator_dictionary.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"; trc=$?
          set -e
          test "$trc" -eq 0 -a -s "$OUT/server-operation.tgz"
          tar -xzf "$OUT/server-operation.tgz" -C "$OUT"
          export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT']);r=json.loads((p/'result.json').read_text());receipt=json.loads((p/'receipt.json').read_text());reservation=json.loads((p/'reservation.json').read_text());rh=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          ok=(int(os.environ['RC'])==0 and r.get('state')=='completed_read_only' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('source_sha')==os.environ['GITHUB_SHA'] and r.get('tourvisor_calls')==1 and r.get('new_searches')==0 and r.get('database_writes')==r.get('mapping_writes')==r.get('booking_calls')==0 and isinstance(r.get('anex_operator'),dict) and int(r['anex_operator'].get('id') or 0)>0 and receipt.get('result_sha256')==rh and receipt.get('readback_verified') is True and reservation.get('state')=='reserved_before_provider_access')
          gate={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':ok,'remote_exit':int(os.environ['RC']),'anex_operator':r.get('anex_operator'),'http_status':r.get('http_status'),'rate_headers':r.get('rate_headers'),'dictionary_row_count':r.get('dictionary_row_count'),'result_sha256':rh,'tourvisor_calls':r.get('tourvisor_calls'),'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n');print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-tv-operator-dictionary-${{ github.run_id }}
          path: ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 90