name: Publish checked ANEX Search3 preview v6 and verify full Andromeda pagination

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-anex-search3-preview-v6.yml'
      - 'scripts/diagnostics/anex_search3_preview_owner_gate_v6.py'
      - 'tests/anex_search3_preview_owner_control_v6_test.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && github.event.issue.number == 2530 && 'publish-anex-search3-preview-2530-v6' || format('check-anex-search3-preview-v6-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SOURCE_SHA: e4a6dfa2cefed04747fbe3e91127b165e88a62c9
  SOURCE_TREE: f5fad654455605f70a331dad5c99cda47a83889c
  SOURCE_BRANCH: feature/anex-search-adapter-20260907
  FIX_SHA: ca051254ca6c79c4692d9a36bbfe22d19cfd17a7
  ENDPOINT_BLOB: d840b13db9dcc496cf18183c216730fc7b9a86bf
  OPERATION_ID: publish-anex-search3-preview-2530-v6-full-pagination
  CANARY_OPERATION: andromeda-full-pagination-canary-2530-v6-country4-2026-10-20-2a-7n
  EXPECTED_ROUTE: /_preview/search3-anex-candidate/
  OWNER_COMMAND: /publish-anex-search3-preview-2530-v6

jobs:
  control-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify v6 control contract
        run: |
          set -euo pipefail
          python3 -B tests/anex_search3_preview_owner_control_v6_test.py
          python3 -m py_compile scripts/diagnostics/anex_search3_preview_owner_gate_v6.py

  authorize:
    needs: control-contract
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.allow.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact fresh owner command
        id: allow
        run: |
          set -euo pipefail
          python3 -B scripts/diagnostics/anex_search3_preview_owner_gate_v6.py
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
      - name: Verify exact source, merge provenance, six green pagination checks and unique command
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          source=os.environ['SOURCE_SHA']; branch=os.environ['SOURCE_BRANCH']; fix=os.environ['FIX_SHA']
          expected_runs={35273070654,35273070649,35273070655,35273070679,35273070678,35273070636}
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=20) as r: return json.load(r)
          if get('/branches/main')['commit']['sha'] != os.environ['GITHUB_SHA']: raise SystemExit('main_drift')
          if get('/branches/'+urllib.parse.quote(branch,safe=''))['commit']['sha'] != source: raise SystemExit('int_branch_drift')
          commit=get('/git/commits/'+source)
          if commit['tree']['sha'] != os.environ['SOURCE_TREE']: raise SystemExit('source_tree_drift')
          if fix not in [p['sha'] for p in commit.get('parents',[])]: raise SystemExit('fix_not_merged_parent')
          pr=get('/pulls/2835')
          if not pr.get('merged') or pr.get('merge_commit_sha') != source or pr.get('head',{}).get('sha') != fix:
              raise SystemExit('pagination_pr_provenance_mismatch')
          for run_id in expected_runs:
              run=get('/actions/runs/'+str(run_id))
              if run.get('head_sha')!=fix or run.get('status')!='completed' or run.get('conclusion')!='success':
                  raise SystemExit('pagination_run_not_green:'+str(run_id))
          endpoint=get('/contents/v2/api-andromeda-search3-preview.php?ref='+source)
          if endpoint.get('sha') != os.environ['ENDPOINT_BLOB']: raise SystemExit('endpoint_blob_mismatch')
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8')); trigger_id=event.get('comment',{}).get('id')
          matches=[]; page=1
          while True:
              rows=get('/issues/2530/comments?per_page=100&page='+str(page))
              if not rows: break
              matches.extend(c for c in rows if c.get('body')==os.environ['OWNER_COMMAND'] and c.get('user',{}).get('id')==226193297)
              if len(rows)<100: break
              page+=1
              if page>30: raise SystemExit('comment_scan_limit')
          if len(matches)!=1 or matches[0].get('id')!=trigger_id: raise SystemExit('duplicate_or_stale_owner_command')
          print('ANEX_PREVIEW_V6_SOURCE_PAGINATION_CHECKS_AND_COMMAND_OK')
          PY

  publish:
    needs: authorize
    if: github.event_name == 'issue_comment' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Recheck exact source and isolated publisher contract
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          cd candidate
          python3 -B tests/anex_search3_preview_deploy_test.py
          python3 -B tests/anex_search3_preview_safe_deploy_test.py
          python3 -B tests/andromeda-page-session-checkpoint-test.py
          php -l v2/api-andromeda-search3-preview.php
          php -l tests/andromeda-search3-page-orchestrator-test.php
          php tests/andromeda-search3-page-orchestrator-test.php
          php -l app/integrations/andromeda-anytour-offer-autosave.php
          php -l app/integrations/three-provider-money-facts.php
          php tests/andromeda-anytour-offer-autosave-test.php
          php tests/three-provider-money-facts-test.php
          php tests/three-provider-final-price-readiness-test.php
          test "$(git hash-object v2/api-andromeda-search3-preview.php)" = "$ENDPOINT_BLOB"
          grep -F 'target="$project/_preview/search3-anex-candidate"' scripts/diagnostics/anex_search3_preview_deploy.py >/dev/null
          ! grep -F 'target="$project/_preview/search3-site-candidate"' scripts/diagnostics/anex_search3_preview_deploy.py
          grep -F 'production_entry_changes": False' scripts/diagnostics/anex_search3_preview_deploy.py >/dev/null
          grep -F '.andromeda-private.php' scripts/diagnostics/anex_review_owner_preserve.php >/dev/null
      - name: Require existing deploy secrets without exposing them
        env:
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          api=os.environ.get('ANEX_API_TOKEN',''); b2b=os.environ.get('ANEX_B2B_TOKEN',''); key=os.environ.get('ANYTOOUR_DEPLOY_SSH_KEY','')
          if not api.strip() or len(api)>16384 or '\x00' in api: raise SystemExit('anex_api_secret_invalid')
          if not b2b or len(b2b)>16384 or b2b.lower().startswith('bearer ') or re.search(r'[\x00-\x20\x7f]',b2b): raise SystemExit('anex_b2b_secret_invalid')
          if 'PRIVATE KEY' not in key: raise SystemExit('ssh_key_invalid')
          print('ANEX_PREVIEW_V6_SECRETS_READY')
          PY
      - name: Prepare isolated SSH transport
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/v6-ssh"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/v6-ssh/key"
          chmod 600 "$RUNNER_TEMP/v6-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/v6-ssh/key" >/dev/null
      - name: Reserve v6 publication exactly once before server mutation
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,shlex,subprocess
          source=os.environ['SOURCE_SHA']; control=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; op=os.environ['OPERATION_ID']
          if not re.fullmatch(r'[0-9a-f]{40}',source) or not re.fullmatch(r'[0-9a-f]{40}',control) or not run.isdigit() or not re.fullmatch(r'[a-z0-9-]+',op): raise SystemExit('invalid_reservation_input')
          value=json.dumps({'state':'reserved','operation_id':op,'source_sha':source,'control_sha':control,'run_id':int(run),'replay_allowed':False},separators=(',',':'))+'\n'
          remote='''set -eu
          private="$HOME/.anytoour-anex"; test -d "$private" && test ! -L "$private"
          op="$private/''' + op + '''"; mkdir "$op"; chmod 700 "$op"; cat > "$op/reservation.json"; chmod 600 "$op/reservation.json"
          printf '%s\\n' ANEX_PREVIEW_V6_PUBLICATION_RESERVED
          '''
          root=os.environ['RUNNER_TEMP']+'/v6-ssh'
          cmd=['ssh','-T','-i',root+'/key','-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+root+'/known_hosts','-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'bash -c '+shlex.quote(remote)]
          r=subprocess.run(cmd,input=value,text=True,capture_output=True,timeout=45)
          if r.returncode or r.stdout!='ANEX_PREVIEW_V6_PUBLICATION_RESERVED\n': raise SystemExit('publication_reservation_failed_or_replayed')
          print(r.stdout.strip())
          PY
      - name: Publish exact INT source to isolated preview
        env:
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/v6-publication-artifact
        run: |
          set -euo pipefail
          mkdir -p "$ANEX_CATALOG_ARTIFACT_DIR"
          python3 -B candidate/scripts/diagnostics/anex_search3_preview_deploy_safe.py | tee "$ANEX_CATALOG_ARTIFACT_DIR/publisher-stdout.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR'])/'anex-search3-preview-deploy.json'; v=json.loads(p.read_text())
          assert v['status']=='deployed' and v['source_sha']==os.environ['SOURCE_SHA'] and v['route']==os.environ['EXPECTED_ROUTE']
          assert v['production_entry_changes'] is False
          print('ANEX_PREVIEW_V6_DEPLOY_RECEIPT_OK')
          PY
      - name: Exact runtime hash readback and HTTP no-supplier probe
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,shlex,subprocess
          from pathlib import Path
          pairs=[('app/integrations/andromeda-anytour-offer-autosave.php','app/integrations/andromeda-anytour-offer-autosave.php'),('app/integrations/three-provider-money-facts.php','app/integrations/three-provider-money-facts.php'),('v2/api-andromeda-search3-preview.php','api-andromeda-search3-preview.php')]
          expected={r:hashlib.sha256((Path('candidate')/l).read_bytes()).hexdigest() for l,r in pairs}
          remote='''set -eu
          target="$HOME/www/anytoour.ru/_preview/search3-anex-candidate"; test -d "$target" && test ! -L "$target"
          for f in app/integrations/andromeda-anytour-offer-autosave.php app/integrations/three-provider-money-facts.php api-andromeda-search3-preview.php; do test -f "$target/$f" && test ! -L "$target/$f"; sha256sum "$target/$f"; done
          '''
          root=os.environ['RUNNER_TEMP']+'/v6-ssh'
          cmd=['ssh','-T','-i',root+'/key','-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+root+'/known_hosts','-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'bash -c '+shlex.quote(remote)]
          r=subprocess.run(cmd,text=True,capture_output=True,timeout=45)
          if r.returncode: raise SystemExit('runtime_readback_failed')
          for line in r.stdout.splitlines():
              digest,path=line.split(None,1); rel=path.split('search3-anex-candidate/',1)[-1] if 'search3-anex-candidate/' in path else path.split('/')[-1]
              if expected.get(rel)!=digest: raise SystemExit('runtime_hash_mismatch:'+rel)
          if len(r.stdout.splitlines())!=3: raise SystemExit('runtime_readback_count')
          print('ANEX_PREVIEW_V6_RUNTIME_HASHES_OK')
          PY
          body="$RUNNER_TEMP/v6-get.json"; code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' 'https://anytoour.ru/_preview/search3-anex-candidate/api-andromeda-search3-preview.php')"
          test "$code" = 405
          python3 - "$body" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1],encoding='utf-8'))=={'ok':False,'error':'method_not_allowed'}
          print('ANDROMEDA_PREVIEW_V6_GET_405_OK')
          PY
      - name: Mark publication completed
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,shlex,subprocess
          value=json.dumps({'state':'completed','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'control_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'replay_allowed':False},separators=(',',':'))+'\n'
          op=os.environ['OPERATION_ID']; remote='''set -eu
          op="$HOME/.anytoour-anex/''' + op + '''"; test -d "$op" && test ! -L "$op" && test -f "$op/reservation.json" && test ! -e "$op/completed.json"
          cat > "$op/completed.json"; chmod 600 "$op/completed.json"; printf '%s\\n' ANEX_PREVIEW_V6_PUBLICATION_COMPLETED
          '''
          root=os.environ['RUNNER_TEMP']+'/v6-ssh'; cmd=['ssh','-T','-i',root+'/key','-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+root+'/known_hosts','-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'bash -c '+shlex.quote(remote)]
          r=subprocess.run(cmd,input=value,text=True,capture_output=True,timeout=45)
          if r.returncode or r.stdout!='ANEX_PREVIEW_V6_PUBLICATION_COMPLETED\n': raise SystemExit('publication_completion_failed')
          print(r.stdout.strip())
          PY
      - name: Upload sanitized publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-search3-preview-v6-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/v6-publication-artifact/
          if-no-files-found: error
          retention-days: 14

  full-pagination-canary:
    needs: [authorize, publish]
    if: github.event_name == 'issue_comment' && needs.authorize.outputs.allowed == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH outside artifact directory
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/v6-canary-ssh"
          mkdir -p "$RUNNER_TEMP/v6-canary-artifact"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/v6-canary-ssh/key"
          chmod 600 "$RUNNER_TEMP/v6-canary-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/v6-canary-ssh/key" >/dev/null
      - name: Run one bounded full-pagination orchestrator canary
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/v6-canary-artifact/result.json"; err="$RUNNER_TEMP/v6-canary-ssh/stderr.txt"; sshroot="$RUNNER_TEMP/v6-canary-ssh"
          set +e
          ssh -T -i "$sshroot/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$sshroot/known_hosts" -o ConnectTimeout=15 -o LogLevel=ERROR -l "$ANYTOOUR_DEPLOY_USER" "$ANYTOOUR_DEPLOY_HOST" 'cd "$HOME/www/anytoour.ru" && php' >"$out" 2>"$err" <<'PHP'
          <?php
          declare(strict_types=1); error_reporting(0); ini_set('display_errors','0'); ini_set('log_errors','0');
          $operation='andromeda-full-pagination-canary-2530-v6-country4-2026-10-20-2a-7n'; $expectedBlob='d840b13db9dcc496cf18183c216730fc7b9a86bf'; $maxPages=40;
          $result=['status'=>'blocked','operation'=>$operation,'page_calls'=>0,'max_page'=>0,'advertised_pages'=>0,'database_writes'=>0,'get_flights_calls'=>0,'quote_calls'=>0,'booking_calls'=>0,'replay_allowed'=>false];
          $exit=1;$pdo=null;$readOnly=false;$lock=null;$dir=null;
          function v6durable(string $path,array $value):void{$body=json_encode($value,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);if(strlen($body)>65536)throw new RuntimeException('result_too_large');$f=fopen($path,'x');if(!$f)throw new RuntimeException('checkpoint_exists');try{if(fwrite($f,$body)!==strlen($body)||!fflush($f))throw new RuntimeException('checkpoint_write');if(function_exists('fsync')&&!fsync($f))throw new RuntimeException('checkpoint_sync');}finally{fclose($f);}}
          function v6reason(Throwable $e):string{$m=$e->getMessage();return is_string($m)&&preg_match('/^[A-Za-z0-9_.:-]{1,96}$/D',$m)?$m:'operation_unconfirmed';}
          try{
              $root=realpath(getcwd());if(PHP_SAPI!=='cli'||!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('project_invalid');
              $target=$root.'/_preview/search3-anex-candidate';$private=dirname($root,2).'/.anytoour-andromeda';if(!is_dir($target)||is_link($target)||!is_dir($private)||is_link($private))throw new RuntimeException('runtime_missing');
              $endpoint=$target.'/api-andromeda-search3-preview.php';if(!is_file($endpoint)||is_link($endpoint))throw new RuntimeException('endpoint_missing');$bytes=file_get_contents($endpoint);$blob=sha1('blob '.strlen($bytes)."\0".$bytes);if($blob!==$expectedBlob)throw new RuntimeException('endpoint_blob_mismatch');
              $lockPath=$private.'/grouped-search-update.lock';if(!is_file($lockPath)||is_link($lockPath))throw new RuntimeException('publication_lock_missing');$lock=fopen($lockPath,'r+b');if(!$lock||!flock($lock,LOCK_SH|LOCK_NB))throw new RuntimeException('publication_busy');
              $dir=$private.'/'.$operation;if(file_exists($dir)||is_link($dir))throw new RuntimeException('operation_exists_no_replay');if(!mkdir($dir,0700))throw new RuntimeException('reservation_failed');v6durable($dir.'/reservation.json',['operation'=>$operation,'source_sha'=>'e4a6dfa2cefed04747fbe3e91127b165e88a62c9','endpoint_blob'=>$expectedBlob,'created_at'=>time(),'replay_allowed'=>false]);
              require_once $endpoint;$configPath=$target.'/.andromeda-private.php';if(!is_file($configPath)||is_link($configPath))throw new RuntimeException('private_runtime_missing');$config=require $configPath;if(!is_array($config)||($config['enabled']??null)!==true)throw new RuntimeException('private_runtime_missing');
              $dbPath=$root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');if(!is_file($dbPath)||is_link($dbPath))throw new RuntimeException('db_runtime_missing');require_once $dbPath;$pdo=v2_data_db();$pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$pdo->exec('START TRANSACTION READ ONLY');$readOnly=true;
              $before=(int)$pdo->query("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda'")->fetchColumn();
              $request=['generation'=>25301021,'page'=>1,'params'=>['countryId'=>'4','departureId'=>'1','dateFrom'=>'2026-10-20','dateTo'=>'2026-10-20','nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'childs'=>[],'meal'=>'','hotelCategory'=>'','hotelIds'=>[],'regionIds'=>[],'subregionIds'=>[],'operatorIds'=>[],'currency'=>'RUB']];
              $saved=anytour_andromeda_search3_catalog($config,$request);$saved['excluded_operator_ids']=$config['excluded_operator_ids']??[];$session=substr(hash('sha256',$operation),0,48);
              $page1=anytour_andromeda_search3_run($request,$pdo,$saved,$config,$session);$result['page_calls']=1;$result['max_page']=1;$pages=(int)($page1['pages_count']??0);$result['advertised_pages']=$pages;$result['page1_received_offers']=(int)($page1['received_offers']??0);$result['page1_mapped_offers']=(int)($page1['mapped_offers']??0);
              $ref=$page1['search_ref']??null;if(!is_string($ref)||!preg_match('/^[a-f0-9]{64}$/D',$ref))throw new RuntimeException('page1_search_ref_invalid');if(($page1['page']??null)!==1||$pages<2)throw new RuntimeException('pagination_not_advertised');if($pages>$maxPages)throw new RuntimeException('canary_page_budget_exceeded');
