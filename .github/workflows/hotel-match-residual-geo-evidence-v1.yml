name: MATCH held113 saved source geography evidence
on:
  push:
    branches: [ops/match-residual-geo-evidence-1971-20260915-v1]
    paths: [.github/workflows/hotel-match-residual-geo-evidence-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-residual-geo-evidence-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-residual-geo-evidence-1971-20260915-v1
jobs:
  current-intake:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Read immutable held-result artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10394794968/zip > "$RUNNER_TEMP/parent.zip"
      - name: Verify pinned helpers and offline classification before reservation
        run: |
          set -euo pipefail
          php -d allow_url_fopen=0 tests/hotel_match_provider_geo_consensus_review_test.php
          php -d allow_url_fopen=0 tests/hotel_match_state_accepted_country_consensus_test.php
          php -d allow_url_fopen=0 tests/hotel_match_live_residual_current_review_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_residual_guards_bundle.py)" = 7ab783a7d468cf0fee28abddb9b8df033d46f82c
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,sys,zipfile
          sys.path.insert(0,'scripts/diagnostics')
          import hotel_match_residual_guards_bundle as parent
          p=pathlib.Path(os.environ['RUNNER_TEMP']);raw=(p/'parent.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='3fcd3e5d979a4974b53d5e26df703ca19d9046be1771fd301c24163bd114879f'
          z=zipfile.ZipFile(p/'parent.zip');rb=z.read('server/result.json');r=json.loads(rb);receipt=json.loads(z.read('server/receipt.json'))
          assert hashlib.sha256(rb).hexdigest()==receipt['result_sha256']=='0a7f816a521267c708009b3722b58cb651421bb5ba9f3e8d841b04e185cab337'
          assert r['state']=='completed_read_only' and receipt['readback_verified']
          assert z.read('reservation.json')==z.read('server/reservation.json')
          ids=sorted(str(x['external_hotel_id']) for x in r['routes']['held']);assert len(ids)==len(set(ids))==113
          assert not set(ids).intersection(str(x['external_hotel_id']) for x in r['candidates'])
          php=parent.build().replace(parent.OP,os.environ['OPERATION_ID'])
          needle=';$present=[];$pending=array_values(array_filter($pending,'
          insert=";$heldIDs=array_fill_keys(["+','.join("'"+i+"'" for i in ids)+"],true);$plan=array_intersect_key($plan,$heldIDs);$present=[];$pending=array_values(array_filter($pending,"
          assert php.count(needle)==1;php=php.replace(needle,insert,1)
          fn="""function rgeo_source(array $e):array{$src=mcr_source($e);$out=[];foreach(['name','lName','state','stateLName','stateKey','town','townLName','townKey','region','regionName','regionLName','regionKey','area','areaName','areaKey','district','districtName','districtKey','country_name','countryName','latitude','longitude'] as $k)if(isset($src[$k])&&is_scalar($src[$k])&&strlen((string)$src[$k])<=512)$out[$k]=$src[$k];return$out;}"""
          needle="if(PHP_SAPI!=='cli')";assert php.count(needle)==1;php=php.replace(needle,fn+'\n'+needle,1)
          needle="'names'=>mcr_names($e),'points'=>mcr_points($e)";assert php.count(needle)==1;php=php.replace(needle,"'names'=>mcr_names($e),'retained_source_geo'=>rgeo_source($e),'points'=>mcr_points($e)",1)
          (p/'residual.php').write_text(php)
          print(json.dumps({'held_ids':len(ids),'bundle_sha256':hashlib.sha256(php.encode()).hexdigest(),'supplier_calls':0,'db_writes':0}))
          PYCODE
          php -l "$RUNNER_TEMP/residual.php"
          php -d allow_url_fopen=0 "$RUNNER_TEMP/residual.php" --self-test
      - name: Reserve before SSH or database access
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];p.mkdir(mode=0o700)
          d={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_db_access','coordination_issue':2530,'claim_comment_id':5680181765,'queue_issue':1971,'purpose':'saved source geography labels for113 held IDs only; prior43 passing IDs excluded; unchanged guards and no apply','bundle_sha256':__import__('hashlib').sha256(pathlib.Path(os.environ['RUNNER_TEMP'],'residual.php').read_bytes()).hexdigest(),'parent_current_run_id':34967808256,'parent_guard_result_sha256':'0a7f816a521267c708009b3722b58cb651421bb5ba9f3e8d841b04e185cab337','candidate_dossier_sha256':'9291e4d74a1c74ac78b17a2ec0e7f8722c019b35183525453c68e83ec515ab3d','database_writes':0,'supplier_calls':0,'no_replay':True}
          (p/'reservation.json').write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-residual-geo-evidence-v1-reservation
          path: ${{ runner.temp }}/hotel-match-residual-geo-evidence-1971-20260915-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Read remaining pending and active core8 names aliases geography once
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$RUNNER_TEMP/residual.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server'
          r=json.loads((s/'result.json').read_text());receipt=json.loads((s/'receipt.json').read_text());digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert receipt['result_sha256']==digest and receipt['readback_verified']
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert not set(r['excluded_claim_ids']).intersection(str(x['external_hotel_id']) for rows in r['routes'].values() for x in rows)
          assert all(x['operation_id']==os.environ['OPERATION_ID'] and x['source_sha']==os.environ['GITHUB_SHA'] for x in (r,receipt))
          gate={'operation_id':os.environ['OPERATION_ID'],'state':r['state'],'result_sha256':digest,'planned':r.get('planned_count'),'not_current_pending':len(r.get('not_current_pending_ids',[])),'pending':r.get('pending_andromeda_rows'),'excluded_current':len(r.get('excluded_current_ids',[])),'candidate_count_prepared_only':r.get('candidate_count'),'reason_counts':r.get('reason_counts'),'readback_verified':True}
          (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True)+'\n');print(json.dumps(gate))
          assert os.environ['REMOTE_RC']=='0' and r['state']=='completed_read_only' and r['db_writes']==r['supplier_calls']==0 and r['prepared_only'] is True and r['accepted_mappings']==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-residual-geo-evidence-v1-result
          path: ${{ runner.temp }}/hotel-match-residual-geo-evidence-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
