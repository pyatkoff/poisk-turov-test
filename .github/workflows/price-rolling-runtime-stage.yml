name: Stage the PRICE publication runtime with the switch off

on:
  push:
    branches: [ops/price-pilot-sample-20261127]
    paths:
      - 'ops/price-pilot/rolling-runtime-stage.txt'

permissions:
  contents: read

concurrency:
  group: price-rolling-readback
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'pyatkoff/poisk-turov-test'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install only the inactive private runtime
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd ops/price-pilot
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          test "$DEPLOY_USER" = anytoour && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY"
          if [[ "$DEPLOY_KEY" == *'PRIVATE KEY'* ]]; then
            printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$scratch/key"
          else
            printf '%s' "$DEPLOY_KEY" | base64 --decode > "$scratch/key"
          fi
          printf '%s %s\n' "$DEPLOY_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA' > "$scratch/known_hosts"
          ssh_old=(ssh -4 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$scratch/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST")
          grep -qx 'stage' rolling-runtime-stage.txt
          release="$GITHUB_SHA"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]]
          remote='set -eu; umask 077; d=$(mktemp -d); trap '"'"'rm -rf "$d"'"'"' EXIT; tar -xzf - -C "$d"; cd "$d"; bash stage-price-runtime.sh '
          tar -czf - rolling-publication.py rolling-digest.php apply-rolling-result.php return-vps-host-key.pub dispatch-rolling-price.sh stage-price-runtime.sh |
            timeout 90 "${ssh_old[@]}" "$remote$release" | tee "$scratch/receipt"
          grep -qx "PRICE_RUNTIME_STAGED release=$release active_state=absent" "$scratch/receipt"
