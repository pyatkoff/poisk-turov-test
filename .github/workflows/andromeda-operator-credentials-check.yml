name: Andromeda operator credentials offline
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-client.php'
      - 'tests/andromeda-operator-credentials-smoke.php'
      - '.github/workflows/andromeda-operator-credentials-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Lint client and credential regression
        run: |
          php -l app/integrations/andromeda-client.php
          php -l tests/andromeda-operator-credentials-smoke.php
      - name: Exercise operator credential plumbing without supplier access
        run: php -d allow_url_fopen=0 tests/andromeda-operator-credentials-smoke.php
