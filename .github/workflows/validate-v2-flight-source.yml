name: Validate V2 flight source contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/flight-empty-recovery-v1.js'
      - 'v2/flight-price-sync-v1.js'
      - 'v2/search3-results-filters-v1.js'
      - 'v2/search3-selected-flow-v2.js'
      - 'v2/tour-controller-v4.js'
      - 'tests/search3-flight-fallback-browser.cjs'
      - '.github/workflows/validate-v2-flight-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flight-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate empty-flight recovery behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const listeners={};
          let retryButton=null;
          let realVariant=null;
          const leadForm={};
          const empty={
            textContent:'Для тура варианты рейсов не найдены.',
            insertAdjacentElement(position,node){
              if(position!=='afterend')throw new Error('unexpected insert position '+position);
              retryButton=node;
            }
          };
          const box={
            querySelector(sel){
              if(sel==='.flight-variant')return realVariant;
              if(sel==='.flight-error')return null;
              if(sel==='.load-flights')return retryButton;
              return null;
            },
            querySelectorAll(sel){return sel==='.selected-loading'&&!realVariant?[empty]:[];}
          };
          const selectedTour={
            dataset:{},
            querySelector(sel){
              if(sel==='.tour-flights')return box;
              if(sel==='.lead-form')return leadForm;
              return null;
            }
          };
          const document={
            readyState:'loading',
            getElementById:id=>id==='selectedTour'?selectedTour:null,
            addEventListener(type,fn){(listeners[type]||(listeners[type]=[])).push(fn);},
            createElement(tag){return {tagName:String(tag).toUpperCase(),type:'',className:'',dataset:{},textContent:''};}
          };
          class MutationObserver{observe(){}}
          const window={
            V2TourController:{currentTour:{id:'tour-1'}},
            addEventListener(type,fn){(listeners[type]||(listeners[type]=[])).push(fn);}
          };
          const requestAnimationFrame=fn=>fn();
          vm.runInNewContext(fs.readFileSync('v2/flight-empty-recovery-v1.js','utf8'),{window,document,MutationObserver,requestAnimationFrame,String,Array});
          const api=window.V2FlightEmptyRecoveryV1;
          if(!api||api.version!==1||api.currentTourId()!=='tour-1')throw new Error('empty recovery API missing');

          const first=api.decorate(selectedTour);
          let state={text:empty.textContent,retries:retryButton&&retryButton.dataset.tid==='tour-1'?1:0,lead:!!selectedTour.querySelector('.lead-form')};
          if(!first||!state.text.includes('Данные по рейсам пока не получены')||state.retries!==1||!state.lead)throw new Error('empty recovery failed: '+JSON.stringify(state));

          api.decorate(selectedTour);
          state={retries:retryButton&&retryButton.dataset.tid==='tour-1'?1:0};
          if(state.retries!==1)throw new Error('duplicate retry: '+JSON.stringify(state));

          realVariant={textContent:'Рейс найден'};
          retryButton=null;
          const decoratedReal=api.decorate(selectedTour);
          state={variants:realVariant?1:0,retries:retryButton?1:0};
          if(decoratedReal!==false||state.variants!==1||state.retries!==0)throw new Error('real flight altered: '+JSON.stringify(state));
          console.log('FLIGHT_EMPTY_RECOVERY_OK '+JSON.stringify(state));
          JS

      - name: Validate selected-flight fuel fallback
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const listeners={};
          const selectedPrice={innerHTML:''};
          const fuelLabel={textContent:'Топливный сбор'};
          const fuelValue={textContent:'1 500 ₽'};
          const fuelFact={querySelector:sel=>sel==='span'?fuelLabel:sel==='b'?fuelValue:null};
          const leadNote={textContent:''};
          const document={
            head:{appendChild(){}},
            getElementById(){return null;},
            createElement(){return {id:'',className:'',textContent:'',appendChild(){},querySelectorAll(){return[];}};},
            querySelector(sel){
              if(sel==='#selectedTour .selected-price')return selectedPrice;
              if(sel==='#selectedTour .lead-form .section-heading span')return leadNote;
              return null;
            },
            querySelectorAll(sel){
              if(sel==='#selectedTour .facts>div')return [fuelFact];
              if(sel==='#selectedTour .flight-choice b'||sel==='#selectedTour .flight-variant')return [];
              return [];
            }
          };
          class CustomEvent{constructor(type,init={}){this.type=type;this.detail=init.detail;}}
          const window={
            addEventListener(type,fn){(listeners[type]||(listeners[type]=[])).push(fn);},
            dispatchEvent(event){for(const fn of listeners[event.type]||[])fn(event);return true;}
          };
          vm.runInNewContext(fs.readFileSync('v2/flight-price-sync-v1.js','utf8'),{window,document,CustomEvent,Intl,Object,Array,Number,String,Math,RegExp});
          const sync=window.V2FlightPriceSync,tour={price:100000,fuelCharge:1500};let eventFuel=null;
          if(!sync||sync.version!==2)throw new Error('flight price sync API missing');
          window.addEventListener('v2:tour-price-updated',e=>eventFuel=e.detail.fuelCharge);
          sync.reset(tour);
          sync.sync(tour,{price:110000,fuelCharge:5000},0);
          const specific=fuelValue.textContent;
          sync.sync(tour,{price:112000},1);
          const fallback=fuelValue.textContent, fallbackEvent=eventFuel;
          sync.sync(tour,{price:113000,fuelCharge:0},2);
          const explicitZero=fuelValue.textContent, zeroEvent=eventFuel;
          const states={specific,fallback,fallbackEvent,explicitZero,zeroEvent,hasSelectedFuelValue:typeof sync.selectedFuelValue==='function'};
          if(!states.specific.includes('5')||!states.fallback.includes('1')||states.fallbackEvent!==1500||states.explicitZero!=='—'||states.zeroEvent!==0||!states.hasSelectedFuelValue)throw new Error('fuel fallback failed: '+JSON.stringify(states));
          console.log('FLIGHT_FUEL_FALLBACK_OK '+JSON.stringify(states));
          JS

      - name: Validate Search3 empty-flight retry and lead handoff
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node tests/search3-flight-fallback-browser.cjs
