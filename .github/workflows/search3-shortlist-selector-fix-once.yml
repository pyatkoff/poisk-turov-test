name: Search3 shortlist selector fix once

on:
  push:
    branches:
      - refactor/search3-drop-meal-normalization-20260917
    paths:
      - .github/workflows/search3-shortlist-selector-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/search3-drop-meal-normalization-20260917
          fetch-depth: 0
          persist-credentials: true
      - name: Patch only flagged shortlist fact selectors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "refactor/search3-drop-meal-normalization-20260917"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/search3-shortlist-browser.cjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ("page.locator('dt', { hasText: /^Питание$/ })", "page.locator('dt', { hasText: /^Питание(?: · отличается)?$/ })"),
              ("page.locator('dt', { hasText: /^Номер$/ })", "page.locator('dt', { hasText: /^Номер(?: · отличается)?$/ })"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check tests/search3-shortlist-browser.cjs
          git diff --check
          git rm .github/workflows/search3-shortlist-selector-fix-once.yml
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(.github/workflows/search3-shortlist-selector-fix-once.yml tests/search3-shortlist-browser.cjs)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"
          git diff -- tests/search3-shortlist-browser.cjs | grep -Fq "Питание(?: · отличается)?"
          git diff -- tests/search3-shortlist-browser.cjs | grep -Fq "Номер(?: · отличается)?"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/search3-shortlist-browser.cjs
          git commit -m "test(search3): match flagged shortlist facts"
          git push origin HEAD:refactor/search3-drop-meal-normalization-20260917
