name: Validate Direct offer feed

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/direct-offer-retargeting-v1.js'
      - 'v2/analytics-v4.js'
      - 'v2/data/direct-feed-v1.php'
      - 'diagnostics/direct_offer_feed_contract_test.php'
      - '.github/workflows/validate-direct-offer-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-offer-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and feed ID contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/direct-feed-v1.php
          php -l diagnostics/direct_offer_feed_contract_test.php
          php diagnostics/direct_offer_feed_contract_test.php
      - name: Validate browser/feed ID symmetry
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "return id?'hotel_'+id:''" v2/direct-offer-retargeting-v1.js
          grep -Fq "'hotel_' . (int)\$id" v2/data/direct-feed-v1.php
          grep -Fq "ecommerce:'dataLayer'" v2/analytics-v4.js
          echo 'DIRECT_BROWSER_FEED_ID_SYMMETRY_OK'
