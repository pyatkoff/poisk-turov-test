name: Validate SEO phase5 seasonal review

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-phase5-seasonal-review-v1.php'
      - 'v2/seo-phase5-expansion-review-gate-v1.php'
      - 'v2/seo-seasonal-opportunity-gate-v1.php'
      - 'tests/seo-phase5-seasonal-review-smoke.php'
      - '.github/workflows/validate-seo-phase5-seasonal-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seasonal-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fast ordered seasonal review checks
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-phase5-seasonal-review-v1.php >/dev/null
          php -l tests/seo-phase5-seasonal-review-smoke.php >/dev/null
          php tests/seo-phase5-seasonal-review-smoke.php
          php tests/seo-seasonal-opportunity-gate-smoke.php
