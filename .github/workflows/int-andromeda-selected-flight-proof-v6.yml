name: INT Andromeda selected-flight proof v6

on:
  push:
    branches: ['ops/int-andromeda-selected-flight-proof-20260918-v6']
    paths:
      - 'scripts/ops/int_andromeda_selected_flight_proof_v6.php'
      - '.github/workflows/int-andromeda-selected-flight-proof-v6.yml'

permissions:
  contents: read

concurrency:
  group: int-andromeda-selected-flight-proof-1717-20260918-v6
  cancel-in-progress: false

jobs:
  proof:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: 5472fec0d2b3486f51c0a37b906214cc66d3d6c7
      RELEASE_DATA_SHA: 041de3812c93cb27760d1c7d7500a8156864111c
      OPERATION_ID: int-andromeda-selected-flight-proof-1717-20260918-v6
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_DATA_SHA }}
          path: release-data
          persist-credentials: false

      - name: Bind exact one-shot source and offline guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/int-andromeda-selected-flight-proof-v6.yml'
          test "${changed[1]}" = 'scripts/ops/int_andromeda_selected_flight_proof_v6.php'

          php -l scripts/ops/int_andromeda_selected_flight_proof_v6.php >/dev/null
          php -l app/integrations/andromeda-package-capture.php >/dev/null
          php -l app/integrations/andromeda-client.php >/dev/null
          php -l app/integrations/andromeda-saved-package-runtime.php >/dev/null
          php tests/andromeda-package-capture-smoke.php
          php tests/andromeda-selected-quote-smoke.php

          for path in \
            app/integrations/andromeda-client.php \
            app/integrations/andromeda-package-capture.php \
            app/integrations/andromeda-selected-offer.php \
            app/integrations/andromeda-selected-quote.php \
            app/integrations/andromeda-saved-package-runtime.php \
            app/integrations/andromeda-search-surcharge.php; do
            test "$(git rev-parse "$BASE_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done
          test "$(git -C release-data rev-parse HEAD)" = "$RELEASE_DATA_SHA"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY"
          test -n "$ANYTOOUR_DEPLOY_HOST"
          test -n "$ANYTOOUR_DEPLOY_USER"

      - name: Prepare exact temporary INT runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

          stage="$RUNNER_TEMP/andromeda-selected-flight-proof-v6"
          mkdir -p "$stage/app" "$stage/v2" "$stage/scripts/ops"
          cp -a app/integrations "$stage/app/"
          cp v2/api-anex-search3-preview.php v2/api-andromeda-search3-preview.php "$stage/v2/"
          cp -a release-data/v2/data "$stage/v2/"
          cp scripts/ops/int_andromeda_selected_flight_proof_v6.php "$stage/scripts/ops/"
          sed -i \
            -e 's/int_andromeda_selected_flight_proof_v5.php/int_andromeda_selected_flight_proof_v6.php/g' \
            -e 's/17171834/17171835/g' \
            -e 's/2026-10-22/2026-10-23/g' \
            "$stage/scripts/ops/int_andromeda_selected_flight_proof_v6.php"
          grep -q "'generation' => 17171835" "$stage/scripts/ops/int_andromeda_selected_flight_proof_v6.php"
          test "$(grep -c '2026-10-23' "$stage/scripts/ops/int_andromeda_selected_flight_proof_v6.php")" -ge 2
          ! grep -q '2026-10-22' "$stage/scripts/ops/int_andromeda_selected_flight_proof_v6.php"
          php -l "$stage/scripts/ops/int_andromeda_selected_flight_proof_v6.php" >/dev/null
          tar -C "$stage" -czf "$RUNNER_TEMP/andromeda-selected-flight-proof-v6.tar.gz" .

      - name: Execute exactly one private selected-flight proof
        shell: bash
        run: |
          set -euo pipefail
          opts=(-T -i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          scp_opts=(-i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"

          scp "${scp_opts[@]}" "$RUNNER_TEMP/andromeda-selected-flight-proof-v6.tar.gz" "$remote:$archive"
          set +e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" "$BASE_SHA" <<'REMOTE'
          set -euo pipefail
          operation="$1"; archive="$2"; source="$3"
          site="$HOME/www/anytoour.ru"
          ledger="$HOME/.anytour-ops/$operation"

          test -d "$site"
          test -s "$site/config.php"
          test -s "$HOME/.anytoour-andromeda/search3-preview.php"
          test ! -e "$ledger"

          mkdir -p "$HOME/.anytour-ops"
          mkdir -m 700 "$ledger"
          printf '%s\n' reserved > "$ledger/state"

          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"
          trap 'rm -rf "$work"; rm -f "$archive"' EXIT
          tar -C "$work" -xzf "$archive"

          set +e
          php "$work/scripts/ops/int_andromeda_selected_flight_proof_v6.php" "$site" "$source" \
            > "$ledger/receipt.tmp" 2> "$ledger/error.log"
          rc=$?
          set -e

          if [ -s "$ledger/receipt.tmp" ]; then
            mv "$ledger/receipt.tmp" "$ledger/receipt.json"
          else
            rm -f "$ledger/receipt.tmp"
            printf '%s\n' '{"status":"failed_terminal_no_replay","failure_class":"script_exception_or_abort","replay_allowed":false}' > "$ledger/receipt.json"
          fi
          chmod 600 "$ledger/receipt.json" "$ledger/error.log" || true
          printf '%s\n' failed_terminal_no_replay > "$ledger/state"

          # Supplier-free readback of only the bounded facts introduced by #2925.
          # Match by this exact source SHA; raw supplier rows/text never leave the server.
          php -r '
            $cfg=require $argv[1]; $source=$argv[2]; $receiptPath=$argv[3];
            if(!is_array($cfg)||!is_string($cfg["catalog_path"]??null)) exit(0);
            $dir=dirname($cfg["catalog_path"])."/searches";
            $matches=[];
            foreach(glob($dir."/*-package.json")?:[] as $path){
              if(is_link($path)||!is_file($path)||filesize($path)>3000000) continue;
              try{$e=json_decode((string)file_get_contents($path),true,32,JSON_THROW_ON_ERROR);}catch(Throwable){continue;}
              if(($e["source"]??null)!==$source||!is_array($e["record"]??null)) continue;
              $r=$e["record"];
              if(($r["status"]??null)!=="unknown"||($r["diagnostic_code"]??null)!=="ANDROMEDA_SUPPLIER_ERROR"||!is_array($r["supplier_error_facts"]??null)) continue;
              $f=$r["supplier_error_facts"];
              $allowed=["source","shape","error_sha256","reason_category","code","code_field"];
              if(array_diff(array_keys($f),$allowed)||($f["source"]??null)!=="andromeda_package_error") continue;
              if(!in_array($f["shape"]??null,["array","string","integer","float","boolean","null","other"],true)) continue;
              if(!is_string($f["error_sha256"]??null)||!preg_match("/^[a-f0-9]{64}$/D",$f["error_sha256"])) continue;
              if(!in_array($f["reason_category"]??null,["flight_or_freight","auth_or_session","claim_or_package","service","price_or_fare","date_or_time","hotel","unclassified"],true)) continue;
              $hasCode=array_key_exists("code",$f)||array_key_exists("code_field",$f);
              if($hasCode && (!is_string($f["code"]??null)||!preg_match("/^[A-Za-z0-9_.:-]{1,64}$/D",$f["code"])||!in_array($f["code_field"]??null,["error","code","errorCode","error_code","status","type"],true))) continue;
              $matches[]=$f;
            }
            if(count($matches)!==1) exit(0);
            try{$receipt=json_decode((string)file_get_contents($receiptPath),true,32,JSON_THROW_ON_ERROR);}catch(Throwable){exit(0);}
            if(!is_array($receipt)||($receipt["status"]??null)!=="failed_terminal_no_replay"||($receipt["package_diagnostic_code"]??null)!=="ANDROMEDA_SUPPLIER_ERROR") exit(0);
            $receipt["package_supplier_error_facts"]=$matches[0];
            $tmp=$receiptPath.".facts.tmp";
            file_put_contents($tmp,json_encode($receipt,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n",LOCK_EX);
            chmod($tmp,0600); rename($tmp,$receiptPath);
          ' "$HOME/.anytoour-andromeda/search3-preview.php" "$source" "$ledger/receipt.json"

          if [ "$rc" -eq 0 ]; then
            php -r '
              $x=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR);
              if(($x["status"]??null)!=="completed"
                ||($x["final_price_verified"]??false)!==true
                ||($x["verified_positive_rub_final"]??false)!==true
                ||($x["quote_state"]??null)!=="verified"
                ||($x["actualization_state"]??null)!=="verified"
                ||($x["package_capture_reused"]??true)!==false
                ||($x["db_writes"]??-1)!==0
                ||($x["booking_calls"]??-1)!==0
                ||($x["autosave_calls"]??-1)!==0) exit(2);
            ' "$ledger/receipt.json"
            printf '%s\n' completed > "$ledger/state"
          fi
          exit "$rc"
          REMOTE
          rc=$?
          set -e

          ssh "${opts[@]}" "$remote" "cat \"\$HOME/.anytour-ops/$OPERATION_ID/receipt.json\"" \
            > "$RUNNER_TEMP/receipt.json" || true
          test -s "$RUNNER_TEMP/receipt.json"
          cat "$RUNNER_TEMP/receipt.json"
          python3 - "$RUNNER_TEMP/receipt.json" <<'PY'
          import json,re,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          if r.get('package_diagnostic_code')=='ANDROMEDA_SUPPLIER_ERROR':
              f=r.get('package_supplier_error_facts')
              if not isinstance(f,dict) or f.get('source')!='andromeda_package_error':
                  raise SystemExit('classified package supplier facts missing')
              if not isinstance(f.get('error_sha256'),str) or not re.fullmatch(r'[a-f0-9]{64}',f['error_sha256']):
                  raise SystemExit('classified package supplier hash invalid')
          PY
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Preserve sanitized selected-flight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-andromeda-selected-flight-proof-v6-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
