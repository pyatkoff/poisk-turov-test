name: INT Andromeda PRICE tourKey inventory v1

on:
  push:
    branches: ['ops/int-andromeda-tourkey-inventory-20260919-v1']
    paths: ['.github/workflows/int-andromeda-tourkey-inventory-v1.yml']

permissions: {contents: read}
concurrency:
  group: int-andromeda-tourkey-inventory-1717-20260919-v1
  cancel-in-progress: false

jobs:
  inventory:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ea5bb22a9edc72c0c3af1007920b509f9325b63d
      OPERATION_ID: int-andromeda-tourkey-inventory-1717-20260919-v1
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ env.BASE_SHA }}', path: source, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: '${{ github.sha }}', path: ops, persist-credentials: false}

      - name: Bind exact PRICE-only contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$GITHUB_SHA"
          php -l ops/scripts/ops/andromeda_tourkey_inventory_v1.php
          php -l source/v2/api-andromeda-search3-preview.php
          php -l source/app/integrations/andromeda-normalizer.php
          ! grep -Eq -- '->(package|calc|changeService|getFlights)[[:space:]]*\(' ops/scripts/ops/andromeda_tourkey_inventory_v1.php
          ! grep -Eiq -- '\b(INSERT|UPDATE|DELETE|REPLACE|CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE)\b' ops/scripts/ops/andromeda_tourkey_inventory_v1.php
          grep -Fq "'tourKey'" ops/scripts/ops/andromeda_tourkey_inventory_v1.php
          grep -Fq "'programKeys'" ops/scripts/ops/andromeda_tourkey_inventory_v1.php
          grep -Fq "'spoKeys'" ops/scripts/ops/andromeda_tourkey_inventory_v1.php

      - name: Prepare private exact runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          stage="$RUNNER_TEMP/runtime"
          mkdir -p "$stage/app" "$stage/v2/data" "$stage/scripts/ops"
          cp -a source/app/integrations "$stage/app/"
          cp source/v2/api-anex-search3-preview.php source/v2/api-andromeda-search3-preview.php "$stage/v2/"
          cp source/v2/data/hotel-details-v1.php "$stage/v2/data/"
          cp ops/scripts/ops/andromeda_tourkey_inventory_v1.php "$stage/scripts/ops/"
          tar -C "$stage" -czf "$RUNNER_TEMP/runtime.tar.gz" .
          ssh-keyscan -T 15 -t ed25519 "$ANYTOOUR_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1

      - name: Execute one fresh exact-scope PRICE inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          opts=(-T -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=30)
          scp_opts=(-i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"
          scp "${scp_opts[@]}" "$RUNNER_TEMP/runtime.tar.gz" "$remote:$archive"
          set +e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" "$BASE_SHA" <<'REMOTE'
          set -euo pipefail
          operation="$1"; archive="$2"; source="$3"
          site="$HOME/www/anytoour.ru"; private="$HOME/.anytoour-andromeda"; ledger="$HOME/.anytour-ops/$operation"
          test -d "$site"; test -s "$site/config.php"; test -s "$private/search3-preview.php"; test ! -e "$ledger"
          mkdir -p "$HOME/.anytour-ops"; mkdir -m 700 "$ledger"; printf '%s\n' reserved > "$ledger/state"
          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"
          trap 'rm -rf "$work"; rm -f "$archive"' EXIT
          tar -C "$work" -xzf "$archive"

          snapshot(){ php -d display_errors=0 <<'PHP'
          <?php declare(strict_types=1); error_reporting(0);
          $root=rtrim((string)getenv('HOME'),'/').'/www/anytoour.ru';
          require_once $root.'/config.php';
          require_once (is_file($root.'/data/db-v1.php')?$root.'/data/db-v1.php':$root.'/v2/data/db-v1.php');
          $db=v2_data_db(); $db->exec('START TRANSACTION READ ONLY');
          $c=static fn(string $sql):int=>(int)$db->query($sql)->fetchColumn();
          echo json_encode([
            'all_offers'=>$c('SELECT COUNT(*) FROM anytour_offers'),
            'andromeda_offers'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda'"),
            'identities'=>$c("SELECT COUNT(*) FROM andromeda_hotel_identities")
          ],JSON_THROW_ON_ERROR);
          $db->rollBack();
          PHP
          }
          snapshot > "$ledger/before.json"
          set +e
          php "$work/scripts/ops/andromeda_tourkey_inventory_v1.php"             --site-root="$site"             --private-config="$private/search3-preview.php"             --source-sha="$source"             --operation-id="$operation"             --departure=1 --country=4             --date-from=2026-09-19 --date-to=2026-09-22             --nights-from=7 --nights-to=10 --adults=2             --generation=17171901             > "$ledger/result.json" 2> "$ledger/error.log"
          rc=$?
          set -e
          snapshot > "$ledger/after.json"
          if cmp -s "$ledger/before.json" "$ledger/after.json"; then db_same=true; else db_same=false; fi
          RC="$rc" DB_SAME="$db_same" php -r '
            $r=is_file($argv[1])&&filesize($argv[1])?json_decode(file_get_contents($argv[1]),true,64,JSON_THROW_ON_ERROR):null;
            $out=[
              "status"=>(int)getenv("RC")===0?"completed_terminal_no_replay":"failed_terminal_no_replay",
              "operation"=>$argv[2],"source"=>$argv[3],"db_unchanged"=>getenv("DB_SAME")==="true",
              "result"=>$r,"replay_allowed"=>false
            ];
            file_put_contents($argv[4],json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL);
          ' "$ledger/result.json" "$operation" "$source" "$ledger/receipt.json"
          printf '%s\n' "$([ "$rc" -eq 0 ] && echo completed_terminal_no_replay || echo failed_terminal_no_replay)" > "$ledger/state"
          cat "$ledger/receipt.json"
          exit "$rc"
          REMOTE
          rc=$?
          set -e
          ssh "${opts[@]}" "$remote" "cat "\$HOME/.anytour-ops/$OPERATION_ID/receipt.json"" > "$RUNNER_TEMP/result/receipt.json" || true
          test -s "$RUNNER_TEMP/result/receipt.json"
          cat "$RUNNER_TEMP/result/receipt.json"
          test "$rc" = 0
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result','receipt.json')
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='completed_terminal_no_replay' and d['replay_allowed'] is False and d['db_unchanged'] is True,d
          r=d['result']
          assert r['status']=='completed_terminal_no_replay' and r['replay_allowed'] is False,r
          for k in ['package_calls','get_flights_calls','changeservice_calls','calc_calls','booking_calls','db_writes','autosave_calls','search3_publication']:
              assert r[k]==0,(k,r[k])
          assert r['price_rows']>=0 and r['distinct_operator_tour_keys']>=0
          assert len(r['tourKey_groups'])==r['distinct_operator_tour_keys']
          print(json.dumps({
            'price_pages':r['price_pages'],
            'price_rows':r['price_rows'],
            'mapped_offers':r['mapped_offers'],
            'owned_mapped_offers':r['owned_mapped_offers'],
            'distinct_operator_tour_keys':r['distinct_operator_tour_keys'],
            'missing_tourKey':r['missing_tourKey'],
            'top_tour_keys':r['tourKey_groups'][:20],
          },ensure_ascii=False,sort_keys=True))
          PY

      - name: Preserve sanitized terminal receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: int-andromeda-tourkey-inventory-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/result/receipt.json
          if-no-files-found: warn
          retention-days: 30
