name: MATCH Tourvisor identity backfill SQL contract v1

on:
  push:
    branches: [diag/match-tourvisor-identity-backfill-sql-contract-1971-20260917-v1]
    paths:
      - scripts/diagnostics/hotel_match_tourvisor_identity_backfill_sql_contract_v1.php
      - .github/workflows/hotel-match-tourvisor-identity-backfill-sql-contract-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: match-tourvisor-identity-backfill-sql-contract-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-tourvisor-identity-backfill-sql-contract-1971-20260917-v1
  SCRIPT_PATH: scripts/diagnostics/hotel_match_tourvisor_identity_backfill_sql_contract_v1.php

jobs:
  diagnose:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Self-test and reserve before DB access
        shell: bash
        run: |
          set -euo pipefail
          php -l "$SCRIPT_PATH"
          php "$SCRIPT_PATH" --self-test
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          cp "$SCRIPT_PATH" "$out/diagnostic.php"
          export SCRIPT_SHA256="$(sha256sum "$SCRIPT_PATH" | awk '{print $1}')"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5716375316,'script_sha256':os.environ['SCRIPT_SHA256'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tv-identity-sql-contract-v1-reservation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hotel-match-tourvisor-identity-backfill-sql-contract-1971-20260917-v1/reservation.json
            ${{ runner.temp }}/hotel-match-tourvisor-identity-backfill-sql-contract-1971-20260917-v1/diagnostic.php
          retention-days: 90
      - name: Execute READ ONLY SQL contract diagnostic
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$out/diagnostic.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'
          r=json.loads((s/'result.json').read_text()); c=json.loads((s/'receipt.json').read_text()); h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          ok=(r.get('state')=='completed_read_only' and r.get('rows_before')==0 and r.get('expected_hotel_operator_pairs',0)>0 and c.get('result_sha256')==h and c.get('readback_verified') is True and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']))
          g={'verified':ok,'state':r.get('state'),'rows_before':r.get('rows_before'),'expected_hotel_operator_pairs':r.get('expected_hotel_operator_pairs'),'source_stats':r.get('source_stats'),'prepare_original':r.get('prepare_original'),'prepare_qualified':r.get('prepare_qualified'),'server':r.get('server'),'result_sha256':h,'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(g,ensure_ascii=False,sort_keys=True)); raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-identity-sql-contract-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tourvisor-identity-backfill-sql-contract-1971-20260917-v1/
          retention-days: 90
