name: Search3 LOCAL preview live read-only acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/search3-local-preview-live-readonly-acceptance.cjs'
      - '.github/workflows/search3-local-preview-live-readonly-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Guard test-only surface
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/search3-local-preview-live-readonly-acceptance.cjs
          ! grep -En '\.search-submit.*\.click|continue-search.*\.click|confirm-tour.*\.click' tests/search3-local-preview-live-readonly-acceptance.cjs
          ! grep -En 'secrets\.|ssh|scp|rsync' tests/search3-local-preview-live-readonly-acceptance.cjs

      - name: Install pinned browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/search3-local-live-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-local-live-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify published LOCAL preview without supplier search or lead writes
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/search3-local-live-tools/node_modules
          SEARCH3_LOCAL_LIVE_URL: https://anytoour.ru/_preview/search3-local-candidate/prototype-search/
          SEARCH3_LOCAL_LIVE_OUTPUT: ${{ runner.temp }}/search3-local-live-readonly
        run: node tests/search3-local-preview-live-readonly-acceptance.cjs

      - name: Retain live acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-local-live-readonly-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/search3-local-live-readonly/
          if-no-files-found: warn
          retention-days: 14
