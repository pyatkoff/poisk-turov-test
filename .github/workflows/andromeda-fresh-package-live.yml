name: Owner Andromeda calc probe
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-andromeda-calc-live
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event.issue.number == 996 &&
      github.event.comment.user.login == 'pyatkoff' &&
      github.event.comment.body == '/probe-andromeda-calc-1717-v9'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact owner command and first run attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.issue.number }}" = 996
          test "${{ github.event.comment.user.login }}" = pyatkoff
          test "${{ github.event.comment.body }}" = /probe-andromeda-calc-1717-v9
      - uses: actions/checkout@v4
        with:
          ref: 48c0d57e26adcaaea884c6dc7be68a18b1691d65
          persist-credentials: false
      - name: Verify exact checked calc source
        run: |
          test "$(git rev-parse HEAD)" = 48c0d57e26adcaaea884c6dc7be68a18b1691d65
          python3 -m py_compile scripts/diagnostics/andromeda_calc_probe.py tests/andromeda_calc_probe_test.py
          python3 tests/andromeda_calc_probe_test.py
      - name: Fetch exact successful selected-flight artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected-flights"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/pyatkoff/poisk-turov-test/actions/artifacts/10266054879/zip' \
            -o "$RUNNER_TEMP/selected-flights.zip"
          unzip -q "$RUNNER_TEMP/selected-flights.zip" -d "$RUNNER_TEMP/selected-flights"
          test -f "$RUNNER_TEMP/selected-flights/result.json"
          test -f "$RUNNER_TEMP/selected-flights/private-selected-claim.json"
      - name: Recalculate exact selected claim
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 scripts/diagnostics/andromeda_calc_probe.py --execute "$RUNNER_TEMP/selected-flights"
      - name: Preserve private calculated-claim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-calc-${{ github.run_id }}
          path: ${{ runner.temp }}/andromeda-calc/*.json
          if-no-files-found: error
          retention-days: 2
