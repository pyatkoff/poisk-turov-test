name: Owner Andromeda required flight selection
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-andromeda-select-flights-live
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      github.event.issue.number == 996 &&
      github.event.comment.user.login == 'pyatkoff' &&
      github.event.comment.body == '/probe-andromeda-select-flights-1717-v8'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact owner command and first run attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.issue.number }}" = 996
          test "${{ github.event.comment.user.login }}" = pyatkoff
          test "${{ github.event.comment.body }}" = /probe-andromeda-select-flights-1717-v8
      - uses: actions/checkout@v4
        with:
          ref: d115ded260be5ef6681de933ec4b79db2244748a
          persist-credentials: false
      - name: Verify exact corrected flight-selection source
        run: |
          test "$(git rev-parse HEAD)" = d115ded260be5ef6681de933ec4b79db2244748a
          python3 -m py_compile scripts/diagnostics/andromeda_select_required_flights_probe.py tests/andromeda_select_required_flights_probe_test.py
          python3 tests/andromeda_select_required_flights_probe_test.py
      - name: Fetch exact successful get_flights artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/get-flights"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/pyatkoff/poisk-turov-test/actions/artifacts/10266397672/zip' \
            -o "$RUNNER_TEMP/get-flights.zip"
          unzip -q "$RUNNER_TEMP/get-flights.zip" -d "$RUNNER_TEMP/get-flights"
          test -f "$RUNNER_TEMP/get-flights/result.json"
          test -f "$RUNNER_TEMP/get-flights/private-flights.json"
      - name: Select the only required outbound and return flights
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 scripts/diagnostics/andromeda_select_required_flights_probe.py --execute "$RUNNER_TEMP/get-flights"
      - name: Preserve private selected-claim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-selected-flights-${{ github.run_id }}
          path: ${{ runner.temp }}/andromeda-select-flights/*.json
          if-no-files-found: error
          retention-days: 2
