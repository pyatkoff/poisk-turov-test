name: MATCH new-context final SAMO-only v103-v104
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-newcontext-final-v104.yml
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: match-newcontext-final-v104
  cancel-in-progress: false
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail; umask 077; mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_newcontext_samoonly_final_plan_v103.php)" = 324de89c4fb8345a55301f1af98b83dffccc7705
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_newcontext_samoonly_final_acquire_v104.py)" = 249d380a0f2a85adcab4b0450fbcce81241fc9a1
          php -l scripts/diagnostics/hotel_match_newcontext_samoonly_final_plan_v103.php
          python3 scripts/diagnostics/hotel_match_newcontext_samoonly_final_acquire_v104.py --self-test
          python3 - <<'PY'
          import json,os,time,urllib.request
          def get(p):
              q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:return json.load(f)
          pr=get('/pulls/4061');assert pr['state']=='open' and pr['draft'] is True and pr['head']['sha']==os.environ['HEAD']
          for _ in range(100):
              xs=[x for x in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if x['name']=='Security guard']
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':assert x['conclusion']=='success';break
              time.sleep(3)
          else:raise SystemExit('security')
          PY
      - name: Plan and acquire final SAMO-only block
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          p=".anytoour-match/operations/hotel-match-newcontext-samoonly-final-plan-1971-20260928-v103";a=".anytoour-match/operations/hotel-match-newcontext-samoonly-final-acquire-1971-20260928-v104"
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$p\";test ! -e \"\$HOME/$a\";mkdir -p \"\$HOME/$p/payload\" \"\$HOME/$a/payload\""
          git archive HEAD scripts/diagnostics app/integrations|ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$p/payload\"";git archive HEAD scripts/diagnostics app/integrations|ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$a/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$p\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=768M \"\$HOME/$p/payload/scripts/diagnostics/hotel_match_newcontext_samoonly_final_plan_v103.php\" --execute">terminal/plan-stdout.txt
          scp "${opts[@]}" "$remote:$p/result.json" terminal/plan.json;scp "${opts[@]}" "$remote:$p/receipt.json" terminal/plan-receipt.json
          plan_sha="$(sha256sum terminal/plan.json|awk '{print $1}')";scope="$(python3 -c 'import json;print(json.load(open("terminal/plan.json"))["scope_count"])')";scp "${opts[@]}" terminal/plan.json "$remote:$a/plan.json"
          python3 - "$HEAD" "$plan_sha" "$scope" <<'PY'
          import json,sys
          json.dump({'operation':'hotel-match-newcontext-samoonly-final-acquire-1971-20260928-v104','source_sha':sys.argv[1],'plan_sha256':sys.argv[2],'state':'reserved_before_provider_access','maximum_hotels':int(sys.argv[3]),'call_cap':900,'continue_calls':0,'dates_calls':0},open('terminal/reservation.json','w'))
          PY
          scp "${opts[@]}" terminal/reservation.json "$remote:$a/reservation.json"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$a\" MATCH_PLAN_PATH=\"\$HOME/$a/plan.json\" MATCH_PLAN_SHA256='$plan_sha' MATCH_CALL_CAP=900 python3 \"\$HOME/$a/payload/scripts/diagnostics/hotel_match_newcontext_samoonly_final_acquire_v104.py\" --execute">terminal/acquire-stdout.txt
          scp "${opts[@]}" "$remote:$a/result.json" terminal/result.json;scp "${opts[@]}" "$remote:$a/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json
          d=json.load(open('terminal/result.json'));assert d['database_writes']==d['mapping_writes']==0 and d['provider_calls']<=900 and d['continue_calls']==d['dates_calls']==0
          print(json.dumps({k:d[k] for k in ['state','scope_count','searched_hotels','returned_targets','returned_missing_operator_pairs','returned_operator_pairs','provider_calls','daily_accounted_after_local_ledger','single_native_chunk_unique_count','single_native_by_operator']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-newcontext-final-v104-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
