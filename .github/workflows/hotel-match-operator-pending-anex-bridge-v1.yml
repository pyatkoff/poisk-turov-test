name: MATCH live v8 CURRENT reconcile v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-live-v8-current-reconcile-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-live-v8-current-reconcile-1971-20260915-v1
  SEED_ARTIFACT_ID: '10374133289'
  SEED_ZIP_SHA256: 6e4124958df93b2fa35c22765bce4fbdd486c2a4ed9b53738ebf8b0f728aa255
  SEED_QUEUE_SHA256: f17ca8e8d9d3945f6aea3d232fca96708fc6f119c504461f95a4cc51af8ed3ed
jobs:
  reconcile:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 45
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Exact source tests and guards
        run: |
          set -euo pipefail
          for f in scripts/diagnostics/hotel_match_live_residual_current_review.php scripts/diagnostics/hotel_match_live_andromeda_residual_review_v5.php scripts/diagnostics/hotel_match_live_v8_current_reconcile.php tests/hotel_match_live_v8_current_reconcile_test.php; do php -l "$f"; done
          php tests/hotel_match_live_v8_current_reconcile_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_live_v8_current_reconcile.php)" = 05c06061f373126cd9d10bc82f77280c71ee591a
          test "$(git hash-object tests/hotel_match_live_v8_current_reconcile_test.php)" = f8aeb328ad5d4ff8bb516803b0383cfe03ce4d03
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\(|\bINSERT\b|\bUPDATE\b|\bDELETE\b|\bREPLACE\b)' scripts/diagnostics/hotel_match_live_v8_current_reconcile.php
          printf 'SOURCE_SHA256=%s\n' "$(sha256sum scripts/diagnostics/hotel_match_live_v8_current_reconcile.php|awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Restore exact completed v8 seed and reserve
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SEED_ARTIFACT_ID/zip" > "$RUNNER_TEMP/seed.zip"
          test "$(sha256sum "$RUNNER_TEMP/seed.zip"|awk '{print $1}')" = "$SEED_ZIP_SHA256"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP']); out=root/os.environ['OPERATION_ID']
          with zipfile.ZipFile(root/'seed.zip') as z:
              raw=z.read('queue.json')
          assert hashlib.sha256(raw).hexdigest()==os.environ['SEED_QUEUE_SHA256']
          q=json.loads(raw); rows=[r for r in q['rows'] if r.get('provider')=='andromeda']
          assert len(rows)==90 and sum(int(r.get('search_count') or 0) for r in rows)==680
          seed=json.dumps({'rows':rows},ensure_ascii=False,separators=(',',':'),sort_keys=True).encode()+b'\n'
          (out/'seed.json').write_bytes(seed); seedsha=hashlib.sha256(seed).hexdigest()
          res={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':os.environ['SOURCE_SHA256'],'state':'reserved_before_db_access','mode':'server_current_read_only_v8_live_seed_reconcile','seed_artifact_id':int(os.environ['SEED_ARTIFACT_ID']),'seed_queue_sha256':os.environ['SEED_QUEUE_SHA256'],'seed_sha256':seedsha,'seed_count':90,'seed_frequency_sum':680,'supplier_calls':0,'tourvisor_calls':0,'external_calls':0,'booking_calls':0,'db_writes':0,'mapping_writes':0,'operator_5_writes':0,'no_replay':True,'run_id':int(os.environ['GITHUB_RUN_ID'])}
          (out/'reservation.json').write_text(json.dumps(res,sort_keys=True,indent=2)+'\n')
          print('SEED_SHA256='+seedsha)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SEED_SHA256='+seedsha+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-live-v8-current-reconcile-v1-reservation
          path: |
            ${{ runner.temp }}/hotel-match-live-v8-current-reconcile-1971-20260915-v1/reservation.json
            ${{ runner.temp }}/hotel-match-live-v8-current-reconcile-1971-20260915-v1/seed.json
          if-no-files-found: error
          retention-days: 90
      - name: Server CURRENT reconcile exact live seed
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          remote="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=$remote; mkdir -p \"\$p/source\"; test ! -e \"\$p/reservation.json\"; cat > \"\$p/reservation.json\"; cat > \"\$p/seed.json\"; sync" < <(cat "$out/reservation.json" "$out/seed.json")
          for f in hotel_match_live_residual_current_review.php hotel_match_live_andromeda_residual_review_v5.php hotel_match_live_v8_current_reconcile.php; do ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cat > $remote/source/$f" < "scripts/diagnostics/$f"; done
          # overwrite reservation/seed separately to avoid shell stream ambiguity
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cat > $remote/reservation.json" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cat > $remote/seed.json" < "$out/seed.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=1 $remote/source/hotel_match_live_v8_current_reconcile.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C $remote -czf - ." > "$out/server-operation.tgz"
          set -e
          echo REMOTE_RC=$rc; cat "$out/remote-stdout.txt" || true; cat "$out/remote-stderr.txt" >&2 || true
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          raw=s.joinpath('result.json').read_bytes(); r=json.loads(raw); rec=json.loads(s.joinpath('receipt.json').read_text()); d=hashlib.sha256(raw).hexdigest()
          zero=['supplier_calls','tourvisor_calls','external_calls','booking_calls','db_writes','mapping_writes','operator_5_writes']
          ok=(r.get('state')=='completed_read_only' and r.get('operation_id')==os.environ['OPERATION_ID'] and int(r.get('seed_count',-1))==90 and int(r.get('seed_frequency_sum',-1))==680 and int(r.get('current_rows_found',-1))>=0 and sum((r.get('route_counts') or {}).values())==90 and sum((r.get('route_frequency') or {}).values())==680 and all(int(r.get(k,-1))==0 for k in zero) and rec.get('result_sha256')==d and rec.get('readback_verified') is True and rec.get('seed_sha256')==os.environ['SEED_SHA256'])
          gate={'verified':ok,'seed_count':r.get('seed_count'),'seed_frequency_sum':r.get('seed_frequency_sum'),'current_rows_found':r.get('current_rows_found'),'route_counts':r.get('route_counts'),'route_frequency':r.get('route_frequency'),'reason_counts':r.get('reason_counts'),'pending_auto_candidate_count':r.get('pending_auto_candidate_count'),'pending_auto_candidate_frequency':r.get('pending_auto_candidate_frequency'),'result_sha256':d}
          root.joinpath('workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-live-v8-current-reconcile-v1-result
          path: ${{ runner.temp }}/hotel-match-live-v8-current-reconcile-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
