name: MATCH proven-country guarded apply v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-state-country-apply-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-state-country-consensus-apply-1971-20260915-v1
  REVIEW_OPERATION_ID: hotel-match-state-country-consensus-1971-20260915-v3
  REVIEW_RESULT_SHA256: 5338dd98e15fb15db67547122d684eb5d51ec5e78e011efb5f30223417df4d79
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Exact source tests and write guards
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live_residual_current_review.php
          php -l scripts/diagnostics/hotel_match_state_country_consensus.php
          php -l scripts/diagnostics/hotel_match_state_country_consensus_apply.php
          php -l tests/hotel_match_state_country_consensus_test.php
          php -l tests/hotel_match_state_country_consensus_apply_test.php
          php tests/hotel_match_state_country_consensus_test.php
          php tests/hotel_match_state_country_consensus_apply_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_review.php)" = e93113da264b9bb1a17d0cb65287b4d1dc5b476b
          test "$(git hash-object scripts/diagnostics/hotel_match_state_country_consensus.php)" = 2a443380b28e3a4267650d988e524971b77f56c3
          test "$(git hash-object scripts/diagnostics/hotel_match_state_country_consensus_apply.php)" = 88ed7a785dc8f089e842994e69fa6e6433d046d8
          test "$(git hash-object tests/hotel_match_state_country_consensus_apply_test.php)" = 59ffb63dc1750d772dbcf19022f549c277b7945b
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\()' scripts/diagnostics/hotel_match_state_country_consensus.php scripts/diagnostics/hotel_match_state_country_consensus_apply.php
          ! grep -Eiq '\b(INSERT INTO|DELETE FROM|REPLACE INTO|ALTER TABLE|DROP TABLE|CREATE TABLE|TRUNCATE TABLE)\b' scripts/diagnostics/hotel_match_state_country_consensus_apply.php
          test "$(grep -Eic "UPDATE andromeda_hotel_identities SET local_hotel_id=" scripts/diagnostics/hotel_match_state_country_consensus_apply.php)" -eq 1
          printf 'APPLY_SHA256=%s\nREVIEW_SOURCE_SHA256=%s\nRESOLVER_SHA256=%s\n' "$(sha256sum scripts/diagnostics/hotel_match_state_country_consensus_apply.php|awk '{print $1}')" "$(sha256sum scripts/diagnostics/hotel_match_state_country_consensus.php|awk '{print $1}')" "$(sha256sum scripts/diagnostics/hotel_match_live_residual_current_review.php|awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Reserve exact write operation before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"; cp scripts/diagnostics/hotel_match_state_country_consensus_apply.php "$out/apply.php"; cp scripts/diagnostics/hotel_match_state_country_consensus.php "$out/review-source.php"; cp scripts/diagnostics/hotel_match_live_residual_current_review.php "$out/resolver.php"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'apply_sha256':os.environ['APPLY_SHA256'],'apply_git_blob':'88ed7a785dc8f089e842994e69fa6e6433d046d8','review_source_sha256':os.environ['REVIEW_SOURCE_SHA256'],'review_source_git_blob':'2a443380b28e3a4267650d988e524971b77f56c3','resolver_sha256':os.environ['RESOLVER_SHA256'],'resolver_git_blob':'e93113da264b9bb1a17d0cb65287b4d1dc5b476b','review_operation_id':os.environ['REVIEW_OPERATION_ID'],'review_result_sha256':os.environ['REVIEW_RESULT_SHA256'],'planned_rows':17,'allowed_namespace':'andromeda_catalog','state':'reserved_before_db_access','mode':'server_current_guarded_state_country_apply','supplier_calls':0,'tourvisor_calls':0,'external_calls':0,'booking_calls':0,'operator_5_writes':0,'no_replay':True,'run_id':int(os.environ['GITHUB_RUN_ID'])}
          p.write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-state-country-apply-v1-reservation
          path: ${{ runner.temp }}/hotel-match-state-country-consensus-apply-1971-20260915-v1/
          if-no-files-found: error
          retention-days: 90
      - name: Server-CURRENT guarded transaction and post-COMMIT readback
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"; test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null; ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"; trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          remote_op="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=$remote_op; mkdir -p \"\$p/source\"; test ! -e \"\$p/reservation.json\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; cat > $remote_op/source/hotel_match_live_residual_current_review.php; test \"\$(sha256sum $remote_op/source/hotel_match_live_residual_current_review.php|awk '{print \$1}')\" = '$RESOLVER_SHA256'; sync" < scripts/diagnostics/hotel_match_live_residual_current_review.php
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; cat > $remote_op/source/hotel_match_state_country_consensus.php; test \"\$(sha256sum $remote_op/source/hotel_match_state_country_consensus.php|awk '{print \$1}')\" = '$REVIEW_SOURCE_SHA256'; sync" < scripts/diagnostics/hotel_match_state_country_consensus.php
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; cat > $remote_op/source/hotel_match_state_country_consensus_apply.php; test \"\$(sha256sum $remote_op/source/hotel_match_state_country_consensus_apply.php|awk '{print \$1}')\" = '$APPLY_SHA256'; sync" < scripts/diagnostics/hotel_match_state_country_consensus_apply.php
          set +e; ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php $remote_op/source/hotel_match_state_country_consensus_apply.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"; rc=$?; ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=$remote_op; tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?; set -e
          test $trc -eq 0 -a -s "$out/server-operation.tgz"; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"; export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=root/'server'
          if not s.joinpath('result.json').exists(): raise SystemExit('NO_RESULT_READBACK')
          raw=s.joinpath('result.json').read_bytes();r=json.loads(raw);rec=json.loads(s.joinpath('receipt.json').read_text());d=hashlib.sha256(raw).hexdigest();rows=r.get('post_commit_readback') or [];written=int(r.get('written') or 0);before=r.get('coverage_before') or {};after=r.get('coverage_after') or {}
          ok=(int(os.environ['REMOTE_RC'])==0 and r.get('state')=='completed_committed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('source_sha')==os.environ['GITHUB_SHA'] and r.get('review_operation_id')==os.environ['REVIEW_OPERATION_ID'] and r.get('review_result_sha256')==os.environ['REVIEW_RESULT_SHA256'] and int(r.get('planned') or -1)==17 and 0<written<=17 and len(rows)==written and int(r.get('mapping_writes') or -1)==written and int(r.get('operator_5_writes') or 0)==0 and r.get('supplier_calls')==r.get('tourvisor_calls')==r.get('external_calls')==r.get('booking_calls')==0 and int(after.get('andromeda_unique_local') or 0)>=int(before.get('andromeda_unique_local') or 0) and rec.get('result_sha256')==d and rec.get('readback_verified') is True and int(rec.get('post_commit_rows') or -1)==written and rec.get('no_replay') is True)
          gate={'operation_id':os.environ['OPERATION_ID'],'verified':ok,'remote_exit':int(os.environ['REMOTE_RC']),'planned':r.get('planned'),'validated':r.get('validated'),'written':written,'holds_count':r.get('holds_count'),'written_by_rule':r.get('written_by_rule'),'coverage_before':before,'coverage_after':after,'post_commit_rows':len(rows),'result_sha256':d,'supplier_calls':r.get('supplier_calls'),'tourvisor_calls':r.get('tourvisor_calls'),'operator_5_writes':r.get('operator_5_writes'),'no_replay':True};root.joinpath('workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps(gate,ensure_ascii=False,sort_keys=True));
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-state-country-apply-v1-result
          path: ${{ runner.temp }}/hotel-match-state-country-consensus-apply-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
