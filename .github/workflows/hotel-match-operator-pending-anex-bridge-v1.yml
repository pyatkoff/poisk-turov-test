name: MATCH live residual CURRENT apply v3
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-live-residual-current-apply-1971-v3, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-live-residual-current-apply-1971-20260915-v3
  REVIEW_OPERATION_ID: hotel-match-live-residual-current-review-1971-20260915-v4
  REVIEW_RESULT_SHA256: 9baecca0de7d7c62c897edc60c46be688be30015178bda6e2bc7fc7bf2728a4c
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 10
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Exact source tests and write guards
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live_residual_current_review.php
          php -l scripts/diagnostics/hotel_match_live_residual_current_apply.php
          php -l tests/hotel_match_live_residual_current_review_test.php
          php -l tests/hotel_match_live_residual_current_apply_test.php
          php tests/hotel_match_live_residual_current_review_test.php
          php tests/hotel_match_live_residual_current_apply_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_review.php)" = e93113da264b9bb1a17d0cb65287b4d1dc5b476b
          test "$(git hash-object tests/hotel_match_live_residual_current_review_test.php)" = aa207d570b41b4a2c1449c0db8b3f026d9464bb0
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_apply.php)" = 038ec6aa5eeef5f81616f0c83fdcc498ff7b0c98
          test "$(git hash-object tests/hotel_match_live_residual_current_apply_test.php)" = c5a9f898f7d9995f6f796e87fd1638a170f7308e
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\()' scripts/diagnostics/hotel_match_live_residual_current_review.php scripts/diagnostics/hotel_match_live_residual_current_apply.php
          ! grep -Eiq '\b(INSERT INTO|DELETE FROM|REPLACE INTO|ALTER TABLE|DROP TABLE|CREATE TABLE|TRUNCATE TABLE)\b' scripts/diagnostics/hotel_match_live_residual_current_apply.php
          test "$(grep -Eic 'UPDATE andromeda_hotel_identities SET local_hotel_id=' scripts/diagnostics/hotel_match_live_residual_current_apply.php)" -eq 1
          sha="$(sha256sum scripts/diagnostics/hotel_match_live_residual_current_apply.php | awk '{print $1}')"
          printf 'APPLY_SOURCE_SHA256=%s\n' "$sha" >> "$GITHUB_ENV"
      - name: Reserve exact write operation before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          cp scripts/diagnostics/hotel_match_live_residual_current_apply.php "$out/apply.php"
          cp scripts/diagnostics/hotel_match_live_residual_current_review.php "$out/review.php"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'apply_source_sha256':os.environ['APPLY_SOURCE_SHA256'],'apply_source_git_blob':'038ec6aa5eeef5f81616f0c83fdcc498ff7b0c98','review_source_git_blob':'e93113da264b9bb1a17d0cb65287b4d1dc5b476b','review_operation_id':os.environ['REVIEW_OPERATION_ID'],'review_result_sha256':os.environ['REVIEW_RESULT_SHA256'],'planned_rows':74,'operator_5_excluded':True,'state':'reserved_before_db_access','mode':'server_current_guarded_geography_delta_apply','supplier_calls':0,'external_calls':0,'booking_calls':0,'no_replay':True,'run_id':int(os.environ['GITHUB_RUN_ID'])}
          p.write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-live-residual-current-apply-v3-reservation
          path: ${{ runner.temp }}/hotel-match-live-residual-current-apply-1971-20260915-v3/
          if-no-files-found: error
          retention-days: 90
      - name: Server-CURRENT guarded transaction and post-COMMIT readback
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          remote_op="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=$remote_op; mkdir -p \"\$p/source\"; test ! -e \"\$p/reservation.json\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; cat > $remote_op/source/hotel_match_live_residual_current_review.php; cat > $remote_op/source/hotel_match_live_residual_current_apply.php; test \"\$(sha256sum $remote_op/source/hotel_match_live_residual_current_apply.php | awk '{print \$1}')\" = '$APPLY_SOURCE_SHA256'; sync" < <(cat scripts/diagnostics/hotel_match_live_residual_current_review.php scripts/diagnostics/hotel_match_live_residual_current_apply.php)
          # Re-send as two exact files because the previous stream only establishes the operation directory; overwrite is forbidden after execution starts.
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; cat > $remote_op/source/hotel_match_live_residual_current_review.php; sync" < scripts/diagnostics/hotel_match_live_residual_current_review.php
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; cat > $remote_op/source/hotel_match_live_residual_current_apply.php; test \"\$(sha256sum $remote_op/source/hotel_match_live_residual_current_apply.php | awk '{print \$1}')\" = '$APPLY_SOURCE_SHA256'; sync" < scripts/diagnostics/hotel_match_live_residual_current_apply.php
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php $remote_op/source/hotel_match_live_residual_current_apply.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=$remote_op; tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0 -a -s "$out/server-operation.tgz"; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"; export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          if not s.joinpath('result.json').exists(): raise SystemExit('NO_RESULT_READBACK')
          raw=s.joinpath('result.json').read_bytes(); result=json.loads(raw); receipt=json.loads(s.joinpath('receipt.json').read_text()) if s.joinpath('receipt.json').exists() else {}; digest=hashlib.sha256(raw).hexdigest(); rows=result.get('post_commit_readback') or []
          ok=(int(os.environ['REMOTE_RC'])==0 and result.get('state')=='completed_committed' and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('source_sha')==os.environ['GITHUB_SHA'] and result.get('review_operation_id')==os.environ['REVIEW_OPERATION_ID'] and result.get('review_result_sha256')==os.environ['REVIEW_RESULT_SHA256'] and int(result.get('planned') or -1)==74 and int(result.get('written') or 0)>0 and int(result.get('written') or -1)==len(rows) and result.get('supplier_calls')==result.get('external_calls')==result.get('booking_calls')==0 and int(result.get('mapping_writes') or -1)==len(rows) and receipt.get('result_sha256')==digest and receipt.get('readback_verified') is True and int(receipt.get('post_commit_rows') or -1)==len(rows) and receipt.get('no_replay') is True)
          gate={'operation_id':os.environ['OPERATION_ID'],'remote_exit':int(os.environ['REMOTE_RC']),'verified':ok,'state':result.get('state'),'planned':result.get('planned'),'validated':result.get('validated'),'written':result.get('written'),'holds_count':result.get('holds_count'),'written_by_namespace':result.get('written_by_namespace'),'written_by_rule':result.get('written_by_rule'),'result_sha256':digest,'post_commit_rows':len(rows),'supplier_calls':result.get('supplier_calls'),'no_replay':True}
          root.joinpath('workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-live-residual-current-apply-v3-result
          path: ${{ runner.temp }}/hotel-match-live-residual-current-apply-1971-20260915-v3/
          if-no-files-found: warn
          retention-days: 90
