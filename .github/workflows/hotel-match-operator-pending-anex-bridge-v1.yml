name: MATCH provider geography consensus apply v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-provider-geo-consensus-apply-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-provider-geo-consensus-apply-1971-20260915-v1
  REVIEW_OPERATION_ID: hotel-match-provider-geo-consensus-review-1971-20260915-v1
  REVIEW_RESULT_SHA256: 711cab875ec00dc3edb055e805bcb069ca70f78b3609ad64bb078d3859456beb
  PLAN_COUNT: '140'
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 28
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Exact source tests and guards
        run: |
          set -euo pipefail
          for f in scripts/diagnostics/hotel_match_live_residual_current_review.php scripts/diagnostics/hotel_match_state_country_consensus.php scripts/diagnostics/hotel_match_state_accepted_country_consensus.php scripts/diagnostics/hotel_match_provider_geo_consensus_review.php scripts/diagnostics/hotel_match_accepted_name_bridge_review.php scripts/diagnostics/hotel_match_provider_geo_consensus_apply.php tests/hotel_match_provider_geo_consensus_apply_test.php; do php -l "$f"; done
          php tests/hotel_match_provider_geo_consensus_apply_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_review.php)" = e93113da264b9bb1a17d0cb65287b4d1dc5b476b
          test "$(git hash-object scripts/diagnostics/hotel_match_state_country_consensus.php)" = 2a443380b28e3a4267650d988e524971b77f56c3
          test "$(git hash-object scripts/diagnostics/hotel_match_state_accepted_country_consensus.php)" = 97d39cdd7817e024139bd7e962cc8496c5c9ea58
          test "$(git hash-object scripts/diagnostics/hotel_match_provider_geo_consensus_review.php)" = ad9c3ca12b60bb4686cd76d9155416d27d321bc0
          test "$(git hash-object scripts/diagnostics/hotel_match_accepted_name_bridge_review.php)" = 3fd8a74b1edc2285fdfa93e598f7bf354df19d42
          test "$(git hash-object scripts/diagnostics/hotel_match_provider_geo_consensus_apply.php)" = f8729ef747043583a0c0dc1a4cdf3c95a391785b
          test "$(git hash-object tests/hotel_match_provider_geo_consensus_apply_test.php)" = c3b081ca4d7c685961dc8ebee0fb3a4690b2bfd8
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\()' scripts/diagnostics/hotel_match_provider_geo_consensus_apply.php
          printf 'SOURCE_SHA256=%s\n' "$(sha256sum scripts/diagnostics/hotel_match_provider_geo_consensus_apply.php|awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Reserve before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':os.environ['SOURCE_SHA256'],'review_operation_id':os.environ['REVIEW_OPERATION_ID'],'review_result_sha256':os.environ['REVIEW_RESULT_SHA256'],'planned_rows':int(os.environ['PLAN_COUNT']),'state':'reserved_before_db_access','mode':'server_current_guarded_provider_geo_consensus_apply','supplier_calls':0,'tourvisor_calls':0,'external_calls':0,'booking_calls':0,'operator_5_writes':0,'no_replay':True,'run_id':int(os.environ['GITHUB_RUN_ID'])},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-provider-geo-consensus-apply-v1-reservation
          path: ${{ runner.temp }}/hotel-match-provider-geo-consensus-apply-1971-20260915-v1/
          if-no-files-found: error
          retention-days: 90
      - name: Server CURRENT guarded provider geography apply
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          remote="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=$remote; mkdir -p \"\$p/source\"; test ! -e \"\$p/reservation.json\"; test -f \"\$HOME/.anytoour-match/operations/$REVIEW_OPERATION_ID/result.json\"; printf '%s  %s\n' '$REVIEW_RESULT_SHA256' \"\$HOME/.anytoour-match/operations/$REVIEW_OPERATION_ID/result.json\" | sha256sum -c -; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          for f in hotel_match_live_residual_current_review.php hotel_match_state_country_consensus.php hotel_match_state_accepted_country_consensus.php hotel_match_provider_geo_consensus_review.php hotel_match_accepted_name_bridge_review.php hotel_match_provider_geo_consensus_apply.php; do ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cat > $remote/source/$f" < "scripts/diagnostics/$f"; done
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=1 $remote/source/hotel_match_provider_geo_consensus_apply.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C $remote -czf - ." > "$out/server-operation.tgz"
          set -e
          echo REMOTE_RC=$rc; cat "$out/remote-stdout.txt" || true; cat "$out/remote-stderr.txt" >&2 || true
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          raw=s.joinpath('result.json').read_bytes(); r=json.loads(raw); rec=json.loads(s.joinpath('receipt.json').read_text()); d=hashlib.sha256(raw).hexdigest(); planned=int(os.environ['PLAN_COUNT'])
          zero=['supplier_calls','tourvisor_calls','external_calls','booking_calls','operator_5_writes']
          written=int(r.get('written',-1)); holds=int(r.get('holds_count',-1))
          ok=(r.get('state')=='completed_committed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('review_result_sha256')==os.environ['REVIEW_RESULT_SHA256'] and int(r.get('planned',-1))==planned and written>=0 and holds>=0 and written+holds==planned and int(r.get('mapping_writes',-1))==written and len(r.get('post_commit_readback') or [])==written and all(int(r.get(k,-1))==0 for k in zero) and rec.get('result_sha256')==d and rec.get('readback_verified') is True and int(rec.get('post_commit_rows',-1))==written)
          gate={'verified':ok,'planned':planned,'validated':r.get('validated'),'written':written,'holds_count':holds,'written_by_rule':r.get('written_by_rule'),'coverage_before':r.get('coverage_before'),'coverage_after':r.get('coverage_after'),'result_sha256':d}
          root.joinpath('workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-provider-geo-consensus-apply-v1-result
          path: ${{ runner.temp }}/hotel-match-provider-geo-consensus-apply-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
