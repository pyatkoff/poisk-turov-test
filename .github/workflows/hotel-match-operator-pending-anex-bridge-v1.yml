name: MATCH live residual CURRENT apply v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-live-residual-current-apply-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-live-residual-current-apply-1971-20260915-v1
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Offline mass-apply guards
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live_residual_current_review.php
          php -l scripts/diagnostics/hotel_match_live_residual_current_apply.php
          php -l tests/hotel_match_live_residual_current_apply_test.php
          php tests/hotel_match_live_residual_current_apply_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_review.php)" = 51104cd76a5af45003e9796405dc3f357e289cde
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_apply.php)" = 6cec18972a54df15ff1ea0b11e229163f1504213
          test "$(git hash-object tests/hotel_match_live_residual_current_apply_test.php)" = 085eaf5556770977b20c125c8a383a528776b643
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\()' scripts/diagnostics/hotel_match_live_residual_current_apply.php
          ! grep -Eiq '\b(INSERT INTO|DELETE FROM|REPLACE INTO|ALTER TABLE|DROP TABLE|CREATE TABLE|TRUNCATE TABLE)\b' scripts/diagnostics/hotel_match_live_residual_current_apply.php
          test "$(grep -Eic 'UPDATE[[:space:]]+andromeda_hotel_identities' scripts/diagnostics/hotel_match_live_residual_current_apply.php)" -eq 1
          ! grep -Eiq 'UPDATE[[:space:]]+(anex_|catalog_|hotel_aliases|tour_)' scripts/diagnostics/hotel_match_live_residual_current_apply.php
      - name: Reserve exact operation before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'state':'reserved_before_db_access','mode':'server_current_guarded_mass_identity_apply','supplier_calls':0,'external_calls':0,'booking_calls':0,'no_replay':True}
          p.write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-live-residual-current-apply-v1-reservation
          path: ${{ runner.temp }}/hotel-match-live-residual-current-apply-1971-20260915-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Server-CURRENT guarded apply and readback
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir -p \"\$p\"; test ! -e \"\$p/reservation.json\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          { cat scripts/diagnostics/hotel_match_live_residual_current_review.php; printf '\n'; cat scripts/diagnostics/hotel_match_live_residual_current_apply.php; } > "$out/combined.php"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php" < "$out/combined.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0 -a -s "$out/server-operation.tgz"; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"; export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          if not s.joinpath('result.json').exists(): raise SystemExit('NO_RESULT_READBACK')
          raw=s.joinpath('result.json').read_bytes(); result=json.loads(raw); receipt=json.loads(s.joinpath('receipt.json').read_text()) if s.joinpath('receipt.json').exists() else {}; digest=hashlib.sha256(raw).hexdigest(); rows=result.get('post_commit_readback') or []
          ok=(int(os.environ['REMOTE_RC'])==0 and result.get('state')=='completed_committed' and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('source_sha')==os.environ['GITHUB_SHA'] and result.get('supplier_calls')==result.get('external_calls')==result.get('booking_calls')==0 and result.get('mapping_writes')==result.get('written')==len(rows) and receipt.get('result_sha256')==digest and receipt.get('readback_verified') is True and receipt.get('no_replay') is True and receipt.get('post_commit_rows')==len(rows) and receipt.get('written')==len(rows))
          if ok:
              ok=all(r.get('decision_status')=='accepted' and int(r.get('local_hotel_id') or 0)>0 and r.get('supplier_namespace') and r.get('external_hotel_id') for r in rows)
          gate={'operation_id':os.environ['OPERATION_ID'],'remote_exit':int(os.environ['REMOTE_RC']),'verified':ok,'state':result.get('state'),'planned':result.get('planned'),'validated':result.get('validated'),'written':result.get('written'),'holds_count':result.get('holds_count'),'written_by_namespace':result.get('written_by_namespace'),'written_by_rule':result.get('written_by_rule'),'post_commit_rows':len(rows),'result_sha256':digest,'no_replay':True}
          root.joinpath('workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-live-residual-current-apply-v1-result
          path: ${{ runner.temp }}/hotel-match-live-residual-current-apply-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
