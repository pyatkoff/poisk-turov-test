name: MATCH accepted-name bridge review v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-accepted-name-bridge-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-accepted-name-bridge-review-1971-20260915-v1
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Exact source tests and read-only guards
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live_residual_current_review.php
          php -l scripts/diagnostics/hotel_match_state_country_consensus.php
          php -l scripts/diagnostics/hotel_match_state_accepted_country_consensus.php
          php -l scripts/diagnostics/hotel_match_accepted_name_bridge_review.php
          php -l tests/hotel_match_accepted_name_bridge_review_test.php
          php tests/hotel_match_accepted_name_bridge_review_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_live_residual_current_review.php)" = e93113da264b9bb1a17d0cb65287b4d1dc5b476b
          test "$(git hash-object scripts/diagnostics/hotel_match_state_country_consensus.php)" = 2a443380b28e3a4267650d988e524971b77f56c3
          test "$(git hash-object scripts/diagnostics/hotel_match_state_accepted_country_consensus.php)" = 97d39cdd7817e024139bd7e962cc8496c5c9ea58
          test "$(git hash-object scripts/diagnostics/hotel_match_accepted_name_bridge_review.php)" = 855a9148e10d45a374eb33d2d6f74929a605309b
          test "$(git hash-object tests/hotel_match_accepted_name_bridge_review_test.php)" = c2d31a7b65c86f36b3fc7a543f48ba84dc849ee9
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\()' scripts/diagnostics/hotel_match_accepted_name_bridge_review.php
          ! grep -Eiq '\b(INSERT INTO|UPDATE|DELETE FROM|REPLACE INTO|ALTER TABLE|DROP TABLE|CREATE TABLE|TRUNCATE TABLE)\b' scripts/diagnostics/hotel_match_accepted_name_bridge_review.php
          printf 'SOURCE_SHA256=%s\nCOUNTRY_SHA256=%s\nSTATE_SHA256=%s\nRESOLVER_SHA256=%s\n' "$(sha256sum scripts/diagnostics/hotel_match_accepted_name_bridge_review.php|awk '{print $1}')" "$(sha256sum scripts/diagnostics/hotel_match_state_accepted_country_consensus.php|awk '{print $1}')" "$(sha256sum scripts/diagnostics/hotel_match_state_country_consensus.php|awk '{print $1}')" "$(sha256sum scripts/diagnostics/hotel_match_live_residual_current_review.php|awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Reserve before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':os.environ['SOURCE_SHA256'],'country_source_sha256':os.environ['COUNTRY_SHA256'],'state_source_sha256':os.environ['STATE_SHA256'],'resolver_sha256':os.environ['RESOLVER_SHA256'],'state':'reserved_before_db_access','mode':'server_current_read_only_accepted_name_bridge_review','supplier_calls':0,'tourvisor_calls':0,'external_calls':0,'booking_calls':0,'db_writes':0,'operator_5_writes':0,'no_replay':True,'run_id':int(os.environ['GITHUB_RUN_ID'])},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-accepted-name-bridge-v1-reservation
          path: ${{ runner.temp }}/hotel-match-accepted-name-bridge-review-1971-20260915-v1/
          if-no-files-found: error
          retention-days: 90
      - name: Server CURRENT read-only accepted-name review
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          remote="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=$remote; mkdir -p \"\$p/source\"; test ! -e \"\$p/reservation.json\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          for f in hotel_match_live_residual_current_review.php hotel_match_state_country_consensus.php hotel_match_state_accepted_country_consensus.php hotel_match_accepted_name_bridge_review.php; do ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cat > $remote/source/$f" < "scripts/diagnostics/$f"; done
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php $remote/source/hotel_match_accepted_name_bridge_review.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C $remote -czf - ." > "$out/server-operation.tgz"
          set -e
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"; export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          raw=s.joinpath('result.json').read_bytes(); r=json.loads(raw); rec=json.loads(s.joinpath('receipt.json').read_text()); d=hashlib.sha256(raw).hexdigest()
          zero=['supplier_calls','tourvisor_calls','external_calls','booking_calls','db_writes','mapping_writes','operator_5_writes']
          ok=int(os.environ['REMOTE_RC'])==0 and r.get('state')=='completed_read_only' and r.get('operation_id')==os.environ['OPERATION_ID'] and all(int(r.get(k,-1))==0 for k in zero) and rec.get('result_sha256')==d and rec.get('readback_verified') is True
          gate={'verified':ok,'accepted_andromeda_rows':r.get('accepted_andromeda_rows'),'pending_andromeda_rows':r.get('pending_andromeda_rows'),'usable_unique_accepted_name_keys':r.get('usable_unique_accepted_name_keys'),'ambiguous_accepted_name_keys':r.get('ambiguous_accepted_name_keys'),'weak_accepted_name_keys':r.get('weak_accepted_name_keys'),'candidate_count':r.get('candidate_count'),'candidate_live_frequency_sum':r.get('candidate_live_frequency_sum'),'route_counts':r.get('route_counts'),'reason_counts':r.get('reason_counts'),'result_sha256':d}
          root.joinpath('workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-accepted-name-bridge-v1-result
          path: ${{ runner.temp }}/hotel-match-accepted-name-bridge-review-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90