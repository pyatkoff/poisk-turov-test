name: MATCH operator current anchor apply v1
on:
  push:
    branches: [match/price-hotels-original-1971-20260914]
    paths: [.github/workflows/hotel-match-operator-pending-anex-bridge-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-operator-current-anchor-apply-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-operator-current-anchor-apply-1971-20260915-v1
  REVIEW_OPERATION_ID: hotel-match-operator-current-anchor-review-1971-20260915-v3
  REVIEW_RESULT_SHA256: 1c5d43327ae12a23bbcc046bad172f19f2182de7e6f9259d0dac1316bc276a17
  PLAN_COUNT: '10'
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 32
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Exact source tests and guards
        run: |
          set -euo pipefail
          for f in scripts/diagnostics/hotel_match_operator_pending_anex_bridge.php scripts/diagnostics/hotel_match_operator_pending_local_bridge.php scripts/diagnostics/hotel_match_operator_current_anchor_review.php scripts/diagnostics/hotel_match_operator_current_anchor_apply.php tests/hotel_match_operator_current_anchor_review_test.php tests/hotel_match_operator_current_anchor_apply_test.php; do php -l "$f"; done
          php tests/hotel_match_operator_current_anchor_review_test.php
          php tests/hotel_match_operator_current_anchor_apply_test.php
          test "$(git hash-object scripts/diagnostics/hotel_match_operator_pending_anex_bridge.php)" = aa909bdaa791bde4c50cb2d376852b52ba588fb9
          test "$(git hash-object scripts/diagnostics/hotel_match_operator_pending_local_bridge.php)" = b06c8a40cc3b306aede352dc6de789adf77fd99f
          test "$(git hash-object scripts/diagnostics/hotel_match_operator_current_anchor_review.php)" = 9b54f4d0fda19cb1066da8c4b63acd35c4e72a4d
          test "$(git hash-object scripts/diagnostics/hotel_match_operator_current_anchor_apply.php)" = 9dd97a10c6ccfd73070024134c9fdf5bac86ea90
          test "$(git hash-object tests/hotel_match_operator_current_anchor_review_test.php)" = f1dcfa51fe71a05bc7d4bd9bd5fef9647c1d08d5
          test "$(git hash-object tests/hotel_match_operator_current_anchor_apply_test.php)" = 2b05721ac1c9a152ef81910023b01461c3296fdc
          ! grep -Eiq '(https?://|curl_|fsockopen|stream_socket_client|broninit|booking\(|lead\()' scripts/diagnostics/hotel_match_operator_current_anchor_apply.php
          printf 'SOURCE_SHA256=%s\n' "$(sha256sum scripts/diagnostics/hotel_match_operator_current_anchor_apply.php|awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Reserve before SSH or DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':os.environ['SOURCE_SHA256'],'review_operation_id':os.environ['REVIEW_OPERATION_ID'],'review_result_sha256':os.environ['REVIEW_RESULT_SHA256'],'planned_rows':int(os.environ['PLAN_COUNT']),'state':'reserved_before_db_access','mode':'server_current_guarded_operator_anchor_apply','supplier_calls':0,'tourvisor_calls':0,'external_calls':0,'booking_calls':0,'operator_5_writes':0,'no_replay':True,'run_id':int(os.environ['GITHUB_RUN_ID'])},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-operator-current-anchor-apply-v1-reservation
          path: ${{ runner.temp }}/hotel-match-operator-current-anchor-apply-1971-20260915-v1/
          if-no-files-found: error
          retention-days: 90
      - name: Server CURRENT guarded operator anchor apply
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          review="\$HOME/.anytoour-match/operations/$REVIEW_OPERATION_ID/result.json"; remote="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; test -f $review; printf '%s  %s\n' '$REVIEW_RESULT_SHA256' $review | sha256sum -c -; umask 077; p=$remote; mkdir -p \"\$p/source\"; test ! -e \"\$p/reservation.json\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          for f in hotel_match_operator_pending_anex_bridge.php hotel_match_operator_pending_local_bridge.php hotel_match_operator_current_anchor_review.php hotel_match_operator_current_anchor_apply.php; do ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cat > $remote/source/$f" < "scripts/diagnostics/$f"; done
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=1 $remote/source/hotel_match_operator_current_anchor_apply.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C $remote -czf - ." > "$out/server-operation.tgz"
          set -e
          echo REMOTE_RC=$rc; cat "$out/remote-stdout.txt" || true; cat "$out/remote-stderr.txt" >&2 || true
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=root/'server'
          raw=s.joinpath('result.json').read_bytes(); r=json.loads(raw); rec=json.loads(s.joinpath('receipt.json').read_text()); d=hashlib.sha256(raw).hexdigest(); planned=int(os.environ['PLAN_COUNT'])
          written=int(r.get('written',-1)); holds=int(r.get('holds_count',-1)); zero=['supplier_calls','tourvisor_calls','external_calls','booking_calls','operator_5_writes']
          ok=(r.get('state')=='completed_committed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('review_result_sha256')==os.environ['REVIEW_RESULT_SHA256'] and int(r.get('planned',-1))==planned and written>=0 and holds>=0 and written+holds==planned and int(r.get('mapping_writes',-1))==written and len(r.get('post_commit_readback') or [])==written and all(int(r.get(k,-1))==0 for k in zero) and rec.get('result_sha256')==d and rec.get('readback_verified') is True and int(rec.get('post_commit_rows',-1))==written)
          gate={'verified':ok,'planned':planned,'validated':r.get('validated'),'written':written,'holds_count':holds,'written_by_operator':r.get('written_by_operator'),'result_sha256':d}
          root.joinpath('workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(5)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-operator-current-anchor-apply-v1-result
          path: ${{ runner.temp }}/hotel-match-operator-current-anchor-apply-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
