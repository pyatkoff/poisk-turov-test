name: Search3 direct ANEX live probe
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/search3-direct-anex-live-probe.yml'
      - 'scripts/diagnostics/search3_direct_anex_live_probe*.py'
      - 'tests/search3_direct_anex_live_probe_test.py'
      - 'scripts/diagnostics/search3_direct_anex_runtime_probe.*'
      - 'tests/search3_direct_anex_runtime_probe_test.py'
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: read
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/search3_direct_anex_live_probe_test.py
      - name: Offline runtime probe authorization, persistence and redaction
        run: |
          php -l scripts/diagnostics/search3_direct_anex_runtime_probe.php
          python3 -m py_compile scripts/diagnostics/search3_direct_anex_runtime_probe.py
          python3 tests/search3_direct_anex_runtime_probe_test.py
  probe:
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.event.issue.number == 3419 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 &&
      github.event.comment.body == '/search3-direct-anex-live-probe-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize fresh one-shot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnostics/search3_direct_anex_live_probe_gate.py
      - name: Run one direct ANEX Search3 POST
        run: python3 scripts/diagnostics/search3_direct_anex_live_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search3-direct-anex-live-probe-${{ github.run_id }}
          path: search3-direct-anex-live-probe/result.json
          if-no-files-found: warn
          retention-days: 14
  runtime-boundary:
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.event.issue.number == 3419 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 && github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/search3-direct-anex-runtime-probe-v1'
    concurrency:
      group: anytoour-int-server-executor
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck offline runtime probe contract
        run: python3 tests/search3_direct_anex_runtime_probe_test.py
      - name: Authorize exact current owner command without SSH credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnostics/search3_direct_anex_runtime_probe.py --authorize
      - name: Diagnose one installed search core call without mutation or retry
        env:
          INT_SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          INT_SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          INT_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: python3 scripts/diagnostics/search3_direct_anex_runtime_probe.py --run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: search3-direct-anex-runtime-probe-${{ github.run_id }}
          path: search3-direct-anex-runtime-probe/result.json
          if-no-files-found: warn
          retention-days: 14
