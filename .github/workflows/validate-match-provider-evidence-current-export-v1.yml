name: Validate MATCH provider evidence CURRENT export v1

on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php'
      - 'tests/hotel-match-provider-evidence-current-export-v1-smoke.php'
      - '.github/workflows/validate-match-provider-evidence-current-export-v1.yml'
      - 'scripts/diagnostics/hotel_match_provider_evidence_graph_v1.py'
  push:
    paths:
      - 'scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php'
      - 'tests/hotel-match-provider-evidence-current-export-v1-smoke.php'
      - '.github/workflows/validate-match-provider-evidence-current-export-v1.yml'
      - 'scripts/diagnostics/hotel_match_provider_evidence_graph_v1.py'

permissions:
  contents: read

jobs:
  offline-export-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint exporter and smoke contract
        run: |
          php -l scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php
          php -l tests/hotel-match-provider-evidence-current-export-v1-smoke.php
          python3 -m py_compile scripts/diagnostics/hotel_match_provider_evidence_graph_v1.py
      - name: Run exporter self-test
        run: php scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php --self-test
      - name: Run exporter-to-graph smoke contract
        run: php tests/hotel-match-provider-evidence-current-export-v1-smoke.php
