name: Search3 desktop primary density acceptance sync

on:
  push:
    branches:
      - ux/search3-desktop-primary-density-20260912

permissions:
  contents: read

jobs:
  sync-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize existing desktop geometry contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/search3-entry-geometry-browser.cjs')
          s = p.read_text()
          replacements = {
            "const widths = [350, 375, 430, 760, 761, 1024, 1025, 1199, 1200, 1440];": "const widths = [350, 375, 430, 760, 761, 1024, 1025, 1199, 1200, 1366, 1440, 1600];",
            "assert.equal(state.mainColumns, 2); assert.equal(state.preferenceColumns, 3);": "assert.equal(state.mainColumns, 2); assert.equal(state.preferenceColumns, 6);",
            "assert.deepEqual(counts(state.preferenceTops), [3, 3]);": "assert.deepEqual(counts(state.preferenceTops), [6], 'wide desktop keeps the six primary OTA preferences on one row');\n          assert.ok(state.preferenceWidths[1] >= state.preferenceWidths[0] + 40, 'exact hotel gets the widest primary track');\n          assert.ok(state.preferenceWidths[1] >= state.preferenceWidths[2] + 100, 'hotel track stays materially wider than compact category');"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('missing expected contract: ' + old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: search3-desktop-primary-density-test
          path: tests/search3-entry-geometry-browser.cjs
          if-no-files-found: error
