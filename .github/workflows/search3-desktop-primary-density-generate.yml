name: Search3 desktop primary density generate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts
      - name: Generate canonical Search3 assets
        run: python3 scripts/build/search3_assets.py --write
      - name: Verify canonical Search3 assets
        run: python3 scripts/build/search3_assets.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: search3-desktop-primary-density-generated
          path: |
            v2/search3-entry-v1.css
            docs/project/search3-production-import.json
          if-no-files-found: error
