name: Validate V2 search filters UX
on:
  push:
    branches: [main]
    paths:
      - 'v2/search-filters-ux-v1.js'
      - '.github/workflows/validate-v2-search-filters-ux.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate advanced filter UX contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/search-filters-ux-v1.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('v2/search-filters-ux-v1.js','utf8');
          const match=src.match(/const defaults=(\{[^;]+\});/);
          if(!match)throw new Error('advanced filter defaults contract missing');
          const defaults=vm.runInNewContext('('+match[1]+')');
          const required=['arrival','region','subregion','hotel','operator','hotel_type','rating','price_from','price_till','onlyDirect','onlyCharter'];
          required.forEach(name=>{if(!Object.prototype.hasOwnProperty.call(defaults,name))throw new Error('advanced filter missing: '+name);});
          if(Object.prototype.hasOwnProperty.call(defaults,'food'))throw new Error('primary meal leaked into advanced filter defaults');
          if(!src.includes("Курорт, отель и перелёт"))throw new Error('advanced filter empty summary is stale');
          if(!src.includes('Сбросить дополнительные фильтры'))throw new Error('advanced filter reset control missing');
          if(!src.includes("summary.innerHTML='<strong>Все фильтры</strong>"))throw new Error('advanced filter summary label missing');
          console.log('V2_SEARCH_FILTERS_UX_OK');
          JS
