name: MATCH official hotel name-proof apply v1

on:
  push:
    branches: [ops/match-official-hotel-name-proof-apply-1971-20260917-v1]
    paths:
      - .github/workflows/hotel-match-official-hotel-name-proof-apply-v1.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: match-official-hotel-name-proof-apply-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-official-hotel-name-proof-apply-1971-20260917-v1
  REPORT: reports/hotel-match-official-hotel-name-proof-20260917.json
  REPORT_BLOB: 9e5c8f4948bf9ed91da490911b4e4fbd75787738

jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned proof and reserve before DB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$REPORT")" = "$REPORT_BLOB"
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          raw=pathlib.Path(os.environ['REPORT']).read_bytes()
          d=json.loads(raw)
          assert d['operation_id']==os.environ['OPERATION_ID'] and len(d['candidates'])==2
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5714221811,'proof_sha256':hashlib.sha256(raw).hexdigest(),'report_blob':os.environ['REPORT_BLOB'],'planned_count':2,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True},sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-official-name-proof-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-official-hotel-name-proof-apply-1971-20260917-v1/reservation.json
          retention-days: 90

      - name: Transaction-time guarded apply
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          scp -q -o ControlPath="$sock" -o ControlMaster=no "$REPORT" "$U@$H:$HOME/.anytoour-match/operations/$OPERATION_ID/proof.json"
          cat > "$RUNNER_TEMP/apply.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const OP='hotel-match-official-hotel-name-proof-apply-1971-20260917-v1';
          function need($x,$m){if(!$x)throw new RuntimeException($m);} function qq(PDO $d,string $s,array $a=[]):array{$q=$d->prepare($s);$q->execute(array_values($a));return$q->fetchAll(PDO::FETCH_ASSOC);}
          function lower(string $s):string{return function_exists('mb_strtolower')?mb_strtolower($s,'UTF-8'):strtolower($s);} function keyn(string $s):string{$s=str_replace('ё','е',lower(trim($s)));return preg_replace('/[^\p{L}\p{N}]+/u','',$s)??'';}
          function protectedE($v,string $k='',int $d=0):bool{if($d>24)return true;$hit=preg_match('/manual|exclude|exclusion|conflict|reject|review|protect/i',$k)===1;if(is_array($v)){if($hit&&$v!==[])return true;foreach($v as$k2=>$x)if(protectedE($x,(string)$k2,$d+1))return true;return false;}if(!$hit||$v===null)return false;if(is_bool($v))return$v;if(is_numeric($v))return(float)$v!=0;return is_string($v)&&!in_array(strtolower(trim($v)),['','false','none','no','null'],true);}
          function pts($v,array &$o,int $d=0):void{if($d>24)return;if(!is_array($v))return;$a=$v['latitude']??$v['lat']??null;$b=$v['longitude']??$v['lon']??$v['lng']??null;if(is_numeric($a)&&is_numeric($b)){ $a=(float)$a;$b=(float)$b;if(abs($a)<=90&&abs($b)<=180&&($a!=0||$b!=0))$o[]=[$a,$b]; } foreach($v as$x)if(is_array($x))pts($x,$o,$d+1);}
          function km(array $a,array $b):float{[$x,$y,$u,$v]=array_map('deg2rad',[$a[0],$a[1],$b[0],$b[1]]);$h=sin(($u-$x)/2)**2+cos($x)*cos($u)*sin(($v-$y)/2)**2;return 6371.0088*2*asin(sqrt(min(1,max(0,$h))));}
          $sha=(string)getenv('MATCH_SOURCE_SHA');need(getenv('MATCH_OPERATION_ID')===OP&&preg_match('/^[a-f0-9]{40}$/D',$sha),'operation_guard');$dir=(string)getenv('HOME').'/.anytoour-match/operations/'.OP;$res=json_decode((string)file_get_contents($dir.'/reservation.json'),true,32,JSON_THROW_ON_ERROR);$proofRaw=(string)file_get_contents($dir.'/proof.json');$proof=json_decode($proofRaw,true,64,JSON_THROW_ON_ERROR);need(($res['state']??'')==='reserved_before_db_access'&&($res['source_sha']??'')===$sha&&($res['proof_sha256']??'')===hash('sha256',$proofRaw),'reservation');need(($proof['operation_id']??'')===OP&&count($proof['candidates']??[])===2,'proof');
          $out=['operation_id'=>OP,'source_sha'=>$sha,'state'=>'failed_no_replay','planned_count'=>2,'committed_count'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'no_replay'=>true,'post_commit_readback_verified'=>false];$db=null;$holds=[];$prepared=[];
          try{$root=realpath(getcwd());need(is_string($root)&&basename($root)==='anytoour.ru','root');require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET SESSION innodb_lock_wait_timeout=20');$db->exec('SET TRANSACTION ISOLATION LEVEL SERIALIZABLE');$db->beginTransaction();
            foreach($proof['candidates'] as$c){$ext=(string)$c['external_hotel_id'];$lid=(int)$c['local_hotel_id'];$r=qq($db,"SELECT local_hotel_id,decision_status,evidence_sha256,evidence_json FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND external_hotel_id=? FOR UPDATE",[$ext]);if(count($r)!==1){$holds[]="$ext:row";continue;}$row=$r[0];if($row['local_hotel_id']!==null||(string)$row['decision_status']!=='pending')$holds[]="$ext:not_pending";if(!hash_equals((string)$c['source_evidence_sha256'],(string)$row['evidence_sha256']))$holds[]="$ext:evidence_changed";$e=json_decode((string)$row['evidence_json'],true,64,JSON_THROW_ON_ERROR);if(!is_array($e)||protectedE($e))$holds[]="$ext:protected";$src=is_array($e['source']??null)?$e['source']:[];if(trim((string)($src['name']??''))!==(string)$c['source_name'])$holds[]="$ext:name";$state=(string)($src['stateKey']??$src['state_key']??'');if($state!==(string)$c['source_state_key'])$holds[]="$ext:state";$town=trim((string)($src['town']??''));if($town!==''&&keyn($town)!==keyn((string)$c['source_town']))$holds[]="$ext:town";
              $h=qq($db,"SELECT id,country_id,name,region_name,subregion_name,latitude,longitude FROM catalog_hotels WHERE id=? AND is_active=1 FOR UPDATE",[$lid]);if(count($h)!==1){$holds[]="$ext:target";continue;}$h=$h[0];if((int)$h['country_id']!==4||keyn((string)$h['name'])!==keyn((string)$c['local_name'])||keyn((string)$h['region_name'])!==keyn((string)$c['local_region'])||keyn((string)$h['subregion_name'])!==keyn((string)$c['local_subregion']))$holds[]="$ext:target_changed";
              if(qq($db,"SELECT external_hotel_id FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND decision_status='accepted' AND local_hotel_id=? AND external_hotel_id<>? FOR UPDATE",[$lid,$ext]))$holds[]="$ext:occupied";if(!qq($db,"SELECT id FROM tour_price_observations WHERE hotel_id=? LIMIT 1",[$lid]))$holds[]="$ext:not_observed";$p=[];pts($e,$p);if($p){if(!is_numeric($h['latitude'])||!is_numeric($h['longitude']))$holds[]="$ext:target_coords_missing";else foreach($p as$x)if(km($x,[(float)$h['latitude'],(float)$h['longitude']])>5)$holds[]="$ext:geo_gt5km";}
              $prepared[]=['c'=>$c,'e'=>$e];}
            $holds=array_values(array_unique($holds));file_put_contents($dir.'/precommit.json',json_encode(['operation_id'=>OP,'source_sha'=>$sha,'holds'=>$holds,'prepared_count'=>count($prepared),'proof_sha256'=>hash('sha256',$proofRaw)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n",LOCK_EX);
            if($holds||count($prepared)!==2){$db->rollBack();$out['state']='completed_no_write';$out['holds']=$holds;}else{foreach($prepared as$x){$c=$x['c'];$e=$x['e'];$e['independent_official_hotel_identity_acceptance']=['operation_id'=>OP,'source_sha'=>$sha,'prior_evidence_sha256'=>$c['source_evidence_sha256'],'local_hotel_id'=>$c['local_hotel_id'],'live_tourvisor_artifact_id'=>$proof['live_tourvisor_artifact_id'],'official_name'=>$c['official_name'],'official_geo'=>$c['official_geo'],'official_relation'=>$c['official_relation'],'official_urls'=>$c['official_urls'],'canonical_fact_sha256'=>$c['canonical_fact_sha256'],'identity_chain'=>'current Andromeda source name+state/town + live observed AnyTour target + independent official hotel owner name/geography proof','transaction_time_guards_verified'=>true];$j=json_encode($e,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);$new=hash('sha256',$j);$u=$db->prepare("UPDATE andromeda_hotel_identities SET local_hotel_id=?,decision_status='accepted',evidence_sha256=?,evidence_json=? WHERE supplier_namespace='andromeda_catalog' AND external_hotel_id=? AND decision_status='pending' AND local_hotel_id IS NULL AND evidence_sha256=?");$u->execute([(int)$c['local_hotel_id'],$new,$j,(string)$c['external_hotel_id'],(string)$c['source_evidence_sha256']]);need($u->rowCount()===1,'conditional_update');$out['new_evidence_sha256'][(string)$c['external_hotel_id']]=$new;}$db->commit();$out['state']='committed';$out['committed_count']=2;$out['database_writes']=2;$out['mapping_writes']=2;
              $ok=true;$rb=[];foreach($proof['candidates'] as$c){$r=qq($db,"SELECT local_hotel_id,decision_status,evidence_sha256 FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND external_hotel_id=?",[(string)$c['external_hotel_id']]);$x=$r[0]??[];$valid=count($r)===1&&(int)($x['local_hotel_id']??0)===(int)$c['local_hotel_id']&&($x['decision_status']??'')==='accepted'&&($x['evidence_sha256']??'')===($out['new_evidence_sha256'][(string)$c['external_hotel_id']]??'');$ok=$ok&&$valid;$rb[]=['external_hotel_id'=>$c['external_hotel_id'],'local_hotel_id'=>$x['local_hotel_id']??null,'decision_status'=>$x['decision_status']??null,'evidence_sha256'=>$x['evidence_sha256']??null,'verified'=>$valid];}$out['readback']=$rb;$out['post_commit_readback_verified']=$ok;need($ok,'post_commit_readback');}
          }catch(Throwable $e){if($db instanceof PDO&&$db->inTransaction())$db->rollBack();$out['error_code']=preg_match('/^[a-z_]{2,100}$/D',$e->getMessage())?$e->getMessage():'sanitized_failure';}
          $raw=json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR)."\n";file_put_contents($dir.'/result.json',$raw,LOCK_EX);$dig=hash('sha256',$raw);file_put_contents($dir.'/receipt.json',json_encode(['operation_id'=>OP,'source_sha'=>$sha,'state'=>$out['state'],'result_sha256'=>$dig,'readback_verified'=>$out['post_commit_readback_verified']||$out['state']==='completed_no_write','committed_count'=>$out['committed_count'],'database_writes'=>$out['database_writes'],'mapping_writes'=>$out['mapping_writes'],'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0,'no_replay'=>true],JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n",LOCK_EX);echo json_encode(['state'=>$out['state'],'committed_count'=>$out['committed_count'],'holds'=>$out['holds']??[],'readback'=>$out['readback']??[],'result_sha256'=>$dig],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";if(!in_array($out['state'],['committed','completed_no_write'],true))exit(2);
          PHP
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < "$RUNNER_TEMP/apply.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json proof.json precommit.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';r=json.loads((s/'result.json').read_text());c=json.loads((s/'receipt.json').read_text());h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest();ok=(r.get('state') in ('committed','completed_no_write') and c.get('result_sha256')==h and c.get('readback_verified') is True and c.get('supplier_calls')==0 and c.get('tourvisor_calls')==0 and c.get('samo_andromeda_calls')==0);g={'verified':ok,'state':r.get('state'),'committed_count':r.get('committed_count'),'holds':r.get('holds',[]),'readback':r.get('readback',[]),'result_sha256':h};print(json.dumps(g,ensure_ascii=False,sort_keys=True));(p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n');raise SystemExit(0 if ok else 2)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-official-name-proof-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-official-hotel-name-proof-apply-1971-20260917-v1/
          retention-days: 90
