      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-public-andromeda-bridge-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-public-andromeda-bridge-1971-20260914-v1/
          retention-days: 90
