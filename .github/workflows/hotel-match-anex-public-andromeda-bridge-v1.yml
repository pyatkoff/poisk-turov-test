              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'unparseable','exit_code':p.returncode,'stderr_tail':p.stderr[-1600:]},ensure_ascii=False,sort_keys=True)+'\n');raise
          (state/'bridge.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          if p.returncode!=0 or result.get('status')!='completed' or result.get('database_writes')!=0 or result.get('mapping_writes')!=0:raise RuntimeError('bridge_contract')
