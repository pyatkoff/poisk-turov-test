name: Verify PRICE journal and TOP500 timer on current AnyTour release
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-read-server-timer.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '7a2b663ba61bf5f83fda1f7cd4b227f169fefb8f'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read the installed timer receipt, SQL lock and stored attempt queue
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=25 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/anytoour.ru/data && /usr/bin/php -d display_errors=0' <<'PHP'
          <?php
          declare(strict_types=1);
          try {
              require_once 'db-v1.php';
              $pdo = v2_data_db();
              $check = $pdo->prepare('SELECT IS_USED_LOCK(?) IS NOT NULL');
              $limit = microtime(true) + 1200;
              $previous = null;
              $lastOutput = 0.0;
              do {
                  $check->execute(['anytour_top500_monthly_v1']);
                  $state = $check->fetchColumn();
                  $check->closeCursor();
                  if (!in_array((string)$state, ['0','1'], true)) throw new RuntimeException('missing_lock_state');
                  $busy = (bool)$state;
                  if ($busy !== $previous || microtime(true) - $lastOutput >= 25) {
                      echo 'COLLECTOR_LOCK ', json_encode(['checked_at'=>gmdate('c'), 'busy'=>$busy], JSON_THROW_ON_ERROR), PHP_EOL;
                      $previous = $busy;
                      $lastOutput = microtime(true);
                  }
                  if (!$busy || microtime(true) >= $limit) break;
                  sleep(10);
              } while (true);
          } catch (Throwable $e) {
              fwrite(STDERR, 'lock_read_failed '.get_class($e).PHP_EOL);
              exit(1);
          }
          PHP
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" '/usr/bin/php /var/www/anytoour/data/www/anytoour.ru/data/hotel-price-timer-v1.php --status' > "$RUNNER_TEMP/native-receipt.json"
          python3 - <<'PY'
          import datetime, json, os, pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'native-receipt.json').read_text())
          print('SERVER_TIMER_STATUS', json.dumps(r,ensure_ascii=False))
          assert r.get('registered') is True
          collection = r.get('last-collection')
          bounds = [0, 0] if collection is None else [
              int(datetime.datetime.fromisoformat(collection[key]).timestamp())
              for key in ('started_at', 'finished_at')
          ]
          assert 0 <= bounds[0] <= bounds[1]
          pathlib.Path(os.environ['RUNNER_TEMP'], 'collection-window').write_text(f'{bounds[0]} {bounds[1]}\n')
          PY
          read -r cycle_from cycle_to < "$RUNNER_TEMP/collection-window"
          [[ "$cycle_from" =~ ^[0-9]+$ && "$cycle_to" =~ ^[0-9]+$ ]]
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /var/www/anytoour/data/www/anytoour.ru/data && /usr/bin/php -d display_errors=0 -- $cycle_from $cycle_to" <<'PHP'
          <?php
          declare(strict_types=1);
          try {
              require_once 'db-v1.php';
              require_once 'published-hotels-monitor-v1.php';
              require_once 'top500-monthly-plan-v1.php';
              $pdo = v2_data_db();
              $pdo->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');
              $pdo->exec('START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY');
              $clock = $pdo->query('SELECT CURDATE() AS today, UNIX_TIMESTAMP() AS epoch')->fetch();
              $registry = v2_top500_registry($pdo);
              if ($registry === null) throw new RuntimeException('identity_registry_unavailable');
              $ids = v2_all_hotel_monitor_input_ids($registry);
              $top = array_values(array_diff(v2_priority_hotel_ids($registry), v2_collection_priority_hotel_ids()));
              $catalog = $pdo->query('SELECT id,country_id,country_name,is_active FROM catalog_hotels WHERE id IN ('.implode(',',array_map('intval',$ids)).') ORDER BY id')->fetchAll();
              $routes = $pdo->query('SELECT dc.departure_id,dc.country_id,dc.is_active FROM catalog_departure_countries dc JOIN catalog_departures d ON d.id=dc.departure_id AND d.is_active=1 JOIN catalog_countries c ON c.id=dc.country_id AND c.is_active=1 WHERE dc.is_active=1 ORDER BY dc.country_id,dc.departure_id')->fetchAll();
              $plan = v2_top500_monthly_plan($top, $catalog, $routes, $clock['today'], 12, 1, true);
              $plan = v2_append_published_hotel_monthly_plan($plan, $catalog, $routes, $clock['today'], 12, 1, true);
              $attempts = $pdo->query("SELECT a.id,a.target_key,a.status,a.search_id,UNIX_TIMESTAMP(a.started_at) AS started_epoch,UNIX_TIMESTAMP(a.finished_at) AS finished_epoch,a.error_text FROM tour_matrix_collection_attempts a JOIN (SELECT target_key,MAX(id) AS id FROM tour_matrix_collection_attempts WHERE target_key LIKE 'monthly:%' AND started_at>=DATE_SUB(NOW(), INTERVAL 7 DAY) GROUP BY target_key) last_attempt ON a.id=last_attempt.id")->fetchAll();
              $recent = $pdo->query("SELECT hotel_ids_json FROM tour_matrix_collection_attempts WHERE criterion='hotel_batch' AND target_key LIKE 'monthly:%' AND departure_id=1 AND date_to>CURDATE() AND nights_from=5 AND nights_to=14 AND status IN ('success','empty') AND finished_at>DATE_SUB(NOW(),INTERVAL 36 HOUR) AND finished_at<=NOW() AND search_id>0")->fetchAll(PDO::FETCH_COLUMN);
              $activity = $pdo->query("SELECT UNIX_TIMESTAMP(MAX(started_at)) AS last_start, UNIX_TIMESTAMP(MAX(finished_at)) AS last_finish, IS_USED_LOCK('anytour_top500_monthly_v1') IS NOT NULL AS lock_busy FROM tour_matrix_collection_attempts WHERE criterion='hotel_batch' AND target_key LIKE 'monthly:%' AND started_at >= DATE_SUB(NOW(),INTERVAL 6 HOUR)")->fetch();
              $incomplete = $pdo->prepare("SELECT country_id,date_from,date_to,status,search_id,rows_received,observations_written,error_text,UNIX_TIMESTAMP(finished_at) AS finished_epoch FROM tour_matrix_collection_attempts WHERE (target_key LIKE 'monthly:%' OR target_key LIKE 'page_gap:%') AND status IN ('failure','timeout') AND finished_at BETWEEN FROM_UNIXTIME(?) AND FROM_UNIXTIME(?) ORDER BY id");
              $incomplete->execute([(int)$argv[1],(int)$argv[2]]);
              $incompleteRows = $incomplete->fetchAll(PDO::FETCH_ASSOC);
              $pdo->exec('ROLLBACK');
              $diagnoses = [];
              foreach ($incompleteRows as $row) {
                  $error = (string)$row['error_text'];
                  $kind = 'other';
                  if (preg_match('/^Tourvisor HTTP ([0-9]{3}) after [0-9]+ attempt\\(s\\)$/D',$error,$matched)) $kind = 'http_'.$matched[1];
                  elseif (str_starts_with($error,'Tourvisor connection error')) $kind = 'connection';
                  elseif ($error === 'partial results saved; resume existing search') $kind = 'partial_saved';
                  elseif ($error === 'no searchId') $kind = 'no_search_id';
                  elseif ($error === 'Invalid Tourvisor JSON response') $kind = 'invalid_json';
                  elseif ($error === 'unrecognized Tourvisor result shape; not an empty search') $kind = 'unrecognized_shape';
                  $diagnoses[] = [
                      'country_id'=>(int)$row['country_id'], 'date_from'=>$row['date_from'], 'date_to'=>$row['date_to'],
                      'status'=>$row['status'], 'cause'=>$kind, 'has_saved_search_id'=>(int)$row['search_id']>0,
                      'rows_received'=>(int)$row['rows_received'], 'attempt_observations_written'=>(int)$row['observations_written'],
                      'finished_at'=>gmdate('c',(int)$row['finished_epoch']),
                  ];
              }
              echo 'CYCLE_INCOMPLETE_ATTEMPTS ',json_encode(['from_epoch'=>(int)$argv[1],'to_epoch'=>(int)$argv[2],'logical_attempts'=>$diagnoses],JSON_THROW_ON_ERROR),PHP_EOL;
              echo 'COLLECTOR_ACTIVITY ', json_encode([
                  'checked_at' => gmdate('c',(int)$clock['epoch']),
                  'last_start' => $activity['last_start'] === null ? null : gmdate('c',(int)$activity['last_start']),
                  'last_finish' => $activity['last_finish'] === null ? null : gmdate('c',(int)$activity['last_finish']),
                  'lock_busy' => (bool)$activity['lock_busy'],
              ], JSON_THROW_ON_ERROR), PHP_EOL;
              $searched = [];
              foreach ($recent as $raw) foreach (json_decode($raw,true,512,JSON_THROW_ON_ERROR) as $id) $searched[(int)$id] = true;
              $planned = [];
              $directions = [];
              foreach ($plan['targets'] as $target) {
                  $direction = $target['departure_id'].'/'.$target['country_id'].' '.$target['country_name'];
                  $directions[$direction][] = $target;
                  foreach ($target['hotel_ids'] as $id) $planned[(int)$id] = true;
              }
              if (count($planned) !== $plan['hotel_count']) throw new RuntimeException('plan_identity_count');
              $pending = [];
              foreach ($directions as $direction => $targets) {
                  $q = v2_top500_monthly_queue($targets, $attempts, (int)$clock['epoch'], 24);
                  $pending[$direction] = array_map(static fn(array $m): int => $m['pending'], $q['months']);
              }
              $q = v2_top500_monthly_queue($plan['targets'], $attempts, (int)$clock['epoch'], 24);
              if (array_sum(array_map('array_sum',$pending)) !== $q['pending']) throw new RuntimeException('pending_total_mismatch');
              $retainedSearches = [];
              $retainedTargets = 0;
              foreach ($q['targets'] as $target) {
                  $searchId = $target['resume_search_id'] ?? null;
                  if ($searchId === null) continue;
                  $retainedSearches[$searchId] = true;
                  $retainedTargets++;
              }
              echo 'RETAINED_SEARCH_QUEUE ', json_encode([
                  'as_of'=>gmdate('c',(int)$clock['epoch']),
                  'ready_logical_targets_with_search_id'=>$retainedTargets,
                  'distinct_saved_search_ids'=>count($retainedSearches),
                  'deferred_logical_targets'=>$q['deferred'],
              ], JSON_THROW_ON_ERROR), PHP_EOL;
              foreach (['PLAN_IDS'=>array_keys($planned),'COMPLETED_MONTHLY_IDS_36H'=>array_keys($searched),'PENDING_BY_ROUTE_MONTH'=>$pending,'NATIVE_QUEUE'=>['as_of'=>gmdate('c',(int)$clock['epoch']),'targets'=>$plan['batch_count'],'fresh'=>$q['fresh'],'pending'=>$q['pending'],'deferred'=>$q['deferred']]] as $label=>$data)
                  echo $label, ' ', json_encode($data, JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR), PHP_EOL;
          } catch (Throwable $e) {
              fwrite(STDERR, 'queue_read_failed '.get_class($e).' '.basename($e->getFile()).':'.$e->getLine().PHP_EOL);
              exit(1);
          }
          PHP

      - name: Read the installed PRICE journal and the original child outcome
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=25 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" python3 - <<'PY'
          import fcntl, hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('/var/www/anytoour/data')
          journal = root/'channel-post-operations'/'monitor-price-after-collection-v1.jsonl'
          app = root/'www/app.anytoour.ru'
          native = root/'www/anytoour.ru/data'

          def open_read(path):
              if path.resolve(strict=True) != path:
                  raise RuntimeError('journal_path_changed')
              stream = path.open('rb')
              fcntl.flock(stream, fcntl.LOCK_SH | fcntl.LOCK_NB)
              before, named = os.fstat(stream.fileno()), path.stat()
              if (before.st_dev, before.st_ino) != (named.st_dev, named.st_ino):
                  raise RuntimeError('journal_identity_changed')
              return stream, before

          def last_record(stream, stat):
              limit = 8388608
              offset = max(0, stat.st_size - limit)
              stream.seek(offset)
              raw = stream.read(limit)
              if len(raw) != stat.st_size - offset or not raw.endswith(b'\n'):
                  raise RuntimeError('journal_tail_incomplete')
              lines = raw.rstrip(b'\n').rsplit(b'\n', 1)
              if offset and len(lines) != 2:
                  raise RuntimeError('journal_record_exceeds_bound')
              return json.loads(lines[-1])

          with open_read(journal)[0] as global_file:
              state = last_record(global_file, os.fstat(global_file.fileno()))
              pending = state.get('pending')
              cycle = state.get('nightly_cycle')
              result = {
                  'application_head': subprocess.check_output(['git','-C',str(app),'rev-parse','HEAD'],text=True).strip(),
                  'native_hook_sha256': hashlib.sha256((native/'monitor-price-hook.php').read_bytes()).hexdigest(),
                  'nightly_cycle': {k:cycle.get(k) for k in ('collector_run_id','state','started_at','finished_at','updated_pairs','scanned_pairs')} if cycle else None,
                  'pending': None,
              }
              if pending:
                  operation = pending['operation']
                  if not re.fullmatch(r'commercial-monitor-price-h[1-9][0-9]*-[a-f0-9]{64}',operation):
                      raise RuntimeError('pending_operation_invalid')
                  child_path = journal.parent/operation/'receipt.jsonl'
                  failure = pending.get('child_failure') or {}
                  result['pending'] = {k:pending.get(k) for k in ('tourvisor_hotel_id','operation','phase')}
                  result['pending']['child_failure'] = {k:failure.get(k) for k in ('error','class','exit_code')}
                  result['pending']['child'] = None
                  if child_path.exists():
                      child_file, child_stat = open_read(child_path)
                      with child_file:
                          if child_stat.st_size > 10485760:
                              raise RuntimeError('child_journal_exceeds_bound')
                          raw = child_file.read()
                          if len(raw) != child_stat.st_size or not raw.endswith(b'\n'):
                              raise RuntimeError('child_journal_incomplete')
                          child = json.loads(raw.rstrip(b'\n').rsplit(b'\n',1)[-1])
                          posts = child.get('posts') or {}
                          result['pending']['child'] = {
                              'sha256':hashlib.sha256(raw).hexdigest(),
                              'complete':child.get('complete'),
                              'terminal':(child.get('terminal') or {}).get('state'),
                              'posts':{key.split(':',1)[0]: val.get('state') for key,val in posts.items()},
                          }
              print('PRICE_CURRENT_JOURNAL',json.dumps(result,sort_keys=True))
          PY

      - name: Compare the original TV61623 registry versions with the installed recovery contract
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=25 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'php -d display_errors=0 -d log_errors=0' <<'PHP'
          <?php
          declare(strict_types=1);
          $pdo = null;
          try {
              $app = '/var/www/anytoour/data/www/app.anytoour.ru';
              if (realpath($app) !== $app || !chdir($app)) throw new RuntimeException('app_path_changed');
              ob_start();
              try {
                  require $app.'/config.php';
                  require_once $app.'/services/ChannelPostRuntime.php';
                  require_once $app.'/services/ChannelPostAdminService.php';
                  require_once $app.'/services/ChannelPostEntryService.php';
              } finally { ob_end_clean(); }
              $pdo = ConversationDb::connection();
              $pdo->exec('START TRANSACTION READ ONLY');
              $registry = new ChannelPostRegistryService($pdo);
              $rows = [];
              foreach (['max'=>1905,'telegram'=>1895] as $platform=>$id) {
                  $p = $registry->publication($id);
                  if (!is_array($p) || $p['project_key'] !== 'anytour' || $p['platform'] !== $platform) {
                      throw new RuntimeException('original_publication_identity_changed');
                  }
                  if ($platform === 'max') $maxPublication = $p;
                  $meta = $p['snapshot']['metadata'] ?? [];
                  $rows[$platform] = [
                      'publication_id'=>(int)$p['publication_id'],
                      'version_id'=>(int)$p['version_id'],
                      'state'=>$p['state'],
                      'read_failure_confirmation_eligible'=>$platform === 'max'
                          ? ChannelPostRegistryService::maxReadFailureConfirmationEligible($p) : null,
                      'retained_record_id'=>$meta['monitor_price_record_id'] ?? null,
                      'observed_at'=>$meta['monitor_price_observed_at_relative'] ?? null,
                  ];
              }
              $pdo->rollBack();
              echo 'PRICE_ORIGINAL_REGISTRY ', json_encode($rows, JSON_THROW_ON_ERROR), PHP_EOL;
              if ($rows['max']['version_id'] !== 15457 || $rows['telegram']['version_id'] !== 15458) {
                  throw new RuntimeException('original_registry_version_changed');
              }
              $path = '/var/www/anytoour/data/channel-post-operations/commercial-monitor-price-h61623-ca67adee35e5a6b8a38fd7dcd705f5ccf3cb2326c27041e4224627c3709218c8/receipt.jsonl';
              if (realpath($path) !== $path || !is_file($path)) throw new RuntimeException('original_journal_path_changed');
              $journal = fopen($path, 'rb');
              if (!is_resource($journal) || !flock($journal, LOCK_SH | LOCK_NB)) {
                  throw new RuntimeException('original_journal_busy');
              }
              try {
                  $raw = stream_get_contents($journal, 10485761);
                  if (!is_string($raw) || !str_ends_with($raw, "\n")
                      || hash('sha256', $raw) !== '24863d0c50ed86c299056e18d7de2e2f3f5d3cab80c41ab4f7f7c8fed0f9e85d') {
                      throw new RuntimeException('original_child_changed');
                  }
                  $lines = explode("\n", rtrim($raw, "\n"));
                  $child = json_decode(end($lines), true, 64, JSON_THROW_ON_ERROR);
                  $posts = $child['posts'] ?? [];
                  $entry = reset($posts);
                  $plan = $entry['plan'] ?? null;
                  if (count($posts) !== 1 || ($entry['state'] ?? null) !== 'text_edit_returned'
                      || !is_array($plan) || ($plan['platform'] ?? null) !== 'max' || (int)($plan['publication_id'] ?? 0) !== 1905
                      || ($plan['post_url'] ?? null) !== 'https://max.ru/channel_anytour/AaHqSmdWAtI') {
                      throw new RuntimeException('original_post_plan_changed');
                  }
                  $mid = (string)($maxPublication['external_message_id'] ?? '');
                  if (!preg_match('/\A[A-Za-z0-9_.-]{1,191}\z/D', $mid) || $mid !== (string)($plan['message_id'] ?? '')) {
                      throw new RuntimeException('original_max_identity_changed');
                  }
                  $response = ChannelPostApiTransport::buttonRequest('max', 'GET', '/messages/'.$mid, [], null);
                  $proof = [
                      'http' => $response['http'] ?? null,
                      'provider_edit_returned' => ($entry['provider_edit_returned'] ?? null) === true,
                      'original_record_observed_at' => $plan['monitor_price']['observed_at'] ?? null,
                      'original_record_price' => $plan['monitor_price']['price'] ?? null,
                      'same_post' => null, 'matches_original_caption' => null, 'matches_registry_caption' => null,
                      'same_photo' => null, 'same_button' => null,
                  ];
                  if (($response['http'] ?? null) === 200 && is_array($response['data'] ?? null)) {
                      $native = ChannelPostIncomingAdapter::maxSnapshot($response['data']);
                      if (is_array($native)) {
                          $image = $native['attachments'][0] ?? [];
                          $signature = ($image['provider'] ?? '').':'.($image['photo_id'] ?? $image['file_unique_id'] ?? '');
                          $proof['same_post'] = ($native['post_url'] ?? null) === $plan['post_url'];
                          $proof['matches_original_caption'] = ($native['text'] ?? null) === $plan['text'];
                          $proof['matches_registry_caption'] = ($native['text'] ?? null) === $maxPublication['snapshot']['text'];
                          $proof['same_photo'] = count($native['attachments'] ?? []) === 1 && $signature === ($plan['photo_signature'] ?? null);
                          $proof['same_button'] = ChannelPostIncomingAdapter::containsOnlyButton(
                              $native, ChannelPostButtonTransport::buttonUrl($maxPublication), (string)$maxPublication['channel']['button_text']
                          );
                      }
                  }
                  echo 'PRICE_ORIGINAL_MAX_EFFECT ', json_encode($proof, JSON_THROW_ON_ERROR), PHP_EOL;
              } finally {
                  fclose($journal);
              }

          } catch (Throwable $e) {
              if ($pdo instanceof PDO && $pdo->inTransaction()) $pdo->rollBack();
              fwrite(STDERR, 'registry_read_failed '.get_class($e).PHP_EOL);
              exit(1);
          }
          PHP

      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
