name: Price public evidence for original Telegram holds
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-read-server-timer.yml']
permissions:
  contents: read
jobs:
  public-read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '565df4d488932fd434170199a84a411b00ce9fbb'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the two exact posts on both channels and current XML
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime
          from hashlib import sha256
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import URLError
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET
          from zoneinfo import ZoneInfo
          import json
          import re
          import sys
          TARGETS=json.loads(r'''[{"hotel":4181,"platform":"telegram","publication":3629,"url":"https://t.me/anytour/204"},{"hotel":99713,"platform":"telegram","publication":3634,"url":"https://t.me/anytour/483"},{"hotel":4181,"platform":"max","publication":3614,"url":"https://max.ru/anytour/AZ8DSRZpHNw"},{"hotel":99713,"platform":"max","publication":3620,"url":"https://max.ru/anytour/AZ_RB3FVXFc"}]''')
          
          base = "https://app.anytoour.ru/feed/hotel-posts-"
          rows = json.loads(Path(sys.argv[1]).read_text()) if len(sys.argv)>1 else TARGETS
          quoted = r'"(?:[^"\\]|\\.)*"'
          max_pattern = re.compile(r'\bmessage:\{id:([0-9]+),link:(' + quoted + r'),createdAt:' + quoted
                                   + r',updatedAt:(?:' + quoted + r'|null),text:(' + quoted + ')')
          stamp_pattern = re.compile(r"Цена найдена мониторингом (\d{2}\.\d{2}\.\d{4}),?\s+(\d{2}:\d{2}) МСК")
          price_pattern = re.compile(r"От ([\d \u00a0\u202f]+(?:[.,]\d{2})?) ₽")
          headers = {"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"}
          
          def get(url):
              with urlopen(Request(url, headers=headers), timeout=12) as response:
                  assert response.status == 200
                  return response.read().decode()
          
          class TelegramPost(HTMLParser):
              def __init__(self, wanted):
                  super().__init__()
                  self.wanted = wanted
                  self.depth = 0
                  self.root = None
                  self.caption_depth = None
                  self.caption = []
                  self.seen = 0
                  self.photo = False
                  self.button = False
              def handle_starttag(self, tag, pairs):
                  attrs = dict(pairs)
                  classes = set(attrs.get('class', '').split())
                  void = tag in {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}
                  if not void: self.depth += 1
                  if attrs.get('data-post') == self.wanted and tag == 'div':
                      self.root = self.depth
                      self.seen += 1
                  if self.root is None: return
                  if 'tgme_widget_message_text' in classes and not void: self.caption_depth = self.depth
                  if tag == 'br' and self.caption_depth is not None: self.caption.append('\n')
                  if 'tgme_widget_message_photo_wrap' in classes: self.photo |= 'background-image' in attrs.get('style','')
                  if 'tgme_widget_message_inline_button' in classes: self.button |= bool(attrs.get('href'))
              def handle_endtag(self, tag):
                  if tag in {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}: return
                  if self.depth == self.caption_depth: self.caption_depth = None
                  if self.depth == self.root: self.root = None
                  self.depth -= 1
              def handle_data(self, data):
                  if self.caption_depth is not None: self.caption.append(data)
          
          def offer_rows(xml):
              items = ET.fromstring(xml).findall('./shop/offers/offer')
              result = {o.attrib['id']:o for o in items}
              assert len(result)==len(items)
              return result
          
          with ThreadPoolExecutor(3) as e:
              snapshots=dict(zip(('max','telegram','all'),e.map(lambda kind:get(base+kind+'.xml'),('max','telegram','all'))))
          feeds={kind:offer_rows(raw) for kind,raw in snapshots.items()}
          
          def normalized_price(s):
              return re.sub(r"[ \u00a0\u202f]", "", s).replace(",", ".").removesuffix(".00") if s else None
          
          def price_text(text):
              p=price_pattern.search(text)
              t=stamp_pattern.search(text)
              return normalized_price(p[1]) if p else None, " ".join(t.groups()) if t else None
          
          def read(row):
              platform,hotel,url=row['platform'],row['hotel'],row['url']
              pref={'max':'max','telegram':'tg'}[platform]
              exact=f'{pref}_{hotel}'
              published=feeds[platform][exact]
              combined=feeds['all'][exact]
              expected=price_text(published.findtext('description',''))
              assert normalized_price(published.findtext('price'))==expected[0]
              assert price_text(combined.findtext('description',''))==expected
              attempts=[url] if platform=='max' else [url+'?embed=1',url.replace('t.me/','t.me/s/')]
              matches=[]
              results=[]
              for address in attempts:
                  try:
                      document=get(address)
                      if platform=='max':
                          selected=[m for m in max_pattern.finditer(document) if json.loads(m[2])==url]
                          if len(selected)!=1: raise ValueError('caption_identity')
                          m=selected[0]
                          tail=document[m.end():].split("},posts:[",1)[0]
                          value=price_text(unescape(json.loads(m[3])))
                          media=bool(re.search(r'\bphotoId:\d+',tail))
                          button='attachmentType:"INLINE_KEYBOARD"' in tail
                      else:
                          tg=TelegramPost('anytour/'+url.rsplit('/',1)[1])
                          tg.feed(document)
                          if tg.seen!=1 or not tg.caption: raise ValueError('caption_identity')
                          value=price_text(''.join(tg.caption))
                          media,button=tg.photo,tg.button
                      results.append({'view':('embed' if '?embed' in address else ('archive' if platform=='telegram' else 'max')),
                                      'value':value,'photo':media,'button':button})
                      matches.append(value==expected and expected[0] is not None and expected[1] is not None and media and button)
                  except (OSError, URLError, ValueError, AssertionError) as error:
                      results.append({'error':type(error).__name__,'detail':str(error)[:80]})
              return {**row,'expected':expected,'public_match':any(matches),'reads':results}
          
          with ThreadPoolExecutor(4) as e:
              result=list(e.map(read,rows))
          print('INDEPENDENT_PROMOTED_PUBLIC',json.dumps({
              'at':datetime.now(ZoneInfo('Europe/Moscow')).isoformat(),
              'all_sha':sha256(snapshots['all'].encode()).hexdigest(),
              'rows':result},ensure_ascii=False),flush=True)
          PY
