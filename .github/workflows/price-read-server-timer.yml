name: Read PRICE holds on Telegram 809 and 19
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-read-server-timer.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == 'd8f45261aa78a0c94cc31c36da213cdaa51a7968'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read the original operations at Telegram 809 and 19
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/app.anytoour.ru && php -d display_errors=0' <<'PHP'
          <?php
          declare(strict_types=1);
          try {
              ob_start();
              try {
                  require 'config.php';
                  require_once 'services/ChannelPostRuntime.php';
                  require_once 'integrations/ChannelPostApiTransport.php';
              } finally {
                  ob_end_clean();
              }
              $db=ConversationDb::connection();
              $db->exec('START TRANSACTION READ ONLY');
              $registry=new ChannelPostRegistryService($db);
              $claims=$db->prepare("SELECT id,state,claimed_at,claim_token IS NOT NULL AS token_present FROM post_versions WHERE publication_id=? AND (state IN ('claimed','write_started','unknown') OR claim_token IS NOT NULL OR claimed_at IS NOT NULL) ORDER BY id");
              $out=[];
              foreach ([3600=>'809',3622=>'19'] as $id=>$mid) {
                  $post=$registry->publication($id);
                  if (!is_array($post) || $post['project_key']!=='anytour' || $post['platform']!=='telegram' || $post['snapshot']['post_url']!=='https://t.me/anytour/'.$mid) {
                      throw new RuntimeException('target_registry_identity_changed');
                  }
                  $claims->execute([$id]);
                  $versions=$claims->fetchAll(PDO::FETCH_ASSOC);
                  $claims->closeCursor();
                  $out[]=['publication'=>$id,'post'=>$mid,'state'=>$post['state'],'current_version'=>$post['version_id'],'claims'=>$versions];
              }
              $db->rollBack();
              echo 'TELEGRAM_ORIGINAL_HOLDS ',json_encode(['at'=>gmdate('c'),'rows'=>$out],JSON_THROW_ON_ERROR),PHP_EOL;
          } catch (Throwable $e) {
              echo 'TELEGRAM_HOLD_READ_FAILED ',get_class($e),PHP_EOL;
              exit(1);
          }
          PHP
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
