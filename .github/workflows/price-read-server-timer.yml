name: Read the original PRICE run 45884856726 and current editor lock
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-read-server-timer.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '86f82cf57e23f02a6a7b1eaa1bf316ca012a3965'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read original PRICE journal tail and current editor lock
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' <<'PY'
          import datetime, fcntl, json, os
          path='/var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl'
          with open(path,'rb') as handle:
              try:
                  fcntl.flock(handle,fcntl.LOCK_SH | fcntl.LOCK_NB)
                  fcntl.flock(handle,fcntl.LOCK_UN)
                  locked=False
              except BlockingIOError:
                  locked=True
              size=os.fstat(handle.fileno()).st_size
              handle.seek(max(0,size-2097152))
              tail=handle.read(min(size,2097152))
          lines=tail.splitlines()
          if size>2097152: lines=lines[1:]
          state=next((json.loads(row) for row in reversed(lines) if row.endswith(b'}') and row.startswith(b'{')), {})
          pending=state.get('pending') or {}
          cycle=state.get('nightly_cycle') or {}
          print('PRICE_EDITOR_OBSERVATION',json.dumps({
              'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'locked':locked,
              'journal_bytes':size,
              'cycle':{k:cycle.get(k) for k in ('collector_run_id','state','collection_started_at','started_at','finished_at','updated_pairs','scanned_pairs','remaining_unscanned_pairs')},
              'pending':{k:pending.get(k) for k in ('tourvisor_hotel_id','phase','at')},
          }),flush=True)
          import subprocess
          names=('sync-priority-hotels-v1.php','top500-coverage-v1.php','top500-daily-collector-v1.php',
                 'monitor-price-hook.php','apply_promoted_hotel_prices.php','rollup-price-daily-v1.php',
                 'rollup-price-daily-exact-v1.php','build-seo-offer-snapshots-v1.php')
          active=[]
          table=subprocess.check_output(['ps','-u',str(os.getuid()),'-o','etimes=,comm=,args='],text=True)
          for row in table.splitlines():
              fields=row.strip().split(maxsplit=2)
              if len(fields)<3 or fields[1] not in ('php','php8.1','php8.2','php8.3','php8.4'):continue
              command=fields[2].split()
              for token in command[1:3]:
                  filename=os.path.basename(token)
                  if filename in names:
                      active.append({'step':filename,'elapsed_seconds':int(fields[0])})
          print('PRICE_RELATED_STEPS',json.dumps(active),flush=True)
          PY
      - name: Read the exact collection interval from the existing attempts table
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" 'cd /var/www/anytoour/data/www/anytoour.ru/data && /usr/bin/php -d display_errors=0' <<'PHP'
          <?php
          declare(strict_types=1);
          try {
              require_once 'db-v1.php';
              $db=v2_data_db();
              $db->exec('START TRANSACTION READ ONLY');
              $bounds=[strtotime('2026-11-26T19:38:06Z'),strtotime('2026-11-26T19:57:44Z')];
              $sql="SELECT COUNT(*) AS attempts, COUNT(DISTINCT CASE WHEN search_id>0 THEN search_id END) AS distinct_search_ids,
                SUM(COALESCE(observations_written,0)) AS observations, SUM(COALESCE(rows_received,0)) AS source_rows,
                MIN(UNIX_TIMESTAMP(started_at)) AS first, MAX(UNIX_TIMESTAMP(finished_at)) AS last,
                SUM(status IN ('failure','timeout')) AS failure_or_timeout
                FROM tour_matrix_collection_attempts WHERE started_at>=FROM_UNIXTIME(?) AND started_at<FROM_UNIXTIME(?)
                AND (target_key LIKE 'monthly:%' OR target_key LIKE 'page_gap:%')";
              $query=$db->prepare($sql);
              $query->execute($bounds);
              $row=$query->fetch(PDO::FETCH_ASSOC);
              $query->closeCursor();
              $db->rollBack();
              echo 'ORIGINAL_TOP500_SQL ',json_encode($row,JSON_THROW_ON_ERROR),PHP_EOL;
          } catch (Throwable $e) {
              fwrite(STDERR,'original_attempts_read_failed '.get_class($e).PHP_EOL);
              exit(1);
          }
          PHP
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
