name: Preview the exact MAX confirmation for pending TV61623 without writes
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-read-server-timer.yml']
permissions:
  contents: read
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '5c2f31014168424a2088eb660e533e28884b6e5d'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read original PRICE journal tail and current editor lock
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' <<'PY'
          import datetime, fcntl, json, os, pathlib, hashlib, subprocess, base64
          path='/var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl'
          with open(path,'rb') as handle:
              try:
                  fcntl.flock(handle,fcntl.LOCK_SH | fcntl.LOCK_NB)
                  fcntl.flock(handle,fcntl.LOCK_UN)
                  locked=False
              except BlockingIOError:
                  locked=True
              size=os.fstat(handle.fileno()).st_size
              handle.seek(max(0,size-2097152))
              tail=handle.read(min(size,2097152))
          lines=tail.splitlines()
          if size>2097152: lines=lines[1:]
          state=next((json.loads(row) for row in reversed(lines) if row.endswith(b'}') and row.startswith(b'{')), {})
          pending=state.get('pending') or {}
          cycle=state.get('nightly_cycle') or {}
          print('PRICE_EDITOR_OBSERVATION',json.dumps({
              'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'locked':locked,
              'journal_bytes':size,
              'cycle':{k:cycle.get(k) for k in ('collector_run_id','state','collection_started_at','started_at','completed_at','updated_pairs','scanned_pairs','remaining_unscanned_pairs')},
              'pending':{k:pending.get(k) for k in ('tourvisor_hotel_id','phase','at')},
          }),flush=True)
          assert not locked and cycle.get('collector_run_id')=='45930672851' and pending.get('tourvisor_hotel_id')==61623
          operation='commercial-monitor-price-h61623-ca67adee35e5a6b8a38fd7dcd705f5ccf3cb2326c27041e4224627c3709218c8'
          assert pending.get('operation')==operation and (pending.get('child_failure') or {}).get('error')=='max_read_failed'
          app='/var/www/anytoour/data/www/app.anytoour.ru'
          assert subprocess.check_output(['git','-C',app,'rev-parse','HEAD']).decode().strip()=='263cc9a7855bd11f3597572d08c7f463faebdbd6'
          private=pathlib.Path(path).parent
          child=private/operation/'receipt.jsonl'
          assert child.resolve()==child and child.stat().st_size==21985
          raw=child.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='24863d0c50ed86c299056e18d7de2e2f3f5d3cab80c41ab4f7f7c8fed0f9e85d'
          leaf=json.loads(raw.splitlines()[-1])
          assert leaf['operation']==operation
          plans=[x['plan'] for x in leaf['posts'].values() if x.get('state')=='text_edit_returned' and x.get('plan',{}).get('platform')=='max']
          assert len(plans)==1 and plans[0]['monitor_price']['price']==268242
          refs={}
          for channel in ('max','telegram'):
              approved=private/'commercial-hotel-batch-20261117-24-v1'/(channel+'-commercial-hotel-61623-v1-approved.json')
              assert approved.resolve()==approved and approved.stat().st_size<=1000000
              proof=json.loads(approved.read_bytes())['receipt']
              refs[channel]=int(proof['publication_id'])
          bundle={'refs':refs,'text':plans[0]['text'],'urls':{'max':'https://max.ru/channel_anytour/AaHqSmdWAtI','telegram':'https://t.me/any_toour/871'}}
          php=r'''<?php
          $root='/var/www/anytoour/data/www/app.anytoour.ru'; chdir($root); ob_start(); require $root.'/config.php'; require_once $root.'/services/ChannelPostRuntime.php'; require_once $root.'/services/ChannelPostEntryService.php'; require_once $root.'/services/ChannelPostReconciliationService.php'; ob_end_clean();
          $bundle=json_decode(base64_decode((string)getenv('PRICE_READ_ONLY_BUNDLE'),true),true,256,JSON_THROW_ON_ERROR);
          $db=ConversationDb::connection(); $db->exec('START TRANSACTION READ ONLY');
          try {
            $r=new ChannelPostRegistryService($db);
            foreach ($bundle['refs'] as $platform=>$id) {
              $p=$r->publication($id);
              if (!$p || $p['platform']!==$platform || ($p['snapshot']['post_url']??null)!==$bundle['urls'][$platform]) throw new RuntimeException('existing_post_identity_changed');
              echo 'PRICE_REGISTRY_READ ',json_encode(['platform'=>$platform,'publication_id'=>$id,'version_id'=>(int)$p['version_id'],'state'=>$p['state'],'reason'=>$p['error_reason'],'write_attempts'=>$p['write_attempts'],'claimed'=>!empty($p['claim_token']),'intended_text'=>$platform==='max'&&($p['snapshot']['text']??null)===$bundle['text']],JSON_THROW_ON_ERROR),PHP_EOL;
              if ($platform!=='max') continue;
              if (($p['state']??null)==='sent') {$preview=['ok'=>true,'state'=>'already_sent','reason'=>'registry_already_sent','provider_writes'=>0];}
              else {
                $fingerprint=ChannelPostIncomingAdapter::contentFingerprint($p['snapshot']);
                $preview=(new ChannelPostReconciliationService($db))->confirmReadFailure(ChannelPostRuntime::identity('max'),(string)$p['channel_id'],$id,(int)$p['version_id'],(int)$p['channel']['config_version'],$fingerprint,false);
              }
              echo 'PRICE_MAX_CONFIRM_PREVIEW ',json_encode(array_intersect_key($preview,array_flip(['ok','state','reason','provider_writes','database_writes'])),JSON_THROW_ON_ERROR),PHP_EOL;
            }
          } finally {if ($db->inTransaction()) $db->rollBack();}
          ?>'''
          env=dict(os.environ); env['PRICE_READ_ONLY_BUNDLE']=base64.b64encode(json.dumps(bundle).encode()).decode()
          proc=subprocess.run(['php'],input=php,text=True,capture_output=True,env=env,timeout=75)
          print(proc.stdout,end='',flush=True)
          if proc.returncode!=0:raise RuntimeError('read_only_preview_failed')
          PY
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
