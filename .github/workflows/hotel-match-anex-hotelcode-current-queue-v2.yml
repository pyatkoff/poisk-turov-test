name: MATCH ANEX current hotelCode queue v2
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-hotelcode-current-queue-v2.yml]
permissions: {contents: read}
concurrency:
  group: match-anex-hotelcode-current-queue-1971-v2
  cancel-in-progress: false
env: {OPERATION_ID: hotel-match-anex-hotelcode-current-queue-1971-20260914-v2}
jobs:
  current-queue:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable CURRENT read
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_ssh","database_writes":0,"supplier_calls":0,"public_get_calls":0,"historical_operations_replayed":false,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" >"$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: match-anex-hotelcode-current-queue-v2-reservation
          path: ${{ runner.temp }}/hotel-match-anex-hotelcode-current-queue-1971-20260914-v2/reservation.json
          retention-days: 90
      - name: Read CURRENT DB and build unresolved ANEX evidence queue
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shlex,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          paths=['scripts/diagnostics/hotel_full_catalog_reconcile.php','scripts/diagnostics/hotel_match_current_bulk_review.php','scripts/diagnostics/anex_hotelcode_evidence.php','scripts/diagnostics/anex_hotelcode_current_queue.php']
          texts=[Path(p).read_text(encoding='utf-8') for p in paths]
          def body(t):
            if t.startswith('<?php'): t=t[len('<?php'):]
            return t.replace('declare(strict_types=1);','',1)
          helper=body(texts[0])
          planner=body(texts[1]).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          parser=body(texts[2])
          queue=body(texts[3]).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\nrequire_once __DIR__ . '/anex_hotelcode_evidence.php';\n",'',1)
          queue=queue.replace("const AHQ_OPERATION = 'hotel-match-anex-hotelcode-current-queue-1971-20260911-v1';", "const AHQ_OPERATION = '"+os.environ['OPERATION_ID']+"';")
          wrapper=r'''$root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root'); $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php')); if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper'); require_once $dbHelper; $db=v2_data_db(); $out=ahq_review($db,AHQ_OPERATION); echo fc_json($out),"\n";'''
          code="define('FC_LIBRARY_ONLY',true);\n"+helper+"\n"+planner+"\n"+parser+"\n"+queue+"\n"+wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER'); host=os.environ[req[1]].strip(); user=os.environ[req[2]].strip()
          if not host or not user or not os.environ[req[0]].strip(): raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-anex-current-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
            key=Path(tmp)/'key'; key.write_text(os.environ[req[0]].rstrip()+'\n'); key.chmod(0o600); known=Path(tmp)/'known_hosts'
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
            clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
            p=subprocess.run(cmd,text=True,capture_output=True,timeout=420,env=clean)
          try: result=json.loads(p.stdout)
          except Exception:
            blocker={'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'live_output_unparseable','exit_code':p.returncode,'stderr_tail':p.stderr[-1000:],'database_writes':0,'supplier_calls':0}
            (state/'blocker.json').write_text(json.dumps(blocker,ensure_ascii=False,sort_keys=True)+'\n'); raise
          (state/'queue.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          if p.returncode!=0 or result.get('status')!='completed' or result.get('operation_id')!=os.environ['OPERATION_ID'] or result.get('database_writes')!=0 or result.get('supplier_calls')!=0: raise RuntimeError('current_queue_not_completed')
          raw=(state/'queue.json').read_bytes()
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'queue_sha256':hashlib.sha256(raw).hexdigest(),'counts':result.get('counts'),'coverage':result.get('coverage'),'examined':result.get('examined'),'database_writes':0,'supplier_calls':0,'public_get_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          top=[]
          for s in result.get('seeds',[])[:30]: top.append({'anex_hotel_id':s.get('anex_hotel_id'),'country_id':s.get('country_id'),'observed':s.get('observed'),'search_count':s.get('search_count'),'evidence_bucket':s.get('evidence_bucket'),'source_names':s.get('source_names'),'source_places':s.get('source_places'),'candidate_ids':s.get('candidate_ids'),'review_reason':s.get('review_reason')})
          print(json.dumps({'counts':result.get('counts'),'coverage':result.get('coverage'),'examined':result.get('examined'),'top30':top},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-hotelcode-current-queue-v2-result
          path: ${{ runner.temp }}/hotel-match-anex-hotelcode-current-queue-1971-20260914-v2/
          retention-days: 90
