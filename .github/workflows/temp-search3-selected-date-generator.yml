name: TEMP Search3 selected date generator
on:
  push:
    branches: [ux/search3-selected-date-display-20260912]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-selected-date-display-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix scripts/build/search3-js --ignore-scripts
      - name: Patch controller normalization and focused contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          controller=Path('v2/tour-controller-v4.js'); s=controller.read_text()
          anchor="function operatorName(t){return t&&t.operator&&(t.operator.russianName||t.operator.name)||'';}\n"
          add=anchor+"function tourDateText(v){const raw=String(v||'').trim(),formatter=window.V2Results&&window.V2Results.formatTourDate;if(!raw)return'';if(typeof formatter!=='function')return raw;try{return formatter(raw)||raw;}catch(e){return raw;}}\n"
          if add not in s:
            assert s.count(anchor)==1, 'helper anchor drift'; s=s.replace(anchor,add)
          old="<div><span>Дата</span><b>'+esc(t.date||'—')+'</b></div>"
          new="<div><span>Дата</span><b>'+esc(tourDateText(t.date)||'—')+'</b></div>"
          if new not in s:
            assert s.count(old)==1, 'selected date anchor drift'; s=s.replace(old,new)
          controller.write_text(s)
          new_hash=hashlib.sha256(s.encode()).hexdigest()
          norm=Path('scripts/build/search3-js/shared-source-normalization.cjs'); n=norm.read_text()
          old_hash="sourceSha256: 'd256df8e26f9383ff29fc50f77c083d144678cc6e0e072fd34d07a03bec2fb03'"
          new_hash_line=f"sourceSha256: '{new_hash}'"
          if new_hash_line not in n:
            assert n.count(old_hash)==1, 'normalization hash anchor drift'; n=n.replace(old_hash,new_hash_line)
          norm.write_text(n)
          p=Path('tests/search3-selected-date-display.test.js')
          p.write_text("const assert=require('node:assert/strict');const fs=require('node:fs');const vm=require('node:vm');const source=fs.readFileSync('v2/tour-controller-v4.js','utf8');assert.match(source,/function tourDateText\\(v\\)/);assert.ok(source.includes(\"esc(tourDateText(t.date)||'—')\"));assert.ok(source.includes(\"date:t.date||''\"),'lead payload keeps raw supplier date');assert.ok(!source.includes(\"date:tourDateText(t.date)\"),'display formatter never enters lead payload');const helper=source.match(/function tourDateText\\(v\\)\\{[^}]*\\}catch\\(e\\)\\{return raw;\\}\\}/)[0];const context={window:{V2Results:{formatTourDate:v=>/^2026-09-12/.test(v)?'12.09.2026':v}}};vm.runInNewContext(helper,context);assert.equal(context.tourDateText('2026-09-12'),'12.09.2026');assert.equal(context.tourDateText('2026-09-12T23:30:00+03:00'),'12.09.2026');assert.equal(context.tourDateText('12.09.2026'),'12.09.2026');assert.equal(context.tourDateText('supplier-format'),'supplier-format');context.window.V2Results=null;assert.equal(context.tourDateText('2026-09-12'),'2026-09-12');console.log('SEARCH3_SELECTED_DATE_DISPLAY_OK');\n")
          PY
      - run: node scripts/build/search3-js/shared-runtime.cjs --write
      - run: node scripts/build/search3-js/shared-runtime.cjs --check
      - run: node tests/search3-selected-date-display.test.js
      - name: Commit generated package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/tour-controller-v4.js v2/search3-shared-runtime.json scripts/build/search3-js/shared-source-normalization.cjs tests/search3-selected-date-display.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'SEARCH: normalize selected tour date display [generated selected-date]'
          git push origin HEAD:ux/search3-selected-date-display-20260912
