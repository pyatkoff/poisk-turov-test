name: Validate selected-tour return state

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/selected-tour-return-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-selected-tour-return.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  return-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repeated selection and fallback across breakpoints
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > return-state.cjs <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [375,768,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.setContent(`<select id="sortResults"><option value="price">price</option><option value="rating" selected>rating</option></select><div id="results"><div class="result-card" data-card="one"><button class="direct-tour" data-tid="t1">Выбрать 1</button></div><div class="result-card" data-card="two"><button class="direct-tour" data-tid="t2">Выбрать 2</button></div><div id="comparisonTray" data-state="kept">compare</div></div><section id="selectedTour"><button class="back-results">Вернуться к предложениям</button><button class="lead-success-back">Вернуться после заявки</button></section>`);
              await page.addScriptTag({path:path.resolve('v2/selected-tour-return-v1.js')});
              await page.click('[data-tid="t1"]');
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'t1'}}})));
              await page.click('.back-results');
              await page.waitForTimeout(50);
              let state=await page.evaluate(()=>({hidden:document.getElementById('selectedTour').hidden,aria:document.getElementById('selectedTour').getAttribute('aria-hidden'),sort:document.getElementById('sortResults').value,compare:document.getElementById('comparisonTray').dataset.state,focusTid:document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.tid}));
              if(!state.hidden||state.aria!=='true'||state.sort!=='rating'||state.compare!=='kept'||state.focusTid!=='t1')throw new Error(`initial return failed ${width}: ${JSON.stringify(state)}`);

              await page.click('[data-tid="t2"]');
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'t2'}}})));
              await page.evaluate(()=>{document.querySelector('[data-card="two"]').hidden=true;});
              await page.click('.back-results');
              await page.waitForTimeout(50);
              state=await page.evaluate(()=>({hidden:document.getElementById('selectedTour').hidden,sort:document.getElementById('sortResults').value,compare:document.getElementById('comparisonTray').dataset.state,focusId:document.activeElement&&document.activeElement.id,source:window.V2SelectedTourReturnV1.sourceButton&&window.V2SelectedTourReturnV1.sourceButton.dataset.tid}));
              if(!state.hidden||state.sort!=='rating'||state.compare!=='kept'||state.focusId!=='results'||state.source!=='t2')throw new Error(`hidden-source fallback failed ${width}: ${JSON.stringify(state)}`);

              await page.evaluate(()=>{document.querySelector('[data-card="two"]').hidden=false;});
              await page.click('[data-tid="t1"]');
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'t1'}}})));
              await page.evaluate(()=>{const results=document.getElementById('results');results.innerHTML='<div class="result-card" data-card="one-rerendered"><button class="direct-tour" data-tid="t1">Выбрать 1 после обновления</button></div><div class="result-card" data-card="two-rerendered"><button class="direct-tour" data-tid="t2">Выбрать 2 после обновления</button></div><div id="comparisonTray" data-state="kept">compare</div>';});
              await page.click('.back-results');
              await page.waitForTimeout(50);
              state=await page.evaluate(()=>({hidden:document.getElementById('selectedTour').hidden,focusTid:document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.tid,sourceTid:window.V2SelectedTourReturnV1.sourceTourId,sourceConnected:document.contains(window.V2SelectedTourReturnV1.sourceButton)}));
              if(!state.hidden||state.focusTid!=='t1'||state.sourceTid!=='t1'||!state.sourceConnected)throw new Error(`rerendered-source restore failed ${width}: ${JSON.stringify(state)}`);

              await page.click('[data-tid="t1"]');
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'t1'}}})));
              await page.click('.lead-success-back');
              await page.waitForTimeout(50);
              state=await page.evaluate(()=>({hidden:document.getElementById('selectedTour').hidden,focusTid:document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.tid,source:window.V2SelectedTourReturnV1.sourceButton&&window.V2SelectedTourReturnV1.sourceButton.dataset.tid}));
              if(!state.hidden||state.focusTid!=='t1'||state.source!=='t1')throw new Error(`reselection success-return failed ${width}: ${JSON.stringify(state)}`);
              console.log(`RETURN_STATE_OK width=${width} rerender=${state.focusTid} reselection=${state.focusTid}`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node return-state.cjs
