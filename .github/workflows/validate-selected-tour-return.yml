name: Validate selected-tour return state

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/selected-tour-return-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-selected-tour-return.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  return-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate mobile and desktop return behavior
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > return-state.cjs <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [375,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.setContent(`<select id="sortResults"><option value="price">price</option><option value="rating" selected>rating</option></select><div id="results"><button class="direct-tour" data-tid="t1">Выбрать</button><div id="comparisonTray" data-state="kept">compare</div></div><section id="selectedTour"><button class="back-results">Вернуться к предложениям</button><button class="lead-success-back">Вернуться после заявки</button></section>`);
              await page.addScriptTag({path:path.resolve('v2/selected-tour-return-v1.js')});
              await page.click('.direct-tour');
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'t1'}}})));
              await page.click('.back-results');
              await page.waitForTimeout(50);
              let state=await page.evaluate(()=>({hidden:document.getElementById('selectedTour').hidden,aria:document.getElementById('selectedTour').getAttribute('aria-hidden'),sort:document.getElementById('sortResults').value,compare:document.getElementById('comparisonTray').dataset.state,focused:document.activeElement&&document.activeElement.classList.contains('direct-tour')}));
              if(!state.hidden||state.aria!=='true'||state.sort!=='rating'||state.compare!=='kept'||!state.focused)throw new Error(`back state failed ${width}: ${JSON.stringify(state)}`);
              await page.evaluate(()=>{const root=document.getElementById('selectedTour');root.hidden=false;root.removeAttribute('aria-hidden');});
              await page.click('.lead-success-back');
              await page.waitForTimeout(50);
              state=await page.evaluate(()=>({hidden:document.getElementById('selectedTour').hidden,sort:document.getElementById('sortResults').value,compare:document.getElementById('comparisonTray').dataset.state,focused:document.activeElement&&document.activeElement.classList.contains('direct-tour')}));
              if(!state.hidden||state.sort!=='rating'||state.compare!=='kept'||!state.focused)throw new Error(`success-back state failed ${width}: ${JSON.stringify(state)}`);
              console.log(`RETURN_STATE_OK width=${width} sort=${state.sort} compare=${state.compare} focused=${state.focused}`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node return-state.cjs
