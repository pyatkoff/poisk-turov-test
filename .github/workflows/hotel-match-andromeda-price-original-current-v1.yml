name: MATCH Andromeda catalog all source v9
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-andromeda-price-original-current-v1.yml]
permissions: {contents: read}
env:
  OPERATION_ID: hotel-match-andromeda-catalog-all-source-1971-20260914-v9
jobs:
  inspect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 9
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Inspect deployed catalog method only
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/ssh.sock"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi; chmod 600 "$key"
          ssh -M -S "$sock" -fnNT -o ControlPersist=600 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST"
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' <<'PHP'
          <?php
          require_once __DIR__.'/_preview/search3-anex-candidate/api-andromeda-search3-preview.php';
          $m=new ReflectionMethod('AnyTourAndromedaClient','catalog');
          $lines=file($m->getFileName());
          $src=implode('',array_slice($lines,$m->getStartLine()-1,$m->getEndLine()-$m->getStartLine()+1));
          echo "MATCH_CATALOG_SOURCE_BEGIN\n".$src."\nMATCH_CATALOG_SOURCE_END\n";
          echo 'MATCH_SOURCE_META:'.json_encode(['status'=>'completed','operation_id'=>'hotel-match-andromeda-catalog-all-source-1971-20260914-v9','supplier_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'no_replay'=>true],JSON_UNESCAPED_SLASHES)."\n";
          PHP
          ssh -S "$sock" -O exit "$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"
