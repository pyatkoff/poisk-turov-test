name: MATCH Andromeda client transport introspection v6
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-andromeda-price-original-current-v1.yml]
permissions: {contents: read}
concurrency: {group: match-andromeda-price-original-1971-v6-introspect, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-andromeda-price-original-1971-20260914-v6-introspect
jobs:
  introspect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: {OUT: /tmp/match-andromeda-introspect-v6}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable read-only introspection
        run: |
          set -euo pipefail; mkdir -p "$OUT"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_runtime_read","supplier_calls":0,"database_writes":0,"mapping_writes":0,"tourvisor_calls":0,"booking_calls":0,"lead_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$OUT/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: andromeda-introspect-v6-reserved, path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Build reflection-only program
        run: |
          set -euo pipefail
          cat > "$OUT/program.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const HM_OPERATION='hotel-match-andromeda-price-original-1971-20260914-v6-introspect';
          function hm_visibility(ReflectionMethod $m): string {
              return $m->isPublic() ? 'public' : ($m->isProtected() ? 'protected' : 'private');
          }
          function hm_class(string $name): array {
              if (!class_exists($name, false)) return ['class'=>$name,'exists'=>false];
              $rc=new ReflectionClass($name); $methods=[];
              foreach ($rc->getMethods() as $m) {
                  $params=[];
                  foreach ($m->getParameters() as $p) $params[]=$p->getName();
                  $methods[]=[
                      'name'=>$m->getName(),
                      'visibility'=>hm_visibility($m),
                      'static'=>$m->isStatic(),
                      'parameters'=>$params,
                      'required'=>$m->getNumberOfRequiredParameters(),
                      'declaring_class'=>$m->getDeclaringClass()->getName(),
                      'file'=>basename((string)$m->getFileName()),
                      'start'=>$m->getStartLine(),
                      'end'=>$m->getEndLine(),
                  ];
              }
              usort($methods, static fn($a,$b)=>strcmp($a['name'],$b['name']));
              $props=[];
              foreach ($rc->getProperties() as $p) {
                  $props[]=['name'=>$p->getName(),'visibility'=>$p->isPublic()?'public':($p->isProtected()?'protected':'private'),'static'=>$p->isStatic()];
              }
              usort($props, static fn($a,$b)=>strcmp($a['name'],$b['name']));
              return ['class'=>$name,'exists'=>true,'file'=>basename((string)$rc->getFileName()),'methods'=>$methods,'properties'=>$props];
          }
          try {
              $root=realpath(getcwd());
              if(!$root || basename($root)!=='anytoour.ru') throw new RuntimeException('root');
              $api=$root.'/_preview/search3-anex-candidate/api-andromeda-search3-preview.php';
              if(!is_file($api)) throw new RuntimeException('runtime_missing');
              require_once $api;
              $result=[
                  'status'=>'completed',
                  'operation_id'=>HM_OPERATION,
                  'classes'=>[
                      hm_class('AnyTourAndromedaClient'),
                      hm_class('AnyTourAndromedaTransport'),
                  ],
                  'supplier_calls'=>0,
                  'database_writes'=>0,
                  'mapping_writes'=>0,
                  'tourvisor_calls'=>0,
                  'booking_calls'=>0,
                  'lead_calls'=>0,
                  'no_replay'=>true,
              ];
              echo 'MATCH_INTROSPECT_JSON:'.json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL;
          } catch(Throwable $e) {
              echo 'MATCH_INTROSPECT_JSON:'.json_encode(['status'=>'failed','operation_id'=>HM_OPERATION,'reason'=>preg_replace('/[^A-Za-z0-9_.:-]+/','_',substr($e->getMessage(),0,120))?:'exception','supplier_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'tourvisor_calls'=>0,'booking_calls'=>0,'lead_calls'=>0,'no_replay'=>true],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;
              exit(2);
          }
          PHP
          php -l "$OUT/program.php"
      - name: Inspect deployed runtime without supplier access
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/ssh.sock"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi; chmod 600 "$key"
          ssh -M -S "$sock" -fnNT -o ControlPersist=600 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$OUT/program.php" > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr"
          rc=$?
          set -e; export RC="$rc"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']); raw=pathlib.Path(os.environ['RUNNER_TEMP'],'stdout').read_bytes();
          vals=[x.split('MATCH_INTROSPECT_JSON:',1)[1] for x in raw.decode(errors='replace').splitlines() if x.startswith('MATCH_INTROSPECT_JSON:')]
          x=json.loads(vals[-1]) if len(vals)==1 else {'status':'unknown','reason':'result_marker_missing_or_ambiguous','stdout_sha256':hashlib.sha256(raw).hexdigest(),'supplier_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True}
          x['remote_exit']=int(os.environ['RC']); (d/'result.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(x,ensure_ascii=False))
          if x.get('supplier_calls')!=0 or x.get('database_writes')!=0 or x.get('mapping_writes')!=0: raise SystemExit(3)
          if int(os.environ['RC'])!=0 or x.get('status')!='completed': raise SystemExit(2)
          PY
          ssh -S "$sock" -O exit "$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known" "$RUNNER_TEMP/stdout" "$RUNNER_TEMP/stderr"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: andromeda-introspect-v6-final, path: '${{ env.OUT }}/', retention-days: 90}
