name: MATCH Andromeda all price original canary v7
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-andromeda-price-original-current-v1.yml]
permissions: {contents: read}
concurrency: {group: match-andromeda-price-original-1971-v7-416247, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-andromeda-all-price-original-1971-20260914-v7-416247
jobs:
  canary:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {OUT: /tmp/match-andromeda-v7}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable supplier read
        run: |
          set -euo pipefail; mkdir -p "$OUT"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","target_andromeda_id":416247,"operator":5,"state":"reserved_before_supplier_access","database_writes":0,"mapping_writes":0,"tourvisor_calls":0,"booking_calls":0,"lead_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$OUT/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: andromeda-original-v7-reserved, path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Build exact all to price program
        run: |
          set -euo pipefail
          cat > "$OUT/program.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const HM_OPERATION='hotel-match-andromeda-all-price-original-1971-20260914-v7-416247';
          const HM_TARGET=416247;
          function hm_fail(string $stage,string $reason,array $extra=[]):void{
              echo 'MATCH_ORIGINAL_JSON:'.json_encode(array_merge(['status'=>'failed','stage'=>$stage,'reason'=>$reason,'operation_id'=>HM_OPERATION,'database_writes'=>0,'mapping_writes'=>0,'tourvisor_calls'=>0,'booking_calls'=>0,'lead_calls'=>0,'no_replay'=>true],$extra),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL; exit(2);
          }
          function hm_date(string $v):string{
              $v=trim($v); if($v==='') return '';
              foreach(['d.m.Y','Y-m-d','Ymd','d-m-Y'] as $f){$d=DateTimeImmutable::createFromFormat('!'.$f,$v);if($d instanceof DateTimeImmutable)return $d->format('Ymd');}
              if(preg_match('/^(20\d{2})(\d{2})(\d{2})$/',$v)) return $v;
              return '';
          }
          function hm_selected_value($n):string{
              if(!is_array($n)) return '';
              if(array_key_exists('selected',$n)){
                  $s=$n['selected'];
                  if(is_string($s) && trim($s)!=='' && !in_array(trim($s),['0','1'],true)) return trim($s);
                  if(($s===1||$s==='1'||$s===true)) foreach(['id','value','date','code','name'] as $k) if(isset($n[$k])&&is_scalar($n[$k])&&trim((string)$n[$k])!=='') return trim((string)$n[$k]);
              }
              foreach($n as $v){ if(is_array($v)){ $r=hm_selected_value($v); if($r!=='') return $r; } }
              return '';
          }
          function hm_selected_id($n,int $fallback):int{
              if(!is_array($n)) return $fallback;
              if(array_key_exists('selected',$n) && ($n['selected']===1||$n['selected']==='1'||$n['selected']===true)) foreach(['id','value','code'] as $k) if(isset($n[$k])&&(int)$n[$k]>0)return (int)$n[$k];
              if(isset($n['selected']) && is_scalar($n['selected']) && (int)$n['selected']>1) return (int)$n['selected'];
              foreach($n as $v){if(is_array($v)){ $r=hm_selected_id($v,0); if($r>0)return $r; }}
              return $fallback;
          }
          function hm_collect_rows($n,array &$out):void{
              if(!is_array($n)) return;
              if(isset($n['hotelKey']) || isset($n['operatorKey'])) $out[]=$n;
              foreach($n as $v) if(is_array($v)) hm_collect_rows($v,$out);
          }
          function hm_key_summary($n):array{
              if(!is_array($n)) return [];
              $keys=array_keys($n); sort($keys,SORT_STRING); return array_slice($keys,0,80);
          }
          try{
              $root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru') hm_fail('bootstrap','root');
              $preview=$root.'/_preview/search3-anex-candidate'; $api=$preview.'/api-andromeda-search3-preview.php'; if(!is_file($api)) hm_fail('bootstrap','runtime_missing'); require_once $api;
              $private=$preview.'/.andromeda-private.php'; if(!is_file($private)) hm_fail('bootstrap','private_missing'); $cfg=require $private;
              $budget=dirname((string)$cfg['catalog_path']); $transport=new AnyTourAndromedaTransport(true); $client=new AnyTourAndromedaClient(static function($url,$opts)use($transport,$budget){ anytour_andromeda_search3_budget($budget); return $transport($url,$opts); },true);
              $client->login((string)$cfg['username'],(string)$cfg['password']);
              $allParams=['TOWNFROMINC'=>'1','STATEINC'=>'3','HOTELS'=>(string)HM_TARGET,'OPERATORS'=>'5'];
              $all=$client->catalog('all',$allParams);
              $hotelSelected=false; $hotelName='';
              foreach((array)($all['HOTELS']??[]) as $h){if((int)($h['id']??0)===HM_TARGET){$hotelSelected=((int)($h['selected']??0)===1);$hotelName=(string)($h['name']??'');break;}}
              $rawSelected=hm_selected_value($all['CHECKIN_BEG']??($all['CHECKIN']??[])); $date=hm_date($rawSelected);
              if($date===''){
                  foreach(['CHECKIN_BEG','CHECKIN','DATEBEG','DATE_FROM'] as $k){ if(isset($all[$k])){ $date=hm_date(hm_selected_value($all[$k])); if($date!=='')break; } }
              }
              $currency=hm_selected_id($all['CURRENCY']??[],643);
              if($date==='') hm_fail('all','selected_date_missing',['all_top_keys'=>hm_key_summary($all),'all_selected_hotel'=>$hotelSelected,'all_hotel_name'=>$hotelName,'all_checkin_selected'=>$rawSelected,'provider_calls'=>['login'=>1,'all'=>1]]);
              $probe=AnyTourAndromedaClient::priceProbeParams();
              $priceParams=$probe;
              foreach(['TOWNFROMINC'=>'1','STATEINC'=>'3','HOTELS'=>(string)HM_TARGET,'OPERATORS'=>'5','CHECKIN_BEG'=>$date,'CHECKIN_END'=>$date,'CURRENCYINC'=>(string)$currency,'ADULT'=>'2','CHILD'=>'0','NIGHTS_FROM'=>'7','NIGHTS_TILL'=>'7','PAGE'=>'1'] as $k=>$v) $priceParams[$k]=$v;
              unset($priceParams['NIGHTS_TO']);
              $raw=$client->price($priceParams);
              $rows=[]; hm_collect_rows($raw,$rows); $hits=[]; $mapped=0; $namespace=0; $wrongHotel=0; $wrongOperator=0;
              foreach($rows as $r){
                  if(isset($r['operatorKey']) && (int)$r['operatorKey']!==5){$wrongOperator++;continue;}
                  if(isset($r['hotelKey']) && (int)$r['hotelKey']!==HM_TARGET){$wrongHotel++;continue;}
                  if((int)($r['operatorKey']??0)!==5 || (int)($r['hotelKey']??0)!==HM_TARGET) continue;
                  $provider=is_array($r['provider']??null)?strtolower(trim((string)($r['provider']['name']??''))):'';
                  if($provider==='mappedtour'||!empty($r['mappedOperator'])){$mapped++;continue;}
                  if((int)($r['isOperatorHotelKey']??0)===1){$namespace++;continue;}
                  $orig=is_array($r['original']??null)?$r['original']:[]; $aid=(int)($orig['hotelKey']??0);
                  if($aid<=0) continue;
                  $hits[]=['andromeda_id'=>(int)$r['hotelKey'],'anex_id'=>$aid,'hotel'=>(string)($r['hotel']??''),'town'=>(string)($r['town']??''),'check_in'=>(string)($r['checkIn']??''),'nights'=>(string)($r['nights']??''),'original_keys'=>hm_key_summary($orig)];
              }
              $ids=array_values(array_unique(array_map(static fn($x)=>$x['anex_id'],$hits))); sort($ids,SORT_NUMERIC);
              echo 'MATCH_ORIGINAL_JSON:'.json_encode(['status'=>'completed','operation_id'=>HM_OPERATION,'all_selected_hotel'=>$hotelSelected,'all_hotel_name'=>$hotelName,'all_checkin_selected'=>$rawSelected,'resolved_checkin'=>$date,'currency'=>$currency,'price_param_keys'=>hm_key_summary($priceParams),'pages_count'=>(int)($raw['PAGES_COUNT']??0),'raw_candidate_rows'=>count($rows),'matching_rows'=>count($hits),'original_hotel_keys'=>$ids,'rows'=>array_slice($hits,0,20),'mappedtour_excluded'=>$mapped,'operator_namespace_excluded'=>$namespace,'wrong_hotel_rows'=>$wrongHotel,'wrong_operator_rows'=>$wrongOperator,'provider_calls'=>['login'=>1,'all'=>1,'price'=>1],'database_writes'=>0,'mapping_writes'=>0,'tourvisor_calls'=>0,'booking_calls'=>0,'lead_calls'=>0,'no_replay'=>true],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL;
          }catch(Throwable $e){hm_fail('runtime',preg_replace('/[^A-Za-z0-9_.:-]+/','_',substr($e->getMessage(),0,180))?:'exception');}
          PHP
          php -l "$OUT/program.php"
      - name: Execute exact supplier canary through existing runtime
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/ssh.sock"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi; chmod 600 "$key"
          ssh -M -S "$sock" -fnNT -o ControlPersist=600 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=768M' < "$OUT/program.php" > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr"
          rc=$?
          set -e; export RC="$rc"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']); raw=pathlib.Path(os.environ['RUNNER_TEMP'],'stdout').read_bytes(); vals=[x.split('MATCH_ORIGINAL_JSON:',1)[1] for x in raw.decode(errors='replace').splitlines() if x.startswith('MATCH_ORIGINAL_JSON:')]
          x=json.loads(vals[-1]) if len(vals)==1 else {'status':'unknown','reason':'result_marker_missing_or_ambiguous','stdout_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'no_replay':True}; x['remote_exit']=int(os.environ['RC']); (d/'result.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:x.get(k) for k in ['status','stage','reason','all_selected_hotel','all_hotel_name','all_checkin_selected','resolved_checkin','currency','pages_count','raw_candidate_rows','matching_rows','original_hotel_keys','mappedtour_excluded','operator_namespace_excluded']},ensure_ascii=False))
          if x.get('database_writes')!=0 or x.get('mapping_writes')!=0: raise SystemExit(3)
          if int(os.environ['RC'])!=0 or x.get('status')!='completed': raise SystemExit(2)
          PY
          ssh -S "$sock" -O exit "$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known" "$RUNNER_TEMP/stdout" "$RUNNER_TEMP/stderr"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: andromeda-original-v7-final, path: '${{ env.OUT }}/', retention-days: 90}
