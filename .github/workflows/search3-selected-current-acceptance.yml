name: Search3 selected and lead current acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/search3/acceptance/selected-lead-current.json'
      - 'tests/search3-selected-current-acceptance.cjs'
      - 'v2/tour-controller-v4.js'
      - 'v2/search3-shared-runtime.json'
      - 'scripts/build/search3-js/shared-source-normalization.cjs'
      - 'v2/search3-results-filters-v1.css'
      - 'v2/search3-selected-flow-v2.js'
      - 'src/search3/styles/results-layout.css'
      - 'src/search3/styles/selected-tour.css'
      - 'src/search3/behavior/selected-flow-v2.js'
      - 'src/search3/behavior/selected-runtime.js'
      - '.github/workflows/search3-selected-current-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PREVIEW_BASE: /_preview/search3-site-candidate

jobs:
  selected-lead-current:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned Search3 build tools
        shell: bash
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund

      - name: Regenerate canonical shared runtime candidate
        run: node scripts/build/search3-js/shared-runtime.cjs --write

      - name: Retain canonical shared runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: search3-selected-shared-runtime-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: v2/search3-shared-runtime.json
          if-no-files-found: error
          retention-days: 3

      - name: Stage exact candidate as unreferenced Git blob
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 v2/search3-shared-runtime.json)"
          blob_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
          printf 'SEARCH3_SHARED_RUNTIME_BLOB_SHA=%s\n' "$blob_sha"
          printf 'Canonical candidate blob: `%s`\n' "$blob_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Require committed shared runtime parity
        run: git diff --exit-code -- v2/search3-shared-runtime.json

      - name: Verify exact source and Search3 generated parity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check
          python3 -B scripts/build/search3_assets.py --check
          node --check tests/search3-selected-current-acceptance.cjs
          php tests/search3-shared-runtime-smoke.php
          php tests/search-handoff-smoke.php

      - name: Install pinned browser tooling
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/search3-selected-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-selected-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Build isolated local preview payload
        shell: bash
        run: |
          set -euo pipefail
          docroot="$RUNNER_TEMP/search3-selected-docroot"
          target="$docroot$PREVIEW_BASE"
          mkdir -p "$target"
          rsync -a \
            --exclude='*.md' \
            --exclude='_preview/' \
            --exclude='api.php' \
            --exclude='api-v2.php' \
            --exclude='lead-adapter.php' \
            --exclude='lead-adapter-v2.php' \
            --exclude='lead-bridge-v1.php' \
            --exclude='lead-receiver-v1.php' \
            --exclude='lead-price-v1.php' \
            --exclude='lead-idempotency-v1.php' \
            v2/ "$target/"
          cp "$target/index.php" "$target/search-page-v2.php"
          cp "$target/home-entry-v1.php" "$target/index.php"
          python3 -B scripts/build/search3_site_preview_isolation.py "$target"
          printf '%s\n' '<?php define("METRIKA_COUNTER_ID",0);' > "$target/config.php"
          test -f "$target/poisk-turov/index.php"
          test ! -e "$target/api-v2.php"
          test ! -e "$target/lead-adapter-v2.php"
          find "$target" -type f -name '*.php' -print0 | xargs -0 -r -n 1 -P 2 php -l >/dev/null
          find "$target" -type f -name '*.js' -print0 | xargs -0 -r -n 1 -P 2 node --check >/dev/null

      - name: Verify current selected tour and lead handoff
        shell: bash
        env:
          SEARCH3_SELECTED_ACCEPTANCE_BASE: http://127.0.0.1:8099/_preview/search3-site-candidate
          SEARCH3_SELECTED_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/search3-selected-current
          SEARCH3_SELECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/search3-selected-tools/node_modules"
          cat > "$RUNNER_TEMP/search3-selected-router.php" <<'PHP'
          <?php
          $entry = '/_preview/search3-site-candidate/poisk-turov/';
          if (parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) !== $entry) return false;
          $_SERVER['HTTP_HOST'] = 'anytoour.ru';
          $_SERVER['SCRIPT_NAME'] = $entry . 'index.php';
          require $_SERVER['DOCUMENT_ROOT'] . $_SERVER['SCRIPT_NAME'];
          PHP
          php -S 127.0.0.1:8099 -t "$RUNNER_TEMP/search3-selected-docroot" "$RUNNER_TEMP/search3-selected-router.php" >"$RUNNER_TEMP/search3-selected-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS "$SEARCH3_SELECTED_ACCEPTANCE_BASE/poisk-turov/" -o /dev/null && break; sleep 0.25; done
          GITHUB_SHA="$SEARCH3_SELECTED_SOURCE_SHA" node tests/search3-selected-current-acceptance.cjs

      - name: Retain exact selected and lead evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-selected-current-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/search3-selected-current/
          if-no-files-found: warn
          retention-days: 30
