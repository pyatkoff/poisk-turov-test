name: INT Tourvisor first AnyTour snapshot

on:
  push:
    branches:
      - 'ops/int-tourvisor-first-snapshot-20260917-v1'
    paths:
      - 'scripts/ops/int_tourvisor_first_snapshot_seed.php'
      - '.github/workflows/int-tourvisor-first-snapshot-seed.yml'

permissions:
  contents: read

concurrency:
  group: int-tourvisor-first-snapshot-20260917-v1
  cancel-in-progress: false

jobs:
  seed:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_SHA: c0c849ddbe6482cf908bed8766d2344c6febe9e8
      OPERATION_ID: int-tourvisor-first-snapshot-20260917-v1
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false

      - name: Bind exact one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/int-tourvisor-first-snapshot-seed.yml'
          test "${changed[1]}" = 'scripts/ops/int_tourvisor_first_snapshot_seed.php'
          php -l scripts/ops/int_tourvisor_first_snapshot_seed.php >/dev/null
          php -l app/integrations/tourvisor-anytour-offer-autosave.php >/dev/null
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY"
          test -n "$ANYTOOUR_DEPLOY_HOST"
          test -n "$ANYTOOUR_DEPLOY_USER"
          echo "FIRST_SNAPSHOT_SOURCE_BOUND head=$(git rev-parse HEAD) base=$BASE_SHA"

      - name: Prepare SSH key and exact temporary runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

          stage="$RUNNER_TEMP/first-snapshot-runtime"
          mkdir -p "$stage/app" "$stage/v2" "$stage/scripts/ops"
          cp -a app/integrations "$stage/app/"
          cp -a v2/data "$stage/v2/"
          cp scripts/ops/int_tourvisor_first_snapshot_seed.php "$stage/scripts/ops/"
          tar -C "$stage" -czf "$RUNNER_TEMP/first-snapshot-runtime.tar.gz" .
          sha256sum "$RUNNER_TEMP/first-snapshot-runtime.tar.gz"

      - name: Execute exactly one live seed operation
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          opts=(-T -i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          scp_opts=(-i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"
          scp "${scp_opts[@]}" "$RUNNER_TEMP/first-snapshot-runtime.tar.gz" "$remote:$archive"

          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" <<'REMOTE'
          set -euo pipefail
          operation="$1"
          archive="$2"
          site="$HOME/www/anytoour.ru"
          ledger="$HOME/.anytour-ops/$operation"
          test -d "$site"
          test -s "$site/config.php"
          test ! -e "$ledger"
          mkdir -p "$HOME/.anytour-ops"
          mkdir -m 700 "$ledger"
          printf '%s\n' 'reserved' > "$ledger/state"
          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"
          cleanup(){ rm -rf "$work"; rm -f "$archive"; }
          trap cleanup EXIT
          tar -C "$work" -xzf "$archive"
          php -l "$work/scripts/ops/int_tourvisor_first_snapshot_seed.php" >/dev/null
          set +e
          php "$work/scripts/ops/int_tourvisor_first_snapshot_seed.php" "$site" > "$ledger/receipt.json" 2> "$ledger/error.log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' 'failed_terminal_no_replay' > "$ledger/state"
            printf '{"status":"failed_terminal_no_replay","operation":"%s","exit_code":%s}\n' "$operation" "$rc"
            exit "$rc"
          fi
          php -r '$x=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR);if(($x["status"]??null)!=="completed"||($x["readback"]["offers"]??0)<1||($x["readback"]["ready"]??0)<1)exit(2);' "$ledger/receipt.json"
          printf '%s\n' 'completed' > "$ledger/state"
          cat "$ledger/receipt.json"
          REMOTE

          ssh "${opts[@]}" "$remote" "cat \"\$HOME/.anytour-ops/$OPERATION_ID/receipt.json\"" > "$RUNNER_TEMP/receipt.json"
          jq -e '.status == "completed" and .provider == "tourvisor" and (.readback.offers > 0) and (.readback.ready > 0) and (.booking_calls == 0) and (.lead_calls == 0) and (.mapping_writes == 0) and (.production_webroot_writes == 0)' "$RUNNER_TEMP/receipt.json" >/dev/null
          cat "$RUNNER_TEMP/receipt.json"

      - name: Preserve sanitized first-snapshot receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-tourvisor-first-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
