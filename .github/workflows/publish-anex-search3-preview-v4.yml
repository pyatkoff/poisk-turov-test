name: Publish checked ANEX Search3 preview v4 and bounded Andromeda page2 canary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-anex-search3-preview-v4.yml'
      - 'scripts/diagnostics/anex_search3_preview_owner_gate_v4.py'
      - 'tests/anex_search3_preview_owner_control_v4_test.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && github.event.issue.number == 2530 && 'publish-anex-search3-preview-2530-v4' || format('check-anex-search3-preview-v4-control-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 8ccf1174c1277e6128258de33d403b52faddf7e2
  SOURCE_TREE: 9859b0044769a9660c03f6cd98d6805d1f771981
  SOURCE_BRANCH: feature/anex-search-adapter-20260907
  FIX_SHA: df839684e66ed0a00734d1d6c555e4d6941b4c3a
  FIX_RUN: '35262444268'
  ENDPOINT_BLOB: df3b835fc8497dda4404b1e1301fb4f884336563
  OPERATION_ID: publish-anex-search3-preview-2530-v4-page2-checkpoint
  CANARY_OPERATION: andromeda-page2-canary-2530-v4-country4-2026-10-20-2a-7n
  EXPECTED_ROUTE: /_preview/search3-anex-candidate/
  OWNER_COMMAND: /publish-anex-search3-preview-2530-v4

jobs:
  control-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bounded v4 owner-control contract
        run: |
          set -euo pipefail
          python3 -B tests/anex_search3_preview_owner_control_v4_test.py
          python3 -m py_compile scripts/diagnostics/anex_search3_preview_owner_gate_v4.py

  authorize:
    needs: control-contract
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.allow.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact fresh owner command
        id: allow
        run: |
          set -euo pipefail
          python3 -B scripts/diagnostics/anex_search3_preview_owner_gate_v4.py
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
      - name: Verify unique owner command and exact merged INT fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          source=os.environ['SOURCE_SHA']; branch=os.environ['SOURCE_BRANCH']; fix=os.environ['FIX_SHA']
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req, timeout=20) as r: return json.load(r)
          if get('/branches/main')['commit']['sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('main_drift')
          if get('/branches/'+urllib.parse.quote(branch,safe=''))['commit']['sha'] != source:
              raise SystemExit('int_branch_drift')
          commit=get('/git/commits/'+source)
          if commit['tree']['sha'] != os.environ['SOURCE_TREE']:
              raise SystemExit('source_tree_drift')
          if fix not in [p['sha'] for p in commit.get('parents',[])]:
              raise SystemExit('fix_not_merged_parent')
          pr=get('/pulls/2816')
          if not pr.get('merged') or pr.get('merge_commit_sha') != source or pr.get('head',{}).get('sha') != fix:
              raise SystemExit('fix_pr_provenance_mismatch')
          run=get('/actions/runs/'+os.environ['FIX_RUN'])
          if run.get('head_sha') != fix or run.get('status') != 'completed' or run.get('conclusion') != 'success' or run.get('run_attempt') != 1:
              raise SystemExit('fix_run_not_green')
          endpoint=get('/contents/v2/api-andromeda-search3-preview.php?ref='+source)
          if endpoint.get('sha') != os.environ['ENDPOINT_BLOB']:
              raise SystemExit('endpoint_blob_mismatch')
          event=json.load(open(os.environ['GITHUB_EVENT_PATH'],encoding='utf-8'))
          trigger_id=event.get('comment',{}).get('id')
          matches=[]; page=1
          while True:
              rows=get('/issues/2530/comments?per_page=100&page='+str(page))
              if not rows: break
              matches.extend(c for c in rows if c.get('body')==os.environ['OWNER_COMMAND'] and c.get('user',{}).get('id')==226193297)
              if len(rows)<100: break
              page+=1
              if page>30: raise SystemExit('comment_scan_limit')
          if len(matches)!=1 or matches[0].get('id')!=trigger_id:
              raise SystemExit('duplicate_or_stale_owner_command')
          print('ANEX_PREVIEW_V4_SOURCE_FIX_AND_COMMAND_PINS_OK')
          PY

  publish:
    needs: authorize
    if: github.event_name == 'issue_comment' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Recheck exact source and confined publisher contract
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          cd candidate
          python3 -B tests/anex_search3_preview_deploy_test.py
          python3 -B tests/anex_search3_preview_safe_deploy_test.py
          python3 -B tests/andromeda-page-session-checkpoint-test.py
          php -l v2/api-anex-search3-preview.php
          php -l v2/api-andromeda-search3-preview.php
          php -l app/integrations/andromeda-anytour-offer-autosave.php
          php -l app/integrations/three-provider-money-facts.php
          php tests/andromeda-anytour-offer-autosave-test.php
          php tests/three-provider-money-facts-test.php
          php tests/three-provider-final-price-readiness-test.php
          test "$(git hash-object v2/api-andromeda-search3-preview.php)" = "$ENDPOINT_BLOB"
          grep -F 'target="$project/_preview/search3-anex-candidate"' scripts/diagnostics/anex_search3_preview_deploy.py >/dev/null
          ! grep -F 'target="$project/_preview/search3-site-candidate"' scripts/diagnostics/anex_search3_preview_deploy.py
          grep -F 'production_entry_changes": False' scripts/diagnostics/anex_search3_preview_deploy.py >/dev/null
          grep -F '.andromeda-private.php' scripts/diagnostics/anex_review_owner_preserve.php >/dev/null
      - name: Require existing ANEX credentials without revealing them
        env:
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          api=os.environ.get('ANEX_API_TOKEN',''); b2b=os.environ.get('ANEX_B2B_TOKEN','')
          if not api.strip() or len(api)>16384 or '\x00' in api: raise SystemExit('anex_api_secret_missing_or_invalid')
          if not b2b or len(b2b)>16384 or b2b.lower().startswith('bearer ') or re.search(r'[\x00-\x20\x7f]',b2b):
              raise SystemExit('anex_b2b_secret_missing_or_invalid')
          print('ANEX_V4_SECRETS_READY')
          PY
      - name: Prepare private SSH transport
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/anex-preview-v4-control"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/anex-preview-v4-control/key"
          chmod 600 "$RUNNER_TEMP/anex-preview-v4-control/key"
          ssh-keygen -y -f "$RUNNER_TEMP/anex-preview-v4-control/key" >/dev/null
      - name: Reserve v4 publication exactly once before server mutation
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,shlex,subprocess
          source=os.environ['SOURCE_SHA']; control=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; op=os.environ['OPERATION_ID']
          if not re.fullmatch(r'[0-9a-f]{40}',source) or not re.fullmatch(r'[0-9a-f]{40}',control) or not run.isdigit() or not re.fullmatch(r'[a-z0-9-]+',op):
              raise SystemExit('invalid_reservation_input')
          value=json.dumps({'state':'reserved','operation_id':op,'source_sha':source,'control_sha':control,'run_id':int(run),'replay_allowed':False},separators=(',',':'))+'\n'
          remote='''set -eu
          private="$HOME/.anytoour-anex"
          test -d "$private" && test ! -L "$private"
          op="$private/''' + op + '''"
          mkdir "$op"
          chmod 700 "$op"
          cat > "$op/reservation.json"
          chmod 600 "$op/reservation.json"
          printf '%s\\n' ANEX_PREVIEW_V4_PUBLICATION_RESERVED
          '''
          root=os.environ['RUNNER_TEMP']+'/anex-preview-v4-control'
          cmd=['ssh','-T','-i',root+'/key','-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+root+'/known_hosts','-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'bash -c '+shlex.quote(remote)]
          r=subprocess.run(cmd,input=value,text=True,capture_output=True,timeout=45)
          if r.returncode or r.stdout!='ANEX_PREVIEW_V4_PUBLICATION_RESERVED\n': raise SystemExit('publication_reservation_failed_or_replayed')
          print(r.stdout.strip())
          PY
      - name: Publish exact current INT source to isolated ANEX preview
        env:
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog-v4
        run: |
          set -euo pipefail
          mkdir -p "$ANEX_CATALOG_ARTIFACT_DIR"
          python3 -B candidate/scripts/diagnostics/anex_search3_preview_deploy_safe.py | tee "$ANEX_CATALOG_ARTIFACT_DIR/publisher-stdout.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR'])/'anex-search3-preview-deploy.json'
          value=json.loads(p.read_text())
          assert value['status']=='deployed'
          assert value['source_sha']==os.environ['SOURCE_SHA']
          assert value['route']==os.environ['EXPECTED_ROUTE']
          assert value['production_entry_changes'] is False
          print('ANEX_PREVIEW_V4_DEPLOY_RECEIPT_OK')
          PY
      - name: Read back exact runtime hashes and endpoint blob
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,os,shlex,subprocess
          from pathlib import Path
          files=[
            ('app/integrations/andromeda-anytour-offer-autosave.php','app/integrations/andromeda-anytour-offer-autosave.php'),
            ('app/integrations/three-provider-money-facts.php','app/integrations/three-provider-money-facts.php'),
            ('v2/api-andromeda-search3-preview.php','api-andromeda-search3-preview.php'),
          ]
          expected={remote:hashlib.sha256((Path('candidate')/local).read_bytes()).hexdigest() for local,remote in files}
          remote='''set -eu
          target="$HOME/www/anytoour.ru/_preview/search3-anex-candidate"
          test -d "$target" && test ! -L "$target"
          for f in app/integrations/andromeda-anytour-offer-autosave.php app/integrations/three-provider-money-facts.php api-andromeda-search3-preview.php; do
            test -f "$target/$f" && test ! -L "$target/$f"
            sha256sum "$target/$f"
          done
          '''
          root=os.environ['RUNNER_TEMP']+'/anex-preview-v4-control'
          cmd=['ssh','-T','-i',root+'/key','-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+root+'/known_hosts','-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'bash -c '+shlex.quote(remote)]
          r=subprocess.run(cmd,text=True,capture_output=True,timeout=45)
          if r.returncode: raise SystemExit('runtime_readback_failed')
          lines=r.stdout.splitlines()
          if len(lines)!=3: raise SystemExit('runtime_readback_count')
          for line in lines:
              digest,path=line.split(None,1); rel=path.split('search3-anex-candidate/',1)[-1] if 'search3-anex-candidate/' in path else path.split('/')[-1]
              if rel not in expected or digest!=expected[rel]: raise SystemExit('runtime_hash_mismatch:'+rel)
          print('ANEX_PREVIEW_V4_RUNTIME_HASHES_OK')
          PY
      - name: Verify Andromeda endpoint loads without supplier call
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/andromeda-get-v4.json"
          code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' 'https://anytoour.ru/_preview/search3-anex-candidate/api-andromeda-search3-preview.php')"
          test "$code" = 405
          python3 - "$body" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          if value!={'ok':False,'error':'method_not_allowed'}: raise SystemExit('andromeda_get_contract_mismatch')
          print('ANDROMEDA_PREVIEW_V4_GET_405_OK')
          PY
      - name: Mark publication reservation completed
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anex-catalog-v4"
          python3 - <<'PY'
          import json,os,shlex,subprocess
          source=os.environ['SOURCE_SHA']; control=os.environ['GITHUB_SHA']; run=os.environ['GITHUB_RUN_ID']; op=os.environ['OPERATION_ID']
          value=json.dumps({'state':'completed','operation_id':op,'source_sha':source,'control_sha':control,'run_id':int(run),'replay_allowed':False},separators=(',',':'))+'\n'
          remote='''set -eu
          op="$HOME/.anytoour-anex/''' + op + '''"
          test -d "$op" && test ! -L "$op" && test -f "$op/reservation.json"
          test ! -e "$op/completed.json"
          cat > "$op/completed.json"
          chmod 600 "$op/completed.json"
          printf '%s\\n' ANEX_PREVIEW_V4_PUBLICATION_COMPLETED
          '''
          root=os.environ['RUNNER_TEMP']+'/anex-preview-v4-control'
          cmd=['ssh','-T','-i',root+'/key','-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+root+'/known_hosts','-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'bash -c '+shlex.quote(remote)]
          r=subprocess.run(cmd,input=value,text=True,capture_output=True,timeout=45)
          if r.returncode or r.stdout!='ANEX_PREVIEW_V4_PUBLICATION_COMPLETED\n': raise SystemExit('publication_completion_failed')
          out=os.path.join(os.environ['RUNNER_TEMP'],'anex-catalog-v4','v4-publication-control.json')
          open(out,'w',encoding='utf-8').write(value)
          print(r.stdout.strip())
          PY
      - name: Upload sanitized publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-search3-preview-v4-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/anex-catalog-v4/
          if-no-files-found: error
          retention-days: 14

  page2-canary:
    needs: [authorize, publish]
    if: github.event_name == 'issue_comment' && needs.authorize.outputs.allowed == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare private SSH transport
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/andromeda-page2-v4"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/andromeda-page2-v4/key"
          chmod 600 "$RUNNER_TEMP/andromeda-page2-v4/key"
          ssh-keygen -y -f "$RUNNER_TEMP/andromeda-page2-v4/key" >/dev/null
      - name: Run exactly one page1 to page2 canary under read-only DB transaction
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/andromeda-page2-v4/result.json"
          err="$RUNNER_TEMP/andromeda-page2-v4/stderr.txt"
          root="$RUNNER_TEMP/andromeda-page2-v4"
          set +e
          ssh -T -i "$root/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$root/known_hosts" -o ConnectTimeout=15 -o LogLevel=ERROR \
            -l "$ANYTOOUR_DEPLOY_USER" "$ANYTOOUR_DEPLOY_HOST" 'cd "$HOME/www/anytoour.ru" && php' >"$out" 2>"$err" <<'PHP'
          <?php
          declare(strict_types=1);
          error_reporting(0);ini_set('display_errors','0');ini_set('log_errors','0');
          $operation='andromeda-page2-canary-2530-v4-country4-2026-10-20-2a-7n';
          $expectedBlob='df3b835fc8497dda4404b1e1301fb4f884336563';
          $result=['status'=>'blocked','operation'=>$operation,'page_calls'=>0,'max_page'=>0,'database_writes'=>0,'get_flights_calls'=>0,'quote_calls'=>0,'booking_calls'=>0,'replay_allowed'=>false];
          $exit=1;$pdo=null;$readOnly=false;$lock=null;$dir=null;
          function v4durable(string $path,array $value):void{
              $body=json_encode($value,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
              if(strlen($body)>65536)throw new RuntimeException('result_too_large');
              $f=fopen($path,'x');if(!$f)throw new RuntimeException('checkpoint_exists');
              try{if(fwrite($f,$body)!==strlen($body)||!fflush($f))throw new RuntimeException('checkpoint_write');if(function_exists('fsync')&&!fsync($f))throw new RuntimeException('checkpoint_sync');}finally{fclose($f);}
          }
          function v4reason(Throwable $e):string{$m=$e->getMessage();return is_string($m)&&preg_match('/^[A-Za-z0-9_.:-]{1,96}$/D',$m)?$m:'operation_unconfirmed';}
          try{
              $root=realpath(getcwd());if(PHP_SAPI!=='cli'||!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('project_invalid');
              $target=$root.'/_preview/search3-anex-candidate';$private=dirname($root,2).'/.anytoour-andromeda';
              if(!is_dir($target)||is_link($target)||!is_dir($private)||is_link($private))throw new RuntimeException('runtime_missing');
              $endpoint=$target.'/api-andromeda-search3-preview.php';if(!is_file($endpoint)||is_link($endpoint))throw new RuntimeException('endpoint_missing');
              $bytes=file_get_contents($endpoint);$blob=sha1('blob '.strlen($bytes)."\0".$bytes);if($blob!==$expectedBlob)throw new RuntimeException('endpoint_blob_mismatch');
              $lockPath=$private.'/grouped-search-update.lock';if(!is_file($lockPath)||is_link($lockPath))throw new RuntimeException('publication_lock_missing');
              $lock=fopen($lockPath,'r+b');if(!$lock||!flock($lock,LOCK_SH|LOCK_NB))throw new RuntimeException('publication_busy');
              $dir=$private.'/'.$operation;if(file_exists($dir)||is_link($dir))throw new RuntimeException('operation_exists_no_replay');
              if(!mkdir($dir,0700))throw new RuntimeException('reservation_failed');
              v4durable($dir.'/reservation.json',['operation'=>$operation,'source_sha'=>'8ccf1174c1277e6128258de33d403b52faddf7e2','endpoint_blob'=>$expectedBlob,'created_at'=>time(),'replay_allowed'=>false]);
              require_once $endpoint;
              $configPath=$target.'/.andromeda-private.php';if(!is_file($configPath)||is_link($configPath))throw new RuntimeException('private_runtime_missing');
              $config=require $configPath;if(!is_array($config)||($config['enabled']??null)!==true)throw new RuntimeException('private_runtime_missing');
              $dbPath=$root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');if(!is_file($dbPath)||is_link($dbPath))throw new RuntimeException('db_runtime_missing');
              require_once $dbPath;$pdo=v2_data_db();$pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$pdo->exec('START TRANSACTION READ ONLY');$readOnly=true;
              $before=(int)$pdo->query("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda'")->fetchColumn();
              $request=['generation'=>25301020,'page'=>1,'params'=>['countryId'=>'4','departureId'=>'1','dateFrom'=>'2026-10-20','dateTo'=>'2026-10-20','nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'childs'=>[],'meal'=>'','hotelCategory'=>'','hotelIds'=>[],'regionIds'=>[],'subregionIds'=>[],'operatorIds'=>[],'currency'=>'RUB']];
              $saved=anytour_andromeda_search3_catalog($config,$request);$saved['excluded_operator_ids']=$config['excluded_operator_ids']??[];
              $session=substr(hash('sha256',$operation),0,48);
              $page1=anytour_andromeda_search3_run($request,$pdo,$saved,$config,$session);$result['page_calls']=1;$result['max_page']=1;
              $pages=(int)($page1['pages_count']??0);$result['page1_pages_count']=$pages;$result['page1_received_offers']=(int)($page1['received_offers']??0);$result['page1_mapped_offers']=(int)($page1['mapped_offers']??0);
              $ref=$page1['search_ref']??null;if(!is_string($ref)||!preg_match('/^[a-f0-9]{64}$/D',$ref))throw new RuntimeException('page1_search_ref_invalid');
              if(($page1['page']??null)!==1||$pages<2)throw new RuntimeException('page2_not_advertised');
              $request['page']=2;
              $page2=anytour_andromeda_search3_run($request,$pdo,$saved,$config,$session);$result['page_calls']=2;$result['max_page']=2;
              if(($page2['page']??null)!==2||($page2['search_ref']??null)!==$ref)throw new RuntimeException('page2_context_mismatch');
              $result['page2_pages_count']=(int)($page2['pages_count']??0);$result['page2_received_offers']=(int)($page2['received_offers']??0);$result['page2_mapped_offers']=(int)($page2['mapped_offers']??0);
