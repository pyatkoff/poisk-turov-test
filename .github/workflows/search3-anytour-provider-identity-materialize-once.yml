name: Search3 AnyTour provider identity materialize once

on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-anytour-provider-identity-materialize-once.yml'
  push:
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-anytour-provider-identity-materialize-once.yml'

permissions:
  contents: read

concurrency:
  group: search3-local-andromeda-identity-materialize
  cancel-in-progress: false

env:
  EXPECTED_BEFORE_SHA: 80c39a1fbb697d5267792c005bfaf1d8bbf6b33d

jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate bounded exact-plan apply
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/catalog/anytour_provider_identity_materialize.php
          php -l v2/data/anytour-provider-identity-bridge-v1.php
          grep -Fq '80c39a1fbb697d5267792c005bfaf1d8bbf6b33d' .github/workflows/search3-anytour-provider-identity-materialize-once.yml
          grep -Fq 'ORDER BY supplier_namespace,external_hotel_id' scripts/catalog/anytour_provider_identity_materialize.php
          ! grep -Fq 'ORDER BY supplier_namespace,external_hotel_id,id' scripts/catalog/anytour_provider_identity_materialize.php
          grep -Fq -- '--expected-plan-sha=' .github/workflows/search3-anytour-provider-identity-materialize-once.yml

  operate:
    if: >-
      github.event_name == 'push' &&
      github.event.before == '80c39a1fbb697d5267792c005bfaf1d8bbf6b33d' &&
      github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REMOTE_TMP: /tmp/anytour-provider-identity-apply-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Pin exact release transition
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/search3-production-ready-v1'
          test '${{ github.event.before }}' = "$EXPECTED_BEFORE_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          git rev-parse HEAD | grep -Fx "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BEFORE_SHA"

      - name: Prepare ephemeral SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *'PRIVATE KEY'* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Stage temporary operation files only
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          ssh "${opts[@]}" "$remote" "umask 077; mkdir '$REMOTE_TMP'; test -s \"\$HOME/www/anytoour.ru/config.php\"; test -s \"\$HOME/www/anytoour.ru/data/db-v1.php\""
          scp "${opts[@]}" scripts/catalog/anytour_provider_identity_materialize.php "$remote:$REMOTE_TMP/materialize.php"
          scp "${opts[@]}" v2/data/anytour-provider-identity-bridge-v1.php "$remote:$REMOTE_TMP/bridge.php"

      - name: Read current exact plan
        id: plan
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          ssh "${opts[@]}" "$remote" "bash -s -- '$REMOTE_TMP' '$GITHUB_SHA'" <<'REMOTE' | tee provider-identity-plan.json
          set -euo pipefail
          tmp="$1"; release_sha="$2"; root="$HOME/www/anytoour.ru"
          ANYTOUR_SITE_ROOT="$root" \
          ANYTOUR_PROVIDER_BRIDGE_FILE="$tmp/bridge.php" \
          ANYTOUR_OPERATION_RELEASE_SHA="$release_sha" \
            php "$tmp/materialize.php" --mode=plan "--release-sha=$release_sha"
          REMOTE
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lines=[x.strip() for x in open('provider-identity-plan.json') if x.strip().startswith('{')]
          if len(lines)!=1: raise SystemExit('plan receipt shape mismatch')
          r=json.loads(lines[0])
          for k in ('mapping_writes','supplier_calls','profile_writes','legacy_source_writes','site_file_writes'):
              if r.get(k)!=0: raise SystemExit('plan ownership mismatch')
          if r.get('apply_blocked') is not False or r.get('direct_conflicts')!=0:
              raise SystemExit('direct provider identity conflict; apply withheld')
          if r.get('ambiguous_accepted_refs')!=0:
              raise SystemExit('ambiguous accepted provider identity; apply withheld')
          h=r.get('plan_sha256','')
          if len(h)!=64: raise SystemExit('plan hash missing')
          print('plan_sha='+h)
          print('resolvable='+str(r.get('resolvable_refs',0)))
          print('unresolved='+str(r.get('unresolved_refs',0)))
          print('direct_exact_before='+str(r.get('direct_exact_before',0)))
          PY

      - name: Apply the exact just-read plan
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          PLAN_SHA: ${{ steps.plan.outputs.plan_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLAN_SHA" =~ ^[a-f0-9]{64}$ ]]
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          ssh "${opts[@]}" "$remote" "bash -s -- '$REMOTE_TMP' '$GITHUB_SHA' '$PLAN_SHA'" <<'REMOTE' | tee provider-identity-apply.json
          set -euo pipefail
          tmp="$1"; release_sha="$2"; plan_sha="$3"; root="$HOME/www/anytoour.ru"
          ANYTOUR_SITE_ROOT="$root" \
          ANYTOUR_PROVIDER_BRIDGE_FILE="$tmp/bridge.php" \
          ANYTOUR_OPERATION_RELEASE_SHA="$release_sha" \
            php "$tmp/materialize.php" --mode=apply "--release-sha=$release_sha" "--expected-plan-sha=$plan_sha"
          REMOTE
          python3 - <<'PY'
          import json
          lines=[x.strip() for x in open('provider-identity-apply.json') if x.strip().startswith('{')]
          if len(lines)!=1: raise SystemExit('apply receipt shape mismatch')
          r=json.loads(lines[0])
          for k in ('mapping_writes','supplier_calls','profile_writes','legacy_source_writes','site_file_writes'):
              if r.get(k)!=0: raise SystemExit('apply ownership mismatch')
          if r.get('source_stable') is not True or r.get('direct_conflicts_after')!=0:
              raise SystemExit('post-apply verification mismatch')
          if r.get('materialized')!=r.get('verified') or r.get('requested')!=r.get('materialized'):
              raise SystemExit('materialized/readback mismatch')
          print('APPLY_RECEIPT=' + json.dumps(r,separators=(',',':'),sort_keys=True))
          PY
          {
            echo '### AnyTour direct Andromeda identity materialization'
            echo 'Plan:'; echo '```json'; cat provider-identity-plan.json; echo '```'
            echo 'Apply:'; echo '```json'; cat provider-identity-apply.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary remote operation files
        if: always()
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -u
          key="$RUNNER_TEMP/anytoour_key"
          if [[ -s "$key" && -n "${HOST_VALUE:-}" && -n "${USER_VALUE:-}" ]]; then
            opts=(-i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
            ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" "rm -rf '$REMOTE_TMP'" || true
          fi
