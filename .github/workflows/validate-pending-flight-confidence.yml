name: Validate pending flight price confidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/price-confidence-v1.js'
      - 'v2/unpriced-flight-price-reset-v1.js'
      - '.github/workflows/validate-pending-flight-confidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending-flight-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit pending price label source contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');
          const src=fs.readFileSync('v2/unpriced-flight-price-reset-v1.js','utf8');
          if(!src.includes("label.textContent='Цена уточняется'")) throw new Error('pending price label missing');
          if(!src.includes('clarifyPendingLabels();')) throw new Error('pending label normalization not invoked on flight-selected');
          if(!src.includes("/[0-9]/.test(text)")) throw new Error('priced variants are not protected');
          console.log('PENDING_FLIGHT_LABEL_OK');
          JS
      - name: Verify base, priced and pending selected-flight confidence states
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > pending-confidence.cjs <<'JS'
          const {chromium}=require('playwright'); const path=require('path');
          (async()=>{const browser=await chromium.launch({headless:true});
          for(const width of [375,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900}});
            await page.setContent(`<section id="selectedTour"><div class="selected-head"><div class="selected-price"><small>Стоимость тура</small>100 000 ₽</div></div></section>`);
            await page.addScriptTag({path:path.resolve('v2/price-confidence-v1.js')});
            const states=await page.evaluate(()=>{
              const api=window.V2PriceConfidenceV1;
              api.baseCopy(); const base=document.querySelector('.selected-price-confidence').textContent;
              dispatchEvent(new CustomEvent('v2:tour-price-updated',{detail:{tour:{price:100000},flight:{price:112000},price:112000,pricePending:false}}));
              const priced=document.querySelector('.selected-price-confidence').textContent;
              dispatchEvent(new CustomEvent('v2:tour-price-updated',{detail:{tour:{price:100000},flight:{price:0},price:0,pricePending:true}}));
              const pending=document.querySelector('.selected-price-confidence').textContent;
              const overflow=document.documentElement.scrollWidth>document.documentElement.clientWidth;
              return {base,priced,pending,overflow,version:api.version};
            });
            if(!states.base.includes('После выбора рейса'))throw new Error(`base copy failed ${width}: ${JSON.stringify(states)}`);
            if(!states.priced.includes('Цена с выбранным рейсом'))throw new Error(`priced copy failed ${width}: ${JSON.stringify(states)}`);
            if(!states.pending.includes('Цена выбранного рейса уточняется')||!states.pending.includes('Пока показана цена тура из поиска'))throw new Error(`pending copy failed ${width}: ${JSON.stringify(states)}`);
            if(states.pending.includes('После выбора рейса'))throw new Error(`pending state regressed to pre-selection copy ${width}: ${JSON.stringify(states)}`);
            if(states.overflow||states.version!==1)throw new Error(`layout/version contract failed ${width}: ${JSON.stringify(states)}`);
            console.log(`PENDING_FLIGHT_CONFIDENCE_OK width=${width} ${JSON.stringify(states)}`); await page.close();
          }
          await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node pending-confidence.cjs
