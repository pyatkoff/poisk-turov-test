name: Validate pending flight price confidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/price-confidence-v1.js'
      - 'v2/unpriced-flight-price-reset-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-pending-flight-confidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending-flight-confidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit pending price label source contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');
          const src=fs.readFileSync('v2/unpriced-flight-price-reset-v1.js','utf8');
          if(!src.includes("label.textContent='Цена уточняется'")) throw new Error('pending price label missing');
          if(!src.includes('clarifyPendingLabels();')) throw new Error('pending label normalization not invoked on flight-selected');
          if(!src.includes("/[0-9]/.test(text)")) throw new Error('priced variants are not protected');
          console.log('PENDING_FLIGHT_LABEL_OK');
          JS
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify base, priced and pending selected-flight confidence states
        shell: bash
        run: |
          set -euo pipefail
          cat > pending-confidence.cjs <<'JS'
          const {chromium}=require('playwright'); const path=require('path');
          (async()=>{const browser=await chromium.launch({headless:true});
          for(const width of [375,768,1440]){
            const page=await browser.newPage({viewport:{width,height:900}});
            await page.setContent(`<section id="selectedTour"><div class="selected-head"><div class="selected-price"><small>Стоимость тура</small>100 000 ₽</div></div></section>`);
            await page.addScriptTag({path:path.resolve('v2/price-confidence-v1.js')});
            const states=await page.evaluate(()=>{
              const api=window.V2PriceConfidenceV1;
              api.baseCopy(); const base=document.querySelector('.selected-price-confidence').textContent;
              dispatchEvent(new CustomEvent('v2:tour-price-updated',{detail:{tour:{price:100000},flight:{price:112000},price:112000,pricePending:false}}));
              const priced=document.querySelector('.selected-price-confidence').textContent;
              dispatchEvent(new CustomEvent('v2:tour-price-updated',{detail:{tour:{price:100000},flight:{price:0},price:0,pricePending:true}}));
              const pending=document.querySelector('.selected-price-confidence').textContent;
              const overflow=document.documentElement.scrollWidth>document.documentElement.clientWidth;
              return {base,priced,pending,overflow,version:api.version};
            });
            if(!states.base.includes('После выбора рейса'))throw new Error(`base copy failed ${width}: ${JSON.stringify(states)}`);
            if(!states.priced.includes('Цена с выбранным рейсом'))throw new Error(`priced copy failed ${width}: ${JSON.stringify(states)}`);
            if(!states.pending.includes('Цена выбранного рейса уточняется')||!states.pending.includes('Пока показана цена тура из поиска'))throw new Error(`pending copy failed ${width}: ${JSON.stringify(states)}`);
            if(states.pending.includes('После выбора рейса'))throw new Error(`pending state regressed to pre-selection copy ${width}: ${JSON.stringify(states)}`);
            if(states.overflow||states.version!==1)throw new Error(`layout/version contract failed ${width}: ${JSON.stringify(states)}`);
            console.log(`PENDING_FLIGHT_CONFIDENCE_OK width=${width} ${JSON.stringify(states)}`); await page.close();
          }
          await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node pending-confidence.cjs
      - name: Prevent stale priced-flight value after selecting an unpriced variant
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-unpriced-flight.cjs <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const guard=path.resolve('v2/unpriced-flight-price-reset-v1.js');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['tablet',768,900],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3000);
              await page.addScriptTag({path:guard});
              const state=await page.evaluate(()=>{
                const root=document.getElementById('selectedTour');
                root.hidden=false;
                root.innerHTML='<div class="selected-head"><div></div><div class="selected-price"><small>Стоимость</small>100 000 ₽</div></div><div class="facts"><div><span>Топливный сбор</span><b>1 500 ₽</b></div></div><form class="lead-form"><div class="section-heading"><strong>Заявка</strong><span></span></div></form>';
                const tour={id:'tour-1',price:100000,fuelCharge:1500};
                const priced={price:{value:125000},fuelCharge:{value:3000}};
                const pendingSpecific={price:{value:0},fuelCharge:{value:4500}};
                const pendingFallback={price:{value:0}};
                const events=[];addEventListener('v2:tour-price-updated',e=>events.push(e.detail));
                window.V2FlightPriceSync.sync(tour,priced,0);
                const pricedText=root.querySelector('.selected-price').textContent.replace(/\s+/g,' ').trim();
                window.dispatchEvent(new CustomEvent('v2:flight-selected',{detail:{tour,flight:pendingSpecific,index:1}}));
                const specificFuel=root.querySelector('.facts>div b').textContent.replace(/\s+/g,' ').trim();
                window.dispatchEvent(new CustomEvent('v2:flight-selected',{detail:{tour,flight:pendingFallback,index:2}}));
                return {
                  pricedText,
                  currentPrice:root.querySelector('.selected-price').textContent.replace(/\s+/g,' ').trim(),
                  specificFuel,
                  fallbackFuel:root.querySelector('.facts>div b').textContent.replace(/\s+/g,' ').trim(),
                  lastFuel:events.at(-1)?.fuelCharge,
                  pricePending:events.at(-1)?.pricePending,
                  leadNote:root.querySelector('.lead-form .section-heading span').textContent.trim(),
                  confidence:root.querySelector('.selected-price-confidence')?.textContent.replace(/\s+/g,' ').trim()||'',
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                };
              });
              if(!/125.?000/.test(state.pricedText))throw new Error(name+': priced flight did not establish test precondition '+JSON.stringify(state));
              if(!/100.?000/.test(state.currentPrice)||/125.?000/.test(state.currentPrice))throw new Error(name+': stale priced-flight amount survived '+JSON.stringify(state));
              if(!/4.?500/.test(state.specificFuel))throw new Error(name+': selected pending flight fuel did not refresh '+JSON.stringify(state));
              if(!/1.?500/.test(state.fallbackFuel)||state.lastFuel!==1500)throw new Error(name+': pending flight without fuel did not keep tour fallback context '+JSON.stringify(state));
              if(state.pricePending!==true)throw new Error(name+': pending-price event flag missing '+JSON.stringify(state));
              if(!/выбранный рейс/.test(state.leadNote)||!/стоимость рейса уточнит/.test(state.leadNote))throw new Error(name+': pending-price lead context unclear '+JSON.stringify(state));
              if(state.confidence&&!/цена(?: тура)? из поиска/i.test(state.confidence))throw new Error(name+': price confidence still claims selected-flight price '+JSON.stringify(state));
              if(state.overflow)throw new Error(name+': horizontal overflow');
              if((response&&response.status())!==200||errors.length)throw new Error(name+': page errors '+errors.join(';'));
              console.log('UNPRICED_FLIGHT_PRICE_RESET_OK',name);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-unpriced-flight.cjs
