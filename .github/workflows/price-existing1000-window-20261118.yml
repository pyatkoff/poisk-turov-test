name: PRICE verify and complete the recorded promoted Telegram scope
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-existing1000-window-20261118.yml']
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '8ce0b86c718939cb75984c931036bd0da44fbc82'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check current PRICE admission and original carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45842442860 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45792507017 --jq .status | grep -Fxq completed
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45842661290 --jq .status | grep -Fxq completed
          gh api repos/pyatkoff/max-search-bot/actions/runs/45837797147 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/actions/runs/45835077241 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 --jq .body | grep -Fxq 'PR1741: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7077907800 --jq .body | grep -Fxq 'PR1735: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7029866773 --jq .body | jq -er '.state' | grep -Fxq FEED55_PERMIT_NONE
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          gh api repos/pyatkoff/max-search-bot/issues/comments/6997426347 > "$RUNNER_TEMP/price-handoff.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          handoff=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'price-handoff.json').read_text())
          body=handoff['body']
          assert handoff['user']['login']=='pyatkoff'
          assert handoff['issue_url'].endswith('/max-search-bot/issues/1566')
          assert len(body)>100
          assert 'общий редактор возвращён PRICE' in body
          assert 'writer пилота завершён' in body and 'Повторных запусков нет' in body
          PY
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Continue the verified roster with the installed PRICE writer
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          window_open() {
            gh api 'repos/pyatkoff/poisk-turov-test/actions/workflows/346454799/runs?event=schedule&per_page=5' --jq 'all(.workflow_runs[]; .status == "completed")' | grep -Fxq true || { echo "PRICE_WINDOW_HOLD scheduled_runs"; return 1; }
            gh api 'repos/pyatkoff/max-search-bot/actions/runs?status=in_progress&per_page=50' --jq 'all(.workflow_runs[]; ((.head_branch | startswith("ops/anytour-hotel-ranked-plan-")) or (.name | ascii_downcase | test("deploy production|approved hotel|transfer .+ existing anytour|apply .+ hotel"))) | not)' | grep -Fxq true || { echo "PRICE_WINDOW_HOLD content_or_deploy"; return 1; }
            gh api repos/pyatkoff/max-search-bot/issues/comments/6682640708 --jq '[.user.login,.updated_at,.body] | @tsv' | grep -Fxq $'pyatkoff\t2026-11-26T14:21:10Z\tPR1743: установлено, выпуск свободен' || { echo "PRICE_WINDOW_HOLD accepted_release"; return 1; }
            gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 --jq '[.user.login,.updated_at,.body] | @tsv' | grep -Fxq $'pyatkoff\t2026-11-26T12:01:20Z\tPR1741: установлено, выпуск свободен' || { echo "PRICE_WINDOW_HOLD publisher_release"; return 1; }
            gh api repos/pyatkoff/max-search-bot/issues/comments/7077907800 --jq '[.user.login,.updated_at,.body] | @tsv' | grep -Fxq $'pyatkoff\t2026-11-26T01:07:46Z\tPR1735: установлено, выпуск свободен' || { echo "PRICE_WINDOW_HOLD original_release"; return 1; }
            gh api repos/pyatkoff/max-search-bot/issues/comments/7029866773 --jq .body | jq -er '.state' | grep -Fxq FEED55_PERMIT_NONE || { echo "PRICE_WINDOW_HOLD feed_permit"; return 1; }
            test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA" || { echo "PRICE_WINDOW_HOLD branch_head"; return 1; }
          }
          for stage in telegram; do
            if ! window_open; then
              echo "WINDOW_HANDOFF_CHANGED $stage"
              exit 0
            fi
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "python3 - '$GITHUB_RUN_ID' '$stage'" <<'PY' | tee "$RUNNER_TEMP/price-stage-$stage.txt"
          import base64, datetime, gzip, hashlib, json, os, pathlib, re, subprocess, sys, time
          import xml.etree.ElementTree as ET
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo
          os.umask(0o077)
          root=pathlib.Path('/var/www/anytoour/data')
          app=root/'www/app.anytoour.ru'
          native=root/'www/anytoour.ru/data'
          hook=native/'monitor-price-hook.php'
          journal=root/'channel-post-operations/monitor-price-after-collection-v1.jsonl'
          art=root/'channel-post-operations'/('priority1000-'+sys.argv[1])
          stage=sys.argv[2]
          def digest(p):
              with p.open('rb') as f:
                  h=hashlib.sha256()
                  for block in iter(lambda:f.read(1048576),b''): h.update(block)
              return h.hexdigest()
          def check(condition, message):
              if not condition: raise RuntimeError(message)
          def pins():
              for name,sha in [('monitor-price-hook.php','1b42c413b0d5763d02ac7fdd62218245e9577f969cf6ec34b3b5514bbc67a1c5'),('published-hotels-monitor-v1.php','918ad7401632de3bfce5e349627ed7b8449b10c9a8c5b0aa0014511ecc9e7c06'),('top500-daily-collector-v1.php','2236c151e284221b16bf19b6f42db36de5741b45108bd6a87b5d1726871d8ed9')]:
                  p=native/name
                  check(p.resolve()==p and digest(p)==sha,'native_component_changed_'+name)
              check(subprocess.check_output(['git','-C',str(app),'rev-parse','HEAD']).decode().strip()=='13a11c4db0c5223337fb0764716d3f4783b2c570','runtime_changed')
          def feeds(updates=()):
              info={}
              for key,size in [('telegram',1055),('max',1055),('all',2110)]:
                  name='hotel-posts-'+key+'.xml'
                  p=app/'feed'/name
                  data=p.read_bytes()
                  public=subprocess.check_output(['curl','-fsS','--max-time','40','https://app.anytoour.ru/feed/'+name])
                  check(public==data,'public_price_feed_mismatch_'+key)
                  rows=ET.fromstring(data).findall('.//offer')
                  check(len(rows)==len({o.get('id') for o in rows})==size,'feed_size_or_duplicate')
                  by_id={entry.get('id'):entry for entry in rows}
                  for update in updates:
                      hotel=update['tourvisor_hotel_id']
                      observed=update['posts'][0]['monitor_price']['observed_at']
                      local=datetime.datetime.fromisoformat(observed).astimezone(ZoneInfo('Europe/Moscow'))
                      stamp=local.strftime('%d.%m.%Y, %H:%M МСК')
                      prefixes={'max':('max',),'telegram':('tg',),'all':('max','tg')}[key]
                      for prefix in prefixes:
                          entry=by_id[f'{prefix}_{hotel}']
                          check(entry.findtext('price')==str(update['price']),'published_price_mismatch')
                          check(stamp in entry.findtext('description',''),'published_observation_mismatch')
                  info[key]=hashlib.sha256(data).hexdigest()
              return info
          pins()
          baseline=feeds()
          check(baseline=={'max':'bdc79d3fab3f97a8781c45fe9b5efa7227f774ed31f338e8233fe2d57911ff03','telegram':'9291675ca3932d5b7095bc76554bb84ec33614193a9bef953abe30779f42df22','all':'691c08ca03fd4ff8d0b2af77119776e2fbe8e744fbb4ec9caf1eab30d53d6065'},'independently_verified_preimages_changed')
          print('ORIGINAL_READ_ADMISSION',45842661290,139988115016, 'stock_pairs_confirmed=30','resuming_ready_promoted_telegram',flush=True)
          def promoted_all(mode):
              proc=subprocess.run(['php',str(app/'tools/apply_promoted_hotel_prices.php'),mode],
                                  capture_output=True,text=True,timeout=300)
              raw=proc.stdout.strip()
              print('PROMOTED_PRICE',datetime.datetime.now(datetime.timezone.utc).isoformat(),raw,flush=True)
              prefix='PROMOTED_HOTEL_PRICE_RESULT='
              check(proc.returncode==0 and raw.startswith(prefix),'promoted_original_receipt_missing')
              receipt=json.loads(raw[len(prefix):])
              check(receipt.get('feed_sha256')==baseline['all'],'promoted_source_changed')
              return receipt['rows']
          before=promoted_all('--inspect')
          if any(r.get('platform')=='telegram' and r.get('result')=='eligible' and r.get('public_verified') is True for r in before):
              applied=promoted_all('--apply')
              if any(r.get('result') in ('unknown_after_write','provider_verified_public_pending') for r in applied):
                  promoted_all('--inspect')
          check(feeds()==baseline,'feed_changed_during_promoted_edits')
          print('PRICE_PROMOTED_STAGE_TERMINAL',stage,datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          PY
          done
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
