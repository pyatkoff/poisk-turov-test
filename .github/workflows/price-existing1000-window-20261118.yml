name: PRICE apply the retained price to existing MAX publication 3840
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-existing1000-window-20261118.yml']
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '758fc694cc92967dacf73bdb5d539750d60def55'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check current PRICE admission and original carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45884856726 --jq .status | grep -Fxq completed
          gh api repos/pyatkoff/max-search-bot/issues/comments/6682640708 --jq .body | grep -Fxq 'PR1744: установлено, выпуск свободен'
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45890577842 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/actions/runs/45861102873 --jq .status | grep -Fxq completed
          gh api repos/pyatkoff/max-search-bot/actions/runs/45885250607 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/actions/runs/45883181416 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 --jq .body | grep -Fxq 'PR1724: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7077907800 --jq .body | grep -Fxq 'PR1745: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7029866773 --jq .body | jq -er '.state' | grep -Fxq FEED55_PERMIT_NONE
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          gh api repos/pyatkoff/max-search-bot/issues/comments/6997426347 > "$RUNNER_TEMP/price-handoff.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          handoff=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'price-handoff.json').read_text())
          body=handoff['body']
          assert handoff['user']['login']=='pyatkoff'
          assert handoff['issue_url'].endswith('/max-search-bot/issues/1566')
          assert len(body)>100
          assert 'общий редактор возвращён PRICE' in body
          assert 'writer пилота завершён' in body and 'Повторных запусков нет' in body
          PY
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Update the existing confirmed exact MAX publication
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          gh api 'repos/pyatkoff/poisk-turov-test/actions/workflows/346454799/runs?event=schedule&per_page=5' --jq 'all(.workflow_runs[]; .status == "completed")' | grep -Fxq true
          gh api 'repos/pyatkoff/max-search-bot/actions/runs?status=in_progress&per_page=50' --jq 'all(.workflow_runs[]; ((.head_branch | startswith("ops/anytour-hotel-ranked-plan-")) or (.name | ascii_downcase | test("deploy production|approved hotel|transfer .+ existing anytour|apply .+ hotel"))) | not)' | grep -Fxq true
          gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 --jq '[.user.login,.updated_at,.body] | @tsv' | grep -Fxq $'pyatkoff\t2026-11-26T19:41:30Z\tPR1724: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7029866773 --jq .body | jq -er '.state' | grep -Fxq FEED55_PERMIT_NONE
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -' <<'PYTHON'
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path
          import json
          import subprocess
          app = Path('/var/www/anytoour/data/www/app.anytoour.ru')
          assert subprocess.check_output(['git','-C',str(app),'rev-parse','HEAD'],text=True).strip() == '1e9a88c7418f8e1af171571ef1df66f2856968e4'
          expected = 'd4683218bb1794743fb742c0c545e5631f1883f7fc15c01d486ddb0c4da8ce79'
          def check_feeds():
              expected_hashes = {'all':expected,'max':'f76a504966d43d3b287edc080aa7d29aa81d226d2681dbe8bfa3a499ce2e3604',
                                 'telegram':'26a8a4bb98f2a8c6dd4531cf48d2c79fcdb7f3a16628b943c1bc6c24de8b81d1'}
              for platform, digest in expected_hashes.items():
                  name = 'hotel-posts-'+platform+'.xml'
                  assert sha256((app/'feed'/name).read_bytes()).hexdigest() == digest
                  public = subprocess.check_output(['curl','-fsS','--max-time','15','https://app.anytoour.ru/feed/'+name])
                  assert sha256(public).hexdigest() == digest
          def original(mode):
              log=subprocess.check_output(['php',str(app/'tools/apply_promoted_hotel_prices.php'),mode,'3840'],text=True,timeout=100)
              print(datetime.now(timezone.utc).isoformat(),log.strip(),flush=True)
              prefix='PROMOTED_HOTEL_PRICE_RESULT='
              lines=[line.removeprefix(prefix) for line in log.splitlines() if line.startswith(prefix)]
              assert len(lines) == 1, 'exact_native_receipt_missing'
              receipt=json.loads(lines[0])
              assert receipt['feed_sha256'] == expected and len(receipt['rows']) == 1
              row=receipt['rows'][0]
              assert (row['hotel'],row['platform'],row['publication'],row['url']) == (77914,'max',3840,'https://max.ru/anytour/AaEl-MVcT8Q')
              return row
          check_feeds()
          before=original('--inspect-max-publication')
          if before['result'] == 'eligible' and before.get('public_verified') is True:
              applied=original('--apply-max-publication')
              assert applied['result'] in ('updated','provider_verified_public_pending'), 'exact_native_write_not_confirmed'
          else:
              assert before['result'] == 'already_current' and before.get('public_verified') is True, 'exact_native_admission_not_confirmed'
          after=original('--inspect-max-publication')
          assert after['result'] == 'already_current' and after.get('public_verified') is True, 'exact_native_readback_not_confirmed'
          check_feeds()
          print('PROMOTED_MAX_EXACT_VERIFIED',datetime.now(timezone.utc).isoformat(),flush=True)
          PYTHON
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
