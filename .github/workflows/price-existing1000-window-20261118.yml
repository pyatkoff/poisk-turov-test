name: PRICE apply the newly verified TV12107 minimum to existing MAX publication 3604
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-existing1000-window-20261118.yml']
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '0b9455053a70d519f9437ad7c140b2bb75532f02'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check current PRICE admission and original carrier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45780716545 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45780967090 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/actions/runs/45756160505 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/actions/runs/45769734530 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/actions/runs/45777003288 --jq .conclusion | grep -Fxq success
          gh api repos/pyatkoff/max-search-bot/issues/comments/6818332618 --jq .body | grep -Fxq 'PR1737: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7077907800 --jq .body | grep -Fxq 'PR1735: установлено, выпуск свободен'
          gh api repos/pyatkoff/max-search-bot/issues/comments/7029866773 --jq .body | jq -er '.state' | grep -Fxq FEED55_PERMIT_NONE
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          gh api repos/pyatkoff/max-search-bot/issues/comments/6997426347 > "$RUNNER_TEMP/price-handoff.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          handoff=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'price-handoff.json').read_text())
          body=handoff['body']
          assert handoff['user']['login']=='pyatkoff'
          assert handoff['issue_url'].endswith('/max-search-bot/issues/1566')
          assert len(body)>100
          assert 'общий редактор возвращён PRICE' in body
          assert 'writer пилота завершён' in body and 'Повторных запусков нет' in body
          PY
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Complete the verified TV12107 update with the installed PRICE writer
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "python3 - '$GITHUB_RUN_ID'" <<'PY'
          import base64, datetime, gzip, hashlib, json, os, pathlib, re, subprocess, sys, time
          import xml.etree.ElementTree as ET
          from urllib.request import urlopen
          from zoneinfo import ZoneInfo
          os.umask(0o077)
          root=pathlib.Path('/var/www/anytoour/data')
          app=root/'www/app.anytoour.ru'
          native=root/'www/anytoour.ru/data'
          hook=native/'monitor-price-hook.php'
          journal=root/'channel-post-operations/monitor-price-after-collection-v1.jsonl'
          art=root/'channel-post-operations'/('priority1000-'+sys.argv[1])
          art.mkdir(exist_ok=False)
          def digest(p):
              with p.open('rb') as f:
                  h=hashlib.sha256()
                  for block in iter(lambda:f.read(1048576),b''): h.update(block)
              return h.hexdigest()
          def check(condition, message):
              if not condition: raise RuntimeError(message)
          def pins():
              for name,sha in [('monitor-price-hook.php','1b42c413b0d5763d02ac7fdd62218245e9577f969cf6ec34b3b5514bbc67a1c5'),('published-hotels-monitor-v1.php','918ad7401632de3bfce5e349627ed7b8449b10c9a8c5b0aa0014511ecc9e7c06'),('top500-daily-collector-v1.php','2236c151e284221b16bf19b6f42db36de5741b45108bd6a87b5d1726871d8ed9')]:
                  p=native/name
                  check(p.resolve()==p and digest(p)==sha,'native_component_changed_'+name)
              check(subprocess.check_output(['git','-C',str(app),'rev-parse','HEAD']).decode().strip()=='69e41c8011b4c67692f631cf435dd20d90676c72','runtime_changed')
          def window_open():
              base='https://api.github.com/repos/pyatkoff/max-search-bot/issues/comments/'
              def comment(comment_id):
                  with urlopen(base+str(comment_id),timeout=15) as response:
                      return json.load(response)
              release=comment(7077907800)
              content_release=comment(6818332618)
              permit=comment(7029866773)
              with urlopen('https://api.github.com/repos/pyatkoff/poisk-turov-test/actions/workflows/346454799/runs?event=schedule&per_page=5',timeout=15) as response:
                  schedules=json.load(response)['workflow_runs']
              with urlopen('https://api.github.com/repos/pyatkoff/max-search-bot/actions/runs?branch=main&status=in_progress&per_page=20',timeout=15) as response:
                  production=json.load(response)['workflow_runs']
              with urlopen('https://api.github.com/repos/pyatkoff/max-search-bot/actions/runs?status=in_progress&per_page=30',timeout=15) as response:
                  content_runs=json.load(response)['workflow_runs']
              return (not any(r['status']!='completed' for r in schedules)
                      and not any('deploy' in r['name'].lower() for r in production)
                      and not any(r['head_branch'].startswith('ops/anytour-hotel-ranked-plan-') or 'approved hotel' in r['name'].lower()
                                  for r in content_runs)
                      and release['user']['login']=='pyatkoff'
                      and release['updated_at']=='2026-11-26T01:07:46Z'
                      and release['body']=='PR1735: установлено, выпуск свободен'
                      and content_release['user']['login']=='pyatkoff'
                      and content_release['updated_at']=='2026-11-26T04:56:38Z'
                      and content_release['body']=='PR1737: установлено, выпуск свободен'
                      and json.loads(permit['body'])['state']=='FEED55_PERMIT_NONE')
          def feeds(updates=()):
              info={}
              for key,size in [('telegram',1055),('max',1055),('all',2110)]:
                  name='hotel-posts-'+key+'.xml'
                  p=app/'feed'/name
                  data=p.read_bytes()
                  public=subprocess.check_output(['curl','-fsS','--max-time','40','https://app.anytoour.ru/feed/'+name])
                  check(public==data,'public_price_feed_mismatch_'+key)
                  rows=ET.fromstring(data).findall('.//offer')
                  check(len(rows)==len({o.get('id') for o in rows})==size,'feed_size_or_duplicate')
                  by_id={entry.get('id'):entry for entry in rows}
                  for update in updates:
                      hotel=update['tourvisor_hotel_id']
                      observed=update['posts'][0]['monitor_price']['observed_at']
                      local=datetime.datetime.fromisoformat(observed).astimezone(ZoneInfo('Europe/Moscow'))
                      stamp=local.strftime('%d.%m.%Y, %H:%M МСК')
                      prefixes={'max':('max',),'telegram':('tg',),'all':('max','tg')}[key]
                      for prefix in prefixes:
                          entry=by_id[f'{prefix}_{hotel}']
                          check(entry.findtext('price')==str(update['price']),'published_price_mismatch')
                          check(stamp in entry.findtext('description',''),'published_observation_mismatch')
                  info[key]=hashlib.sha256(data).hexdigest()
              return info
          def report(updates=()):
              print('HANDOFF',json.dumps({'hook':digest(hook),'cohort':digest(native/'published-hotels-monitor-v1.php'),'feeds':feeds(updates)}),flush=True)
          def promoted_read(mode, publication, hotel, url, baseline):
              proc=subprocess.run(['php',str(app/'tools/apply_promoted_hotel_prices.php'),mode,str(publication)],
                                  capture_output=True,text=True,timeout=150)
              output=proc.stdout.strip()
              print('PROMOTED_MAX',publication,mode,datetime.datetime.now(datetime.timezone.utc).isoformat(),output,flush=True)
              prefix='PROMOTED_HOTEL_PRICE_RESULT='
              if proc.returncode!=0 or not output.startswith(prefix): return None
              receipt=json.loads(output[len(prefix):])
              check(receipt.get('feed_sha256')==baseline['all'],'promoted_source_changed')
              rows=receipt.get('rows',[])
              check(len(rows)==1 and all(rows[0].get(key)==expected for key,expected in
                    [('hotel',hotel),('platform','max'),('publication',publication),('url',url)]),'promoted_target_mismatch')
              return rows[0]
          check(window_open(),'price_editor_window_closed')
          pins()
          print('TIMER',subprocess.check_output(['php',str(native/'hotel-price-timer-v1.php'),'--status']).decode().strip(),flush=True)
          report()
          baseline=feeds()
          check(baseline=={'max':'69fda1dd31fa5eacbf68776244322395c826e22a150fd6b7def1a128ebefb574','telegram':'fca099123d96f9b9b4411efb228b8e88289efe042d52624964cfa37faa8203bf','all':'6500b735740896c8741cad69ec7e34f41d8dd1d6169c554c8f491f57eb712446'},'independently_verified_preimages_changed')
          print('ORIGINAL_READ_ADMISSION',45780967090,139776024259, 'last_scanned=1000','resuming_after_verified_native_collection',flush=True)
          for publication,hotel,slug in [(3604,12107,'AZwjaZt4Kz8')]:
              if not window_open():
                  print('WINDOW_HANDOFF_CHANGED','promoted_max',publication,flush=True)
                  break
              pins()
              url='https://max.ru/anytour/'+slug
              before=promoted_read('--inspect-max-publication',publication,hotel,url,baseline)
              if before is None or before.get('result')!='eligible' or before.get('public_verified') is not True: continue
              applied=promoted_read('--apply-max-publication',publication,hotel,url,baseline)
              check(applied is not None,'promoted_original_receipt_missing')
              if applied.get('result')=='held_before_write': continue
              check(applied.get('result')=='updated' and applied.get('public_verified') is True,'promoted_original_requires_readback')
              after=promoted_read('--inspect-max-publication',publication,hotel,url,baseline)
              check(after is not None and after.get('result')=='already_current' and after.get('public_verified') is True,
                    'promoted_public_readback_incomplete')
          check(feeds()==baseline,'feed_changed_during_promoted_edits')
          print('WINDOW_TERMINAL_TV12107',datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          PY
      - name: Cleanup connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
