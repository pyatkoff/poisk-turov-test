name: Validate V2 lead form guard v1
on:
  push:
    branches: [main]
    paths:
      - 'v2/lead-form-guard-v1.js'
      - '.github/workflows/validate-lead-form-guard-v1.yml'
jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate guard
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/lead-form-guard-v1.js
          grep -q "10" v2/lead-form-guard-v1.js
          grep -q "15" v2/lead-form-guard-v1.js
          grep -q "setCustomValidity" v2/lead-form-guard-v1.js
          grep -q "version:1" v2/lead-form-guard-v1.js
