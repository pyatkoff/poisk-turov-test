name: Stored ANEX and SAMO offer context

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/integrations/stored-provider-offer-context.php'
      - 'app/integrations/andromeda-selected-offer.php'
      - 'app/integrations/andromeda-offer-store.php'
      - 'app/integrations/anex-preview-gateway.php'
      - 'app/integrations/three-provider-anex-offer.php'
      - 'tests/stored-provider-offer-context-smoke.php'
      - '.github/workflows/stored-provider-offer-context-contracts.yml'
permissions:
  contents: read
jobs:
  exact-stored-native-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check syntax and actual native resolver contracts without supplier calls
        run: |
          php -l app/integrations/stored-provider-offer-context.php
          php -l tests/stored-provider-offer-context-smoke.php
          php tests/stored-provider-offer-context-smoke.php --native
