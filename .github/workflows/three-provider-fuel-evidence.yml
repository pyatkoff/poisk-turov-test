name: INT operator fuel evidence offline
on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-fuel-evidence.php'
      - 'app/integrations/anytour-offer-snapshot-producer.php'
      - 'tests/three-provider-fuel-evidence-test.php'
      - '.github/workflows/three-provider-fuel-evidence.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Typed fuel and existing producer LOCAL contract
        run: |
          set -euo pipefail
          php -l app/integrations/three-provider-fuel-evidence.php
          php -l app/integrations/anytour-offer-snapshot-producer.php
          php -l tests/three-provider-fuel-evidence-test.php
          php -d allow_url_fopen=0 tests/three-provider-fuel-evidence-test.php
