name: MATCH Tourvisor passive target-gap census v2

on:
  push:
    branches: [diag/match-tourvisor-passive-target-gap-census-1971-20260917-v2]
    paths:
      - scripts/diagnostics/hotel_match_tourvisor_passive_target_gap_census_v2.php
      - .github/workflows/hotel-match-tourvisor-passive-target-gap-census-v2.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: match-tourvisor-passive-target-gap-census-v2
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-tourvisor-passive-target-gap-census-1971-20260917-v2

jobs:
  census:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Offline self-test
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_tourvisor_passive_target_gap_census_v2.php
          php scripts/diagnostics/hotel_match_tourvisor_passive_target_gap_census_v2.php --self-test
      - name: Reserve before DB access
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5716662804,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tourvisor-passive-target-gap-census-v2-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tourvisor-passive-target-gap-census-1971-20260917-v2/reservation.json
          retention-days: 90
      - name: Run CURRENT read-only census
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_tourvisor_passive_target_gap_census_v2.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'
          r=json.loads((s/'result.json').read_text()); c=json.loads((s/'receipt.json').read_text()); h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          ok=(r.get('state')=='completed_read_only' and r.get('passive_identity_rows_total',0)>=13611 and r.get('duplicate_relevant_pairs')==0 and c.get('result_sha256')==h and c.get('readback_verified') is True and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']))
          summary={'verified':ok,'passive_identity_rows_total':r.get('passive_identity_rows_total'),'relevant_passive_rows':r.get('relevant_passive_rows'),'by_tourvisor_operator':r.get('by_tourvisor_operator'),'pending_external_rows_by_namespace':r.get('pending_external_rows_by_namespace'),'missing_accepted_locals_total':r.get('missing_accepted_locals_total'),'core8_active_missing_accepted_locals':r.get('core8_active_missing_accepted_locals'),'top_missing':r.get('top_missing',[])[:30],'result_sha256':h}
          (p/'workflow-readback.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tourvisor-passive-target-gap-census-v2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tourvisor-passive-target-gap-census-1971-20260917-v2/
          retention-days: 90
