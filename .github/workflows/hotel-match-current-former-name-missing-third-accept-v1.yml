name: MATCH current former-name missing-third accept v1
run-name: MATCH former-name missing-third accept #1971 v1
on:
  push:
    branches:
      - 'ops/match-current-former-name-missing-third-accept-1971-20260911-v1'
    paths:
      - '.github/workflows/hotel-match-current-former-name-missing-third-accept-v1.yml'
permissions:
  contents: read
  issues: write
concurrency:
  group: match-current-former-name-missing-third-accept-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-current-former-name-missing-third-accept-1971-20260911-v1
  REVIEW_OPERATION: hotel-match-current-missing-third-strict-review-1971-20260911-v5
  REVIEW_RUN: '34633267776'
  REVIEW_ARTIFACT: '10277186924'
  EXPECTED_ACCEPT_BLOB: 4d802154f378dfde961eaed7124765890994ef0b
  STATE_DIR_NAME: m3former-v1
jobs:
  accept:
    if: >-
      github.actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'MATCH #1971 run former-name missing-third accept v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify immutable source and compose exact two-row alias patch
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/match-current-former-name-missing-third-accept-1971-v1.arm)" = $'operation_id=hotel-match-current-former-name-missing-third-accept-1971-20260911-v1\nstate=armed'
          test "$(git hash-object scripts/diagnostics/hotel_match_current_missing_third_strict_accept.php)" = "$EXPECTED_ACCEPT_BLOB"
          php -l scripts/diagnostics/hotel_match_current_missing_third_strict_accept.php
          test -n "$KEY_VALUE"
          STATE="$RUNNER_TEMP/$STATE_DIR_NAME"; mkdir -m 700 "$STATE"; export STATE
          key="$RUNNER_TEMP/m3former.key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          def body(path):
              x=Path(path).read_text(encoding='utf-8')
              if x.startswith('<?php'): x=x[5:]
              x=x.replace('declare(strict_types=1);','',1)
              return x
          n=body('scripts/diagnostics/hotel_match_current_missing_third_strict_accept.php')
          replacements=[
            ("const M3A_OPERATION='hotel-match-current-missing-third-strict-accept-1971-20260911-v1';", "const M3A_OPERATION='"+os.environ['OPERATION_ID']+"';"),
            ("const M3A_REVIEW_OPERATION='hotel-match-current-missing-third-strict-review-1971-20260911-v1';", "const M3A_REVIEW_OPERATION='"+os.environ['REVIEW_OPERATION']+"';"),
            ("const M3A_REVIEW_RUN='34622237191';", "const M3A_REVIEW_RUN='"+os.environ['REVIEW_RUN']+"';"),
            ("const M3A_REVIEW_ARTIFACT='10272453259';", "const M3A_REVIEW_ARTIFACT='"+os.environ['REVIEW_ARTIFACT']+"';"),
            ("if(count($r)!==34)throw new RuntimeException('manifest_shape_changed');", "if(count($r)!==2)throw new RuntimeException('manifest_shape_changed');"),
            ("if($writes>34)throw new RuntimeException('write_scope_limit');", "if($writes>2)throw new RuntimeException('write_scope_limit');")
          ]
          for old,new in replacements:
              if n.count(old)!=1: raise SystemExit('accept_shape_changed:'+old[:40])
              n=n.replace(old,new,1)
          start="$txt=<<<'DATA'\n"; end="\nDATA;"
          i=n.find(start); j=n.find(end,i+len(start))
          if i<0 or j<0: raise SystemExit('manifest_block_missing')
          manifest='''anex|797|1|501|empire beach aqua park|EMPIRE BEACH AQUA PARK|33a87539e24b2e1a8cf88076d17fc8f50ff9358bf92dcbd68640c33bc6a47b57
andromeda|106028|2|711|muang samui|MUANG SAMUI SPA RESORT|513d6bfb3751fb046e8329cc08680d3a5f6251e46ec09147cfa7da27900e4553'''
          n=n[:i+len(start)]+manifest+n[j:]
          keyfn="function m3a_key($v):string{return implode(' ',m3a_tokens($v));}"
          aliasfn=r'''function m3a_name_variants($v):array{$raw=trim((string)$v);if($raw==='')return[];$parts=[$raw];if(preg_match_all('/\(\s*(?:ex|ех|former(?:ly)?)\s*\.?\s*[:\-]?\s*([^()]+)\)/iu',$raw,$mm)){foreach($mm[1] as $old)if(trim((string)$old)!=='')$parts[]=trim((string)$old);$parts[]=preg_replace('/\s*\(\s*(?:ex|ех|former(?:ly)?)\s*\.?\s*[:\-]?\s*[^()]+\)\s*/iu',' ',$raw)??$raw;}$out=[];foreach($parts as $p){$p=trim((string)$p);if($p!=='')$out[$p]=true;}return array_keys($out);}'''
          if n.count(keyfn)!=1: raise SystemExit('key_function_shape_changed')
          n=n.replace(keyfn,keyfn+aliasfn,1)
          oldraw="$raw=null;foreach(array_unique($names) as $n)if(m3a_key($n)===$m['key']){$raw=(string)$n;break;}if($raw===null){$inc($skip,'strict_identity_changed');continue;}"
          newraw="$raw=null;foreach(array_unique($names) as $n){foreach(m3a_name_variants($n) as $variant){if(m3a_key($variant)===$m['key']){$raw=(string)$n;break 2;}}}if($raw===null){$inc($skip,'strict_identity_changed');continue;}"
          if n.count(oldraw)!=1: raise SystemExit('raw_match_shape_changed')
          n=n.replace(oldraw,newraw,1)
          h=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          p=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          a=body('scripts/diagnostics/hotel_match_current_bulk_accept.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          n=n.replace("if(!defined('FC_LIBRARY_ONLY'))define('FC_LIBRARY_ONLY',true);\nrequire_once __DIR__.'/hotel_match_current_bulk_accept.php';\n",'',1)
          code="<?php\ndefine('FC_LIBRARY_ONLY',true);\n"+h+'\n'+p+'\n'+a+'\n'+n
          s=Path(os.environ['STATE']); (s/'live.php').write_text(code,encoding='utf-8'); (s/'composed_sha256.txt').write_text(hashlib.sha256(code.encode()).hexdigest()+'\n')
          PY
          php -l "$STATE/live.php"

      - name: Reserve immutable operation before SSH
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$STATE_DIR_NAME"; export STATE
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['STATE']); r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_ssh','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'accept_source_blob':os.environ['EXPECTED_ACCEPT_BLOB'],'review_operation':os.environ['REVIEW_OPERATION'],'review_run':int(os.environ['REVIEW_RUN']),'review_artifact':int(os.environ['REVIEW_ARTIFACT']),'manifest_count':2,'manifest':['anex:797->501','andromeda:106028->711'],'semantic_patch':'former_name_parenthetical_alias_only','database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          raw=json.dumps(r,sort_keys=True,indent=2)+'\n'; (p/'reservation.json').write_text(raw)
          if (p/'reservation.json').read_text()!=raw: raise SystemExit('reservation_readback_failed')
          PY

      - name: Preserve reservation before live write
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-current-former-name-missing-third-accept-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/m3former-v1/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Apply server-current guarded two-row alias delta
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$STATE_DIR_NAME"; key="$RUNNER_TEMP/m3former.key"; sock="$RUNNER_TEMP/m3former.sock"; kh="$RUNNER_TEMP/m3former.kh"; export STATE
          rm -f "$sock"
          set +e
          ssh -M -S "$sock" -fnNT -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$kh" -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ControlPersist=300 -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE"
          mrc=$?
          set -e
          if [ "$mrc" -ne 0 ]; then printf '{"operation_id":"%s","state":"known_pre_ssh_failure","reason":"controlmaster_failed","database_writes":0,"mapping_writes":0,"supplier_calls":0,"no_replay":true}\n' "$OPERATION_ID" > "$STATE/blocker.json"; exit 1; fi
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o BatchMode=yes -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -f config.php'
          prc=$?
          set -e
          if [ "$prc" -ne 0 ]; then printf '{"operation_id":"%s","state":"known_pre_db_failure","reason":"preflight_failed","database_writes":0,"mapping_writes":0,"supplier_calls":0,"no_replay":true}\n' "$OPERATION_ID" > "$STATE/blocker.json"; exit 1; fi
          printf '{"operation_id":"%s","state":"ssh_started"}\n' "$OPERATION_ID" > "$STATE/ssh_started.json"
          set +e
          ssh -T -S "$sock" -o ControlMaster=no -o BatchMode=yes -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$STATE/live.php" > "$STATE/live.stdout" 2> "$STATE/live.stderr"
          rc=$?
          set -e
          export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE']); rc=int(os.environ['RC']); out=(s/'live.stdout').read_text(errors='replace'); err=(s/'live.stderr').read_text(errors='replace'); lines=[x for x in out.splitlines() if x.strip()]; data=None
          if lines:
              try:data=json.loads(lines[-1])
              except Exception:pass
          if not isinstance(data,dict):
              b={'operation_id':os.environ['OPERATION_ID'],'state':'unknown_after_ssh','reason':'live_output_unparseable_do_not_replay','remote_exit':rc,'database_writes':'unknown','mapping_writes':'unknown','supplier_calls':0,'stdout_sha256':hashlib.sha256(out.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),'no_replay':True}; (s/'blocker.json').write_text(json.dumps(b,sort_keys=True)+'\n'); raise SystemExit(1)
          (s/'result.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          if data.get('operation_id')!=os.environ['OPERATION_ID'] or int(data.get('supplier_calls',-1))!=0:
              b={'operation_id':os.environ['OPERATION_ID'],'state':'unknown_after_ssh','reason':'operation_contract_mismatch_do_not_replay','database_writes':data.get('database_writes','unknown'),'mapping_writes':data.get('mapping_writes','unknown'),'supplier_calls':data.get('supplier_calls'),'no_replay':True}; (s/'blocker.json').write_text(json.dumps(b,sort_keys=True)+'\n'); raise SystemExit(1)
          if data.get('status')!='completed' or data.get('committed') is not True or data.get('readback_verified') is not True:
              committed=data.get('committed') is True; b={'operation_id':os.environ['OPERATION_ID'],'state':'unknown_committed' if committed else 'known_rolled_back','reason':data.get('reason','write_not_completed'),'database_writes':data.get('database_writes','unknown' if committed else 0),'mapping_writes':data.get('mapping_writes','unknown' if committed else 0),'planned':data.get('planned'),'skipped':data.get('skipped'),'supplier_calls':0,'no_replay':True}; (s/'blocker.json').write_text(json.dumps(b,sort_keys=True)+'\n'); raise SystemExit(1)
          writes=int(data['database_writes']); planned=data['planned']
          if writes!=int(planned['anex'])+int(planned['andromeda']) or writes>2: raise SystemExit('count_contract')
          raw=(s/'result.json').read_bytes(); receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_committed_readback_verified','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':writes,'mapping_writes':writes,'planned':planned,'skipped':data.get('skipped'),'coverage_before':data.get('coverage_before'),'coverage_after':data.get('coverage_after'),'identity_before':data.get('identity_before'),'identity_after':data.get('identity_after'),'accepted':data.get('accepted'),'supplier_calls':0,'committed':True,'readback_verified':True,'no_replay':True}; (s/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY

      - name: Close SSH control master
        if: always()
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          sock="$RUNNER_TEMP/m3former.sock"
          if test -S "$sock"; then ssh -S "$sock" -O exit -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/m3former.key" "$sock"

      - name: Preserve result or blocker
        if: always()
        id: result_artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-current-former-name-missing-third-accept-1971-20260911-v1-result
          path: ${{ runner.temp }}/m3former-v1/
          if-no-files-found: error
          retention-days: 90

      - name: Record MATCH result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.result_artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$STATE_DIR_NAME"; export STATE ARTIFACT_ID
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['STATE'])
          if (s/'receipt.json').exists():
              r=json.loads((s/'result.json').read_text()); cb=r['coverage_before']; ca=r['coverage_after']; p=r['planned']; accepted=r.get('accepted') or {}; rows=[]
              for x in accepted.get('anex',[]): rows.append(f"ANEX {x.get('external_id')}→{x.get('target')}")
              for x in accepted.get('andromeda',[]): rows.append(f"Andromeda {x.get('external_id')}→{x.get('target')}")
              text=f"MATCH #1971 former-name missing-third delta `{r['operation_id']}` **COMPLETED**: commit + exact per-row readback verified. Actual mappings **{r['database_writes']}** = ANEX **{p['anex']}** + Andromeda **{p['andromeda']}**; rows: {', '.join(rows) if rows else 'none'}; supplier calls 0. Triple {cb['all_three']}→{ca['all_three']}; exactly-two {cb['exactly_two']}→{ca['exactly_two']}. Skipped `{r.get('skipped')}`. Result artifact `{os.environ['ARTIFACT_ID']}`. Operation NO-REPLAY."
          else:
              b=json.loads((s/'blocker.json').read_text()) if (s/'blocker.json').exists() else {'operation_id':os.environ['OPERATION_ID'],'state':'workflow_failure','reason':'no_blocker_payload'}
              text=f"MATCH #1971 former-name missing-third delta `{b['operation_id']}` stopped: **{b['state']}**, reason `{b['reason']}`, DB writes **{b.get('database_writes','unknown')}**, supplier calls 0. Result artifact `{os.environ['ARTIFACT_ID']}`. **DO NOT REPLAY**."
          (s/'comment.md').write_text(text+'\n')
          PY
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
          gh issue comment 996 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
