name: TEMP INT semantic ANEX range patch v4
on:
  push:
    branches:
      - ops/int-anex-range-semantic-20260924-v4
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/int-anex-range-semantic-20260924-v4
          fetch-depth: 0
      - name: Patch and test
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "7d91870ec75c1222df116b36f45ec93d90d2b27b"
          python3 scripts/deploy/_tmp_int_anex_range_patch_v4.py
          python3 -m py_compile scripts/deploy/int_server_executor.py tests/int_server_executor_test.py
          python3 tests/int_server_executor_test.py
          git diff --check
      - name: Commit clean final diff
        run: |
          set -euo pipefail
          git rm .github/workflows/_tmp-int-anex-range-semantic-v4.yml scripts/deploy/_tmp_int_anex_range_patch_v4.py
          git add scripts/deploy/int_server_executor.py tests/int_server_executor_test.py
          git config user.name 'AnyTour INT autopilot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'INT: add bounded direct ANEX range control'
          git push origin HEAD:ops/int-anex-range-semantic-20260924-v4
