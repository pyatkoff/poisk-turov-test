name: Search3 AnyTour live24h canonical seed v1
on:
  pull_request:
    types: [synchronize]
    branches: [release/search3-production-ready-v1]
    paths:
      - 'scripts/catalog/anytour_live24h_seed_manifest_v1.json'
      - '.github/workflows/search3-anytour-live24h-seed-v1.yml'
permissions:
  contents: read
concurrency:
  group: anytour-canonical-catalog-operations
  cancel-in-progress: false
jobs:
  checked-seed:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' && github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.head.ref == 'ops/local-canonical-live24h-seed-2690-20260917-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      head: ${{ github.event.pull_request.head.sha }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: anytour_catalog_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Verify exact manifest and existing canonical seed contract
        env:
          ANYTOUR_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_catalog_fixture;charset=utf8mb4'
          ANYTOUR_TEST_PASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          php -l scripts/catalog/anytour_catalog_seed.php
          php -l v2/data/anytour-canonical-catalog-v1.php
          php tests/anytour_canonical_catalog_test.php
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('scripts/catalog/anytour_live24h_seed_manifest_v1.json')
          raw=p.read_bytes(); m=json.loads(raw)
          assert m['schema_version']==1
          assert m['operation_id']=='anytour-canonical-live24h-seed-2690-20260917-v2'
          assert m['source_operation']=='hotel-match-missing-canonical-priority-1971-20260917-v2'
          assert m['source_run']==35255169735
          assert m['source_payload_sha256']=='e403b2473125185ce52918f01b9d5df0ffaef4cfdfff0c5114bbdaaed2a1c2de'
          ids=m['tourvisor_hotel_ids']
          assert m['expected_count']==85 and len(ids)==85 and len(set(ids))==85
          assert all(type(x) is int and x>0 for x in ids)
          assert ids[:5]==[9297,141583,81043,49820,1162]
          assert hashlib.sha256(raw).hexdigest()=='a0ae016aaa30c0b4677e871ceb59259b4fedf234f0d5fc15c52e108f74adad60'
          PY
      - name: Retain fixed source and durable reservation before SSH credentials
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,tarfile
          base='aad46900e2dd66b54e401942f251ab8aebacf564'
          op='anytour-canonical-live24h-seed-2690-20260917-v2'
          files=[
            'v2/data/anytour-canonical-catalog-v1.php',
            'v2/data/hotel-presentation-read-v1.php',
            'v2/data/hotel-details-v1.php',
            'v2/data/db-v1.php',
            'scripts/catalog/anytour_catalog_seed.php',
            'scripts/catalog/anytour_live24h_seed_manifest_v1.json',
          ]
          for name in files[:-1]:
              got=subprocess.check_output(['git','rev-parse','HEAD:'+name]).strip()
              want=subprocess.check_output(['git','rev-parse',base+':'+name]).strip()
              assert got==want, f'base dependency changed: {name}'
          work=pathlib.Path('retained'); work.mkdir()
          payload={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files}
          with tarfile.open(work/'payload.tar.gz','w:gz') as t:
              for name in files:
                  data=pathlib.Path(name).read_bytes(); info=tarfile.TarInfo('payload/'+name)
                  info.size=len(data); info.mode=0o600; info.mtime=0
                  t.addfile(info,io.BytesIO(data))
          reservation={
            'operation':op,'baseRelease':base,'executionSource':os.environ['EXACT_HEAD'],
            'run':int(os.environ['GITHUB_RUN_ID']),'attempt':1,'files':payload,
            'expectedIds':85,'supplierCalls':0,'mappingWrites':0,'publicWrites':0,'noReplayAfterApply':True,
          }
          (work/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          (work/'transport.sha256').write_text(''.join(hashlib.sha256((work/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in ['payload.tar.gz','reservation.json']))
          PY
      - id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-live24h-seed-reservation-${{ github.run_id }}
          path: retained/
          if-no-files-found: error
          retention-days: 90

  on-host-seed:
    needs: checked-seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.checked-seed.outputs.artifact_id }}
          path: retained
          merge-multiple: true
      - name: Recheck authorization and exact Security result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.checked-seed.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api repos/pyatkoff/poisk-turov-test/pulls/$PR_NUMBER --jq '.head.sha')" = "$HEAD_SHA"
          gh api repos/pyatkoff/poisk-turov-test/issues/comments/5719028736 > claim.json
          for i in $(seq 1 30); do
            gh api repos/pyatkoff/poisk-turov-test/commits/$HEAD_SHA/check-runs > checks.json
            if python3 - <<'PY'
          import json,sys
          runs=json.load(open('checks.json'))['check_runs']
          sys.exit(0 if any(x['name']=='guard' and x['conclusion']=='success' for x in runs) else 1)
          PY
            then break; fi
            sleep 5
          done
          python3 - <<'PY'
          import datetime,json
          c=json.load(open('claim.json')); checks=json.load(open('checks.json'))['check_runs']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert 'anytour-canonical-live24h-seed-2690-20260917-v2' in c['body']
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(c['created_at'].replace('Z','+00:00'))
          assert 0<=age.total_seconds()<7200,'claim expired'
          assert any(x['name']=='guard' and x['conclusion']=='success' for x in checks),'exact Security not green'
          PY
          cd retained && sha256sum -c transport.sha256
      - name: Seed exact current live24h canonical cohort once
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] && [[ "$REMOTE_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]
          mkdir -p evidence
          key="$RUNNER_TEMP/catalog-key"; known="$RUNNER_TEMP/catalog-known"
          trap 'rm -f "$key" "$known"' EXIT
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 -d > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          opts=(-i "$key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$REMOTE_USER@$HOST"
          path='.anytour-operations/anytour-canonical-live24h-seed-2690-20260917-v2'
          ssh "${opts[@]}" "$remote" 'umask 077; test ! -L "$HOME/.anytour-operations"; mkdir -p "$HOME/.anytour-operations"; mkdir "$HOME/.anytour-operations/anytour-canonical-live24h-seed-2690-20260917-v2"'
          scp "${opts[@]}" retained/{reservation.json,transport.sha256,payload.tar.gz} "$remote:$path/"
          set +e
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          cd "$HOME/.anytour-operations/anytour-canonical-live24h-seed-2690-20260917-v2"
          printf 'state=reserved\n' > checkpoint.env
          sha256sum -c transport.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          r=json.load(open('reservation.json'))
          assert r['operation']=='anytour-canonical-live24h-seed-2690-20260917-v2' and r['attempt']==1 and r['expectedIds']==85
          with tarfile.open('payload.tar.gz','r:gz') as t:
              members=t.getmembers(); assert len(members)==len(r['files'])==6
              assert {m.name for m in members}=={'payload/'+n for n in r['files']}
              for m in members:
                  assert m.isfile() and 0<m.size<100000 and '..' not in pathlib.PurePosixPath(m.name).parts
                  data=t.extractfile(m).read(); assert hashlib.sha256(data).hexdigest()==r['files'][m.name[8:]]
                  p=pathlib.Path(m.name); p.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
                  with p.open('xb') as f:f.write(data)
          PY
          ids=$(python3 - <<'PY'
          import json
          m=json.load(open('payload/scripts/catalog/anytour_live24h_seed_manifest_v1.json'))
          assert len(m['tourvisor_hotel_ids'])==m['expected_count']==85
          print(','.join(map(str,m['tourvisor_hotel_ids'])))
          PY
          )
          php -d display_errors=0 -r '$_SERVER["DOCUMENT_ROOT"]=getenv("HOME")."/www/anytoour.ru"; require "payload/scripts/catalog/anytour_catalog_seed.php";' -- --ids="$ids" > plan.json
          cp plan.json plan-first.json
          sleep 1
          php -d display_errors=0 -r '$_SERVER["DOCUMENT_ROOT"]=getenv("HOME")."/www/anytoour.ru"; require "payload/scripts/catalog/anytour_catalog_seed.php";' -- --ids="$ids" > plan-second.json
          python3 - <<'PY'
          import json
          a=json.load(open('plan-first.json')); b=json.load(open('plan-second.json'))
          assert a==b,'CURRENT plan drifted before apply'
          assert a['status']=='prepared_read_only'
          assert len(a['requestedIds'])==85 and a['source_profiles']==85 and a['missingIds']==[] and a['existing_bridges']==0
          open('source.sha','w').write(a['source_sha256']+'\n')
          print('plan_source_sha256='+a['source_sha256'])
          PY
          printf 'state=planned\n' > checkpoint.env
          source_sha=$(cat source.sha)
          printf 'state=apply_started\n' > checkpoint.env
          php -d display_errors=0 -r '$_SERVER["DOCUMENT_ROOT"]=getenv("HOME")."/www/anytoour.ru"; require "payload/scripts/catalog/anytour_catalog_seed.php";' -- --ids="$ids" --apply-source-sha256="$source_sha" > result.json
          printf 'state=apply_returned\n' > checkpoint.env
          python3 - <<'PY'
          import json
          r=json.load(open('result.json'))
          assert r['status']=='committed_verified'
          assert r['source_sha256']==open('source.sha').read().strip()
          assert r['created']==85 and r['source_snapshots_refreshed']==0 and r['unchanged']==0
          assert r['missingIds']==[] and r['verified_bridges']==85
          assert r['canonical_profiles_overwritten']==0 and r['legacy_writes']==0 and r['supplier_calls']==0
          PY
          printf 'state=verified\n' > checkpoint.env
          sha256sum plan-first.json plan-second.json result.json checkpoint.env > result.sha256
          REMOTE
          rc=$?
          set -e
          for f in checkpoint.env plan-first.json plan-second.json result.json result.sha256; do
            scp "${opts[@]}" "$remote:$path/$f" "evidence/$f" || true
          done
          cp retained/reservation.json evidence/reservation.json
          printf '{"ssh_exit":%s,"noReplay":true}\n' "$rc" > evidence/transport-result.json
          test "$rc" = 0
          (cd evidence && sha256sum -c result.sha256)
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/result.json'))
          assert r['status']=='committed_verified' and r['created']==85 and r['verified_bridges']==85
          print(json.dumps({'status':r['status'],'created':r['created'],'verified_bridges':r['verified_bridges'],'supplier_calls':r['supplier_calls']},sort_keys=True))
          PY
      - name: Retain terminal result / checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-live24h-seed-result-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
