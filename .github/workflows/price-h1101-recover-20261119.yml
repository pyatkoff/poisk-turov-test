name: Recover exact partial PRICE operation for hotel 1101
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price-h1101-recover-20261119.yml']
permissions:
  contents: read
  issues: read
  actions: read
jobs:
  recover:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '024f73f244801c98c8daaa253c8cb4a7f4ed72cd'
