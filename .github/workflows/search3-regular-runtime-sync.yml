name: Search3 regular runtime sync

on:
  push:
    branches:
      - 'fix/search3-regular-flight-badge-20260918'
    paths:
      - '.github/workflows/search3-regular-runtime-sync.yml'

permissions:
  contents: write

concurrency:
  group: search3-regular-runtime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Regenerate exact shared runtime
        run: |
          set -euo pipefail
          node scripts/build/search3-js/shared-runtime.cjs --write
          test "$(sha256sum v2/search3-shared-runtime.json | awk '{print $1}')" = "5e6767ad294b268294a71b5f19ecb29986edba0ca5a93efadeb03eadacb1c6d9"
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "v2/search3-shared-runtime.json"
      - name: Commit generated runtime only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/search3-shared-runtime.json
          git diff --cached --quiet && exit 1
          git commit -m "BUILD: sync scoped Search3 shared runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
