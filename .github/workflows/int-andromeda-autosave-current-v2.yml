name: INT read current Andromeda autosave state v2

on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/int-andromeda-autosave-current-v2.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.event.pull_request.head.ref == 'diag/int-andromeda-autosave-current-20260918-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d8a11376535f6ea44ba0e83694a449fa54f84ab1
          path: runtime
          persist-credentials: false

      - name: Build fresh read-only audit from exact installed source pins
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          python3 - <<'PY'
          import hashlib,pathlib,re,os
          control=pathlib.Path('control/scripts/diagnostics/andromeda_autosave_state_readonly_v1.php')
          text=control.read_text(encoding='utf-8')
          source='d8a11376535f6ea44ba0e83694a449fa54f84ab1'
          files={
            'app/integrations/andromeda-anytour-offer-autosave.php':pathlib.Path('runtime/app/integrations/andromeda-anytour-offer-autosave.php'),
            'app/integrations/three-provider-money-facts.php':pathlib.Path('runtime/app/integrations/three-provider-money-facts.php'),
            'api-andromeda-search3-preview.php':pathlib.Path('runtime/v2/api-andromeda-search3-preview.php'),
          }
          hashes={k:hashlib.sha256(v.read_bytes()).hexdigest() for k,v in files.items()}
          text=re.sub(r"const ANYTOUR_ANDROMEDA_AUTOSAVE_SOURCE_SHA = '[0-9a-f]{40}';",
                      "const ANYTOUR_ANDROMEDA_AUTOSAVE_SOURCE_SHA = '"+source+"';",text)
          for rel,digest in hashes.items():
              pat=re.escape("'"+rel+"'") + r"\s*=>\s*'[0-9a-f]{64}'"
              repl="'"+rel+"' => '"+digest+"'"
              text,n=re.subn(pat,repl,text)
              if n!=1: raise SystemExit('pin_replace_failed:'+rel+':'+str(n))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit/current.php'
          out.write_text(text,encoding='utf-8')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'audit/pins.txt').write_text(
              source+'\n'+'\n'.join(k+' '+v for k,v in sorted(hashes.items()))+'\n',encoding='utf-8')
          print(hashes)
          PY
          php -l "$RUNNER_TEMP/audit/current.php"

      - name: Run read-only audit against current installed provider runtime
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ssh/key"; chmod 600 "$RUNNER_TEMP/ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes             -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null             -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2             "$REMOTE_USER@$HOST" 'php -d display_errors=0 -d log_errors=0'             < "$RUNNER_TEMP/audit/current.php" > "$RUNNER_TEMP/audit/result.json"
          test -s "$RUNNER_TEMP/audit/result.json"

      - name: Classify current state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'audit/result.json'
          d=json.loads(p.read_text())
          assert d['published_source_sha']=='d8a11376535f6ea44ba0e83694a449fa54f84ab1'
          assert d['runtime_hashes_verified'] is True
          for key in ('filesystem_writes','supplier_calls','db_writes','booking_calls','lead_calls'):
              assert d[key]==0,(key,d[key])
          cp=d['checkpoints']; co=d['cohorts']; db=d['database']
          if db['andromeda_current_ready_rows']>0:
              assessment='current_andromeda_offers_present'
          elif cp['post_publish_total']>0 and cp['post_publish_ready_offer_sum']>0 and db['andromeda_post_publish_completed_refreshes']>0:
              assessment='andromeda_autosave_published_but_rows_expired'
          elif co['post_publish_first_page_total']==0:
              assessment='no_post_publish_search'
          elif co['post_publish_complete_total']==0:
              assessment='no_complete_cohort'
          elif co['post_publish_owned_offer_total']==0:
              assessment='only_other_provider_operators'
          elif co['post_publish_owned_offer_with_complete_surcharge_total']==0:
              assessment='missing_saved_party_surcharge'
          elif cp['post_publish_total']==0:
              assessment='ready_cohort_without_autosave_checkpoint'
          elif db['andromeda_post_publish_completed_refreshes']==0:
              assessment='autosave_checkpoint_without_db_refresh'
          else:
              assessment='narrower_diagnosis_needed'
          d['assessment']=assessment
          p.write_text(json.dumps(d,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('assessment='+assessment)
          print('checkpoint_total='+str(cp['post_publish_total']))
          print('checkpoint_ready_sum='+str(cp['post_publish_ready_offer_sum']))
          print('complete_cohorts='+str(co['post_publish_complete_total']))
          print('owned_offers='+str(co['post_publish_owned_offer_total']))
          print('owned_surcharge_ready='+str(co['post_publish_owned_offer_with_complete_surcharge_total']))
          print('andromeda_rows_total='+str(db['andromeda_offer_rows_total']))
          print('andromeda_current_ready='+str(db['andromeda_current_ready_rows']))
          print('andromeda_completed_refreshes='+str(db['andromeda_completed_refreshes_total']))
          PY

      - name: Classify post-publish incomplete cohort gaps
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes             -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null             -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2             "$REMOTE_USER@$HOST" 'php -d display_errors=0 -d log_errors=0'             > "$RUNNER_TEMP/audit/cohort-gaps.json" <<'PHP'
          <?php
          declare(strict_types=1);
          error_reporting(0);
          $published=1789658123;
          $home=rtrim((string)getenv('HOME'),'/');
          $dir=$home.'/.anytoour-andromeda/searches';
          if($home===''||!is_dir($dir)||is_link($dir))exit(2);
          $read=static function(string $p,int $max=3000000):?array{
              if(is_link($p)||!is_file($p))return null;
              $n=filesize($p);if(!is_int($n)||$n<2||$n>$max)return null;
              try{$v=json_decode((string)file_get_contents($p),true,64,JSON_THROW_ON_ERROR);return is_array($v)?$v:null;}
              catch(Throwable){return null;}
          };
          $counts=[
            'post_first'=>0,'first_rejected'=>0,'zero_pages_with_offers'=>0,'missing_page'=>0,
            'invalid_page'=>0,'page_rejected'=>0,'pages_regressed'=>0,'complete'=>0,
            'auth_missing'=>0,'auth_created_mismatch'=>0,'auth_valid'=>0,
            'first_status_complete'=>0,'first_status_partial'=>0,'other_first_status'=>0,
          ];
          $missingAt=[];$advertised=[];$latest=[];
          foreach(new DirectoryIterator($dir) as $e){
              if($e->isDot()||$e->isLink()||!$e->isFile())continue;
              if(!preg_match('/\A([a-f0-9]{64})-1\.json\z/D',$e->getFilename(),$m))continue;
              $ref=$m[1];$first=$read($e->getPathname());if(!is_array($first)||!is_array($first['store']??null))continue;
              $created=$first['store']['created_at']??null;if(!is_int($created)||$created<$published)continue;
              ++$counts['post_first'];
              $status=$first['status']??null;
              if($status==='complete')++$counts['first_status_complete'];elseif($status==='partial')++$counts['first_status_partial'];else ++$counts['other_first_status'];
              $snap=$first['store']['snapshot']??null;
              if(!is_array($snap)||($snap['provider']??null)!=='andromeda'||($snap['search_ref']??null)!==$ref||!is_int($first['generation']??null)
                ||($snap['generation']??null)!==$first['generation']||($snap['page']??null)!==1||!is_int($snap['pages_count']??null)
                ||!is_array($snap['offers']??null)||!is_array($snap['rejected']??null)){++$counts['invalid_page'];continue;}
              $target=$snap['pages_count'];
              $advertised[(string)$target]=($advertised[(string)$target]??0)+1;
              $auth=$read($dir.'/'.$ref.'-auth.json',65536);
              if(!is_array($auth)){++$counts['auth_missing'];}
              elseif(($auth['created_at']??null)!==$created){++$counts['auth_created_mismatch'];}
              else{++$counts['auth_valid'];}
              if($snap['rejected']!==[]){++$counts['first_rejected'];$latest['first_rejected']=max($latest['first_rejected']??0,$created);continue;}
              if($target===0&&$snap['offers']!==[]){++$counts['zero_pages_with_offers'];continue;}
              $reason=null;
              for($page=2;$page<=$target&&$page<=1000;++$page){
                  $path=$dir.'/'.$ref.'-'.$created.'-'.$page.'.json';
                  if(!is_file($path)||is_link($path)){$reason='missing_page';$missingAt[(string)$page]=($missingAt[(string)$page]??0)+1;break;}
                  $state=$read($path);$s=is_array($state)?($state['store']['snapshot']??null):null;
                  if(!is_array($state)||!is_array($s)||($state['search_ref']??null)!==$ref||($state['generation']??null)!==$first['generation']
                    ||($s['provider']??null)!=='andromeda'||($s['search_ref']??null)!==$ref||($s['generation']??null)!==$first['generation']
                    ||($s['page']??null)!==$page||!is_int($s['pages_count']??null)||!is_array($s['rejected']??null)){$reason='invalid_page';break;}
                  if($s['rejected']!==[]){$reason='page_rejected';break;}
                  if($s['pages_count']<$page){$reason='pages_regressed';break;}
                  $target=max($target,$s['pages_count']);
              }
              if($reason===null){++$counts['complete'];$reason='complete';}
              else ++$counts[$reason];
              $latest[$reason]=max($latest[$reason]??0,$created);
          }
          ksort($advertised,SORT_NATURAL);ksort($missingAt,SORT_NATURAL);ksort($latest,SORT_STRING);
          echo json_encode(['counts'=>$counts,'advertised_pages'=>$advertised,'missing_at_page'=>$missingAt,'latest_created_at'=>$latest,
            'filesystem_writes'=>0,'supplier_calls'=>0,'db_writes'=>0],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
          PHP
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/audit/cohort-gaps.json'
          d=json.load(open(p))
          assert d['filesystem_writes']==d['supplier_calls']==d['db_writes']==0
          assert d['counts']['post_first']==15,d
          print(json.dumps(d,sort_keys=True))
          PY

      - name: Upload sanitized state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-autosave-current-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/audit/
          if-no-files-found: warn
          retention-days: 14
