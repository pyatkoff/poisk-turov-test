name: MATCH refresh55 safe26 acceptance v1
on:
  push:
    branches: [ops/match-refresh55-safe26-accept-1971-20260919-v1]
    paths:
      - scripts/diagnostics/hotel_match_refresh55_safe26_accept_helpers_v1.php
      - scripts/diagnostics/hotel_match_refresh55_safe26_accept_v1.php
      - .github/workflows/hotel-match-refresh55-safe26-accept-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-refresh55-safe26-accept-1971-20260919-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-refresh55-safe26-accept-1971-20260919-v1
  BASE_SHA: 93915088f169716d89e2e6426d6d8700dbcf0416
  CLAIM: '5745018704'
jobs:
  accept:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate isolated source, claim and exact CURRENT review
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation terminal
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA..HEAD" | sort)" = "$(printf '%s\n' '.github/workflows/hotel-match-refresh55-safe26-accept-v1.yml' 'scripts/diagnostics/hotel_match_refresh55_safe26_accept_helpers_v1.php' 'scripts/diagnostics/hotel_match_refresh55_safe26_accept_v1.php' | sort)"
          php -l scripts/diagnostics/hotel_match_refresh55_safe26_accept_helpers_v1.php
          php -l scripts/diagnostics/hotel_match_refresh55_safe26_accept_v1.php
          php scripts/diagnostics/hotel_match_refresh55_safe26_accept_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert os.environ['OPERATION_ID'] in b and '10591517115' in b and '26 safe candidates' in b and 'Max26' in b and 'Provider calls0' in b
          PY
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10591517115/zip >input/current.zip
          python3 - <<'PY'
          import hashlib,zipfile,pathlib,json
          p=pathlib.Path('input/current.zip');assert hashlib.sha256(p.read_bytes()).hexdigest()=='389b97a73c9e668fd36bf41d23bd62f0eb990faa1db79c2cad82a64203f171f7'
          with zipfile.ZipFile(p) as z:b=z.read('result.json')
          assert hashlib.sha256(b).hexdigest()=='3144fbbfe9a886bb94954d8a12147119172f570285ae7622edf2ffb8ed16657a'
          r=json.loads(b);assert r['state']=='completed_read_only' and r['safe_candidate_count']==26 and r['state_counts']=={'safe_candidate':26,'hold':6}
          assert r['provider_calls']==r['database_writes']==r['mapping_writes']==0 and all(x['safe_to_write_now'] is False for x in r['rows'])
          pathlib.Path('input/current.json').write_bytes(b)
          PY
      - name: Reserve before DB write
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,datetime
          r={'operation':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_write','reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'current_sha256':'3144fbbfe9a886bb94954d8a12147119172f570285ae7622edf2ffb8ed16657a','max_mapping_writes':26,'provider_calls':0,'no_replay':True}
          open('reservation/reservation.json','x').write(json.dumps(r,sort_keys=True)+'\n')
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
           q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
           with urllib.request.urlopen(q) as f:r=json.load(f)['workflow_runs']
           xs=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
           if xs and max(xs,key=lambda z:z['id'])['status']=='completed':assert max(xs,key=lambda z:z['id'])['conclusion']=='success';break
           time.sleep(5)
          else:raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'refresh55-safe26-reservation-${{ github.run_id }}', path: reservation/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Execute guarded SERIALIZABLE append
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key" >/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null;test -s "$known"
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json input/current.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_refresh55_safe26_accept_helpers_v1.php scripts/diagnostics/hotel_match_refresh55_safe26_accept_v1.php app/integrations/andromeda-hotel-resolver.php app/integrations/anex-search-mapping-registry.php "$remote:$op/payload/"
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_INPUT_PATH=\"\$HOME/$op/payload/current.json\" MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=1 -d zend.exception_ignore_args=1 -d error_log=\"\$HOME/$op/bootstrap-errors.log\" \"\$HOME/$op/payload/hotel_match_refresh55_safe26_accept_v1.php\"" >terminal/stdout.json 2>terminal/stderr.txt
          rc=$?;printf '%s\n' "$rc">terminal/remote-exit.txt
          ssh "${opts[@]}" "$remote" 'set -eu;cd "$HOME/'"$op"'";set -- reservation.json;for f in capture.json plan.json pre-commit.json result.json receipt.json bootstrap-errors.log;do test ! -f "$f" || set -- "$@" "$f";done;tar -czf - -- "$@"' >terminal/server.tgz 2>>terminal/stderr.txt
          trc=$?;printf '%s\n' "$trc">terminal/tar-exit.txt;set -e;test "$rc" -eq 0;test "$trc" -eq 0
      - name: Verify committed delta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib,os
          p=pathlib.Path('terminal');s=p/'server';s.mkdir(exist_ok=True)
          with tarfile.open(p/'server.tgz','r:gz') as t:
           seen=set()
           for m in t.getmembers():
            assert m.isfile() and m.name not in seen and m.size<32_000_000;seen.add(m.name);(s/m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open(s/'result.json'));q=json.load(open(s/'receipt.json'))
          assert r['operation']==q['operation']==os.environ['OPERATION_ID'] and r['state']==q['state']=='committed_verified' and r['readback_verified'] is True
          assert q['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest() and 0<r['written_count']<=26 and r['written_count']+r['skipped_count']==26
          assert r['database_writes']==r['mapping_writes']==r['accepted_delta']==r['unique_samo_local_delta']==r['triple_delta']==r['written_count'] and r['provider_calls']==0
          assert len(r['written'])==r['written_count'] and len({x['tv_hotel_id'] for x in r['written']})==r['written_count']
          print(json.dumps({k:r[k] for k in ['written_count','skipped_count','accepted_delta','triple_delta','prior_identities_preserved']},ensure_ascii=False))
          PY
          test "$(cat terminal/remote-exit.txt)" -eq 0;test "$(cat terminal/tar-exit.txt)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-refresh55-safe26-accept-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
