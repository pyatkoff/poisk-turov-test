name: MATCH Side4 token alias v11 CI
'on':
  pull_request:
    paths:
      - scripts/diagnostics/hotel_match_tv_samo_side4_token_alias_v11.php
      - tests/hotel_match_tv_samo_side4_token_alias_v11_test.php
      - .github/workflows/hotel-match-tv-samo-side4-token-alias-v11-ci.yml
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: php -l scripts/diagnostics/hotel_match_tv_samo_side4_token_alias_v11.php
      - run: php tests/hotel_match_tv_samo_side4_token_alias_v11_test.php
