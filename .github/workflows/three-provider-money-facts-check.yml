name: Three-provider money facts
on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-money-facts.php'
      - 'app/integrations/anex-additional-prices-client.php'
      - 'tests/three-provider-money-facts-test.php'
      - 'tests/anex-additional-prices-client-test.php'
      - '.github/workflows/three-provider-money-facts-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate money facts without network
        run: |
          php -l app/integrations/three-provider-money-facts.php
          php -l app/integrations/anex-additional-prices-client.php
          php -l tests/three-provider-money-facts-test.php
          php -l tests/anex-additional-prices-client-test.php
          php -d allow_url_fopen=0 tests/three-provider-money-facts-test.php
          php -d allow_url_fopen=0 tests/anex-additional-prices-client-test.php
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/integrations/three-provider-money-facts.php').read_text()
          assert "'package_buyer_price' => null" in src
          assert "'quote_price' => null" in src
          assert "'final_price_verified' => false" in src
          assert "'arithmetic_applied' => false" in src
          assert 'function withVerifiedQuote' in src
          assert "THREE_PROVIDER_MONEY_QUOTE_CAPABILITY" in src
          assert "self::moneyFact($packageBuyerPrice, false, 'andromeda', 'package')" in src
          assert "self::moneyFact($quotePrice, false, 'andromeda', 'quote')" in src
          assert "$next['final_price_verified'] = true" in src
          assert "$next['arithmetic_applied'] = false" in src
          assert "$source !== $provider . '_' . $expectedKind" in src
          assert "strpos($source" not in src
          assert "'tourvisor' => ['fuel' => true, 'additional' => false]" in src
          assert "'anex' => ['fuel' => false, 'additional' => true]" in src
          assert "'andromeda' => ['fuel' => false, 'additional' => false]" in src
          for forbidden in ('+ $fuel', '+$fuel', 'agency_cost', 'buyerClaimMoney', 'broninit', 'curl_', 'PDO'):
              assert forbidden not in src

          b2b=Path('app/integrations/anex-additional-prices-client.php').read_text()
          assert "https://api.anextour.ru/b2b/AdditionalPricesDaily" in b2b
          assert "User-Agent: TourismPlus" in b2b
          assert "Authorization: Bearer " in b2b
          assert "follow_redirects' => false" in b2b
          assert 'function additionalPricesDaily' in b2b
          for forbidden in ('final_price_verified', 'search_price_fuel_relation', 'arithmetic_applied', 'bron(', 'bron_ticket', 'PDO', 'mysqli_'):
              assert forbidden not in b2b
          print('Three-provider money static boundary: PASS')
          PY
