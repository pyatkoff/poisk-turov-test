name: Validate Search3 production rollback readiness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'scripts/deploy/search3_production_snapshot.py'
      - 'tests/search3_production_snapshot_test.py'
      - '.github/workflows/validate-search3-production-rollback.yml'
      - 'docs/project/search3-production-migration-runbook.md'
  push:
    branches:
      - release/search3-production-ready-v1
    paths:
      - 'scripts/deploy/search3_production_snapshot.py'
      - 'tests/search3_production_snapshot_test.py'
      - '.github/workflows/validate-search3-production-rollback.yml'
      - 'docs/project/search3-production-migration-runbook.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-drill:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || (github.head_ref != 'release/search3-production-ready-v1' && github.base_ref != 'release/search3-production-ready-v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate snapshot utility and isolated restore drill
        run: python3 tests/search3_production_snapshot_test.py
