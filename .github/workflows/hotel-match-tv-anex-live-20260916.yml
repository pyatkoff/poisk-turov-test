name: MATCH Tourvisor ANEX live identity reads 20260916
on:
  push:
    branches: [match/manual-live-review-queue-1971-20260914]
    paths: [.github/workflows/hotel-match-tv-anex-live-20260916.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-tv-anex-live-1971-20260916-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tv-anex-live-1971-20260916-v1
jobs:
  evidence:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify identity-read scope and pure tests before private access
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_tv_anex_live_20260916.php)" = f421ccbc9817cbf878e0c3d6a3b437f8227cc54b
          php -n -l scripts/diagnostics/hotel_match_tv_anex_live_20260916.php
          php -n scripts/diagnostics/hotel_match_tv_anex_live_20260916.php --self-test
          mkdir "$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          source=pathlib.Path('scripts/diagnostics/hotel_match_tv_anex_live_20260916.php').read_bytes()
          assert b'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in source
          assert not re.search(rb'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',source,re.I)
          assert source.count(b'curl_exec(')==1 and b'const TAL_CAP=40;' in source
          assert b'CURLOPT_FOLLOWLOCATION=>false' in source
          assert b"if($status===429)throw new RuntimeException('rate_limited')" in source
          assert b'https://api.tourvisor.ru/search/api/v1' in source
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(source).hexdigest(),'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_private_access','claim_comment_id':5703147864,'coordination_issue':2530,'queue_issue':1971,'no_replay':True,'database_writes':0,'mapping_writes':0,'credential_identifier':'TOURVISOR_ANEX_JWT','http_attempt_cap':40,'retry_attempts':0,'minimum_interval_seconds':5,'provider_daily_remaining':None,'preflight_result_sha256':'6b9369ebcc46c19844bc0a56d85be867ff4f8ce6d271b8bd037555a6cb23fb37'}
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          with p.open('x') as f: json.dump(r,f,sort_keys=True);f.write('\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tv-anex-live-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tv-anex-live-1971-20260916-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Collect new ANEX-only Tourvisor evidence with no retries
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=700 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_tv_anex_live_20260916.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"
          trc=$?
          set -e
          export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              members=t.getmembers();assert len(members)<=150 and sum(m.size for m in members)<=64000000
              seen=set()
              for m in members:
                  if m.isdir() and m.name in ('.','./'):continue
                  name=m.name.removeprefix('./')
                  assert m.isfile() and name not in seen and re.fullmatch(r'(?:reservation|result|receipt|current-query-plan|search-[14]|detail-[0-9]+|request-[0-9]{3}-(?:reservation|response))\.json',name)
                  seen.add(name);(s/name).write_bytes(t.extractfile(m).read())
          result=json.loads((s/'result.json').read_bytes());receipt=json.loads((s/'receipt.json').read_bytes())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert receipt['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          for r in (result,receipt):
              assert r['operation_id']==os.environ['OPERATION_ID'] and r['source_sha']==os.environ['GITHUB_SHA'] and r['no_replay'] is True and r['mapping_writes']==0
          assert receipt['readback_verified'] is True and result['database_writes']==result['booking_calls']==result['lead_calls']==result['andromeda_calls']==0
          attempts=result['tourvisor_http_attempts'];assert type(attempts) is int and 0<=attempts<=40
          assert len(result['request_results'])==attempts and receipt['tourvisor_http_attempts']==attempts
          for i,meta in enumerate(result['request_results'],1):
              reserved=json.loads((s/f'request-{i:03}-reservation.json').read_bytes())
              received=json.loads((s/f'request-{i:03}-response.json').read_bytes())
              assert meta==received and meta['sequence']==i and reserved['sequence']==i
              assert reserved['operation_id']==received['operation_id']==os.environ['OPERATION_ID']
              assert reserved['max_attempts']==1 and reserved['credential_identifier']=='TOURVISOR_ANEX_JWT'
              if meta['http_status'] in (401,403,429) or meta['curl_errno']!=0:assert i==attempts
          summary={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':result['state'],'reason':result.get('reason'),'result_sha256':receipt['result_sha256'],'readback_verified':True,'no_replay':True,'http_attempts':attempts,'direct_identities':result['direct_identities'],'prepared_direct_identities':result['prepared_direct_identities'],'mapping_writes':0,'remote_exit':int(os.environ['REMOTE_RC']),'tar_exit':int(os.environ['TAR_RC'])}
          (p/'workflow-readback.json').write_text(json.dumps(summary,sort_keys=True)+'\n');print(json.dumps(summary,sort_keys=True))
          assert result['state'] in ('completed_read_only','stopped_no_replay') and os.environ['TAR_RC']=='0'
          assert os.environ['REMOTE_RC']=='0' if result['state']=='completed_read_only' else os.environ['REMOTE_RC']=='2'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-anex-live-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tv-anex-live-1971-20260916-v1/
          if-no-files-found: warn
          retention-days: 90
