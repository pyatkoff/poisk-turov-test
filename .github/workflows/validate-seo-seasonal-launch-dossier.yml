name: Validate SEO seasonal launch dossier

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-seasonal-preview-launch-dossier-v1.php'
      - 'v2/data/report-seo-seasonal-preview-launch-dossier-v1.php'
      - 'v2/seo-seasonal-preview-opportunity-evidence-v1.php'
      - 'v2/seo-seasonal-preview-evidence-readiness-v1.php'
      - 'v2/seo-seasonal-preview-readiness-v1.php'
      - 'v2/data/evidence/seo-seasonal-manual-serp-*.json'
      - 'tests/seo-seasonal-preview-launch-dossier-smoke.php'
      - 'tests/seo-seasonal-preview-launch-dossier-cli-smoke.php'
      - '.github/workflows/validate-seo-seasonal-launch-dossier.yml'
  push:
    branches: [main]
    paths:
      - 'v2/seo-seasonal-preview-launch-dossier-v1.php'
      - 'v2/data/report-seo-seasonal-preview-launch-dossier-v1.php'
      - 'v2/seo-seasonal-preview-opportunity-evidence-v1.php'
      - 'v2/seo-seasonal-preview-evidence-readiness-v1.php'
      - 'v2/seo-seasonal-preview-readiness-v1.php'
      - 'v2/data/evidence/seo-seasonal-manual-serp-*.json'
      - 'tests/seo-seasonal-preview-launch-dossier-smoke.php'
      - 'tests/seo-seasonal-preview-launch-dossier-cli-smoke.php'
      - '.github/workflows/validate-seo-seasonal-launch-dossier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-dossier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact pair dossier and fail-closed gates
        run: |
          set -euo pipefail
          php -l v2/seo-seasonal-preview-launch-dossier-v1.php >/dev/null
          php -l v2/data/report-seo-seasonal-preview-launch-dossier-v1.php >/dev/null
          php -l tests/seo-seasonal-preview-launch-dossier-smoke.php >/dev/null
          php -l tests/seo-seasonal-preview-launch-dossier-cli-smoke.php >/dev/null
          php tests/seo-seasonal-preview-launch-dossier-smoke.php
          php tests/seo-seasonal-preview-launch-dossier-cli-smoke.php
