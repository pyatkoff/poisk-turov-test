name: Visual V2 post-deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/visual-v2-post-deploy.yml'
  workflow_run:
    workflows: ["Deploy V2 only"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-post-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-post-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit production V2 viewports
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          cat > ./v2-post-deploy-visual.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const url = process.env.V2_URL;
          const viewports = [
            ['mobile-375',375,812],
            ['mobile-430',430,932],
            ['tablet-768',768,1024],
            ['intermediate-1024',1024,900],
            ['desktop-1440',1440,1000],
          ];
          const fixture=[
            {id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,country:{name:'Турция'},region:{name:'Анталья'},subRegion:{name:'Лара'},tours:[
              {id:'tour-901-a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'},roomType:'Standard Sea View',placement:'DBL',operator:{name:'ANEX'},isCharter:true},
              {id:'tour-901-b',date:'12.09.2026',nights:9,price:142000,meal:{name:'Ультра всё включено'},roomType:'Deluxe',placement:'DBL',operator:{name:'PEGAS'}},
            ]},
            {id:902,name:'AnyTour Garden Hotel with a deliberately long responsive title',category:4,rating:4.4,seaDistance:650,price:98000,country:{name:'Турция'},region:{name:'Аланья'},tours:[
              {id:'tour-902-a',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'},roomType:'Family Room',placement:'2ADL',operator:{name:'Coral Travel'}},
            ]},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];
            let failed=false;
            for(const [name,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e).slice(0,500)));
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(5000);
              await page.screenshot({path:`visual-artifacts/${name}.png`,fullPage:true});
              const state=await page.evaluate(()=>{
                const root=document.documentElement,body=document.body;
                const hero=document.querySelector('.v2-product-hero');
                const header=document.querySelector('.at-site-header');
                const search=document.querySelector('.search-card');
                const visible=el=>!!el&&!el.hidden&&getComputedStyle(el).display!=='none';
                const offenders=[...document.querySelectorAll('body *')].filter(el=>{
                  const r=el.getBoundingClientRect();
                  return r.right>innerWidth+2||r.left<-2;
                }).slice(0,20).map(el=>({tag:el.tagName,id:el.id||'',class:String(el.className||'').slice(0,120),right:Math.round(el.getBoundingClientRect().right),x:Math.round(el.getBoundingClientRect().x)}));
                return {
                  overflow:root.scrollWidth>root.clientWidth+2||body.scrollWidth>root.clientWidth+2,
                  offenders,
                  heroVisible:visible(hero),
                  headerVisible:visible(header),
                  searchVisible:visible(search),
                  resultsInitiallyVisible:visible(document.querySelector('#resultsTools'))||!!document.querySelector('#results .hotel-card'),
                  selectedInitiallyVisible:visible(document.querySelector('#selectedTour')),
                  heroBox:hero?{w:Math.round(hero.getBoundingClientRect().width),h:Math.round(hero.getBoundingClientRect().height)}:null,
                  headerBox:header?{w:Math.round(header.getBoundingClientRect().width),h:Math.round(header.getBoundingClientRect().height)}:null
                };
              });
              const resultState=await page.evaluate(fixture=>{
                if(!window.V2Results||typeof window.V2Results.render!=='function')return{renderer:false};
                window.V2Results.render(fixture);
                const root=document.documentElement,body=document.body,cards=[...document.querySelectorAll('#results .hotel-card')],multi=cards.find(card=>card.dataset.hotelId==='901'),tools=document.querySelector('#resultsTools'),bar=document.querySelector('.mrf-bar');
                return {
                  renderer:true,
                  cards:cards.length,
                  toolsVisible:!!tools&&!tools.hidden&&getComputedStyle(tools).display!=='none',
                  decisionFacts:multi?multi.querySelectorAll('.hotel-decision-line span').length:0,
                  bestOffer:!!multi?.querySelector('.hotel-best-offer'),
                  tourRows:multi?multi.querySelectorAll('.tour-row').length:0,
                  moreToggle:!!multi?.querySelector('.tour-more-toggle'),
                  mobileFilterVisible:!!bar&&!bar.hidden&&getComputedStyle(bar).display!=='none',
                  overflow:root.scrollWidth>root.clientWidth+2||body.scrollWidth>root.clientWidth+2,
                };
              },fixture);
              await page.waitForTimeout(150);
              await page.screenshot({path:`visual-artifacts/${name}-results.png`,fullPage:true});
              const item={name,width,height,http:response?response.status():0,pageErrors,state,resultState};
              report.push(item);
              const resultBad=!resultState.renderer||resultState.cards!==2||!resultState.toolsVisible||resultState.decisionFacts<2||!resultState.bestOffer||resultState.tourRows!==1||!resultState.moreToggle||(width<=760&&!resultState.mobileFilterVisible)||(width>760&&resultState.mobileFilterVisible)||resultState.overflow;
              if(item.http!==200||pageErrors.length||state.overflow||!state.heroVisible||!state.headerVisible||!state.searchVisible||state.resultsInitiallyVisible||state.selectedInitiallyVisible||resultBad)failed=true;
              console.log(`VISUAL ${name} http=${item.http} overflow=${state.overflow}/${resultState.overflow} hero=${state.heroVisible} header=${state.headerVisible} search=${state.searchVisible} results=${resultState.cards}/${resultState.tourRows} more=${resultState.moreToggle} mrf=${resultState.mobileFilterVisible} pageErrors=${pageErrors.length}`);
              if(state.offenders.length)console.log(`OFFENDERS ${name} ${JSON.stringify(state.offenders)}`);
              await context.close();
            }
            fs.writeFileSync('visual-artifacts/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./v2-post-deploy-visual.cjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-post-deploy-visual
          path: visual-artifacts/
          retention-days: 14
