name: Collect AnyTour hotel details

on:
  pull_request:
    branches: [main, release/search3-production-ready-v1]
    paths:
      - 'v2/data/tourvisor-client-v1.php'
      - 'v2/data/hotel-details-v1.php'
      - 'v2/data/migrate-hotel-details-v1.php'
      - 'v2/data/collect-hotel-details-v1.php'
      - 'tests/hotel-details-smoke.php'
      - '.github/workflows/collect-hotel-details.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/tourvisor-client-v1.php'
      - 'v2/data/hotel-details-v1.php'
      - 'v2/data/migrate-hotel-details-v1.php'
      - 'v2/data/collect-hotel-details-v1.php'
      - 'tests/hotel-details-smoke.php'
      - '.github/workflows/collect-hotel-details.yml'
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      candidate_scope:
        description: 'Hotel acquisition universe: demand (default) or canonical'
        required: true
        default: 'demand'
        type: choice
        options: [demand, canonical]
      limit:
        description: 'Maximum unique hotel IDs to enrich in this run (1-3000)'
        required: true
        default: '3000'
        type: string
      fresh_days:
        description: 'Skip hotel descriptions refreshed within this many days (1-365)'
        required: true
        default: '30'
        type: string
      min_interval_ms:
        description: 'Minimum interval between hotel API calls'
        required: true
        default: '550'
        type: string
      max_attempts:
        description: 'Maximum HTTP attempts per selected hotel (1-4)'
        required: true
        default: '1'
        type: string
      http_budget:
        description: 'Hard per-run worst-case HTTP attempt budget (1-3000)'
        required: true
        default: '3000'
        type: string

concurrency:
  group: anytour-hotel-details-collector
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate quota-safe hotel enrichment tooling
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/tourvisor-client-v1.php >/dev/null
          php -l v2/data/hotel-details-v1.php >/dev/null
          php -l v2/data/migrate-hotel-details-v1.php >/dev/null
          php -l v2/data/collect-hotel-details-v1.php >/dev/null
          php -l tests/hotel-details-smoke.php >/dev/null
          php tests/hotel-details-smoke.php
          grep -Fq "v2_data_tv_get('/hotels/' . \$hotelId)" v2/data/collect-hotel-details-v1.php
          grep -Fq 'tour_price_observations' v2/data/collect-hotel-details-v1.php
          grep -Fq 'hot_tours_current' v2/data/collect-hotel-details-v1.php
          grep -Fq "namespace='legacy_catalog'" v2/data/collect-hotel-details-v1.php
          grep -Fq "v2_hotel_detail_candidate_scope(hotel_details_arg(\$argv, 'candidate-scope', 'demand'))" v2/data/collect-hotel-details-v1.php
          grep -Fq "hotel_details_int(\$argv, 'http-budget', 3000, 1, 3000)" v2/data/collect-hotel-details-v1.php
          grep -Fq "hotel_details_int(\$argv, 'max-attempts', 1, 1, 4)" v2/data/collect-hotel-details-v1.php
          grep -Fq 'v2_hotel_detail_is_generic_product_name' v2/data/collect-hotel-details-v1.php
          grep -Fq 'TOURVISOR_HTTP_MAX_ATTEMPTS' v2/data/tourvisor-client-v1.php
          echo ANYTOUR_HOTEL_DETAILS_TOOLING_OK

  collect-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Enrich selected hotel acquisition universe within explicit request budget
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          SCOPE_VALUE: ${{ inputs.candidate_scope || 'demand' }}
          LIMIT_VALUE: ${{ inputs.limit || '3000' }}
          FRESH_DAYS_VALUE: ${{ inputs.fresh_days || '30' }}
          INTERVAL_VALUE: ${{ inputs.min_interval_ms || '550' }}
          MAX_ATTEMPTS_VALUE: ${{ inputs.max_attempts || '1' }}
          HTTP_BUDGET_VALUE: ${{ inputs.http_budget || '3000' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          test "$SCOPE_VALUE" = demand || test "$SCOPE_VALUE" = canonical
          [[ "$LIMIT_VALUE" =~ ^[0-9]+$ ]] && [[ "$FRESH_DAYS_VALUE" =~ ^[0-9]+$ ]] && [[ "$INTERVAL_VALUE" =~ ^[0-9]+$ ]]
          [[ "$MAX_ATTEMPTS_VALUE" =~ ^[0-9]+$ ]] && [[ "$HTTP_BUDGET_VALUE" =~ ^[0-9]+$ ]]
          test "$LIMIT_VALUE" -ge 1 && test "$LIMIT_VALUE" -le 3000
          test "$FRESH_DAYS_VALUE" -ge 1 && test "$FRESH_DAYS_VALUE" -le 365
          test "$INTERVAL_VALUE" -ge 500 && test "$INTERVAL_VALUE" -le 5000
          test "$MAX_ATTEMPTS_VALUE" -ge 1 && test "$MAX_ATTEMPTS_VALUE" -le 4
          test "$HTTP_BUDGET_VALUE" -ge 1 && test "$HTTP_BUDGET_VALUE" -le 3000
          test $(( LIMIT_VALUE * MAX_ATTEMPTS_VALUE )) -le "$HTTP_BUDGET_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          scp "${opts[@]}" \
            v2/data/db-v1.php \
            v2/data/tourvisor-client-v1.php \
            v2/data/hotel-details-v1.php \
            v2/data/migrate-hotel-details-v1.php \
            v2/data/collect-hotel-details-v1.php \
            v2/data/build-seo-offer-snapshots-v1.php \
            "$remote:$remote_dir/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru/data\"
            php -l \"\$root/collect-hotel-details-v1.php\" >/dev/null
            php \"\$root/migrate-hotel-details-v1.php\"
            php \"\$root/collect-hotel-details-v1.php\" --candidate-scope='$SCOPE_VALUE' --limit='$LIMIT_VALUE' --fresh-days='$FRESH_DAYS_VALUE' --min-interval-ms='$INTERVAL_VALUE' --max-attempts='$MAX_ATTEMPTS_VALUE' --http-budget='$HTTP_BUDGET_VALUE'
            php \"\$root/build-seo-offer-snapshots-v1.php\" --fresh-hours=72 --expires-hours=72 --offers-per-page=10
          "
