name: MATCH old Tourvisor JWT stage probe v3
on:
  push:
    branches: [match/manual-live-review-queue-1971-20260914]
    paths:
      - 'scripts/diagnostics/hotel_match_old_tv_jwt_stage_probe.php'
      - '.github/workflows/hotel-match-old-tv-jwt-stage-probe-v3.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-old-tv-jwt-stage-probe-1971-20260914-v3
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-old-tv-jwt-stage-probe-1971-20260914-v3-2026-10-30
  MATCH_DATE: '2026-10-30'
  OUT: /tmp/match-old-tv-jwt-stage-probe-v3
jobs:
  probe:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build deterministic v3 program and offline-check it
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,pathlib
          src=pathlib.Path('scripts/diagnostics/hotel_match_old_tv_jwt_stage_probe.php')
          p=src.read_text()
          old_boot="require_once tvpath($root);if(!function_exists('v2_data_tv_get'))throw new RuntimeException('client_missing');if(trim((string)(getenv('TOURVISOR_JWT')?:''))===''&&!(defined('TOURVISOR_JWT')&&trim((string)TOURVISOR_JWT)!==''))throw new RuntimeException('tourvisor_jwt_missing');"
          new_boot="require_once tvpath($root);if(!function_exists('v2_data_tv_get'))throw new RuntimeException('client_missing');"
          assert p.count(old_boot)==1, p.count(old_boot)
          p=p.replace(old_boot,new_boot,1)
          old_search="$s=tv('search_start','/tours/search',['departureId'=>$dep['id'],'countryId'=>$country['id'],'dateFrom'=>$date,'dateTo'=>$date,'nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'operatorIds'=>[$anex['id']],'currency'=>'RUB']);"
          new_search="$s=tv('search_start','/tours/search',['departureId'=>$dep['id'],'countryId'=>$country['id'],'dateFrom'=>$date,'dateTo'=>$date,'nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'operatorIds'=>[$anex['id']],'currency'=>'RUB','onlyCharter'=>false]);"
          assert p.count(old_search)==1, p.count(old_search)
          p=p.replace(old_search,new_search,1)
          assert "'onlyCharter'=>false" in p
          program=pathlib.Path('/tmp/match-old-tv-jwt-stage-probe-v3/program.php')
          program.write_text(p)
          pathlib.Path('/tmp/match-old-tv-jwt-stage-probe-v3/program-sha256.txt').write_text(hashlib.sha256(p.encode()).hexdigest()+'\n')
          PY
          php -l "$OUT/program.php"
          php "$OUT/program.php" --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' "$OUT/program.php"
          grep -Fq "'onlyCharter'=>false" "$OUT/program.php"
      - name: Run immutable server evidence probe
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ok=0
          for n in 1 2 3; do rm -f "$sock"; if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"; then ok=1; break; fi; sleep $((n*8)); done
          test "$ok" = 1
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' MATCH_DATE='$MATCH_DATE' php -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$OUT/program.php" > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"
          trc=$?
          set -e
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def load(n):
              try:return json.loads((out/n).read_text())
              except Exception:return {}
          reservation=load('reservation.json'); result=load('result.json'); receipt=load('receipt.json')
          rh=hashlib.sha256((out/'result.json').read_bytes()).hexdigest() if (out/'result.json').exists() else None
          ok=(result.get('status') in {'completed','blocked'} and result.get('credential_identifier')=='TOURVISOR_JWT'
              and reservation.get('state')=='reserved_before_supplier_access' and reservation.get('source_sha')==os.environ['GITHUB_SHA']
              and receipt.get('readback_verified') is True and receipt.get('result_sha256')==rh
              and result.get('database_writes')==0 and result.get('mapping_writes')==0)
          gate={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':ok,'status':result.get('status'),'blocked_stage':result.get('blocked_stage'),'reason':result.get('reason'),'sanitized_error':result.get('sanitized_error'),'tourvisor_calls':result.get('tourvisor_calls'),'strict_identity_count':result.get('strict_identity_count'),'anex_operator_rows':result.get('anex_operator_rows'),'flattened_rows':result.get('flattened_rows'),'remote_exit':int(os.environ['RC']),'tar_exit':int(os.environ['TRC']),'result_sha256':rh,'program_sha256':(out/'program-sha256.txt').read_text().strip(),'no_replay':True}
          (out/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-old-tv-jwt-stage-probe-v3-${{ github.run_id }}
          path: ${{ env.OUT }}/
          retention-days: 90
