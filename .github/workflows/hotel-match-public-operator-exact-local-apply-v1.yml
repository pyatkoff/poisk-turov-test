name: MATCH public operator exact-local apply v1
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths: [.github/workflows/hotel-match-public-operator-exact-local-apply-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-public-operator-exact-local-apply-1971-v1, cancel-in-progress: false}
env: {OPERATION_ID: hotel-match-public-operator-exact-local-apply-1971-20260917-v1}
jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify guarded writer and reserve
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/diagnostics/hotel_match_public_operator_exact_local_apply_v1.php
          test "$(git hash-object "$src")" = cb1f0d07b377fbc84c3c03453f46b63f63240c8c
          php -l "$src"
          php "$src" --self-test
          python3 - <<'PY'
          import json,os,pathlib,re
          s=pathlib.Path('scripts/diagnostics/hotel_match_public_operator_exact_local_apply_v1.php').read_text()
          assert 'SET TRANSACTION ISOLATION LEVEL SERIALIZABLE' in s
          assert 'FOR UPDATE' in s and 'post_commit_readback' in s
          assert s.count('UPDATE andromeda_hotel_identities SET') == 1
          assert not re.search(r'\b(?:INSERT|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',s,re.I)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; p.mkdir(mode=0o700)
          (p/'reservation.json').write_text(json.dumps({
            'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access',
            'run_id':os.environ['GITHUB_RUN_ID'],'claim_comment_id':5712452973,
            'source_blob':'cb1f0d07b377fbc84c3c03453f46b63f63240c8c',
            'preflight_result_sha256':'088b27b9306f6d2cfcf7afad0accfd03f362541e9c70fc9d92228c556c82465b',
            'supplier_namespace':'operator_342','external_hotel_id':'27835','andromeda_hotel_id':'2000073592','local_hotel_id':28649,'country_id':4,
            'operator_evidence_sha256':'eec3eadc1e4bd40710c7f9cdcac622cdd51ba57faa5e10d63c7b2c00d5652316',
            'andromeda_evidence_sha256':'6a368619ab60dfc489bea04a453eff2f1c8a30336437f442ca5b9f52f536442f',
            'no_replay':True,'max_database_writes':1,'max_mapping_writes':1,'supplier_calls':0,'tourvisor_calls':0
          },sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-public-operator-exact-local-apply-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-public-operator-exact-local-apply-1971-20260917-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Transaction-time guarded apply
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/diagnostics/hotel_match_public_operator_exact_local_apply_v1.php
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$src" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json precommit.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"
          trc=$?; set -e; export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'; s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
            assert sorted(t.getnames())==['precommit.json','receipt.json','reservation.json','result.json']
            for m in t.getmembers():
              assert m.isfile() and m.size<5_000_000
              (s/m.name).write_bytes(t.extractfile(m).read())
          r=json.loads((s/'result.json').read_bytes()); z=json.loads((s/'receipt.json').read_bytes()); q=json.loads((s/'precommit.json').read_bytes())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert z['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert r['state'] in ('completed_committed','completed_no_write')
          assert r['supplier_calls']==r['tourvisor_calls']==0 and q['no_replay'] is True
          if r['state']=='completed_committed':
            assert r['committed_count']==1 and r['database_writes']==1 and r['mapping_writes']==1 and r['post_commit_readback_verified'] is True
            rb=r['readback']; assert rb['supplier_namespace']=='operator_342' and rb['external_hotel_id']=='27835' and rb['andromeda_hotel_id']=='2000073592' and rb['local_hotel_id']==28649 and rb['decision_status']=='accepted'
          else:
            assert r['committed_count']==0 and r['database_writes']==0 and r['mapping_writes']==0
          assert os.environ['REMOTE_RC']==os.environ['TAR_RC']=='0'
          x={k:r.get(k) for k in ['operation_id','source_sha','state','committed_count','holds','post_pending_by_namespace','post_pending_total','post_commit_readback_verified','readback','completed_at_utc']}; x['result_sha256']=z['result_sha256']
          (p/'summary.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(x,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-public-operator-exact-local-apply-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-public-operator-exact-local-apply-1971-20260917-v1/
          if-no-files-found: warn
          retention-days: 90
