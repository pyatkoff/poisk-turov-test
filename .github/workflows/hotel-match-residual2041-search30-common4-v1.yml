name: MATCH residual2041 search30 common4 v1
on:
  push:
    branches: [ops/match-residual2041-search30-common4-1971-20260921-v1]
    paths:
      - scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php
      - scripts/diagnostics/hotel_match_residual2041_search30_provider_v1.py
      - scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py
      - .github/workflows/hotel-match-residual2041-search30-common4-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-residual2041-search30-common4-1971-20260921-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-residual2041-search30-common4-1971-20260921-v1
  BASE_SHA: 4b620405797e996eb3b6e02ae3d982fb2b7a1d6c
  CLAIM: '5752900052'
  PREDECESSOR_RUN: '35538830477'
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and owner claim
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation result/server
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          php -l scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php
          php scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php --self-test
          python3 -m py_compile scripts/diagnostics/hotel_match_residual2041_search30_provider_v1.py scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py
          python3 scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,subprocess
          want={'.github/workflows/hotel-match-residual2041-search30-common4-v1.yml','scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php','scripts/diagnostics/hotel_match_residual2041_search30_provider_v1.py','scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py'}
          got=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines());assert got==want,(got,want)
          c=json.load(open('input/claim.json'));assert c['user']['id']==226193297 and c['author_association']=='OWNER' and os.environ['OPERATION_ID'] in c['body']
          assert 'up to30 real hotelIds[]' in c['body'] and 'tariff_search_units' in c['body']
          PY
      - name: Wait for detail-only predecessor terminal
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['PREDECESSOR_RUN']
          for _ in range(480):
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(q) as f:r=json.load(f)
            if r['status']=='completed':print('PREDECESSOR_TERMINAL',r['conclusion']);break
            time.sleep(5)
          else:raise SystemExit('predecessor_not_terminal')
          PY
      - name: Download immutable inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          for id in 10608424651 10612519331 10614070651;do gh api "repos/pyatkoff/poisk-turov-test/actions/artifacts/$id/zip" >"input/$id.zip";done
          gh api "repos/pyatkoff/poisk-turov-test/actions/runs/$PREDECESSOR_RUN/artifacts" >input/pred-artifacts.json
          python3 - <<'PY'
          import json
          a=json.load(open('input/pred-artifacts.json'))['artifacts'];xs=[x for x in a if x['name'].startswith('match-residual-common4-detail-') and not x['expired']]
          assert len(xs)==1;open('input/pred-id','w').write(str(xs[0]['id']))
          PY
          gh api "repos/pyatkoff/poisk-turov-test/actions/artifacts/$(cat input/pred-id)/zip" >input/detail.zip
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib
          specs=[('10608424651.zip','server/result.json','census.json'),('10612519331.zip','server/result.json','reverse20.json'),('10614070651.zip','server/result.json','reverse21.json'),('detail.zip','server/result.json','detail.json')]
          for z,n,o in specs:
            with zipfile.ZipFile('input/'+z) as f:b=f.read(n)
            pathlib.Path('input/'+o).write_bytes(b)
          c=json.load(open('input/census.json'));a=json.load(open('input/reverse20.json'));b=json.load(open('input/reverse21.json'));d=json.load(open('input/detail.json'))
          assert c['operation_id']=='hotel-match-userseen-coverage-1971-20260920-v1' and c['coverage_active_nonexcluded']['total']==4562
          assert a['operation']=='hotel-match-reverse686-live-anex-batches-1971-20260920-v1' and a['input_count']==686
          assert b['operation']=='hotel-match-reverse110-live-anex-continuation-1971-20260921-v2' and b['input_count']==110 and b['call_counts']['search_start']==97 and b['continue_calls']==0
          assert d['operation']=='hotel-match-residual2041-common4-nonanex-detail-1971-20260921-v4' and d['search_calls']==d['continue_calls']==0
          PY
      - name: Reserve before server or provider
        run: |
          python3 - <<'PY'
          import json,os,datetime
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_server_provider','source_sha':os.environ['GITHUB_SHA'],'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'hotel_ids_max':30,'operator_filter':None,'max_continue_per_batch':2,'tariff_definition':'start+continue+flights','database_writes':0,'mapping_writes':0,'no_replay_after_provider_access':True}
          with open('reservation/reservation.json','x') as f:json.dump(r,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'search30-reservation-${{ github.run_id }}', path: reservation/reservation.json, retention-days: 90}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(90):
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(q) as f:xs=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
            if xs and max(xs,key=lambda x:x['id'])['status']=='completed':
              x=max(xs,key=lambda x:x['id']);assert x['conclusion']=='success',x;break
            time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Plan CURRENT and execute search30
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json input/{census,reverse20,reverse21,detail}.json scripts/diagnostics/hotel_match_residual2041_search30_{plan_v1.php,provider_v1.py,execute_v1.py} "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\""
          set +e
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_CENSUS_PATH=\"\$HOME/$op/payload/census.json\" MATCH_REVERSE20_PATH=\"\$HOME/$op/payload/reverse20.json\" MATCH_REVERSE21_PATH=\"\$HOME/$op/payload/reverse21.json\" MATCH_DETAIL_PATH=\"\$HOME/$op/payload/detail.json\" php \"\$HOME/$op/payload/hotel_match_residual2041_search30_plan_v1.php\" --execute >\"\$HOME/$op/plan.json\";PYTHONPATH=\"\$HOME/$op/payload\" ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_PLAN_PATH=\"\$HOME/$op/plan.json\" python3 \"\$HOME/$op/payload/hotel_match_residual2041_search30_execute_v1.py\" --execute" >result/remote.stdout 2>result/remote.stderr
          rc=$?;scp -r "${opts[@]}" "$remote:$op/." result/server/;trc=$?;set -e;printf '{"remote":%s,"readback":%s}\n' "$rc" "$trc">result/exit-codes.json;test "$trc" -eq 0
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path('result/server');plan=json.load(open(p/'plan.json'));r=json.load(open(p/'result.json'));q=json.load(open(p/'receipt.json'));dig=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert plan['operation']==r['operation']==q['operation']==os.environ['OPERATION_ID'] and q['result_sha256']==dig and r['database_writes']==r['mapping_writes']==r['samo_calls']==0
          assert all(1<=len(g['hotel_ids'])<=30 for g in plan['groups']) and r['action_counts'].get('tour_flights',0)==0
          assert r['state'] in ('completed_read_only','terminal_failed_no_replay')
          pathlib.Path('result/verified-summary.json').write_text(json.dumps({'plan_stats':plan['stats'],**{k:r.get(k) for k in ['state','reason','planned_groups','completed_batches','target_hotels','physical_http_attempts','tariff_search_units_after','action_counts','operator_detail_counts','link_state_counts']}},ensure_ascii=False,indent=2)+'\n')
          print(pathlib.Path('result/verified-summary.json').read_text())
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-search30-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
