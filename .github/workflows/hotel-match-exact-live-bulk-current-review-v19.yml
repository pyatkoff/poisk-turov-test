name: MATCH exact live bulk current review v19

on:
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-exact-live-bulk-1971-20260912-v19.arm']

permissions:
  contents: read
  issues: write

env:
  OPERATION_ID: hotel-match-exact-live-bulk-current-review-1971-20260912-v19b
  ARTIFACT_DIR: /tmp/match-exact-live-bulk-v19

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate arm and collector
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(cat .github/match-exact-live-bulk-1971-20260912-v19.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_exact_live_bulk_current_review_v19.php
          mkdir -m 700 -p "$ARTIFACT_DIR" /tmp/v15src
      - name: Rebuild 210 exact pairs from immutable v15 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for spec in \
            s01:10295065895 \
            s02:10293619755 \
            s03:10294232473 \
            s04:10294591875; do
            s="${spec%%:*}"; id="${spec##*:}"
            mkdir -p "/tmp/v15src/$s"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "/tmp/v15src/$s.zip"
            unzip -q "/tmp/v15src/$s.zip" -d "/tmp/v15src/$s"
          done
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/v15src'); agg={}
          for s in ('s01','s02','s03','s04'):
              r=json.loads((root/s/'result.json').read_text())
              for row in r['comparison']['exact_alias_pairs']['rows']:
                  a=row['anex']; d=row['andromeda']; key=(str(a['id']),str(d['id']))
                  rec=agg.setdefault(key,{'anex_id':str(a['id']),'anex_name':a['name'],'andromeda_id':str(d['id']),'andromeda_name':d['name'],'observations':[]})
                  ap=[x for x in a.get('price_candidates',[]) if isinstance(x,(int,float)) and x>10000]
                  dp=[x for x in d.get('price_candidates',[]) if isinstance(x,(int,float)) and x>10000]
                  rec['observations'].append({'slice':s,'anex_position':a.get('position'),'andromeda_position':d.get('position'),'anex_rub_price':ap[-1] if ap else None,'andromeda_rub_price':dp[-1] if dp else None,'alias_key':row.get('alias_key')})
          assert len(agg)==210, len(agg)
          out={'source_run_id':34682814570,'pairs':list(agg.values())}
          pathlib.Path('/tmp/match-exact-live-bulk-v19/pairs.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':'))+'\n')
          print('pairs',len(agg),'observations',sum(len(v['observations']) for v in agg.values()))
          PY
      - name: Establish SSH master
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess,time
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP']);key=rt/'match-v19-key';sock=rt/'match-v19.sock';known=rt/'match-v19-known';raw=os.environ['KEY_VALUE'].strip();key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600)
          common=['-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE']]
          ok=False
          for _ in range(3):
              try:sock.unlink()
              except FileNotFoundError:pass
              p=subprocess.run(['ssh','-M','-S',str(sock),'-fnNT','-o','ControlPersist=900']+common,text=True,capture_output=True,timeout=30)
              if p.returncode==0:
                  q=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],'cd "$HOME/www/anytoour.ru" && test -f config.php && printf MATCH_V19_OK'],text=True,capture_output=True,timeout=30)
                  if q.returncode==0 and q.stdout.strip()=='MATCH_V19_OK':ok=True;break
              time.sleep(2)
          if not ok: raise SystemExit('ssh preflight failed')
          PY
      - name: Persist immutable reservation before DB access
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);p=Path('scripts/diagnostics/hotel_match_exact_live_bulk_current_review_v19.php').read_bytes();pairs=(d/'pairs.json').read_bytes();r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','candidate_count':210,'program_sha256':hashlib.sha256(p).hexdigest(),'pairs_sha256':hashlib.sha256(pairs).hexdigest(),'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True};(d/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-exact-live-bulk-v19-${{ github.run_id }}-reserved
          path: |
            ${{ env.ARTIFACT_DIR }}/reservation.json
            ${{ env.ARTIFACT_DIR }}/pairs.json
          retention-days: 90
      - name: Execute CURRENT bulk review
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);sock=Path(os.environ['RUNNER_TEMP'])/'match-v19.sock';prog=Path('scripts/diagnostics/hotel_match_exact_live_bulk_current_review_v19.php');remote='/tmp/match_exact_live_bulk_v19.php'
          cp=subprocess.run(['scp','-o','ControlMaster=no','-o','ControlPath='+str(sock),str(prog),f"{os.environ['USER_VALUE']}@{os.environ['HOST_VALUE']}:{remote}"],text=True,capture_output=True,timeout=60)
          if cp.returncode!=0: raise SystemExit('scp failed')
          data=(d/'pairs.json').read_text()
          cmd=f'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M {remote}; rc=$?; rm -f {remote}; exit $rc'
          p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],cmd],input=data,text=True,capture_output=True,timeout=600)
          prefix='MATCH_EXACT_BULK_JSON:';line=next((z[len(prefix):] for z in reversed(p.stdout.splitlines()) if z.startswith(prefix)),None);out=json.loads(line) if line else {'status':'unknown','reason':'result_marker_missing','remote_exit':p.returncode,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True};out.update(run_id=int(os.environ['GITHUB_RUN_ID']),source_commit=os.environ['GITHUB_SHA']);(d/'result.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps({'status':out.get('status'),'counts':out.get('counts')},ensure_ascii=False))
          if out.get('status')!='completed': raise SystemExit(2)
          PY
      - name: Build receipt
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);p=d/'result.json';data=json.loads(p.read_text()) if p.exists() else {'status':'unknown'};raw=p.read_bytes() if p.exists() else b'';r={'operation_id':os.environ['OPERATION_ID'],'state':data.get('status','unknown'),'counts':data.get('counts'),'result_sha256':hashlib.sha256(raw).hexdigest(),'run_id':int(os.environ['GITHUB_RUN_ID']),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True};(d/'receipt.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-exact-live-bulk-v19-${{ github.run_id }}-result
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 90
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['ARTIFACT_DIR'])/'result.json';d=json.loads(p.read_text()) if p.exists() else {'status':'unknown'};body=f"MATCH #1971 exact-live bulk CURRENT review `{os.environ['OPERATION_ID']}`: **{d.get('status')}** / 210 unique ANEX↔Andromeda exact live pairs rebuilt directly from immutable v15 artifacts; counts `{d.get('counts')}`. Supplier/Tourvisor/DB/mapping writes 0. Run `{os.environ['GITHUB_RUN_ID']}`. Any acceptance requires a NEW guarded write operation with CURRENT re-read + post-COMMIT readback.";subprocess.run(['gh','issue','comment','1971','--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          PY
