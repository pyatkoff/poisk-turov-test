name: Validate V2 lead price contract
on:
  pull_request:
    paths:
      - 'v2/lead-price-v1.php'
      - 'scripts/ci/lead/validate-price.php'
      - '.github/workflows/validate-lead-price-v1.yml'
  push:
    branches: [main]
    paths:
      - 'v2/lead-price-v1.php'
      - 'scripts/ci/lead/validate-price.php'
      - '.github/workflows/validate-lead-price-v1.yml'
  workflow_dispatch:
concurrency:
  group: ci-validate-lead-price-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate price semantics
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/lead-price-v1.php
          php -l scripts/ci/lead/validate-price.php
          php scripts/ci/lead/validate-price.php
