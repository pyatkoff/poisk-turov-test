          diff -u "$RUNNER_TEMP/search3-production-before.sha256" "$RUNNER_TEMP/search3-production-after.sha256"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          evidence = {
              "schema_version": 2,
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "candidate_tree_sha": os.environ["CANDIDATE_TREE_SHA"],
              "candidate_subtree_sha": os.environ["CANDIDATE_SUBTREE_SHA"],
              "candidate_run_id": int(os.environ["EVIDENCE_RUN_ID"]),
              "candidate_run_attempt": int(os.environ["EVIDENCE_RUN_ATTEMPT"]),
              "evidence_artifact_id": int(os.environ["EVIDENCE_ARTIFACT_ID"]),
              "release_artifact_id": int(os.environ["RELEASE_ARTIFACT_ID"]),
              "route": os.environ["PREVIEW_URL"],
              "http_status": 200,
              "robots": "noindex,follow,max-image-preview:large",
              "metrika_counter": 0,
              "production_lead_delivery": False,
              "candidate_lead_probe_status": 403,
              "payload_file_count": 9,
              "control_file_count_deployed": 0,
              "rollback_backup_retained": True,
              "production_fingerprint_before_sha256": hashlib.sha256(
                  (root / "search3-production-before.sha256").read_bytes()
              ).hexdigest(),
              "production_fingerprint_after_sha256": hashlib.sha256(
                  (root / "search3-production-after.sha256").read_bytes()
              ).hexdigest(),
              "production_fingerprint_unchanged": True,
          }
          (root / "search3-deployment-evidence.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "SEARCH3_LIVE_PREVIEW_OK candidate=$CANDIDATE_SHA production_unchanged=1"

      - name: Roll back isolated preview after failure
