          KEY_PATH: ${{ steps.ssh.outputs.key_path }}
          KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts_path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$ ]]
          test -f "$KEY_PATH" && test ! -L "$KEY_PATH" && test -s "$KNOWN_HOSTS_PATH" && test ! -L "$KNOWN_HOSTS_PATH"
          opts=(-i "$KEY_PATH" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$USER@$HOST"
          timeout 120s ssh "${opts[@]}" "$remote" bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$CANDIDATE_SHA" "$RELEASE_ARTIFACT_ID" "$PAYLOAD_CHECKSUMS_SHA256" <<'REMOTE'
          set -euo pipefail
          run_id="$1"; run_attempt="$2"; candidate_sha="$3"; release_artifact_id="$4"; payload_sha="$5"
          root="$HOME/www/anytoour.ru"
          parent="$root/_preview/search3-candidate"
          target="$parent/poisk-turov"
          backup="$parent/.poisk-turov-backup-$run_id-$run_attempt"
          failed="$parent/.poisk-turov-failed-$run_id-$run_attempt"
          owner="$parent/.poisk-turov-owner"
          owner_backup="$parent/.poisk-turov-owner-backup-$run_id-$run_attempt"
          lock="$parent/.deploy-lock"
          case "$parent" in "$HOME/www/anytoour.ru/_preview/search3-candidate") ;; *) exit 50 ;; esac
          test -d "$root" && test ! -L "$root"
          test -d "$parent" && test ! -L "$parent"
          test "$(readlink -f "$parent")" = "$(readlink -f "$root")/_preview/search3-candidate"
          locked=0
          for _ in $(seq 1 15); do if mkdir "$lock" 2>/dev/null; then locked=1; break; fi; sleep 2; done
          test "$locked" -eq 1
          printf '%s\n' "$$" > "$lock/pid"
          trap 'rm -f "$lock/pid"; rmdir "$lock" 2>/dev/null || true' EXIT
          owns=0
          if test -f "$owner" && test ! -L "$owner"; then
            if php -r '$d=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);$ok=($d["candidate_sha"]??"")===$argv[2]&&($d["deploy_run_id"]??"")===$argv[3]&&($d["deploy_run_attempt"]??"")===$argv[4]&&($d["release_artifact_id"]??"")===$argv[5]&&($d["payload_checksums_sha256"]??"")===$argv[6];exit($ok?0:1);' "$owner" "$candidate_sha" "$run_id" "$run_attempt" "$release_artifact_id" "$payload_sha"; then owns=1; fi
          fi
          if test "$owns" -eq 1; then
            test -d "$target" && test ! -L "$target"
            test ! -e "$failed" && test ! -L "$failed"
            actual="$(find "$target" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            expected="$(printf '%s\n' index.php search3-entry-v1.css search3-entry-v1.js search3-results-cards-v2.css search3-results-cards-v2.js search3-results-filters-v1.css search3-results-filters-v1.js search3-selected-flow-v2.css search3-selected-flow-v2.js | LC_ALL=C sort)"
            test "$actual" = "$expected"
            test "$(find "$target" -mindepth 1 -maxdepth 1 | wc -l)" -eq 9
            generated="$(cd "$parent" && sha256sum ./poisk-turov/index.php ./poisk-turov/search3-entry-v1.css ./poisk-turov/search3-entry-v1.js ./poisk-turov/search3-results-cards-v2.css ./poisk-turov/search3-results-cards-v2.js ./poisk-turov/search3-results-filters-v1.css ./poisk-turov/search3-results-filters-v1.js ./poisk-turov/search3-selected-flow-v2.css ./poisk-turov/search3-selected-flow-v2.js | sha256sum | awk '{print $1}')"
            test "$generated" = "$payload_sha"
            mv "$target" "$failed"
            rm -f "$owner"
            if test -d "$backup" && test ! -L "$backup"; then mv "$backup" "$target"; fi
            if test -f "$owner_backup" && test ! -L "$owner_backup"; then mv "$owner_backup" "$owner"; fi
            echo SEARCH3_PREVIEW_ROLLBACK_OK
          elif test ! -e "$target" && test -d "$backup" && test ! -L "$backup"; then
            mv "$backup" "$target"
            if test -f "$owner_backup" && test ! -L "$owner_backup"; then mv "$owner_backup" "$owner"; fi
            echo SEARCH3_PREVIEW_ROLLBACK_OK recovered_partial_swap=1
          elif test -e "$backup" || test -e "$owner_backup"; then
            echo SEARCH3_PREVIEW_ROLLBACK_AMBIGUOUS >&2
            exit 51
          else
            echo SEARCH3_PREVIEW_ROLLBACK_NOOP current_run_not_active=1
          fi
          rm -f "$lock/pid"
          rmdir "$lock"
          trap - EXIT
          REMOTE

      - name: Confirm final protected production fingerprint
        if: ${{ always() && steps.fingerprint.outputs.recorded == 'true' && steps.ssh.outcome == 'success' }}
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          KEY_PATH: ${{ steps.ssh.outputs.key_path }}
          KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts_path }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,63}$ ]]
          test -f "$KEY_PATH" && test ! -L "$KEY_PATH" && test -s "$KNOWN_HOSTS_PATH" && test ! -L "$KNOWN_HOSTS_PATH"
          opts=(-i "$KEY_PATH" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_PATH" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$USER@$HOST"
          timeout 60s ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            cd "$HOME/www/anytoour.ru"
            for path in index.php search-page-v2.php poisk-turov/index.php assets.php api-v2.php lead-adapter-v2.php lead-bridge-v1.php lead-receiver-v1.php lead-price-v1.php lead-idempotency-v1.php analytics-config.php bundle-manifest-v1.php config.php; do
              test -f "$path" && test ! -L "$path"
              sha256sum "$path"
            done
          ' > "$RUNNER_TEMP/search3-production-final.sha256"
          diff -u "$RUNNER_TEMP/search3-production-before.sha256" "$RUNNER_TEMP/search3-production-final.sha256"
          echo SEARCH3_PRODUCTION_FINAL_FINGERPRINT_UNCHANGED

      - name: Upload deployment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search3-candidate-deployment-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/search3-deployment-evidence.json
            ${{ runner.temp }}/search3-live.headers
            ${{ runner.temp }}/search3-live-lead.json
            ${{ runner.temp }}/search3-production-before.sha256
            ${{ runner.temp }}/search3-production-after.sha256
            ${{ runner.temp }}/search3-production-final.sha256
          if-no-files-found: warn
          retention-days: 30
