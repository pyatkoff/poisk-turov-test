name: Validate active V2 contract
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-v2-active.yml'
  workflow_dispatch:

jobs:
  validate-active-v2:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate active JavaScript from index
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(grep -oE "v2_asset\('[^']+\.js'\)" v2/index.php | sed -E "s/.*'([^']+)'.*/\1/" | sort -u)
          test "${#assets[@]}" -gt 0
          printf 'ACTIVE_JS=%s\n' "${assets[*]}"
          for asset in "${assets[@]}"; do
            test -f "v2/$asset" || { echo "ACTIVE_ASSET_MISSING:$asset"; exit 1; }
            node --check "v2/$asset"
          done
          grep -q "analytics-v4.js" v2/index.php
          grep -q "results-renderer-v5.js" v2/index.php
          grep -q "hotel-actions-v3.js" v2/index.php
          grep -q "room-details-v3.js" v2/index.php
          grep -q "tour-controller-v4.js" v2/index.php
          grep -q "lead-form-guard-v1.js" v2/index.php
          grep -q "flight-price-sync-v1.js" v2/index.php
          grep -q "search-lifecycle-v6.js" v2/index.php
          grep -q "search-continue-v6.js" v2/index.php
      - name: Validate hotel and room module contracts
        shell: bash
        run: |
          set -euo pipefail
          hotel=v2/hotel-actions-v3.js
          room=v2/room-details-v3.js
          grep -q "version:3" "$hotel"
          grep -q "delete detail.dataset.loaded" "$hotel"
          grep -q "aria-expanded" "$hotel"
          grep -q "normalizeRooms" "$room"
          grep -q "room-detail-retry" "$room"
          grep -q "version:3" "$room"
          echo "HOTEL_ROOM_MODULE_CONTRACTS_OK"
      - name: Validate flight price sync contract
        shell: bash
        run: |
          set -euo pipefail
          flight=v2/flight-price-sync-v1.js
          grep -q "v2:flight-selected" "$flight"
          grep -q "Стоимость с выбранным рейсом" "$flight"
          grep -q "flightPrice - basePrice" "$flight"
          ! grep -q "basePrice + flightPrice" "$flight"
          echo "FLIGHT_PRICE_SYNC_CONTRACT_OK"
      - name: Reject retired JavaScript generations
        shell: bash
        run: |
          set -euo pipefail
          retired=(app.js runtime.js runtime-v2.js hotel-actions.js hotel-actions-v2.js hotel-actions-runtime.js room-details.js room-details-v2.js room-details-runtime.js direct-search.js direct-search-runtime.js catalogs-runtime.js tour-controller-runtime.js tour-price-sync-v2.js tour-selection-sync.js flight-autoload-v1.js flight-select-fix.js)
          for asset in "${retired[@]}"; do
            test ! -e "v2/$asset" || { echo "RETIRED_ASSET_PRESENT:$asset"; exit 1; }
          done
          echo "RETIRED_V2_GENERATIONS_ABSENT"
      - name: Reject retired static assets
        shell: bash
        run: |
          set -euo pipefail
          retired=(Layer_1.png anytour-logo-v2.svg anytour-logo.png anytour-current-logo.svg footer-current-site.css header-compact.css header-design-v2.css lead-form.css)
          for asset in "${retired[@]}"; do
            test ! -e "v2/$asset" || { echo "RETIRED_STATIC_ASSET_PRESENT:$asset"; exit 1; }
          done
          grep -Fq '<img src="/images/logo.svg" alt="AnyTour">' v2/index.php
          echo "RETIRED_V2_STATIC_ASSETS_ABSENT"
      - name: Validate stale-response generation guards
        shell: bash
        run: |
          set -euo pipefail
          lifecycle=v2/search-lifecycle-v6.js
          continuation=v2/search-continue-v6.js
          tour=v2/tour-controller-v4.js
          grep -Fq 'generation++;' "$lifecycle"
          grep -Fq 'clearTimeout(pollTimer)' "$lifecycle"
          grep -Fq 'searchId=0' "$lifecycle"
          grep -Fq 'rt.setSearchId(0)' "$lifecycle"
          grep -Fq "emit('reset'" "$lifecycle"
          grep -Fq 'run===generation&&Number(id||0)===Number(searchId||0)' "$lifecycle"
          grep -Fq "window.addEventListener('v2:search-reset'" "$continuation"
          grep -Fq 'operation++;searchId=0;removeMore();' "$continuation"
          grep -Fq 'tourGeneration=0,flightGeneration=0' "$tour"
          grep -Fq 'const run=++flightGeneration' "$tour"
          grep -Fq 'if(run!==flightGeneration' "$tour"
          grep -Fq 'const run=++tourGeneration' "$tour"
          grep -Fq 'flightGeneration++;' "$tour"
          grep -Fq 'if(run!==tourGeneration)return;' "$tour"
          echo "STALE_RESPONSE_GENERATION_GUARDS_OK"
      - name: Validate active PHP
        shell: bash
        run: |
          set -euo pipefail
          for file in v2/index.php v2/api-v2.php v2/lead-adapter-v2.php v2/lead-price-v1.php v2/assets.php v2/asset-version-v1.php v2/form-defaults.php v2/analytics-config.php v2/privacy-config.php; do
            test -f "$file" || { echo "ACTIVE_PHP_MISSING:$file"; exit 1; }
            php -l "$file"
          done
      - name: Validate asset content version semantics
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'v2/asset-version-v1.php';
          $f=tempnam(sys_get_temp_dir(),'v2asset');
          file_put_contents($f,'same-content');
          $a=v2_asset_content_version($f);
          touch($f,time()+20);
          clearstatcache(true,$f);
          $b=v2_asset_content_version($f);
          if($a==='0'||$a!==$b){fwrite(STDERR,"mtime changed content version\n");exit(1);}
          file_put_contents($f,'changed-content');
          $c=v2_asset_content_version($f);
          if($c==='0'||$c===$a){fwrite(STDERR,"content change did not change version\n");exit(1);}
          @unlink($f);
          if(v2_asset_content_version($f)!=='0'){fwrite(STDERR,"missing file contract failed\n");exit(1);}
          echo "V2_ASSET_CONTENT_VERSION_OK\n";
          PHP
      - name: Validate V2 deployment isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "- 'v2/**'" .github/workflows/deploy.yml
          grep -Fq -- 'scp "${ssh_opts[@]}" -r v2/.' .github/workflows/deploy.yml
          grep -Fq -- 'poisk-turov-test/v2/' .github/workflows/deploy.yml
          ! grep -Eq -- 'scp .*anytour\.com|scp .*max-search|scp .*poisk-turov-tg' .github/workflows/deploy.yml
          echo "V2_ISOLATION_OK"
