name: Validate active V2 contract
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '!v2/data/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate-v2-active.yml'
  workflow_dispatch:

concurrency:
  group: ci-validate-v2-active-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-active-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate active JavaScript from index
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(grep -oE "v2_asset\('[^']+\.js'\)" v2/index.php | sed -E "s/.*'([^']+)'.*/\1/" | sort -u)
          test "${#assets[@]}" -gt 0
          printf 'ACTIVE_JS=%s\n' "${assets[*]}"
          for asset in "${assets[@]}"; do
            test -f "v2/$asset" || { echo "ACTIVE_ASSET_MISSING:$asset"; exit 1; }
            node --check "v2/$asset"
          done
          grep -q "analytics-v4.js" v2/index.php
          grep -q "results-renderer-v5.js" v2/index.php
          grep -q "hotel-actions-v3.js" v2/index.php
          grep -q "room-details-v3.js" v2/index.php
          grep -q "tour-controller-v4.js" v2/index.php
          grep -q "lead-form-guard-v1.js" v2/index.php
          grep -q "flight-price-sync-v1.js" v2/index.php
          grep -q "search-lifecycle-v6.js" v2/index.php
          grep -q "search-continue-v6.js" v2/index.php
      - name: Validate results sorting and partial-data contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          global.document={readyState:'loading',getElementById:()=>({value:'price',dataset:{},addEventListener:()=>{}}),addEventListener:()=>{}};
          global.window={addEventListener:()=>{},dispatchEvent:()=>{}};
          global.CustomEvent=function(){};
          require('./v2/results-renderer-v5.js');
          const r=global.window.V2ResultsV5;
          if(!r||r.version!==5)process.exit(1);
          let list=r.sorted([{id:'unknown',price:0},{id:'expensive',price:90000},{id:'cheap',price:70000}],'price');
          if(list.map(x=>x.id).join(',')!=='cheap,expensive,unknown')process.exit(2);
          list=r.sorted([{id:'unknown',rating:4.8,price:0},{id:'priced',rating:4.8,price:80000}],'rating');
          if(list.map(x=>x.id).join(',')!=='priced,unknown')process.exit(3);
          if(r.textValue({russianName:'Стандарт'})!=='Стандарт')process.exit(4);
          if(r.textValue([{name:'DBL'},{title:'SEA VIEW'}])!=='DBL, SEA VIEW')process.exit(5);
          const row=r.tourRow({id:'x',roomType:{name:'Deluxe'},placement:{title:'2 ADL'},meal:{russianName:'Всё включено'},operator:{name:'Test operator'},price:100000});
          if(row.includes('[object Object]')||!row.includes('Deluxe')||!row.includes('2 ADL')||!row.includes('Всё включено')||!row.includes('Test operator'))process.exit(6);
          if(typeof r.primaryTourTags==='function')process.exit(7);
          console.log('RESULTS_V5_OK');
          NODE
      - name: Validate runtime retry policy semantics
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          global.window={};
          require('./v2/runtime-retry-policy.js');
          const p=window.V2RetryPolicy;
          if(!p) process.exit(1);
          if(!p.shouldRetry('search_status',{code:'HTTP_ERROR',status:502},0)) process.exit(2);
          if(!p.shouldRetry('flights',{code:'NETWORK_ERROR'},0)) process.exit(3);
          if(p.shouldRetry('search_status',{code:'HTTP_ERROR',status:400},0)) process.exit(4);
          if(p.shouldRetry('search_start',{code:'HTTP_ERROR',status:502},0)) process.exit(5);
          if(p.shouldRetry('search_continue',{code:'NETWORK_ERROR'},0)) process.exit(6);
          if(p.shouldRetry('search_status',{code:'TIMEOUT'},0)) process.exit(7);
          if(p.shouldRetry('search_status',{code:'HTTP_ERROR',status:503},1)) process.exit(8);
          console.log('V2_RETRY_POLICY_OK');
          NODE
      - name: Validate search filters UX contract
        shell: bash
        run: |
          set -euo pipefail
          test -s v2/search-filters-ux-v1.css
          test -s v2/mobile-results-filters-v1.css
          grep -Fq "v2_asset('search-filters-ux-v1.css')" v2/index.php
          grep -Fq "v2_asset('mobile-results-filters-v1.css')" v2/index.php
          grep -Fq 'id="v2-primary-search-ux-style"' v2/index.php
          ! grep -Fq 'installStyles' v2/search-filters-ux-v1.js
          ! grep -Fq "document.createElement('style')" v2/search-filters-ux-v1.js
          ! grep -Fq '.style.marginTop' v2/search-filters-ux-v1.js
          grep -Fq '.search-filters-reset{margin-top:14px}' v2/search-filters-ux-v1.css
          grep -Fq '.search-submit{position:static;' v2/search-filters-ux-v1.css
          grep -Fq '.results-tools[hidden]{display:none!important}' v2/mobile-results-filters-v1.css
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('v2/search-filters-ux-v1.js','utf8');
          const match=src.match(/const defaults=(\{[^;]+\});/);
          if(!match)throw new Error('advanced filter defaults contract missing');
          const defaults=vm.runInNewContext('('+match[1]+')');
          const required=['arrival','region','subregion','hotel','operator','hotel_type','stars','rating','food','price_from','price_till','onlyDirect','onlyCharter'];
          required.forEach(name=>{if(!Object.prototype.hasOwnProperty.call(defaults,name))throw new Error('advanced filter missing: '+name);});
          if(!src.includes("Курорт, отель и перелёт"))throw new Error('advanced filter empty summary is stale');
          if(!src.includes('Сбросить дополнительные фильтры'))throw new Error('advanced filter reset control missing');
          if(!src.includes("summary.innerHTML='<strong>Все фильтры</strong>"))throw new Error('advanced filter summary label missing');
          console.log('V2_SEARCH_FILTERS_UX_OK');
          JS
      - name: Validate hotel and room module contracts
        shell: bash
        run: |
          set -euo pipefail
          hotel=v2/hotel-actions-v3.js
          room=v2/room-details-v3.js
          grep -q "version:3" "$hotel"
          grep -q "delete detail.dataset.loaded" "$hotel"
          grep -q "aria-expanded" "$hotel"
          grep -q "normalizeRooms" "$room"
          grep -q "room-detail-retry" "$room"
          grep -q "version:3" "$room"
          echo "HOTEL_ROOM_MODULE_CONTRACTS_OK"
      - name: Validate flight price sync contract
        shell: bash
        run: |
          set -euo pipefail
          flight=v2/flight-price-sync-v1.js
          grep -q "v2:flight-selected" "$flight"
          grep -q "Стоимость с выбранным рейсом" "$flight"
          grep -q "flightPrice - basePrice" "$flight"
          ! grep -q "basePrice + flightPrice" "$flight"
          echo "FLIGHT_PRICE_SYNC_CONTRACT_OK"
      - name: Reject retired JavaScript generations
        shell: bash
        run: |
          set -euo pipefail
          retired=(app.js runtime.js runtime-v2.js hotel-actions.js hotel-actions-v2.js hotel-actions-runtime.js room-details.js room-details-v2.js room-details-runtime.js direct-search.js direct-search-runtime.js catalogs-runtime.js tour-controller-runtime.js tour-price-sync-v2.js tour-selection-sync.js flight-autoload-v1.js flight-select-fix.js)
          for asset in "${retired[@]}"; do
            test ! -e "v2/$asset" || { echo "RETIRED_ASSET_PRESENT:$asset"; exit 1; }
          done
          echo "RETIRED_V2_GENERATIONS_ABSENT"
      - name: Reject retired static assets
        shell: bash
        run: |
          set -euo pipefail
          retired=(Layer_1.png anytour-logo-v2.svg anytour-logo.png anytour-current-logo.svg footer-current-site.css header-compact.css header-design-v2.css lead-form.css)
          for asset in "${retired[@]}"; do
            test ! -e "v2/$asset" || { echo "RETIRED_STATIC_ASSET_PRESENT:$asset"; exit 1; }
          done
          grep -Fq 'site-header-v2.php' v2/index.php
          grep -Fq 'v2_render_site_header(' v2/index.php
          grep -Fq '<img src="/images/logo.svg" alt="AnyTour">' v2/site-header-v2.php
          echo "RETIRED_V2_STATIC_ASSETS_ABSENT"
      - name: Validate stale-response generation guards
        shell: bash
        run: |
          set -euo pipefail
          lifecycle=v2/search-lifecycle-v6.js
          continuation=v2/search-continue-v6.js
          tour=v2/tour-controller-v4.js
          grep -Fq 'generation++;' "$lifecycle"
          grep -Fq 'clearTimeout(pollTimer)' "$lifecycle"
          grep -Fq 'searchId=0' "$lifecycle"
          grep -Fq 'rt.setSearchId(0)' "$lifecycle"
          grep -Fq "emit('reset'" "$lifecycle"
          grep -Fq 'run===generation&&Number(id||0)===Number(searchId||0)' "$lifecycle"
          grep -Fq "window.addEventListener('v2:search-reset'" "$continuation"
          grep -Fq 'operation++;searchId=0;removeMore();' "$continuation"
          grep -Fq 'tourGeneration=0,flightGeneration=0' "$tour"
          grep -Fq 'const run=++flightGeneration' "$tour"
          grep -Fq 'if(run!==flightGeneration' "$tour"
          grep -Fq 'const run=++tourGeneration' "$tour"
          grep -Fq 'flightGeneration++;' "$tour"
          grep -Fq 'if(run!==tourGeneration)return;' "$tour"
          echo "STALE_RESPONSE_GENERATION_GUARDS_OK"
      - name: Validate active PHP
        shell: bash
        run: |
          set -euo pipefail
          for file in v2/index.php v2/api-v2.php v2/lead-adapter-v2.php v2/lead-price-v1.php v2/assets.php v2/asset-version-v1.php v2/catalog-cache-v1.php v2/form-defaults.php v2/analytics-config.php v2/privacy-config.php; do
            test -f "$file" || { echo "ACTIVE_PHP_MISSING:$file"; exit 1; }
            php -l "$file"
          done
      - name: Validate asset content version semantics
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'v2/asset-version-v1.php';
          $f=tempnam(sys_get_temp_dir(),'v2asset');
          file_put_contents($f,'same-content');
          $a=v2_asset_content_version($f);
          touch($f,time()+20);
          clearstatcache(true,$f);
          $b=v2_asset_content_version($f);
          if($a==='0'||$a!==$b){fwrite(STDERR,"mtime changed content version\n");exit(1);}
          file_put_contents($f,'changed-content');
          $c=v2_asset_content_version($f);
          if($c==='0'||$c===$a){fwrite(STDERR,"content change did not change version\n");exit(1);}
          @unlink($f);
          if(v2_asset_content_version($f)!=='0'){fwrite(STDERR,"missing file contract failed\n");exit(1);}
          echo "V2_ASSET_CONTENT_VERSION_OK\n";
          PHP
      - name: Validate catalog cache semantics
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          function query_string(array $params) {
              $parts=[];
              foreach ($params as $key=>$value) {
                  if ($value===null || $value==='') continue;
                  if (is_bool($value)) $value=$value?'true':'false';
                  if (is_array($value)) foreach ($value as $item) $parts[]=rawurlencode($key).'='.rawurlencode((string)$item);
                  else $parts[]=rawurlencode($key).'='.rawurlencode((string)$value);
              }
              return implode('&',$parts);
          }
          require 'v2/catalog-cache-v1.php';
          $dir=v2_catalog_cache_dir();
          if (is_dir($dir)) foreach (glob($dir.'/*.json') ?: [] as $f) @unlink($f);
          $calls=0;
          $loader=function($path,$params) use (&$calls){$calls++; return ['path'=>$path,'params'=>$params,'call'=>$calls];};
          $a=v2_catalog_get('/countries',['departureId'=>1],900,$loader);
          $b=v2_catalog_get('/countries',['departureId'=>1],900,$loader);
          if ($calls!==1 || $a!==$b) {fwrite(STDERR,"cache hit contract failed\n"); exit(1);}
          $c=v2_catalog_get('/countries',['departureId'=>2],900,$loader);
          if ($calls!==2 || $c===$b) {fwrite(STDERR,"parameter isolation failed\n"); exit(1);}
          $file=$dir.'/'.v2_catalog_cache_key('/countries',['departureId'=>1]).'.json';
          if (!is_file($file)) {fwrite(STDERR,"cache file missing\n"); exit(1);}
          touch($file,time()-5);
          $d=v2_catalog_get('/countries',['departureId'=>1],1,$loader);
          if ($calls!==3 || ($d['call'] ?? 0)!==3) {fwrite(STDERR,"ttl expiry failed\n"); exit(1);}
          foreach (glob($dir.'/*.json') ?: [] as $f) @unlink($f);
          @rmdir($dir); @rmdir(dirname($dir));
          echo "V2_CATALOG_CACHE_OK\n";
          PHP
      - name: Validate active V2 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('v2')
          index=(root/'index.php').read_text(encoding='utf-8')
          assets=re.findall(r"v2_asset\('([^']+)'\)",index)
          missing=[x for x in assets if not (root/x).is_file()]
          print('ACTIVE_ASSETS',len(assets),'MISSING',missing)
          if missing: sys.exit(1)
          active=['index.php','api-v2.php','lead-adapter-v2.php','assets.php','form-defaults.php','analytics-config.php','privacy-config.php']+assets
          forbidden=[r'poisk-turov-test/anytour',r'\.\./anytour',r'/anytour/images',r'\bTvApi\b',r'tvapi\.php',r'/max-search/']
          hits=[]
          for rel in dict.fromkeys(active):
              p=root/rel
              if not p.is_file() or p.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.svg'}: continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              for pattern in forbidden:
                  if re.search(pattern,text,re.I): hits.append((rel,pattern))
          print('FORBIDDEN_HITS',hits)
          if hits: sys.exit(2)
          allowed=[]
          for rel in ('index.php','lead-adapter-v2.php'):
              text=(root/rel).read_text(encoding='utf-8',errors='ignore')
              if 'bitrix/modules/main/include/prolog_before.php' in text: allowed.append(rel+':bitrix')
              if 'site_conf.php' in text: allowed.append(rel+':site_conf')
          print('ALLOWED_PLATFORM_DEPS',allowed)
          print('V2_DEPENDENCY_CLOSURE_OK')
          PY
      - name: Validate V2 deployment isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- "- 'v2/**'" .github/workflows/deploy.yml
          grep -Fq -- 'scp "${ssh_opts[@]}" -r v2/.' .github/workflows/deploy.yml
          grep -Fq -- 'poisk-turov-test/v2/' .github/workflows/deploy.yml
          ! grep -Eq -- 'scp .*anytour\.com|scp .*max-search|scp .*poisk-turov-tg' .github/workflows/deploy.yml
          echo "V2_ISOLATION_OK"
