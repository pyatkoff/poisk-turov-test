name: MATCH Surmeli anchor correct v1
on:
  push:
    branches: [ops/match-surmeli-anchor-correct-1971-20260913-v1]
    paths: [.github/match-surmeli-anchor-correct-1971-20260913-v1.arm]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-surmeli-anchor-correct-1971-20260913-v1}
jobs:
  correct:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve before SSH
        run: |
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          printf '%s\n' '{"operation_id":"hotel-match-surmeli-anchor-correct-1971-20260913-v1","state":"reserved_before_ssh","anex_hotel_id":31364,"from_local":99969,"to_local":17657,"database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}' > "$RUNNER_TEMP/$OPERATION_ID/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-surmeli-anchor-correct-v1-reservation, path: '${{ runner.temp }}/hotel-match-surmeli-anchor-correct-1971-20260913-v1/reservation.json', retention-days: 90}
      - name: Correct exact CURRENT anchor once
        id: write
        continue-on-error: true
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile,time
          P=pathlib.Path;state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];php='''<?php
          $op='hotel-match-surmeli-anchor-correct-1971-20260913-v1';$committed=false;try{$root=realpath(getcwd());require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET SESSION innodb_lock_wait_timeout=20');$db->beginTransaction();$q=$db->prepare("SELECT * FROM anex_hotel_search_mappings WHERE anex_hotel_id=31364 FOR UPDATE");$q->execute();$m=$q->fetchAll(PDO::FETCH_ASSOC);if(count($m)!==1||(int)$m[0]['catalog_hotel_id']!==99969||(int)$m[0]['enabled']!==1||$m[0]['scope']!=='preview'||$m[0]['approval_policy']!=='owner_exact_and_strong_20260908')throw new RuntimeException('mapping_state_changed');$q=$db->prepare('SELECT * FROM anex_hotels WHERE anex_hotel_id=31364 FOR UPDATE');$q->execute();$s=$q->fetch(PDO::FETCH_ASSOC);if(!$s||$s['api_country']!=='Турция'||$s['api_region']!=='Стамбул'||mb_stripos((string)$s['api_town'],'Шишли')===false)throw new RuntimeException('source_geo_changed');$q=$db->prepare('SELECT id,name,region_name,subregion_name,category,latitude,longitude FROM catalog_hotels WHERE id IN (99969,17657) ORDER BY id FOR UPDATE');$q->execute();$h=[];foreach($q->fetchAll(PDO::FETCH_ASSOC)as$r)$h[(int)$r['id']]=$r;if(!isset($h[17657])||$h[17657]['name']!=='SURMELI ISTANBUL HOTEL'||$h[17657]['region_name']!=='Стамбул'||$h[17657]['subregion_name']!=='Шишли'||(int)$h[17657]['category']!==5)throw new RuntimeException('target_changed');$lat=(float)$s['latitude'];$lon=(float)$s['longitude'];$tlat=(float)$h[17657]['latitude'];$tlon=(float)$h[17657]['longitude'];$a=deg2rad($lat);$c=deg2rad($tlat);$x=sin(($c-$a)/2)**2+cos($a)*cos($c)*sin(deg2rad($tlon-$lon)/2)**2;$dist=6371000*2*asin(min(1,sqrt($x)));if($dist>1000)throw new RuntimeException('target_geo_changed');$q=$db->prepare("SELECT anex_hotel_id FROM anex_hotel_search_mappings WHERE catalog_hotel_id=17657 AND enabled=1 AND anex_hotel_id<>31364 FOR UPDATE");$q->execute();if($q->fetchColumn()!==false)throw new RuntimeException('target_occupied');$q=$db->prepare('SELECT 1 FROM anex_review_pair_exclusions WHERE anex_hotel_id=31364 AND catalog_hotel_id=17657');$q->execute();if($q->fetchColumn()!==false)throw new RuntimeException('pair_excluded');$digest=hash('sha256',json_encode(['operation_id'=>$op,'anex_hotel_id'=>31364,'from'=>99969,'to'=>17657,'rule'=>'exact_name_country_region_subregion_category_plus_coordinates','distance_m'=>round($dist,1)],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));$md=hash('sha256',$op.'|surmeli-anchor-correction');$u=$db->prepare('UPDATE anex_hotel_search_mappings SET catalog_hotel_id=17657,source_row_digest=?,mapping_digest=? WHERE anex_hotel_id=31364 AND catalog_hotel_id=99969 AND enabled=1');$u->execute([$digest,$md]);if($u->rowCount()!==1)throw new RuntimeException('update_not_one');$db->commit();$committed=true;$q=$db->prepare('SELECT catalog_hotel_id,source_row_digest,mapping_digest,enabled FROM anex_hotel_search_mappings WHERE anex_hotel_id=31364');$q->execute();$r=$q->fetch(PDO::FETCH_ASSOC);$ok=$r&&(int)$r['catalog_hotel_id']===17657&&(int)$r['enabled']===1&&hash_equals($digest,(string)$r['source_row_digest'])&&hash_equals($md,(string)$r['mapping_digest']);echo json_encode(['status'=>$ok?'completed':'readback_failed','operation_id'=>$op,'anex_hotel_id'=>31364,'from_local'=>99969,'to_local'=>17657,'distance_m'=>round($dist,1),'database_writes'=>1,'mapping_writes'=>1,'supplier_calls'=>0,'tourvisor_calls'=>0,'committed'=>true,'readback_verified'=>$ok,'no_replay'=>true],JSON_UNESCAPED_SLASHES),"\n";}catch(Throwable$e){if(isset($db)&&$db->inTransaction())$db->rollBack();echo json_encode(['status'=>'failed','operation_id'=>$op,'reason'=>$e->getMessage(),'database_writes'=>$committed?'unknown':0,'mapping_writes'=>$committed?'unknown':0,'supplier_calls'=>0,'tourvisor_calls'=>0,'committed'=>$committed,'readback_verified'=>false,'no_replay'=>true]),"\n";}?>'''
          raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='surmeli-fix-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';sock=P(td)/'sock';key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600);base=['ssh','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR'];auth=False
            for _ in range(3):
              p=subprocess.run(base+['-M','-S',str(sock),'-fnNT','-o','ControlPersist=600','-l',user,host],capture_output=True,text=True,timeout=40)
              if p.returncode==0:auth=True;break
              time.sleep(8)
            if not auth:state.joinpath('blocker.json').write_text('{"state":"auth_preflight_failed_zero_remote_execution"}\n');raise SystemExit(2)
            p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0'],input=php,text=True,capture_output=True,timeout=300);subprocess.run(['ssh','-S',str(sock),'-O','exit',host],capture_output=True,timeout=20)
          if p.returncode!=0:state.joinpath('blocker.json').write_text(json.dumps({'state':'unknown_after_single_remote_execution_no_replay','remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest()})+'\n');raise SystemExit(3)
          v=json.loads(p.stdout);raw_result=(json.dumps(v,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(raw_result);ok=v.get('status')=='completed' and v.get('committed') is True and v.get('readback_verified') is True and v.get('database_writes')==1;state.joinpath('receipt.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'completed_committed_readback_verified' if ok else 'not_completed','result_sha256':hashlib.sha256(raw_result).hexdigest(),'no_replay':True},sort_keys=True)+'\n');
          if not ok:raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-surmeli-anchor-correct-v1-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-surmeli-anchor-correct-1971-20260913-v1/', retention-days: 90}
      - name: Terminal gate
        if: steps.write.outcome != 'success'
        run: exit 1
