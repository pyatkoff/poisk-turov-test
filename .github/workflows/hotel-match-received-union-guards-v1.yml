name: MATCH received union CURRENT guard review v1
on:
  push:
    branches: [ops/match-received-union-guards-1971-20260915-v1]
    paths: [.github/workflows/hotel-match-received-union-guards-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-received-union-guards-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-received-union-guards-1971-20260915-v1
  DOSSIER_SOURCE_SHA: b44c694639ff9d7ffa53c5ea8163deddedb11eb1
  DOSSIER_REPORT_SHA256: d9a9a9cbbb8b4d3f77600c309fac8aa4334ebcb0812888725504c580bbdba8c6
jobs:
  guard-review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Verify immutable dossier and read-only reviewer
        run: |
          set -euo pipefail
          test "$(sha256sum reports/hotel-match-received-union-current-20260915.json | awk '{print $1}')" = "$DOSSIER_REPORT_SHA256"
          php -l scripts/diagnostics/hotel_match_received_union_guards.php
          php tests/hotel_match_received_union_guards_test.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]' scripts/diagnostics/hotel_match_received_union_guards.php
          grep -F 'START TRANSACTION READ ONLY' scripts/diagnostics/hotel_match_received_union_guards.php >/dev/null
      - name: Derive exact 93 non-ANEX plus unresolved manifest from sealed dossier
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"; export OUT="$out"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          report_path=pathlib.Path('reports/hotel-match-received-union-current-20260915.json')
          raw=report_path.read_bytes(); assert hashlib.sha256(raw).hexdigest()==os.environ['DOSSIER_REPORT_SHA256']
          r=json.loads(raw)
          assert r['state']=='prepared_current_dossier_not_apply_manifest' and r['candidate_count_not_safe']==139 and r['safe_mappings']==0
          rel=[x for x in r['candidates'] if str(x['fact']['operator_key'])!='5']
          assert len(rel)==93
          assert {str(x['fact']['operator_key']) for x in rel}=={'115','315','342'}
          unresolved=r['unresolved_anchors']; assert len(unresolved)==123
          manifest={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'dossier_source_sha':os.environ['DOSSIER_SOURCE_SHA'],'dossier_report_sha256':os.environ['DOSSIER_REPORT_SHA256'],'state':'sealed_input','relation_rows':rel,'unresolved_rows':unresolved,'database_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          out=pathlib.Path(os.environ['OUT']); data=(json.dumps(manifest,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); out.joinpath('manifest.json').write_bytes(data); out.joinpath('manifest-sha256.txt').write_text(hashlib.sha256(data).hexdigest()+'\n')
          print(json.dumps({'relation_rows':len(rel),'unresolved_rows':len(unresolved),'manifest_sha256':hashlib.sha256(data).hexdigest()},sort_keys=True))
          PY
      - name: Bind execution copy to manifest country guard and reserve before SSH/DB
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; export OUT="$out" MANIFEST_SHA="$(cat "$out/manifest-sha256.txt")"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('scripts/diagnostics/hotel_match_received_union_guards.php'); s=p.read_text()
          old="$lid=(int)$a['local_hotel_id'];$local=$locals[$lid]??null;if(!$local)return['safe'=>false,'reasons'=>['current_local_missing']];$ng=mrg_anchor_guard($a,$local);"
          new="$lid=(int)$a['local_hotel_id'];$local=$locals[$lid]??null;if(!$local)return['safe'=>false,'reasons'=>['current_local_missing']];$a['country_id']=(int)$f['country_id'];$ng=mrg_anchor_guard($a,$local);"
          assert s.count(old)==1 and new not in s
          p.write_text(s.replace(old,new))
          assert 'START TRANSACTION READ ONLY' in p.read_text()
          out=pathlib.Path(os.environ['OUT']); manifest=out.joinpath('manifest.json').read_bytes(); assert hashlib.sha256(manifest).hexdigest()==os.environ['MANIFEST_SHA']
          reservation={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'state':'reserved_before_db_access','coordination_issue':2530,'claim_comment_id':5679642469,'queue_issue':1971,'dossier_source_sha':os.environ['DOSSIER_SOURCE_SHA'],'dossier_report_sha256':os.environ['DOSSIER_REPORT_SHA256'],'manifest_sha256':os.environ['MANIFEST_SHA'],'relation_rows':93,'unresolved_rows':123,'database_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          out.joinpath('reservation.json').write_text(json.dumps(reservation,sort_keys=True,indent=2)+'\n')
          out.joinpath('runtime-script-sha256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          PY
          php -l scripts/diagnostics/hotel_match_received_union_guards.php
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-received-union-guards-v1-reservation
          path: |
            ${{ runner.temp }}/hotel-match-received-union-guards-1971-20260915-v1/reservation.json
            ${{ runner.temp }}/hotel-match-received-union-guards-1971-20260915-v1/manifest.json
            ${{ runner.temp }}/hotel-match-received-union-guards-1971-20260915-v1/runtime-script-sha256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Server CURRENT read-only full guards
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; manifestsha="$(cat "$out/manifest-sha256.txt")"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          test -n "$KEY_VALUE" && test -n "$H" && test -n "$U"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -euo pipefail; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; cat > \"\$p/manifest.json\"; test \"\$(sha256sum \"\$p/manifest.json\" | awk '{print \$1}')\" = '$manifestsha'; sync" < "$out/manifest.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' MATCH_MANIFEST_SHA='$manifestsha' php" < scripts/diagnostics/hotel_match_received_union_guards.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0 -a -s "$out/server-operation.tgz"; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"; export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'
          assert s.joinpath('result.json').exists() and s.joinpath('receipt.json').exists()
          raw=s.joinpath('result.json').read_bytes(); r=json.loads(raw); receipt=json.loads(s.joinpath('receipt.json').read_text()); digest=hashlib.sha256(raw).hexdigest()
          ok=(receipt.get('result_sha256')==digest and receipt.get('readback_verified') is True and receipt.get('no_replay') is True and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('source_sha')==os.environ['GITHUB_SHA'] and r.get('database_writes')==0 and r.get('supplier_calls')==0 and int(os.environ['REMOTE_RC'])==0 and r.get('state')=='completed_read_only')
          gate={'operation_id':os.environ['OPERATION_ID'],'state':r.get('state'),'result_sha256':digest,'verified':ok,'relation_reviewed':r.get('relation_reviewed'),'relation_safe_count':r.get('relation_safe_count'),'unresolved_anchor_unique_reviewed':r.get('unresolved_anchor_unique_reviewed'),'unresolved_anchor_safe_count':r.get('unresolved_anchor_safe_count'),'no_replay':True}
          p.joinpath('workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,sort_keys=True))
          assert ok and r['relation_reviewed']==93
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-received-union-guards-v1-result
          path: ${{ runner.temp }}/hotel-match-received-union-guards-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
