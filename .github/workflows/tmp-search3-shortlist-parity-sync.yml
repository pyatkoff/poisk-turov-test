name: Temporary Search3 shortlist parity sync

on:
  push:
    branches:
      - ux/search3-shortlist-differences-20260912

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-shortlist-differences-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize canonical Search3 assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          python3 -B scripts/build/search3_assets.py --write
          python3 -B scripts/build/search3_assets.py --check
          node scripts/build/search3-js/shared-runtime.cjs --check
      - name: Sync reviewed results JS hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('docs/project/search3-production-import.json')
          data=json.loads(p.read_text())
          name='search3-results-filters-v1.js'
          data['assets'][name]['productionSha256']=hashlib.sha256((Path('v2')/name).read_bytes()).hexdigest()
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          node --check src/search3/behavior/results/shortlist.js
          node tests/search3-shortlist-trip-summary.test.js
          git diff --check
      - name: Commit generated parity and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-search3-shortlist-parity-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/search3-results-filters-v1.js docs/project/search3-production-import.json .github/workflows/tmp-search3-shortlist-parity-sync.yml
          git diff --cached --check
          git commit -m 'SEARCH: materialize shortlist generated parity'
          git push origin HEAD:ux/search3-shortlist-differences-20260912
