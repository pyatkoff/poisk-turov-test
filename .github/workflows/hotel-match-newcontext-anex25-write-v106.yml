name: MATCH new-context ANEX25 writer v106
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-newcontext-anex25-write-v106.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-newcontext-anex25-write-v106
  cancel-in-progress: false
env:
  OP: hotel-match-newcontext-anex25-write-1971-20260928-v106
  CLAIM: '5860932452'
jobs:
  write:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact writer and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail;umask 077;mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_newcontext_anex25_write_v106.php)" = 5ac9615d54f6d14aa907059381eb1c8b74231564
          php -l scripts/diagnostics/hotel_match_newcontext_anex25_write_v106.php
          python3 - <<'PY'
          import json,os,time,urllib.request
          def get(p):
              q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:return json.load(f)
          c=get('/issues/comments/'+os.environ['CLAIM']);b=c['body'];assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in ['25 pass current','v106 writer','SERIALIZABLE','ProviderHTTP0','no merge/deploy']:assert x.lower() in b.lower(),x
          pr=get('/pulls/4061');assert pr['state']=='open' and pr['draft'] is True and pr['head']['sha']==os.environ['HEAD']
          for _ in range(100):
              xs=[x for x in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if x['name']=='Security guard']
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':assert x['conclusion']=='success';break
              time.sleep(3)
          else:raise SystemExit('security')
          PY
      - name: One guarded transaction and post-COMMIT census
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";rel=".anytoour-match/operations/$OP";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$rel/payload\""
          python3 - "$HEAD" <<'PY'
          import json,sys
          json.dump({'operation':'hotel-match-newcontext-anex25-write-1971-20260928-v106','source_sha':sys.argv[1],'state':'reserved_before_db_write','maximum_writes':25,'provider_http_calls':0},open('terminal/reservation.json','w'))
          PY
          scp "${opts[@]}" terminal/reservation.json "$remote:$rel/reservation.json"
          git archive HEAD scripts/diagnostics app/integrations|ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=768M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_newcontext_anex25_write_v106.php\" --execute">terminal/stdout.txt
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json;scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=json.load(open('terminal/result.json'));r=json.load(open('terminal/receipt.json'));assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest();assert d['state'] in ('committed_readback_verified','completed_no_new_writes') and d['provider_http_calls']==0 and d['mapping_writes']<=25
          if d['state']=='committed_readback_verified':assert d['readback_verified'] is True
          print(json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-newcontext-anex25-v106-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
