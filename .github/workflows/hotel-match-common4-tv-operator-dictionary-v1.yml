name: MATCH COMMON4 Tourvisor operator dictionary v1
on:
  push:
    branches: [ops/match-common4-tv-operator-dictionary-1971-20260919-v1]
    paths:
      - scripts/diagnostics/hotel_match_common4_tv_operator_dictionary_v1.php
      - .github/workflows/hotel-match-common4-tv-operator-dictionary-v1.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: hotel-match-common4-tv-operator-dictionary-1971-20260919-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-common4-tv-operator-dictionary-1971-20260919-v1
jobs:
  dictionary:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact source and reserve before provider access
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p payload result
          cp scripts/diagnostics/hotel_match_common4_tv_operator_dictionary_v1.php payload/
          cp scripts/diagnostics/hotel_match_common4_operator_binding_v1.php payload/
          php -l payload/hotel_match_common4_tv_operator_dictionary_v1.php
          php -l payload/hotel_match_common4_operator_binding_v1.php
          php payload/hotel_match_common4_tv_operator_dictionary_v1.php --self-test
          php tests/hotel-match-common4-operator-binding-v1-test.php
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('payload')
          hashes={x.name:hashlib.sha256(x.read_bytes()).hexdigest() for x in p.iterdir() if x.is_file()}
          (p/'source-hashes.json').write_text(json.dumps(hashes,sort_keys=True)+'\n')
          reservation={
            'operation':os.environ['OPERATION_ID'],
            'state':'reserved_before_provider_access',
            'source_sha':os.environ['GITHUB_SHA'],
            'provider':'tourvisor',
            'action':'operator_dictionary',
            'departure_id':1,
            'country_id':4,
            'physical_http_cap':1,
            'daily_limit':3000,
            'no_search':True,
            'no_detail':True,
            'no_continue':True,
            'db_writes':0,
            'mapping_writes':0,
          }
          raw=json.dumps(reservation,sort_keys=True)+'\n'
          with pathlib.Path('result/reservation.json').open('x') as f:
              f.write(raw);f.flush();os.fsync(f.fileno())
          PY
      - name: Require exact-head Security success before server access
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f: runs=json.load(f)['workflow_runs']
              checks=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['GITHUB_SHA']]
              if checks:
                  latest=max(checks,key=lambda x:x['id'])
                  if latest['status']=='completed':
                      if latest['conclusion']!='success': raise SystemExit('security_not_green')
                      print('EXACT_SECURITY_GREEN',latest['id']);break
              time.sleep(5)
          else: raise SystemExit('exact_security_not_available_no_server_access')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: common4-tv-operator-dictionary-reservation-${{ github.run_id }}
          path: result/reservation.json
          retention-days: 90
          if-no-files-found: error
      - name: Execute exactly one accounted dictionary request
        shell: bash
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY"; test -n "$HOST"; test -n "$USER"
          key="$RUNNER_TEMP/c4-key"; known="$RUNNER_TEMP/c4-known"
          trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$known" 2>/dev/null; test -s "$known"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"; op=".anytour-operations/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "set -e; umask 077; mkdir -p \"\$HOME/.anytour-operations\"; test ! -e \"\$HOME/$op\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\"" >result/setup.stdout 2>result/setup.stderr
          scp "${opts[@]}" result/reservation.json "$remote:$op/" >result/reserve.stdout 2>result/reserve.stderr
          scp "${opts[@]}" payload/* "$remote:$op/payload/" >result/copy.stdout 2>result/copy.stderr
          set +e
          ssh "${opts[@]}" "$remote" "umask 077; ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" php \"\$HOME/$op/payload/hotel_match_common4_tv_operator_dictionary_v1.php\" --execute" >result/remote.stdout 2>result/remote.stderr
          rc=$?
          scp -r "${opts[@]}" "$remote:$op/." result/remote/ >result/readback.stdout 2>result/readback.stderr
          readback_rc=$?
          set -e
          printf '{"remote":%s,"readback":%s}\n' "$rc" "$readback_rc" > result/exit-codes.json
          test "$readback_rc" -eq 0
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('result/remote')
          result=json.loads((p/'result.json').read_bytes())
          receipt=json.loads((p/'receipt.json').read_bytes())
          digest=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert receipt['operation']==result['operation']=='hotel-match-common4-tv-operator-dictionary-1971-20260919-v1'
          assert receipt['result_sha256']==digest
          assert result['db_writes']==0 and result['mapping_writes']==0
          if result['state'] in ('completed_read_only','completed_hold','terminal_failed_no_replay'):
              assert result['physical_http_calls']==1
              assert (p/'quota-charge.json').exists()
          else:
              assert result['state']=='failed_before_provider_access'
          if result['state']=='completed_read_only':
              resolved=result['resolved']
              assert set(resolved)=={'anex','funsun','biblio_globus','intourist'}
              assert all(v['namespace']=='tourvisor' for v in resolved.values())
              assert len({v['provider_operator_id'] for v in resolved.values()})==4
              assert result['search_calls']==0 and result['detail_calls']==0
          summary={k:result.get(k) for k in ['state','reason','resolved','physical_http_calls','daily_accounted_before','daily_accounted_after','daily_limit','dictionary_response_sha256']}
          summary['result_sha256']=digest
          pathlib.Path('result/verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          if result['state'] not in ('completed_read_only','completed_hold'):
              raise SystemExit('terminal_provider_failure_no_replay')
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: common4-tv-operator-dictionary-result-${{ github.run_id }}
          path: result/
          retention-days: 90
          if-no-files-found: error
