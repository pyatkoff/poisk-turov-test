name: MATCH Gosia CURRENT identity evidence
'on':
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths: [.github/workflows/hotel-match-gosia-current-evidence-v1.yml]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-gosia-current-evidence-1971-20260922-v1, cancel-in-progress: false}
env:
  OP: hotel-match-gosia-current-evidence-1971-20260922-v1
  BASE: 3fe25fe95621f56354ee6ffdd4d0f448d614b06e
  CLAIM: '5773327270'
jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'ops/match-gosia-current-evidence-1971-20260922-v1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
    - name: Validate exact read-only operation and reserve
      env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
      run: |
        set -euo pipefail; umask 077; mkdir -p input reservation terminal
        cat > input/current_gosia.php <<'PHP_EOF'
        <?php
        declare(strict_types=1);
        const OP='hotel-match-gosia-current-evidence-1971-20260922-v1';
        function need(bool $ok,string $why):void { if(!$ok) throw new RuntimeException($why); }
        function readj(string $p):array { $a=json_decode((string)file_get_contents($p),true,512,JSON_THROW_ON_ERROR);need(is_array($a),'json');return $a; }
        function save(string $p,array $a):string { $b=json_encode($a,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR)."\n";$f=fopen($p,'xb');need($f!==false,'exclusive_create');need(fwrite($f,$b)===strlen($b)&&fflush($f),'durable_write');fclose($f);return hash('sha256',$b); }
        function sql(PDO $db,string $s):array { need(str_starts_with($s,'SELECT '),'select_only');$q=$db->query($s);need($q!==false,'query');return $q->fetchAll(PDO::FETCH_ASSOC)?:[]; }
        function sourceRows(array $e,int $depth=0):array {
          if($depth>12)return [];$out=[];
          if(isset($e['source'])&&is_array($e['source'])){$s=$e['source'];$keep=array_flip(['id','name','lName','stateKey','state','stateLName','townKey','town','townLName','star','starKey','starLName','latitude','longitude']);$out[]=array_intersect_key($s,$keep);}
          if(isset($e['prior_evidence'])&&is_array($e['prior_evidence']))$out=array_merge($out,sourceRows($e['prior_evidence'],$depth+1));return $out;
        }
        if(($argv[1]??'')==='--self-test'){need(sourceRows(['prior_evidence'=>['source'=>['id'=>2000055481,'name'=>'Gosia ','secret'=>'x']]])===[['id'=>2000055481,'name'=>'Gosia ']],'projection');echo "OK\n";exit;}
        need(($argv[1]??'')==='--execute','mode');$root=realpath((string)getenv('ANYTOUR_ROOT'));$dir=realpath((string)getenv('MATCH_OPERATION_DIR'));$in=realpath((string)getenv('MATCH_INPUT_DIR'));$head=(string)getenv('MATCH_SOURCE_SHA');
        need($root!==false&&basename($root)==='anytoour.ru'&&$dir!==false&&basename($dir)===OP&&$in!==false&&preg_match('/^[a-f0-9]{40}$/D',$head)===1,'scope');
        $r=readj("$in/reservation.json");need(($r['operation']??'')===OP&&($r['source_sha']??'')===$head&&($r['script_sha256']??'')===hash_file('sha256',__FILE__),'reservation');
        save("$dir/started.json",['operation'=>OP,'state'=>'started_no_replay','source_sha'=>$head]);
        $base=['operation'=>OP,'source_sha'=>$head,'supplier_http_requests'=>0,'provider_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'no_replay'=>true,'safe_to_write_now'=>false];
        try {
          require_once $root.(is_file("$root/data/db-v1.php")?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
          $db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY');
          $locals=sql($db,"SELECT id,name,country_id,country_name,region_id,region_name,subregion_id,subregion_name,category,is_active,latitude,longitude FROM catalog_hotels WHERE id IN (57656,81379) OR UPPER(name) LIKE '%GOSIA%' ORDER BY id");
          $ids=sql($db,"SELECT supplier_namespace,external_hotel_id,local_hotel_id,decision_status,catalog_sha256,evidence_sha256,evidence_json FROM andromeda_hotel_identities WHERE (supplier_namespace='andromeda_catalog' AND external_hotel_id IN ('2000055481','2000073573')) OR local_hotel_id IN (57656,81379) OR (supplier_namespace='andromeda_catalog' AND evidence_json LIKE '%Gosia%') ORDER BY supplier_namespace,external_hotel_id,local_hotel_id");
          $manual=sql($db,"SELECT catalog_hotel_id,decision_status FROM anex_hotel_decisions WHERE catalog_hotel_id IN (57656,81379) ORDER BY catalog_hotel_id,decision_status");
          $db->rollBack();
          $project=[];foreach($ids as $row){$raw=(string)$row['evidence_json'];$decoded=json_decode($raw,true);$row['source_records']=is_array($decoded)?sourceRows($decoded):[];$row['evidence_json_sha256']=hash('sha256',$raw);$row['recorded_evidence_hash_matches']=hash('sha256',$raw)===(string)$row['evidence_sha256'];unset($row['evidence_json']);$project[]=$row;}
          $target=array_values(array_filter($locals,fn($x)=>(int)$x['id']===57656));$grand=array_values(array_filter($locals,fn($x)=>(int)$x['id']===81379));
          $candidate=array_values(array_filter($project,fn($x)=>$x['supplier_namespace']==='andromeda_catalog'&&(string)$x['external_hotel_id']==='2000055481'));
          $grandSource=array_values(array_filter($project,fn($x)=>$x['supplier_namespace']==='andromeda_catalog'&&(string)$x['external_hotel_id']==='2000073573'));
          $targetOcc=array_values(array_filter($project,fn($x)=>(int)$x['local_hotel_id']===57656));
          $candidateLocals=array_values(array_unique(array_map(fn($x)=>(int)$x['local_hotel_id'],$candidate)));
          $result=$base+['state'=>'completed_read_only','snapshot_at_utc'=>gmdate('c'),'target_local'=>$target,'grand_local'=>$grand,'all_local_gosia_cards'=>$locals,'candidate_2000055481_rows'=>$candidate,'grand_2000073573_rows'=>$grandSource,'target_57656_current_identities'=>$targetOcc,'candidate_current_local_targets'=>$candidateLocals,'manual_rows'=>$manual,'all_projected_identity_rows'=>$project];
          $hash=save("$dir/result.json",$result);save("$dir/receipt.json",$base+['state'=>'completed_read_only','result_sha256'=>$hash,'counts'=>['local_gosia_cards'=>count($locals),'candidate_rows'=>count($candidate),'grand_rows'=>count($grandSource),'target_identity_rows'=>count($targetOcc),'manual_rows'=>count($manual)]]);echo json_encode(['candidate_current_local_targets'=>$candidateLocals,'candidate_rows'=>count($candidate),'target_identity_rows'=>count($targetOcc),'manual_rows'=>count($manual)],JSON_THROW_ON_ERROR)."\n";
        } catch(Throwable $e) { if(isset($db)&&$db->inTransaction())$db->rollBack();save("$dir/failure.json",$base+['state'=>'failed_no_replay','error_class'=>get_class($e)]);exit(1); }
        PHP_EOF
        test "$(git rev-parse HEAD)" = "$HEAD"
        test "$(git merge-base HEAD "$BASE")" = "$BASE"
        test "$(git diff --name-only "$BASE"..HEAD | tr '\n' ' ')" = ".github/workflows/hotel-match-gosia-current-evidence-v1.yml "
        php -l input/current_gosia.php; php input/current_gosia.php --self-test
        gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
        python3 - <<'PY'
        import json,os,pathlib,hashlib,datetime
        c=json.load(open('input/claim.json')); assert c['id']==int(os.environ['CLAIM']) and c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
        for t in (os.environ['OP'],os.environ['BASE'],'2000055481','57656','supplierHTTP0/providerCalls0','DB/mappingwrites0','safe_to_write_now=false'): assert t in c['body'],t
        s=hashlib.sha256(pathlib.Path('input/current_gosia.php').read_bytes()).hexdigest();r={'operation':os.environ['OP'],'state':'reserved_before_db_read','source_sha':os.environ['HEAD'],'script_sha256':s,'supplier_http_requests':0,'provider_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True,'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()};pathlib.Path('reservation/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n');pathlib.Path('input/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
        PY
        rm input/claim.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with: {name: 'match-gosia-current-evidence-reservation-${{ github.run_id }}', path: reservation/, retention-days: 90, if-no-files-found: error}
    - name: Require exact-head Security
      env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
      run: |
        python3 - <<'PY'
        import json,os,time,urllib.request
        u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
        for _ in range(60):
            req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(req,timeout=30) as f: rs=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
            if rs and max(rs,key=lambda x:x['id'])['status']=='completed': assert max(rs,key=lambda x:x['id'])['conclusion']=='success'; break
            time.sleep(5)
        else: raise SystemExit('security_not_green')
        PY
    - name: Read CURRENT Gosia identity evidence without supplier access
      env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
      run: |
        set -euo pipefail; umask 077
        key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/h"; trap 'rm -f "$key" "$known"' EXIT
        if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
        chmod 600 "$key"; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
        r="$USER@$HOST"; op=".anytoour-match/operations/$OP"; a=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
        ssh "${a[@]}" "$r" "set -eu; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/.anytoour-match/operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""
        scp "${a[@]}" input/current_gosia.php input/reservation.json "$r:$op/payload/"
        set +e
        ssh "${a[@]}" "$r" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_INPUT_DIR=\"\$HOME/$op/payload\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/current_gosia.php\" --execute" >terminal/stdout 2>terminal/stderr
        status=$?; ssh "${a[@]}" "$r" "cd \"\$HOME/$op\" && tar -czf - -- *.json" >terminal/server.tgz; set -e; printf '%s\n' "$status" >terminal/exit-code.txt; exit "$status"
    - name: Verify terminal CURRENT evidence
      env: {HEAD: '${{ github.event.pull_request.head.sha }}'}
      run: |
        python3 - <<'PY'
        import tarfile,pathlib,json,hashlib,os
        with tarfile.open('terminal/server.tgz','r:gz') as t:
            for n in ('started.json','result.json','receipt.json'): pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
        r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'));b=pathlib.Path('terminal/result.json').read_bytes()
        assert r['state']==q['state']=='completed_read_only' and r['source_sha']==q['source_sha']==os.environ['HEAD'] and q['result_sha256']==hashlib.sha256(b).hexdigest();assert r['supplier_http_requests']==r['provider_calls']==r['database_writes']==r['mapping_writes']==0 and r['safe_to_write_now'] is False and r['no_replay'] is True
        assert len(r['target_local'])==1 and int(r['target_local'][0]['id'])==57656
        pathlib.Path('terminal/summary.json').write_text(json.dumps({k:v for k,v in r.items() if k not in ('all_projected_identity_rows',)},ensure_ascii=False,indent=2)+'\n')
        print(json.dumps({'candidate_current_local_targets':r['candidate_current_local_targets'],'candidate_rows':len(r['candidate_2000055481_rows']),'grand_rows':len(r['grand_2000073573_rows']),'target_identity_rows':len(r['target_57656_current_identities']),'manual_rows':len(r['manual_rows']),'local_gosia_cards':[(x['id'],x['name'],x['category']) for x in r['all_local_gosia_cards']]},ensure_ascii=False,sort_keys=True))
        PY
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with: {name: 'match-gosia-current-evidence-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
