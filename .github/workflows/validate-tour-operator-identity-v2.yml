name: Validate Tourvisor operator identity v2

on:
  push:
    branches:
      - feat/match-tourvisor-identity-v2-1971-20260917
    paths:
      - 'v2/data/operator-identity-observer-v1.php'
      - 'v2/data/migrations/20260917-tour-operator-identity-v2.sql'
      - 'scripts/diagnostics/hotel_match_tourvisor_identity_backfill_v1.php'
      - 'tests/operator-identity-observer-smoke.php'
      - 'tests/hotel-match-tourvisor-identity-backfill-smoke.php'
      - '.github/workflows/validate-tour-operator-identity-v2.yml'
  pull_request:
    branches:
      - release/search3-production-ready-v1
    paths:
      - 'v2/data/operator-identity-observer-v1.php'
      - 'v2/data/migrations/20260917-tour-operator-identity-v2.sql'
      - 'scripts/diagnostics/hotel_match_tourvisor_identity_backfill_v1.php'
      - 'tests/operator-identity-observer-smoke.php'
      - 'tests/hotel-match-tourvisor-identity-backfill-smoke.php'
      - '.github/workflows/validate-tour-operator-identity-v2.yml'

permissions:
  contents: read

jobs:
  identity-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: PHP syntax
        run: |
          set -euo pipefail
          php -l v2/data/operator-identity-observer-v1.php
          php -l scripts/diagnostics/hotel_match_tourvisor_identity_backfill_v1.php
          php -l tests/operator-identity-observer-smoke.php
          php -l tests/hotel-match-tourvisor-identity-backfill-smoke.php
      - name: Focused identity tests
        run: |
          set -euo pipefail
          php tests/operator-identity-observer-smoke.php
          php tests/hotel-match-tourvisor-identity-backfill-smoke.php
      - name: Migration safety contract
        run: |
          set -euo pipefail
          test "$(grep -c '^ALTER TABLE tour_operator_identity_observations' v2/data/migrations/20260917-tour-operator-identity-v2.sql)" -eq 1
          grep -F 'MODIFY operator_link VARCHAR(2048) NULL' v2/data/migrations/20260917-tour-operator-identity-v2.sql >/dev/null
          grep -F 'ADD COLUMN native_id_conflict TINYINT(1) NOT NULL DEFAULT 0' v2/data/migrations/20260917-tour-operator-identity-v2.sql >/dev/null
          ! grep -Eiq 'curl|wget|https?://' scripts/diagnostics/hotel_match_tourvisor_identity_backfill_v1.php
