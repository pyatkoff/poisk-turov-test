name: MATCH v9 single532 CURRENT receiver v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_v9_single532_current_receiver_v1.php
      - .github/workflows/hotel-match-v9-single532-current-receiver-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-v9-single532-current-receiver-1971-20260921-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-v9-single532-current-receiver-1971-20260921-v1
  BASE_SHA: 316e5cf1e09c158f35772c8e66e3bd0c5be8561f
  CLAIM: '5759473532'
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate source and immutable v9 reconciliation
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"; test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import subprocess,os
          want={'.github/workflows/hotel-match-v9-single532-current-receiver-v1.yml','scripts/diagnostics/hotel_match_v9_single532_current_receiver_v1.php'}
          got=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines());assert got==want,(got,want)
          PY
          php -l scripts/diagnostics/hotel_match_v9_single532_current_receiver_v1.php
          php scripts/diagnostics/hotel_match_v9_single532_current_receiver_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'));b=c['body'].lower();assert c['id']==5759473532 and c['user']['id']==226193297 and c['author_association']=='OWNER'
          for t in [os.environ['OPERATION_ID'].lower(),'artifact10634643226','0995ccbd0c14639a335a644748d6dc5af6b359345328698ea3c0fc1300d88814','exactly532','fun25 280','intourist43 252','db/mapping writes0']:assert t in b,(t,b)
          PY
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10634643226/zip >input/v9rec.zip
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json
          with zipfile.ZipFile('input/v9rec.zip') as z:b=z.read('reconciliation.json')
          assert hashlib.sha256(b).hexdigest()=='0995ccbd0c14639a335a644748d6dc5af6b359345328698ea3c0fc1300d88814'
          x=json.loads(b);r=x['source_result'];es=[e for e in r['edges'] if e.get('link_state')=='captured_single_native' and e.get('operator_id') in (25,43)]
          assert len(es)==532 and sum(e['operator_id']==25 for e in es)==280 and sum(e['operator_id']==43 for e in es)==252
          pathlib.Path('input/reconciliation.json').write_bytes(b)
          PY
      - name: Reserve before CURRENT DB read
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,datetime,pathlib
          x={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_db','source_sha':os.environ['HEAD_SHA'],'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'provider_calls':0,'database_writes':0,'mapping_writes':0}
          pathlib.Path('reservation/reservation.json').write_text(json.dumps(x,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'v9-single532-current-v1-reservation-${{ github.run_id }}', path: reservation/reservation.json, retention-days: 90}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD_SHA']+'&per_page=100'
          for _ in range(90):
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(q) as f:xs=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD_SHA']]
            if xs and max(xs,key=lambda x:x['id'])['status']=='completed':
              x=max(xs,key=lambda x:x['id']);assert x['conclusion']=='success',x;break
            time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Execute CURRENT receiver
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_v9_single532_current_receiver_v1.php input/reconciliation.json reservation/reservation.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_INPUT_PATH=\"\$HOME/$op/payload/reconciliation.json\" php \"\$HOME/$op/payload/hotel_match_v9_single532_current_receiver_v1.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          ssh "${opts[@]}" "$remote" 'cd "$HOME/'"$op"'" && tar -czf - result.json receipt.json' >terminal/server.tgz
      - name: Verify result
        run: |
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
            for n in ['result.json','receipt.json']:pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['operation']==q['operation']=='hotel-match-v9-single532-current-receiver-1971-20260921-v1' and r['state']==q['state']=='completed_read_only'
          assert r['input_single_native_edges']==532 and len(r['rows'])==532
          assert r['provider_calls']==r['tourvisor_calls']==r['samo_calls']==r['andromeda_calls']==r['database_writes']==r['mapping_writes']==0
          assert all(x['safe_to_write_now'] is False for x in r['rows']);assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          print(json.dumps({'classification_counts':r['classification_counts'],'edges_with_explicit_saved_bridge':r['edges_with_explicit_saved_bridge'],'aggregate_pool_candidates':r['aggregate_pool_candidates'],'result_sha256':q['result_sha256']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-v9-single532-current-v1-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
