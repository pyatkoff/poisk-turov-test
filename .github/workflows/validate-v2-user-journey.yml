name: Validate V2 live user journey
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v2-user-journey.yml'

jobs:
  live-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Live tourist journey without lead write
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "JOURNEY_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2"
            api="$base/api-v2.php"

            page_code="$(curl -k -L -sS -o /tmp/v2-journey-page.html -w "%{http_code}" --max-time 40 "$base/")"
            test "$page_code" = "200" || fail page_http
            for marker in "analytics-v4.js" "results-renderer-v5.js" "hotel-actions-v3.js" "room-details-v3.js" "tour-controller-v4.js" "lead-form-guard-v1.js" "flight-price-sync-v1.js"; do
              grep -q "$marker" /tmp/v2-journey-page.html || fail "page_marker_$marker"
            done
            echo "JOURNEY_PAGE_OK"

            curl -k -L -sS --max-time 45 "$api?action=departures" -o /tmp/v2-journey-departures.json
            curl -k -L -sS --max-time 45 "$api?action=countries&departureId=1" -o /tmp/v2-journey-countries.json
            python3 -c "import json; assert len(json.load(open(\"/tmp/v2-journey-departures.json\"))) > 0; assert len(json.load(open(\"/tmp/v2-journey-countries.json\"))) > 0"
            echo "JOURNEY_CATALOGS_OK"

            from="$(date -d "+2 day" +%Y-%m-%d)"
            till="$(date -d "+9 day" +%Y-%m-%d)"
            start_code="$(curl -k -L -sS -o /tmp/v2-journey-start.json -w "%{http_code}" --max-time 50 --get \
              --data-urlencode "action=search_start" \
              --data-urlencode "departureId=1" \
              --data-urlencode "countryId=4" \
              --data-urlencode "dateFrom=$from" \
              --data-urlencode "dateTo=$till" \
              --data-urlencode "nightsFrom=7" \
              --data-urlencode "nightsTo=10" \
              --data-urlencode "adults=2" \
              --data-urlencode "currency=RUB" "$api")"
            test "$start_code" = "200" || fail search_start_http
            search_id="$(python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-start.json\")); print(d.get(\"searchId\",\"\") if isinstance(d,dict) else \"\")")"
            test -n "$search_id" || fail search_id
            echo "JOURNEY_SEARCH_ID=$search_id"

            complete=0
            for attempt in $(seq 1 20); do
              sleep 2
              code="$(curl -k -L -sS -o /tmp/v2-journey-status.json -w "%{http_code}" --max-time 45 "$api?action=search_status&searchId=$search_id")"
              if test "$code" = "200" && python3 -c "import json,sys; d=json.load(open(\"/tmp/v2-journey-status.json\")); sys.exit(0 if d.get(\"progress\")==100 or d.get(\"status\")==\"complete\" else 1)"; then complete=1; break; fi
            done
            test "$complete" = "1" || fail search_not_complete

            curl -k -L -sS --max-time 45 "$api?action=search_results&searchId=$search_id&limit=25" -o /tmp/v2-journey-results.json
            python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-results.json\")); assert isinstance(d,list) and len(d)>0; assert any(isinstance(h,dict) and isinstance(h.get(\"tours\"),list) and h.get(\"tours\") for h in d)"
            before="$(python3 -c "import json; print(len(json.load(open(\"/tmp/v2-journey-results.json\"))))")"
            echo "JOURNEY_RESULTS_BEFORE=$before"

            continue_code="$(curl -k -L -sS -o /tmp/v2-journey-continue.json -w "%{http_code}" --max-time 50 "$api?action=search_continue&searchId=$search_id")"
            test "$continue_code" = "200" || fail continue_http
            continue_complete=0
            for attempt in $(seq 1 10); do
              sleep 2
              code="$(curl -k -L -sS -o /tmp/v2-journey-status2.json -w "%{http_code}" --max-time 45 "$api?action=search_status&searchId=$search_id")"
              if test "$code" = "200" && python3 -c "import json,sys; d=json.load(open(\"/tmp/v2-journey-status2.json\")); sys.exit(0 if d.get(\"progress\")==100 or d.get(\"status\")==\"complete\" else 1)"; then continue_complete=1; break; fi
            done
            test "$continue_complete" = "1" || fail continue_not_complete
            curl -k -L -sS --max-time 45 "$api?action=search_results&searchId=$search_id&limit=100" -o /tmp/v2-journey-results100.json
            python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-results100.json\")); ids=[str(x.get(\"id\")) for x in d if isinstance(x,dict) and x.get(\"id\") is not None]; assert len(ids)==len(set(ids)); assert len(d)>0"
            after="$(python3 -c "import json; print(len(json.load(open(\"/tmp/v2-journey-results100.json\"))))")"
            echo "JOURNEY_RESULTS_AFTER=$after"

            read hotel_id tour_id < <(python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-results100.json\")); pairs=[(h.get(\"id\"),t.get(\"id\")) for h in d if isinstance(h,dict) for t in (h.get(\"tours\") or []) if isinstance(t,dict) and h.get(\"id\") and t.get(\"id\")]; assert pairs; print(pairs[0][0],pairs[0][1])")
            test -n "$hotel_id" || fail hotel_id
            test -n "$tour_id" || fail tour_id
            echo "JOURNEY_PICK hotelId=$hotel_id tourId=$tour_id"

            hotel_code="$(curl -k -L -sS -o /tmp/v2-journey-hotel.json -w "%{http_code}" --max-time 45 "$api?action=hotel_details&hotelId=$hotel_id")"
            test "$hotel_code" = "200" || fail hotel_details_http
            python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-hotel.json\")); assert isinstance(d,dict) and d"
            echo "JOURNEY_HOTEL_OK"

            tour_code="$(curl -k -L -sS -o /tmp/v2-journey-tour.json -w "%{http_code}" --max-time 45 --get --data-urlencode "action=tour" --data-urlencode "tourId=$tour_id" --data-urlencode "currency=RUB" "$api")"
            test "$tour_code" = "200" || fail tour_http
            python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-tour.json\")); assert isinstance(d,dict) and str(d.get(\"id\",\"\"))"
            room_id="$(python3 -c "import json; t=json.load(open(\"/tmp/v2-journey-tour.json\")); vals=[t.get(\"roomId\"),t.get(\"roomTypeId\"),(t.get(\"room\") or {}).get(\"id\") if isinstance(t.get(\"room\"),dict) else None]; print(next((str(int(float(v))) for v in vals if v and str(v).replace(\".0\",\"\").isdigit() and int(float(v))>0),\"\"))")"
            if test -n "$room_id"; then
              echo "JOURNEY_TOUR_OK roomId=$room_id"
              room_code="$(curl -k -L -sS -o /tmp/v2-journey-room.json -w "%{http_code}" --max-time 45 --get --data-urlencode "action=rooms" --data-urlencode "ids=$room_id" "$api")"
              test "$room_code" = "200" || fail room_http
              python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-room.json\")); rooms=d if isinstance(d,list) else d.get(\"rooms\",[]) if isinstance(d,dict) else []; assert rooms"
              echo "JOURNEY_ROOM_OK"
            else
              echo "JOURNEY_TOUR_OK roomId=optional_missing"
              echo "JOURNEY_ROOM_SKIPPED_OPTIONAL"
            fi

            flights_code="$(curl -k -L -sS -o /tmp/v2-journey-flights.json -w "%{http_code}" --max-time 45 --get --data-urlencode "action=flights" --data-urlencode "tourId=$tour_id" --data-urlencode "currency=RUB" "$api")"
            test "$flights_code" = "200" || fail flights_http
            python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-flights.json\")); v=d if isinstance(d,list) else d.get(\"flights\",[]) if isinstance(d,dict) else []; assert v; f=v[0]; assert isinstance(f,dict) and (f.get(\"forward\") or f.get(\"backward\"))"
            echo "JOURNEY_FLIGHTS_OK"

            lead_code="$(curl -k -L -sS -o /tmp/v2-journey-lead-health.json -w "%{http_code}" --max-time 30 "$base/lead-adapter-v2.php")"
            test "$lead_code" = "200" || fail lead_health_http
            python3 -c "import json; d=json.load(open(\"/tmp/v2-journey-lead-health.json\")); assert d.get(\"ok\") is True and d.get(\"adapter\")==\"v2-direct-bitrix-lead\" and d.get(\"writes\") is True"
            echo "JOURNEY_LEAD_FORM_READY_NO_POST"
            echo "V2_USER_JOURNEY_OK searchId=$search_id hotelId=$hotel_id tourId=$tour_id roomId=${room_id:-optional_missing} before=$before after=$after"
          '
