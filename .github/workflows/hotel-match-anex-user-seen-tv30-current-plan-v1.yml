name: MATCH current ANEX user-seen TV30 planner v1

on:
  push:
    branches:
      - ops/match-anex-user-seen-tv30-current-plan-1971-20260919-v1
    paths:
      - scripts/diagnostics/hotel_match_anex_user_seen_tv30_current_plan_v1.php
      - .github/workflows/hotel-match-anex-user-seen-tv30-current-plan-v1.yml

permissions:
  contents: read

env:
  OPERATION_ID: hotel-match-anex-user-seen-tv30-current-plan-1971-20260919-v1

jobs:
  plan:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate supplier-free planner
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_anex_user_seen_tv30_current_plan_v1.php
          php scripts/diagnostics/hotel_match_anex_user_seen_tv30_current_plan_v1.php --self-test
          test "$(grep -Ec 'https?://|curl|search_start|search_continue|Tourvisor' scripts/diagnostics/hotel_match_anex_user_seen_tv30_current_plan_v1.php || true)" -eq 0

      - name: Require SSH credentials
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"; test -n "$HOST_VALUE"; test -n "$USER_VALUE"

      - name: CURRENT DB read only
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p result
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null; test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytour-operations/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "umask 077; rm -rf \"\$HOME/$op\"; mkdir -p \"\$HOME/$op\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_anex_user_seen_tv30_current_plan_v1.php "$remote:$op/"
          ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" php \"\$HOME/$op/hotel_match_anex_user_seen_tv30_current_plan_v1.php\"" > result/result.json
          python3 - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path('result/result.json'); d=json.loads(p.read_text())
          assert d['status']=='read_only_complete'
          assert d['supplier_calls']==0 and d['tourvisor_calls']==0 and d['database_writes']==0 and d['mapping_writes']==0
          b=d.get('best_batch')
          assert b and 1 <= b['selected_count'] <= 30
          assert len(b['hotel_ids'])==b['selected_count']==len(set(b['hotel_ids']))
          assert b['nights_from']==7 and b['nights_to']==10 and b['adults']==2 and b['children_count']==0
          summary={
            'operation':d['operation'],'eligible_unique_hotels':d['eligible_unique_hotels'],'context_count':d['context_count'],
            'current_counts':d['current_counts'],'stats':d['stats'],'best_batch':b,
            'result_sha256':hashlib.sha256(p.read_bytes()).hexdigest()
          }
          pathlib.Path('result/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-anex-user-seen-tv30-current-plan-v1
          path: result/
          if-no-files-found: error
          retention-days: 90
