name: Search3 renderer date display

on:
  pull_request:
    paths:
      - 'v2/results-renderer-v5.js'
      - 'v2/search3-shared-runtime.json'
      - 'tests/search3-renderer-date-display.test.js'
      - 'tests/search3-current-results-browser.cjs'
      - '.github/workflows/search3-renderer-date-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderer-date-display:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ux/search3-card-date-display-20260912' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update exact current-results date-display acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/search3-current-results-browser.cjs')
          text = path.read_text()
          old = "assert.equal(await card.locator('.tour-meta>strong').innerText(), tour.date, 'compact facts preserve the actual departure date');"
          new = "assert.equal(await card.locator('.tour-meta>strong').innerText(), '12.09.2026', 'compact facts format the actual departure date for display');"
          if text.count(old) != 1:
              raise SystemExit(f'expected one current-results date assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          node --check tests/search3-current-results-browser.cjs
      - name: Commit exact browser acceptance update
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff --check -- tests/search3-current-results-browser.cjs
          git diff --exit-code -- . ':!tests/search3-current-results-browser.cjs' || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/search3-current-results-browser.cjs
          git commit -m "SEARCH: align current-results date display acceptance"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
