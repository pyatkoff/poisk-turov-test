name: Search3 renderer date display

on:
  pull_request:
    paths:
      - 'v2/results-renderer-v5.js'
      - 'v2/search3-shared-runtime.json'
      - 'tests/search3-renderer-date-display.test.js'
      - '.github/workflows/search3-renderer-date-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderer-date-display:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ux/search3-card-date-display-20260912' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Syntax check canonical renderer
        run: node --check v2/results-renderer-v5.js
      - name: Verify display-only date normalization
        run: node tests/search3-renderer-date-display.test.js
      - name: Guard against timezone parsing and source mutation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'new[[:space:]]+Date\(' v2/results-renderer-v5.js
          grep -Fq "date=formatTourDate(t.date)" v2/results-renderer-v5.js
          grep -Fq "formatTourDate" tests/search3-renderer-date-display.test.js
      - name: Regenerate canonical shared runtime
        run: node scripts/build/search3-js/shared-runtime.cjs --write
      - name: Commit exact generated runtime when stale
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- v2/search3-shared-runtime.json; then
            echo SEARCH3_SHARED_RUNTIME_ALREADY_CURRENT
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/search3-shared-runtime.json
          git commit -m "SEARCH: regenerate shared runtime for renderer date display"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
