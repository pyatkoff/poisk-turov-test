name: Search3 renderer date display

on:
  pull_request:
    paths:
      - 'v2/results-renderer-v5.js'
      - 'v2/search3-shared-runtime.json'
      - 'v2/assets/operator-logos/**'
      - 'tests/search3-renderer-date-display.test.js'
      - 'tests/search3-hotel-operator-card.test.js'
      - 'tests/search3-hotel-operator-card-browser.cjs'
      - 'tests/search3-current-results-browser.cjs'
      - '.github/workflows/search3-renderer-date-display.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-date-display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Retain verified public brand originals for review
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'search3-brand-originals'
          out.mkdir()
          sources = {
              'funsun.svg':'https://api.selcdn.ru/v1/SEL_50469/funandsun-cdn/46810898-51d6-45d4-a9ff-7a110d7e27d6.svg',
              'anex.svg':'https://files1.anextour.ru/user-files/elfinder/com/logo/logo-anex.svg',
              'biblio-globus.svg':'https://www.bgoperator.ru/img/logo.svg',
              'intourist.png':'https://pix.intourist.ru/assets/images/loader-logo.png'
          }
          records = []
          for name, url in sources.items():
              record = {'file':name,'source':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'AnyTour public brand review'}),timeout=15) as response:
                      data=response.read(200001)
                      if len(data)>200000: raise ValueError('oversize asset')
                  (out/name).write_bytes(data)
                  record.update(sha256=hashlib.sha256(data).hexdigest(),size=len(data))
              except Exception as error: record['error']=str(error)
              records.append(record)
          (out/'provenance.json').write_text(json.dumps(records,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
      - name: Syntax check canonical renderer
        run: node --check v2/results-renderer-v5.js
      - name: Verify display-only date normalization
        run: node tests/search3-renderer-date-display.test.js
      - name: Syntax check current-results visual contract
        run: node --check tests/search3-current-results-browser.cjs
      - name: Guard against timezone parsing and source mutation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'new[[:space:]]+Date\(' v2/results-renderer-v5.js
          grep -Fq "date=formatTourDate(t.date)" v2/results-renderer-v5.js
          grep -Fq "formatTourDate" tests/search3-renderer-date-display.test.js
          grep -Fq "innerText(), '12.09.2026'" tests/search3-current-results-browser.cjs
      - name: Regenerate canonical shared runtime candidate
        run: |
          python3 -B scripts/build/search3_assets.py --write
          node scripts/build/search3-js/shared-runtime.cjs --write
      - name: Upload exact card materialization and brand originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-card-originals-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/search3-brand-originals/
            v2/search3-shared-runtime.json
          if-no-files-found: error
          retention-days: 3
      - name: Require committed shared runtime parity
        run: git diff --exit-code -- v2/search3-shared-runtime.json v2/search3-entry-v1.css v2/search3-results-filters-v1.css docs/project/search3-production-import.json
