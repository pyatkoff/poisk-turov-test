name: MATCH old Tourvisor HOTELLIST mass targeted v4
on:
  push:
    branches: [match/manual-live-review-queue-1971-20260914]
    paths:
      - 'scripts/diagnostics/hotel_match_old_tv_hotellist_mass.php'
      - '.github/workflows/hotel-match-old-tv-hotellist-mass-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-old-tv-hotellist-mass-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-old-tv-hotellist-mass-1971-20260914-v4-egypt
  MATCH_DATE: '2026-11-04'
  MATCH_FOCUS_PAIRS: '42927:131347,19226:14140,37048:97122,1361:125,16232:522,4158:37412,28396:293,36906:21636,1286:482,780:464,37721:111423,37719:132075,1771:190,1655:157782,37012:83106,30600:129,1772:191,44562:159,30599:159159,1767:182,835:196,28563:73342,4131:488,1768:183,524:338,781:483,1328:128,5215:121626,45330:130621,45249:127294'
  MATCH_LIMIT: '30'
  OUT: /tmp/match-old-tv-hotellist-mass-v4
jobs:
  probe:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Offline scope checks
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '23d62460a78ca5378471c4d848acf5f30538f4513b4398904ebf32cb74b83d0c' 'scripts/diagnostics/hotel_match_old_tv_hotellist_mass.php' | sha256sum -c -
          php -l scripts/diagnostics/hotel_match_old_tv_hotellist_mass.php
          php scripts/diagnostics/hotel_match_old_tv_hotellist_mass.php --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_old_tv_hotellist_mass.php
      - name: Run immutable mass HOTELLIST evidence probe
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          key="$RUNNER_TEMP/match-old-tv-mass-key"; known="$RUNNER_TEMP/match-old-tv-mass-known"; sock="$RUNNER_TEMP/match-old-tv-mass.sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=900 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' MATCH_DATE='$MATCH_DATE' MATCH_LIMIT='$MATCH_LIMIT' MATCH_FOCUS_PAIRS='$MATCH_FOCUS_PAIRS' php -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_old_tv_hotellist_mass.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"
          trc=$?
          set -e
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def load(n):
              try:return json.loads((out/n).read_text())
              except Exception:return {}
          reservation=load('reservation.json'); result=load('result.json'); receipt=load('receipt.json')
          rh=hashlib.sha256((out/'result.json').read_bytes()).hexdigest() if (out/'result.json').exists() else None
          calls=result.get('tourvisor_calls')
          ok=(result.get('status') in {'completed','partial_rate_limited','partial_auth_rejected','blocked'}
              and result.get('credential_identifier')=='TOURVISOR_JWT'
              and reservation.get('credential_identifier')=='TOURVISOR_JWT'
              and reservation.get('state')=='reserved_before_db_and_supplier_access'
              and reservation.get('date')==os.environ['MATCH_DATE'] and reservation.get('limit')==30
              and all(x.get('operation_id')==os.environ['OPERATION_ID']
                      and x.get('source_sha')==os.environ['GITHUB_SHA'] and x.get('no_replay') is True
                      for x in (reservation,result,receipt))
              and receipt.get('state')==result.get('status')
              and receipt.get('readback_verified') is True and receipt.get('result_sha256')==rh
              and all(result.get(k)==0 for k in ('database_writes','mapping_writes','booking_calls','lead_calls','new_tourvisor_calls'))
              and type(calls) is int and 0<=calls<=39)
          completed=ok and result.get('status')=='completed' and int(os.environ['RC'])==0 and int(os.environ['TRC'])==0
          gate={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],
                'verified':ok,'provider_acquisition_completed':completed,
                'status':result.get('status'),'reason':result.get('reason'),'tourvisor_calls':calls,
                'last_stage':result.get('last_stage'),'call_count_unit':result.get('call_count_unit'),
                'flattened_rows':result.get('flattened_rows'),'unique_tours_selected':result.get('unique_tours_selected'),
                'detail_rows':result.get('detail_rows'),'direct_hotellist_identities':result.get('direct_hotellist_identities'),
                'safe_current_candidates':result.get('safe_current_candidates'),'existing_same_pair':result.get('existing_same_pair'),
                'holds':result.get('holds'),'rate_limited':result.get('rate_limited'),'auth_rejected':result.get('auth_rejected'),
                'remote_exit':int(os.environ['RC']),'tar_exit':int(os.environ['TRC']),'result_sha256':rh,
                'database_writes':0,'mapping_writes':0,'no_replay':True}
          (out/'workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not completed: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'match-old-tv-hotellist-mass-${{ github.run_id }}'
          path: '${{ env.OUT }}/'
          retention-days: 90
