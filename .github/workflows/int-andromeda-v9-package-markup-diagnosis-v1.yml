name: INT inspect sealed Andromeda v9 package transport money

on:
  push:
    branches: ['ops/int-andromeda-v9-package-markup-diagnosis-20260918-v1']
    paths: ['.github/workflows/int-andromeda-v9-package-markup-diagnosis-v1.yml']

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/ops/int-andromeda-v9-package-markup-diagnosis-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect retained package transport money only
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/result"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/ssh/key"; fi
          chmod 600 "$RUNNER_TEMP/ssh/key"; ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 "$REMOTE_USER@$HOST" 'php -d display_errors=0 -d log_errors=0' > "$RUNNER_TEMP/result/result.json" <<'PHP'
          <?php
          declare(strict_types=1); error_reporting(0);
          $fail=static function(string $r):never{fwrite(STDERR,"MARKUP_FAIL ".preg_replace('/[^A-Za-z0-9_.:-]+/','_',$r)."\n");exit(2);};
          $read=static function(string $p,int $max=3000000):?array{if(is_link($p)||!is_file($p))return null;$s=filesize($p);if(!is_int($s)||$s<2||$s>$max)return null;try{$v=json_decode((string)file_get_contents($p),true,64,JSON_THROW_ON_ERROR);return is_array($v)?$v:null;}catch(Throwable){return null;}};
          $flat=static function(array $root,string $outer,string $inner):array{$out=[];foreach(($root[$outer]??[]) as $b){if(!is_array($b)||!is_array($b[$inner]??null))continue;foreach($b[$inner] as $r)if(is_array($r))$out[]=$r;}return $out;};
          $money=static function(mixed $v,int $scale=6):?string{if(is_int($v))$v=(string)$v;if(is_float($v)&&is_finite($v))$v=rtrim(rtrim(sprintf('%.'.$scale.'F',$v),'0'),'.');if(!is_string($v)||!preg_match('/\A(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,'.$scale.'})?\z/D',$v))return null;return $v;};
          $currency=static function(mixed $v):?string{return is_string($v)&&preg_match('/\A[A-Z0-9_]{2,8}\z/D',$v)?$v:null;};
          $home=rtrim((string)getenv('HOME'),'/');$dir=$home.'/.anytoour-andromeda/searches';if($home===''||!is_dir($dir)||is_link($dir))$fail('search_dir');
          $first=null;$inventory=0;
          foreach(new DirectoryIterator($dir) as $e){if($e->isDot())continue;if(++$inventory>100000)$fail('inventory');if($e->isLink()||!$e->isFile()||!preg_match('/\A([a-f0-9]{64})-1\.json\z/D',$e->getFilename(),$m))continue;
            $x=$read($e->getPathname());$c=is_array($x)?($x['criteria']??null):null;$st=is_array($x)?($x['store']??null):null;
            if(!is_array($c)||!is_array($st)||($x['generation']??null)!==17171829||!is_int($st['created_at']??null))continue;
            if((string)($c['CHECKIN_BEG']??'')==='20261017'&&(string)($c['CHECKIN_END']??'')==='20261017'&&(string)($c['NIGHTS_FROM']??'')==='7'&&(string)($c['NIGHTS_TILL']??'')==='7'&&(string)($c['ADULT']??'')==='2'&&(string)($c['CHILD']??'')==='0')
              if($first===null||$st['created_at']>$first['created'])$first=['ref'=>$m[1],'created'=>$st['created_at']];
          }
          if($first===null)$fail('cohort');$ref=$first['ref'];$created=$first['created'];
          $offerMoney=[];
          foreach(new DirectoryIterator($dir) as $e){if($e->isDot()||$e->isLink()||!$e->isFile())continue;$n=$e->getFilename();$page=null;
            if($n===$ref.'-1.json')$page=1;elseif(preg_match('/\A'.preg_quote($ref,'/').'-'.preg_quote((string)$created,'/').'-(\d+)\.json\z/D',$n,$m))$page=(int)$m[1];if($page===null)continue;
            $x=$read($e->getPathname());$snap=is_array($x)?($x['store']['snapshot']??null):null;if(!is_array($snap)||!is_array($snap['offers']??null))continue;
            foreach($snap['offers'] as $o){if(!is_array($o)||!is_string($o['offer_ref']??null)||!is_array($o['price']??null))continue;$a=$money($o['price']['amount']??null,4);$c=$currency($o['price']['currency']??null);if($a!==null&&$c!==null)$offerMoney[$o['offer_ref']]=['amount'=>$a,'currency'=>$c];}
          }
          $records=[];$paths=[];$prefix=$ref.'-'.$created.'-';
          foreach(new DirectoryIterator($dir) as $e){if($e->isDot()||$e->isLink()||!$e->isFile())continue;$n=$e->getFilename();if(str_starts_with($n,$prefix)&&str_ends_with($n,'-package.json'))$paths[]=$e->getPathname();}
          sort($paths,SORT_STRING);
          foreach($paths as $path){$env=$read($path);$rec=is_array($env)?($env['record']??null):null;if(!is_array($rec)||($rec['status']??null)!=='captured'||!is_array($rec['private_package']??null))continue;
            $ctx=$rec['context']??[];$or=is_array($ctx)&&is_string($ctx['offer_ref']??null)?$ctx['offer_ref']:'';$search=$offerMoney[$or]??null;if(!is_array($search))$fail('search_money');
            $pkg=$rec['private_package'];$doc=is_array($pkg['claimDocument'][0]??null)?$pkg['claimDocument'][0]:[];
            $markups=[];$markupTypes=[];$currencyTypes=[];$markupScalars=[];$currencyScalars=[];
            foreach(($pkg['variants']??[]) as $v){if(!is_array($v))continue;foreach($flat($v,'transports','transport') as $t){if(($t['type']??null)!=='ttAvia')continue;foreach(($t['details']??[]) as $b){if(!is_array($b)||!is_array($b['detail']??null))continue;foreach($b['detail'] as $d){if(!is_array($d)||!array_key_exists('markup',$d)||!array_key_exists('currency',$d))continue;
              $mv=$d['markup'];$cv=$d['currency'];$mt=get_debug_type($mv);$ct=get_debug_type($cv);$markupTypes[$mt]=($markupTypes[$mt]??0)+1;$currencyTypes[$ct]=($currencyTypes[$ct]??0)+1;
              if(is_scalar($mv)){ $s=trim((string)$mv); if(strlen($s)<=32 && preg_match('/\A[-+A-Za-z0-9., _]+\z/D',$s)) $markupScalars[$s]=true; }
              if(is_scalar($cv)){ $s=trim((string)$cv); if(strlen($s)<=32 && preg_match('/\A[-+A-Za-z0-9., _]+\z/D',$s)) $currencyScalars[$s]=true; }
              $a=$money($mv,2);$cc=$currency($cv);if($a!==null&&$cc!==null)$markups[]=['amount'=>$a,'currency'=>$cc];
            }}}}
            ksort($markupTypes,SORT_STRING);ksort($currencyTypes,SORT_STRING);ksort($markupScalars,SORT_STRING);ksort($currencyScalars,SORT_STRING);
            $distinct=[];foreach($markups as $m)$distinct[$m['currency'].':'.$m['amount']]=$m;ksort($distinct,SORT_STRING);
            $rates=[];foreach($flat($doc,'moneys','money') as $m){$c=$currency($m['currency']??null);$r=$money($m['rate']??null,6);if($c===null||$r===null||!preg_match('/[1-9]/',$r))continue;$key=$c.':'.$r;$rates[$key]=['currency'=>$c,'rate'=>$r,'is_claim_currency'=>(string)($m['isClaimCurrency']??'')==='true'?true:((string)($m['isClaimCurrency']??'')==='false'?false:null)];}ksort($rates,SORT_STRING);
            $buyer=[];foreach($flat($doc,'buyerMoneys','buyerClaimMoney') as $m){$a=$money($m['net']??null,2);$c=$currency($m['currency']??null);if($a!==null&&$c!==null)$buyer[]=['amount'=>$a,'currency'=>$c];}
            $fuel=[];foreach($flat($doc,'services','service') as $s){if((string)($s['servicetype']??'')!=='8'||(string)($s['servicecategoryName']??'')!=='Топливный сбор')continue;$a=$money($s['price']??null,2);$c=$currency($s['currencyAlias']??null);$fuel[]=['money_present'=>$a!==null&&$c!==null,'amount'=>$a,'currency'=>$c];}
            $stem=substr($path,0,-strlen('-package.json'));$side=$read($stem.'-surcharge-v1.json',16384);$fact=is_array($side)?($side['fact']??null):null;
            $records[]=['search_price'=>$search,'package_buyer_money'=>$buyer,'transport_markup_rows'=>count($markups),'transport_markup_distinct'=>array_values($distinct),'markup_types'=>$markupTypes,'currency_types'=>$currencyTypes,'markup_scalars'=>array_keys($markupScalars),'currency_scalars'=>array_keys($currencyScalars),'operator_currency_rates'=>array_values($rates),'fuel_services'=>$fuel,'surcharge_fact_state'=>is_array($fact)&&is_string($fact['state']??null)?$fact['state']:null];
          }
          if(count($records)!==4)$fail('package_count');
          echo json_encode(['schema_version'=>1,'source'=>'andromeda-v9-package-markup-diagnosis-v1','cohort'=>['generation'=>17171829,'package_records'=>count($records)],'records'=>$records,'supplier_calls'=>0,'db_reads'=>0,'db_writes'=>0,'remote_filesystem_writes'=>0,'booking_calls'=>0,'lead_calls'=>0,'search3_publication'=>0,'production_webroot_writes'=>0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          PHP
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result','result.json');d=json.load(open(p,encoding='utf-8'))
          assert d['source']=='andromeda-v9-package-markup-diagnosis-v1' and d['cohort']['package_records']==4 and len(d['records'])==4
          assert d['supplier_calls']==d['db_reads']==d['db_writes']==d['remote_filesystem_writes']==d['booking_calls']==d['lead_calls']==d['search3_publication']==d['production_webroot_writes']==0
          for r in d['records']:
              assert r['surcharge_fact_state']=='unknown'
              assert sum(r['markup_types'].values())>0 and sum(r['currency_types'].values())>0
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload sanitized package money diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-andromeda-v9-package-markup-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 14
