name: MATCH Surmeli Andromeda accept v1
on:
  push:
    branches: [ops/match-surmeli-andromeda-accept-1971-20260913-v1]
    paths: [.github/match-surmeli-andromeda-accept-1971-20260913-v1.arm]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-surmeli-andromeda-accept-1971-20260913-v1}
jobs:
  accept:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve before SSH
        run: |
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          printf '%s\n' '{"operation_id":"hotel-match-surmeli-andromeda-accept-1971-20260913-v1","state":"reserved_before_ssh","external_hotel_id":"43248","target_local":17657,"planned_writes":1,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}' > "$RUNNER_TEMP/$OPERATION_ID/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-surmeli-andromeda-accept-v1-reservation, path: '${{ runner.temp }}/hotel-match-surmeli-andromeda-accept-1971-20260913-v1/reservation.json', retention-days: 90}
      - name: Accept CURRENT strict Surmeli bridge
        id: write
        continue-on-error: true
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path;state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];php='''<?php
          $op='hotel-match-surmeli-andromeda-accept-1971-20260913-v1';$committed=false;try{$root=realpath(getcwd());require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->beginTransaction();$q=$db->prepare("SELECT * FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND external_hotel_id='43248' FOR UPDATE");$q->execute();$r=$q->fetch(PDO::FETCH_ASSOC);if(!$r||(string)$r['decision_status']!=='pending'||$r['local_hotel_id']!==null)throw new RuntimeException('andromeda_state_changed');$prior=$r['evidence_sha256'];$q=$db->prepare("SELECT anex_hotel_id,catalog_hotel_id,enabled FROM anex_hotel_search_mappings WHERE anex_hotel_id=31364 FOR UPDATE");$q->execute();$a=$q->fetch(PDO::FETCH_ASSOC);if(!$a||(int)$a['catalog_hotel_id']!==17657||(int)$a['enabled']!==1)throw new RuntimeException('anex_anchor_changed');$q=$db->prepare("SELECT id,name,region_name,subregion_name,category FROM catalog_hotels WHERE id=17657 FOR UPDATE");$q->execute();$h=$q->fetch(PDO::FETCH_ASSOC);if(!$h||$h['name']!=='SURMELI ISTANBUL HOTEL'||$h['region_name']!=='Стамбул'||$h['subregion_name']!=='Шишли'||(int)$h['category']!==5)throw new RuntimeException('target_changed');$ev=json_decode((string)$r['evidence_json'],true);if(!is_array($ev))$ev=[];$src=$ev['source']??[];$name=(string)($src['name']??'');$lname=(string)($src['lName']??'');$town=(string)($src['town']??'');$star=(int)($src['star']??0);if(stripos($name,'Surmeli')===false&&stripos($lname,'Surmeli')===false)throw new RuntimeException('source_name_changed');if(mb_stripos($town,'Шишли')===false||$star!==5)throw new RuntimeException('source_geo_or_star_changed');$new=['prior_evidence'=>$ev,'promotion'=>['operation_id'=>$op,'review_operation'=>'hotel-match-current-supplier-bridge-review-1971-20260913-v4','lane'=>'MATCH','rule'=>'strict_supplier_bridge','bridge_provider'=>'anex','anex_hotel_id'=>31364,'target'=>17657,'server_current'=>true]];$json=json_encode($new,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);$hash=hash('sha256',$json);$u=$db->prepare("UPDATE andromeda_hotel_identities SET local_hotel_id=17657,decision_status='accepted',evidence_sha256=?,evidence_json=? WHERE supplier_namespace='andromeda_catalog' AND external_hotel_id='43248' AND decision_status='pending' AND local_hotel_id IS NULL AND evidence_sha256 <=> ?");$u->execute([$hash,$json,$prior]);if($u->rowCount()!==1)throw new RuntimeException('concurrent_change');$db->commit();$committed=true;$q=$db->prepare("SELECT local_hotel_id,decision_status,evidence_sha256 FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND external_hotel_id='43248'");$q->execute();$rb=$q->fetch(PDO::FETCH_ASSOC);$ok=$rb&&(int)$rb['local_hotel_id']===17657&&(string)$rb['decision_status']==='accepted'&&hash_equals($hash,(string)$rb['evidence_sha256']);echo json_encode(['status'=>$ok?'completed':'readback_failed','operation_id'=>$op,'database_writes'=>1,'mapping_writes'=>1,'supplier_calls'=>0,'tourvisor_calls'=>0,'committed'=>true,'readback_verified'=>$ok,'row'=>$rb,'no_replay'=>true],JSON_UNESCAPED_SLASHES),"\n";}catch(Throwable$e){if(isset($db)&&$db->inTransaction())$db->rollBack();echo json_encode(['status'=>'failed','operation_id'=>$op,'reason'=>$e->getMessage(),'database_writes'=>$committed?'unknown':0,'mapping_writes'=>$committed?'unknown':0,'supplier_calls'=>0,'tourvisor_calls'=>0,'committed'=>$committed,'readback_verified'=>false,'no_replay'=>true]),"\n";}?>'''
          raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='surmeli-ad-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600);cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0'];p=subprocess.run(cmd,input=php,text=True,capture_output=True,timeout=300)
          if p.returncode!=0:state.joinpath('blocker.json').write_text(json.dumps({'state':'unknown_after_single_remote_execution_no_replay','remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest()})+'\n');raise SystemExit(3)
          v=json.loads(p.stdout);raw_result=(json.dumps(v,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(raw_result);ok=v.get('status')=='completed' and v.get('committed') is True and v.get('readback_verified') is True and v.get('database_writes')==1;state.joinpath('receipt.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'completed_committed_readback_verified' if ok else ('unknown_committed' if v.get('committed') else 'known_rolled_back'),'result_sha256':hashlib.sha256(raw_result).hexdigest(),'no_replay':True},sort_keys=True)+'\n');
          if not ok:raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-surmeli-andromeda-accept-v1-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-surmeli-andromeda-accept-1971-20260913-v1/', retention-days: 90}
      - name: Terminal gate
        if: steps.write.outcome != 'success'
        run: exit 1
