name: Validate V2 flights live
on:
  push:
    branches: [main]
    paths:
      - 'v2/tour-controller-v4.js'
      - 'v2/api-v2.php'
      - '.github/workflows/validate-flights-live.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and profile fresh live flights
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "FLIGHTS_FAIL:$1"; exit 1; }
          base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
          from="$(date -d "+2 day" +%Y-%m-%d)"
          till="$(date -d "+9 day" +%Y-%m-%d)"

          curl -k -L -fsS --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB" >/tmp/v2-flights-start.json || fail search_start
          search_id="$(python3 -c "import json; d=json.load(open('/tmp/v2-flights-start.json')); print(d.get('searchId') or '')")"
          test -n "$search_id" || fail search_id
          complete=0
          for attempt in $(seq 1 20); do
            sleep 2
            if curl -k -L -fsS --max-time 45 "$base?action=search_status&searchId=$search_id" >/tmp/v2-flights-status.json && python3 -c "import json; d=json.load(open('/tmp/v2-flights-status.json')); raise SystemExit(0 if isinstance(d,dict) and (d.get('progress')==100 or d.get('status')=='complete') else 1)"; then complete=1; break; fi
          done
          test "$complete" = 1 || fail search_not_complete
          curl -k -L -fsS --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25" >/tmp/v2-flights-results.json || fail search_results
          python3 - <<'PY' >/tmp/v2-flight-tour-ids.txt
          import json
          items=json.load(open('/tmp/v2-flights-results.json'))
          ids=[]
          for hotel in items if isinstance(items,list) else []:
              if not isinstance(hotel,dict): continue
              for tour in hotel.get('tours') or []:
                  if not isinstance(tour,dict) or tour.get('id') is None: continue
                  tid=str(tour['id'])
                  if tid not in ids:
                      ids.append(tid); print(tid)
                  if len(ids)>=12: raise SystemExit
          PY
          test -s /tmp/v2-flight-tour-ids.txt || fail no_tours

          chosen=""
          while IFS= read -r tid; do
            test -n "$tid" || continue
            code="$(curl -k -L -sS -o /tmp/v2-flights.json -w "%{http_code}" --max-time 45 "$base?action=flights&tourId=$tid&currency=RUB")"
            test "$code" = "200" || continue
            if python3 -c "import json; d=json.load(open('/tmp/v2-flights.json')); v=d if isinstance(d,list) else d.get('flights',[]) if isinstance(d,dict) else []; raise SystemExit(0 if v else 1)"; then chosen="$tid"; break; fi
          done </tmp/v2-flight-tour-ids.txt
          test -n "$chosen" || fail no_tour_with_flights

          TOUR_ID="$chosen" SEARCH_ID="$search_id" python3 - <<'PY' || fail flights_shape
          import json, os, collections
          raw=json.load(open('/tmp/v2-flights.json'))
          variants=raw if isinstance(raw,list) else raw.get('flights',[]) if isinstance(raw,dict) else []
          assert variants, 'no_variants'
          segments=[]
          prices=[]
          missing_fuel=0
          default_count=0
          for v in variants:
              if not isinstance(v,dict): continue
              default_count+=1 if v.get('isDefault') else 0
              p=v.get('price')
              p=p.get('value') if isinstance(p,dict) else p
              try: prices.append(float(p))
              except (TypeError,ValueError): pass
              fuel=v.get('fuelCharge')
              fv=fuel.get('value') if isinstance(fuel,dict) else fuel
              if fv in (None,''): missing_fuel+=1
              for key in ('forward','backward'):
                  for seg in v.get(key) or []:
                      if isinstance(seg,dict): segments.append(seg)
          assert segments, 'no_segments'
          def time_value(point):
              return str((point or {}).get('time') or '').strip()
          placeholder_time=sum(1 for s in segments for point in (s.get('departure'),s.get('arrival')) if time_value(point) in ('','00:00','0:00'))
          missing_baggage=sum(1 for s in segments if s.get('baggage') in (None,''))
          missing_carry=sum(1 for s in segments if s.get('carryOn') in (None,''))
          no_places=sum(1 for s in segments if s.get('noPlaces') is True)
          on_demand=sum(1 for s in segments if s.get('onDemand') is True)
          missing_timezone=0
          for s in segments:
              for point in (s.get('departure'),s.get('arrival')):
                  port=(point or {}).get('port') if isinstance(point,dict) else None
                  if isinstance(port,dict) and not (port.get('timeZone') or port.get('timezone')): missing_timezone+=1
          duplicate_price_variants=len(prices)-len(set(prices))
          counts=collections.Counter(prices)
          largest_equal_price_group=max(counts.values()) if counts else 0
          assert default_count<=1, 'multiple_defaults'
          print('FLIGHTS_LIVE_OK','searchId='+os.environ['SEARCH_ID'],'tourId='+os.environ['TOUR_ID'],'variants='+str(len(variants)),'segments='+str(len(segments)))
          print('FLIGHT_EDGE_PROFILE','placeholderTimes='+str(placeholder_time),'missingBaggage='+str(missing_baggage),'missingCarryOn='+str(missing_carry),'missingTimezone='+str(missing_timezone),'missingFuelVariants='+str(missing_fuel),'noPlacesSegments='+str(no_places),'onDemandSegments='+str(on_demand),'duplicatePriceVariants='+str(duplicate_price_variants),'largestEqualPriceGroup='+str(largest_equal_price_group),'defaultCount='+str(default_count))
          PY
