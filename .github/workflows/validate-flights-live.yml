name: Validate V2 flights live
on:
  push:
    branches: [main]
    paths:
      - 'v2/.flights-smoke'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Live flights contract
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "FLIGHTS_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
            tour_id="18253832023139"
            code="$(curl -k -L -sS -o /tmp/v2-flights.json -w "%{http_code}" --max-time 45 --get --data-urlencode "action=flights" --data-urlencode "tourId=$tour_id" --data-urlencode "currency=RUB" "$base")"
            echo "FLIGHTS_HTTP=$code TOUR_ID=$tour_id"
            test "$code" = "200" || fail flights_http
            python3 -c "import json,sys; d=json.load(open(\"/tmp/v2-flights.json\")); v=d if isinstance(d,list) else d.get(\"flights\",[]) if isinstance(d,dict) else []; print(\"FLIGHT_VARIANTS\",len(v)); [(print(\"VARIANT\",i,{\"default\":x.get(\"isDefault\"),\"price\":x.get(\"price\"),\"fuelCharge\":x.get(\"fuelCharge\"),\"forward\":len(x.get(\"forward\",[])),\"backward\":len(x.get(\"backward\",[])),\"number\":((x.get(\"forward\") or [{}])[0]).get(\"number\"),\"company\":((((x.get(\"forward\") or [{}])[0]).get(\"company\") or {}).get(\"name\"))}) for i,x in enumerate(v[:8])]; sys.exit(0 if v and (v[0].get(\"forward\") or []) and (v[0].get(\"backward\") or []) else 1)" || fail flights_shape
            echo "FLIGHTS_OK tourId=$tour_id"
          '
