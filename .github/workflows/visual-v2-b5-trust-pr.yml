name: Visual V2 B5 trust pull request

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '!v2/data/**'
      - '.github/workflows/visual-v2-b5-trust-pr.yml'
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-b5-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-b5-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit B5 reassurance at five viewports
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p b5-trust-artifacts
          cat > b5-trust.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          const root=path.resolve('v2'),url=process.env.V2_URL;
          const viewports=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const assetRe=/\/poisk-turov-test\/v2\/([^/?]+\.(?:js|css))(?:\?.*)?$/i;
          const fixture='<button type="button" class="back-results">← Вернуться к предложениям</button><div class="selected-head"><div><span class="eyebrow">ВЫБРАННЫЙ ТУР</span><h2>AnyTour Coast Resort</h2><p>Турция · Анталья</p></div><div class="selected-price"><small>Стоимость</small>125 000 ₽</div></div><div class="facts"><div><span>Вылет из</span><b>Москва</b></div><div><span>Дата</span><b>10.09.2026</b></div></div><div class="tour-flights"><div class="section-heading"><strong>Авиарейсы</strong><span>Выберите подходящий вариант</span></div><div class="flight-variants"><div class="flight-variant is-selected"><label class="flight-choice"><input type="radio" checked><span>Вариант 1</span><b>125 000 ₽</b></label></div></div></div><form class="lead-form"><div class="section-heading"><strong>Оставить заявку</strong><span>Менеджер получит выбранный тур и рейс</span></div><div class="lead-fields"><label>Имя<input name="name"></label><label>Телефон<input name="phone"></label></div><label>Комментарий<textarea name="comment"></textarea></label><label class="lead-consent"><input type="checkbox" name="consent"><span>Согласен</span></label><button type="submit" class="primary">Отправить заявку</button><p class="lead-message"></p></form>';
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
            for(const [name,width,height] of viewports){const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',route=>{const match=new URL(route.request().url()).pathname.match(assetRe);if(!match)return route.continue();const file=path.join(root,path.basename(match[1]));if(!fs.existsSync(file))return route.continue();return route.fulfill({status:200,contentType:path.extname(file)==='.css'?'text/css':'application/javascript',body:fs.readFileSync(file)});});
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(3500);
              const state=await page.evaluate(html=>{['.v2-product-hero','#tourSearch','#status','#resultsTools','#results'].forEach(sel=>{const el=document.querySelector(sel);if(el)el.style.display='none';});const selected=document.getElementById('selectedTour');selected.hidden=false;selected.innerHTML=html;if(window.V2LeadFormGuard)window.V2LeadFormGuard.decorate(selected);if(window.V2ConversionConfidenceV1)window.V2ConversionConfidenceV1.decorateSelected(selected);const panel=selected.querySelector('.selected-confidence'),cta=selected.querySelector('.selected-lead-cta'),note=selected.querySelector('.selected-lead-cta-note');return{decorator:!!window.V2ConversionConfidenceV1,panel:!!panel,panelText:String(panel&&panel.textContent||''),cta:String(cta&&cta.textContent||''),note:String(note&&note.textContent||''),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};},fixture);
              await page.screenshot({path:`b5-trust-artifacts/${name}-trust.png`,fullPage:true});const item={name,http:response?.status()||0,errors,state};report.push(item);const bad=item.http!==200||errors.length||!state.decorator||!state.panel||!state.panelText.includes('Без оплаты на этом шаге')||!state.panelText.includes('Уточним рейс и итоговую стоимость')||state.cta!=='Запросить подтверждение тура'||!state.note.includes('Без оплаты')||state.overflow;if(bad)failed=true;console.log('B5_TRUST',name,JSON.stringify(item));await context.close();}
            fs.writeFileSync('b5-trust-artifacts/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node b5-trust.cjs
      - name: Upload B5 trust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-b5-trust-${{ github.event.pull_request.number || 'manual' }}
          path: b5-trust-artifacts/
          retention-days: 14
