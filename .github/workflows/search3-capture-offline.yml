name: Search3 recorder offline preflight

on:
  pull_request:
    types: [opened]
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-capture-offline.yml'
      - 'tools/search3-capture/recorder.cjs'
      - 'tools/search3-capture/verify-offline.cjs'

permissions:
  contents: read

jobs:
  recorder-browser:
    if: >-
      ${{ github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'verify/search3-capture-offline-20261110' &&
          github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact proposed recorder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify prepared script bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check <<'SHA256'
          ff6986e260b00cf8f3f755a61cf70ea2c4ff2a3e17c0700e49fbec66b9f9dd62  tools/search3-capture/recorder.cjs
          45e463ebd1c7d66fec429fca51dc8680e3f7c87a27c6976547460a5bb9c5ccfc  tools/search3-capture/verify-offline.cjs
          SHA256
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the existing pinned browser tooling
        run: npm install --prefix "$RUNNER_TEMP/capture-tools" --ignore-scripts --no-audit --no-fund --no-save playwright@1.55.0
      - name: Inspect Chromium system dependencies
        id: browser-deps
        run: node scripts/ci/search3_visual_browser_dependencies.cjs "$RUNNER_TEMP/capture-tools/node_modules/.bin/playwright"
      - name: Prefer the existing HTTPS Ubuntu package mirror
        if: ${{ steps.browser-deps.outputs.ready != 'true' }}
        run: sudo -- "$(command -v node)" scripts/ci/search3_visual_browser_dependencies.cjs --prefer-ubuntu-mirror
      - name: Install only missing browser system dependencies
        if: ${{ steps.browser-deps.outputs.ready != 'true' }}
        run: "$RUNNER_TEMP/capture-tools/node_modules/.bin/playwright install-deps chromium"
      - name: Install pinned Chromium
        run: "$RUNNER_TEMP/capture-tools/node_modules/.bin/playwright install chromium"
      - name: Observe synthetic browser responses only
        env:
          NODE_PATH: ${{ runner.temp }}/capture-tools/node_modules
          CAPTURE_TOOL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: timeout --signal=TERM --kill-after=5s 45s node tools/search3-capture/verify-offline.cjs
      - name: Retain original synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-recorder-offline-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: tools/search3-capture/offline-evidence-*/
          if-no-files-found: error
          retention-days: 30
