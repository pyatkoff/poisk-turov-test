name: Visual standalone content live

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, release/search3-production-ready-v1]
    paths:
      - 'v2/site-page-v1.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/shared-content-primitives-v1.css'
      - 'v2/editorial-rhythm-v1.css'
      - 'v2/editorial-ds2-convergence-v1.css'
      - 'v2/site-coherence-v1.css'
      - 'v2/site-footer-v1.css'
      - 'v2/site-shell-alignment-v1.css'
      - 'v2/home-v1.php'
      - 'v2/home-v1.css'
      - 'v2/home-journey-v1.css'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/anytour-brand.css'
      - 'v2/search3-results-filters-v1.css'
      - 'v2/search3-results-filters-v1.js'
      - 'tests/search3-card-readability-browser.cjs'
      - 'v2/index.php'
      - 'v2/hot/index.php'
      - 'v2/contacts/index.php'
      - 'v2/how-to-buy/index.php'
      - 'v2/rb/index.php'
      - 'v2/country/**'
      - 'v2/country-page-v1.php'
      - '.github/workflows/visual-standalone-content-live.yml'
  workflow_dispatch:

jobs:
  content-live:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft || (github.head_ref != 'release/search3-production-ready-v1' && github.base_ref != 'release/search3-production-ready-v1')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify standalone routes across responsive widths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p standalone-content-artifacts
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mkdir -p v2/images
            curl -fsSL --max-time 30 https://anytoour.ru/images/logo.svg -o v2/images/logo.svg
            grep -qi '<svg' v2/images/logo.svg
            printf '%s\n' '{"schemaVersion":1,"profile":"review","scenario":"family"}' > v2/visual-search/public-build.json
            cat > v2/ci-home-router.php <<'PHP'
          <?php
          $path = parse_url((string)($_SERVER['REQUEST_URI'] ?? ''), PHP_URL_PATH);
          if ($path === '/') {
              $_SERVER['HTTP_HOST'] = 'anytoour.ru';
              $_SERVER['SCRIPT_NAME'] = '/';
              require __DIR__ . '/home-entry-v1.php';
              return true;
          }
          if ($path === '/poisk-turov/' || $path === '/poisk-turov/index.php') {
              $_SERVER['HTTP_HOST'] = 'anytoour.ru';
              $_SERVER['SCRIPT_NAME'] = '/poisk-turov/';
              require __DIR__ . '/visual-search/public-entry-v1.php';
              return true;
          }
          return false;
          PHP
            php -S 127.0.0.1:8099 -t v2 v2/ci-home-router.php >"$RUNNER_TEMP/standalone-php.log" 2>&1 &
            php_pid=$!
            trap 'kill $php_pid >/dev/null 2>&1 || true' EXIT
            for _ in {1..30}; do curl -fsS http://127.0.0.1:8099/ >/dev/null && break; sleep .2; done
          fi
          cat > ./standalone-content-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const cases=[['mobile-375',375,812],['desktop-1440',1440,1000]];
          const local=process.env.EVENT_NAME==='pull_request';
          const base=local?'http://127.0.0.1:8099':'https://anytoour.ru';
          const contentPages=[
            ['contacts','/contacts/','.sp-main'],['how-to-buy','/how-to-buy/','.sp-main'],['early-booking','/rb/','.sp-main'],['hot','/hot/','.sp-main'],['country-catalog','/country/','.sp-main'],
            ['country-turkey','/country/turkey/','.sp-main'],['country-egypt','/country/egypt/','.sp-main'],['country-oae','/country/oae/','.sp-main'],['country-tailand','/country/tailand/','.sp-main'],['country-russia','/country/russia/','.sp-main'],
            ['country-tunis','/country/tunis/','.sp-main'],['country-vetnam','/country/vetnam/','.sp-main'],['country-dominikana','/country/dominikana/','.sp-main'],['country-cyprus','/country/cyprus/','.sp-main'],['country-cuba','/country/cuba/','.sp-main'],['country-maldives','/country/maldives/','.sp-main'],['country-mexico','/country/mexico/','.sp-main'],['country-sri-lanka','/country/sri-lanka/','.sp-main'],['country-tanzania','/country/tanzania/','.sp-main']
          ];
          const homeQuery=new URLSearchParams({scenario:'family',origin:'Москва',country:'4',from:'2026-12-08',to:'2026-12-12',minNights:'8',maxNights:'12',adults:'3',ages:'0,17',stars:'4|5',meals:'Всё включено',max:'240000',yclid:'content-live-home'}).toString();
          const searchQuery=new URLSearchParams({scenario:'family',origin:'Москва',country:'4',from:'2026-12-08',to:'2026-12-14',minNights:'7',maxNights:'7',adults:'3',ages:'0,17',stars:'4|5',meals:'Всё включено',max:'240000',yclid:'content-live-search'}).toString();
          const pages=local?[[ 'home','/?'+homeQuery,'.at-home-main'],['search','/poisk-turov/?'+searchQuery,'.search-section #search-form'],['legacy-search','/index.php','.v2-shell'],...contentPages]:[['home','/','.at-home-main'],['search','/poisk-turov/','.search-section #search-form'],...contentPages];
          const screenshotPages=new Set(['home','search','contacts','how-to-buy','early-booking','hot','country-catalog','country-turkey','country-tunis','country-maldives']);
          const rgb=s=>(s.match(/\d+/g)||[]).slice(0,3).map(Number);
          const lum=([r,g,b])=>{const f=x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
          const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
          async function checkCta(page,selector,label){const c=page.locator(selector).first();if(!await c.isVisible())throw new Error(`${label}: CTA missing`);const s=await c.evaluate(el=>{const x=getComputedStyle(el);return{fg:x.color,bg:x.backgroundColor}});if(contrast(rgb(s.fg),rgb(s.bg))<4.5)throw new Error(`${label}: CTA contrast`);await c.focus();const o=await c.evaluate(el=>getComputedStyle(el).outlineWidth);if(parseFloat(o)<2)throw new Error(`${label}: focus missing`);await c.blur();}
          async function waitForHomeSearchReady(page,label){await page.waitForFunction(()=>{const form=document.querySelector('.home-hero #search-form'),submit=form?.querySelector('.search-submit');return !!form&&form.getAttribute('aria-busy')==='false'&&!!submit&&!submit.disabled;},null,{timeout:15000}).catch(()=>{throw new Error(`${label}: canonical HOME Search3 form did not reach ready state`);});}
          (async()=>{const browser=await chromium.launch({headless:true});try{for(const [vp,w,h] of cases){let shellRef=null;for(const [name,path,sel] of pages){const ctx=await browser.newContext({viewport:{width:w,height:h},ignoreHTTPSErrors:true});const page=await ctx.newPage();const r=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});if(!r||r.status()!==200)throw new Error(`${vp}/${name}: HTTP ${r&&r.status()}`);await page.waitForSelector(sel,{state:'attached',timeout:15000});await page.evaluate(()=>document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve());if(name==='home')await waitForHomeSearchReady(page,`${vp}/${name}`);if(name==='search'&&local){await page.waitForFunction(()=>document.querySelector('#search-form')?.getAttribute('aria-busy')==='false',null,{timeout:15000});const family=await page.evaluate(()=>({forms:document.querySelectorAll('#search-form').length,legacy:document.querySelectorAll('[data-home-search],#tourSearch').length,guests:document.querySelector('#guests-label')?.textContent?.trim(),ages:document.querySelector('#guests-detail')?.textContent?.trim()}));if(family.forms!==1||family.legacy!==0||family.guests!=='3 взр. · 2 реб.'||family.ages!=='До 1 года и 17 лет')throw new Error(`${vp}/${name}: canonical Search3 family hydration lost ${JSON.stringify(family)}`);}const st=await page.evaluate(()=>{const headerMeasure=document.querySelector('.at-global-header__inner');const logoMeasure=document.querySelector('.at-global-header__logo');const navLinks=[...document.querySelectorAll('.at-global-header__nav>a')];const hb=headerMeasure&&headerMeasure.getBoundingClientRect();const lb=logoMeasure&&logoMeasure.getBoundingClientRect();const footer=document.querySelector('footer.ds2-site-footer');const productFooter=document.querySelector('footer.footer');const productFooterStyle=productFooter&&getComputedStyle(productFooter);const productFooterActions=productFooter?[...productFooter.querySelectorAll('a,button')]:[];const footerInner=footer&&footer.querySelector('.ds2-site-footer__inner');const footerActions=footer?[...footer.querySelectorAll('.ds2-site-footer__socials a,.ds2-site-footer__apps>a')]:[];const contactPhones=[...document.querySelectorAll('.sp-office-phone,.sp-contact-phone')];const footerStyle=footer&&getComputedStyle(footer);const footerInnerStyle=footerInner&&getComputedStyle(footerInner);return{docW:document.documentElement.scrollWidth,clientW:document.documentElement.clientWidth,globalHeader:document.querySelectorAll('.at-global-header').length,legacySearchHeader:document.querySelectorAll('.at-site-header').length,footer:document.querySelectorAll('footer.ds2-site-footer').length,productFooter:document.querySelectorAll('footer.footer').length,productFooterStyled:!!(productFooterStyle&&productFooterStyle.backgroundColor!=='rgba(0, 0, 0, 0)'),productFooterActions:productFooterActions.length,sharedFooter:!!document.querySelector('footer[data-site-footer=shared] .ds2-site-footer__navigation'),footerStyled:!!(footerStyle&&footerStyle.backgroundColor!=='rgba(0, 0, 0, 0)'&&footerInnerStyle&&footerInnerStyle.display==='grid'),footerTargets:footerActions.length===5&&footerActions.every(a=>a.getBoundingClientRect().height>=43.5),contactPhoneCount:contactPhones.length,contactPhoneTargets:contactPhones.length>0&&contactPhones.every(a=>a.getBoundingClientRect().height>=43.5),searchLinks:document.querySelectorAll('a[href^="/poisk-turov/"]').length,legacyCountryLinks:document.querySelectorAll('a[href^="https://anytour.online/country/"]').length,hero:!!document.querySelector('.sp-hero,.sp-country-intent--hero,.home-hero,.at-home-hero,.v2-product-hero,.search-section'),logoOk:[...document.images].filter(img=>img.closest('.at-global-header')).every(img=>img.complete&&img.naturalWidth>0),headerHeight:hb&&hb.height,logoWidth:lb&&lb.width,navLabels:navLinks.map(a=>(a.textContent||'').trim()),navPaths:navLinks.map(a=>{try{return new URL(a.href,location.href).pathname}catch(e){return a.getAttribute('href')||''}}),searchCurrent:navLinks.some(a=>{try{return new URL(a.href,location.href).pathname==='/poisk-turov/'&&a.getAttribute('aria-current')==='page'}catch(e){return false}})}});if(st.docW>st.clientW+2)throw new Error(`${vp}/${name}: overflow ${st.docW}/${st.clientW}`);const productShell=name==='search';if(st.globalHeader!==1||st.legacySearchHeader!==0||(productShell?(st.productFooter!==1||!st.productFooterStyled||st.productFooterActions<1):(st.footer!==1||(local&&!st.sharedFooter)||!st.footerStyled||!st.footerTargets))||!st.hero||!st.logoOk)throw new Error(`${vp}/${name}: shell ${JSON.stringify(st)}`);if(!st.headerHeight||!st.logoWidth)throw new Error(`${vp}/${name}: header geometry missing ${JSON.stringify(st)}`);if(name==='contacts'&&(st.contactPhoneCount!==5||!st.contactPhoneTargets))throw new Error(`${vp}/${name}: phone targets ${JSON.stringify({count:st.contactPhoneCount,ok:st.contactPhoneTargets})}`);if(name==='home')shellRef={headerHeight:st.headerHeight,logoWidth:st.logoWidth,navLabels:st.navLabels,navPaths:st.navPaths};else{if(!shellRef||Math.abs(st.headerHeight-shellRef.headerHeight)>1||Math.abs(st.logoWidth-shellRef.logoWidth)>1)throw new Error(`${vp}/${name}: shared header geometry drift ref=${JSON.stringify(shellRef)} actual=${JSON.stringify({headerHeight:st.headerHeight,logoWidth:st.logoWidth})}`);if(JSON.stringify(st.navLabels)!==JSON.stringify(shellRef.navLabels)||JSON.stringify(st.navPaths)!==JSON.stringify(shellRef.navPaths))throw new Error(`${vp}/${name}: shared navigation drift ref=${JSON.stringify({labels:shellRef.navLabels,paths:shellRef.navPaths})} actual=${JSON.stringify({labels:st.navLabels,paths:st.navPaths})}`);}if(name==='search'&&!st.searchCurrent)throw new Error(`${vp}/${name}: search navigation current state missing`);if(name!=='search'&&st.searchLinks<1)throw new Error(`${vp}/${name}: no search handoff`);if(name==='country-catalog'&&st.legacyCountryLinks!==0)throw new Error(`${vp}/${name}: legacy country jumps remain ${st.legacyCountryLinks}`);if(name==='home')await checkCta(page,'.home-search-surface .search-submit',`${vp}/${name}`);else if(name==='search')await checkCta(page,'.search-section .search-submit',`${vp}/${name}`);else if(name==='legacy-search')await checkCta(page,'.search-submit:visible, .mobile-search-sticky-submit:visible',`${vp}/${name}`);else await checkCta(page,'.sp-primary',`${vp}/${name}`);if(screenshotPages.has(name))await page.screenshot({path:`standalone-content-artifacts/${vp}-${name}.png`,fullPage:true,animations:'disabled'});if(name==='home'&&local){const homeState=await page.evaluate(()=>({forms:document.querySelectorAll('.home-hero #search-form').length,legacy:document.querySelectorAll('[data-home-search],#tourSearch').length,origin:document.querySelector('#origin-label')?.textContent?.trim(),country:document.querySelector('#destination-label')?.textContent?.trim(),nights:document.querySelector('#nights-label')?.textContent?.trim(),guests:document.querySelector('#guests-label')?.textContent?.trim(),ages:document.querySelector('#guests-detail')?.textContent?.trim(),meal:document.querySelector('#meal-label')?.textContent?.trim(),budget:document.querySelector('#budget-label')?.textContent?.replace(/\s+/g,' ').trim(),stars:[...document.querySelectorAll('#quick-stars [aria-pressed="true"]')].map(x=>x.textContent.trim())}));if(homeState.forms!==1||homeState.legacy!==0||homeState.origin!=='Москва'||homeState.country!=='Турция'||homeState.nights!=='8–12 ночей'||homeState.guests!=='3 взр. · 2 реб.'||homeState.ages!=='До 1 года и 17 лет'||homeState.meal!=='Всё включено'||homeState.budget!=='До 240 000 ₽'||JSON.stringify(homeState.stars)!=='["4★","5★"]')throw new Error(`${vp}/${name}: canonical HOME hydration lost ${JSON.stringify(homeState)}`);const documents=[];page.on('request',request=>{if(request.isNavigationRequest()&&request.frame()===page.mainFrame())documents.push(new URL(request.url()).pathname);});await Promise.all([page.waitForURL(url=>url.pathname==='/poisk-turov/'),page.locator('.home-hero #search-form').evaluate(form=>{form.requestSubmit();form.requestSubmit();})]);const params=new URL(page.url()).searchParams;for(const [key,value]of Object.entries({origin:'Москва',country:'4',from:'2026-12-08',to:'2026-12-12',minNights:'8',maxNights:'12',adults:'3',ages:'0,17',stars:'4|5',meals:'Всё включено',max:'240000',yclid:'content-live-home',searched:'1'}))if(params.get(key)!==value)throw new Error(`${vp}/${name}: handoff lost ${key}=${params.get(key)}`);if(JSON.stringify(documents)!=='["/poisk-turov/"]')throw new Error(`${vp}/${name}: double Find navigation ${JSON.stringify(documents)}`);}console.log('PAGE_OK',vp,name,JSON.stringify(st));await ctx.close();}}}finally{await browser.close();}console.log('STANDALONE_CONTENT_LIVE_OK');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./standalone-content-live.cjs
          SEARCH3_VISUAL_BASE=http://127.0.0.1:8099 node tests/search3-card-readability-browser.cjs
      - name: Upload standalone visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-content-${{ github.event.pull_request.number || github.run_id }}
          path: standalone-content-artifacts/
          if-no-files-found: warn
          retention-days: 30
