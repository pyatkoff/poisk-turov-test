name: Verify rolling PRICE parity and consumer freshness

on:
  push:
    branches: [ops/price-pilot-sample-20261127]
    paths:
      - '.github/workflows/price-rolling-readback.yml'
      - 'ops/price-pilot/rolling-window-days.txt'

permissions:
  contents: read

concurrency:
  group: price-rolling-readback
  cancel-in-progress: false

jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test'
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - name: Read existing PRICE, Search3 and SEO evidence
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd ops/price-pilot
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          test "$DEPLOY_USER" = anytoour && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY"
          if [[ "$DEPLOY_KEY" == *'PRIVATE KEY'* ]]; then
            printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$scratch/key"
          else
            printf '%s' "$DEPLOY_KEY" | base64 --decode > "$scratch/key"
          fi
          printf '%s %s\n' "$DEPLOY_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA' > "$scratch/known_hosts"
          ssh_old=(ssh -4 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$scratch/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST")
          php -l verify-price-freshness.php
          timeout 45 "${ssh_old[@]}" 'php -f /dev/stdin' < verify-price-freshness.php > "$scratch/sample.json"
          python3 verify-price-freshness.py "$scratch/sample.json"
          if test -s rolling-window-days.txt; then
            read -r days < rolling-window-days.txt
            case "$days" in 1|2|3|30) ;; *) exit 2 ;; esac
            host_key=$(cat return-vps-host-key.pub)
            [[ "$host_key" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+$ ]]
            {
              echo 'set -euo pipefail'
              echo 'umask 077'
              echo 'd=$(mktemp -d)'
              echo "trap 'rm -rf \"\$d\"' EXIT"
              printf "cat > \"\$d/rolling-digest.php\" <<'PRICE_DIGEST'\n"
              cat rolling-digest.php
              echo PRICE_DIGEST
              printf "cat > \"\$d/verify-rolling-window.py\" <<'PRICE_VERIFY'\n"
              cat verify-rolling-window.py
              echo PRICE_VERIFY
              printf 'python3 "$d/verify-rolling-window.py" %q "$d/rolling-digest.php" --closed-days %q\n' "$host_key" "$days"
            } > "$scratch/remote.sh"
            bash -n "$scratch/remote.sh"
            timeout 1100 "${ssh_old[@]}" 'bash -s' < "$scratch/remote.sh"
          fi
