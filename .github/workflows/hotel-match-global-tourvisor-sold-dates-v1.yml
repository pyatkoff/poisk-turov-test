name: MATCH GLOBAL Tourvisor sold dates v1
on:
  push:
    branches: [ops/match-global-current-review-2333-20260913-v1]
    paths: [.github/match-global-tourvisor-sold-dates-2333-20260913-v1.arm]
permissions: {contents: read, actions: read}
env:
  OPERATION_ID: hotel-match-global-tourvisor-sold-dates-2333-20260913-v1
  SELL_ARTIFACT_ID: '10192364780'
  SELL_RESULT_SHA256: '47a55cf4ba8cab0fb2fa175f0856e2eca2f144e64b1d7b7a48ddfb0335d85c61'
jobs:
  collect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate sold-date evidence scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/anex_hotelcode_evidence.php
          php -l scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php
          php -l scripts/diagnostics/hotel_match_global_tourvisor_anex_review.php
          php -l scripts/diagnostics/hotel_match_global_tourvisor_sold_dates_review.php
          php -l v2/data/tourvisor-client-v1.php
          test "$(cat .github/match-global-tourvisor-sold-dates-2333-20260913-v1.arm)" = "$OPERATION_ID"
      - name: Fetch and verify immutable ANEX sellability evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SELL_ARTIFACT_ID/zip" > "$STATE/sell.zip"
          mkdir "$STATE/sell"; unzip -q "$STATE/sell.zip" -d "$STATE/sell"
          test -f "$STATE/sell/result.json"
          echo "$SELL_RESULT_SHA256  $STATE/sell/result.json" | sha256sum -c -
          python3 - <<'PY'
          import json,os,pathlib
          o=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'sell/result.json').read_text())
          assert o['status']=='completed' and o['operation_id']=='hotel-match-anex-sellability-review-1971-20260911-v4'
          assert len(o['sold'])==254 and o['database_writes']==0 and o['mapping_writes']==0
          print('sellability evidence verified',len(o['sold']))
          PY
      - name: SSH preflight before reservation
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match_key"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          out="$(ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20 -o LogLevel=ERROR -l "$SSH_USER" "$SSH_HOST" 'cd "$HOME/www/anytoour.ru" && test -s config.php && { test -f data/db-v1.php || test -f v2/data/db-v1.php; } && printf MATCH_SSH_OK')"
          test "$out" = MATCH_SSH_OK
      - name: Reserve immutable sold-date operation
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf '%s\n' '{"operation_id":"hotel-match-global-tourvisor-sold-dates-2333-20260913-v1","state":"reserved_after_saved_evidence_and_ssh_before_current_db_and_tourvisor","source_sell_artifact_id":10192364780,"database_writes":0,"mapping_writes":0,"booking_calls":0,"anex_supplier_calls":0,"no_replay":true}' > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-global-tourvisor-sold-dates-v1-reservation, path: '${{ runner.temp }}/hotel-match-global-tourvisor-sold-dates-2333-20260913-v1/reservation.json', retention-days: 90}
      - name: Run CURRENT sold-date Tourvisor evidence
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path; state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(path):
            s=P(path).read_text(); s=s[5:] if s.startswith('<?php') else s; return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          parser=body('scripts/diagnostics/anex_hotelcode_evidence.php')
          collector=body('scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\nrequire_once __DIR__ . '/anex_hotelcode_evidence.php';\n",'',1)
          client=body('v2/data/tourvisor-client-v1.php')
          gtv=body('scripts/diagnostics/hotel_match_global_tourvisor_anex_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/anex_tourvisor_hotelcode_evidence_collect.php';\n",'',1).split("if(PHP_SAPI==='cli'",1)[0]
          sold=body('scripts/diagnostics/hotel_match_global_tourvisor_sold_dates_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_tourvisor_anex_review.php';\n",'',1).split("if(PHP_SAPI==='cli'",1)[0]
          sell64=base64.b64encode((state/'sell/result.json').read_bytes()).decode()
          wrapper="$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$config=realpath($root.'/config.php');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once $config;require_once $dbHelper;$sell=json_decode(base64_decode('"+sell64+"'),true,64,JSON_THROW_ON_ERROR);$out=gtsd_run(v2_data_db(),$sell,'hotel-match-global-tourvisor-sold-dates-2333-20260913-v1');echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";"
          source='<?php\n'+"define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+parser+'\n'+client+'\n'+collector+'\n'+gtv+'\n'+sold+'\n'+wrapper
          raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='match-sold-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600)
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M']
            p=subprocess.run(cmd,input=source,text=True,capture_output=True,timeout=1900)
          if p.returncode!=0:
            state.joinpath('transport.json').write_text(json.dumps({'remote_exit':p.returncode,'stdout_bytes':len(p.stdout.encode()),'stderr_tail':p.stderr[-1200:]},ensure_ascii=False,sort_keys=True)+'\n');raise SystemExit(2)
          v=json.loads(p.stdout);raw_result=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(raw_result)
          ok=v.get('status')=='completed' and v.get('operation_id')==os.environ['OPERATION_ID'] and v.get('database_writes')==0 and v.get('mapping_writes')==0 and v.get('booking_calls')==0 and v.get('anex_supplier_calls')==0
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_saved_sold_date_tourvisor_evidence' if ok else 'invalid_or_unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw_result).hexdigest(),'current_queue_count':v.get('current_queue_count'),'current_sold_intersection':v.get('current_sold_intersection'),'slice_count':v.get('slice_count'),'safe_count':v.get('safe_count'),'matched_unique':v.get('matched_unique'),'tourvisor':v.get('tourvisor'),'database_writes':0,'mapping_writes':0,'booking_calls':0,'anex_supplier_calls':0,'no_replay':True};state.joinpath('receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          if not ok: raise SystemExit(3)
          print(json.dumps({'current_queue_count':v.get('current_queue_count'),'current_sold_intersection':v.get('current_sold_intersection'),'slice_count':v.get('slice_count'),'safe_count':v.get('safe_count'),'matched_unique':v.get('matched_unique'),'tourvisor':v.get('tourvisor'),'errors':v.get('errors')},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-global-tourvisor-sold-dates-v1-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-global-tourvisor-sold-dates-2333-20260913-v1/', retention-days: 90}
