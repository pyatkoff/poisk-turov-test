name: MATCH global common4 SAMO catalog accept v1

on:
  push:
    branches:
      - ops/match-user-seen-common4-samo-catalog-accept-1971-20260918-v1
    paths:
      - scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_accept_v1.php
      - .github/workflows/hotel-match-user-seen-common4-samo-catalog-accept-v1.yml

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: match-user-seen-common4-samo-catalog-accept-1971-20260918-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-user-seen-common4-samo-catalog-accept-1971-20260918-v1
  EXPECTED_BASE: 325ea3d8fc4752c95ddcc6bccf715dae24f7836a
  CLAIM_COMMENT_ID: '5728267347'
  SOURCE_RUN_ID: '35331022650'
  SOURCE_ARTIFACT_NAME: match-global-catalog-v2-result-35331022650
  SOURCE_RESULT_SHA256: 7516046dd2a0d052ea806ca07b337400d7d3769e2ff3fd7832e3479eecde1324

jobs:
  accept:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/ops/match-user-seen-common4-samo-catalog-accept-1971-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact isolated delta and owner claim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_accept_v1.php'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/hotel-match-user-seen-common4-samo-catalog-accept-v1.yml'
          php -l scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_accept_v1.php
          php scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_accept_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json, os
          c=json.load(open('claim.json'))
          assert c.get('user',{}).get('id') == 226193297
          assert c.get('author_association') == 'OWNER'
          assert c.get('issue_url','').endswith('/issues/2530')
          b=c.get('body','')
          assert os.environ['OPERATION_ID'] in b
          assert os.environ['SOURCE_RESULT_SHA256'] in b
          assert 'rollback/no write' in b
          PY

      - name: Restore exact completed acquisition result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT_NAME" -D source
          test -f source/server/result.json
          test "$(sha256sum source/server/result.json | cut -d' ' -f1)" = "$SOURCE_RESULT_SHA256"
          python3 - <<'PY'
          import json
          d=json.load(open('source/server/result.json'))
          assert d['operation']=='hotel-match-user-seen-common4-samo-catalog-acquire-1971-20260918-v2'
          assert d['state']=='completed_read_only' and d['no_replay'] is True
          assert d['strict_catalog_candidate_count']==102
          assert len(d['strict_catalog_candidates'])==102
          assert d['ambiguous_candidate_count']==0
          assert d['database_writes']==0 and d['mapping_writes']==0
          PY

      - name: Create durable reservation before DB access
        env:
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reservation
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          deps=['scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_accept_v1.php','app/integrations/anex-search-mapping-registry.php']
          r={
            'operation':os.environ['OPERATION_ID'],
            'state':'reserved_before_db_access',
            'source_sha':os.environ['HEAD_SHA'],
            'source_run_id':int(os.environ['SOURCE_RUN_ID']),
            'source_artifact_name':os.environ['SOURCE_ARTIFACT_NAME'],
            'source_result_sha256':os.environ['SOURCE_RESULT_SHA256'],
            'minimum_write_count':100,
            'supplier_calls':0,
            'tourvisor_calls':0,
            'dependencies':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in deps},
            'no_replay':True,
          }
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n').encode()
          pathlib.Path('reservation/reservation.json').write_bytes(raw)
          pathlib.Path('reservation/reservation.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  reservation.json\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-global-catalog-accept-v1-reservation-${{ github.run_id }}
          path: reservation/
          if-no-files-found: error
          retention-days: 90

      - name: Require existing SSH credentials
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          test -n "$HOST_VALUE"
          test -n "$USER_VALUE"

      - name: Execute one guarded CURRENT transaction
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          mkdir -p terminal
          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null || exit 2
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null || exit 2
          test -s "$known" || exit 2
          remote="$USER_VALUE@$HOST_VALUE"
          op=".anytour-match/operations/$OPERATION_ID"
          stage=".anytour-operations-staging/$OPERATION_ID-$GITHUB_RUN_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "umask 077; test ! -e \"\$HOME/$op\"; rm -rf \"\$HOME/$stage\"; mkdir -p \"\$HOME/$op\" \"\$HOME/$stage\"" || exit 2
          scp "${opts[@]}" reservation/reservation.json "$remote:$op/reservation.json" || exit 2
          scp "${opts[@]}" scripts/diagnostics/hotel_match_user_seen_common4_samo_catalog_accept_v1.php app/integrations/anex-search-mapping-registry.php source/server/result.json "$remote:$stage/" || exit 2
          set +e
          ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_RESULT_PATH=\"\$HOME/$stage/result.json\" MATCH_MAPPING_REGISTRY_PATH=\"\$HOME/$stage/anex-search-mapping-registry.php\" MATCH_SOURCE_SHA=\"$HEAD_SHA\" php -d display_errors=0 -d log_errors=0 \"\$HOME/$stage/hotel_match_user_seen_common4_samo_catalog_accept_v1.php\"" > terminal/stdout.json 2> terminal/stderr.txt
          rc=$?
          ssh "${opts[@]}" "$remote" "p=\"\$HOME/$op\"; test -f \"\$p/reservation.json\"; test -f \"\$p/result.json\"; test -f \"\$p/receipt.json\"; tar -C \"\$p\" -czf - ." > terminal/server-operation.tgz 2>>terminal/stderr.txt
          trc=$?
          ssh "${opts[@]}" "$remote" "rm -rf \"\$HOME/$stage\"" || true
          set -e
          printf '%s\n' "$rc" > terminal/remote-exit.txt
          printf '%s\n' "$trc" > terminal/tar-exit.txt

      - name: Verify terminal receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path('terminal'); s=p/'server'; s.mkdir(exist_ok=True)
          a=p/'server-operation.tgz'
          if not a.exists() or a.stat().st_size==0: raise SystemExit('missing terminal archive')
          with tarfile.open(a,'r:gz') as t:
              for m in t.getmembers():
                  if not m.isfile(): continue
                  name=pathlib.Path(m.name).name
                  assert name in {'reservation.json','precommit.json','result.json','receipt.json'} and m.size < 20_000_000
                  (s/name).write_bytes(t.extractfile(m).read())
          assert pathlib.Path('reservation/reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          result=json.loads((s/'result.json').read_text())
          receipt=json.loads((s/'receipt.json').read_text())
          digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert receipt['result_sha256']==digest
          assert receipt['source_result_sha256']==os.environ['SOURCE_RESULT_SHA256']
          assert result['supplier_calls']==0 and result['tourvisor_calls']==0
          status=result['status']
          if status=='accepted':
              assert result['inserted']>=100
              assert result['database_writes']==result['inserted']==result['mapping_writes']
              assert result['readback_verified'] is True and result['existing_identities_unchanged'] is True
              assert (s/'precommit.json').exists()
          elif status=='held_below_write_threshold':
              assert result['current_safe']<100 and result['database_writes']==0 and result['mapping_writes']==0
          else:
              raise SystemExit('terminal failure status='+str(status))
          summary={k:result.get(k) for k in ['status','source_candidates','current_safe','current_holds','inserted','before_coverage','after_coverage','coverage_delta','database_writes','mapping_writes','readback_verified']}
          summary['holds']=result.get('holds',[])[:20]
          summary['result_sha256']=digest
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
          test "$(cat terminal/remote-exit.txt)" -eq 0
          test "$(cat terminal/tar-exit.txt)" -eq 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-global-catalog-accept-v1-result-${{ github.run_id }}
          path: terminal/
          if-no-files-found: error
          retention-days: 90
