name: Andromeda fresh package probe offline
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/andromeda_fresh_package_probe.py'
      - 'scripts/diagnostics/andromeda_fresh_package_probe_wide.py'
      - 'scripts/diagnostics/andromeda_fresh_package_supplier_error_probe.py'
      - 'scripts/diagnostics/andromeda_fresh_package_probe_known_hotel.py'
      - 'tests/andromeda_fresh_package_probe_test.py'
      - 'tests/andromeda_fresh_package_probe_wide_test.py'
      - 'tests/andromeda_fresh_package_supplier_error_probe_test.py'
      - 'tests/andromeda_fresh_package_probe_known_hotel_test.py'
      - '.github/workflows/andromeda-fresh-package-probe-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify one-shot live diagnostic source without network
        run: |
          python3 -m py_compile scripts/diagnostics/andromeda_fresh_package_probe.py scripts/diagnostics/andromeda_fresh_package_probe_wide.py scripts/diagnostics/andromeda_fresh_package_supplier_error_probe.py scripts/diagnostics/andromeda_fresh_package_probe_known_hotel.py tests/andromeda_fresh_package_probe_test.py tests/andromeda_fresh_package_probe_wide_test.py tests/andromeda_fresh_package_supplier_error_probe_test.py tests/andromeda_fresh_package_probe_known_hotel_test.py
          python3 tests/andromeda_fresh_package_probe_test.py
          python3 tests/andromeda_fresh_package_probe_wide_test.py
          python3 tests/andromeda_fresh_package_supplier_error_probe_test.py
          python3 tests/andromeda_fresh_package_probe_known_hotel_test.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path('scripts/diagnostics/andromeda_fresh_package_probe.py').read_text()
          wide=Path('scripts/diagnostics/andromeda_fresh_package_probe_wide.py').read_text()
          supplier=Path('scripts/diagnostics/andromeda_fresh_package_supplier_error_probe.py').read_text()
          known=Path('scripts/diagnostics/andromeda_fresh_package_probe_known_hotel.py').read_text()
          assert "'OPERATORS'=>'5'" in src
          assert "'PAGE'=>1" in src
          assert "$supplierCalls=3; $package=$client->package($offer)" in src
          assert "automatic_retry'=>false" in src
          assert "booking_calls'=>0" in src and "calc_calls'=>0" in src and "get_flights_calls'=>0" in src
          assert "->bron(" not in src and 'bron_ticket' not in src and "->calc(" not in src
          assert "'CHECKIN_BEG'=>'20260920'" in wide and "'CHECKIN_END'=>'20260927'" in wide
          assert "'NIGHTS_FROM'=>7,'NIGHTS_TILL'=>8" in wide and "'OPERATORS'=>'5'" in wide
          assert 'supplier_error' in supplier and "query['claiminc']" in supplier and "query['sid']" in supplier
          assert "->bron(" not in supplier and "->calc(" not in supplier and 'bron_ticket' not in supplier
          assert "'HOTELS'=>'416247'" in known and "'STATEINC'=>3" in known and "'CHECKIN_BEG'=>'20260918'" in known
          assert "->get_flights(" not in known and "->calc(" not in known and "->bron(" not in known
          print('Fresh package static safety: PASS')
          PY
