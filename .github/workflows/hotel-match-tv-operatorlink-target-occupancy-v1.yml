name: MATCH TV operatorLink target occupancy v1
on:
  push:
    branches: [ops/match-tv-operatorlink-card-follow-1971-20260915-v1]
    paths:
      - .github/workflows/hotel-match-tv-operatorlink-target-occupancy-v1.yml
      - scripts/diagnostics/hotel_match_tv_operatorlink_target_occupancy.php
permissions: {contents: read}
concurrency: {group: match-tv-operatorlink-target-occupancy-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tv-operatorlink-target-occupancy-1971-20260915-v1
  PARENT_OPERATION_ID: hotel-match-tv-operatorlink-current-reconcile-1971-20260915-v1
  PARENT_RESULT_SHA256: b4a1054c4ea50a4d38416b7203ebdcffe6622b62477b37f7955f4f0ee75c3aed
jobs:
  occupancy:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate diagnostic
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_tv_operatorlink_target_occupancy.php
          grep -F 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' scripts/diagnostics/hotel_match_tv_operatorlink_target_occupancy.php >/dev/null
      - name: Execute immutable CURRENT occupancy read
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=240 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_SOURCE_SHA='$GITHUB_SHA' PARENT_OPERATION_ID='$PARENT_OPERATION_ID' PARENT_RESULT_SHA256='$PARENT_RESULT_SHA256' php -d display_errors=0 -d log_errors=0" < scripts/diagnostics/hotel_match_tv_operatorlink_target_occupancy.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/ 'server'
          r=json.loads((p/'result.json').read_text()); q=json.loads((p/'receipt.json').read_text())
          assert r['examined']==9 and r['supplier_calls']==r['tourvisor_calls']==r['database_writes']==r['mapping_writes']==0
          assert q['readback_verified'] is True and q['result_sha256']==hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          print(json.dumps({'examined':r['examined'],'occupied_by_other':sum(x['occupied_by_other'] for x in r['rows'])},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-operatorlink-target-occupancy-v1-result
          path: ${{ runner.temp }}/hotel-match-tv-operatorlink-target-occupancy-1971-20260915-v1/
          retention-days: 90
