name: INT ANEX credential equivalence carrier v1

on:
  pull_request:
    paths:
      - 'scripts/ops/anex_local_offer_collect.php'
      - 'tests/anex-credential-equivalence-carrier-test.php'
      - '.github/workflows/int-anex-credential-equivalence-carrier-v1.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Verify supplier-free credential equivalence carrier
        run: |
          set -euo pipefail
          php -l scripts/ops/anex_local_offer_collect.php
          php -l tests/anex-credential-equivalence-carrier-test.php
          php tests/anex-credential-equivalence-carrier-test.php
          ! grep -E 'curl_|file_get_contents\(.*https?://' tests/anex-credential-equivalence-carrier-test.php
