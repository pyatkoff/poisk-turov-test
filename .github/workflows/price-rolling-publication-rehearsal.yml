name: Rehearse PRICE publication through the existing SSH channel

on:
  push:
    branches: [ops/price-pilot-sample-20261127]
    paths:
      - 'ops/price-pilot/rolling-rehearsal-day.txt'

permissions:
  contents: read

concurrency:
  group: price-rolling-readback
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.repository == 'pyatkoff/poisk-turov-test'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Stage both datasets in disposable database tables
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd ops/price-pilot
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          test "$DEPLOY_USER" = anytoour && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY"
          if [[ "$DEPLOY_KEY" == *'PRIVATE KEY'* ]]; then
            printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$scratch/key"
          else
            printf '%s' "$DEPLOY_KEY" | base64 --decode > "$scratch/key"
          fi
          printf '%s %s\n' "$DEPLOY_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA' > "$scratch/known_hosts"
          ssh_old=(ssh -4 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o UserKnownHostsFile="$scratch/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST")
          php -l apply-rolling-result.php
          python3 -m py_compile rolling-publication.py
          read -r day < rolling-rehearsal-day.txt
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          remote='set -eu; umask 077; d=$(mktemp -d); trap '"'"'rm -rf "$d"'"'"' EXIT; tar -xzf - -C "$d"; python3 "$d/rolling-publication.py" rehearse --day '
          tar -czf - rolling-publication.py apply-rolling-result.php return-vps-host-key.pub |
            timeout 600 "${ssh_old[@]}" "$remote$day" | tee "$scratch/receipt"
          grep -q '^PRICE_ROLLING_REHEARSED ' "$scratch/receipt"
