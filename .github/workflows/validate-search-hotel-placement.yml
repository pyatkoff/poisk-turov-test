name: Validate search hotel placement

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.php'
      - 'v2/hotel-autocomplete-v1.js'
      - 'scripts/ci/validate_search_hotel_placement.py'
      - '.github/workflows/validate-search-hotel-placement.yml'
  push:
    branches: [main]
    paths:
      - 'v2/index.php'
      - 'v2/hotel-autocomplete-v1.js'
      - 'scripts/ci/validate_search_hotel_placement.py'
      - '.github/workflows/validate-search-hotel-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep hotel in advanced filters
        run: python3 scripts/ci/validate_search_hotel_placement.py
