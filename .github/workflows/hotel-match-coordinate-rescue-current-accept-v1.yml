name: MATCH coordinate rescue CURRENT accept v1
on:
  push:
    branches: [ops/match-andromeda-anex-direct-key-matrix-1971-20260912-v1]
    paths: [.github/workflows/hotel-match-coordinate-rescue-current-accept-v1.yml]
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: anytour-match-coordinate-rescue-current-accept-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-coordinate-rescue-current-accept-1971-20260912-v1
  OUT: /tmp/match-coordinate-rescue-accept-v1
jobs:
  accept:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline guard and immutable reservation
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_coordinate_rescue_current_accept_v1.php
          php scripts/diagnostics/hotel_match_coordinate_rescue_current_accept_v1.php --self-test
          mkdir -p "$OUT"
          printf '{"operation_id":"%s","state":"reserved_before_db_access","source_sha":"%s","planned":12,"evidence_report":"reports/hotel-match-live106-coordinate-rescue-20260912.json","no_replay":true}\n' "$OPERATION_ID" "$GITHUB_SHA" > "$OUT/reservation.json"
      - uses: actions/upload-artifact@v4
        id: reserve
        with: {name: 'match-coordinate-rescue-v1-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '${{ steps.reserve.outputs.artifact-id }}', path: '/tmp/reservation-readback', merge-multiple: true}
      - name: One CURRENT transaction and independent receipt readback
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          cmp "$OUT/reservation.json" /tmp/reservation-readback/reservation.json
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";sock="$RUNNER_TEMP/ssh.sock"
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ok=0
          for n in 1 2 3;do if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST";then ok=1;break;fi;sleep 10;done
          test "$ok" = 1
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=512M' < scripts/diagnostics/hotel_match_coordinate_rescue_current_accept_v1.php > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER" "$HOST" 'p="$HOME/.anytoour-match/operations/hotel-match-coordinate-rescue-current-accept-1971-20260912-v1"; if test -f "$p/result.json";then cat "$p/result.json";elif test -f "$p/failure.json";then cat "$p/failure.json";else printf "{\"status\":\"unknown_do_not_replay\"}\n";fi' > "$OUT/server-result.json" 2>> "$RUNNER_TEMP/stderr"
          rr=$?;set -e;export RC="$rc" RR="$rr"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']);raw=(d/'server-result.json').read_bytes()
          try:x=json.loads(raw)
          except Exception:x={'status':'unknown_do_not_replay'}
          verified=int(os.environ['RR'])==0 and x.get('status')=='accepted' and x.get('operation_id')==os.environ['OPERATION_ID'] and x.get('readback_verified') is True and x.get('written_count')==(x.get('provider_counts') or {}).get('anex')
          r={'operation_id':os.environ['OPERATION_ID'],'status':x.get('status'),'planned':12,'written_count':x.get('written_count'),'provider_counts':x.get('provider_counts'),'skipped_count':x.get('skipped_count'),'skip_reasons':x.get('skip_reasons'),'readback_verified':x.get('readback_verified',False),'server_receipt_verified':verified,'server_result_sha256':hashlib.sha256(raw).hexdigest(),'apply_exit_code':int(os.environ['RC']),'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          (d/'receipt.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          s=f"MATCH #1971 coordinate rescue CURRENT accept `{os.environ['OPERATION_ID']}`: **{x.get('status')}**; planned 12, written **{x.get('written_count')}**, skipped `{x.get('skipped_count')}`, reasons `{x.get('skip_reasons')}`, post-COMMIT readback `{x.get('readback_verified')}`, receipt `{verified}`. Supplier/Tourvisor0. NO-REPLAY."
          (d/'summary.md').write_text(s+'\n');print(s)
          if not verified: raise SystemExit(2)
          PY
          ssh -S "$sock" -O exit "$HOST" >/dev/null 2>&1||true
          rm -f "$key" "$known" "$RUNNER_TEMP/stdout" "$RUNNER_TEMP/stderr"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-coordinate-rescue-v1-${{ github.run_id }}-result', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record verified result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: test -f "$OUT/summary.md" && gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
