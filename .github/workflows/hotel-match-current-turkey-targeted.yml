name: MATCH CURRENT Turkey targeted hotel identity
on:
  push:
    branches: [match/current-turkey-targeted-1971-20260914]
    paths:
      - 'scripts/diagnostics/hotel_match_current_turkey_targeted.php'
      - '.github/workflows/hotel-match-current-turkey-targeted.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-current-turkey-targeted-1971-20260914-v1
  cancel-in-progress: false
jobs:
  targeted:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - batch: 1
            focus: '16330:28426,23894:1600,34680:37404,45225:153743,28882:129511,32783:54633,32880:17443,44573:59085,35275:81810,43984:99257,16605:115500,44939:77557,32692:70291,44413:21838,28869:82811,32745:85422,32572:68169,37885:111046,32724:17586,32686:17390,29000:104021,30424:43550,32567:82420,33110:104168,45226:163543,15072:77400,32742:132803,34804:81578,39389:1557,43077:1558'
          - batch: 2
            focus: '32743:129511,29446:17586,32355:21838,28933:17390,44138:53531,44139:67042,8550:1283,10115:2160,11241:1255,11756:996,12143:1004,12901:1474,14812:5535,15046:1217,20470:101227,21696:1070,27777:17561,29036:132803,29332:60388,29430:71266,31515:1346,32822:82758,32937:76112,34858:60766,34961:27553,35511:28581,35898:1221,37344:3409,37538:1461,37985:77759'
          - batch: 3
            focus: '35319:1346,39875:1071,8319:1124,8355:1432,8366:17595,8460:1385,8537:1643,8538:1207,8666:1253,9126:1570,9384:77574'
    env:
      MATCH_DATE: '2026-11-15'
      MATCH_FOCUS_PAIRS: ${{ matrix.focus }}
      OPERATION_ID: hotel-match-current-turkey-targeted-1971-20260914-v1-b${{ matrix.batch }}
      OUT: /tmp/match-current-turkey-targeted-b${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Offline guards
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_current_turkey_targeted.php
          php scripts/diagnostics/hotel_match_current_turkey_targeted.php --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_current_turkey_targeted.php
          grep -Fq "['турц','turkey']" scripts/diagnostics/hotel_match_current_turkey_targeted.php
          grep -Fq "hotelIds" scripts/diagnostics/hotel_match_current_turkey_targeted.php
      - name: Run immutable CURRENT targeted evidence
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=900 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' MATCH_DATE='$MATCH_DATE' MATCH_FOCUS_PAIRS='$MATCH_FOCUS_PAIRS' php -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_current_turkey_targeted.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"
          trc=$?
          set -e
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def load(n):
              try:return json.loads((out/n).read_text())
              except Exception:return {}
          a=load('reservation.json'); r=load('result.json'); q=load('receipt.json')
          rh=hashlib.sha256((out/'result.json').read_bytes()).hexdigest() if (out/'result.json').exists() else None
          ok=(a.get('state')=='reserved_before_current_db_and_provider' and a.get('credential_identifier')=='TOURVISOR_JWT'
              and a.get('country')=='Turkey' and r.get('credential_identifier')=='TOURVISOR_JWT'
              and all(x.get('operation_id')==os.environ['OPERATION_ID'] and x.get('source_sha')==os.environ['GITHUB_SHA'] and x.get('no_replay') is True for x in (a,r,q))
              and q.get('result_sha256')==rh and q.get('readback_verified') is True
              and all(r.get(k)==0 for k in ('database_writes','mapping_writes','booking_calls','lead_calls'))
              and type(r.get('tourvisor_calls')) is int and 0 <= r.get('tourvisor_calls') <= 39)
          gate={'verified':ok,'operation_id':os.environ['OPERATION_ID'],'status':r.get('status'),'reason':r.get('reason'),
                'proposal_count':r.get('proposal_count'),'current_focus_count':r.get('current_focus_count'),'flattened_rows':r.get('flattened_rows'),
                'targeted_tours_found':r.get('targeted_tours_found'),'detail_rows':r.get('detail_rows'),'direct_confirmed':r.get('direct_confirmed'),
                'holds':r.get('holds'),'tourvisor_calls':r.get('tourvisor_calls'),'result_sha256':rh,'remote_exit':int(os.environ['RC']),
                'database_writes':0,'mapping_writes':0,'no_replay':True}
          (out/'workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok or r.get('status')!='completed' or int(os.environ['RC'])!=0 or int(os.environ['TRC'])!=0: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-current-turkey-targeted-b${{ matrix.batch }}-${{ github.run_id }}
          path: ${{ env.OUT }}/
          retention-days: 90
