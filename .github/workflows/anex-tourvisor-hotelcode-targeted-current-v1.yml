      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate existing MATCH evidence sources and bounded scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/anex_hotelcode_evidence.php
          php -l scripts/diagnostics/anex_hotelcode_current_queue.php
          php -l scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php
          php -l v2/data/tourvisor-client-v1.php
          php tests/anex-hotelcode-current-queue-test.php
          php tests/anex-tourvisor-hotelcode-evidence-collect-test.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('.github/workflows/anex-tourvisor-hotelcode-targeted-current-v1.yml').read_text()
          assert "QUEUE_OPERATION_ID: hotel-match-anex-tourvisor-hotelcode-targeted-current-queue-1971-20260912-v1" in s
          assert "operatorIds'=>[$op]" in s
          assert "'dateFrom'=>$date,'dateTo'=>$date" in s
          assert "'nightsFrom'=>$night,'nightsTo'=>$night" in s
          assert "'/tours/search'" in s and "'/tours/'" in s
          assert 'TOURVISOR_ANEX_JWT' in s
          assert 'ate_operator_hotellist' in s and 'ate_page_hotelcode_evidence' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'booking_calls'=>0" in s
          assert "'/continue'" not in s
          assert 'INSERT INTO' not in s and 'UPDATE ' not in s and 'DELETE FROM' not in s
          print('targeted CURRENT hotelCode evidence scope verified')
          PYTHON
