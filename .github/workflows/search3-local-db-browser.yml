name: Search3 local DB-first browser
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'v2/search3-local-db-provider-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - 'tests/search3-local-db-provider-v1.test.js'
      - 'tests/search3-local-db-meal-plan-v1.test.js'
      - 'tests/search3-local-db-projection-row-isolation.cjs'
      - 'tests/search3-local-db-price-states-browser.py'
      - 'tests/search3-lean-base-bundle-smoke.php'
      - 'v2/prototype-search/lead.js'
      - 'tests/search3-prototype-lead-bind.cjs'
      - 'tests/search3-prototype-contact-recovery.py'
      - '.github/workflows/search3-local-db-browser.yml'
permissions:
  contents: read
jobs:
  db-first-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: JavaScript syntax and runtime contract
        run: |
          node --check v2/search3-local-db-provider-v1.js
          node tests/search3-local-db-provider-v1.test.js
          node tests/search3-local-db-meal-plan-v1.test.js
          node --test tests/search3-local-db-projection-row-isolation.cjs
      - name: Search3-only dependency order and legacy isolation
        run: php tests/search3-lean-base-bundle-smoke.php
      - name: Contact recovery native integration and browser test syntax
        run: |
          node tests/search3-prototype-lead-bind.cjs
          python -m py_compile tests/search3-prototype-contact-recovery.py
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Cached price states in the canonical renderer at mobile and desktop widths
        run: python tests/search3-local-db-price-states-browser.py
      - name: Contact draft recovery after flight errors at 390 and 1440
        run: python tests/search3-prototype-contact-recovery.py
      - name: Retain visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-local-db-price-states-${{ github.event.pull_request.head.sha }}
          path: local-db-price-evidence/
          if-no-files-found: warn
          retention-days: 14