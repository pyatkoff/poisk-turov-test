name: MATCH COMMON4 tail current v15
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/hotel-match-common4-tail-current-v15.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-common4-tail-current-1971-20260924-v15, cancel-in-progress: false}
env:
  OP: hotel-match-common4-tail-current-1971-20260924-v15
  BASE: 8f0ea97152863d128bc228e73d6314b58a752cdd
  CLAIM: '5804322003'
  R1: hotel-match-live30-common4-continuation-resume-1971-20260924-r1-n899-v1
  R1_SHA: 11408e926160b87a10ffdf04ebb56106f17fb7efc30f95611033a5cb427dc794
  R2: hotel-match-live30-common4-continuation-resume-1971-20260924-r2-n138-v1
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate owner claim and Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-common4-tail-current-v15.yml "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],os.environ['R1'],os.environ['R2'],os.environ['R1_SHA'],
                    '116 non-ANEX +16 ANEX=132','HTTP0','database_writes0','mapping_writes0']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
      - name: Execute supplier-free tail CURRENT audit
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077;mkdir -p terminal
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null
          ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\" \"\$HOME/$op/payload/app/integrations\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_common4_mass_current_v14.php "$remote:$op/payload/scripts/diagnostics/"
          scp "${opts[@]}" app/integrations/anex-search-mapping-registry.php "$remote:$op/payload/app/integrations/"
          ssh "${opts[@]}" "$remote" "OP='$OP' R1='$R1' R2='$R2' R1_SHA='$R1_SHA' python3 - <<'PY'
          import os,json,hashlib,pathlib
          home=pathlib.Path.home();ops=home/'.anytoour-match/operations';op=ops/os.environ['OP']
          rows=[]
          for name in [os.environ['R1'],os.environ['R2']]:
              d=ops/name;p=d/'result.json';q=d/'receipt.json'
              assert p.is_file() and q.is_file() and not p.is_symlink() and not q.is_symlink()
              raw=p.read_bytes();sha=hashlib.sha256(raw).hexdigest();r=json.loads(raw);rc=json.loads(q.read_text())
              assert rc.get('result_sha256')==sha
              if name==os.environ['R1']:
                  assert sha==os.environ['R1_SHA']
                  assert r.get('state')=='terminal_wrapper_timeout_salvaged_no_replay'
                  assert rc.get('salvaged_after_wrapper_timeout') is True and rc.get('no_replay') is True
                  assert r.get('searched_hotels')==761
              else:
                  assert r.get('state')=='completed_read_only'
                  assert r.get('searched_hotels')==138
                  assert r.get('tourvisor_account')=='TOURVISOR_ANEX_JWT'
              assert r.get('database_writes')==0 and r.get('mapping_writes')==0
              rows.append({'operation':name,'result_sha256':sha})
          (op/'manifest.json').write_text(json.dumps({'children':rows},sort_keys=True)+'\n')
          (op/'reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_db_read'},sort_keys=True)+'\n')
          PY"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_OPERATIONS_ROOT=\"\$HOME/.anytoour-match/operations\" MATCH_CHILD_MANIFEST=\"\$HOME/$op/manifest.json\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_common4_mass_current_v14.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json manifest.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['state']=='completed_read_only_mass_current'
          assert r['searched_hotels']==899
          assert r['supplier_calls']==0 and r['provider_http_calls']==0 and r['database_writes']==0 and r['mapping_writes']==0
          print(json.dumps({k:r[k] for k in ['state','searched_hotels','input_single_native_edges','status_counts','anchor_state_counts','writer_ready_counts']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-tail-current-v15-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
