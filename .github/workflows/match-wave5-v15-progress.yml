name: MATCH wave5 v15 progress inspector
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/match-wave5-v15-progress.yml'
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read operation progress only
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p terminal
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/hotel-match-samo-business-live30-common4-wave5-writer-1971-20260925-v17-w1b"
          ssh "${opts[@]}" "$remote" "OP=\"\$HOME/$op\" python3 - <<'PY'
          import os,glob,json
          d=os.environ['OP']
          out={'exists':os.path.isdir(d)}
          if out['exists']:
              out['files']=sorted([os.path.relpath(p,d) for p in glob.glob(d+'/**',recursive=True) if os.path.isfile(p)])[:50]
              for name in ['pre-commit.json','commit-attempt.json','result.json','receipt.json','reservation.json']:
                  p=d+'/'+name
                  if os.path.isfile(p):
                      try: out[name]=json.load(open(p))
                      except Exception: out[name]='unreadable'
          print(json.dumps(out,sort_keys=True))
          PY
          php -r 'require \$argv[1]; \$a=json_decode(file_get_contents(\$argv[2]),true,512,JSON_THROW_ON_ERROR); try{\$m=sbw5_manifest(\$a,0,300); echo json_encode(["manifest_ok"=>true,"total"=>\$m["total"],"slice"=>count(\$m["rows"])])."\\n";}catch(Throwable \$e){echo json_encode(["manifest_ok"=>false,"reason"=>\$e->getMessage()])."\\n"; exit(2);}' "\$HOME/$op/payload/scripts/diagnostics/hotel_match_samo_business_live30_common4_wave5_writer_v17.php" "\$HOME/$op/payload/audit-result.json"
          " | tee terminal/progress.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-wave5-v15-progress-${{ github.run_id }}', path: terminal/, retention-days: 7}
