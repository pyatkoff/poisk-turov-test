name: Sync AnyTour Top-500 priority hotels

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/sync-priority-hotels-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - '.github/workflows/sync-top500-priority-hotels.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Missing priority hotels to fetch (1-500)'
        required: true
        default: '500'
        type: string

concurrency:
  group: anytour-top500-priority-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate priority sync tooling
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/sync-priority-hotels-v1.php
          php -l v2/data/top-hotels-v1.php
          grep -Fq "v2_data_tv_get('/hotels/'.\$id)" v2/data/sync-priority-hotels-v1.php
          grep -Fq 'PRIORITY_HOTEL_SYNC_SUMMARY' v2/data/sync-priority-hotels-v1.php
          echo ANYTOUR_TOP500_PRIORITY_TOOLING_OK

  production:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Fill missing Top-500 hotels on production
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          LIMIT_VALUE: ${{ inputs.limit || '500' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$LIMIT_VALUE" =~ ^[0-9]+$ ]] && test "$LIMIT_VALUE" -ge 1 && test "$LIMIT_VALUE" -le 500
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          root='~/www/anytoour.ru'
          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" v2/data/db-v1.php v2/data/tourvisor-client-v1.php v2/data/top-hotels-v1.php v2/data/sync-priority-hotels-v1.php v2/data/top500-coverage-v1.php "$remote:$root/data/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            php -l \"\$HOME/www/anytoour.ru/data/sync-priority-hotels-v1.php\" >/dev/null
            php \"\$HOME/www/anytoour.ru/data/sync-priority-hotels-v1.php\" --limit='$LIMIT_VALUE'
            php \"\$HOME/www/anytoour.ru/data/top500-coverage-v1.php\"
          "
