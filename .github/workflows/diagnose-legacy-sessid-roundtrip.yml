name: Diagnose legacy sessid roundtrip

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-legacy-sessid-roundtrip.yml'
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: GET legacy page and POST with same cookie jar
        shell: bash
        run: |
          set -euo pipefail
          page='https://anytour.online/poisk-turov-test/v2/'
          lead='https://anytour.online/poisk-turov-test/v2/lead-adapter-v2.php'
          jar=/tmp/legacy-cookie.txt
          curl -fsSL --max-time 45 -c "$jar" -b "$jar" "$page" -o /tmp/legacy.html
          python3 - <<'PY'
          import re
          html=open('/tmp/legacy.html',encoding='utf-8',errors='replace').read()
          pats=[r'name=["\']sessid["\'][^>]*value=["\']([^"\']+)["\']',r'value=["\']([^"\']+)["\'][^>]*name=["\']sessid["\']']
          token=''
          for p in pats:
              m=re.search(p,html,re.I)
              if m:
                  token=m.group(1).strip(); break
          print('SESSID_PRESENT='+('yes' if token else 'no'))
          print('SESSID_LEN='+str(len(token)))
          open('/tmp/sessid','w').write(token)
          count=0
          for line in open('/tmp/legacy-cookie.txt',encoding='utf-8',errors='replace'):
              raw=line.rstrip('\n')
              httponly=False
              if raw.startswith('#HttpOnly_'):
                  raw=raw[len('#HttpOnly_'):]
                  httponly=True
              elif raw.startswith('#') or not raw.strip():
                  continue
              parts=raw.split('\t')
              if len(parts) < 7:
                  continue
              domain,flag,path,secure,expires,name,value=parts[:7]
              count+=1
              print(f'COOKIE_META name={name} domain={domain} path={path} secure={secure} httponly={"yes" if httponly else "no"} value_len={len(value)}')
          print('COOKIE_COUNT='+str(count))
          PY
          sessid="$(cat /tmp/sessid)"
          test -n "$sessid"
          payload="$(python3 -c 'import json,sys;print(json.dumps({"consent":False,"sessid":sys.argv[1]},separators=(",",":")))' "$sessid")"
          code="$(curl -v -sS --max-time 45 -c "$jar" -b "$jar" -o /tmp/post.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://anytour.online' \
            -H 'Referer: https://anytour.online/poisk-turov-test/v2/' \
            --data "$payload" "$lead" 2>/tmp/curl-verbose.txt)"
          echo "COOKIE_HEADER_SENT=$(grep -q '^> Cookie:' /tmp/curl-verbose.txt && echo yes || echo no)"
          echo "ROUNDTRIP_HTTP=$code"
          cat /tmp/post.json; echo
          if test "$code" = 422 && grep -q 'Validation failed' /tmp/post.json; then echo ROUNDTRIP_OK; exit 0; fi
          exit 1
