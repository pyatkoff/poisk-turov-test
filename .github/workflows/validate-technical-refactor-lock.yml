name: Validate technical refactor lock

on:
  pull_request:
    paths:
      - 'TECHNICAL_REFACTOR_LOCK.json'
      - 'OWNER_PRIORITY.json'
      - 'AUTOPILOT.md'
      - 'AUTOPILOT_STATE.json'
      - 'scripts/ci/validate_technical_refactor_lock.py'
      - '.github/workflows/validate-technical-refactor-lock.yml'
  push:
    branches: [main]
    paths:
      - 'TECHNICAL_REFACTOR_LOCK.json'
      - 'OWNER_PRIORITY.json'
      - 'AUTOPILOT.md'
      - 'AUTOPILOT_STATE.json'
      - 'scripts/ci/validate_technical_refactor_lock.py'
      - '.github/workflows/validate-technical-refactor-lock.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate technical refactor phase lock
        run: python3 scripts/ci/validate_technical_refactor_lock.py
