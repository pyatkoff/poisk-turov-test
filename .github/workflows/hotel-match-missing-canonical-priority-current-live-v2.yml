name: MATCH missing canonical priority CURRENT live v2
on:
  push:
    branches: [ops/match-missing-canonical-priority-current-v2-1971-20260917]
    paths: [.github/workflows/hotel-match-missing-canonical-priority-current-live-v2.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-missing-canonical-priority-current-live-v2, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-missing-canonical-priority-1971-20260917-v2
  V1_BLOB: 824f347c872e0c5346e915a9ed51c2a87ccf7481
  V2_BLOB: 9a232a90c97310f05faefb7501fb01c0b503666c
jobs:
  export:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify exact read-only sources and reserve
        shell: bash
        run: |
          set -euo pipefail
          v1=scripts/diagnostics/hotel_match_missing_canonical_priority_current_v1.php
          v2=scripts/diagnostics/hotel_match_missing_canonical_priority_current_v2.php
          test "$(git hash-object "$v1")" = "$V1_BLOB"
          test "$(git hash-object "$v2")" = "$V2_BLOB"
          php -l "$v1"; php -l "$v2"; php "$v2" --self-test
          grep -Fq 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' "$v2"
          ! grep -Eiq '(curl|wget|gateway\.samo|api\.tourvisor|parser\.anextour|AdditionalPricesDaily)' "$v2"
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5718838313,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-missing-canonical-priority-v2-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-missing-canonical-priority-1971-20260917-v2/reservation.json
          retention-days: 90
      - name: Run CURRENT staged read-only backlog
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          remote_dir="\$HOME/.anytoour-match/operations/$OPERATION_ID"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"$remote_dir\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; p=\"$remote_dir\"; cat > \"\$p/hotel_match_missing_canonical_priority_current_v1.php\"" < scripts/diagnostics/hotel_match_missing_canonical_priority_current_v1.php
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; p=\"$remote_dir\"; cat > \"\$p/hotel_match_missing_canonical_priority_current_v2.php\"; sync" < scripts/diagnostics/hotel_match_missing_canonical_priority_current_v2.php
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=768M \"$remote_dir/hotel_match_missing_canonical_priority_current_v2.php\"" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$out/remote-exit.txt"
          if ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "test -f \"$remote_dir/priority-backlog.json\""; then
            ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"$remote_dir\" -czf - reservation.json hotel_match_missing_canonical_priority_current_v1.php hotel_match_missing_canonical_priority_current_v2.php priority-backlog.json result.json receipt.json" > "$out/server-operation.tgz"
          else
            ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"$remote_dir\" -czf - reservation.json hotel_match_missing_canonical_priority_current_v1.php hotel_match_missing_canonical_priority_current_v2.php result.json receipt.json" > "$out/server-operation.tgz"
          fi
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
      - name: Independently verify CURRENT staged backlog
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']); p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          for name in ['hotel_match_missing_canonical_priority_current_v1.php','hotel_match_missing_canonical_priority_current_v2.php']:
            assert (root/'scripts/diagnostics'/name).read_bytes()==(s/name).read_bytes()
          result_b=(s/'result.json').read_bytes(); result=json.loads(result_b); receipt=json.loads((s/'receipt.json').read_text())
          result_sha=hashlib.sha256(result_b).hexdigest(); zero=['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']
          if result.get('state')!='completed_read_only':
            gate={'verified':False,'state':result.get('state'),'error_code':result.get('error_code'),'result_sha256':result_sha,'no_replay':True}
            (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n'); print(json.dumps(gate,sort_keys=True)); raise SystemExit(2)
          payload_b=(s/'priority-backlog.json').read_bytes(); payload=json.loads(payload_b); payload_sha=hashlib.sha256(payload_b).hexdigest(); census=payload['census']; ready=payload['ready_rows']; held=payload['held_rows']; ids=[int(x['tv_hotel_id']) for x in ready+held]
          ok=(len(ids)==len(set(ids)) and int(census['missing_canonical_targets'])==len(ids) and int(census['ready_for_local_seed'])==len(ready) and int(census['held'])==len(held)
            and result.get('payload_sha256')==payload_sha and receipt.get('result_sha256')==result_sha and receipt.get('readback_verified') is True
            and all(x['status']=='ready_for_local_seed' for x in ready) and all(x['status']!='ready_for_local_seed' for x in held)
            and all(int(result.get(k) or 0)==0 for k in zero) and all(int(receipt.get(k) or 0)==0 for k in zero))
          gate={'verified':ok,'state':result.get('state'),'input_counts':result.get('input_counts'),'census':census,'payload_sha256':payload_sha,'result_sha256':result_sha,'top_ready':ready[:25],'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps({'verified':ok,'state':result.get('state'),'input_counts':result.get('input_counts'),'census':census,'top_ready':ready[:10]},ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-missing-canonical-priority-v2-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-missing-canonical-priority-1971-20260917-v2/
          retention-days: 90
