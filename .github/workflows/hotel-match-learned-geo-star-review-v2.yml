name: MATCH GLOBAL learned geo star-soft v2
on:
  push:
    branches: [ops/match-global-current-review-2333-20260913-v1]
    paths: [.github/match-learned-geo-star-review-2333-20260913-v2.arm]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-learned-geo-star-review-2333-20260913-v2}
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_learned_geo_star_review.php
          test "$(cat .github/match-learned-geo-star-review-2333-20260913-v2.arm)" = "$OPERATION_ID"
      - name: Run CURRENT read-only with SSH preflight
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,tempfile,time
          P=pathlib.Path
          def body(path):
            x=P(path).read_text();x=x[5:] if x.startswith('<?php') else x;return x.replace('declare(strict_types=1);','',1)
          files=['hotel_full_catalog_reconcile.php','hotel_match_current_bulk_review.php','hotel_match_current_strict_review.php','hotel_match_live_priority_review.php','hotel_match_star_semantics_current_review.php','hotel_match_learned_geo_star_review.php']
          source='<?php\n'
          remove=["if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\n","require_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n","require_once __DIR__ . '/hotel_match_current_bulk_review.php';\n","require_once __DIR__ . '/hotel_match_current_strict_review.php';\n","require_once __DIR__ . '/hotel_match_live_priority_review.php';\n","require_once __DIR__ . '/hotel_match_star_semantics_current_review.php';\n"]
          for f in files:
            x=body('scripts/diagnostics/'+f)
            for r in remove:x=x.replace(r,'',1)
            source+=x+'\n'
          source+="$root=realpath(getcwd());require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$out=hmlgs_review($db,'hotel-match-learned-geo-star-review-2333-20260913-v2');echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),\"\\n\";"
          raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='learned-geo-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';sock=P(td)/'sock'
            key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600)
            base=['ssh','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR']
            ok=False
            for _ in range(3):
              p=subprocess.run(base+['-M','-S',str(sock),'-fnNT','-o','ControlPersist=600','-l',user,host],capture_output=True,text=True,timeout=40)
              if p.returncode==0:ok=True;break
              time.sleep(8)
            if not ok:raise SystemExit(2)
            p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M'],input=source,text=True,capture_output=True,timeout=600)
            subprocess.run(['ssh','-S',str(sock),'-O','exit',host],capture_output=True,timeout=20)
          if p.returncode!=0:raise SystemExit(3)
          v=json.loads(p.stdout);P('learned-geo-star-v2.json').write_text(json.dumps(v,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps({'stats':v.get('stats'),'accepted_training_rows':v.get('accepted_training_rows'),'learned_place_keys':v.get('learned_place_keys')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'match-learned-geo-star-v2-${{ github.run_id }}', path: learned-geo-star-v2.json, retention-days: 90}
