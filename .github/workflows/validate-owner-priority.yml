name: Validate owner policy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'OWNER_PRIORITY.json'
      - 'TECHNICAL_REFACTOR_LOCK.json'
      - 'AUTOPILOT.md'
      - 'AUTOPILOT_STATE.json'
      - 'scripts/ci/validate_owner_priority.py'
      - 'scripts/ci/validate_technical_refactor_lock.py'
      - '.github/workflows/validate-owner-priority.yml'
  workflow_dispatch:

jobs:
  validate:
    # These two commands run in Security guard for the owner's lean preview cycle.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || (github.head_ref != 'release/search3-production-ready-v1' && github.base_ref != 'release/search3-production-ready-v1') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate owner priority source of truth
        run: python3 scripts/ci/validate_owner_priority.py
      - name: Validate technical refactor phase lock
        run: python3 scripts/ci/validate_technical_refactor_lock.py
