name: MATCH GLOBAL Tourvisor reverse ANEX id v1
on:
  push:
    branches: [ops/match-global-current-review-2333-20260913-v1]
    paths: [.github/match-global-tourvisor-reverse-id-2333-20260913-v1.arm]
permissions: {contents: read, actions: read}
env:
  OPERATION_ID: hotel-match-global-tourvisor-reverse-id-2333-20260913-v1
  SOURCE_ARTIFACT_ID: '10322235864'
  SOURCE_RESULT_SHA256: '5955d4e772929c33dfa3e9be13e929f0c000de3369e67f3cdaa68f6f4e028dc7'
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate reverse-ID evidence scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/anex_hotelcode_evidence.php
          php -l scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php
          php -l scripts/diagnostics/hotel_match_global_tourvisor_anex_review.php
          php -l scripts/diagnostics/hotel_match_global_tourvisor_reverse_id_review.php
          php -l v2/data/tourvisor-client-v1.php
          test "$(cat .github/match-global-tourvisor-reverse-id-2333-20260913-v1.arm)" = "$OPERATION_ID"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_global_tourvisor_reverse_id_review.php').read_text()
          assert "'search_starts'=>0" in s and "'continue_calls'=>0" in s
          assert 'ate_operator_hotellist' in s and 'operator_hotellist_first' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s
          print('reverse operator-id scope verified')
          PY
      - name: Fetch and verify saved Tourvisor search evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$STATE/source.zip"
          mkdir "$STATE/source"; unzip -q "$STATE/source.zip" -d "$STATE/source"
          test -f "$STATE/source/result.json"
          echo "$SOURCE_RESULT_SHA256  $STATE/source/result.json" | sha256sum -c -
          python3 - <<'PY'
          import json,os,pathlib
          o=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'source/result.json').read_text())
          assert o['status']=='completed' and o['operation_id']=='hotel-match-global-tourvisor-sold-dates-2333-20260913-v1'
          assert o['database_writes']==0 and o['mapping_writes']==0 and o['anex_supplier_calls']==0 and len(o['searches'])==15
          print('saved searches verified',len(o['searches']))
          PY
      - name: SSH preflight before reservation
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match_key"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          out="$(ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20 -o LogLevel=ERROR -l "$SSH_USER" "$SSH_HOST" 'cd "$HOME/www/anytoour.ru" && test -s config.php && { test -f data/db-v1.php || test -f v2/data/db-v1.php; } && printf MATCH_SSH_OK')"
          test "$out" = MATCH_SSH_OK
      - name: Reserve immutable reverse-ID operation
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf '%s\n' '{"operation_id":"hotel-match-global-tourvisor-reverse-id-2333-20260913-v1","state":"reserved_after_saved_search_verify_and_ssh_before_current_db_and_detail_reads","source_artifact_id":10322235864,"database_writes":0,"mapping_writes":0,"booking_calls":0,"search_starts":0,"search_continue_calls":0,"no_replay":true}' > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-global-tourvisor-reverse-id-v1-reservation, path: '${{ runner.temp }}/hotel-match-global-tourvisor-reverse-id-2333-20260913-v1/reservation.json', retention-days: 90}
      - name: Run saved-search reverse operator-ID sweep
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path; state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(path):
            s=P(path).read_text(); s=s[5:] if s.startswith('<?php') else s; return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          parser=body('scripts/diagnostics/anex_hotelcode_evidence.php')
          collector=body('scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\nrequire_once __DIR__ . '/anex_hotelcode_evidence.php';\n",'',1)
          client=body('v2/data/tourvisor-client-v1.php')
          gtv=body('scripts/diagnostics/hotel_match_global_tourvisor_anex_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/anex_tourvisor_hotelcode_evidence_collect.php';\n",'',1).split("if(PHP_SAPI==='cli'",1)[0]
          rvr=body('scripts/diagnostics/hotel_match_global_tourvisor_reverse_id_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/anex_tourvisor_hotelcode_evidence_collect.php';\n",'',1).split("if(PHP_SAPI==='cli'",1)[0]
          source64=base64.b64encode((state/'source/result.json').read_bytes()).decode()
          wrapper="$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$config=realpath($root.'/config.php');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once $config;require_once $dbHelper;$source=json_decode(base64_decode('"+source64+"'),true,64,JSON_THROW_ON_ERROR);$out=rvr_review(v2_data_db(),$source,'hotel-match-global-tourvisor-reverse-id-2333-20260913-v1');echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";"
          payload='<?php\n'+"define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+parser+'\n'+client+'\n'+collector+'\n'+gtv+'\n'+rvr+'\n'+wrapper
          raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='match-rvr-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600)
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M']
            p=subprocess.run(cmd,input=payload,text=True,capture_output=True,timeout=1900)
          if p.returncode!=0:
            state.joinpath('transport.json').write_text(json.dumps({'remote_exit':p.returncode,'stdout_bytes':len(p.stdout.encode()),'stderr_tail':p.stderr[-1200:]},ensure_ascii=False,sort_keys=True)+'\n');raise SystemExit(2)
          v=json.loads(p.stdout);raw_result=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(raw_result)
          ok=v.get('status')=='completed' and v.get('operation_id')==os.environ['OPERATION_ID'] and v.get('database_writes')==0 and v.get('mapping_writes')==0 and v.get('booking_calls')==0 and v.get('search_starts')==0 and v.get('search_continue_calls')==0
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_reverse_operator_id_no_write' if ok else 'invalid_or_unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),'source_result_sha256':os.environ['SOURCE_RESULT_SHA256'],'result_sha256':hashlib.sha256(raw_result).hexdigest(),'unique_tourvisor_tours':v.get('unique_tourvisor_tours'),'direct_unresolved_hits':v.get('direct_unresolved_hits'),'safe_count':v.get('safe_count'),'blocked_count':v.get('blocked_count'),'supplier':v.get('supplier'),'database_writes':0,'mapping_writes':0,'search_starts':0,'search_continue_calls':0,'no_replay':True};state.joinpath('receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          if not ok: raise SystemExit(3)
          print(json.dumps({'unique_tourvisor_tours':v.get('unique_tourvisor_tours'),'direct_unresolved_hits':v.get('direct_unresolved_hits'),'safe_count':v.get('safe_count'),'blocked_count':v.get('blocked_count'),'resolved_or_nonqueue_operator_ids':v.get('resolved_or_nonqueue_operator_ids'),'supplier':v.get('supplier'),'errors':v.get('errors')},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-global-tourvisor-reverse-id-v1-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-global-tourvisor-reverse-id-2333-20260913-v1/', retention-days: 90}
