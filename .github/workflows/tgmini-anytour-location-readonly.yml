name: Locate Telegram Mini App on existing AnyTour servers
on:
  push:
    branches: [audit/tgmini-anytour-location-20261025]
    paths:
      - .github/workflows/tgmini-anytour-location-readonly.yml
      - audit-tgmini-server-location/**
permissions:
  contents: read
concurrency:
  group: tgmini-anytour-location-20261025
  cancel-in-progress: false
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==50.0.2'
      - name: Read fixed Mini App metadata through existing SSH targets
        env:
          CURRENT_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          CURRENT_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          CURRENT_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          LEGACY_HOST: ${{ secrets.DEPLOY_HOST }}
          LEGACY_USER: ${{ secrets.DEPLOY_USER }}
          LEGACY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          READER_SHA256: fcb90bc0a5b2f2ea3160d31087456e9c07637bc7e72bde76862e12bf2d4f762a
          REPORT_PUBLIC_KEY_B64: 
        run: python audit-tgmini-server-location/runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: tgmini-anytour-location-encrypted
          path: encrypted-location/location.enc.json
          if-no-files-found: error
          retention-days: 7
