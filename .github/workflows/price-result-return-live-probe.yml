name: Verify live PRICE result SSH return channel

on:
  push:
    branches: [ops/price-pilot-sample-20261127]
    paths:
      - 'ops/price-pilot/return-vps-host-key.pub'
      - '.github/workflows/price-result-return-live-probe.yml'
permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'pyatkoff/poisk-turov-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the old server receives the complete known day
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          test "$DEPLOY_USER" = anytoour && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY"
          if [[ "$DEPLOY_KEY" == *'PRIVATE KEY'* ]]; then
            printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$scratch/key"
          else
            printf '%s' "$DEPLOY_KEY" | base64 --decode > "$scratch/key"
          fi
          host_key=$(curl -fsSL --proto '=https' --max-time 25 "https://raw.githubusercontent.com/pyatkoff/poisk-turov-test/$COMMIT/ops/price-pilot/return-vps-host-key.pub")
          [[ "$host_key" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+$ ]]
          printf '%s %s\n' "$DEPLOY_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXxjWqpuN07MTGcXrRnshpTX3KKK/wvQeaYl03RY8DA' > "$scratch/known_hosts"
          curl -fsSL --proto '=https' --max-time 25 https://raw.githubusercontent.com/pyatkoff/poisk-turov-test/ca19d2e33ec840037d3d4c173a5128b55b3c03b4/ops/price-pilot/verify-result-return.sh -o "$scratch/verify.sh"
          bash -n "$scratch/verify.sh"
          timeout 220 ssh -4 -i "$scratch/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 \
            -o UserKnownHostsFile="$scratch/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$host_key'" < "$scratch/verify.sh" | tee "$scratch/result"
          grep -qxF 'PRICE_RETURN_RESTRICTION_VERIFIED' "$scratch/result"
          grep -qxF 'PRICE_RETURN_FULL_DAY_VERIFIED rows=638682 observations=699238 digest=ffead7fd573b2a3c9a530b1a31c3bde06efc34f94954b360a9fb7111e9493c9b' "$scratch/result"
