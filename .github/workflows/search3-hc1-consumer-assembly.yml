name: HC1 assemble reviewed hotel consumer source
on:
  pull_request:
    types: [opened, synchronize]
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-hc1-consumer-assembly.yml'
      - 'scripts/diagnostics/search3_hc1_finish_consumer.py'
      - 'patches/search3-hc1-hotel-content-browser.py'
permissions: {contents: write, actions: read, issues: read}
jobs:
  assemble:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 226193297 && github.event.pull_request.number == 3920 &&
      github.run_attempt == 1 && github.head_ref == 'ops/search3-hc1-consumer-assembly-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HC1_ASSEMBLY_OUTPUT: '${{ runner.temp }}/hc1-consumer-final'
      HC1_OUTPUT: '${{ runner.temp }}/hc1-consumer-final/browser'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', path: carrier, fetch-depth: 1, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '27ded93a212229d11d478c43e5efb3fc4478703d', path: work, fetch-depth: 1, persist-credentials: false}
      - name: Verify current claim and exact carrier Security result
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          def get(path):
              q=urllib.request.Request('https://api.github.com/repos/pyatkoff/poisk-turov-test/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=20) as r:return json.load(r)
          c=get('issues/comments/5844474343')
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/3419')
          assert 'HC-1' in c['body'] and 'app.js' in c['body'] and '27ded93a' in c['body']
          for _ in range(45):
              runs=[r for r in get('actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if r['name']=='Security guard' and r['head_sha']==os.environ['HEAD']]
              if runs and max(runs,key=lambda r:r['id'])['status']=='completed':
                  assert max(runs,key=lambda r:r['id'])['conclusion']=='success';break
              time.sleep(2)
          else:raise SystemExit('security_not_confirmed')
          PY
      - name: Apply three exact changes to current source, not old donors
        working-directory: work
        run: python ../carrier/scripts/diagnostics/search3_hc1_finish_consumer.py
      - name: Install the existing pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual Search3 content and exact-offer browser acceptance
        working-directory: work
        run: python tests/search3-hotel-content-browser.py
      - name: Retain checked source objects without updating any branch
        working-directory: work
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python ../carrier/scripts/diagnostics/search3_hc1_finish_consumer.py --objects
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hc1-consumer-final-${{ github.run_id }}
          path: '${{ runner.temp }}/hc1-consumer-final/'
          if-no-files-found: error
          retention-days: 30
