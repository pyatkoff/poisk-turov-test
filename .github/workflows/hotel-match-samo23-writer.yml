name: MATCH SAMO23 guarded writer
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - .github/workflows/hotel-match-samo23-writer.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: match-samo23-writer
  cancel-in-progress: false
jobs:
  write:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.event.pull_request.number == 4014 && github.event.pull_request.head.ref == 'match/dual-live30-full-union-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify Security and exact audit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p input out
          php -l scripts/diagnostics/hotel_match_samo23_accept_v1.php
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(60):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              s=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['HEAD']]
              if s and max(s,key=lambda r:r['id'])['status']=='completed':
                  assert max(s,key=lambda r:r['id'])['conclusion']=='success';break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          curl -fsSL --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10927355199/zip" -o input/audit.zip
          python3 - <<'PY'
          import zipfile,hashlib,json,pathlib
          with zipfile.ZipFile('input/audit.zip') as z:
              raw=z.read('result.json')
          assert hashlib.sha256(raw).hexdigest()=='1f6846947cefe390a9f0fc9fc6663d8cb1a73ca2b766ca57348311d53bc4cb04'
          r=json.loads(raw);assert r['status_counts']=={'hold':6,'ready_pending_transition':8,'ready_source_missing':23}
          pathlib.Path('input/audit-result.json').write_bytes(raw)
          PY
      - name: Execute guarded 23-row insert
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' >"$key"; else printf '%s' "$KEY" | base64 --decode >"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T15 -t ed25519 "$HOST" >"$known" 2>/dev/null
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"; op="hotel-match-samo23-accept-1971-20260927-v1"; rel=".anytoour-match/operations/$op"
          ssh "${opts[@]}" "$remote" "set -eu; umask 077; test ! -e \"\$HOME/$rel\"; mkdir -p \"\$HOME/$rel\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_samo23_accept_v1.php "$remote:$rel/writer.php"
          scp "${opts[@]}" input/audit-result.json "$remote:$rel/audit-result.json"
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_AUDIT_RESULT=\"\$HOME/$rel/audit-result.json\" php \"\$HOME/$rel/writer.php\" --execute"
          rc=$?
          set -e
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$rel/result.json\"" > out/result.json
          python3 - <<'PY'
          import json
          r=json.load(open('out/result.json'))
          assert r['provider_http_calls']==0
          if r['state']=='committed_verified':
              assert r['inserted']==23 and r['database_writes']==23 and r['mapping_writes']==23 and r['readback_verified'] is True
          else:
              assert r['database_writes']==0 and r['mapping_writes']==0
          print(json.dumps({k:r.get(k) for k in ('state','inserted','phase','reason','database_writes','readback_verified')},sort_keys=True))
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-samo23-writer-${{ github.run_id }}
          path: out/result.json
          retention-days: 90
          if-no-files-found: warn
