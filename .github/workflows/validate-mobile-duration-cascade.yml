name: Validate mobile duration cascade

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/br3-control-consistency-v1.css'
      - '.github/workflows/validate-mobile-duration-cascade.yml'

permissions:
  contents: read

jobs:
  mobile-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify branch CSS wins production mobile cascade
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/check-duration.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try {
              for (const width of [375,430]) {
                const page=await browser.newPage({viewport:{width,height:900}});
                const r=await page.goto('https://anytoour.ru/',{waitUntil:'domcontentloaded',timeout:45000});
                if(!r||r.status()!==200) throw new Error(`HTTP ${r&&r.status()}`);
                await page.waitForFunction(()=>document.querySelector('.primary-search-flow .nights-quick'),null,{timeout:20000});
                await page.addStyleTag({path:'v2/br3-control-consistency-v1.css'});
                await page.waitForTimeout(100);
                const state=await page.evaluate(()=>{
                  const q=document.querySelector('.primary-search-flow .nights-quick');
                  const buttons=[...q.querySelectorAll('.nights-choice')];
                  const s=getComputedStyle(q),r=q.getBoundingClientRect();
                  return {display:s.display,overflowX:s.overflowX,clientWidth:q.clientWidth,scrollWidth:q.scrollWidth,width:r.width,buttonWidths:buttons.map(b=>b.getBoundingClientRect().width)};
                });
                console.log('DURATION_STATE',width,JSON.stringify(state));
                if(state.display!=='grid') throw new Error(`${width}: duration display ${state.display}`);
                if(state.scrollWidth>state.clientWidth+2) throw new Error(`${width}: duration overflow ${state.scrollWidth}/${state.clientWidth}`);
                if(state.buttonWidths.some(w=>w>state.width+2)) throw new Error(`${width}: duration button exceeds grid`);
                await page.close();
              }
            } finally { await browser.close(); }
            console.log('MOBILE_DURATION_CASCADE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/check-duration.cjs
