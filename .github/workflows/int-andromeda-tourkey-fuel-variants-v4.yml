name: INT Andromeda tourKey fuel variants v4

on:
  push:
    branches: ['ops/int-andromeda-tourkey-fuel-variants-20260919-v4']
    paths: ['.github/workflows/int-andromeda-tourkey-fuel-variants-v4.yml']

permissions: {contents: read}
concurrency:
  group: int-andromeda-tourkey-fuel-variants-1717-20260919-v4
  cancel-in-progress: false

jobs:
  probe:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 46675ab4db978da044edc50b5e017065b3512c53
      PRIOR_OPS_SHA: 8fd4bbfcc08e39b19a9e8ec8f941d2c9de56f749
      OPERATION_ID: int-andromeda-tourkey-fuel-variants-1717-20260919-v4
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ env.BASE_SHA }}', path: source, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: '${{ env.PRIOR_OPS_SHA }}', path: prior, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: '${{ github.sha }}', path: control, persist-credentials: false}

      - name: Derive exact v4 runtime from sealed v2 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C prior rev-parse HEAD)" = "$PRIOR_OPS_SHA"
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/derived"
          python3 - <<'PY'
          from pathlib import Path
          import os
          src=Path('prior/scripts/ops/andromeda_tourkey_fuel_shape_v2.php').read_text()
          simple=[
            ("count($candidates[$tour]??[])<3", "count($candidates[$tour]??[])<5"),
            ("ANDROMEDA_FUEL_SHAPE_THIRD_NOT_FOUND", "ANDROMEDA_FUEL_VARIANTS_FIFTH_NOT_FOUND"),
            ("$selected[$tour]=$candidates[$tour][2];", "$selected[$tour]=$candidates[$tour][4];"),
            ("'version'=>2", "'version'=>4"),
          ]
          for old,new in simple:
              if src.count(old)!=1: raise SystemExit(f'transform mismatch {old!r}: {src.count(old)}')
              src=src.replace(old,new)

          old_service="""$serviceFact=static function(array $service)use($safeScalar):array{\n    $out=[];foreach(['category','type','name','title','route','required','packet','common'] as $k)if(array_key_exists($k,$service)&&is_scalar($service[$k]))$out[$k]=$safeScalar($service[$k]);\n    foreach(['price','amount','currency'] as $k){if(!array_key_exists($k,$service))continue;$v=$service[$k];if(is_scalar($v))$out[$k]=$safeScalar($v);elseif(is_array($v)){foreach(['amount','value','currency','currencyCode'] as $pk)if(array_key_exists($pk,$v)&&is_scalar($v[$pk]))$out['price_'.$pk]=$safeScalar($v[$pk]);}}\n    if(is_array($service['clients']??null))$out['client_count']=count($service['clients']);return $out;\n};"""
          new_service="""$serviceFact=static function(array $service)use($safeScalar):array{\n    $out=[];\n    foreach(['servicetype','servicecategoryName','category','type','name','title','route','routeIndex','required','packet','common','currencyAlias'] as $k){\n        if(array_key_exists($k,$service)&&is_scalar($service[$k]))$out[$k]=$safeScalar($service[$k]);\n    }\n    foreach(['price','amount','currency'] as $k){\n        if(!array_key_exists($k,$service))continue;$v=$service[$k];\n        if(is_scalar($v))$out[$k]=$safeScalar($v);\n        elseif(is_array($v)){foreach(['amount','value','currency','currencyCode'] as $pk)if(array_key_exists($pk,$v)&&is_scalar($v[$pk]))$out['price_'.$pk]=$safeScalar($v[$pk]);}\n    }\n    if(is_array($service['clients']??null)){\n        $n=0;foreach($service['clients'] as $block){if(is_array($block)&&is_array($block['client']??null))$n+=count($block['client']);elseif(is_array($block))++$n;}\n        $out['client_count']=$n;\n    }\n    return $out;\n};\n$fuelLike=static function(array $service):bool{\n    $text='';foreach(['servicetype','servicecategoryName','category','type','name','title'] as $k)if(is_scalar($service[$k]??null))$text.=' '.(string)$service[$k];\n    return preg_match('/(?:\\bfuel\\b|fuel[_ -]?surcharge|топлив)/iu',$text)===1;\n};\n$variantServices=static function(mixed $variants):array{\n    $out=[];$walk=null;\n    $walk=static function(mixed $node,int $depth=0)use(&$walk,&$out):void{\n        if($depth>6||count($out)>=100||!is_array($node))return;\n        foreach($node as $k=>$v){\n            if($k==='services'&&is_array($v)){\n                foreach($v as $block){if(!is_array($block)||!is_array($block['service']??null))continue;foreach($block['service'] as $row){if(is_array($row))$out[]=$row;if(count($out)>=100)return;}}\n                continue;\n            }\n            if(is_array($v))$walk($v,$depth+1);\n        }\n    };\n    $walk($variants,0);return $out;\n};"""
          if src.count(old_service)!=1: raise SystemExit('service helper transform mismatch')
          src=src.replace(old_service,new_service)

          old_block="""$services=$flatten($doc,'services','service');$transports=$flatten($doc,'transports','transport');\n        $entry['current_service_count']=count($services);$entry['current_transport_count']=count($transports);$entry['transports']=array_map($transportFact,array_slice($transports,0,12));\n        $fuel=[];foreach($services as $service){$text='';foreach(['category','type','name','title'] as $k)if(is_scalar($service[$k]??null))$text.=' '.(string)$service[$k];if(preg_match('/(?:\\bfuel\\b|fuel[_ -]?surcharge|топлив)/iu',$text))$fuel[]=$serviceFact($service);}\n        $entry['fuel_like_service_count']=count($fuel);$entry['fuel_like_services']=array_slice($fuel,0,20);$entry['status']='completed_terminal_no_replay';"""
          new_block="""$services=$flatten($doc,'services','service');$transports=$flatten($doc,'transports','transport');$alternatives=$variantServices($reply['variants']??[]);\n        $entry['current_service_count']=count($services);$entry['current_services']=array_map($serviceFact,array_slice($services,0,40));\n        $entry['variant_service_count']=count($alternatives);$entry['variant_services']=array_map($serviceFact,array_slice($alternatives,0,60));\n        $entry['current_transport_count']=count($transports);$entry['transports']=array_map($transportFact,array_slice($transports,0,12));\n        $fuel=[];foreach($services as $service)if($fuelLike($service))$fuel[]=$serviceFact($service);\n        $variantFuel=[];foreach($alternatives as $service)if($fuelLike($service))$variantFuel[]=$serviceFact($service);\n        $entry['current_fuel_like_service_count']=count($fuel);$entry['current_fuel_like_services']=array_slice($fuel,0,20);\n        $entry['variant_fuel_like_service_count']=count($variantFuel);$entry['variant_fuel_like_services']=array_slice($variantFuel,0,30);$entry['status']='completed_terminal_no_replay';"""
          if src.count(old_block)!=1: raise SystemExit('result block transform mismatch')
          src=src.replace(old_block,new_block)
          dst=Path(os.environ['RUNNER_TEMP'])/'derived'/'andromeda_tourkey_fuel_variants_v4.php'
          dst.write_text(src)
          PY
          php -l "$RUNNER_TEMP/derived/andromeda_tourkey_fuel_variants_v4.php"
          grep -Fq 'variant_fuel_like_service_count' "$RUNNER_TEMP/derived/andromeda_tourkey_fuel_variants_v4.php"
          grep -Fq 'servicecategoryName' "$RUNNER_TEMP/derived/andromeda_tourkey_fuel_variants_v4.php"
          grep -Fq 'ANDROMEDA_FUEL_VARIANTS_FIFTH_NOT_FOUND' "$RUNNER_TEMP/derived/andromeda_tourkey_fuel_variants_v4.php"
          ! grep -Eq -- '(getFlights|->calc|->changeService)[[:space:]]*\(' "$RUNNER_TEMP/derived/andromeda_tourkey_fuel_variants_v4.php"

      - name: Prepare exact runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          stage="$RUNNER_TEMP/runtime"; mkdir -p "$stage/app" "$stage/v2/data" "$stage/scripts/ops"
          cp -a source/app/integrations "$stage/app/"
          cp source/v2/api-anex-search3-preview.php source/v2/api-andromeda-search3-preview.php "$stage/v2/"
          cp source/v2/data/hotel-details-v1.php "$stage/v2/data/"
          cp "$RUNNER_TEMP/derived/andromeda_tourkey_fuel_variants_v4.php" "$stage/scripts/ops/"
          tar -C "$stage" -czf "$RUNNER_TEMP/runtime.tar.gz" .
          ssh-keyscan -T 15 -t ed25519 "$ANYTOOUR_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1

      - name: Execute fifth-offer current-plus-variant service classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          opts=(-T -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=30)
          scp_opts=(-i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"; archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"
          scp "${scp_opts[@]}" "$RUNNER_TEMP/runtime.tar.gz" "$remote:$archive"
          set +e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" "$BASE_SHA" <<'REMOTE'
          set -euo pipefail
          operation="$1"; archive="$2"; source="$3"; site="$HOME/www/anytoour.ru"; private="$HOME/.anytoour-andromeda"; ledger="$HOME/.anytour-ops/$operation"
          test -d "$site"; test -s "$site/config.php"; test -s "$private/search3-preview.php"; test ! -e "$ledger"
          mkdir -p "$HOME/.anytour-ops"; mkdir -m 700 "$ledger"; printf '%s\n' reserved > "$ledger/state"
          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"; trap 'rm -rf "$work"; rm -f "$archive"' EXIT; tar -C "$work" -xzf "$archive"
          snapshot(){ php -d display_errors=0 <<'PHP'
          <?php declare(strict_types=1); error_reporting(0); $root=rtrim((string)getenv('HOME'),'/').'/www/anytoour.ru'; require_once $root.'/config.php'; require_once (is_file($root.'/data/db-v1.php')?$root.'/data/db-v1.php':$root.'/v2/data/db-v1.php'); $db=v2_data_db(); $db->exec('START TRANSACTION READ ONLY'); $c=static fn(string $sql):int=>(int)$db->query($sql)->fetchColumn(); echo json_encode(['all_offers'=>$c('SELECT COUNT(*) FROM anytour_offers'),'andromeda_offers'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda'"),'identities'=>$c('SELECT COUNT(*) FROM andromeda_hotel_identities')],JSON_THROW_ON_ERROR); $db->rollBack();
          PHP
          }
          snapshot > "$ledger/before.json"
          set +e
          php "$work/scripts/ops/andromeda_tourkey_fuel_variants_v4.php" --site-root="$site" --private-config="$private/search3-preview.php" --source-sha="$source" --operation-id="$operation" --tour-keys=110211811,110183689,110183696 --departure=1 --country=4 --date-from=2026-09-19 --date-to=2026-09-22 --nights-from=7 --nights-to=10 --adults=2 --fixed-checkin=2026-09-19 --fixed-nights=7 --generation=17171906 > "$ledger/result.json" 2> "$ledger/error.log"
          rc=$?; set -e; snapshot > "$ledger/after.json"; if cmp -s "$ledger/before.json" "$ledger/after.json"; then db_same=true; else db_same=false; fi
          RC="$rc" DB_SAME="$db_same" php -r '$r=is_file($argv[1])&&filesize($argv[1])?json_decode(file_get_contents($argv[1]),true,64,JSON_THROW_ON_ERROR):null;$out=["status"=>(int)getenv("RC")===0?"completed_terminal_no_replay":"failed_terminal_no_replay","operation"=>$argv[2],"source"=>$argv[3],"db_unchanged"=>getenv("DB_SAME")==="true","result"=>$r,"replay_allowed"=>false];file_put_contents($argv[4],json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL);' "$ledger/result.json" "$operation" "$source" "$ledger/receipt.json"
          printf '%s\n' "$([ "$rc" -eq 0 ] && echo completed_terminal_no_replay || echo failed_terminal_no_replay)" > "$ledger/state"; cat "$ledger/receipt.json"; exit "$rc"
          REMOTE
          rc=$?; set -e
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/.anytour-ops/$OPERATION_ID/receipt.json\"" > "$RUNNER_TEMP/result/receipt.json" || true
          test -s "$RUNNER_TEMP/result/receipt.json"; cat "$RUNNER_TEMP/result/receipt.json"; test "$rc" = 0
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'result','receipt.json'),encoding='utf-8'))
          assert d['status']=='completed_terminal_no_replay' and d['replay_allowed'] is False and d['db_unchanged'] is True,d
          r=d['result']; assert r['version']==4 and r['get_flights_calls']==0 and r['calc_calls']==0 and r['db_writes']==0,r
          assert len(r['specimens'])==3 and r['broninit_calls']==3,r
          for s in r['specimens']:
              assert 'current_services' in s and 'variant_services' in s,s
              assert s['current_service_count']>=len(s['current_services']) and s['variant_service_count']>=len(s['variant_services']),s
              for row in s['current_services']+s['variant_services']:
                  assert not any(k in row for k in ['uid','externalOfferId','claiminc','sid']),row
          print(json.dumps({'price_rows':r['price_rows'],'specimens':r['specimens']},ensure_ascii=False,sort_keys=True))
          PY

      - name: Preserve sanitized terminal receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: int-andromeda-tourkey-fuel-variants-v4-${{ github.run_id }}
          path: ${{ runner.temp }}/result/receipt.json
          if-no-files-found: warn
          retention-days: 30
