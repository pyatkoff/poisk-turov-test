name: Resolve SEO2 Sri Lanka Maldives regions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-seo2-sri-lanka-maldives-regions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Prepare production SSH key
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: List synchronized regions and subregions
        env:
          NEW_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          NEW_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEW_HOST" && test -n "$NEW_USER"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$NEW_USER@$NEW_HOST"
          echo 'SEO2_SRI_LANKA_REGIONS_BEGIN'
          timeout 45s ssh "${opts[@]}" "$remote" \
            "php \"\$HOME/www/anytoour.ru/data/resolve-resort-id-v1.php\" --country=12 --list"
          echo 'SEO2_SRI_LANKA_REGIONS_END'
          echo 'SEO2_MALDIVES_REGIONS_BEGIN'
          timeout 45s ssh "${opts[@]}" "$remote" \
            "php \"\$HOME/www/anytoour.ru/data/resolve-resort-id-v1.php\" --country=8 --list"
          echo 'SEO2_MALDIVES_REGIONS_END'
