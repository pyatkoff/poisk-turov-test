name: MATCH ANEX page media dual-id live v3
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-page-media-dual-id-live-v3.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-anex-page-media-dual-id-live-1971-v3, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-anex-page-media-dual-id-live-1971-20260914-v3
  SOURCE_RUN_ID: '34837373180'
  SOURCE_ARTIFACT: match-live-anex-public-evidence-v1-result
jobs:
  media:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable fast page-media operation
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","source_run_id":%s,"state":"reserved_before_public_network","database_writes":0,"mapping_writes":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_RUN_ID" >"$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: match-anex-page-media-dual-id-live-v3-reservation
          path: ${{ runner.temp }}/hotel-match-anex-page-media-dual-id-live-1971-20260914-v3/reservation.json
          retention-days: 90
      - name: Download confirmed live ANEX evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" -D "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/evidence.json"
      - name: Parallel crawl ordinary ANEX hotel pages
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          python3 -m py_compile scripts/diagnostics/anex_page_media_dual_id_crawl.py
          python3 scripts/diagnostics/anex_page_media_dual_id_crawl.py --evidence "$RUNNER_TEMP/source/evidence.json" --out "$STATE/result.json" --workers 24 --timeout 7 | tee "$STATE/summary.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          s=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];x=json.loads((s/'result.json').read_text())
          if x.get('status')!='completed' or int(x.get('database_writes') or 0)!=0 or int(x.get('mapping_writes') or 0)!=0: raise SystemExit('page_media_contract')
          r={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'source_run_id':int(os.environ['SOURCE_RUN_ID']),'source_seed_count':x['source_seed_count'],'media_url_count':x['media_url_count'],'direct_pair_count':x['direct_pair_count'],'unique_anex_with_pair':x['unique_anex_with_pair'],'unique_samo_with_pair':x['unique_samo_with_pair'],'conflicts':x['conflicts'],'result_sha256':hashlib.sha256((s/'result.json').read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'no_replay':True}
          (s/'receipt.json').write_text(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n');print(json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-page-media-dual-id-live-v3-result
          path: ${{ runner.temp }}/hotel-match-anex-page-media-dual-id-live-1971-20260914-v3/
          retention-days: 90
