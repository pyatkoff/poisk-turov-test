name: Validate V2 SEO readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-*.php'
      - 'v2/site-page-shell-v1.php'
      - 'v2/country-page-v1.php'
      - 'v2/sitemap.xml'
      - 'v2/data/seo-controlled-route-identities-v1.php'
      - 'v2/data/seo-core-hotel-cohort-source-v1.php'
      - 'v2/data/materialize-seo-core-hotel-review-routes-v1.php'
      - 'v2/data/materialize-seo-core-resort-review-routes-v1.php'
      - 'v2/data/report-seo-core-hotel-cohort-v1.php'
      - 'tests/seo-core-month-content-smoke.php'
      - 'tests/seo-structured-data-smoke.php'
      - 'tests/seo-launch-slice-smoke.php'
      - 'tests/seo-controlled-growth-guard.php'
      - 'tests/seo-core-resort-launch-state-smoke.php'
      - 'tests/seo-core-resort-review-materializer-smoke.php'
      - 'tests/seo-core-resort-country-links-smoke.php'
      - 'tests/seo-core-hotel-cohort-smoke.php'
      - 'tests/seo-core-hotel-review-runtime-smoke.php'
      - '.github/workflows/validate-v2-seo-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-v2-seo-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seo-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fast core SEO contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/site-page-shell-v1.php >/dev/null
          php -l v2/seo-structured-data-v1.php >/dev/null
          php -l v2/country-page-v1.php >/dev/null
          php -l v2/seo-core-month-content-v1.php >/dev/null
          php -l v2/seo-core-resort-launch-state-v1.php >/dev/null
          php -l v2/seo-core-resort-review-runtime-v1.php >/dev/null
          php -l v2/data/materialize-seo-core-resort-review-routes-v1.php >/dev/null
          php -l v2/seo-launch-slice-v1.php >/dev/null
          php -l v2/seo-controlled-launch-catalog-v1.php >/dev/null
          php -l v2/seo-production-identity-collector-v1.php >/dev/null
          php -l v2/seo-core-hotel-cohort-v1.php >/dev/null
          php -l v2/seo-hotel-tour-page-v1.php >/dev/null
          php -l v2/seo-core-hotel-review-runtime-v1.php >/dev/null
          php -l v2/data/seo-core-hotel-cohort-source-v1.php >/dev/null
          php -l v2/data/materialize-seo-core-hotel-review-routes-v1.php >/dev/null
          php -l v2/data/report-seo-core-hotel-cohort-v1.php >/dev/null
          php tests/seo-core-month-content-smoke.php
          php tests/seo-structured-data-smoke.php
          php tests/seo-core-resort-launch-state-smoke.php
          php tests/seo-core-resort-review-materializer-smoke.php
          php tests/seo-core-resort-country-links-smoke.php
          php tests/seo-launch-slice-smoke.php
          php tests/seo-controlled-growth-guard.php
          php tests/seo-production-identity-collector-smoke.php
          php tests/seo-core-hotel-cohort-smoke.php
          php tests/seo-core-hotel-review-runtime-smoke.php
          echo 'V2_SEO_CORE_OK static_public=104 dynamic_resorts=manifest_gated structured_data=1 country_resort_links=1 hotel_tours_indexed=0 top500_review_runtime=1'
