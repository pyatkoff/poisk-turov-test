name: Validate V2 SEO readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-*.php'
      - 'v2/data/report-seo-launch-readiness-v1.php'
      - 'tests/seo-turkey-hotel-review-catalog-smoke.php'
      - 'tests/seo-hotel-family-launch-readiness-smoke.php'
      - 'tests/seo-page-launch-readiness-smoke.php'
      - 'tests/seo-hotel-launch-candidate-smoke.php'
      - 'tests/seo-reference-visual-contract-smoke.php'
      - 'tests/seo-resort-family-integrity-smoke.php'
      - 'tests/seo-hotel-review-pilot-report-smoke.php'
      - 'tests/seo-hotel-review-opportunity-gate-smoke.php'
      - 'tests/seo-seasonal-commercial-reference-smoke.php'
      - 'tests/seo-seasonal-opportunity-gate-smoke.php'
      - '.github/workflows/validate-v2-seo-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-v2-seo-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seo-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate SEO PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in v2/seo-*.php; do php -l "$file" >/dev/null; done
          php -l v2/data/report-seo-launch-readiness-v1.php >/dev/null
          echo V2_SEO_PHP_OK

      - name: Validate Turkey hotel review family isolation
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/seo-turkey-hotel-review-catalog-smoke.php >/dev/null
          php tests/seo-turkey-hotel-review-catalog-smoke.php

      - name: Validate SEO launch-readiness controls
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/seo-hotel-family-launch-readiness-smoke.php >/dev/null
          php tests/seo-hotel-family-launch-readiness-smoke.php
          php -l tests/seo-page-launch-readiness-smoke.php >/dev/null
          php tests/seo-page-launch-readiness-smoke.php
          php -l tests/seo-hotel-launch-candidate-smoke.php >/dev/null
          php tests/seo-hotel-launch-candidate-smoke.php
          php -l tests/seo-reference-visual-contract-smoke.php >/dev/null
          php tests/seo-reference-visual-contract-smoke.php
          php -l tests/seo-resort-family-integrity-smoke.php >/dev/null
          php tests/seo-resort-family-integrity-smoke.php
          php -l tests/seo-hotel-review-pilot-report-smoke.php >/dev/null
          php tests/seo-hotel-review-pilot-report-smoke.php
          php -l tests/seo-hotel-review-opportunity-gate-smoke.php >/dev/null
          php tests/seo-hotel-review-opportunity-gate-smoke.php
          php -l tests/seo-seasonal-commercial-reference-smoke.php >/dev/null
          php tests/seo-seasonal-commercial-reference-smoke.php
          php -l tests/seo-seasonal-opportunity-gate-smoke.php >/dev/null
          php tests/seo-seasonal-opportunity-gate-smoke.php
          php v2/data/report-seo-launch-readiness-v1.php --catalog-file=v2/seo-content-pilot-maldives-catalog-v1.php --catalog-function=v2_seo_content_pilot_maldives_catalog </dev/null > /tmp/seo-readiness.json
          php -r '$x=json_decode(file_get_contents("/tmp/seo-readiness.json"),true); if(($x["state"]??"")!=="review_only_launch_readiness_report") exit(1); if(($x["blocked_count"]??0)<1) exit(2); echo "SEO_READINESS_CLI_OK\n";'
          if php v2/data/report-seo-launch-readiness-v1.php --catalog-file=v2/seo-content-pilot-maldives-catalog-v1.php --catalog-function=v2_seo_content_pilot_maldives_catalog --require-ready=999 </dev/null >/tmp/seo-readiness-required.json 2>/tmp/seo-readiness-required.err; then
            echo 'SEO_READINESS_CLI_FAIL:require-ready did not fail closed' >&2
            exit 1
          fi
