name: Validate V2 SEO readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-*.php'
      - 'v2/sitemap.xml'
      - 'v2/data/seo-controlled-route-identities-v1.php'
      - 'tests/seo-core-month-content-smoke.php'
      - 'tests/seo-launch-slice-smoke.php'
      - 'tests/seo-controlled-growth-guard.php'
      - 'tests/seo-core-hotel-cohort-smoke.php'
      - '.github/workflows/validate-v2-seo-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-v2-seo-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seo-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fast core SEO contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-core-month-content-v1.php >/dev/null
          php -l v2/seo-launch-slice-v1.php >/dev/null
          php -l v2/seo-controlled-launch-catalog-v1.php >/dev/null
          php -l v2/seo-production-identity-collector-v1.php >/dev/null
          php -l v2/seo-core-hotel-cohort-v1.php >/dev/null
          php -l v2/seo-hotel-tour-page-v1.php >/dev/null
          php tests/seo-core-month-content-smoke.php
          php tests/seo-launch-slice-smoke.php
          php tests/seo-controlled-growth-guard.php
          php tests/seo-production-identity-collector-smoke.php
          php tests/seo-core-hotel-cohort-smoke.php
          echo 'V2_SEO_CORE_OK public=104 core_months=96 hotel_tours_indexed=0'
