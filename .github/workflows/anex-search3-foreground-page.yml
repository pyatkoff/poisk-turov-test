name: ANEX Search3 foreground first-page contract
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'app/integrations/anex-search.php'
      - 'app/integrations/anex-preview-gateway.php'
      - 'tests/anex-search3-foreground-page-test.php'
      - '.github/workflows/anex-search3-foreground-page.yml'
permissions:
  contents: read
jobs:
  foreground-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Offline foreground, background and endpoint regressions
        run: |
          set -euo pipefail
          php -l app/integrations/anex-search.php
          php -l app/integrations/anex-preview-gateway.php
          php tests/anex-search3-foreground-page-test.php
          php tests/anex-search-smoke.php
          php tests/anex-search3-preview-smoke.php
      - name: Retain checked changed runtime files only
        run: |
          mkdir -p checked-anex-first-page
          cp app/integrations/anex-search.php app/integrations/anex-preview-gateway.php checked-anex-first-page/
          (cd checked-anex-first-page && sha256sum anex-search.php anex-preview-gateway.php > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anex-foreground-page-${{ github.event.pull_request.head.sha }}
          path: checked-anex-first-page/
          retention-days: 14
