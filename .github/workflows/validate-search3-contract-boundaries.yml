name: Validate Search3 contract boundaries

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/runtime-v3.js'
      - 'v2/search-lifecycle-v6.js'
      - 'v2/search-progress-ux-v1.js'
      - 'v2/results-depth-v1.js'
      - 'v2/results-renderer-v5.js'
      - 'v2/flight-price-sync-v1.js'
      - 'v2/unpriced-flight-price-reset-v1.js'
      - 'v2/tour-controller-v4.js'
      - 'v2/lead-search-context.js'
      - 'v2/analytics-v4.js'
      - 'v2/api-v2.php'
      - 'v2/lead-adapter-v2.php'
      - 'v2/lead-bridge-v1.php'
      - 'v2/lead-receiver-v1.php'
      - 'v2/lead-price-v1.php'
      - 'v2/analytics-config.php'
      - 'v2/index.php'
      - 'diagnostics/search_results_recovery_test.cjs'
      - 'scripts/ci/lead/validate-price.php'
      - 'scripts/release/build_anytoour_release.py'
      - 'tests/contracts/search3-boundaries.fixture.json'
      - 'tests/contracts/search3-boundaries.test.cjs'
      - '.github/workflows/deploy-anytoour.yml'
      - '.github/workflows/validate-search3-contract-boundaries.yml'
  push:
    branches: [main]
    paths:
      - 'v2/runtime-v3.js'
      - 'v2/search-lifecycle-v6.js'
      - 'v2/search-progress-ux-v1.js'
      - 'v2/results-depth-v1.js'
      - 'v2/results-renderer-v5.js'
      - 'v2/flight-price-sync-v1.js'
      - 'v2/unpriced-flight-price-reset-v1.js'
      - 'v2/tour-controller-v4.js'
      - 'v2/lead-search-context.js'
      - 'v2/analytics-v4.js'
      - 'v2/api-v2.php'
      - 'v2/lead-adapter-v2.php'
      - 'v2/lead-bridge-v1.php'
      - 'v2/lead-receiver-v1.php'
      - 'v2/lead-price-v1.php'
      - 'v2/analytics-config.php'
      - 'v2/index.php'
      - 'diagnostics/search_results_recovery_test.cjs'
      - 'scripts/ci/lead/validate-price.php'
      - 'scripts/release/build_anytoour_release.py'
      - 'tests/contracts/search3-boundaries.fixture.json'
      - 'tests/contracts/search3-boundaries.test.cjs'
      - '.github/workflows/deploy-anytoour.yml'
      - '.github/workflows/validate-search3-contract-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-search3-contract-boundaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate deterministic browser-side contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            v2/runtime-v3.js \
            v2/search-lifecycle-v6.js \
            v2/search-progress-ux-v1.js \
            v2/results-depth-v1.js \
            v2/results-renderer-v5.js \
            v2/flight-price-sync-v1.js \
            v2/unpriced-flight-price-reset-v1.js \
            v2/tour-controller-v4.js \
            v2/lead-search-context.js \
            v2/analytics-v4.js \
            diagnostics/search_results_recovery_test.cjs \
            tests/contracts/search3-boundaries.test.cjs; do
            node --check "$file"
          done
          node tests/contracts/search3-boundaries.test.cjs
          node diagnostics/search_results_recovery_test.cjs

      - name: Validate read-only PHP contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            v2/api-v2.php \
            v2/lead-adapter-v2.php \
            v2/lead-bridge-v1.php \
            v2/lead-receiver-v1.php \
            v2/lead-price-v1.php \
            v2/analytics-config.php \
            scripts/ci/lead/validate-price.php; do
            php -l "$file" >/dev/null
          done
          php scripts/ci/lead/validate-price.php
