name: MATCH SAMO business live30 COMMON4 recover v1
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py'
      - 'tests/hotel_match_samo_business_live30_common4_recover_v1_test.py'
      - '.github/workflows/hotel-match-samo-business-live30-common4-recover-v1.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-samo-business-live30-common4-recover-1971-20260924-v1, cancel-in-progress: false}
env:
  OP: hotel-match-samo-business-live30-common4-recover-1971-20260924-v1
  SEALED_OP: hotel-match-samo-business-live30-common4-acquire-1971-20260924-v2
  BASE: 5d73897c6df42c255e37363fc3f02f656960d656
  CLAIM: '5811655124'
  BASE_CLAIM: '5811510117'
  PLAN_ARTIFACT: '10798255813'
  PLAN_ARCHIVE_SHA: 1adf8a92bba3e447fec566c6b3a89a557d1446d5ca49dd5492b08b5b8625d87a
  PLAN_RESULT_SHA: 174cdd0bd45f48929fbda2e7c07383fbf81afccd18acccca990aee3ee94e6b23
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/samo-business-live30-common4-recover-v1-20260924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: python3 -m py_compile scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py
      - run: python3 scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py --self-test
      - run: python3 tests/hotel_match_samo_business_live30_common4_recover_v1_test.py
      - run: "! grep -E 'requests\\.|urllib|curl|INSERT INTO|UPDATE .* SET|DELETE FROM' scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py"
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/samo-business-live30-common4-recover-v1-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate owner recovery authority Security and immutable plan
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/plan terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-samo-business-live30-common4-recover-v1.yml scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py tests/hotel_match_samo_business_live30_common4_recover_v1_test.py "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$BASE_CLAIM" >input/base-claim.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          base=json.load(open('input/base-claim.json'));c=json.load(open('input/claim.json'));b=base['body']+"\n"+c['body']
          for x in (base,c):
              assert x['user']['id']==226193297 and x['author_association']=='OWNER' and x['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],os.environ['SEALED_OP'],'HTTP0','DB/mapping writes0','5988 acquisition-ready lane edges','502 deterministic request groups','fail if its provider process is still alive','partial_unresolved_no_replay','continuation_start_batch']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAN_ARTIFACT/zip" -o input/plan.zip
          test "$(sha256sum input/plan.zip|awk '{print $1}')" = "$PLAN_ARCHIVE_SHA"
          unzip -q input/plan.zip -d input/plan
          result="$(find input/plan -type f -name result.json -print -quit)";receipt="$(find input/plan -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/plan-result.json;cp "$receipt" input/plan-receipt.json
          test "$(sha256sum input/plan-result.json|awk '{print $1}')" = "$PLAN_RESULT_SHA"
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path('input/plan-result.json');r=json.load(open(p));q=json.load(open('input/plan-receipt.json'))
          assert q['result_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PLAN_RESULT_SHA']
          assert r['operation']=='hotel-match-samo-business-live30-common4-plan-1971-20260924-v2'
          assert r['state']=='samo_business_live30_common4_plan_ready'
          assert r['catalog_live30_count']==1887 and r['acquisition_ready_count']==1753
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          PY
      - name: Recover only durable sealed evidence
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP";sealed=".anytoour-match/operations/$SEALED_OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({
            'operation':os.environ['OP'],'state':'reserved_before_recovery',
            'sealed_operation':os.environ['SEALED_OP'],'plan_result_sha256':os.environ['PLAN_RESULT_SHA'],
            'provider_http_calls':0,'database_writes':0,'mapping_writes':0
          },sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test -d \"\$HOME/$sealed\";test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/plan-result.json "$remote:$op/payload/plan-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py "$remote:$op/payload/scripts/diagnostics/"
          ssh "${opts[@]}" "$remote" "set -eu;MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SEALED_OPERATION_DIR=\"\$HOME/$sealed\" MATCH_PLAN_RESULT=\"\$HOME/$op/payload/plan-result.json\" MATCH_SOURCE_SHA='$HEAD' python3 \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_v1.py\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          d=pathlib.Path('terminal')
          with tarfile.open(d/'server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():(d/m.name).write_bytes(t.extractfile(m).read())
          rp=d/'result.json';qp=d/'receipt.json';r=json.load(open(rp));q=json.load(open(qp))
          assert q['result_sha256']==hashlib.sha256(rp.read_bytes()).hexdigest()
          assert r['state']=='completed_read_only_recovery' and q['state']==r['state']
          assert r['sealed_operation_no_replay'] is True and q['no_replay'] is True
          assert r['queried_edge_count']==5988 and r['planned_batch_count']==502
          assert r['fully_drained_batch_count']+r['partial_batch_count']+r['not_attempted_batch_count']==502
          assert sum(r['edge_state_counts'].values())==5988
          assert r['provider_http_calls']==r['tourvisor_calls']==r['samo_calls']==r['anex_calls']==r['andromeda_calls']==0
          assert r['database_writes']==r['mapping_writes']==0 and r['safe_to_write_now'] is False
          assert q['provider_accessed'] is False and q['provider_http_calls']==q['database_writes']==q['mapping_writes']==0
          print(json.dumps({k:r[k] for k in ['state','original_http_reservations','original_batch_page_reservations','saved_response_pages','attempted_batch_prefix','fully_drained_batch_count','partial_batch_count','not_attempted_batch_count','partial_batches','continuation_start_batch','edge_state_counts','single_native_source_unique_count','single_native_source_collision_count']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-samo-business-live30-common4-recover-v1-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
