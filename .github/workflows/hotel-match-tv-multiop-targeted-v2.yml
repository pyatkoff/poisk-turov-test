name: MATCH TV targeted multi-operator v2 Egypt
on:
  push:
    branches: [ops/match-tv-multiop-targeted-1971-20260916-v2-egypt]
    paths:
      - 'scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php'
      - '.github/workflows/hotel-match-tv-multiop-targeted-v2.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-tv-multiop-targeted-1971-v2-egypt
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-tv-multiop-targeted-1971-20260916-v2-egypt
  OUT: /tmp/match-tv-multiop-targeted-v2-egypt
jobs:
  acquire:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Offline fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -l scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php
          php scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php
          grep -Fq "'/tours/search'" scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php
          grep -Fq "'hotelIds'=>array_values(\$hotels)" scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php
          ! grep -Fq "'operatorIds'" scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php
          grep -Fq "HMM2_DATE='2026-11-15'" scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php
      - name: Create durable runner reservation before SSH DB Tourvisor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['OUT'])/'runner-reservation.json'
          data={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_ssh_db_tourvisor','credential_identifier':'TOURVISOR_JWT','date':'2026-11-15','database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          p.write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 'match-tv-multiop-targeted-reservation-${{ github.run_id }}'
          path: '${{ env.OUT }}/runner-reservation.json'
          if-no-files-found: error
          retention-days: 90
      - name: Run immutable targeted multi-operator acquisition
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match-tv-multiop-v2-key"; known="$RUNNER_TEMP/match-tv-multiop-v2-known"; sock="$RUNNER_TEMP/match-tv-multiop-v2.sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=700 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0 -d memory_limit=768M" < scripts/diagnostics/hotel_match_tv_multiop_targeted_v2.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"
          trc=$?
          set -e
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def load(name):
              try:return json.loads((out/name).read_text())
              except Exception:return {}
          rr=load('runner-reservation.json'); sr=load('reservation.json'); result=load('result.json'); failure=load('failure.json'); receipt=load('receipt.json')
          rh=hashlib.sha256((out/'result.json').read_bytes()).hexdigest() if (out/'result.json').exists() else None
          fh=hashlib.sha256((out/'failure.json').read_bytes()).hexdigest() if (out/'failure.json').exists() else None
          state=result.get('state') or failure.get('state')
          terminal_ok=(rr.get('state')=='reserved_before_ssh_db_tourvisor' and rr.get('operation_id')==os.environ['OPERATION_ID'] and rr.get('source_sha')==os.environ['GITHUB_SHA'] and rr.get('no_replay') is True
              and sr.get('state')=='reserved_before_db_and_tourvisor_access' and sr.get('operation_id')==os.environ['OPERATION_ID'] and sr.get('source_sha')==os.environ['GITHUB_SHA'] and sr.get('credential_identifier')=='TOURVISOR_JWT' and sr.get('no_replay') is True
              and receipt.get('operation_id')==os.environ['OPERATION_ID'] and receipt.get('source_sha')==os.environ['GITHUB_SHA'] and receipt.get('readback_verified') is True and receipt.get('no_replay') is True
              and ((rh is not None and receipt.get('result_sha256')==rh) or (fh is not None and receipt.get('failure_sha256')==fh))
              and int(os.environ['TRC'])==0)
          provider_completed=(terminal_ok and state=='completed_read_only' and int(os.environ['RC'])==0)
          gate={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'terminal_receipt_verified':terminal_ok,'provider_acquisition_completed':provider_completed,'state':state,'reason':failure.get('reason'),'last_stage':failure.get('last_stage'),'current_input_count':result.get('current_input_count'),'search_id':result.get('search_id'),'flattened_rows':result.get('flattened_rows'),'unique_hotel_operator_candidates':result.get('unique_hotel_operator_candidates'),'detail_rows':result.get('detail_rows'),'operator_counts':result.get('operator_counts'),'numeric_link_shapes':result.get('numeric_link_shapes'),'rate_limited':result.get('rate_limited'),'auth_rejected':result.get('auth_rejected'),'tourvisor_calls':result.get('tourvisor_calls',failure.get('tourvisor_calls')),'result_sha256':rh,'failure_sha256':fh,'remote_exit':int(os.environ['RC']),'tar_exit':int(os.environ['TRC']),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          (out/'workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not terminal_ok: raise SystemExit(2)
          if state not in {'completed_read_only','partial_rate_limited','partial_auth_rejected'}: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'match-tv-multiop-targeted-${{ github.run_id }}'
          path: '${{ env.OUT }}/'
          retention-days: 90
