name: Validate V2 hotel comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/results-renderer-v5.js'
      - 'v2/conversion-confidence-v1.js'
      - 'v2/conversion-confidence-v1.css'
      - 'v2/compare-refresh-guard-v1.js'
      - 'v2/search-progress-ux-v1.js'
      - 'diagnostics/search_results_recovery_test.cjs'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-v2-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise branch compare flow at mobile and desktop widths
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-v2-compare.cjs <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const cssFile=path.resolve('v2/conversion-confidence-v1.css');
          const jsFile=path.resolve('v2/conversion-confidence-v1.js');
          const fixture=[
            {id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,country:{name:'Турция'},region:{name:'Анталья'},subRegion:{name:'Лара'},tours:[{id:'a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'}}]},
            {id:902,name:'AnyTour Garden Hotel',category:4,rating:4.4,seaDistance:650,price:98000,country:{name:'Турция'},region:{name:'Аланья'},tours:[{id:'b',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'}}]},
            {id:903,name:'AnyTour Bay Hotel',category:5,rating:4.6,seaDistance:240,price:112000,country:{name:'Турция'},region:{name:'Сиде'},tours:[{id:'c',date:'12.09.2026',nights:8,price:112000,meal:{name:'Все включено'}}]},
            {id:904,name:'AnyTour Extra Hotel',category:4,rating:4.2,seaDistance:900,price:105000,country:{name:'Турция'},region:{name:'Кемер'},tours:[{id:'d',date:'13.09.2026',nights:7,price:105000,meal:{name:'Завтрак'}}]},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3200);
              await page.addStyleTag({path:cssFile});
              await page.evaluate(()=>{window.V2ConversionConfidenceV1=null;delete document.documentElement.dataset.v2CompareBound;});
              await page.addScriptTag({path:jsFile});
              await page.evaluate(rows=>window.V2Results.render(rows),fixture);
              await page.waitForTimeout(150);
              const buttons=page.locator('.hotel-compare-toggle');
              if(await buttons.count()!==4)throw new Error(name+': expected 4 compare buttons');
              await buttons.nth(0).click();
              let state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,tray:!document.getElementById('v2CompareTray').hidden,openDisabled:document.querySelector('.compare-open').disabled,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(state.selected!==1||!state.tray||!state.openDisabled||state.overflow)throw new Error(name+': bad single-select state '+JSON.stringify(state));
              await buttons.nth(1).click();
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,openDisabled:document.querySelector('.compare-open').disabled}));
              if(state.selected!==2||state.openDisabled)throw new Error(name+': compare should be enabled '+JSON.stringify(state));
              await page.locator('.compare-open').click();
              state=await page.evaluate(()=>({overlay:!document.getElementById('v2CompareOverlay').hidden,cards:document.querySelectorAll('.compare-card').length,locked:document.body.classList.contains('v2-compare-dialog-open'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(!state.overlay||state.cards!==2||!state.locked||state.overflow)throw new Error(name+': bad dialog '+JSON.stringify(state));
              await page.locator('.compare-remove').first().click();
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,overlayHidden:document.getElementById('v2CompareOverlay').hidden}));
              if(state.selected!==1||!state.overlayHidden)throw new Error(name+': remove/close failed '+JSON.stringify(state));
              await buttons.nth(0).click();
              await buttons.nth(2).click();
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,disabled:[...document.querySelectorAll('.hotel-compare-toggle')].filter(b=>!b.classList.contains('is-selected')).every(b=>b.disabled)}));
              if(state.selected!==3||!state.disabled)throw new Error(name+': max-three guard failed '+JSON.stringify(state));
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:search-started')));
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,trayHidden:document.getElementById('v2CompareTray').hidden,bodyActive:document.body.classList.contains('v2-compare-active')}));
              if(state.selected!==0||!state.trayHidden||state.bodyActive)throw new Error(name+': search reset failed '+JSON.stringify(state));
              if((response&&response.status())!==200||errors.length)throw new Error(name+': page errors '+errors.join(';'));
              console.log('COMPARE_OK',name);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-v2-compare.cjs
      - name: Preserve comparison through sort and refreshed result sets
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-compare-refresh.cjs <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const guard=path.resolve('v2/compare-refresh-guard-v1.js');
          const rows=[
            {id:801,name:'Compare One',category:5,rating:4.2,price:100000,tours:[{id:'a',date:'10.09.2026',nights:7,price:100000}]},
            {id:802,name:'Compare Two',category:4,rating:4.9,price:110000,tours:[{id:'b',date:'11.09.2026',nights:7,price:110000}]},
            {id:803,name:'Compare Three',category:4,rating:4.4,price:120000,tours:[{id:'c',date:'12.09.2026',nights:8,price:120000}]},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['tablet',768,900],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3000);
              await page.addScriptTag({path:guard});
              await page.evaluate(items=>window.V2Results.render(items),rows);
              const buttons=page.locator('.hotel-compare-toggle');
              await buttons.nth(0).click();await buttons.nth(1).click();await page.locator('.compare-open').click();
              let state=await page.evaluate(()=>({selected:Array.from(window.V2ConversionConfidenceV1.compareState.selected),cards:Array.from(document.querySelectorAll('.compare-card')).map(x=>x.dataset.compareId),overlay:!document.getElementById('v2CompareOverlay').hidden,locked:document.body.classList.contains('v2-compare-dialog-open')}));
              if(state.selected.join(',')!=='801,802'||state.cards.join(',')!=='801,802'||!state.overlay||!state.locked)throw new Error(name+': comparison did not open coherently '+JSON.stringify(state));
              await page.selectOption('#sortResults','rating');await page.dispatchEvent('#sortResults','change');await page.waitForTimeout(50);
              state=await page.evaluate(()=>({selected:Array.from(window.V2ConversionConfidenceV1.compareState.selected),cards:Array.from(document.querySelectorAll('.compare-card')).map(x=>x.dataset.compareId),resultOrder:Array.from(document.querySelectorAll('#results .hotel-card')).map(x=>x.dataset.hotelId),overlay:!document.getElementById('v2CompareOverlay').hidden}));
              if(state.selected.join(',')!=='801,802'||state.cards.join(',')!=='801,802'||state.resultOrder[0]!=='802'||!state.overlay)throw new Error(name+': sort leaked comparison state '+JSON.stringify(state));
              await page.evaluate(items=>window.V2Results.render(items),[rows[2],rows[0],rows[1]]);
              state=await page.evaluate(()=>({selected:Array.from(window.V2ConversionConfidenceV1.compareState.selected),pressed:Array.from(document.querySelectorAll('.hotel-compare-toggle[aria-pressed="true"]')).map(x=>x.dataset.compareId),resultOrder:Array.from(document.querySelectorAll('#results .hotel-card')).map(x=>x.dataset.hotelId),sort:document.getElementById('sortResults').value,uniqueResults:new Set(Array.from(document.querySelectorAll('#results .hotel-card')).map(x=>x.dataset.hotelId)).size,resultCount:document.querySelectorAll('#results .hotel-card').length}));
              if(state.selected.join(',')!=='801,802'||state.pressed.sort().join(',')!=='801,802'||state.resultOrder.join(',')!=='802,803,801'||state.sort!=='rating'||state.uniqueResults!==state.resultCount)throw new Error(name+': progressive refresh reset or duplicated state '+JSON.stringify(state));
              await page.evaluate(items=>window.V2Results.render(items),[rows[0],rows[2]]);
              state=await page.evaluate(()=>({selected:Array.from(window.V2ConversionConfidenceV1.compareState.selected),overlayHidden:document.getElementById('v2CompareOverlay').hidden,locked:document.body.classList.contains('v2-compare-dialog-open'),trayHidden:document.getElementById('v2CompareTray').hidden,openDisabled:document.querySelector('.compare-open').disabled,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(state.selected.join(',')!=='801'||!state.overlayHidden||state.locked||state.trayHidden||!state.openDisabled||state.overflow)throw new Error(name+': invalid one-item modal survived refresh '+JSON.stringify(state));
              await page.evaluate(items=>window.V2Results.render(items),[rows[2],rows[0],rows[1]]);
              state=await page.evaluate(()=>({selected:Array.from(window.V2ConversionConfidenceV1.compareState.selected),pressed:Array.from(document.querySelectorAll('.hotel-compare-toggle[aria-pressed="true"]')).map(x=>x.dataset.compareId),sort:document.getElementById('sortResults').value}));
              if(state.selected.join(',')!=='801'||state.pressed.join(',')!=='801'||state.sort!=='rating')throw new Error(name+': retry restored stale comparison/sort state '+JSON.stringify(state));
              await page.locator('.hotel-compare-toggle[data-compare-id="803"]').click();await page.locator('.compare-open').click();
              state=await page.evaluate(()=>({selected:Array.from(window.V2ConversionConfidenceV1.compareState.selected),cards:Array.from(document.querySelectorAll('.compare-card')).map(x=>x.dataset.compareId),overlay:!document.getElementById('v2CompareOverlay').hidden}));
              if(state.selected.join(',')!=='801,803'||state.cards.join(',')!=='801,803'||!state.overlay)throw new Error(name+': comparison could not resume after recovery '+JSON.stringify(state));
              if((response&&response.status())!==200||errors.length)throw new Error(name+': page errors '+errors.join(';'));
              console.log('COMPARE_RECOVERY_STATE_OK',name);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-compare-refresh.cjs
      - name: Verify result decision badges only describe completed result sets
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-results-decision-finality.cjs <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const jsFile=path.resolve('v2/conversion-confidence-v1.js');
          const partial=[
            {id:991,name:'Early Hotel',category:4,rating:4.3,price:120000,country:{name:'Турция'},region:{name:'Анталья'},tours:[{id:'a',date:'10.09.2026',nights:7,price:120000}]},
            {id:992,name:'Early Best',category:5,rating:4.8,price:110000,country:{name:'Турция'},region:{name:'Сиде'},tours:[{id:'b',date:'11.09.2026',nights:7,price:110000}]},
          ];
          const finalRows=[...partial,{id:993,name:'Final Cheapest',category:4,rating:4.6,price:90000,country:{name:'Турция'},region:{name:'Кемер'},tours:[{id:'c',date:'12.09.2026',nights:8,price:90000}]}];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['tablet',768,1024],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3000);
              await page.evaluate(()=>{window.V2ConversionConfidenceV1=null;delete document.documentElement.dataset.v2CompareBound;});
              await page.addScriptTag({path:jsFile});
              await page.evaluate(rows=>{window.dispatchEvent(new CustomEvent('v2:search-started'));window.V2Results.render(rows);},partial);
              let state=await page.evaluate(()=>({badges:document.querySelectorAll('.result-decision-badges').length,final:window.V2ConversionConfidenceV1.decisionResultsFinal}));
              if(state.badges!==0||state.final!==false)throw new Error(name+': provisional results exposed definitive badges '+JSON.stringify(state));
              await page.evaluate(rows=>{window.V2Results.render(rows);window.dispatchEvent(new CustomEvent('v2:search-complete',{detail:{items:rows}}));},finalRows);
              state=await page.evaluate(()=>({badges:[...document.querySelectorAll('.result-decision-badge')].map(n=>n.textContent.trim()),cheapest:document.querySelector('[data-hotel-id="993"] .result-decision-badge--price')?.textContent.trim()||'',oldCheapest:document.querySelector('[data-hotel-id="992"] .result-decision-badge--price')?.textContent.trim()||'',final:window.V2ConversionConfidenceV1.decisionResultsFinal}));
              if(state.final!==true||state.cheapest!=='Самая низкая цена'||state.oldCheapest||!state.badges.includes('Лучший рейтинг'))throw new Error(name+': final benchmark wrong '+JSON.stringify(state));
              await page.evaluate(rows=>{window.dispatchEvent(new CustomEvent('v2:search-continue-started'));window.V2Results.render(rows);},finalRows);
              state=await page.evaluate(()=>({badges:document.querySelectorAll('.result-decision-badges').length,final:window.V2ConversionConfidenceV1.decisionResultsFinal}));
              if(state.badges!==0||state.final!==false)throw new Error(name+': continue search kept stale definitive badges '+JSON.stringify(state));
              await page.evaluate(rows=>window.dispatchEvent(new CustomEvent('v2:search-continued',{detail:{items:rows,addedResultsCount:1}})),finalRows);
              state=await page.evaluate(()=>({badges:document.querySelectorAll('.result-decision-badges').length,cheapest:document.querySelector('[data-hotel-id="993"] .result-decision-badge--price')?.textContent.trim()||'',final:window.V2ConversionConfidenceV1.decisionResultsFinal,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(state.final!==true||state.badges<2||state.cheapest!=='Самая низкая цена'||state.overflow)throw new Error(name+': continued final benchmark wrong '+JSON.stringify(state));
              if((response&&response.status())!==200||errors.length)throw new Error(name+': page errors '+errors.join(';'));
              console.log('DECISION_FINALITY_OK',name);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-results-decision-finality.cjs
