name: Validate V2 hotel comparison

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/conversion-confidence-v1.js'
      - 'v2/conversion-confidence-v1.css'
      - '.github/workflows/validate-v2-compare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise compare flow at mobile and desktop widths
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-v2-compare.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          const root=path.resolve('v2');
          const asset=/\/poisk-turov-test\/v2\/([^/?]+\.(?:js|css))(?:\?.*)?$/i;
          const fixture=[
            {id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,country:{name:'Турция'},region:{name:'Анталья'},subRegion:{name:'Лара'},tours:[{id:'a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'}}]},
            {id:902,name:'AnyTour Garden Hotel',category:4,rating:4.4,seaDistance:650,price:98000,country:{name:'Турция'},region:{name:'Аланья'},tours:[{id:'b',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'}}]},
            {id:903,name:'AnyTour Bay Hotel',category:5,rating:4.6,seaDistance:240,price:112000,country:{name:'Турция'},region:{name:'Сиде'},tours:[{id:'c',date:'12.09.2026',nights:8,price:112000,meal:{name:'Все включено'}}]},
            {id:904,name:'AnyTour Extra Hotel',category:4,rating:4.2,seaDistance:900,price:105000,country:{name:'Турция'},region:{name:'Кемер'},tours:[{id:'d',date:'13.09.2026',nights:7,price:105000,meal:{name:'Завтрак'}}]},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',async route=>{const m=new URL(route.request().url()).pathname.match(asset);if(!m)return route.continue();const file=path.join(root,path.basename(m[1]));if(!fs.existsSync(file))return route.continue();return route.fulfill({status:200,contentType:path.extname(file)==='.css'?'text/css':'application/javascript',body:fs.readFileSync(file)});});
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3200);
              await page.evaluate(rows=>window.V2Results.render(rows),fixture);
              await page.waitForTimeout(100);
              const buttons=page.locator('.hotel-compare-toggle');
              if(await buttons.count()!==4)throw new Error(name+': expected 4 compare buttons');
              await buttons.nth(0).click();
              let state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,tray:!document.getElementById('v2CompareTray').hidden,openDisabled:document.querySelector('.compare-open').disabled,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(state.selected!==1||!state.tray||!state.openDisabled||state.overflow)throw new Error(name+': bad single-select state '+JSON.stringify(state));
              await buttons.nth(1).click();
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,openDisabled:document.querySelector('.compare-open').disabled}));
              if(state.selected!==2||state.openDisabled)throw new Error(name+': compare should be enabled '+JSON.stringify(state));
              await page.locator('.compare-open').click();
              state=await page.evaluate(()=>({overlay:!document.getElementById('v2CompareOverlay').hidden,cards:document.querySelectorAll('.compare-card').length,locked:document.body.classList.contains('v2-compare-dialog-open'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(!state.overlay||state.cards!==2||!state.locked||state.overflow)throw new Error(name+': bad dialog '+JSON.stringify(state));
              await page.locator('.compare-remove').first().click();
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,overlayHidden:document.getElementById('v2CompareOverlay').hidden}));
              if(state.selected!==1||!state.overlayHidden)throw new Error(name+': remove/close failed '+JSON.stringify(state));
              await buttons.nth(1).click();
              await buttons.nth(2).click();
              await buttons.nth(3).click();
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,disabled:[...document.querySelectorAll('.hotel-compare-toggle')].filter(b=>!b.classList.contains('is-selected')).every(b=>b.disabled)}));
              if(state.selected!==3||!state.disabled)throw new Error(name+': max-three guard failed '+JSON.stringify(state));
              await page.evaluate(()=>window.dispatchEvent(new CustomEvent('v2:search-started')));
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,trayHidden:document.getElementById('v2CompareTray').hidden,bodyActive:document.body.classList.contains('v2-compare-active')}));
              if(state.selected!==0||!state.trayHidden||state.bodyActive)throw new Error(name+': search reset failed '+JSON.stringify(state));
              if((response&&response.status())!==200||errors.length)throw new Error(name+': page errors '+errors.join(';'));
              console.log('COMPARE_OK',name);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-v2-compare.cjs
