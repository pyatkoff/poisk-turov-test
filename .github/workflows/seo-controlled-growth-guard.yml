name: SEO controlled growth guard

on:
  push:
    branches: [main]
    paths:
      - 'v2/seo-launch-slice-v1.php'
      - 'v2/seo-core-month-*.php'
      - 'v2/sitemap.xml'
      - 'tests/seo-controlled-growth-guard.php'
      - '.github/workflows/seo-controlled-growth-guard.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
    paths:
      - 'v2/seo-launch-slice-v1.php'
      - 'v2/seo-core-month-*.php'
      - 'v2/sitemap.xml'
      - 'tests/seo-controlled-growth-guard.php'
      - '.github/workflows/seo-controlled-growth-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-controlled-growth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || (github.head_ref != 'release/search3-production-ready-v1' && github.base_ref != 'release/search3-production-ready-v1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep review-only month matrix out of public launch
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/seo-controlled-growth-guard.php >/dev/null
          php tests/seo-controlled-growth-guard.php
