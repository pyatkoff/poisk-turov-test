name: MATCH reverse saved2 CURRENT v1
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    types: [opened]
    paths:
      - scripts/diagnostics/hotel_match_reverse_saved2_prepare_v1.py
      - scripts/diagnostics/hotel_match_reverse_saved2_current_v1.php
      - .github/workflows/hotel-match-reverse-saved2-current-v1.yml
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: hotel-match-reverse-saved2-current-1971-20260920-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-reverse-saved2-current-1971-20260920-v1
  EXPECTED_BASE: 04679a5f1136ac06c8cd790c2c90315a09322335
  CLAIM_COMMENT_ID: '5749223759'
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/match-reverse-saved2-current-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Validate scope and immutable owner claim
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir inputs payload result
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          git diff --name-only "$EXPECTED_BASE..HEAD" > inputs/changed.txt
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > inputs/claim.json
          python3 - <<'PY'
          import json,os,pathlib
          paths=set(pathlib.Path('inputs/changed.txt').read_text().splitlines())
          assert paths=={'scripts/diagnostics/hotel_match_reverse_saved2_prepare_v1.py','scripts/diagnostics/hotel_match_reverse_saved2_current_v1.php','.github/workflows/hotel-match-reverse-saved2-current-v1.yml'}
          c=json.load(open('inputs/claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
          assert os.environ['OPERATION_ID'] in c['body']
          assert all(p in c['body'] for p in paths)
          PY
      - name: Rebind saved proof and unchanged guard library
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10577689146/zip > inputs/detail180.zip
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10603032763/zip > inputs/frontier.zip
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10574360037/zip > inputs/guards.zip
          python3 scripts/diagnostics/hotel_match_reverse_saved2_prepare_v1.py inputs payload
          cp scripts/diagnostics/hotel_match_reverse_saved2_current_v1.php payload/current.php
          php -l payload/current.php
          php payload/current.php --self-test
          python3 - <<'PY'
          import pathlib,re
          for p in ['payload/current.php','payload/guards.php']:
              s=pathlib.Path(p).read_text()
              assert not re.search(r'\b(?:INSERT|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',s,re.I)
          assert 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in pathlib.Path('payload/current.php').read_text()
          PY
      - name: Require exact-head Security
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed':
                      assert r['conclusion']=='success','security_not_green'
                      print('SECURITY_OK',r['id']);break
              time.sleep(5)
          else:raise SystemExit('security_not_available')
          PY
      - name: Reserve before remote DB read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('payload')
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'state':'reserved_before_db_read','input_sha256':hashlib.sha256((p/'input.json').read_bytes()).hexdigest(),'guard_sha256':hashlib.sha256((p/'guards.php').read_bytes()).hexdigest(),'program_sha256':hashlib.sha256((p/'current.php').read_bytes()).hexdigest(),'supplier_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True)+'\n').encode()
          with (p/'reservation.json').open('xb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          pathlib.Path('result/reservation.json').write_bytes(raw)
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256((p/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in ['current.php','guards.php','input.json','reservation.json']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'match-reverse-saved2-reservation-${{ github.run_id }}'
          path: result/reservation.json
          retention-days: 90
          if-no-files-found: error
      - name: Read exact two CURRENT pairs
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY_VALUE"; test -n "$HOST_VALUE"; test -n "$USER_VALUE"
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null; test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE"; op=".anytoour-match/operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" payload/current.php payload/guards.php payload/input.json payload/reservation.json payload/SHA256SUMS "$remote:$op/"
          set +e
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";sha256sum -c SHA256SUMS >/dev/null;cd \"\$HOME/www/anytoour.ru\";MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$SOURCE_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M \"\$HOME/$op/current.php\" --read" >result/remote.stdout 2>result/remote.stderr
          rc=$?
          ssh "${opts[@]}" "$remote" "tar -C \"\$HOME/$op\" -czf - reservation.json execution-reservation.json result.json receipt.json" >result/server-operation.tgz 2>>result/remote.stderr
          trc=$?
          set -e
          printf '{"remote":%s,"tar":%s}\n' "$rc" "$trc">result/exit-codes.json
          test "$trc" -eq 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path('result');s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['execution-reservation.json','receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size<=2000000
                  (s/m.name).write_bytes(t.extractfile(m).read())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          r=json.loads((s/'result.json').read_bytes());q=json.loads((s/'receipt.json').read_bytes())
          digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert q['result_sha256']==digest and q['readback_verified'] is True
          assert r['operation_id']==q['operation_id']==os.environ['OPERATION_ID']
          assert r['source_sha']==q['source_sha']==os.environ['SOURCE_SHA']
          assert r['state']=='completed_read_only' and r['examined']==2
          assert r['database_writes']==r['mapping_writes']==r['provider_calls']==r['supplier_calls']==0
          assert r['eligible_count']+r['held_count']==2
          assert all(x['safe_to_write_now'] is False for x in r['dossiers'])
          summary={'state':r['state'],'read_at_utc':r['read_at_utc'],'examined':2,'eligible_count':r['eligible_count'],'held_count':r['held_count'],'result_sha256':digest,'pairs':[{'tv':x['hotel_id'],'anex':x['native_anex_id'],'holds':x['holds']} for x in r['dossiers']]}
          (p/'verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'match-reverse-saved2-result-${{ github.run_id }}'
          path: result/
          retention-days: 90
          if-no-files-found: error
