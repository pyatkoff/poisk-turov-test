name: MATCH ANEX current hotelCode queue
run-name: MATCH ANEX current hotelCode queue #1971
on:
  push:
    branches: ['feat/match-current-bulk-review-20260911']
    paths:
      - 'scripts/diagnostics/anex_hotelcode_current_queue.php'
      - 'tests/anex-hotelcode-current-queue-test.php'
      - '.github/workflows/anex-hotelcode-current-queue.yml'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-anex-hotelcode-current-queue-1971
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-hotelcode-current-queue-1971-20260911-v1
jobs:
  current-queue:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static read-only scope and tests
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/anex_hotelcode_current_queue.php
          php -l tests/anex-hotelcode-current-queue-test.php
          php tests/anex-hotelcode-current-queue-test.php
      - name: Reserve immutable read operation
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          mkdir -m 700 "$STATE"
          export STATE
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          state=Path(os.environ['STATE'])
          reservation={
              'operation_id':os.environ['OPERATION_ID'],
              'state':'reserved_before_ssh',
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_sha':os.environ['GITHUB_SHA'],
              'mode':'current_db_anex_hotelcode_queue_read_only',
              'database_writes':0,
              'supplier_calls':0,
              'historical_operations_replayed':False,
              'no_replay':True,
          }
          (state/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n',encoding='utf-8')
          PYTHON
      - name: Preserve reservation before live read
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-hotelcode-current-queue-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-hotelcode-current-queue-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Read CURRENT DB and build ANEX M3 queue
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, shlex, subprocess, tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          files={
              'helper':Path('scripts/diagnostics/hotel_full_catalog_reconcile.php').read_text(encoding='utf-8'),
              'planner':Path('scripts/diagnostics/hotel_match_current_bulk_review.php').read_text(encoding='utf-8'),
              'parser':Path('scripts/diagnostics/anex_hotelcode_evidence.php').read_text(encoding='utf-8'),
              'queue':Path('scripts/diagnostics/anex_hotelcode_current_queue.php').read_text(encoding='utf-8'),
          }
          def body(text):
              if text.startswith('<?php'): text=text[len('<?php'):]
              return text.replace('declare(strict_types=1);','',1)
          helper=body(files['helper'])
          planner=body(files['planner']).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          parser=body(files['parser'])
          queue=body(files['queue']).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\nrequire_once __DIR__ . '/anex_hotelcode_evidence.php';\n",'',1)
          wrapper=r'''
          $root=realpath(getcwd());
          if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');
          $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));
          if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper');
          require_once $dbHelper;
          $db=v2_data_db();
          $out=ahq_review($db,AHQ_OPERATION);
          echo fc_json($out),"\n";
          '''
          code="define('FC_LIBRARY_ONLY',true);\n"+helper+"\n"+planner+"\n"+parser+"\n"+queue+"\n"+wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          host=os.environ[req[1]].strip(); user=os.environ[req[2]].strip()
          if not host or not user or not os.environ[req[0]].strip(): raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-anex-hotelcode-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key'; key.write_text(os.environ[req[0]].rstrip()+'\n'); key.chmod(0o600)
              known=Path(tmp)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
              try:
                  p=subprocess.run(cmd,text=True,capture_output=True,timeout=420,env=clean)
              except subprocess.TimeoutExpired:
                  blocker={'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'ssh_read_timeout','database_writes':0,'supplier_calls':0}
                  (state/'blocker.json').write_text(json.dumps(blocker,sort_keys=True)+'\n')
                  raise
          try:
              result=json.loads(p.stdout)
          except Exception:
              blocker={'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'live_output_unparseable','exit_code':p.returncode,'stderr_tail':p.stderr[-1000:],'database_writes':0,'supplier_calls':0}
              (state/'blocker.json').write_text(json.dumps(blocker,ensure_ascii=False,sort_keys=True)+'\n')
              raise RuntimeError('live_output_unparseable')
          (state/'queue.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          if p.returncode!=0 or result.get('status')!='completed' or result.get('operation_id')!=os.environ['OPERATION_ID'] or result.get('database_writes')!=0 or result.get('supplier_calls')!=0:
              blocker={'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'current_queue_not_completed','exit_code':p.returncode,'result_status':result.get('status'),'result_reason':result.get('reason'),'database_writes':result.get('database_writes'),'supplier_calls':result.get('supplier_calls')}
              (state/'blocker.json').write_text(json.dumps(blocker,ensure_ascii=False,sort_keys=True)+'\n')
              raise RuntimeError('current_queue_not_completed')
          raw=(state/'queue.json').read_bytes(); counts=result['counts']; coverage=result['coverage']; examined=result['examined']
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'queue_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'supplier_calls':0,'consistent_snapshot':True,'historical_operations_replayed':False,'counts':counts,'coverage':coverage,'examined':examined}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          summary=(
              f"MATCH #1971 CURRENT-DB M3 queue `{os.environ['OPERATION_ID']}` completed read-only.\n\n"
              f"Post-write Tourvisor→ANEX seeds **{counts['tourvisor_anex_seeds']}**: observed/live-search **{counts['observed_seeds']}**, staging-only **{counts['staging_only_seeds']}**. "
              f"Existing persisted files.anextour.ru hotelCode evidence **{counts['saved_hotelcode_evidence']}**, conflicts **{counts['saved_hotelcode_conflict']}**, invalid evidence **{counts['saved_hotelcode_invalid']}**, still requiring operator-link/page evidence **{counts['operator_link_required']}**. "
              f"CURRENT pass examined observed **{examined['observed']}**, staging-only **{examined['staging_only']}**, protected **{examined['protected']}**, and skipped **{examined['auto_accept_current_rule']}** rows still acceptable under current local-only rule.\n\n"
              f"Coverage snapshot: ANEX links {coverage['anex_links']}, ANEX unique local {coverage['anex_unique_local']}, Andromeda unique local {coverage['andromeda_unique_local']}, triple {coverage['all_three']}. DB writes **0**, supplier calls **0**, historical operations replayed **0**. "
              "The queue is ordered live-observed first by search_count and is the input for a distinct unchanged-payload Tourvisor/ANEX evidence collection operation."
          )
          (state/'summary.md').write_text(summary+'\n',encoding='utf-8')
          print(json.dumps({'counts':counts,'coverage':coverage,'examined':examined},ensure_ascii=False,sort_keys=True))
          PYTHON
      - name: Preserve M3 queue and receipt
        if: always()
        id: result
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-hotelcode-current-queue-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-hotelcode-current-queue-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record substantive queue in MATCH issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.result.outputs.artifact-id }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf '\nResult artifact `%s`; immutable reservation was persisted before SSH.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
