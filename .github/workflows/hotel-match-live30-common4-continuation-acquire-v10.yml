name: MATCH COMMON4 continuation acquire v10

on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_live30_common4_continuation_acquire_v10.py'
      - 'tests/hotel_match_live30_common4_continuation_acquire_v10_test.py'
      - '.github/workflows/hotel-match-live30-common4-continuation-acquire-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile scripts/diagnostics/hotel_match_live30_common4_continuation_acquire_v10.py
      - name: Self-test
        run: python3 scripts/diagnostics/hotel_match_live30_common4_continuation_acquire_v10.py --self-test
      - name: Contract test
        run: python3 tests/hotel_match_live30_common4_continuation_acquire_v10_test.py
      - name: No DB writer
        run: |
          ! grep -E 'INSERT INTO|UPDATE .* SET|DELETE FROM' scripts/diagnostics/hotel_match_live30_common4_continuation_acquire_v10.py
