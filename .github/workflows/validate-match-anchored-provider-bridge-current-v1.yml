name: Validate MATCH anchored provider bridge CURRENT v1

on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_anchored_provider_bridge_current_v1.php'
      - 'tests/hotel-match-anchored-provider-bridge-current-v1-smoke.php'
      - '.github/workflows/validate-match-anchored-provider-bridge-current-v1.yml'
      - 'scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php'
  push:
    paths:
      - 'scripts/diagnostics/hotel_match_anchored_provider_bridge_current_v1.php'
      - 'tests/hotel-match-anchored-provider-bridge-current-v1-smoke.php'
      - '.github/workflows/validate-match-anchored-provider-bridge-current-v1.yml'
      - 'scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php'

permissions:
  contents: read

jobs:
  offline-dossier-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint read-only dossier and fixtures
        run: |
          php -l scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php
          php -l scripts/diagnostics/hotel_match_anchored_provider_bridge_current_v1.php
          php -l tests/hotel-match-anchored-provider-bridge-current-v1-smoke.php
      - name: Run dossier self-test
        run: php scripts/diagnostics/hotel_match_anchored_provider_bridge_current_v1.php --self-test
      - name: Run bounded residual fixture contract
        run: php tests/hotel-match-anchored-provider-bridge-current-v1-smoke.php
