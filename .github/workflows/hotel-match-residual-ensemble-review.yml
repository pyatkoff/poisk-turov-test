name: MATCH residual ensemble review
run-name: MATCH mass residual ensemble review #1971
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_residual_ensemble_review.php'
      - 'tests/hotel-match-residual-ensemble-review-test.php'
      - '.github/workflows/hotel-match-residual-ensemble-review.yml'
  push:
    branches: ['feat/match-anex-sellability-20260911']
    paths:
      - '.github/match-residual-ensemble-review-1971-v1.arm'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-residual-ensemble-review-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-residual-ensemble-review-1971-20260911-v1
  COORD_RUN_ID: '34591505927'
  COORD_ARTIFACT_ID: '10195814890'
  COORD_ARTIFACT_NAME: hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1-result
  COORD_RESULT_SHA256: cc95fac4494f1fbef26e3eadfdf751a4b3caf828752837be885c0e060df88bcc
  SOLD_RUN_ID: '34589260627'
  SOLD_ARTIFACT_ID: '10194949581'
  SOLD_ARTIFACT_NAME: hotel-match-anex-tourvisor-sold-date-details-review-1971-20260911-v1-result
  SOLD_RESULT_SHA256: 74504dd19773da26c34d4a63aed31774c8880efcfd97565d1cba69d8b5b09b42
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate mass residual read-only scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_residual_ensemble_review.php
          php -l tests/hotel-match-residual-ensemble-review-test.php
          php tests/hotel-match-residual-ensemble-review-test.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/hotel_match_current_strict_review.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_residual_ensemble_review.php').read_text(encoding='utf-8')
          assert 'hotel-match-residual-ensemble-review-1971-20260911-v1' in s
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert 'same_provider_existing_target_claim_blocks_auto' in s
          assert 'coordinate_conflict_override_requires_direct_details_and_same_sold_date' in s
          assert "['ANNEX','BEACH','GARDEN','NORTH','SOUTH']" in s
          assert 'SELECT h.id,h.country_id' in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl_init','https://','http://'):
              assert bad.lower() not in s.lower(), bad
          print('mass residual ensemble source verified')
          PYTHON

  review:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-residual-ensemble-review-1971-v1.arm)" = "$OPERATION_ID"
      - name: Fetch and verify immutable coordinate and sold-date evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          for prefix in COORD SOLD; do
            eval artifact_id="\$${prefix}_ARTIFACT_ID"
            eval artifact_name="\$${prefix}_ARTIFACT_NAME"
            eval run_id="\$${prefix}_RUN_ID"
            lower="$(printf '%s' "$prefix" | tr '[:upper:]' '[:lower:]')"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$STATE/${lower}-meta.json"
            PREFIX="$prefix" LOWER="$lower" python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          state=Path(os.environ['STATE']);prefix=os.environ['PREFIX'];lower=os.environ['LOWER'];m=json.loads((state/f'{lower}-meta.json').read_text())
          assert str(m['id'])==os.environ[prefix+'_ARTIFACT_ID']
          assert m['name']==os.environ[prefix+'_ARTIFACT_NAME']
          assert str(m['workflow_run']['id'])==os.environ[prefix+'_RUN_ID']
          assert m.get('expired') is False
          PYTHON
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$STATE/${lower}.zip"
            mkdir "$STATE/${lower}"; unzip -q "$STATE/${lower}.zip" -d "$STATE/${lower}"
            test -f "$STATE/${lower}/result.json"
            eval expected_sha="\$${prefix}_RESULT_SHA256"
            echo "$expected_sha  $STATE/${lower}/result.json" | sha256sum -c -
          done
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          state=Path(os.environ['STATE']);c=json.loads((state/'coord/result.json').read_text());s=json.loads((state/'sold/result.json').read_text())
          assert c['operation_id']=='hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1' and c['status']=='completed'
          assert c['database_writes']==0 and c['mapping_writes']==0 and c['supplier_calls']==0 and len(c['prepared'])==35
          assert s['operation_id']=='hotel-match-anex-tourvisor-sold-date-details-review-1971-20260911-v1' and s['status']=='completed'
          assert s['database_writes']==0 and len(s['prepared'])==3
          print(json.dumps({'coordinate_prepared':35,'sold_date_prepared':3},sort_keys=True))
          PYTHON
      - name: Prepare normalized SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_match_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Reserve immutable mass review before CURRENT DB access
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          state=Path(os.environ['STATE']);coord=(state/'coord/result.json').read_bytes();sold=(state/'sold/result.json').read_bytes()
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'coordinate_artifact_id':int(os.environ['COORD_ARTIFACT_ID']),'coordinate_result_sha256':hashlib.sha256(coord).hexdigest(),'sold_artifact_id':int(os.environ['SOLD_ARTIFACT_ID']),'sold_result_sha256':hashlib.sha256(sold).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True,'read_only_subplans':3}
          (state/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PYTHON
      - name: Preserve reservation before CURRENT DB access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-residual-ensemble-review-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-match-residual-ensemble-review-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run mass CURRENT residual ensemble
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PYTHON'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          state=Path(os.environ['STATE'])
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[len('<?php'):]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1).replace("const MBR_OPERATION = 'hotel-match-current-bulk-review-1971-20260911-v1';","const MBR_OPERATION = 'hotel-match-residual-ensemble-base-1971-20260911-v1';",1)
          strict=body('scripts/diagnostics/hotel_match_current_strict_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1).replace("const MSR_OPERATION = 'hotel-match-current-strict-review-1971-20260911-v3';","const MSR_OPERATION = 'hotel-match-residual-ensemble-strict-1971-20260911-v1';",1)
          ensemble=body('scripts/diagnostics/hotel_match_residual_ensemble_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_strict_review.php';\n",'',1)
          coord64=base64.b64encode((state/'coord/result.json').read_bytes()).decode();sold64=base64.b64encode((state/'sold/result.json').read_bytes()).decode()
          wrapper=r'''
          try{
            $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMRE_ROOT');
            $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMRE_DB_HELPER');require_once $dbHelper;
            $db=v2_data_db();$base=mbr_review($db,MBR_OPERATION);$strict=msr_review($db,MSR_OPERATION);
            $coord=json_decode(base64_decode('''+repr(coord64)+r'''),true,128,JSON_THROW_ON_ERROR);$sold=json_decode(base64_decode('''+repr(sold64)+r'''),true,128,JSON_THROW_ON_ERROR);
            echo fc_json(hmre_review($db,$base,$strict,$coord,$sold,HMRE_OPERATION)),"\n";
          }catch(Throwable $e){$m=$e->getMessage();$reason=is_string($m)&&preg_match('/\A[A-Z0-9_:-]{1,120}\z/D',$m)?$m:'HMRE_REMOTE_ERROR';echo json_encode(['status'=>'failed','operation_id'=>HMRE_OPERATION,'reason'=>$reason,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0],JSON_UNESCAPED_SLASHES),"\n";exit(2);}
          '''
          code="define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+strict+'\n'+ensemble+'\n'+wrapper
          key=os.path.join(os.environ['RUNNER_TEMP'],'anytoour_match_key');host=os.environ['ANYTOOUR_DEPLOY_HOST'].strip();user=os.environ['ANYTOOUR_DEPLOY_USER'].strip()
          if not host or not user: raise RuntimeError('ssh_secret_missing')
          cmd=['ssh','-T','-i',key,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',f'{user}@{host}','cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
          p=subprocess.run(cmd,input='<?php\n'+code,text=True,capture_output=True,timeout=900)
          try:r=json.loads(p.stdout)
          except Exception: raise RuntimeError('ensemble_output_unparseable')
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw)
          if p.returncode!=0 or r.get('status')!='completed' or r.get('operation_id')!=os.environ['OPERATION_ID'] or r.get('database_writes')!=0 or r.get('mapping_writes')!=0 or r.get('supplier_calls')!=0 or r.get('historical_operations_replayed') is not False: raise RuntimeError('ensemble_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True,'counts':r['counts'],'coverage':r['coverage'],'dropped':r['dropped']}
          (state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          c=r['counts'];cov=r['coverage'];auto=r.get('auto_evidence_sources',{});reasons=r.get('reason_counts',{});top={k:dict(sorted(v.items(),key=lambda x:(-x[1],x[0]))[:8]) for k,v in reasons.items()}
          summary=(f"MATCH #1971 MASS residual ensemble `{r['operation_id']}` completed **read-only / NO-REPLAY**. CURRENT classified **{c['classified_total']}** rows: auto_accept **{c['auto_accept']}** (ANEX {c['auto_anex']} / Andromeda {c['auto_andromeda']} / live {c['auto_live']}), needs_extra **{c['needs_extra_evidence']}**, hard_conflict **{c['hard_conflict']}**, manual_last **{c['manual_last']}**. Evidence inputs: current-strict keys {c['strict_evidence_rows']}, direct-details coordinate {c['coordinate_evidence_rows']}, same-sold-date {c['sold_date_evidence_rows']}, coord+sold overlap {c['coordinate_sold_overlap']}. Auto evidence sources {json.dumps(auto,ensure_ascii=False,sort_keys=True)}. Same-provider new target collisions demoted {c['collision_demoted']}; CURRENT/provenance drops {json.dumps(r['dropped'],ensure_ascii=False,sort_keys=True)}. Top reason codes {json.dumps(top,ensure_ascii=False,sort_keys=True)}. Coverage: ANEX links {cov['anex_links']}, ANEX unique local {cov['anex_unique_local']}, Andromeda unique local {cov['andromeda_unique_local']}, triple {cov['all_three']}. Supplier calls **0**, DB/mapping writes **0**. Any acceptance requires one separate NEW server-current guarded bulk operation with per-row post-COMMIT readback.")
          (state/'summary.md').write_text(summary+'\n');print(summary)
          PYTHON
      - name: Preserve mass result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-residual-ensemble-review-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-residual-ensemble-review-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH mass result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"; gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
