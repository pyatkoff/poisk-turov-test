name: MATCH GLOBAL CURRENT review v2
on:
  push:
    branches: ['ops/match-global-current-review-2333-20260913-v1']
    paths: ['.github/workflows/hotel-match-global-current-review-v2.yml']
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-global-current-review-2333-20260913-v2}
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate global read-only sources
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/hotel_match_current_strict_review.php
      - name: Reserve immutable read operation
        run: |
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          printf '%s\n' '{"operation_id":"hotel-match-global-current-review-2333-20260913-v2","state":"reserved_before_ssh","mode":"current_core8_global_read_only","database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}' > "$RUNNER_TEMP/$OPERATION_ID/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-global-current-review-v2-reservation, path: '${{ runner.temp }}/hotel-match-global-current-review-2333-20260913-v2/reservation.json', retention-days: 90}
      - name: Run global CURRENT strict review
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path; state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(path):
            x=P(path).read_text(); x=x[5:] if x.startswith('<?php') else x; return x.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          strict=body('scripts/diagnostics/hotel_match_current_strict_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1).replace("const MSR_OPERATION = 'hotel-match-current-strict-review-1971-20260911-v3';","const MSR_OPERATION = 'hotel-match-global-current-review-2333-20260913-v2';",1)
          wrapper="$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once $dbHelper;$db=v2_data_db();$out=msr_review($db,'hotel-match-global-current-review-2333-20260913-v2');echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";"
          source='<?php\n'+"define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+strict+'\n'+wrapper
          raw=os.environ['SSH_KEY'].strip(); host=os.environ['SSH_HOST'].strip(); user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='match-global-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key'; known=P(td)/'known'; key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw)); key.chmod(0o600)
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M']
            p=subprocess.run(cmd,input=source,text=True,capture_output=True,timeout=720)
          if p.returncode!=0: raise SystemExit(2)
          v=json.loads(p.stdout); raw_result=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); state.joinpath('result.json').write_bytes(raw_result)
          ok=v.get('status')=='completed' and v.get('operation_id')==os.environ['OPERATION_ID'] and v.get('database_writes')==0 and v.get('supplier_calls')==0
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only_global_review' if ok else 'invalid_result_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw_result).hexdigest(),'counts':v.get('counts'),'examined':v.get('examined'),'coverage':v.get('coverage'),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}; state.joinpath('receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          if not ok: raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-global-current-review-v2-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-global-current-review-2333-20260913-v2/', retention-days: 90}
