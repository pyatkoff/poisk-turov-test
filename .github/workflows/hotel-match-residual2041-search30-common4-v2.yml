name: MATCH residual2041 search30 common4 v2
on:
  push:
    branches: [ops/match-residual2041-search30-common4-1971-20260921-v1]
    paths: [.github/workflows/hotel-match-residual2041-search30-common4-v2.yml]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-residual2041-search30-common4-1971-20260921-v2, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-residual2041-search30-common4-1971-20260921-v2
  BASE_SHA: 4b620405797e996eb3b6e02ae3d982fb2b7a1d6c
  EXPECTED_SOURCE: e6916c9cc634e132c3ac480fe4f4f16f791f7dad
  CLAIM: '5753105629'
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate unchanged checked scripts and v2 owner claim
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation result/server
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --exit-code "$EXPECTED_SOURCE" HEAD -- scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php scripts/diagnostics/hotel_match_residual2041_search30_provider_v1.py scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py
          php -l scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php
          php scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php --self-test
          python3 -m py_compile scripts/diagnostics/hotel_match_residual2041_search30_provider_v1.py scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py
          python3 scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py --self-test
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,subprocess
          want={'.github/workflows/hotel-match-residual2041-search30-common4-v1.yml','.github/workflows/hotel-match-residual2041-search30-common4-v2.yml','scripts/diagnostics/hotel_match_residual2041_search30_plan_v1.php','scripts/diagnostics/hotel_match_residual2041_search30_provider_v1.py','scripts/diagnostics/hotel_match_residual2041_search30_execute_v1.py'}
          got=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines());assert got==want,(got,want)
          c=json.load(open('input/claim.json'));assert c['user']['id']==226193297 and c['author_association']=='OWNER' and os.environ['OPERATION_ID'] in c['body']
          assert 'up to30 real hotelIds[]' in c['body'] and 'tariff_search_units' in c['body'] and 'continue0/flights0' in c['body']
          PY
      - name: Verify terminal predecessors without rerunning them
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35538830477" >input/detail-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35537849926" >input/reverse21-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35539862140/jobs" >input/failed-v1-jobs.json
          python3 - <<'PY'
          import json
          for name in ('detail','reverse21'):
            r=json.load(open('input/'+name+'-run.json'));assert r['status']=='completed' and r['conclusion']=='success'
          jobs=json.load(open('input/failed-v1-jobs.json'))['jobs'];assert len(jobs)==1
          j=jobs[0];assert j['status']=='completed' and j['conclusion']=='failure'
          steps={s['name']:s for s in j['steps']};assert steps['Validate exact source and owner claim']['conclusion']=='failure'
          assert steps['Reserve before server or provider']['conclusion']=='skipped' and steps['Plan CURRENT and execute search30']['conclusion']=='skipped'
          PY
      - name: Download and verify exact immutable evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          for id in 10612519331 10614070651 10614103969;do gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >"input/$id.zip";done
          python3 - <<'PY'
          import json,pathlib,zipfile,hashlib
          specs=[('10612519331','18d8508d374f26299fd0f85ea036abd1657a9b7baf9b3cb962bceb715c3e691c','79723f7087a3725f130c437666e42ab68c34f83aefc7213b7fc34c7a412e581e','reverse20'),('10614070651','f09df06f35038b2d2579e1bbfa81ad0e5a4d3beaa74f0fc9c61fdf7623e57477','dbef5a14fe73543dfe9079e2719468e7cffb0690670894e11385ae8ff1e8abcb','reverse21'),('10614103969','ed9bdce7f2372ef9ca4aeeec06d99719719abf8b004cdb834f72454518856c76','2534eebc2a8b0ba79dbf32dedda165c7e87da609284b25c5209c04747624e564','detail')]
          results={};sent=set();summary_sent=set()
          for aid,zh,rh,label in specs:
            path=pathlib.Path('input/'+aid+'.zip');assert hashlib.sha256(path.read_bytes()).hexdigest()==zh,(aid,'ZIP digest')
            with zipfile.ZipFile(path) as z:
              raw=z.read('server/result.json');assert hashlib.sha256(raw).hexdigest()==rh
              receipt=json.loads(z.read('server/receipt.json'));assert receipt['result_sha256']==rh
              pathlib.Path('input/'+label+'.json').write_bytes(raw);results[label]=json.loads(raw)
              if label=='detail':pathlib.Path('input/census.json').write_bytes(z.read('server/payload/census.json'))
              else:
                summary_sent.update(int(i) for b in results[label]['batches'] for i in b['hotel_ids'])
                for n in z.namelist():
                  if n.startswith('server/request-') and n.endswith('.json'):
                    req=json.loads(z.read(n))
                    if req.get('action')=='search_start':sent.update(map(int,req['params']['hotelIds']))
          assert sent==summary_sent and len(sent)==686
          c=json.load(open('input/census.json'));assert c['operation_id']=='hotel-match-userseen-coverage-1971-20260920-v1' and c['coverage_active_nonexcluded']['total']==4562
          a=results['reverse20'];b=results['reverse21'];d=results['detail']
          assert a['operation']=='hotel-match-reverse686-live-anex-batches-1971-20260920-v1' and a['input_count']==686
          assert b['operation']=='hotel-match-reverse110-live-anex-continuation-1971-20260921-v2' and b['call_counts']['search_start']==97 and b['continue_calls']==0
          assert d['operation']=='hotel-match-residual2041-common4-nonanex-detail-1971-20260921-v4' and d['state']=='completed_read_only' and d['provider_calls']==1348 and d['search_calls']==d['continue_calls']==0
          pathlib.Path('input/sent-ids.json').write_text(json.dumps(sorted(sent)))
          PY
      - name: Require exact-head Security before any server or supplier access
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(90):
            q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(q) as f:xs=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
            if xs and max(xs,key=lambda x:x['id'])['status']=='completed':
              x=max(xs,key=lambda x:x['id']);assert x['conclusion']=='success',x['conclusion'];break
            time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Reserve the new v2 operation once
        run: |
          python3 - <<'PY'
          import json,os,datetime
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_server_provider','source_sha':os.environ['GITHUB_SHA'],'checked_script_source':os.environ['EXPECTED_SOURCE'],'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'max_target_hotels':1350,'hotel_ids_max':30,'operator_filter':None,'max_continue_per_batch':0,'tariff_definition':'start+continue+flights','database_writes':0,'mapping_writes':0,'no_replay_after_provider_access':True}
          with open('reservation/reservation.json','x') as f:json.dump(r,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'search30-v2-reservation-${{ github.run_id }}', path: reservation/reservation.json, retention-days: 90}
      - name: Plan CURRENT and execute disjoint search30 batches
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json input/{census,reverse20,reverse21,detail}.json scripts/diagnostics/hotel_match_residual2041_search30_{plan_v1.php,provider_v1.py,execute_v1.py} "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\""
          set +e
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_CENSUS_PATH=\"\$HOME/$op/payload/census.json\" MATCH_REVERSE20_PATH=\"\$HOME/$op/payload/reverse20.json\" MATCH_REVERSE21_PATH=\"\$HOME/$op/payload/reverse21.json\" MATCH_DETAIL_PATH=\"\$HOME/$op/payload/detail.json\" php \"\$HOME/$op/payload/hotel_match_residual2041_search30_plan_v1.php\" --execute >\"\$HOME/$op/plan.json\";PYTHONPATH=\"\$HOME/$op/payload\" ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_PLAN_PATH=\"\$HOME/$op/plan.json\" python3 \"\$HOME/$op/payload/hotel_match_residual2041_search30_execute_v1.py\" --execute" >result/remote.stdout 2>result/remote.stderr
          rc=$?;scp -r "${opts[@]}" "$remote:$op/." result/server/;trc=$?;set -e;printf '{"remote":%s,"readback":%s}\n' "$rc" "$trc">result/exit-codes.json;test "$trc" -eq 0
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path('result/server');plan=json.load(open(p/'plan.json'));r=json.load(open(p/'result.json'));q=json.load(open(p/'receipt.json'));dig=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert plan['operation']==r['operation']==q['operation']==os.environ['OPERATION_ID'] and q['result_sha256']==dig
          assert r['database_writes']==r['mapping_writes']==r['samo_calls']==0
          assert all(1<=len(g['hotel_ids'])<=30 for g in plan['groups']) and r['action_counts'].get('tour_flights',0)==r['action_counts'].get('search_continue',0)==0
          ids=[i for g in plan['groups'] for i in g['hotel_ids']];assert len(ids)==len(set(ids))<=1350
          assert not set(ids).intersection(set(json.load(open('input/sent-ids.json')))|{420,1244,81154,68705,72755})
          assert r['state'] in ('completed_read_only','terminal_failed_no_replay','failed_before_provider_access')
          pathlib.Path('result/verified-summary.json').write_text(json.dumps({'plan_stats':plan['stats'],**{k:r.get(k) for k in ['state','reason','planned_groups','completed_batches','target_hotels','found_unique_hotels','physical_http_attempts','tariff_search_units_after','action_counts','operator_detail_counts','link_state_counts']}},ensure_ascii=False,indent=2)+'\n')
          print(pathlib.Path('result/verified-summary.json').read_text())
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-search30-v2-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: warn}
