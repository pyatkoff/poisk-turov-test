name: INT Andromeda prioritized local DB snapshot v10

on:
  push:
    branches: ['ops/int-andromeda-local-db-seed-20260918-v10']
    paths:
      - 'scripts/ops/int_andromeda_local_db_seed.php'
      - '.github/workflows/int-andromeda-local-db-seed.yml'

permissions:
  contents: read

concurrency:
  group: int-andromeda-local-db-seed-1717-20260918-v10
  cancel-in-progress: false

jobs:
  seed:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ef2825b2193b1f019d234de3ca908203dacf9a18
      RELEASE_DATA_SHA: 041de3812c93cb27760d1c7d7500a8156864111c
      OPERATION_ID: int-andromeda-local-db-seed-1717-20260918-v10
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_DATA_SHA }}
          path: release-data
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: 7c3c5bb55c88e376d97c998d0ba77a46960584d6
          path: package
          persist-credentials: false

      - name: Bind exact one-shot sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/int-andromeda-local-db-seed.yml'
          test "${changed[1]}" = 'scripts/ops/int_andromeda_local_db_seed.php'

          php -l scripts/ops/int_andromeda_local_db_seed.php >/dev/null
          php -l scripts/ops/andromeda_local_offer_collect.php >/dev/null
          php -l app/integrations/andromeda-search-surcharge.php >/dev/null
          php -l app/integrations/andromeda-saved-package-runtime.php >/dev/null
          grep -F "transport_money_diagnostic" app/integrations/andromeda-saved-package-runtime.php >/dev/null
          grep -F "public static function diagnostic" app/integrations/andromeda-search-surcharge.php >/dev/null

          php tests/andromeda-local-offer-collector-test.php
          php tests/andromeda-source-completeness-test.php
          php tests/andromeda-pagination-contract-test.php
          php tests/andromeda-search3-page-orchestrator-test.php "$(pwd)"
          php tests/andromeda-anytour-offer-autosave-test.php
          php tests/andromeda-party-criteria-fallback-test.php

          test "$(git rev-parse "$BASE_SHA:app/integrations/andromeda-local-offer-collector.php")" = "$(git rev-parse "HEAD:app/integrations/andromeda-local-offer-collector.php")"
          test "$(git rev-parse "$BASE_SHA:app/integrations/andromeda-search-surcharge.php")" = "$(git rev-parse "HEAD:app/integrations/andromeda-search-surcharge.php")"
          test "$(git rev-parse "$BASE_SHA:app/integrations/andromeda-saved-package-runtime.php")" = "$(git rev-parse "HEAD:app/integrations/andromeda-saved-package-runtime.php")"
          test "$(git -C release-data rev-parse HEAD)" = "$RELEASE_DATA_SHA"
          test "$(git -C package rev-parse HEAD)" = '7c3c5bb55c88e376d97c998d0ba77a46960584d6'
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY"
          test -n "$ANYTOOUR_DEPLOY_HOST"
          test -n "$ANYTOOUR_DEPLOY_USER"

      - name: Prepare exact temporary INT runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

          stage="$RUNNER_TEMP/andromeda-local-db-runtime"
          mkdir -p "$stage/app" "$stage/v2" "$stage/scripts/ops"
          cp -a app/integrations "$stage/app/"
          cp package/app/integrations/andromeda-package-capture.php              package/app/integrations/andromeda-selected-offer.php              "$stage/app/integrations/"
          cp v2/api-anex-search3-preview.php v2/api-andromeda-search3-preview.php "$stage/v2/"
          cp -a release-data/v2/data "$stage/v2/"
          cp scripts/ops/andromeda_local_offer_collect.php              scripts/ops/int_andromeda_local_db_seed.php              "$stage/scripts/ops/"
          tar -C "$stage" -czf "$RUNNER_TEMP/andromeda-local-db-runtime.tar.gz" .

      - name: Execute exactly one private Andromeda v10 operation
        shell: bash
        run: |
          set -euo pipefail
          opts=(-T -i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          scp_opts=(-i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes             -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"

          scp "${scp_opts[@]}" "$RUNNER_TEMP/andromeda-local-db-runtime.tar.gz" "$remote:$archive"
          set +e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" "$BASE_SHA" <<'REMOTE'
          set -euo pipefail
          operation="$1"; archive="$2"; source="$3"
          site="$HOME/www/anytoour.ru"
          private="$HOME/.anytoour-andromeda"
          ledger="$HOME/.anytour-ops/$operation"

          test -d "$site"
          test -s "$site/config.php"
          test -s "$private/search3-preview.php"
          test -d "$private/searches"
          test ! -e "$ledger"

          mkdir -p "$HOME/.anytour-ops"
          mkdir -m 700 "$ledger"
          printf '%s\n' reserved > "$ledger/state"

          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"
          trap 'rm -rf "$work"; rm -f "$archive"' EXIT
          tar -C "$work" -xzf "$archive"

          set +e
          php "$work/scripts/ops/int_andromeda_local_db_seed.php" "$site" "$source"             > "$ledger/receipt.json" 2> "$ledger/error.log"
          rc=$?
          set -e

          test -s "$ledger/receipt.json"
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' failed_terminal_no_replay > "$ledger/state"
            exit "$rc"
          fi

          php -r '
            $x=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR);
            if(($x["status"]??null)!=="completed"
              ||($x["delta"]["andromeda_offers"]??0)<1
              ||($x["delta"]["andromeda_active"]??0)<1
              ||($x["delta"]["andromeda_ready"]??0)<1
              ||($x["collector"]["ready_offer_count"]??0)<1
              ||($x["collector"]["autosave_published"]??false)!==true) exit(2);
          ' "$ledger/receipt.json"

          printf '%s\n' completed > "$ledger/state"
          REMOTE
          rc=$?
          set -e

          ssh "${opts[@]}" "$remote" "cat \"\$HOME/.anytour-ops/$OPERATION_ID/receipt.json\""             > "$RUNNER_TEMP/receipt.json" || true
          test -s "$RUNNER_TEMP/receipt.json"
          cat "$RUNNER_TEMP/receipt.json"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Preserve sanitized Andromeda v10 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-andromeda-local-db-v10-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
