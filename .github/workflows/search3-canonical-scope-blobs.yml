name: Retain exact PR2660 scope correction
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/search3-canonical-scope-blobs.yml']
permissions:
  contents: read
jobs:
  retain:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.number == 2660 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/search3-current-owner-pass-20260916' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: be2d2f3f7ae05d10deba07b2ab9363ef612ebd59
          persist-credentials: false
      - name: Store only the exact two inert frontend objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request
          def sha(data): return hashlib.sha256(data).hexdigest()
          def encode(data): return (json.dumps(data,ensure_ascii=False,separators=(',',':'))+'\n').encode()
          raw=pathlib.Path('v2/results-renderer-v5.js').read_bytes()
          packed=pathlib.Path('v2/search3-shared-runtime.json').read_bytes()
          assert sha(raw)=='a9d5a734750c62af5ff9ff06fa472ee9f43f3d93e9b46fd1b9f6af6b8066ca06'
          assert sha(packed)=='e2c779d127b35d5e6d11cba289aeefac47acedeedb839bc4742739d9357e526d'
          assert raw.count(b'const ownProfiles=/^')==1
          raw=raw.replace(b'const ownProfiles=/^',b'const ownProfiles=isSearch3()&&/^')
          data=json.loads(packed)
          assert encode(data)==packed and len(data['entries'])==17
          entry=data['entries']['results-renderer-v5.js']
          assert entry['code'].count('const g=/^')==1
          entry['code']=entry['code'].replace('const g=/^','const g=isSearch3()&&/^')
          entry['sourceSha256']=sha(raw); entry['codeSha256']=sha(entry['code'].encode())
          packed=encode(data)
          expected=[(raw,44399,'93e9f4075c6c586c78d1cfb4f9a4f27bb7f02d000e9bcdfea1e7e0b21ae91a5a','30d80ff71575a31cd5b7ea9e6bb29c5c8467cced'),(packed,148429,'74d378bfd7e58dd7e79ca5ccc0962aec4f3dbbcf11405fee50b440eff03abb5d','c6adc66fb9b70a74b0b4a3803a8ae9ce2f4a5ccb')]
          for value,size,digest,blob in expected:
              assert len(value)==size and sha(value)==digest
              assert hashlib.sha1(b'blob '+str(size).encode()+b'\0'+value).hexdigest()==blob
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): raise RuntimeError('No authenticated redirect')
          for value,size,digest,blob in expected:
              body=json.dumps({'encoding':'base64','content':base64.b64encode(value).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/pyatkoff/poisk-turov-test/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'AnyTour-PR2660-inert-source'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=30) as response:
                  assert response.status==201
                  assert json.load(response)['sha']==blob
              print(json.dumps({'status':'verified_source_blob_stored','sha':blob,'bytes':size,'branch_updates':0,'server_access':False}))
