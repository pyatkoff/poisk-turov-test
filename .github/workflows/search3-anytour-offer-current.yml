name: Search3 AnyTour offer store CURRENT read
on:
  pull_request:
    types: [opened]
    branches: [release/search3-production-ready-v1]
    paths:
      - 'scripts/catalog/anytour_offer_store_current.php'
      - 'tests/anytour_offer_store_current_test.php'
      - '.github/workflows/search3-anytour-offer-current.yml'
permissions:
  contents: read
concurrency:
  group: anytour-offer-store-current-2693-20260917-v1
  cancel-in-progress: false
jobs:
  checked-reader:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' && github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.head.ref == 'ops/local-2693-offer-store-current-20260917-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      head: ${{ github.event.pull_request.head.sha }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: anytour_offer_current_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Verify read-only collector against isolated MySQL before private access
        env:
          ANYTOUR_OFFER_CURRENT_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_offer_current_fixture;charset=utf8mb4'
          ANYTOUR_OFFER_CURRENT_TEST_PASSWORD: fixture-only-password
        run: |
          php -l scripts/catalog/anytour_offer_store_current.php
          php -l tests/anytour_offer_store_current_test.php
          php tests/anytour_offer_store_current_test.php
      - name: Retain exact source and reservation before SSH credentials
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,tarfile
          source='a3f7b3b0aad1b7bd82dd3116fbc3e619466dd4ff'
          op='anytour-offer-store-current-2693-20260917-v1'
          files=['v2/data/anytour-offer-store-v1.php','v2/data/migrations/20260916-anytour-offer-store.sql','v2/data/db-v1.php','scripts/catalog/anytour_offer_store_current.php']
          work=pathlib.Path('retained'); work.mkdir()
          for name in files[:3]:
              a=subprocess.check_output(['git','rev-parse','HEAD:'+name]).strip()
              b=subprocess.check_output(['git','rev-parse',source+':'+name]).strip()
              assert a==b, 'retained data contract changed: '+name
          payload={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files}
          with tarfile.open(work/'payload.tar.gz','w:gz') as t:
              for name in files:
                  data=pathlib.Path(name).read_bytes(); info=tarfile.TarInfo('payload/'+name)
                  info.size=len(data); info.mode=0o600; info.mtime=0
                  t.addfile(info,io.BytesIO(data))
          reservation={'operation':op,'dataSource':source,'executionSource':os.environ['EXACT_HEAD'],'run':int(os.environ['GITHUB_RUN_ID']),'attempt':1,'files':payload,'databaseWrites':0,'supplierCalls':0,'migrationAuthorized':False}
          (work/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          (work/'transport.sha256').write_text(''.join(hashlib.sha256((work/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in ['payload.tar.gz','reservation.json']))
          PY
      - id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-offer-current-reservation-${{ github.run_id }}
          path: retained/
          if-no-files-found: error
          retention-days: 30
  on-host-read:
    needs: checked-reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.checked-reader.outputs.artifact_id }}
          path: retained
          merge-multiple: true
      - name: Recheck fresh owner claim and exact Security result
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.checked-reader.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api repos/pyatkoff/poisk-turov-test/pulls/$PR_NUMBER --jq '.head.sha')" = "$HEAD_SHA"
          gh api repos/pyatkoff/poisk-turov-test/issues/comments/5707047965 > claim.json
          gh api repos/pyatkoff/poisk-turov-test/commits/$HEAD_SHA/check-runs > checks.json
          python3 - <<'PY'
          import datetime,json
          c=json.load(open('claim.json')); checks=json.load(open('checks.json'))['check_runs']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert 'anytour-offer-store-current-2693-20260917-v1' in c['body'] and 'READ ONLY' in c['body']
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(c['created_at'].replace('Z','+00:00'))
          assert 0<=age.total_seconds()<5400,'claim expired'
          assert any(x['name']=='guard' and x['conclusion']=='success' for x in checks),'exact Security not green'
          PY
          cd retained && sha256sum -c transport.sha256
      - name: Inspect existing AnyTour database through established SSH connection
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] && [[ "$REMOTE_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]
          mkdir -p evidence
          key="$RUNNER_TEMP/offer-current-key"; known="$RUNNER_TEMP/offer-current-known"
          trap 'rm -f "$key" "$known"' EXIT
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 -d > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          opts=(-i "$key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$REMOTE_USER@$HOST"; path='.anytour-operations/anytour-offer-store-current-2693-20260917-v1'
          ssh "${opts[@]}" "$remote" 'umask 077; test ! -L "$HOME/.anytour-operations"; mkdir -p "$HOME/.anytour-operations"; mkdir "$HOME/.anytour-operations/anytour-offer-store-current-2693-20260917-v1"'
          scp "${opts[@]}" retained/{reservation.json,transport.sha256,payload.tar.gz} "$remote:$path/"
          set +e
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          cd "$HOME/.anytour-operations/anytour-offer-store-current-2693-20260917-v1"
          sha256sum -c transport.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          r=json.load(open('reservation.json'))
          assert r['operation']=='anytour-offer-store-current-2693-20260917-v1' and r['attempt']==1
          assert r['dataSource']=='a3f7b3b0aad1b7bd82dd3116fbc3e619466dd4ff'
          assert r['databaseWrites']==0 and r['supplierCalls']==0 and r['migrationAuthorized'] is False
          with tarfile.open('payload.tar.gz','r:gz') as t:
              members=t.getmembers(); assert len(members)==len(r['files'])==4
              assert {m.name for m in members}=={'payload/'+n for n in r['files']}
              for m in members:
                  assert m.isfile() and 0<m.size<200000 and '..' not in pathlib.PurePosixPath(m.name).parts
                  data=t.extractfile(m).read(); assert hashlib.sha256(data).hexdigest()==r['files'][m.name[8:]]
                  p=pathlib.Path(m.name); p.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
                  with p.open('xb') as f: f.write(data)
          PY
          php -d display_errors=0 payload/scripts/catalog/anytour_offer_store_current.php
          sha256sum result.json > result.sha256
          REMOTE
          rc=$?
          scp "${opts[@]}" "$remote:$path/result.json" evidence/result.json; copied=$?
          scp "${opts[@]}" "$remote:$path/result.sha256" evidence/result.sha256; hashed=$?
          set -e
          cp retained/reservation.json evidence/reservation.json
          printf '{"ssh_exit":%s,"result_copy_exit":%s,"hash_copy_exit":%s,"noReplay":true}\n' "$rc" "$copied" "$hashed" > evidence/transport-result.json
          test "$rc" = 0 && test "$copied" = 0 && test "$hashed" = 0
          (cd evidence && sha256sum -c result.sha256)
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/result.json'))
          assert r['status']=='current_read_only' and r['databaseWrites']==0 and r['supplierCalls']==0
          safe={'status':r['status'],'schemaState':r['schemaState'],'offerStoreVersion':r['offerStoreVersion'],'canonical':r['canonical'],'overall':r['overall'],'providers':r['providers'],'refreshes':r['refreshes'],'scopeState':r['scopeState'],'integrity':r['integrity']}
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
      - name: Retain terminal CURRENT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-offer-current-result-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
