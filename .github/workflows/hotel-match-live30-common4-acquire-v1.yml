name: MATCH live30 COMMON4 acquire v1

'on':
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_live30_common4_plan_v1.php
      - scripts/diagnostics/hotel_match_live30_common4_acquire_v1.py
      - tests/hotel_match_live30_common4_acquire_v1_test.php
      - .github/workflows/hotel-match-live30-common4-acquire-v1.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate COMMON4 acquisition source
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live30_common4_plan_v1.php
          python3 -m py_compile scripts/diagnostics/hotel_match_live30_common4_acquire_v1.py
          php -l tests/hotel_match_live30_common4_acquire_v1_test.php
          php tests/hotel_match_live30_common4_acquire_v1_test.php
