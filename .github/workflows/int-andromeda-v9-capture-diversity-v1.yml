name: INT inspect sealed Andromeda v9 capture diversity
on:
  push:
    branches: ['ops/int-andromeda-v9-capture-diversity-20260918-v1']
    paths: ['.github/workflows/int-andromeda-v9-capture-diversity-v1.yml']
permissions: {contents: read}
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect retained v9 capture diversity only
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/result"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/ssh/key"; fi
          chmod 600 "$RUNNER_TEMP/ssh/key"; ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null "$REMOTE_USER@$HOST" 'php -d display_errors=0 -d log_errors=0' > "$RUNNER_TEMP/result/result.json" <<'PHP'
          <?php
          declare(strict_types=1);error_reporting(0);
          $read=static function(string $p):?array{if(is_link($p)||!is_file($p)||filesize($p)<2||filesize($p)>3000000)return null;try{$v=json_decode((string)file_get_contents($p),true,64,JSON_THROW_ON_ERROR);return is_array($v)?$v:null;}catch(Throwable){return null;}};
          $home=rtrim((string)getenv('HOME'),'/');$dir=$home.'/.anytoour-andromeda/searches';
          $first=null;foreach(new DirectoryIterator($dir) as $e){if($e->isDot()||$e->isLink()||!$e->isFile()||!preg_match('/\A([a-f0-9]{64})-1\.json\z/D',$e->getFilename(),$m))continue;$x=$read($e->getPathname());if(($x['generation']??null)!==17171829)continue;$st=$x['store']??null;if(!is_array($st)||!is_int($st['created_at']??null))continue;if($first===null||$st['created_at']>$first['created'])$first=['ref'=>$m[1],'created'=>$st['created_at']];}
          if($first===null)throw new RuntimeException('COHORT');
          $ref=$first['ref'];$created=$first['created'];$captured=[];
          $prefix=$ref.'-'.$created.'-';
          foreach(new DirectoryIterator($dir) as $e){if($e->isDot()||$e->isLink()||!$e->isFile())continue;$n=$e->getFilename();if(!str_starts_with($n,$prefix)||!str_ends_with($n,'-package.json'))continue;$x=$read($e->getPathname());$r=$x['record']??null;if(!is_array($r)||($r['status']??null)!=='captured')continue;$o=$r['context']['offer_ref']??null;if(is_string($o))$captured[$o]=true;}
          $meta=[];$pages=0;
          foreach(new DirectoryIterator($dir) as $e){if($e->isDot()||$e->isLink()||!$e->isFile())continue;$n=$e->getFilename();$page=null;if($n===$ref.'-1.json')$page=1;elseif(preg_match('/\A'.preg_quote($ref,'/').'-'.preg_quote((string)$created,'/').'-(\d+)\.json\z/D',$n,$m))$page=(int)$m[1];if($page===null)continue;$x=$read($e->getPathname());$offers=$x['store']['snapshot']['offers']??null;if(!is_array($offers))continue;++$pages;foreach($offers as $o){if(!is_array($o)||!isset($captured[$o['offer_ref']??'']))continue;$tc=$o['transport_context']??[];$meta[]=['program'=>is_string($tc['program_ref']??null)?$tc['program_ref']:null,'tour'=>is_string($tc['tour_ref']??null)?$tc['tour_ref']:null,'operator'=>(string)($o['operator_ref']??''),'departure'=>is_string($tc['departure_times_reported']??null)?$tc['departure_times_reported']:null];}}
          $distinct=static function(array $rows,string $k):int{$s=[];foreach($rows as $r){$v=$r[$k]??null;if($v!==null&&$v!=='')$s[hash('sha256',(string)$v)]=true;}return count($s);};
          $departurePresent=0;foreach($meta as $r)if(($r['departure']??null)!==null)++$departurePresent;
          echo json_encode(['schema_version'=>1,'source'=>'andromeda-v9-capture-diversity-v1','captured_records'=>count($captured),'matched_rows'=>count($meta),'distinct_programs'=>$distinct($meta,'program'),'distinct_tours'=>$distinct($meta,'tour'),'distinct_operators'=>$distinct($meta,'operator'),'departure_times_present'=>$departurePresent,'page_files'=>$pages,'supplier_calls'=>0,'db_reads'=>0,'db_writes'=>0,'filesystem_writes'=>0],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          PHP
          cat "$RUNNER_TEMP/result/result.json"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-andromeda-v9-capture-diversity-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 14
