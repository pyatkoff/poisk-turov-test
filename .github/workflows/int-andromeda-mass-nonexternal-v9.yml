name: INT Andromeda mass non-external local DB fill v9

on:
  push:
    branches: ['ops/int-andromeda-mass-nonexternal-20260918-v9']
    paths: ['.github/workflows/int-andromeda-mass-nonexternal-v9.yml']

permissions: {contents: read}
concurrency:
  group: int-andromeda-mass-nonexternal-1717-20260918-v9
  cancel-in-progress: false

jobs:
  fill:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 049f2f650b443a8dc404e518a32ef6b3d0242591
      RELEASE_DATA_SHA: a4c1568e38723c1b4c22809b0ebe5568e57f24b1
      OPERATION_ID: int-andromeda-mass-nonexternal-1717-20260918-v9
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ env.BASE_SHA }}', path: source, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {ref: '${{ env.RELEASE_DATA_SHA }}', path: release-data, persist-credentials: false}
      - name: Bind exact proven source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C release-data rev-parse HEAD)" = "$RELEASE_DATA_SHA"
          cd source
          php -l scripts/ops/andromeda_local_offer_collect.php >/dev/null
          php -l app/integrations/andromeda-local-offer-collector.php >/dev/null
          php -l app/integrations/andromeda-anytour-offer-autosave.php >/dev/null
          php tests/andromeda-local-offer-collector-test.php
          php tests/anytour-offer-snapshot-producer-test.php
          php tests/andromeda-saved-surcharge-runtime-smoke.php "$(pwd)" "$RUNNER_TEMP/andromeda-surcharge-smoke"
          test "$(git -C ../release-data hash-object v2/data/anytour-offer-snapshot-ingest-v1.php)" = '4b6b73c11a8de0401c05187982ba977e61a14354'
          test "$(git -C ../release-data hash-object v2/data/anytour-offer-store-v1.php)" = '75924744ff06124fcd2a62313ccad927a38e2f06'
          test "$(git -C ../release-data hash-object v2/data/anytour-offer-store-read-v2.php)" = 'f0df8ee685216a599e5b5680a4d78546b92e63cd'
      - name: Prepare private exact runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          stage="$RUNNER_TEMP/runtime"; mkdir -p "$stage/app" "$stage/v2" "$stage/scripts/ops"
          cp -a source/app/integrations "$stage/app/"
          cp source/v2/api-anex-search3-preview.php source/v2/api-andromeda-search3-preview.php "$stage/v2/"
          cp -a release-data/v2/data "$stage/v2/"
          cp source/scripts/ops/andromeda_local_offer_collect.php "$stage/scripts/ops/"
          tar -C "$stage" -czf "$RUNNER_TEMP/runtime.tar.gz" .
          ssh-keyscan -T 15 -t ed25519 "$ANYTOOUR_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
      - name: Execute one fresh non-external mass-fill
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          opts=(-T -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=50)
          scp_opts=(-i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"; archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"
          scp "${scp_opts[@]}" "$RUNNER_TEMP/runtime.tar.gz" "$remote:$archive"
          set +e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" "$BASE_SHA" <<'REMOTE'
          set -euo pipefail
          operation="$1"; archive="$2"; source="$3"; site="$HOME/www/anytoour.ru"; private="$HOME/.anytoour-andromeda"; ledger="$HOME/.anytour-ops/$operation"
          test -d "$site"; test -s "$site/config.php"; test -s "$private/search3-preview.php"; test -d "$private/searches"; test ! -e "$ledger"
          mkdir -p "$HOME/.anytour-ops"; mkdir -m 700 "$ledger"; printf '%s\n' reserved > "$ledger/state"
          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"; trap 'rm -rf "$work"; rm -f "$archive"' EXIT; tar -C "$work" -xzf "$archive"
          snapshot(){ php -d display_errors=0 <<'PHP'
          <?php declare(strict_types=1);error_reporting(0);$root=rtrim((string)getenv('HOME'),'/').'/www/anytoour.ru';require_once $root.'/config.php';require_once (is_file($root.'/data/db-v1.php')?$root.'/data/db-v1.php':$root.'/v2/data/db-v1.php');$db=v2_data_db();$db->exec('START TRANSACTION READ ONLY');$c=static fn(string $s):int=>(int)$db->query($s)->fetchColumn();echo json_encode(['rows'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda'"),'active'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda' AND is_active=1"),'ready'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda' AND final_price_ready=1"),'verified'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda' AND final_price_verified=1"),'active_verified'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda' AND is_active=1 AND final_price_verified=1"),'active_verified_state'=>$c("SELECT COUNT(*) FROM anytour_offers WHERE provider='andromeda' AND is_active=1 AND final_price_verified=1 AND JSON_VALID(payload_json)=1 AND JSON_UNQUOTE(JSON_EXTRACT(payload_json,'$.listingPriceState'))='final_verified'"),'all_offers'=>$c('SELECT COUNT(*) FROM anytour_offers')],JSON_THROW_ON_ERROR);$db->rollBack();
          PHP
          }
          snapshot > "$ledger/before.json"
          set +e
          php "$work/scripts/ops/andromeda_local_offer_collect.php" --site-root="$site" --private-config="$private/search3-preview.php" --source-sha="$source" --departure=1 --country=4 --date-from=2026-10-31 --date-to=2026-10-31 --nights=7 --adults=2 --meal=7 --generation=17171843 --max-captures=150 --max-capture-seconds=210 --capture-mode=non_external_only > "$ledger/collector.json" 2> "$ledger/error.log"
          rc=$?; set -e
          snapshot > "$ledger/after.json"
          RC="$rc" php -r '$b=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR);$a=json_decode(file_get_contents($argv[2]),true,32,JSON_THROW_ON_ERROR);$c=null;try{$c=json_decode(file_get_contents($argv[3]),true,64,JSON_THROW_ON_ERROR);}catch(Throwable $e){}$d=[];foreach($b as $k=>$v)$d[$k]=$a[$k]-$v;$o=["status"=>(int)getenv("RC")===0?"completed":"failed_terminal_no_replay","provider"=>"andromeda","scope"=>["departure_id"=>1,"country_id"=>4,"date"=>"2026-10-31","nights"=>7,"adults"=>2,"meal"=>"7","capture_mode"=>"non_external_only","max_captures"=>150,"max_capture_seconds"=>210],"before"=>$b,"after"=>$a,"delta"=>$d,"collector"=>$c,"booking_calls"=>0,"lead_calls"=>0,"mapping_writes"=>0,"search3_publication"=>0,"replay_allowed"=>false];file_put_contents($argv[4],json_encode($o,JSON_UNESCAPED_SLASHES).PHP_EOL);' "$ledger/before.json" "$ledger/after.json" "$ledger/collector.json" "$ledger/receipt.json"
          printf '%s\n' "$([ "$rc" -eq 0 ] && echo completed || echo failed_terminal_no_replay)" > "$ledger/state"; exit "$rc"
          REMOTE
          rc=$?; set -e
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/.anytour-ops/$OPERATION_ID/receipt.json\"" > "$RUNNER_TEMP/result/receipt.json" || true
          test -s "$RUNNER_TEMP/result/receipt.json"; cat "$RUNNER_TEMP/result/receipt.json"; test "$rc" = 0
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/result/receipt.json'))
          assert d['status']=='completed' and d['provider']=='andromeda' and d['replay_allowed'] is False and d['search3_publication']==0
          assert d['delta']['rows']>0 and d['delta']['active']>0 and d['delta']['ready']>0 and d['delta']['verified']>0,d
          assert d['after']['active_verified']==d['after']['active_verified_state'] and d['after']['active_verified']>0,d
          print(json.dumps({'rows_delta':d['delta']['rows'],'active_delta':d['delta']['active'],'verified_delta':d['delta']['verified'],'active_verified':d['after']['active_verified'],'capture_attempts':(d.get('collector') or {}).get('capture_attempts'),'surcharge_ready':(d.get('collector') or {}).get('surcharge_ready'),'capture_time_budget_reached':(d.get('collector') or {}).get('capture_time_budget_reached')},sort_keys=True))
          PY
      - name: Preserve sanitized v9 receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: int-andromeda-mass-nonexternal-v9-${{ github.run_id }}
          path: ${{ runner.temp }}/result/receipt.json
          if-no-files-found: warn
          retention-days: 30
