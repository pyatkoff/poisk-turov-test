name: Validate mobile sticky boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/mobile-search-summary-v1.js'
      - 'v2/mobile-search-summary-v1.css'
      - '.github/workflows/validate-mobile-sticky-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sticky-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify sticky CTA stops at form boundary
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > mobile-sticky-boundary.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          const root=path.resolve('v2'),url=process.env.V2_URL;
          const assetRe=/\/poisk-turov-test\/v2\/([^/?]+\.(?:js|css))(?:\?.*)?$/i;
          const viewports=[['mobile-375',375,812],['mobile-430',430,932]];
          const visible=el=>!!el&&!el.hidden&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden';
          (async()=>{
            const browser=await chromium.launch({headless:true});let failed=false;
            for(const [name,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',route=>{const match=new URL(route.request().url()).pathname.match(assetRe);if(!match)return route.continue();const file=path.join(root,path.basename(match[1]));if(!fs.existsSync(file))return route.continue();return route.fulfill({status:200,contentType:path.extname(file)==='.css'?'text/css':'application/javascript',body:fs.readFileSync(file)});});
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(4500);
              const state=()=>page.evaluate(()=>{const source=document.querySelector('.search-submit'),sticky=document.querySelector('.mobile-search-sticky'),sentinel=document.querySelector('.mobile-search-submit-sentinel');const isVisible=el=>!!el&&!el.hidden&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden';return{sticky:isVisible(sticky),inline:isVisible(source),sentinel:!!sentinel,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2,scrollY:scrollY};});
              const initial=await state();
              await page.evaluate(()=>document.querySelector('.mobile-search-submit-sentinel')?.scrollIntoView({block:'center'}));await page.waitForTimeout(250);const atBoundary=await state();
              await page.evaluate(()=>{const trust=document.getElementById('v2AgencyTrust');if(trust)trust.scrollIntoView({block:'start'});else scrollTo(0,document.documentElement.scrollHeight);});await page.waitForTimeout(250);const belowForm=await state();
              const bad=(response?.status()||0)!==200||errors.length||!initial.sentinel||initial.overflow||(!initial.sticky&&!initial.inline)||atBoundary.sticky||!atBoundary.inline||belowForm.sticky;
              console.log('MOBILE_STICKY_BOUNDARY',name,JSON.stringify({initial,atBoundary,belowForm,errors}));if(bad)failed=true;await context.close();
            }
            await browser.close();if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node mobile-sticky-boundary.cjs
