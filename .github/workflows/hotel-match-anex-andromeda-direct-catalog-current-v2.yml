name: MATCH direct ANEX-Andromeda catalog CURRENT v2
run-name: MATCH direct ANEX-Andromeda catalog CURRENT v2 #1971

on:
  push:
    branches:
      - ops/match-residual-ensemble-current-1971-v2
    paths:
      - .github/match-anex-andromeda-direct-catalog-review-1971-20260912-v2.arm

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: match-anex-andromeda-direct-catalog-current-v2
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-anex-andromeda-direct-catalog-review-1971-20260912-v2
  OUT_DIR: /tmp/match-anex-andromeda-direct-catalog-current-v2

jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false

      - name: Validate supplier-free reviewed source and build runtime copy
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-andromeda-direct-catalog-review-1971-20260912-v2.arm)" = "$OPERATION_ID"
          mkdir -p "$OUT_DIR/package"
          files=(
            hotel_full_catalog_reconcile.php
            hotel_match_current_bulk_review.php
            hotel_match_global_cross_provider_rescue.php
            hotel_match_global_tourvisor_rescue.php
            hotel_match_global_approx_name_rescue.php
            hotel_match_anex_andromeda_direct_catalog_review.php
          )
          for f in "${files[@]}"; do
            php -l "scripts/diagnostics/$f"
            cp "scripts/diagnostics/$f" "$OUT_DIR/package/$f"
          done
          ! grep -Fq 'v2_data_tv_get' scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php
          ! grep -Fq 'AnyTourAnexClient' scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]+' scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php
          grep -Fq 'START TRANSACTION READ ONLY' scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR'])/'package'
          p=root/'hotel_match_anex_andromeda_direct_catalog_review.php'
          s=p.read_text()
          old="const HMADCR_OPERATION = 'hotel-match-anex-andromeda-direct-catalog-review-1971-20260911-v1';"
          new=f"const HMADCR_OPERATION = '{os.environ['OPERATION_ID']}';"
          if s.count(old)!=1: raise SystemExit('operation_constant_not_unique')
          p.write_text(s.replace(old,new))
          p=root/'hotel_match_global_cross_provider_rescue.php'; s=p.read_text()
          old="foreach(array_keys($places) as $p){if(strlen($p)<4)continue;"
          new="foreach(array_keys($places) as $p){$p=(string)$p;if(strlen($p)<4)continue;"
          if s.count(old)!=1: raise SystemExit('numeric_place_fix_target_not_unique')
          p.write_text(s.replace(old,new))
          PY
          for f in "$OUT_DIR"/package/*.php; do php -l "$f"; done
          (cd "$OUT_DIR/package" && php -r 'define("FC_LIBRARY_ONLY",true); require "hotel_match_global_cross_provider_rescue.php"; if(!hmgcr_place_like("1235",[1234=>true])) exit(2); echo "NUMERIC_PLACE_OK\n";')

      - name: Persist immutable reservation before CURRENT DB read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); pkg=root/'package'
          r={
            'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_read','run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],
            'mode':'entire_current_core8_direct_anex_andromeda_catalog_read_only',
            'algorithm_sha256':hashlib.sha256((pkg/'hotel_match_anex_andromeda_direct_catalog_review.php').read_bytes()).hexdigest(),
            'runtime_numeric_place_fix':True,'database_writes':0,'mapping_writes':0,'anex_calls':0,'andromeda_calls':0,
            'tourvisor_calls':0,'tv_search_slices':0,'tv_http_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (root/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: match-anex-andromeda-direct-catalog-current-v2-reservation
          path: ${{ env.OUT_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Establish resilient SSH master and upload runtime package
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/hmadcr2-key"; sock="$RUNNER_TEMP/hmadcr2.sock"; known="$RUNNER_TEMP/hmadcr2-known"; remote="/tmp/hmadcr2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          connect_master(){ rm -f "$sock"; ssh -M -S "$sock" -fnNT -o ControlPersist=1200 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$USER_VALUE@$HOST_VALUE"; }
          ok=0; for attempt in 1 2 3 4 5; do if connect_master; then ok=1; break; fi; sleep $((attempt*4)); done; test "$ok" = 1
          ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -s config.php && { test -s data/db-v1.php || test -s v2/data/db-v1.php; } && printf HMADCR2_PREFLIGHT_OK' | grep -qx HMADCR2_PREFLIGHT_OK
          tar -C "$OUT_DIR/package" -czf - . | ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote' && mkdir -m 700 '$remote' && tar -xzf - -C '$remote'"
          printf '%s\n' "$key" > "$RUNNER_TEMP/hmadcr2-keypath"; printf '%s\n' "$sock" > "$RUNNER_TEMP/hmadcr2-sockpath"; printf '%s\n' "$known" > "$RUNNER_TEMP/hmadcr2-knownpath"; printf '%s\n' "$remote" > "$RUNNER_TEMP/hmadcr2-remotepath"

      - name: Execute one-shot entire CURRENT direct supplier graph review
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$(cat "$RUNNER_TEMP/hmadcr2-keypath")"; sock="$(cat "$RUNNER_TEMP/hmadcr2-sockpath")"; known="$(cat "$RUNNER_TEMP/hmadcr2-knownpath")"; remote="$(cat "$RUNNER_TEMP/hmadcr2-remotepath")"
          cleanup(){ ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote'" >/dev/null 2>&1 || true; ssh -S "$sock" -O exit "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1 || true; }; trap cleanup EXIT
          if ! ssh -S "$sock" -O check "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1; then
            rm -f "$sock"; ok=0; for attempt in 1 2 3 4 5; do if ssh -M -S "$sock" -fnNT -o ControlPersist=1200 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$USER_VALUE@$HOST_VALUE"; then ok=1; break; fi; sleep $((attempt*4)); done; test "$ok" = 1
          fi
          set +e
          ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" "cd \"\$HOME/www/anytoour.ru\" && php -d display_errors=0 -d log_errors=1 -d memory_limit=2048M -r 'define(\"FC_LIBRARY_ONLY\",true); \$root=realpath(getcwd()); require \$root.\"/config.php\"; require is_file(\$root.\"/data/db-v1.php\")?\$root.\"/data/db-v1.php\":\$root.\"/v2/data/db-v1.php\"; require \"$remote/hotel_match_anex_andromeda_direct_catalog_review.php\"; \$db=v2_data_db(); echo \"HMADCR2_JSON:\".fc_json(hmadcr_review(\$db,\"$OPERATION_ID\")).PHP_EOL;'" > "$OUT_DIR/live.stdout" 2> "$OUT_DIR/live.stderr"
          rc=$?; set -e; export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['OUT_DIR']); out=(root/'live.stdout').read_text(errors='replace'); err=(root/'live.stderr').read_text(errors='replace'); marker='HMADCR2_JSON:'
          line=next((x[len(marker):] for x in reversed(out.splitlines()) if x.startswith(marker)),None)
          if line is None:
              result={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stdout_sha256':hashlib.sha256(out.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),'stderr_tail':err[-3000:],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          else: result=json.loads(line)
          result['source_sha']=os.environ['GITHUB_SHA']; result['run_id']=int(os.environ['GITHUB_RUN_ID']); result['remote_exit']=int(os.environ['RC']); result['no_replay']=True
          for k,v in {'database_writes':0,'mapping_writes':0,'supplier_calls':0}.items():
              if result.get(k)!=v: raise SystemExit(f'nonzero_or_missing_{k}')
          raw=(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); (root/'result.json').write_bytes(raw)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if result.get('status')=='completed' and int(os.environ['RC'])==0 else 'unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'tv_search_slices':0,'tv_http_calls':0,'no_replay':True,'counts':result.get('counts'),'coverage':result.get('coverage')}
          (root/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          if result.get('status')=='completed':
              c=result.get('counts',{}); cov=result.get('coverage',{})
              summary=(f"MATCH #1971 CURRENT direct ANEX↔Andromeda catalog `{result['operation_id']}` completed read-only / NO-REPLAY. Full CURRENT counts {json.dumps(c,ensure_ascii=False,sort_keys=True)}. Coverage {json.dumps(cov,ensure_ascii=False,sort_keys=True)}. ANEX/Andromeda/Tourvisor calls 0; tv_search_slices 0; tv_http_calls 0; DB/mapping writes 0. Artifact follows.")
          else: summary=f"MATCH #1971 CURRENT direct ANEX↔Andromeda catalog `{result.get('operation_id')}` is UNKNOWN / NO-REPLAY: `{result.get('reason')}`; read receipt before successor."
          (root/'summary.md').write_text(summary+'\n'); print(summary)
          if receipt['state']!='completed_read_only': raise SystemExit(2)
          PY

      - name: Preserve immutable final result and receipt
        if: always()
        id: final_artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-anex-andromeda-direct-catalog-current-v2-final
          path: |
            ${{ env.OUT_DIR }}/reservation.json
            ${{ env.OUT_DIR }}/result.json
            ${{ env.OUT_DIR }}/receipt.json
            ${{ env.OUT_DIR }}/live.stderr
            ${{ env.OUT_DIR }}/summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Record MATCH result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.final_artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$OUT_DIR/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT_DIR/summary.md"
