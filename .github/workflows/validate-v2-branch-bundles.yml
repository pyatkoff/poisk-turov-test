name: Validate V2 branch bundles

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '!v2/data/**'
      - '.github/workflows/validate-v2-branch-bundles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build ordered local bundles
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "v2/bundle-manifest-v1.php"; foreach(v2_bundle_manifest()["css"] as $f){readfile("v2/".$f); echo "\n";}' > "$RUNNER_TEMP/v2-branch.css"
          php -r 'require "v2/bundle-manifest-v1.php"; foreach(v2_bundle_manifest()["js"] as $f){readfile("v2/".$f); echo "\n";}' > "$RUNNER_TEMP/v2-branch.js"
          test -s "$RUNNER_TEMP/v2-branch.css"
          test -s "$RUNNER_TEMP/v2-branch.js"
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise production shell with PR bundles
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-v2-branch-bundles.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const css=fs.readFileSync(process.env.RUNNER_TEMP+'/v2-branch.css');
          const js=fs.readFileSync(process.env.RUNNER_TEMP+'/v2-branch.js');
          const fixture=[
            {id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,country:{name:'Турция'},region:{name:'Анталья'},subRegion:{name:'Лара'},tours:[{id:'a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'},roomType:'Standard',placement:'DBL'}]},
            {id:902,name:'AnyTour Garden Hotel',category:4,rating:4.4,seaDistance:650,price:98000,country:{name:'Турция'},region:{name:'Аланья'},tours:[{id:'b',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'},roomType:'Family',placement:'2ADL'}]}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['tablet',768,1024],['intermediate',1024,900],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              let cssHits=0,jsHits=0;
              await page.route('**/poisk-turov-test/v2/bundle-v1.php?**',async route=>{
                const type=new URL(route.request().url()).searchParams.get('type');
                if(type==='css'){cssHits++;return route.fulfill({status:200,contentType:'text/css; charset=utf-8',body:css});}
                if(type==='js'){jsHits++;return route.fulfill({status:200,contentType:'application/javascript; charset=utf-8',body:js});}
                return route.continue();
              });
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3200);
              if((response&&response.status())!==200)throw new Error(name+': shell HTTP '+(response&&response.status()));
              if(cssHits!==1||jsHits!==1)throw new Error(name+': local bundle interception failed css='+cssHits+' js='+jsHits);
              let state=await page.evaluate(()=>{const submit=document.querySelector('.search-submit'),submitStyle=submit?getComputedStyle(submit):null;return{runtime:!!window.V2Runtime,results:!!window.V2Results,search:!!document.getElementById('tourSearch'),hero:!!document.querySelector('.v2-product-hero'),searchSubmit:!!submit,searchSubmitBg:submitStyle?submitStyle.backgroundColor:'',searchSubmitShadow:submitStyle?submitStyle.boxShadow:'',overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};});
              const coherentSearchCta=state.searchSubmit&&state.searchSubmitBg==='rgb(216, 61, 0)'&&state.searchSubmitShadow.includes('216, 61, 0')&&!state.searchSubmitShadow.includes('255, 81, 12');
              if(!state.runtime||!state.results||!state.search||!state.hero||!coherentSearchCta||state.overflow)throw new Error(name+': initial branch bundle state '+JSON.stringify(state));
              await page.evaluate(rows=>window.V2Results.render(rows),fixture);
              await page.waitForTimeout(120);
              state=await page.evaluate(()=>({cards:document.querySelectorAll('#results .hotel-card').length,direct:document.querySelectorAll('#results .direct-tour').length,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,wide:Array.from(document.querySelectorAll('body *')).map(el=>{const r=el.getBoundingClientRect();return{tag:el.tagName,cls:String(el.className||'').slice(0,120),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)}}).filter(x=>x.width>0&&(x.right>innerWidth+2||x.left<-2)).slice(0,12)}));
              if(state.cards!==2||state.direct<2||state.overflow)throw new Error(name+': results branch bundle state '+JSON.stringify(state));
              await page.evaluate(()=>{
                const selected=document.getElementById('selectedTour');
                selected.hidden=false;
                selected.innerHTML='<div class="selected-head"><div><h2>AnyTour Coast Resort</h2></div><div class="selected-price">125 000 ₽</div></div><div class="facts"><div><span>Вылет</span><b>Москва</b></div><div><span>Дата</span><b>10.09.2026</b></div><div><span>Ночей</span><b>7</b></div><div><span>Туристы</span><b>2 взр.</b></div><div><span>Питание</span><b>Все включено</b></div></div>';
                window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour:{id:'decision-fixture',hotel:{name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120},meal:{name:'Все включено'},roomType:'Deluxe Sea View'}}}));
              });
              await page.waitForTimeout(80);
              state=await page.evaluate(()=>({summary:!!document.querySelector('#selectedTour .selected-choice-summary'),summaryItems:document.querySelectorAll('#selectedTour .selected-choice-summary-item').length,summaryText:String(document.querySelector('#selectedTour .selected-choice-summary')?.textContent||''),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(!state.summary||state.summaryItems<4||!state.summaryText.includes('Рейтинг')||!state.summaryText.includes('До моря')||state.overflow)throw new Error(name+': selected decision summary state '+JSON.stringify(state));
              if(errors.length)throw new Error(name+': page errors '+errors.join(' | '));
              console.log('BRANCH_BUNDLES_OK',name,'selectedSummaryItems='+state.summaryItems);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-v2-branch-bundles.cjs
