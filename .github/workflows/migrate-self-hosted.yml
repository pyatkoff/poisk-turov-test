name: Migrate workflows to self-hosted runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-self-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SELF_HOSTED_GH_TOKEN }}

      - name: Move all workflows to self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo "migration-trigger=v5"
          changed=0
          while IFS= read -r -d '' file; do
            if grep -qE '^([[:space:]]*)runs-on:[[:space:]]*ubuntu-latest[[:space:]]*$' "$file"; then
              sed -i -E 's/^([[:space:]]*)runs-on:[[:space:]]*ubuntu-latest[[:space:]]*$/\1runs-on: [self-hosted, Linux, X64]/' "$file"
              echo "migrated: $file"
              changed=1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          if [[ "$changed" -eq 0 ]]; then
            echo "No ubuntu-latest workflow jobs left"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "ci: run all workflows on self-hosted runner"
          git push
