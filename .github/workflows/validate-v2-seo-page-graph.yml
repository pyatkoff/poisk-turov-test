name: Validate V2 SEO page graph

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-page-registry-v1.php'
      - 'v2/seo-page-graph-v1.php'
      - 'v2/seo-page-types-v1.php'
      - '.github/workflows/validate-v2-seo-page-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  page-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate registered relationship graph
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-page-graph-v1.php
          php <<'PHP'
          <?php
          require 'v2/seo-page-graph-v1.php';
          function fail($m){fwrite(STDERR,"SEO_GRAPH_FAIL:$m\n"); exit(1);}

          $registry=v2_seo_page_registry([
              ['path'=>'/country/turkey/','type'=>'country','data'=>[
                  'name'=>'Турция','h1'=>'Туры в Турцию','description'=>'Редакционная страница о турах в Турцию для проверки SEO-графа AnyTour.'
              ]],
              ['path'=>'/resort/antalya/','type'=>'resort','data'=>[
                  'name'=>'Анталья','h1'=>'Туры в Анталью','description'=>'Редакционная страница о турах в Анталью для проверки SEO-графа AnyTour.'
              ]],
              ['path'=>'/resort/alanya/','type'=>'resort','data'=>[
                  'name'=>'Аланья','h1'=>'Туры в Аланью','description'=>'Редакционная страница о турах в Аланью для проверки SEO-графа AnyTour.'
              ]],
          ]);

          $graph=v2_seo_page_graph($registry,[
              '/resort/antalya/'=>['parent'=>'/country/turkey/','related'=>['/resort/alanya/','/resort/alanya/','/resort/antalya/']],
              '/resort/alanya/'=>['parent'=>'/country/turkey/','related'=>['/resort/antalya/']],
          ]);
          if (($graph['/resort/antalya/']['parent']??null)!=='/country/turkey/') fail('parent');
          if (($graph['/resort/antalya/']['related']??[])!==['/resort/alanya/']) fail('related_dedupe');
          $group=v2_seo_graph_link_group($registry,$graph,'/resort/antalya/','Другие курорты Турции');
          if (($group['links'][0]['label']??'')!=='Аланья' || ($group['links'][0]['href']??'')!=='/resort/alanya/') fail('link_group');

          try { v2_seo_page_graph($registry,['/resort/unknown/'=>[]]); fail('unregistered_source_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_page_graph($registry,['/resort/antalya/'=>['parent'=>'/country/unknown/']]); fail('unregistered_parent_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_page_graph($registry,['/resort/antalya/'=>['related'=>['/resort/unknown/']]]); fail('unregistered_related_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_page_graph($registry,[
              '/country/turkey/'=>['parent'=>'/resort/antalya/'],
              '/resort/antalya/'=>['parent'=>'/country/turkey/'],
          ]); fail('cycle_allowed'); }
          catch (InvalidArgumentException $e) {}

          echo "V2_SEO_PAGE_GRAPH_OK registeredOnly=1 parents=1 related=1 cyclesRejected=1\n";
          PHP
