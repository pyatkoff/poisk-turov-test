name: MATCH append verified provider328 identities
'on':
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_v9_provider328_write_v1.php
      - .github/workflows/hotel-match-v9-provider328-write-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-v9-provider328-write-1971-20260921-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-v9-provider328-write-1971-20260921-v1
  BASE_SHA: 2321db22b5dede7f1cb9b6d5dc9a098521ed86f6
  SCRIPT_PATH: scripts/diagnostics/hotel_match_v9_provider328_write_v1.php
  WORKFLOW_PATH: .github/workflows/hotel-match-v9-provider328-write-v1.yml
  RESOLVER_PATH: app/integrations/andromeda-hotel-resolver.php
  SCRIPT_SHA256: 00d706cc71c01017dd427bf88d503dc58cb3829545fda125a24c7acac339994a
  RESOLVER_SHA256: 805ad9509de681c95a18ee7f96ae8e1b77d1eb2b29221e35e2d38ce9b6f52754
  CLAIM: '5761467504'
  CLAIM_SHA256: d96d6dd8225ae4f14ffa92c95b94c3a7881815996c0111e715e23bf5a1fa51d6
jobs:
  write:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and authorized insert scope
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert actual=={os.environ['SCRIPT_PATH'],os.environ['WORKFLOW_PATH']}
          for path,key in [('SCRIPT_PATH','SCRIPT_SHA256'),('RESOLVER_PATH','RESOLVER_SHA256')]:
              assert hashlib.sha256(pathlib.Path(os.environ[path]).read_bytes()).hexdigest()==os.environ[key]
          assert ("const OP = '"+os.environ['OPERATION_ID']+"';") in pathlib.Path(os.environ['SCRIPT_PATH']).read_text()
          PY
          php -l "$SCRIPT_PATH"; php "$SCRIPT_PATH" --self-test; php -l "$RESOLVER_PATH"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import hashlib,json,os
          c=json.load(open('input/claim.json'))
          assert c['id']==int(os.environ['CLAIM']) and c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert c['issue_url']=='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/2530'
          assert hashlib.sha256(c['body'].encode()).hexdigest()==os.environ['CLAIM_SHA256']
          for text in [os.environ['OPERATION_ID'],os.environ['BASE_SHA'],os.environ['SCRIPT_PATH'],os.environ['WORKFLOW_PATH'],'set328 edges/261 hotels','at least100','HTTP0','No takeover']:
              assert text in c['body'],text
          PY
      - name: Verify immutable acquisition and no-overlap inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,zipfile
          specs=[{'artifact': '10634643226', 'zip_sha256': '0a4337d6a00f668b643b8babb14867e3cae5189bbb881c724c24e5b74e7baaf0', 'files': [{'member': 'reconciliation.json', 'out': 'v9.json', 'sha256': '0995ccbd0c14639a335a644748d6dc5af6b359345328698ea3c0fc1300d88814', 'operation': 'hotel-match-v9-reconcile-1971-20260921-v1', 'state': 'completed_read_only_reconciliation'}]}, {'artifact': '10635515907', 'zip_sha256': 'ecb6c14ecfcb97c7a8c6b10076d1ecbc5e91c191578d4d9c54111a7f3f0b6fb9', 'files': [{'member': 'result.json', 'out': 'reserved178.json', 'sha256': '8cb977214acf20bd93226103d752119d0615bb49692aa95191ede30bec4a0d1d', 'operation': 'hotel-match-v9-provider178-precommit-audit-1971-20260921-v1', 'state': 'completed_read_only'}]}, {'artifact': '10634204615', 'zip_sha256': '0a115458ac2fb4608bc62b835fefada979a246a9d891ce96ed4ef725c6dd3d2a', 'files': [{'member': 'result.json', 'out': 'chunk1.json', 'sha256': '488b3b9c28cb6f6fd429a6a1925e86217b90022d9372b142ba6e3981c77bc351', 'operation': 'hotel-match-v9-single-native-samo-chunk1-1971-20260921-v1', 'state': 'completed_read_only'}]}, {'artifact': '10634724683', 'zip_sha256': '5a19a8c11ddc05f6cbb1af6b17c4ac8b4b09d378100d0b31528ab96e9d9ccef9', 'files': [{'member': 'result.json', 'out': 'chunk2.json', 'sha256': '3e5893d0e8580f3060cd1e8d947b1fa10e99d1e1f6a2398a6dc8617121ac1ba2', 'operation': 'hotel-match-v9-single-native-samo-chunk2-1971-20260921-v1', 'state': 'completed_read_only'}]}, {'artifact': '10636707434', 'zip_sha256': '4a77c1309d13ada9be2bb26531118139300f9ea0b46baa82604916b90ff9903f', 'files': [{'member': 'result.json', 'out': 'chunk3.json', 'sha256': '26c42c8910a396deb1359cd29998a827d165fb7c16329e862edbfcd6bad8cf44', 'operation': 'hotel-match-v9-single-native-samo-chunk3-1971-20260921-v2', 'state': 'completed_read_only'}]}, {'artifact': '10640731017', 'zip_sha256': '603554ca3dc93681021cd4ec163fbe870e50f2c76dd18a3513055f05b99c515a', 'files': [{'member': 'result.json', 'out': 'chunk4.json', 'sha256': '6ddedb9545a2715f34f7994f201e35336665cf0ee3c3a0500bd77949c1de2d70', 'operation': 'hotel-match-v9-single-native-samo-chunk4-1971-20260921-v5', 'state': 'completed_read_only'}]}, {'artifact': '10640989561', 'zip_sha256': '3e26d36acc5a1d0185e61ff478e78f3ce25d55afd127e14b263ad3b05ac7bcba', 'files': [{'member': 'chunk5/result.json', 'out': 'chunk5.json', 'sha256': '68f8ac7bee97072a2fc3bb375e333f210242225dde3c87521cfc35e84d53cca0', 'operation': 'hotel-match-v9-single-native-samo-chunk5-1971-20260921-v1', 'state': 'completed_read_only'}, {'member': 'chunk6/result.json', 'out': 'chunk6.json', 'sha256': 'f7d9ede056a41c9c8e32f3237e505b4cc203101477c4d812ca8cfb194ac7c9a4', 'operation': 'hotel-match-v9-single-native-samo-chunk6-1971-20260921-v1', 'state': 'completed_read_only'}, {'member': 'chunk7/result.json', 'out': 'chunk7.json', 'sha256': '7961ed6cf57a6740f70c4236481624b07f98cc056fc90c407966ec12ad7e747f', 'operation': 'hotel-match-v9-single-native-samo-chunk7-1971-20260921-v1', 'state': 'completed_read_only'}]}]
          for spec in specs:
              data=subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+spec['artifact']+'/zip'])
              assert hashlib.sha256(data).hexdigest()==spec['zip_sha256']
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for f in spec['files']:
                      assert z.namelist().count(f['member'])==1
                      body=z.read(f['member']); assert hashlib.sha256(body).hexdigest()==f['sha256']
                      value=json.loads(body); assert value['operation']==f['operation'] and value['state']==f['state']
                      pathlib.Path('input',f['out']).write_bytes(body)
          PY
          MATCH_INPUT_DIR="$PWD/input" php "$SCRIPT_PATH" --plan > terminal/offline-plan.json
      - name: Reserve exactly328 candidate keys before database access
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib
          p=json.load(open('terminal/offline-plan.json'))
          assert p['operation']==os.environ['OPERATION_ID'] and p['candidates']==328 and p['unique_hotels']==261 and len(set(p['keys']))==328
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_db','source_sha':os.environ['HEAD_SHA'],'script_sha256':os.environ['SCRIPT_SHA256'],'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'candidate_keys':p['keys'],'no_replay':True,'provider_calls':0,'database_writes':0}
          with pathlib.Path('reservation/reservation.json').open('x') as f: f.write(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-provider328-reservation-${{ github.run_id }}', path: reservation/, retention-days: 90, if-no-files-found: error}
      - name: Require exact-head Security before private server execution
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as f: runs=[r for r in json.load(f)['workflow_runs'] if r['name']=='Security guard' and r['head_sha']==os.environ['HEAD_SHA']]
              if runs and max(runs,key=lambda r:r['id'])['status']=='completed':
                  assert max(runs,key=lambda r:r['id'])['conclusion']=='success'; break
              time.sleep(5)
          else: raise SystemExit('security_not_green')
          PY
      - name: Execute one guarded transaction and collect readback
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/match328-key"; known="$RUNNER_TEMP/match328-known"; trap 'rm -f "$key" "$known"' EXIT
          test -n "$KEY"; test -n "$HOST"; test -n "$USER"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; script="${SCRIPT_PATH##*/}"; resolver="${RESOLVER_PATH##*/}"; op=".anytoour-match/operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/.anytoour-match/operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""
          scp "${opts[@]}" "$SCRIPT_PATH" "$RESOLVER_PATH" input/v9.json input/reserved178.json input/chunk*.json reservation/reservation.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op/payload\" && echo '$SCRIPT_SHA256  $script' | sha256sum -c - && echo '$RESOLVER_SHA256  $resolver' | sha256sum -c - && php -l '$script' && php '$script' --self-test" > terminal/server-preflight.txt
          printf '%s\n' 'current_transaction_started_no_replay' > terminal/stage.txt
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_INPUT_DIR=\"\$HOME/$op/payload\" MATCH_SOURCE_SHA='$HEAD_SHA' php \"\$HOME/$op/payload/$script\" --execute" > terminal/remote.stdout 2> terminal/remote.stderr
          code=$?
          set -e
          printf '%s\n' "$code" > terminal/exit-code.txt
          ssh "${opts[@]}" "$remote" 'cd "$HOME/'"$op"'" && find . -maxdepth 1 -type f -name "*.json" -print0 | tar --null -T - -czf -' > terminal/server.tgz
          test "$code" -eq 0
      - name: Verify committed rows against immutable candidate plan
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  name=m.name.removeprefix('./'); assert m.isfile() and '/' not in name and name.endswith('.json')
                  pathlib.Path('terminal',name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json')); q=json.load(open('terminal/receipt.json')); p=json.load(open('terminal/offline-plan.json'))
          assert r['operation']==q['operation']==p['operation'] and r['state']==q['state']
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest() and q['no_replay'] is True
          assert all(r[k]==0 for k in ['provider_calls','tourvisor_calls','samo_calls','andromeda_calls'])
          assert r['input_candidates']==328 and r['mapping_writes']==r['database_writes']==q['mapping_writes']==q['database_writes']
          assert r['state'] in ['committed_verified','completed_no_write_below_threshold']
          if r['state']=='committed_verified':
              n=r['mapping_writes']; assert 100<=n<=328 and r['post_commit_verified']==r['resolver_verified']==n and r['readback_verified'] is q['readback_verified'] is True
              keys=[x['supplier_namespace']+'|'+x['external_hotel_id'] for x in r['written_rows']]
              assert len(keys)==len(set(keys))==n and set(keys).issubset(p['keys'])
              assert len({x['local_hotel_id'] for x in r['written_rows']})==r['written_unique_hotels']
              assert len(r['holds'])+n==328
          else:
              assert r['mapping_writes']==0 and r['current_safe']<100 and r['readback_verified'] is False
          summary={k:v for k,v in r.items() if k not in ['written_rows','holds']}; summary['result_sha256']=q['result_sha256']
          pathlib.Path('terminal/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          pathlib.Path('terminal/stage.txt').write_text(r['state']+'\n'); print(json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-provider328-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
