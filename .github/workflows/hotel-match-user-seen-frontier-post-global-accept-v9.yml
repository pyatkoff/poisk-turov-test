name: MATCH post-global-accept frontier census v9

on:
  push:
    branches:
      - match/user-seen-frontier-post-global-accept-1971-20260918-v9
    paths:
      - scripts/diagnostics/hotel_match_user_seen_frontier_post_global_accept_v9.php
      - .github/workflows/hotel-match-user-seen-frontier-post-global-accept-v9.yml

permissions:
  contents: read
  actions: read
  issues: read

env:
  OPERATION_ID: hotel-match-user-seen-frontier-post-global-accept-1971-20260918-v9
  EXPECTED_BASE: 325ea3d8fc4752c95ddcc6bccf715dae24f7836a
  CLAIM_COMMENT_ID: '5728355401'
  SOURCE_RUN_ID: '35331022650'
  SOURCE_ARTIFACT_NAME: match-global-catalog-v2-result-35331022650
  SOURCE_RESULT_SHA256: 7516046dd2a0d052ea806ca07b337400d7d3769e2ff3fd7832e3479eecde1324

jobs:
  census:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.ref == 'refs/heads/match/user-seen-frontier-post-global-accept-1971-20260918-v9'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate isolated delta and claim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/diagnostics/hotel_match_user_seen_frontier_post_global_accept_v9.php'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/hotel-match-user-seen-frontier-post-global-accept-v9.yml'
          php -l scripts/diagnostics/hotel_match_user_seen_frontier_post_global_accept_v9.php
          php scripts/diagnostics/hotel_match_user_seen_frontier_post_global_accept_v9.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('claim.json')); b=c.get('body','')
          assert c.get('user',{}).get('id')==226193297 and c.get('author_association')=='OWNER'
          assert c.get('issue_url','').endswith('/issues/2530')
          assert os.environ['OPERATION_ID'] in b and 'post-write CURRENT frontier census v9' in b
          PY
      - name: Restore exact source acquisition result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download "$SOURCE_RUN_ID" -n "$SOURCE_ARTIFACT_NAME" -D source
          test -f source/server/result.json
          test "$(sha256sum source/server/result.json | cut -d' ' -f1)" = "$SOURCE_RESULT_SHA256"
      - name: Require SSH credentials
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail; test -n "$KEY_VALUE"; test -n "$HOST_VALUE"; test -n "$USER_VALUE"
      - name: Run CURRENT read-only census
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077; mkdir -p terminal
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null; ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null; test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE"; stage=".anytour-operations-staging/$OPERATION_ID-$GITHUB_RUN_ID"; op=".anytour-match/operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "test ! -e \"\$HOME/$op\"; rm -rf \"\$HOME/$stage\"; mkdir -p \"\$HOME/$stage\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_user_seen_frontier_post_global_accept_v9.php app/integrations/anex-search-mapping-registry.php source/server/result.json "$remote:$stage/"
          ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_RESULT_PATH=\"\$HOME/$stage/result.json\" MATCH_MAPPING_REGISTRY_PATH=\"\$HOME/$stage/anex-search-mapping-registry.php\" MATCH_SOURCE_SHA=\"$HEAD_SHA\" php \"\$HOME/$stage/hotel_match_user_seen_frontier_post_global_accept_v9.php\"" > terminal/stdout.json 2> terminal/stderr.txt
          ssh "${opts[@]}" "$remote" "tar -C \"\$HOME/$op\" -czf - reservation.json result.json receipt.json" > terminal/server-operation.tgz
          ssh "${opts[@]}" "$remote" "rm -rf \"\$HOME/$stage\"" || true
      - name: Verify result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          p=pathlib.Path('terminal'); s=p/'server'; s.mkdir(exist_ok=True)
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              for m in t.getmembers():
                  assert m.isfile() and m.size<20_000_000
                  (s/pathlib.Path(m.name).name).write_bytes(t.extractfile(m).read())
          r=json.loads((s/'result.json').read_text()); rec=json.loads((s/'receipt.json').read_text())
          digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest(); assert rec['result_sha256']==digest
          assert r['status']=='read_only_complete' and r['database_writes']==0 and r['mapping_writes']==0 and r['supplier_calls']==0 and r['tourvisor_calls']==0
          summary={k:r.get(k) for k in ['unresolved_real_hotels','unresolved_opaque_products','unresolved_total','common4_future_unique_real_hotels','common4_family_unique_hotels','common4_family_observation_rows','source102_status','anex_unique_local','andromeda_unique_local']}
          summary['top_regions']=r.get('top_regions',[])[:25]; summary['source102_anomalies']=r.get('source102_anomalies',[])[:10]; summary['result_sha256']=digest
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-frontier-post-global-accept-v9-${{ github.run_id }}
          path: terminal/
          if-no-files-found: error
          retention-days: 90
