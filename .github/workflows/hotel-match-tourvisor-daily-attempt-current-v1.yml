name: MATCH Tourvisor daily attempt CURRENT audit v1
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths:
      - .github/workflows/hotel-match-tourvisor-daily-attempt-current-v1.yml
permissions: {contents: read, actions: read}
concurrency: {group: match-tourvisor-daily-attempt-current-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify source and reserve before DB access
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_tourvisor_daily_attempt_current_v1.php)" = 69d74b5ee6aa7594063bb3f7637734da4e32afa8
          php -n -l scripts/diagnostics/hotel_match_tourvisor_daily_attempt_current_v1.php
          php -n -d allow_url_fopen=0 scripts/diagnostics/hotel_match_tourvisor_daily_attempt_current_v1.php --self-test
          out="$RUNNER_TEMP/$OPERATION_ID"
          mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          r={
            'operation_id':os.environ['OPERATION_ID'],
            'source_sha':os.environ['GITHUB_SHA'],
            'state':'reserved_before_db_access',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'claim_comment_id':5708151521,
            'coordination_issue':2530,
            'queue_issue':1971,
            'purpose':'current_tourvisor_api_invocation_daily_budget_audit',
            'daily_limit':300,
            'no_replay':True,
            'database_writes':0,
            'mapping_writes':0,
            'supplier_calls':0,
            'tourvisor_calls':0,
          }
          (p/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tourvisor-daily-attempt-current-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: One server CURRENT read-only audit
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0" < scripts/diagnostics/hotel_match_tourvisor_daily_attempt_current_v1.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'; s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size<=2_000_000
                  b=t.extractfile(m).read(); (s/m.name).write_bytes(b)
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          r=json.loads((s/'result.json').read_bytes()); q=json.loads((s/'receipt.json').read_bytes())
          assert q['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          for x in (r,q):
              assert x['operation_id']==os.environ['OPERATION_ID'] and x['source_sha']==os.environ['GITHUB_SHA'] and x['no_replay'] is True
          assert q['readback_verified'] is True
          assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==0
          assert r['state']=='completed_read_only'
          assert isinstance(r['conservative_used'],int) and 0<=r['conservative_used']
          assert isinstance(r['conservative_remaining'],int) and 0<=r['conservative_remaining']<=300
          assert r['conservative_remaining']==max(0,300-r['conservative_used'])
          assert os.environ['REMOTE_RC']==os.environ['TAR_RC']=='0'
          (p/'workflow-readback.json').write_text(json.dumps({
            'operation_id':os.environ['OPERATION_ID'],
            'source_sha':os.environ['GITHUB_SHA'],
            'state':r['state'],
            'result_sha256':q['result_sha256'],
            'conservative_used':r['conservative_used'],
            'conservative_remaining':r['conservative_remaining'],
            'safe_to_spend_tourvisor_now':r['safe_to_spend_tourvisor_now'],
            'read_at_utc':r['read_at_utc'],
            'readback_verified':True,
            'no_replay':True,
            'remote_exit':0,
            'tar_exit':0,
          },sort_keys=True)+'\n')
          print(json.dumps({'conservative_used':r['conservative_used'],'conservative_remaining':r['conservative_remaining'],'safe':r['safe_to_spend_tourvisor_now']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tourvisor-daily-attempt-current-v1-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/reservation.json
            ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/server/result.json
            ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/server/receipt.json
            ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/workflow-readback.json
            ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/remote-stdout.txt
            ${{ runner.temp }}/hotel-match-tourvisor-daily-attempt-current-1971-20260917-v1/remote-stderr.txt
          if-no-files-found: error
          retention-days: 90
