name: MATCH Biblio one-hotel corrected transport probe
'on':
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_biblio_probe1_v1.php
      - .github/workflows/hotel-match-biblio-probe1-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-biblio-probe1-1971-20260922-v1, cancel-in-progress: false}
env:
  OP: hotel-match-biblio-probe1-1971-20260922-v1
  BASE: a79f8eb2bae4793e28906564b4ce2a06af3f473a
  SCRIPT: scripts/diagnostics/hotel_match_biblio_probe1_v1.php
  SCRIPT_SHA256: 3aef4e2e1677b52e29e7e4b7863301bc5904661b4fd5bac818ecd51d3618942d
  CLAIM: '5768587401'
  ROOT_CAUSE_COMMENT: '5768378507'
  V9_ARTIFACT: '10634643226'
  SNAPSHOT_ARTIFACT: '10645399682'
  TV: '1273'
  F4: '102626027108'
  EXPECTED_CANONICAL: '2000080937'
jobs:
  probe:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'ops/match-biblio-probe1-1971-20260922-v1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact scope and immutable evidence
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir -p input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE"..HEAD | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-biblio-probe1-v1.yml scripts/diagnostics/hotel_match_biblio_probe1_v1.php "
          echo "$SCRIPT_SHA256  $SCRIPT" | sha256sum -c -
          php -l "$SCRIPT"; php "$SCRIPT" --self-test
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ROOT_CAUSE_COMMENT" > input/root-cause.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$V9_ARTIFACT/zip" > input/v9.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SNAPSHOT_ARTIFACT/zip" > input/snapshot.zip
          echo '0a4337d6a00f668b643b8babb14867e3cae5189bbb881c724c24e5b74e7baaf0  input/v9.zip' | sha256sum -c -
          echo 'bf216bbe9159c4243c3884a055316cdc61f601aede30d931de48e0c60e629e1d  input/snapshot.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.parse,zipfile
          claim=json.load(open('input/claim.json')); root=json.load(open('input/root-cause.json'))
          assert claim['id']==int(os.environ['CLAIM']) and claim['user']['id']==226193297 and claim['author_association']=='OWNER'
          assert claim['issue_url']=='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/2530'
          for s in [os.environ['OP'],os.environ['BASE'],'Tourvisor hotel 1273','102626027108','maximum physical supplier HTTP = 2','DB/mapping writes0']:
              assert s in claim['body'],s
          assert root['id']==int(os.environ['ROOT_CAUSE_COMMENT']) and root['issue_url'].endswith('/issues/1971')
          for s in ['ANDROMEDA_REQUEST_BUDGET','one-hotel diagnostic probe','fresh, previously unconsumed Biblio membership','fresh bounded transport/client']:
              assert s in root['body'],s
          with zipfile.ZipFile('input/v9.zip') as z:
              raw=z.read('reconciliation.json')
          assert hashlib.sha256(raw).hexdigest()=='0995ccbd0c14639a335a644748d6dc5af6b359345328698ea3c0fc1300d88814'
          v=json.loads(raw); found=[]
          for e in v['source_result']['edges']:
              if int(e.get('tv_hotel_id') or 0)!=int(os.environ['TV']) or int(e.get('operator_id') or 0)!=18: continue
              link=e['operator_link']; assert hashlib.sha256(link.encode()).hexdigest()==e['operator_link_sha256']
              q=urllib.parse.parse_qs(urllib.parse.urlsplit(link).query)
              if q.get('F4')==[os.environ['F4']] and q.get('data')==['07.10.2026'] and q.get('f7')==['7']:
                  found.append({'tv':int(os.environ['TV']),'f4':os.environ['F4'],'operator_link_sha256':e['operator_link_sha256'],'tour_id':e.get('tour_id'),'search_id':e.get('search_id'),'batch':e.get('batch')})
          assert len(found)==1,found
          pathlib.Path('input/source.json').write_text(json.dumps(found[0],ensure_ascii=False,separators=(',',':'))+'\n')
          with zipfile.ZipFile('input/snapshot.zip') as z:
              b=z.read('andromeda_hotel_identities.json')
          assert hashlib.sha256(b).hexdigest()=='2135ee882e58ad2524075897239556c683860bfef8cc5d7fe4db496a50244a1d'
          snap=json.loads(b); rows=snap['rows']
          anchors=[r for r in rows if r.get('supplier_namespace')=='andromeda_catalog' and r.get('decision_status')=='accepted' and int(r.get('local_hotel_id') or 0)==int(os.environ['TV'])]
          assert len(anchors)==1 and str(anchors[0]['external_hotel_id'])==os.environ['EXPECTED_CANONICAL'],anchors
          PY
          export SOURCE_SHA256=$(sha256sum input/source.json|cut -d' ' -f1)
          export DEP_CLIENT_SHA=$(sha256sum app/integrations/andromeda-client.php|cut -d' ' -f1)
          export DEP_TRANSPORT_SHA=$(sha256sum app/integrations/andromeda-transport.php|cut -d' ' -f1)
          export DEP_FAILURE_SHA=$(sha256sum app/integrations/andromeda-network-transport-failure.php|cut -d' ' -f1)
          printf 'SOURCE_SHA256=%s\nDEP_CLIENT_SHA=%s\nDEP_TRANSPORT_SHA=%s\nDEP_FAILURE_SHA=%s\n' "$SOURCE_SHA256" "$DEP_CLIENT_SHA" "$DEP_TRANSPORT_SHA" "$DEP_FAILURE_SHA" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import datetime,json,os,pathlib
          r={'operation':os.environ['OP'],'state':'reserved_before_db_and_supplier','source_sha':os.environ['HEAD'],'script_sha256':os.environ['SCRIPT_SHA256'],'source_sha256':os.environ['SOURCE_SHA256'],'tv':int(os.environ['TV']),'f4':os.environ['F4'],'max_supplier_transport_invocations':2,'database_writes':0,'mapping_writes':0,'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'no_replay':True}
          pathlib.Path('reservation/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-biblio-probe1-reservation-${{ github.run_id }}', path: reservation/, retention-days: 90, if-no-files-found: error}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(60):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as f:r=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if r and max(r,key=lambda x:x['id'])['status']=='completed':
                  assert max(r,key=lambda x:x['id'])['conclusion']=='success';break
              time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Fail closed on concurrent supplier acquisition
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?status=in_progress&per_page=100'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
          blocked=[]
          for r in runs:
              if str(r['id'])==os.environ['GITHUB_RUN_ID'] or r['name']=='Security guard': continue
              text=(r.get('name','')+' '+r.get('path','')+' '+str(r.get('head_branch') or '')).lower()
              if any(x in text for x in ['andromeda','anex','tourvisor','hotel-match','match-biblio']): blocked.append((r['id'],r['name'],r.get('head_branch')))
          assert not blocked,blocked
          PY
      - name: Execute one fresh probe and recover durable state
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/k";known="$RUNNER_TEMP/h";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          r="$USER@$HOST";op=".anytoour-match/operations/$OP";s="${SCRIPT##*/}";a=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          ssh "${a[@]}" "$r" "set -eu; test -f \"\$HOME/www/anytoour.ru/_preview/search3-anex-candidate/.andromeda-private.php\"; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/.anytoour-match/operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""
          cp input/source.json terminal/source.json;cp reservation/reservation.json terminal/reservation.json
          scp "${a[@]}" "$SCRIPT" app/integrations/andromeda-client.php app/integrations/andromeda-transport.php app/integrations/andromeda-network-transport-failure.php input/source.json reservation/reservation.json "$r:$op/payload/"
          ssh "${a[@]}" "$r" "cd \"\$HOME/$op/payload\" && echo '$SCRIPT_SHA256  $s'|sha256sum -c - && echo '$SOURCE_SHA256  source.json'|sha256sum -c - && echo '$DEP_CLIENT_SHA  andromeda-client.php'|sha256sum -c - && echo '$DEP_TRANSPORT_SHA  andromeda-transport.php'|sha256sum -c - && echo '$DEP_FAILURE_SHA  andromeda-network-transport-failure.php'|sha256sum -c - && php -l '$s' && php '$s' --self-test" >terminal/preflight
          set +e
          ssh "${a[@]}" "$r" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/$s\" --execute" >terminal/stdout 2>terminal/stderr
          rc=$?;set -e;printf '%s\n' "$rc" > terminal/remote-exit.txt
          ssh "${a[@]}" "$r" "set -eu; cd \"\$HOME/$op\"; for f in started.json failure.json login-reserved.json login-result.json price-reserved.json price-result.json result.json receipt.json; do if [ -f \"\$f\" ]; then printf '%s\\0' \"\$f\"; fi; done | tar --null -T - -czf -" >terminal/server.tgz
      - name: Verify terminal evidence
        if: always()
        env: {HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          root=pathlib.Path('terminal/extracted');root.mkdir(exist_ok=True)
          tgz=pathlib.Path('terminal/server.tgz')
          if not tgz.exists(): raise SystemExit('missing_server_capture')
          with tarfile.open(tgz,'r:gz') as t:
              names=t.getnames(); assert names and all('/' not in n for n in names)
              for m in t.getmembers(): assert m.isfile(); (root/m.name).write_bytes(t.extractfile(m).read())
          rc=int(pathlib.Path('terminal/remote-exit.txt').read_text().strip())
          summary={'operation':os.environ['OP'],'remote_exit':rc,'files':sorted(p.name for p in root.iterdir()),'no_replay':True}
          if rc==0:
              result=json.load(open(root/'result.json')); receipt=json.load(open(root/'receipt.json'))
              assert result['operation']==receipt['operation']==os.environ['OP'] and result['source_sha']==receipt['source_sha']==os.environ['HEAD']
              assert result['database_writes']==result['mapping_writes']==0 and result['tourvisor_calls']==result['anex_calls']==0 and result['no_replay'] is True
              assert hashlib.sha256((root/'result.json').read_bytes()).hexdigest()==receipt['result_sha256']
              calls=int(receipt['supplier_transport_invocations']); assert calls in (0,2)
              if calls==0: assert receipt['state']=='completed_read_only_hold'
              else:
                  assert receipt['state']=='completed_read_only' and {'login-reserved.json','login-result.json','price-reserved.json','price-result.json'} <= set(summary['files'])
                  pr=json.load(open(root/'price-result.json')); assert int(pr['tv'])==1273 and pr['f4']=='102626027108'
                  if pr['state']=='supplier_error': assert pr['error_code'] in ['ANDROMEDA_SUPPLIER_ERROR','ANDROMEDA_NETWORK_TRANSPORT_FAILURE','ANDROMEDA_INVALID_RESPONSE','ANDROMEDA_INVALID_PRICE_RESPONSE','ANDROMEDA_RESPONSE_TOO_LARGE','ANDROMEDA_PRICE_ROW_BUDGET','ANDROMEDA_REQUEST_BUDGET','ANDROMEDA_TRANSPORT_ERROR','ANDROMEDA_CURL_REQUIRED','ANDROMEDA_LOGIN_REQUIRED','ANDROMEDA_PRICE_REPLAY_REFUSED','ANDROMEDA_ENDPOINT_REJECTED','ANDROMEDA_ACTION_NOT_ALLOWED','ANDROMEDA_INVALID_PARAMS','UNCLASSIFIED_FIXED_EXCEPTION']
              summary.update({'state':receipt['state'],'result_state':receipt.get('result_state'),'calls':calls,'result_sha256':receipt['result_sha256']})
          else:
              assert (root/'failure.json').exists(); fail=json.load(open(root/'failure.json')); assert fail['operation']==os.environ['OP'] and fail['state']=='failed_no_replay'
              summary.update({'state':'failed_no_replay','calls':int(fail.get('supplier_transport_invocations',0)),'error_category':fail.get('error_category'),'error_code':fail.get('error_code')})
          pathlib.Path('terminal/summary.json').write_text(json.dumps(summary,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,sort_keys=True))
          if rc!=0: raise SystemExit(rc)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-biblio-probe1-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
