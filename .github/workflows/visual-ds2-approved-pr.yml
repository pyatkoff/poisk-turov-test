name: Visual DS2 approved PR

on:
  pull_request:
    branches: [feature/search-core]
    paths:
      - 'v2/selected-tour-description-v1.js'
      - 'v2/selected-tour-ux.css'
      - 'v2/flight-price-sync-v1.js'
      - 'v2/site-footer-v1.css'
      - 'v2/site-footer-v1.php'
      - '.github/workflows/visual-ds2-approved-pr.yml'
  workflow_dispatch:

concurrency:
  group: visual-ds2-approved-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approved-ds2-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build local DS2 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .visual-ds2 artifacts-ds2-approved-pr
          cat > .visual-ds2/index.html <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/v2/design-system-v2.css"><link rel="stylesheet" href="/v2/selected-tour-ux.css"><link rel="stylesheet" href="/v2/site-footer-v1.css">
          <style>body{margin:0;background:var(--at-page);font-family:Arial,sans-serif}.fixture-main{width:min(var(--at-shell),calc(100% - var(--at-page-gutter)));margin:24px auto}.primary{border:0;background:var(--at-accent);color:var(--at-surface);border-radius:var(--at-control-radius);padding:0 18px}.lead-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lead-form label{display:grid;gap:6px}.lead-form input,.lead-form textarea{padding:10px;border:1px solid var(--at-line);border-radius:var(--at-control-radius)}@media(max-width:560px){.lead-fields{grid-template-columns:1fr}}</style></head><body>
          <main class="fixture-main"><section id="selectedTour" class="selected-tour">
          <button type="button" class="back-results">← Вернуться к предложениям</button>
          <div class="selected-head"><div><span class="eyebrow">ВЫБРАННЫЙ ТУР</span><h2>AnyTour Coast Resort & Spa</h2><p>Турция · Анталья · Лара</p></div><div class="selected-price"><small>Стоимость</small>142 000 ₽</div></div>
          <div class="selected-picture"><div style="height:260px;background:var(--at-soft-blue);display:grid;place-items:center;font-weight:900">ANYTOUR HOTEL</div></div>
          <div class="facts"><div><span>Вылет из</span><b>Москва</b></div><div><span>Дата</span><b>12.09.2026</b></div><div><span>Ночей</span><b>9</b></div><div><span>Туристы</span><b>2 взр. + 1 дет.</b></div><div><span>Питание</span><b>Ультра всё включено</b></div><div><span>Номер</span><b>Deluxe Sea View</b></div><div><span>Размещение</span><b>2 ADL + CHD</b></div><div><span>Оператор</span><b>PEGAS</b></div><div><span>Перелёт</span><b>Чартер</b></div><div><span>Топливный сбор</span><b>6 000 ₽</b></div></div>
          <div class="hotel-desc">Большой курортный отель у моря с семейной инфраструктурой, несколькими бассейнами и удобным расположением. На территории есть зоны для спокойного отдыха и семейные активности, рестораны, бары и пространства для детей. Описание намеренно длинное, чтобы проверить раскрытие текста, ритм страницы и адаптивность checkout-поверхности на маленьких экранах без визуального перегруза.</div>
          <div class="tour-flights"><div class="section-heading"><strong>Авиарейсы</strong><span>Выберите подходящий вариант</span></div><div class="flight-variants">
          <div class="flight-variant is-selected"><label class="flight-choice"><input type="radio" name="flight" checked><span>Вариант 1</span><b>142 000 ₽</b></label><div class="flight-segment"><div class="flight-segment-title"><strong>Туда</strong><span>Southwind · 2S172 · Boeing 737-800</span></div><div class="flight-route"><div><b>Шереметьево (SVO)</b><span>12.09.2026 · 14:00</span></div><div class="flight-arrow">→</div><div><b>Даламан (DLM)</b><span>12.09.2026 · 18:05</span></div></div><div class="flight-baggage">Багаж: <b>20 кг</b> · Ручная кладь: <b>8 кг</b></div></div></div>
          <div class="flight-variant"><label class="flight-choice"><input type="radio" name="flight"><span>Вариант 2</span><b>149 500 ₽</b></label><div class="flight-segment"><div class="flight-segment-title"><strong>Туда</strong><span>Turkish Airlines · TK000 · Airbus A321</span></div></div></div></div></div>
          <form class="lead-form"><div class="section-heading"><strong>Оставить заявку</strong><span>Менеджер получит выбранный тур и рейс</span></div><div class="lead-fields"><label>Имя<input value="Тест"></label><label>Телефон<input value="+7 999 123-45-67"></label></div><label>Комментарий<textarea>Тестовая заявка для визуального аудита.</textarea></label><button type="button" class="primary">Отправить заявку</button></form>
          </section></main>
          <section class="v2-site-community" aria-labelledby="community-title"><div class="v2-site-community__inner"><div class="v2-site-community__copy"><span class="v2-site-community__eyebrow">AnyTour всегда рядом</span><h2 id="community-title">Подписывайтесь и берите поиск туров с собой</h2><p>Каналы AnyTour — для идей и выгодных предложений. Приложение — чтобы искать туры с телефона.</p></div><div class="v2-site-community__actions"><div class="v2-site-community__socials"><a href="#">MAX</a><a href="#">Telegram</a><a href="#">VK</a></div><div class="v2-site-community__apps"><a class="v2-site-community__app" href="#"><small>Скачать в</small><b>App Store</b></a><a class="v2-site-community__app" href="#"><small>Скачать в</small><b>Google Play</b></a></div></div></div></section>
          <footer class="at-site-footer"><nav class="at-site-footer-menu"><ul><li><a href="#">Оплата туров</a></li><li><a href="#">Согласие на обработку персональных данных</a></li><li><a href="#">Политика конфиденциальности</a></li></ul></nav><p class="at-site-footer-copy">© 2026 «ТУРАГЕНТСТВО ANYTour» Москва | Все права защищены.</p><span class="at-site-pay-icons"><i>MasterCard</i><i>Visa</i><i>Мир</i></span></footer>
          <script src="/v2/selected-tour-description-v1.js"></script><script src="/v2/flight-price-sync-v1.js"></script></body></html>
          HTML
      - name: Audit checked-out DS2 at five widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ds2-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          cat > ds2-visual.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const views=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const base='http://127.0.0.1:4173/.visual-ds2/index.html';
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
          for(const [name,width,height] of views){const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const response=await page.goto(base,{waitUntil:'networkidle',timeout:30000});
          const initial=await page.evaluate(()=>{const s=document.querySelector('#selectedTour'),tour={id:'fixture',price:142000,isCharter:true,fuelCharge:6000,meal:'Ультра всё включено',roomType:'Deluxe Sea View',hotel:{name:'AnyTour Coast Resort & Spa',category:5,rating:4.8,seaDistance:120}};window.V2SelectedTourDescription?.decorate(s,tour);window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour}}));const rect=e=>e?.getBoundingClientRect();const socials=document.querySelectorAll('.v2-site-community__socials a'),apps=document.querySelectorAll('.v2-site-community__app');return{progress:s.querySelectorAll('.selected-tour-progress span').length,facts:s.querySelectorAll('.facts>div').length,flights:s.querySelectorAll('.flight-variant').length,lead:!!s.querySelector('.lead-form'),summary:!!s.querySelector('.selected-choice-summary'),descToggle:!!s.querySelector('.hotel-desc-toggle'),factsToggle:!!s.querySelector('.facts-secondary-toggle'),socials:socials.length,apps:apps.length,footers:document.querySelectorAll('.at-site-footer').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,selectedRight:rect(s)?.right||0,viewport:innerWidth,mobileTargets:[...socials,...apps].map(e=>rect(e)?.height||0)}});
          const synced=await page.evaluate(()=>{const tour={price:142000,fuelCharge:6000},flight={price:149500,fuelCharge:7500};window.V2FlightPriceSync?.sync(tour,flight,1);window.dispatchEvent(new CustomEvent('v2:flight-selected',{detail:{tour,flight,index:1}}));const price=document.querySelector('#selectedTour .selected-price'),fuel=[...document.querySelectorAll('#selectedTour .facts>div')].find(x=>x.querySelector('span')?.textContent.trim()==='Топливный сбор')?.querySelector('b');const active=[...document.querySelectorAll('.selected-tour-progress span')].findIndex(x=>x.classList.contains('is-active'));return{price:String(price?.textContent||'').replace(/\s+/g,' '),fuel:String(fuel?.textContent||''),active,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}});
          const leadStep=await page.evaluate(()=>{window.dispatchEvent(new CustomEvent('v2:lead-started'));return[...document.querySelectorAll('.selected-tour-progress span')].findIndex(x=>x.classList.contains('is-active'));});
          if(width<=430){await page.locator('.facts-secondary-toggle').click();}
          await page.screenshot({path:`artifacts-ds2-approved-pr/${name}.png`,fullPage:true});
          const bad=(response?.status()!==200)||errors.length||initial.progress!==3||initial.facts!==10||initial.flights!==2||!initial.lead||!initial.summary||!initial.descToggle||!initial.factsToggle||initial.socials!==3||initial.apps!==2||initial.footers!==1||initial.overflow||initial.selectedRight>initial.viewport+2||!synced.price.includes('149 500')||!synced.fuel.replace(/\s/g,'').includes('7500')||synced.active!==1||leadStep!==2||synced.overflow||(width<=430&&initial.mobileTargets.some(h=>h<44));
          report.push({name,width,http:response?.status()||0,errors,initial,synced,leadStep,bad});if(bad)failed=true;console.log(`DS2_PR ${name} http=${response?.status()} progress=${initial.progress} facts=${initial.facts} flights=${initial.flights} footer=${initial.socials}/${initial.apps}/${initial.footers} price=${synced.price} fuel=${synced.fuel} steps=${synced.active}/${leadStep} overflow=${initial.overflow}/${synced.overflow} bad=${bad}`);await context.close();}
          fs.writeFileSync('artifacts-ds2-approved-pr/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ds2-visual.cjs
      - name: Upload DS2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds2-approved-pr-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts-ds2-approved-pr/
          retention-days: 14
