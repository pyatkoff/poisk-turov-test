name: Visual DS2 approved PR

on:
  pull_request:
    branches: [feature/search-core]
    paths:
      - 'v2/selected-tour-description-v1.js'
      - 'v2/flight-price-sync-v1.js'
      - 'v2/site-footer-v1.php'
      - 'v2/ds2-search.css'
      - '.github/workflows/visual-ds2-approved-pr.yml'
  workflow_dispatch:

concurrency:
  group: visual-ds2-approved-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  approved-ds2-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build local DS2 fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .visual-ds2 artifacts-ds2-approved-pr
          cat > .visual-ds2/index.html <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/v2/ds2-search.css">
          <style>*,*::before,*::after{box-sizing:border-box}body{margin:0}.fixture-main{width:min(1180px,calc(100% - 28px));margin:24px auto}.lead-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.lead-fields{grid-template-columns:1fr}}</style></head><body>
          <main class="fixture-main"><section id="selectedTour" class="selected-tour">
          <button type="button" class="back-results">← Вернуться к предложениям</button>
          <div class="selected-head"><div><span class="eyebrow">ВЫБРАННЫЙ ТУР</span><h2>AnyTour Coast Resort & Spa</h2><p>Турция · Анталья · Лара</p></div><div class="selected-price"><small>Стоимость</small>142 000 ₽</div></div>
          <div class="selected-picture"><div style="height:260px;background:#eef2f6;display:grid;place-items:center;font-weight:900">ANYTOUR HOTEL</div></div>
          <div class="facts"><div><span>Вылет из</span><b>Москва</b></div><div><span>Дата</span><b>12.09.2026</b></div><div><span>Ночей</span><b>9</b></div><div><span>Туристы</span><b>2 взр. + 1 дет.</b></div><div><span>Питание</span><b>Ультра всё включено</b></div><div><span>Номер</span><b>Deluxe Sea View</b></div><div><span>Размещение</span><b>2 ADL + CHD</b></div><div><span>Оператор</span><b>PEGAS</b></div><div><span>Перелёт</span><b>Чартер</b></div><div><span>Топливный сбор</span><b>6 000 ₽</b></div></div>
          <div class="hotel-desc">Большой курортный отель у моря с семейной инфраструктурой и удобным расположением.</div>
          <div class="tour-flights"><div class="section-heading"><strong>Авиарейсы</strong><span>Выберите подходящий вариант</span></div><div class="flight-variants"><div class="flight-variant is-selected"><label class="flight-choice"><input type="radio" name="flight" checked><span>Вариант 1</span><b>142 000 ₽</b></label></div><div class="flight-variant"><label class="flight-choice"><input type="radio" name="flight"><span>Вариант 2</span><b>149 500 ₽</b></label></div></div></div>
          <form class="lead-form"><div class="section-heading"><strong>Оставить заявку</strong><span>Менеджер получит выбранный тур и рейс</span></div><div class="lead-fields"><label>Имя<input value="Тест"></label><label>Телефон<input value="+7 999 123-45-67"></label></div><button type="button">Отправить заявку</button></form>
          </section></main>
          <footer class="ds2-site-footer"><div class="ds2-site-footer__inner"><div class="ds2-site-footer__brand"><a class="ds2-site-footer__logo" href="#">AnyTour</a><p>Каналы AnyTour — для идей и выгодных предложений.</p><div class="ds2-site-footer__socials"><a href="#">MAX</a><a href="#">Telegram</a><a href="#">VK</a></div></div><div class="ds2-site-footer__apps"><div><strong>Приложение AnyTour</strong><small>Поиск туров с телефона</small></div><a href="#">App Store</a><a href="#">Google Play</a></div></div><div class="ds2-site-footer__meta"><div class="ds2-site-footer__payments"><span>MasterCard</span><span>Visa</span><span>Мир</span></div></div><div class="ds2-site-footer__bottom"><span>© 2026 «ТУРАГЕНТСТВО ANYTour» Москва | Все права защищены.</span></div></footer>
          <script src="/v2/selected-tour-description-v1.js"></script><script src="/v2/flight-price-sync-v1.js"></script></body></html>
          HTML
      - name: Audit checked-out DS2 at five widths
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ds2-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          cat > ds2-visual.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const views=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const base='http://127.0.0.1:4173/.visual-ds2/index.html';
          const selectedSource=fs.readFileSync('v2/selected-tour-description-v1.js','utf8');
          const expectApprovedSelected=selectedSource.includes('selected-tour-progress') && selectedSource.includes('selected-choice-summary');
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
          for(const [name,width,height] of views){const context=await browser.newContext({viewport:{width,height}}),page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const response=await page.goto(base,{waitUntil:'networkidle',timeout:30000});
          const initial=await page.evaluate(()=>{const s=document.querySelector('#selectedTour'),tour={id:'fixture',price:142000,isCharter:true,fuelCharge:6000,meal:'Ультра всё включено',roomType:'Deluxe Sea View',hotel:{name:'AnyTour Coast Resort & Spa',category:5,rating:4.8,seaDistance:120}};window.V2SelectedTourDescription?.decorate(s,tour);window.dispatchEvent(new CustomEvent('v2:tour-selected',{detail:{tour}}));const rect=e=>e?.getBoundingClientRect();const socials=document.querySelectorAll('.ds2-site-footer__socials a'),apps=document.querySelectorAll('.ds2-site-footer__apps>a');return{progress:s.querySelectorAll('.selected-tour-progress span').length,facts:s.querySelectorAll('.facts>div').length,flights:s.querySelectorAll('.flight-variant').length,lead:!!s.querySelector('.lead-form'),summary:!!s.querySelector('.selected-choice-summary'),descToggle:!!s.querySelector('.hotel-desc-toggle'),factsToggle:!!s.querySelector('.facts-secondary-toggle'),socials:socials.length,apps:apps.length,footers:document.querySelectorAll('.ds2-site-footer').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,selectedRight:rect(s)?.right||0,viewport:innerWidth,mobileTargets:[...socials,...apps].map(e=>rect(e)?.height||0)}});
          const selectedBad=expectApprovedSelected&&(initial.progress!==3||!initial.summary||!initial.descToggle||!initial.factsToggle);
          const baseBad=(response?.status()!==200)||errors.length||initial.facts!==10||initial.flights!==2||!initial.lead||initial.socials!==3||initial.apps!==2||initial.footers!==1||initial.overflow||initial.selectedRight>initial.viewport+2||(width<=430&&initial.mobileTargets.some(h=>h<44));
          const bad=baseBad||selectedBad;report.push({name,width,http:response?.status()||0,errors,initial,bad});if(bad)failed=true;console.log(`DS2_PR ${name} http=${response?.status()} targets=${initial.mobileTargets.join(',')} overflow=${initial.overflow} bad=${bad}`);await page.screenshot({path:`artifacts-ds2-approved-pr/${name}.png`,fullPage:true});await context.close();}
          fs.writeFileSync('artifacts-ds2-approved-pr/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ds2-visual.cjs
      - name: Upload DS2 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds2-approved-pr-${{ github.event.pull_request.number || github.run_id }}
          path: artifacts-ds2-approved-pr/
          retention-days: 14
