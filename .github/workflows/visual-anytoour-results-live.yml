name: Visual anytoour.ru live results

on:
  workflow_run:
    workflows: ["Deploy anytoour.ru"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-anytoour-results-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-card:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit live results and selected-tour handoff at DS2 breakpoints
        shell: bash
        run: |
          set -euo pipefail
          export DATE_FROM="$(date -d "+2 day" +%Y-%m-%d)"
          export DATE_TO="$(date -d "+22 day" +%Y-%m-%d)"
          export TEST_NIGHTS="7"
          mkdir -p anytoour-results-visual
          cat > visual-results.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},extraHTTPHeaders:{'X-AnyTour-CI':'1'}});
            await context.route(/https?:\/\/mc\.yandex\.(ru|com)\//,route=>route.abort());
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const u=new URL('https://anytoour.ru/poisk-turov/');
            Object.entries({from:'1',country:'4',dateFrom:process.env.DATE_FROM,dateTo:process.env.DATE_TO,daysFrom:process.env.TEST_NIGHTS,daysTill:process.env.TEST_NIGHTS,count_people:'2',ci_test:'1'}).forEach(([k,v])=>u.searchParams.set(k,v));
            console.log('CI_SEARCH_CONTEXT',JSON.stringify({dateFrom:process.env.DATE_FROM,dateTo:process.env.DATE_TO,departureWindowDays:21,nights:process.env.TEST_NIGHTS,marker:'ci_test=1'}));
            const response=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000});
            if(!response||response.status()!==200)throw new Error('search page HTTP '+(response&&response.status()));
            await page.waitForSelector('.hotel-card',{timeout:90000});
            await page.waitForSelector('.hotel-card .tour-row',{timeout:15000});
            await page.waitForTimeout(700);

            const auditResults=async width=>{
              await page.setViewportSize({width,height:1000});
              await page.waitForTimeout(180);
              const state=await page.evaluate(()=>{
                const card=document.querySelector('.hotel-card'),photo=card?.querySelector('.hotel-photo'),badge=photo?.querySelector('.stars-badge'),body=card?.querySelector('.hotel-body'),main=card?.querySelector('.hotel-main'),tools=document.querySelector('#resultsTools'),tourRow=card?.querySelector('.tour-row'),tourMeta=tourRow?.querySelector('.tour-meta'),tourAction=tourRow?.querySelector('.tour-action'),direct=tourRow?.querySelector('.direct-tour:not([data-tid=""])');
                const r=el=>el?el.getBoundingClientRect():null, css=el=>el?getComputedStyle(el):null, c=el=>{const x=r(el);return x&&{x:x.x,y:x.y,w:x.width,h:x.height,right:x.right,bottom:x.bottom};};
                const mr=r(main),bc=css(badge),mc=css(main);
                return {card:c(card),main:mr&&{w:mr.width,h:mr.height,display:mc&&mc.display},photo:c(photo),body:c(body),tools:c(tools),tourRow:c(tourRow),tourMeta:c(tourMeta),tourAction:c(tourAction),directTour:c(direct),badge:c(badge),badgeWriting:bc&&bc.writingMode,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
              });
              console.log('RESULT_CARD_STATE_'+width,JSON.stringify(state));
              await page.screenshot({path:`anytoour-results-visual/result-${width}.png`,fullPage:true,animations:'disabled'});
              if(!state.card||!state.photo||!state.body||!state.main)throw new Error(width+': result card structure missing');
              if(!state.tools||state.tools.w<240||state.tools.w>width+2)throw new Error(width+': results toolbar geometry invalid: '+JSON.stringify(state.tools));
              if(!state.tourRow||!state.tourMeta||!state.tourAction)throw new Error(width+': tour variant structure missing');
              if(state.tourRow.w<240||state.tourRow.w>state.card.w)throw new Error(width+': tour row width invalid: '+JSON.stringify({tourRow:state.tourRow,card:state.card}));
              if(state.tourAction.right>state.tourRow.right+2||state.tourMeta.right>state.tourRow.right+2)throw new Error(width+': tour variant content escapes row');
              if(state.directTour){
                if(state.directTour.h<42)throw new Error(width+': choose-tour CTA too short: '+state.directTour.h);
                if(state.directTour.w<108)throw new Error(width+': choose-tour CTA too narrow: '+state.directTour.w);
                if(state.directTour.right>state.tourRow.right+2)throw new Error(width+': choose-tour CTA escapes row');
              }
              if(state.overflow)throw new Error(width+': page horizontal overflow');
              if(state.badge){
                if(state.badge.w>90||state.badge.h>42)throw new Error(width+': stars badge distorted: '+JSON.stringify(state.badge));
                if(state.badgeWriting!=='horizontal-tb')throw new Error(width+': stars badge writing mode '+state.badgeWriting);
              }
              if(width>=1360){
                // The current desktop results layout intentionally reserves a left filter rail.
                // Protect the two-column card itself instead of requiring the pre-rail 500px body width.
                if(state.main.display!=='grid')throw new Error(width+': hotel main must stay grid, got '+state.main.display);
                if(state.card.w<540)throw new Error(width+': hotel card too narrow beside filter rail: '+state.card.w);
                if(state.photo.w<270)throw new Error(width+': hotel photo too narrow: '+state.photo.w);
                if(state.body.w<300)throw new Error(width+': hotel body too narrow: '+state.body.w);
              }else if(width>=860){
                if(state.main.display!=='grid')throw new Error(width+': hotel main must stay grid, got '+state.main.display);
                if(state.photo.w<300)throw new Error(width+': hotel photo too narrow: '+state.photo.w);
                if(state.body.w<300)throw new Error(width+': hotel body too narrow: '+state.body.w);
              }else{
                if(state.main.display!=='block')throw new Error(width+': hotel main must stack, got '+state.main.display);
                if(Math.abs(state.photo.w-state.main.w)>4)throw new Error(width+': stacked photo does not span card: '+JSON.stringify({photo:state.photo.w,main:state.main.w}));
                if(state.photo.h<210||state.photo.h>230)throw new Error(width+': tablet photo height drift: '+state.photo.h);
              }
              return state;
            };

            const auditSelected=async width=>{
              await page.setViewportSize({width,height:1000});
              await page.waitForTimeout(120);
              const choose=page.locator('.hotel-card .tour-row .direct-tour[data-tid]:not([data-tid=""])').first();
              if(await choose.count()===0)throw new Error(width+': populated choose-tour CTA missing');
              await choose.scrollIntoViewIfNeeded();
              await choose.click({timeout:10000});
              await page.waitForSelector('#selectedTour:not([hidden]) .selected-head',{timeout:20000});
              await page.waitForSelector('#selectedTour:not([hidden]) .facts',{timeout:10000});
              await page.waitForSelector('#selectedTour:not([hidden]) .lead-form',{timeout:10000});
              await page.waitForTimeout(650);
              const state=await page.evaluate(()=>{
                const root=document.querySelector('#selectedTour:not([hidden])'),head=root?.querySelector('.selected-head'),title=head?.querySelector('h2'),price=head?.querySelector('.selected-price'),facts=root?.querySelector('.facts'),picture=root?.querySelector('.selected-picture'),flights=root?.querySelector('.tour-flights'),lead=root?.querySelector('.lead-form'),leadButton=lead?.querySelector('button[type="submit"],.selected-lead-cta'),back=root?.querySelector('.back-results'),results=document.querySelector('#results');
                const c=el=>{if(!el)return null;const x=el.getBoundingClientRect();return{x:x.x,y:x.y,w:x.width,h:x.height,right:x.right,bottom:x.bottom};};
                return {root:c(root),head:c(head),title:c(title),price:c(price),facts:c(facts),factCount:facts?facts.children.length:0,picture:c(picture),flights:c(flights),lead:c(lead),leadButton:c(leadButton),back:c(back),resultsHidden:!results||results.hidden||getComputedStyle(results).display==='none',overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};
              });
              console.log('SELECTED_TOUR_STATE_'+width,JSON.stringify(state));
              await page.screenshot({path:`anytoour-results-visual/selected-${width}.png`,fullPage:true,animations:'disabled'});
              if(!state.root||!state.head||!state.title||!state.price||!state.facts||!state.lead||!state.back)throw new Error(width+': selected-tour structure missing');
              if(state.factCount<8)throw new Error(width+': selected-tour facts incomplete: '+state.factCount);
              if(state.root.w<280||state.root.right>width+2)throw new Error(width+': selected-tour root geometry invalid: '+JSON.stringify(state.root));
              for(const [name,box] of Object.entries({head:state.head,title:state.title,price:state.price,facts:state.facts,lead:state.lead})) if(box&&(box.x<state.root.x-2||box.right>state.root.right+2))throw new Error(width+': selected '+name+' escapes root');
              if(state.leadButton&&state.leadButton.h<44)throw new Error(width+': selected lead CTA too short: '+state.leadButton.h);
              if(state.overflow)throw new Error(width+': selected-tour horizontal overflow');
              if(width<=768){
                if(state.price.y<state.title.bottom-4)throw new Error(width+': selected price must stack below title: '+JSON.stringify({title:state.title,price:state.price}));
              }else{
                if(state.price.x<=state.title.x)throw new Error(width+': selected price must occupy the secondary header column');
              }
              await page.locator('#selectedTour .back-results').click({timeout:10000});
              await page.waitForSelector('.hotel-card',{state:'visible',timeout:10000});
              await page.waitForTimeout(120);
              const returned=await page.evaluate(()=>{const s=document.getElementById('selectedTour'),r=document.getElementById('results');return{selectedHidden:!s||s.hidden||getComputedStyle(s).display==='none',resultsVisible:!!r&&!r.hidden&&getComputedStyle(r).display!=='none',overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};});
              if(!returned.selectedHidden||!returned.resultsVisible||returned.overflow)throw new Error(width+': return-to-results state invalid: '+JSON.stringify(returned));
              return {...state,returned};
            };

            const states={results:{},selected:{}};
            for(const width of [1440,1024,768]) states.results[width]=await auditResults(width);
            for(const width of [1440,1024,768]) states.selected[width]=await auditSelected(width);
            fs.writeFileSync('anytoour-results-visual/state.json',JSON.stringify(states,null,2));
            if(errors.length)throw new Error('page errors: '+errors.join(' | '));
            await browser.close();
            console.log('ANYTOOUR_RESULTS_SELECTED_TOUR_VISUAL_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-results.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anytoour-results-visual-${{ github.run_id }}
          path: anytoour-results-visual/
          retention-days: 7
