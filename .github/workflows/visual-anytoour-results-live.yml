name: Visual anytoour.ru live results

on:
  workflow_run:
    workflows: ["Deploy anytoour.ru"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-anytoour-results-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  result-card:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: One-shot no-lead local-candidate provider audit
        shell: bash
        run: |
          set -euo pipefail
          export DATE_FROM="$(date -d "+2 day" +%Y-%m-%d)"
          export DATE_TO="$(date -d "+22 day" +%Y-%m-%d)"
          export TEST_NIGHTS="7"
          mkdir -p anytoour-results-visual
          cat > visual-results.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000},extraHTTPHeaders:{'X-AnyTour-CI':'1'}});
            await context.route(/https?:\/\/mc\.yandex\.(ru|com)\//,route=>route.abort());
            const page=await context.newPage();
            const pageErrors=[], network=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('response',response=>{
              try {
                const u=new URL(response.url());
                if(/api-(?:anex|andromeda)-search3-preview\.php$/.test(u.pathname) || /\/v2\/api\//.test(u.pathname)) {
                  network.push({path:u.pathname,status:response.status(),method:response.request().method()});
                }
              } catch (_) {}
            });
            await page.addInitScript(()=>{
              window.__providerEvents=[];
              window.addEventListener('v2:provider-status',event=>{
                const d=event&&event.detail&&typeof event.detail==='object'?event.detail:{};
                window.__providerEvents.push({at:Date.now(),provider:d.provider||null,status:d.status||null,generation:d.generation||null,hotels:d.hotels??null,readyOffers:d.readyOffers??null,errorCode:d.errorCode||null});
              });
            });
            const u=new URL('https://anytoour.ru/_preview/search3-local-candidate/poisk-turov/');
            Object.entries({from:'1',country:'4',dateFrom:process.env.DATE_FROM,dateTo:process.env.DATE_TO,daysFrom:process.env.TEST_NIGHTS,daysTill:process.env.TEST_NIGHTS,count_people:'2',ci_test:'1'}).forEach(([k,v])=>u.searchParams.set(k,v));
            console.log('CI_SEARCH_CONTEXT',JSON.stringify({target:u.pathname,dateFrom:process.env.DATE_FROM,dateTo:process.env.DATE_TO,nights:process.env.TEST_NIGHTS,adults:2,noLead:true}));
            const response=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000});
            if(!response||response.status()!==200)throw new Error('search page HTTP '+(response&&response.status()));
            let cardsVisible=false;
            try { await page.waitForSelector('.hotel-card',{timeout:90000}); cardsVisible=true; } catch (_) {}
            const deadline=Date.now()+90000;
            while(Date.now()<deadline){
              const done=await page.evaluate(()=>{
                const events=window.__providerEvents||[];
                const terminal=new Set(events.filter(x=>x&&['complete','error'].includes(x.status)).map(x=>x.provider));
                return terminal.has('anex')&&terminal.has('andromeda');
              });
              if(done)break;
              await page.waitForTimeout(500);
            }
            await page.waitForTimeout(1000);
            const state=await page.evaluate(()=>{
              const events=window.__providerEvents||[];
              const cards=[...document.querySelectorAll('.hotel-card')];
              const rows=[...document.querySelectorAll('.hotel-card .tour-row')];
              const providerFrom=(el)=>{
                if(!el)return null;
                const attrs=['data-provider','data-source','data-tour-provider'];
                for(const a of attrs){const v=el.getAttribute(a);if(v)return v;}
                const text=(el.innerText||'').toLowerCase();
                if(text.includes('anex'))return'anex';
                if(text.includes('andromeda')||text.includes('само')||text.includes('samo'))return'andromeda';
                if(text.includes('tourvisor')||text.includes('турвизор'))return'tourvisor';
                return null;
              };
              const providerRows={tourvisor:0,anex:0,andromeda:0,unknown:0};
              for(const row of rows){const p=providerFrom(row);if(p&&providerRows[p]!==undefined)providerRows[p]++;else providerRows.unknown++;}
              const ids=cards.slice(0,100).map(card=>({
                anytourHotelId:card.getAttribute('data-anytour-hotel-id')||null,
                legacyHotelId:card.getAttribute('data-hid')||card.getAttribute('data-hotel-id')||null,
                tourRows:card.querySelectorAll('.tour-row').length,
                providers:[...new Set([...card.querySelectorAll('.tour-row')].map(providerFrom).filter(Boolean))]
              }));
              return {events,cardCount:cards.length,tourRowCount:rows.length,providerRows,ids,bodyText:(document.body.innerText||'').slice(0,1200)};
            });
            const evidence={cardsVisible,pageErrors,network,state};
            fs.writeFileSync('anytoour-results-visual/provider-evidence.json',JSON.stringify(evidence,null,2));
            await page.screenshot({path:'anytoour-results-visual/local-candidate-provider-evidence.png',fullPage:true,animations:'disabled'});
            console.log('SEARCH3_LOCAL_PROVIDER_LIVE_EVIDENCE',JSON.stringify(evidence));
            if(pageErrors.length)console.log('SEARCH3_LOCAL_PAGE_ERRORS',JSON.stringify(pageErrors));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node visual-results.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anytoour-local-provider-live-${{ github.run_id }}
          path: anytoour-results-visual/
          retention-days: 7
