name: Visual anytoour.ru live results

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-anytoour-results-live.yml'

permissions:
  contents: read

jobs:
  result-card:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: One-shot local-candidate multi-provider measurement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p anytoour-results-visual
          cat > visual-results.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:1440,height:1000},
              extraHTTPHeaders:{'X-AnyTour-CI':'1'}
            });
            await context.route(/https?:\/\/mc\.yandex\.(ru|com)\//, route=>route.abort());
            const page = await context.newPage();
            const errors = [];
            const api = [];
            page.on('pageerror', error=>errors.push(String(error)));
            await page.addInitScript(()=>{
              window.__providerEvents = [];
              window.addEventListener('v2:provider-status', event=>{
                const detail = event && event.detail && typeof event.detail === 'object' ? event.detail : {};
                window.__providerEvents.push(JSON.parse(JSON.stringify(detail)));
              });
            });
            page.on('response', async response=>{
              try {
                const url = new URL(response.url());
                if (url.origin !== 'https://anytoour.ru') return;
                if (!/(?:api-v2\.php|api-anex-search3-preview\.php|api-andromeda-search3-preview\.php)$/.test(url.pathname)) return;
                const headers = await response.allHeaders();
                const summary = {path:url.pathname,status:response.status(),method:response.request().method()};
                if (String(headers['content-type']||'').includes('json')) {
                  const body = await response.json();
                  const data = body && body.data && typeof body.data === 'object' ? body.data : body;
                  summary.provider = data && data.provider || null;
                  summary.action = data && data.status || null;
                  summary.hotels = Array.isArray(data && data.hotels) ? data.hotels.length : null;
                  summary.offers = Array.isArray(data && data.offers) ? data.offers.length : null;
                  summary.finalReady = Array.isArray(data && data.offers) ? data.offers.filter(x=>x&&x.finalPriceReady===true).length : null;
                  summary.page = data && data.page || null;
                  summary.pagesCount = data && data.pages_count || null;
                  summary.ok = body && body.ok === true;
                  summary.error = body && body.ok === false ? String(body.error||'').slice(0,120) : null;
                }
                api.push(summary);
              } catch (_) {}
            });

            const target = new URL('https://anytoour.ru/_preview/search3-local-candidate/poisk-turov/');
            Object.entries({
              from:'1',country:'4',dateFrom:'2026-10-05',dateTo:'2026-10-05',
              daysFrom:'7',daysTill:'7',count_people:'2',ci_test:'1'
            }).forEach(([key,value])=>target.searchParams.set(key,value));
            console.log('LOCAL_MULTIPROVIDER_SEARCH', target.toString());
            const response = await page.goto(target.toString(),{waitUntil:'domcontentloaded',timeout:45000});
            if(!response || response.status() !== 200) throw new Error('search page HTTP '+(response&&response.status()));
            const firstCard = await page.waitForSelector('.hotel-card',{timeout:60000}).then(()=>true).catch(()=>false);
            const providersTerminal = await page.waitForFunction(()=>{
              const events = window.__providerEvents || [];
              return ['anex','andromeda'].every(provider=>events.some(e=>e&&e.provider===provider&&['complete','error'].includes(e.status)));
            },null,{timeout:75000}).then(()=>true).catch(()=>false);
            await page.waitForTimeout(2500);

            const state = await page.evaluate(({firstCard,providersTerminal})=>{
              const runtimeItems = Array.isArray(window.V2Results?.state?.items) ? window.V2Results.state.items : [];
              const providerOfferCounts = {};
              const providerHotelSets = {};
              for (const hotel of runtimeItems) {
                for (const tour of (Array.isArray(hotel&&hotel.tours) ? hotel.tours : [])) {
                  const provider = String(tour&&tour.provider||'tourvisor_or_core').toLowerCase();
                  providerOfferCounts[provider] = (providerOfferCounts[provider]||0)+1;
                  (providerHotelSets[provider] ||= new Set()).add(String(hotel&&hotel.id||''));
                }
              }
              const providerHotelCounts = Object.fromEntries(Object.entries(providerHotelSets).map(([key,set])=>[key,set.size]));
              const cards = Array.from(document.querySelectorAll('.hotel-card')).map(card=>({
                anytourHotelId:card.dataset.anytourHotelId||null,
                hotelId:card.dataset.hotelId||card.dataset.id||null,
                tourRows:card.querySelectorAll('.tour-row').length,
                chooseButtons:card.querySelectorAll('.direct-tour[data-tid]').length,
                providerDetailButtons:card.querySelectorAll('[data-andromeda-detail]').length
              }));
              return {
                href:location.href,
                title:document.title,
                firstCard,
                providersTerminal,
                providerEvents:window.__providerEvents||[],
                modules:{
                  anex:!!window.AnyTourAnexFinalPriceProvider,
                  andromeda:!!window.AnyTourAndromedaProvider,
                  canonical:!!window.Search3CanonicalProfilesV1
                },
                endpoints:{andromeda:window.V2_CONFIG&&window.V2_CONFIG.andromedaApi||null},
                runtimeHotels:runtimeItems.length,
                runtimeOffers:Object.values(providerOfferCounts).reduce((sum,n)=>sum+n,0),
                providerOfferCounts,
                providerHotelCounts,
                runtimeSample:runtimeItems.slice(0,8).map(h=>({
                  hotelId:String(h&&h.id||''),
                  anytourHotelId:h&&h.anytourHotelId||null,
                  providers:Array.isArray(h&&h.providers)?h.providers:[],
                  tours:(Array.isArray(h&&h.tours)?h.tours:[]).slice(0,8).map(t=>({provider:String(t&&t.provider||'tourvisor_or_core'),id:String(t&&t.id||'').slice(0,120),price:Number(t&&t.price)||0,fuelIncluded:t&&t.fuelIncluded===true,selectionEnabled:t&&t.selectionEnabled!==false}))
                })),
                cards:cards.length,
                tourRows:document.querySelectorAll('.hotel-card .tour-row').length,
                sampleCards:cards.slice(0,8),
                resultsText:(document.querySelector('#results')?.innerText||'').slice(0,1800)
              };
            },{firstCard,providersTerminal});
            state.api = api;
            state.pageErrors = errors;
            fs.writeFileSync('anytoour-results-visual/state.json',JSON.stringify(state,null,2));
            await page.screenshot({path:'anytoour-results-visual/local-multiprovider.png',fullPage:true,animations:'disabled'});
            console.log('LOCAL_MULTIPROVIDER_STATE',JSON.stringify(state));
            await browser.close();
            console.log('SEARCH3_LOCAL_MULTIPROVIDER_MEASURED');
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
          node visual-results.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search3-local-multiprovider-${{ github.run_id }}
          path: anytoour-results-visual/
          retention-days: 3
