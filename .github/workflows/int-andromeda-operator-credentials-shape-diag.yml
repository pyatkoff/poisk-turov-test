name: INT Andromeda operator credential shape diag

on:
  push:
    branches: ['diag/int-andromeda-operator-credentials-shape-20260918']
    paths:
      - '.github/workflows/int-andromeda-operator-credentials-shape-diag.yml'

permissions:
  contents: read

jobs:
  diagnose:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: 2c712e70e9eb2df99270fc46e46c58f08dd10a11
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 8
          persist-credentials: false

      - name: Bind read-only diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/int-andromeda-operator-credentials-shape-diag.yml'
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY"
          test -n "$ANYTOOUR_DEPLOY_HOST"
          test -n "$ANYTOOUR_DEPLOY_USER"

      - name: Inspect source support and private config shape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          source_support=false
          if grep -R -E -q 'OPERATOR_(LOGIN|PASSWORD)|operator_(login|password)'             app/integrations/andromeda-*.php v2/api-andromeda-quote-preview.php 2>/dev/null; then
            source_support=true
          fi

          key="$RUNNER_TEMP/key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$ANYTOOUR_DEPLOY_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          opts=(-T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)

          ssh "${opts[@]}" "$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST" php -d display_errors=0 <<'PHP' > "$RUNNER_TEMP/result/private.json"
          <?php
          declare(strict_types=1);
          error_reporting(0);
          $home=(string)getenv('HOME');
          $path=rtrim($home,'/').'/.anytoour-andromeda/search3-preview.php';
          if(!is_file($path)||is_link($path))throw new RuntimeException('private_config_missing');
          $size=filesize($path);
          if(!is_int($size)||$size<1||$size>65536)throw new RuntimeException('private_config_bound');
          $cfg=require $path;
          if(!is_array($cfg))throw new RuntimeException('private_config_invalid');

          $login=false;$password=false;
          $walk=function(mixed $value,string $prefix='',int $depth=0)use(&$walk,&$login,&$password):void{
              if($depth>5||!is_array($value))return;
              $seen=0;
              foreach($value as $key=>$item){
                  if(++$seen>128)break;
                  $name=is_string($key)?strtolower($key):(string)$key;
                  $path=$prefix===''?$name:$prefix.'.'.$name;
                  $nonEmpty=is_string($item)&&$item!=='';
                  if($nonEmpty && preg_match('/(?:operator|tour.?operator).*?(?:login|username)|(?:login|username).*?(?:operator|tour.?operator)/i',$path)===1)$login=true;
                  if($nonEmpty && preg_match('/(?:operator|tour.?operator).*?password|password.*?(?:operator|tour.?operator)/i',$path)===1)$password=true;
                  if(is_array($item))$walk($item,$path,$depth+1);
              }
          };
          $walk($cfg);
          echo json_encode([
              'status'=>'complete',
              'enabled'=>($cfg['enabled']??null)===true,
              'operator_login_present'=>$login,
              'operator_password_present'=>$password,
              'operator_credentials_pair_present'=>$login&&$password,
              'supplier_calls'=>0,
              'db_reads'=>0,
              'db_writes'=>0,
              'booking_calls'=>0,
              'search3_publication'=>0
          ],JSON_THROW_ON_ERROR|JSON_UNESCAPED_SLASHES),PHP_EOL;
          PHP

          SOURCE_SUPPORT="$source_support" python3 - <<'PY'
          import json, os
          p=os.environ['RUNNER_TEMP']+'/result/private.json'
          d=json.load(open(p))
          out={
            'status':d['status'],
            'private_enabled':bool(d['enabled']),
            'operator_login_present':bool(d['operator_login_present']),
            'operator_password_present':bool(d['operator_password_present']),
            'operator_credentials_pair_present':bool(d['operator_credentials_pair_present']),
            'source_operator_credentials_supported':os.environ['SOURCE_SUPPORT']=='true',
            'supplier_calls':0,'db_reads':0,'db_writes':0,'booking_calls':0,'search3_publication':0,
          }
          json.dump(out,open(os.environ['RUNNER_TEMP']+'/result/receipt.json','w'),sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Preserve sanitized diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: int-andromeda-operator-credentials-shape-${{ github.run_id }}
          path: ${{ runner.temp }}/result/receipt.json
          if-no-files-found: warn
          retention-days: 30
