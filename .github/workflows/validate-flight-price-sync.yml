name: Validate V2 flight price sync
on:
  push:
    branches: [main]
    paths:
      - 'v2/flight-price-sync-v1.js'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/flight-price-sync-v1.js
          grep -q "v2:flight-selected" v2/flight-price-sync-v1.js
          grep -q "Стоимость с выбранным рейсом" v2/flight-price-sync-v1.js
          grep -q "flightPrice - basePrice" v2/flight-price-sync-v1.js
          ! grep -q "basePrice + flightPrice" v2/flight-price-sync-v1.js
