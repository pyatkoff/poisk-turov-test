          PREVIEW_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          PREVIEW_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
        run: python3 scripts/deploy/search3_root_gateway_install.py context_sender_continue
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'search3-tv-context-continuation-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            ${{ runner.temp }}/search3-tv-context-continuation/evidence.json
            ${{ runner.temp }}/search3-tv-context-continuation/request.json
            ${{ runner.temp }}/search3-tv-context-continuation/tourvisor-anytour-offer-autosave.php
