    concurrency: {group: deploy-anytoour-production, cancel-in-progress: false}
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' && github.run_attempt == 1 &&
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 4709 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 && github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == format('/continue-search3-tv-search-context {0} install-20261022-tv-search-context-verified-continuation-v1', github.sha)
