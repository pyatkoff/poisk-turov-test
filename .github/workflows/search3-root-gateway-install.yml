name: Install checked Search3 root gateway
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/search3-root-gateway-install.yml','scripts/deploy/search3_root_gateway_install.py','scripts/deploy/search3_root_gateway_inspect.py','scripts/deploy/search3_root_gateway_incident.py','tests/search3_root_gateway_install_test.py','scripts/deploy/search3_root_gateway_live_check.py','tests/search3_root_gateway_live_check_test.py']
  issue_comment:
    types: [created]
permissions: {contents: read}
jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false}
      - run: python3 -m py_compile scripts/deploy/search3_root_gateway_install.py scripts/deploy/search3_root_gateway_inspect.py scripts/deploy/search3_root_gateway_incident.py
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: d6780854c16f390ec9ad3117a484e72e0851c884, path: recovery-product-source, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: 8bb7336cfa8e6e702ea656c762fe331a1c8283c6, path: recovery-local-source, persist-credentials: false}
      - env:
          SEARCH3_CHECKED_INSTALL_NATIVE_CI: '1'
          SEARCH3_DEPENDENCY_INSTALL_NATIVE_CI: '1'
          RECOVERY_PRODUCT_SOURCE_ROOT: '${{ github.workspace }}/recovery-product-source'
          RECOVERY_LOCAL_SOURCE_ROOT: '${{ github.workspace }}/recovery-local-source'
        run: python3 tests/search3_root_gateway_install_test.py
  live-check-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false}
      - env: {SEARCH3_ANEX_KEY_NATIVE_CI: '1'}
        run: python3 tests/search3_root_gateway_live_check_test.py
  tv-diagnostic-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: 19694ed619b57001f32b81c793d862a574a47e0e, path: tv-diagnostic-source, persist-credentials: false}
      - env:
          TV_DIAGNOSTIC_NATIVE_CI: '1'
          TV_DIAGNOSTIC_PRODUCT_SOURCE_ROOT: '${{ github.workspace }}/tv-diagnostic-source'
        run: python3 tests/search3_root_gateway_install_test.py TvDiagnosticInstall
  context-sender-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: 20e669cfbc7d99d9463a87fd9aee257f188df7ab, path: context-sender-source, persist-credentials: false}
      - env:
          TV_CONTEXT_SENDER_NATIVE_CI: '1'
          TV_CONTEXT_SENDER_SOURCE_ROOT: '${{ github.workspace }}/context-sender-source'
        run: python3 tests/search3_root_gateway_install_test.py ContextSenderInstall ContextSenderContinue
