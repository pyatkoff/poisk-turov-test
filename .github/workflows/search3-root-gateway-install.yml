    timeout-minutes: 5
    permissions: {contents: read, issues: read, checks: read, actions: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', persist-credentials: false}
