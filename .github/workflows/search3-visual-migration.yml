name: Search3 full visual migration
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'v2/visual-search/**'
      - 'scripts/build/search3-js/**'
      - 'v2/prototype-search/config.js'
      - 'v2/runtime-v3.js'
      - 'v2/lead-search-context.js'
      - 'v2/tour-controller-v4.js'
      - 'v2/lead-form-guard-v1.js'
      - 'v2/search3-canonical-profiles-v1.js'
      - 'v2/search3-local-db-provider-v1.js'
      - 'v2/prototype-search/data.js'
      - 'v2/prototype-search/calendar-exact-hotel-v1.js'
      - 'v2/prototype-search/source-receipt-v1.js'
      - 'v2/prototype-search/search-lifecycle-v1.js'
      - 'v2/prototype-search/lead.js'
      - 'v2/prototype-search/hotel-popularity-v1.js'
      - 'v2/data/hotel-popularity-v1.php'
      - 'tests/search3-visual-*.cjs'
      - 'tests/search3-visual-performance-pins.json'
      - 'tests/search3-visual-performance-artifacts.py'
      - 'tests/search3-prototype-*.cjs'
      - '.github/workflows/search3-visual-migration.yml'
permissions:
  contents: read
jobs:
  focused-presentation:
    # Drafts retain affected-owner checks without installing a browser matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/facet-tools" --no-audit --no-fund --no-save jsdom@26.1.0
      - name: Verify affected presentation owners and CI restoration
        run: |
          export NODE_PATH="$RUNNER_TEMP/facet-tools/node_modules"
          node tests/search3-visual-facet-presentation.cjs
          node tests/search3-visual-ci-coverage.cjs
          node tests/search3-visual-formatting.cjs
          node tests/search3-visual-calendar-inventory.cjs
          node tests/search3-visual-flight-filter-work.cjs
          node tests/search3-visual-results-rendering.cjs
          node tests/search3-visual-offer-list-lazy.cjs
          node tests/search3-visual-hotel-details-lazy.cjs
          node tests/search3-visual-hotel-content-text.cjs
          node tests/search3-visual-passive-contexts.cjs
          node tests/search3-visual-event-dispatch.cjs
  visual-migration:
    # OWNER_PRIORITY: full responsive coverage returns when the draft is ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/visual-tools" --no-audit --no-fund --no-save jsdom@26.1.0 playwright@1.55.0
      - run: "$RUNNER_TEMP/visual-tools/node_modules/.bin/playwright install --with-deps chromium"
      - name: Build the exact compiled visual fixture graph
        run: |
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          cp -a v2 "$RUNNER_TEMP/visual-compiled"
          node scripts/build/search3-js/visual-entry.cjs "$RUNNER_TEMP/visual-compiled"
          node tests/search3-visual-asset-size.cjs "$RUNNER_TEMP/visual-compiled"
      - name: Full transferred UI and isolated live integration
        run: |
          export NODE_PATH="$RUNNER_TEMP/visual-tools/node_modules"
          node tests/search3-visual-facet-presentation.cjs
          node tests/search3-visual-ci-coverage.cjs
          node tests/search3-visual-lifecycle-scheduling.cjs
          node tests/search3-visual-flight-rendering.cjs
          node tests/search3-visual-data-orchestration.cjs
          node tests/search3-visual-event-dispatch.cjs
          node tests/search3-visual-modal-history.cjs
          node tests/search3-visual-offer-list-lazy.cjs
          node tests/search3-visual-hotel-details-lazy.cjs
          node tests/search3-visual-hotel-details-rendering.cjs
          node tests/search3-visual-hotel-content-text.cjs
          SEARCH3_VISUAL_ASSET_ROOT="$RUNNER_TEMP/visual-compiled" node tests/search3-visual-offer-list-browser.cjs
          SEARCH3_VISUAL_ASSET_ROOT="$RUNNER_TEMP/visual-compiled" node tests/search3-visual-hotel-details-browser.cjs
          SEARCH3_VISUAL_ASSET_ROOT="$RUNNER_TEMP/visual-compiled" node tests/search3-visual-terminal-offer-browser.cjs
          node tests/search3-visual-offer-rendering.cjs
          node tests/search3-visual-migration.cjs
          node tests/search3-visual-live-bridge.cjs
          node tests/search3-visual-anex-flight-continuation.cjs
          SEARCH3_VISUAL_ASSET_ROOT="$RUNNER_TEMP/visual-compiled" node tests/search3-visual-live-browser.cjs
          node tests/search3-visual-v139-search-edit-tests.cjs
          node tests/search3-visual-v120-recorded-journey-tests.cjs
          php -l v2/visual-search/index.php
          php -r '$_SERVER["SCRIPT_NAME"]="/poisk-turov/index.php"; ob_start(); include "v2/visual-search/index.php";' | grep -Fq 'only available in its separate preview'
          php -r '$_SERVER["SCRIPT_NAME"]="/_preview/search3-next-candidate/visual-search/index.php"; include "v2/visual-search/index.php";' | grep -Eq 'app.js\?v=[0-9a-f]{12}'
      - name: Verify and materialize frozen performance artifact comparison
        if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostics/search3-performance-20261003' }}
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/search3-visual-performance-artifacts.py --output "$RUNNER_TEMP/performance-artifacts"
      - name: Measure actual compiled browser actions in paired trials
        if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostics/search3-performance-20261003' }}
        timeout-minutes: 4
        run: |
          export NODE_PATH="$RUNNER_TEMP/visual-tools/node_modules"
          node tests/search3-visual-performance.cjs --baseline-root "$RUNNER_TEMP/performance-artifacts/baseline/v2" --candidate-root "$RUNNER_TEMP/performance-artifacts/candidate/v2" --output visual-live-evidence/compiled-benchmark
      - name: Retain visual bridge acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-visual-live-acceptance-${{ github.event.pull_request.head.sha }}
          path: visual-live-evidence/
          if-no-files-found: warn
