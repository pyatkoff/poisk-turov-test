name: Search3 full visual migration
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'v2/visual-search/**'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/site-path-v1.php'
      - 'v2/phone-value.php'
      - 'v2/asset-version-v1.php'
      - 'v2/home-v1.php'
      - 'v2/home-v1.css'
      - 'v2/home-hero-v1.jpg'
      - 'scripts/build/search3-js/**'
      - 'scripts/build/search3_production_inventory.py'
      - 'scripts/build/search3_public_candidate.py'
      - 'scripts/deploy/search3_production_snapshot.py'
      - 'v2/prototype-search/config.js'
      - 'v2/runtime-v3.js'
      - 'v2/analytics-v4.js'
      - 'v2/analytics-config.php'
      - 'v2/seo-config.php'
      - 'v2/lead-search-context.js'
      - 'v2/tour-controller-v4.js'
      - 'v2/lead-form-guard-v1.js'
      - 'v2/search3-canonical-profiles-v1.js'
      - 'v2/search3-local-db-provider-v1.js'
      - 'v2/prototype-search/data.js'
      - 'v2/prototype-search/messenger-context-v1.js'
      - 'v2/prototype-search/messenger-flow-v1.js'
      - 'tests/search3-messenger-context.cjs'
      - 'tests/search3-messenger-flow.cjs'
      - 'v2/prototype-search/calendar-exact-hotel-v1.js'
      - 'v2/prototype-search/source-receipt-v1.js'
      - 'v2/prototype-search/search-lifecycle-v1.js'
      - 'v2/prototype-search/lead.js'
      - 'v2/prototype-search/hotel-popularity-v1.js'
      - 'v2/data/hotel-popularity-v1.php'
      - 'tests/search3-visual-*.cjs'
      - 'tests/search3-public-*.cjs'
      - 'tests/search3_public_entry_test.py'
      - 'tests/fixtures/search3-preview-entry-before-public.php'
      - 'scripts/ci/search3_visual_browser_dependencies.cjs'
      - 'scripts/ci/search3_visual_evidence_retention.cjs'
      - 'tests/search3-prototype-*.cjs'
      - 'tests/local-tv-catalog-browser.cjs'
      - 'tests/local-tv-catalog-test.php'
      - 'v2/data/local-tv-catalog*.php'
      - 'v2/data/migrations/20261010-local-tv-catalog.sql'
      - '.github/workflows/search3-visual-migration.yml'
      - '.github/workflows/build-search3-whole-site-preview.yml'
permissions:
  contents: read
concurrency:
  group: ci-search3-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-presentation:
    # Drafts retain affected-owner checks without installing a browser matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix "$RUNNER_TEMP/facet-tools" --no-audit --no-fund --no-save jsdom@26.1.0
      - name: Verify affected presentation owners and CI restoration
        run: |
          export NODE_PATH="$RUNNER_TEMP/facet-tools/node_modules"
          node tests/search3-messenger-context.cjs
          node tests/search3-messenger-flow.cjs
          node tests/search3-prototype-messenger-handoff.cjs
          node tests/search3-visual-messenger-entry.cjs
          node tests/search3-visual-facet-presentation.cjs
          node tests/search3-visual-ci-coverage.cjs
          node tests/search3-public-entry.cjs
          node tests/search3-public-bindings.cjs
          node tests/search3-visual-browser-dependencies.cjs
          node tests/search3-visual-evidence-retention.cjs
          node tests/search3-visual-formatting.cjs
          node tests/search3-visual-calendar-inventory.cjs
          node tests/search3-visual-flight-filter-work.cjs
          node tests/search3-visual-results-rendering.cjs
          node tests/search3-visual-offer-list-lazy.cjs
          node tests/search3-visual-hotel-details-lazy.cjs
          node tests/search3-visual-hotel-content-text.cjs
          node tests/search3-visual-passive-contexts.cjs
          node tests/search3-visual-event-dispatch.cjs
          node tests/search3-visual-result-merge.cjs
          node tests/local-tv-catalog-browser.cjs
  integration-contracts:
    # Raw-source contracts run independently of the compiled browser matrix.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/contract-tools" --no-audit --no-fund --no-save jsdom@26.1.0
      - name: Verify complete raw-source integration contracts
        run: |
          export NODE_PATH="$RUNNER_TEMP/contract-tools/node_modules"
          node tests/search3-visual-offer-rendering.cjs
          node tests/search3-visual-migration.cjs
          node tests/search3-visual-live-bridge.cjs
          node tests/search3-visual-anex-flight-continuation.cjs
          node tests/search3-visual-v139-search-edit-tests.cjs
          node tests/search3-visual-v120-recorded-journey-tests.cjs
          python3 -B tests/search3_public_entry_test.py
  browser-matrix:
    # OWNER_PRIORITY: full responsive coverage returns when the draft is ready.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    # Existing full journey plus the five-width LOCAL SQL/API/browser acceptance.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The review artifact compares this head with one exact retained main commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/visual-tools" --no-audit --no-fund --no-save jsdom@26.1.0 playwright@1.55.0
      - name: Inspect installed Chromium system dependencies
        id: browser-deps
        run: node scripts/ci/search3_visual_browser_dependencies.cjs "$RUNNER_TEMP/visual-tools/node_modules/.bin/playwright"
      - name: Prefer the existing HTTPS Ubuntu package mirror
        if: ${{ steps.browser-deps.outputs.ready != 'true' }}
        run: sudo -- "$(command -v node)" scripts/ci/search3_visual_browser_dependencies.cjs --prefer-ubuntu-mirror
      - name: Install missing Chromium system dependencies
        if: ${{ steps.browser-deps.outputs.ready != 'true' }}
        run: "$RUNNER_TEMP/visual-tools/node_modules/.bin/playwright install-deps chromium"
      - name: Install pinned Playwright Chromium
        run: "$RUNNER_TEMP/visual-tools/node_modules/.bin/playwright install chromium"
      - name: Build the exact compiled visual fixture graph
        run: |
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          cp -a v2 "$RUNNER_TEMP/visual-compiled"
          node scripts/build/search3-js/visual-entry.cjs "$RUNNER_TEMP/visual-compiled"
          node tests/search3-visual-asset-size.cjs "$RUNNER_TEMP/visual-compiled"
      - name: Build the isolated public review against exact main
        id: public-review-build
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B scripts/build/search3_public_candidate.py \
            --repo . --candidate-sha "$SOURCE_SHA" \
            --main-sha f6b7513445f599f332c5d9d4021b2537e2d3d609 \
            --output "$RUNNER_TEMP/search3-public-review" \
            --node-modules "$PWD/scripts/build/search3-js/node_modules"
      - name: Verify public review mobile and desktop journey
        env:
          NODE_PATH: ${{ runner.temp }}/visual-tools/node_modules
          SEARCH3_PUBLIC_REVIEW_ROOT: ${{ runner.temp }}/search3-public-review
        run: node tests/search3-public-review-browser.cjs
      - name: Retain exact public review and local rollback evidence
        if: ${{ always() && steps.public-review-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-public-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/search3-public-review/
          if-no-files-found: error
      - name: Build the offline public LIVE candidate against inspected main
        id: public-live-build
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B scripts/build/search3_public_candidate.py \
            --repo . --candidate-sha "$SOURCE_SHA" \
            --main-sha f6b7513445f599f332c5d9d4021b2537e2d3d609 \
            --profile live --output "$RUNNER_TEMP/search3-public-live" \
            --node-modules "$PWD/scripts/build/search3-js/node_modules"
      - name: Verify the mixed-main compiled public LIVE graph with fictional transports
        env:
          NODE_PATH: ${{ runner.temp }}/visual-tools/node_modules
          SEARCH3_PUBLIC_LIVE_ROOT: ${{ runner.temp }}/search3-public-live
        run: node tests/search3-public-live-browser.cjs
      - name: Retain exact offline LIVE candidate and rollback evidence
        if: ${{ always() && steps.public-live-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-public-live-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/search3-public-live/
          if-no-files-found: error
      - name: Affected messenger flow on the exact compiled graph
        env:
          NODE_PATH: ${{ runner.temp }}/visual-tools/node_modules
          SEARCH3_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SEARCH3_VISUAL_ASSET_ROOT: ${{ runner.temp }}/visual-compiled
        run: node tests/search3-visual-live-browser.cjs --messenger-only
      - name: Retain affected messenger frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-messenger-${{ github.event.pull_request.head.sha }}
          path: visual-live-evidence/messenger-entry/
          compression-level: 0
          if-no-files-found: error
      - name: Source contracts for transferred UI
        run: |
          export NODE_PATH="$RUNNER_TEMP/visual-tools/node_modules"
          node tests/search3-visual-lifecycle-scheduling.cjs
          node tests/search3-visual-flight-rendering.cjs
          node tests/search3-visual-data-orchestration.cjs
          node tests/search3-visual-modal-history.cjs
          node tests/search3-visual-hotel-details-rendering.cjs
      - name: Independent compiled browser scenarios
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/visual-tools/node_modules
          SEARCH3_VISUAL_ASSET_ROOT: ${{ runner.temp }}/visual-compiled
        run: |
          (
            node tests/search3-visual-offer-list-browser.cjs
          ) &
          offer_list=$!
          (
            node tests/search3-visual-hotel-details-browser.cjs
            node tests/local-tv-catalog-browser.cjs --browser
            node tests/search3-visual-terminal-offer-browser.cjs
          ) &
          hotel_and_catalog=$!
          result=0
          wait "$offer_list" || result=1
          wait "$hotel_and_catalog" || result=1
          exit "$result"
      - name: Full transferred UI and isolated live integration
        run: |
          export NODE_PATH="$RUNNER_TEMP/visual-tools/node_modules"
          SEARCH3_VISUAL_ASSET_ROOT="$RUNNER_TEMP/visual-compiled" node tests/search3-visual-live-browser.cjs
          php -l v2/visual-search/index.php
          php -r '$_SERVER["SCRIPT_NAME"]="/poisk-turov/index.php"; ob_start(); include "v2/visual-search/index.php";' | grep -Fq 'only available in its separate preview'
          php -r '$_SERVER["SCRIPT_NAME"]="/_preview/search3-next-candidate/visual-search/index.php"; include "v2/visual-search/index.php";' | grep -Eq 'app.js\?v=[0-9a-f]{12}'
      - name: Package complete visual acceptance in bounded parts
        id: acceptance-parts
        if: always()
        env:
          ACCEPTANCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          source = pathlib.Path("visual-live-evidence")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "visual-acceptance-parts"
          limit = 24 * 1024 * 1024
          parts = [[] for _ in range(5)]
          sizes = [0] * len(parts)
          if target.exists():
              raise SystemExit("Acceptance parts output already exists")
          entries = []
          for file in sorted(source.rglob("*")):
              if file.is_symlink():
                  raise SystemExit("Acceptance evidence must not contain symlinks")
              if file.is_file():
                  content = file.read_bytes()
                  entries.append({"path": file.relative_to(source).as_posix(),
                                  "bytes": len(content),
                                  "sha256": hashlib.sha256(content).hexdigest()})
          if not entries:
              raise SystemExit("No visual acceptance evidence to retain")
          for entry in sorted(entries, key=lambda row: (-row["bytes"], row["path"])):
              part = min(range(len(parts)), key=lambda index: sizes[index])
              if sizes[part] + entry["bytes"] > limit:
                  raise SystemExit("Complete acceptance evidence exceeds five bounded parts")
              entry["part"] = f"{part + 1:02d}"
              parts[part].append(entry)
              sizes[part] += entry["bytes"]
          inventory = {"schema": 1, "source_sha": os.environ["ACCEPTANCE_SOURCE_SHA"],
                       "run_id": os.environ["GITHUB_RUN_ID"],
                       "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                       "file_count": len(entries), "total_bytes": sum(sizes),
                       "files": entries,
                       "parts": [{"id": f"{index + 1:02d}", "file_count": len(rows),
                                  "bytes": sizes[index]} for index, rows in enumerate(parts) if rows]}
          index_bytes = (json.dumps(inventory, sort_keys=True, separators=(",", ":")) + "\n").encode()
          seen = set()
          for index, rows in enumerate(parts):
              if not rows:
                  continue
              # Leave headroom for the shared inventory and ZIP names/metadata.
              overhead = len(index_bytes) + sum(2 * len(row["path"].encode()) + 256 for row in rows) + 1024
              if sizes[index] + overhead >= 31 * 1024 * 1024:
                  raise SystemExit("Acceptance part would exceed safe transfer size")
              folder = target / f"part-{index + 1:02d}"
              for row in rows:
                  name = row["path"]
                  if name in seen:
                      raise SystemExit("Duplicate acceptance evidence path")
                  seen.add(name)
                  output = folder / "evidence" / name
                  output.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source / name, output)
                  content = output.read_bytes()
                  if len(content) != row["bytes"] or hashlib.sha256(content).hexdigest() != row["sha256"]:
                      raise SystemExit("Acceptance evidence changed while packaging")
              (folder / "acceptance-index.json").write_bytes(index_bytes)
          if seen != {row["path"] for row in entries}:
              raise SystemExit("Incomplete acceptance evidence")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for index, rows in enumerate(parts):
                  output.write(f"part{index + 1:02d}={'true' if rows else 'false'}\n")
          print(json.dumps({"file_count": len(entries), "total_bytes": sum(sizes),
                            "index_sha256": hashlib.sha256(index_bytes).hexdigest(),
                            "parts": inventory["parts"]}, sort_keys=True))
          PY
      - name: Retain visual bridge acceptance part 01
        if: ${{ always() && steps.acceptance-parts.outputs.part01 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-visual-live-acceptance-${{ github.event.pull_request.head.sha }}-part-01
          path: ${{ runner.temp }}/visual-acceptance-parts/part-01/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain visual bridge acceptance part 02
        if: ${{ always() && steps.acceptance-parts.outputs.part02 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-visual-live-acceptance-${{ github.event.pull_request.head.sha }}-part-02
          path: ${{ runner.temp }}/visual-acceptance-parts/part-02/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain visual bridge acceptance part 03
        if: ${{ always() && steps.acceptance-parts.outputs.part03 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-visual-live-acceptance-${{ github.event.pull_request.head.sha }}-part-03
          path: ${{ runner.temp }}/visual-acceptance-parts/part-03/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain visual bridge acceptance part 04
        if: ${{ always() && steps.acceptance-parts.outputs.part04 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-visual-live-acceptance-${{ github.event.pull_request.head.sha }}-part-04
          path: ${{ runner.temp }}/visual-acceptance-parts/part-04/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain visual bridge acceptance part 05
        if: ${{ always() && steps.acceptance-parts.outputs.part05 == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-visual-live-acceptance-${{ github.event.pull_request.head.sha }}-part-05
          path: ${{ runner.temp }}/visual-acceptance-parts/part-05/
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
  visual-migration:
    # Preserve the existing required status; every exact-source lane must pass.
    needs: [focused-presentation, integration-contracts, browser-matrix]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every full visual acceptance lane
        env:
          FOCUSED_RESULT: ${{ needs.focused-presentation.result }}
          CONTRACTS_RESULT: ${{ needs.integration-contracts.result }}
          BROWSER_RESULT: ${{ needs.browser-matrix.result }}
        run: |
          set -euo pipefail
          test "$FOCUSED_RESULT" = success
          test "$CONTRACTS_RESULT" = success
          test "$BROWSER_RESULT" = success
