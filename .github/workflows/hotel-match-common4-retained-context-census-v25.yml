name: MATCH COMMON4 retained context census v25
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php'
      - 'tests/hotel_match_common4_retained_context_census_v25_test.php'
      - '.github/workflows/hotel-match-common4-retained-context-census-v25.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-common4-retained-context-census-1971-20260925-v25, cancel-in-progress: false}
env:
  OP: hotel-match-common4-retained-context-census-1971-20260925-v25
  BASE: c3b28595541ecb85286227aa146d70329bf324f3
  CLAIM: '5831028639'
  POST_ARTIFACT: '10859521211'
  POST_ARCHIVE_SHA: 73a9bc1abae746c93945b65daa54ba335cdf29e85a7391f8ae06b320616b9371
  POST_RESULT_SHA: 9830e34afb9bd27439dd7d6a2a0c8b869f05b4c159027ffb1a0da8055bd2c706
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-retained-context-census-v25-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: php -l scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php
      - run: php scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php --self-test
      - run: php tests/hotel_match_common4_retained_context_census_v25_test.php
      - run: "! grep -E 'curl_|https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\\(' scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php"
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-retained-context-census-v25-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim Security and postwrite artifact
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/post terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-common4-retained-context-census-v25.yml scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php tests/hotel_match_common4_retained_context_census_v25_test.php "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'operator_5=1516','operator_315=1304','Provider/Tourvisor/SAMO/ANEX/Andromeda HTTP0']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$POST_ARTIFACT/zip" -o input/post.zip
          test "$(sha256sum input/post.zip|awk '{print $1}')" = "$POST_ARCHIVE_SHA"
          unzip -q input/post.zip -d input/post
          result="$(find input/post -type f -name result.json -print -quit)";receipt="$(find input/post -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/post-result.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          r=json.load(open('input/post-result.json'));h=hashlib.sha256(pathlib.Path('input/post-result.json').read_bytes()).hexdigest()
          assert h==os.environ['POST_RESULT_SHA']
          assert r['operation']=='hotel-match-samo-business-live30-common4-postwrite-1971-20260925-v24'
          assert r['state']=='samo_business_live30_common4_plan_ready'
          assert r['deduped_missing_lane_counts']=={'operator_5':1516,'operator_115':1218,'operator_315':1304,'operator_342':667}
          assert r['deduped_lane_state_conflicts']==0
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          PY
      - name: Run supplier-free retained context census
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_retained_read','postwrite_result_sha256':os.environ['POST_RESULT_SHA'],'provider_http_calls':0,'database_writes':0,'mapping_writes':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/post-result.json "$remote:$op/payload/post-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php "$remote:$op/payload/scripts/diagnostics/"
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_POST_RESULT=\"\$HOME/$op/payload/post-result.json\" MATCH_POST_RESULT_SHA='$POST_RESULT_SHA' MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_common4_retained_context_census_v25.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$op/result.json\"" >terminal/result.json
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$op/receipt.json\"" >terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['state']=='completed_supplier_free_retained_context_census'
          assert r['current_missing_targets']=={'5':1516,'315':1304}
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==r['retained_search_mutations']==0
          print(json.dumps({k:r[k] for k in ['state','current_missing_targets','files_examined','parseable_retained_page_files','retained_operator_offer_rows','contexts_with_operator_offers','zero_missing_overlap_contexts','top_contexts_by_operator']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-retained-context-census-v25-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
