      - tests/hotel_match_tv_samo_side4_saved_token_alias_v11_test.php
      - .github/workflows/hotel-match-tv-samo-side4-saved-token-alias-v11-ci.yml
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6e75b540449e92b4886f43607fa02
      - run: php -l scripts/diagnostics/hotel_match_tv_samo_side4_saved_token_alias_v11.php
      - run: php tests/hotel_match_tv_samo_side4_saved_token_alias_v11_test.php
      - run: "! grep -Fq 'levenshtein(' scripts/diagnostics/hotel_match_tv_samo_side4_saved_token_alias_v11.php"
