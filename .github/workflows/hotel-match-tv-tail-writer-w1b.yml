name: MATCH TV tail writer W1b
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths: ['.github/workflows/hotel-match-tv-tail-writer-w1b.yml']
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: match-tv-tail-w1b-20260924, cancel-in-progress: false}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim and Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail
          test "$(git diff --name-only dd659dfdec6ad5bc69683c545ab637070d865cf7..HEAD | tr '\n' ' ')" = ".github/workflows/hotel-match-tv-tail-writer-w1b.yml "
          gh api repos/$GITHUB_REPOSITORY/issues/comments/5804553997 >claim.json
          grep -q 'exact expected writes=300' claim.json
          for i in $(seq 1 60); do
            x="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD&per_page=100" --jq '.workflow_runs[]|select(.name=="Security guard")|[.status,.conclusion]|@tsv' | head -1)"
            [ "$x" = $'completed\tsuccess' ] && break
            sleep 3
          done
          [ "$x" = $'completed\tsuccess' ]
      - name: Execute guarded writer
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail; umask 077; mkdir -p terminal
          key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/h"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 -d>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null)
          op=".anytoour-match/operations/hotel-match-common4-tail-writer-1971-20260924-v15-w1b"
          audit=".anytoour-match/operations/hotel-match-common4-tail-current-1971-20260924-v15/result.json"
          ssh "${opts[@]}" "$remote" "python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path.home()/'$audit'; r=json.loads(p.read_text())
          assert r['operation']=='hotel-match-common4-mass-current-1971-20260924-v14'
          assert r['state']=='completed_read_only_mass_current'
          assert r['writer_ready_counts']=={'identity':367,'anex':41}
          assert r['supplier_calls']==r['database_writes']==r['mapping_writes']==0
          PY
          test ! -e "\$HOME/$op"; mkdir -p "\$HOME/$op/payload"
          cp "\$HOME/$audit" "\$HOME/$op/payload/audit-result.json"
          printf '%s\n' '{"state":"reserved_before_write","expected_writes":300,"write_offset":0}' >"\$HOME/$op/reservation.json""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_common4_tail_writer_v15.php "$remote:$op/payload/"
          auditsha="$(ssh "${opts[@]}" "$remote" "sha256sum "\$HOME/$op/payload/audit-result.json"|awk '{print \$1}'")"
          set +e
          ssh "${opts[@]}" "$remote" "cd "\$HOME/www/anytoour.ru"; ANYTOUR_ROOT="\$HOME/www/anytoour.ru" MATCH_OPERATION_DIR="\$HOME/$op" MATCH_AUDIT_RESULT="\$HOME/$op/payload/audit-result.json" MATCH_AUDIT_SHA='$auditsha' MATCH_SOURCE_SHA='$HEAD' MATCH_EXPECTED_WRITES=300 MATCH_WRITE_OFFSET=0 php "\$HOME/$op/payload/hotel_match_common4_tail_writer_v15.php" --execute" >terminal/out 2>terminal/err
          status=$?; set -e
          ssh "${opts[@]}" "$remote" "tar -czf - -C "\$HOME/$op" result.json receipt.json pre-commit.json commit-attempt.json" >terminal/server.tgz
          python3 - <<'PY'
          import tarfile,json,pathlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:t.extractall('terminal/x')
          r=json.load(open('terminal/x/result.json'))
          assert r['state']=='committed_verified' and r['inserted']==300 and r['readback_verified'] is True
          print(json.dumps({'state':r['state'],'inserted':r['inserted'],'inserted_by_namespace':r['inserted_by_namespace'],'unique_targets':r['unique_targets']}))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: match-tv-tail-w1b-${{ github.run_id }}, path: terminal/, retention-days: 90}
