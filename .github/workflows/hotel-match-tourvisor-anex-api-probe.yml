name: MATCH Tourvisor ANEX API probe
run-name: MATCH Tourvisor ANEX API probe #1971

on:
  push:
    branches: ['ops/match-tourvisor-anex-api-probe-1971-20260911-v1']
    paths:
      - '.github/match-tourvisor-anex-api-probe-1971-v1.arm'
      - '.github/workflows/hotel-match-tourvisor-anex-api-probe.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: match-tourvisor-anex-api-probe-1971-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-tourvisor-anex-api-probe-1971-20260911-v1
  EXPECTED_BASE_SHA: 4d8f53763806932cbf24160437cb93e33d04f419

jobs:
  probe:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3

      - name: Verify exact one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/poisk-turov-test'
          test "$GITHUB_REF" = 'refs/heads/ops/match-tourvisor-anex-api-probe-1971-20260911-v1'
          test "$(cat .github/match-tourvisor-anex-api-probe-1971-v1.arm)" = "$OPERATION_ID"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"

      - name: Prepare immutable reservation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tourvisor-anex-probe
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          value = {
              'operation_id': os.environ['OPERATION_ID'],
              'state': 'reserved_before_supplier_call',
              'source_sha': os.environ['GITHUB_SHA'],
              'base_sha': os.environ['EXPECTED_BASE_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'scope': 'tourvisor_anex_separate_credential_readonly_probe',
              'credential_name': 'TOURVISOR_ANEX_JWT',
              'token_value_recorded': False,
              'database_calls': 0,
              'database_writes': 0,
              'mapping_writes': 0,
              'booking_calls': 0,
              'no_replay': True,
          }
          p = Path('.tourvisor-anex-probe/reservation.json')
          raw = json.dumps(value, sort_keys=True, indent=2) + '\n'
          p.write_text(raw)
          assert p.read_text() == raw
          PY

      - name: Preserve reservation before supplier call
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-tourvisor-anex-api-probe-1971-20260911-v1-reservation
          path: .tourvisor-anex-probe/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify separate key and one-day ANEX-only search
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from pathlib import Path

          out = Path('.tourvisor-anex-probe/result.json')
          required = ('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          for key in required:
              if not os.environ.get(key, '').strip():
                  raise SystemExit('missing deploy ssh configuration')

          php = r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          ini_set('log_errors','0');

          function fail_probe(string $reason, array $extra = []): void {
              $safe = preg_match('/\A[a-z0-9_]{1,80}\z/D', $reason) ? $reason : 'probe_failed';
              echo json_encode(array_merge([
                  'status'=>'failed','reason'=>$safe,'token_configured'=>false,
                  'anex_only_proven'=>false,'search_started'=>false,'search_completed'=>false,
                  'database_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'booking_calls'=>0
              ], $extra), JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES), "\n";
              exit(2);
          }

          function qs(array $params): string {
              $parts=[];
              foreach($params as $k=>$v){
                  if($v===null||$v==='')continue;
                  if(is_bool($v))$v=$v?'true':'false';
                  if(is_array($v)){foreach($v as $item){if($item===null||$item==='')continue;$parts[]=rawurlencode((string)$k).'='.rawurlencode((string)$item);}}
                  else $parts[]=rawurlencode((string)$k).'='.rawurlencode((string)$v);
              }
              return implode('&',$parts);
          }

          function tv_get(string $token, string $path, array $params=[]): array {
              $url='https://api.tourvisor.ru/search/api/v1'.$path;
              $query=qs($params); if($query!=='')$url.='?'.$query;
              $ch=curl_init($url);
              curl_setopt_array($ch,[
                  CURLOPT_RETURNTRANSFER=>true,
                  CURLOPT_CONNECTTIMEOUT=>10,
                  CURLOPT_TIMEOUT=>45,
                  CURLOPT_HTTPHEADER=>['Authorization: Bearer '.$token,'Accept: application/json'],
              ]);
              $body=curl_exec($ch);$errno=curl_errno($ch);$code=(int)curl_getinfo($ch,CURLINFO_HTTP_CODE);curl_close($ch);
              if($errno!==0)throw new RuntimeException('tourvisor_transport');
              if($code<200||$code>=300)throw new RuntimeException('tourvisor_http_'.$code);
              $decoded=json_decode((string)$body,true,128);
              if(!is_array($decoded))throw new RuntimeException('tourvisor_json');
              return $decoded;
          }

          function list_rows(array $data): array {
              if(array_is_list($data))return $data;
              foreach(['operators','items','hotels','results','data'] as $key){
                  if(isset($data[$key])&&is_array($data[$key])&&array_is_list($data[$key]))return $data[$key];
              }
              return [];
          }

          function operator_summary(array $data): array {
              $rows=list_rows($data);$out=[];
              foreach($rows as $row){
                  if(!is_array($row))continue;
                  $id=$row['id']??$row['operatorId']??$row['operator_id']??null;
                  $name=$row['name']??$row['operatorName']??$row['operator_name']??null;
                  if(($id===null&&!is_string($name))||($id!==null&&!is_scalar($id)))continue;
                  $out[]=['id'=>$id===null?null:(string)$id,'name'=>is_string($name)?mb_substr($name,0,120):null];
                  if(count($out)>=20)break;
              }
              return $out;
          }

          function complete_status(array $node): bool {
              foreach($node as $k=>$v){
                  if(is_array($v)&&complete_status($v))return true;
                  if(is_string($k)&&strtolower($k)==='progress'&&is_numeric($v)&&(float)$v>=100)return true;
                  if(is_string($k)&&strtolower($k)==='status'&&is_string($v)&&in_array(strtolower($v),['complete','completed','ready','done'],true))return true;
              }
              return false;
          }

          function sanitized_hotels(array $data): array {
              $rows=list_rows($data);$out=[];
              foreach($rows as $row){
                  if(!is_array($row))continue;
                  $hotel=is_array($row['hotel']??null)?$row['hotel']:$row;
                  $id=$hotel['id']??$hotel['hotelId']??$hotel['hotel_id']??null;
                  $name=$hotel['name']??$hotel['hotelName']??$hotel['hotel_name']??null;
                  if($id===null&&!is_string($name))continue;
                  $entry=['id'=>$id===null?null:(string)$id,'name'=>is_string($name)?mb_substr($name,0,180):null];
                  foreach(['regionName','region_name','subregionName','subregion_name','category'] as $key){if(isset($hotel[$key])&&is_scalar($hotel[$key]))$entry[$key]=mb_substr((string)$hotel[$key],0,120);}
                  $out[]=$entry;if(count($out)>=100)break;
              }
              return $out;
          }

          try {
              $root=realpath(getcwd());
              if(!$root||basename($root)!=='anytoour.ru')fail_probe('server_root');
              $config=$root.'/config.php';
              if(!is_file($config)||is_link($config))fail_probe('config_missing');
              require_once $config;
              if(!defined('TOURVISOR_ANEX_JWT'))fail_probe('anex_jwt_constant_missing');
              $token=trim((string)constant('TOURVISOR_ANEX_JWT'));
              if($token===''||strlen($token)<20)fail_probe('anex_jwt_empty');

              $opsRaw=tv_get($token,'/operators',['departureId'=>1,'countryId'=>4]);
              $ops=operator_summary($opsRaw);
              $anexOnly=count($ops)===1&&is_string($ops[0]['name']??null)&&strpos(strtolower($ops[0]['name']),'anex')!==false;
              $base=[
                  'status'=>$anexOnly?'scope_verified':'scope_unproven',
                  'token_configured'=>true,
                  'token_value_recorded'=>false,
                  'operator_count'=>count($ops),
                  'operators'=>$ops,
                  'operator_top_level_keys'=>array_slice(array_map('strval',array_keys($opsRaw)),0,20),
                  'anex_only_proven'=>$anexOnly,
                  'database_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'booking_calls'=>0,
              ];
              if(!$anexOnly){echo json_encode($base,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),"\n";exit(3);}

              $params=[
                  'departureId'=>1,'countryId'=>4,
                  'dateFrom'=>'2026-09-18','dateTo'=>'2026-09-18',
                  'nightsFrom'=>8,'nightsTo'=>8,'adults'=>2,'currency'=>'RUB',
              ];
              $start=tv_get($token,'/tours/search',$params);
              $sid=(int)($start['searchId']??$start['id']??0);
              if($sid<=0)fail_probe('search_id_missing',$base);
              $completed=false;$polls=0;
              for($i=0;$i<30;$i++){
                  if($i>0)sleep(1);
                  $status=tv_get($token,'/tours/search/'.$sid.'/status',['operatorStatus'=>false]);
                  $polls++;
                  if(complete_status($status)){$completed=true;break;}
              }
              if(!$completed)fail_probe('search_not_complete',array_merge($base,['search_started'=>true,'search_completed'=>false,'status_polls'=>$polls]));
              $results=tv_get($token,'/tours/search/'.$sid,['limit'=>100]);
              $hotels=sanitized_hotels($results);
              $rows=list_rows($results);
              $result=array_merge($base,[
                  'status'=>'completed','search_started'=>true,'search_completed'=>true,
                  'status_polls'=>$polls,'result_row_count'=>count($rows),
                  'sanitized_hotel_count'=>count($hotels),'hotels'=>$hotels,
                  'result_top_level_keys'=>array_slice(array_map('strval',array_keys($results)),0,20),
                  'search_contract'=>['departureId'=>1,'countryId'=>4,'date'=>'2026-09-18','nights'=>8,'adults'=>2],
                  'tour_detail_calls'=>0,'continue_calls'=>0,'booking_calls'=>0,
              ]);
              echo json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),"\n";
          } catch(Throwable $e) {
              $m=$e->getMessage();$reason=is_string($m)&&preg_match('/\A[a-z0-9_]{1,80}\z/D',$m)?$m:'probe_exception';
              fail_probe($reason,['token_configured'=>true]);
          }
          ?>'''

          with tempfile.TemporaryDirectory(prefix='tv-anex-probe-') as td:
              key = Path(td)/'key'
              key.write_text(os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].rstrip()+'\n')
              key.chmod(0o600)
              known = Path(td)/'known_hosts'
              cmd = [
                  'ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes',
                  '-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),
                  '-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2',
                  '-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'].strip(),os.environ['ANYTOOUR_DEPLOY_HOST'].strip(),
                  'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0'
              ]
              clean={k:v for k,v in os.environ.items() if k not in required and not k.startswith('TOURVISOR_')}
              proc=subprocess.run(cmd,input=php,text=True,capture_output=True,timeout=180,env=clean)

          try:
              data=json.loads(proc.stdout)
          except Exception:
              data={'status':'failed','reason':'unparseable_remote_result','token_value_recorded':False,'database_calls':0,'database_writes':0,'mapping_writes':0,'booking_calls':0}
          data['operation_id']=os.environ['OPERATION_ID']
          data['source_sha']=os.environ['GITHUB_SHA']
          data['run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['run_attempt']=int(os.environ['GITHUB_RUN_ATTEMPT'])
          data['stderr_empty']=proc.stderr.strip()==''
          raw=json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n'
          out.write_text(raw)
          assert out.read_text()==raw
          if proc.returncode!=0 or data.get('status')!='completed' or data.get('token_configured') is not True or data.get('anex_only_proven') is not True:
              raise SystemExit('separate Tourvisor ANEX probe did not complete')
          print(json.dumps({
              'status':data['status'],'anex_only_proven':data['anex_only_proven'],
              'operator_count':data.get('operator_count'),
              'result_row_count':data.get('result_row_count'),
              'sanitized_hotel_count':data.get('sanitized_hotel_count'),
              'status_polls':data.get('status_polls')
          },ensure_ascii=False,sort_keys=True))
          PY

      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-tourvisor-anex-api-probe-1971-20260911-v1-result
          path: |
            .tourvisor-anex-probe/reservation.json
            .tourvisor-anex-probe/result.json
          if-no-files-found: warn
          retention-days: 90
