name: Validate V2 lead search context
on:
  push:
    branches: [main]
    paths:
      - 'v2/lead-search-context.js'
      - '.github/workflows/validate-lead-search-context.yml'
  workflow_dispatch:

concurrency:
  group: ci-validate-lead-search-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lead context JavaScript
        run: |
          set -euo pipefail
          node --check v2/lead-search-context.js
          grep -q 'childAges' v2/lead-search-context.js
          grep -q 'V2SearchLifecycle' v2/lead-search-context.js
          grep -q 'lead-adapter-v2.php' v2/lead-search-context.js
