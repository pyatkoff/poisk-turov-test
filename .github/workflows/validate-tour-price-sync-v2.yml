name: Validate V2 tour price sync
on:
  push:
    branches: [main]
    paths:
      - 'v2/tour-price-sync-v2.js'
      - '.github/workflows/validate-tour-price-sync-v2.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: node --check v2/tour-price-sync-v2.js
      - name: Price semantics smoke
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          global.document={getElementById:()=>null};
          global.window={addEventListener:()=>{},dispatchEvent:()=>{}};
          global.CustomEvent=function(){};
          require('./v2/tour-price-sync-v2.js');
          const api=global.window.V2TourPriceSync;
          if(!api||api.version!==2) process.exit(1);
          const a=api.summary(70941,{price:{value:87807}});
          if(a.basePrice!==70941||a.selectedPrice!==87807||a.delta!==16866) process.exit(2);
          const b=api.summary(70941,{price:{value:70941}});
          if(b.selectedPrice!==70941||b.delta!==0) process.exit(3);
          const c=api.summary(70941,null);
          if(c.selectedPrice!==70941||c.hasFlightPrice!==false) process.exit(4);
          console.log('TOUR_PRICE_SYNC_OK',a);
          NODE
