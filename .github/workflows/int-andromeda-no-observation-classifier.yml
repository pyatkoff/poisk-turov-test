name: INT Andromeda no-observation classifier
on:
  push:
    branches: ['feat/int-andromeda-no-observation-classifier-20260916']
    paths:
      - 'scripts/diagnostics/andromeda_no_observation_classifier.py'
      - 'tests/andromeda-no-observation-classifier-test.py'
      - 'runtime-control/int-andromeda-no-observation-classifier.txt'
      - '.github/workflows/int-andromeda-no-observation-classifier.yml'
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline aggregate contract
        run: python3 tests/andromeda-no-observation-classifier-test.py
      - name: Check exact one-shot control
        id: control
        shell: bash
        run: |
          set -euo pipefail
          expected=$'READ_ONLY_ANDROMEDA_NO_OBSERVATION_V1\nBASE=da1e475f59ca7430133b20edae70e1e270e47bbe\n'
          actual=''; if [[ -f runtime-control/int-andromeda-no-observation-classifier.txt ]]; then actual="$(cat runtime-control/int-andromeda-no-observation-classifier.txt)"$'\n'; fi
          if [[ "$actual" == "$expected" ]]; then echo 'run_live=true' >> "$GITHUB_OUTPUT"; else echo 'run_live=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.control.outputs.run_live == 'true'
        with: {ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa, path: helper, persist-credentials: false}
      - name: Classify completed checkpoints without supplier calls or writes
        if: steps.control.outputs.run_live == 'true'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          PYTHONPATH: helper/scripts/diagnostics
        run: python3 -B scripts/diagnostics/andromeda_no_observation_classifier.py --read-only
