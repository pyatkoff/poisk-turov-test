name: Run checked Andromeda v6 served-quote E2E

on:
  pull_request:
    paths:
      - '.github/workflows/andromeda-served-quote-v5-control.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: anytoour-andromeda-detail-publication
  cancel-in-progress: false

jobs:
  control-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify one-shot owner control is exact and supplier-free on PR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/andromeda-served-quote-v5-control.yml')
          text = p.read_text()
          marker = '  surcharge-e2e-v6:\n'
          if text.count(marker) != 1:
              raise SystemExit('live job boundary missing or duplicated')
          live = text.split(marker, 1)[1]
          required = [
              "github.event.issue.number == 3419",
              "github.event.comment.body == '/run-andromeda-surcharge-e2e-3419-v6'",
              "const e2eHead = 'cfcef47f5c3365b7d4cadb9464b7ce8a833ae325';",
              "const e2eMerge = '643d8b9ee7fb4dce84939f49ca1a50c970940e5b';",
              "pull_number: 4026",
              "for (const run_id of [36309062921, 36309062919])",
              "ref: 643d8b9ee7fb4dce84939f49ca1a50c970940e5b",
              "const publicationRun = 36308780159;",
              "artifact_id: 10927849441",
              "sha256:3f6d4ceaa64591b3376ce29e870aa2e6325bccd3a57d698d3346ed81ed3a4b65",
              "ANYTOOUR_DEPLOY_HOST: $" + "{{ secrets.ANYTOOUR_DEPLOY_HOST }}",
              "ANYTOOUR_DEPLOY_USER: $" + "{{ secrets.ANYTOOUR_DEPLOY_USER }}",
              "result.get('booking_calls') != 0",
              "result.get('calc_calls') != 1",
          ]
          for needle in required:
              if live.count(needle) != 1:
                  raise SystemExit('live control pin missing or duplicated: ' + needle)
          trigger = text.split('\npermissions:', 1)[0]
          if '\n  workflow_dispatch:' in trigger or '\n  push:' in trigger:
              raise SystemExit('manual-dispatch/push trigger is not allowed in this one-shot control')
          print('Andromeda v6 owner control pins verified; PR supplier calls=0')
          PY

  surcharge-e2e-v6:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 3419 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 &&
      github.event.comment.body == '/run-andromeda-surcharge-e2e-3419-v6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact owner command, checked E2E source and published runtime
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 226193297;
            const command = '/run-andromeda-surcharge-e2e-3419-v6';
            const e2eHead = 'cfcef47f5c3365b7d4cadb9464b7ce8a833ae325';
            const e2eMerge = '643d8b9ee7fb4dce84939f49ca1a50c970940e5b';
            const publicationRun = 36308780159;
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('No replay; inspect the E2E checkpoint.');
            if (context.payload.sender?.id !== owner || context.actor !== 'pyatkoff' || process.env.GITHUB_TRIGGERING_ACTOR !== 'pyatkoff') throw new Error('Owner invocation required.');
            if (context.repo.owner !== 'pyatkoff' || context.repo.repo !== 'poisk-turov-test' || context.ref !== 'refs/heads/main') throw new Error('Repository/ref mismatch.');
            if (context.eventName !== 'issue_comment' || context.payload.action !== 'created' ||
                context.payload.issue?.number !== 3419 || context.payload.issue?.pull_request ||
                context.payload.comment?.user?.id !== owner || context.payload.comment?.body !== command) {
              throw new Error('Exact created owner command in issue3419 required.');
            }
            const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            if (main.object.sha !== context.sha) throw new Error('Main advanced; review rather than replay.');
            const {data: e2ePr} = await github.rest.pulls.get({...context.repo, pull_number: 4026});
            if (!e2ePr.merged || e2ePr.head.sha !== e2eHead || e2ePr.merge_commit_sha !== e2eMerge || e2ePr.base.ref !== 'feature/anex-search-adapter-20260907') throw new Error('E2E PR provenance mismatch.');
            for (const run_id of [36309062921, 36309062919]) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
              if (run.head_sha !== e2eHead || run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Pinned E2E CI failed: ' + run_id);
            }
            const {data: published} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: publicationRun});
            if (published.head_sha !== '26d839219d561930f60df091ba3e14d0180b442c' || published.status !== 'completed' || published.conclusion !== 'success') throw new Error('Terminal runtime publication mismatch.');
            const {data: publicationReceipt} = await github.rest.actions.getArtifact({...context.repo, artifact_id: 10927849441});
            if (publicationReceipt.expired !== false || publicationReceipt.workflow_run?.id !== publicationRun ||
                publicationReceipt.digest !== 'sha256:3f6d4ceaa64591b3376ce29e870aa2e6325bccd3a57d698d3346ed81ed3a4b65') throw new Error('Runtime publication receipt mismatch.');
      - uses: actions/checkout@v4
        with:
          ref: 643d8b9ee7fb4dce84939f49ca1a50c970940e5b
          path: e2e
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: helper
          persist-credentials: false
      - name: Execute one immutable served-price E2E operation
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          PYTHONPATH: helper/scripts/diagnostics
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          from anex_search3_owner_decisions import ssh_php
          source = pathlib.Path('e2e/scripts/diagnostics/andromeda_search_surcharge_e2e.php').read_text()
          if not source.startswith('<?php\n') or len(source.encode()) > 65536:
              raise SystemExit('checked E2E source invalid')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'andromeda-surcharge-e2e-v6'
          out.mkdir(mode=0o700)
          operation = 'andromeda-search-surcharge-e2e-3419-v6-turkey-2026-12-13-2a-7n'
          try:
              result = ssh_php(source.removeprefix('<?php\n'), {}, maximum_bytes=65536)
          except Exception:
              (out / 'result.json').write_text(json.dumps({'status':'unconfirmed','operation':operation}) + '\n')
              raise
          (out / 'result.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          if not isinstance(result, dict) or result.get('operation') != operation or result.get('status') != 'complete' or result.get('supplier_scenario') != 1:
              raise SystemExit('E2E operation not complete; do not replay')
          if result.get('mapping_writes') != 0 or result.get('booking_calls') != 0 or result.get('calc_calls') != 1:
              raise SystemExit('E2E guard mismatch')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Preserve sanitized E2E receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-surcharge-e2e-v6-${{ github.run_id }}
          path: ${{ runner.temp }}/andromeda-surcharge-e2e-v6/
          if-no-files-found: error
          retention-days: 14
