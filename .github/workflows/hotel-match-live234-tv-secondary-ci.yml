name: MATCH live234 TV secondary CI
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_live234_frontier_plan_v1.php
      - scripts/diagnostics/hotel_match_live234_tv_secondary_refresh_v1.py
      - tests/hotel_match_live234_tv_secondary_refresh_v1_test.php
      - .github/workflows/hotel-match-live234-tv-secondary-ci.yml
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate live234 acquisition source
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live234_frontier_plan_v1.php
          python3 -m py_compile scripts/diagnostics/hotel_match_live234_tv_secondary_refresh_v1.py
          php tests/hotel_match_live234_tv_secondary_refresh_v1_test.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_live234_frontier_plan_v1.php
