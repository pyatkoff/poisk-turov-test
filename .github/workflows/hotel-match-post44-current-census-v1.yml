name: MATCH post44 Andromeda current census v1
on:
  push:
    branches: ['ops/match-mass-bridge-1971-20260912']
    paths: ['.github/match-post44-current-census-1971-20260912-v1.arm']
permissions: {contents: read, issues: write}
concurrency: {group: anytour-match-post44-census, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-post44-current-census-1971-20260912-v1
  OUT: /tmp/match-post44-census
jobs:
  census:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Build census and reserve
        run: |
          set -euo pipefail
          test "$(cat .github/match-post44-current-census-1971-20260912-v1.arm)" = "$OPERATION_ID"
          mkdir -p "$OUT"
          sed -e 's/hotel-match-post539-current-census-1971-20260912-v1/hotel-match-post44-current-census-1971-20260912-v1/' -e 's/POST539_CENSUS:/POST44_CENSUS:/' scripts/diagnostics/hotel_match_post539_current_census.php > "$OUT/program.php"
          php -l "$OUT/program.php"
          printf '{"operation_id":"%s","state":"reserved_before_db_access","run_id":%s,"database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" > "$OUT/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: 'post44-census-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Execute CURRENT read-only census
        env: {KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20)
          ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M' < "$OUT/program.php" > "$OUT/stdout" 2> "$OUT/stderr"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['OUT']); raw=(d/'stdout').read_bytes(); lines=[x[len(b'POST44_CENSUS:'):] for x in raw.splitlines() if x.startswith(b'POST44_CENSUS:')]
          x=json.loads(lines[-1]) if lines else {'status':'failed','safe_message':'marker_missing'}
          (d/'result.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          c=x.get('coverage') or {}; a=c.get('andromeda_status') or {}
          s=f"MATCH #1971 post44 CURRENT census: **{x.get('status')}**; ANEX mappings **{c.get('anex_mapping_rows')}**, unique local **{c.get('anex_unique_local')}**; Andromeda accepted/pending/conflict **{a.get('accepted')}/{a.get('pending')}/{a.get('conflict')}**, unique local **{c.get('andromeda_unique_local')}**; triple **{c.get('triple')}**, exactly-two **{c.get('exactly_two')}**; live ANEX unresolved **{x.get('observed_unresolved_unprotected')}**. Writes/calls 0. Run `{os.environ['GITHUB_RUN_ID']}`."
          (d/'summary.md').write_text(s+'\n'); print(s)
          raise SystemExit(0 if x.get('status')=='completed' and x.get('operation_id')==os.environ['OPERATION_ID'] else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'post44-census-${{ github.run_id }}-result', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: test -f "$OUT/summary.md" && gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
