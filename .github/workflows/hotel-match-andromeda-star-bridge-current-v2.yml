name: MATCH Andromeda star bridge CURRENT v3
run-name: MATCH Andromeda star bridge CURRENT #1971 v3
on:
  push:
    branches: ['ops/match-andromeda-star-bridge-current-1971-v2']
    paths: ['.github/match-andromeda-star-bridge-current-1971-v3.arm']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: hotel-match-andromeda-star-bridge-current-1971-v3
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-andromeda-star-bridge-review-1971-20260912-v3
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false }
      - name: Validate immutable read-only star bridge scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_andromeda_star_bridge_review.php
          php -l tests/hotel-match-andromeda-star-bridge-review-test.php
          php tests/hotel-match-andromeda-star-bridge-review-test.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_andromeda_star_bridge_review.php').read_text()
          assert "const HMASBR_OPERATION = 'hotel-match-andromeda-star-bridge-review-1971-20260911-v1';" in s
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert 'numeric_star_is_guard_not_identity' in s
          assert "['HOTEL','RESORT','SPA']" in s
          assert "['ANNEX','BEACH','GARDEN','NORTH','SOUTH']" in s
          assert 'HMASBR_COORD_BLOCK_M = 5000.0' in s
          assert 'same_provider_target_claim_blocks' in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl_init','https://','http://'):
              assert bad.lower() not in s.lower(), bad
          print('MATCH_STAR_BRIDGE_CURRENT_V3_SCOPE_OK')
          PY
  review:
    needs: validate
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false }
      - name: Verify immutable arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-andromeda-star-bridge-current-1971-v3.arm)" = "$OPERATION_ID"
      - name: Prepare SSH key and bounded zero-DB preflight
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE" && test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          key="$RUNNER_TEMP/match_star_bridge_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ok=0
          for attempt in 1 2 3; do
            set +e
            out="$(ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru"; { test -f data/db-v1.php || test -f v2/data/db-v1.php; }; printf MATCH_STAR_BRIDGE_PREFLIGHT_OK' 2>"$RUNNER_TEMP/preflight.err")"
            rc=$?
            set -e
            if [[ $rc -eq 0 && "$out" == MATCH_STAR_BRIDGE_PREFLIGHT_OK ]]; then ok=1; break; fi
            sleep $((attempt * 2))
          done
          test "$ok" = 1
      - name: Reserve before CURRENT DB access
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          paths=['scripts/diagnostics/hotel_full_catalog_reconcile.php','scripts/diagnostics/hotel_match_current_bulk_review.php','scripts/diagnostics/hotel_match_andromeda_star_bridge_review.php']
          source_hash=hashlib.sha256(b''.join(Path(p).read_bytes() for p in paths)).hexdigest()
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'source_sha':os.environ['GITHUB_SHA'],'runtime_sources_sha256':source_hash,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (Path(os.environ['STATE'])/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - name: Preserve durable reservation
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-andromeda-star-bridge-review-1971-20260912-v3-reservation
          path: ${{ runner.temp }}/hotel-match-andromeda-star-bridge-review-1971-20260912-v3/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run server-CURRENT read-only mass review
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def body(path):
              s=Path(path).read_text()
              if s.startswith('<?php'): s=s[5:]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          review=body('scripts/diagnostics/hotel_match_andromeda_star_bridge_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          old="const HMASBR_OPERATION = 'hotel-match-andromeda-star-bridge-review-1971-20260911-v1';"
          new="const HMASBR_OPERATION = 'hotel-match-andromeda-star-bridge-review-1971-20260912-v3';"
          if review.count(old)!=1: raise RuntimeError('operation_constant_not_unique')
          review=review.replace(old,new,1)
          wrapper=r'''
          try{$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMASBR_ROOT');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMASBR_DB_HELPER');require_once $dbHelper;echo fc_json(hmasbr_review(v2_data_db(),HMASBR_OPERATION)),"\n";}catch(Throwable $e){echo json_encode(['status'=>'failed','operation_id'=>HMASBR_OPERATION,'reason'=>'HMASBR_REMOTE_ERROR','database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_http_calls'=>0]),"\n";exit(2);}
          '''
          code="<?php\ndefine('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+review+'\n'+wrapper
          key=os.path.join(os.environ['RUNNER_TEMP'],'match_star_bridge_key')
          cmd=['ssh','-T','-i',key,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',f"{os.environ['USER_VALUE'].strip()}@{os.environ['HOST_VALUE'].strip()}",'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=2048M']
          p=subprocess.run(cmd,input=code,text=True,capture_output=True,timeout=840)
          state=Path(os.environ['STATE'])
          try: r=json.loads(p.stdout)
          except Exception: r={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'remote_output_unparseable','remote_exit':p.returncode,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'no_replay':True}
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); (state/'result.json').write_bytes(raw)
          completed=(p.returncode==0 and r.get('status')=='completed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('database_writes')==0 and r.get('mapping_writes')==0 and r.get('supplier_calls')==0 and r.get('historical_operations_replayed') is False)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if completed else 'unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'historical_operations_replayed':False,'no_replay':True}
          if completed: receipt.update({'stats':r['stats'],'coverage':r['coverage']})
          (state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          if completed:
              s=r['stats']; c=r['coverage']
              summary=f"MATCH #1971 CURRENT Andromeda star/bridge `{r['operation_id']}` completed read-only / NO-REPLAY. Pending core8 examined **{s['pending_examined']}**; generic-free exact unique **{s['generic_free_exact_unique']}**; star-mismatch examined **{s['star_mismatch_examined']}**. Prepared **{s['prepared']}** = live **{s['prepared_live']}**, star-mismatch **{s['prepared_star_mismatch']}**, current ANEX+Tourvisor bridge **{s['prepared_anex_bridge']}**. Routes coord/single-ultratight/place/bridge/single-place+bridge **{s['route_coordinate']}/{s['route_single_ultratight']}/{s['route_place']}/{s['route_bridge']}/{s['route_single_place_bridge']}**. Blocked >5km **{s['coordinate_conflict']}**, same-provider target occupied **{s['same_provider_target_claimed']}**, insufficient independent evidence **{s['low_independent_evidence']}**. Coverage triple **{c['all_three']}**, ANEX links **{c['anex_links']}**, Andromeda unique **{c['andromeda_unique_local']}**. Supplier/Tourvisor HTTP/DB/mapping writes/calls 0."
          else:
              summary=f"MATCH #1971 CURRENT Andromeda star/bridge `{os.environ['OPERATION_ID']}` is UNKNOWN / NO-REPLAY after durable reservation; no DB/mapping/supplier/Tourvisor writes/calls were executed by this code path. Read receipt before any successor; do not replay."
          (state/'summary.md').write_text(summary+'\n',encoding='utf-8'); print(summary)
          if not completed: raise SystemExit(2)
          PY
      - name: Preserve immutable result and receipt
        if: always()
        id: result_artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-andromeda-star-bridge-review-1971-20260912-v3-result
          path: ${{ runner.temp }}/hotel-match-andromeda-star-bridge-review-1971-20260912-v3/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.result_artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
