name: MATCH Tourvisor passive operator intersection v1

on:
  push:
    branches: [diag/match-tourvisor-passive-operator-intersection-1971-20260917-v1]
    paths:
      - scripts/diagnostics/hotel_match_tourvisor_passive_operator_intersection_v1.php
      - .github/workflows/hotel-match-tourvisor-passive-operator-intersection-v1.yml

permissions: {contents: read, actions: read}
concurrency: {group: match-tourvisor-passive-operator-intersection-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tourvisor-passive-operator-intersection-1971-20260917-v1
  SCRIPT_PATH: scripts/diagnostics/hotel_match_tourvisor_passive_operator_intersection_v1.php
  SCRIPT_BLOB: 3b67142002b21bbb333d29f914f651777a593826

jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Pin source, self-test and reserve
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$SCRIPT_PATH")" = "$SCRIPT_BLOB"
          php -l "$SCRIPT_PATH"
          php "$SCRIPT_PATH" --self-test
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"; cp "$SCRIPT_PATH" "$out/audit.php"
          export SCRIPT_SHA256="$(sha256sum "$SCRIPT_PATH" | awk '{print $1}')"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5716485264,'script_blob':os.environ['SCRIPT_BLOB'],'script_sha256':os.environ['SCRIPT_SHA256'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tv-passive-operator-intersection-v1-reservation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hotel-match-tourvisor-passive-operator-intersection-1971-20260917-v1/reservation.json
            ${{ runner.temp }}/hotel-match-tourvisor-passive-operator-intersection-1971-20260917-v1/audit.php
          retention-days: 90
      - name: Execute CURRENT read-only intersection
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$out/audit.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'; r=json.loads((s/'result.json').read_text()); c=json.loads((s/'receipt.json').read_text()); h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          ok=(r.get('state')=='completed_read_only' and r.get('pending_checked',0)>0 and r.get('passive_rows_considered',0)>0 and c.get('result_sha256')==h and c.get('readback_verified') is True and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']))
          g={'verified':ok,'state':r.get('state'),'pending_checked':r.get('pending_checked'),'passive_rows_considered':r.get('passive_rows_considered'),'passive_hotels_considered':r.get('passive_hotels_considered'),'strict_candidates':r.get('strict_candidates'),'reason_counts':r.get('reason_counts'),'candidates':r.get('candidates'),'result_sha256':h,'no_replay':True}; (p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(g,ensure_ascii=False,sort_keys=True)); raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-passive-operator-intersection-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tourvisor-passive-operator-intersection-1971-20260917-v1/
          retention-days: 90
