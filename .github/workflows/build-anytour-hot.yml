name: Build AnyTour hot inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/build-hot-from-observations-v1.php'
      - 'v2/data/hot-tours-read-v1.php'
      - 'v2/hot/index.php'
      - '.github/workflows/build-anytour-hot.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/build-hot-from-observations-v1.php'
      - 'v2/data/hot-tours-read-v1.php'
      - 'v2/hot/index.php'
      - '.github/workflows/build-anytour-hot.yml'
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      fresh_hours:
        description: 'How recent observations must be (1-24h)'
        required: true
        default: '6'
        type: string
      departure_days:
        description: 'Upcoming departure horizon (1-45 days)'
        required: true
        default: '21'
        type: string

concurrency:
  group: anytour-hot-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local hot inventory tooling
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/build-hot-from-observations-v1.php >/dev/null
          php -l v2/data/hot-tours-read-v1.php >/dev/null
          php -l v2/hot/index.php >/dev/null
          grep -Fq "o.source='user_search'" v2/data/build-hot-from-observations-v1.php
          grep -Fq 'o.adults=2 AND o.children_count=0' v2/data/build-hot-from-observations-v1.php
          grep -Fq 'hot_tours_current' v2/data/build-hot-from-observations-v1.php
          grep -Fq 'h.expires_at > NOW()' v2/data/hot-tours-read-v1.php
          grep -Fq "v2_data_hot_tours(['limit'=>9])" v2/hot/index.php
          if grep -Fq 'v2_data_tv_get' v2/data/build-hot-from-observations-v1.php; then
            echo 'builder must not call Tourvisor' >&2; exit 1
          fi
          echo 'ANYTOUR_LOCAL_HOT_CONTRACT_OK'

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Build hot inventory on production
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          FRESH_HOURS: ${{ inputs.fresh_hours || '6' }}
          DEPARTURE_DAYS: ${{ inputs.departure_days || '21' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRESH_HOURS" =~ ^[0-9]+$ ]] && test "$FRESH_HOURS" -ge 1 && test "$FRESH_HOURS" -le 24
          [[ "$DEPARTURE_DAYS" =~ ^[0-9]+$ ]] && test "$DEPARTURE_DAYS" -ge 1 && test "$DEPARTURE_DAYS" -le 45
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          root='~/www/anytoour.ru'
          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" v2/data/db-v1.php v2/data/build-hot-from-observations-v1.php v2/data/data-doctor-v1.php "$remote:$root/data/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru\"
            php -l \"\$root/data/build-hot-from-observations-v1.php\" >/dev/null
            php \"\$root/data/build-hot-from-observations-v1.php\" --fresh-hours='$FRESH_HOURS' --departure-days='$DEPARTURE_DAYS'
            php \"\$root/data/data-doctor-v1.php\"
          "
          echo "ANYTOUR_LOCAL_HOT_BUILD_OK fresh_hours=$FRESH_HOURS departure_days=$DEPARTURE_DAYS"
