name: Visual V2 checkout pull request

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/visual-v2-checkout-pr.yml'
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-checkout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-v2-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit selected-tour checkout at five viewports
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p checkout-visual-artifacts
          cat > checkout-visual.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          const root=path.resolve('v2'),url=process.env.V2_URL;
          const viewports=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const assetRe=/\/poisk-turov-test\/v2\/([^/?]+\.(?:js|css))(?:\?.*)?$/i;
          const fixture=`<button type="button" class="back-results">← Вернуться к предложениям</button><div class="selected-head"><div><span class="eyebrow">ВЫБРАННЫЙ ТУР</span><h2>AnyTour Coast Resort</h2><p>Турция · Анталья · Лара</p></div><div class="selected-price"><small>Стоимость</small>125 000 ₽</div></div><div class="selected-picture"><div class="photo-placeholder">ANYTOUR</div></div><div class="facts"><div><span>Вылет из</span><b>Москва</b></div><div><span>Дата</span><b>10.09.2026</b></div><div><span>Ночей</span><b>7</b></div><div><span>Туристы</span><b>2 взр.</b></div><div><span>Питание</span><b>Все включено</b></div><div><span>Номер</span><b>Standard Sea View</b></div><div><span>Размещение</span><b>DBL</b></div><div><span>Оператор</span><b>ANEX</b></div><div><span>Перелёт</span><b>Чартер</b></div><div><span>Топливный сбор</span><b>—</b></div></div><div class="hotel-desc">Отель на первой береговой линии. Подробное описание для проверки выбранного тура на разных ширинах экрана.</div><div class="tour-flights"><div class="section-heading"><strong>Авиарейсы</strong><span>Выберите подходящий вариант</span></div><div class="flight-variants"><div class="flight-variant is-selected"><label class="flight-choice"><input type="radio" checked><span>Вариант 1 · рекомендуемый</span><b>125 000 ₽</b></label><div class="flight-segment"><div class="flight-segment-title"><strong>Туда</strong><span>Southwind · 2S172 · Boeing 737-800</span></div><div class="flight-route"><div><b>Шереметьево (SVO)</b><span>10.09.2026 · 14:00</span></div><div class="flight-arrow">→</div><div><b>Даламан (DLM)</b><span>10.09.2026 · 18:05</span></div></div><div class="flight-baggage">Багаж: <b>10 кг</b> · Ручная кладь: <b>8 кг</b></div></div><div class="flight-segment"><div class="flight-segment-title"><strong>Обратно</strong><span>Southwind · 2S171 · Boeing 737-800</span></div><div class="flight-route"><div><b>Даламан (DLM)</b><span>17.09.2026 · 09:00</span></div><div class="flight-arrow">→</div><div><b>Шереметьево (SVO)</b><span>17.09.2026 · 13:10</span></div></div><div class="flight-baggage">Багаж: <b>10 кг</b> · Ручная кладь: <b>8 кг</b></div></div></div></div></div><form class="lead-form"><div class="section-heading"><strong>Оставить заявку</strong><span>Менеджер получит выбранный тур и рейс</span></div><div class="lead-fields"><label>Имя<input name="name"></label><label>Телефон<input name="phone" type="tel" required></label></div><label>Комментарий<textarea name="comment"></textarea></label><label class="lead-consent"><input type="checkbox" name="consent" value="1" required><span>Согласен на обработку персональных данных</span></label><button type="submit" class="primary">Отправить заявку</button><p class="lead-message"></p></form>`;
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
            for(const [name,width,height] of viewports){const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',route=>{const match=new URL(route.request().url()).pathname.match(assetRe);if(!match)return route.continue();const file=path.join(root,path.basename(match[1]));if(!fs.existsSync(file))return route.continue();return route.fulfill({status:200,contentType:path.extname(file)==='.css'?'text/css':'application/javascript',body:fs.readFileSync(file)});});
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(3500);
              const state=await page.evaluate(html=>{const selected=document.getElementById('selectedTour');selected.hidden=false;selected.innerHTML=html;if(window.V2SelectedTourDescription)window.V2SelectedTourDescription.decorate(selected);if(window.V2CheckoutExperienceV1)window.V2CheckoutExperienceV1.decorate(selected);const form=selected.querySelector('.lead-form');return{journey:selected.querySelectorAll('.checkout-journey span').length,facts:selected.querySelectorAll('.facts.checkout-facts>div').length,groups:selected.querySelectorAll('.facts.checkout-facts>div[data-fact-group]').length,head:!!selected.querySelector('.checkout-head'),flights:!!selected.querySelector('.checkout-flights'),lead:!!selected.querySelector('.checkout-lead'),help:!!selected.querySelector('.checkout-help'),fields:!!form?.querySelector('[name="name"]')&&!!form?.querySelector('[name="phone"]')&&!!form?.querySelector('[name="comment"]')&&!!form?.querySelector('[name="consent"]')&&!!form?.querySelector('button[type="submit"]'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};},fixture);
              await page.screenshot({path:`checkout-visual-artifacts/${name}-selected-tour.png`,fullPage:true});const item={name,http:response?.status()||0,errors,state};report.push(item);const bad=item.http!==200||errors.length||state.journey!==3||state.facts!==10||state.groups!==10||!state.head||!state.flights||!state.lead||!state.help||!state.fields||state.overflow;if(bad)failed=true;console.log('CHECKOUT_VISUAL',name,JSON.stringify(item));await context.close();}
            fs.writeFileSync('checkout-visual-artifacts/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node checkout-visual.cjs
      - name: Upload checkout visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-checkout-visual-${{ github.event.pull_request.number || 'manual' }}
          path: checkout-visual-artifacts/
          retention-days: 14
