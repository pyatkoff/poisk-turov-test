name: MATCH ANEX-key Egypt Turkey nights v4
on:
  push:
    branches: [ops/match-anexkey-core8-nearterm-1971-20260914-v3]
    paths: [.github/workflows/hotel-match-anexkey-egypt-turkey-nights-v4.yml]
permissions: {contents: read, issues: write}
concurrency: {group: anytour-match-anexkey-egypt-turkey-nights-v4, cancel-in-progress: false}
env:
  FAMILY_ID: hotel-match-anexkey-egypt-turkey-nights-1971-20260914-v4
jobs:
  slice:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        country: [egypt, turkey]
        nights: [6, 8, 10]
        date: ['2026-09-29','2026-10-16','2026-10-30','2026-11-13','2026-11-27','2026-12-11','2027-01-05','2027-01-22']
    env:
      COUNTRY: ${{ matrix.country }}
      NIGHTS: ${{ matrix.nights }}
      SEARCH_DATE: ${{ matrix.date }}
      OUT: /tmp/match-key-v4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate source and reserve immutable slice
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          export OPERATION_ID="${FAMILY_ID}-${COUNTRY}-${SEARCH_DATE}-n${NIGHTS}"
          php -l scripts/diagnostics/hotel_match_andromeda_anex_operator_key_core8_live.php
          python3 - <<'PY'
          import os,pathlib,hashlib,json
          p=pathlib.Path('scripts/diagnostics/hotel_match_andromeda_anex_operator_key_core8_live.php').read_text()
          assert p.count('__MATCH_COUNTRY__')==1 and p.count('__MATCH_DATE__')==1 and p.count('__MATCH_OPERATION__')==1
          assert p.count('const HM_NIGHTS=7;')==1
          assert p.count("str_starts_with(HM_OPERATION,'hotel-match-anexkey-core8-mass-1971-')")==1
          p=p.replace('__MATCH_COUNTRY__',os.environ['COUNTRY']).replace('__MATCH_DATE__',os.environ['SEARCH_DATE']).replace('__MATCH_OPERATION__',os.environ['OPERATION_ID'])
          p=p.replace('const HM_NIGHTS=7;',f"const HM_NIGHTS={int(os.environ['NIGHTS'])};")
          p=p.replace("str_starts_with(HM_OPERATION,'hotel-match-anexkey-core8-mass-1971-')", "str_starts_with(HM_OPERATION,'hotel-match-anexkey-egypt-turkey-nights-1971-')")
          assert 'START TRANSACTION READ ONLY' in p
          d=pathlib.Path(os.environ['OUT']); (d/'program.php').write_text(p)
          r={'family_id':os.environ['FAMILY_ID'],'operation_id':os.environ['OPERATION_ID'],'country':os.environ['COUNTRY'],'date':os.environ['SEARCH_DATE'],'nights':int(os.environ['NIGHTS']),'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'program_sha256':hashlib.sha256(p.encode()).hexdigest(),'state':'reserved_before_supplier_access','database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          (d/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
          php -l "$OUT/program.php"
      - uses: actions/upload-artifact@v4
        with: {name: 'key-v4-${{ matrix.country }}-${{ matrix.date }}-n${{ matrix.nights }}-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Execute supplier evidence plus CURRENT readback
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/ssh.sock"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ok=0
          for n in 1 2 3; do
            if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"; then ok=1; break; fi
            sleep 10
          done
          test "$ok" = 1
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=20 -o ServerAliveCountMax=3 -l "$USER" "$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M' < "$OUT/program.php" > "$RUNNER_TEMP/stdout" 2> "$RUNNER_TEMP/stderr"; rc=$?
          set -e; export RC="$rc"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']); raw=pathlib.Path(os.environ['RUNNER_TEMP'],'stdout').read_bytes()
          vals=[x[len('MATCH_CORE8_KEY_JSON:'):] for x in raw.decode(errors='replace').splitlines() if x.startswith('MATCH_CORE8_KEY_JSON:')]
          x=json.loads(vals[-1]) if vals else {'status':'unknown','stage':'result_readback','reason':'result_marker_missing_or_ambiguous','stdout_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          x['remote_exit']=int(os.environ['RC']); x['nights']=int(os.environ['NIGHTS']); (d/'result.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          assert x.get('database_writes')==0 and x.get('mapping_writes')==0 and x.get('tourvisor_calls',0)==0
          if int(os.environ['RC'])!=0 or x.get('status')!='completed': raise SystemExit(2)
          print(json.dumps({k:x.get(k) for k in ['country','date','nights','pages','direct_anex_hotels','bridges','counts']},ensure_ascii=False,sort_keys=True))
          PY
          ssh -S "$sock" -O exit "$HOST" >/dev/null 2>&1 || true
          rm -f "$key" "$known" "$RUNNER_TEMP/stdout" "$RUNNER_TEMP/stderr"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: key-v4-${{ matrix.country }}-${{ matrix.date }}-n${{ matrix.nights }}-${{ github.run_id }}-final
          path: |
            ${{ env.OUT }}/reservation.json
            ${{ env.OUT }}/result.json
          retention-days: 90
  aggregate:
    if: always() && github.run_attempt == 1 && github.run_number == 1
    needs: slice
    runs-on: ubuntu-latest
    env:
      PRIOR: '[["32937","2000025459","149408"],["44596","69895","28760"],["28990","2000044474","17680"],["34078","2000025414","37383"],["1768","8801","183"],["29860","75419","17346"],["32575","118783","17692"],["16330","2000033698","21641"],["39601","2000029331","37547"],["1361","2000069923","293"],["35115","2000073592","28649"],["4158","177152","37412"],["480","2000061188","316"],["5215","532","345"],["8550","7445","1283"],["8803","146703","17461"]]'
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'key-v4-*-final', path: /tmp/all, merge-multiple: false}
      - name: Aggregate globally one-to-one evidence
        run: |
          python3 - <<'PY'
          import json,pathlib,collections,os
          files=list(pathlib.Path('/tmp/all').rglob('result.json')); completed=[]; failed=[]
          for p in files:
            x=json.loads(p.read_text()); (completed if x.get('status')=='completed' else failed).append(x)
          totals=collections.Counter(); obs=collections.defaultdict(list); by_d=collections.defaultdict(set); by_a=collections.defaultdict(set)
          for x in completed:
            for k,v in (x.get('counts') or {}).items(): totals[k]+=v
            for r in x.get('rows') or []:
              aid=str(r.get('anex_id') or ''); did=str(r.get('andromeda_id') or '')
              if aid and did: by_d[did].add(aid); by_a[aid].add(did)
              if r.get('bucket') not in {'safe_missing_andromeda_side','safe_missing_anex_side'}: continue
              k=(r['bucket'],aid,did,str(r['anchor_local_id']))
              obs[k].append({'country':x['country'],'date':x['date'],'nights':x.get('nights'),'image':bool(r.get('image_pattern_verified')),'name_exact':bool(r.get('name_exact_normalized')),'anex_name':r.get('direct_anex_name'),'andromeda_name':r.get('andromeda_name')})
          conflict_d={k:sorted(v) for k,v in by_d.items() if len(v)>1}; conflict_a={k:sorted(v) for k,v in by_a.items() if len(v)>1}
          candidates=[]
          for k,a in obs.items():
            c={'bucket':k[0],'anex_id':k[1],'andromeda_id':k[2],'local_id':k[3],'country':a[0]['country'],'recurrence':len({(z['date'],z['nights']) for z in a}),'distinct_dates':len({z['date'] for z in a}),'distinct_nights':len({z['nights'] for z in a}),'observations':a,'global_one_to_one':k[2] not in conflict_d and k[1] not in conflict_a}
            candidates.append(c)
          safe=[r for r in candidates if r['global_one_to_one']]
          prior={tuple(x) for x in json.loads(os.environ['PRIOR'])}; now={(r['anex_id'],r['andromeda_id'],r['local_id']) for r in safe}
          pba={a:(d,l) for a,d,l in prior}; pbd={d:(a,l) for a,d,l in prior}; cross=[]; clean=[]
          for t in sorted(now-prior):
            a,d,l=t
            if (a in pba and pba[a]!=(d,l)) or (d in pbd and pbd[d]!=(a,l)): cross.append(t)
            else: clean.append(t)
          combined=(prior|now)-set(cross)
          out={'status':'completed' if len(completed)==48 else 'partial','family_id':os.environ['FAMILY_ID'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'completed_slices':len(completed),'failed_slices':len(failed),'totals':dict(totals),'distinct_current_candidates':len(candidates),'global_one_to_one_candidates':len(safe),'global_one_to_one_recurring_ge2':sum(r['recurrence']>=2 for r in safe),'global_one_to_one_multinight_ge2':sum(r['distinct_nights']>=2 for r in safe),'prior_one_to_one':len(prior),'new_one_to_one_vs_prior':len(clean),'cross_run_conflicts':len(cross),'combined_operator_key_one_to_one':len(combined),'clean_new_vs_prior':[{'anex_id':a,'andromeda_id':d,'local_id':l} for a,d,l in clean],'candidates':candidates,'failed':[{'country':x.get('country'),'date':x.get('date'),'nights':x.get('nights'),'stage':x.get('stage'),'reason':x.get('reason')} for x in failed],'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True,'acceptance_authority':False}
          pathlib.Path('aggregate.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          s=f"MATCH #1971 Egypt/Turkey multi-night v4 `{out['family_id']}`: completed **{out['completed_slices']}/48** immutable slices; globally one-to-one evidence **{out['global_one_to_one_candidates']}**, clean NEW vs prior v2+v3 **{out['new_one_to_one_vs_prior']}**, combined operator-key one-to-one **{out['combined_operator_key_one_to_one']}**, recurring>=2 **{out['global_one_to_one_recurring_ge2']}**, multi-night>=2 **{out['global_one_to_one_multinight_ge2']}**, cross-run conflicts **{out['cross_run_conflicts']}**. DB/mapping/Tourvisor/booking/lead writes/calls **0**. Evidence-only; acceptance requires NEW server-CURRENT guarded reconciliation. Run `{out['run_id']}`; all IDs immutable/no-replay."
          pathlib.Path('summary.md').write_text(s+'\n'); print(s)
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'key-v4-${{ github.run_id }}-aggregate', path: aggregate.json, retention-days: 90}
      - name: Record result
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file summary.md
