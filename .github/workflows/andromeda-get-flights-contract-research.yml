name: Andromeda get_flights contract research
on:
  pull_request:
    paths:
      - '.github/workflows/andromeda-get-flights-contract-research.yml'
      - 'scripts/diagnostics/andromeda_get_flights_contract_research.py'
permissions:
  contents: read
jobs:
  official-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read official SAMO Andromeda bron contract through AnyTour server
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 scripts/diagnostics/andromeda_get_flights_contract_research.py
