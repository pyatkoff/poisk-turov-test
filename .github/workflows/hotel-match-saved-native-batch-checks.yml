name: MATCH saved native batch checks
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_saved_native_batch_plan_v1.py'
      - 'tests/hotel_match_saved_native_batch_plan_v1_test.py'
      - '.github/workflows/hotel-match-saved-native-batch-checks.yml'
permissions:
  contents: read
jobs:
  saved-native-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify mass native candidates and conflict preservation
        run: python3 tests/hotel_match_saved_native_batch_plan_v1_test.py
