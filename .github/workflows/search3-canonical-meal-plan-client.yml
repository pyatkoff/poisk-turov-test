name: Search3 canonical meal plan client
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'v2/data/search3-meal-catalog-read-v1.php'
      - 'v2/prototype-search/data.js'
      - 'v2/prototype-search/app.js'
      - 'tests/search3-meal-catalog-read-v1-test.php'
      - 'tests/search3-prototype-inventory-lifecycle.cjs'
      - 'tests/search3-prototype-selected-tour-retention.cjs'
      - 'tests/search3-prototype-inventory-browser.py'
      - '.github/workflows/search3-canonical-meal-plan-client.yml'

permissions:
  contents: read

jobs:
  canonical-meal-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Guard read-only canonical meal catalogue
        run: |
          php -l v2/data/search3-meal-catalog-read-v1.php
          php -l tests/search3-meal-catalog-read-v1-test.php
          php tests/search3-meal-catalog-read-v1-test.php
      - name: Guard client canonical meal identity
        run: |
          node tests/search3-prototype-inventory-lifecycle.cjs
          node tests/search3-prototype-selected-tour-retention.cjs
