name: INT read ANEX through published local DB-first reader

on:
  push:
    branches: ['ops/int-anex-local-reader-readback-20260918-v1']
    paths: ['.github/workflows/int-anex-local-reader-readback-v1.yml']

permissions:
  contents: read

jobs:
  readback:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/ops/int-anex-local-reader-readback-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read exact ANEX scope through published LOCAL reader
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/result"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/ssh/key"; fi
          chmod 600 "$RUNNER_TEMP/ssh/key"; ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes             -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null             -o ConnectTimeout=15 "$REMOTE_USER@$HOST" 'php -d display_errors=0 -d log_errors=0' > "$RUNNER_TEMP/result/result.json" <<'PHP'
          <?php
          declare(strict_types=1); error_reporting(0);
          $fail=static function(string $r):never{fwrite(STDERR,"ANEX_READ_FAIL ".preg_replace('/[^A-Za-z0-9_.:-]+/','_',$r)."\n");exit(2);};
          $home=rtrim((string)getenv('HOME'),'/');if($home==='')$fail('home');
          $root=$home.'/www/anytoour.ru';$preview=$root.'/_preview/search3-local-candidate';
          $reader=$preview.'/data/search3-local-results-read-v1.php';
          if(!is_file($reader)||is_link($reader))$fail('published_local_reader_missing');
          require_once $reader;
          $params=[
            'departureId'=>'1','countryId'=>'4','dateFrom'=>'2026-10-12','dateTo'=>'2026-10-12',
            'nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'childs'=>[],'meal'=>'AI',
            'hotelCategory'=>'','hotelRating'=>'','hotelTypes'=>[],'hotelIds'=>[],'hotelServices'=>[],
            'arrivalId'=>'','regionIds'=>[],'subregionIds'=>[],'operatorIds'=>[],
            'priceFrom'=>'','priceTo'=>'','currency'=>'RUB','onlyCharter'=>false,'onlyDirect'=>false,
          ];
          $now=new DateTimeImmutable('now',new DateTimeZone('UTC'));
          $scope=AnyTourSearchScopeV1::fromParams($params);
          $db=v2_data_db();if(!$db instanceof PDO)$fail('db');
          $result=search3_local_results_build($db,$params,$now);
          $db2=v2_data_db();$db2->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
          $stmt=$db2->prepare("SELECT
            COUNT(*) raw_rows,
            SUM(o.is_active=1) active_rows,
            SUM(o.final_price_ready=1) ready_rows,
            SUM(o.expires_at>UTC_TIMESTAMP()) unexpired_rows,
            SUM(o.is_active=1 AND o.final_price_ready=1 AND o.expires_at>UTC_TIMESTAMP()) active_ready_unexpired,
            SUM(s.latest_complete_refresh_token IS NOT NULL AND s.latest_complete_refresh_token=o.last_refresh_token) latest_rows,
            SUM(s.latest_complete_refresh_token IS NOT NULL AND s.latest_complete_refresh_token=o.last_refresh_token AND o.is_active=1 AND o.final_price_ready=1 AND o.expires_at>UTC_TIMESTAMP()) latest_visible_candidate_rows
            FROM anytour_offers o
            LEFT JOIN anytour_offer_scope_state s ON s.provider=o.provider AND s.scope_sha256=o.scope_sha256
            WHERE o.provider='anex' AND o.scope_sha256=:scope");
          $stmt->execute(['scope'=>$scope['digest']]);$exact=$stmt->fetch(PDO::FETCH_ASSOC);if(!is_array($exact))$fail('exact_counts');
          $all=$db2->query("SELECT COUNT(*) raw_rows,SUM(is_active=1) active_rows,SUM(final_price_ready=1) ready_rows,SUM(is_active=1 AND final_price_ready=1 AND expires_at>UTC_TIMESTAMP()) active_ready_unexpired FROM anytour_offers WHERE provider='anex'")->fetch(PDO::FETCH_ASSOC);
          $providerCounts=(array)($result['providerOfferCounts']??[]);
          echo json_encode([
            'schema_version'=>1,'source'=>'int-anex-local-reader-readback-v1',
            'published_reader'=>true,'match_mode'=>$result['matchMode']??null,
            'hotel_count'=>$result['hotelCount']??null,'offer_count'=>$result['offerCount']??null,
            'stored_offer_count'=>$result['storedOfferCount']??null,'withheld_offer_count'=>$result['withheldOfferCount']??null,
            'provider_offer_counts'=>$providerCounts,'anex_reader_offers'=>(int)($providerCounts['anex']??0),
            'exact_scope'=>array_map('intval',$exact),'all_anex'=>is_array($all)?array_map('intval',$all):[],
            'supplier_calls'=>0,'db_writes'=>0,'filesystem_writes'=>0,'search3_publication'=>0,'booking_calls'=>0,'lead_calls'=>0
          ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          PHP
          test -s "$RUNNER_TEMP/result/result.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result','result.json');d=json.load(open(p,encoding='utf-8'))
          assert d['source']=='int-anex-local-reader-readback-v1' and d['published_reader'] is True
          assert d['supplier_calls']==d['db_writes']==d['filesystem_writes']==d['search3_publication']==d['booking_calls']==d['lead_calls']==0
          print(json.dumps(d,sort_keys=True))
          PY
      - name: Upload sanitized ANEX readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-anex-local-reader-readback-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 14
