name: INT Biblio-Globus owner fuel-zero policy

on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'app/integrations/biblio-globus-fuel-owner-policy.php'
      - 'tests/int-biblio-globus-fuel-owner-policy-test.php'
      - '.github/workflows/int-biblio-globus-fuel-owner-policy.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint bounded INT policy
        run: |
          set -euo pipefail
          php -l app/integrations/biblio-globus-fuel-owner-policy.php
          php -l tests/int-biblio-globus-fuel-owner-policy-test.php
      - name: Reject authority creep
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/integrations/biblio-globus-fuel-owner-policy.php').read_text()
          forbidden=['curl_', 'file_put_contents', 'mysqli', 'PDO', 'getFlights(', 'changeService(', '->calc(', 'booking(']
          for token in forbidden:
              if token in p:
                  raise SystemExit('forbidden authority primitive: '+token)
          required=["'source'=>'owner_policy'", "'amount'=>'0.00'", "'base_relation'=>'included'", "age < 2"]
          for token in required:
              if token not in p:
                  raise SystemExit('missing owner-policy guard: '+token)
          print('BIBLIO_OWNER_POLICY_AUTHORITY_OK supplier=0 db=0 booking=0')
          PY
      - name: Run focused policy contract
        run: php -d allow_url_fopen=0 tests/int-biblio-globus-fuel-owner-policy-test.php
