name: Validate flight empty recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/flight-empty-recovery-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-flight-empty-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flight-empty-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate empty-flight recovery on mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > flight-empty-recovery.cjs <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [375,1440]){
              const page=await browser.newPage({viewport:{width,height:900}});
              await page.setContent(`<section id="selectedTour"><div class="tour-flights"><div class="selected-loading">Для тура варианты рейсов не найдены.</div></div><form class="lead-form"><button type="submit">Отправить заявку</button></form></section>`);
              await page.evaluate(()=>{window.V2TourController={currentTour:{id:'tour-1'}};});
              await page.addScriptTag({path:path.resolve('v2/flight-empty-recovery-v1.js')});
              await page.waitForTimeout(80);
              let state=await page.evaluate(()=>({text:document.querySelector('.tour-flights').innerText,retries:document.querySelectorAll('.load-flights[data-tid="tour-1"]').length,lead:!!document.querySelector('.lead-form')}));
              if(!state.text.includes('Данные по рейсам пока не получены')||state.retries!==1||!state.lead)throw new Error(`empty recovery failed ${width}: ${JSON.stringify(state)}`);
              await page.evaluate(()=>window.V2FlightEmptyRecoveryV1.decorate());
              state=await page.evaluate(()=>({retries:document.querySelectorAll('.load-flights[data-tid="tour-1"]').length}));
              if(state.retries!==1)throw new Error(`duplicate retry ${width}: ${JSON.stringify(state)}`);
              await page.evaluate(()=>{document.querySelector('.tour-flights').innerHTML='<div class="flight-variants"><div class="flight-variant">Рейс найден</div></div>';window.V2FlightEmptyRecoveryV1.decorate();});
              state=await page.evaluate(()=>({variants:document.querySelectorAll('.flight-variant').length,retries:document.querySelectorAll('.load-flights').length}));
              if(state.variants!==1||state.retries!==0)throw new Error(`real flight altered ${width}: ${JSON.stringify(state)}`);
              console.log(`FLIGHT_EMPTY_RECOVERY_OK width=${width}`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node flight-empty-recovery.cjs
