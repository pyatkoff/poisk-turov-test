name: Inspect retained Andromeda v8 money facts
on:
  pull_request:
    paths: ['.github/workflows/andromeda-v8-money-readback.yml']
  issue_comment:
    types: [created]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: anytoour-andromeda-v8-money-readback, cancel-in-progress: false}
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - name: Verify filesystem-only contract and final-flight projection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          t=Path('.github/workflows/andromeda-v8-money-readback.yml').read_text()
          for x in ["issue.number == 2530","/inspect-andromeda-v8-transport-facts-1717-v3","sourceRun=34991136031","sourceArtifact=10406065920","9a9af940b7a2c170dd82bfdedc25cc6628fd921b75094c1278c12f6e54c0333c","glob($searches.'/*-quote-v1.json')","b869ac93db22b4ed46775862963273ee2e07d3e032a568a64bf0d9aae449c6c0","'-quote-flight-v1.json'","'supplier_calls'=>0","'operation_replayed'=>false"]: assert x in t,x
          marker='      - name: Read unique retained v8 '+'quote'; live=t.split(marker,1)[1]
          forbidden=['AnyTour'+'AndromedaClient','curl'+'_','new '+'PDO','file_'+'put_contents','fopen'+'(','un'+'link(','re'+'name(','bron_'+'ticket']
          for x in forbidden: assert x not in live,x
          assert '\n  workflow_dispatch:' not in t.split('\npermissions:',1)[0]
          php=live.split("php=r'''",1)[1].split("'''",1)[0]
          php='\n'.join(line[10:] if line.startswith('          ') else line for line in php.splitlines())
          subprocess.run(['php','-l'],input='<?php\n'+php,text=True,check=True)
          functions=php.split('try{$root=',1)[0]
          fixture=r'''
          $q=['provider'=>'andromeda','state'=>'flight_selection_required','final_price_verified'=>false,'booking_enabled'=>false];
          if(verified(['status'=>'completed','result'=>$q]))throw new RuntimeException('initial_not_final');
          $q['state']='quote_verified';$q['final_price_verified']=true;
          if(!verified(['status'=>'completed','result'=>$q])||verified(['status'=>'reserved','result'=>$q]))throw new RuntimeException('terminal_status');
          $f=flight(['direction'=>'0','name'=>'FIXTURE123','uid'=>'PRIVATE','departure'=>['town'=>'Moscow','sid'=>'PRIVATE'],'transport_markup_reported'=>['amount'=>'0','currency'=>'USD','uid'=>'PRIVATE']]);
          if(str_contains(json_encode($f),'PRIVATE')||$f['transport_markup_reported']['amount']!=='0')throw new RuntimeException('projection_or_zero');
          if(money(['amount'=>true,'currency'=>'RUB'])!==null||flight(['direction'=>'1'])['transport_markup_reported']!==null)throw new RuntimeException('unknown_money');
          echo "V8_FINAL_TRANSPORT_READBACK_CONTRACT_OK\n";
          '''
          subprocess.run(['php'],input='<?php\n'+functions+fixture,text=True,check=True)
          PY
  inspect:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' && github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 && github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 2530 && !github.event.issue.pull_request && github.event.comment.user.id == 226193297 &&
      github.event.comment.body == '/inspect-andromeda-v8-transport-facts-1717-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind exact terminal v8 evidence
        uses: actions/github-script@v7
        with:
          script: |
            const owner=226193297,command='/inspect-andromeda-v8-transport-facts-1717-v3',sourceRun=34991136031,sourceArtifact=10406065920;
            if(process.env.GITHUB_RUN_ATTEMPT!=='1'||context.actor!=='pyatkoff'||context.payload.sender?.id!==owner||process.env.GITHUB_TRIGGERING_ACTOR!=='pyatkoff') throw new Error('owner/attempt mismatch');
            if(context.repo.owner!=='pyatkoff'||context.repo.repo!=='poisk-turov-test'||context.ref!=='refs/heads/main'||context.payload.issue?.number!==2530||context.payload.issue?.pull_request||context.payload.comment?.body!==command) throw new Error('command scope mismatch');
            const cs=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:2530,per_page:100}); const ms=cs.filter(c=>c.body===command&&c.user?.id===owner&&c.author_association==='OWNER'); if(ms.length!==1||ms[0].id!==context.payload.comment.id) throw new Error('duplicate/edited command');
            const {data:main}=await github.rest.git.getRef({...context.repo,ref:'heads/main'}); if(main.object.sha!==context.sha) throw new Error('main advanced');
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:sourceRun}); if(r.head_sha!=='bbce645cce6fcc9362e1bd764d66309bfe5bc061'||r.status!=='completed'||r.conclusion!=='success'||r.run_attempt!==1) throw new Error('v8 run mismatch');
            const {data:a}=await github.rest.actions.getArtifact({...context.repo,artifact_id:sourceArtifact}); if(a.expired!==false||a.workflow_run?.id!==sourceRun||a.digest!=='sha256:9a9af940b7a2c170dd82bfdedc25cc6628fd921b75094c1278c12f6e54c0333c') throw new Error('v8 artifact mismatch');
      - uses: actions/checkout@v4
        with: {ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa, path: helper, persist-credentials: false}
      - name: Read unique retained v8 quote
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          ANYTOOUR_DEPLOY_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          ANYTOOUR_DEPLOY_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          PYTHONPATH: helper/scripts/diagnostics
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          from anex_search3_owner_decisions import ssh_php
          php=r'''
          error_reporting(0);ini_set('display_errors','0');ini_set('log_errors','0');$out=['status'=>'blocked','supplier_calls'=>0,'database_reads'=>0,'database_writes'=>0,'booking_calls'=>0,'filesystem_writes'=>0,'operation_replayed'=>false];
          function fields($r,$keys){$o=[];foreach($keys as $k){$v=is_array($r)?($r[$k]??null):null;$o[$k]=(is_string($v)&&strlen($v)<=200)||is_int($v)||is_bool($v)?$v:null;}return $o;}
          function money($v){if(!is_array($v)||!is_string($v['amount']??null)||!is_string($v['currency']??null)||!preg_match('/^(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,2})?$/D',$v['amount'])||!preg_match('/^[A-Z0-9_]{2,8}$/D',$v['currency']))return null;return ['amount'=>$v['amount'],'currency'=>$v['currency']];}
          function flight($r){$o=fields($r,['direction','name','datebeg','dateend','class']);foreach(['departure','arrival'] as $k)$o[$k]=is_array($r[$k]??null)?fields($r[$k],['state','town','port']):null;$o['transport_markup_reported']=money($r['transport_markup_reported']??null);return $o;}
          function rows($rs,$keys){if(!is_array($rs)||count($rs)>100)return null;$o=[];foreach($rs as $r){if(!is_array($r))return null;$o[]=fields($r,$keys);}return $o;}
          function readstate($p,$max){if(!is_file($p)||is_link($p)||filesize($p)>$max)throw new RuntimeException('checkpoint_invalid');$e=json_decode((string)file_get_contents($p),true,64,JSON_THROW_ON_ERROR);if(!is_array($e['state']??null))throw new RuntimeException('state_invalid');return $e['state'];}
          function verified($s){$q=$s['result']??null;return ($s['status']??null)==='completed'&&is_array($q)&&($q['provider']??null)==='andromeda'&&($q['state']??null)==='quote_verified'&&($q['final_price_verified']??null)===true&&($q['booking_enabled']??null)===false;}
          try{$root=realpath(getcwd());if(PHP_SAPI!=='cli'||!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('project_invalid');$searches=dirname($root,2).'/.anytoour-andromeda/searches';if(!is_dir($searches)||is_link($searches))throw new RuntimeException('search_directory_invalid');$c=[];
          foreach((glob($searches.'/*-quote-v1.json')?:[]) as $p){if(hash('sha256',basename($p))!=='b869ac93db22b4ed46775862963273ee2e07d3e032a568a64bf0d9aae449c6c0')continue;if(is_link($p)||!is_file($p)||filemtime($p)<strtotime('2026-09-15T15:50:20Z')||filemtime($p)>strtotime('2026-09-15T15:52:10Z'))throw new RuntimeException('initial_provenance');$c[]=$p;}
          $out['candidate_files']=count($c);if(count($c)!==1)throw new RuntimeException('v8_candidate_not_unique');$initialPath=$c[0];$i=readstate($initialPath,262144);$q0=$i['result']??[];
          if(($i['status']??null)!=='completed'||($q0['provider']??null)!=='andromeda'||($q0['local_id']??null)!==17449||($q0['state']??null)!=='flight_selection_required'||money($q0['search_price']??null)!==['amount'=>'185125','currency'=>'RUB'])throw new RuntimeException('initial_tuple_mismatch');
          $first=[];$initialFlights=[];$markups=[];foreach(($q0['flights']??[]) as $r){if(!is_array($r))continue;$dir=$r['direction']??null;if(!in_array($dir,['0','1'],true))continue;if(!isset($first[$dir])){$ref=$r['flight_ref']??null;if(!is_string($ref)||!preg_match('/^flight_[a-f0-9]{32}$/D',$ref))throw new RuntimeException('selection_ref_invalid');$first[$dir]=$ref;$initialFlights[]=flight($r);}$m=money($r['transport_markup_reported']??null);if($m!==null)$markups[json_encode($m)]=$m;}
          if(count($first)!==2)throw new RuntimeException('selection_incomplete');$finalPath=substr($initialPath,0,-strlen('-quote-v1.json')).'-quote-flight-v1.json';$s=readstate($finalPath,262144);
          $expected=hash('sha256',json_encode(['quote_context_sha256'=>$i['context_sha256'],'provider'=>'andromeda','outbound_ref'=>$first['0'],'return_ref'=>$first['1']],JSON_THROW_ON_ERROR));
          if(!verified($s)||($s['context_sha256']??null)!==$expected||($s['operation_sha256']??null)!==hash('sha256','andromeda-selected-quote-flight-selection-v1'))throw new RuntimeException('final_context_mismatch');$q=$s['result'];
          if(($q['local_id']??null)!==17449||money($q['search_price']??null)!==['amount'=>'185125','currency'=>'RUB']||money($q['final_price']??null)!==['amount'=>'199390','currency'=>'RUB']||!is_array($q['flights']??null)||count($q['flights'])!==2)throw new RuntimeException('final_tuple_mismatch');
          $out['initial_checkpoint_content_sha256']=hash_file('sha256',$initialPath);$out['final_checkpoint_content_sha256']=hash_file('sha256',$finalPath);$out['selection_context_verified']=true;$out['initial_selected_flights']=$initialFlights;$out['available_transport_markup_facts']=array_values($markups);
          $out['quote']=['local_id'=>17449,'state'=>$q['state'],'search_price'=>money($q['search_price']??null),'package_price'=>money($q['package_price']??null),'final_price'=>money($q['final_price']??null),'search_price_estimate'=>money($q['search_price_estimate']??null),'selected_flights'=>array_map('flight',$q['flights']),'operator_currency_rates_reported'=>rows($q['operator_currency_rates_reported']??null,['currency','rate','is_claim_currency','source']),'calc_money_facts_reported'=>rows($q['calc_money_facts_reported']??null,['currency','gross_amount','net_amount','commissionable_amount','commission_amount','source']),'fuel_surcharges_reported'=>rows($q['fuel_surcharges_reported']??null,['amount','currency','route_index','source'])];$out['status']='inspected';
          }catch(Throwable $x){$out['reason']=preg_match('/^[A-Za-z0-9_.:-]{1,96}$/D',$x->getMessage())?$x->getMessage():'inspection_failed';}echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          '''
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'v8-money';d.mkdir(mode=0o700);r=ssh_php(php,{},maximum_bytes=65536);(d/'result.json').write_text(json.dumps(r,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          if r.get('status')!='inspected' or r.get('selection_context_verified') is not True or r.get('operation_replayed') is not False or any(r.get(k)!=0 for k in ['supplier_calls','database_reads','database_writes','booking_calls','filesystem_writes']): raise SystemExit('v8 retained transport readback incomplete; do not replay')
          print(json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
      - name: Preserve sanitized readback
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'andromeda-v8-transport-readback-v3-${{ github.run_id }}', path: '${{ runner.temp }}/v8-money/result.json', if-no-files-found: error, retention-days: 14}
