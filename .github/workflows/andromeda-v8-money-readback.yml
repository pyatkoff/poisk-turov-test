name: Inspect retained Andromeda v8 money facts
on:
  pull_request:
    paths: ['.github/workflows/andromeda-v8-money-readback.yml']
  issue_comment:
    types: [created]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: anytoour-andromeda-v8-money-readback, cancel-in-progress: false}
jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - name: Verify filesystem-only initial-claim money projection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          t=Path('.github/workflows/andromeda-v8-money-readback.yml').read_text()
          for x in ["issue.number == 2530","/inspect-andromeda-v8-claim-money-1717-v4","sourceRun=34991136031","sourceArtifact=10406065920","9a9af940b7a2c170dd82bfdedc25cc6628fd921b75094c1278c12f6e54c0333c","b869ac93db22b4ed46775862963273ee2e07d3e032a568a64bf0d9aae449c6c0","'-quote-flight-state-v1.json'","'-quote-flight-v1.json'","'supplier_calls'=>0","'operation_replayed'=>false"]:
              assert x in t,x
          marker='      - name: Read retained v8 initial claim and final quote'; live=t.rsplit(marker,1)[1]
          for x in ['AnyTour'+'AndromedaClient','curl'+'_','new '+'PDO','file_'+'put_contents','fopen'+'(','un'+'link(','re'+'name(','bron_'+'ticket']:
              assert x not in live,x
          assert '\n  workflow_dispatch:' not in t.split('\npermissions:',1)[0]
          php=live.split("php=r'''",1)[1].split("'''",1)[0]
          php='\n'.join(line[10:] if line.startswith('          ') else line for line in php.splitlines())
          subprocess.run(['php','-l'],input='<?php\n'+php,text=True,check=True)
          functions=php.split('try{$root=',1)[0]
          fixture=r'''
          $doc=['freightExternal'=>'1','buyerMoneys'=>[['buyerClaimMoney'=>[['currency'=>'RUB','net'=>'185125','uid'=>'PRIVATE']]]],
                'moneys'=>[['money'=>[['currency'=>'RUB','price'=>'185125','net'=>'170000','rate'=>'1','uid'=>'PRIVATE']]]],
                'services'=>[['service'=>[['servicetype'=>'8','servicecategoryName'=>'Топливный сбор','price'=>'10','currencyAlias'=>'EUR','uid'=>'PRIVATE']]]],
                'transports'=>[['transport'=>[['direction'=>'1','type'=>'ttAvia','name'=>'DEFAULT','uid'=>'PRIVATE']]]]];
          $p=claimfacts(['claimDocument'=>[$doc]]);$j=json_encode($p);
          if(str_contains($j,'PRIVATE')||($p['freight_external']??null)!==1||count($p['buyer_money'])!==1||count($p['services'])!==1||($p['transport_directions']['1']??0)!==1)throw new RuntimeException('projection');
          echo "V8_INITIAL_CLAIM_READBACK_CONTRACT_OK\n";
          '''
          subprocess.run(['php'],input='<?php\n'+functions+fixture,text=True,check=True)
          PY
  inspect:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' && github.actor == 'pyatkoff' &&
      github.event.sender.id == 226193297 && github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 2530 && !github.event.issue.pull_request && github.event.comment.user.id == 226193297 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/inspect-andromeda-v8-claim-money-1717-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind exact terminal v8 evidence
        uses: actions/github-script@v7
        with:
          script: |
            const owner=226193297,command='/inspect-andromeda-v8-claim-money-1717-v4',sourceRun=34991136031,sourceArtifact=10406065920;
            if(process.env.GITHUB_RUN_ATTEMPT!=='1'||context.actor!=='pyatkoff'||context.payload.sender?.id!==owner||process.env.GITHUB_TRIGGERING_ACTOR!=='pyatkoff') throw new Error('owner/attempt mismatch');
            if(context.repo.owner!=='pyatkoff'||context.repo.repo!=='poisk-turov-test'||context.ref!=='refs/heads/main'||context.payload.issue?.number!==2530||context.payload.issue?.pull_request||context.payload.comment?.body!==command) throw new Error('command scope mismatch');
            const cs=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:2530,per_page:100});
            const ms=cs.filter(c=>c.body===command&&c.user?.id===owner&&c.author_association==='OWNER');
            if(ms.length!==1||ms[0].id!==context.payload.comment.id) throw new Error('duplicate/edited command');
            const {data:main}=await github.rest.git.getRef({...context.repo,ref:'heads/main'}); if(main.object.sha!==context.sha) throw new Error('main advanced');
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:sourceRun}); if(r.head_sha!=='bbce645cce6fcc9362e1bd764d66309bfe5bc061'||r.status!=='completed'||r.conclusion!=='success'||r.run_attempt!==1) throw new Error('v8 run mismatch');
            const {data:a}=await github.rest.actions.getArtifact({...context.repo,artifact_id:sourceArtifact}); if(a.expired!==false||a.workflow_run?.id!==sourceRun||a.digest!=='sha256:9a9af940b7a2c170dd82bfdedc25cc6628fd921b75094c1278c12f6e54c0333c') throw new Error('v8 artifact mismatch');
      - uses: actions/checkout@v4
        with: {ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa, path: helper, persist-credentials: false}
      - name: Read retained v8 initial claim and final quote
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          ANYTOOUR_DEPLOY_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          ANYTOOUR_DEPLOY_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          PYTHONPATH: helper/scripts/diagnostics
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          from anex_search3_owner_decisions import ssh_php
          php=r'''
          error_reporting(0);ini_set('display_errors','0');ini_set('log_errors','0');
          $out=['status'=>'blocked','supplier_calls'=>0,'database_reads'=>0,'database_writes'=>0,'booking_calls'=>0,'filesystem_writes'=>0,'operation_replayed'=>false];
          function txt($v,$n=160){return is_string($v)&&strlen($v)<=$n?$v:null;}
          function dec($v){if(is_int($v)||(is_float($v)&&is_finite($v)))$v=(string)$v;return is_string($v)&&preg_match('/^(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,6})?$/D',$v)?$v:null;}
          function money($v){if(!is_array($v))return null;$a=dec($v['amount']??null);$c=txt($v['currency']??null,8);return $a!==null&&is_string($c)&&preg_match('/^[A-Z0-9_]{2,8}$/D',$c)?['amount'=>$a,'currency'=>$c]:null;}
          function readstate($p,$max){if(!is_file($p)||is_link($p)||filesize($p)>$max)throw new RuntimeException('checkpoint_invalid');$e=json_decode((string)file_get_contents($p),true,64,JSON_THROW_ON_ERROR);if(!is_array($e['state']??null))throw new RuntimeException('state_invalid');return $e['state'];}
          function flat($doc,$blocks,$rows){$o=[];foreach(($doc[$blocks]??[]) as $b){if(!is_array($b)||!is_array($b[$rows]??null))continue;foreach($b[$rows] as $r)if(is_array($r))$o[]=$r;}return $o;}
          function claimfacts($claim){$doc=$claim['claimDocument'][0]??null;if(!is_array($doc))throw new RuntimeException('claim_document_invalid');
            $buyer=[];foreach(flat($doc,'buyerMoneys','buyerClaimMoney') as $r){$row=['currency'=>txt($r['currency']??null,8),'price'=>dec($r['price']??null),'net'=>dec($r['net']??null),'price_for_commission'=>dec($r['priceForCommiss']??null),'commission'=>dec($r['sumCommission']??null)];$buyer[]=$row;}
            $claimMoney=[];foreach(flat($doc,'moneys','money') as $r){$row=['currency'=>txt($r['currency']??null,8),'price'=>dec($r['price']??null),'net'=>dec($r['net']??null),'rate'=>dec($r['rate']??null),'is_claim_currency'=>in_array($r['isClaimCurrency']??null,['true','false'],true)?$r['isClaimCurrency']==='true':null,'price_for_commission'=>dec($r['priceForCommiss']??null),'commission'=>dec($r['sumCommission']??null)];$claimMoney[]=$row;}
            $services=[];foreach(flat($doc,'services','service') as $r){$services[]=['service_type'=>txt((string)($r['servicetype']??''),24),'category'=>txt($r['servicecategoryName']??null,120),'name'=>txt($r['name']??null,160),'price'=>dec($r['price']??null),'currency'=>txt($r['currencyAlias']??null,8),'route_index'=>in_array((string)($r['routeIndex']??''),['0','1'],true)?(string)$r['routeIndex']:null];}
            $transports=[];$dirs=['0'=>0,'1'=>0,'other'=>0];foreach(flat($doc,'transports','transport') as $r){$d=(string)($r['direction']??'');if(isset($dirs[$d]))++$dirs[$d];else++$dirs['other'];$transports[]=['direction'=>in_array($d,['0','1'],true)?$d:null,'type'=>txt($r['type']??null,40),'name'=>txt($r['name']??null,160),'class'=>txt($r['class']??null,40),'datebeg'=>txt($r['datebeg']??null,32),'dateend'=>txt($r['dateend']??null,32)];}
            $freight=$doc['freightExternal']??null;if(is_string($freight)&&preg_match('/^[0-9]{1,6}$/D',$freight))$freight=(int)$freight;if(!is_int($freight))$freight=null;
            return ['condition'=>txt($doc['condition']??null,40),'freight_external'=>$freight,'buyer_money'=>$buyer,'claim_money'=>$claimMoney,'services'=>$services,'transport_count'=>count($transports),'transport_directions'=>$dirs,'transports'=>$transports];}
          try{$root=realpath(getcwd());if(PHP_SAPI!=='cli'||!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('project_invalid');$searches=dirname($root,2).'/.anytoour-andromeda/searches';if(!is_dir($searches)||is_link($searches))throw new RuntimeException('search_directory_invalid');$c=[];
            foreach((glob($searches.'/*-quote-v1.json')?:[]) as $p){if(hash('sha256',basename($p))!=='b869ac93db22b4ed46775862963273ee2e07d3e032a568a64bf0d9aae449c6c0')continue;if(is_link($p)||!is_file($p)||filemtime($p)<strtotime('2026-09-15T15:50:20Z')||filemtime($p)>strtotime('2026-09-15T15:52:10Z'))throw new RuntimeException('initial_provenance');$c[]=$p;}
            if(count($c)!==1)throw new RuntimeException('v8_candidate_not_unique');$initialPath=$c[0];$i=readstate($initialPath,262144);$q0=$i['result']??null;if(($i['status']??null)!=='completed'||!is_array($q0)||($q0['provider']??null)!=='andromeda'||($q0['local_id']??null)!==17449||($q0['state']??null)!=='flight_selection_required'||money($q0['search_price']??null)!==['amount'=>'185125','currency'=>'RUB'])throw new RuntimeException('initial_tuple_mismatch');
            $prefix=substr($initialPath,0,-strlen('-quote-v1.json'));$flightState=readstate($prefix.'-quote-flight-state-v1.json',4000000);if(($flightState['provider']??null)!=='andromeda'||!is_array($flightState['claim']??null)||!is_array($flightState['items']??null))throw new RuntimeException('flight_state_invalid');
            $final=readstate($prefix.'-quote-flight-v1.json',262144);$q=$final['result']??null;if(($final['status']??null)!=='completed'||!is_array($q)||($q['provider']??null)!=='andromeda'||($q['state']??null)!=='quote_verified'||($q['final_price_verified']??null)!==true||money($q['search_price']??null)!==['amount'=>'185125','currency'=>'RUB']||money($q['final_price']??null)!==['amount'=>'199390','currency'=>'RUB'])throw new RuntimeException('final_tuple_mismatch');
            $out['initial_checkpoint_content_sha256']=hash_file('sha256',$initialPath);$out['flight_state_content_sha256']=hash_file('sha256',$prefix.'-quote-flight-state-v1.json');$out['final_checkpoint_content_sha256']=hash_file('sha256',$prefix.'-quote-flight-v1.json');$out['initial_claim']=claimfacts($flightState['claim']);
            $out['final_public']=['search_price'=>money($q['search_price']??null),'package_price'=>money($q['package_price']??null),'final_price'=>money($q['final_price']??null),'fuel_rows'=>is_array($q['fuel_surcharges_reported']??null)?count($q['fuel_surcharges_reported']):null,'calc_money_rows'=>is_array($q['calc_money_facts_reported']??null)?count($q['calc_money_facts_reported']):null];$out['status']='inspected';
          }catch(Throwable $x){$out['reason']=preg_match('/^[A-Za-z0-9_.:-]{1,96}$/D',$x->getMessage())?$x->getMessage():'inspection_failed';}echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          '''
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'v8-claim-money';d.mkdir(mode=0o700)
          r=ssh_php(php,{},maximum_bytes=131072);(d/'result.json').write_text(json.dumps(r,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          if r.get('status')!='inspected' or r.get('operation_replayed') is not False or any(r.get(k)!=0 for k in ['supplier_calls','database_reads','database_writes','booking_calls','filesystem_writes']): raise SystemExit('v8 initial claim readback incomplete; do not replay')
          print(json.dumps(r,ensure_ascii=False,sort_keys=True))
          PY
      - name: Preserve sanitized readback
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: 'andromeda-v8-claim-money-readback-v4-${{ github.run_id }}', path: '${{ runner.temp }}/v8-claim-money/result.json', if-no-files-found: error, retention-days: 14}
