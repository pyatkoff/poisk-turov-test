name: Inspect retained Andromeda v8 money facts

on:
  pull_request:
    paths:
      - '.github/workflows/andromeda-v8-money-readback.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: anytoour-andromeda-v8-money-readback
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify readback is retained-evidence only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/andromeda-v8-money-readback.yml').read_text()
          required=[
            "github.event.issue.number == 2530",
            "/inspect-andromeda-v8-money-facts-1717-v1",
            "const sourceRun=34991136031;",
            "const sourceArtifact=10406065920;",
            "sha256:9a9af940b7a2c170dd82bfdedc25cc6628fd921b75094c1278c12f6e54c0333c",
            "'supplier_calls'=>0", "'database_reads'=>0", "'database_writes'=>0",
            "'booking_calls'=>0", "'filesystem_writes'=>0", "'operation_replayed'=>false",
            "glob($searches.'/*-quote-v1.json')",
          ]
          for needle in required:
            if needle not in text: raise SystemExit('missing readback guard: '+needle)
          live=text.split('      - name: Inspect retained v8 quote money only',1)[1]
          forbidden=['AnyTourAndromedaClient','anytour_andromeda_quote_run','curl_','new PDO','file_put_contents','fopen(','unlink(','rename(','copy(','touch(','bron','bron_ticket']
          for needle in forbidden:
            if needle in live: raise SystemExit('readback may perform forbidden operation: '+needle)
          trigger=text.split('\npermissions:',1)[0]
          if '\n  workflow_dispatch:' in trigger or '\n  push:' in trigger:
            raise SystemExit('manual/push trigger forbidden')
          print('v8 money readback is owner-bound and filesystem-only')
          PY

  inspect-v8-money:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 2530 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 &&
      github.event.comment.body == '/inspect-andromeda-v8-money-facts-1717-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind to terminal v8 evidence and unique owner command
        uses: actions/github-script@v7
        with:
          script: |
            const owner=226193297;
            const command='/inspect-andromeda-v8-money-facts-1717-v1';
            const sourceRun=34991136031;
            const sourceArtifact=10406065920;
            if(process.env.GITHUB_RUN_ATTEMPT!=='1') throw new Error('NO_REPLAY: inspect first readback artifact.');
            if(context.actor!=='pyatkoff'||context.payload.sender?.id!==owner||process.env.GITHUB_TRIGGERING_ACTOR!=='pyatkoff') throw new Error('Owner invocation required.');
            if(context.repo.owner!=='pyatkoff'||context.repo.repo!=='poisk-turov-test'||context.ref!=='refs/heads/main') throw new Error('Repository/ref mismatch.');
            if(context.payload.issue?.number!==2530||context.payload.issue?.pull_request||context.payload.comment?.body!==command) throw new Error('Exact fresh #2530 command required.');
            const comments=await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:2530,per_page:100});
            const matches=comments.filter(c=>c.body===command&&c.user?.id===owner&&c.author_association==='OWNER');
            if(matches.length!==1||matches[0].id!==context.payload.comment.id) throw new Error('Duplicate/edited readback command rejected.');
            const {data:main}=await github.rest.git.getRef({...context.repo,ref:'heads/main'});
            if(main.object.sha!==context.sha) throw new Error('Main advanced; review control before reading.');
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:sourceRun});
            if(run.head_sha!=='bbce645cce6fcc9362e1bd764d66309bfe5bc061'||run.status!=='completed'||run.conclusion!=='success'||run.run_attempt!==1) throw new Error('v8 source run mismatch.');
            const {data:artifact}=await github.rest.actions.getArtifact({...context.repo,artifact_id:sourceArtifact});
            if(artifact.expired!==false||artifact.workflow_run?.id!==sourceRun||artifact.workflow_run?.head_sha!==run.head_sha||artifact.digest!=='sha256:9a9af940b7a2c170dd82bfdedc25cc6628fd921b75094c1278c12f6e54c0333c') throw new Error('v8 source artifact mismatch.');

      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: helper
          persist-credentials: false

      - name: Inspect retained v8 quote money only
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          PYTHONPATH: helper/scripts/diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          from anex_search3_owner_decisions import ssh_php
          source=r'''
          error_reporting(0); ini_set('display_errors','0'); ini_set('log_errors','0');
          $out=['status'=>'blocked','source_run'=>34991136031,'supplier_calls'=>0,'database_reads'=>0,'database_writes'=>0,
              'booking_calls'=>0,'filesystem_writes'=>0,'operation_replayed'=>false];
          function v8_money($value){
              if(!is_array($value)||array_keys($value)!==['amount','currency']||!is_string($value['amount'])
                  ||!preg_match('/^(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,2})?$/D',$value['amount'])
                  ||!is_string($value['currency'])||!preg_match('/^[A-Z0-9_]{2,8}$/D',$value['currency'])) return null;
              return ['amount'=>$value['amount'],'currency'=>$value['currency']];
          }
          function v8_calc($rows){
              if(!is_array($rows)) return null; $out=[];
              foreach($rows as $row){
                  if(!is_array($row)||($row['source']??null)!=='andromeda_calc_money'||($row['arithmetic_applied']??null)!==false) return null;
                  $currency=$row['currency']??null; $gross=$row['gross_amount']??null;
                  if(!is_string($currency)||!preg_match('/^[A-Z0-9_]{2,8}$/D',$currency)||!is_string($gross)||!preg_match('/^(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,2})?$/D',$gross)) return null;
                  $clean=['currency'=>$currency,'gross_amount'=>$gross,'net_amount'=>$row['net_amount']??null,
                    'commissionable_amount'=>$row['commissionable_amount']??null,'commission_amount'=>$row['commission_amount']??null,
                    'source'=>'andromeda_calc_money','arithmetic_applied'=>false];
                  foreach(['net_amount','commissionable_amount','commission_amount'] as $key){
                      if($clean[$key]!==null&&(!is_string($clean[$key])||!preg_match('/^(?:0|[1-9][0-9]{0,11})(?:\\.[0-9]{1,2})?$/D',$clean[$key]))) return null;
                  }
                  $out[]=$clean;
              } return $out;
          }
          function v8_fuel($rows){
              if(!is_array($rows)) return null; $out=[];
              foreach($rows as $row){
                  if(!is_array($row)||($row['source']??null)!=='andromeda_claim_service') return null;
                  $money=v8_money(['amount'=>$row['amount']??null,'currency'=>$row['currency']??null]); if($money===null) return null;
                  $route=$row['route_index']??null; if($route!==null&&!in_array($route,['0','1'],true)) return null;
                  $out[]=$money+['route_index'=>$route,'source'=>'andromeda_claim_service'];
              } return $out;
          }
          function v8_rates($rows){
              if(!is_array($rows)) return null; $out=[];
              foreach($rows as $row){
                  if(!is_array($row)||($row['source']??null)!=='andromeda_claim_money'||($row['arithmetic_applied']??null)!==false) return null;
                  $currency=$row['currency']??null; $rate=$row['rate']??null; $claim=$row['is_claim_currency']??null;
                  if(!is_string($currency)||!preg_match('/^[A-Z0-9_]{2,8}$/D',$currency)||!is_string($rate)||!preg_match('/^(?:0|[1-9][0-9]{0,8})(?:\\.[0-9]{1,6})?$/D',$rate)||!is_bool($claim)) return null;
                  $out[]=['currency'=>$currency,'rate'=>$rate,'is_claim_currency'=>$claim,'source'=>'andromeda_claim_money','arithmetic_applied'=>false];
              } return $out;
          }
          function v8_obs($value){
              if(!is_array($value)||($value['provider']??null)!=='andromeda'||($value['state']??null)!=='comparable'||($value['basis']??null)!=='search_api_response') return null;
              $served=v8_money($value['served_price']??null); $final=v8_money($value['final_price']??null);
              if($served===null||$final===null||($value['final_price_verified']??null)!==true) return null;
              return ['state'=>'comparable','basis'=>'search_api_response','price_basis'=>$value['price_basis']??null,
                'served_price'=>$served,'final_price'=>$final,'signed_delta_amount'=>$value['signed_delta_amount']??null,
                'absolute_delta_amount'=>$value['absolute_delta_amount']??null,'relative_delta_bps'=>$value['relative_delta_bps']??null,
                'final_price_verified'=>true];
          }
          try{
              $root=realpath(getcwd()); if(PHP_SAPI!=='cli'||!$root||basename($root)!=='anytoour.ru') throw new RuntimeException('project_invalid');
              $searches=dirname($root,2).'/.anytoour-andromeda/searches';
              if(!is_dir($searches)||is_link($searches)||!is_readable($searches)) throw new RuntimeException('search_checkpoint_directory_invalid');
              $from=strtotime('2026-09-15T15:50:20Z'); $to=strtotime('2026-09-15T15:52:10Z'); $matches=[]; $scanned=0;
              foreach((glob($searches.'/*-quote-v1.json')?:[]) as $path){
                  if(!is_file($path)||is_link($path)||filesize($path)>262144) continue;
                  $mtime=filemtime($path); if($mtime<$from||$mtime>$to) continue; ++$scanned;
                  try{$env=json_decode((string)file_get_contents($path),true,48,JSON_THROW_ON_ERROR);}catch(Throwable $ignored){continue;}
                  if(!is_array($env)||!is_array($env['state']??null)) continue; $state=$env['state'];
                  if(($state['status']??null)!=='completed'||!is_array($state['result']??null)) continue; $q=$state['result'];
                  if(($q['provider']??null)!=='andromeda'||($q['local_id']??null)!==17449||($q['state']??null)!=='quote_verified'
                    ||($q['final_price_verified']??null)!==true||($q['booking_enabled']??null)!==false) continue;
                  $search=v8_money($q['search_price']??null); $final=v8_money($q['final_price']??null); $obs=v8_obs($q['served_price_observation']??null);
                  if($search!==['amount'=>'185125','currency'=>'RUB']||$final!==['amount'=>'199390','currency'=>'RUB']||$obs===null||$obs['served_price']!==$search) continue;
                  $calc=v8_calc($q['calc_money_facts_reported']??null); $fuel=v8_fuel($q['fuel_surcharges_reported']??null); $rates=v8_rates($q['operator_currency_rates_reported']??null);
                  if($calc===null||$fuel===null||$rates===null) throw new RuntimeException('public_money_projection_invalid');
                  $matches[]=['checkpoint_name_sha256'=>hash('sha256',basename($path)),'mtime'=>$mtime,'search_price'=>$search,
                    'package_price'=>($q['package_price']??null)===null?null:v8_money($q['package_price']),'final_price'=>$final,
                    'served_price_observation'=>$obs,'calc_money_facts_reported'=>$calc,'fuel_surcharges_reported'=>$fuel,
                    'operator_currency_rates_reported'=>$rates];
              }
              $out['candidate_files_scanned']=$scanned; $out['matching_quote_checkpoints']=count($matches);
              if(count($matches)!==1) throw new RuntimeException('v8_quote_checkpoint_not_unique');
              $out['quote']=$matches[0]; $out['status']='inspected';
          }catch(Throwable $error){