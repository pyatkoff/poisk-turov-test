name: MATCH Tourvisor old ANEX key #1971
on:
  push:
    branches: ['feat/match-current-bulk-review-20260911']
    paths: ['.github/workflows/hotel-match-tourvisor-old-anex-key-1971.yml']
permissions: {contents: read}
concurrency: {group: match-tourvisor-old-anex-key-1971-v4, cancel-in-progress: false}
env: {OPERATION_ID: hotel-match-tourvisor-old-anex-key-1971-20260911-v4}
jobs:
  probe:
    if: github.actor == 'pyatkoff'
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          v=os.environ['KEY'].replace('\r','')
          b=v.encode() if 'PRIVATE KEY' in v else base64.b64decode(v)
          p=Path(os.environ['RUNNER_TEMP'])/'key';p.write_bytes(b);p.chmod(0o600)
          PY
          ssh-keygen -y -f "$RUNNER_TEMP/key" >/dev/null
      - name: Reserve before supplier access
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'credential':'TOURVISOR_ANEX_JWT_redacted','criteria':{'departureId':1,'countryId':1,'country':'Egypt','dateFrom':'2026-10-16','dateTo':'2026-10-16','nightsFrom':7,'nightsTo':7,'adults':2,'currency':'RUB','operatorIds':[13]},'database_writes':0,'mapping_writes':0,'direct_anex_calls':0,'andromeda_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-tourvisor-old-anex-key-v4-reservation
          path: ${{ runner.temp }}/${{ env.OPERATION_ID }}/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: One ANEX-only Tourvisor search with old key
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          s="$RUNNER_TEMP/$OPERATION_ID"
          cat > "$s/p.php" <<'PHP'
          <?php
          declare(strict_types=1); ini_set('display_errors','0'); ini_set('log_errors','0');
          $op='hotel-match-tourvisor-old-anex-key-1971-20260911-v4';
          $emit=static function(array $x) use ($op): void { echo 'OLDTV:'.json_encode(array_merge(['operation_id'=>$op,'database_writes'=>0,'mapping_writes'=>0,'direct_anex_calls'=>0,'andromeda_calls'=>0,'booking_calls'=>0,'lead_calls'=>0,'token_values_recorded'=>false,'raw_supplier_body_recorded'=>false,'no_replay'=>true],$x),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL; };
          try {
            $root=realpath(getcwd()); require $root.'/config.php';
            if(!defined('TOURVISOR_ANEX_JWT')) throw new RuntimeException('old_key_missing');
            $token=trim((string)constant('TOURVISOR_ANEX_JWT')); if(stripos($token,'Bearer ')===0)$token=trim(substr($token,7)); if($token==='')throw new RuntimeException('old_key_empty'); putenv('TOURVISOR_JWT='.$token); unset($token);
            $client=is_file($root.'/data/tourvisor-client-v1.php')?$root.'/data/tourvisor-client-v1.php':$root.'/v2/data/tourvisor-client-v1.php'; require_once $client;
            $calls=0; $start=v2_data_tv_get('/tours/search',['departureId'=>1,'countryId'=>1,'dateFrom'=>'2026-10-16','dateTo'=>'2026-10-16','nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'currency'=>'RUB','onlyCharter'=>false,'onlyDirect'=>false,'operatorIds'=>[13]]); $calls++;
            $id=(int)($start['searchId']??$start['id']??0); if($id<=0)throw new RuntimeException('search_id_missing');
            $done=false;$polls=0;for($i=0;$i<16;$i++){if($i)usleep(750000);$st=v2_data_tv_get('/tours/search/'.$id.'/status',['operatorStatus'=>false]);$calls++;$polls++;$status=strtolower((string)($st['status']??''));if((int)($st['progress']??0)>=100||in_array($status,['complete','completed','done','ready'],true)){$done=true;break;}} if(!$done)throw new RuntimeException('search_not_complete');
            $data=v2_data_tv_get('/tours/search/'.$id,['limit'=>10000]);$calls++;$rows=[];$walk=function($v)use(&$walk,&$rows):void{if(!is_array($v))return;if(array_is_list($v)){foreach($v as$r)if(is_array($r))$rows[]=$r;return;}foreach(['hotels','items','results','data']as$k)if(is_array($v[$k]??null)){$walk($v[$k]);if($rows)return;}};$walk($data);$hotels=[];foreach($rows as$r){$hid=(int)($r['id']??0);$name=trim((string)($r['name']??''));if($hid>0&&$name!=='')$hotels[$hid]=$name;}
            $emit(['status'=>'completed','search_id'=>$id,'supplier_requests'=>$calls,'status_polls'=>$polls,'unique_hotel_ids'=>count($hotels),'sample_hotels'=>array_slice(array_map(fn($id,$name)=>['id'=>$id,'name'=>$name],array_keys($hotels),array_values($hotels)),0,20)]);
          } catch(Throwable $e){$emit(['status'=>'failed','reason'=>preg_replace('/[^A-Za-z0-9_.:-]/','_',substr($e->getMessage(),0,120))]);exit(2);}
          PHP
          o=(-i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          set +e
          ssh "${o[@]}" "$USER@$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$s/p.php" > "$s/out" 2> "$s/err"
          rc=$?
          set -e
          export STATE="$s" RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE']);o=(s/'out').read_text(errors='replace');e=(s/'err').read_text(errors='replace');m='OLDTV:';line=next((x[len(m):] for x in reversed(o.splitlines()) if x.startswith(m)),None)
          r=json.loads(line) if line else {'operation_id':os.environ['OPERATION_ID'],'status':'unknown','reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stdout_sha256':hashlib.sha256(o.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(e.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'direct_anex_calls':0,'andromeda_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          (s/'result.json').write_text(json.dumps(r,sort_keys=True,indent=2,ensure_ascii=False)+'\n');print(json.dumps(r,sort_keys=True,ensure_ascii=False))
          PY
      - name: Final receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-tourvisor-old-anex-key-v4-final
          path: ${{ runner.temp }}/${{ env.OPERATION_ID }}/
          if-no-files-found: error
          retention-days: 90
