name: MATCH Tourvisor old ANEX key #1971
on:
  push:
    branches: ['feat/match-current-bulk-review-20260911']
    paths: ['.github/workflows/hotel-match-tourvisor-old-anex-key-1971.yml']
permissions: {contents: read}
concurrency: {group: match-tourvisor-old-anex-key-1971-v2, cancel-in-progress: false}
env: {OPERATION_ID: hotel-match-tourvisor-old-anex-key-1971-20260911-v2}
jobs:
  probe:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Prepare SSH and reserve
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail; k="$RUNNER_TEMP/key"; if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$k"; else printf '%s' "$KEY"|base64 -d>"$k"; fi; chmod 600 "$k"; ssh-keygen -y -f "$k">/dev/null
          o=(-i "$k" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15); cmd='cd "$HOME/www/anytoour.ru"&&test -s config.php&&(test -s data/tourvisor-client-v1.php||test -s v2/data/tourvisor-client-v1.php)&&printf OK'; set +e; x="$(ssh "${o[@]}" "$USER@$HOST" "$cmd" 2>"$RUNNER_TEMP/e")";r=$?;set -e;if [ "$r" -ne 0 ]&&[ -z "$x" ]&&grep -Eq 'Connection reset|Connection closed|kex_exchange_identification' "$RUNNER_TEMP/e";then sleep 2;x="$(ssh "${o[@]}" "$USER@$HOST" "$cmd")";elif [ "$r" -ne 0 ];then cat "$RUNNER_TEMP/e">&2;exit "$r";fi;test "$x" = OK
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"; python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json';p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'credential':'TOURVISOR_ANEX_JWT_redacted','criteria':{'departureId':1,'countryId':1,'country':'Egypt','dateFrom':'2026-10-16','dateTo':'2026-10-16','nightsFrom':7,'nightsTo':7,'adults':2,'currency':'RUB','operatorIds':[13]},'database_writes':0,'mapping_writes':0,'direct_anex_calls':0,'andromeda_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True},sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: match-tourvisor-old-anex-key-v2-reservation, path: '${{ runner.temp }}/${{ env.OPERATION_ID }}/reservation.json', if-no-files-found: error, retention-days: 90}
      - name: One ANEX-only Tourvisor search with old key
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          s="$RUNNER_TEMP/$OPERATION_ID";cat >"$s/p.php" <<'PHP'
          <?php
          declare(strict_types=1);ini_set('display_errors','0');ini_set('log_errors','0');$op='hotel-match-tourvisor-old-anex-key-1971-20260911-v2';$emit=static fn($x)=>print('OLDTV:'.json_encode(array_merge(['operation_id'=>$op,'database_writes'=>0,'mapping_writes'=>0,'direct_anex_calls'=>0,'andromeda_calls'=>0,'booking_calls'=>0,'lead_calls'=>0,'token_values_recorded'=>false,'raw_supplier_body_recorded'=>false,'no_replay'=>true],$x),JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL);
          try{$root=realpath(getcwd());require $root.'/config.php';if(!defined('TOURVISOR_ANEX_JWT'))throw new RuntimeException('old_key_missing');$t=trim((string)constant('TOURVISOR_ANEX_JWT'));if(stripos($t,'Bearer ')===0)$t=trim(substr($t,7));if($t==='')throw new RuntimeException('old_key_empty');putenv('TOURVISOR_JWT='.$t);unset($t);$client=is_file($root.'/data/tourvisor-client-v1.php')?$root.'/data/tourvisor-client-v1.php':$root.'/v2/data/tourvisor-client-v1.php';require_once $client;$calls=0;$start=v2_data_tv_get('/tours/search',['departureId'=>1,'countryId'=>1,'dateFrom'=>'2026-10-16','dateTo'=>'2026-10-16','nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'currency'=>'RUB','onlyCharter'=>false,'onlyDirect'=>false,'operatorIds'=>[13]]);$calls++;$id=(int)($start['searchId']??$start['id']??0);if($id<=0)throw new RuntimeException('search_id_missing');$complete=false;$polls=0;for($i=0;$i<16;$i++){if($i)usleep(750000);$st=v2_data_tv_get('/tours/search/'.$id.'/status',['operatorStatus'=>false]);$calls++;$polls++;$txt=strtolower((string)($st['status']??''));if((int)($st['progress']??0)>=100||in_array($txt,['complete','completed','done','ready'],true)){$complete=true;break;}}if(!$complete)throw new RuntimeException('search_not_complete');$data=v2_data_tv_get('/tours/search/'.$id,['limit'=>10000]);$calls++;$rows=[];$walk=function($v)use(&$walk,&$rows){if(!is_array($v))return;if(array_is_list($v)){foreach($v as$r)if(is_array($r))$rows[]=$r;return;}foreach(['hotels','items','results','data']as$k)if(is_array($v[$k]??null)){$walk($v[$k]);if($rows)return;}};$walk($data);$hotels=[];foreach($rows as$r){$hid=(int)($r['id']??0);$name=trim((string)($r['name']??''));if($hid>0&&$name!=='')$hotels[$hid]=$name;}$emit(['status'=>'completed','http_status'=>200,'search_id'=>$id,'supplier_requests'=>$calls,'status_polls'=>$polls,'unique_hotel_ids'=>count($hotels),'sample_hotels'=>array_slice(array_map(fn($id,$name)=>['id'=>$id,'name'=>$name],array_keys($hotels),array_values($hotels)),0,20)]);}catch(Throwable$e){$emit(['status'=>'failed','reason'=>preg_replace('/[^A-Za-z0-9_.:-]/','_',substr($e->getMessage(),0,120))]);exit(2);}
          PHP
          o=(-i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15);set +e;ssh "${o[@]}" "$USER@$HOST" 'cd "$HOME/www/anytoour.ru"&&php -d display_errors=0 -d log_errors=0'<"$s/p.php">"$s/out" 2>"$s/err";rc=$?;set -e;export STATE="$s" RC="$rc";python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE']);o=(s/'out').read_text(errors='replace');e=(s/'err').read_text(errors='replace');m='OLDTV:';l=next((x[len(m):]for x in reversed(o.splitlines())if x.startswith(m)),None);r=json.loads(l)if l else{'operation_id':os.environ['OPERATION_ID'],'status':'unknown','reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stdout_sha256':hashlib.sha256(o.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(e.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'direct_anex_calls':0,'andromeda_calls':0,'booking_calls':0,'lead_calls':0,'no_replay':True};(s/'result.json').write_text(json.dumps(r,sort_keys=True,indent=2,ensure_ascii=False)+'\n');print(json.dumps(r,sort_keys=True,ensure_ascii=False))
          PY
      - name: Final receipt
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: match-tourvisor-old-anex-key-v2-final, path: '${{ runner.temp }}/${{ env.OPERATION_ID }}/', if-no-files-found: error, retention-days: 90}
