name: MATCH SAMO business-live30 wave3 recover v1
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py'
      - 'tests/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1_test.py'
      - '.github/workflows/hotel-match-samo-business-live30-common4-acquire-v3-wave3-recover-v1.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-samo-business-live30-wave3-recover-1971-20260924-v1, cancel-in-progress: false}
env:
  OP: hotel-match-samo-business-live30-common4-acquire-v3-wave3-recover-1971-20260924-v1
  SEALED_OP: hotel-match-samo-business-live30-common4-acquire-1971-20260924-v3-wave3
  BASE: 48db6edecc206a5fe0937168288ff9a1af084d0f
  CLAIM: '5820564724'
  PLAN_ARTIFACT: '10798255813'
  PLAN_ARCHIVE_SHA: 1adf8a92bba3e447fec566c6b3a89a557d1446d5ca49dd5492b08b5b8625d87a
  PLAN_RESULT_SHA: 174cdd0bd45f48929fbda2e7c07383fbf81afccd18acccca990aee3ee94e6b23
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/samo-business-live30-common4-wave3-recover-v1-20260924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: python3 -m py_compile scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py tests/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1_test.py
      - run: python3 scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py --self-test
      - run: python3 tests/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1_test.py
      - run: "! grep -E 'requests\\.|urllib\\.request|curl|INSERT INTO|UPDATE .* SET|DELETE FROM|commit\\(' scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py"
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/samo-business-live30-common4-wave3-recover-v1-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim Security and immutable plan
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/plan terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-samo-business-live30-common4-acquire-v3-wave3-recover-v1.yml scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py tests/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1_test.py "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          assert os.environ['OP'] in b and os.environ['SEALED_OP'] in b
          for x in ['groups201-300','Never call provider','original.hotelKey','HTTP0','DB/mapping writes0']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PLAN_ARTIFACT/zip" -o input/plan.zip
          test "$(sha256sum input/plan.zip|awk '{print $1}')" = "$PLAN_ARCHIVE_SHA"
          unzip -q input/plan.zip -d input/plan
          result="$(find input/plan -type f -name result.json -print -quit)";receipt="$(find input/plan -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/plan-result.json;cp "$receipt" input/plan-receipt.json
          test "$(sha256sum input/plan-result.json|awk '{print $1}')" = "$PLAN_RESULT_SHA"
      - name: Recover wave3 saved evidence without provider access
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP";sealed=".anytoour-match/operations/$SEALED_OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_recovery','sealed_operation':os.environ['SEALED_OP'],'provider_http_calls':0,'database_writes':0,'mapping_writes':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test -d \"\$HOME/$sealed\";test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/plan-result.json "$remote:$op/payload/plan-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py "$remote:$op/payload/scripts/diagnostics/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SEALED_OPERATION_DIR=\"\$HOME/$sealed\" MATCH_PLAN_RESULT=\"\$HOME/$op/payload/plan-result.json\" MATCH_SOURCE_SHA='$HEAD' python3 \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_samo_business_live30_common4_acquire_v3_wave3_recover_v1.py\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          if r['state']!='completed_read_only_wave_recovery':
              print(json.dumps({'state':r['state'],'reason':r.get('reason')},sort_keys=True));raise SystemExit(2)
          assert r['global_group_count']==502 and r['group_start']==201 and r['group_end']==300
          assert r['completed_group_count']+r['partial_group_count']+r['untouched_group_count']==100
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0 and r['safe_to_write_now'] is False
          print(json.dumps({k:r[k] for k in ['state','expected_selected_edges','http_reservation_count','attempted_group_count','completed_group_count','partial_group_count','untouched_group_count','continuation_start_group','edge_state_counts','operator_state_counts','single_native_source_unique_count','single_native_source_collision_count']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-samo-business-live30-wave3-recover-v1-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
