name: SEARCH meal provider mapping plan read-only
'on':
  pull_request:
    types: [synchronize]
    branches: [release/search3-production-ready-v1]
    paths:
      - scripts/diagnostics/search3_meal_provider_mapping_plan_v1.php
      - .github/workflows/search3-meal-provider-mapping-plan-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: search3-meal-provider-mapping-plan-3353-20260923-v1, cancel-in-progress: false}
env:
  OPERATION_ID: search3-meal-provider-mapping-plan-3353-20260923-v1
  BASE_SHA: 40fa96a6e809251ea0b1bfe1d4dd2f5623e37110
  SCRIPT_PATH: scripts/diagnostics/search3_meal_provider_mapping_plan_v1.php
  WORKFLOW_PATH: .github/workflows/search3-meal-provider-mapping-plan-v1.yml
  SCRIPT_SHA256: 9019064399eab047d3eede1a93db206a038b497407786b25c829d25a08fddaa1
  CLAIM: '5791228715'
  CLAIM_SHA256: 0d3e910086939e669811ade6a96ba45c99cbf66d27238e3fc89d39a35f97f738
jobs:
  plan:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.event.pull_request.number == 3353 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact read-only source and claim
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          files=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert files=={os.environ['SCRIPT_PATH'],os.environ['WORKFLOW_PATH']},files
          assert hashlib.sha256(pathlib.Path(os.environ['SCRIPT_PATH']).read_bytes()).hexdigest()==os.environ['SCRIPT_SHA256']
          PY
          php -l "$SCRIPT_PATH"
          php "$SCRIPT_PATH" --self-test
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import hashlib,json,os
          c=json.load(open('input/claim.json'))
          assert c['id']==int(os.environ['CLAIM']) and c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert c['issue_url']=='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/3419'
          assert hashlib.sha256(c['body'].encode()).hexdigest()==os.environ['CLAIM_SHA256']
          assert os.environ['OPERATION_ID'] in c['body'] and 'READ ONLY' in c['body']
          PY
      - name: Persist reservation before DB access
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import datetime,json,os
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_db','source_sha':os.environ['HEAD_SHA'],'script_sha256':os.environ['SCRIPT_SHA256'],'at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'provider_calls':0,'database_writes':0,'schema_writes':0,'mapping_writes':0,'site_file_writes':0,'no_replay':True}
          with open('reservation/reservation.json','x') as f:f.write(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'search3-meal-provider-plan-reservation-${{ github.run_id }}', path: reservation/, retention-days: 30, if-no-files-found: error}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD_SHA']+'&per_page=100'
          for _ in range(90):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(req,timeout=30) as f:runs=[x for x in json.load(f)['workflow_runs'] if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD_SHA']]
              if runs and max(runs,key=lambda x:x['id'])['status']=='completed':
                  assert max(runs,key=lambda x:x['id'])['conclusion']=='success';break
              time.sleep(5)
          else: raise SystemExit('exact_security_not_green')
          PY
      - name: Read current accepted legacy meal evidence once
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/search3-meal-plan-key"; known="$RUNNER_TEMP/search3-meal-plan-known"; trap 'rm -f "$key" "$known"' EXIT
          test -n "$KEY"; test -n "$HOST"; test -n "$USER"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; op=".anytoour-search/operations/$OPERATION_ID"; script="${SCRIPT_PATH##*/}"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu; umask 077; test -s \"\$HOME/www/anytoour.ru/data/db-v1.php\"; test ! -e \"\$HOME/$op\"; mkdir -p \"\$HOME/.anytoour-search/operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""
          scp "${opts[@]}" "$SCRIPT_PATH" reservation/reservation.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op/payload\" && echo '$SCRIPT_SHA256  $script' | sha256sum -c - && php -l '$script' && php '$script' --self-test" > terminal/server-preflight.txt
          status=0
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" SEARCH3_OPERATION_DIR=\"\$HOME/$op\" SEARCH3_SOURCE_SHA='$HEAD_SHA' php \"\$HOME/$op/payload/$script\" --execute" > terminal/remote.stdout 2> terminal/remote.stderr || status=$?
          printf '%s\n' "$status" > terminal/remote.status
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\" && tar -czf - -- *.json" > terminal/server.tgz
          test "$status" = 0
      - name: Verify terminal read-only mapping plan
        env: {HEAD_SHA: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              assert set(t.getnames())=={'started.json','result.json','receipt.json'}
              for n in t.getnames():
                  m=t.getmember(n);assert m.isfile();pathlib.Path('terminal',n).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['operation']==q['operation']==os.environ['OPERATION_ID']
          assert r['source_sha']==q['source_sha']==os.environ['HEAD_SHA']
          assert r['state']==q['state']=='completed_read_only'
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          for k in ('provider_calls','database_writes','schema_writes','mapping_writes','site_file_writes'):assert r[k]==q[k]==0
          c=r['counts'];assert c['candidateNativeKeys']+c['heldNativeKeys']==c['validNativeKeys']+c['holdReasons'].get('invalid_native_key',0)
          assert r['acceptedLegacyRowCount']==c['acceptedLegacyRows'] and c['acceptedLegacyRows']<=5000
          for x in r['candidates']:
              assert x['explicitEvidenceCount']>=1 and len(x['planIds'])==1 and x['plan']['id']==x['planIds'][0]
          pathlib.Path('terminal/stage.txt').write_text('completed_read_only_verified\n')
          print(json.dumps({'acceptedLegacyRows':r['acceptedLegacyRowCount'],'candidates':c['candidateNativeKeys'],'holds':c['heldNativeKeys'],'holdReasons':c['holdReasons'],'schema':r['schema']},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'search3-meal-provider-mapping-plan-${{ github.run_id }}', path: terminal/, retention-days: 30, if-no-files-found: error}
