name: ANEX hotel catalog for AnyTour

on:
  push:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - '.github/workflows/anex-access-probe.yml'
      - 'tests/anex_workflow_isolation_test.py'
      - 'scripts/diagnostics/anex_review_storage*'
      - 'scripts/diagnostics/anex_review_auth_inventory.php'
      - 'scripts/diagnostics/anex_review_owner_*'
      - 'app/admin/anex-review/schema-manager.php'
      - 'scripts/diagnostics/anex_access_probe.py'
      - 'scripts/diagnostics/anex_hotel_match_probe.py'
      - 'scripts/diagnostics/anex_catalog_reader.php'
      - 'tests/anex_access_probe_test.py'
      - 'tests/anex_price_probe_test.py'
      - 'scripts/diagnostics/anex_price_evidence_queue.py'
      - 'scripts/diagnostics/anex_review_queue_export.py'
      - 'scripts/diagnostics/anex_price_evidence_checkpoint.py'
      - 'tests/anex_price_evidence_queue_test.py'
      - 'tests/anex_review_queue_export_test.py'
      - 'tests/anex_price_evidence_checkpoint_test.py'
      - 'scripts/diagnostics/anex_sales_priority_export.py'
      - 'tests/anex_sales_priority_export_test.py'
      - 'tests/anex_hotel_match_probe_test.py'
      - 'scripts/diagnostics/anex_adapter_probe.py'
      - 'scripts/diagnostics/anex_adapter_runner.php'
      - 'scripts/diagnostics/anex_full_catalog_probe.py'
      - 'scripts/diagnostics/anex_geo_enrichment.py'
      - 'scripts/diagnostics/anex_geo_checkpoint_restore.py'
      - 'scripts/diagnostics/anex_staging_import.py'
      - 'scripts/diagnostics/anex_staging_writer.php'
      - 'tests/anex_geo_enrichment_test.py'
      - 'tests/anex_geo_checkpoint_restore_test.py'
      - 'tests/anex_staging_import_test.py'
      - 'scripts/diagnostics/anex_catalog_bulk_reader.php'
      - 'app/integrations/**'
      - 'v2/api-anex-preview.php'
      - 'v2/api-anex-search3-preview.php'
      - 'v2/anex-search3-preview-v1.js'
      - 'v2/ds2-results-filters.js'
      - 'scripts/diagnostics/anex_search_mapping*'
      - 'scripts/diagnostics/anex_search3_*'
      - 'tests/anex_search_mapping*'
      - 'tests/anex_search3_*'
      - 'tests/anex-*-smoke.php'
      - 'tests/anex_adapter_probe_test.py'
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - '.github/workflows/anex-access-probe.yml'
      - 'tests/anex_workflow_isolation_test.py'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [observed, gaps, preview, paired, segments, content, topup, review]
        required: true
        description: Focused hotel queue, isolated preview, or reserved search experiment

permissions:
  contents: read
  actions: read

concurrency:
  # Automatic checks must not replace a pending explicitly requested operation.
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/anex-search-adapter-20260907' && 'anytour-anex-access-probe' || format('anytour-anex-access-probe-offline-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify explicit-operation isolation without private access
        run: python3 -B tests/anex_workflow_isolation_test.py
      - name: Verify request and credential boundaries locally
        run: |
          python3 -B tests/anex_review_storage_test.py
          php tests/anex-review-owner-auth-test.php
          python3 -B tests/anex-review-owner-publish-test.py
          php -l app/admin/anex-review/schema-manager.php
          php -l scripts/diagnostics/anex_review_storage_runner.php
          python3 -B tests/anex_search3_topup_experiment_test.py
          php -l scripts/diagnostics/anex_search3_topup_runner.php
          php tests/anex-search3-topup-runner-smoke.php
          python3 -B tests/anex_search3_catalog_content_test.py
          php -l scripts/diagnostics/anex_search3_catalog_content_reader.php
          php -l scripts/diagnostics/anex_search3_catalog_content_inspect.php
          php -l scripts/diagnostics/anex_search3_catalog_content_collect.php
          php -l scripts/diagnostics/anex_search3_catalog_content_photos.php
          php -l scripts/diagnostics/anex_search3_catalog_content_plan.php
          php tests/anex-catalog-content-smoke.php
          php -l scripts/diagnostics/anex_search3_catalog_content_repair.php
          php -l v2/data/hotel-details-v1.php
          php tests/hotel-details-smoke.php
          php -l scripts/diagnostics/anex_search3_hotel_content.php
          php tests/anex-hotel-content-smoke.php
          python3 -B tests/anex_access_probe_test.py
          python3 -B tests/anex_price_probe_test.py
          python3 -B tests/anex_hotel_match_probe_test.py
          python3 -B tests/anex_adapter_probe_test.py
          python3 -B tests/anex_full_catalog_probe_test.py
          python3 -B tests/anex_geo_enrichment_test.py
          python3 -B tests/anex_geo_checkpoint_restore_test.py
          python3 -B tests/anex_staging_import_test.py
          python3 -B tests/anex_price_evidence_queue_test.py
          python3 -B tests/anex_review_queue_export_test.py
          python3 -B tests/anex_price_evidence_checkpoint_test.py
          python3 -B tests/anex_sales_priority_export_test.py
          python3 -B tests/anex_exact_registry_builder_test.py
          python3 -B tests/anex_search_mapping_builder_test.py
          python3 -B tests/anex_search_mapping_import_test.py
          python3 -B tests/anex_search3_preview_deploy_test.py
          python3 -B tests/anex_search3_gap_queue_test.py
          python3 -B tests/anex_search3_observed_queue_test.py
          python3 -B tests/anex_search3_owner_decisions_test.py
          python3 -B tests/anex_search3_complete_review_test.py
          python3 -B tests/anex_search3_saved_review_test.py
          python3 -B tests/anex_search3_cached_evidence_audit_test.py
          python3 -B tests/anex_search3_cached_review_test.py
          python3 -B tests/anex_search3_alias_review_test.py
          python3 -B tests/anex_search3_cached_alias_review_test.py
          python3 -B tests/anex_search3_cached_detail_alias_review_test.py
          python3 -B tests/anex_search3_paired_experiment_test.py
          php -l scripts/diagnostics/anex_search3_paired_runner.php
          php tests/anex-search3-paired-runner-smoke.php
          python3 -B tests/anex_search3_segment_experiment_test.py
          php -l scripts/diagnostics/anex_search3_segment_runner.php
          php tests/anex-search3-segment-runner-smoke.php
          php -l scripts/diagnostics/anex_search3_owner_decisions.php
          node --check v2/anex-search3-preview-v1.js
          node --test tests/anex-search3-preview.test.js
          php -l scripts/diagnostics/anex_catalog_reader.php
          php -l scripts/diagnostics/anex_alias_catalog_reader.php
          php -l scripts/diagnostics/anex_cached_alias_reader.php
          php -l scripts/diagnostics/anex_search3_gap_details.php
          php -l scripts/diagnostics/anex_adapter_runner.php
          php -l scripts/diagnostics/anex_catalog_bulk_reader.php
          php -l scripts/diagnostics/anex_staging_writer.php
          php -l app/integrations/anex-xml-exact-registry.php
          for file in app/integrations/*.php; do php -l "$file"; done
          php -l v2/api-anex-preview.php
          php tests/anex-hotel-identities-smoke.php
          php tests/anex-xml-exact-registry-smoke.php
          php tests/anex-client-smoke.php
          php tests/anex-normalizer-smoke.php
          php tests/anex-search-smoke.php
          php -l scripts/diagnostics/anex_search_mapping_writer.php
          php -l scripts/diagnostics/anex_search3_mapping_runner.php
          php tests/anex-search-mapping-registry-smoke.php
          php -l v2/api-anex-search3-preview.php
          php tests/anex-search3-preview-smoke.php
          php tests/anex-search-observations-smoke.php
          php -l scripts/diagnostics/anex_search3_observations_setup.php

  verify-access:
    needs: offline-checks
    # A code change is not authorization to restore or run any private queue.
    # This job-level gate also covers every always() finalizer and artifact upload.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/anex-search-adapter-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Choose the requested ANEX operation
        id: operation
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'PYTHON'
          import os
          if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
              raise SystemExit('Explicit workflow_dispatch required')
          if os.environ.get('GITHUB_REF') != 'refs/heads/feature/anex-search-adapter-20260907':
              raise SystemExit('Assigned INT branch required')
          mode = os.environ.get('REQUESTED_OPERATION', '')
          if mode not in ('observed', 'gaps', 'preview', 'paired', 'segments', 'content', 'topup', 'review'):
              raise SystemExit('Explicit valid ANEX operation required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('mode=' + mode + '\n')
          print('ANEX operation:', mode)
          PYTHON
      - name: Restore cumulative hotel enrichment checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_geo_checkpoint_restore.py
      - name: Require the completed catalogue and preserve previous diagnostics
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: |
          # The owner approved existing exact and strong matches for test Search3.
          # Never restart enrichment or require an availability scan for these links.
          jq -e '.remaining == 0 and .processed_total == 8362 and (.rows | length) == 8362' \
            "$ANEX_CATALOG_ARTIFACT_DIR/anex-hotel-geo-enrichment.json" >/dev/null
          jq -e '.counts.anex_hotels > 0 and .counts.anex_hotels == (.matches | length)' \
            "$ANEX_CATALOG_ARTIFACT_DIR/anex-hotel-catalog-match.json" >/dev/null
      - name: Check gap runtime without supplier requests
        if: steps.operation.outputs.mode != 'review'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_gap_queue.py --preflight
      - name: Bind existing dossiers and schema before review storage operation
        if: steps.operation.outputs.mode == 'review'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_review_storage.py --prepare
      - name: Reserve scoped owner publication before filesystem changes
        if: steps.operation.outputs.mode == 'review'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_review_owner_publish.py --prepare
      - name: Preserve review storage reservation before database access
        if: steps.operation.outputs.mode == 'review'
        uses: actions/upload-artifact@v4
        with:
          name: anex-hotel-catalog-match-${{ github.run_id }}-${{ github.run_attempt }}-review-reserved
          path: ${{ runner.temp }}/anex-catalog/
          if-no-files-found: error
          retention-days: 30
      - name: Inspect or apply pinned local review storage through existing DB helper
        if: steps.operation.outputs.mode == 'review'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_review_storage.py
      - name: Inspect or publish the separate owner login without supplier or database calls
        if: steps.operation.outputs.mode == 'review'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_review_owner_publish.py
      - name: Inventory installed review authentication components without bootstrapping sessions
        # Review inventory never includes the application, adapter, DB helper or a supplier.
        if: steps.operation.outputs.mode == 'review'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_review_storage.py --auth-inventory
      - name: Reserve one owner-approved Tourvisor hotel batch
        if: steps.operation.outputs.mode == 'topup'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_topup_experiment.py --prepare
      - name: Preserve hotel-batch reservation before its single search
        if: steps.operation.outputs.mode == 'topup'
        uses: actions/upload-artifact@v4
        with:
          name: anex-hotel-catalog-match-${{ github.run_id }}-${{ github.run_attempt }}-topup-reserved
          path: ${{ runner.temp }}/anex-catalog/
          if-no-files-found: error
          retention-days: 30
      - name: Query three mapped hotels in one Tourvisor search
        if: steps.operation.outputs.mode == 'topup'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_topup_experiment.py --run
      - name: Save the bounded hotel-batch result without enabling automatic searches
        if: always() && steps.operation.outputs.mode == 'topup'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_topup_experiment.py --finalize
      - name: Inspect preserved ANEX description values (read-only; supplier content collection stopped)
        if: steps.operation.outputs.mode == 'content'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_catalog_content.py
      - name: Reserve the owner-requested one-day paired-search experiment
        if: steps.operation.outputs.mode == 'paired'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_paired_experiment.py --prepare
      - name: Reserve the three owner-requested Tourvisor segments
        if: steps.operation.outputs.mode == 'segments'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_segment_experiment.py --prepare
      - name: Prepare and reserve the independent initial-search queue
        if: steps.operation.outputs.mode == 'gaps'
        env:
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_gap_queue.py --prepare
      - name: Reserve new observed hotels and preserve earlier results
        if: steps.operation.outputs.mode == 'observed'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_observed_queue.py --prepare
      - name: Preserve reservation before any hotel requests
        if: steps.operation.outputs.mode == 'gaps' || steps.operation.outputs.mode == 'observed' || steps.operation.outputs.mode == 'paired' || steps.operation.outputs.mode == 'segments'
        uses: actions/upload-artifact@v4
        with:
          name: anex-hotel-catalog-match-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: ${{ runner.temp }}/anex-catalog/
          if-no-files-found: error
          retention-days: 30
      - name: Compare one day and one week using ANEX-only Tourvisor and direct ANEX
        if: steps.operation.outputs.mode == 'paired'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: |
          # Each case has a durable reservation; no replay after an unknown result.
          for paired_case in tv_day tv_week anex_day; do
            python3 -B scripts/diagnostics/anex_search3_paired_experiment.py --case "$paired_case"
          done
      - name: Save paired-search comparison and refresh observations without supplier calls
        if: always() && steps.operation.outputs.mode == 'paired'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_paired_experiment.py --finalize
      - name: Search three ANEX-only Tourvisor segments sequentially
        if: steps.operation.outputs.mode == 'segments'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: |
          # Three fixed initial filters; saved ANEX baseline requires zero ANEX calls.
          for segment_case in tv_alanya tv_5star tv_alanya_5star; do
            python3 -B scripts/diagnostics/anex_search3_segment_experiment.py --case "$segment_case"
          done
      - name: Save segment coverage and refresh observations without supplier calls
        if: always() && steps.operation.outputs.mode == 'segments'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_segment_experiment.py --finalize
      - name: Enrich at most 30 new initial-search gaps
        if: steps.operation.outputs.mode == 'gaps'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_gap_queue.py
      - name: Append independently verified new preview links
        if: steps.operation.outputs.mode == 'gaps'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: |
          python3 -B scripts/diagnostics/anex_search_mapping_import.py \
            --gap-checkpoint "$ANEX_CATALOG_ARTIFACT_DIR/anex-initial-search-checkpoint.json" \
            --mapping "$ANEX_CATALOG_ARTIFACT_DIR/anex-initial-search-mappings.json" \
            --report "$ANEX_CATALOG_ARTIFACT_DIR/anex-initial-search-mapping-import.json"
      - name: Match one batch of at most 30 newly observed hotels
        if: steps.operation.outputs.mode == 'observed'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_observed_queue.py
      - name: Append verified observed links and measure saved search coverage
        if: steps.operation.outputs.mode == 'observed'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: |
          python3 -B scripts/diagnostics/anex_search_mapping_import.py \
            --observed-checkpoint "$ANEX_CATALOG_ARTIFACT_DIR/anex-observed-hotel-checkpoint.json" \
            --mapping "$ANEX_CATALOG_ARTIFACT_DIR/anex-observed-hotel-mappings.json" \
            --report "$ANEX_CATALOG_ARTIFACT_DIR/anex-observed-hotel-mapping-import.json"
          python3 -B scripts/diagnostics/anex_search3_owner_decisions.py
          python3 -B scripts/diagnostics/anex_search3_observed_queue.py --finalize
          python3 -B scripts/diagnostics/anex_search3_complete_review.py
          python3 -B scripts/diagnostics/anex_search3_complete_review.py --accept
      - name: Reserve independent complete review of four saved records
        if: steps.operation.outputs.mode == 'observed'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_saved_review.py --prepare
      - name: Preserve saved-review reservation before complete catalog reads
        if: steps.operation.outputs.mode == 'observed'
        uses: actions/upload-artifact@v4
        with:
          name: anex-hotel-catalog-match-${{ github.run_id }}-${{ github.run_attempt }}-saved-review-reserved
          path: ${{ runner.temp }}/anex-catalog/
          if-no-files-found: error
          retention-days: 30
      - name: Resolve saved candidate limits without supplier requests
        if: steps.operation.outputs.mode == 'observed'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/anex-catalog
        run: python3 -B scripts/diagnostics/anex_search3_saved_review.py --run
      - name: Append the four independently verified saved-review links
        if: steps.operation.outputs.mode == 'observed'
