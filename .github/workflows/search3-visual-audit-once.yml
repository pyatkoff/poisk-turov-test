name: Search 3 visual audit once

on:
  push:
    branches: [feature/search3-preview]
    paths:
      - '.github/workflows/search3-visual-audit-once.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture Search 3 desktop and mobile journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cat > audit.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const url='https://anytoour.ru/_preview/search3/poisk-turov/';
          const fixture=[
            {id:901,name:'Rixos Premium Belek',category:5,rating:4.8,seaDistance:120,price:125000,picturelink:'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80',country:{name:'Турция'},region:{name:'Белек'},subRegion:{name:'Белек'},tours:[{id:'tour-901-a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'},roomType:'Standard Sea View',placement:'DBL',operator:{name:'ANEX'},isCharter:true},{id:'tour-901-b',date:'12.09.2026',nights:9,price:142000,meal:{name:'Ультра всё включено'},roomType:'Deluxe',placement:'DBL',operator:{name:'PEGAS'},isCharter:false}]},
            {id:902,name:'Long Beach Resort Hotel & Spa Deluxe Family Collection',category:5,rating:4.4,seaDistance:650,price:98000,picturelink:'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1200&q=80',country:{name:'Турция'},region:{name:'Аланья'},tours:[{id:'tour-902-a',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'},roomType:'Family Room',placement:'2ADL',operator:{name:'Coral Travel'},isCharter:false}]}
          ];
          async function shot(page,name){await page.screenshot({path:'audit/'+name+'.png',fullPage:true});}
          async function run(viewport,prefix){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport,ignoreHTTPSErrors:true});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const r=await page.goto(url+'?audit='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1800); await shot(page,prefix+'-initial');
            await page.evaluate(data=>window.V2Results.render(data),fixture); await page.waitForTimeout(450); await shot(page,prefix+'-results');
            const show=page.locator('.search3-show-tours').first(); if(await show.count()){await show.click(); await page.waitForTimeout(350); await shot(page,prefix+'-tours');}
            const direct=page.locator('.direct-tour').first(); if(await direct.count()){await direct.click(); await page.waitForTimeout(500); await shot(page,prefix+'-selected');}
            if(prefix==='mobile'){
              const back=page.locator('.back-results').first(); if(await back.count() && await back.isVisible()){await back.click();await page.waitForTimeout(300);}
              if(!await page.locator('.hotel-card').count()){await page.evaluate(data=>window.V2Results.render(data),fixture);await page.waitForTimeout(300);}
              const f=page.locator('[data-s3-open-filters]').first(); if(await f.count() && await f.isVisible()){await f.click();await page.waitForTimeout(250);await shot(page,prefix+'-filters');}
            }
            const report={http:r&&r.status(),errors,overflow:await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2),bodyClasses:await page.evaluate(()=>document.body.className)};
            fs.writeFileSync('audit/'+prefix+'-report.json',JSON.stringify(report,null,2));
            await browser.close();
          }
          (async()=>{await run({width:1440,height:1000},'desktop');await run({width:390,height:844},'mobile');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node audit.cjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-iteration1-visual-audit
          path: audit/
          retention-days: 7
