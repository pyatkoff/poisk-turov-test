name: MATCH saved links check
on:
  pull_request:
    paths:
      - scripts/diagnostics/hotel_match_tourvisor_multi_operator_links.py
      - tests/hotel_match_tourvisor_multi_operator_links_test.py
      - tests/hotel_match_nested_result_evidence_test.py
      - .github/workflows/hotel-match-saved-links-check.yml
  push:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_tourvisor_multi_operator_links.py
      - tests/hotel_match_tourvisor_multi_operator_links_test.py
      - tests/hotel_match_nested_result_evidence_test.py
      - .github/workflows/hotel-match-saved-links-check.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - name: Verify saved-link adapter and nested evidence offline
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/diagnostics/hotel_match_tourvisor_multi_operator_links.py
          python3 tests/hotel_match_tourvisor_multi_operator_links_test.py
          python3 tests/hotel_match_nested_result_evidence_test.py
          sha256sum scripts/diagnostics/hotel_match_tourvisor_multi_operator_links.py tests/hotel_match_tourvisor_multi_operator_links_test.py tests/hotel_match_nested_result_evidence_test.py
