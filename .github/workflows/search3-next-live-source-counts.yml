name: Search3 NEXT live source counts

on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-next-live-source-counts.yml'
      - 'scripts/diagnostics/search3_next_live_source_counts_gate.py'
      - 'tests/search3_next_live_source_counts_gate_test.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  live-source-counts:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Authorize exact owner SEARCH acceptance command
        run: python3 -B scripts/diagnostics/search3_next_live_source_counts_gate.py
      - name: Checkout Search3 release after authorization
        run: |
          set -euo pipefail
          git fetch --depth=1 origin release/search3-production-ready-v1
          git checkout --detach FETCH_HEAD
      - name: Install Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run one bounded NEXT live search
        run: |
          set -euo pipefail
          mkdir -p search3-next-live-source-counts
          cat > search3-next-live-source-counts.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            await context.route(/https?:\/\/mc\.yandex\.(ru|com)\//,r=>r.abort());
            const page=await context.newPage();
            const seen={tourvisor:null,anex:null,andromeda:null};
            page.on('console',m=>{const s=m.text(); if(/provider|anex|andromeda|tourvisor/i.test(s)) console.log('BROWSER',s.slice(0,500));});
            const u=new URL('https://anytoour.ru/_preview/search3-next-candidate/visual-search/');
            Object.entries({origin:'Москва',country:'4',from:'2026-10-10',to:'2026-10-16',minNights:'7',maxNights:'7',adults:'2',ages:'',searched:'1'}).forEach(([k,v])=>u.searchParams.set(k,v));
            const res=await page.goto(u.toString(),{waitUntil:'domcontentloaded',timeout:45000});
            if(!res||res.status()!==200)throw new Error('NEXT_HTTP_'+(res&&res.status()));
            await page.waitForFunction(()=>document.querySelectorAll('.hotel-card').length>0,{timeout:120000});
            await page.waitForTimeout(45000);
            const state=await page.evaluate(()=>{
              const items=(window.V2Results&&window.V2Results.state&&window.V2Results.state.items)||[];
              const offers={tourvisor:0,anex:0,andromeda:0},hotels={tourvisor:new Set(),anex:new Set(),andromeda:new Set()};
              for(const h of items) for(const t of (h.tours||[])){const p=String(t.provider||'tourvisor').toLowerCase();if(!(p in offers))continue;offers[p]++;hotels[p].add(String(h.id));}
              return {hotelCards:document.querySelectorAll('.hotel-card').length,hotels:{tourvisor:hotels.tourvisor.size,anex:hotels.anex.size,andromeda:hotels.andromeda.size},offers};
            });
            fs.writeFileSync('search3-next-live-source-counts/result.json',JSON.stringify(state,null,2));
            console.log('SEARCH3_NEXT_SOURCE_COUNTS',JSON.stringify(state));
            if(state.offers.tourvisor<1)throw new Error('TOURVISOR_EMPTY');
            if(state.offers.anex<1)throw new Error('DIRECT_ANEX_EMPTY');
            if(state.offers.andromeda<1)throw new Error('ANDROMEDA_EMPTY');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node search3-next-live-source-counts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search3-next-live-source-counts
          path: search3-next-live-source-counts/result.json
          if-no-files-found: warn
          retention-days: 7
