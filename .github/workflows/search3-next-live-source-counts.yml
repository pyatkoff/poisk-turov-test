name: Search3 NEXT live source counts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/search3-next-live-source-counts.yml'
      - 'scripts/diagnostics/search3_next_live_source_counts*.py'
      - 'tests/search3_next_live_source_counts*_test.py'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  acceptance-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install fixed browser test dependency
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Offline owner, budget, redaction and actual browser-click tests
        run: python3 -m unittest discover -s tests -p 'search3_next_live_source_counts*_test.py' -v

  live-source-counts:
    if: >-
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.repository == 'pyatkoff/poisk-turov-test' && github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.event.issue.number == 3419 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 &&
      github.event.comment.body == '/search3-next-live-source-counts-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
    concurrency:
      group: search3-next-live-source-counts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize one fresh owner command from the same trusted commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/diagnostics/search3_next_live_source_counts_gate.py
      - name: Install fixed browser dependency
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Verify NEXT bytes then click Find once and observe canonical results
        env:
          SEARCH3_NEXT_LIVE_ALLOWED: v12
        run: python3 scripts/diagnostics/search3_next_live_source_counts.py
      - name: Retain aggregate counts and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-next-live-source-counts-${{ github.run_id }}
          path: search3-next-live-source-counts/
          if-no-files-found: warn
          retention-days: 7
