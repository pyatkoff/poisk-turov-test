name: MATCH former-name current review
run-name: MATCH former-name CURRENT-DB review #1971
on:
  push:
    branches: ['feat/match-current-bulk-review-20260911']
    paths:
      - 'scripts/diagnostics/hotel_match_former_name_review.php'
      - 'tests/hotel-match-former-name-review-test.php'
      - '.github/workflows/hotel-match-former-name-review.yml'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-former-name-review-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-former-name-review-1971-20260911-v1
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read-only former-name source
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_former_name_review.php
          php -l tests/hotel-match-former-name-review-test.php
          php tests/hotel-match-former-name-review-test.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_former_name_review.php').read_text(encoding='utf-8')
          assert "hotel-match-former-name-review-1971-20260911-v1" in s
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert 'coordinate_conflict' in s and 'former_name_ambiguous' in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl','http://','https://'):
              assert bad.lower() not in s.lower(), bad
          print('read-only former-name MATCH scope verified')
          PYTHON
      - name: Reserve immutable read operation
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          state=Path(os.environ['STATE'])
          reservation={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_ssh','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'mode':'current_db_explicit_former_name_read_only','database_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (state/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n',encoding='utf-8')
          PYTHON
      - name: Preserve reservation before live read
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-former-name-review-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-match-former-name-review-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run CURRENT DB former-name review
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib,json,os,shlex,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[len('<?php'):]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          pcbr=body('scripts/diagnostics/hotel_match_pending_candidate_bridge_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          live=body('scripts/diagnostics/hotel_match_live_priority_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_pending_candidate_bridge_review.php';\n",'',1)
          translit=body('scripts/diagnostics/hotel_match_translit_exact_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_live_priority_review.php';\n",'',1)
          former=body('scripts/diagnostics/hotel_match_former_name_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_translit_exact_review.php';\n",'',1)
          wrapper=r'''
          $root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');
          $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php')); if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper');
          require_once $dbHelper; $db=v2_data_db(); echo fc_json(hmfn_review($db,HMFN_OPERATION)),"\n";
          '''
          code="define('FC_LIBRARY_ONLY',true);\n"+helper+"\n"+bulk+"\n"+pcbr+"\n"+live+"\n"+translit+"\n"+former+"\n"+wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER');host=os.environ[req[1]].strip();user=os.environ[req[2]].strip();keytext=os.environ[req[0]].strip()
          if not host or not user or not keytext: raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-former-name-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key';key.write_text(keytext.rstrip()+'\n');key.chmod(0o600);known=Path(tmp)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
              try:p=subprocess.run(cmd,text=True,capture_output=True,timeout=720,env=clean)
              except subprocess.TimeoutExpired:
                  (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'ssh_read_timeout','database_writes':0,'supplier_calls':0},sort_keys=True)+'\n');raise
          try:r=json.loads(p.stdout)
          except Exception:
              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'live_output_unparseable','exit_code':p.returncode,'stderr_tail':p.stderr[-1500:],'database_writes':0,'supplier_calls':0},ensure_ascii=False,sort_keys=True)+'\n');raise RuntimeError('live_output_unparseable')
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw)
          if p.returncode!=0 or r.get('status')!='completed' or r.get('operation_id')!=os.environ['OPERATION_ID'] or r.get('database_writes')!=0 or r.get('supplier_calls')!=0 or r.get('historical_operations_replayed') is not False:
              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'current_review_not_completed','exit_code':p.returncode,'result_status':r.get('status'),'database_writes':r.get('database_writes'),'supplier_calls':r.get('supplier_calls')},ensure_ascii=False,sort_keys=True)+'\n');raise RuntimeError('current_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'consistent_snapshot':True,'no_replay':True,'stats':r['stats'],'coverage':r['coverage']}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          s=r['stats'];c=r['coverage']
          summary=(f"MATCH #1971 explicit former-name CURRENT-DB review `{r['operation_id']}` completed **read-only / NO-REPLAY**. Indexed **{s['former_segments_indexed']}** explicit EX./former-name segments. Examined Andromeda **{s['andromeda_examined']}**, ANEX **{s['anex_examined']}**, live unresolved **{s['live_examined']}**. Prepared **{s['prepared']}** unique direct-geo former-name candidates: Andromeda **{s['prepared_andromeda']}**, ANEX **{s['prepared_anex']}**, live **{s['live_prepared']}**, opposite-provider bridge **{s['opposite_bridge_prepared']}**, single-token <=100m anchors **{s['single_token_coordinate_prepared']}**, category mismatch annotations **{s['category_mismatch_prepared']}**. Ambiguous former-name targets **{s['former_name_ambiguous']}**. Coverage snapshot: ANEX links {c['anex_links']}, ANEX unique local {c['anex_unique_local']}, Andromeda unique local {c['andromeda_unique_local']}, triple {c['all_three']}. DB writes **0**, supplier calls **0**. Acceptance requires a distinct new operation after artifact inspection.")
          (state/'summary.md').write_text(summary+'\n',encoding='utf-8');print(json.dumps({'stats':s,'coverage':c},ensure_ascii=False,sort_keys=True))
          PYTHON
      - name: Preserve result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-former-name-review-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-former-name-review-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"; gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
