name: Owner Search3 verified quote UI publish
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: anytoour-search3-quote-ui-single-asset-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 996 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/publish-search3-verified-quote-ui-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require exact owner command and first attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.issue.number }}" = 996
          test "${{ github.event.comment.body }}" = /publish-search3-verified-quote-ui-v1
      - uses: actions/checkout@v4
        with:
          ref: 2a5d569972848b93ae5fb4a263224f180ad93739
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: helper
          persist-credentials: false
      - name: Recheck exact source and bounded publisher offline
        run: |
          test "$(git -C source rev-parse HEAD)" = 2a5d569972848b93ae5fb4a263224f180ad93739
          python3 source/tests/search3_quote_ui_single_asset_publish_test.py -v
          python3 -m py_compile source/scripts/diagnostics/search3_quote_ui_single_asset_publish.py
      - name: Publish exact verified quote UI asset to isolated site candidate
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          QUOTE_UI_SOURCE_SHA: 2a5d569972848b93ae5fb4a263224f180ad93739
          QUOTE_UI_HELPER_PATH: ${{ github.workspace }}/helper
        run: python3 -B source/scripts/diagnostics/search3_quote_ui_single_asset_publish.py source
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-quote-ui-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/search3-quote-ui-publication/result.json
          if-no-files-found: warn
          retention-days: 14
