name: Tourvisor GREEN GOLD concrete actualization
on:
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - 'scripts/diagnostics/tourvisor_green_gold_actualization.py'
      - 'tests/tourvisor_green_gold_actualization_test.py'
      - '.github/workflows/tourvisor-green-gold-actualization.yml'
  push:
    branches: ['ops/int-tourvisor-green-gold-actualization-20260913']
    paths: ['.github/ops/tourvisor-green-gold-actualization-20260913']
permissions:
  contents: read
concurrency:
  group: tv-green-gold-actualization-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Focused actualization checks
        run: |
          python3 -B tests/tourvisor_green_gold_actualization_test.py
          python3 -B - <<'PY' >/tmp/tv-act.php
          import importlib.util
          spec=importlib.util.spec_from_file_location('p','scripts/diagnostics/tourvisor_green_gold_actualization.py')
          p=importlib.util.module_from_spec(spec); spec.loader.exec_module(p)
          print('<?php'); print(p.php_source())
          PY
          php -l /tmp/tv-act.php
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-tourvisor-green-gold-actualization-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed source
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/tourvisor-green-gold-actualization-20260913'
          test "$(cat control/.github/ops/tourvisor-green-gold-actualization-20260913)" = "source=${SOURCE_SHA};operation=read-only-tourvisor-green-gold-actualization;scenario=GREEN-GOLD-2026-10-12-7n-2a-AI;owner=2026-09-13"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Run one concrete search-detail-flights actualization
        id: probe
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/tv-actualization"
          python3 -B source/scripts/diagnostics/tourvisor_green_gold_actualization.py "$RUNNER_TEMP/tv-actualization"
      - name: Preserve sanitized actualization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tourvisor-green-gold-actualization-${{ github.run_id }}
          path: ${{ runner.temp }}/tv-actualization/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation
        if: steps.probe.outcome != 'success'
        run: exit 1
