name: MATCH COMMON4 continuation writer c0 c30

on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/hotel-match-common4-continuation-writer-c0-c30-v1.yml'

permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-common4-continuation-writer-1971-20260923-v12, cancel-in-progress: false}

env:
  OP: hotel-match-common4-continuation-writer-1971-20260923-v12
  BASE: cf99f2c1d247a2517591e40b0b745cbe629703cd
  CLAIM: '5802387111'
  AUDIT_ARTIFACT: '10775291892'
  AUDIT_ARCHIVE_SHA: f458ba0c645c7f12c400f9997e4d1bd985d3e78dbe6b5e20564130f4b83bd190
  EXPECTED_WRITES: '5'

jobs:
  live:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'ops/match-common4-continuation-writer-c0-c30-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source claim Security and audit artifact
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir -p input terminal reservation
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-common4-continuation-writer-c0-c30-v1.yml "
          php -l scripts/diagnostics/hotel_match_common4_continuation_writer_v12.php
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json')); b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],os.environ['AUDIT_ARTIFACT'],os.environ['AUDIT_ARCHIVE_SHA'],'expected writes=5','SERIALIZABLE','HTTP0']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion']; break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AUDIT_ARTIFACT/zip" >input/audit.zip
          test "$(sha256sum input/audit.zip | awk '{print $1}')" = "$AUDIT_ARCHIVE_SHA"
          unzip -q input/audit.zip -d input/audit
          result="$(find input/audit -type f -name result.json -print -quit)"; receipt="$(find input/audit -type f -name receipt.json -print -quit)"
          test -n "$result"; test -n "$receipt"; cp "$result" input/audit-result.json; cp "$receipt" input/audit-receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          b=pathlib.Path('input/audit-result.json').read_bytes(); r=json.loads(b); q=json.load(open('input/audit-receipt.json'))
          sha=hashlib.sha256(b).hexdigest()
          assert q['result_sha256']==sha
          assert r['state']=='completed_read_only_continuation_current' and r['searched_hotels']==35
          assert r['input_single_native_edges']==13 and r['writer_ready_counts']=={'anex':0,'identity':5}
          assert r['supplier_calls']==r['database_writes']==r['mapping_writes']==0 and r['safe_to_write_now'] is False
          pathlib.Path('input/audit.sha').write_text(sha)
          PY
          audit_sha="$(cat input/audit.sha)"
          printf '{"operation":"%s","state":"reserved_before_write","source_sha":"%s","audit_result_sha256":"%s","expected_writes":5,"provider_calls":0,"database_writes":0,"mapping_writes":0}\n' "$OP" "$HEAD" "$audit_sha" >reservation/reservation.json
      - name: Execute exact 5-row transactional writer
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"; audit_sha="$(cat input/audit.sha)"
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json input/audit-result.json scripts/diagnostics/hotel_match_common4_continuation_writer_v12.php "$remote:$op/payload/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\";cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_AUDIT_RESULT=\"\$HOME/$op/payload/audit-result.json\" MATCH_AUDIT_SHA='$audit_sha' MATCH_SOURCE_SHA='$HEAD' MATCH_EXPECTED_WRITES='5' php \"\$HOME/$op/payload/hotel_match_common4_continuation_writer_v12.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";mkdir -p export;for f in reservation.json pre-commit.json commit-attempt.json result.json receipt.json;do test -f \"\$f\"&&cp \"\$f\" export/;done;tar -czf - -C export ." >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  n=m.name.lstrip('./')
                  if m.isfile(): pathlib.Path('terminal',n).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json')); q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          if r['state']!='committed_verified':
              print(json.dumps({'state':r['state'],'reason':r.get('reason'),'database_writes':r.get('database_writes')},sort_keys=True)); raise SystemExit(2)
          assert r['inserted']==5 and r['database_writes']==r['mapping_writes']==5 and r['readback_verified'] is True
          assert sum(r['inserted_by_namespace'].values())==5 and q['state']=='committed_verified' and q['no_replay'] is True
          print(json.dumps({'state':r['state'],'inserted':r['inserted'],'inserted_by_namespace':r['inserted_by_namespace'],'unique_targets':r['unique_targets'],'readback_verified':True},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-continuation-writer-c0-c30-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
