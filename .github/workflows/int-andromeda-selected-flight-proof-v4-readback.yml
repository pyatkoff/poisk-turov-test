name: INT Andromeda selected-flight v4 readback v2

on:
  push:
    branches: ['ops/int-andromeda-selected-flight-proof-v4-readback-20260918']
    paths:
      - '.github/workflows/int-andromeda-selected-flight-proof-v4-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: 325ea3d8fc4752c95ddcc6bccf715dae24f7836a
      READBACK_OPERATION: int-andromeda-selected-flight-proof-v4-readback-1717-20260918-v2
      SOURCE_OPERATION: int-andromeda-selected-flight-proof-1717-20260918-v4
      SOURCE_GENERATION: '17171832'
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 6
          persist-credentials: false

      - name: Bind read-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/int-andromeda-selected-flight-proof-v4-readback.yml'
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY"
          test -n "$ANYTOOUR_DEPLOY_HOST"
          test -n "$ANYTOOUR_DEPLOY_USER"

      - name: Read sanitized terminal evidence only
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          opts=(-T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          ssh "${opts[@]}" "$remote" bash -s -- "$SOURCE_OPERATION" "$SOURCE_GENERATION" "$READBACK_OPERATION" <<'REMOTE' | tee "$RUNNER_TEMP/readback.json"
          set -euo pipefail
          export SOURCE_OPERATION="$1"
          export READBACK_GENERATION="$2"
          export READBACK_OPERATION="$3"
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $op=(string)getenv('SOURCE_OPERATION');
          $generation=(int)getenv('READBACK_GENERATION');
          $readbackOperation=(string)getenv('READBACK_OPERATION');
          $home=(string)getenv('HOME');
          $ledger=$home.'/.anytour-ops/'.$op;
          $state=is_file($ledger.'/state')?trim((string)file_get_contents($ledger.'/state')):'missing';
          $error=is_file($ledger.'/error.log')?(string)file_get_contents($ledger.'/error.log'):'';
          $failure='unknown';
          $fatalKind=null; $fatalSymbol=null; $fatalFile=null; $fatalLine=null;
          if(preg_match('/(ANDROMEDA_SELECTED_PROOF_[A-Z_]+)/',$error,$m)) $failure=$m[1];
          elseif(str_contains($error,'anytour_andromeda_search3_mapping_allows')) $failure='missing_mapping_helper';
          elseif(str_contains($error,'Failed opening required')||str_contains($error,'failed to open stream')) $failure='missing_runtime_dependency';
          elseif(str_contains($error,'SQLSTATE')) $failure='database_exception';
          elseif(str_contains($error,'TypeError')) $failure='type_error';
          elseif(str_contains($error,'Fatal error')) $failure='other_fatal';
          elseif($error==='') $failure='no_error_log';

          $patterns=[
            'undefined_function'=>'/Call to undefined function\\s+([A-Za-z0-9_\\\\]+)\\(\\)/',
            'undefined_method'=>'/Call to undefined method\\s+([A-Za-z0-9_\\\\]+(?:::|->)[A-Za-z0-9_]+)\\(\\)/',
            'missing_class'=>'/Class [\"\']([A-Za-z0-9_\\\\]+)[\"\'] not found/',
            'argument_count'=>'/(?:Too few|Too many) arguments to function\\s+([A-Za-z0-9_\\\\]+(?:::|->)?[A-Za-z0-9_]*)/',
            'undefined_constant'=>'/Undefined constant [\"\']([A-Za-z0-9_\\\\]+)[\"\']/',
            'redeclare'=>'/Cannot redeclare\\s+([A-Za-z0-9_\\\\]+)\\(\\)/',
          ];
          foreach($patterns as $kind=>$pattern){
            if(preg_match($pattern,$error,$m)){ $fatalKind=$kind; $fatalSymbol=$m[1]; break; }
          }
          if(preg_match('/(?: in |thrown in )([^\\s:]+\\.php)(?::| on line )(\\d+)/',$error,$m)){
            $fatalFile=basename($m[1]); $line=(int)$m[2]; if($line>0&&$line<100000)$fatalLine=$line;
          }

          $configPath=$home.'/.anytoour-andromeda/search3-preview.php';
          $searchFiles=0; $completeSearchFiles=0; $packageAttempts=0; $packages=0; $surcharges=0;
          if(is_file($configPath)){
            $cfg=require $configPath;
            $catalog=is_array($cfg)?($cfg['catalog_path']??null):null;
            $dir=is_string($catalog)&&$catalog!==''?dirname($catalog).'/searches':null;
            if(is_string($dir)&&is_dir($dir)&&!is_link($dir)){
              foreach(glob($dir.'/*.json')?:[] as $path){
                if(is_link($path)||!is_file($path)) continue;
                $size=filesize($path); if(!is_int($size)||$size<2||$size>3000000) continue;
                $raw=(string)file_get_contents($path);
                if(!preg_match('/\"generation\"\s*:\s*'.$generation.'(?:[^0-9]|$)/',$raw)) continue;
                $base=basename($path);
                if(str_ends_with($base,'-package-attempt-v2.json')) ++$packageAttempts;
                elseif(str_ends_with($base,'-package.json')) ++$packages;
                elseif(str_ends_with($base,'-surcharge-v1.json')) ++$surcharges;
                else {
                  ++$searchFiles;
                  try{$j=json_decode($raw,true,32,JSON_THROW_ON_ERROR);if(($j['status']??null)==='complete')++$completeSearchFiles;}catch(Throwable){}
                }
              }
            }
          }
          echo json_encode([
            'status'=>'readback_complete',
            'readback_operation'=>$readbackOperation,
            'source_operation_state'=>$state,
            'failure_class'=>$failure,
            'fatal_kind'=>$fatalKind,
            'fatal_symbol'=>$fatalSymbol,
            'fatal_file'=>$fatalFile,
            'fatal_line'=>$fatalLine,
            'error_sha256'=>$error!==''?hash('sha256',$error):null,
            'search_state_files'=>$searchFiles,
            'complete_search_state_files'=>$completeSearchFiles,
            'package_attempt_sidecars'=>$packageAttempts,
            'package_sidecars'=>$packages,
            'surcharge_sidecars'=>$surcharges,
            'supplier_calls_performed_by_readback'=>0,
            'db_writes'=>0,
            'replay_performed'=>false
          ],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          PHP
          REMOTE

      - name: Preserve sanitized readback
        uses: actions/upload-artifact@v4
        with:
          name: int-andromeda-selected-flight-v4-readback-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/readback.json
          retention-days: 30
