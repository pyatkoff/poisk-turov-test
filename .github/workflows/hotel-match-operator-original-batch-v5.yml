name: MATCH operator original bulk price v5 continuation
on:
  push:
    branches: [ops/match-operator-original-batch-1971-20260915-v5]
    paths: [.github/workflows/hotel-match-operator-original-batch-v5.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-operator-original-1971-v5, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-operator-original-batch-1971-20260915-v5
jobs:
  collect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Verify source and bind untouched continuation only
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_operator_original_batch.php)" = b0b2f9930363ad9a32dd4906bcc38a771bf2e3e4
          php -l scripts/diagnostics/hotel_match_operator_original_batch.php
          php tests/hotel_match_operator_original_test.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/diagnostics/hotel_match_operator_original_batch.php')
          raw=p.read_text()
          old="const MOB_OP='hotel-match-operator-original-batch-1971-20260915-v2';"
          new="const MOB_OP='hotel-match-operator-original-batch-1971-20260915-v5';"
          cut="    array_shift($queries);\n    return ['target_count'=>count($targets)"
          repl="    array_shift($queries);\n    $queries=array_slice($queries,10);\n    return ['target_count'=>count($targets)"
          assert raw.count(old)==1 and raw.count(cut)==1 and new not in raw
          raw=raw.replace(old,new).replace(cut,repl)
          p.write_text(raw)
          PY
          grep -Fx "const MOB_OP='hotel-match-operator-original-batch-1971-20260915-v5';" scripts/diagnostics/hotel_match_operator_original_batch.php
          grep -Fx '    $queries=array_slice($queries,10);' scripts/diagnostics/hotel_match_operator_original_batch.php
          php -l scripts/diagnostics/hotel_match_operator_original_batch.php
          test "$(git hash-object app/integrations/andromeda-client.php)" = 7f2a444904e25f8abf1b50b70879b1650984800c
          test "$(git hash-object app/integrations/andromeda-transport.php)" = 162e33d3f1997ec7e73e1ef276c586d4732f8957
          sha256sum scripts/diagnostics/hotel_match_operator_original_batch.php | awk '{print $1}' > "$RUNNER_TEMP/runtime-script-sha256"
      - name: Restore hash-pinned base and terminal v4 evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,io,os,pathlib,subprocess,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'source';root.mkdir()
          inputs=[('current',10369717804,'bfeaaf709464101e883ad92620a4d74cdabdd1fbcd1f55b707a5f43e1c8bef4d','server/result.json'),('egypt',10113498830,'8d82b5b2e4db23c8af691e98d63e0c2c40df99a5822cb27494971879ef92cb63','all.json'),('turkey',10118184869,'b03e15604fb3a3035efeab97a7099aaafca76ee6ae9a70513cbf176bc70dc49a','capture.json'),('saved',10109677472,'0a31817b0032c2bf4fedf2c827a4450e2b5a71333facf2a1aec95af0f6ff7aff','price.json'),('barcelo',10369008837,'6fca5684069fbc7e5bb09bea11073e5eaa3d29385ec1173e0d2061b69a8518d6','result.json'),('previous',10370118140,'03f897d267d9db5a7cc7957835fe27a1f6d2cfdb0386ddfb308fad852527d832','result.json')]
          for name,aid,digest,member in inputs:
            p=subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/{aid}/zip'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,timeout=90)
            assert hashlib.sha256(p.stdout).hexdigest()==digest
            with zipfile.ZipFile(io.BytesIO(p.stdout)) as z:
              assert z.getinfo(member).file_size<30*1024*1024
              dest=root/name/member;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(member))
          p=subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/10386624999/zip'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True,timeout=90)
          assert hashlib.sha256(p.stdout).hexdigest()=='6919fae1692fa63e02c5a1135e7d9059569653f727bf13d6c925173f335b0c45'
          v4=root/'v4';v4.mkdir()
          with zipfile.ZipFile(io.BytesIO(p.stdout)) as z:
            for n in z.namelist():
              if n=='result.json' or (n.startswith('request-') and n.endswith('.json')):
                (v4/n).write_bytes(z.read(n))
          assert hashlib.sha256((v4/'result.json').read_bytes()).hexdigest()=='7b014c80828aab32ba68148b079731ce7a61deb039d9eb39bbd64a54d889fa57'
          PY
          php scripts/diagnostics/hotel_match_operator_original_batch.php plan "$RUNNER_TEMP/source" > "$RUNNER_TEMP/plan.json"
      - name: Prove no replay and reserve exact continuation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP']); source=root/'source'; out=root/os.environ['OPERATION_ID']; out.mkdir(mode=0o700)
          plan_raw=(root/'plan.json').read_bytes(); plan=json.loads(plan_raw)
          assert plan['target_count']==385 and plan['target_operator_count']==1540 and plan['query_count']==45
          v4=json.loads((source/'v4/result.json').read_text())
          assert v4['operation_id']=='hotel-match-operator-original-batch-1971-20260915-v4' and v4['state']=='stopped_no_retry' and v4['price_calls']==13
          consumed=[]
          for p in sorted((source/'v4').glob('request-*.json')):
            d=json.loads(p.read_text()); consumed.append(d['request_sha256'])
          assert len(consumed)==13 and len(set(consumed))==13
          (out/'reserved-plan.json').write_bytes(plan_raw)
          (out/'parent-v4.json').write_text(json.dumps({'operation_id':v4['operation_id'],'result_sha256':'7b014c80828aab32ba68148b079731ce7a61deb039d9eb39bbd64a54d889fa57','reserved_request_sha256':consumed,'state':v4['state'],'replayed':False},sort_keys=True)+'\n')
          script_sha=(root/'runtime-script-sha256').read_text().strip()
          runtime={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'original_script_git_blob':'b0b2f9930363ad9a32dd4906bcc38a771bf2e3e4','runtime_script_sha256':script_sha,'binding':'v5 + skip first 10 post-v1 plan queries'}
          (out/'runtime-code.json').write_text(json.dumps(runtime,sort_keys=True)+'\n')
          reservation={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_supplier_access','plan_sha256':hashlib.sha256(plan_raw).hexdigest(),'runtime_script_sha256':script_sha,'parent_v4_result_sha256':'7b014c80828aab32ba68148b079731ce7a61deb039d9eb39bbd64a54d889fa57','excluded_reserved_requests':13,'excluded_plan_queries':10,'remaining_plan_queries':45,'max_price_calls':120,'targets':385,'operators':[5,315,342,115],'database_writes':0,'no_replay':True}
          (out/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          PY
          php -r '$p=json_decode(file_get_contents(getenv("RUNNER_TEMP")."/plan.json"),true,64,JSON_THROW_ON_ERROR); $parent=json_decode(file_get_contents(getenv("RUNNER_TEMP")."/".getenv("OPERATION_ID")."/parent-v4.json"),true,64,JSON_THROW_ON_ERROR); $seen=array_fill_keys($parent["reserved_request_sha256"],true); foreach($p["queries"] as $q){foreach([1,2] as $page){$x=$q["params"];$x["PAGE"]=$page;$raw=json_encode($x,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR)."\n";$h=hash("sha256",$raw);if(isset($seen[$h])){fwrite(STDERR,"replay\n");exit(2);}}} echo "no-replay-ok\n";'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-operator-original-batch-v5-reservation
          path: |
            ${{ runner.temp }}/hotel-match-operator-original-batch-1971-20260915-v5/reservation.json
            ${{ runner.temp }}/hotel-match-operator-original-batch-1971-20260915-v5/reserved-plan.json
            ${{ runner.temp }}/hotel-match-operator-original-batch-1971-20260915-v5/runtime-code.json
            ${{ runner.temp }}/hotel-match-operator-original-batch-1971-20260915-v5/parent-v4.json
          if-no-files-found: error
          retention-days: 90
      - name: Collect untouched original hotel keys only
        env:
          ANDROMEDA_USERNAME: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD: ${{ secrets.ANDROMEDA_PASSWORD }}
        run: php scripts/diagnostics/hotel_match_operator_original_batch.php run "$RUNNER_TEMP/source" "$RUNNER_TEMP/$OPERATION_ID"
      - name: Independent completed result readback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; raw=(p/'result.json').read_bytes(); r=json.loads(raw); receipt=json.loads((p/'receipt.json').read_text()); reservation=json.loads((p/'reservation.json').read_text())
          assert receipt['result_sha256']==hashlib.sha256(raw).hexdigest() and receipt['readback_verified']
          assert all(x['source_sha']==os.environ['GITHUB_SHA'] and x['operation_id']==os.environ['OPERATION_ID'] for x in (r,receipt,reservation))
          assert r['state']=='completed' and r['database_writes']==r['all_calls']==r['booking_calls']==r['tourvisor_calls']==0
          print(json.dumps({'unique_pairs':r['unique_pair_count'],'supplier_calls':r['supplier_calls'],'price_calls':r['price_calls'],'result_sha256':receipt['result_sha256']}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-operator-original-batch-v5-result
          path: ${{ runner.temp }}/hotel-match-operator-original-batch-1971-20260915-v5/
          if-no-files-found: warn
          retention-days: 90
