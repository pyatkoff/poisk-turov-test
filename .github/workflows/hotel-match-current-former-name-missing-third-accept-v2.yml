name: MATCH current former-name missing-third accept v2
on:
  push:
    branches: ['ops/match-current-former-name-missing-third-accept-1971-20260911-v2']
    paths: ['.github/workflows/hotel-match-current-former-name-missing-third-accept-v2.yml']
permissions:
  contents: read
  issues: write
concurrency:
  group: match-current-former-name-missing-third-accept-1971-v2
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-current-former-name-missing-third-accept-1971-20260911-v2
  REVIEW_OPERATION: hotel-match-current-missing-third-strict-review-1971-20260911-v5
  REVIEW_RUN: '34633267776'
  REVIEW_ARTIFACT: '10277186924'
  EXPECTED_ACCEPT_BLOB: 4d802154f378dfde961eaed7124765890994ef0b
jobs:
  accept:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.event.head_commit.message == 'MATCH #1971 run former-name missing-third accept v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compose guarded writer
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/match-current-former-name-missing-third-accept-1971-v2.arm)" = $'operation_id=hotel-match-current-former-name-missing-third-accept-1971-20260911-v2\nstate=armed'
          test "$(git hash-object scripts/diagnostics/hotel_match_current_missing_third_strict_accept.php)" = "$EXPECTED_ACCEPT_BLOB"
          STATE="$RUNNER_TEMP/m3former-v2"; mkdir -m 700 "$STATE"; export STATE
          python3 .github/match-current-former-name-compose-v2.py
          php -l "$STATE/live.php"
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/m3former2.key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Reserve before SSH
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/m3former-v2"; export STATE
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['STATE']); r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_ssh','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'accept_source_blob':os.environ['EXPECTED_ACCEPT_BLOB'],'review_operation':os.environ['REVIEW_OPERATION'],'review_run':int(os.environ['REVIEW_RUN']),'review_artifact':int(os.environ['REVIEW_ARTIFACT']),'manifest':['anex:797->501','andromeda:106028->711'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          raw=json.dumps(r,sort_keys=True,indent=2)+'\n'; (p/'reservation.json').write_text(raw)
          if (p/'reservation.json').read_text()!=raw: raise SystemExit('reservation_readback_failed')
          PY
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-current-former-name-missing-third-accept-1971-20260911-v2-reservation
          path: ${{ runner.temp }}/m3former-v2/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply server-current delta
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/m3former-v2"; key="$RUNNER_TEMP/m3former2.key"; sock="$RUNNER_TEMP/m3former2.sock"; kh="$RUNNER_TEMP/m3former2.kh"; export STATE
          rm -f "$sock"
          if ! ssh -M -S "$sock" -fnNT -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$kh" -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o ControlPersist=300 -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE"; then
            printf '{"operation_id":"%s","state":"known_pre_ssh_failure","reason":"controlmaster_failed","database_writes":0,"supplier_calls":0,"no_replay":true}\n' "$OPERATION_ID" > "$STATE/blocker.json"; exit 1
          fi
          if ! ssh -S "$sock" -T -o ControlMaster=no -o BatchMode=yes -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -f config.php'; then
            printf '{"operation_id":"%s","state":"known_pre_db_failure","reason":"preflight_failed","database_writes":0,"supplier_calls":0,"no_replay":true}\n' "$OPERATION_ID" > "$STATE/blocker.json"; exit 1
          fi
          printf '{"operation_id":"%s","state":"ssh_started"}\n' "$OPERATION_ID" > "$STATE/ssh_started.json"
          set +e
          ssh -T -S "$sock" -o ControlMaster=no -o BatchMode=yes -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$STATE/live.php" > "$STATE/live.stdout" 2> "$STATE/live.stderr"
          rc=$?; set -e; export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE']); rc=int(os.environ['RC']); out=(s/'live.stdout').read_text(errors='replace'); err=(s/'live.stderr').read_text(errors='replace'); data=None
          for line in reversed([x for x in out.splitlines() if x.strip()]):
              try: x=json.loads(line)
              except Exception: continue
              if isinstance(x,dict): data=x; break
          if not isinstance(data,dict):
              b={'operation_id':os.environ['OPERATION_ID'],'state':'unknown_after_ssh','reason':'unparseable_do_not_replay','database_writes':'unknown','supplier_calls':0,'remote_exit':rc,'stdout_sha256':hashlib.sha256(out.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),'no_replay':True}; (s/'blocker.json').write_text(json.dumps(b,sort_keys=True)+'\n'); raise SystemExit(1)
          (s/'result.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True)+'\n')
          ok=data.get('operation_id')==os.environ['OPERATION_ID'] and int(data.get('supplier_calls',-1))==0 and data.get('status')=='completed' and data.get('committed') is True and data.get('readback_verified') is True
          if not ok:
              b={'operation_id':os.environ['OPERATION_ID'],'state':'unknown_committed' if data.get('committed') is True else 'known_rolled_back','reason':data.get('reason','contract_mismatch'),'database_writes':data.get('database_writes','unknown'),'supplier_calls':data.get('supplier_calls'),'planned':data.get('planned'),'skipped':data.get('skipped'),'no_replay':True}; (s/'blocker.json').write_text(json.dumps(b,sort_keys=True)+'\n'); raise SystemExit(1)
          writes=int(data['database_writes']); planned=data['planned']
          if writes!=int(planned['anex'])+int(planned['andromeda']) or writes>2: raise SystemExit('count_contract')
          raw=(s/'result.json').read_bytes(); receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_committed_readback_verified','run_id':int(os.environ['GITHUB_RUN_ID']),'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':writes,'planned':planned,'skipped':data.get('skipped'),'coverage_before':data.get('coverage_before'),'coverage_after':data.get('coverage_after'),'identity_before':data.get('identity_before'),'identity_after':data.get('identity_after'),'accepted':data.get('accepted'),'supplier_calls':0,'readback_verified':True,'no_replay':True}; (s/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n'); print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - name: Close SSH master
        if: always()
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          sock="$RUNNER_TEMP/m3former2.sock"; if test -S "$sock"; then ssh -S "$sock" -O exit -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" >/dev/null 2>&1 || true; fi; rm -f "$RUNNER_TEMP/m3former2.key" "$sock"
      - name: Preserve result
        if: always()
        id: result_artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-current-former-name-missing-third-accept-1971-20260911-v2-result
          path: ${{ runner.temp }}/m3former-v2/
          if-no-files-found: error
          retention-days: 90
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.result_artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/m3former-v2"; export STATE ARTIFACT_ID
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['STATE'])
          if (s/'receipt.json').exists():
              r=json.loads((s/'result.json').read_text()); p=r['planned']; cb=r['coverage_before']; ca=r['coverage_after']; rows=[]
              for x in (r.get('accepted') or {}).get('anex',[]): rows.append(f"ANEX {x.get('external_id')}→{x.get('target')}")
              for x in (r.get('accepted') or {}).get('andromeda',[]): rows.append(f"Andromeda {x.get('external_id')}→{x.get('target')}")
              text=f"MATCH #1971 former-name missing-third delta `{r['operation_id']}` COMPLETED: commit + exact per-row readback verified. Actual mappings **{r['database_writes']}** = ANEX **{p['anex']}** + Andromeda **{p['andromeda']}**; {', '.join(rows)}. Triple {cb['all_three']}→{ca['all_three']}; exactly-two {cb['exactly_two']}→{ca['exactly_two']}; supplier calls0. Artifact `{os.environ['ARTIFACT_ID']}`. NO-REPLAY."
          else:
              b=json.loads((s/'blocker.json').read_text()) if (s/'blocker.json').exists() else {'operation_id':os.environ['OPERATION_ID'],'state':'workflow_failure','reason':'no_blocker_payload'}; text=f"MATCH #1971 former-name delta `{b['operation_id']}` stopped `{b['state']}` reason `{b['reason']}`; DB writes {b.get('database_writes','unknown')}, supplier calls0. Artifact `{os.environ['ARTIFACT_ID']}`. NO-REPLAY."
          (s/'comment.md').write_text(text+'\n')
          PY
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
          gh issue comment 996 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
