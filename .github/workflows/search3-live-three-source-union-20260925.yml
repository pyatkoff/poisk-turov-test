name: Search3 live three-source union 2026-09-25

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/search3-live-three-source-union-20260925.cjs'
      - '.github/workflows/search3-live-three-source-union-20260925.yml'

permissions:
  contents: read

jobs:
  live-three-source-union:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard one-shot live surface
        run: |
          set -euo pipefail
          node --check tests/search3-live-three-source-union-20260925.cjs
          test "$(grep -Fc "page.locator('.search-submit').click()" tests/search3-live-three-source-union-20260925.cjs)" = "1"
          ! grep -En 'continue-search.*click|refresh-hotel.*click|data-action=.offer.*click|booking|payment|confirm-tour' tests/search3-live-three-source-union-20260925.cjs
          ! grep -En 'secrets\.|ssh|scp|rsync' tests/search3-live-three-source-union-20260925.cjs
      - name: Install pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/search3-live-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-live-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run one published Search3 search
        env:
          NODE_PATH: ${{ runner.temp }}/search3-live-tools/node_modules
          SEARCH3_LIVE_OUTPUT: ${{ runner.temp }}/search3-live-three-source-union
        run: node tests/search3-live-three-source-union-20260925.cjs
      - name: Retain sanitized live receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-live-three-source-union-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/search3-live-three-source-union/
          if-no-files-found: warn
          retention-days: 7
