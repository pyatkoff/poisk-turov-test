name: MATCH SAMO business-live30 recover calibrate v3
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php'
      - 'tests/hotel_match_samo_business_live30_common4_recover_calibrate_v3_test.php'
      - '.github/workflows/hotel-match-samo-business-live30-common4-recover-calibrate-v3.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-samo-business-live30-common4-recover-calibrate-1971-20260924-v3, cancel-in-progress: false}
env:
  OP: hotel-match-samo-business-live30-common4-recover-calibrate-1971-20260924-v3
  RECOVERY_OP: hotel-match-samo-business-live30-common4-recover-1971-20260924-v1
  SEALED_OP: hotel-match-samo-business-live30-common4-acquire-1971-20260924-v2
  BASE: 9555488a563a1b73c7074ab6fa0c49b7bd1f4a81
  CLAIM: '5811797487'
  RECOVERY_ARTIFACT: '10800593360'
  RECOVERY_ARCHIVE_SHA: 5e9a321132f36c719485eb1127a8990b94a0d2afd3a59b910527b96d91e2f241
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/samo-business-live30-recover-calibrate-v3-20260924'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: php -l scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php
      - run: php scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php --self-test
      - run: php tests/hotel_match_samo_business_live30_common4_recover_calibrate_v3_test.php
      - run: |
          ! grep -E 'curl_|https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\\(' scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/samo-business-live30-recover-calibrate-v3-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim Security and terminal recovery
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/recovery terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-samo-business-live30-common4-recover-calibrate-v3.yml scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php tests/hotel_match_samo_business_live30_common4_recover_calibrate_v3_test.php "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'392 fully-drained','top-level `operatorKey`','original.hotelKey','DB/mapping writes0']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RECOVERY_ARTIFACT/zip" -o input/recovery.zip
          test "$(sha256sum input/recovery.zip|awk '{print $1}')" = "$RECOVERY_ARCHIVE_SHA"
          unzip -q input/recovery.zip -d input/recovery
          result="$(find input/recovery -type f -name result.json -print -quit)";receipt="$(find input/recovery -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/recovery-result.json;cp "$receipt" input/recovery-receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=json.load(open('input/recovery-result.json'));q=json.load(open('input/recovery-receipt.json'))
          h=hashlib.sha256(pathlib.Path('input/recovery-result.json').read_bytes()).hexdigest()
          assert q['result_sha256']==h and r['operation']=='hotel-match-samo-business-live30-common4-recover-1971-20260924-v1'
          assert r['state']=='completed_read_only_recovery' and r['completed_batch_count']==392 and r['partial_batch_count']==110 and r['untouched_batch_count']==0
          assert r['expected_groups']==502 and r['expected_edges']==5988 and r['continuation_start_batch'] is None
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          pathlib.Path('input/recovery-result.sha').write_text(h)
          PY
      - name: Calibrate saved fully-drained evidence against CURRENT
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP";sealed=".anytoour-match/operations/$SEALED_OP"
          rsha="$(cat input/recovery-result.sha)"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_db_read','source_recovery_operation':os.environ['RECOVERY_OP'],'provider_http_calls':0,'database_writes':0,'mapping_writes':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test -d \"\$HOME/$sealed\";test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/recovery-result.json "$remote:$op/payload/recovery-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php "$remote:$op/payload/scripts/diagnostics/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SEALED_OPERATION_DIR=\"\$HOME/$sealed\" MATCH_RECOVERY_RESULT=\"\$HOME/$op/payload/recovery-result.json\" MATCH_RECOVERY_RESULT_SHA='$rsha' MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_samo_business_live30_common4_recover_calibrate_v3.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile(): pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          if r['state']!='completed_read_only_recovery_calibration':
              print(json.dumps({'state':r['state'],'reason':r.get('reason')},sort_keys=True));raise SystemExit(2)
          assert r['fully_drained_batch_count']==392 and r['partial_hold_batch_count']==110
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0 and r['safe_to_write_now'] is False
          print(json.dumps({k:r[k] for k in ['state','candidate_single_native_edge_count','calibration_counts','namespace_calibrated','status_counts','writer_ready_counts','writer_ready_total','private_writer_manifest_sha256']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-samo-business-live30-recover-calibrate-v3-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
