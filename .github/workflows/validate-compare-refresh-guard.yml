name: Validate comparison refresh guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/compare-refresh-guard-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-compare-refresh-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Close comparison if refreshed results leave fewer than two selected hotels
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          cat > ./validate-compare-refresh.cjs <<'JS'
          const {chromium}=require('playwright');
          const path=require('path');
          const guard=path.resolve('v2/compare-refresh-guard-v1.js');
          const rows=[
            {id:801,name:'Compare One',category:5,rating:4.8,price:100000,tours:[{id:'a',date:'10.09.2026',nights:7,price:100000}]},
            {id:802,name:'Compare Two',category:4,rating:4.5,price:110000,tours:[{id:'b',date:'11.09.2026',nights:7,price:110000}]},
            {id:803,name:'Compare Three',category:4,rating:4.4,price:120000,tours:[{id:'c',date:'12.09.2026',nights:8,price:120000}]},
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [name,width,height] of [['mobile',375,812],['desktop',1440,1000]]){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(3000);
              await page.addScriptTag({path:guard});
              await page.evaluate(items=>window.V2Results.render(items),rows);
              const buttons=page.locator('.hotel-compare-toggle');
              await buttons.nth(0).click();
              await buttons.nth(1).click();
              await page.locator('.compare-open').click();
              let state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,overlay:!document.getElementById('v2CompareOverlay').hidden,locked:document.body.classList.contains('v2-compare-dialog-open')}));
              if(state.selected!==2||!state.overlay||!state.locked)throw new Error(name+': comparison did not open '+JSON.stringify(state));
              await page.evaluate(items=>window.V2Results.render(items),[rows[0],rows[2]]);
              state=await page.evaluate(()=>({selected:window.V2ConversionConfidenceV1.compareState.selected.size,overlayHidden:document.getElementById('v2CompareOverlay').hidden,locked:document.body.classList.contains('v2-compare-dialog-open'),trayHidden:document.getElementById('v2CompareTray').hidden,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
              if(state.selected!==1||!state.overlayHidden||state.locked||state.trayHidden||state.overflow)throw new Error(name+': invalid one-item modal survived refresh '+JSON.stringify(state));
              if((response&&response.status())!==200||errors.length)throw new Error(name+': page errors '+errors.join(';'));
              console.log('COMPARE_REFRESH_GUARD_OK',name);
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./validate-compare-refresh.cjs
