name: ANEX Search3 live readback v1

on:
  pull_request:
    branches: ['feature/anex-search-adapter-20260907']
    paths:
      - '.github/workflows/anex-search3-live-readback-v1.yml'

permissions:
  contents: read

jobs:
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published ANEX preview over public HTTPS without supplier calls
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import re

          HOST = 'anytoour.ru'
          BASE = '/_preview/search3-anex-candidate/'

          def request(method, path, body=None, headers=None):
              conn = http.client.HTTPSConnection(HOST, timeout=20)
              try:
                  base_headers = {
                      'User-Agent': 'AnyTour-ANEX-live-readback-v1',
                      'Accept': 'application/json,text/html;q=0.9,*/*;q=0.1',
                  }
                  if headers:
                      base_headers.update(headers)
                  conn.request(method, path, body=body, headers=base_headers)
                  response = conn.getresponse()
                  payload = response.read(2_500_001)
                  if len(payload) > 2_500_000:
                      raise SystemExit('response_too_large')
                  return response.status, {k.lower(): v for k, v in response.getheaders()}, payload
              finally:
                  conn.close()

          status, headers, body = request('GET', BASE + 'poisk-turov/')
          if status != 200:
              raise SystemExit(f'page_status_{status}')
          text = body.decode('utf-8', 'strict')
          if 'anex-search3-preview-v1.js' not in text:
              raise SystemExit('anex_preview_asset_missing')
          if not re.search(r'<meta[^>]+(?:name=["\']robots["\'][^>]+content=["\'][^"\']*noindex|content=["\'][^"\']*noindex[^>]+name=["\']robots["\'])', text, re.I):
              raise SystemExit('preview_noindex_missing')
          if 'app.anytoour.ru/web-consultant/widget.js' in text:
              raise SystemExit('external_consultant_present')
          print('ANEX_PREVIEW_PAGE_OK status=200 noindex=1 preview_asset=1')

          status, headers, body = request('GET', BASE + 'api-anex-search3-preview.php')
          data = json.loads(body.decode('utf-8', 'strict'))
          if status != 405 or headers.get('allow') != 'POST' or data != {'ok': False, 'error': 'method_not_allowed'}:
              raise SystemExit(f'api_get_contract_{status}_{data}')
          print('ANEX_PREVIEW_API_ENABLED_OK status=405 allow=POST')

          status, headers, body = request('POST', BASE + 'api-anex-search3-preview.php', body=b'{}', headers={
              'Content-Type': 'text/plain', 'Content-Length': '2', 'Sec-Fetch-Site': 'none'
          })
          data = json.loads(body.decode('utf-8', 'strict'))
          if status != 400 or data != {'ok': False, 'error': 'invalid_request'}:
              raise SystemExit(f'api_content_type_contract_{status}_{data}')

          raw = b'{bad-json'
          status, headers, body = request('POST', BASE + 'api-anex-search3-preview.php', body=raw, headers={
              'Content-Type': 'application/json', 'Content-Length': str(len(raw)), 'Sec-Fetch-Site': 'none'
          })
          data = json.loads(body.decode('utf-8', 'strict'))
          if status != 400 or data != {'ok': False, 'error': 'invalid_request'}:
              raise SystemExit(f'api_json_contract_{status}_{data}')
          print('ANEX_PREVIEW_API_PREFLIGHT_OK malformed_requests_fail_before_supplier=1')

          status, headers, body = request('GET', BASE + '.anex-private.php')
          private_text = body.decode('utf-8', 'replace')
          if status == 200 or any(marker in private_text for marker in (
              'ANEX_API_TOKEN', 'ANEX_B2B_TOKEN', 'ANEX_PREVIEW_SOURCE_SHA', 'base64_decode('
          )):
              raise SystemExit(f'private_config_public_{status}')
          print(f'ANEX_PREVIEW_PRIVATE_CONFIG_PROTECTED status={status}')
          PY
