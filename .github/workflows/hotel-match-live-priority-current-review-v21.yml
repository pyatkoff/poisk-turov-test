name: MATCH live priority current review v21

on:
  push:
    branches: ['ops/match-live-priority-v21-20260912']
    paths: ['.github/match-live-priority-current-review-1971-20260912-v21.arm']

permissions:
  contents: read
  issues: write

env:
  OPERATION_ID: hotel-match-live-priority-current-review-1971-20260912-v21
  ARTIFACT_DIR: /tmp/match-live-priority-v21

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable review source
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(cat .github/match-live-priority-current-review-1971-20260912-v21.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_live_priority_current_review_v21.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          mkdir -m 700 -p "$ARTIFACT_DIR"
      - name: Establish SSH master
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess,time
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP']);key=rt/'match-v21-key';sock=rt/'match-v21.sock';known=rt/'match-v21-known';raw=os.environ['KEY_VALUE'].strip();key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600)
          common=['-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE']]
          ok=False
          for _ in range(3):
              try:sock.unlink()
              except FileNotFoundError:pass
              p=subprocess.run(['ssh','-M','-S',str(sock),'-fnNT','-o','ControlPersist=900']+common,text=True,capture_output=True,timeout=30)
              if p.returncode==0:
                  q=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],'cd "$HOME/www/anytoour.ru" && test -f config.php && printf MATCH_V21_OK'],text=True,capture_output=True,timeout=30)
                  if q.returncode==0 and q.stdout.strip()=='MATCH_V21_OK':ok=True;break
              time.sleep(2)
          if not ok: raise SystemExit('ssh preflight failed')
          PY
      - name: Persist immutable reservation before DB access
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']); files=['scripts/diagnostics/hotel_match_live_priority_current_review_v21.php','scripts/diagnostics/hotel_match_current_bulk_review.php','scripts/diagnostics/hotel_full_catalog_reconcile.php']; hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files};r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','source_hashes':hashes,'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'anex_calls':0,'andromeda_calls':0,'tv_search_slices':0,'tv_http_calls':0,'no_replay':True};(d/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-live-priority-v21-${{ github.run_id }}-reserved
          path: ${{ env.ARTIFACT_DIR }}/reservation.json
          retention-days: 90
      - name: Execute CURRENT live-priority bulk review
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);rt=Path(os.environ['RUNNER_TEMP']);sock=rt/'match-v21.sock';stage=rt/'match-v21-remote';stage.mkdir(exist_ok=True)
          src=Path('scripts/diagnostics/hotel_match_live_priority_current_review_v21.php').read_text();src=src.replace("$root=realpath(__DIR__.'/../..');","$root=realpath(getcwd());")
          (stage/'hotel_match_live_priority_current_review_v21.php').write_text(src)
          for name in ['hotel_match_current_bulk_review.php','hotel_full_catalog_reconcile.php']:(stage/name).write_bytes(Path('scripts/diagnostics',name).read_bytes())
          remote='/tmp/match-live-priority-v21-'+os.environ['GITHUB_RUN_ID'];host=f"{os.environ['USER_VALUE']}@{os.environ['HOST_VALUE']}"
          mk=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],f"rm -rf {remote} && mkdir -m 700 {remote}"],text=True,capture_output=True,timeout=30)
          if mk.returncode!=0: raise SystemExit('remote stage failed')
          cp=subprocess.run(['scp','-r','-o','ControlMaster=no','-o','ControlPath='+str(sock),str(stage)+'/.',host+':'+remote+'/'],text=True,capture_output=True,timeout=60)
          if cp.returncode!=0: raise SystemExit('scp failed')
          cmd=f'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M {remote}/hotel_match_live_priority_current_review_v21.php; rc=$?; rm -rf {remote}; exit $rc'
          p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],cmd],text=True,capture_output=True,timeout=900)
          prefix='MATCH_LIVE_PRIORITY_V21_JSON:';line=next((z[len(prefix):] for z in reversed(p.stdout.splitlines()) if z.startswith(prefix)),None);out=json.loads(line) if line else {'status':'unknown','reason':'result_marker_missing','remote_exit':p.returncode,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'anex_calls':0,'andromeda_calls':0,'tv_search_slices':0,'tv_http_calls':0,'historical_operations_replayed':False};out.update(run_id=int(os.environ['GITHUB_RUN_ID']),source_commit=os.environ['GITHUB_SHA']);(d/'result.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps({'status':out.get('status'),'safe_prepared_count':out.get('safe_prepared_count'),'stats':out.get('stats')},ensure_ascii=False))
          if out.get('status')!='completed': raise SystemExit(2)
          PY
      - name: Build receipt
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);p=d/'result.json';data=json.loads(p.read_text()) if p.exists() else {'status':'unknown'};raw=p.read_bytes() if p.exists() else b'';r={'operation_id':os.environ['OPERATION_ID'],'state':data.get('status','unknown'),'safe_prepared_count':data.get('safe_prepared_count'),'stats':data.get('stats'),'coverage':data.get('coverage'),'result_sha256':hashlib.sha256(raw).hexdigest(),'run_id':int(os.environ['GITHUB_RUN_ID']),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'anex_calls':0,'andromeda_calls':0,'tv_search_slices':0,'tv_http_calls':0,'no_replay':True};(d/'receipt.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-live-priority-v21-${{ github.run_id }}-result
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 90
      - name: Record result in MATCH issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['ARTIFACT_DIR'])/'result.json';d=json.loads(p.read_text()) if p.exists() else {'status':'unknown'};body=f"MATCH #1971 accelerated live-priority CURRENT review `{os.environ['OPERATION_ID']}`: **{d.get('status')}**. Live unresolved examined ANEX `{(d.get('stats') or {}).get('live_anex_examined')}`, live Andromeda pending `{(d.get('stats') or {}).get('live_andromeda_pending_examined')}`; safe prepared `{d.get('safe_prepared_count')}`, potential triple delta `{(d.get('stats') or {}).get('potential_triple_delta')}`, needs-extra `{d.get('needs_extra_count')}`, hard conflicts `{d.get('hard_conflict_count')}`. Supplier ANEX/Andromeda/Tourvisor calls 0; DB/mapping writes 0. Run `{os.environ['GITHUB_RUN_ID']}`. Any apply requires a NEW server-current guarded mass transaction with durable reservation and per-row post-COMMIT readback.";subprocess.run(['gh','issue','comment','1971','--repo',os.environ['GITHUB_REPOSITORY'],'--body',body],check=True)
          PY
