name: Check AnyTour charter departures

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/check-charter-departures-v1.php'
      - '.github/workflows/check-anytour-charter-departures.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/check-charter-departures-v1.php'
      - '.github/workflows/check-anytour-charter-departures.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          php -l v2/data/check-charter-departures-v1.php
          grep -Fq "'onlyCharter' => true" v2/data/check-charter-departures-v1.php
          grep -Fq "'onlyDirect' => $onlyDirect" v2/data/check-charter-departures-v1.php
          grep -Fq 'CHARTER_DEPARTURES_OK' v2/data/check-charter-departures-v1.php

  report-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Run free charter availability report
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          scp "${opts[@]}" v2/data/check-charter-departures-v1.php "$remote:$remote_dir/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru/data\"
            trap 'rm -f \"\$root/check-charter-departures-v1.php\"' EXIT
            php \"\$root/check-charter-departures-v1.php\"
          "
