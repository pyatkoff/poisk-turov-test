name: Validate V2 lead source contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/lead-form-guard-v1.js'
      - 'v2/lead-idempotency-v1.php'
      - 'scripts/ci/lead/validate-idempotency.php'
      - 'v2/lead-price-v1.php'
      - 'scripts/ci/lead/validate-price.php'
      - 'v2/lead-search-context.js'
      - 'v2/lead-ui-race-guard-v1.js'
      - '.github/workflows/validate-v2-lead-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-v2-lead-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lead-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate lead form guard
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/lead-form-guard-v1.js
          grep -q "10" v2/lead-form-guard-v1.js
          grep -q "15" v2/lead-form-guard-v1.js
          grep -q "setCustomValidity" v2/lead-form-guard-v1.js
          grep -q "version:2" v2/lead-form-guard-v1.js

      - name: Validate lead idempotency fingerprint
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/lead-idempotency-v1.php
          php -l scripts/ci/lead/validate-idempotency.php
          php scripts/ci/lead/validate-idempotency.php

      - name: Validate lead price semantics
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/lead-price-v1.php
          php -l scripts/ci/lead/validate-price.php
          php scripts/ci/lead/validate-price.php

      - name: Validate lead search context
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/lead-search-context.js
          grep -q 'childAges' v2/lead-search-context.js
          grep -q 'V2SearchLifecycle' v2/lead-search-context.js
          grep -q 'lead-adapter-v2.php' v2/lead-search-context.js

      - name: Validate lead UI race guard
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          const listeners={};
          const document={getElementById:()=>null,querySelectorAll:()=>[]};
          const window={
            V2TourController:{currentTour:{id:'tour-b'}},
            V2Runtime:{state:{searchId:202}},
            addEventListener:(name,fn)=>{(listeners[name]||(listeners[name]=[])).push(fn);}
          };
          vm.runInNewContext(fs.readFileSync('v2/lead-ui-race-guard-v1.js','utf8'),{window,document,String,Number,Array});
          const guard=window.V2LeadUiRaceGuardV1;
          if(!guard)throw new Error('guard not loaded');
          let stopped=0;
          const staleTour={detail:{tourId:'tour-a',searchId:202},stopImmediatePropagation:()=>{stopped++;}};
          if(guard.protect(staleTour)!==false||stopped!==1)throw new Error('stale tour event was not blocked');
          const staleSearch={detail:{tourId:'tour-b',searchId:101},stopImmediatePropagation:()=>{stopped++;}};
          if(guard.protect(staleSearch)!==false||stopped!==2)throw new Error('same-tour stale search event was not blocked');
          const current={detail:{tourId:'tour-b',searchId:202},stopImmediatePropagation:()=>{throw new Error('current event blocked');}};
          if(guard.protect(current)!==true)throw new Error('current event rejected');
          window.V2TourController.currentTour=null;
          const switching={detail:{tourId:'tour-a',searchId:202},stopImmediatePropagation:()=>{stopped++;}};
          if(guard.protect(switching)!==false||stopped!==3)throw new Error('event during tour switch was not blocked');
          window.V2TourController.currentTour={id:'tour-b'};
          window.V2Runtime.state.searchId=0;
          const reset={detail:{tourId:'tour-b',searchId:202},stopImmediatePropagation:()=>{stopped++;}};
          if(guard.protect(reset)!==false||stopped!==4)throw new Error('event after search reset was not blocked');
          guard.startPending();
          if(!guard.leadPending)throw new Error('lead pending state not started');
          if(guard.handleSearchReset()!==false||!guard.leadPending)throw new Error('search reset cleared an in-flight lead lock');
          guard.clearPending();
          if(guard.handleSearchReset()!==true||guard.leadPending)throw new Error('idle search reset should remain harmless');
          console.log('LEAD_UI_RACE_GUARD_OK');
          JS
