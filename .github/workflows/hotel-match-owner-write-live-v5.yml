name: MATCH owner review write publication v5

on:
  push:
    branches:
      - ops/match-owner-write-publish-1971-20260911-v5
    paths:
      - '.github/workflows/hotel-match-owner-write-live-v5.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: anytour-match-owner-write-publication
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-owner-write-publish-1971-20260911-v5
  EXPECTED_BASE_SHA: 2a230f5d9fb211e516735a38a625a943c0d4bb24
  PREDECESSOR_ARTIFACT_ID: '10105375379'
  PREDECESSOR_SOURCE_SHA: 1d2c3592aa2c18d2b3ab434505e4a4cbdf8bfdd9
  PREDECESSOR_REPORT_SHA256: 1e06632b8fd323b736a9e26b5139d4ffebcd5504d0d98ac6d937daed4abd4a37

jobs:
  publish-owner-write:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact one-shot source and checked publisher
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/poisk-turov-test'
          test "$GITHUB_REF" = 'refs/heads/ops/match-owner-write-publish-1971-20260911-v5'
          test "$GITHUB_ACTOR" = 'pyatkoff'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/hotel-match-owner-write-live-v5.yml'
          test "$(jq -r .action scripts/diagnostics/anex_review_owner_publish_plan.json)" = 'owner_write'
          test "$(jq -r .expected_previous_source scripts/diagnostics/anex_review_owner_publish_plan.json)" = "$PREDECESSOR_SOURCE_SHA"
          test "$(jq -r .published_report_sha256 scripts/diagnostics/anex_review_owner_publish_plan.json)" = "$PREDECESSOR_REPORT_SHA256"
          test "$(jq -r '.allowed_delta_paths | join(",")' scripts/diagnostics/anex_review_owner_publish_plan.json)" = 'v2/anex-hotel-review.php'
          php -l scripts/diagnostics/anex_review_owner_publish_runner.php
          python3 -B tests/anex-review-owner-publish-test.py
          python3 -B tests/anex-review-owner-htaccess-drift-test.py
          php tests/anex-review-owner-write-gate-test.php

      - name: Restore exact completed owner runtime lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export ANEX_CATALOG_ARTIFACT_DIR="$GITHUB_WORKSPACE/.owner-write-artifacts"
          mkdir -p "$ANEX_CATALOG_ARTIFACT_DIR"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREDECESSOR_ARTIFACT_ID/zip" > "$RUNNER_TEMP/predecessor.zip"
          unzip -q "$RUNNER_TEMP/predecessor.zip" -d "$ANEX_CATALOG_ARTIFACT_DIR"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR'])
          for name in ('anex-checkpoint-source.json','anex-owner-links-checkpoint.json','anex-owner-links-report.json'):
              p=root/name
              if not p.is_file() or p.is_symlink(): raise SystemExit('missing predecessor '+name)
          cp=json.loads((root/'anex-owner-links-checkpoint.json').read_text()); report=cp.get('report')
          if cp.get('state')!='completed' or not isinstance(report,dict): raise SystemExit('predecessor incomplete')
          digest=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          if digest!=os.environ['PREDECESSOR_REPORT_SHA256'] or cp.get('report_sha256')!=digest: raise SystemExit('predecessor digest')
          if report.get('source_sha')!=os.environ['PREDECESSOR_SOURCE_SHA'] or report.get('owner_activated') is not True or report.get('write_enabled') is not False: raise SystemExit('predecessor gate')
          if report.get('database_calls')!=0 or report.get('supplier_requests')!=0: raise SystemExit('predecessor side effects')
          PY

      - name: Prepare immutable owner-write reservation
        run: |
          set -euo pipefail
          export ANEX_CATALOG_ARTIFACT_DIR="$GITHUB_WORKSPACE/.owner-write-artifacts"
          python3 -B scripts/diagnostics/anex_review_owner_publish.py --prepare
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR']); cp=json.loads((root/'anex-owner-write-checkpoint.json').read_text())
          if cp.get('state')!='reserved': raise SystemExit('not reserved')
          execution=cp.get('execution',{})
          if execution.get('run_id')!=os.environ['GITHUB_RUN_ID'] or execution.get('attempt')!=os.environ['GITHUB_RUN_ATTEMPT'] or execution.get('source_sha')!=os.environ['GITHUB_SHA']: raise SystemExit('reservation execution mismatch')
          reservation={'operation_id':os.environ['OPERATION_ID'],'state':'reserved','source_sha':os.environ['GITHUB_SHA'],'base_sha':os.environ['EXPECTED_BASE_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'predecessor_artifact_id':int(os.environ['PREDECESSOR_ARTIFACT_ID']),'predecessor_source_sha':os.environ['PREDECESSOR_SOURCE_SHA'],'predecessor_report_sha256':os.environ['PREDECESSOR_REPORT_SHA256'],'publisher_plan_sha256':cp['plan_sha256'],'publisher_payload_sha256':cp['payload_sha256'],'transport':'ssh_stdin_embedded_reserved_payload','database_calls':0,'supplier_requests':0,'mapping_writes':0,'no_replay':True}
          p=root/'owner-write-operation-reservation.json'; raw=(json.dumps(reservation,sort_keys=True,indent=2)+'\n').encode(); p.write_bytes(raw)
          if p.read_bytes()!=raw: raise SystemExit('reservation readback')
          PY

      - name: Preserve reservation before SSH
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-owner-write-publish-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: |
            .owner-write-artifacts/owner-write-operation-reservation.json
            .owner-write-artifacts/anex-owner-write-checkpoint.json
            .owner-write-artifacts/anex-owner-publish-reservation.json
            .owner-write-artifacts/anex-owner-links-checkpoint.json
            .owner-write-artifacts/anex-checkpoint-source.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish same guarded payload over SSH stdin
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          export ANEX_CATALOG_ARTIFACT_DIR="$GITHUB_WORKSPACE/.owner-write-artifacts"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts/diagnostics').resolve()))
          import anex_review_owner_publish as pub

          root=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR']); plan=json.loads(pub.PLAN.read_bytes())
          cp,payload=pub.prepare(root,os.environ['GITHUB_SHA'],plan)
          if payload is None or cp.get('state')!='reserved': raise SystemExit('reserved payload unavailable')
          saved=json.loads((root/'anex-owner-publish-reservation.json').read_text())
          if saved!=cp or pub.canonical(payload)!=cp.get('payload_sha256'): raise SystemExit('reserved payload changed')
          pub.storage.write_json(root/'anex-owner-write-checkpoint.json',dict(cp,state='executing'))

          payload_raw=json.dumps(payload,ensure_ascii=False,separators=(',',':'))
          runner=Path('scripts/diagnostics/anex_review_owner_publish_runner.php').read_text()
          needle="$raw=stream_get_contents(STDIN,2000001);"
          if runner.count(needle)!=1: raise SystemExit('publisher stdin contract changed')
          replacement="$raw=base64_decode('"+base64.b64encode(payload_raw.encode()).decode()+"',true);if($raw===false)throw new RuntimeException('publish_contract');"
          program=runner.replace(needle,replacement)
          if len(program.encode())>3000000: raise SystemExit('embedded publisher bound')

          required=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          for name in required:
              if not os.environ.get(name,'').strip(): raise SystemExit('missing ssh configuration')
          host=os.environ['ANYTOOUR_DEPLOY_HOST'].strip();user=os.environ['ANYTOOUR_DEPLOY_USER'].strip()
          if host.startswith('-') or user.startswith('-') or any(c.isspace() for c in host+user): raise SystemExit('invalid ssh target')
          with tempfile.TemporaryDirectory(prefix='owner-write-v5-') as td:
              key=Path(td)/'key'; raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
              if 'PRIVATE KEY' in raw:key.write_text(raw.rstrip()+'\n')
              else:key.write_bytes(base64.b64decode(raw))
              key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'known_hosts'),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              result=subprocess.run(cmd,input=program,text=True,capture_output=True,timeout=120)
          if len(result.stdout)>200000: raise SystemExit('publisher report bound')
          if result.returncode!=0: raise SystemExit('publisher ssh failed')
          try: report=json.loads(result.stdout)
          except Exception: raise SystemExit('publisher report invalid')
          expected={'status':'published','source_sha':os.environ['GITHUB_SHA'],'previous_source_sha':os.environ['PREDECESSOR_SOURCE_SHA'],'upgrade_action':'owner_write','write_enabled':True,'owner_activated':True,'account_preserved':True,'config_preserved':True,'database_calls':0,'supplier_requests':0}
          for key,value in expected.items():
              if report.get(key)!=value: raise SystemExit('publisher readback '+key)
          if report.get('runtime_files')!=cp.get('manifest'): raise SystemExit('runtime manifest mismatch')
          digest=pub.canonical(report)
          pub.storage.write_json(root/'anex-owner-write-checkpoint.json',dict(cp,state='completed',report=report,report_sha256=digest))
          pub.storage.write_json(root/'anex-owner-write-report.json',report)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed','source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'report_sha256':digest,'write_enabled':True,'owner_activated':True,'account_preserved':True,'config_preserved':True,'database_calls':0,'supplier_requests':0,'mapping_writes':0,'htaccess_reconciled':report.get('htaccess_reconciled',False),'transport':'ssh_stdin_embedded_reserved_payload','no_replay':True}
          pub.storage.write_json(root/'owner-write-operation-receipt.json',receipt)
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Independent live readback
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          export ANEX_CATALOG_ARTIFACT_DIR="$GITHUB_WORKSPACE/.owner-write-artifacts"
          python3 - <<'PY'
          import base64,json,os,subprocess,tempfile
          from pathlib import Path
          expected=os.environ['GITHUB_SHA']
          php=r'''<?php
          function j($p){if(!is_file($p)||is_link($p)||filesize($p)>1000000)return null;$x=json_decode(file_get_contents($p),true,32);return is_array($x)?$x:null;}
          $root=realpath(getcwd());$home=realpath((string)getenv('HOME'));$private=$home.'/.anytoour-anex/review-owner';$target=$root.'/_preview/search3-anex-candidate';
          $m=j($private.'/manifest.json');$p=j($target.'/anex-owner-panel-manifest.json');$w=j($private.'/write-state.json');
          $entry=file_get_contents($private.'/entry-panel.php');$login=file_get_contents($private.'/entry-login.php');$source=$m['source_sha']??'';
          $ok=is_array($m)&&is_array($p)&&is_array($w)&&($m['write_enabled']??null)===true&&($m['owner_activated']??null)===true&&($m['account_preserved']??null)===true&&($m['config_preserved']??null)===true&&($p['write_enabled']??null)===true&&($p['source_sha']??null)===$source&&($w['state']??null)==='completed'&&($w['source_sha']??null)===$source&&strpos((string)$entry,'runtime-'.$source)!==false&&strpos((string)$login,'runtime-'.$source)!==false;
          echo json_encode(['status'=>$ok?'ok':'failed','source_sha'=>$source,'manifest_write'=>$m['write_enabled']??null,'public_write'=>$p['write_enabled']??null,'write_state'=>$w['state']??null,'owner_activated'=>$m['owner_activated']??null,'account_preserved'=>$m['account_preserved']??null,'config_preserved'=>$m['config_preserved']??null,'database_calls'=>0,'supplier_requests'=>0]);
          ?>'''
          raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
          with tempfile.TemporaryDirectory(prefix='owner-write-readback-') as td:
              key=Path(td)/'key'
              if 'PRIVATE KEY' in raw:key.write_text(raw.rstrip()+'\n')
              else:key.write_bytes(base64.b64decode(raw))
              key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'known_hosts'),'-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              p=subprocess.run(cmd,input=php,text=True,capture_output=True,timeout=60)
          if p.returncode!=0: raise SystemExit('live readback ssh failed')
          data=json.loads(p.stdout)
          if data.get('status')!='ok' or data.get('source_sha')!=expected or data.get('manifest_write') is not True or data.get('public_write') is not True or data.get('write_state')!='completed' or data.get('owner_activated') is not True: raise SystemExit('live write readback failed')
          path=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR'])/'owner-write-live-readback.json'; path.write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          print(json.dumps(data,sort_keys=True))
          PY

      - name: Preserve final receipt and live readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-owner-write-publish-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            .owner-write-artifacts/owner-write-operation-reservation.json
            .owner-write-artifacts/owner-write-operation-receipt.json
            .owner-write-artifacts/owner-write-live-readback.json
            .owner-write-artifacts/anex-owner-write-checkpoint.json
            .owner-write-artifacts/anex-owner-write-report.json
            .owner-write-artifacts/anex-owner-publish-reservation.json
          if-no-files-found: warn
          retention-days: 90
