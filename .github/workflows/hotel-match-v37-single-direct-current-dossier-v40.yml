name: MATCH v37 single-direct CURRENT dossier v40
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php'
      - 'tests/hotel_match_v37_single_direct_current_dossier_v40_test.php'
      - '.github/workflows/hotel-match-v37-single-direct-current-dossier-v40.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-v37-single-direct-current-dossier-v40, cancel-in-progress: false}
env:
  OP: hotel-match-v37-single-direct-current-dossier-1971-20260925-v40
  BASE: c3b28595541ecb85286227aa146d70329bf324f3
  CLAIM: '5836536564'
  V37_ARTIFACT: '10876459387'
  V37_ARCHIVE_SHA: ab81db3eb230348de101ed0e40b0069af4572704abd175cabea858cb9afc6abc
  V37_RESULT_SHA: b7ef6082b8d27ad822ddaf69dd86e9249523f859cd61ee1b547c106118ffc55a
  V37_SOURCE_SHA: 58286e8fc9286abcd5f78d2f05e5e048dfb9b9d6
  SINGLE_PROJECTION_SHA: 8e7ccf26faf19b3001f833979aeb5422f3072641d96dc342961e7c2dad749e70
  FRONTIER_TARGET_SHA: 5001297e29a920acc2d565e45fec0e4d0a5b2244e0ba60a860941be882ad1c77

jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/v37-single-direct-current-dossier-v40-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: php -l scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php
      - run: php scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php --self-test
      - run: php tests/hotel_match_v37_single_direct_current_dossier_v40_test.php
      - name: Read-only boundary
        run: |
          set -euo pipefail
          ! grep -E 'curl_|https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php

  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/v37-single-direct-current-dossier-v40-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate authority and v37 input
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail; umask 077; mkdir -p input/v37 terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-v37-single-direct-current-dossier-v40.yml scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php tests/hotel_match_v37_single_direct_current_dossier_v40_test.php "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert c['issue_url'].endswith('/issues/3419')
          b=c['body']
          for x in [os.environ['OP'],'10876459387',os.environ['V37_RESULT_SHA'],os.environ['SINGLE_PROJECTION_SHA'],'REPEATABLE READ / READ ONLY','HTTP0','safe_to_write_now=false']:
              assert x in b,x
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V37_ARTIFACT/zip" -o input/v37.zip
          test "$(sha256sum input/v37.zip|awk '{print $1}')" = "$V37_ARCHIVE_SHA"
          unzip -q input/v37.zip -d input/v37
          vr="$(find input/v37 -type f -name result.json -print -quit)"; vq="$(find input/v37 -type f -name receipt.json -print -quit)"
          test -n "$vr"; test -n "$vq"; cp "$vr" input/v37-result.json
          python3 - "$vr" "$vq" <<'PY'
          import json,hashlib,pathlib,sys,os
          r=json.load(open(sys.argv[1])); q=json.load(open(sys.argv[2]))
          sha=hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          assert sha==os.environ['V37_RESULT_SHA']==q['result_sha256']
          assert q['readback_verified'] is True and q['provider_http_calls']==q['database_writes']==q['mapping_writes']==0
          assert r['operation']=='hotel-match-tv-samo-common4-fingerprint-join-1971-20260925-v37'
          assert r['state']=='completed_read_only_tv_samo_common4_fingerprint_join'
          assert r['source_sha']==os.environ['V37_SOURCE_SHA']
          assert r['frontier_total']==1737 and r['frontier_target_sha256']==os.environ['FRONTIER_TARGET_SHA']
          assert r['single_direct_review_count']==9 and r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          rows=[]
          for x in r['rows']:
              if x.get('status')!='single_direct': continue
              def proj(group):
                  out={}
                  for k,v in x[group].items():
                      y={kk:v.get(kk) for kk in ('state','native_id','target','tv_namespace') if kk in v}
                      out[k]=y
                  return out
              rows.append({'source':x['andromeda_catalog_id'],'target':x['candidate_local_hotel_id'],'bucket':x['frontier_bucket'],'direct':proj('direct'),'support':proj('support')})
          raw=json.dumps(rows,sort_keys=True,separators=(',',':')).encode()
          assert len(rows)==9 and hashlib.sha256(raw).hexdigest()==os.environ['SINGLE_PROJECTION_SHA']
          PY
          python3 - <<'PY'
          import json,os,pathlib,datetime
          pathlib.Path('input/reservation.json').write_text(json.dumps({
            'operation':os.environ['OP'],'state':'reserved_before_read_only_dossier',
            'provider_http_calls':0,'database_writes':0,'mapping_writes':0,
            'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },sort_keys=True)+'\n')
          PY
      - name: Require Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda z:z['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion']; break
              time.sleep(4)
          else: raise SystemExit('security_not_green')
          PY
      - name: Execute v40 CURRENT dossier
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; rel=".anytoour-match/operations/$OP"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu; umask 077; test ! -e \"\$HOME/$rel\"; mkdir -p \"\$HOME/$rel/payload/scripts/diagnostics\" \"\$HOME/$rel/input\""
          scp "${opts[@]}" input/reservation.json "$remote:$rel/reservation.json"
          scp "${opts[@]}" input/v37-result.json "$remote:$rel/input/v37-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php "$remote:$rel/payload/scripts/diagnostics/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu; cd \"\$HOME/www/anytoour.ru\"; ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_V37_RESULT=\"\$HOME/$rel/input/v37-result.json\" MATCH_V37_RESULT_SHA='$V37_RESULT_SHA' MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_v37_single_direct_current_dossier_v40.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$rel\"; tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():
                      p=pathlib.Path('terminal',m.name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json')); q=json.load(open('terminal/receipt.json'))
          assert r['state']==q['state']=='completed_read_only_v37_single_direct_current_dossier'
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest() and q['readback_verified'] is True
          assert r['input_single_direct_count']==9 and r['safe_to_write_now'] is False
          for k in ['provider_http_calls','tourvisor_calls','samo_calls','anex_calls','andromeda_calls','database_writes','mapping_writes']:
              assert r[k]==0,k
          print(json.dumps({'candidate_status_counts':r['candidate_status_counts'],'rows_with_second_independent_proof':r['rows_with_second_independent_proof'],'by_v33_bucket':r['by_v33_bucket']},ensure_ascii=False,sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-v37-single-direct-current-v40-${{ github.run_id }}
          path: |
            terminal/result.json
            terminal/receipt.json
            terminal/reservation.json
            terminal/remote.stdout
            terminal/remote.stderr
          retention-days: 90
          if-no-files-found: warn
