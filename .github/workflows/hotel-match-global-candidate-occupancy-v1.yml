name: MATCH GLOBAL candidate occupancy v1
on:
  push:
    branches: [ops/match-global-current-review-2333-20260913-v1]
    paths: [.github/match-global-candidate-occupancy-2333-20260913-v1.arm]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Read CURRENT occupancy for global safe set
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,tempfile
          php='''<?php $root=realpath(getcwd());require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->exec('START TRANSACTION READ ONLY');$out=[];foreach([17272,78882,81233,978] as$id){$a=$db->prepare("SELECT anex_hotel_id,catalog_hotel_id,enabled FROM anex_hotel_search_mappings WHERE catalog_hotel_id=? AND enabled=1 ORDER BY anex_hotel_id");$a->execute([$id]);$d=$db->prepare("SELECT external_hotel_id,local_hotel_id FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND decision_status='accepted' AND local_hotel_id=? ORDER BY external_hotel_id");$d->execute([$id]);$out[(string)$id]=['anex'=>$a->fetchAll(PDO::FETCH_ASSOC),'andromeda'=>$d->fetchAll(PDO::FETCH_ASSOC)];}$db->commit();echo json_encode(['status'=>'completed','operation_id'=>'hotel-match-global-candidate-occupancy-2333-20260913-v1','targets'=>$out,'database_writes'=>0,'supplier_calls'=>0],JSON_UNESCAPED_SLASHES),"\n";?>''';P=pathlib.Path;raw=os.environ['SSH_KEY'].strip();host=os.environ['SSH_HOST'].strip();user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='occ-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key';known=P(td)/'known';key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600);p=subprocess.run(['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0'],input=php,text=True,capture_output=True,timeout=300)
          if p.returncode!=0:raise SystemExit(2)
          v=json.loads(p.stdout);pathlib.Path('occupancy.json').write_text(json.dumps(v,sort_keys=True,indent=2)+'\n');print(json.dumps(v['targets'],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'match-global-candidate-occupancy-v1-${{ github.run_id }}', path: occupancy.json, retention-days: 90}
