name: LOCAL one-shot CURRENT stay evidence v3
on:
  pull_request:
    types: [opened, synchronize]
    branches: [release/search3-production-ready-v1]
    paths:
      - 'scripts/catalog/anytour_stay_candidates_current_v3.php'
      - '.github/workflows/search3-anytour-stay-evidence-current-v3.yml'
permissions:
  contents: read
concurrency:
  group: anytour-stay-evidence-operations
  cancel-in-progress: false

jobs:
  checked-evidence:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.head.ref == 'ops/local-2690-stay-evidence-current-20260917-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      head: ${{ github.event.pull_request.head.sha }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: anytour_stay_import_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Verify merged binary-safe stay candidate source on isolated MySQL
        env:
          ANYTOUR_STAY_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_stay_fixture;charset=utf8mb4'
          ANYTOUR_STAY_TEST_PASSWORD: fixture-only-password
          ANYTOUR_STAY_CANDIDATES_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_stay_candidates_fixture;charset=utf8mb4'
          ANYTOUR_STAY_CANDIDATES_TEST_PASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          php -l scripts/catalog/anytour_stay_candidates_current_v3.php
          php -l scripts/catalog/anytour_stay_candidates.php
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=anytour_stay_import_fixture;charset=utf8mb4","root","fixture-only-password"); $p->exec("CREATE DATABASE anytour_stay_fixture"); $p->exec("CREATE DATABASE anytour_stay_candidates_fixture");'
          php tests/anytour_stay_catalog_test.php
          php tests/anytour_stay_candidates_test.php
      - name: Retain exact merged source and reservation
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,subprocess,tarfile
          source='26e2de291f20bfca6aff365d3e9c77b48a12f3cf'; op='local-stay-evidence-current-2690-20260917-v3'
          merged=['scripts/catalog/anytour_stay_candidates.php','v2/data/anytour-stay-catalog-v1.php','v2/data/db-v1.php']
          files=merged+['scripts/catalog/anytour_stay_candidates_current_v3.php']
          for name in merged:
              assert subprocess.check_output(['git','rev-parse','HEAD:'+name]).strip()==subprocess.check_output(['git','rev-parse',source+':'+name]).strip(), 'merged stay source changed'
          work=pathlib.Path('retained'); work.mkdir(); payload={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files}
          with tarfile.open(work/'payload.tar.gz','w:gz') as t:
              for name in files:
                  data=pathlib.Path(name).read_bytes(); info=tarfile.TarInfo('payload/'+name); info.size=len(data); info.mode=0o600; info.mtime=0; t.addfile(info,io.BytesIO(data))
          r={'operation':op,'dataSource':source,'executionSource':os.environ['EXACT_HEAD'],'run':int(os.environ['GITHUB_RUN_ID']),
             'attempt':1,'readOnly':True,'files':payload,'limitPerKind':1000,'supplierCalls':0,'dbWrites':0,'noReplay':True}
          (work/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          (work/'transport.sha256').write_text(''.join(hashlib.sha256((work/n).read_bytes()).hexdigest()+'  '+n+'\n' for n in ['payload.tar.gz','reservation.json']))
          PY
      - id: retained
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-stay-evidence-v3-reservation-${{ github.run_id }}
          path: retained/
          if-no-files-found: error
          retention-days: 30

  current-read:
    needs: checked-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.checked-evidence.outputs.artifact_id }}
          path: retained
          merge-multiple: true
      - name: Recheck exact head, fresh LOCAL claim and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.checked-evidence.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api repos/pyatkoff/poisk-turov-test/pulls/$PR_NUMBER --jq '.head.sha')" = "$HEAD_SHA"
          gh api repos/pyatkoff/poisk-turov-test/issues/comments/5710636616 > claim.json
          python3 - <<'PY'
          import datetime,json,os,subprocess,time
          c=json.load(open('claim.json')); assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert 'local-stay-evidence-current-2690-20260917-v3' in c['body'] and 'ops/local-2690-stay-evidence-current-20260917-v3' in c['body']
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(c['created_at'].replace('Z','+00:00')); assert 0<=age.total_seconds()<5400
          head=os.environ['HEAD_SHA']; ok=False
          for _ in range(36):
              checks=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/poisk-turov-test/commits/{head}/check-runs']))['check_runs']
              if any(x['name']=='guard' and x['conclusion']=='success' for x in checks): ok=True; break
              if any(x['name']=='guard' and x['status']=='completed' and x['conclusion']!='success' for x in checks): break
              time.sleep(5)
          assert ok,'exact-head Security guard not green'
          PY
          cd retained && sha256sum -c transport.sha256
      - name: Capture CURRENT stay evidence once
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] && [[ "$REMOTE_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]
          mkdir -p evidence; key="$RUNNER_TEMP/stay-key"; known="$RUNNER_TEMP/stay-known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 -d > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null; ssh-keyscan -T 15 -t ed25519 "$HOST" > "$known" 2>/dev/null
          test "$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          opts=(-i "$key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$REMOTE_USER@$HOST"; path='.anytour-operations/local-stay-evidence-current-2690-20260917-v3'
          ssh "${opts[@]}" "$remote" 'umask 077; test ! -L "$HOME/.anytour-operations"; mkdir -p "$HOME/.anytour-operations"; mkdir "$HOME/.anytour-operations/local-stay-evidence-current-2690-20260917-v3"'
          scp "${opts[@]}" retained/{reservation.json,transport.sha256,payload.tar.gz} "$remote:$path/"
          set +e
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail; umask 077; cd "$HOME/.anytour-operations/local-stay-evidence-current-2690-20260917-v3"; sha256sum -c transport.sha256
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          r=json.load(open('reservation.json')); assert r['operation']=='local-stay-evidence-current-2690-20260917-v3' and r['attempt']==1 and r['readOnly'] is True and r['noReplay'] is True
          assert r['dataSource']=='26e2de291f20bfca6aff365d3e9c77b48a12f3cf' and r['limitPerKind']==1000
          with tarfile.open('payload.tar.gz','r:gz') as t:
              members=t.getmembers(); assert len(members)==len(r['files'])==4 and {m.name for m in members}=={'payload/'+n for n in r['files']}
              for m in members:
                  assert m.isfile() and 0<m.size<200000 and '..' not in pathlib.PurePosixPath(m.name).parts
                  data=t.extractfile(m).read(); assert hashlib.sha256(data).hexdigest()==r['files'][m.name[8:]]
                  p=pathlib.Path(m.name); p.parent.mkdir(parents=True,exist_ok=True,mode=0o700); p.write_bytes(data)
          PY
          set +e; php -d display_errors=0 payload/scripts/catalog/anytour_stay_candidates_current_v3.php; status=$?; set -e
          test -s result.json; sha256sum result.json > result.sha256; exit "$status"
          REMOTE
          rc=$?; set -e
          scp "${opts[@]}" "$remote:$path/result.json" evidence/result.json >/dev/null 2>&1 || true
          scp "${opts[@]}" "$remote:$path/result.sha256" evidence/result.sha256 >/dev/null 2>&1 || true
          cp retained/reservation.json evidence/reservation.json; printf '{"ssh_exit":%s,"noReplay":true}\n' "$rc" > evidence/transport-result.json
          test "$rc" = 0 && test -s evidence/result.json && test -s evidence/result.sha256; (cd evidence && sha256sum -c result.sha256)
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/result.json')); assert r['status']=='current_read_only_evidence_verified'
          assert r['operation']=='local-stay-evidence-current-2690-20260917-v3' and r['writes']==r['supplierCalls']==r['automaticAccepts']==r['publicFileWrites']==0
          i=r['inventory']; assert i['writes']==i['supplierCalls']==i['automaticAccepts']==0
          print(json.dumps({'status':r['status'],'counts':i['counts'],'mealPlans':len(i['localMealPlans'])},ensure_ascii=False))
          PY
      - name: Retain terminal CURRENT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-stay-evidence-v3-result-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
