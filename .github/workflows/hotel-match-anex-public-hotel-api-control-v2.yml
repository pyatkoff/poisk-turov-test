name: MATCH ANEX hotel API hotelCode control v2
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-public-hotel-api-control-v2.yml]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-anex-public-hotel-api-control-1971-20260914-v2}
jobs:
  inspect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve before public GET
        run: |
          set -euo pipefail; mkdir -p /tmp/out
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_network","database_writes":0,"mapping_writes":0,"supplier_search_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" >/tmp/out/reservation.json
      - uses: actions/upload-artifact@v4
        with: {name: match-anex-public-hotel-api-control-v2-reservation, path: /tmp/out/reservation.json, retention-days: 90}
      - name: Compare known media hotelCode 5844 with current canonical hotel detail
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,pathlib,os,re
          path='/hotels/egypt/swiss-heaven-sharming-inn-hotel'; expected=5844
          url='https://api.anextour.ru/b2c/hotel?hotel='+urllib.parse.quote(path,safe='')
          req=urllib.request.Request(url,headers={'User-Agent':'AnyTour-MATCH-hotelcode-control/2.0','Accept':'application/json,text/plain,*/*'})
          with urllib.request.urlopen(req,timeout=25) as r:
            final=r.geturl(); raw=r.read(2*1024*1024); status=r.status; ctype=r.headers.get('content-type')
          pr=urllib.parse.urlparse(final)
          if pr.scheme!='https' or pr.hostname!='api.anextour.ru': raise RuntimeError('unexpected redirect '+final)
          data=json.loads(raw)
          info=data[0].get('info') if isinstance(data,list) and data and isinstance(data[0],dict) else None
          inc=info.get('inc') if isinstance(info,dict) else None
          room_hotels=sorted(set(r.get('hotel') for r in (data[0].get('rooms') or []) if isinstance(r,dict) and isinstance(r.get('hotel'),int))) if info else []
          image_urls=[]
          if info:
            def walk(v):
              if isinstance(v,dict):
                for k,x in v.items():
                  if isinstance(x,str) and x.startswith('https://files') and 'anextour' in x: image_urls.append(x)
                  walk(x)
              elif isinstance(v,list):
                for x in v: walk(x)
            walk(data)
          refs=[]
          for u in image_urls:
            q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
            vals=q.get('hotelCode') or q.get('hotelcode') or []
            if vals: refs.append({'url':u,'hotelCode':vals})
          out={'status':'completed','operation_id':os.environ['OPERATION_ID'],'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'request_path':path,'request_url':url,'http':status,'content_type':ctype,'body_bytes':len(raw),'body_sha256':hashlib.sha256(raw).hexdigest(),'known_media_hotelCode':expected,'hotel_info':({'inc':inc,'name':info.get('name'),'lname':info.get('lname'),'exName':info.get('exName'),'slug':info.get('slug'),'state':info.get('state'),'stateKey':info.get('stateKey'),'town':info.get('town'),'townKey':info.get('townKey'),'latitude':info.get('latitude'),'longitude':info.get('longitude'),'partnerInc':info.get('partnerInc')} if info else None),'room_hotel_values':room_hotels,'image_url_count':len(image_urls),'image_hotelCode_refs':refs[:100],'inc_equals_known_hotelCode':inc==expected,'room_hotel_equals_inc':room_hotels==[inc] if isinstance(inc,int) else False,'database_writes':0,'mapping_writes':0,'supplier_search_calls':0,'no_replay':True}
          pathlib.Path('/tmp/out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-public-hotel-api-control-v2-result
          path: |
            /tmp/out/reservation.json
            /tmp/out/result.json
          retention-days: 90
