name: Search3 local DB-first results
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'v2/data/anytour-search-scope-v1.php'
      - 'v2/data/anytour-offer-scope-index-v1.php'
      - 'v2/data/anytour-offer-snapshot-ingest-v1.php'
      - 'v2/data/search3-local-results-read-v1.php'
      - 'v2/data/anytour-offer-store-read-v2.php'
      - 'v2/data/.htaccess'
      - 'tests/search3_local_db_results_test.php'
      - 'tests/anytour-offer-store-v2-snapshot-test.php'
      - 'v2/data/anytour-offer-store-v1.php'
      - 'v2/data/anytour-canonical-catalog-v1.php'
      - 'v2/data/migrations/20260916-anytour-offer-store.sql'
      - 'v2/data/migrations/20260917-anytour-offer-store-v2.sql'
      - 'v2/data/migrations/20260917-anytour-offer-scope-index.sql'
      - '.github/workflows/search3-local-db-results.yml'
permissions:
  contents: read
jobs:
  db-first-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: anytour_local_results_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Syntax and exact Apache data allowlist
        run: |
          php -l v2/data/anytour-search-scope-v1.php
          php -l v2/data/anytour-offer-scope-index-v1.php
          php -l v2/data/anytour-offer-snapshot-ingest-v1.php
          php -l v2/data/search3-local-results-read-v1.php
          php -l v2/data/anytour-offer-store-read-v2.php
          php -l tests/search3_local_db_results_test.php
          php -l tests/anytour-offer-store-v2-snapshot-test.php
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('v2/data/.htaccess').read_text()
          grants=re.findall(r'<Files\s+"([^"]+\.php)">\s*Require all granted\s*</Files>',text,re.S)
          assert grants==['hotel-details-read-v1.php','search3-local-results-read-v1.php'],grants
          endpoint=pathlib.Path('v2/data/search3-local-results-read-v1.php').read_text()
          assert '/_preview/search3-local-candidate/data' in endpoint
          assert "search3_local_results_out(['ok'=>false,'error'=>'Local DB results are isolated to local preview'],403)" in endpoint
          migration=pathlib.Path('v2/data/migrations/20260917-anytour-offer-scope-index.sql').read_text()
          assert 'CREATE TABLE IF NOT EXISTS anytour_offer_scopes' in migration
          PY
      - name: Existing offer store regression
        env:
          ANYTOUR_OFFER_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_local_results_fixture;charset=utf8mb4'
          ANYTOUR_OFFER_TEST_USER: root
          ANYTOUR_OFFER_TEST_PASSWORD: fixture-only-password
        run: php tests/anytour-offer-store-v1-test.php --require-sql
      - name: Completed snapshot visibility regression
        env:
          ANYTOUR_OFFER_V2_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_local_results_fixture;charset=utf8mb4'
          ANYTOUR_OFFER_V2_TEST_PASSWORD: fixture-only-password
        run: php tests/anytour-offer-store-v2-snapshot-test.php
      - name: DB first reader regression
        env:
          ANYTOUR_LOCAL_RESULTS_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_local_results_fixture;charset=utf8mb4'
          ANYTOUR_LOCAL_RESULTS_TEST_PASSWORD: fixture-only-password
        run: php tests/search3_local_db_results_test.php
