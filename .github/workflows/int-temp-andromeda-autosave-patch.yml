name: TEMP patch Andromeda autosave hook

on:
  push:
    branches: ['feature/int-andromeda-offer-autosave-2506-20260917']
    paths: ['.github/workflows/int-temp-andromeda-autosave-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/int-andromeda-offer-autosave-2506-20260917
          fetch-depth: 0
      - name: Apply exact two-site patch and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v2/api-andromeda-search3-preview.php')
          s=p.read_text()
          old="foreach(['andromeda-client','andromeda-transport','andromeda-normalizer','andromeda-hotel-resolver','andromeda-search','andromeda-hotel-observations','anex-normalizer'] as $file) require_once $andromedaApp.'/'.$file.'.php';"
          new="foreach(['andromeda-client','andromeda-transport','andromeda-normalizer','andromeda-hotel-resolver','andromeda-search','andromeda-hotel-observations','andromeda-anytour-offer-autosave','anex-normalizer'] as $file) require_once $andromedaApp.'/'.$file.'.php';"
          if s.count(old)!=1: raise SystemExit('dependency insertion source drift')
          s=s.replace(old,new,1)
          old2="""        catch(Throwable $ignored) {}
        return anytour_andromeda_search3_project($request,$pdo,$page,$saved,
            ['directory'=>$directory,'store'=>$state['store'],'created_at'=>$number===1?$state['store']['created_at']:$first['store']['created_at']]);"""
          new2="""        catch(Throwable $ignored) {}
        try {
            anytour_andromeda_anytour_offer_autosave_runtime($request,$pdo,$saved,$directory,$ref,$generation);
        }
        catch(Throwable $ignored) {}
        return anytour_andromeda_search3_project($request,$pdo,$page,$saved,
            ['directory'=>$directory,'store'=>$state['store'],'created_at'=>$number===1?$state['store']['created_at']:$first['store']['created_at']]);"""
          if s.count(old2)!=1: raise SystemExit('autosave hook source drift')
          p.write_text(s.replace(old2,new2,1))
          PY
          php -l v2/api-andromeda-search3-preview.php
          git rm .github/workflows/int-temp-andromeda-autosave-patch.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add v2/api-andromeda-search3-preview.php
          git commit -m 'INT: hook complete Andromeda cohort autosave'
          git push origin HEAD:feature/int-andromeda-offer-autosave-2506-20260917
