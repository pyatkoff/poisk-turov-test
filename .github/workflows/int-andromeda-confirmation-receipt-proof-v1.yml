name: INT Andromeda confirmation receipt proof v1

on:
  push:
    branches: ['ops/int-andromeda-confirmation-receipt-proof-20260919-v1']
    paths: ['.github/workflows/int-andromeda-confirmation-receipt-proof-v1.yml']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: 18246c9a014fe110362274691e1dcab1f9b91e50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Apply ephemeral compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/integrations/andromeda-anytour-offer-autosave.php')
          s=p.read_text()
          start=s.index('private static function producerReceipt')
          end=s.index('private static function receipt',start)
          block=s[start:end]
          needle="'readyOfferCount' => (int)($result['readyOfferCount'] ?? 0),"
          if block.count(needle) != 1:
              raise SystemExit(f'RECEIPT_NEEDLE_COUNT={block.count(needle)}')
          replacement=needle+"\n            'confirmationRequiredOfferCount' => (int)($result['confirmationRequiredOfferCount'] ?? 0),"
          p.write_text(s[:start]+block.replace(needle,replacement)+s[end:])

          t=Path('tests/andromeda-cache-cohort-order-test.php')
          q=t.read_text()
          old="aassert($prices === [105 => '223000'] && $verified === [105 => true], 'flight-only estimate entered full-price store');"
          new="""$expectedStored = $validSeed
            ? [104 => '210000', 105 => '223000']
            : [101 => '190000', 103 => '200000', 104 => '210000', 105 => '223000'];
        $expectedVerified = $validSeed
            ? [104 => false, 105 => true]
            : [101 => false, 103 => false, 104 => false, 105 => true];
        aassert($prices === $expectedStored && $verified === $expectedVerified, 'estimated rows or confirmation fallback stored incorrectly');"""
          if q.count(old) != 1:
              raise SystemExit(f'COHORT_EXPECTATION_COUNT={q.count(old)}')
          t.write_text(q.replace(old,new))
          PY
          git diff --check
          git diff -- app/integrations/andromeda-anytour-offer-autosave.php tests/andromeda-cache-cohort-order-test.php
      - name: Run exact failing boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l app/integrations/andromeda-anytour-offer-autosave.php
          php -l app/integrations/anytour-offer-snapshot-producer.php
          php -l tests/andromeda-anytour-offer-autosave-test.php
          php -l tests/andromeda-cache-cohort-order-test.php
          php -l tests/andromeda-confirmation-snapshot-producer-test.php
          php -d allow_url_fopen=0 tests/anytour-offer-snapshot-producer-test.php
          php -d allow_url_fopen=0 tests/andromeda-anytour-offer-autosave-test.php
          php -d allow_url_fopen=0 tests/andromeda-cache-cohort-order-test.php
          php -d allow_url_fopen=0 tests/andromeda-confirmation-snapshot-producer-test.php
          echo ANDROMEDA_CONFIRMATION_RECEIPT_AND_COHORT_EPHEMERAL_PATCH_OK
