name: Search3 test rationalization bootstrap one-shot

on:
  push:
    branches:
      - refactor/search3-drop-meal-normalization-20260917
    paths:
      - '.github/workflows/search3-test-rationalization-bootstrap-one-shot.yml'

permissions:
  contents: write

jobs:
  bootstrap-real-search3-runtime:
    if: github.ref_name == 'refactor/search3-drop-meal-normalization-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out writable exact head
        uses: actions/checkout@v4
        with:
          ref: refactor/search3-drop-meal-normalization-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Stop injecting the legacy room owner into Search3 tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('tests/helpers/search3-renderer-bootstrap.js')
          text = helper.read_text(encoding='utf-8')
          old = "const sources = ['v2/search3-room-normalizer-v1.js', 'v2/results-renderer-v5.js'];"
          new = "const sources = ['v2/results-renderer-v5.js'];"
          if text.count(old) != 1:
              raise SystemExit(f'helper source list expected once, found {text.count(old)}')
          helper.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/search3-test-rationalization-one-shot.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'name: Search3 test rationalization one-shot'
          new = 'name: Search3 test rationalization one-shot v2'
          if text.count(old) != 1:
              raise SystemExit(f'one-shot name expected once, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node tests/search3-room-runtime-contract.cjs
          git diff --check
          git rm .github/workflows/search3-test-rationalization-bootstrap-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/helpers/search3-renderer-bootstrap.js .github/workflows/search3-test-rationalization-one-shot.yml
          git commit -m 'test(search3): use actual Search3 renderer environment'
          git push origin HEAD:refactor/search3-drop-meal-normalization-20260917
