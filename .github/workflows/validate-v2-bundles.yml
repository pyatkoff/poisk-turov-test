name: Validate V2 startup bundles

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/validate-v2-bundles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundle manifest and endpoint
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/bundle-manifest-v1.php
          php -l v2/bundle-v1.php
          php -l v2/assets.php
          php -l v2/data/destinations-v1.php
          php <<'PHP'
          <?php
          require 'v2/assets.php';
          $manifest=v2_bundle_manifest();
          foreach (['css','js'] as $type) {
              if (empty($manifest[$type])) {fwrite(STDERR,"empty $type bundle\n"); exit(1);}
              if (count($manifest[$type]) !== count(array_unique($manifest[$type]))) {fwrite(STDERR,"duplicate $type asset\n"); exit(2);}
              foreach ($manifest[$type] as $file) {
                  if (!is_file('v2/'.$file) || filesize('v2/'.$file) < 1) {fwrite(STDERR,"missing $file\n"); exit(3);}
              }
              $a=v2_bundle_content_version($type);
              $b=v2_bundle_content_version($type);
              if ($a==='0' || $a!==$b || strlen($a)!==16) {fwrite(STDERR,"unstable $type version\n"); exit(4);}
              $url=v2_bundle_asset($type);
              if (!str_contains($url,'bundle-v1.php?type='.$type.'&v='.$a)) {fwrite(STDERR,"bad $type url: $url\n"); exit(5);}
          }
          if (count($manifest['css'])!==30) {fwrite(STDERR,'unexpected css count '.count($manifest['css'])."\n"); exit(6);}
          if (($manifest['css'][0]??'')!=='design-system-v1.css') {fwrite(STDERR,"design system must load first\n"); exit(8);}
          if (!in_array('site-header-v2.css',$manifest['css'],true)) {fwrite(STDERR,"canonical site header css missing\n"); exit(12);}
          if (!in_array('hotel-autocomplete-v1.css',$manifest['css'],true)) {fwrite(STDERR,"hotel autocomplete css missing\n"); exit(13);}
          if (!in_array('search-shell-grid-v1.css',$manifest['css'],true)) {fwrite(STDERR,"shared search shell grid css missing\n"); exit(16);}
          if (($manifest['css'][count($manifest['css'])-3]??'')!=='search-header-layout-guard-v1.css') {fwrite(STDERR,"search header layout guard must stay before footer rhythm and shared-shell override\n"); exit(9);}
          if (($manifest['css'][count($manifest['css'])-2]??'')!=='search-footer-rhythm-v1.css') {fwrite(STDERR,"search footer rhythm must stay directly before shared-shell override\n"); exit(10);}
          if (($manifest['css'][count($manifest['css'])-1]??'')!=='search-header-shared-shell-v1.css') {fwrite(STDERR,"search shared-shell override must load last\n"); exit(11);}
          if (count($manifest['js'])!==35) {fwrite(STDERR,'unexpected js count '.count($manifest['js'])."\n"); exit(7);}
          if (!in_array('catalog-local-routing-v1.js',$manifest['js'],true)) {fwrite(STDERR,"local catalog router missing\n"); exit(15);}
          if (!in_array('hotel-autocomplete-v1.js',$manifest['js'],true)) {fwrite(STDERR,"hotel autocomplete js missing\n"); exit(14);}
          if (!in_array('passive-price-observer-v1.js',$manifest['js'],true)) {fwrite(STDERR,"passive price observer missing\n"); exit(17);}
          echo 'BUNDLE_MANIFEST_OK css='.count($manifest['css']).' js='.count($manifest['js'])."\n";
          PHP
      - name: Validate bundled JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          php -r '$_GET=["type"=>"js"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/v2-active-bundle.js"
          test -s "$RUNNER_TEMP/v2-active-bundle.js"
          node --check "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'window.V2Runtime=runtime' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'catalog-local-routing-v1' v2/bundle-manifest-v1.php
          grep -Fq 'window.V2SearchLifecycle=' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'window.V2PassivePriceObserver=' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'window.V2SelectedTourReturnV1=' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'window.V2TourController=' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'window.V2FlightEmptyRecoveryV1=' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'window.V2LeadUiRaceGuardV1=' "$RUNNER_TEMP/v2-active-bundle.js"
          grep -Fq 'data-v2-hotel-query' "$RUNNER_TEMP/v2-active-bundle.js"
          echo "BUNDLED_JS_SYNTAX_OK"
      - name: Validate bundle HTTP cache contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(php -r 'require "v2/assets.php"; echo v2_bundle_content_version("css");')
          port=18099
          php -S "127.0.0.1:$port" -t "$PWD/v2" >"$RUNNER_TEMP/php-server.log" 2>&1 &
          pid=$!
          trap 'kill $pid >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in {1..40}; do
            if curl -fsS "http://127.0.0.1:$port/bundle-v1.php?type=css&v=$version" -o "$RUNNER_TEMP/bundle.css"; then ready=1; break; fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then cat "$RUNNER_TEMP/php-server.log" >&2 || true; exit 12; fi
            sleep .25
          done
          if [ "$ready" -ne 1 ]; then cat "$RUNNER_TEMP/php-server.log" >&2 || true; exit 13; fi
          test -s "$RUNNER_TEMP/bundle.css"
          curl -fsSI "http://127.0.0.1:$port/bundle-v1.php?type=css&v=$version" > "$RUNNER_TEMP/headers"
          grep -iq '^Content-Type: text/css' "$RUNNER_TEMP/headers"
          grep -iq '^Cache-Control: public, max-age=31536000, immutable' "$RUNNER_TEMP/headers"
          grep -Fq '.search-submit' "$RUNNER_TEMP/bundle.css"
          grep -Fq -- '--at-shell:1180px' "$RUNNER_TEMP/bundle.css"
          grep -Fq '.at-global-header' "$RUNNER_TEMP/bundle.css"
          grep -Fq '.hotel-autocomplete__option' "$RUNNER_TEMP/bundle.css"
          grep -Fq 'AnyTour Design System 1.0: keep the mature search surface' "$RUNNER_TEMP/bundle.css"
          grep -Fq 'Production guard for the legacy search-header markup' "$RUNNER_TEMP/bundle.css"
          grep -Fq 'Search-page footer rhythm guard' "$RUNNER_TEMP/bundle.css"
          grep -Fq 'Search-header compatibility layer' "$RUNNER_TEMP/bundle.css"
          echo "BUNDLE_HTTP_CACHE_OK"
      - name: Validate startup request collapse
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o "v2_bundle_asset('css')" v2/index.php | wc -l)" -eq 1
          test "$(grep -o "v2_bundle_asset('js')" v2/index.php | wc -l)" -eq 1
          test "$(grep -o '<link[^>]*v2_bundle_asset' v2/index.php | wc -l)" -eq 1
          test "$(grep -o '<script src=[^>]*v2_bundle_asset' v2/index.php | wc -l)" -eq 1
          grep -Fq 'CI source-closure markers only; this PHP comment emits no browser requests.' v2/index.php
          grep -Fq 'id="v2-primary-search-ux-style"' v2/index.php
          echo "STARTUP_ASSET_REQUESTS=2 PREVIOUS=44 REDUCTION=42"
