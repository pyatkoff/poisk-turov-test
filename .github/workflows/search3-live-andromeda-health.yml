name: Search3 live Andromeda health

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/search3-live-andromeda-health.cjs'
      - '.github/workflows/search3-live-andromeda-health.yml'

permissions:
  contents: read

jobs:
  live-andromeda:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Guard one-shot provider probe
        run: |
          set -euo pipefail
          node --check tests/search3-live-andromeda-health.cjs
          ! grep -En 'search-submit.*click|continue-search.*click|lead|booking|confirm-tour' tests/search3-live-andromeda-health.cjs
          ! grep -En 'secrets\.|ssh|scp|rsync' tests/search3-live-andromeda-health.cjs
      - name: Install pinned Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/search3-live-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-live-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probe one direct Andromeda search
        env:
          NODE_PATH: ${{ runner.temp }}/search3-live-tools/node_modules
          SEARCH3_LIVE_OUTPUT: ${{ runner.temp }}/search3-live-andromeda-health
        run: node tests/search3-live-andromeda-health.cjs
      - name: Retain sanitized result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-live-andromeda-health-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/search3-live-andromeda-health/
          if-no-files-found: warn
          retention-days: 7
