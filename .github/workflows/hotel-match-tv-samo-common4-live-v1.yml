name: MATCH common4 live full-drain v1

on:
  push:
    branches:
      - ops/match-common4-live-1971-20260918-v1
    paths:
      - .github/workflows/hotel-match-tv-samo-common4-live-v1.yml

permissions:
  contents: read
  actions: read
  checks: read
  issues: read

concurrency:
  group: match-common4-live-1971-20260918-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-tv-samo-common4-full-drain-1971-20260918-v1
  EXPECTED_BASE: 1b54e39d5a073fc5d35818b10a80db04873cc67d
  SOURCE_MERGE: 4287318e233e810caa1de47ff53c9a632916eecb
  SOURCE_PR_HEAD: 450a7aba56f3246463dd936e75790307bd195781
  CLAIM_COMMENT_ID: '5722782025'

jobs:
  live:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/ops/match-common4-live-1971-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact ops delta and merged collector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"

          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/hotel-match-tv-samo-common4-live-v1.yml"

          git diff --quiet "$SOURCE_MERGE" -- \
            scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php \
            scripts/diagnostics/hotel_match_operator_fingerprint_room_evidence_v1.php \
            tests/hotel_match_tv_samo_common4_full_drain_v1_test.php \
            app/integrations/andromeda-client.php \
            app/integrations/andromeda-transport.php \
            app/integrations/andromeda-network-transport-failure.php \
            v2/data/tourvisor-client-v1.php

          php -l scripts/diagnostics/hotel_match_operator_fingerprint_room_evidence_v1.php
          php -l scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php
          php -l tests/hotel_match_tv_samo_common4_full_drain_v1_test.php
          php scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php --self-test
          php tests/hotel_match_tv_samo_common4_full_drain_v1_test.php

          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json, os
          c=json.load(open('claim.json'))
          assert c['user']['id'] == 226193297
          assert c['author_association'] == 'OWNER'
          body=c['body']
          assert os.environ['OPERATION_ID'] in body
          assert 'one execution only' in body
          assert 'DB/mapping/booking/lead/Metrika/main/production writes0' in body
          PY

          gh api "repos/pyatkoff/poisk-turov-test/commits/$SOURCE_PR_HEAD/check-runs" > source-checks.json
          python3 - <<'PY'
          import json
          runs=json.load(open('source-checks.json'))['check_runs']
          ok={(x['name'],x['conclusion']) for x in runs}
          assert ('guard','success') in ok
          assert ('test','success') in ok
          PY

      - name: Create durable runner reservation before provider access
        env:
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reservation
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          deps=[
            'scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php',
            'scripts/diagnostics/hotel_match_operator_fingerprint_room_evidence_v1.php',
            'app/integrations/andromeda-client.php',
            'app/integrations/andromeda-transport.php',
            'app/integrations/andromeda-network-transport-failure.php',
            'v2/data/tourvisor-client-v1.php',
          ]
          r={
            'operation':os.environ['OPERATION_ID'],
            'state':'reserved_before_provider_access',
            'ops_head':os.environ['HEAD_SHA'],
            'source_merge':os.environ['SOURCE_MERGE'],
            'source_pr_head':os.environ['SOURCE_PR_HEAD'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'route':'Moscow->Turkey/Antalya',
            'operator_families':['anex','biblio','funsun','intourist'],
            'stars':[3,4,5],
            'nights':7,
            'adults':2,
            'children':0,
            'tourvisor_continue_required':True,
            'andromeda_all_pages_required':True,
            'multi_operator_both_providers':True,
            'dependencies':{
              p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
              for p in deps
            },
            'database_writes':0,
            'mapping_writes':0,
            'booking_calls':0,
            'lead_writes':0,
            'metrika_writes':0,
            'no_replay_after_provider_access':True,
          }
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n').encode()
          pathlib.Path('reservation/reservation.json').write_bytes(raw)
          pathlib.Path('reservation/reservation.sha256').write_text(
              hashlib.sha256(raw).hexdigest()+'  reservation.json\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-common4-live-reservation-${{ github.run_id }}
          path: reservation/
          if-no-files-found: error
          retention-days: 90

      - name: Require existing live credentials without exposing them
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANDROMEDA_USERNAME_VALUE: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD_VALUE: ${{ secrets.ANDROMEDA_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          test -n "$HOST_VALUE"
          test -n "$USER_VALUE"
          test -n "$ANDROMEDA_USERNAME_VALUE"
          test -n "$ANDROMEDA_PASSWORD_VALUE"

      - name: Stage exact read-only payload on AnyTour server
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known_hosts"

          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null
          test -s "$known"

          remote="$USER_VALUE@$HOST_VALUE"
          op=".anytour-operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)

          ssh "${opts[@]}" "$remote" \
            "umask 077; mkdir -p \"\$HOME/.anytour-operations\"; test ! -e \"\$HOME/$op\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""

          scp "${opts[@]}" \
            reservation/reservation.json \
            scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php \
            scripts/diagnostics/hotel_match_operator_fingerprint_room_evidence_v1.php \
            app/integrations/andromeda-client.php \
            app/integrations/andromeda-transport.php \
            app/integrations/andromeda-network-transport-failure.php \
            v2/data/tourvisor-client-v1.php \
            "$remote:$op/payload/"

          ssh "${opts[@]}" "$remote" \
            "mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\"; chmod 600 \"\$HOME/$op/reservation.json\" \"\$HOME/$op/payload/\"*"

      - name: Run common4 full-drain exactly once
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANDROMEDA_USERNAME_VALUE: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD_VALUE: ${{ secrets.ANDROMEDA_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p terminal

          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known_hosts"
          remote="$USER_VALUE@$HOST_VALUE"
          op=".anytour-operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)

          set +e
          printf '%s\n%s\n' "$ANDROMEDA_USERNAME_VALUE" "$ANDROMEDA_PASSWORD_VALUE" | \
            ssh "${opts[@]}" "$remote" \
              "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" php -d display_errors=0 -d log_errors=0 \"\$HOME/$op/payload/hotel_match_tv_samo_common4_full_drain_v1.php\" --execute" \
              > terminal/remote-stdout.txt 2> terminal/remote-stderr.txt
          rc=$?

          ssh "${opts[@]}" "$remote" \
            "p=\"\$HOME/$op\"; test -f \"\$p/reservation.json\"; test -f \"\$p/result.json\"; test -f \"\$p/receipt.json\"; tar -C \"\$p\" -czf - reservation.json result.json receipt.json" \
            > terminal/server-operation.tgz 2>>terminal/remote-stderr.txt
          trc=$?
          set -e

          printf '%s\n' "$rc" > terminal/remote-exit.txt
          printf '%s\n' "$trc" > terminal/tar-exit.txt

      - name: Verify and summarize terminal receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          p=pathlib.Path('terminal')
          server=p/'server'
          server.mkdir(exist_ok=True)

          archive=p/'server-operation.tgz'
          if not archive.exists() or archive.stat().st_size == 0:
              raise SystemExit('missing terminal server operation archive')

          with tarfile.open(archive,'r:gz') as t:
              names=sorted(t.getnames())
              assert names == ['receipt.json','reservation.json','result.json'], names
              for m in t.getmembers():
                  assert m.isfile()
                  assert m.size < 25_000_000
                  (server/m.name).write_bytes(t.extractfile(m).read())

          assert pathlib.Path('reservation/reservation.json').read_bytes() == (server/'reservation.json').read_bytes()

          result=json.loads((server/'result.json').read_text())
          receipt=json.loads((server/'receipt.json').read_text())
          digest=hashlib.sha256((server/'result.json').read_bytes()).hexdigest()

          assert receipt['result_sha256'] == digest
          assert receipt['readback_verified'] is True
          assert receipt['database_writes'] == 0
          assert receipt['mapping_writes'] == 0
          assert receipt['no_replay'] is True

          if result['state'] != 'completed_read_only':
              print(json.dumps({
                  'state':result['state'],
                  'reason':result.get('reason'),
                  'result_sha256':digest,
                  'no_replay':result.get('no_replay'),
              },ensure_ascii=False,sort_keys=True))
              raise SystemExit(2)

          assert result['database_writes'] == 0
          assert result['mapping_writes'] == 0
          assert result['booking_calls'] == 0
          assert result['lead_writes'] == 0
          assert result['metrika_writes'] == 0
          assert result['tv_multi_operator_mode'] == 'repeated_operatorIds_query_param'
          assert result['samo_multi_operator_mode'] == 'csv_OPERATORS'

          summary={
              'state':result['state'],
              'route':result['route'],
              'common_operators':result['common_operators'],
              'missing_operator_families':result['missing_operator_families'],
              'tv_calls':result['tv_calls'],
              'andromeda_calls':result['andromeda_calls'],
              'tourvisor_detail_calls':result['tourvisor_detail_calls'],
              'stars':{},
              'result_sha256':digest,
              'no_replay':True,
          }

          for star, data in result['stars'].items():
              tv=data['tourvisor']
              samo=data['andromeda']
              resolver=data['resolver']

              assert tv['fully_drained'] is True
              assert len(tv['continue_rounds']) >= 2
              last=tv['continue_rounds'][-1]
              assert last['request_count'] == 0 or last['added_hotels'] + last['added_tours'] == 0

              if samo['pages_count'] == 0:
                  assert samo['pages_drained'] == 0
              else:
                  assert samo['pages_count'] == samo['pages_drained']

              assert resolver['database_writes'] == 0
              assert resolver['mapping_writes'] == 0
              assert resolver['supplier_calls'] == 0

              summary['stars'][star]={
                  'tv_evidence_rows':tv['evidence_rows'],
                  'samo_evidence_rows':samo['evidence_rows'],
                  'tv_operator_rows':tv['operator_rows'],
                  'samo_operator_rows':samo['operator_rows'],
                  'hotel_candidates':resolver['hotel_candidate_count'],
                  'room_candidates':resolver['room_candidate_count'],
                  'tv_continue_rounds':len(tv['continue_rounds'])-1,
                  'samo_pages':samo['pages_drained'],
              }

          pathlib.Path('terminal/summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n'
          )
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-common4-live-result-${{ github.run_id }}
          path: terminal/
          if-no-files-found: error
          retention-days: 90
