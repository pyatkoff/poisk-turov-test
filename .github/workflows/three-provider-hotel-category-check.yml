name: Three-provider hotel category
on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-hotel-category.php'
      - 'tests/three-provider-hotel-category-test.php'
      - '.github/workflows/three-provider-hotel-category-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate hotel category evidence semantics without network
        run: |
          php -l app/integrations/three-provider-hotel-category.php
          php -l tests/three-provider-hotel-category-test.php
          php -d allow_url_fopen=0 tests/three-provider-hotel-category-test.php
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/integrations/three-provider-hotel-category.php').read_text()
          assert "'current_local_identity'" in src
          assert "$canonicalKnown ? 'verified' : 'unknown'" in src
          assert "'source' => $canonicalKnown ? 'current_local_identity' : null" in src
          assert "'supplier_label_equivalence_verified' => false" in src
          assert "'raw_supplier_numeric_id_universal' => false" in src
          assert "'cross_provider_equivalence_verified' => false" in src
          assert "'identity_proof_from_category' => false" in src
          for forbidden in ('curl_', 'PDO', 'mysqli_', 'bron(', 'bron_ticket', 'booking', 'file_get_contents('):
              assert forbidden not in src
          print('Three-provider hotel-category static boundary: PASS')
          PY
