name: Owner Andromeda quote preview publish
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
concurrency:
  group: anytoour-andromeda-quote-preview-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 996 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == 'pyatkoff' &&
      github.event.sender.id == 226193297 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/publish-andromeda-quote-preview-1717-v11'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Require exact owner command and first attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "${{ github.event.issue.number }}" = 996
          test "${{ github.event.comment.user.login }}" = pyatkoff
          test "${{ github.event.comment.body }}" = /publish-andromeda-quote-preview-1717-v11
      - uses: actions/checkout@v4
        with:
          ref: 4d8f53763806932cbf24160437cb93e33d04f419
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: helper
          persist-credentials: false
      - name: Recheck exact quote and publisher source offline
        run: |
          test "$(git -C source rev-parse HEAD)" = 4d8f53763806932cbf24160437cb93e33d04f419
          php -l source/app/integrations/andromeda-claim-actions.php
          php -l source/app/integrations/andromeda-selected-quote.php
          php -l source/v2/api-andromeda-quote-preview.php
          php source/tests/andromeda-selected-quote-smoke.php
          python3 -m py_compile source/scripts/diagnostics/andromeda_quote_preview_publish.py
          python3 source/tests/andromeda_quote_preview_publish_test.py -v
      - name: Publish exact four files to isolated preview
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          QUOTE_SOURCE_SHA: 4d8f53763806932cbf24160437cb93e33d04f419
          QUOTE_HELPER_PATH: ${{ github.workspace }}/helper
        run: python3 -B source/scripts/diagnostics/andromeda_quote_preview_publish.py source
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: andromeda-quote-preview-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/andromeda-quote-publication/result.json
          if-no-files-found: warn
          retention-days: 14
