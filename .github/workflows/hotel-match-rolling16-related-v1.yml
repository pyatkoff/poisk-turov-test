name: MATCH rolling16 related evidence read v1
on:
  push:
    branches: [ops/match-rolling16-related-1971-20260919-v1]
    paths: [.github/workflows/hotel-match-rolling16-related-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-rolling16-related-1971-20260919-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-rolling16-related-1971-20260919-v1
jobs:
  read:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '10574360037'
          run-id: 35409538421
          github-token: ${{ github.token }}
          path: retained
          merge-multiple: true
      - name: Verify exact held16 and reserve related read
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p payload result
          cp scripts/diagnostics/hotel_match_rolling16_related_v1.php app/integrations/anex-search-mapping-registry.php payload/
          test "$(git hash-object payload/hotel_match_rolling16_related_v1.php)" = 0bf6aa92aea2a130d1e449b53101f4695da7f852
          test "$(git hash-object payload/anex-search-mapping-registry.php)" = cc135a95d2a6e0f73ce50be2141c9b8a26fddc58
          cp retained/remote/result.json payload/plan.json
          php -l payload/hotel_match_rolling16_related_v1.php
          php payload/hotel_match_rolling16_related_v1.php --self-test payload/plan.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('retained/remote');raw=(p/'result.json').read_bytes();digest=hashlib.sha256(raw).hexdigest()
          assert digest=='678ba78b19600d5c071683e9cfe0c6ebc08cbe480e28fa8e85a463d290ebd1ef'
          d=json.loads(raw);r=json.loads((p/'receipt.json').read_bytes())
          assert d['state']==r['state']=='planned_read_only' and r['result_sha256']==digest and r['readback_verified'] is True
          assert len(d['dossiers'])==38 and d['mapping_writes']==0
          chosen=[x for x in d['dossiers'] if x['eligible_for_guarded_append'] is False and x['holds']]
          assert len(chosen)==len({x['native_anex_id'] for x in chosen})==len({x['hotel_id'] for x in chosen})==16
          res={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_db','source_sha':os.environ['GITHUB_SHA'],'plan_sha256':digest,'read_only':True,'supplier_calls':0,'mapping_writes':0,'no_replay':True}
          with pathlib.Path('result/reservation.json').open('x') as f:
              json.dump(res,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          PY
          (cd payload && sha256sum *.php plan.json > SHA256SUMS)
      - name: Require exact-head Security before SSH
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for n in range(60):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:r=json.load(f)['workflow_runs']
              r=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
              if r:
                  x=max(r,key=lambda x:x['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success';print('SECURITY_OK',x['id']);break
              time.sleep(5)
          else:raise SystemExit('exact_security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-rolling16-related-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Read held16 and explicit related native profiles once
        shell: bash
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/r16-key"; known="$RUNNER_TEMP/r16-known"
          trap 'rm -f "$key" "$known"' EXIT
          test -n "$KEY"; test -n "$HOST"; test -n "$USER"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$known" 2>/dev/null; test -s "$known"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"; op=".anytour-operations/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "set -e; umask 077; mkdir -p \"\$HOME/.anytour-operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\"" >result/setup.stdout 2>result/setup.stderr
          scp "${opts[@]}" result/reservation.json "$remote:$op/" >result/reserve.stdout 2>result/reserve.stderr
          scp "${opts[@]}" payload/* "$remote:$op/payload/" >result/copy.stdout 2>result/copy.stderr
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op/payload\" && sha256sum -c SHA256SUMS >/dev/null && umask 077 && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" php -d display_errors=0 -d log_errors=0 hotel_match_rolling16_related_v1.php --execute" >result/remote.stdout 2>result/remote.stderr
          rc=$?
          scp -r "${opts[@]}" "$remote:$op/." result/remote/ >result/readback.stdout 2>result/readback.stderr
          trc=$?
          set -e
          printf '{"remote":%s,"readback":%s}\n' "$rc" "$trc" >result/exit-codes.json
          test "$trc" -eq 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('result/remote');d=json.loads((p/'result.json').read_bytes());r=json.loads((p/'receipt.json').read_bytes())
          digest=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert d['operation']==r['operation']==os.environ['OPERATION_ID'] and d['source_sha']==os.environ['GITHUB_SHA']
          assert r['result_sha256']==digest and r['readback_verified'] is True and r['no_replay'] is True
          assert d['supplier_calls']==d['database_writes']==d['mapping_writes']==0
          summary={k:d.get(k) for k in ['state','held_dossiers','related_native_ids','all_rivals_accepted_elsewhere_count','reason','sqlstate','driver_code','captured_at_utc']};summary['result_sha256']=digest
          pathlib.Path('result/verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          assert d['state']=='completed_read_only' and len(d['dossiers'])==16 and d['held_dossiers']==16
          assert all(x['safe_to_write_now'] is False for x in d['dossiers'])
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-rolling16-related-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
