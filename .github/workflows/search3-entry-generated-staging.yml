name: Stage exact Search3 entry generated asset

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'src/search3/styles/entry-native-controls.css'
      - 'tests/search3-entry-geometry-browser.cjs'
      - '.github/workflows/search3-entry-generated-staging.yml'

permissions:
  contents: read

jobs:
  stage-generated-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund

      - name: Generate exact canonical entry asset
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -B scripts/build/search3_assets.py --write
          mapfile -t changed < <(git diff --name-only)
          printf 'builder changed: %s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'docs/project/search3-production-import.json'
          test "${changed[1]}" = 'v2/search3-entry-v1.css'
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest = Path('docs/project/search3-production-import.json')
          before = json.loads(subprocess.check_output(['git','show','HEAD:' + str(manifest)], text=True))
          after = json.loads(manifest.read_text())
          def flatten(value, prefix=()):
              if isinstance(value, dict):
                  out = {}
                  for key, child in value.items(): out.update(flatten(child, prefix + (str(key),)))
                  return out
              if isinstance(value, list):
                  out = {}
                  for index, child in enumerate(value): out.update(flatten(child, prefix + (str(index),)))
                  return out
              return {prefix: value}
          left, right = flatten(before), flatten(after)
          diffs = [key for key in sorted(set(left) | set(right)) if left.get(key) != right.get(key)]
          print('manifest diffs:', ['.'.join(key) for key in diffs])
          expected = ('assets', 'search3-entry-v1.css', 'productionSha256')
          assert diffs == [expected], diffs
          css = Path('v2/search3-entry-v1.css').read_bytes()
          digest = hashlib.sha256(css).hexdigest()
          assert right[expected] == digest, (right[expected], digest)
          print('entry bytes=', len(css), 'sha256=', digest)
          PY

      - name: Upload exact generated entry files
        uses: actions/upload-artifact@v4
        with:
          name: search3-entry-generated-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            v2/search3-entry-v1.css
            docs/project/search3-production-import.json
