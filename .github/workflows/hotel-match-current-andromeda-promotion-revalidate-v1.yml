name: MATCH current Andromeda promotion revalidate v1
on:
  push:
    branches: ['ops/match-current-andromeda-promotion-revalidate-1971-20260913-v1']
    paths: ['.github/match-current-andromeda-promotion-revalidate-1971-20260913-v1.arm']
permissions:
  contents: read
  issues: write
concurrency:
  group: match-current-andromeda-promotion-revalidate-1971-20260913-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-current-andromeda-promotion-revalidate-1971-20260913-v1
jobs:
  current-read-only:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Reserve immutable operation
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          s.joinpath('reservation.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_ssh','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
