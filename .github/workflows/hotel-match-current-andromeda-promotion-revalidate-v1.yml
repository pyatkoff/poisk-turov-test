        with:
          name: match-current-andromeda-promotion-revalidate-v1-reservation
          path: ${{ runner.temp }}/hotel-match-current-andromeda-promotion-revalidate-1971-20260913-v1/reservation.json
          retention-days: 90
      - name: Revalidate stored promotion against CURRENT DB
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; op=json.dumps(os.environ['OPERATION_ID'])
          php=r'''<?php
          declare(strict_types=1); $stage='bootstrap';
          function k(string $s):string{$s=mb_strtolower(trim($s),'UTF-8');$s=str_replace('ё','е',$s);$s=preg_replace('/\b(?:ex|hotel|hotels|resort|resorts|spa)\b/u',' ',$s)??$s;$s=preg_replace('/[^\p{L}\p{N}]+/u',' ',$s)??$s;return trim(preg_replace('/\s+/u',' ',$s)??$s);}
          function ts(string $s):array{$o=[];foreach(explode(' ',k($s)) as $t)if($t!=='')$o[$t]=1;return array_keys($o);}
          function qs(array $names):array{$q=array_flip(['annex','beach','garden','gardens','north','south','posh','adult','adults','pool','sea','prestige','aquamarine','aqua','family','club','only','gentleman']);$o=[];foreach($names as $n)foreach(ts((string)$n) as $t)if(isset($q[$t]))$o[$t]=1;$r=array_keys($o);sort($r);return $r;}
          function names(array $a):array{$o=[];foreach($a as $x){$x=trim((string)$x);if($x!=='')$o[$x]=1;}return array_keys($o);}
          function place(array $a,array $b):bool{foreach($a as $x){$x=k((string)$x);if($x==='')continue;foreach($b as $y){$y=k((string)$y);if($y!==''&&($x===$y||str_contains($x,$y)||str_contains($y,$x)))return true;}}return false;}
          try{$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$h=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$h||strpos($h,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper');require_once $h;$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');$stage='load';
          $hot=[];$alias=[];$idx=[];foreach($db->query('SELECT id,country_id,name,normalized_name,region_name,subregion_name,category FROM catalog_hotels WHERE country_id IN (1,2,4,8,9,10,12,16) AND is_active=1')->fetchAll(PDO::FETCH_ASSOC) as $r){$id=(int)$r['id'];$hot[$id]=$r;$alias[$id]=names([$r['name'],$r['normalized_name']]);}
          foreach($db->query('SELECT a.hotel_id,a.alias,a.normalized_alias,h.country_id FROM hotel_aliases a JOIN catalog_hotels h ON h.id=a.hotel_id WHERE h.country_id IN (1,2,4,8,9,10,12,16) AND h.is_active=1')->fetchAll(PDO::FETCH_ASSOC) as $r){$id=(int)$r['hotel_id'];foreach(names([$r['alias'],$r['normalized_alias']]) as $n)$alias[$id][]=$n;}
          foreach($hot as $id=>$r)foreach(array_unique($alias[$id]??[]) as $n){$kk=k($n);if($kk!=='')$idx[(int)$r['country_id']][$kk][$id]=1;}
          $occ=[];foreach($db->query("SELECT external_hotel_id,local_hotel_id FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND decision_status='accepted' AND local_hotel_id IS NOT NULL")->fetchAll(PDO::FETCH_ASSOC) as $r)$occ[(int)$r['local_hotel_id']][(string)$r['external_hotel_id']]=1;
          $obs=[];foreach($db->query("SELECT * FROM andromeda_search_hotel_observations WHERE supplier_namespace='andromeda_catalog' ORDER BY observed_at_utc DESC,external_hotel_id")->fetchAll(PDO::FETCH_ASSOC) as $r){$id=(string)$r['external_hotel_id'];if(!isset($obs[$id]))$obs[$id]=$r;}
          $ids=$db->query("SELECT * FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND decision_status='pending' AND local_hotel_id IS NULL ORDER BY external_hotel_id")->fetchAll(PDO::FETCH_ASSOC);
          $rows=[];$counts=[];$rules=[];$exam=0;$withPromo=0;$stage='review';
          foreach($ids as $r){$did=(string)$r['external_hotel_id'];try{$e=json_decode((string)$r['evidence_json'],true,128,JSON_THROW_ON_ERROR);}catch(Throwable $x){continue;}if(!is_array($e)||!isset($e['promotion'])||!is_array($e['promotion']))continue;$p=$e['promotion'];$withPromo++;$target=isset($p['target'])&&is_scalar($p['target'])&&filter_var($p['target'],FILTER_VALIDATE_INT)!==false?(int)$p['target']:0;if($target<=0)continue;$exam++;$tr=$hot[$target]??null;$status='needs_evidence';$reason=[];$server=($p['server_current']??false)===true;$strict=isset($p['strict_identity'])&&is_array($p['strict_identity']);$guard=isset($p['pair_guard'])&&is_array($p['pair_guard'])?$p['pair_guard']:null;$rule=(string)($p['rule']??'');if($rule!=='')$rules[$rule]=($rules[$rule]??0)+1;
          if(!$tr){$status='inactive_target';$reason[]='inactive_target';}
          else{$country=(int)$tr['country_id'];$pc=isset($p['country_id'])&&is_numeric($p['country_id'])?(int)$p['country_id']:0;$o=$obs[$did]??[];$oc=isset($o['country_id'])&&is_numeric($o['country_id'])?(int)$o['country_id']:0;if(($pc&&$pc!==$country)||($oc&&$oc!==$country)){$status='country_conflict';$reason[]='country_conflict';}
          if(isset($occ[$target])){$status='provider_occupancy_hold';$reason[]='andromeda_target_occupied';}
          $src=$e['source']??[];if(!is_array($src))$src=[];$sn=names([$src['name']??'',$src['lName']??'',$o['hotel_name']??'',...((isset($p['source_names'])&&is_array($p['source_names']))?$p['source_names']:[])]);$tn=array_values(array_unique($alias[$target]??[]));$sk=[];$tk=[];foreach($sn as $n){$kk=k($n);if($kk!=='')$sk[$kk]=1;}foreach($tn as $n){$kk=k($n);if($kk!=='')$tk[$kk]=1;}$exact=array_values(array_intersect(array_keys($sk),array_keys($tk)));$uniqueExact=false;foreach($exact as $kk)if(count($idx[$country][$kk]??[])===1&&isset($idx[$country][$kk][$target])){$uniqueExact=true;break;}
          $st=[];$tt=[];foreach($sn as $n)foreach(ts($n) as $t)$st[$t]=1;foreach($tn as $n)foreach(ts($n) as $t)$tt[$t]=1;$common=count(array_intersect_key($st,$tt));$sq=qs($sn);$tq=qs($tn);$qual=$sq&&$tq&&$sq!==$tq;if($qual){$status='qualifier_conflict';$reason[]='qualifier_conflict';}
          $sourcePlaces=[];if(isset($p['source_places'])&&is_array($p['source_places']))$sourcePlaces=$p['source_places'];foreach(['town','state','townLName','stateLName'] as $z)if(isset($src[$z]))$sourcePlaces[]=$src[$z];$geo=place($sourcePlaces,[(string)$tr['region_name'],(string)$tr['subregion_name']]);$dist=isset($p['distance_m'])&&is_numeric($p['distance_m'])?(float)$p['distance_m']:null;if($dist!==null&&$dist>5000){$status='coordinate_conflict';$reason[]='coordinate_conflict';}
          $guardOk=true;if($guard!==null){if(array_key_exists('anchor_ok',$guard)&&$guard['anchor_ok']!==true)$guardOk=false;if(array_key_exists('critical_ok',$guard)&&$guard['critical_ok']!==true)$guardOk=false;if(($guard['dangerous_swap']??false)===true)$guardOk=false;}if(!$guardOk){$status='pair_guard_hold';$reason[]='pair_guard_hold';}
          $strictCurrent=false;if($strict){$ss=k((string)($p['strict_identity']['source']??''));$stg=k((string)($p['strict_identity']['target']??''));$strictCurrent=($ss===''||isset($sk[$ss]))&&($stg===''||isset($tk[$stg]));if(!$strictCurrent)$reason[]='strict_identity_stale';}
          if(!$reason){if($server&&$uniqueExact)$status='ready_unique_exact';elseif($server&&$strict&&$strictCurrent&&$common>=2&&($geo||($dist!==null&&$dist<=1000)))$status='ready_strict_geo';elseif($server&&$common>=2&&$geo)$status='ready_multitoken_geo';elseif($server&&$strict&&$strictCurrent&&$common>=2)$status='needs_geo_or_independent_evidence';else$status='needs_evidence';}
          $star=null;$sc=$src['star']??null;if($sc!==null&&is_numeric($sc)&&$tr['category']!==null)$star=((int)$sc===(int)$tr['category'])?'same':'different';$counts[$status]=($counts[$status]??0)+1;$rows[]=['andromeda_hotel_id'=>$did,'target_local_id'=>$target,'status'=>$status,'server_current'=>$server,'strict_identity'=>$strict,'strict_current'=>$strictCurrent,'unique_exact_current'=>$uniqueExact,'common_tokens'=>$common,'direct_geo'=>$geo,'saved_distance_m'=>$dist===null?null:(int)round($dist),'qualifier_conflict'=>$qual,'pair_guard_ok'=>$guardOk,'star_signal'=>$star,'rule'=>$rule,'reason_codes'=>$reason,'not_write_authority'=>true];}}
          ksort($counts);ksort($rules);usort($rows,static fn($a,$b)=>strcmp($a['status'],$b['status'])?:strcmp($a['andromeda_hotel_id'],$b['andromeda_hotel_id']));$db->commit();echo json_encode(['schema'=>'hotel-match-current-andromeda-promotion-revalidate/1','status'=>'completed','operation_id'=>__OP__,'pending_identities'=>count($ids),'with_promotion'=>$withPromo,'promotion_targets_examined'=>$exam,'status_counts'=>$counts,'rule_counts'=>$rules,'rows'=>$rows,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'no_replay'=>true],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";
          }catch(Throwable $e){if(isset($db)&&$db instanceof PDO&&$db->inTransaction())$db->rollBack();echo json_encode(['schema'=>'hotel-match-current-andromeda-promotion-revalidate/1','status'=>'diagnostic_failure','operation_id'=>__OP__,'stage'=>$stage,'exception_class'=>get_class($e),'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'no_replay'=>true],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";}
          '''.replace('__OP__',op)
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER');host,user=os.environ[req[1]].strip(),os.environ[req[2]].strip();remote='cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=512M'
          with tempfile.TemporaryDirectory(prefix='match-promotion-v1-',dir=os.environ['RUNNER_TEMP']) as td:
            key=Path(td)/'key';raw=os.environ[req[0]].strip();key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw));key.chmod(0o600);known=Path(td)/'known_hosts';cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-l',user,host,remote];clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')};p=subprocess.run(cmd,input=php,text=True,capture_output=True,timeout=480,env=clean)
          try:v=json.loads(p.stdout) if p.returncode==0 else None
          except Exception:v=None
          if not isinstance(v,dict):raise RuntimeError('no_json')
          data=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(data);receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only_revalidate','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(data).hexdigest(),'application_status':v.get('status'),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True};state.joinpath('receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n');state.joinpath('summary.md').write_text(f"MATCH #1971 CURRENT Andromeda promotion revalidate: pending={v.get('pending_identities')}, promotion_targets={v.get('promotion_targets_examined')}, status={json.dumps(v.get('status_counts') or {},sort_keys=True,separators=(',',':'))}. DB/mapping writes0; supplier/Tourvisor calls0; NO-REPLAY.\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        id: result
        with:
          name: match-current-andromeda-promotion-revalidate-v1-result
          path: ${{ runner.temp }}/hotel-match-current-andromeda-promotion-revalidate-1971-20260913-v1/
          retention-days: 90
      - name: Record result
        if: success()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; printf '\nResult artifact `%s`; reservation artifact `%s` existed before SSH.\n' '${{ steps.result.outputs.artifact-id }}' '${{ steps.reserve.outputs.artifact-id }}' >> "$STATE/summary.md"; gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
