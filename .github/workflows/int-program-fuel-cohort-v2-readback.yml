name: INT read program fuel cohort v2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/int-program-fuel-cohort-v2-readback.yml'
      - 'scripts/diagnostics/int_program_fuel_cohort_v2_readback.php'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  contract:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3419 &&
       github.event.comment.body == '/read-int-program-fuel-cohort-v2-3419')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify read-only contract
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/int_program_fuel_cohort_v2_readback.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/diagnostics/int_program_fuel_cohort_v2_readback.php').read_text()
          for x in ["TARGET_OPERATION='int-andromeda-program-fuel-collect-20260922-v2'",
                    "TARGET_PROGRAM='30'","TARGET_TOUR='34'","priceForOffer",
                    "'supplier_calls'=>0","'database_writes'=>0","'filesystem_writes'=>0"]:
              if x not in p: raise SystemExit('missing:'+x)
          for x in ['curl_','PDO','mysqli','file_put_contents','fwrite(','getFlights(','changeService(','->calc(','bron_ticket']:
              if x in p: raise SystemExit('forbidden:'+x)
          print('PROGRAM_FUEL_COHORT_READONLY_OK')
          PY

  read:
    needs: contract
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 3419 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/read-int-program-fuel-cohort-v2-3419'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - name: Read retained cohort only
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/int-program-fuel-v2"
          install -d -m 700 "$d"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$d/key"; chmod 600 "$d/key"
          ssh-keygen -y -f "$d/key" >/dev/null
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ControlMaster=no \
            -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$d/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR \
            -l "$ANYTOOUR_DEPLOY_USER" "$ANYTOOUR_DEPLOY_HOST" \
            'php -d display_errors=0 -d log_errors=0' \
            < scripts/diagnostics/int_program_fuel_cohort_v2_readback.php > "$d/result.json"
          test -s "$d/result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'int-program-fuel-v2/result.json'
          d=json.loads(p.read_text())
          if d.get('schema_version')!=1 or d.get('source')!='int-program-fuel-cohort-v2-readback':
              raise SystemExit('contract')
          for k in ['supplier_calls','database_reads','database_writes','filesystem_writes']:
              if d.get(k)!=0: raise SystemExit('side_effect:'+k)
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      - name: Preserve sanitized result
        uses: actions/upload-artifact@v4
        with:
          name: int-program-fuel-cohort-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/int-program-fuel-v2/result.json
          if-no-files-found: error
          retention-days: 14
