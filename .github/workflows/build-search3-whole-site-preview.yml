          node tests/search3-selected-geometry-browser.cjs
          node tests/search3-lazy-selected-browser.cjs
          node tests/search3-lean-entry-browser.cjs
          node tests/search3-flight-fallback-browser.cjs
          SEARCH3_KNOWN_HOTEL_OUTPUT="$RUNNER_TEMP/search3-selected-geometry/known-hotel" node tests/search3-known-hotel-browser.cjs

      - name: Verify legacy source results browser tier
        if: steps.results-current.outputs.required == 'true' || steps.results-shortlist.outputs.required == 'true' || steps.results-geometry.outputs.required == 'true'
        shell: bash
        env:
