name: Build Search3 whole-site preview artifact

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'src/search3/**'
      - 'scripts/build/search3_assets.py'
      - 'scripts/build/search3-js/**'
      - 'scripts/build/search3_production_inventory.py'
      - 'scripts/build/search3_public_candidate.py'
      - 'scripts/deploy/search3_production_snapshot.py'
      - 'tests/search3_public_candidate_test.py'
      - 'tests/search3-js-compaction.cjs'
      - 'tests/search3-visual-asset-size.cjs'
      - 'tests/search3-visual-live-browser.cjs'
      - 'tests/search3-visual-large-flight-choices.cjs'
      - 'tests/search3-andromeda-provider.cjs'
      - 'tests/search3-andromeda-provider-config.php'
      - 'tests/search3-css-printing.cjs'
      - 'tests/search3-presentation-scope.test.cjs'
      - 'tests/search3-tourvisor-results-limit.php'
      - 'tests/search3-prototype-inventory-lifecycle.cjs'
      - 'tests/search3-prototype-continuation-coverage.cjs'
      - 'tests/search3-prototype-anex-continuation.cjs'
      - 'tests/search3-prototype-selected-tour-retention.cjs'
      - 'tests/search3-prototype-flight-price.cjs'
      - 'tests/search3-prototype-provider-config-v1.cjs'
      - 'tests/search3-prototype-inventory-browser.py'
      - 'tests/search3-hotel-content-browser.py'
      - 'tests/search3_source_build_test.py'
      - 'v2/**'
      - 'app/integrations/anex-search-mapping-registry.php'
      - 'tests/site-preview-path-smoke.php'
      - 'tests/search-handoff-smoke.php'
      - 'tests/jaz-hotel-page-browser.cjs'
      - 'tests/seo-price-calendar-ui-smoke.php'
      - 'tests/home-search-loading-handoff.cjs'
      - 'tests/search3_production_presentation_test.py'
      - 'tests/search3_site_preview_isolation_test.py'
      - 'tests/search3-selected-return-owner.cjs'
      - 'tests/search3-selected-geometry-browser.cjs'
      - 'tests/search3-lazy-selected-browser.cjs'
      - 'tests/search3-lean-entry-browser.cjs'
      - 'tests/search3-header-geometry-browser.cjs'
      - 'tests/search3-entry-owner-browser.cjs'
      - 'tests/search3-mobile-parameters.cjs'
      - 'tests/search3-entry-geometry-browser.cjs'
      - 'tests/search3-calendar-readability.cjs'
      - 'tests/search3-current-results-browser.cjs'
      - 'tests/search3-hotel-tabs.cjs'
      - 'tests/search3-hotel-tabs-browser.cjs'
      - 'tests/search3-known-hotel-browser.cjs'
      - 'tests/search3-shortlist-browser.cjs'
      - 'scripts/build/search3_site_preview_isolation.py'
      - '.github/workflows/build-search3-whole-site-preview.yml'

permissions:
  contents: read

concurrency:
  group: ci-search3-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_BASE: /_preview/search3-site-candidate

jobs:
  build-preview-artifact:
    # Build once on the working PR; release/docs retain that exact source artifact.
    if: ${{ !github.event.pull_request.draft || github.head_ref != 'release/search3-production-ready-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund

      - name: Verify source identity and focused contracts
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check "$BASE_SHA" "$SOURCE_SHA"
          php tests/site-preview-path-smoke.php production
          php tests/site-preview-path-smoke.php preview
          php tests/search-handoff-smoke.php
          php tests/seo-price-calendar-ui-smoke.php
          php tests/offer-freshness-smoke.php
          node tests/home-search-loading-handoff.cjs
          node tests/search3-hotel-tabs.cjs
          python3 -B scripts/build/search3_assets.py --check
          node scripts/build/search3-js/shared-runtime.cjs --check
          php tests/search3-shared-runtime-smoke.php
          php tests/search3-lean-base-bundle-smoke.php
          node tests/search3-js-compaction.cjs
          node tests/search3-andromeda-provider.cjs
          php tests/search3-andromeda-provider-config.php
          node tests/search3-css-printing.cjs
          node tests/search3-presentation-scope.test.cjs
          node tests/search3-honest-results-controls.cjs
          php tests/search3-tourvisor-results-limit.php
          node tests/search3-prototype-inventory-lifecycle.cjs
          node tests/search3-prototype-continuation-coverage.cjs
          node tests/search3-prototype-anex-continuation.cjs
          node tests/search3-prototype-selected-tour-retention.cjs
          node tests/search3-prototype-flight-price.cjs
          node tests/search3-prototype-provider-application-preview.cjs
          node tests/search3-prototype-provider-config-v1.cjs
          python3 -B tests/search3_source_build_test.py
          python3 -B tests/search3_production_presentation_test.py
          python3 -B tests/search3_public_candidate_test.py
          python3 -B tests/search3_site_preview_isolation_test.py
          echo SEARCH3_SITE_SOURCE_CONTRACTS_OK

      - name: Build exact isolated site payload
        id: build
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/search3-site-release"
          payload="$root/payload"
          control="$root/control"
          test ! -e "$root"
          mkdir -p "$payload" "$control"

          rsync -a \
            --exclude='*.md' \
            --exclude='_preview/' \
            --exclude='api.php' \
            --exclude='api-v2.php' \
            --exclude='lead-adapter.php' \
            --exclude='lead-adapter-v2.php' \
            --exclude='lead-bridge-v1.php' \
            --exclude='lead-receiver-v1.php' \
            --exclude='lead-price-v1.php' \
            --exclude='lead-idempotency-v1.php' \
            v2/ "$payload/"

          # The TOP500 reader uses the unchanged MATCH resolver inside this package.
          mkdir -p "$payload/app/integrations"
          cp app/integrations/anex-search-mapping-registry.php "$payload/app/integrations/"
          cmp app/integrations/anex-search-mapping-registry.php "$payload/app/integrations/anex-search-mapping-registry.php"

          test -f "$payload/index.php"
          test -f "$payload/home-entry-v1.php"
          cp "$payload/index.php" "$payload/search-page-v2.php"
          cp "$payload/home-entry-v1.php" "$payload/index.php"
          python3 -B scripts/build/search3_site_preview_isolation.py "$payload"

          # Compose the guarded canonical entries with the same generated
          # review/family profile as search3_public_candidate.py. Bare SOURCE
          # has no public build; a link-only Home fallback must fail the smoke.
          cp "$payload/visual-search/public-entry-v1.php" "$payload/poisk-turov/index.php"
          cmp "$payload/visual-search/public-entry-v1.php" "$payload/poisk-turov/index.php"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path(os.environ['RUNNER_TEMP']) / 'search3-site-release/payload/visual-search/public-build.json'
          if build.exists() or build.is_symlink():
              raise RuntimeError('Public build profile must be generated, not supplied by SOURCE')
          profile = {'schemaVersion': 1, 'profile': 'review', 'scenario': 'family'}
          build.write_text(json.dumps(profile, separators=(',', ':')) + '\n', encoding='utf-8')
          os.chmod(build, 0o644)
          PY
          node scripts/build/search3-js/visual-entry.cjs "$payload"
          node tests/search3-visual-asset-size.cjs "$payload"

          cat > "$payload/.htaccess" <<'HTACCESS'
          Options -Indexes
          <FilesMatch "\.php$">
            Require all denied
          </FilesMatch>
          <Files "index.php">
            Require all granted
          </Files>
          <Files "bundle-v1.php">
            Require all granted
          </Files>
          <Files "preview-lead-disabled.php">
            Require all granted
          </Files>
          HTACCESS

          test -z "$(find "$payload" -type l -print -quit)"
          test ! -e "$payload/api-v2.php"
          test ! -e "$payload/lead-adapter-v2.php"
          test -f "$payload/preview-lead-disabled.php"
          test -f "$payload/poisk-turov/index.php"
          test -f "$payload/country/index.php"
          test -f "$payload/hot/index.php"
          test -f "$payload/contacts/index.php"
          test -f "$payload/rb/index.php"
          test -f "$payload/how-to-buy/index.php"

          # Independent files can be parsed concurrently; xargs propagates any failure.
          find "$payload" -type f -name '*.php' -print0 | xargs -0 -r -n 1 -P 2 php -l >/dev/null
          find "$payload" -type f -name '*.js' -print0 | xargs -0 -r -n 1 -P 2 node --check >/dev/null

          source_tree="$(git rev-parse "$SOURCE_SHA^{tree}")"
          export SOURCE_TREE="$source_tree"
          file_count="$(find "$payload" -type f | wc -l)"
          (cd "$payload" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$control/payload.sha256"
          payload_manifest_sha="$(sha256sum "$control/payload.sha256" | awk '{print $1}')"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'search3-site-release'
          payload = root / 'payload'
          files = []
          for path in sorted(p for p in payload.rglob('*') if p.is_file()):
              rel = path.relative_to(payload).as_posix()
              data = path.read_bytes()
              files.append({'path': rel, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)})
          manifest = {
              'schema_version': 1,
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree_sha': os.environ['SOURCE_TREE'],
              'target': 'search3-whole-site-preview',
              'route': '/_preview/search3-site-candidate/',
              'file_count': len(files),
              'invariants': {
                  'production_api_path': '/api-v2.php',
                  'production_lead_delivery': False,
                  'preview_lead_path': '/_preview/search3-site-candidate/preview-lead-disabled.php',
                  'production_metrika_changes': False,
                  'preview_metrika_counter': 0,
                  'production_document_root_bootstrap': False,
                  'external_consultant_widget': False,
              },
              'files': files,
          }
          (root / 'control' / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          manifest_sha="$(sha256sum "$control/manifest.json" | awk '{print $1}')"
          archive="$RUNNER_TEMP/search3-whole-site-preview.tar.gz"
          tar -C "$root" -czf "$archive" control payload
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$archive_sha" "$(basename "$archive")" > "$RUNNER_TEMP/search3-whole-site-preview.tar.gz.sha256"
          printf '%s\n' \
            "source_sha=$SOURCE_SHA" \
            "source_tree_sha=$source_tree" \
            "file_count=$file_count" \
            "manifest_sha256=$manifest_sha" \
            "payload_checksums_sha256=$payload_manifest_sha" \
            "archive_sha256=$archive_sha" > "$RUNNER_TEMP/search3-site-release.txt"
          cat "$RUNNER_TEMP/search3-site-release.txt"
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"
          echo "SEARCH3_SITE_ARTIFACT_BUILT source=$SOURCE_SHA files=$file_count archive=$archive_sha"

      - name: Smoke canonical Home and Search3 under exact preview prefix
        shell: bash
        run: |
          set -euo pipefail
          docroot="$RUNNER_TEMP/search3-site-docroot"
          target="$docroot$PREVIEW_BASE"
          mkdir -p "$(dirname "$target")"
          cp -a "$RUNNER_TEMP/search3-site-release/payload" "$target"
          # Poison production-like bootstraps: HTTP smoke must never execute them.
          mkdir -p "$docroot/bitrix/modules/main/include"
          printf '%s\n' '<?php throw new RuntimeException("PRODUCTION_SITE_CONF_EXECUTED");' > "$docroot/site_conf.php"
          printf '%s\n' '<?php throw new RuntimeException("PRODUCTION_PROLOG_EXECUTED");' > "$docroot/bitrix/modules/main/include/prolog_before.php"
          printf '%s\n' '<?php define("METRIKA_COUNTER_ID",987654321);' > "$target/config.php"
          php -S 127.0.0.1:8098 -t "$docroot" >"$RUNNER_TEMP/search3-site-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS -H 'Host: anytoour.ru' "http://127.0.0.1:8098$PREVIEW_BASE/" -o /dev/null && break; sleep 0.25; done
          for path in / /poisk-turov/ /poisk-turov-old/ /country/ /country/turkey/ /hot/ /contacts/ /rb/ /how-to-buy/; do
            out="$RUNNER_TEMP/site-$(echo "$path" | tr '/-' '__').html"
            code="$(curl -sS -H 'Host: anytoour.ru' -o "$out" -w '%{http_code}' "http://127.0.0.1:8098$PREVIEW_BASE$path")"
            if test "$code" != 200; then
              echo "SEARCH3_PREVIEW_HTTP_FAILURE path=$path status=$code" >&2
              tail -n 40 "$RUNNER_TEMP/search3-site-php.log" >&2
              exit 1
            fi
            if test "$path" = /poisk-turov/; then
              grep -Fq '<meta name="robots" content="noindex, nofollow, noarchive">' "$out"
            else
              grep -Fq '<meta name="robots" content="noindex,follow,max-image-preview:large' "$out"
            fi
            if grep -Eo 'href="/[^"]*"' "$out" | grep -Ev "^href=\"$PREVIEW_BASE/|^href=\"/images/|^href=\"/favicon"; then
              echo "SEARCH3_PREVIEW_LINK_ESCAPE path=$path" >&2
              exit 1
            fi
            echo "SEARCH3_PREVIEW_ROUTE_OK path=$path"
          done
          python3 - <<'PY'
          import json
          import os
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class Document(HTMLParser):
              def __init__(self, html):
                  super().__init__()
                  self.tags = []
                  self.feed(html)
              def handle_starttag(self, tag, attrs):
                  self.tags.append((tag, dict(attrs)))
              def nodes(self, tag):
                  return [attrs for name, attrs in self.tags if name == tag]

          root = Path(os.environ['RUNNER_TEMP'])
          prefix = os.environ['PREVIEW_BASE']
          home = (root / 'site-_.html').read_text(encoding='utf-8')
          search = (root / 'site-_poisk_turov_.html').read_text(encoding='utf-8')
          expected = {'schemaVersion': 1, 'profile': 'review', 'scenario': 'family',
              'publicBase': prefix + '/poisk-turov/', 'resourceBase': prefix + '/visual-search/',
              'api': '/api-v2.php', 'leadApi': '/_preview/search3-next-candidate/preview-lead-disabled.php',
              'anexApi': None, 'metrikaCounter': 0}
          graphs = []
          forms = []
          for html, entry in [(home, 'home'), (search, 'search')]:
              doc = Document(html)
              configs = [json.loads(a['data-search3-public-config']) for a in doc.nodes('script')
                         if 'data-search3-public-config' in a]
              assert configs == [dict(expected, entry='home') if entry == 'home' else expected], entry + ': trusted review config'
              assert len(doc.nodes('form')) == 1 and doc.nodes('form')[0].get('id') == 'search-form', entry + ': one shared form'
              assert len(doc.nodes('header')) == len(doc.nodes('footer')) == 1, entry + ': one shell'
              assert len([a for a in doc.nodes('dialog') if a.get('id') == 'modal']) == 1, entry + ': one picker'
              assert 'home-search-link' not in html and 'id="tourSearch"' not in html, entry + ': no fallback or legacy form'
              assert 'web-consultant/widget.js' not in html, entry + ': isolated consultant'
              graph = [a['src'] for a in doc.nodes('script') if 'src' in a]
              assert len(graph) == len(set(graph)) and all('defer' in a for a in doc.nodes('script') if 'src' in a)
              assert all(re.fullmatch(re.escape(prefix) + r'/[\w./-]+\.js\?v=[a-f0-9]{12}', src) for src in graph)
              assert not any('analytics' in src or 'live-bridge' in src for src in graph), entry + ': no live graph'
              names = [src.removeprefix(prefix + '/').split('?')[0] for src in graph]
              assert names[0] == 'visual-search/public-config-v1.js' and names[-3:] == [
                  'visual-search/public-url-v1.js', 'visual-search/public-bootstrap-v1.js', 'visual-search/app.js']
              assert len([a for a in doc.nodes('link') if '/site-header-v2.css?' in a.get('href', '')]) == 1
              graphs.append(graph)
              forms.append(re.search(r'<form\b[^>]*\bid="search-form"[^>]*>.*?</form>', html, re.S).group())
          assert graphs[0] == graphs[1], 'Home and receiving route share the entire ordered graph'
          budget = r'<details class="home-search-more"><summary>Дополнительные параметры</summary>(.*?)</details>'
          assert re.sub(budget, r'\1', forms[0], count=1, flags=re.S) == forms[1], 'one canonical form owner'
          assert re.search(budget, forms[0], re.S) and 'id="quick-budget"' in re.search(budget, forms[0], re.S).group(1)
          assert all('id="' + name + '"' in forms[0] for name in ['quick-stars', 'quick-meal'])
          assert home.index('<section class="home-hero"') < home.index(forms[0]) < home.index('<section class="home-section')
          assert '<div hidden inert data-home-search-support>' in home
          print('SEARCH3_SITE_CANONICAL_REVIEW_COMPOSITION_OK (HTTP/source render; native LIVE browser gate is separate)')
          PY
          grep -Fq 'id="tourSearch"' "$RUNNER_TEMP/site-_poisk_turov_old_.html"
          grep -Fq 'api:"/api-v2.php"' "$RUNNER_TEMP/site-_poisk_turov_old_.html"
          grep -Fq 'metrikaCounter:0' "$RUNNER_TEMP/site-_poisk_turov_old_.html"
          grep -Fq "leadApi:\"$PREVIEW_BASE/preview-lead-disabled.php\"" "$RUNNER_TEMP/site-_poisk_turov_old_.html"
          if grep -Fq 'web-consultant/widget.js' "$RUNNER_TEMP/site-_poisk_turov_old_.html"; then exit 1; fi
          if grep -Fq '<body class="search3-candidate">' "$RUNNER_TEMP/site-_poisk_turov_old_.html"; then exit 1; fi
          lead_code="$(curl -sS -H 'Host: anytoour.ru' -o "$RUNNER_TEMP/lead.json" -w '%{http_code}' -H 'Content-Type: application/json' --data '{"synthetic":true}' "http://127.0.0.1:8098$PREVIEW_BASE/preview-lead-disabled.php")"
          test "$lead_code" = 403
          grep -Fq PREVIEW_LEAD_DISABLED "$RUNNER_TEMP/lead.json"

          # Exercise failure only in the disposable HTTP copy, never the payload.
          build="$target/visual-search/public-build.json"
          mv "$build" "$build.saved"
          trap 'mv "$build.saved" "$build"; kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for path in / /poisk-turov/; do
            code="$(curl -sS -H 'Host: anytoour.ru' -o "$RUNNER_TEMP/site-missing-build.html" -w '%{http_code}' "http://127.0.0.1:8098$PREVIEW_BASE$path")"
            test "$code" = 503
            if grep -Fq 'id="search-form"' "$RUNNER_TEMP/site-missing-build.html"; then exit 1; fi
          done
          mv "$build.saved" "$build"
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          cmp "$build" "$RUNNER_TEMP/search3-site-release/payload/visual-search/public-build.json"
          kill "$php_pid" >/dev/null 2>&1 || true
          trap - EXIT
          echo SEARCH3_SITE_LOCAL_PREVIEW_SMOKE_OK

      - name: Prepare separate legacy source fixture for existing browser contracts
        shell: bash
        run: |
          set -euo pipefail
          # These contracts exercise the maintained legacy form (#tourSearch).
          # Keep their original assertions and route in a separate test docroot;
          # this fixture is never archived or uploaded as the canonical artifact.
          docroot="$RUNNER_TEMP/search3-site-legacy-test-docroot"
          target="$docroot$PREVIEW_BASE"
          test ! -e "$docroot"
          cp -a "$RUNNER_TEMP/search3-site-docroot" "$docroot"
          # The retired HOME range owner is preserved only in this test copy.
          # Exact historical PHP includes its original controller; restore its CSS too.
          legacy_home=63c3447f76b19dae1c33647da86c5188e20c0d87
          git show "$legacy_home:v2/home-v1.php" > "$target/home-v1.php"
          git show "$legacy_home:v2/home-v1.css" > "$target/home-v1.css"
          test "$(git hash-object "$target/home-v1.php")" = bad2d485ea20b92f49c59346748e643b97876011
          test "$(git hash-object "$target/home-v1.css")" = 8cee98c9df9027dc1ce7660adb44c4acfa520e65
          php -l "$target/home-v1.php"
          cmp "$RUNNER_TEMP/search3-site-docroot$PREVIEW_BASE/home-v1.php" "$RUNNER_TEMP/search3-site-release/payload/home-v1.php"
          cmp "$RUNNER_TEMP/search3-site-docroot$PREVIEW_BASE/home-v1.css" "$RUNNER_TEMP/search3-site-release/payload/home-v1.css"
          cp v2/poisk-turov/index.php "$target/poisk-turov/index.php"
          cmp v2/poisk-turov/index.php "$target/poisk-turov/index.php"
          php -S 127.0.0.1:8098 -t "$docroot" >"$RUNNER_TEMP/search3-site-legacy-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS -H 'Host: anytoour.ru' "http://127.0.0.1:8098$PREVIEW_BASE/poisk-turov/" -o /dev/null && break; sleep 0.25; done
          page="$RUNNER_TEMP/site-legacy-test-search.html"
          curl -fsS -H 'Host: anytoour.ru' "http://127.0.0.1:8098$PREVIEW_BASE/poisk-turov/" -o "$page"
          grep -Fq 'id="tourSearch"' "$page"
          grep -Fq 'api:"/api-v2.php"' "$page"
          grep -Fq 'metrikaCounter:0' "$page"
          grep -Fq "leadApi:\"$PREVIEW_BASE/preview-lead-disabled.php\"" "$page"
          if grep -Fq 'web-consultant/widget.js' "$page"; then exit 1; fi
          if grep -Fq 'data-search3-public-config=' "$page"; then exit 1; fi
          cmp "$RUNNER_TEMP/search3-site-release/payload/visual-search/public-entry-v1.php" "$RUNNER_TEMP/search3-site-release/payload/poisk-turov/index.php"
          home="$RUNNER_TEMP/site-legacy-test-home.html"
          curl -fsS -H 'Host: anytoour.ru' "http://127.0.0.1:8098$PREVIEW_BASE/" -o "$home"
          grep -Fq 'data-home-search data-countries-busy="true"' "$home"
          grep -Fq 'data-home-range-feedback' "$home"
          if grep -Fq 'id="search-form"' "$home"; then exit 1; fi
          echo SEARCH3_LEGACY_TEST_FIXTURE_OK

      - name: Detect prototype inventory changes
        id: prototype-inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
