          fi
          if [ "${{ steps.results-shortlist.outputs.required }}" = "true" ] || { [ "${{ steps.results-geometry.outputs.required }}" = "true" ] && [ "${{ steps.presentation-scope.outputs.card-only }}" != "true" ]; }; then
