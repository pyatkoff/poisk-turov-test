          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- docs/project/search3-half-size-reset.json; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect selected-tour geometry changes
        id: selected-geometry
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ steps.half-size-reset.outputs.active }}" != "true" ] && ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- v2/bundle-manifest-v1.php v2/assets.php v2/hotel-autocomplete-v1.js v2/hotel-autocomplete-v1.css tests/search3-known-hotel-browser.cjs tests/search3-lean-entry-browser.cjs src/search3/behavior/selected-flow-v2.js src/search3/behavior/selected-runtime.js tests/search3-lazy-selected-browser.cjs src/search3/styles/selected-tour.css src/search3/styles/tour-detail.css src/search3/styles/review-layout.css src/search3/styles/lead-state.css src/search3/styles/booking-summary.css src/search3/styles/selected-flow-v2.css src/search3/styles/final-sections.css tests/search3-selected-geometry-browser.cjs; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect current-results decision contract changes
        id: results-current
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ steps.half-size-reset.outputs.active }}" != "true" ] && ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- src/search3/manifest.json src/search3/behavior/results/local-hotel-filter.js src/search3/behavior/results/toolbar.js src/search3/behavior/summary-cta.js tests/search3-current-results-browser.cjs; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect shortlist contract changes
        id: results-shortlist
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ steps.half-size-reset.outputs.active }}" != "true" ] && ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- src/search3/manifest.json src/search3/behavior/results/shortlist.js tests/search3-shortlist-browser.cjs; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect results-card or entry-form geometry changes
        id: results-geometry
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ steps.half-size-reset.outputs.active }}" != "true" ] && ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- v2/results-renderer-v5.js src/search3/styles/results-layout.css src/search3/styles/results-cards-v2.css src/search3/styles/results-mobile-layout.css src/search3/styles/results-tablet-layout.css src/search3/styles/acceptance-guards.css src/search3/styles/entry-v1.css src/search3/styles/entry-native-controls.css tests/search3-results-geometry-browser.cjs tests/search3-entry-geometry-browser.cjs tests/search3-header-geometry-browser.cjs; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

          if ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- src/search3/styles/entry-native-controls.css tests/search3-entry-geometry-browser.cjs; then
            echo "native-date=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- v2/search-lifecycle-v6.js v2/results-renderer-v5.js tests/search3-hotel-tabs.cjs tests/search3-hotel-tabs-browser.cjs; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "hotel-tabs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect entry behavior owner changes
        id: entry-owner
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- v2/index.php src/search3/behavior/search-form.js src/search3/behavior/search-form src/search3/behavior/search-parameters.js tests/search3-entry-owner-browser.cjs tests/search3-mobile-parameters.cjs v2/current-price-calendar-v1.css v2/current-price-calendar-v1.js tests/search3-calendar-readability.cjs; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect JAZ hotel page changes
        id: jaz-hotel-page
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$BASE_SHA" "$SOURCE_SHA" -- v2/jaz-makadi-saraya tests/jaz-hotel-page-browser.cjs .github/workflows/build-search3-whole-site-preview.yml; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser geometry tooling (canonical HOME is mandatory)
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/search3-geometry-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-geometry-tools/node_modules/.bin/playwright" install --with-deps chromium
          if [ "${{ steps.results-geometry.outputs.native-date }}" = "true" ] || [ "${{ steps.results-geometry.outputs.hotel-tabs }}" = "true" ]; then
            "$RUNNER_TEMP/search3-geometry-tools/node_modules/.bin/playwright" install --with-deps webkit
          fi

      - name: Verify compiled canonical HOME readiness and actual Search3 handoff
        shell: bash
        env:
          SEARCH3_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SEARCH3_VISUAL_BASE: http://127.0.0.1:8098/_preview/search3-site-candidate
          SEARCH3_ENTRY_OWNER_OUTPUT: ${{ runner.temp }}/search3-canonical-home
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/search3-geometry-tools/node_modules"
          php -S 127.0.0.1:8098 -t "$RUNNER_TEMP/search3-site-docroot" >"$RUNNER_TEMP/search3-canonical-home-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS "$SEARCH3_VISUAL_BASE/" -o /dev/null && break; sleep 0.25; done
          node tests/search3-entry-owner-browser.cjs --canonical-home

      - name: Retain canonical HOME browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search3-canonical-home-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/search3-canonical-home/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify JAZ hotel page and legacy source search handoff
        if: steps.jaz-hotel-page.outputs.required == 'true'
