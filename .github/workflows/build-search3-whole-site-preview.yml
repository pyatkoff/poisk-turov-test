        env:
          SEARCH3_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SEARCH3_VISUAL_BASE: http://127.0.0.1:8098/_preview/search3-site-candidate
          JAZ_HOTEL_OUTPUT: ${{ runner.temp }}/jaz-hotel-page
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/search3-geometry-tools/node_modules"
          mkdir -p "$JAZ_HOTEL_OUTPUT"
          # Reuse the accepted hotel photograph and original AnyTour artwork only.
          curl -fsSL --max-time 30 'https://static.tourvisor.ru/hotel_pics/verybig/1/iberotel-makadi-saraya-resort-19573305.jpg' -o "$JAZ_HOTEL_OUTPUT/jaz-real-photo.jpg"
          curl -fsSL --max-time 30 'https://anytoour.ru/images/logo.svg' -o "$JAZ_HOTEL_OUTPUT/anytour-logo.svg"
          grep -qi '<svg' "$JAZ_HOTEL_OUTPUT/anytour-logo.svg"
          cat > "$RUNNER_TEMP/jaz-hotel-router.php" <<'PHP'
          <?php
          $prefix = '/_preview/search3-site-candidate/';
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if (!in_array($path, [$prefix . 'jaz-makadi-saraya/', $prefix . 'poisk-turov/'], true)) return false;
          $_SERVER['HTTP_HOST'] = 'anytoour.ru';
          $_SERVER['SCRIPT_NAME'] = $path . 'index.php';
          require $_SERVER['DOCUMENT_ROOT'] . $_SERVER['SCRIPT_NAME'];
          PHP
          php -S 127.0.0.1:8098 -t "$RUNNER_TEMP/search3-site-legacy-test-docroot" "$RUNNER_TEMP/jaz-hotel-router.php" >"$JAZ_HOTEL_OUTPUT/php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS "$SEARCH3_VISUAL_BASE/jaz-makadi-saraya/" -o /dev/null && break; sleep 0.25; done
          node --check tests/jaz-hotel-page-browser.cjs
          node tests/jaz-hotel-page-browser.cjs

      - name: Verify legacy source half-size reset core journey
        if: steps.half-size-reset.outputs.active == 'true'
        shell: bash
        env:
          SEARCH3_VISUAL_BASE: http://127.0.0.1:8098/_preview/search3-site-candidate
          SEARCH3_RESET_OUTPUT: ${{ runner.temp }}/search3-half-size-reset
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/search3-geometry-tools/node_modules"
          cat > "$RUNNER_TEMP/search3-reset-router.php" <<'PHP'
          <?php
          $entry = '/_preview/search3-site-candidate/poisk-turov/';
          if (parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH) !== $entry) return false;
          $_SERVER['HTTP_HOST'] = 'anytoour.ru';
          $_SERVER['SCRIPT_NAME'] = $entry . 'index.php';
          require $_SERVER['DOCUMENT_ROOT'] . $_SERVER['SCRIPT_NAME'];
          PHP
          php -S 127.0.0.1:8098 -t "$RUNNER_TEMP/search3-site-legacy-test-docroot" "$RUNNER_TEMP/search3-reset-router.php" >"$RUNNER_TEMP/search3-reset-php.log" 2>&1 &
