name: Build Search3 whole-site preview artifact

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'tests/site-preview-path-smoke.php'
      - 'tests/search-handoff-smoke.php'
      - 'tests/search3_production_presentation_test.py'
      - 'tests/search3_site_preview_isolation_test.py'
      - 'scripts/build/search3_site_preview_isolation.py'
      - '.github/workflows/build-search3-whole-site-preview.yml'

permissions:
  contents: read

env:
  PREVIEW_BASE: /_preview/search3-site-candidate

jobs:
  build-preview-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and focused contracts
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          php tests/site-preview-path-smoke.php production
          php tests/site-preview-path-smoke.php preview
          php tests/search-handoff-smoke.php
          python3 -B tests/search3_production_presentation_test.py
          python3 -B tests/search3_site_preview_isolation_test.py
          echo SEARCH3_SITE_SOURCE_CONTRACTS_OK

      - name: Build exact isolated site payload
        id: build
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/search3-site-release"
          payload="$root/payload"
          control="$root/control"
          test ! -e "$root"
          mkdir -p "$payload" "$control"

          rsync -a \
            --exclude='*.md' \
            --exclude='_preview/' \
            --exclude='api.php' \
            --exclude='api-v2.php' \
            --exclude='lead-adapter.php' \
            --exclude='lead-adapter-v2.php' \
            --exclude='lead-bridge-v1.php' \
            --exclude='lead-receiver-v1.php' \
            --exclude='lead-price-v1.php' \
            --exclude='lead-idempotency-v1.php' \
            v2/ "$payload/"

          test -f "$payload/index.php"
          test -f "$payload/home-entry-v1.php"
          cp "$payload/index.php" "$payload/search-page-v2.php"
          cp "$payload/home-entry-v1.php" "$payload/index.php"
          python3 -B scripts/build/search3_site_preview_isolation.py "$payload"

          cat > "$payload/.htaccess" <<'HTACCESS'
          Options -Indexes
          <FilesMatch "\.php$">
            Require all denied
          </FilesMatch>
          <Files "index.php">
            Require all granted
          </Files>
          <Files "bundle-v1.php">
            Require all granted
          </Files>
          <Files "preview-lead-disabled.php">
            Require all granted
          </Files>
          HTACCESS

          test -z "$(find "$payload" -type l -print -quit)"
          test ! -e "$payload/api-v2.php"
          test ! -e "$payload/lead-adapter-v2.php"
          test -f "$payload/preview-lead-disabled.php"
          test -f "$payload/poisk-turov/index.php"
          test -f "$payload/country/index.php"
          test -f "$payload/hot/index.php"
          test -f "$payload/contacts/index.php"
          test -f "$payload/rb/index.php"
          test -f "$payload/how-to-buy/index.php"

          while IFS= read -r file; do php -l "$file" >/dev/null; done < <(find "$payload" -type f -name '*.php' -print | LC_ALL=C sort)
          while IFS= read -r file; do node --check "$file" >/dev/null; done < <(find "$payload" -type f -name '*.js' -print | LC_ALL=C sort)

          source_tree="$(git rev-parse "$SOURCE_SHA^{tree}")"
          export SOURCE_TREE="$source_tree"
          file_count="$(find "$payload" -type f | wc -l)"
          (cd "$payload" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$control/payload.sha256"
          payload_manifest_sha="$(sha256sum "$control/payload.sha256" | awk '{print $1}')"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'search3-site-release'
          payload = root / 'payload'
          files = []
          for path in sorted(p for p in payload.rglob('*') if p.is_file()):
              rel = path.relative_to(payload).as_posix()
              data = path.read_bytes()
              files.append({'path': rel, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)})
          manifest = {
              'schema_version': 1,
              'source_sha': os.environ['SOURCE_SHA'],
              'source_tree_sha': os.environ['SOURCE_TREE'],
              'target': 'search3-whole-site-preview',
              'route': '/_preview/search3-site-candidate/',
              'file_count': len(files),
              'invariants': {
                  'production_api_path': '/api-v2.php',
                  'production_lead_delivery': False,
                  'preview_lead_path': '/_preview/search3-site-candidate/preview-lead-disabled.php',
                  'production_metrika_changes': False,
                  'preview_metrika_counter': 0,
                  'production_document_root_bootstrap': False,
                  'external_consultant_widget': False,
              },
              'files': files,
          }
          (root / 'control' / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          manifest_sha="$(sha256sum "$control/manifest.json" | awk '{print $1}')"
          archive="$RUNNER_TEMP/search3-whole-site-preview.tar.gz"
          tar -C "$root" -czf "$archive" control payload
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s  %s\n' "$archive_sha" "$(basename "$archive")" > "$RUNNER_TEMP/search3-whole-site-preview.tar.gz.sha256"
          printf '%s\n' \
            "source_sha=$SOURCE_SHA" \
            "source_tree_sha=$source_tree" \
            "file_count=$file_count" \
            "manifest_sha256=$manifest_sha" \
            "payload_checksums_sha256=$payload_manifest_sha" \
            "archive_sha256=$archive_sha" > "$RUNNER_TEMP/search3-site-release.txt"
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"
          echo "SEARCH3_SITE_ARTIFACT_BUILT source=$SOURCE_SHA files=$file_count archive=$archive_sha"

      - name: Smoke transformed site under exact preview prefix
        shell: bash
        run: |
          set -euo pipefail
          docroot="$RUNNER_TEMP/search3-site-docroot"
          target="$docroot$PREVIEW_BASE"
          mkdir -p "$(dirname "$target")"
          cp -a "$RUNNER_TEMP/search3-site-release/payload" "$target"
          # Poison production-like bootstraps: HTTP smoke must never execute them.
          mkdir -p "$docroot/bitrix/modules/main/include"
          printf '%s\n' '<?php throw new RuntimeException("PRODUCTION_SITE_CONF_EXECUTED");' > "$docroot/site_conf.php"
          printf '%s\n' '<?php throw new RuntimeException("PRODUCTION_PROLOG_EXECUTED");' > "$docroot/bitrix/modules/main/include/prolog_before.php"
          printf '%s\n' '<?php define("METRIKA_COUNTER_ID",987654321);' > "$target/config.php"
          php -S 127.0.0.1:8098 -t "$docroot" >"$RUNNER_TEMP/search3-site-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS -H 'Host: anytoour.ru' "http://127.0.0.1:8098$PREVIEW_BASE/" -o /dev/null && break; sleep 0.25; done
          for path in / /poisk-turov/ /poisk-turov-old/ /country/ /country/turkey/ /hot/ /contacts/ /rb/ /how-to-buy/; do
            out="$RUNNER_TEMP/site-$(echo "$path" | tr '/-' '__').html"
            code="$(curl -sS -H 'Host: anytoour.ru' -o "$out" -w '%{http_code}' "http://127.0.0.1:8098$PREVIEW_BASE$path")"
            test "$code" = 200
            grep -Fq '<meta name="robots" content="noindex,follow,max-image-preview:large' "$out"
            if grep -Eo 'href="/[^"]*"' "$out" | grep -Ev "^href=\"$PREVIEW_BASE/|^href=\"/images/|^href=\"/favicon"; then
              echo "SEARCH3_PREVIEW_LINK_ESCAPE path=$path" >&2
              exit 1
            fi
          done
          grep -Fq "action=\"$PREVIEW_BASE/poisk-turov/\"" "$RUNNER_TEMP/site-_.html"
          grep -Fq 'api:"/api-v2.php"' "$RUNNER_TEMP/site-_poisk_turov_.html"
          grep -Fq "leadApi:\"$PREVIEW_BASE/preview-lead-disabled.php\"" "$RUNNER_TEMP/site-_poisk_turov_.html"
          for page in "$RUNNER_TEMP/site-_poisk_turov_.html" "$RUNNER_TEMP/site-_poisk_turov_old_.html"; do
            grep -Fq 'id="searchForm"' "$page"
            grep -Fq 'metrikaCounter:0' "$page"
            grep -Fq "leadApi:\"$PREVIEW_BASE/preview-lead-disabled.php\"" "$page"
            if grep -Fq 'web-consultant/widget.js' "$page"; then exit 1; fi
          done
          if grep -Fq '<body class="search3-candidate">' "$RUNNER_TEMP/site-_poisk_turov_old_.html"; then exit 1; fi
          lead_code="$(curl -sS -H 'Host: anytoour.ru' -o "$RUNNER_TEMP/lead.json" -w '%{http_code}' -H 'Content-Type: application/json' --data '{"synthetic":true}' "http://127.0.0.1:8098$PREVIEW_BASE/preview-lead-disabled.php")"
          test "$lead_code" = 403
          grep -Fq PREVIEW_LEAD_DISABLED "$RUNNER_TEMP/lead.json"
          kill "$php_pid" >/dev/null 2>&1 || true
          trap - EXIT
          echo SEARCH3_SITE_LOCAL_PREVIEW_SMOKE_OK

      - name: Upload exact whole-site artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search3-site-preview-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/search3-whole-site-preview.tar.gz
            ${{ runner.temp }}/search3-whole-site-preview.tar.gz.sha256
            ${{ runner.temp }}/search3-site-release.txt
            ${{ runner.temp }}/search3-site-release/control/manifest.json
            ${{ runner.temp }}/search3-site-release/control/payload.sha256
          if-no-files-found: error
          retention-days: 30
