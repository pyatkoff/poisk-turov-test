          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS "$SEARCH3_VISUAL_BASE/poisk-turov/" -o /dev/null && break; sleep 0.25; done
          node tests/search3-entry-owner-browser.cjs

      - name: Verify legacy source selected-tour retirement geometry only
        if: steps.selected-geometry.outputs.required == 'true'
        shell: bash
        env:
          SEARCH3_GEOMETRY_BASE: 108cbcc698ee59813e1ff36403645e4bfcf626d5 # checked release immediately before progressive lead entry
          SEARCH3_RUNTIME_BASE: 108cbcc698ee59813e1ff36403645e4bfcf626d5 # exact pre-change route closure for protected-content comparison
          SEARCH3_ENTRY_BASE: 108cbcc698ee59813e1ff36403645e4bfcf626d5 # exact pre-change entry lifecycle with persistent OTA form
          SEARCH3_VISUAL_BASE: http://127.0.0.1:8098/_preview/search3-site-candidate
          SEARCH3_GEOMETRY_OUTPUT: ${{ runner.temp }}/search3-selected-geometry
        run: |
