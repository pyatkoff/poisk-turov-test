        run: node scripts/build/search3-js/presentation-scope.cjs "$BASE_SHA" "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Detect owner-authorized half-size reset
        id: half-size-reset
        shell: bash
