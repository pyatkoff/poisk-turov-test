name: Andromeda typed transport offline
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-network-transport-failure.php'
      - 'app/integrations/andromeda-package-retry-policy.php'
      - 'app/integrations/andromeda-transport.php'
      - 'tests/andromeda-typed-transport-smoke.php'
      - '.github/workflows/andromeda-typed-transport-check.yml'
permissions:
  contents: read
jobs:
  typed-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify typed transfer boundary without network
        run: |
          php -l app/integrations/andromeda-network-transport-failure.php
          php -l app/integrations/andromeda-package-retry-policy.php
          php -l app/integrations/andromeda-transport.php
          php -l tests/andromeda-typed-transport-smoke.php
          php -d allow_url_fopen=0 -d disable_functions=curl_exec tests/andromeda-typed-transport-smoke.php
