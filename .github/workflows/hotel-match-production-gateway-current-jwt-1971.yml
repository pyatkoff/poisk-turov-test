name: MATCH production gateway current JWT #1971
on:
  push:
    branches: ['feat/match-current-bulk-review-20260911']
    paths: ['.github/workflows/hotel-match-production-gateway-current-jwt-1971.yml']
permissions: {contents: read}
env:
  OPERATION_ID: hotel-match-production-gateway-current-jwt-operator13-egypt-sweep-1971-20260912-v5
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reserve
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access','criteria':{'departureId':1,'countryId':1,'dates':['2026-10-17','2026-10-18','2026-10-19','2026-10-20','2026-10-21','2026-10-22'],'nightsFrom':7,'nightsTo':7,'adults':2,'currency':'RUB','operatorIds':[13]},'credential':'production_gateway_current_TOURVISOR_JWT','database_writes':0,'mapping_writes':0,'lead_calls':0,'booking_calls':0,'no_replay':True},sort_keys=True,indent=2)+'\n')
          PY
      - name: Sweep six dates and union Tourvisor hotels
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/$OPERATION_ID"
          base='https://anytoour.ru/api-v2.php'
          export STATE="$state"
          : > "$state/searches.ndjson"
          for date in 2026-10-17 2026-10-18 2026-10-19 2026-10-20 2026-10-21 2026-10-22; do
            start="$base?action=search_start&departureId=1&countryId=1&dateFrom=$date&dateTo=$date&nightsFrom=7&nightsTo=7&adults=2&currency=RUB&onlyCharter=false&onlyDirect=false&operatorIds=13"
            code=$(curl -sS -o "$state/start-$date.json" -w '%{http_code}' --connect-timeout 15 --max-time 70 "$start")
            if [ "$code" != 200 ]; then
              printf '{"date":"%s","http_status":%s,"status":"start_failed"}\n' "$date" "$code" >> "$state/searches.ndjson"
              sleep 2
              continue
            fi
            search_id=$(python3 - "$state/start-$date.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); print(int(d.get('searchId') or d.get('id') or 0))
          PY
            )
            if [ "$search_id" -le 0 ]; then
              printf '{"date":"%s","http_status":200,"status":"missing_search_id"}\n' "$date" >> "$state/searches.ndjson"
              sleep 2
              continue
            fi
            complete=0
            for i in $(seq 1 18); do
              curl -sS --connect-timeout 15 --max-time 50 "$base?action=search_status&searchId=$search_id" -o "$state/status-$date-$i.json"
              if python3 - "$state/status-$date-$i.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); s=str(d.get('status','')).lower(); p=int(d.get('progress') or 0)
          raise SystemExit(0 if p>=100 or s in {'complete','completed','done','ready'} else 1)
          PY
              then complete=1; break; fi
              curl -sS --connect-timeout 15 --max-time 50 "$base?action=search_continue&searchId=$search_id" -o "$state/continue-$date-$i.json" || true
              sleep 1
            done
            if [ "$complete" != 1 ]; then
              printf '{"date":"%s","searchId":%s,"status":"not_complete"}\n' "$date" "$search_id" >> "$state/searches.ndjson"
              sleep 2
              continue
            fi
            curl -sS --connect-timeout 15 --max-time 70 "$base?action=search_results&searchId=$search_id&limit=10000" -o "$state/results-$date.json"
            python3 - "$date" "$search_id" "$state/results-$date.json" >> "$state/searches.ndjson" <<'PY'
          import json,sys
          date,search_id,path=sys.argv[1],int(sys.argv[2]),sys.argv[3]
          d=json.load(open(path))
          hotels={}
          def walk(x):
              if isinstance(x,dict):
                  hid=x.get('hotelId') or x.get('hotel_id') or (x.get('id') if ('hotelName' in x or 'hotel_name' in x or 'hotel' in str(x.get('type','')).lower()) else None)
                  name=x.get('hotelName') or x.get('hotel_name') or x.get('name')
                  if hid and name: hotels[str(hid)]=str(name)
                  for k in ('hotel','Hotel'):
                      h=x.get(k)
                      if isinstance(h,dict):
                          hh=h.get('id') or h.get('hotelId') or h.get('hotel_id'); nn=h.get('name') or h.get('hotelName') or h.get('title')
                          if hh and nn: hotels[str(hh)]=str(nn)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(d)
          print(json.dumps({'date':date,'searchId':search_id,'status':'completed','unique_hotel_ids':len(hotels),'hotels':hotels},ensure_ascii=False,sort_keys=True))
          PY
            sleep 2
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['STATE']); union={}; rows=[]
          for line in (s/'searches.ndjson').read_text().splitlines():
              if not line.strip(): continue
              r=json.loads(line); rows.append(r)
              for k,v in (r.get('hotels') or {}).items(): union[k]=v
          out={'operation_id':os.environ['OPERATION_ID'],'status':'completed','searches':[{'date':r.get('date'),'searchId':r.get('searchId'),'status':r.get('status'),'unique_hotel_ids':r.get('unique_hotel_ids'),'http_status':r.get('http_status')} for r in rows],'successful_searches':sum(1 for r in rows if r.get('status')=='completed'),'union_unique_hotel_ids':len(union),'sample_hotels':[{'id':k,'name':v} for k,v in list(union.items())[:50]],'database_writes':0,'mapping_writes':0,'lead_calls':0,'booking_calls':0,'no_replay':True}
          (s/'result.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-production-gateway-current-jwt-operator13-egypt-sweep-v5
          path: ${{ runner.temp }}/${{ env.OPERATION_ID }}/
          if-no-files-found: error
          retention-days: 90
