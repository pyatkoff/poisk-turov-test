name: MATCH production gateway current JWT #1971
on:
  push:
    branches: ['feat/match-current-bulk-review-20260911']
    paths: ['.github/workflows/hotel-match-production-gateway-current-jwt-1971.yml']
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-production-gateway-current-jwt-1971-20260912-v3}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reserve
        run: |
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access','criteria':{'action':'search_start','departureId':1,'countryId':1,'dateFrom':'2026-10-17','dateTo':'2026-10-17','nightsFrom':7,'nightsTo':7,'adults':2,'currency':'RUB','onlyCharter':'false','onlyDirect':'false','operatorIds':[13]},'credential':'production_gateway_current_TOURVISOR_JWT','database_writes':0,'mapping_writes':0,'lead_calls':0,'booking_calls':0,'no_replay':True},sort_keys=True,indent=2)+'\n')
          PY
      - name: Call production gateway once
        run: |
          set -euo pipefail
          url='https://anytoour.ru/api-v2.php?action=search_start&departureId=1&countryId=1&dateFrom=2026-10-17&dateTo=2026-10-17&nightsFrom=7&nightsTo=7&adults=2&currency=RUB&onlyCharter=false&onlyDirect=false&operatorIds=13'
          code=$(curl -sS -o "$RUNNER_TEMP/$OPERATION_ID/body.json" -w '%{http_code}' --connect-timeout 15 --max-time 70 "$url")
          export CODE="$code"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; raw=(p/'body.json').read_text(errors='replace')
          try: data=json.loads(raw)
          except: data={'raw_non_json':True}
          out={'operation_id':os.environ['OPERATION_ID'],'http_status':int(os.environ['CODE']),'database_writes':0,'mapping_writes':0,'lead_calls':0,'booking_calls':0,'no_replay':True}
          if isinstance(data,dict):
              for k in ('searchId','id','ok','error','status','message'):
                  if k in data: out[k]=data[k]
              if 'data' in data and isinstance(data['data'],dict):
                  for k in ('searchId','id','status'):
                      if k in data['data']: out['data_'+k]=data['data'][k]
          (p/'result.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-production-gateway-current-jwt-v3
          path: ${{ runner.temp }}/${{ env.OPERATION_ID }}/
          if-no-files-found: error
          retention-days: 90
