name: MATCH saved twelve CURRENT v1
on:
  push:
    branches: [ops/match-saved12-current-1971-20260919-v1]
    paths: [scripts/diagnostics/hotel_match_saved12_current_v1.php, .github/workflows/hotel-match-saved12-current-v1.yml]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-saved12-current-1971-20260919-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-saved12-current-1971-20260919-v1
  BASE_SHA: e9d7bf349bfb601dff04b7fc47088c1eff38b369
  CLAIM: '5741788892'
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact scope and read-only source
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir payload result
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l)" -eq 2
          git diff --name-only "$BASE_SHA..HEAD" | grep -Fx 'scripts/diagnostics/hotel_match_saved12_current_v1.php'
          git diff --name-only "$BASE_SHA..HEAD" | grep -Fx '.github/workflows/hotel-match-saved12-current-v1.yml'
          printf '%s\n' '5136ff48b366deb48765d5635ccd46016b197c4a7640cf6023e368a8f6f06448  scripts/diagnostics/hotel_match_saved12_current_v1.php' | sha256sum -c -
          test "$(git rev-parse HEAD:app/integrations/andromeda-hotel-resolver.php)" = d49d0eaf8d6abccefd84c0c3921edde94ef50a68
          test "$(git rev-parse HEAD:app/integrations/anex-search-mapping-registry.php)" = cc135a95d2a6e0f73ce50be2141c9b8a26fddc58
          php -l scripts/diagnostics/hotel_match_saved12_current_v1.php
          php scripts/diagnostics/hotel_match_saved12_current_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >payload/claim.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          c=json.loads(pathlib.Path('payload/claim.json').read_bytes())
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and os.environ['OPERATION_ID'] in c['body']
          p=pathlib.Path('scripts/diagnostics/hotel_match_saved12_current_v1.php')
          assert not any(x in p.read_text() for x in ['INSERT INTO','UPDATE andromeda','DELETE FROM','->commit('])
          names=['andromeda-hotel-resolver.php','anex-search-mapping-registry.php']
          deps={n:hashlib.sha256(pathlib.Path('app/integrations',n).read_bytes()).hexdigest() for n in names}
          v={'operation':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'reader_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'dependencies':deps,'provider_calls':0,'database_writes':0,'mapping_writes':0,'claim_id':int(os.environ['CLAIM'])}
          with open('result/reservation.json','xb') as f:f.write((json.dumps(v,sort_keys=True)+'\n').encode());f.flush();os.fsync(f.fileno())
          PY
      - name: Require exact-head Security before server access
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
           q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
           xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['GITHUB_SHA']]
           if xs:
            r=max(xs,key=lambda x:x['id'])
            if r['status']=='completed':assert r['conclusion']=='success';print('SECURITY_OK',r['id']);break
           time.sleep(5)
          else:raise SystemExit('security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-saved12-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Read twelve existing candidates and current competitors once
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077
          test -n "$KEY_VALUE";test -n "$HOST_VALUE";test -n "$USER_VALUE"
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null;test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE";op=".anytoour-match/operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" result/reservation.json scripts/diagnostics/hotel_match_saved12_current_v1.php app/integrations/andromeda-hotel-resolver.php app/integrations/anex-search-mapping-registry.php "$remote:$op/"
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=1 -d zend.exception_ignore_args=1 -d error_log=\"\$HOME/$op/bootstrap-errors.log\" -d memory_limit=768M \"\$HOME/$op/hotel_match_saved12_current_v1.php\"" >result/stdout.json 2>result/stderr.txt
          rc=$?;printf '%s\n' "$rc">result/remote-exit.txt
          ssh "${opts[@]}" "$remote" 'set -eu;cd "$HOME/'"$op"'";set -- reservation.json;for f in result.json receipt.json;do test ! -f "$f" || set -- "$@" "$f";done;tar -czf - -- "$@"' >result/server-operation.tgz 2>>result/stderr.txt
          trc=$?;printf '%s\n' "$trc">result/tar-exit.txt;set -e;test "$trc" -eq 0;test "$rc" -eq 0
      - name: Verify exact twelve-edge read-only receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path('result');s=p/'server';s.mkdir(exist_ok=True);seen=set()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
           for m in t.getmembers():
            assert m.isfile() and 0<=m.size<64000000 and m.name in {'reservation.json','result.json','receipt.json'} and m.name not in seen
            seen.add(m.name);(s/m.name).write_bytes(t.extractfile(m).read())
          assert seen=={'reservation.json','result.json','receipt.json'}
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert (p/'remote-exit.txt').read_text().strip()=='0' and (p/'tar-exit.txt').read_text().strip()=='0' and not (p/'stderr.txt').read_bytes()
          r=json.loads((s/'result.json').read_bytes());q=json.loads((s/'receipt.json').read_bytes())
          assert q['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest() and q['readback_verified'] is True
          assert r['operation']==q['operation']==os.environ['OPERATION_ID'] and r['source_sha']==q['source_sha']==os.environ['GITHUB_SHA']
          assert r['state']==q['state']=='completed_read_only' and r['examined']==len(r['rows'])==12 and r['unique_target_hotels']==11
          expected={'190031':1441,'2000106034':65341,'2000050280':70458,'2000091832':88168,'2000072026':9446,'2000086139':79837,'2000071081':96954,'2000074084':46680,'304393':63524,'2000037910':59126,'2000050680':60804,'2000021340':60804}
          assert {x['external_hotel_id']:x['expected_tv_id'] for x in r['rows']}==expected
          assert all(x['safe_to_write_now'] is False for x in r['rows'])
          for k in ['provider_calls','database_writes','mapping_writes','accepted_delta','triple_delta']:assert r[k]==q[k]==0
          summary={k:r[k] for k in ['operation','source_sha','read_at_utc','examined','unique_target_hotels','status_counts','identity_count','identity_status_counts','anex_effective']}
          summary['rows']=[{k:x[k] for k in ['external_hotel_id','expected_tv_id','state','effective_local_id']} for x in r['rows']]
          summary['result_sha256']=q['result_sha256'];(p/'verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-saved12-result-${{ github.run_id }}', path: result, retention-days: 90, if-no-files-found: error}
