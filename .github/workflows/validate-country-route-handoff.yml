name: Validate standalone country route handoff

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/country/**'
      - 'v2/country-page-v1.php'
      - 'v2/seo-hotel-tour-page-v1.php'
      - 'v2/seo-content-pilot-maldives-*-v1.php'
      - 'v2/seo-hotel-tours-content-factory-v1.php'
      - '.github/workflows/validate-country-route-handoff.yml'

permissions:
  contents: read

jobs:
  country-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate migrated routes against live Tourvisor catalog
        shell: bash
        run: |
          set -euo pipefail
          api='https://anytoour.ru/api-v2.php'
          curl -fsSL --max-time 45 "$api?action=countries&departureId=1" -o /tmp/countries.json
          python3 - <<'PY'
          import json,re,pathlib
          rows=json.load(open('/tmp/countries.json'))
          assert isinstance(rows,list) and rows
          expected={
              'turkey':('Турция','4'),
              'egypt':('Египет','1'),
              'oae':('ОАЭ','9'),
              'tailand':('Таиланд','2'),
              'russia':('Россия','47'),
              'maldives':('Мальдивы','8'),
              'sri-lanka':('Шри-Ланка','12'),
          }
          by_name={str(x.get('name','')).strip():str(x.get('id','')) for x in rows if isinstance(x,dict)}
          for slug,(name,country_id) in expected.items():
              assert by_name.get(name)==country_id, f'{name}: live id {by_name.get(name)!r} != {country_id}'
              text=pathlib.Path(f'v2/country/{slug}/index.php').read_text(encoding='utf-8')
              m=re.search(r"'countryId'\s*=>\s*(\d+)",text)
              assert m and m.group(1)==country_id, f'{slug}: route id mismatch'
          print('COUNTRY_ROUTE_CATALOG_MAP', ' '.join(f'{name}={country_id}' for name,country_id in expected.values()))
          PY
      - name: Validate local catalogue routing and CTA contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/country-page-v1.php >/dev/null
          php -l v2/country/index.php >/dev/null
          local_pages='turkey egypt oae tailand russia tunis vetnam dominikana cyprus cuba maldives mexico sri-lanka tanzania'
          for page in $local_pages; do php -l "v2/country/$page/index.php" >/dev/null; done
          grep -Fq "?country=" v2/country-page-v1.php
          grep -Fq "Открыть поиск туров" v2/country-page-v1.php
          python3 - <<'PY'
          import pathlib,re
          catalogue=pathlib.Path('v2/country/index.php').read_text(encoding='utf-8')
          local=('turkey','egypt','oae','tailand','russia','tunis','vetnam','dominikana','cyprus','cuba','maldives','mexico','sri-lanka','tanzania')
          verified_ids={'turkey','egypt','oae','tailand','russia','maldives','sri-lanka'}
          for slug in local:
              assert f"'/country/{slug}/'" in catalogue, f'{slug}: local catalogue link missing'
              route=pathlib.Path(f'v2/country/{slug}/index.php')
              assert route.is_file(), f'{slug}: local route missing'
              text=route.read_text(encoding='utf-8')
              if slug not in verified_ids:
                  assert not re.search(r"'countryId'\s*=>",text), f'{slug}: unverified Tourvisor countryId must not be guessed'
          assert 'https://anytour.online/country/' not in catalogue, 'legacy country jump remains in catalogue'
          PY
          echo COUNTRY_ROUTE_HANDOFF_OK
      - name: Validate hotel-tour review noindex and verified handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty-document-root
          php <<'PHP'
          <?php
          $_SERVER['DOCUMENT_ROOT']='/tmp/empty-document-root';
          $_SERVER['HTTP_HOST']='anytoour.ru';
          $_SERVER['SCRIPT_NAME']='/country/maldives/hotel/the-westin-maldives-miriandhoo-resort-65108/index.php';
          require 'v2/seo-hotel-tour-page-v1.php';
          require 'v2/seo-content-pilot-maldives-westin-v1.php';
          ob_start();
          v2_seo_render_hotel_tour_review(v2_seo_content_pilot_maldives_westin());
          $html=ob_get_clean();
          $checks=[
              '<meta name="robots" content="noindex,follow,max-image-preview:large">'=>'robots',
              '<link rel="canonical" href="https://anytoour.ru/country/maldives/hotel/the-westin-maldives-miriandhoo-resort-65108/">'=>'canonical',
              'href="/poisk-turov/?country=8&amp;hotel=65108"'=>'verified_handoff',
              'Найти туры в этот отель'=>'cta',
          ];
          foreach($checks as $needle=>$label){
              if(strpos($html,$needle)===false){
                  fwrite(STDERR,"HOTEL_TOUR_REVIEW_FAIL:$label\n");
                  exit(1);
              }
          }
          if(substr_count($html,'<meta name="robots"')!==1){
              fwrite(STDERR,"HOTEL_TOUR_REVIEW_FAIL:robots_count\n");
              exit(1);
          }
          echo "HOTEL_TOUR_REVIEW_OK noindex=1 country=8 hotel=65108\n";
          PHP
