name: MATCH ANEX Andromeda core8 discovery v14

on:
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-anex-andromeda-core8-discovery-1971-20260912-v14.arm']

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: anytour-match-anex-andromeda-core8-discovery-1971-20260912-v14
  cancel-in-progress: false

env:
  FAMILY_ID: hotel-match-anex-andromeda-core8-discovery-1971-20260912-v14
  FROZEN_SOURCE_SHA: cf15ed59aecc19c2f24950868dcff9d9c99f4ee0

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sid: s01
            country_id: '4'
            country_name: Turkey
            date: '2026-11-24'
            nights: '6'
          - sid: s02
            country_id: '4'
            country_name: Turkey
            date: '2027-02-03'
            nights: '9'
          - sid: s03
            country_id: '4'
            country_name: Turkey
            date: '2027-03-17'
            nights: '10'
          - sid: s04
            country_id: '1'
            country_name: Egypt
            date: '2026-11-26'
            nights: '6'
          - sid: s05
            country_id: '1'
            country_name: Egypt
            date: '2027-02-04'
            nights: '9'
          - sid: s06
            country_id: '1'
            country_name: Egypt
            date: '2027-03-18'
            nights: '10'
          - sid: s07
            country_id: '12'
            country_name: Sri Lanka
            date: '2026-12-03'
            nights: '7'
          - sid: s08
            country_id: '16'
            country_name: Vietnam
            date: '2026-12-10'
            nights: '7'
          - sid: s09
            country_id: '9'
            country_name: UAE
            date: '2026-12-17'
            nights: '7'
          - sid: s10
            country_id: '8'
            country_name: Maldives
            date: '2027-01-07'
            nights: '7'
          - sid: s11
            country_id: '2'
            country_name: Thailand
            date: '2027-01-14'
            nights: '7'
          - sid: s12
            country_id: '10'
            country_name: Cuba
            date: '2027-01-21'
            nights: '7'
    env:
      SLICE_ID: ${{ matrix.sid }}
      COUNTRY_ID: ${{ matrix.country_id }}
      COUNTRY_NAME: ${{ matrix.country_name }}
      SEARCH_DATE: ${{ matrix.date }}
      SEARCH_NIGHTS: ${{ matrix.nights }}
      OPERATION_ID: hotel-match-anex-andromeda-core8-discovery-1971-20260912-v14-${{ matrix.sid }}
      ARTIFACT_DIR: /tmp/matchaa-core8-v14-${{ matrix.sid }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify arm and derive supplier-first program
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(cat .github/match-anex-andromeda-core8-discovery-1971-20260912-v14.arm)" = "$FAMILY_ID"
          mkdir -m 700 -p "$ARTIFACT_DIR"
          curl -fsSL --retry 2 --retry-delay 1 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$FROZEN_SOURCE_SHA/scripts/diagnostics/hotel_match_three_provider_111_full_pages_v6.php" \
            -o "$ARTIFACT_DIR/frozen.php"
          export FROZEN="$ARTIFACT_DIR/frozen.php" PROGRAM="$ARTIFACT_DIR/program.php"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['FROZEN']).read_text()
          oldop='hotel-match-three-provider-111-full-pages-1971-20260911-v6'
          olddate="const M6_DATE = '2026-11-06';"
          oldnights='const M6_NIGHTS = 7;'
          assert p.count(oldop)==1 and p.count(olddate)==1 and p.count(oldnights)==1
          p=p.replace(oldop,os.environ['OPERATION_ID'])
          p=p.replace(olddate,"const M6_DATE = '"+os.environ['SEARCH_DATE']+"';")
          p=p.replace(oldnights,'const M6_NIGHTS = '+os.environ['SEARCH_NIGHTS']+';')
          p=p.replace("'countryId'=>4","'countryId'=>"+os.environ['COUNTRY_ID'])
          p=p.replace("$lookup->execute([1,4]);","$lookup->execute([1,"+os.environ['COUNTRY_ID']+"]);")
          p=p.replace("'country'=>'Turkey'","'country'=>'"+os.environ['COUNTRY_NAME']+"'")
          p=p.replace("'tourvisor_operator_id'=>M6_TV_OPERATOR,",'')
          helper_start='function m6_tv_hotels(array $payload): array {'
          try_start='try {'
          assert p.count(helper_start)==1 and p.count(try_start)==1
          a=p.index(helper_start); b=p.index(try_start,a)
          pair_fn=r"""function m14_common_pairs(array $anex,array $andr): array {
              $providers=['anex'=>$anex,'andromeda'=>$andr];$indexes=[];
              foreach($providers as $provider=>$hotels){
                  foreach($hotels as $key=>$hotel)foreach($hotel['aliases']??[] as $alias)$indexes[$provider][$alias][]=$key;
              }
              $keys=array_intersect(array_keys($indexes['anex']??[]),array_keys($indexes['andromeda']??[]));
              sort($keys,SORT_STRING);$seen=[];$rows=[];
              foreach($keys as $alias){
                  $aa=array_values(array_unique($indexes['anex'][$alias]??[]));
                  $dd=array_values(array_unique($indexes['andromeda'][$alias]??[]));
                  if(count($aa)!==1||count($dd)!==1)continue;
                  $ak=$aa[0];$dk=$dd[0];$dedupe=$ak.'|'.$dk;
                  if(isset($seen[$dedupe]))continue;$seen[$dedupe]=true;
                  $rows[]=['alias_key'=>$alias,
                      'anex'=>['id'=>$providers['anex'][$ak]['id'],'name'=>$providers['anex'][$ak]['name'],'local_id'=>$providers['anex'][$ak]['local_id']??null],
                      'andromeda'=>['id'=>$providers['andromeda'][$dk]['id'],'namespace'=>$providers['andromeda'][$dk]['namespace'],'name'=>$providers['andromeda'][$dk]['name'],'local_id'=>$providers['andromeda'][$dk]['local_id']??null]];
                  if(count($rows)>=3000)break;
              }
              return $rows;
          }

          """
          p=p[:a]+pair_fn+p[b:]
          tv_start='    // Tourvisor: high-limit cached result read + bounded explicit continue rounds until the hotel set stops growing.\n'
          anex_start='    // Direct ANEX anchor on the exact same day/night/party. Existing API returns one bounded SearchTour payload.\n'
          assert p.count(tv_start)==1 and p.count(anex_start)==1
          a=p.index(tv_start); b=p.index(anex_start,a)
          p=p[:a]+p[b:]
          p=re.sub(r"\n\s*\$tvClient=.*?require_once \$tvClient;\n","\n",p,count=1)
          old="$andr[$key]=['id'=>$id,'namespace'=>$ns,'name'=>$name,'operator'=>m6_text($o['operator']??'',80),'aliases'=>m6_aliases($name)];"
          new="$andr[$key]=['id'=>$id,'namespace'=>$ns,'name'=>$name,'operator'=>m6_text($o['operator']??'',80),'local_id'=>$o['local_id']??$o['hotel_local_id']??$o['local_hotel_id']??null,'aliases'=>m6_aliases($name)];"
          assert p.count(old)==1
          p=p.replace(old,new,1)
          oldcomp="    $triples=m6_common_triples($tv,$anex,$andr);$result['comparison']=['unique_alias_triples'=>['count'=>count($triples),'rows'=>$triples],'interpretation'=>'diagnostic identity evidence only; no mapping is created from availability or price'];\n    $result['provider_calls']=['tourvisor_continue'=>$continueCalls,'andromeda_login'=>1,'andromeda_price_pages'=>count($pageStats),'direct_anex_searchtour'=>'one bounded normalized price response plus dictionaries'];"
          newcomp="    $pairs=m14_common_pairs($anex,$andr);$result['comparison']=['unique_alias_pairs'=>['count'=>count($pairs),'rows'=>$pairs],'interpretation'=>'supplier-first identity evidence only; no mapping is created from availability or price'];\n    $result['provider_calls']=['tourvisor_http_calls'=>0,'tourvisor_search_slices'=>0,'andromeda_login'=>1,'andromeda_price_pages'=>count($pageStats),'direct_anex_searchtour'=>'one bounded normalized price response plus dictionaries'];"
          assert p.count(oldcomp)==1
          p=p.replace(oldcomp,newcomp,1)
          strict="declare(strict_types=1);\n"
          fatal=("register_shutdown_function(static function(): void {\n"
                 "    $e=error_get_last();\n"
                 "    if(!is_array($e) || !in_array((int)($e['type']??0),[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR,E_USER_ERROR],true)) return;\n"
                 "    echo 'MATCH111FULL_JSON:'.json_encode(['status'=>'failed','stage'=>'fatal','reason'=>'php_fatal','operation_id'=>'"+os.environ['OPERATION_ID']+"','database_writes'=>0,'mapping_writes'=>0,'booking_calls'=>0,'lead_calls'=>0,'tourvisor_http_calls'=>0,'tourvisor_search_slices'=>0,'token_values_recorded'=>false,'raw_provider_bodies_recorded'=>false],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;\n"
                 "});\n")
          assert p.count(strict)==1
          p=p.replace(strict,strict+fatal,1)
          Path(os.environ['PROGRAM']).write_text(p)
          PY
          php -l "$ARTIFACT_DIR/program.php"
          ! grep -Fq "TOURVISOR_ANEX_JWT" "$ARTIFACT_DIR/program.php"
          ! grep -Fq "/tours/search" "$ARTIFACT_DIR/program.php"

      - name: Establish zero-supplier SSH master
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess,time
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP']);sid=os.environ['SLICE_ID']
          key=rt/('matchaa-core8-v14-key-'+sid);sock=rt/('matchaa-core8-v14-'+sid+'.sock');known=rt/('matchaa-core8-v14-known-'+sid)
          raw=os.environ['KEY_VALUE'].strip()
          key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw))
          key.chmod(0o600)
          common=['-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE']]
          ok=False
          for _ in range(3):
              try:sock.unlink()
              except FileNotFoundError:pass
              p=subprocess.run(['ssh','-M','-S',str(sock),'-fnNT','-o','ControlPersist=1200']+common,text=True,capture_output=True,timeout=30)
              if p.returncode==0:
                  q=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],'cd "$HOME/www/anytoour.ru" && test -f config.php && test -f _preview/search3-anex-candidate/api-andromeda-search3-preview.php && printf MATCHAA_CORE8_V14_PREFLIGHT_OK'],text=True,capture_output=True,timeout=30)
                  if q.returncode==0 and 'MATCHAA_CORE8_V14_PREFLIGHT_OK' in q.stdout:ok=True;break
              time.sleep(3)
          if not ok:raise SystemExit('ssh preflight failed before reservation')
          PY

      - name: Persist immutable reservation before supplier access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);p=d/'program.php'
          r={'family_id':os.environ['FAMILY_ID'],'operation_id':os.environ['OPERATION_ID'],'slice_id':os.environ['SLICE_ID'],'state':'reserved_before_supplier_access','source_sha':os.environ['GITHUB_SHA'],'frozen_source_sha':os.environ['FROZEN_SOURCE_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'program_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'criteria':{'departure':'Moscow','country_id':int(os.environ['COUNTRY_ID']),'country':os.environ['COUNTRY_NAME'],'date':os.environ['SEARCH_DATE'],'nights':int(os.environ['SEARCH_NIGHTS']),'adults':2,'children':0},'providers':['direct_anex','andromeda_anex_operator_all_pages'],'tourvisor_http_calls':0,'tourvisor_search_slices':0,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True,indent=2)+'\n').encode();q=d/'reservation.json';q.write_bytes(raw)
          assert q.read_bytes()==raw
          PY

      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: matchaa-core8-v14-${{ matrix.sid }}-${{ github.run_id }}-reserved
          path: ${{ env.ARTIFACT_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute ANEX and Andromeda discovery slice
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          sleep 15
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);sock=Path(os.environ['RUNNER_TEMP'])/('matchaa-core8-v14-'+os.environ['SLICE_ID']+'.sock');program=(d/'program.php').read_text()
          p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-l',os.environ['USER_VALUE'],os.environ['HOST_VALUE'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=2048M'],input=program,text=True,capture_output=True,timeout=900)
          prefix='MATCH111FULL_JSON:';line=next((z[len(prefix):] for z in reversed(p.stdout.splitlines()) if z.startswith(prefix)),None)
          if line is None:
              data={'status':'unknown','stage':'remote_execution','reason':'result_marker_missing','operation_id':os.environ['OPERATION_ID'],'remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(p.stderr.encode()).hexdigest(),'tourvisor_http_calls':0,'tourvisor_search_slices':0,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          else:
              data=json.loads(line);data.update(source_sha=os.environ['GITHUB_SHA'],frozen_source_sha=os.environ['FROZEN_SOURCE_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=1,no_replay=True)
          (d/'result.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          q=data.get('providers') or {};an=q.get('anex') or {};ad=q.get('andromeda') or {};pairs=(((data.get('comparison') or {}).get('unique_alias_pairs') or {}).get('count'))
          print(json.dumps({'slice':os.environ['SLICE_ID'],'country':os.environ['COUNTRY_NAME'],'status':data.get('status'),'reason':data.get('reason'),'anex_hotels':an.get('hotel_count'),'andromeda_hotels':ad.get('hotel_count'),'alias_pairs':pairs},sort_keys=True))
          if data.get('status')!='completed':raise SystemExit(2)
          PY

      - name: Build immutable receipt
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']);p=d/'result.json'
          data=json.loads(p.read_text()) if p.exists() else {'status':'unknown','reason':'result_missing','operation_id':os.environ['OPERATION_ID']}
          q=data.get('providers') or {};an=q.get('anex') or {};ad=q.get('andromeda') or {};pairs=(((data.get('comparison') or {}).get('unique_alias_pairs') or {}).get('count'))
          raw=(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          an_hot=an.get('hotels') or [];ad_hot=ad.get('hotels') or []
          r={'family_id':os.environ['FAMILY_ID'],'operation_id':os.environ['OPERATION_ID'],'slice_id':os.environ['SLICE_ID'],'state':data.get('status','unknown'),'reason':data.get('reason'),'source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'result_sha256':hashlib.sha256(raw).hexdigest(),'country_id':int(os.environ['COUNTRY_ID']),'country':os.environ['COUNTRY_NAME'],'date':os.environ['SEARCH_DATE'],'nights':int(os.environ['SEARCH_NIGHTS']),'anex_hotels':an.get('hotel_count'),'anex_local_null':sum(1 for h in an_hot if h.get('local_id') is None),'andromeda_hotels':ad.get('hotel_count'),'andromeda_local_null_hint':sum(1 for h in ad_hot if h.get('local_id') is None),'alias_pairs':pairs,'tourvisor_http_calls':0,'tourvisor_search_slices':0,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          (d/'receipt.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY

      - name: Preserve immutable result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchaa-core8-v14-${{ matrix.sid }}-${{ github.run_id }}-result
          path: ${{ env.ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    if: always()
    needs: [slice]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: matchaa-core8-v14-*-result
          path: /tmp/matchaa-core8-v14-all
      - name: Aggregate discovery evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os
          rows=[];an_ids=set();ad_ids=set();pairs=set()
          for p in glob.glob('/tmp/matchaa-core8-v14-all/**/result.json',recursive=True):
              d=json.load(open(p));q=d.get('providers') or {};an=q.get('anex') or {};ad=q.get('andromeda') or {};cp=((d.get('comparison') or {}).get('unique_alias_pairs') or {})
              crit=d.get('criteria') or {}
              rows.append({'operation_id':d.get('operation_id'),'status':d.get('status'),'country':crit.get('country'),'date':crit.get('date'),'nights':crit.get('nights'),'anex_hotels':an.get('hotel_count'),'andromeda_hotels':ad.get('hotel_count'),'alias_pairs':cp.get('count')})
              for h in an.get('hotels') or []:
                  if h.get('id') is not None:an_ids.add(str(h.get('id')))
              for h in ad.get('hotels') or []:
                  if h.get('id') is not None:ad_ids.add(str(h.get('namespace',''))+':'+str(h.get('id')))
              for r in cp.get('rows') or []:
                  a=(r.get('anex') or {}).get('id');b=(r.get('andromeda') or {}).get('id')
                  if a is not None and b is not None:pairs.add((str(a),str(b)))
          rows.sort(key=lambda r:(str(r.get('country')),str(r.get('date'))))
          out={'family_id':os.environ['FAMILY_ID'],'run_id':int(os.environ['GITHUB_RUN_ID']),'slices':rows,'completed_slices':sum(r.get('status')=='completed' for r in rows),'artifact_slices':len(rows),'unique_anex_hotels':len(an_ids),'unique_andromeda_hotels':len(ad_ids),'unique_exact_alias_pairs':len(pairs),'tourvisor_http_calls':0,'tourvisor_search_slices':0,'database_writes':0,'mapping_writes':0,'no_replay':True}
          os.makedirs('/tmp/matchaa-core8-v14-aggregate',exist_ok=True)
          open('/tmp/matchaa-core8-v14-aggregate/aggregate.json','w').write(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          summary=(f"MATCH #1971 supplier-first core8 v14: completed slices **{out['completed_slices']}/{out['artifact_slices']}**; "
                   f"unique ANEX hotels **{out['unique_anex_hotels']}**, unique Andromeda hotels **{out['unique_andromeda_hotels']}**, "
                   f"unique exact ANEX↔Andromeda alias pairs **{out['unique_exact_alias_pairs']}**. "
                   "Tourvisor HTTP/search slices **0/0**; DB/mapping/booking/lead writes **0**. "
                   "Immutable per-slice reservations/results retained; next step is one server-current bulk reconciliation of live unresolved/missing-third evidence, not micro-writes.")
          open('/tmp/matchaa-core8-v14-aggregate/summary.md','w').write(summary+'\n')
          print(summary)
          PY
      - name: Preserve aggregate evidence
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchaa-core8-v14-${{ github.run_id }}-aggregate
          path: /tmp/matchaa-core8-v14-aggregate/
          if-no-files-found: error
          retention-days: 90
      - name: Record one aggregate summary in issue
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> /tmp/matchaa-core8-v14-aggregate/summary.md
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file /tmp/matchaa-core8-v14-aggregate/summary.md
