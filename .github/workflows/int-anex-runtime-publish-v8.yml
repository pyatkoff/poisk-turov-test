name: INT publish ANEX runtime v8 APD cache and bounded population canary

on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/int-anex-runtime-publish-v8.yml'

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: publish-anex-search3-preview-2506-v8-apd-cache
  cancel-in-progress: false

env:
  SOURCE_SHA: d8a11376535f6ea44ba0e83694a449fa54f84ab1
  SOURCE_TREE: e35bb9b24e8d49efa9ac8726652b975cdacb2977
  OPERATION_ID: publish-anex-search3-preview-2506-v8-apd-cache
  EXPECTED_ROUTE: /_preview/search3-anex-candidate/

jobs:
  publish:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' && github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.head.ref == 'ops/int-anex-runtime-publish-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Verify authorization, source provenance, migration success and exact Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(gh api repos/pyatkoff/poisk-turov-test/pulls/$PR_NUMBER --jq '.head.sha')" = "$HEAD_SHA"
          gh api repos/pyatkoff/poisk-turov-test/issues/comments/5722595438 > claim.json
          python3 - <<'PY'
          import datetime,json,os,subprocess
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert 'publish-anex-search3-preview-2506-v8-apd-cache' in c['body'] and os.environ['SOURCE_SHA'] in c['body']
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(c['created_at'].replace('Z','+00:00'))
          assert 0<=age.total_seconds()<7200,'claim expired'
          expected={
            'v2/api-anex-search3-preview.php':'77d1c020bc0ef3bb692f4ee94f070d3f65a7523c',
            'app/integrations/anex-additional-prices-batch.php':'ea0427d89dbf46903ad27a669a5c675232359aad',
            'app/integrations/anex-program-observation-runtime.php':'f4dd765aeaa2007a25eb2411fbd494211f4647dc',
            'app/integrations/anex-apd-cache-runtime.php':'743520b90cfa6e6c5a2ba2e2cd8edf100489df90',
            'app/integrations/anex-program-apd-store.php':'d610beb9178558d35a8931a01cd42861ceb7de5b',
            'app/integrations/anex-anytour-offer-autosave.php':'b215d0b6e0d562585a00a37adf6e89290a39460e',
          }
          for path,blob in expected.items():
              got=subprocess.check_output(['git','-C','candidate','hash-object',path],text=True).strip()
              assert got==blob,(path,got,blob)
          PY
          python3 - <<'PY'
          import json,subprocess
          for pr,merge,head,runs in [
            (2874,'69a6610105cb42d45e2b05b1b69f47367bfbb3eb','dff3c17913c633dda389084c5f8a7fb4c3b27a19',[35286016518,35286016567,35286016655,35286016456,35286016455,35286016545]),
            (2875,'d8a11376535f6ea44ba0e83694a449fa54f84ab1','bf2ec49b9dbc25ab4c27886342a89476021e312a',[35286286559,35286286567,35286286556,35286286560]),
          ]:
              p=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/poisk-turov-test/pulls/{pr}'],text=True))
              assert p['merged'] and p['merge_commit_sha']==merge and p['head']['sha']==head
              for rid in runs:
                  r=json.loads(subprocess.check_output(['gh','api',f'repos/pyatkoff/poisk-turov-test/actions/runs/{rid}'],text=True))
                  assert r['head_sha']==head and r['status']=='completed' and r['conclusion']=='success',(pr,rid)
          install=json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/poisk-turov-test/actions/runs/35286794911'],text=True))
          assert install['status']=='completed' and install['conclusion']=='success'
          PY
          ok=0
          for i in $(seq 1 36); do
            gh api repos/pyatkoff/poisk-turov-test/commits/$HEAD_SHA/check-runs > checks.json
            if python3 - <<'PY'
          import json
          c=json.load(open('checks.json'))['check_runs']
          raise SystemExit(0 if any(x['name']=='guard' and x['conclusion']=='success' for x in c) else 1)
          PY
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Run exact source deployment and INT regression preflight
        run: |
          set -euo pipefail
          cd candidate
          python3 -B tests/anex_search3_preview_deploy_test.py
          python3 -B tests/anex_search3_preview_safe_deploy_test.py
          php -l v2/api-anex-search3-preview.php
          php -l app/integrations/anex-program-observation-runtime.php
          php -l app/integrations/anex-apd-cache-runtime.php
          php -l app/integrations/anex-additional-prices-batch.php
          php tests/anex-program-observation-runtime-test.php
          php tests/anex-apd-cache-runtime-test.php
          php tests/anex-additional-prices-batch-test.php
          php tests/anex-anytour-offer-autosave-test.php
          php tests/anex-flight-type-handoff-test.php

      - name: Require deploy secrets without exposing them
        env:
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          a=os.environ.get('ANEX_API_TOKEN',''); b=os.environ.get('ANEX_B2B_TOKEN',''); k=os.environ.get('ANYTOOUR_DEPLOY_SSH_KEY','')
          assert a.strip() and len(a)<=16384 and '\x00' not in a
          assert b and len(b)<=16384 and not b.lower().startswith('bearer ') and not re.search(r'[\x00-\x20\x7f]',b)
          assert 'PRIVATE KEY' in k
          PY

      - name: Reserve publication before server mutation
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/v8-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/v8-ssh/key"; chmod 600 "$RUNNER_TEMP/v8-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/v8-ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/v8-ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/v8-ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          remote="$REMOTE_USER@$HOST"
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'state':'reserved','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'control_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'replay_allowed':False},separators=(',',':')))
          PY
          )"
          printf '%s\n' "$payload" | ssh -T -i "$RUNNER_TEMP/v8-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/v8-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 "$remote" "umask 077; private=\"\$HOME/.anytoour-anex\"; test -d \"\$private\" && test ! -L \"\$private\"; op=\"\$private/$OPERATION_ID\"; mkdir \"\$op\"; cat > \"\$op/reservation.json\"; chmod 600 \"\$op/reservation.json\""

      - name: Publish exact source to isolated preview
        env:
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/v8-artifact
        run: |
          set -euo pipefail
          mkdir -p "$ANEX_CATALOG_ARTIFACT_DIR"
          cd candidate
          SOURCE_SHA="$SOURCE_SHA" python3 -B scripts/diagnostics/anex_search3_preview_deploy_safe.py | tee "$ANEX_CATALOG_ARTIFACT_DIR/publisher-stdout.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ANEX_CATALOG_ARTIFACT_DIR'])/'anex-search3-preview-deploy.json'
          v=json.loads(p.read_text())
          assert v['status']=='deployed' and v['source_sha']==os.environ['SOURCE_SHA']
          assert v['route']==os.environ['EXPECTED_ROUTE'] and v['production_entry_changes'] is False
          PY

      - name: Read back new runtime hashes and HTTP boundary
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="$REMOTE_USER@$HOST"; key="$RUNNER_TEMP/v8-ssh/key"; known="$RUNNER_TEMP/v8-ssh/known_hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 "$remote" 'set -eu; t="$HOME/www/anytoour.ru/_preview/search3-anex-candidate"; for f in api-anex-search3-preview.php app/integrations/anex-additional-prices-batch.php app/integrations/anex-program-observation-runtime.php app/integrations/anex-apd-cache-runtime.php app/integrations/anex-program-apd-store.php app/integrations/anex-anytour-offer-autosave.php; do test -f "$t/$f" && test ! -L "$t/$f"; sha256sum "$t/$f"; done' > "$RUNNER_TEMP/runtime-hashes.txt"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          names=[
            ('v2/api-anex-search3-preview.php','api-anex-search3-preview.php'),
            ('app/integrations/anex-additional-prices-batch.php','app/integrations/anex-additional-prices-batch.php'),
            ('app/integrations/anex-program-observation-runtime.php','app/integrations/anex-program-observation-runtime.php'),
            ('app/integrations/anex-apd-cache-runtime.php','app/integrations/anex-apd-cache-runtime.php'),
            ('app/integrations/anex-program-apd-store.php','app/integrations/anex-program-apd-store.php'),
            ('app/integrations/anex-anytour-offer-autosave.php','app/integrations/anex-anytour-offer-autosave.php'),
          ]
          expected={remote:hashlib.sha256((Path('candidate')/local).read_bytes()).hexdigest() for local,remote in names}
          rows=Path(__import__('os').environ['RUNNER_TEMP']+'/runtime-hashes.txt').read_text().splitlines()
          assert len(rows)==len(expected)
          for row in rows:
              digest,path=row.split(None,1)
              rel=path.split('search3-anex-candidate/',1)[-1]
              assert expected[rel]==digest,(rel,digest,expected.get(rel))
          PY
          body="$RUNNER_TEMP/v8-get.json"
          code="$(curl -sS --max-time 20 -o "$body" -w '%{http_code}' 'https://anytoour.ru/_preview/search3-anex-candidate/api-anex-search3-preview.php')"
          test "$code" = 405
          python3 - "$body" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))=={'ok':False,'error':'method_not_allowed'}
          PY

      - name: Mark publication completed
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="$REMOTE_USER@$HOST"; key="$RUNNER_TEMP/v8-ssh/key"; known="$RUNNER_TEMP/v8-ssh/known_hosts"
          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'state':'completed','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'control_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'replay_allowed':False},separators=(',',':')))
          PY
          )"
          printf '%s\n' "$payload" | ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 "$remote" "set -eu; op=\"\$HOME/.anytoour-anex/$OPERATION_ID\"; test -f \"\$op/reservation.json\"; test ! -e \"\$op/completed.json\"; cat > \"\$op/completed.json\"; chmod 600 \"\$op/completed.json\""
      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-runtime-v8-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/v8-artifact/
          if-no-files-found: warn
          retention-days: 14

  population-canary:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve Moscow and Turkey local IDs read-only
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/canary-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/canary-ssh/key"; chmod 600 "$RUNNER_TEMP/canary-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/canary-ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/canary-ssh/known_hosts" 2>/dev/null
          remote="$REMOTE_USER@$HOST"
          ssh -T -i "$RUNNER_TEMP/canary-ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/canary-ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 "$remote" 'cd "$HOME/www/anytoour.ru" && php' > "$RUNNER_TEMP/scope.json" <<'PHP'
          <?php
          declare(strict_types=1);error_reporting(0);ini_set('display_errors','0');
          require_once 'config.php';require_once 'v2/data/db-v1.php';$db=v2_data_db();
          $d=$db->prepare("SELECT id,name FROM catalog_departures WHERE is_active=1 AND name=? ORDER BY id LIMIT 2");$d->execute(['Москва']);$deps=$d->fetchAll(PDO::FETCH_ASSOC);
          $c=$db->prepare("SELECT id,name FROM catalog_countries WHERE is_active=1 AND name=? ORDER BY id LIMIT 2");$c->execute(['Турция']);$countries=$c->fetchAll(PDO::FETCH_ASSOC);
          if(count($deps)!==1||count($countries)!==1)exit(2);
          echo json_encode(['departure_id'=>(int)$deps[0]['id'],'country_id'=>(int)$countries[0]['id']],JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR);
          PHP
          python3 - <<'PY'
          import json,os
          v=json.load(open(os.environ['RUNNER_TEMP']+'/scope.json'))
          assert type(v['departure_id']) is int and v['departure_id']>0
          assert type(v['country_id']) is int and v['country_id']>0
          PY

      - name: Run bounded direct-ANEX search expand APD batch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary-artifact"
          python3 - <<'PY'
          import json,os,subprocess,tempfile
          scope=json.load(open(os.environ['RUNNER_TEMP']+'/scope.json'))
          base='https://anytoour.ru/_preview/search3-anex-candidate/api-anex-search3-preview.php'
          jar=os.environ['RUNNER_TEMP']+'/anex-canary-cookie.txt'
          generation=25061801
          params={
            'departureId':str(scope['departure_id']),'countryId':str(scope['country_id']),
            'dateFrom':'2026-10-12','dateTo':'2026-10-12','nightsFrom':7,'nightsTo':7,'adults':2,'childs':[],
            'meal':'7','hotelCategory':'','hotelRating':'','hotelTypes':[],'hotelIds':[],'hotelServices':[],
            'arrivalId':'','regionIds':[],'subregionIds':[],'operatorIds':[],'priceFrom':'','priceTo':'',
            'currency':'RUB','onlyCharter':False,'onlyDirect':False,
          }
          def post(payload):
              p=subprocess.run(['curl','-sS','--max-time','90','-c',jar,'-b',jar,'-H','Content-Type: application/json',
                '-H','X-Requested-With: AnyTourSearch3','--data-binary',json.dumps(payload,separators=(',',':')),base],
                capture_output=True,text=True,timeout=100)
              if p.returncode: raise SystemExit('curl_failed')
              v=json.loads(p.stdout)
              if v.get('ok') is not True: raise SystemExit('api_error:'+str(v.get('error')))
              return v['data']
          search=post({'action':'search','generation':generation,'params':params})
          search_ref=search.get('search_ref')
          if not isinstance(search_ref,str): raise SystemExit('search_ref_missing')
          groups=[]
          direct=[]
          for h in search.get('hotels') or []:
              lid=h.get('local_id')
              for t in h.get('tours') or []:
                  if t.get('kind')=='group_minimum' and isinstance(t.get('offer_ref'),str) and isinstance(lid,int): groups.append((t['offer_ref'],lid))
                  elif t.get('kind')=='concrete' and t.get('flight_type')=='charter' and isinstance(t.get('offer_ref'),str) and isinstance(lid,int): direct.append((t['offer_ref'],lid))
          candidates=list(direct)
          expands=0
          for ref,lid in groups[:2]:
              if len(candidates)>=3: break
              expanded=post({'action':'expand','generation':generation,'search_ref':search_ref,'offer_ref':ref,'local_hotel_id':lid})
              expands+=1
              for h in expanded.get('hotels') or []:
                  hlid=h.get('local_id')
                  for t in h.get('tours') or []:
                      if t.get('kind')=='concrete' and t.get('flight_type')=='charter' and isinstance(t.get('offer_ref'),str) and isinstance(hlid,int):
                          pair=(t['offer_ref'],hlid)
                          if pair not in candidates:candidates.append(pair)
              if candidates: break
          max_contexts=max(1,5-expands)
          items=[{'offer_ref':ref,'local_hotel_id':lid} for ref,lid in candidates[:max_contexts]]
          batch=None
          if items:
              batch=post({'action':'additional_prices_batch','generation':generation,'search_ref':search_ref,'items':items})
          ready=sum(1 for x in (batch or {}).get('offers',[]) if x.get('finalPriceReady') is True)
          complete=sum(1 for x in (batch or {}).get('offers',[]) if x.get('status')=='additional_prices')
          retryable=sum(1 for x in (batch or {}).get('offers',[]) if x.get('retryable') is True)
          summary={
            'status':'complete','search_hotels':len(search.get('hotels') or []),'group_candidates':len(groups),
            'expand_calls':expands,'charter_candidates':len(candidates),'batch_items':len(items),
            'apd_complete_offers':complete,'final_price_ready_offers':ready,'retryable_offers':retryable,
            'supplier_searches_performed':1,'booking_calls':0,'lead_calls':0,
          }
          open(os.environ['RUNNER_TEMP']+'/canary-artifact/http-summary.json','w').write(json.dumps(summary,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          PY

      - name: Read back ANEX DB population
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="$REMOTE_USER@$HOST"; key="$RUNNER_TEMP/canary-ssh/key"; known="$RUNNER_TEMP/canary-ssh/known_hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 "$remote" 'cd "$HOME/www/anytoour.ru" && php' > "$RUNNER_TEMP/canary-artifact/db-readback.json" <<'PHP'
          <?php
          declare(strict_types=1);error_reporting(0);ini_set('display_errors','0');
          require_once 'config.php';require_once 'v2/data/db-v1.php';$db=v2_data_db();$db->exec('START TRANSACTION READ ONLY');
          $one=static fn(string $sql):(int)$db->query($sql)->fetchColumn();
          $out=[
            'programs'=>$one('SELECT COUNT(*) FROM anytour_anex_programs'),
            'contexts'=>$one('SELECT COUNT(*) FROM anytour_anex_program_contexts'),
            'apd_rates'=>$one('SELECT COUNT(*) FROM anytour_anex_apd_rates'),
            'anex_offers'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex'"),
            'anex_active'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex' AND is_active=1"),
            'anex_ready'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex' AND final_price_ready=1"),
          ];
          $db->rollBack();echo json_encode($out,JSON_THROW_ON_ERROR);
          PHP
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/canary-artifact/db-readback.json'
          v=json.load(open(p))
          assert v['programs']>0 and v['contexts']>0, v
          assert v['apd_rates']>=0 and v['anex_offers']>=0
          print(json.dumps(v,sort_keys=True))
          PY
      - name: Upload sanitized canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-anex-v8-population-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/canary-artifact/
          if-no-files-found: warn
          retention-days: 14
