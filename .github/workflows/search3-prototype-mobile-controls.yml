name: Search3 prototype mobile controls
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'v2/prototype-search/index.html'
      - 'v2/prototype-search/mobile-controls-v1.css'
      - 'tests/search3-prototype-mobile-controls.cjs'
      - 'tests/search3-prototype-mobile-controls-browser.py'
      - 'tests/search3-prototype-mobile-header-browser.py'
      - 'tests/search3-prototype-mobile-destination-browser.py'
      - '.github/workflows/search3-prototype-mobile-controls.yml'
permissions:
  contents: read
jobs:
  mobile-controls-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Static mobile native controls contract
        run: |
          node --check tests/search3-prototype-mobile-controls.cjs
          node tests/search3-prototype-mobile-controls.cjs
          python -m py_compile tests/search3-prototype-mobile-controls-browser.py
          python -m py_compile tests/search3-prototype-mobile-header-browser.py
          python -m py_compile tests/search3-prototype-mobile-destination-browser.py
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser acceptance at mobile boundary and desktop
        run: |
          python tests/search3-prototype-mobile-controls-browser.py
          python tests/search3-prototype-mobile-header-browser.py
          python tests/search3-prototype-mobile-destination-browser.py
      - name: Retain responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-prototype-mobile-controls-${{ github.event.pull_request.head.sha }}
          path: mobile-controls-evidence/
          if-no-files-found: warn
          retention-days: 14
