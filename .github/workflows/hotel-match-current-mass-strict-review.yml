name: MATCH current mass strict review
run-name: MATCH current mass strict review #1971
on:
  push:
    branches: ['feat/match-current-mass-strict-review-1971-20260913']
    paths: ['.github/match-current-mass-strict-review-1971-20260913-v1.arm']
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-current-mass-strict-review-1971-20260913-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-current-mass-strict-review-1971-20260913-v1
  BULK_OPERATION_ID: hotel-match-current-mass-bulk-library-1971-20260913-v1
  HISTORICAL_SOURCE: d397e795335f3a7c0b4878ce38029e22c0dd6f11
  EXPECTED_BULK_BLOB: 4ef3e150bfbec625d1baf1c425e2a2cd6999e875
  EXPECTED_STRICT_BLOB: 9c08276f69a3c827e2a03ed3a01188b57d21fb0a
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reconstruct pinned reviewed libraries
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$HISTORICAL_SOURCE"
          git show "$HISTORICAL_SOURCE:scripts/diagnostics/hotel_match_current_bulk_review.php" > "$RUNNER_TEMP/bulk.php"
          git show "$HISTORICAL_SOURCE:scripts/diagnostics/hotel_match_current_strict_review.php" > "$RUNNER_TEMP/strict.php"
          test "$(git hash-object "$RUNNER_TEMP/bulk.php")" = "$EXPECTED_BULK_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/strict.php")" = "$EXPECTED_STRICT_BLOB"
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          bulk=(p/'bulk.php').read_text()
          strict=(p/'strict.php').read_text()
          old="const MBR_OPERATION = 'hotel-match-current-bulk-review-1971-20260911-v1';"
          new=f"const MBR_OPERATION = '{os.environ['BULK_OPERATION_ID']}';"
          if bulk.count(old)!=1: raise SystemExit('bulk operation constant drift')
          bulk=bulk.replace(old,new)
          old2="const MSR_OPERATION = 'hotel-match-current-strict-review-1971-20260911-v3';"
          new2=f"const MSR_OPERATION = '{os.environ['OPERATION_ID']}';"
          if strict.count(old2)!=1: raise SystemExit('strict operation constant drift')
          strict=strict.replace(old2,new2)
          (p/'bulk-current.php').write_text(bulk)
          (p/'strict-current.php').write_text(strict)
          PY
          php -l "$RUNNER_TEMP/bulk-current.php"
          php -l "$RUNNER_TEMP/strict-current.php"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b' "$RUNNER_TEMP/strict-current.php"
      - name: Reserve immutable read operation
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          x={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_ssh','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'source_sha':os.environ['GITHUB_SHA'],'historical_source':os.environ['HISTORICAL_SOURCE'],'historical_bulk_blob':os.environ['EXPECTED_BULK_BLOB'],'historical_strict_blob':os.environ['EXPECTED_STRICT_BLOB'],'mode':'current_db_repeatable_read_strict','database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          (s/'reservation.json').write_text(json.dumps(x,sort_keys=True)+'\n')
          PY
      - name: Preserve reservation before current DB read
        uses: actions/upload-artifact@v4
        with:
          name: match-current-mass-strict-review-1971-20260913-v1-reservation
          path: ${{ runner.temp }}/hotel-match-current-mass-strict-review-1971-20260913-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Read CURRENT DB and build strict mass package
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shlex,subprocess,tempfile
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP']); state=rt/os.environ['OPERATION_ID']
          helper=Path('scripts/diagnostics/hotel_full_catalog_reconcile.php').read_text()
          bulk=(rt/'bulk-current.php').read_text(); strict=(rt/'strict-current.php').read_text()
          def body(x):
              if x.startswith('<?php'): x=x[5:]
              return x.replace('declare(strict_types=1);','',1)
          h=body(helper); b=body(bulk); s=body(strict)
          b=b.replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          s=s.replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          wrapper="$root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root'); $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php')); if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper'); require_once $dbHelper; $db=v2_data_db(); $out=msr_review($db,MSR_OPERATION); echo fc_json($out),\"\\n\";"
          code="define('FC_LIBRARY_ONLY',true);\n"+h+'\n'+b+'\n'+s+'\n'+wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          if any(not os.environ.get(k,'').strip() for k in req): raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-strict-',dir=os.environ['RUNNER_TEMP']) as td:
              key=Path(td)/'key'; key.write_text(os.environ[req[0]].rstrip()+'\n'); key.chmod(0o600); known=Path(td)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',os.environ[req[2]],os.environ[req[1]],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_')}
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=480,env=clean)
          try: result=json.loads(p.stdout)
          except Exception:
              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'unparseable','exit_code':p.returncode,'stderr_tail':p.stderr[-1000:],'database_writes':0,'mapping_writes':0,'supplier_calls':0},sort_keys=True)+'\n'); raise
          raw=(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); (state/'review.json').write_bytes(raw)
          if p.returncode!=0 or result.get('status')!='completed' or result.get('operation_id')!=os.environ['OPERATION_ID'] or result.get('database_writes')!=0 or result.get('supplier_calls')!=0: raise RuntimeError('strict_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'review_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'consistent_snapshot':True,'readback_verified':True,'counts':result['counts'],'coverage':result['coverage'],'examined':result['examined'],'blocked_reasons':result['blocked_reasons']}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          c=result['counts']; e=result['examined']; cov=result['coverage']
          text=f"MATCH #1971 NEW CURRENT strict mass review `{os.environ['OPERATION_ID']}` completed read-only. Run `{os.environ['GITHUB_RUN_ID']}`, source `{os.environ['GITHUB_SHA']}`. DB/mapping writes **0**, supplier/Tourvisor calls **0**. Examined ANEX observed **{e['anex_observed_examined']}**, staging-only **{e['anex_staging_examined']}**, Andromeda pending core8 **{e['andromeda_pending_examined']}**. Strict safe candidates **{c['safe_candidates']}** (ANEX {c['candidate_anex']}, Andromeda {c['candidate_andromeda']}; direct strict {c['strict_current_rule']}, ANEX→TV bridge {c['cross_provider_anex_tourvisor']}, Andromeda→TV bridge {c['cross_provider_andromeda_tourvisor']}); blocked **{c['blocked']}**, fuzzy demoted **{c['unsafe_fuzzy_demoted']}**. Missing-third core8: ANEX+TV only **{c['anex_tv_only_core8']}**, Andromeda+TV only **{c['andromeda_tv_only_core8']}**. CURRENT coverage triple **{cov['all_three']}**. This is prepared evidence only; no mapping authorization."
          (state/'summary.md').write_text(text+'\n')
          print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - name: Preserve strict package and receipt
        if: always()
        id: result
        uses: actions/upload-artifact@v4
        with:
          name: match-current-mass-strict-review-1971-20260913-v1-result
          path: ${{ runner.temp }}/hotel-match-current-mass-strict-review-1971-20260913-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record substantive result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.result.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf '\nResult artifact `%s`; reservation artifact was durable before SSH.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
