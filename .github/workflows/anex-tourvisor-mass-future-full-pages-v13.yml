          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          state=Path(os.environ['STATE_DIR']); payload=(state/'payload.php').read_bytes()
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_or_supplier_access','source_sha':os.environ['GITHUB_SHA'],'frozen_source_sha':os.environ['FROZEN_SOURCE'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'payload_sha256':hashlib.sha256(payload).hexdigest(),'mode':'current_db_live_tourvisor_anex_full_pages_fresh_dates','lead_day_targets':[20,50],'continue_cap_per_search':6,'forbidden_prior_dates':['2026-09-18','2026-09-25','2026-09-29','2026-10-09','2026-10-13','2026-10-16','2026-10-23','2026-10-27','2026-11-06','2026-11-20','2026-11-27','2026-12-25','2027-01-08','2027-01-22'],'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'historical_operations_replayed':False,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True,indent=2)+'\n').encode(); (state/'reservation.json').write_bytes(raw)
          if (state/'reservation.json').read_bytes()!=raw: raise SystemExit('reservation readback failed')
          PY
      - name: Preserve reservation before live access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-tourvisor-mass-future-full-pages-v13-reservation
          path: /tmp/hotel-match-anex-tourvisor-mass-future-full-pages-v13/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Cool down before sequential live evidence
        run: sleep 60
      - name: Execute one server-CURRENT full-page evidence operation
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          key="$RUNNER_TEMP/anytoour_match_v13_key"
          set +e
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$STATE_DIR/payload.php" > "$STATE_DIR/live.stdout" 2> "$STATE_DIR/live.stderr"
          rc=$?; set -e; export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          state=Path(os.environ['STATE_DIR']); rc=int(os.environ['RC']); stdout=(state/'live.stdout').read_text(errors='replace'); stderr=(state/'live.stderr').read_text(errors='replace')
          lines=[x for x in stdout.splitlines() if x.strip()]; data=None
          if lines:
              try:data=json.loads(lines[-1])
              except Exception: pass
          if not isinstance(data,dict):
              data={'operation_id':os.environ['OPERATION_ID'],'status':'unknown','reason':'result_marker_missing','remote_exit':rc,'stdout_sha256':hashlib.sha256(stdout.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(stderr.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          if data.get('operation_id')!=os.environ['OPERATION_ID']: raise SystemExit('operation mismatch')
          for k in ('database_writes','mapping_writes','booking_calls'):
              if int(data.get(k,0))!=0: raise SystemExit('unsafe side effect '+k)
          forbidden={'2026-09-18','2026-09-25','2026-09-29','2026-10-09','2026-10-13','2026-10-16','2026-10-23','2026-10-27','2026-11-06','2026-11-20','2026-11-27','2026-12-25','2027-01-08','2027-01-22'}
          used={str(x.get('date')) for x in (data.get('searches') or []) if x.get('date')}
          if forbidden & used: raise SystemExit('prior date replay detected '+','.join(sorted(forbidden&used)))
          data.update(source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),remote_exit=rc,stderr_present=bool(stderr.strip()),no_replay=True)
          raw=(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode(); (state/'result.json').write_bytes(raw)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_no_replay' if data.get('status')=='completed' and rc==0 else 'unknown_or_failed_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'booking_calls':0,'no_replay':True}
          (state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          searches=data.get('searches') or []
          summary={'status':data.get('status'),'reason':data.get('reason'),'queue_count':data.get('queue_count'),'queue_by_country':data.get('queue_by_country'),'search_count':len(searches),'search_dates':sorted(used),'search_continue_calls':data.get('search_continue_calls'),'initial_hotels':sum(int(x.get('initial_result_hotels') or 0) for x in searches),'final_union_hotels':sum(int(x.get('result_hotels') or 0) for x in searches),'slices_with_growth':sum(1 for x in searches if int(x.get('result_hotels') or 0)>int(x.get('initial_result_hotels') or 0)),'raw_queue_matches':data.get('raw_queue_matches'),'matched_unique':data.get('matched_unique'),'confirmed_full_path_count':len(data.get('confirmed_full_path') or []),'strong_operator_link_count':len(data.get('strong_operator_link') or []),'conflict_count':len(data.get('conflicts') or []),'remote_exit':rc}
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if data.get('confirmed_full_path') or data.get('strong_operator_link'):
