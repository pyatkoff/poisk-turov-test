  TEMPLATE_OPERATION_ID: hotel-match-anex-tourvisor-mass-future-1971-20260911-v9
  FROZEN_SOURCE: e2d8b06c9cc4b9fccb39c99beef9dbb79fb00d9c
  EXPECTED_TEMPLATE_SHA: 9ee040339cb7c77c0861597fd087c2d39dcba1ade8deb28df3ff7483558bfe8f
  STATE_DIR: /tmp/hotel-match-anex-tourvisor-mass-future-full-pages-v13
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct frozen MATCH collector and derive full-page program
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(cat .github/match-anex-tourvisor-mass-future-full-pages-1971-v13.arm)" = "$OPERATION_ID"
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$FROZEN_SOURCE"
