            git show "$FROZEN_SOURCE:scripts/diagnostics/$f" > "$RUNNER_TEMP/frozen/scripts/diagnostics/$f"
            php -l "$RUNNER_TEMP/frozen/scripts/diagnostics/$f"
          done
          git show "$FROZEN_SOURCE:v2/data/tourvisor-client-v1.php" > "$RUNNER_TEMP/frozen/v2/data/tourvisor-client-v1.php"
          php -l "$RUNNER_TEMP/frozen/v2/data/tourvisor-client-v1.php"
          test "$(sha256sum "$RUNNER_TEMP/frozen/scripts/diagnostics/anex_tourvisor_mass_future_v9.php" | awk '{print $1}')" = "$EXPECTED_TEMPLATE_SHA"
          export FROZEN_ROOT="$RUNNER_TEMP/frozen"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['FROZEN_ROOT'])
          def body(path):
              out=[]
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  s=line.strip()
                  if s in ('<?php','declare(strict_types=1);',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);"): continue
                  if s.startswith('require_once __DIR__'): continue
                  out.append(line)
              return '\n'.join(out)+'\n'
          parts=[body(root/'scripts/diagnostics/hotel_full_catalog_reconcile.php'),body(root/'scripts/diagnostics/hotel_match_current_bulk_review.php'),body(root/'scripts/diagnostics/anex_hotelcode_evidence.php'),body(root/'scripts/diagnostics/anex_tourvisor_hotelcode_evidence_collect.php'),body(root/'v2/data/tourvisor-client-v1.php')]
          c=body(root/'scripts/diagnostics/anex_tourvisor_mass_future_v9.php')
          old_op=os.environ['TEMPLATE_OPERATION_ID']; new_op=os.environ['OPERATION_ID']
          if c.count(old_op)!=1: raise SystemExit('operation template drift')
          c=c.replace(old_op,new_op)
          lead='const MTV8_LEAD_DAYS = [14, 28, 42];'
          repl="const MTV8_LEAD_DAYS = [20, 50];\nconst MTV13_CONTINUE_CAP = 6;\nconst MTV13_FORBIDDEN_DATES = ['2026-09-18','2026-09-25','2026-09-29','2026-10-09','2026-10-13','2026-10-16','2026-10-23','2026-10-27','2026-11-06','2026-11-20','2026-11-27','2026-12-25','2027-01-08','2027-01-22'];"
          if c.count(lead)!=1: raise SystemExit('lead-days template drift')
          c=c.replace(lead,repl)
          counter='    $resultCalls = 0;\n'
          if c.count(counter)!=1: raise SystemExit('result counter drift')
          c=c.replace(counter,counter+'    $continueCallsTotal = 0;\n',1)
          fallback="""        if ($selected === []) {
            $date = ate_pick_date($dateRows, $today->modify('+7 days'));
            if ($date !== null) $selected[$date] = 'future_fallback';
        }
"""
          if c.count(fallback)!=1: raise SystemExit('date selection drift')
          c=c.replace(fallback,fallback+"""        foreach (array_keys($selected) as $candidateDate) {
            if (in_array($candidateDate, MTV13_FORBIDDEN_DATES, true)) unset($selected[$candidateDate]);
        }
""",1)
          old="""            $rows = [];
            $resultError = null;
            foreach ([1000, 500, 100] as $limit) {
                try {
                    $result = v2_data_tv_get('/tours/search/' . $searchId, ['limit' => $limit]);
                    $resultCalls++;
                    $rows = ate_tv_rows($result);
                    $resultError = null;
                    break;
                } catch (Throwable $e) {
                    $resultError = mtv8_safe_message($e);
                }
            }
"""
          new="""            $resultError = null;
            $fetchRows = static function (int $sid) use (&$resultCalls, &$resultError): array {
                foreach ([10000, 5000, 2000, 1000, 500, 100] as $limit) {
                    try {
                        $result = v2_data_tv_get('/tours/search/' . $sid, ['limit' => $limit]);
                        $resultCalls++;
                        $resultError = null;
                        return ate_tv_rows($result);
                    } catch (Throwable $e) {
                        $resultError = mtv8_safe_message($e);
                    }
                }
                return [];
            };
            $mergeHotels = static function (array &$union, array $chunk): void {
                foreach ($chunk as $hotel) {
                    if (!is_array($hotel)) continue;
                    $rawId = $hotel['id'] ?? null;
                    $id = is_array($rawId) ? filter_var($rawId['id'] ?? null, FILTER_VALIDATE_INT) : filter_var($rawId, FILTER_VALIDATE_INT);
                    if ($id === false || (int)$id <= 0) continue;
                    $key = (string)(int)$id;
                    $newTours = is_array($hotel['tours'] ?? null) ? count($hotel['tours']) : 0;
                    $oldTours = isset($union[$key]) && is_array($union[$key]['tours'] ?? null) ? count($union[$key]['tours']) : -1;
                    if (!isset($union[$key]) || $newTours > $oldTours) $union[$key] = $hotel;
                }
            };
            $initialRows = $fetchRows($searchId);
            $initialHotelCount = count($initialRows);
            $union = [];
            $mergeHotels($union, $initialRows);
            $continueCallsForSearch = 0;
            $continueStop = 'continue_cap';
            $continueRounds = [['round'=>0,'returned_hotels'=>$initialHotelCount,'union_hotels'=>count($union)]];
            for ($continueRound = 1; $continueRound <= MTV13_CONTINUE_CAP; $continueRound++) {
                $before = count($union);
                sleep(2);
                try {
                    v2_data_tv_get('/tours/search/' . $searchId . '/continue');
                    $continueCallsForSearch++;
                    $continueCallsTotal++;
                } catch (Throwable $e) {
                    $continueStop = 'continue_unavailable';
                    break;
                }
                $continuedComplete = false;
                for ($continuePoll = 0; $continuePoll < 12; $continuePoll++) {
                    if ($continuePoll > 0) sleep(2);
                    try {
                        $continueStatus = v2_data_tv_get('/tours/search/' . $searchId . '/status', ['operatorStatus'=>false]);
                        $statusCalls++;
                    } catch (Throwable $e) {
                        $continueStop = 'continue_status_error';
                        break 2;
                    }
                    if (ate_search_complete($continueStatus)) { $continuedComplete = true; break; }
                }
                if (!$continuedComplete) { $continueStop = 'continue_not_complete'; break; }
                $chunk = $fetchRows($searchId);
                $mergeHotels($union, $chunk);
                $continueRounds[] = ['round'=>$continueRound,'returned_hotels'=>count($chunk),'union_hotels'=>count($union)];
                if (count($union) === $before) { $continueStop = 'no_growth_after_continue'; break; }
            }
            $rows = array_values($union);
"""
          if c.count(old)!=1: raise SystemExit('result block drift')
          c=c.replace(old,new,1)
          search_line="                'result_hotels' => count($rows),\n"
          if c.count(search_line)!=1: raise SystemExit('search summary drift')
          c=c.replace(search_line,"                'initial_result_hotels' => $initialHotelCount,\n                'result_hotels' => count($rows),\n                'continue_calls' => $continueCallsForSearch,\n                'continue_stop' => $continueStop,\n                'continue_rounds' => $continueRounds,\n",1)
          if c.count("'search_continue_calls' => 0,")<3: raise SystemExit('continue output drift')
          c=c.replace("'search_continue_calls' => 0,","'search_continue_calls' => $continueCallsTotal,",2)
          c=c.replace("'current_db_live_tourvisor_anex_mass_future_dates'","'current_db_live_tourvisor_anex_mass_future_full_pages_fresh_dates'",1)
          start="            try {\n                $start = v2_data_tv_get('/tours/search', $payload);"
          if c.count(start)!=1: raise SystemExit('search start drift')
          c=c.replace(start,"            sleep(2);\n"+start,1)
          payload="<?php\ndefine('FC_LIBRARY_ONLY', true);\n"+'\n'.join(parts+[c])
          out=Path(os.environ['STATE_DIR'])/'payload.php'; out.write_text(payload,encoding='utf-8')
          PY
          php -l "$STATE_DIR/payload.php"
          grep -Fq "/continue'" "$STATE_DIR/payload.php"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]+' "$RUNNER_TEMP/frozen/scripts/diagnostics/anex_tourvisor_mass_future_v9.php"
      - name: Prepare SSH key and durable reservation
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_match_v13_key"
