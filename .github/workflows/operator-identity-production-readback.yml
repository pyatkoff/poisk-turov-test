name: Operator identity production readback

on:
  push:
    branches: ['diagnostic/operator-identity-readback-20260913']
    paths:
      - '.github/workflows/operator-identity-production-readback.yml'
      - 'diagnostics/operator_identity_production_readback.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate readback script
        shell: bash
        run: php -l diagnostics/operator_identity_production_readback.php >/dev/null

      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Read identity evidence counters
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_tmp="/tmp/anytour-operator-identity-readback-${GITHUB_RUN_ID}.php"
          scp "${opts[@]}" diagnostics/operator_identity_production_readback.php "$remote:$remote_tmp"
          ssh "${opts[@]}" "$remote" "set -euo pipefail; ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" php '$remote_tmp'; rm -f '$remote_tmp'"
