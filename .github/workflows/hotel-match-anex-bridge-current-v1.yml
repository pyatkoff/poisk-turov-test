name: MATCH ANEX bridge CURRENT v1
# Second push arms the workflow after the workflow file itself exists on this branch.
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths:
      - scripts/diagnostics/anex_hotelcode_current_queue_v2.php
      - .github/workflows/hotel-match-anex-bridge-current-v1.yml
permissions: {contents: read, issues: write}
concurrency: {group: match-anex-bridge-current-1971-20260914-v1, cancel-in-progress: false}
env: {OPERATION_ID: hotel-match-anex-bridge-current-1971-20260914-v1}
jobs:
  current:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable CURRENT read
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_ssh","mode":"current_db_read_only","database_writes":0,"supplier_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" >"$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-anex-bridge-current-v1-reservation, path: '${{ runner.temp }}/hotel-match-anex-bridge-current-1971-20260914-v1/reservation.json', retention-days: 90}
      - name: Read CURRENT DB over existing deployment SSH
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/anex_hotelcode_current_queue_v2.php
          python3 - <<'PY'
          import os,subprocess,tempfile,shlex,json,hashlib,pathlib
          state=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          paths=['scripts/diagnostics/hotel_full_catalog_reconcile.php','scripts/diagnostics/hotel_match_current_bulk_review.php','scripts/diagnostics/anex_hotelcode_evidence.php','scripts/diagnostics/anex_hotelcode_current_queue_v2.php']
          def body(p):
            t=pathlib.Path(p).read_text(); t=t.removeprefix('<?php').replace('declare(strict_types=1);','',1)
            for r in ["if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n","if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\nrequire_once __DIR__ . '/anex_hotelcode_evidence.php';\n"]: t=t.replace(r,'',1)
            return t
          code="define('FC_LIBRARY_ONLY',true);\n"+'\n'.join(body(p) for p in paths)+r'''
          $root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');
          $h=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php')); if(!$h)throw new RuntimeException('db_helper'); require_once $h;
          $out=ahq2_review(v2_data_db(),AHQ2_OPERATION); echo fc_json($out),"\n";
          '''
          req=['ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER']; vals=[os.environ.get(k,'').strip() for k in req]
          if not all(vals): raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as td:
            key=pathlib.Path(td)/'key'; key.write_text(vals[0]+'\n'); key.chmod(0o600); known=pathlib.Path(td)/'known'
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',vals[2],vals[1],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
            p=subprocess.run(cmd,text=True,capture_output=True,timeout=480)
          try: x=json.loads(p.stdout)
          except Exception:
            (state/'blocker.json').write_text(json.dumps({'status':'failed','reason':'unparseable','exit':p.returncode,'stderr_tail':p.stderr[-1000:],'database_writes':0})); raise
          (state/'queue.json').write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          if p.returncode or x.get('status')!='completed' or x.get('operation_id')!=os.environ['OPERATION_ID'] or x.get('database_writes')!=0: raise RuntimeError('current_read_not_completed')
          raw=(state/'queue.json').read_bytes(); receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'queue_sha256':hashlib.sha256(raw).hexdigest(),'counts':x['counts'],'examined':x['examined'],'coverage':x['coverage'],'database_writes':0,'supplier_calls':0,'no_replay':True}; (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps({'counts':x['counts'],'examined':x['examined'],'coverage':x['coverage']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-bridge-current-v1-result
          path: '${{ runner.temp }}/hotel-match-anex-bridge-current-1971-20260914-v1/'
          retention-days: 90
