name: INT read ANEX through published local DB-first reader v2

on:
  push:
    branches: ['ops/int-anex-local-reader-readback-20260918-v2']
    paths: ['.github/workflows/int-anex-local-reader-readback-v2.yml']

permissions:
  contents: read

jobs:
  readback:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/ops/int-anex-local-reader-readback-20260918-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read ANEX gates and catch published reader result
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/result"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/ssh/key"; fi
          chmod 600 "$RUNNER_TEMP/ssh/key"; ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1
          ssh -T -i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes             -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null             -o ConnectTimeout=15 "$REMOTE_USER@$HOST" 'php -d display_errors=0 -d log_errors=0' > "$RUNNER_TEMP/result/result.json" <<'PHP'
          <?php
          declare(strict_types=1); error_reporting(0);
          $safe=static function(Throwable $e):string{
            $m=$e->getMessage();
            return preg_match('/\A[A-Za-z0-9_.:-]{1,120}\z/D',$m)?$m:get_class($e);
          };
          $home=rtrim((string)getenv('HOME'),'/');$root=$home.'/www/anytoour.ru';$preview=$root.'/_preview/search3-local-candidate';
          $reader=$preview.'/data/search3-local-results-read-v1.php';
          $out=['schema_version'=>2,'source'=>'int-anex-local-reader-readback-v2','reader_present'=>is_file($reader)&&!is_link($reader)];
          if(!$out['reader_present']){echo json_encode($out)."\n";exit(0);}
          try{require_once $reader;}catch(Throwable $e){$out['include_error']=$safe($e);echo json_encode($out)."\n";exit(0);}
          $params=[
            'departureId'=>'1','countryId'=>'4','dateFrom'=>'2026-10-12','dateTo'=>'2026-10-12',
            'nightsFrom'=>7,'nightsTo'=>7,'adults'=>2,'childs'=>[],'meal'=>'AI',
            'hotelCategory'=>'','hotelRating'=>'','hotelTypes'=>[],'hotelIds'=>[],'hotelServices'=>[],
            'arrivalId'=>'','regionIds'=>[],'subregionIds'=>[],'operatorIds'=>[],
            'priceFrom'=>'','priceTo'=>'','currency'=>'RUB','onlyCharter'=>false,'onlyDirect'=>false,
          ];
          $scope=AnyTourSearchScopeV1::fromParams($params);$out['scope_digest']=$scope['digest'];
          $db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
          $stmt=$db->prepare("SELECT
            COUNT(*) raw_rows,
            COALESCE(SUM(o.is_active=1),0) active_rows,
            COALESCE(SUM(o.final_price_ready=1),0) ready_rows,
            COALESCE(SUM(o.expires_at>UTC_TIMESTAMP()),0) unexpired_rows,
            COALESCE(SUM(o.is_active=1 AND o.final_price_ready=1 AND o.expires_at>UTC_TIMESTAMP()),0) active_ready_unexpired,
            COALESCE(SUM(s.latest_complete_refresh_token IS NOT NULL AND s.latest_complete_refresh_token=o.last_refresh_token),0) latest_rows,
            COALESCE(SUM(s.latest_complete_refresh_token IS NOT NULL AND s.latest_complete_refresh_token=o.last_refresh_token AND o.is_active=1 AND o.final_price_ready=1 AND o.expires_at>UTC_TIMESTAMP()),0) latest_visible_candidate_rows
            FROM anytour_offers o
            LEFT JOIN anytour_offer_scope_state s ON s.provider=o.provider AND s.scope_sha256=o.scope_sha256
            WHERE o.provider='anex' AND o.scope_sha256=:scope");
          $stmt->execute(['scope'=>$scope['digest']]);$out['exact_scope']=array_map('intval',(array)$stmt->fetch(PDO::FETCH_ASSOC));
          $out['all_anex']=array_map('intval',(array)$db->query("SELECT COUNT(*) raw_rows,COALESCE(SUM(is_active=1),0) active_rows,COALESCE(SUM(final_price_ready=1),0) ready_rows,COALESCE(SUM(is_active=1 AND final_price_ready=1 AND expires_at>UTC_TIMESTAMP()),0) active_ready_unexpired FROM anytour_offers WHERE provider='anex'")->fetch(PDO::FETCH_ASSOC));
          $sc=$db->prepare("SELECT COUNT(*) scope_rows,COALESCE(SUM(latest_complete_refresh_token IS NOT NULL),0) latest_complete_scopes FROM anytour_offer_scope_state WHERE provider='anex' AND scope_sha256=:scope");
          $sc->execute(['scope'=>$scope['digest']]);$out['scope_state']=array_map('intval',(array)$sc->fetch(PDO::FETCH_ASSOC));
          try{
            $r=search3_local_results_build(v2_data_db(),$params,new DateTimeImmutable('now',new DateTimeZone('UTC')));
            $pc=(array)($r['providerOfferCounts']??[]);
            $out['reader']=['ok'=>true,'match_mode'=>$r['matchMode']??null,'hotel_count'=>$r['hotelCount']??null,'offer_count'=>$r['offerCount']??null,'stored_offer_count'=>$r['storedOfferCount']??null,'withheld_offer_count'=>$r['withheldOfferCount']??null,'anex_offers'=>(int)($pc['anex']??0),'provider_counts'=>$pc];
          }catch(Throwable $e){
            $out['reader']=['ok'=>false,'error'=>$safe($e),'class'=>get_class($e)];
          }
          $out+=['supplier_calls'=>0,'db_writes'=>0,'filesystem_writes'=>0,'search3_publication'=>0,'booking_calls'=>0,'lead_calls'=>0];
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          PHP
          test -s "$RUNNER_TEMP/result/result.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'result','result.json');d=json.load(open(p,encoding='utf-8'))
          assert d['source']=='int-anex-local-reader-readback-v2'
          assert d.get('supplier_calls',0)==d.get('db_writes',0)==d.get('filesystem_writes',0)==d.get('search3_publication',0)==d.get('booking_calls',0)==d.get('lead_calls',0)==0
          print(json.dumps(d,sort_keys=True))
          PY
      - name: Upload sanitized ANEX readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-anex-local-reader-readback-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/result/result.json
          if-no-files-found: error
          retention-days: 14
