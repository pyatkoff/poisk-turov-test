name: Production smoke

on:
  workflow_run:
    workflows: ['Deploy anytoour.ru']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check only critical production endpoints
        shell: bash
        run: |
          set -euo pipefail
          root='https://anytoour.ru'
          curl -fsS --max-time 20 "$root/" >/tmp/home.html
          curl -fsS --max-time 20 "$root/poisk-turov/" >/tmp/search.html
          curl -fsS --max-time 20 "$root/api-v2.php?action=departures" >/tmp/departures.json
          grep -Fq 'action="/poisk-turov/"' /tmp/home.html
          grep -Fq 'api:"/api-v2.php"' /tmp/search.html
          grep -Fq 'leadApi:"/lead-adapter-v2.php"' /tmp/search.html
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/departures.json'))
          assert isinstance(data,list) and data
          PY
          echo 'PRODUCTION_SMOKE_OK'
