name: Measure V2 results DOM
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/measure-v2-results-dom.yml'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Run live search and count hotel tour rows
        shell: bash
        run: |
          set -euo pipefail
          base='https://anytour.online/poisk-turov-test/v2/api-v2.php'
          from="$(date -d '+2 day' +%Y-%m-%d)"
          till="$(date -d '+9 day' +%Y-%m-%d)"
          curl -k -L -sS --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB" -o /tmp/start.json
          sid="$(python3 -c 'import json; print(json.load(open("/tmp/start.json")).get("searchId",0))')"
          test "$sid" != 0
          for i in $(seq 1 40); do
            sleep 2
            curl -k -L -sS --max-time 45 "$base?action=search_status&searchId=$sid" -o /tmp/status.json
            doneflag="$(python3 -c 'import json; d=json.load(open("/tmp/status.json")); print(1 if int(d.get("progress",0) or 0)>=100 or str(d.get("status","")).lower()=="complete" else 0)')"
            test "$doneflag" = 1 && break
          done
          curl -k -L -sS --max-time 45 "$base?action=search_results&searchId=$sid&limit=25" -o /tmp/r25.json
          curl -k -L -sS --max-time 50 "$base?action=search_continue&searchId=$sid" -o /tmp/continue.json
          for i in $(seq 1 40); do
            sleep 2
            curl -k -L -sS --max-time 45 "$base?action=search_status&searchId=$sid" -o /tmp/status2.json
            doneflag="$(python3 -c 'import json; d=json.load(open("/tmp/status2.json")); print(1 if int(d.get("progress",0) or 0)>=100 or str(d.get("status","")).lower()=="complete" else 0)')"
            test "$doneflag" = 1 && break
          done
          curl -k -L -sS --max-time 45 "$base?action=search_results&searchId=$sid&limit=100" -o /tmp/r100.json
          python3 - <<'PY'
          import json
          for fn,label in [('/tmp/r25.json','25'),('/tmp/r100.json','100')]:
              data=json.load(open(fn))
              counts=[len(x.get('tours') or []) for x in data if isinstance(x,dict)]
              total=sum(counts)
              mx=max(counts or [0])
              gt3=sum(1 for x in counts if x>3)
              capped=sum(min(x,3) for x in counts)
              print(f'RESULTS_{label}_HOTELS={len(data)} TOUR_ROWS={total} MAX_PER_HOTEL={mx} HOTELS_GT3={gt3} ROWS_IF_CAPPED3={capped}')
          PY
