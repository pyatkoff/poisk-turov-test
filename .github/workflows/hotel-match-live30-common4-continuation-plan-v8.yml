name: MATCH COMMON4 continuation plan v8
'on':
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php
      - tests/hotel_match_live30_common4_continuation_plan_v8_test.php
      - .github/workflows/hotel-match-live30-common4-continuation-plan-v8.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-live30-common4-continuation-plan-1971-20260923-v9, cancel-in-progress: false}
env:
  OP: hotel-match-live30-common4-continuation-plan-1971-20260923-v9
  BASE: a295cd06309025906d7d62229a32f4709632f157
  CLAIM: '5802070382'
jobs:
  unit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-continuation-plan-v8-20260923'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php
          php tests/hotel_match_live30_common4_continuation_plan_v8_test.php
          php scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php --self-test
          ! grep -E 'INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php
  live:
    needs: unit
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-continuation-plan-v8-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate source claim and Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-live30-common4-continuation-plan-v8.yml scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php tests/hotel_match_live30_common4_continuation_plan_v8_test.php "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in ['450','1799','hotel_match_live30_common4_continuation_plan_v8.php','safe_to_write_now=false']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(90):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          rm claim.json
      - name: Execute supplier-free continuation plan
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP"
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\" \"\$HOME/$op/payload/app/integrations\";printf '%s\n' '{\"operation\":\"$OP\",\"state\":\"reserved_before_db_read\"}' > \"\$HOME/$op/reservation.json\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php scripts/diagnostics/hotel_match_live30_common4_gap_matrix_v1.php scripts/diagnostics/hotel_match_anex_effective_coverage.php "$remote:$op/payload/scripts/diagnostics/"
          scp "${opts[@]}" app/integrations/anex-search-mapping-registry.php "$remote:$op/payload/app/integrations/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_OPERATIONS_ROOT=\"\$HOME/.anytoour-match/operations\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_live30_common4_continuation_plan_v8.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json result.json receipt.json" >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile(): pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['state']=='live30_common4_continuation_ready' and r['attempted_hotel_count']==450
          assert r['database_writes']==r['mapping_writes']==r['provider_http_calls']==0 and r['safe_to_write_now'] is False
          assert r['attempted_still_current_count']+r['attempted_resolved_count']==450
          assert r['never_attempted_current_count']+r['attempted_still_current_count']==r['current_frontier_count']
          print(json.dumps({k:r[k] for k in ['current_frontier_count','attempted_still_current_count','attempted_resolved_count','never_attempted_current_count','never_attempted_no_missing_count','acquisition_target_count','missing_lane_counts','gap_bucket_counts','exact_lane_count_distribution','acquisition_target_id_sha256']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-continuation-plan-v8-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
