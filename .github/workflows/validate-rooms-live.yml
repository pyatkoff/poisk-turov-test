name: Validate V2 rooms live
on:
  push:
    branches: [main]
    paths:
      - 'v2/room-details-runtime.js'
      - 'v2/api-v2.php'
      - '.github/workflows/validate-rooms-live.yml'
  workflow_dispatch:
concurrency:
  group: ci-validate-rooms-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate rooms from fresh live tours
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "ROOMS_FAIL:$1"; exit 1; }
          base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
          from="$(date -d "+2 day" +%Y-%m-%d)"
          till="$(date -d "+9 day" +%Y-%m-%d)"

          curl -k -L -fsS --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB" >/tmp/v2-rooms-start.json || fail search_start
          search_id="$(python3 -c "import json; d=json.load(open('/tmp/v2-rooms-start.json')); print(d.get('searchId') or '')")"
          test -n "$search_id" || fail search_id
          complete=0
          for attempt in $(seq 1 20); do
            sleep 2
            if curl -k -L -fsS --max-time 45 "$base?action=search_status&searchId=$search_id" >/tmp/v2-rooms-status.json && python3 -c "import json; d=json.load(open('/tmp/v2-rooms-status.json')); raise SystemExit(0 if isinstance(d,dict) and (d.get('progress')==100 or d.get('status')=='complete') else 1)"; then complete=1; break; fi
          done
          test "$complete" = 1 || fail search_not_complete
          curl -k -L -fsS --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25" >/tmp/v2-rooms-results.json || fail search_results
          python3 - <<'PY' >/tmp/v2-room-tour-ids.txt
          import json
          items=json.load(open('/tmp/v2-rooms-results.json'))
          ids=[]
          for hotel in items if isinstance(items,list) else []:
              if not isinstance(hotel,dict): continue
              for tour in hotel.get('tours') or []:
                  if not isinstance(tour,dict) or tour.get('id') is None: continue
                  tid=str(tour['id'])
                  if tid not in ids:
                      ids.append(tid); print(tid)
                  if len(ids)>=12: raise SystemExit
          PY
          test -s /tmp/v2-room-tour-ids.txt || fail no_tours

          : >/tmp/v2-room-candidates.txt
          sampled=0
          while IFS= read -r tid; do
            test -n "$tid" || continue
            if curl -k -L -fsS --max-time 45 "$base?action=tour&tourId=$tid&currency=RUB" >/tmp/v2-room-tour.json; then
              sampled=$((sampled + 1))
              TOUR_ID="$tid" python3 - <<'PY' >>/tmp/v2-room-candidates.txt
          import json, os
          t=json.load(open('/tmp/v2-room-tour.json'))
          vals=[t.get('roomId'),t.get('roomTypeId'),(t.get('room') or {}).get('id') if isinstance(t.get('room'),dict) else None] if isinstance(t,dict) else []
          ids=[]
          for v in vals:
              try: n=int(float(v))
              except (TypeError,ValueError): continue
              if n>0 and n not in ids: ids.append(n)
          if ids: print(os.environ['TOUR_ID']+'|'+','.join(map(str,ids)))
          PY
            fi
          done </tmp/v2-room-tour-ids.txt
          test "$sampled" -ge 3 || fail insufficient_tour_details

          if ! test -s /tmp/v2-room-candidates.txt; then
            echo "ROOMS_LIVE_SKIP searchId=$search_id sampledTours=$sampled reason=no_room_ids_in_fresh_sample"
            exit 0
          fi
          candidate="$(head -1 /tmp/v2-room-candidates.txt)"
          tour_id="${candidate%%|*}"
          room_ids="${candidate#*|}"
          test -n "$tour_id" && test -n "$room_ids" || fail candidate_parse
          code="$(curl -k -L -sS -o /tmp/v2-rooms.json -w "%{http_code}" --max-time 45 --get --data-urlencode "action=rooms" --data-urlencode "ids=$room_ids" "$base")"
          test "$code" = "200" || fail rooms_http
          REQUESTED_IDS="$room_ids" TOUR_ID="$tour_id" SEARCH_ID="$search_id" python3 - <<'PY' || fail rooms_shape
          import json, os
          raw=json.load(open('/tmp/v2-rooms.json'))
          rooms=raw if isinstance(raw,list) else raw.get('rooms',[]) if isinstance(raw,dict) else []
          assert isinstance(rooms,list), 'rooms_not_list'
          requested={int(x) for x in os.environ['REQUESTED_IDS'].split(',') if x}
          returned={int(r['id']) for r in rooms if isinstance(r,dict) and str(r.get('id') or '').isdigit()}
          assert returned & requested, f'no_requested_room_returned:{requested}:{returned}'
          print('ROOMS_LIVE_OK','searchId='+os.environ['SEARCH_ID'],'tourId='+os.environ['TOUR_ID'],'requested='+str(sorted(requested)),'returned='+str(sorted(returned & requested)))
          PY
