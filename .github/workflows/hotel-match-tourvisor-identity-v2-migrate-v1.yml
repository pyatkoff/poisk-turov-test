name: MATCH Tourvisor identity v2 migrate v1

on:
  push:
    branches: [ops/match-tourvisor-identity-v2-migrate-1971-20260917-v1]
    paths: [.github/workflows/hotel-match-tourvisor-identity-v2-migrate-v1.yml]

permissions: {contents: read, actions: read}
concurrency: {group: match-tourvisor-identity-v2-migrate-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tourvisor-identity-v2-migrate-1971-20260917-v1
  MIGRATION_BLOB: c84e65db3231eb297ec0342df64d9c2e22ed02d2
  MIGRATION_PATH: v2/data/migrations/20260917-tour-operator-identity-v2.sql

jobs:
  migrate:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}

      - name: Pin migration and reserve before DB
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object "$MIGRATION_PATH")" = "$MIGRATION_BLOB"
          test "$(grep -c '^ALTER TABLE tour_operator_identity_observations' "$MIGRATION_PATH")" -eq 1
          ! grep -Eiq 'INSERT|UPDATE|DELETE|DROP TABLE|TRUNCATE|https?://' "$MIGRATION_PATH"
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          cp "$MIGRATION_PATH" "$out/migration.sql"
          export MIGRATION_SHA256="$(sha256sum "$MIGRATION_PATH" | awk '{print $1}')"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({
            'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],
            'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,
            'claim_comment_id':5715800847,'migration_blob':os.environ['MIGRATION_BLOB'],
            'migration_sha256':os.environ['MIGRATION_SHA256'],'expected_identity_rows':0,
            'database_writes':0,'schema_writes_planned':1,'mapping_writes':0,
            'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True
          },sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tv-identity-v2-migrate-reservation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hotel-match-tourvisor-identity-v2-migrate-1971-20260917-v1/reservation.json
            ${{ runner.temp }}/hotel-match-tourvisor-identity-v2-migrate-1971-20260917-v1/migration.sql
          retention-days: 90

      - name: Apply exact migration with CURRENT guards
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; cat > \"\$p/migration.sql\"; sync" < <(cat "$out/reservation.json" "$out/migration.sql")
          # The previous compound stdin cannot delimit the two files; write them independently over the same control socket.
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; cat > \"\$p/migration.sql\"; sync" < "$out/migration.sql"
          cat > "$RUNNER_TEMP/migrate.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const OP='hotel-match-tourvisor-identity-v2-migrate-1971-20260917-v1';
          function req($v,$m){if(!$v)throw new RuntimeException($m);} function all(PDO $d,string $s):array{$r=$d->query($s)->fetchAll(PDO::FETCH_ASSOC);req(count($r)<=5000,'row_budget');return$r;} function one(PDO $d,string $s):array{$r=$d->query($s)->fetch(PDO::FETCH_ASSOC);return is_array($r)?$r:[];} function w(string $p,array $v):string{$j=json_encode($v,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR)."\n";req(file_put_contents($p,$j,LOCK_EX)===strlen($j),'write');return hash('sha256',$j);}
          $sha=(string)getenv('MATCH_SOURCE_SHA');req(PHP_SAPI==='cli'&&(string)getenv('MATCH_OPERATION_ID')===OP&&preg_match('/^[a-f0-9]{40}$/D',$sha),'operation_guard');$dir=(string)getenv('HOME').'/.anytoour-match/operations/'.OP;$rv=json_decode((string)file_get_contents($dir.'/reservation.json'),true,32,JSON_THROW_ON_ERROR);req(($rv['state']??'')==='reserved_before_db_access'&&($rv['source_sha']??'')===$sha,'reservation');$migration=(string)file_get_contents($dir.'/migration.sql');req(hash('sha256',$migration)===($rv['migration_sha256']??''),'migration_hash');req(substr_count($migration,'ALTER TABLE tour_operator_identity_observations')===1,'migration_shape');req(!preg_match('/\b(?:INSERT|UPDATE|DELETE|DROP\s+TABLE|TRUNCATE)\b/i',$migration),'migration_write_scope');
          $o=['operation_id'=>OP,'source_sha'=>$sha,'state'=>'failed_no_replay','schema_writes'=>0,'database_row_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0,'no_replay'=>true];$db=null;$locked=false;
          try{$root=realpath(getcwd());req(is_string($root)&&basename($root)==='anytoour.ru','root');require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$locked=(int)$db->query("SELECT GET_LOCK('anytour_match_tv_identity_v2_migrate',0)")->fetchColumn()===1;req($locked,'named_lock');
            $table=one($db,"SELECT ENGINE FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'");req(strtoupper((string)($table['ENGINE']??''))==='INNODB','table_contract');$rows=(int)$db->query("SELECT COUNT(*) FROM tour_operator_identity_observations")->fetchColumn();req($rows===0,'identity_rows_changed');$dups=(int)$db->query("SELECT COUNT(*) FROM (SELECT hotel_id,operator_id FROM tour_operator_identity_observations GROUP BY hotel_id,operator_id HAVING COUNT(*)>1) x")->fetchColumn();req($dups===0,'duplicate_pairs');$cols=all($db,"SELECT COLUMN_NAME,IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'");$cm=[];foreach($cols as$c)$cm[(string)$c['COLUMN_NAME']]=(string)$c['IS_NULLABLE'];req(!isset($cm['native_id_type'],$cm['native_id_value'],$cm['native_id_conflict']),'native_columns_already_present');req(($cm['tour_id']??'')==='NO','tour_id_precondition');$idx=all($db,"SELECT INDEX_NAME,NON_UNIQUE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'");foreach($idx as$i)req((string)$i['INDEX_NAME']!=='uq_operator_identity_hotel_operator','unique_already_present');
            $db->exec($migration);$o['schema_writes']=1;
            $cols2=all($db,"SELECT COLUMN_NAME,IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'");$cm2=[];foreach($cols2 as$c)$cm2[(string)$c['COLUMN_NAME']]=(string)$c['IS_NULLABLE'];req(isset($cm2['native_id_type'],$cm2['native_id_value'],$cm2['native_id_conflict']),'native_columns_missing');req(($cm2['tour_id']??'')==='YES'&&($cm2['operator_link']??'')==='YES','nullable_readback');$idx2=all($db,"SELECT INDEX_NAME,NON_UNIQUE,COLUMN_NAME FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'");$unique=false;$nativeIndex=false;foreach($idx2 as$i){if((string)$i['INDEX_NAME']==='uq_operator_identity_hotel_operator'&&(int)$i['NON_UNIQUE']===0)$unique=true;if((string)$i['INDEX_NAME']==='idx_operator_identity_native')$nativeIndex=true;}req($unique&&$nativeIndex,'index_readback');req((int)$db->query("SELECT COUNT(*) FROM tour_operator_identity_observations")->fetchColumn()===0,'row_count_changed');$o['state']='completed';$o['schema_state']='v2_present';$o['identity_rows_after']=0;$o['unique_hotel_operator_present']=true;$o['native_index_present']=true;$o['read_at_utc']=gmdate('c');
          }catch(Throwable $e){$o['error_code']=preg_match('/^[a-z0-9_]{2,120}$/Di',$e->getMessage())?$e->getMessage():'sanitized_failure';}finally{if($db instanceof PDO&&$locked){try{$db->query("SELECT RELEASE_LOCK('anytour_match_tv_identity_v2_migrate')");}catch(Throwable $ignore){}}}
          $h=w($dir.'/result.json',$o);w($dir.'/receipt.json',['operation_id'=>OP,'source_sha'=>$sha,'state'=>$o['state'],'result_sha256'=>$h,'readback_verified'=>$o['state']==='completed','schema_writes'=>$o['schema_writes'],'database_row_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0,'no_replay'=>true]);echo json_encode($o+['result_sha256'=>$h],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";
          PHP
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < "$RUNNER_TEMP/migrate.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json migration.sql result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';r=json.loads((s/'result.json').read_text());c=json.loads((s/'receipt.json').read_text());h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest();ok=(r.get('state')=='completed' and r.get('schema_state')=='v2_present' and r.get('schema_writes')==1 and r.get('identity_rows_after')==0 and r.get('unique_hotel_operator_present') is True and c.get('result_sha256')==h and c.get('readback_verified') is True and all(r.get(k)==0 for k in ['database_row_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']));g={'verified':ok,'state':r.get('state'),'schema_state':r.get('schema_state'),'schema_writes':r.get('schema_writes'),'identity_rows_after':r.get('identity_rows_after'),'result_sha256':h,'no_replay':True};(p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps(g,ensure_ascii=False,sort_keys=True));raise SystemExit(0 if ok else 2)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-identity-v2-migrate-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tourvisor-identity-v2-migrate-1971-20260917-v1/
          retention-days: 90
