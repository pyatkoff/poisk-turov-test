          (root/'strong.php').write_text(s)
          c=(root/'coord.php').read_text()
          replacements={
            "const HMADDCR_OPERATION = 'hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1';": f"const HMADDCR_OPERATION = '{os.environ['REVIEW_OPERATION_ID']}';",
            "const HMADDCR_DIRECT_RESULT_SHA256 = '86f3cbe232a262fa6c6bcd5d87a56af8167ce52f1dc7b589c7d4605fd57cc7fa';": f"const HMADDCR_DIRECT_RESULT_SHA256 = '{os.environ['COMBINED_RESULT_SHA']}';",
            "const HMADDCR_DIRECT_PLAN_SHA256 = '18ebd5b63c9a5043a9fd573390a0b06331cd099f1956e3d9eea7eb1c2bd9bad0';": f"const HMADDCR_DIRECT_PLAN_SHA256 = '{os.environ['COMBINED_PLAN_SHA']}';",
            "if(count($sources)!==208)": "if(count($sources)!==149)",
          }
