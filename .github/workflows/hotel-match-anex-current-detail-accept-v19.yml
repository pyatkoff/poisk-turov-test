          def write(name,obj):
              raw=(json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); (root/name).write_bytes(raw); return hashlib.sha256(raw).hexdigest()
          cr=write('combined-result.json',combined); cp=write('combined-plan.json',plan)
          (root/'combined-result.sha256').write_text(cr+'\n'); (root/'combined-plan.sha256').write_text(cp+'\n')
          print('COMBINED_SOURCE',target_sha,cr,cp)
          PY
          git fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$PINNED_REVIEW_SOURCE"
          git show "$PINNED_REVIEW_SOURCE:scripts/diagnostics/hotel_match_anex_sold_details_strong_review.php" > "$RUNNER_TEMP/v19-input/strong.php"
          git show "$PINNED_REVIEW_SOURCE:scripts/diagnostics/hotel_match_anex_direct_details_coordinate_review.php" > "$RUNNER_TEMP/v19-input/coord.php"
          export COMBINED_RESULT_SHA="$(cat "$RUNNER_TEMP/v19-input/combined-result.sha256")"
          export COMBINED_PLAN_SHA="$(cat "$RUNNER_TEMP/v19-input/combined-plan.sha256")"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'v19-input'
          s=(root/'strong.php').read_text()
          replacements={
            "const HMASR_OPERATION = 'hotel-match-anex-sold-details-strong-review-1971-20260911-v1';": f"const HMASR_OPERATION = '{os.environ['REVIEW_OPERATION_ID']}';",
            "const HMASR_SOURCE_OPERATION = 'hotel-match-anex-sold-details-review-1971-20260911-v2';": f"const HMASR_SOURCE_OPERATION = '{os.environ['COMBINED_SOURCE_OPERATION']}';",
            "const HMASR_SOURCE_RESULT_SHA256 = '86f3cbe232a262fa6c6bcd5d87a56af8167ce52f1dc7b589c7d4605fd57cc7fa';": f"const HMASR_SOURCE_RESULT_SHA256 = '{os.environ['COMBINED_RESULT_SHA']}';",
          }
          for old,new in replacements.items():
              if s.count(old)!=1: raise SystemExit('strong source drift '+old)
