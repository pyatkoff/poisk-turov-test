        shell: bash
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE ARTIFACT_ID
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads((Path(os.environ['STATE'])/'summary.json').read_text())
          if s['status']=='completed':
              body=f"MATCH #1971 v19 consolidated CURRENT acceptance COMPLETE: **{s['accepted_count']} mappings written and {s['post_commit_readback_count']} post-COMMIT rows verified**; skipped {s['skipped_count']}. DB writes {s['database_writes']}; supplier/Tourvisor calls0. Coverage before `{s['coverage_before']}`, after `{s['coverage_after']}`. Operation `{os.environ['OPERATION_ID']}`, run `{os.environ['GITHUB_RUN_ID']}`, exact source `{os.environ['GITHUB_SHA']}`, result artifact `{os.environ['ARTIFACT_ID']}`, result SHA256 `{s['result_sha256']}`. Immutable/no-replay; ANEX28450→63682 remained explicitly excluded."
          else:
              body=f"MATCH #1971 v19 consolidated CURRENT acceptance stopped safely **before COMMIT**: `{s['reason']}`. DB/mapping writes0. Operation `{os.environ['OPERATION_ID']}`, run `{os.environ['GITHUB_RUN_ID']}`, exact source `{os.environ['GITHUB_SHA']}`, artifact `{os.environ['ARTIFACT_ID']}`, result SHA256 `{s['result_sha256']}`. Do not replay this operation."
          (Path(os.environ['STATE'])/'comment.md').write_text(body+'\n')
          PY
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
          gh issue comment 996 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
