            $db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');try{{$before=hmacav19_state($db,false);$db->commit();}}catch(Throwable $e){{if($db->inTransaction())$db->rollBack();throw $e;}}
