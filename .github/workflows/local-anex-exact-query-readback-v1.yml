name: LOCAL exact ANEX 4-star query readback

on:
  push:
    branches: ['ops/local-anex-exact-query-readback-20260918-v1']
    paths: ['.github/workflows/local-anex-exact-query-readback-v1.yml']

permissions:
  contents: read

jobs:
  readback:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query published DB-first endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/result"
          page='https://anytoour.ru/_preview/search3-local-candidate/poisk-turov/?from=1&country=4&dateFrom=2026-09-19&dateTo=2026-09-22&daysFrom=7&daysTill=10&count_people=2&child_count=0&stars=4'
          endpoint='https://anytoour.ru/_preview/search3-local-candidate/data/search3-local-results-read-v1.php'
          page_code="$(curl --silent --show-error --location --max-time 30 --output "$RUNNER_TEMP/result/page.html" --write-out '%{http_code}' "$page")"
          test "$page_code" = 200
          grep -qi 'noindex' "$RUNNER_TEMP/result/page.html"
          cat > "$RUNNER_TEMP/result/request.json" <<'JSON'
          {"params":{"departureId":"1","countryId":"4","dateFrom":"2026-09-19","dateTo":"2026-09-22","nightsFrom":7,"nightsTo":10,"adults":2,"childs":[],"meal":"","hotelCategory":"4","hotelRating":"","hotelTypes":[],"hotelIds":[],"hotelServices":[],"arrivalId":"","regionIds":[],"subregionIds":[],"operatorIds":[],"priceFrom":"","priceTo":"","currency":"RUB","onlyCharter":false,"onlyDirect":false}}
          JSON
          api_code="$(curl --silent --show-error --max-time 60 --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json' \
            --header 'X-Requested-With: AnyTourSearch3' \
            --data-binary @"$RUNNER_TEMP/result/request.json" \
            --output "$RUNNER_TEMP/result/response.json" --write-out '%{http_code}' "$endpoint")"
          API_CODE="$api_code" PAGE_CODE="$page_code" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'result'
          payload=json.loads((root/'response.json').read_text(encoding='utf-8'))
          assert os.environ['API_CODE']=='200', (os.environ['API_CODE'],payload)
          assert payload.get('ok') is True and isinstance(payload.get('data'),dict), payload
          d=payload['data']
          assert d.get('source')=='anytour-db-first-results-v1'
          assert d.get('scope',{}).get('hotelCategory')=='4'
          assert d.get('matchMode')=='compatible', d
          assert d.get('selectionAuthority') is False
          counts=d.get('providerOfferCounts')
          assert isinstance(counts,dict), counts
          assert int(counts.get('anex',0))>0, d
          hotels=d.get('hotels')
          assert isinstance(hotels,list) and hotels, d
          categories=[]
          anex_hotels=0
          for row in hotels:
              hotel=row.get('hotel') or {}
              category=hotel.get('category')
              assert isinstance(category,int) and 4 <= category <= 5, (hotel.get('id'),category)
              categories.append(category)
              offers=row.get('offers') or []
              if any((offer or {}).get('provider')=='anex' for offer in offers):
                  anex_hotels+=1
          assert anex_hotels>0
          result={
            'status':'pass',
            'pageHttp':int(os.environ['PAGE_CODE']),
            'apiHttp':int(os.environ['API_CODE']),
            'matchMode':d.get('matchMode'),
            'sourceScopeDigests':len(d.get('sourceScopeDigests') or []),
            'storedOfferCount':d.get('storedOfferCount'),
            'categoryFilteredOfferCount':d.get('categoryFilteredOfferCount'),
            'hotelCount':d.get('hotelCount'),
            'offerCount':d.get('offerCount'),
            'providerOfferCounts':counts,
            'anexHotelCount':anex_hotels,
            'categoryCounts':{str(x):categories.count(x) for x in sorted(set(categories))},
            'selectionAuthority':d.get('selectionAuthority'),
            'supplierCalls':0,
            'dbWrites':0,
            'search3Publication':0,
          }
          (root/'result.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
      - name: Retain exact-query readback
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: local-anex-exact-query-readback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/result/result.json
            ${{ runner.temp }}/result/request.json
            ${{ runner.temp }}/result/response.json
          if-no-files-found: warn
          retention-days: 30
