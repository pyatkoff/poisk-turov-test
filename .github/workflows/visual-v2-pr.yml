name: Visual V2 pull request

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/visual-v2-pr.yml'
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-v2-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit PR V2 assets against production shell
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p visual-pr-artifacts
          cat > ./v2-pr-visual.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const url = process.env.V2_URL;
          const viewports = [
            ['mobile-375',375,812],
            ['mobile-430',430,932],
            ['tablet-768',768,1024],
            ['intermediate-1024',1024,900],
            ['desktop-1440',1440,1000],
          ];
          const root = path.resolve('v2');
          const browserAsset = /\/poisk-turov-test\/v2\/([^/?]+\.(?:js|css))(?:\?.*)?$/i;
          const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
          const plusDays = days => { const d=new Date(); d.setDate(d.getDate()+days); return iso(d); };

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const report=[];
            let failed=false;
            for(const [name,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e).slice(0,500)));
              await page.route('**/*', async route => {
                const match=new URL(route.request().url()).pathname.match(browserAsset);
                if(!match)return route.continue();
                const file=path.join(root,path.basename(match[1]));
                if(!fs.existsSync(file))return route.continue();
                const ext=path.extname(file).toLowerCase();
                return route.fulfill({status:200,contentType:ext==='.css'?'text/css':'application/javascript',body:fs.readFileSync(file)});
              });
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(5000);
              const initial=await page.evaluate(()=>({
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2,
                hero:!!document.querySelector('.v2-product-hero'),
                search:!!document.querySelector('.search-card'),
                dates:!!document.querySelector('.dates-picker'),
                guests:!!document.querySelector('.guests-picker'),
                resultsVisible:(()=>{const e=document.querySelector('#resultsTools');return !!e&&!e.hidden&&getComputedStyle(e).display!=='none';})(),
              }));
              await page.screenshot({path:`visual-pr-artifacts/${name}-initial.png`,fullPage:true});

              await page.locator('.dates-picker summary').click();
              await page.waitForTimeout(150);
              const dateState=await page.evaluate(({fromValue,toValue})=>{
                const from=document.querySelector('input[name="dateFrom"]');
                const to=document.querySelector('input[name="dateTo"]');
                from.value=fromValue;
                from.dispatchEvent(new Event('change',{bubbles:true}));
                to.value=toValue;
                to.dispatchEvent(new Event('change',{bubbles:true}));
                const picker=document.querySelector('.dates-picker');
                return {open:!!picker?.open,min:from?.min||'',toMin:to?.min||'',toMax:to?.max||'',hint:document.querySelector('.dates-hint')?.textContent||''};
              },{fromValue:plusDays(5),toValue:plusDays(40)});
              await page.waitForTimeout(150);
              await page.screenshot({path:`visual-pr-artifacts/${name}-dates.png`,fullPage:true});

              await page.locator('.dates-picker .picker-done').click();
              const datesDoneClosed=await page.locator('.dates-picker').evaluate(el=>!el.open);
              await page.locator('.guests-picker summary').click();
              await page.waitForTimeout(100);
              await page.locator('#childCount').evaluate(el=>{el.value='2';el.dispatchEvent(new Event('change',{bubbles:true}));});
              await page.waitForTimeout(200);
              const guestState=await page.evaluate(()=>{
                const dates=document.querySelector('.dates-picker');
                const guests=document.querySelector('.guests-picker');
                const ages=document.querySelector('#childAges');
                const panel=document.querySelector('.guests-panel');
                return {
                  datesClosed:!dates?.open,
                  guestsOpen:!!guests?.open,
                  agesVisible:!!ages&&!ages.hidden&&getComputedStyle(ages).display!=='none',
                  agesInsidePanel:!!ages&&!!panel&&panel.contains(ages),
                  ageCount:ages?.querySelectorAll('select[name="child_age[]"]').length||0,
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2,
                };
              });
              await page.screenshot({path:`visual-pr-artifacts/${name}-guests.png`,fullPage:true});
              await page.locator('.guests-picker .picker-done').click();
              const doneClosed=await page.locator('.guests-picker').evaluate(el=>!el.open);

              const singleOpen=await page.evaluate(async()=>{
                const dates=document.querySelector('.dates-picker');
                const guests=document.querySelector('.guests-picker');
                dates.open=true;
                await new Promise(r=>setTimeout(r,0));
                guests.open=true;
                await new Promise(r=>setTimeout(r,0));
                const ok=!dates.open&&guests.open;
                guests.open=false;
                return ok;
              });

              await page.locator('details.extras > summary').click();
              await page.waitForTimeout(150);
              const advancedState=await page.evaluate(()=>{
                const extras=document.querySelector('details.extras');
                const backdrop=document.querySelector('.search-filters-backdrop');
                const mobile=innerWidth<=700;
                return {
                  open:!!extras?.open,
                  mobile,
                  backdropVisible:!!backdrop&&!backdrop.hidden&&getComputedStyle(backdrop).display!=='none',
                  bodyLocked:document.body.classList.contains('v2-advanced-filters-open'),
                  position:extras?getComputedStyle(extras).position:'',
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2,
                };
              });
              await page.screenshot({path:`visual-pr-artifacts/${name}-advanced.png`,fullPage:true});
              if(advancedState.mobile)await page.locator('.search-filters-backdrop').click({position:{x:5,y:5}});else await page.locator('details.extras > summary').click();
              const advancedClosed=await page.locator('details.extras').evaluate(el=>!el.open);

              const resultState=await page.evaluate(()=>{
                const fixture=[
                  {id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,country:{name:'Турция'},region:{name:'Анталья'},subRegion:{name:'Лара'},tours:[
                    {id:'tour-901-a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'},roomType:'Standard Sea View',placement:'DBL',operator:{name:'ANEX'},isCharter:true},
                    {id:'tour-901-b',date:'12.09.2026',nights:9,price:142000,meal:{name:'Ультра всё включено'},roomType:'Deluxe',placement:'DBL',operator:{name:'PEGAS'}},
                  ]},
                  {id:902,name:'AnyTour Garden Hotel with a deliberately long responsive title',category:4,rating:4.4,seaDistance:650,price:98000,country:{name:'Турция'},region:{name:'Аланья'},tours:[
                    {id:'tour-902-a',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'},roomType:'Family Room',placement:'2ADL',operator:{name:'Coral Travel'}},
                  ]},
                ];
                window.V2Results.render(fixture);
                const cards=[...document.querySelectorAll('.hotel-card')];
                const multi=cards.find(card=>card.dataset.hotelId==='901');
                const tools=document.querySelector('#resultsTools');
                const bar=document.querySelector('.mrf-bar');
                return {
                  cards:cards.length,
                  toolsVisible:!!tools&&!tools.hidden&&getComputedStyle(tools).display!=='none',
                  decisionFacts:multi?multi.querySelectorAll('.hotel-decision-line span').length:0,
                  bestOffer:!!multi?.querySelector('.hotel-best-offer'),
                  tourRows:multi?multi.querySelectorAll('.tour-row').length:0,
                  moreToggle:!!multi?.querySelector('.tour-more-toggle'),
                  mobileFilterVisible:!!bar&&!bar.hidden&&getComputedStyle(bar).display!=='none',
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2,
                };
              });
              await page.waitForTimeout(150);
              await page.screenshot({path:`visual-pr-artifacts/${name}-results.png`,fullPage:true});

              const item={name,width,height,http:response?response.status():0,pageErrors,initial,dateState,datesDoneClosed,guestState,doneClosed,singleOpen,advancedState,advancedClosed,resultState};
              report.push(item);
              const mobileAdvancedBad=advancedState.mobile&&(!advancedState.backdropVisible||!advancedState.bodyLocked||advancedState.position!=='fixed');
              const desktopAdvancedBad=!advancedState.mobile&&advancedState.backdropVisible;
              const expectedTourRows=width<=760?1:2;
              const resultBad=resultState.cards!==2||!resultState.toolsVisible||resultState.decisionFacts<2||!resultState.bestOffer||resultState.tourRows!==expectedTourRows||(width<=760&&!resultState.moreToggle)||(width>760&&resultState.moreToggle)||(width<=760&&!resultState.mobileFilterVisible)||(width>760&&resultState.mobileFilterVisible)||resultState.overflow;
              const bad=item.http!==200||pageErrors.length||initial.overflow||!initial.hero||!initial.search||!initial.dates||!initial.guests||initial.resultsVisible||!dateState.open||!dateState.min||!dateState.toMin||!dateState.toMax||!dateState.hint.includes('21')||!datesDoneClosed||!guestState.datesClosed||!guestState.guestsOpen||!guestState.agesVisible||!guestState.agesInsidePanel||guestState.ageCount!==2||guestState.overflow||!doneClosed||!singleOpen||!advancedState.open||advancedState.overflow||mobileAdvancedBad||desktopAdvancedBad||!advancedClosed||resultBad;
              if(bad)failed=true;
              console.log(`PR_VISUAL ${name} http=${item.http} overflow=${initial.overflow}/${guestState.overflow}/${advancedState.overflow}/${resultState.overflow} dates=${initial.dates} guests=${initial.guests} ages=${guestState.ageCount} single=${singleOpen} advanced=${advancedState.open}/${advancedState.position} results=${resultState.cards}/${resultState.tourRows} more=${resultState.moreToggle} mrf=${resultState.mobileFilterVisible} errors=${pageErrors.length}`);
              await context.close();
            }
            fs.writeFileSync('visual-pr-artifacts/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./v2-pr-visual.cjs

      - name: Upload PR visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-pr-visual-${{ github.event.pull_request.number || 'manual' }}
          path: visual-pr-artifacts/
          retention-days: 14
