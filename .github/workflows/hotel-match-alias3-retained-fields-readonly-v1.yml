name: HOTEL MATCH alias3 retained fields readonly v1
on:
  pull_request:
    paths:
      - scripts/diagnostics/hotel_match_alias3_retained_fields_readonly_v1.py
      - scripts/diagnostics/fixtures/hotel_match_alias3_retained_fields_readonly_v1.json
      - tests/hotel_match_alias3_retained_fields_readonly_v1_test.py
      - .github/workflows/hotel-match-alias3-retained-fields-readonly-v1.yml
  push:
    paths:
      - scripts/diagnostics/hotel_match_alias3_retained_fields_readonly_v1.py
      - scripts/diagnostics/fixtures/hotel_match_alias3_retained_fields_readonly_v1.json
      - tests/hotel_match_alias3_retained_fields_readonly_v1_test.py
      - .github/workflows/hotel-match-alias3-retained-fields-readonly-v1.yml
permissions:
  contents: read
jobs:
  alias3-retained-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/diagnostics/hotel_match_alias3_retained_fields_readonly_v1.py
      - run: python tests/hotel_match_alias3_retained_fields_readonly_v1_test.py
      - run: python scripts/diagnostics/hotel_match_alias3_retained_fields_readonly_v1.py --self-test
