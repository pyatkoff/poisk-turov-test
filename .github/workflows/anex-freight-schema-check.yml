name: ANEX FreightMonitor schema evidence
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_freight_schema_capture.py'
      - 'tests/anex_freight_schema_capture_test.py'
      - 'scripts/diagnostics/anex_freight_ref_binding.py'
      - 'tests/anex_freight_ref_binding_test.py'
      - '.github/workflows/anex-freight-schema-check.yml'
  push:
    branches:
      - 'ops/int-anex-freight-schema-20260913'
      - 'ops/int-anex-freight-ref-binding-fix-20260913'
    paths:
      - '.github/ops/anex-freight-schema-20260913'
      - '.github/ops/anex-freight-ref-binding-fix-20260913'
permissions:
  contents: read
concurrency:
  group: anex-freight-schema-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate freight evidence without network
        run: |
          python3 -B tests/anex_freight_schema_capture_test.py
          python3 -B tests/anex_freight_ref_binding_test.py
          python3 -m py_compile scripts/diagnostics/anex_freight_ref_binding.py
          python3 -B - <<'PY' > /tmp/anex-freight-schema.php
          import sys
          sys.path.insert(0, 'scripts/diagnostics')
          import anex_freight_schema_capture as capture
          print('<?php')
          print(capture.php_source())
          PY
          php -l /tmp/anex-freight-schema.php
          python3 -B - <<'PY' > /tmp/anex-freight-ref-binding.php
          import sys
          sys.path.insert(0, 'scripts/diagnostics')
          import anex_freight_ref_binding as binding
          print('<?php')
          print(binding.php_source())
          PY
          php -l /tmp/anex-freight-ref-binding.php
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts/diagnostics')
          import anex_freight_ref_binding as binding_module
          src=Path('scripts/diagnostics/anex_freight_schema_capture.py').read_text()
          assert "EXPERIMENT='anex_freight_schema_20260913_v1'" in src
          assert "'program':'2637'" in src and "'hotel_external_id':'25084'" in src
          assert "FreightMonitor_FREIGHTSBYPACKET" in src
          assert "'additional_prices_requests'=>0" in src and "'tourvisor_requests'=>0" in src and "'andromeda_requests'=>0" in src
          for forbidden in ('ANEX_B2B_TOKEN','AnyTourAnexAdditionalPricesClient','->bron(','broninit(','->calc('):
              assert forbidden not in src
          binding=Path('scripts/diagnostics/anex_freight_ref_binding.py').read_text()
          assert "anex_freight_ref_binding_20260913_v1" in binding
          assert "2026-10-19" in binding and "'hotel_external_id': '25084'" in binding
          assert "supplier_freight_refs" in binding and "FreightMonitor_FREIGHTSBYPACKET" in binding
          for forbidden in ('AdditionalPricesDaily','bron_ticket','->bron(','broninit(','->calc('):
              assert forbidden not in binding
          original=binding_module.php_source()
          encoded=base64.b64encode(zlib.compress(original.encode('utf-8'),9)).decode('ascii')
          compact="$src=gzuncompress(base64_decode('"+encoded+"'));if($src===false){fwrite(STDERR,'FREIGHT_REF_BINDING_SOURCE_DECODE');exit(97);}eval($src);"
          assert zlib.decompress(base64.b64decode(encoded)).decode('utf-8') == original
          assert len(compact.encode('utf-8')) < 120000, (len(original.encode('utf-8')),len(compact.encode('utf-8')))
          workflow=Path('.github/workflows/anex-freight-schema-check.yml').read_text()
          assert 'ops/int-anex-freight-schema-20260913' in workflow
          assert 'ops/int-anex-freight-ref-binding-fix-20260913' in workflow
          assert 'ops/int-anex-freight-ref-binding-20260913' not in workflow
          assert 'cancel-in-progress: false' in workflow
          print('ANEX FreightMonitor/ref-binding static boundary + compact argv transport: PASS', len(original.encode('utf-8')), len(compact.encode('utf-8')))
          PY
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-freight-schema-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind schema receipt to exact reviewed source parent
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-freight-schema-20260913'
          test "$(cat control/.github/ops/anex-freight-schema-20260913)" = "source=${SOURCE_SHA};operation=read-only-anex-freight-schema;scenario=Turkey-2026-10-12-7n-2a-AI-GREEN-GOLD-program2637-FreightMonitor-schema;owner=2026-09-13"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Capture one sanitized FreightMonitor schema
        id: capture
        continue-on-error: true
        run: |
          test "$(git -C source rev-parse HEAD)" = '${{ steps.control.outputs.source }}'
          mkdir -m 700 "$RUNNER_TEMP/freight-schema"
          python3 -B source/scripts/diagnostics/anex_freight_schema_capture.py "$RUNNER_TEMP/freight-schema"
      - name: Preserve sanitized FreightMonitor evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-freight-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/freight-schema/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when schema capture did not complete
        if: steps.capture.outcome != 'success'
        run: exit 1
  ref-binding-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-freight-ref-binding-fix-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind ref-comparison receipt to exact reviewed source parent
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-freight-ref-binding-fix-20260913'
          test "$(cat control/.github/ops/anex-freight-ref-binding-fix-20260913)" = "source=${SOURCE_SHA};operation=read-only-anex-freight-ref-binding;scenario=Turkey-2026-10-19-7n-2a-AI-GREEN-GOLD-exact-hotel;owner=2026-09-13"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Compare retained SearchTour refs to same-CATCLAIM FreightMonitor keys
        id: capture
        continue-on-error: true
        run: |
          test "$(git -C source rev-parse HEAD)" = '${{ steps.control.outputs.source }}'
          mkdir -m 700 "$RUNNER_TEMP/freight-ref-binding"
          python3 -B - "$RUNNER_TEMP/freight-ref-binding" <<'PY'
          import base64
          import sys
          import zlib
          sys.path.insert(0,'source/scripts/diagnostics')
          import anex_freight_ref_binding as binding
          import anex_search3_three_source_price as transport
          raw_transport=transport.ssh_php_no_mux
          def compact_transport(source_text,request,maximum_bytes=4000000):
              encoded=base64.b64encode(zlib.compress(source_text.encode('utf-8'),9)).decode('ascii')
              compact="$src=gzuncompress(base64_decode('"+encoded+"'));if($src===false){fwrite(STDERR,'FREIGHT_REF_BINDING_SOURCE_DECODE');exit(97);}eval($src);"
              if len(compact.encode('utf-8')) >= 120000:
                  raise ValueError('freight_ref_binding_compact_source_too_large')
              return raw_transport(compact,request,maximum_bytes=maximum_bytes)
          transport.ssh_php_no_mux=compact_transport
          sys.argv=[binding.__file__,sys.argv[1]]
          binding.main()
          PY
      - name: Preserve sanitized ref-binding evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-freight-ref-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/freight-ref-binding/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when ref binding did not complete
        if: steps.capture.outcome != 'success'
        run: exit 1
