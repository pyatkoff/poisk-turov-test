name: ANEX FreightMonitor schema evidence
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_freight_schema_capture.py'
      - 'tests/anex_freight_schema_capture_test.py'
      - '.github/workflows/anex-freight-schema-check.yml'
  push:
    branches: ['ops/int-anex-freight-schema-20260913']
    paths: ['.github/ops/anex-freight-schema-20260913']
permissions:
  contents: read
concurrency:
  group: anex-freight-schema-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate schema capture without network
        run: |
          python3 -B tests/anex_freight_schema_capture_test.py
          python3 -B - <<'PY' > /tmp/anex-freight-schema.php
          import sys
          sys.path.insert(0, 'scripts/diagnostics')
          import anex_freight_schema_capture as capture
          print('<?php')
          print(capture.php_source())
          PY
          php -l /tmp/anex-freight-schema.php
          python3 - <<'PY'
          from pathlib import Path
          src=Path('scripts/diagnostics/anex_freight_schema_capture.py').read_text()
          assert "EXPERIMENT='anex_freight_schema_20260913_v1'" in src
          assert "'program':'2637'" in src and "'hotel_external_id':'25084'" in src
          assert "FreightMonitor_FREIGHTSBYPACKET" in src
          assert "'additional_prices_requests'=>0" in src and "'tourvisor_requests'=>0" in src and "'andromeda_requests'=>0" in src
          for forbidden in ('ANEX_B2B_TOKEN','AnyTourAnexAdditionalPricesClient','->bron(','broninit(','->calc('):
              assert forbidden not in src
          workflow=Path('.github/workflows/anex-freight-schema-check.yml').read_text()
          assert 'ops/int-anex-freight-schema-20260913' in workflow and 'cancel-in-progress: false' in workflow
          print('ANEX FreightMonitor schema static boundary: PASS')
          PY
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-freight-schema-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind schema receipt to exact reviewed source parent
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-freight-schema-20260913'
          test "$(cat control/.github/ops/anex-freight-schema-20260913)" = "source=${SOURCE_SHA};operation=read-only-anex-freight-schema;scenario=Turkey-2026-10-12-7n-2a-AI-GREEN-GOLD-program2637-FreightMonitor-schema;owner=2026-09-13"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Capture one sanitized FreightMonitor schema
        id: capture
        continue-on-error: true
        run: |
          test "$(git -C source rev-parse HEAD)" = '${{ steps.control.outputs.source }}'
          mkdir -m 700 "$RUNNER_TEMP/freight-schema"
          python3 -B source/scripts/diagnostics/anex_freight_schema_capture.py "$RUNNER_TEMP/freight-schema"
      - name: Preserve sanitized FreightMonitor evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-freight-schema-${{ github.run_id }}
          path: ${{ runner.temp }}/freight-schema/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation when schema capture did not complete
        if: steps.capture.outcome != 'success'
        run: exit 1
