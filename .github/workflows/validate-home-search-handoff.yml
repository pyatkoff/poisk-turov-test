name: Validate standalone home search handoff

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/home-v1.php'
      - 'v2/form-defaults.php'
      - 'v2/poisk-turov/**'
      - '.github/workflows/validate-home-search-handoff.yml'

permissions:
  contents: read

jobs:
  home-search-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage query and routing contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/home-v1.php >/dev/null
          php -l v2/home-entry-v1.php >/dev/null
          php -l v2/poisk-turov/index.php >/dev/null
          mkdir -p /tmp/empty-document-root
          php -d display_errors=1 -r '
            $_SERVER["DOCUMENT_ROOT"]="/tmp/empty-document-root";
            $_SERVER["SCRIPT_NAME"]="/index.php";
            $_SERVER["HTTP_HOST"]="anytoour.ru";
            $_GET=[];
            ob_start(); include "v2/home-entry-v1.php"; $html=ob_get_clean();
            if (strpos($html, "action=\"/poisk-turov/\"") === false) exit(10);
            if (strpos($html, "name=\"daysFrom\"") === false || strpos($html, "name=\"daysTill\"") === false) exit(11);
            if (strpos($html, "data-home-nights") === false || strpos($html, "data-home-nights-till") === false) exit(12);
            if (strpos($html, "https://anytour.online/country/") === false) exit(13);
            if (strpos($html, "https://anytour.online/hot/") === false) exit(14);
            if (strpos($html, "https://anytour.online/contacts/") === false) exit(15);
            if (strpos($html, "https://anytour.online/how-to-buy/") === false) exit(16);
            if (preg_match("~href=\\\"/(country|hot|contacts|how-to-buy)/~", $html)) exit(17);
          '
          grep -Fq "nightsTill.value=nights.value" v2/home-v1.php
          echo HOME_SEARCH_HANDOFF_OK
