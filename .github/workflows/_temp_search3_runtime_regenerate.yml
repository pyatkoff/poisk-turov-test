name: Temp Search3 runtime regenerate
on:
  push:
    branches:
      - fix/search3-selected-return-reveal-offer-20260912
    paths:
      - .github/workflows/_temp_search3_runtime_regenerate.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search3-selected-return-reveal-offer-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - run: node scripts/build/search3-js/shared-runtime.cjs --write
      - name: Commit generated runtime and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temp_search3_runtime_regenerate.yml
          git add v2/search3-shared-runtime.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "SEARCH: regenerate shared runtime after controller change"
          git push origin HEAD:fix/search3-selected-return-reveal-offer-20260912
