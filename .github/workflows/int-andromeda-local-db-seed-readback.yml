name: INT read failed Andromeda local DB seed

on:
  push:
    branches:
      - 'ops/int-andromeda-local-db-seed-20260918-v1'
    paths:
      - '.github/workflows/int-andromeda-local-db-seed-readback.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPERATION_ID: int-andromeda-local-db-seed-1717-20260918-v1
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - name: Read sealed state without supplier access
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          mkdir -p evidence
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 "$remote" 'bash -s' > evidence/readback.json <<'REMOTE'
          set -euo pipefail
          op="$HOME/.anytour-ops/int-andromeda-local-db-seed-1717-20260918-v1"
          site="$HOME/www/anytoour.ru"
          test -d "$op" && test -s "$op/state" && test -f "$op/error.log"
          state="$(cat "$op/state")"
          code="$(python3 - "$op/error.log" <<'PY'
          import re,sys
          s=open(sys.argv[1],errors='ignore').read()
          ids=re.findall(r'ANDROMEDA_[A-Z0-9_]+|ANYTOUR_[A-Z0-9_]+',s)
          classes=re.findall(r'(?:Fatal error:\s+)?Uncaught\s+([A-Za-z0-9_\\]+)|\b(RuntimeException|DomainException|InvalidArgumentException|TypeError|Error)\b',s)
          flat=[]
          for a,b in classes:
              v=a or b
              if v and v not in flat: flat.append(v)
          fatal=re.search(r'Uncaught\\s+[A-Za-z0-9_\\\\]+:\\s*(.*?)\\s+in\\s+',s,re.S)
          msg=fatal.group(1).replace('\\n',' ')[:220] if fatal else 'NO_FATAL_MESSAGE'
          msg=re.sub(r'[^A-Za-z0-9_:\\-\\>\\(\\)\\. ]+','_',msg)
          print((ids[-1] if ids else 'NO_TYPED_CODE')+'|'+(','.join(flat[-3:]) if flat else 'NO_CLASS')+'|'+msg)
          PY
          )"
          cd "$site"
          php -d display_errors=0 <<'PHP' > /tmp/andromeda-db-readback.json
          <?php
          declare(strict_types=1);
          require 'config.php';
          $f=is_file('data/db-v1.php')?'data/db-v1.php':'v2/data/db-v1.php';
          require $f;
          $db=v2_data_db();
          $q=$db->prepare('SELECT COUNT(*) FROM anytour_offers WHERE provider=?');
          $q->execute(['andromeda']);$offers=(int)$q->fetchColumn();
          $q=$db->prepare('SELECT COUNT(*) FROM anytour_offers WHERE provider=? AND is_active=1');
          $q->execute(['andromeda']);$active=(int)$q->fetchColumn();
          echo json_encode([
            'andromeda_offers'=>$offers,
            'andromeda_active'=>$active,
            'all_offers'=>(int)$db->query('SELECT COUNT(*) FROM anytour_offers')->fetchColumn(),
          ],JSON_THROW_ON_ERROR);
          PHP
          python3 - "$state" "$code" /tmp/andromeda-db-readback.json <<'PY'
          import json,sys
          state,code,path=sys.argv[1:]
          db=json.load(open(path))
          print(json.dumps({"operation_state":state,"error_signature":code,"db":db,"supplier_calls":0,"writes":0,"replay":False},sort_keys=True))
          PY
          rm -f /tmp/andromeda-db-readback.json
          REMOTE
          cat evidence/readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-local-seed-readback-${{ github.run_id }}
          path: evidence/
          retention-days: 14
