name: MATCH owner HTTP A pilot
on:
  push:
    branches: [ops/match-owner-dual-lane-http-a-1971-20260918-v1]
    paths: [.github/ops/match-owner-dual-lane-http-a-1971-20260918-v1.execute]
permissions:
  contents: read
concurrency:
  group: match-owner-dual-lane-http-a-1971-20260918-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-owner-dual-lane-http-a-1971-20260918-v1
  RESERVATION_PATH: .github/ops/match-owner-dual-lane-http-a-1971-20260918-v1.json
  EXECUTE_PATH: .github/ops/match-owner-dual-lane-http-a-1971-20260918-v1.execute
  RESERVATION_COMMIT: 26c82a1f5a965e288daf111597643407b14fe1bc
  COHORT_SHA: ba2307cbaad43b1dc6bf35af79131a90f01a4131a356c8d0548d28d1d1d71f90
  ENDPOINT: https://anytoour.ru/_preview/search3-local-candidate/api-v2.php
jobs:
  acquire:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate reservation before provider access
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$EXECUTE_PATH"
          git merge-base --is-ancestor "$RESERVATION_COMMIT" HEAD^
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          r=json.loads(pathlib.Path(os.environ['RESERVATION_PATH']).read_text())
          assert r['operation']==os.environ['OPERATION_ID'] and r['state']=='reserved_before_provider_access'
          assert r['owner_supplemental_tourvisor_limit']==300 and r['tourvisor_used_at_reservation']==0
          assert r['rules']['tourvisor_dates_endpoint'] is False and r['rules']['full_drain_continue'] is True
          assert r['rules']['no_replay_after_first_provider_access'] is True
          assert len(r['cohorts'])==7 and sum(len(x['hotel_ids']) for x in r['cohorts'])==30
          x=dict(r); expected=x.pop('cohort_canonical_sha256')
          raw=json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          assert hashlib.sha256(raw).hexdigest()==expected==os.environ['COHORT_SHA']
          marker=pathlib.Path(os.environ['EXECUTE_PATH']).read_text().strip()
          assert marker==f"operation={os.environ['OPERATION_ID']};reservation={os.environ['RESERVATION_COMMIT']};execute=once;owner=2026-09-18"
          PY
      - name: Execute fresh 30-ID weekly Tourvisor pilot
        id: live
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p terminal
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,time,urllib.error,urllib.parse,urllib.request
          E=os.environ['ENDPOINT']; OP=os.environ['OPERATION_ID']; CAP=300
          R=json.loads(pathlib.Path(os.environ['RESERVATION_PATH']).read_text())
          ledger=pathlib.Path('terminal/request-ledger.ndjson'); calls=0
          def log(row):
              with ledger.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(row,sort_keys=True)+'\n'); f.flush(); os.fsync(f.fileno())
          def req(action,p={},allow404=False):
              global calls
              if calls>=CAP: raise RuntimeError('tv_extra_cap')
              q=[('action',action)]
              for k,v in p.items():
                  if v is None or v=='': continue
                  if isinstance(v,(list,tuple)): q += [(k,str(x)) for x in v]
                  else: q.append((k,str(v).lower() if isinstance(v,bool) else str(v)))
              calls+=1; log({'call':calls,'action':action,'at':int(time.time()),'qsha':hashlib.sha256(urllib.parse.urlencode(q).encode()).hexdigest()})
              print(f'::notice::TV_CALL {calls}/{CAP} {action}',flush=True)
              u=E+'?'+urllib.parse.urlencode(q)
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'AnyTour-MATCH-1971'}),timeout=55) as z:
                      body=z.read(8000000); code=z.status
              except urllib.error.HTTPError as e:
                  body=e.read(1000000); code=e.code
                  if code==404 and allow404:return {'_404':True}
                  try:d=json.loads(body)
                  except:d={}
                  raise RuntimeError(f"gateway_{code}_{d.get('error','')}")
              return json.loads(body)
          def rows(x):
              if isinstance(x,list): return x
              if isinstance(x,dict):
                  for k in ('hotels','results','items','operators'):
                      if isinstance(x.get(k),list): return x[k]
              return []
          def sid(x):
              if isinstance(x,dict):
                  for k in ('searchId','id'):
                      v=x.get(k)
                      if isinstance(v,int) and v>0:return v
                      if isinstance(v,str) and v.isdigit() and int(v)>0:return int(v)
                  for v in x.values():
                      z=sid(v)
                      if z:return z
              elif isinstance(x,list):
                  for v in x:
                      z=sid(v)
                      if z:return z
          def done(x):
              if isinstance(x,dict):
                  if isinstance(x.get('progress'),(int,float)) and x['progress']>=100:return True
                  if str(x.get('status','')).lower() in ('complete','completed','done','ready'):return True
                  return any(done(v) for v in x.values() if isinstance(v,(dict,list)))
              return isinstance(x,list) and any(done(v) for v in x)
          def rcount(x):
              if isinstance(x,dict):
                  for k in ('requestCount','requestsCount','request_count'):
                      v=x.get(k)
                      if isinstance(v,(int,float)):return max(0,int(v))
                      if isinstance(v,str) and v.isdigit():return int(v)
                  for v in x.values():
                      if isinstance(v,(dict,list)):
                          n=rcount(v)
                          if n:return n
              elif isinstance(x,list):
                  for v in x:
                      n=rcount(v)
                      if n:return n
              return 0
          def merge(a,b):
              d={}
              for h in a+b:
                  if not isinstance(h,dict) or not str(h.get('id','')).isdigit():continue
                  i=int(h['id'])
                  if i not in d:d[i]=dict(h);d[i]['tours']=list(h.get('tours') or [])
                  else:
                      seen={str(t.get('id') or t.get('tourId')) for t in d[i].get('tours',[]) if isinstance(t,dict)}
                      for t in h.get('tours') or []:
                          if not isinstance(t,dict):continue
                          k=str(t.get('id') or t.get('tourId'))
                          if k and k not in seen:seen.add(k);d[i]['tours'].append(t)
              return list(d.values())
          def sig(hs):
              H=set();T=set()
              for h in hs:
                  if not isinstance(h,dict) or not str(h.get('id','')).isdigit():continue
                  i=int(h['id']);H.add(i)
                  for t in h.get('tours') or []:
                      if isinstance(t,dict) and (t.get('id') or t.get('tourId')):T.add((i,str(t.get('id') or t.get('tourId'))))
              return len(H),len(T)
          def wait(i):
              for _ in range(20):
                  if done(req('search_status',{'searchId':i})):return
                  time.sleep(2)
              raise RuntimeError('search_timeout')
          def drain(c,oid):
              p={'departureId':c['departure_id'],'countryId':c['country_id'],'dateFrom':c['date_from'],'dateTo':c['date_to'],'nightsFrom':c['nights_from'],'nightsTo':c['nights_to'],'adults':2,'currency':'RUB','onlyCharter':False,'operatorIds':[oid],'hotelIds':c['hotel_ids']}
              i=sid(req('search_start',p))
              if not i:raise RuntimeError('search_id_missing')
              wait(i); a=rows(req('search_results',{'searchId':i,'limit':100})); before=sig(a); rr=[{'round':0,'hotels':before[0],'tours':before[1]}]
              for n in range(1,11):
                  co=req('search_continue',{'searchId':i}); rc=rcount(co)
                  if rc>0:wait(i)
                  a=merge(a,rows(req('search_results',{'searchId':i,'limit':100}))); now=sig(a); added=now[0]-before[0]+now[1]-before[1]
                  rr.append({'round':n,'request_count':rc,'hotels':now[0],'tours':now[1],'added':added})
                  if rc==0 or added==0:return i,a,rr
                  before=now
              raise RuntimeError('continue_cap')
          def refs(x):
              out=set(); urls=[]
              def w(v,k=''):
                  if isinstance(v,dict):
                      for a,b in v.items():w(b,str(a))
                  elif isinstance(v,list):
                      for b in v:w(b,k)
                  elif isinstance(v,str) and ('url' in k.lower() or 'link' in k.lower()) and '://' in v:
                      try:
                          urls.append(v); q=urllib.parse.parse_qs(urllib.parse.urlparse(v).query)
                          for a,vals in q.items():
                              if a.lower() not in ('hotellist','hotelcode','hotel_code','hotelid','hotel_id','hotelinc','hotel'):continue
                              for val in vals:
                                  for z in re.split('[,;]',val):
                                      if z.strip().isdigit() and int(z)>0:out.add(int(z))
                      except:pass
              w(x); return sorted(out),urls[:12]
          result={'operation':OP,'state':'running','cohorts':[],'anchors':[],'holds':[],'database_writes':0,'mapping_writes':0,'no_replay':True}
          try:
              ops=rows(req('operators',{'departureId':1,'countryId':4})); m=[]
              for x in ops:
                  if not isinstance(x,dict):continue
                  n=str(x.get('name','')).lower().replace(' ','').replace('&','')
                  if n in ('anex','anextour','анекс','анекстур') and str(x.get('id','')).isdigit():m.append((int(x['id']),x.get('name')))
              m=list(dict.fromkeys(m))
              if len(m)!=1:raise RuntimeError('anex_operator_not_unique_'+json.dumps(m,ensure_ascii=False))
              oid,oname=m[0];result['operator_id']=oid;result['operator_name']=oname
              da=d404=0; kill=False; seen=set()
              for c in R['cohorts']:
                  i,hs,rounds=drain(c,oid); target=set(map(int,c['hotel_ids']))
                  fresh=[h for h in hs if isinstance(h,dict) and str(h.get('id','')).isdigit() and int(h['id']) in target]
                  C={'country':c['country'],'country_id':c['country_id'],'search_id':i,'target_ids':c['hotel_ids'],'fresh_hotels':len(fresh),'rounds':rounds,'anchors':[],'holds':[]}
                  for h in fresh:
                      lid=int(h['id'])
                      if lid in seen:continue
                      seen.add(lid); rr,urls=refs(h); tours=[t for t in h.get('tours') or [] if isinstance(t,dict) and (t.get('id') or t.get('tourId'))]; used=None
                      if len(rr)!=1 and not kill:
                          for t in tours[:2]:
                              tid=str(t.get('id') or t.get('tourId')); da+=1; d=req('tour',{'tourId':tid,'currency':'RUB'},True)
                              if d.get('_404'):
                                  d404+=1;C['holds'].append({'local_id':lid,'tour_id':tid,'reason':'fresh_detail_404'})
                                  if da>=8 and d404/da>=.25:kill=True
                                  continue
                              r2,u2=refs(d);rr=sorted(set(rr+r2));urls=(urls+u2)[:12];used=tid
                              if len(rr)==1:break
                      if len(rr)==1:
                          a={'local_id':lid,'local_name':h.get('name'),'native_anex_id':rr[0],'fresh_tour_id':used or (str(tours[0].get('id') or tours[0].get('tourId')) if tours else None),'operator_link_urls':urls}
                          C['anchors'].append(a);result['anchors'].append(a)
                      else:
                          q={'local_id':lid,'local_name':h.get('name'),'reason':'detail_404_kill' if kill else ('native_link_not_unique' if rr else 'native_link_missing'),'native_ids':rr};C['holds'].append(q);result['holds'].append(q)
                  C['detail_attempts_total']=da;C['detail_404_total']=d404;C['detail_404_kill']=kill;result['cohorts'].append(C)
              result.update(state='completed_read_only',tv_calls=calls,detail_attempts=da,detail_404=d404,detail_404_kill=kill,fresh_native_anchors=len(result['anchors']),unique_local_anchors=len({a['local_id'] for a in result['anchors']}))
          except Exception as e:
              result.update(state='terminal_failed_no_replay',reason=str(e)[:160],tv_calls=calls)
          pathlib.Path('terminal/result.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          pathlib.Path('terminal/summary.json').write_text(json.dumps({k:result.get(k) for k in ('state','reason','operator_id','operator_name','tv_calls','detail_attempts','detail_404','detail_404_kill','fresh_native_anchors','unique_local_anchors')},ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(pathlib.Path('terminal/summary.json').read_text())
          if result['state']!='completed_read_only':raise SystemExit(2)
          PY
      - name: Seal receipt
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('terminal');p.mkdir(exist_ok=True);r=p/'result.json'
          if not r.exists():r.write_text(json.dumps({'operation':os.environ['OPERATION_ID'],'state':'terminal_failed_no_replay','reason':'live_step_failed','database_writes':0,'mapping_writes':0,'no_replay':True})+'\n')
          raw=r.read_bytes();j=json.loads(raw);L=p/'request-ledger.ndjson';calls=sum(1 for _ in L.open()) if L.exists() else int(j.get('tv_calls',0) or 0)
          x={'operation':os.environ['OPERATION_ID'],'state':j.get('state'),'result_sha256':hashlib.sha256(raw).hexdigest(),'tv_calls':calls,'provider_accessed':calls>0,'database_writes':0,'mapping_writes':0,'no_replay':calls>0}
          (p/'receipt.json').write_text(json.dumps(x,sort_keys=True,indent=2)+'\n');print(json.dumps(x,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-owner-http-a-result
          path: terminal/
          if-no-files-found: error
          retention-days: 90
      - name: Fail after evidence preservation
        if: steps.live.outcome != 'success'
        run: exit 1
