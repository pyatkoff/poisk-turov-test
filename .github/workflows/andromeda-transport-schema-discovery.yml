name: Andromeda transport schema discovery
on:
  push:
    branches:
      - ops/int-andromeda-transport-schema-v1-20260914
permissions:
  contents: read
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reserve immutable one-shot operation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1': raise SystemExit('REPLAY_REFUSED')
          url='https://api.github.com/repos/pyatkoff/poisk-turov-test/actions/workflows/andromeda-transport-schema-discovery.yml/runs?branch=ops%2Fint-andromeda-transport-schema-v1-20260914&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as response: runs=json.load(response)
          current=int(os.environ['GITHUB_RUN_ID'])
          if runs['total_count'] != 1 or any(r['id'] != current for r in runs['workflow_runs']): raise SystemExit('PREVIOUS_OPERATION_REQUIRES_REVIEW')
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'andromeda-transport-schema'
          root.mkdir(mode=0o700)
          report={'state':'reserved','operation':'andromeda-transport-schema-egypt-v1-20260914','source':os.environ['GITHUB_SHA'],'supplier_calls_max':4,'raw_values_persisted':False}
          (root/'reservation.json').write_text(json.dumps(report,separators=(',',':'))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-transport-schema-reservation
          path: ${{ runner.temp }}/andromeda-transport-schema/reservation.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture value-free raw catalog schema
        env:
          ANDROMEDA_USERNAME: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD: ${{ secrets.ANDROMEDA_PASSWORD }}
        run: php scripts/diagnostics/andromeda-transport-schema-capture.php --execute "$RUNNER_TEMP/andromeda-transport-schema"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andromeda-transport-schema-result
          path: |
            ${{ runner.temp }}/andromeda-transport-schema/checkpoint.json
            ${{ runner.temp }}/andromeda-transport-schema/result.json
          if-no-files-found: warn
          retention-days: 30
