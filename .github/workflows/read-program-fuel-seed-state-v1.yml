name: INT read program fuel seed state v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/read-program-fuel-seed-state-v1.yml'
      - 'scripts/diagnostics/intourist_program_fuel_seed_state_readonly_v1.php'
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  contract:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 3419 &&
       github.event.comment.body == '/read-intourist-program-fuel-seed-state-3419-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify read-only contract
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/intourist_program_fuel_seed_state_readonly_v1.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/diagnostics/intourist_program_fuel_seed_state_readonly_v1.php').read_text()
          for x in ['file_put_contents','fwrite(','curl_','PDO','mysqli','getFlights(','changeService(','->calc(','rename(','unlink(','mkdir(']:
              if x in p: raise SystemExit('write/transport forbidden:'+x)
          for x in ["'supplier_calls'=>0","'database_writes'=>0","'filesystem_writes'=>0","operator-program-fuel-v1-"]:
              if x not in p: raise SystemExit('missing read contract:'+x)
          print('PROGRAM_FUEL_SEED_STATE_READONLY_CONTRACT_OK')
          PY

  read:
    needs: contract
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 3419 &&
      github.event.comment.user.id == 226193297 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/read-intourist-program-fuel-seed-state-3419-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, persist-credentials: false}
      - name: Prepare SSH key
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/program-fuel-seed-state"
          install -d -m 700 "$d"
          printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" > "$d/key"
          chmod 600 "$d/key"
          ssh-keygen -y -f "$d/key" >/dev/null
      - name: Read private seed state only
        env:
          ANYTOOUR_DEPLOY_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          ANYTOOUR_DEPLOY_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/program-fuel-seed-state"
          ssh -T -i "$d/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=$d/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 -o LogLevel=ERROR -l "$ANYTOOUR_DEPLOY_USER" "$ANYTOOUR_DEPLOY_HOST" \
            'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' \
            < scripts/diagnostics/intourist_program_fuel_seed_state_readonly_v1.php > "$d/result.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'program-fuel-seed-state/result.json'
          d=json.loads(p.read_text())
          if d.get('schema_version')!=1 or d.get('source')!='intourist-program-fuel-seed-state-readonly-v1':
              raise SystemExit('contract')
          for k in ('supplier_calls','database_reads','database_writes','filesystem_writes'):
              if d.get(k)!=0: raise SystemExit('side effect:'+k)
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: program-fuel-seed-state-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/program-fuel-seed-state/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/program-fuel-seed-state/key"
