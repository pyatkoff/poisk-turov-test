name: Validate V2 lead idempotency fingerprint
on:
  push:
    branches: [main]
    paths:
      - 'v2/lead-idempotency-v1.php'
      - '.github/workflows/validate-lead-idempotency-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and fingerprint semantics
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/lead-idempotency-v1.php
          php -r '
            require "v2/lead-idempotency-v1.php";
            $base=["phone"=>"+79990000000","tourId"=>"T1","searchId"=>"S1","flight"=>"F1","flightPrice"=>100000,"flightFuel"=>0,"comment"=>"ok"];
            $same=$base;
            $flight=$base;$flight["flight"]="F2";
            $price=$base;$price["flightPrice"]=110000;
            $comment=$base;$comment["comment"]="window seat";
            if(v2_lead_idempotency_key($base)!==v2_lead_idempotency_key($same)) exit(1);
            if(v2_lead_idempotency_key($base)===v2_lead_idempotency_key($flight)) exit(2);
            if(v2_lead_idempotency_key($base)===v2_lead_idempotency_key($price)) exit(3);
            if(v2_lead_idempotency_key($base)===v2_lead_idempotency_key($comment)) exit(4);
            echo "LEAD_IDEMPOTENCY_CONTRACT_OK\n";
          '
