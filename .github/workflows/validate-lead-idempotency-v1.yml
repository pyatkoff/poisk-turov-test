name: Validate V2 lead idempotency fingerprint
on:
  pull_request:
    paths:
      - 'v2/lead-idempotency-v1.php'
      - 'scripts/ci/lead/validate-idempotency.php'
      - '.github/workflows/validate-lead-idempotency-v1.yml'
  push:
    branches: [main]
    paths:
      - 'v2/lead-idempotency-v1.php'
      - 'scripts/ci/lead/validate-idempotency.php'
      - '.github/workflows/validate-lead-idempotency-v1.yml'
  workflow_dispatch:

concurrency:
  group: ci-validate-lead-idempotency-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP and fingerprint semantics
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/lead-idempotency-v1.php
          php -l scripts/ci/lead/validate-idempotency.php
          php scripts/ci/lead/validate-idempotency.php
