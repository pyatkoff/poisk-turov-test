name: Validate rolling PRICE shadow calculation

on:
  push:
    branches: [ops/price-pilot-sample-20261127]
    paths:
      - 'ops/price-pilot/rolling-*'
      - 'ops/price-pilot/sync-day.php'
      - 'ops/price-pilot/apply-rolling-result.php'
      - '.github/workflows/price-rolling-shadow-validation.yml'

permissions:
  contents: read

jobs:
  fixture:
    if: github.repository == 'pyatkoff/poisk-turov-test'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      maria:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: anytour_price_pilot
          MARIADB_USER: fixture
          MARIADB_PASSWORD: fixture-password
        ports:
          - 33067:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Validate both canonical rollups and the archive manifest
        env:
          DB_CONTAINER: ${{ job.services.maria.id }}
          ANYTOUR_DATA_DSN: 'mysql:host=127.0.0.1;port=33067;dbname=anytour_price_pilot;charset=utf8mb4'
          ANYTOUR_DATA_DB_USER: fixture
          ANYTOUR_DATA_DB_PASSWORD: fixture-password
        shell: bash
        run: |
          set -euo pipefail
          cd ops/price-pilot
          bash -n rolling-day.sh
          php -l sync-day.php
          php -l rolling-digest.php
          for file in db-v1.php price-segment-v1.php rollup-price-daily-exact-v1.php rollup-price-daily-v1.php schema-v1.sql; do
            curl -fsSL --proto '=https' --max-time 30 "https://raw.githubusercontent.com/pyatkoff/poisk-turov-test/e527e41ffd95d4170e13276fea22b17e021b80a6/v2/data/$file" -o "$file"
          done
          docker exec -i "$DB_CONTAINER" mariadb -ufixture -pfixture-password anytour_price_pilot < schema-v1.sql
          docker exec -i "$DB_CONTAINER" mariadb -ufixture -pfixture-password anytour_price_pilot <<'FIXTURE'
          INSERT INTO tour_price_observations
            (fingerprint,observed_at,source,search_id,departure_id,country_id,hotel_id,
             departure_date,departure_year,departure_month,nights,adults,price)
          VALUES
            (SHA2('a',256),'2026-11-26 10:00:00','scheduled_monitor',1,1,4,1,'2026-12-01',2026,12,7,2,100),
            (SHA2('b',256),'2026-11-26 10:01:00','scheduled_monitor',2,1,4,1,'2026-12-01',2026,12,7,2,120),
            (SHA2('c',256),'2026-11-27 10:00:00','scheduled_monitor',4,1,4,1,'2026-12-01',2026,12,7,2,999);
          FIXTURE
          for script in rollup-price-daily-exact-v1.php rollup-price-daily-v1.php; do
            php -d date.timezone=UTC "$script" --date=2026-11-26
          done
          php rolling-digest.php db-v1.php 2026-11-26 > digest.json
          php rolling-digest.php db-v1.php 2026-11-26 "$PWD/price-return-ready/2026-11-26" > published.json
          php rolling-digest.php db-v1.php 2026-11-26 "$PWD/price-return-ready/2026-11-26" > retried.json
          cmp published.json retried.json
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          published = json.loads(Path('published.json').read_text())
          digest = json.loads(Path('digest.json').read_text())
          assert published['date'] == digest['date'] == '2026-11-26'
          for item, reference in ((published, digest), (published['coarse'], digest['coarse'])):
              assert item['groups'] == reference['groups'] == 1
              assert item['observations'] == reference['observations'] == 2
              assert item['sha256'] == reference['sha256']
              archive = Path('price-return-ready/2026-11-26', item['sha256'] + '.jsonl.gz')
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == item['gzip_sha256']
              content = gzip.decompress(archive.read_bytes())
              assert hashlib.sha256(content).hexdigest() == item['sha256']
              assert json.loads(content)[-3 if len(json.loads(content)) == 21 else -2] == '120.00'
          print('PRICE_ROLLING_FIXTURE_OK')
          PY
          php -l apply-rolling-result.php
          fixture_day=$(date -u +%F)
          docker exec -i "$DB_CONTAINER" mariadb -ufixture -pfixture-password anytour_price_pilot <<FIXTURE
          INSERT INTO tour_price_observations
            (fingerprint,observed_at,source,search_id,departure_id,country_id,hotel_id,
             departure_date,departure_year,departure_month,nights,adults,price)
          VALUES
            (SHA2('active-a',256),'$fixture_day 10:00:00','scheduled_monitor',1,1,4,1,'2026-12-01',2026,12,7,2,100),
            (SHA2('active-b',256),'$fixture_day 10:01:00','scheduled_monitor',2,1,4,1,'2026-12-01',2026,12,7,2,120);
          FIXTURE
          php -d date.timezone=UTC rollup-price-daily-exact-v1.php "--date=$fixture_day"
          php -d date.timezone=UTC rollup-price-daily-v1.php "--date=$fixture_day"
          php rolling-digest.php db-v1.php "$fixture_day" "$PWD/price-return-ready/$fixture_day" > staged.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          state = Path('staged.json')
          data = json.loads(state.read_text())
          data['source'] = {'date': data['date'], 'observations': 2, 'upper_id': '5'}
          state.write_text(json.dumps(data))
          PY
          directory="price-return-ready/$fixture_day"
          exact=$(php -r 'echo json_decode(file_get_contents("staged.json"),true)["sha256"];')
          coarse=$(php -r 'echo json_decode(file_get_contents("staged.json"),true)["coarse"]["sha256"];')
          docker exec -i "$DB_CONTAINER" mariadb -ufixture -pfixture-password anytour_price_pilot <<FIXTURE
          DELETE FROM tour_price_daily_exact WHERE price_date='$fixture_day';
          UPDATE tour_price_daily SET min_price=99 WHERE price_date='$fixture_day';
          FIXTURE
          args=(db-v1.php staged.json "$directory/$exact.jsonl.gz" "$directory/$coarse.jsonl.gz")
          sql() {
            docker exec -i "$DB_CONTAINER" mariadb -N -ufixture -pfixture-password anytour_price_pilot
          }
          sql <<FIXTURE
          INSERT INTO tour_price_daily
            (price_date,departure_id,country_id,hotel_id,departure_year,departure_month,nights,adults,
             min_price,median_price,max_price,observation_count,calculated_at)
          VALUES ('$fixture_day',1,4,2,2026,12,7,2,70,70,70,1,NOW());
          FIXTURE
          if php apply-rolling-result.php "${args[@]}" --apply > failed.txt 2>&1; then
            echo 'Publication unexpectedly removed a historical result' >&2
            exit 2
          fi
          grep -qx 'PRICE_ROLLING_APPLY_FAILED WOULD_REMOVE_HISTORY' failed.txt
          unchanged=$(sql <<FIXTURE
          SELECT (SELECT COUNT(*) FROM tour_price_daily_exact WHERE price_date='$fixture_day'),
            (SELECT COUNT(*) FROM tour_price_daily_exact WHERE price_date='2026-11-26'),
            (SELECT COUNT(*) FROM tour_price_daily WHERE price_date='$fixture_day' AND hotel_id=2);
          FIXTURE
          )
          [[ "$unchanged" == $'0\t1\t1' ]]
          sql <<< "DELETE FROM tour_price_daily WHERE price_date='$fixture_day' AND hotel_id=2;"
          php apply-rolling-result.php "${args[@]}" --rehearse | tee rehearsed.txt
          grep -q '"exact":{"old_only":0,"changed":1},"coarse":{"old_only":0,"changed":1}' rehearsed.txt
          php apply-rolling-result.php "${args[@]}" --apply | tee applied.txt
          grep -q '"exact":{"old_only":0,"changed":1},"coarse":{"old_only":0,"changed":1}' applied.txt
          php apply-rolling-result.php "${args[@]}" --apply | tee retried.txt
          grep -q '"exact":{"old_only":0,"changed":0},"coarse":{"old_only":0,"changed":0}' retried.txt
          echo PRICE_ROLLING_APPLY_FIXTURE_OK
