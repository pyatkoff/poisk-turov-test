name: MATCH received non-ANEX fuzzy CURRENT v2
on:
  push:
    branches: [ops/match-received-nonanex-current-1971-20260916-v1]
    paths:
      - scripts/diagnostics/hotel_match_received_nonanex_fuzzy_bundle.py
      - .github/workflows/hotel-match-received-nonanex-fuzzy-v2.yml
permissions: {contents: read}
concurrency: {group: match-received-nonanex-fuzzy-1971-v2, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-received-nonanex-fuzzy-1971-20260916-v2
jobs:
  fuzzy-current:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Build and validate bounded strong-fuzzy guard
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/diagnostics/hotel_match_received_nonanex_current_bundle.py scripts/diagnostics/hotel_match_received_nonanex_fuzzy_bundle.py
          test "$(sha256sum reports/hotel-match-received-union-current-20260915.json | awk '{print $1}')" = d9a9a9cbbb8b4d3f77600c309fac8aa4334ebcb0812888725504c580bbdba8c6
          out="$RUNNER_TEMP/nonanex-fuzzy.php"
          python3 scripts/diagnostics/hotel_match_received_nonanex_fuzzy_bundle.py "$out" | tee "$RUNNER_TEMP/bundle.json"
          php -l "$out"
          php "$out" --self-test
          python3 - "$out" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          assert 'START TRANSACTION READ ONLY' in s
          assert 'hm_rank_fuzzy' in s and 'best>=0.94' in s and 'margin>=0.12' in s
          assert 'hm_edit1($x,$y)!==1' in s and 'count($at)!==count($bt)' in s
          assert not re.search(r'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',s,re.I)
          assert 'operator_5' not in s
          print('fuzzy_guard_contract_PASS')
          PY
      - name: Reserve before SSH or database access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];p.mkdir(mode=0o700)
          d={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_db_access','coordination_issue':2530,'claim_comment_id':5691367615,'queue_issue':1971,'purpose':'strong-fuzzy CURRENT guard for exactly 37 v1 name-only Biblio holds','parent_result_sha256':'9c851185282fb85bb56e281a65fb56f6c3daf26686cd3b6a72a7dbdc355f41e6','database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          (p/'reservation.json').write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-received-nonanex-fuzzy-v2-reservation
          path: ${{ runner.temp }}/hotel-match-received-nonanex-fuzzy-1971-20260916-v2/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute one fresh server-CURRENT fuzzy guard pass
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; phpfile="$RUNNER_TEMP/nonanex-fuzzy.php"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test ! -e \"\$p\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php" < "$phpfile" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server'
          r=json.loads((s/'result.json').read_text());receipt=json.loads((s/'receipt.json').read_text());digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert receipt['result_sha256']==digest and receipt['readback_verified'] is True
          assert all(x['operation_id']==os.environ['OPERATION_ID'] and x['source_sha']==os.environ['GITHUB_SHA'] for x in (r,receipt))
          assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==0
          assert r['plan_count']==37 and r['no_replay'] is True
          gate={'operation_id':r['operation_id'],'state':r['state'],'result_sha256':digest,'plan_count':r['plan_count'],'route_counts':r.get('route_counts',{}),'reason_counts':r.get('reason_counts',{}),'guard_passed_frequency':r.get('guard_passed_frequency',0),'readback_verified':True,'database_writes':0}
          (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True)+'\n');print(json.dumps(gate,sort_keys=True))
          assert os.environ['REMOTE_RC']=='0' and r['state']=='completed_read_only'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-received-nonanex-fuzzy-v2-result
          path: ${{ runner.temp }}/hotel-match-received-nonanex-fuzzy-1971-20260916-v2/
          if-no-files-found: warn
          retention-days: 90
