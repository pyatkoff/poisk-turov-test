name: ANEX SearchTour freight money
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_searchtour_freight_money.py'
      - 'tests/anex_searchtour_freight_money_test.py'
      - '.github/workflows/anex-searchtour-freight-money.yml'
  push:
    branches:
      - 'ops/int-anex-searchtour-freight-money-20260913'
    paths:
      - '.github/ops/anex-searchtour-freight-money-20260913'
permissions:
  contents: read
concurrency:
  group: anex-searchtour-freight-money-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Focused SearchTour freight-money regression
        run: |
          python3 -B tests/anex_searchtour_freight_money_test.py
          python3 -m py_compile scripts/diagnostics/anex_searchtour_freight_money.py
  live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/int-anex-searchtour-freight-money-20260913' && github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed source
        id: control
        run: |
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-searchtour-freight-money-20260913'
          test "$(cat control/.github/ops/anex-searchtour-freight-money-20260913)" = "source=${SOURCE_SHA};operation=read-only-anex-searchtour-freight-money;scenario=GREEN-GOLD-2026-10-12-7n-2a-AI-exact-hotel;owner=2026-09-13"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Capture one sanitized SearchTour freight-money schema
        id: schema
        continue-on-error: true
        run: |
          mkdir -m 700 "$RUNNER_TEMP/searchtour-freight-money"
          python3 -B source/scripts/diagnostics/anex_searchtour_freight_money.py "$RUNNER_TEMP/searchtour-freight-money"
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-searchtour-freight-money-${{ github.run_id }}
          path: ${{ runner.temp }}/searchtour-freight-money/
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence preservation
        if: steps.schema.outcome != 'success'
        run: exit 1
