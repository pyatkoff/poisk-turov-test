name: Search3 independent AnyTour catalogue
on:
  pull_request:
    paths:
      - 'v2/data/anytour-canonical-catalog-v1.php'
      - 'v2/data/migrations/20260916-anytour-canonical-catalog.sql'
      - 'v2/data/hotel-presentation-read-v1.php'
      - 'v2/data/hotel-details-v1.php'
      - 'scripts/catalog/anytour_catalog_seed.php'
      - 'scripts/catalog/anytour_catalog_preflight.php'
      - 'tests/anytour_canonical_catalog_test.php'
      - 'tests/anytour_catalog_preflight_test.php'
      - 'tests/anytour_catalog_preflight_mysql_test.php'
      - '.github/workflows/search3-anytour-canonical-catalog.yml'
permissions:
  contents: read
jobs:
  canonical-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: anytour_catalog_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Syntax and pure contracts
        run: |
          php -l v2/data/anytour-canonical-catalog-v1.php
          php -l scripts/catalog/anytour_catalog_seed.php
          php -l tests/anytour_canonical_catalog_test.php
          php tests/anytour_canonical_catalog_test.php --unit-only
          php -l scripts/catalog/anytour_catalog_preflight.php
          php -l tests/anytour_catalog_preflight_mysql_test.php
          php tests/anytour_catalog_preflight_test.php
      - name: Actual disposable MySQL migration, seed, rollback and independent reads
        env:
          ANYTOUR_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_catalog_fixture;charset=utf8mb4'
          ANYTOUR_TEST_PASSWORD: fixture-only-password
        run: php tests/anytour_canonical_catalog_test.php
      - name: Actual pre-schema read-only inspection and CLI target guards
        env:
          MYSQL_PWD: fixture-only-password
          ANYTOUR_PREFLIGHT_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_preflight_fixture;charset=utf8mb4'
          ANYTOUR_TEST_PASSWORD: fixture-only-password
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e 'CREATE DATABASE anytour_preflight_fixture CHARACTER SET utf8mb4'
          php tests/anytour_catalog_preflight_mysql_test.php
      - name: Preserve existing safe media normalization
        run: php tests/hotel-details-smoke.php
