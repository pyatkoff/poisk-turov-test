name: Sync AnyTour catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-anytour-catalog.yml'
      - 'v2/data/departures-v1.php'
      - 'v2/data/sync-departures-v1.php'
      - 'v2/data/migrate-departure-countries-v1.php'
      - 'v2/data/destinations-v1.php'
      - 'v2/data/validate-departures-v1.php'
      - 'v2/data/schema-departures-v1.sql'
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Tourvisor country id(s), comma-separated; default Turkey=4'
        required: true
        default: '4'
        type: string

concurrency:
  group: anytour-catalog-sync
  cancel-in-progress: false

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog tooling
        shell: bash
        env:
          COUNTRY_VALUE: ${{ inputs.country || '4' }}
        run: |
          set -euo pipefail
          for f in v2/data/db-v1.php v2/data/tourvisor-client-v1.php v2/data/migrate-departures-v1.php v2/data/migrate-departure-countries-v1.php v2/data/sync-departures-v1.php v2/data/validate-departures-v1.php v2/data/sync-catalog-v1.php v2/data/db-doctor-v1.php v2/data/destinations-v1.php; do
            php -l "$f" >/dev/null
          done
          test -s v2/data/schema-v1.sql
          grep -Fq 'name_genitive VARCHAR(180) DEFAULT NULL' v2/data/schema-v1.sql
          grep -Fq 'catalog_departure_countries' v2/data/migrate-departure-countries-v1.php
          grep -Fq 'pairs=' v2/data/sync-departures-v1.php
          [[ "$COUNTRY_VALUE" =~ ^[0-9]+(,[0-9]+)*$ ]]
          echo "ANYTOUR_CATALOG_TOOLING_OK country=$COUNTRY_VALUE"

      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Sync catalog on production
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          COUNTRY_VALUE: ${{ inputs.country || '4' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$COUNTRY_VALUE" =~ ^[0-9]+(,[0-9]+)*$ ]]
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          root='~/www/anytoour.ru'

          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" -r v2/data/. "$remote:$root/data/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru\"
            chmod 600 \"\$root/config.php\"
            php -l \"\$root/data/db-v1.php\" >/dev/null
            php -l \"\$root/data/tourvisor-client-v1.php\" >/dev/null
            php -l \"\$root/data/migrate-departures-v1.php\" >/dev/null
            php -l \"\$root/data/migrate-departure-countries-v1.php\" >/dev/null
            php -l \"\$root/data/sync-departures-v1.php\" >/dev/null
            php -l \"\$root/data/validate-departures-v1.php\" >/dev/null
            php -l \"\$root/data/sync-catalog-v1.php\" >/dev/null
            php \"\$root/data/migrate-departures-v1.php\"
            php \"\$root/data/migrate-departure-countries-v1.php\"
            php \"\$root/data/db-doctor-v1.php\"
            php \"\$root/data/sync-departures-v1.php\"
            php \"\$root/data/validate-departures-v1.php\"
            php \"\$root/data/sync-catalog-v1.php\" --country='$COUNTRY_VALUE'
            php \"\$root/data/db-doctor-v1.php\"
          "
          echo "ANYTOUR_CATALOG_SYNC_OK country=$COUNTRY_VALUE"