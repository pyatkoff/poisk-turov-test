name: Sync AnyTour catalog

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-anytour-catalog.yml'
      - 'tests/local_tv_capture_workflow_test.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-anytour-catalog.yml'
      - 'tests/local_tv_capture_workflow_test.py'
      - 'v2/data/tourvisor-client-v1.php'
      - 'v2/data/departures-v1.php'
      - 'v2/data/sync-departures-v1.php'
      - 'v2/data/migrate-departure-countries-v1.php'
      - 'v2/data/migrate-departure-flight-matrices-v1.php'
      - 'v2/data/migrate-hotel-media-v1.php'
      - 'v2/data/sync-departure-flight-matrices-v1.php'
      - 'v2/data/validate-departure-flight-matrices-v1.php'
      - 'v2/data/destinations-v1.php'
      - 'v2/data/validate-departures-v1.php'
      - 'v2/data/catalog-hotel-sync-plan-v1.php'
      - 'v2/data/schema-departures-v1.sql'
  schedule:
    - cron: '20 2,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Optional Tourvisor country id(s), comma-separated. Empty = auto-select active stale countries.'
        required: false
        default: ''
        type: string
      batch_size:
        description: 'Automatic country batch size (1-10)'
        required: true
        default: '2'
        type: string

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact reviewed permanent LOCAL dependencies for offline workflow tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/poisk-turov-test
          ref: 8af3e190588bf61b067f81838aec3f0201205ec9
          path: local-tv-source
          persist-credentials: false
      - name: Execute copy and collector contracts without network or database
        env:
          LOCAL_TV_CAPTURE_SOURCE_ROOT: ${{ github.workspace }}/local-tv-source
        run: python3 tests/local_tv_capture_workflow_test.py

  sync-catalog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: anytour-catalog-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog tooling
        shell: bash
        env:
          COUNTRY_VALUE: ${{ inputs.country || '' }}
          BATCH_SIZE: ${{ inputs.batch_size || '2' }}
        run: |
          set -euo pipefail
          for f in v2/data/db-v1.php v2/data/tourvisor-client-v1.php v2/data/migrate-departures-v1.php v2/data/migrate-departure-countries-v1.php v2/data/migrate-departure-flight-matrices-v1.php v2/data/migrate-hotel-media-v1.php v2/data/sync-departures-v1.php v2/data/sync-departure-flight-matrices-v1.php v2/data/validate-departure-flight-matrices-v1.php v2/data/validate-departures-v1.php v2/data/sync-catalog-v1.php v2/data/catalog-hotel-sync-plan-v1.php v2/data/db-doctor-v1.php v2/data/destinations-v1.php; do
            php -l "$f" >/dev/null
          done
          grep -Fq 'DEPARTURE_FLIGHT_MATRICES_OK' v2/data/sync-departure-flight-matrices-v1.php
          grep -Fq 'DEPARTURE_FLIGHT_MATRICES_VALIDATION_OK' v2/data/validate-departure-flight-matrices-v1.php
          grep -Fq 'usleep(550000)' v2/data/sync-departure-flight-matrices-v1.php
          grep -Fq 'primary_image_url' v2/data/migrate-hotel-media-v1.php
          test -s v2/data/schema-v1.sql
          grep -Fq 'catalog_departure_countries' v2/data/catalog-hotel-sync-plan-v1.php
          grep -Fq "CONCAT('hotels:country:'" v2/data/catalog-hotel-sync-plan-v1.php
          grep -Fq '$status === 429' v2/data/tourvisor-client-v1.php
          grep -Fq 'Retry-After:' v2/data/tourvisor-client-v1.php
          php -r "require 'v2/data/tourvisor-client-v1.php'; if (v2_data_tv_retry_delay_seconds(1, null) !== 1 || v2_data_tv_retry_delay_seconds(4, null) !== 8 || v2_data_tv_retry_delay_seconds(1, 99) !== 15) exit(1);"
          if test -n "$COUNTRY_VALUE"; then [[ "$COUNTRY_VALUE" =~ ^[0-9]+(,[0-9]+)*$ ]]; fi
          [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] && test "$BATCH_SIZE" -ge 1 && test "$BATCH_SIZE" -le 10
          echo "ANYTOUR_CATALOG_TOOLING_OK country=${COUNTRY_VALUE:-auto} batch=$BATCH_SIZE"

      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Sync catalog on production
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          COUNTRY_VALUE: ${{ inputs.country || '' }}
          BATCH_SIZE: ${{ inputs.batch_size || '2' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          if test -n "$COUNTRY_VALUE"; then [[ "$COUNTRY_VALUE" =~ ^[0-9]+(,[0-9]+)*$ ]]; fi
          [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] && test "$BATCH_SIZE" -ge 1 && test "$BATCH_SIZE" -le 10
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          root='~/www/anytoour.ru'

          # Shared runtime belongs to its installed owner; fail before copying if absent.
          ssh "${opts[@]}" "$remote" '
            set -e
            root="$HOME/www/anytoour.ru"
            test -s "$root/config.php"
            for dependency in db-v1.php tourvisor-client-v1.php; do
              if ! test -f "$root/data/$dependency" || test -L "$root/data/$dependency"; then
                exit 1
              fi
            done
          '
          # Copy only the CLI entrypoints below; preserve every installed shared backend file.
          scp "${opts[@]}" \
            v2/data/catalog-hotel-sync-plan-v1.php \
            v2/data/migrate-departures-v1.php \
            v2/data/migrate-departure-countries-v1.php \
            v2/data/migrate-departure-flight-matrices-v1.php \
            v2/data/migrate-hotel-media-v1.php \
            v2/data/sync-departures-v1.php \
            v2/data/sync-departure-flight-matrices-v1.php \
            v2/data/validate-departure-flight-matrices-v1.php \
            v2/data/validate-departures-v1.php \
            v2/data/sync-catalog-v1.php \
            v2/data/db-doctor-v1.php \
            "$remote:$root/data/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru\"
                      python3 - <<'PY'
          import os, pathlib, stat
          fields = ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size',
                    'st_mtime_ns', 'st_ctime_ns', 'st_uid', 'st_gid')
          def stamp(value):
              return tuple(getattr(value, key) for key in fields)
          def require(ok):
              if not ok:
                  raise RuntimeError('private_config_metadata')
          directory = file_fd = None
          try:
              root = pathlib.Path.home() / 'www/anytoour.ru'
              require(root.resolve() == root)
              directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              parent = os.fstat(directory)
              require(parent.st_uid == os.geteuid() and not (stat.S_IMODE(parent.st_mode) & 0o022))
              file_fd = os.open('config.php', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
              before = os.fstat(file_fd)
              mode = stat.S_IMODE(before.st_mode)
              require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                  and before.st_uid == os.geteuid() and before.st_size > 0
                  and (mode & 0o400) != 0 and (mode & ~0o644) == 0)
              require(stamp(os.stat('config.php', dir_fd=directory, follow_symlinks=False)) == stamp(before))
              if mode != 0o600:
                  os.fchmod(file_fd, 0o600)
              after = os.fstat(file_fd)
              require(stat.S_IMODE(after.st_mode) == 0o600
                      and stamp(os.stat('config.php', dir_fd=directory, follow_symlinks=False)) == stamp(after))
              if mode == 0o600:
                  require(stamp(after) == stamp(before))
              else:
                  require(all(getattr(after, key) == getattr(before, key)
                              for key in fields if key not in ('st_mode', 'st_ctime_ns')))
              current_parent = os.fstat(directory)
              require(all(getattr(current_parent, key) == getattr(parent, key)
                          for key in ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_uid', 'st_gid')))
              require(root.resolve() == root and os.stat(root, follow_symlinks=False) == current_parent)
              print('ANYTOUR_PRIVATE_CONFIG_MODE_OK')
          except Exception:
              raise SystemExit('ANYTOUR_PRIVATE_CONFIG_MODE_REJECTED')
          finally:
              if file_fd is not None:
                  os.close(file_fd)
              if directory is not None:
                  os.close(directory)
          PY
            php -l \"\$root/data/catalog-hotel-sync-plan-v1.php\" >/dev/null
            php \"\$root/data/migrate-departures-v1.php\"
            php \"\$root/data/migrate-departure-countries-v1.php\"
            php \"\$root/data/migrate-departure-flight-matrices-v1.php\"
            php \"\$root/data/migrate-hotel-media-v1.php\"
            php \"\$root/data/sync-departures-v1.php\"
            php \"\$root/data/sync-departure-flight-matrices-v1.php\"
            php \"\$root/data/validate-departure-flight-matrices-v1.php\"
            php \"\$root/data/validate-departures-v1.php\"
            country='$COUNTRY_VALUE'
            if test -z \"\$country\"; then
              country=\"\$(php \"\$root/data/catalog-hotel-sync-plan-v1.php\" --limit='$BATCH_SIZE')\"
            fi
            if test \"\$country\" = 'NONE' || test -z \"\$country\"; then
              echo 'ANYTOUR_HOTEL_CATALOG_UP_TO_DATE'
              exit 0
            fi
            [[ \"\$country\" =~ ^[0-9]+(,[0-9]+)*$ ]]
            echo \"ANYTOUR_HOTEL_SYNC_SELECTED country=\$country\"
            php \"\$root/data/sync-catalog-v1.php\" --country=\"\$country\"
            php \"\$root/data/db-doctor-v1.php\"
          "
