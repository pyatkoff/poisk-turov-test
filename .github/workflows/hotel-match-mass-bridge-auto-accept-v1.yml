name: MATCH mass bridge auto accept v1
on:
  push:
    branches: ['ops/match-mass-bridge-1971-20260912']
    paths: ['.github/match-mass-bridge-auto-accept-1971-20260912-v1.arm']
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: anytour-match-mass-bridge-auto-accept-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-mass-bridge-auto-accept-1971-20260912-v1
  OUT: /tmp/match-mass-bridge-auto-v1
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate immutable operation and reserve
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_RUN_NUMBER" = 1
          test "$(cat .github/match-mass-bridge-auto-accept-1971-20260912-v1.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_mass_bridge_auto_accept_v1.php
          mkdir -m 700 -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('scripts/diagnostics/hotel_match_mass_bridge_auto_accept_v1.php').read_bytes()
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','program_sha256':hashlib.sha256(p).hexdigest(),'source_artifact_id':10029330453,'source_json_sha256':'1a450d8fb5f39af147fea500f8f965c83f84f3188de04b6f7aa9845a0350e445','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          Path(os.environ['OUT'],'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'match-mass-bridge-auto-v1-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - name: Restore immutable ANEX full XML artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10029330453/zip" > "$OUT/fullxml.zip"
          echo '35b312bdf9907d7b18002809f181c7459dcb49b98a2a62040d2f3e643c2236b8  '"$OUT/fullxml.zip" | sha256sum -c -
          unzip -q "$OUT/fullxml.zip" -d "$OUT/xml"
          test "$(sha256sum "$OUT/xml/anex-hotel-catalog-match.json" | cut -d' ' -f1)" = '1a450d8fb5f39af147fea500f8f965c83f84f3188de04b6f7aa9845a0350e445'
      - name: Execute one guarded mass transaction
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/massbridge-key"; known="$RUNNER_TEMP/massbridge-known"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; common=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2)
          ok=0
          for a in 1 2 3 4 5; do
            if ssh "${common[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -f config.php && printf OK' | grep -qx OK; then ok=1; break; fi
            sleep $((a*12))
          done
          test "$ok" = 1
          scp "${common[@]}" scripts/diagnostics/hotel_match_mass_bridge_auto_accept_v1.php "$USER_VALUE@$HOST_VALUE:/tmp/match_mass_bridge_auto_v1.php"
          set +e
          ssh "${common[@]}" "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M /tmp/match_mass_bridge_auto_v1.php; rc=$?; rm -f /tmp/match_mass_bridge_auto_v1.php; exit $rc' < "$OUT/xml/anex-hotel-catalog-match.json" > "$OUT/stdout" 2> "$OUT/stderr"
          rc=$?; set -e
          grep '^MATCH_MASS_AUTO:' "$OUT/stdout" | tail -1 | sed 's/^MATCH_MASS_AUTO://' > "$OUT/result.json" || true
          export RC="$rc"; python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ['OUT']); p=d/'result.json'; x=json.loads(p.read_text()) if p.exists() and p.stat().st_size else {'status':'unknown','reason':'marker_missing'}
          x['run_id']=int(os.environ['GITHUB_RUN_ID']); x['source_commit']=os.environ['GITHUB_SHA']; p.write_text(json.dumps(x,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          (d/'summary.md').write_text(f"MATCH #1971 mass bridge auto accept `{os.environ['OPERATION_ID']}`: **{x.get('status')}**. Planned **{x.get('planned')}**, written **{x.get('written')}**, skipped `{x.get('skip')}`; post-COMMIT readback `{x.get('readback')}`. Immutable ANEX full-XML artifact + CURRENT DB guards; supplier/Tourvisor calls 0. Run `{os.environ['GITHUB_RUN_ID']}`. NO-REPLAY.\n")
          if int(os.environ['RC'])!=0 or x.get('status')!='accepted': raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-mass-bridge-auto-v1-${{ github.run_id }}-result', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: test -f "$OUT/summary.md" && gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
