name: MATCH retained direct-native apply v1

on:
  push:
    branches: [ops/match-retained-direct-native-apply-1971-20260917-v1]
    paths:
      - scripts/diagnostics/hotel_match_retained_direct_native_apply_v1.php
      - tests/hotel_match_retained_direct_native_apply_v1_test.php
      - .github/workflows/hotel-match-retained-direct-native-apply-v1.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: match-retained-direct-native-apply-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-retained-direct-native-apply-1971-20260917-v1
  PREFLIGHT_RESULT_SHA256: 080f48c2cdc2516780dd3340a8cf75298730c958643310c20c63f893fac2d211
  SCHEMA_AUDIT_RESULT_SHA256: 16d18250003402c6d854d78cd5e58bcc5b7518843fc1f3860043bdb7943ab8fd
  PLAN_SHA256: 7e7b796b322efb2520c41c90a5b8b137bbed142fb2a6bbeb9326e7ee048c5dbe
jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Offline exact preflight
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_retained_direct_native_apply_v1.php
          php -l tests/hotel_match_retained_direct_native_apply_v1_test.php
          php tests/hotel_match_retained_direct_native_apply_v1_test.php
          grep -F "$PREFLIGHT_RESULT_SHA256" scripts/diagnostics/hotel_match_retained_direct_native_apply_v1.php >/dev/null
          grep -F "$SCHEMA_AUDIT_RESULT_SHA256" scripts/diagnostics/hotel_match_retained_direct_native_apply_v1.php >/dev/null
          grep -F "$PLAN_SHA256" scripts/diagnostics/hotel_match_retained_direct_native_apply_v1.php >/dev/null
      - name: Reserve before DB access
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5717199770,'preflight_result_sha256':os.environ['PREFLIGHT_RESULT_SHA256'],'schema_audit_result_sha256':os.environ['SCHEMA_AUDIT_RESULT_SHA256'],'plan_sha256':os.environ['PLAN_SHA256'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-retained-direct-native-apply-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-retained-direct-native-apply-1971-20260917-v1/reservation.json
          retention-days: 90
      - name: Apply exact CURRENT guarded set
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < scripts/diagnostics/hotel_match_retained_direct_native_apply_v1.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          remote_rc=$?
          set -e
          printf '%s\n' "$remote_rc" > "$out/remote-exit.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json precommit.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server'
          r=json.loads((s/'result.json').read_text());c=json.loads((s/'receipt.json').read_text());h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          state=r.get('state'); committed=r.get('committed_count',0)
          ok=(state in {'completed_committed','completed_no_write'} and c.get('result_sha256')==h and c.get('readback_verified') is True and r.get('supplier_calls')==0 and r.get('tourvisor_calls')==0 and r.get('samo_andromeda_calls')==0 and ((state=='completed_committed' and committed==4 and r.get('mapping_writes')==4 and len(r.get('readback',[]))==4) or (state=='completed_no_write' and committed in {0,None} and r.get('mapping_writes')==0)))
          g={'verified':ok,'state':state,'planned_count':r.get('planned_count'),'prepared_count':r.get('prepared_count'),'held_count':r.get('held_count'),'committed_count':committed,'holds':r.get('holds'),'post_pending_by_namespace':r.get('post_pending_by_namespace'),'post_pending_total':r.get('post_pending_total'),'accepted_by_namespace':r.get('accepted_by_namespace'),'readback':r.get('readback'),'result_sha256':h,'remote_exit':int((p/'remote-exit.txt').read_text().strip())}
          (p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps(g,ensure_ascii=False,sort_keys=True));raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-retained-direct-native-apply-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-retained-direct-native-apply-1971-20260917-v1/
          retention-days: 90
