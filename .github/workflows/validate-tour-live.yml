name: Validate V2 tour live
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/validate-tour-live.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-tour-live.yml'
  workflow_dispatch:
concurrency:
  group: ci-validate-tour-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-tour-live:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Validate live tour card API and flights
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "TOUR_LIVE_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
            from="$(date -d "+2 day" +%Y-%m-%d)"
            till="$(date -d "+9 day" +%Y-%m-%d)"
            start_code="$(curl -k -L -sS -o /tmp/v2-tour-search-start.json -w "%{http_code}" --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB")"
            test "$start_code" = "200" || fail search_start_http
            search_id="$(grep -oE "\"searchId\"[[:space:]]*:[[:space:]]*[0-9]+" /tmp/v2-tour-search-start.json | head -1 | grep -oE "[0-9]+$" || true)"
            test -n "$search_id" || fail search_id
            complete=0
            for attempt in $(seq 1 20); do
              sleep 2
              status_code="$(curl -k -L -sS -o /tmp/v2-tour-search-status.json -w "%{http_code}" --max-time 45 "$base?action=search_status&searchId=$search_id" || true)"
              if test "$status_code" = "200" && grep -Eq "\"progress\"[[:space:]]*:[[:space:]]*100|\"status\"[[:space:]]*:[[:space:]]*\"complete\"" /tmp/v2-tour-search-status.json; then complete=1; break; fi
              echo "TOUR_LIVE_STATUS_RETRY attempt=$attempt http=${status_code:-curl_error}"
            done
            test "$complete" = "1" || fail search_not_complete
            results_code="$(curl -k -L -sS -o /tmp/v2-tour-results.json -w "%{http_code}" --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25" || true)"
            test "$results_code" = "200" || fail results_http
            python3 -c "import json; items=json.load(open(\"/tmp/v2-tour-results.json\")); ids=[]; [ids.append(str(t.get(\"id\"))) for h in (items if isinstance(items,list) else []) if isinstance(h,dict) for t in (h.get(\"tours\") or []) if isinstance(t,dict) and t.get(\"id\") is not None and str(t.get(\"id\")) not in ids]; print(\"\\n\".join(ids[:5]))" >/tmp/v2-tour-ids.txt
            test -s /tmp/v2-tour-ids.txt || fail no_tour_ids
            tour_ok_count=0
            chain_ok=0
            verified_tour=""
            while IFS= read -r tid; do
              test -n "$tid" || continue
              tour_code="$(curl -k -L -sS -o /tmp/v2-tour.json -w "%{http_code}" --max-time 45 "$base?action=tour&tourId=$tid&currency=RUB" || true)"
              echo "TOUR_HTTP=${tour_code:-curl_error} TOUR_ID=$tid"
              test "$tour_code" = "200" || continue
              if ! FROM="$from" TILL="$till" TID="$tid" python3 -c "import json,os,datetime as dt; d=json.load(open(\"/tmp/v2-tour.json\")); assert isinstance(d,dict); assert str(d.get(\"id\") or \"\")==os.environ[\"TID\"]; dep=d.get(\"departure\") or {}; hotel=d.get(\"hotel\") or {}; country=hotel.get(\"country\") or {}; assert int(dep.get(\"id\") or 0)==1; assert int(country.get(\"id\") or 0)==4; assert int(d.get(\"adults\") or 0)==2; assert 7<=int(d.get(\"nights\") or 0)<=10; dd=dt.datetime.strptime(str(d.get(\"date\") or \"\"),\"%d.%m.%Y\").date(); lo=dt.datetime.strptime(os.environ[\"FROM\"],\"%Y-%m-%d\").date(); hi=dt.datetime.strptime(os.environ[\"TILL\"],\"%Y-%m-%d\").date(); assert lo<=dd<=hi; assert str(d.get(\"currency\") or \"RUB\")==\"RUB\"; assert float(d.get(\"price\") or 0)>0"; then
                echo "TOUR_INVARIANTS_FAIL TOUR_ID=$tid"
                continue
              fi
              tour_ok_count=$((tour_ok_count + 1))
              if test "$chain_ok" = "1"; then continue; fi
              flight_code="$(curl -k -L -sS -o /tmp/v2-flights.json -w "%{http_code}" --max-time 45 "$base?action=flights&tourId=$tid&currency=RUB" || true)"
              echo "FLIGHTS_HTTP=${flight_code:-curl_error} TOUR_ID=$tid"
              test "$flight_code" = "200" || continue
              if ! python3 -c "import json; tour=json.load(open(\"/tmp/v2-tour.json\")); raw=json.load(open(\"/tmp/v2-flights.json\")); flights=raw if isinstance(raw,list) else ((raw.get(\"flights\") or []) if isinstance(raw,dict) else []); assert not isinstance(raw,dict) or not raw.get(\"error\"); assert isinstance(flights,list) and flights; variants=[v for v in flights if isinstance(v,dict)]; assert variants; selected=next((v for v in variants if v.get(\"isDefault\")),variants[0]); price=selected.get(\"price\") or {}; fuel=selected.get(\"fuelCharge\") or {}; pv=price.get(\"value\") if isinstance(price,dict) else price; fv=fuel.get(\"value\") if isinstance(fuel,dict) else fuel; pc=price.get(\"currency\") if isinstance(price,dict) else \"\"; assert pv is not None and float(pv)>0; assert fv in (None,\"\") or float(fv)>=0; assert not pc or pc==str(tour.get(\"currency\") or \"RUB\"); assert not selected.get(\"dateForward\") or str(selected.get(\"dateForward\"))==str(tour.get(\"date\") or \"\"); print(\"FLIGHT_CHAIN_VALUES basePrice=%s selectedPrice=%s baseFuel=%s selectedFuel=%s selectedDefault=%s date=%s\" % (tour.get(\"price\"),pv,tour.get(\"fuelCharge\"),fv,bool(selected.get(\"isDefault\")),selected.get(\"dateForward\")))"; then
                echo "FLIGHT_INVARIANTS_FAIL TOUR_ID=$tid"
                continue
              fi
              chain_ok=1
              verified_tour="$tid"
            done </tmp/v2-tour-ids.txt
            test "$tour_ok_count" -ge 3 || fail insufficient_consistent_tour_sample
            test "$chain_ok" = "1" || fail no_consistent_tour_flight_chain
            echo "TOUR_LIVE_OK searchId=$search_id sampledTours=$tour_ok_count flightTourId=$verified_tour"
          '
