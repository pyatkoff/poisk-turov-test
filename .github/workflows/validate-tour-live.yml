name: Validate V2 tour live
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '!v2/data/**'
      - '.github/workflows/validate-tour-live.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-tour-live.yml'
  workflow_dispatch:
concurrency:
  group: ci-validate-tour-live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-tour-live:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Validate live tour card API and flights
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          remote="$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE"
          ssh "${ssh_opts[@]}" "$remote" '
            set -euo pipefail
            fail(){ echo "TOUR_LIVE_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
            from="$(date -d "+2 day" +%Y-%m-%d)"
            till="$(date -d "+9 day" +%Y-%m-%d)"
            start_code="$(curl -k -L -sS -o /tmp/v2-tour-search-start.json -w "%{http_code}" --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB")"
            test "$start_code" = "200" || fail search_start_http
            search_id="$(grep -oE "\"searchId\"[[:space:]]*:[[:space:]]*[0-9]+" /tmp/v2-tour-search-start.json | head -1 | grep -oE "[0-9]+$" || true)"
            test -n "$search_id" || fail search_id
            complete=0
            for attempt in $(seq 1 20); do
              sleep 2
              status_code="$(curl -k -L -sS -o /tmp/v2-tour-search-status.json -w "%{http_code}" --max-time 45 "$base?action=search_status&searchId=$search_id" || true)"
              if test "$status_code" = "200" && grep -Eq "\"progress\"[[:space:]]*:[[:space:]]*100|\"status\"[[:space:]]*:[[:space:]]*\"complete\"" /tmp/v2-tour-search-status.json; then complete=1; break; fi
              echo "TOUR_LIVE_STATUS_RETRY attempt=$attempt http=${status_code:-curl_error}"
            done
            test "$complete" = "1" || fail search_not_complete
            results_code="$(curl -k -L -sS -o /tmp/v2-tour-results.json -w "%{http_code}" --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25" || true)"
            test "$results_code" = "200" || fail results_http
            python3 -c "import json; items=json.load(open(\"/tmp/v2-tour-results.json\")); ids=[]; [ids.append(str(t.get(\"id\"))) for h in (items if isinstance(items,list) else []) if isinstance(h,dict) for t in (h.get(\"tours\") or []) if isinstance(t,dict) and t.get(\"id\") is not None and str(t.get(\"id\")) not in ids]; print(\"\\n\".join(ids[:5]))" >/tmp/v2-tour-ids.txt
            test -s /tmp/v2-tour-ids.txt || fail no_tour_ids
            tour_ok_count=0
            chain_ok=0
            verified_tour=""
            while IFS= read -r tid; do
              test -n "$tid" || continue
              tour_code="$(curl -k -L -sS -o /tmp/v2-tour.json -w "%{http_code}" --max-time 45 "$base?action=tour&tourId=$tid&currency=RUB" || true)"
              echo "TOUR_HTTP=${tour_code:-curl_error} TOUR_ID=$tid"
              test "$tour_code" = "200" || continue
              if ! FROM="$from" TILL="$till" TID="$tid" python3 -c "import json,os,datetime as dt; d=json.load(open(\"/tmp/v2-tour.json\")); assert isinstance(d,dict); assert str(d.get(\"id\") or \"\")==os.environ[\"TID\"]; dep=d.get(\"departure\") or {}; hotel=d.get(\"hotel\") or {}; country=hotel.get(\"country\") or {}; assert int(dep.get(\"id\") or 0)==1; assert int(country.get(\"id\") or 0)==4; assert int(d.get(\"adults\") or 0)==2; assert 7<=int(d.get(\"nights\") or 0)<=10; dd=dt.datetime.strptime(str(d.get(\"date\") or \"\"),\"%d.%m.%Y\").date(); lo=dt.datetime.strptime(os.environ[\"FROM\"],\"%Y-%m-%d\").date(); hi=dt.datetime.strptime(os.environ[\"TILL\"],\"%Y-%m-%d\").date(); assert lo<=dd<=hi; assert str(d.get(\"currency\") or \"RUB\")==\"RUB\"; assert float(d.get(\"price\") or 0)>0"; then
                echo "TOUR_INVARIANTS_FAIL TOUR_ID=$tid"
                continue
              fi
              tour_ok_count=$((tour_ok_count + 1))
              if test "$chain_ok" = "1"; then continue; fi
              flight_code="$(curl -k -L -sS -o /tmp/v2-flights.json -w "%{http_code}" --max-time 45 "$base?action=flights&tourId=$tid&currency=RUB" || true)"
              echo "FLIGHTS_HTTP=${flight_code:-curl_error} TOUR_ID=$tid"
              test "$flight_code" = "200" || continue
              if ! python3 -c "import json; tour=json.load(open(\"/tmp/v2-tour.json\")); raw=json.load(open(\"/tmp/v2-flights.json\")); flights=raw if isinstance(raw,list) else ((raw.get(\"flights\") or []) if isinstance(raw,dict) else []); assert not isinstance(raw,dict) or not raw.get(\"error\"); assert isinstance(flights,list) and flights; variants=[v for v in flights if isinstance(v,dict)]; assert variants; selected=next((v for v in variants if v.get(\"isDefault\")),variants[0]); price=selected.get(\"price\") or {}; fuel=selected.get(\"fuelCharge\") or {}; pv=price.get(\"value\") if isinstance(price,dict) else price; fv=fuel.get(\"value\") if isinstance(fuel,dict) else fuel; pc=price.get(\"currency\") if isinstance(price,dict) else \"\"; assert pv is not None and float(pv)>0; assert fv in (None,\"\") or float(fv)>=0; assert not pc or pc==str(tour.get(\"currency\") or \"RUB\"); assert not selected.get(\"dateForward\") or str(selected.get(\"dateForward\"))==str(tour.get(\"date\") or \"\"); print(\"FLIGHT_CHAIN_VALUES basePrice=%s selectedPrice=%s baseFuel=%s selectedFuel=%s selectedDefault=%s date=%s\" % (tour.get(\"price\"),pv,tour.get(\"fuelCharge\"),fv,bool(selected.get(\"isDefault\")),selected.get(\"dateForward\")))"; then
                echo "FLIGHT_INVARIANTS_FAIL TOUR_ID=$tid"
                continue
              fi
              chain_ok=1
              verified_tour="$tid"
            done </tmp/v2-tour-ids.txt
            test "$tour_ok_count" -ge 3 || fail insufficient_consistent_tour_sample
            test "$chain_ok" = "1" || fail no_consistent_tour_flight_chain
            echo "TOUR_LIVE_OK searchId=$search_id sampledTours=$tour_ok_count flightTourId=$verified_tour"
          '
          scp "${ssh_opts[@]}" "$remote:/tmp/v2-tour-search-start.json" "$RUNNER_TEMP/v2-tour-search-start.json"
          scp "${ssh_opts[@]}" "$remote:/tmp/v2-tour-results.json" "$RUNNER_TEMP/v2-tour-results.json"

      - name: Compare the same live results with tour detail
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "RESULT_DETAIL_LIVE_FAIL:$1"; exit 1; }
          base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
          search_id="$(python3 -c "import json; d=json.load(open('$RUNNER_TEMP/v2-tour-search-start.json')); print(d.get('searchId') or '')")"
          test -n "$search_id" || fail search_id
          test -s "$RUNNER_TEMP/v2-tour-results.json" || fail missing_shared_results
          RESULTS_FILE="$RUNNER_TEMP/v2-tour-results.json" MAP_FILE="$RUNNER_TEMP/v2-rd-map.json" python3 -c "import json,os; items=json.load(open(os.environ['RESULTS_FILE'])); rows=[]; [(rows.append({'id':str(t.get('id')),'hotelId':t.get('hotelId') or h.get('id') or h.get('hotelId'),'hotelName':t.get('hotelName') or h.get('name') or h.get('hotelName'),'date':t.get('date') or t.get('dateFrom') or t.get('startDate'),'price':(t.get('price') or {}).get('value') if isinstance(t.get('price'),dict) else t.get('price'),'currency':t.get('currency') or ((t.get('price') or {}).get('currency') if isinstance(t.get('price'),dict) else None),'nights':t.get('nights'),'adults':t.get('adults'),'childs':t.get('childs')}) if len(rows)<8 else None) for h in (items if isinstance(items,list) else []) if isinstance(h,dict) for t in (h.get('tours') or []) if isinstance(t,dict) and t.get('id') is not None]; json.dump(rows[:8],open(os.environ['MAP_FILE'],'w'),ensure_ascii=False); print('RESULT_SAMPLE_ROWS='+str(len(rows[:8]))); assert len(rows[:8])>=3"
          : >"$RUNNER_TEMP/v2-rd-details.jsonl"
          while IFS= read -r tid; do
            test -n "$tid" || continue
            if curl -k -L -fsS --max-time 45 "$base?action=tour&tourId=$tid&currency=RUB" >"$RUNNER_TEMP/v2-rd-tour.json"; then
              python3 -c "import json; d=json.load(open('$RUNNER_TEMP/v2-rd-tour.json')); print(json.dumps(d,ensure_ascii=False))" >>"$RUNNER_TEMP/v2-rd-details.jsonl"
            fi
            test "$(wc -l <"$RUNNER_TEMP/v2-rd-details.jsonl")" -ge 5 && break
          done < <(python3 -c "import json; print('\n'.join(x['id'] for x in json.load(open('$RUNNER_TEMP/v2-rd-map.json'))))")
          test "$(wc -l <"$RUNNER_TEMP/v2-rd-details.jsonl")" -ge 3 || fail insufficient_detail_responses
          SEARCH_ID="$search_id" MAP_FILE="$RUNNER_TEMP/v2-rd-map.json" DETAILS_FILE="$RUNNER_TEMP/v2-rd-details.jsonl" python3 -c "import json,os,math,datetime; rows={x['id']:x for x in json.load(open(os.environ['MAP_FILE']))}; details=[json.loads(line) for line in open(os.environ['DETAILS_FILE']) if line.strip()]; cd=lambda v: next((datetime.datetime.strptime(str(v or '').strip(),f).date().isoformat() for f in ('%Y-%m-%d','%d.%m.%Y','%d-%m-%Y') if __import__('contextlib')),str(v or '').strip())" >/dev/null 2>&1 || true
          SEARCH_ID="$search_id" MAP_FILE="$RUNNER_TEMP/v2-rd-map.json" DETAILS_FILE="$RUNNER_TEMP/v2-rd-details.jsonl" python3 - <<'PY' || fail result_detail_mismatch
          import json, os, math, datetime
          rows={x['id']:x for x in json.load(open(os.environ['MAP_FILE']))}
          details=[json.loads(line) for line in open(os.environ['DETAILS_FILE']) if line.strip()]
          def canonical_date(value):
              text=str(value or '').strip()
              for fmt in ('%Y-%m-%d','%d.%m.%Y','%d-%m-%Y'):
                  try: return datetime.datetime.strptime(text,fmt).date().isoformat()
                  except ValueError: pass
              return text
          def number(value):
              if isinstance(value,dict): value=value.get('value')
              try: return float(value)
              except (TypeError,ValueError): return None
          matched=0; repriced=0; max_abs=0.0; max_pct=0.0
          for detail in details:
              assert isinstance(detail,dict), 'detail_not_object'
              tid=str(detail.get('id') or '')
              assert tid in rows, f'unrequested_tour:{tid}'
              result=rows[tid]; stable=[]
              hotel=detail.get('hotel') if isinstance(detail.get('hotel'),dict) else {}
              if result.get('hotelId') not in (None,'') and hotel.get('id') not in (None,''): stable.append(('hotelId',str(result['hotelId'])==str(hotel['id'])))
              if result.get('hotelName') and hotel.get('name'): stable.append(('hotelName',str(result['hotelName']).strip().casefold()==str(hotel['name']).strip().casefold()))
              if result.get('date') and detail.get('date'): stable.append(('date',canonical_date(result['date'])==canonical_date(detail['date'])))
              if result.get('currency') and detail.get('currency'): stable.append(('currency',str(result['currency'])==str(detail['currency'])))
              for key in ('nights','adults','childs'):
                  if result.get(key) not in (None,'') and detail.get(key) not in (None,''): stable.append((key,str(result[key])==str(detail[key])))
              assert len(stable)>=2, f'insufficient_comparable_fields:{tid}'
              assert all(ok for _,ok in stable), f'stable_field_mismatch:{tid}:{stable}'
              rp,dp=number(result.get('price')),number(detail.get('price'))
              if rp is not None and dp is not None:
                  assert rp>0 and dp>0, f'nonpositive_price:{tid}:{rp}:{dp}'
                  delta=dp-rp; pct=(delta/rp*100.0) if rp else 0.0
                  max_abs=max(max_abs,abs(delta)); max_pct=max(max_pct,abs(pct))
                  same=math.isclose(rp,dp,abs_tol=0.01)
                  if not same: repriced+=1
                  print('RESULT_DETAIL_PRICE','tourId='+tid,'result='+str(rp),'detail='+str(dp),'delta='+str(delta),'pct='+format(pct,'.3f'),'repriced='+str(not same).lower())
              matched+=1
              print('RESULT_DETAIL_MATCH','tourId='+tid,'stableChecks='+str(len(stable)))
          assert matched>=3, 'insufficient_result_detail_matches'
          print('RESULT_DETAIL_LIVE_OK','searchId='+os.environ['SEARCH_ID'],'matched='+str(matched),'repriced='+str(repriced),'maxAbsDelta='+str(max_abs),'maxPctDelta='+format(max_pct,'.3f'))
          PY
