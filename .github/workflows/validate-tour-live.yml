name: Validate V2 tour live
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
  workflow_dispatch:
jobs:
  validate-tour-live:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Validate live tour card API and flights
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "TOUR_LIVE_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
            from="$(date -d "+2 day" +%Y-%m-%d)"
            till="$(date -d "+9 day" +%Y-%m-%d)"
            start_code="$(curl -k -L -sS -o /tmp/v2-tour-search-start.json -w "%{http_code}" --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB")"
            test "$start_code" = "200" || fail search_start_http
            search_id="$(grep -oE "\"searchId\"[[:space:]]*:[[:space:]]*[0-9]+" /tmp/v2-tour-search-start.json | head -1 | grep -oE "[0-9]+$" || true)"
            test -n "$search_id" || fail search_id
            complete=0
            for attempt in $(seq 1 20); do
              sleep 2
              status_code="$(curl -k -L -sS -o /tmp/v2-tour-search-status.json -w "%{http_code}" --max-time 45 "$base?action=search_status&searchId=$search_id")"
              if test "$status_code" = "200" && grep -Eq "\"progress\"[[:space:]]*:[[:space:]]*100|\"status\"[[:space:]]*:[[:space:]]*\"complete\"" /tmp/v2-tour-search-status.json; then complete=1; break; fi
            done
            test "$complete" = "1" || fail search_not_complete
            results_code="$(curl -k -L -sS -o /tmp/v2-tour-results.json -w "%{http_code}" --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25")"
            test "$results_code" = "200" || fail results_http
            python3 -c "import json; items=json.load(open(\"/tmp/v2-tour-results.json\")); ids=[]; [ids.append(str(t.get(\"id\"))) for h in (items if isinstance(items,list) else []) if isinstance(h,dict) for t in (h.get(\"tours\") or []) if isinstance(t,dict) and t.get(\"id\") is not None and str(t.get(\"id\")) not in ids]; print(\"\\n\".join(ids[:10]))" >/tmp/v2-tour-ids.txt
            first_tour="$(head -1 /tmp/v2-tour-ids.txt)"
            test -n "$first_tour" || fail no_tour_ids
            tour_code="$(curl -k -L -sS -o /tmp/v2-tour.json -w "%{http_code}" --max-time 45 "$base?action=tour&tourId=$first_tour&currency=RUB")"
            echo "TOUR_HTTP=$tour_code TOUR_ID=$first_tour"
            cat /tmp/v2-tour.json
            test "$tour_code" = "200" || fail tour_http
            python3 -c "import json; d=json.load(open(\"/tmp/v2-tour.json\")); assert isinstance(d,dict) and str(d.get(\"id\") or \"\")" || fail tour_shape
            flights_ok=0
            while IFS= read -r tid; do
              test -n "$tid" || continue
              flight_code="$(curl -k -L -sS -o /tmp/v2-flights.json -w "%{http_code}" --max-time 45 "$base?action=flights&tourId=$tid&currency=RUB")"
              echo "FLIGHTS_HTTP=$flight_code TOUR_ID=$tid"
              if test "$flight_code" = "200" && python3 -c "import json; d=json.load(open(\"/tmp/v2-flights.json\")); assert isinstance(d,list) or isinstance(d,dict)"; then
                flights_ok=1
                cat /tmp/v2-flights.json
                break
              fi
            done </tmp/v2-tour-ids.txt
            test "$flights_ok" = "1" || fail no_working_flights_endpoint
            echo "TOUR_LIVE_OK searchId=$search_id tourId=$first_tour"
          '
