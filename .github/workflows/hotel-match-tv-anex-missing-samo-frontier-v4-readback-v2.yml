name: MATCH missing-SAMO v4 readback v2
on:
  push:
    branches: [ops/match-tv-anex-missing-samo-frontier-v4-readback-1971-20260920-v2]
    paths:
      - .github/workflows/hotel-match-tv-anex-missing-samo-frontier-v4-readback-v2.yml
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: hotel-match-tv-anex-missing-samo-frontier-v4-readback-1971-20260920-v2
  cancel-in-progress: false
env:
  TARGET_OPERATION_ID: hotel-match-tv-anex-missing-samo-frontier-1971-20260920-v4
  TARGET_SOURCE_SHA: 98e675522e099c2c173fff118260a148d4bd26d2
  CLAIM_COMMENT_ID: '5748200847'
jobs:
  readback:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
      - name: Validate claim and target Security
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json,os,urllib.request
          c=json.load(open('claim.json'));b=c.get('body','')
          assert c.get('user',{}).get('id')==226193297 and c.get('author_association')=='OWNER'
          assert os.environ['TARGET_OPERATION_ID'] in b and os.environ['TARGET_SOURCE_SHA'] in b
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['TARGET_SOURCE_SHA']+'&per_page=100'
          q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
          xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['TARGET_SOURCE_SHA']]
          assert xs
          r=max(xs,key=lambda x:x['id']);assert r['status']=='completed' and r['conclusion']=='success'
          print('TARGET_SECURITY_OK',r['id'])
          PY
      - name: Read existing target receipt only
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail; umask 077
          test -n "$KEY_VALUE"; test -n "$HOST_VALUE"; test -n "$USER_VALUE"
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null; test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          p="\$HOME/.anytoour-match/operations/$TARGET_OPERATION_ID"
          if ! ssh "${opts[@]}" "$remote" "test -f \"$p/reservation.json\" -a -f \"$p/result.json\" -a -f \"$p/receipt.json\""; then
            printf '%s\n' '{"state":"missing_target_receipt"}' > summary.json
            exit 0
          fi
          ssh "${opts[@]}" "$remote" "tar -C \"$p\" -czf - reservation.json result.json receipt.json" > operation.tgz
      - name: Verify summary
        shell: bash
        run: |
          set -euo pipefail
          if test -f summary.json; then cat summary.json; exit 0; fi
          mkdir server; tar -C server -xzf operation.tgz
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('server')
          a=json.loads((p/'reservation.json').read_text());r=json.loads((p/'result.json').read_text());q=json.loads((p/'receipt.json').read_text())
          d=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert a['operation_id']==os.environ['TARGET_OPERATION_ID'] and a['source_sha']==os.environ['TARGET_SOURCE_SHA']
          assert q['result_sha256']==d and q['readback_verified'] is True
          for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_calls','andromeda_calls','direct_anex_calls']:
            assert r.get(k)==0 and q.get(k)==0
          out={'state':r.get('state'),'reason':r.get('reason'),'result_sha256':d,'coverage_global':r.get('coverage_global'),'physical_active_nonexcluded_frontier':r.get('physical_active_nonexcluded_frontier'),'route_counts':r.get('route_counts'),'by_country':r.get('by_country'),'user_seen_frontier_count':r.get('user_seen_frontier_count'),'query_ready_future_anex_context_count':r.get('query_ready_future_anex_context_count'),'saved_direct_bridge_review_count':r.get('saved_direct_bridge_review_count'),'context_group_count':r.get('context_group_count'),'top_contexts':(r.get('top_future_anex_context_groups') or [])[:15]}
          pathlib.Path('summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Post sanitized receipt to MATCH queue
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > comment.md
          import json
          s=json.load(open('summary.json'))
          if s.get('state')=='completed_read_only':
            c=s['coverage_global']
            print('MATCH post-mass TV+ANEX missing SAMO frontier v4 COMPLETE / READBACK VERIFIED / NO-REPLAY.')
            print()
            print(f"CURRENT: TV+ANEX {c['tv_anex_unique_local']}; TV+SAMO {c['tv_samo_unique_local']}; all-three {c['tv_anex_samo_triple']}; TV+ANEX missing SAMO {c['tv_anex_missing_samo']}; TV+SAMO missing ANEX {c['tv_samo_missing_anex']}.")
            print(f"Executable frontier {s['physical_active_nonexcluded_frontier']}; user-seen {s['user_seen_frontier_count']}; future ANEX-context ready {s['query_ready_future_anex_context_count']}; saved-direct review {s['saved_direct_bridge_review_count']}; context groups {s['context_group_count']}.")
            print('Routes: '+json.dumps(s.get('route_counts') or {},ensure_ascii=False,sort_keys=True))
            print('Countries: '+json.dumps(s.get('by_country') or {},ensure_ascii=False,sort_keys=True))
            print(f"Result {s['result_sha256']}. Provider/Tourvisor/SAMO/Andromeda/direct-ANEX calls0; DB/mapping writes0.")
          else:
            print('MATCH post-mass TV+ANEX missing SAMO frontier v4 READBACK BLOCKED / NO-REPLAY.')
            print()
            print('State: '+str(s.get('state'))+'; reason: '+str(s.get('reason'))+'. Target is not replayed.')
          PY
          gh api repos/pyatkoff/poisk-turov-test/issues/1971/comments -f body="$(cat comment.md)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: missing-samo-v4-readback-v2-${{ github.run_id }}
          path: summary.json
          retention-days: 90
          if-no-files-found: error
