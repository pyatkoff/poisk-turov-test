name: MATCH ANEX public evidence current reconcile v1
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-public-evidence-current-reconcile-v1.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: match-anex-public-evidence-current-reconcile-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-public-evidence-current-reconcile-1971-20260914-v1
  SOURCE_EVIDENCE_RUN_ID: '34835601806'
  SOURCE_EVIDENCE_ARTIFACT: match-anex-observed-public-evidence-v1-result
jobs:
  reconcile:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '${{ github.sha }}'
      - name: Reserve immutable CURRENT reconciliation
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","source_evidence_run_id":%s,"source_evidence_artifact":"%s","state":"reserved_before_ssh","database_writes":0,"mapping_writes":0,"supplier_calls":0,"public_get_calls":0,"historical_operations_replayed":false,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$SOURCE_EVIDENCE_RUN_ID" "$SOURCE_EVIDENCE_ARTIFACT" >"$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: match-anex-public-evidence-current-reconcile-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-public-evidence-current-reconcile-1971-20260914-v1/reservation.json
          retention-days: 90
      - name: Download immutable public evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-evidence"
          gh run download "$SOURCE_EVIDENCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_EVIDENCE_ARTIFACT" -D "$RUNNER_TEMP/source-evidence"
          test -s "$RUNNER_TEMP/source-evidence/evidence.json"
          test -s "$RUNNER_TEMP/source-evidence/receipt.json"
      - name: Reconcile confirmed identities against CURRENT DB read-only
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shlex,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          ev=json.loads((Path(os.environ['RUNNER_TEMP'])/'source-evidence'/'evidence.json').read_text())
          if ev.get('status')!='completed' or ev.get('database_writes')!=0 or ev.get('mapping_writes')!=0 or ev.get('supplier_search_calls')!=0:
              raise RuntimeError('source_evidence_contract')
          payload=[]
          for row in ev.get('matched',[]):
              hits=row.get('hits') or []
              if not hits: continue
              detail=(hits[0] or {}).get('detail') or {}
              if detail.get('inc') != row.get('anex_hotel_id'): continue
              names=[]
              for v in list(row.get('source_names') or [])+[detail.get('name'),detail.get('lname'),detail.get('exName'),detail.get('exLName')]:
                  if isinstance(v,str) and v.strip() and v.strip() not in names: names.append(v.strip())
              places=[]
              for v in list(row.get('source_places') or [])+[detail.get('town'),(detail.get('town_obj') or {}).get('name'),(detail.get('region_obj') or {}).get('name'),detail.get('state')]:
                  if isinstance(v,str) and v.strip() and v.strip() not in places: places.append(v.strip())
              payload.append({'anex_hotel_id':int(row['anex_hotel_id']),'country_id':int(row['country_id']),'observed':True,'search_count':int(row.get('search_count') or 0),'last_seen_utc':row.get('last_seen_utc'),'source_names':names,'source_places':places,'latitude':detail.get('latitude'),'longitude':detail.get('longitude'),'public_slug':detail.get('slug'),'public_inc':detail.get('inc'),'public_star':detail.get('star'),'public_partner_inc':detail.get('partnerInc')})
          if len(payload) != int(ev.get('confirmed_count') or -1): raise RuntimeError('confirmed_payload_count_mismatch')
          helper=Path('scripts/diagnostics/hotel_full_catalog_reconcile.php').read_text()
          planner=Path('scripts/diagnostics/hotel_match_current_bulk_review.php').read_text()
          def body(t):
              if t.startswith('<?php'): t=t[len('<?php'):]
              return t.replace('declare(strict_types=1);','',1)
          helper=body(helper)
          planner=body(planner).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          wrapper=r'''
          $payload=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR);
          $root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');
          $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php')); if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper'); require_once $dbHelper;
          $db=v2_data_db(); $db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION); $db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ'); $db->exec('START TRANSACTION READ ONLY');
          try {
            [$hotels,$names,$strict,$broad,$places,$catalogScope]=mbr_catalog($db);
            $manual=array_fill_keys(array_map('intval',$db->query('SELECT anex_hotel_id FROM anex_hotel_decisions')->fetchAll(PDO::FETCH_COLUMN)),true);
            $existing=array_fill_keys(array_map('intval',$db->query('SELECT anex_hotel_id FROM anex_hotel_search_mappings')->fetchAll(PDO::FETCH_COLUMN)),true);
            $excluded=[]; foreach($db->query('SELECT anex_hotel_id,catalog_hotel_id FROM anex_review_pair_exclusions')->fetchAll(PDO::FETCH_ASSOC) as $x)$excluded[(int)$x['anex_hotel_id']][(int)$x['catalog_hotel_id']]=true;
            $rows=[]; $counts=['input'=>0,'protected'=>0,'auto_accept'=>0,'needs_extra_evidence'=>0,'hard_conflict'=>0,'pair_exclusion_protected'=>0];
            foreach($payload as $p){$counts['input']++;$id=(int)$p['anex_hotel_id'];$country=(int)$p['country_id'];
              if(isset($manual[$id])||isset($existing[$id])){$counts['protected']++;$rows[]=['anex_hotel_id'=>$id,'country_id'=>$country,'bucket'=>'protected_current','reason'=>isset($manual[$id])?'manual_decision_exists':'mapping_exists'];continue;}
              if((int)($p['public_inc']??0)!==$id)throw new RuntimeException('public_inc_contract');
              $source=['observed'=>true,'search_count'=>(int)($p['search_count']??0),'last_seen_utc'=>$p['last_seen_utc']??null,'names'=>$p['source_names']??[],'places'=>$p['source_places']??[],'latitude'=>$p['latitude']??null,'longitude'=>$p['longitude']??null];
              $r=mbr_review_anex($source,$id,$country,$hotels,$names,$strict,$broad,$places); $r['public_slug']=$p['public_slug']??null;$r['public_inc']=$id;$r['public_star']=$p['public_star']??null;$r['public_partner_inc']=$p['public_partner_inc']??null;
              $target=(int)($r['target']['local_hotel_id']??0); if($target&&isset($excluded[$id][$target])){$r['bucket']='hard_conflict';$r['reason']='pair_exclusion_protected';$counts['pair_exclusion_protected']++;}
              $b=(string)($r['bucket']??'needs_extra_evidence'); if(!isset($counts[$b]))$counts[$b]=0;$counts[$b]++;$rows[]=$r;
            }
            $coverage=fc_coverage($db);$db->commit();
            usort($rows,static fn($a,$b)=>((int)($b['search_count']??0))<=>((int)($a['search_count']??0)) ?: ((int)$a['anex_hotel_id'])<=>((int)$b['anex_hotel_id']));
            echo fc_json(['status'=>'completed','operation_id'=>'hotel-match-anex-public-evidence-current-reconcile-1971-20260914-v1','mode'=>'server_current_public_anex_identity_reconcile_read_only','counts'=>$counts,'coverage'=>$coverage,'catalog_scope'=>$catalogScope,'rows'=>$rows,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'public_get_calls'=>0,'guards'=>['manual_decisions_overwritten'=>false,'existing_mappings_overwritten'=>false,'pair_exclusions_overwritten'=>false,'coordinate_conflict_auto_block_m'=>5000,'public_inc_must_equal_anex_hotel_id'=>true,'historical_operations_replayed'=>false,'no_replay'=>true]]),"\n";
          } catch(Throwable $e){if($db->inTransaction())$db->rollBack();throw $e;}
          '''
          code="define('FC_LIBRARY_ONLY',true);\n"+helper+"\n"+planner+"\n"+wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER');host=os.environ[req[1]].strip();user=os.environ[req[2]].strip()
          if not host or not user or not os.environ[req[0]].strip(): raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-anex-reconcile-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key';key.write_text(os.environ[req[0]].rstrip()+'\n');key.chmod(0o600);known=Path(tmp)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
              p=subprocess.run(cmd,input=json.dumps(payload,ensure_ascii=False,separators=(',',':')),text=True,capture_output=True,timeout=420,env=clean)
          try: result=json.loads(p.stdout)
          except Exception:
              blocker={'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'live_output_unparseable','exit_code':p.returncode,'stderr_tail':p.stderr[-1200:],'database_writes':0,'mapping_writes':0};(state/'blocker.json').write_text(json.dumps(blocker,ensure_ascii=False,sort_keys=True)+'\n');raise
          (state/'reconcile.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          if p.returncode!=0 or result.get('status')!='completed' or result.get('operation_id')!=os.environ['OPERATION_ID'] or result.get('database_writes')!=0 or result.get('mapping_writes')!=0: raise RuntimeError('current_reconcile_contract_failed')
          raw=(state/'reconcile.json').read_bytes();receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'source_evidence_run_id':int(os.environ['SOURCE_EVIDENCE_RUN_ID']),'reconcile_sha256':hashlib.sha256(raw).hexdigest(),'counts':result.get('counts'),'coverage':result.get('coverage'),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'public_get_calls':0,'historical_operations_replayed':False,'no_replay':True};(state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          top=[]
          for r in result.get('rows',[]):
              if r.get('bucket')=='auto_accept': top.append({'anex_hotel_id':r.get('external_id') or r.get('anex_hotel_id'),'search_count':r.get('search_count'),'reason':r.get('reason'),'source_names':r.get('source_names'),'source_places':r.get('source_places'),'public_slug':r.get('public_slug'),'target':r.get('target'),'guard':r.get('guard'),'best':r.get('best'),'margin':r.get('margin')})
          print(json.dumps({'counts':result.get('counts'),'coverage':result.get('coverage'),'auto_accept_top':top[:80]},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-public-evidence-current-reconcile-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-public-evidence-current-reconcile-1971-20260914-v1/
          retention-days: 90
