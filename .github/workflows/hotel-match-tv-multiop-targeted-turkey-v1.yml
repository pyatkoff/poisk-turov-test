name: MATCH live942 dual ANEX refresh v1
on:
  push:
    branches: [ops/match-live942-dual-anex-refresh-1971-20260923-v1]
    paths: [.github/workflows/hotel-match-tv-multiop-targeted-turkey-v1.yml]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-live942-dual-anex-refresh-1971-20260923-v1, cancel-in-progress: false}
env:
  TV_OP: hotel-match-live942-tv-anex-refresh-1971-20260923-v1
  SAMO_OP: hotel-match-live942-samo-anex-refresh-1971-20260923-v1
  CLAIM_ID: '5784706620'
  OUT: /tmp/match-live942-dual-anex-refresh-v1
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - name: Validate exact source and current owner claim
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p "$OUT/tv" "$OUT/samo"
          php -l scripts/diagnostics/hotel_match_live942_frontier_plan_v1.php >/dev/null
          php scripts/diagnostics/hotel_match_live942_frontier_plan_v1.php --self-test
          python3 -m py_compile scripts/diagnostics/hotel_match_live942_tv_anex_refresh_v1.py
          python3 scripts/diagnostics/hotel_match_live942_tv_anex_refresh_v1.py --self-test
          php -l scripts/diagnostics/hotel_match_live942_samo_anex_refresh_v1.php >/dev/null
          php scripts/diagnostics/hotel_match_live942_samo_anex_refresh_v1.php --self-test
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM_ID" > "$OUT/claim.json"
          python3 - <<'PY'
          import json,os
          c=json.load(open(os.environ['OUT']+'/claim.json')); b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['TV_OP'],os.environ['SAMO_OP'],'exact pre-writer 942','control15','trusted MATCH SSH workflow']:
              assert x in b,x
          PY
          python3 - <<'PY'
          import json,os,pathlib,datetime
          for side,key in [('tv','TV_OP'),('samo','SAMO_OP')]:
              p=pathlib.Path(os.environ['OUT'])/side/'reservation.json'
              p.write_text(json.dumps({'operation':os.environ[key],'state':'reserved_before_db_and_provider','source_sha':os.environ['GITHUB_SHA'],'claim_id':int(os.environ['CLAIM_ID']),'frontier_expected':942,'database_writes':0,'mapping_writes':0,'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-live942-dual-reservation-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/tv/reservation.json
            ${{ env.OUT }}/samo/reservation.json
          retention-days: 90
      - name: Require exclusive current supplier slot
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,time,urllib.request
          own=int(os.environ['GITHUB_RUN_ID']); repo=os.environ['GITHUB_REPOSITORY']
          words=('match','andromeda','anex','tourvisor','search3','seasonal live evidence')
          for _ in range(90):
              now=datetime.datetime.now(datetime.timezone.utc); busy=[]
              for status in ('in_progress','queued'):
                  q=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?status={status}&per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
                  with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
                  for x in runs:
                      if x['id']==own or x['name']=='Security guard':continue
                      created=datetime.datetime.fromisoformat(x['created_at'].replace('Z','+00:00'))
                      if (now-created).total_seconds()>21600:continue
                      if any(w in x['name'].lower() for w in words):busy.append((x['id'],x['name'],status))
              if not busy:break
              time.sleep(10)
          else:raise SystemExit('supplier_slot_busy')
          print('MATCH_LIVE942_SUPPLIER_SLOT_CLEAR')
          PY
      - name: Execute original942 TV-ANEX and SAMO-ANEX independently
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          cleanup(){ ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }; trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=14400 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          tv=".anytoour-match/operations/$TV_OP"; samo=".anytoour-match/operations/$SAMO_OP"
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "set -eu; test ! -e \"\$HOME/$tv\"; test ! -e \"\$HOME/$samo\"; mkdir -p \"\$HOME/$tv/payload\" \"\$HOME/$samo/payload\""
          scp -S "$sock" -o ControlMaster=no "$OUT/tv/reservation.json" "$USER@$HOST:$tv/reservation.json"
          scp -S "$sock" -o ControlMaster=no "$OUT/samo/reservation.json" "$USER@$HOST:$samo/reservation.json"
          scp -S "$sock" -o ControlMaster=no scripts/diagnostics/hotel_match_live942_frontier_plan_v1.php scripts/diagnostics/hotel_match_anex_effective_coverage.php scripts/diagnostics/hotel_match_live942_tv_anex_refresh_v1.py "$USER@$HOST:$tv/payload/"
          scp -S "$sock" -o ControlMaster=no scripts/diagnostics/hotel_match_live942_samo_anex_refresh_v1.php "$USER@$HOST:$samo/payload/"
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" php \"\$HOME/$tv/payload/hotel_match_live942_frontier_plan_v1.php\" --execute > \"\$HOME/$tv/plan.json\""
          scp -S "$sock" -o ControlMaster=no "$USER@$HOST:$tv/plan.json" "$OUT/plan.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=json.load(open(os.environ['OUT']+'/plan.json'))
          assert p['state']=='original_live942_ready' and p['frontier_count']==942
          assert p['current_missing_count']==927 and p['control_written_count']==15
          assert len(p['rows'])==942 and p['database_writes']==p['mapping_writes']==0
          pathlib.Path(os.environ['OUT']+'/plan-summary.json').write_text(json.dumps({k:p[k] for k in ('state','frontier_count','current_missing_count','control_written_count','missing_context_fallback','past_context_shifted')},sort_keys=True,indent=2)+'\n')
          PY
          scp -S "$sock" -o ControlMaster=no "$OUT/plan.json" "$USER@$HOST:$samo/plan.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$tv\" MATCH_PLAN_PATH=\"\$HOME/$tv/plan.json\" python3 \"\$HOME/$tv/payload/hotel_match_live942_tv_anex_refresh_v1.py\" --execute" >"$OUT/tv/stdout.txt" 2>"$OUT/tv/stderr.txt"
          tvrc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$samo\" MATCH_PLAN_PATH=\"\$HOME/$samo/plan.json\" MATCH_SOURCE_SHA='$GITHUB_SHA' php \"\$HOME/$samo/payload/hotel_match_live942_samo_anex_refresh_v1.php\" --execute" >"$OUT/samo/stdout.txt" 2>"$OUT/samo/stderr.txt"
          samorc=$?
          set -e
          for side in tv samo; do
            if [[ "$side" == tv ]]; then op="$TV_OP"; else op="$SAMO_OP"; fi
            scp -S "$sock" -o ControlMaster=no "$USER@$HOST:.anytoour-match/operations/$op/result.json" "$OUT/$side/result.json"
            scp -S "$sock" -o ControlMaster=no "$USER@$HOST:.anytoour-match/operations/$op/receipt.json" "$OUT/$side/receipt.json"
          done
          export TVRC="$tvrc" SAMORC="$samorc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['OUT'])
          for side in ('tv','samo'):
              r=json.loads((root/side/'result.json').read_text()); q=json.loads((root/side/'receipt.json').read_text())
              assert q['result_sha256']==hashlib.sha256((root/side/'result.json').read_bytes()).hexdigest()
              assert r['frontier_count']==942 and r['database_writes']==r['mapping_writes']==0
              public={k:v for k,v in r.items() if k not in ('rows','edges','batches')}
              (root/side/'summary.json').write_text(json.dumps(public,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
              print(side,json.dumps(public,ensure_ascii=False,sort_keys=True))
          pathlib.Path(root/'exit-codes.json').write_text(json.dumps({'tv':int(os.environ['TVRC']),'samo':int(os.environ['SAMORC'])},sort_keys=True)+'\n')
          PY
          test "$tvrc" -eq 0
          test "$samorc" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-live942-dual-terminal-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/plan-summary.json
            ${{ env.OUT }}/exit-codes.json
            ${{ env.OUT }}/tv/summary.json
            ${{ env.OUT }}/tv/receipt.json
            ${{ env.OUT }}/tv/stdout.txt
            ${{ env.OUT }}/tv/stderr.txt
            ${{ env.OUT }}/samo/summary.json
            ${{ env.OUT }}/samo/receipt.json
            ${{ env.OUT }}/samo/stdout.txt
            ${{ env.OUT }}/samo/stderr.txt
          retention-days: 90
          if-no-files-found: warn
