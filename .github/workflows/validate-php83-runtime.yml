name: Validate PHP 8.3 runtime

on:
  pull_request:
    paths:
      - 'v2/**/*.php'
      - 'v2/*.php'
      - '.github/workflows/validate-php83-runtime.yml'
      - '.github/workflows/deploy-anytoour.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**/*.php'
      - 'v2/*.php'
      - '.github/workflows/validate-php83-runtime.yml'
      - '.github/workflows/deploy-anytoour.yml'
  workflow_dispatch:

jobs:
  php83-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use production PHP baseline
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, xml, zip, gd, mysqli, pdo_mysql, openssl
          coverage: none

      - name: Verify runtime baseline and required extensions
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) { fwrite(STDERR, "Expected PHP 8.3, got ".PHP_VERSION."\n"); exit(1); }'
          php -r '
            $required = ["curl", "mbstring", "json", "openssl", "libxml", "zip", "gd", "mysqli", "pdo_mysql", "Zend OPcache"];
            $missing = [];
            foreach ($required as $ext) {
              if (!extension_loaded($ext)) $missing[] = $ext;
            }
            if ($missing) {
              fwrite(STDERR, "Missing PHP extensions: ".implode(", ", $missing)."\n");
              exit(2);
            }
            echo "PHP_RUNTIME_OK ".PHP_VERSION."\n";
          '

      - name: Lint every PHP file in search product
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
            count=$((count + 1))
          done < <(find v2 -type f -name '*.php' -print0 | sort -z)
          test "$count" -gt 0
          echo "PHP83_LINT_OK files=$count"

      - name: Guard production PHP baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "php-version: '8.3'" .github/workflows/validate-php83-runtime.yml
          echo "PHP83_BASELINE_GUARD_OK"
