name: Collect SEO inventory opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/seo-inventory-opportunity-engine-v1.php'
      - 'v2/data/report-seo-inventory-opportunities-v1.php'
      - 'tests/seo-inventory-opportunity-engine-smoke.php'
      - '.github/workflows/collect-seo-inventory-opportunities.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/seo-inventory-opportunity-engine-v1.php'
      - 'v2/data/report-seo-inventory-opportunities-v1.php'
      - 'tests/seo-inventory-opportunity-engine-smoke.php'
      - '.github/workflows/collect-seo-inventory-opportunities.yml'

permissions:
  contents: read

concurrency:
  group: seo-inventory-opportunities
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate opportunity engine boundaries
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/seo-inventory-opportunity-engine-v1.php >/dev/null
          php -l v2/data/report-seo-inventory-opportunities-v1.php >/dev/null
          php tests/seo-inventory-opportunity-engine-smoke.php
          grep -Fq "observed_database_groups_only_no_cartesian_generation" v2/data/seo-inventory-opportunity-engine-v1.php
          grep -Fq "not_joined_no_zero_imputation" v2/data/seo-inventory-opportunity-engine-v1.php
          grep -Fq "'publication_candidates'=>[]" v2/data/seo-inventory-opportunity-engine-v1.php
          ! grep -Eq 'INSERT[[:space:]]+INTO|UPDATE[[:space:]]+[a-zA-Z_]|DELETE[[:space:]]+FROM' v2/data/report-seo-inventory-opportunities-v1.php

  production-inventory:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Collect read-only first-party opportunity inventory
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          scp "${opts[@]}" \
            v2/data/seo-inventory-opportunity-engine-v1.php \
            v2/data/report-seo-inventory-opportunities-v1.php \
            "$remote:~/www/anytoour.ru/data/"
          ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            root="$HOME/www/anytoour.ru/data"
            php -l "$root/seo-inventory-opportunity-engine-v1.php" >/dev/null
            php -l "$root/report-seo-inventory-opportunities-v1.php" >/dev/null
            php "$root/report-seo-inventory-opportunities-v1.php" --limit-per-type=50
          ' > seo-inventory-opportunities.json

      - name: Summarize and enforce review-only semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('seo-inventory-opportunities.json',encoding='utf-8') as fh:
              report=json.load(fh)
          assert report.get('state')=='review_only_inventory_opportunity_report'
          assert report.get('publication_candidates')==[]
          assert report.get('publication_allowed') is False
          assert report.get('automatic_execution_allowed') is False
          assert report.get('hotel_tours_indexation_allowed') is False
          assert report.get('candidate_generation_semantics')=='observed_database_groups_only_no_cartesian_generation'
          assert report.get('ranking_semantics')=='inventory_components_only_no_combined_score'
          for candidate in report.get('candidates',[]):
              assert candidate.get('candidate_type') in {'country','resort','country_month','resort_month'}
              assert candidate.get('opportunity_score') is None
              assert candidate.get('publication_allowed') is False
              demand=candidate.get('demand') or {}
              assert demand.get('status')=='unknown'
              assert demand.get('impressions') is None
              assert demand.get('clicks') is None
              assert demand.get('avg_position') is None
          by_type=report.get('by_type') or {}
          print('SEO_INVENTORY_OPPORTUNITY_OK observed={} reported={} blocked={} sha256={}'.format(
              report.get('observed_identity_count'),report.get('reported_candidate_count'),report.get('blocked_count'),report.get('evidence_sha256')))
          for kind in ('country','resort','country_month','resort_month'):
              bucket=by_type.get(kind) or {}
              print('SEO_INVENTORY_TYPE {} observed={} reported={}'.format(kind,bucket.get('observed_identity_count',0),bucket.get('reported_count',0)))
              for row in (bucket.get('candidates') or [])[:5]:
                  inv=row.get('inventory') or {}
                  print('SEO_INVENTORY_TOP type={} rank={} identity={} path={} obs30={} obs3={} hotels30={} departures30={} newest={} demand={}'.format(
                      kind,row.get('inventory_rank'),row.get('identity_key'),row.get('review_path'),
                      inv.get('observations_30d'),inv.get('observations_3d'),inv.get('distinct_hotels_30d'),inv.get('distinct_departures_30d'),
                      inv.get('newest_observed_at'),(row.get('demand') or {}).get('status')))
          PY

      - name: Upload opportunity evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-inventory-opportunities-${{ github.run_id }}
          path: seo-inventory-opportunities.json
          if-no-files-found: error
          retention-days: 30
