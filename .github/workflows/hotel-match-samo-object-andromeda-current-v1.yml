          wrapper=r'''
          $in=json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR);$unresolved=[];foreach(($in['unresolved']??[])as$k=>$v)$unresolved[(int)$k]=$v;$fixtures=$in['fixtures']??[];
          $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$h=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$h)throw new RuntimeException('db_helper');require_once$h;$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');
          function sa_num($v): ?int {if(is_int($v)&&$v>0)return$v;if(is_string($v)&&preg_match('/^[1-9][0-9]{0,14}$/D',$v))return(int)$v;return null;}
          function sa_tokens(?string$url):array{$out=['host'=>null,'path'=>null,'hotelCode'=>null,'HOTELLIST'=>null,'o_object_id'=>null,'numeric_query'=>[]];if(!is_string($url)||trim($url)==='')return$out;$p=parse_url(trim($url));if(!is_array($p))return$out;$out['host']=strtolower((string)($p['host']??''));$out['path']=(string)($p['path']??'');if(preg_match('~/o([1-9][0-9]*)(?:/|$)~i',$out['path'],$m))$out['o_object_id']=(int)$m[1];$q=[];parse_str((string)($p['query']??''),$q);foreach($q as$k=>$v){if(is_array($v))continue;$n=sa_num($v);if($n===null)continue;$lk=strtolower((string)$k);if($lk==='hotelcode')$out['hotelCode']=$n;elseif($lk==='hotellist')$out['HOTELLIST']=$n;if(in_array($lk,['hotelcode','hotellist','hotel','hotel_id','hotelid','id'],true))$out['numeric_query'][$lk]=$n;}return$out;}
