          code="define('FC_LIBRARY_ONLY',true);\n"+helper+"\n"+wrapper
          req=['ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER'];vals=[os.environ.get(k,'').strip() for k in req]
