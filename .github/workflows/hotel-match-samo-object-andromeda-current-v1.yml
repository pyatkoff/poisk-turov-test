          ksort($hosts);usort($tokenRows,static fn($a,$b)=>(($a['queue_hotelcode']?0:1)<=>($b['queue_hotelcode']?0:1))?:((int)($a['hotelCode']??0)<=>(int)($b['hotelCode']??0))?:((int)($a['o_object_id']??0)<=>(int)($b['o_object_id']??0)));$coverage=fc_coverage($db);$db->commit();echo fc_json(['status'=>'completed','operation_id'=>'hotel-match-samo-object-andromeda-current-1971-20260914-v1','identity_rows'=>count($identityRows),'fixture_external_hits'=>$fixtureExternalHits,'fixture_local_agreement'=>$fixtureLocalAgreement,'fixtures'=>$fixtureOut,'observation_table_present'=>$obsTable,'observation_rows'=>count($obs),'observation_schema'=>$schema,'hosts'=>$hosts,'token_rows'=>count($tokenRows),'dual_o_hotelcode_rows'=>$dual,'o_matches_andromeda_external_rows'=>$oIdentity,'unresolved_hotelcodes_from_saved_urls'=>count($codeQueue),'saved_url_evidence'=>array_slice($tokenRows,0,1000),'coverage'=>$coverage,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_http_calls'=>0,'historical_operations_replayed'=>false,'no_replay'=>true]),"\n";}catch(Throwable$e){if($db->inTransaction())$db->rollBack();throw$e;}
