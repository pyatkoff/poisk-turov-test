name: INT ANEX first local DB snapshot

on:
  push:
    branches:
      - 'ops/int-anex-local-db-collect-20260918-v1'
    paths:
      - 'scripts/ops/int_anex_local_db_seed.php'
      - '.github/workflows/int-anex-local-db-seed.yml'

permissions:
  contents: read

concurrency:
  group: int-anex-local-db-collect-2506-20260918-v1
  cancel-in-progress: false

jobs:
  seed:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: a204894c3d362b9961edd174c1930f626d220bb6
      RELEASE_DATA_SHA: a85b0f061d6016bc258dccca4ee784c2d6ef7c27
      OPERATION_ID: int-anex-local-db-collect-2506-20260918-v1
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_DATA_SHA }}
          path: release-data
          persist-credentials: false

      - name: Bind exact one-shot sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/int-anex-local-db-seed.yml'
          test "${changed[1]}" = 'scripts/ops/int_anex_local_db_seed.php'

          php -l scripts/ops/int_anex_local_db_seed.php >/dev/null
          php -l scripts/ops/anex_local_offer_collect.php >/dev/null
          php -l app/integrations/anex-local-offer-collector.php >/dev/null
          php tests/anex-local-offer-collector-test.php

          test "$(git rev-parse "$BASE_SHA:app/integrations/anex-program-apd-store.php")" = "$(git rev-parse "HEAD:app/integrations/anex-program-apd-store.php")"
          test "$(git rev-parse "$BASE_SHA:app/integrations/anex-anytour-offer-autosave.php")" = "$(git rev-parse "HEAD:app/integrations/anex-anytour-offer-autosave.php")"
          test "$(git rev-parse "$BASE_SHA:app/integrations/three-provider-anex-offer.php")" = "$(git rev-parse "HEAD:app/integrations/three-provider-anex-offer.php")"

          test "$(git -C release-data rev-parse HEAD)" = "$RELEASE_DATA_SHA"
          test -f release-data/v2/data/anytour-offer-snapshot-ingest-v1.php
          test -f release-data/v2/data/anytour-offer-store-v1.php

          test -n "$ANYTOOUR_DEPLOY_SSH_KEY"
          test -n "$ANYTOOUR_DEPLOY_HOST"
          test -n "$ANYTOOUR_DEPLOY_USER"

      - name: Prepare exact temporary INT runtime
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"
          else
            printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

          stage="$RUNNER_TEMP/anex-local-db-runtime"
          mkdir -p "$stage/app" "$stage/v2" "$stage/scripts/ops"
          cp -a app/integrations "$stage/app/"
          cp v2/api-anex-search3-preview.php "$stage/v2/"
          cp -a release-data/v2/data "$stage/v2/"
          cp scripts/ops/anex_local_offer_collect.php "$stage/scripts/ops/"
          cp scripts/ops/int_anex_local_db_seed.php "$stage/scripts/ops/"
          tar -C "$stage" -czf "$RUNNER_TEMP/anex-local-db-runtime.tar.gz" .
          sha256sum "$RUNNER_TEMP/anex-local-db-runtime.tar.gz"

      - name: Execute exactly one private ANEX seed operation
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          opts=(-T -i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          scp_opts=(-i "$RUNNER_TEMP/anytoour_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15)
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          archive="/tmp/${OPERATION_ID}.${GITHUB_RUN_ID}.tar.gz"
          scp "${scp_opts[@]}" "$RUNNER_TEMP/anex-local-db-runtime.tar.gz" "$remote:$archive"

          set +e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$archive" <<'REMOTE'
          set -euo pipefail
          operation="$1"
          archive="$2"
          site="$HOME/www/anytoour.ru"
          ledger="$HOME/.anytour-ops/$operation"
          test -d "$site"
          test -s "$site/config.php"
          test -s "$HOME/.anytoour-anex/search3-preview.php"
          test ! -e "$ledger"
          mkdir -p "$HOME/.anytour-ops"
          mkdir -m 700 "$ledger"
          printf '%s\n' 'reserved' > "$ledger/state"
          work="$(mktemp -d "/tmp/${operation}.XXXXXX")"
          cleanup(){ rm -rf "$work"; rm -f "$archive"; }
          trap cleanup EXIT
          tar -C "$work" -xzf "$archive"
          php -l "$work/scripts/ops/int_anex_local_db_seed.php" >/dev/null
          set +e
          php "$work/scripts/ops/int_anex_local_db_seed.php" "$site" > "$ledger/receipt.json" 2> "$ledger/error.log"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' 'failed_terminal_no_replay' > "$ledger/state"
            exit "$rc"
          fi
          php -r '$x=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR);if(($x["status"]??null)!=="completed"||($x["delta"]["programs"]??0)<1||($x["delta"]["contexts"]??0)<1||($x["delta"]["anex_offers"]??0)<1||($x["collector"]["final_price_ready_offers"]??0)<1)exit(2);' "$ledger/receipt.json"
          printf '%s\n' 'completed' > "$ledger/state"
          REMOTE
          rc=$?
          set -e

          ssh "${opts[@]}" "$remote" "cat \"\$HOME/.anytour-ops/$OPERATION_ID/receipt.json\"" > "$RUNNER_TEMP/receipt.json" || true
          test -s "$RUNNER_TEMP/receipt.json"
          cat "$RUNNER_TEMP/receipt.json"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          jq -e '.status == "completed" and .provider == "anex" and (.delta.programs > 0) and (.delta.contexts > 0) and (.delta.anex_offers > 0) and (.collector.final_price_ready_offers > 0) and (.booking_calls == 0) and (.lead_calls == 0) and (.mapping_writes == 0) and (.search3_publication == 0) and (.production_webroot_writes == 0) and (.replay_allowed == false)' "$RUNNER_TEMP/receipt.json" >/dev/null

      - name: Preserve sanitized ANEX snapshot receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-anex-local-db-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
