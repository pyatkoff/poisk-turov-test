name: MATCH TV multi-operator link census v1
on:
  push:
    branches: [ops/match-tv-multiop-link-census-1971-20260916-v1]
    paths:
      - 'scripts/diagnostics/hotel_match_tv_multiop_link_census.php'
      - '.github/workflows/hotel-match-tv-multiop-link-census-v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-tv-multiop-link-census-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-tv-multiop-link-census-1971-20260916-v1
  OUT: /tmp/match-tv-multiop-link-census-v1
jobs:
  census:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 1
          persist-credentials: false
      - name: Offline fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          php -l scripts/diagnostics/hotel_match_tv_multiop_link_census.php
          php scripts/diagnostics/hotel_match_tv_multiop_link_census.php --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_tv_multiop_link_census.php
          grep -Fq 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' scripts/diagnostics/hotel_match_tv_multiop_link_census.php
          grep -Fq 'tour_operator_identity_observations' scripts/diagnostics/hotel_match_tv_multiop_link_census.php
      - name: Create durable runner reservation before SSH and DB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['OUT'])/'runner-reservation.json'
          data={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_ssh_and_db','read_only':True,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          p.write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 'match-tv-multiop-link-census-reservation-${{ github.run_id }}'
          path: '${{ env.OUT }}/runner-reservation.json'
          if-no-files-found: error
          retention-days: 90
      - name: Run immutable server-CURRENT read-only census
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match-tv-multiop-key"; known="$RUNNER_TEMP/match-tv-multiop-known"; sock="$RUNNER_TEMP/match-tv-multiop.sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=600 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0 -d memory_limit=768M" < scripts/diagnostics/hotel_match_tv_multiop_link_census.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"
          trc=$?
          set -e
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def load(name):
              try:return json.loads((out/name).read_text())
              except Exception:return {}
          rr=load('runner-reservation.json'); sr=load('reservation.json'); result=load('result.json'); receipt=load('receipt.json')
          rh=hashlib.sha256((out/'result.json').read_bytes()).hexdigest() if (out/'result.json').exists() else None
          ok=(rr.get('state')=='reserved_before_ssh_and_db' and rr.get('operation_id')==os.environ['OPERATION_ID'] and rr.get('source_sha')==os.environ['GITHUB_SHA'] and rr.get('no_replay') is True
              and sr.get('state')=='reserved_before_db_access' and sr.get('operation_id')==os.environ['OPERATION_ID'] and sr.get('source_sha')==os.environ['GITHUB_SHA'] and sr.get('no_replay') is True
              and result.get('state')=='completed_read_only' and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('source_sha')==os.environ['GITHUB_SHA'] and result.get('server_current') is True and result.get('no_replay') is True
              and receipt.get('state')=='completed_read_only' and receipt.get('operation_id')==os.environ['OPERATION_ID'] and receipt.get('source_sha')==os.environ['GITHUB_SHA'] and receipt.get('result_sha256')==rh and receipt.get('readback_verified') is True and receipt.get('no_replay') is True
              and all(result.get(k)==0 for k in ('database_writes','mapping_writes','supplier_calls','tourvisor_calls','booking_calls','lead_calls'))
              and int(os.environ['RC'])==0 and int(os.environ['TRC'])==0)
          gate={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':ok,'state':result.get('state'),'rows_scanned':(result.get('stats') or {}).get('rows_scanned'),'safe_link_shape':(result.get('stats') or {}).get('safe_link_shape'),'certified_rule_count':result.get('certified_rule_count'),'prepared_missing_typed_identity_count':result.get('prepared_missing_typed_identity_count'),'prepared_missing_observation_weight':result.get('prepared_missing_observation_weight'),'already_accepted_same_count':result.get('already_accepted_same_count'),'current_identity_hold_count':result.get('current_identity_hold_count'),'result_sha256':rh,'remote_exit':int(os.environ['RC']),'tar_exit':int(os.environ['TRC']),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          (out/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'match-tv-multiop-link-census-${{ github.run_id }}'
          path: '${{ env.OUT }}/'
          retention-days: 90
