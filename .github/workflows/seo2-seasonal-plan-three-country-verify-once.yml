name: SEO2 seasonal three-country plan verify once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo2-seasonal-plan-three-country-verify-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Refresh production seasonal evidence
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          work="$RUNNER_TEMP/seo2-seasonal-verify"
          mkdir -p "$work"
          root='~/www/anytoour.ru'
          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data/seo2-verify-once" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" v2/data/db-v1.php v2/data/inspect-seo-data-readiness-v1.php v2/data/inspect-seo-seasonal-identities-v1.php v2/seo-data-readiness-v1.php v2/seo-seasonal-identity-v1.php "$remote:$root/data/seo2-verify-once/"
          ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            base="$HOME/www/anytoour.ru"
            mkdir -p "$base/data/seo2-verify-once/v2/data" "$base/data/seo2-verify-once/v2"
            cp "$base/config.php" "$base/data/seo2-verify-once/v2/config.php"
            chmod 600 "$base/data/seo2-verify-once/v2/config.php"
            cp "$base/data/seo2-verify-once/db-v1.php" "$base/data/seo2-verify-once/v2/data/db-v1.php"
            cp "$base/data/seo2-verify-once/inspect-seo-data-readiness-v1.php" "$base/data/seo2-verify-once/v2/data/inspect-seo-data-readiness-v1.php"
            cp "$base/data/seo2-verify-once/inspect-seo-seasonal-identities-v1.php" "$base/data/seo2-verify-once/v2/data/inspect-seo-seasonal-identities-v1.php"
            cp "$base/data/seo2-verify-once/seo-data-readiness-v1.php" "$base/data/seo2-verify-once/v2/seo-data-readiness-v1.php"
            cp "$base/data/seo2-verify-once/seo-seasonal-identity-v1.php" "$base/data/seo2-verify-once/v2/seo-seasonal-identity-v1.php"
            php "$base/data/seo2-verify-once/v2/data/inspect-seo-data-readiness-v1.php" --countries=1,4,8 --require-countries=3 --require-snapshots=1 > "$base/data/seo2-verify-once/readiness.json"
            php "$base/data/seo2-verify-once/v2/data/inspect-seo-seasonal-identities-v1.php" --countries=1,4,8 --require-identities=1 > "$base/data/seo2-verify-once/identities.json"
            rm -f "$base/data/seo2-verify-once/v2/config.php"
          '
          scp "${opts[@]}" "$remote:$root/data/seo2-verify-once/readiness.json" "$work/readiness.json"
          scp "${opts[@]}" "$remote:$root/data/seo2-verify-once/identities.json" "$work/identities.json"
      - name: Verify explicit three-country review plans
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/seo2-seasonal-verify"
          php v2/data/report-seo-seasonal-review-plan-v1.php --readiness="$work/readiness.json" --identities="$work/identities.json" --family=egypt --page-keys=month:1:1:2026-09 --max-items=1 --require-items=1 > "$work/egypt-plan.json"
          php v2/data/report-seo-seasonal-review-plan-v1.php --readiness="$work/readiness.json" --identities="$work/identities.json" --family=turkey --page-keys=month:1:4:2026-09 --max-items=1 --require-items=1 > "$work/turkey-plan.json"
          php v2/data/report-seo-seasonal-review-plan-v1.php --readiness="$work/readiness.json" --identities="$work/identities.json" --family=maldives --page-keys=month:1:8:2026-09 --max-items=1 --require-items=1 > "$work/maldives-plan.json"
          php -r '$files=array_slice($argv,1);foreach($files as $f){$j=json_decode(file_get_contents($f),true,512,JSON_THROW_ON_ERROR);if(($j["item_count"]??0)!==1||($j["family_blocked_count"]??-1)!==0||($j["publication_allowed"]??true)!==false||($j["copy_allowed"]??true)!==false||($j["publication_candidates"]??null)!==[])exit(2);printf("SEO2_PLAN_OK family=%s key=%s score=%d valid_until=%d\n",$j["family"]??"",$j["items"][0]["page_key"]??"",$j["coverage_score"]??0,$j["evidence_valid_until_epoch"]??0);}' "$work/egypt-plan.json" "$work/turkey-plan.json" "$work/maldives-plan.json"
      - name: Upload disposable evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo2-seasonal-three-country-verify-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/seo2-seasonal-verify/*.json
          retention-days: 3
