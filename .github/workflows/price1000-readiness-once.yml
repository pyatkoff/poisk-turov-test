name: PRICE read-only channel permissions check
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price1000-readiness-once.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '49097719983a69f8f37ebbb92f340d6d3a8f2d7e'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify original PRICE receipt and current candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = '3ffc092f2c98ab3ed9cca3e32f29ebe1b7229e09'
          gh api repos/pyatkoff/poisk-turov-test/pulls/5153 | jq -e '.state == "open" and .draft and .head.sha == "35c5d23a0fcb86c69e2db205012fa1ba4da615e7" and .base.sha == "f6b7513445f599f332c5d9d4021b2537e2d3d609"' >/dev/null
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/44960678432 | jq -e '.status == "completed" and .conclusion == "failure" and .run_attempt == 1' >/dev/null
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/44969921832 | jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "35c5d23a0fcb86c69e2db205012fa1ba4da615e7"' >/dev/null
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Read the exact channel identities and edit rights
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            export GIT_OPTIONAL_LOCKS=0
            unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
            cd /var/www/anytoour/data/www/app.anytoour.ru
            test "$(git rev-parse HEAD)" = 3ffc092f2c98ab3ed9cca3e32f29ebe1b7229e09
            test -z "$(git -c core.fsmonitor=false -c core.untrackedCache=false status --porcelain --untracked-files=no)"
            /usr/bin/php -d display_errors=0 -d log_errors=0
            test "$(git rev-parse HEAD)" = 3ffc092f2c98ab3ed9cca3e32f29ebe1b7229e09
          ' <<'PHP'
          <?php
          declare(strict_types=1);
          $targets = [
              'max' => ['id9704048781_1_bot', '-80492244209683', 'max_anytour_msk1', 9],
              'telegram' => ['anyru_bot', '-1002262666616', 'tg_anytour_msk', 10],
          ];
          try {
              ob_start();
              try {
                  require getcwd().'/config.php';
                  require_once getcwd().'/services/ChannelPostRuntime.php';
                  require_once getcwd().'/services/ChannelPostAdminService.php';
                  require_once getcwd().'/integrations/ChannelPostApiTransport.php';
                  require_once getcwd().'/services/ChannelPostButtonTransport.php';
              } finally {
                  ob_end_clean();
              }
              $registry = new ChannelPostRegistryService(ConversationDb::connection());
              $ok = true;
              foreach ($targets as $platform => [$bot, $id, $source, $registryId]) {
                  $identity = ChannelPostRuntime::identity($platform);
                  $channel = $registry->channel('anytour', $platform, $bot, $id);
                  if (($identity['project_key'] ?? null) !== 'anytour' || ($identity['bot_key'] ?? null) !== $bot
                      || (int)($channel['id'] ?? 0) !== $registryId || ($channel['source_key'] ?? null) !== $source
                      || (int)($channel['config_version'] ?? 0) !== 2 || ($channel['button_text'] ?? null) !== '✈️ Узнать стоимость тура') {
                      $result = ['state' => 'held', 'reason' => 'channel_configuration_changed', 'receipt' => ['write_attempts' => 0, 'request_count' => 0]];
                  } else {
                      $result = (new ChannelPostButtonTransport)->verifyChannel($channel);
                  }
                  $reason = $result['reason'] ?? null;
                  $state = $result['state'] ?? null;
                  if (!is_string($reason) || !preg_match('/\A[a-z0-9_]{1,100}\z/D', $reason)) $reason = 'unclassified';
                  if (!in_array($state, ['ready','held','unknown','requires_attention'], true)) $state = 'unknown';
                  $writes = $result['receipt']['write_attempts'] ?? null;
                  $reads = $result['receipt']['request_count'] ?? null;
                  echo 'PRICE_PERMISSION_READBACK ', json_encode(['platform' => $platform, 'state' => $state, 'reason' => $reason, 'requests' => $reads, 'write_attempts' => $writes], JSON_THROW_ON_ERROR), PHP_EOL;
                  $ok = $ok && $state === 'ready' && $reason === 'capability_verified' && $writes === 0;
              }
              exit($ok ? 0 : 2);
          } catch (Throwable $e) {
              echo 'PRICE_PERMISSION_READBACK bootstrap_or_registry_failed', PHP_EOL;
              exit(2);
          }
          PHP
      - name: Cleanup original connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
