name: PRICE read-only readiness for publication priority
on:
  push:
    branches: ['ops/price-hook-reviewed-pass-20261117']
    paths: ['.github/workflows/price1000-readiness-once.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.run_attempt == 1 && github.event.before == '5296a9b3d03d1dc594fabfe039fe805859f9d4b9'
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify original PRICE receipt and current candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/ops/price-hook-reviewed-pass-20261117 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/pyatkoff/max-search-bot/git/ref/heads/main --jq .object.sha)" = '3ffc092f2c98ab3ed9cca3e32f29ebe1b7229e09'
          gh api repos/pyatkoff/poisk-turov-test/pulls/5153 | jq -e '.state == "open" and .draft and .head.sha == "7e63619248e2f4d8bf06b05c3f0917c9cec60ab9" and .base.sha == "f6b7513445f599f332c5d9d4021b2537e2d3d609"' >/dev/null
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/44995004932 | jq -e '.status == "completed" and .conclusion == "failure" and .run_attempt == 1' >/dev/null
          gh api repos/pyatkoff/poisk-turov-test/actions/runs/45010445635 | jq -e '.status == "completed" and .conclusion == "success" and .head_sha == "7e63619248e2f4d8bf06b05c3f0917c9cec60ab9"' >/dev/null
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: 3486bfc06b54947ddbecb8cc9a1efbfa43ff7304
          path: hotel-price-publisher
          persist-credentials: false
      - name: Build the exact inspected publisher bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 hotel-price-publisher/tools/direct_demand/operations/build-monitor-price-hook.py "$RUNNER_TEMP/monitor-price-hook.php"
          php -l "$RUNNER_TEMP/monitor-price-hook.php"
          test "$(sha256sum "$RUNNER_TEMP/monitor-price-hook.php" | cut -d' ' -f1)" = c5326d840f68a15311524e81ea98febb597f090f1a73389f6310be90de3a4aa9
      - name: Prepare unchanged server connection and host pin
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            if [[ "$KEY_VALUE" == *'\n'* ]]; then printf '%b\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; else printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$RUNNER_TEMP/channel_key"; fi
          else printf '%s' "$KEY_VALUE" | base64 --decode > "$RUNNER_TEMP/channel_key"; fi
          ssh-keygen -y -f "$RUNNER_TEMP/channel_key" >/dev/null
          python3 - <<'PY'
          import os,re,subprocess,base64,hashlib,pathlib
          host=os.environ['DEPLOY_HOST'];user=os.environ['DEPLOY_USER'];assert re.fullmatch(r'[A-Za-z0-9_.:-]+',host) and not host.startswith('-') and re.fullmatch(r'[A-Za-z0-9_-]+',user)
          scan=subprocess.run(['ssh-keyscan','-T','10','-t','ed25519,ecdsa,rsa',host],capture_output=True,text=True,timeout=35);matches=[]
          for line in scan.stdout.splitlines():
            f=line.split()
            if len(f)<3 or f[0].startswith('#'):continue
            try:fp='SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(f[2])).digest()).decode().rstrip('=')
            except Exception:continue
            if fp=='SHA256:/5mPWmGBQ6UPnNQDEHLOCy7dCpxdz+FxQ4zVOjqE0F0':matches.append(line)
          assert matches,'HOST_CONTINUITY_PIN_MISMATCH_STOP';pathlib.Path(os.environ['RUNNER_TEMP']+'/channel_known_hosts').write_text('\n'.join(matches)+'\n')
          PY
      - name: Inspect remote runtime, original journal and enrolled publications
        env:
          DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/channel_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$RUNNER_TEMP/channel_known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          set +e
          ssh "${opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            export GIT_OPTIONAL_LOCKS=0
            unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_CONFIG_PARAMETERS GIT_CONFIG_COUNT GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES ANYTOUR_MONITOR_COLLECTION_STARTED_AT ANYTOUR_MONITOR_COLLECTOR_RUN_ID
            cd /var/www/anytoour/data/www/app.anytoour.ru
            test "$(git rev-parse HEAD)" = 3ffc092f2c98ab3ed9cca3e32f29ebe1b7229e09
            journal=/var/www/anytoour/data/channel-post-operations/monitor-price-after-collection-v1.jsonl
            test -f "$journal" && test ! -L "$journal"
            snapshot() {
              git rev-parse HEAD
              stat -Lc "%d:%i:%s:%Y:%Z" "$journal"
              sha256sum /var/www/anytoour/data/www/anytoour.ru/data/monitor-price-hook.php feed/hotel-posts-max.xml feed/hotel-posts-telegram.xml feed/hotel-posts-all.xml
            }
            before=$(snapshot)
            printf "PRICE_READBACK_BEFORE\n%s\n" "$before"
            set +e
            ANYTOUR_MONITOR_HOOK_INSPECT=1 /usr/bin/php -d display_errors=0
            result=$?
            set -e
            after=$(snapshot)
            printf "PRICE_READBACK_AFTER\n%s\n" "$after"
            test "$before" = "$after"
            printf "PRICE_READBACK_UNCHANGED\n"
            exit "$result"
          ' < "$RUNNER_TEMP/monitor-price-hook.php" > "$RUNNER_TEMP/price-inspect.log"
          native_status=$?
          set -e
          python3 - "$native_status" <<'PY'
          import json, os, pathlib, sys
          log = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'price-inspect.log').read_text().splitlines()
          unchanged = 'PRICE_READBACK_UNCHANGED' in log
          payloads = [l.removeprefix('MONITOR_POST_FEED_RESULT=') for l in log if l.startswith('MONITOR_POST_FEED_RESULT=')]
          result = json.loads(payloads[0]) if len(payloads) == 1 else {}
          keys = ('ok', 'mode', 'error', 'installed_sha', 'journal_read', 'roster_pairs', 'scanned_pairs', 'remaining_unscanned_pairs', 'eligible_pairs', 'held_pairs', 'updated_pairs', 'unchanged_pairs', 'new_posts', 'supplier_calls', 'site_writes', 'deferred_counts', 'timings_ms')
          priority = {12120, 76029, 66198, 49750}
          scope = {str(id): next((stage for stage in ('eligible', 'held', 'unchanged') if id in result.get(stage+'_ids', [])), 'unconfirmed') for id in sorted(priority)}
          summary = {key: result.get(key) for key in keys}
          print('PRICE_CANDIDATE_READONLY', json.dumps(dict(summary, files_and_journal_stat_unchanged=unchanged, priority=scope, first_eligible_ids=result.get('eligible_ids', [])[:36], native_status=int(sys.argv[1]))))
          if unchanged:
              i = log.index('PRICE_READBACK_AFTER')
              for line in log[i+1:i+7]: print('PRICE_SERVER_READBACK', line)
          assert int(sys.argv[1]) == 0 and unchanged and result.get('ok') is True and result.get('installed_sha') == '3ffc092f2c98ab3ed9cca3e32f29ebe1b7229e09'
          assert result.get('mode') == 'read_only_hook_inspection' and result.get('scanned_pairs') == result.get('roster_pairs') == 1000
          assert all(result.get(k) == 0 for k in ('updated_pairs', 'new_posts', 'supplier_calls', 'site_writes'))
          PY
      - name: Cleanup original connection material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel_key" "$RUNNER_TEMP/channel_known_hosts"
