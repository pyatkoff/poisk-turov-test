name: Restore GitHub-hosted runners

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-github-hosted.yml'
  workflow_dispatch:

jobs:
  restore:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SELF_HOSTED_GH_TOKEN }}
      - name: Restore ubuntu-latest for all normal workflows
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while IFS= read -r -d '' file; do
            if [[ "$file" == ".github/workflows/restore-github-hosted.yml" ]]; then
              continue
            fi
            if grep -qE '^([[:space:]]*)runs-on:[[:space:]]*\[self-hosted,[[:space:]]*Linux,[[:space:]]*X64\][[:space:]]*$' "$file"; then
              sed -i -E 's/^([[:space:]]*)runs-on:[[:space:]]*\[self-hosted,[[:space:]]*Linux,[[:space:]]*X64\][[:space:]]*$/\1runs-on: ubuntu-latest/' "$file"
              echo "restored: $file"
              changed=1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if [[ "$changed" -eq 0 ]]; then
            echo "No self-hosted workflow jobs left to restore"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "ci: restore GitHub-hosted runners"
          git push
