name: MATCH core8 identity census 1971
on:
  push:
    branches: ['ops/match-core8-identity-census-1971-20260912']
    paths: ['.github/workflows/hotel-match-core8-identity-census.yml']
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: anytour-match-identity-current, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-core8-identity-census-1971-20260912-v1
  SOURCE_SHA: 8105b49af7050391f9d9907625b1eb7d2628d850
  OUT: /tmp/match-identity-census
jobs:
  census:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '8105b49af7050391f9d9907625b1eb7d2628d850', persist-credentials: false}
      - name: Offline validation and immutable reservation
        run: |
          set -euo pipefail
          echo '7431cc4c3c4f3a9585f203f69f000492280c99b15278ba7dc3f897deeb778c70  scripts/diagnostics/hotel_match_core8_identity_census.php' | sha256sum -c -
          php -l scripts/diagnostics/hotel_match_core8_identity_census.php
          php scripts/diagnostics/hotel_match_core8_identity_census.php --self-test
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json,os,pathlib
          x={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'database_writes':0,'supplier_calls':0,'no_replay':True}
          pathlib.Path(os.environ['OUT'],'reservation.json').write_text(json.dumps(x,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: reserve
        with: {name: 'match-identity-census-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '${{ steps.reserve.outputs.artifact-id }}', path: '/tmp/match-census-reservation-readback', merge-multiple: true}
      - name: Verify reservation then one CURRENT read
        env: {KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          cmp "$OUT/reservation.json" /tmp/match-census-reservation-readback/reservation.json
          key="$RUNNER_TEMP/hmc-key";sock="$RUNNER_TEMP/hmc.sock";known="$RUNNER_TEMP/hmc-known"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key"
          ok=0
          for n in 1 2 3;do
            if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER_VALUE@$HOST_VALUE";then ok=1;break;fi
            sleep 15
          done
          test "$ok" = 1
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -f config.php'
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M' < scripts/diagnostics/hotel_match_core8_identity_census.php > "$RUNNER_TEMP/hmc-stdout" 2> "$RUNNER_TEMP/hmc-stderr"
          rc=$?
          set -e
          export RC="$rc"
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          d=pathlib.Path(os.environ['OUT']);raw=pathlib.Path(os.environ['RUNNER_TEMP'],'hmc-stdout').read_bytes()
          lines=[x[len(b'MATCH_CENSUS:'):] for x in raw.splitlines() if x.startswith(b'MATCH_CENSUS:')]
          x=json.loads(lines[0]) if len(lines)==1 else {'status':'unknown','safe_message':'result_marker_missing'}
          result=json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()+b'\n';(d/'result.json').write_bytes(result)
          receipt={'operation_id':os.environ['OPERATION_ID'],'status':x.get('status'),'source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'counts':x.get('counts'),'result_sha256':hashlib.sha256(result).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          (d/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          summary=f"MATCH #1971 CURRENT identity census: {x.get('status')}; counts `{x.get('counts')}`. Run `{os.environ['GITHUB_RUN_ID']}`, source `{os.environ['SOURCE_SHA']}`. Saved evidence only, mappings0/supplier0/Tourvisor0. NO-REPLAY; a write requires a NEW current transaction."
          (d/'summary.md').write_text(summary+'\n');print(summary)
          assert int(os.environ['RC'])==0 and x.get('status')=='completed' and x.get('operation_id')==os.environ['OPERATION_ID']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-identity-census-${{ github.run_id }}-result', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record result
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: test -f "$OUT/summary.md" && gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
      - name: Remove runner-only credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/hmc-key" "$RUNNER_TEMP/hmc-known" "$RUNNER_TEMP/hmc-stderr" "$RUNNER_TEMP/hmc-stdout"
