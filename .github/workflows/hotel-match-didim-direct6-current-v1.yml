name: MATCH Didim direct6 CURRENT v1
on:
  push:
    branches: [ops/match-didim-direct6-current-1971-20260919-v1]
    paths:
      - scripts/diagnostics/hotel_match_didim_direct6_current_v1.php
      - .github/workflows/hotel-match-didim-direct6-current-v1.yml
permissions: {contents: read, actions: read, issues: read}
env: {OPERATION_ID: hotel-match-didim-direct6-current-1971-20260919-v1, BASE_SHA: e9d7bf349bfb601dff04b7fc47088c1eff38b369, CLAIM: '5743158169'}
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact inputs and claim
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir -p input terminal
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA";test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l)" -eq 2
          php -l scripts/diagnostics/hotel_match_didim_direct6_current_v1.php;php scripts/diagnostics/hotel_match_didim_direct6_current_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('input/claim.json'));b=c['body'];assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert os.environ['OPERATION_ID'] in b and '10587367101' in b and '1863e0cb' in b and 'SIX' in b
          PY
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10587367101/zip >input/v7.zip
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10586732816/zip >input/v6.zip
          python3 - <<'PY'
          import hashlib,zipfile,tarfile,io,pathlib
          specs=[('v7.zip','b98d920138a8980e3d5954e72134771a5f7d337181a6357907a98d6904c49787','v7-result.json','1863e0cbac483965f859c1f00250939f77b114651e124f12e542b09de61a8947'),('v6.zip','3e4e2ece779f32ff32162831cae16fae110789103ab45fe19795ecaaba63c3b1','v6-result.json','46653546e4ae294e7e4c9e5c5c685dd21294a5fa4f867d43a261f4acab42d87b')]
          for z,zh,out,rh in specs:
           p=pathlib.Path('input',z);assert hashlib.sha256(p.read_bytes()).hexdigest()==zh
           with zipfile.ZipFile(p) as q:tb=q.read('server-operation.tgz')
           with tarfile.open(fileobj=io.BytesIO(tb),mode='r:gz') as t:b=t.extractfile(t.getmember('result.json')).read()
           assert hashlib.sha256(b).hexdigest()==rh;pathlib.Path('input',out).write_bytes(b)
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
           q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
           with urllib.request.urlopen(q) as f:r=json.load(f)['workflow_runs']
           xs=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
           if xs and max(xs,key=lambda z:z['id'])['status']=='completed':assert max(xs,key=lambda z:z['id'])['conclusion']=='success';break
           time.sleep(5)
          else:raise SystemExit(2)
          PY
      - name: Read current protections once
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_didim_direct6_current_v1.php input/v7-result.json input/v6-result.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_V7_RESULT=\"\$HOME/$op/payload/v7-result.json\" MATCH_V6_RESULT=\"\$HOME/$op/payload/v6-result.json\" php \"\$HOME/$op/payload/hotel_match_didim_direct6_current_v1.php\""
          ssh "${opts[@]}" "$remote" 'cd "$HOME/'"$op"'" && tar -czf - result.json receipt.json' >terminal/server.tgz
      - name: Verify read-only result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
           for n in ['result.json','receipt.json']:pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['state']==q['state']=='completed_read_only' and r['direct_bridge_count']==6 and r['provider_calls']==r['database_writes']==r['mapping_writes']==0
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert all(x['safe_to_write_now'] is False for x in r['rows'])
          print(json.dumps({'direct_bridge_count':6,'state_counts':r['state_counts'],'result_sha256':q['result_sha256']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-didim-direct6-current-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
