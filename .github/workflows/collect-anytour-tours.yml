name: Collect AnyTour tour observations

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/price-observer-v1.php'
      - 'v2/data/hotel-monitor-prices-v1.php'
      - 'v2/data/hotel-price-timer-v1.php'
      - 'tests/hotel-price-timer-smoke.php'
      - 'v2/data/hotel-monitor-prices-read-v1.php'
      - 'tests/hotel-monitor-prices-smoke.php'
      - 'v2/data/price-segment-v1.php'
      - 'v2/data/price-confidence-v1.php'
      - 'v2/data/price-intelligence-v1.php'
      - 'v2/data/price-intelligence-read-v1.php'
      - 'v2/data/migrate-price-daily-exact-v1.php'
      - 'v2/data/migrate-hotel-media-v1.php'
      - 'v2/data/rollup-price-daily-exact-v1.php'
      - 'v2/data/scheduled-collector-v1.php'
      - 'v2/data/migrate-collection-attempts-v1.php'
      - 'v2/data/migrate-matrix-collection-v1.php'
      - 'v2/data/matrix-collector-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/data/top500-anex-priority-v1.php'
      - 'app/integrations/anex-search-mapping-registry.php'
      - 'tests/top500-anex-namespace-smoke.php'
      - 'v2/data/published-hotels-monitor-v1.php'
      - 'tests/published-hotels-monitor-smoke.php'
      - 'tests/published-expansion20-monitor-smoke.php'
      - 'tests/published-expansion32-monitor-smoke.php'
      - 'tests/published-expansion217-monitor-smoke.php'
      - 'tests/published-expansion123-monitor-smoke.php'
      - 'v2/data/sync-priority-hotels-v1.php'
      - 'v2/data/top500-coverage-v1.php'
      - 'v2/data/top500-daily-plan-v1.php'
      - 'v2/data/top500-monthly-plan-v1.php'
      - 'v2/data/top500-daily-collector-v1.php'
      - 'v2/data/seasonal-page-gap-plan-v1.php'
      - 'tests/seasonal-page-gap-plan-smoke.php'
      - 'tests/top500-daily-plan-smoke.php'
      - 'tests/top500-monthly-plan-smoke.php'
      - 'tests/price-intelligence-smoke.php'
      - 'tests/seo-offer-image-smoke.php'
      - 'v2/data/rollup-price-daily-v1.php'
      - 'v2/data/build-seo-offer-snapshots-v1.php'
      - 'v2/seo-offer-snapshot-v1.php'
      - 'v2/seo-price-promo-v1.css'
      - '.github/workflows/collect-anytour-tours.yml'
      - 'tests/local_tv_capture_workflow_test.py'
      - 'tests/monitor_price_hook_workflow_test.py'
  push:
    branches: [main]
    paths:
      - 'v2/data/price-observer-v1.php'
      - 'v2/data/hotel-monitor-prices-v1.php'
      - 'v2/data/hotel-price-timer-v1.php'
      - 'tests/hotel-price-timer-smoke.php'
      - 'v2/data/hotel-monitor-prices-read-v1.php'
      - 'tests/hotel-monitor-prices-smoke.php'
      - 'v2/data/price-segment-v1.php'
      - 'v2/data/price-confidence-v1.php'
      - 'v2/data/price-intelligence-v1.php'
      - 'v2/data/price-intelligence-read-v1.php'
      - 'v2/data/migrate-price-daily-exact-v1.php'
      - 'v2/data/migrate-hotel-media-v1.php'
      - 'v2/data/rollup-price-daily-exact-v1.php'
      - 'v2/data/scheduled-collector-v1.php'
      - 'v2/data/migrate-collection-attempts-v1.php'
      - 'v2/data/migrate-matrix-collection-v1.php'
      - 'v2/data/matrix-collector-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/data/top500-anex-priority-v1.php'
      - 'app/integrations/anex-search-mapping-registry.php'
      - 'tests/top500-anex-namespace-smoke.php'
      - 'v2/data/published-hotels-monitor-v1.php'
      - 'tests/published-hotels-monitor-smoke.php'
      - 'tests/published-expansion20-monitor-smoke.php'
      - 'tests/published-expansion32-monitor-smoke.php'
      - 'tests/published-expansion217-monitor-smoke.php'
      - 'tests/published-expansion123-monitor-smoke.php'
      - 'v2/data/sync-priority-hotels-v1.php'
      - 'v2/data/top500-coverage-v1.php'
      - 'v2/data/top500-daily-plan-v1.php'
      - 'v2/data/top500-monthly-plan-v1.php'
      - 'v2/data/top500-daily-collector-v1.php'
      - 'v2/data/seasonal-page-gap-plan-v1.php'
      - 'tests/seasonal-page-gap-plan-smoke.php'
      - 'tests/top500-daily-plan-smoke.php'
      - 'tests/top500-monthly-plan-smoke.php'
      - 'tests/price-intelligence-smoke.php'
      - 'tests/seo-offer-image-smoke.php'
      - 'v2/data/rollup-price-daily-v1.php'
      - 'v2/data/build-seo-offer-snapshots-v1.php'
      - 'v2/seo-offer-snapshot-v1.php'
      - 'v2/seo-price-promo-v1.css'
      - '.github/workflows/collect-anytour-tours.yml'
      - 'tests/local_tv_capture_workflow_test.py'
      - 'tests/monitor_price_hook_workflow_test.py'
  schedule:
    # Small resumable passes; each successful/empty target is refreshed once/24h.
    - cron: '12 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Optional broad Tourvisor searches in a manual run (0-20)'
        required: true
        default: '2'
        type: string
      matrix_budget:
        description: 'Optional manual hotel/resort/month Tourvisor searches (1-30)'
        required: true
        default: '9'
        type: string
      matrix_months:
        description: 'Calendar months for TOP500 collection (1-18)'
        required: true
        default: '12'
        type: string
      monthly_budget:
        description: 'Maximum due weekly TOP500 batches in this pass (1-100)'
        required: true
        default: '64'
        type: string
      target_month:
        description: 'Optional targeted backfill month YYYY-MM; blank covers every month'
        required: false
        default: ''
        type: string
      target_country:
        description: 'Optional target country ID; 0 covers all countries'
        required: false
        default: '0'
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Exact reviewed LOCAL observation hook
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4473719a21b10633fcdc506fb007ad3496282f4b
          path: local-tv-source
          persist-credentials: false
      - name: Validate the installed LOCAL and PRICE observation contract
        env:
          LOCAL_TV_CAPTURE_SOURCE_ROOT: ${{ github.workspace }}/local-tv-source
        run: |
          python3 tests/local_tv_capture_workflow_test.py -v
          php local-tv-source/tests/local-tv-price-observer-test.php
      - name: Exact existing post and feed publisher callback
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: 44b4e0a7ce1146744ec152ded04790755124649f
          path: hotel-price-publisher
          persist-credentials: false
      - name: Validate daily freshness and full-month TOP500 coverage
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/sync-priority-hotels-v1.php >/dev/null
          php -l v2/data/top500-daily-plan-v1.php >/dev/null
          php -l v2/data/top500-monthly-plan-v1.php >/dev/null
          php -l v2/data/top500-daily-collector-v1.php >/dev/null
          php -l v2/data/seasonal-page-gap-plan-v1.php >/dev/null
          php tests/seasonal-page-gap-plan-smoke.php --registry
          php -l tests/top500-daily-plan-smoke.php >/dev/null
          php -l tests/top500-monthly-plan-smoke.php >/dev/null
          php -l v2/data/price-observer-v1.php >/dev/null
          php -l v2/data/hotel-monitor-prices-v1.php >/dev/null
          php -l v2/data/hotel-monitor-prices-read-v1.php >/dev/null
          php tests/hotel-monitor-prices-smoke.php
          php tests/hotel-price-timer-smoke.php
          php -l v2/data/price-segment-v1.php >/dev/null
          php -l v2/data/price-intelligence-v1.php >/dev/null
          php -l v2/data/price-intelligence-read-v1.php >/dev/null
          php -l v2/data/migrate-price-daily-exact-v1.php >/dev/null
          php -l v2/data/migrate-hotel-media-v1.php >/dev/null
          php -l v2/data/rollup-price-daily-exact-v1.php >/dev/null
          php -l tests/price-intelligence-smoke.php >/dev/null
          php -l tests/seo-offer-image-smoke.php >/dev/null
          php -l v2/data/top-hotels-v1.php >/dev/null
          php -l v2/data/published-hotels-monitor-v1.php >/dev/null
          php tests/published-hotels-monitor-smoke.php
          php tests/published-expansion20-monitor-smoke.php
          php tests/published-expansion32-monitor-smoke.php
          php tests/published-expansion217-monitor-smoke.php
          php tests/published-expansion123-monitor-smoke.php
          php -l v2/data/rollup-price-daily-v1.php >/dev/null
          php -l v2/data/build-seo-offer-snapshots-v1.php >/dev/null
          php -l v2/seo-offer-snapshot-v1.php >/dev/null
          php tests/top500-daily-plan-smoke.php
          php tests/top500-monthly-plan-smoke.php
          php tests/price-intelligence-smoke.php
          php tests/seo-offer-image-smoke.php
          php tests/top500-anex-namespace-smoke.php
          grep -Fq "fresh-hours=72 --expires-hours=72" .github/workflows/collect-anytour-tours.yml
          grep -Fq "'fresh-hours'), 72, 72, 168" v2/data/build-seo-offer-snapshots-v1.php
          grep -Fq "'expires-hours'), 72, 72, 168" v2/data/build-seo-offer-snapshots-v1.php
          grep -Fq 'max_observed_price_exact_comparable_segment' v2/data/price-intelligence-v1.php
          grep -Fq 'segmentFingerprint' v2/data/build-seo-offer-snapshots-v1.php
          grep -Fq 'hotelImage' v2/data/build-seo-offer-snapshots-v1.php
          grep -Fq 'picturelink' v2/data/price-observer-v1.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-contract.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-hook.php
          python3 hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-expansion1000-prefix.py
          python3 hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-expansion877.py
          python3 hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-expansion1000.py
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-nightly-policy.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-27316-cycle.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-reliability.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-driver-reliability.php
          php hotel-price-publisher/tools/direct_demand/operations/test-reconcile-stale-feed-20261116.php
          php -l hotel-price-publisher/tools/direct_demand/operations/inspect-monitor-price-pending-20261116.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-link.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-expansion20.php
          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-expansion32.php
          python3 hotel-price-publisher/tools/direct_demand/operations/build-monitor-price-hook.py "$RUNNER_TEMP/monitor-price-hook.php"
          php -l "$RUNNER_TEMP/monitor-price-hook.php"
          test "$(sha256sum "$RUNNER_TEMP/monitor-price-hook.php" | cut -d' ' -f1)" = 0aec7cabb8859449f7d4e1a8746d4f8b4b987a98cf14f9412a9b230121b106a7
          python3 tests/monitor_price_hook_workflow_test.py
          echo ANYTOUR_TOP500_MONTHLY_TOOLING_OK

  collect-production:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    concurrency:
      group: anytour-scheduled-tour-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Existing collection (25 min) plus one bounded post-maintenance cycle and setup.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Exact reviewed LOCAL observation hook
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4473719a21b10633fcdc506fb007ad3496282f4b
          path: local-tv-source
          persist-credentials: false
      - name: Exact existing post and feed publisher callback
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: 44b4e0a7ce1146744ec152ded04790755124649f
          path: hotel-price-publisher
          persist-credentials: false
      - name: Bundle the reviewed existing publisher callback
        shell: bash
        run: |
          set -euo pipefail
          python3 hotel-price-publisher/tools/direct_demand/operations/build-monitor-price-hook.py "$RUNNER_TEMP/monitor-price-hook.php"
          php -l "$RUNNER_TEMP/monitor-price-hook.php"
          test "$(sha256sum "$RUNNER_TEMP/monitor-price-hook.php" | cut -d' ' -f1)" = 0aec7cabb8859449f7d4e1a8746d4f8b4b987a98cf14f9412a9b230121b106a7
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Collect due TOP500 months and refresh production aggregates
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          BUDGET_VALUE: ${{ inputs.budget || '2' }}
          MATRIX_BUDGET_VALUE: ${{ inputs.matrix_budget || '9' }}
          MATRIX_MONTHS_VALUE: ${{ inputs.matrix_months || '12' }}
          MONTHLY_BUDGET_VALUE: ${{ inputs.monthly_budget || '64' }}
          TARGET_MONTH_VALUE: ${{ inputs.target_month || '' }}
          TARGET_COUNTRY_VALUE: ${{ inputs.target_country || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$MATRIX_BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$MATRIX_MONTHS_VALUE" =~ ^[0-9]+$ ]]
          [[ "$MONTHLY_BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$TARGET_COUNTRY_VALUE" =~ ^[0-9]+$ ]]
          [[ -z "$TARGET_MONTH_VALUE" || "$TARGET_MONTH_VALUE" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]
          test "$BUDGET_VALUE" -ge 0 && test "$BUDGET_VALUE" -le 20
          test "$MATRIX_BUDGET_VALUE" -ge 1 && test "$MATRIX_BUDGET_VALUE" -le 30
          test "$MATRIX_MONTHS_VALUE" -ge 1 && test "$MATRIX_MONTHS_VALUE" -le 18
          test "$MONTHLY_BUDGET_VALUE" -ge 1 && test "$MONTHLY_BUDGET_VALUE" -le 100
          test "$TARGET_COUNTRY_VALUE" -ge 0 && test "$TARGET_COUNTRY_VALUE" -le 1000000
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          expected_db_sha=$(sha256sum v2/data/db-v1.php | cut -d' ' -f1)
          expected_observer_sha=$(sha256sum local-tv-source/v2/data/price-observer-v1.php | cut -d' ' -f1)
          # Shared helpers keep their identity when the delivered bytes already match.
          deliver_shared_helpers() {
            python3 - "$@" <<'PY' | ssh "${opts[@]}" "$remote" 'python3 -'
          import base64, hashlib, os, pathlib, stat, sys
          LIMIT = 65536
          FIELDS = ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size',
                    'st_mtime_ns', 'st_ctime_ns', 'st_uid', 'st_gid')
          ALLOWED = ('v2/data/db-v1.php', 'v2/data/price-segment-v1.php',
                     'v2/data/price-confidence-v1.php', 'v2/data/price-intelligence-v1.php')
          paths = tuple(sys.argv[1:])
          if paths not in (ALLOWED, ALLOWED[:1]):
              raise SystemExit('shared_helper_source_scope')
          payload = []
          for relative in paths:
              path = pathlib.Path(relative)
              if path.resolve() != pathlib.Path.cwd() / relative:
                  raise SystemExit('shared_helper_source_path')
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  if not (stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and before.st_uid == os.geteuid() and stat.S_IMODE(before.st_mode) == 0o644
                          and 0 < before.st_size <= LIMIT):
                      raise SystemExit('shared_helper_source_metadata')
                  chunks = []
                  while True:
                      chunk = os.read(fd, LIMIT + 1)
                      if not chunk:
                          break
                      chunks.append(chunk)
                      if sum(map(len, chunks)) > LIMIT:
                          raise SystemExit('shared_helper_source_limit')
                  body = b''.join(chunks)
                  stamp = tuple(getattr(before, key) for key in FIELDS)
                  if (tuple(getattr(os.fstat(fd), key) for key in FIELDS) != stamp
                          or tuple(getattr(path.lstat(), key) for key in FIELDS) != stamp
                          or len(body) != before.st_size):
                      raise SystemExit('shared_helper_source_changed')
              finally:
                  os.close(fd)
              payload.append((path.name, len(body), hashlib.sha256(body).hexdigest(),
                              base64.b64encode(body).decode('ascii')))
          REMOTE = r'''
          import base64, ctypes, hashlib, json, os, pathlib, stat, sys
          LIMIT = 65536
          FIELDS = ('st_dev', 'st_ino', 'st_mode', 'st_nlink', 'st_size',
                    'st_mtime_ns', 'st_ctime_ns', 'st_uid', 'st_gid')
          NAMES = ('db-v1.php', 'price-segment-v1.php', 'price-confidence-v1.php', 'price-intelligence-v1.php')
          LIBC = ctypes.CDLL(None, use_errno=True)
          RENAME = getattr(LIBC, 'renameat2', None)
          def require(ok, reason):
              if not ok:
                  raise RuntimeError(reason)
          def stamp(value):
              return tuple(getattr(value, key) for key in FIELDS)
          def directory_id(value):
              return (value.st_dev, value.st_ino, value.st_mode, value.st_nlink, value.st_uid, value.st_gid)
          def rename_fixed(directory, left, right, flag):
              require(RENAME is not None, 'shared_helper_unsupported_platform')
              RENAME.argtypes = [ctypes.c_int, ctypes.c_char_p, ctypes.c_int, ctypes.c_char_p, ctypes.c_uint]
              RENAME.restype = ctypes.c_int
              if RENAME(directory, left.encode(), directory, right.encode(), flag) != 0:
                  raise OSError(ctypes.get_errno(), 'shared_helper_rename_failed')
          def same_renamed(actual, expected):
              return (actual is not None and expected is not None and actual[0] == expected[0]
                      and all(actual[1][i] == expected[1][i] for i, key in enumerate(FIELDS)
                              if key != 'st_ctime_ns'))
          def read_target(directory, name):
              try:
                  fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
              except FileNotFoundError:
                  return None
              try:
                  before = os.fstat(fd)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and before.st_uid == os.geteuid() and stat.S_IMODE(before.st_mode) == 0o644
                          and before.st_size <= LIMIT, 'shared_helper_target_metadata')
                  chunks = []
                  while True:
                      chunk = os.read(fd, LIMIT + 1)
                      if not chunk:
                          break
                      chunks.append(chunk)
                      require(sum(map(len, chunks)) <= LIMIT, 'shared_helper_target_limit')
                  body = b''.join(chunks)
                  require(stamp(os.fstat(fd)) == stamp(before)
                          and stamp(os.stat(name, dir_fd=directory, follow_symlinks=False)) == stamp(before)
                          and len(body) == before.st_size, 'shared_helper_target_changed')
                  return body, stamp(before)
              finally:
                  os.close(fd)
          def restore_displaced(directory, name, displaced, owned):
              # Capture first; no other writer's replacement is overwritten or deleted.
              captured = '.anytour-shared-' + os.urandom(12).hex() + '.capture'
              rename_fixed(directory, name, captured, 1)
              try:
                  require(same_renamed(read_target(directory, captured), owned),
                          'shared_helper_recovery_conflict')
              except Exception:
                  rename_fixed(directory, captured, name, 1)
                  raise
              rename_fixed(directory, displaced, name, 1)
              current = read_target(directory, captured)
              require(same_renamed(current, owned), 'shared_helper_recovery_conflict')
              os.unlink(captured, dir_fd=directory)
              os.fsync(directory)
          def deliver(payload):
              opened = []
              temporary = None
              temporary_identity = None
              installed = []
              unchanged = []
              try:
                  names = tuple(row[0] for row in payload)
                  require(names in (NAMES, NAMES[:1]), 'shared_helper_payload_scope')
                  require(RENAME is not None, 'shared_helper_unsupported_platform')
                  wanted = {}
                  for name, size, digest, encoded in payload:
                      require(type(size) is int and 0 < size <= LIMIT, 'shared_helper_payload_size')
                      body = base64.b64decode(encoded, validate=True)
                      require(len(body) == size and hashlib.sha256(body).hexdigest() == digest,
                              'shared_helper_payload_hash')
                      wanted[name] = body
                  home = pathlib.Path.home()
                  require(home.is_absolute() and home.resolve() == home, 'shared_helper_home_path')
                  parent = None
                  chain = []
                  for name in (str(home), 'www', 'anytoour.ru', 'data'):
                      fd = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent)
                      opened.append(fd)
                      value = os.fstat(fd)
                      require(stat.S_ISDIR(value.st_mode) and value.st_uid == os.geteuid()
                              and not (stat.S_IMODE(value.st_mode) & 0o022), 'shared_helper_parent_metadata')
                      chain.append((parent, name, directory_id(value)))
                      parent = fd
                  directory = parent
                  def parents_stable():
                      for parent_fd, name, expected in chain:
                          require(directory_id(os.stat(name, dir_fd=parent_fd, follow_symlinks=False)) == expected,
                                  'shared_helper_parent_changed')
                  before = {name: read_target(directory, name) for name in names}
                  parents_stable()
                  require({name: read_target(directory, name) for name in names} == before,
                          'shared_helper_inventory_changed')
                  after = {}
                  for name in names:
                      parents_stable()
                      require(read_target(directory, name) == before[name], 'shared_helper_before_write_changed')
                      if before[name] is not None and before[name][0] == wanted[name]:
                          unchanged.append(name)
                          after[name] = before[name]
                          continue
                      candidate = '.anytour-shared-' + os.urandom(12).hex() + '.tmp'
                      fd = os.open(candidate, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                   0o644, dir_fd=directory)
                      temporary = candidate
                      created = os.fstat(fd)
                      temporary_identity = (created.st_dev, created.st_ino)
                      try:
                          os.fchmod(fd, 0o644)
                          body = wanted[name]
                          offset = 0
                          while offset < len(body):
                              count = os.write(fd, body[offset:])
                              require(count > 0, 'shared_helper_short_write')
                              offset += count
                          os.fsync(fd)
                      finally:
                          os.close(fd)
                      staged = read_target(directory, temporary)
                      require(staged is not None and staged[0] == wanted[name], 'shared_helper_stage_hash')
                      parents_stable()
                      require(read_target(directory, name) == before[name], 'shared_helper_commit_changed')
                      if before[name] is None:
                          rename_fixed(directory, temporary, name, 1)
                          installed.append(name)
                          temporary = None
                      else:
                          rename_fixed(directory, temporary, name, 2)
                          installed.append(name)
                          try:
                              original = read_target(directory, temporary)
                              original_matches = same_renamed(original, before[name])
                          except Exception:
                              original_matches = False
                          if not original_matches:
                              restore_displaced(directory, name, temporary, staged)
                              temporary = None
                              raise RuntimeError('shared_helper_exchange_conflict')
                      after[name] = read_target(directory, name)
                      require(same_renamed(after[name], staged), 'shared_helper_readback_identity')
                      if temporary is not None:
                          require(read_target(directory, temporary) == original, 'shared_helper_displaced_changed')
                          os.unlink(temporary, dir_fd=directory)
                          temporary = None
                      os.fsync(directory)
                  parents_stable()
                  require({name: read_target(directory, name) for name in names} == after,
                          'shared_helper_final_inventory_changed')
                  print('ANYTOUR_SHARED_HELPERS ' + json.dumps(
                      {'status': 'delivered', 'unchanged': unchanged, 'written': installed}, sort_keys=True))
              except Exception as error:
                  reason = str(error) if isinstance(error, RuntimeError) else 'shared_helper_filesystem_error'
                  print('ANYTOUR_SHARED_HELPERS ' + json.dumps(
                      {'status': 'failed', 'reason': reason, 'unchanged': unchanged, 'written': installed}, sort_keys=True))
                  raise SystemExit(1)
              finally:
                  # After exchange this name may hold a displaced foreign file. Never unlink it.
                  if temporary is not None:
                      try:
                          value = os.stat(temporary, dir_fd=opened[-1], follow_symlinks=False)
                          if (value.st_dev, value.st_ino) == temporary_identity:
                              os.unlink(temporary, dir_fd=opened[-1])
                      except OSError:
                          pass
                  for fd in reversed(opened):
                      os.close(fd)
          '''
