name: Collect AnyTour tour observations

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/price-observer-v1.php'
      - 'v2/data/price-segment-v1.php'
      - 'v2/data/price-confidence-v1.php'
      - 'v2/data/price-intelligence-v1.php'
      - 'v2/data/price-intelligence-read-v1.php'
      - 'v2/data/migrate-price-daily-exact-v1.php'
      - 'v2/data/rollup-price-daily-exact-v1.php'
      - 'v2/data/scheduled-collector-v1.php'
      - 'v2/data/migrate-collection-attempts-v1.php'
      - 'v2/data/migrate-matrix-collection-v1.php'
      - 'v2/data/matrix-collector-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/data/sync-priority-hotels-v1.php'
      - 'v2/data/top500-coverage-v1.php'
      - 'v2/data/top500-daily-plan-v1.php'
      - 'v2/data/top500-daily-collector-v1.php'
      - 'tests/top500-daily-plan-smoke.php'
      - 'tests/price-intelligence-smoke.php'
      - 'v2/data/rollup-price-daily-v1.php'
      - 'v2/data/build-seo-offer-snapshots-v1.php'
      - '.github/workflows/collect-anytour-tours.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/price-observer-v1.php'
      - 'v2/data/price-segment-v1.php'
      - 'v2/data/price-confidence-v1.php'
      - 'v2/data/price-intelligence-v1.php'
      - 'v2/data/price-intelligence-read-v1.php'
      - 'v2/data/migrate-price-daily-exact-v1.php'
      - 'v2/data/rollup-price-daily-exact-v1.php'
      - 'v2/data/scheduled-collector-v1.php'
      - 'v2/data/migrate-collection-attempts-v1.php'
      - 'v2/data/migrate-matrix-collection-v1.php'
      - 'v2/data/matrix-collector-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/data/sync-priority-hotels-v1.php'
      - 'v2/data/top500-coverage-v1.php'
      - 'v2/data/top500-daily-plan-v1.php'
      - 'v2/data/top500-daily-collector-v1.php'
      - 'tests/top500-daily-plan-smoke.php'
      - 'tests/price-intelligence-smoke.php'
      - 'v2/data/rollup-price-daily-v1.php'
      - 'v2/data/build-seo-offer-snapshots-v1.php'
      - '.github/workflows/collect-anytour-tours.yml'
  schedule:
    - cron: '12 2 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Optional broad Tourvisor searches in a manual run (0-20)'
        required: true
        default: '2'
        type: string
      matrix_budget:
        description: 'Optional manual hotel/resort/month Tourvisor searches (1-30)'
        required: true
        default: '9'
        type: string
      matrix_months:
        description: 'Upcoming calendar months for optional manual matrix rotation (1-18)'
        required: true
        default: '12'
        type: string

concurrency:
  group: anytour-scheduled-tour-collector
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact daily TOP500 contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/sync-priority-hotels-v1.php >/dev/null
          php -l v2/data/top500-daily-plan-v1.php >/dev/null
          php -l v2/data/top500-daily-collector-v1.php >/dev/null
          php -l tests/top500-daily-plan-smoke.php >/dev/null
          php -l v2/data/price-observer-v1.php >/dev/null
          php -l v2/data/price-segment-v1.php >/dev/null
          php -l v2/data/price-intelligence-v1.php >/dev/null
          php -l v2/data/price-intelligence-read-v1.php >/dev/null
          php -l v2/data/migrate-price-daily-exact-v1.php >/dev/null
          php -l v2/data/rollup-price-daily-exact-v1.php >/dev/null
          php -l tests/price-intelligence-smoke.php >/dev/null
          php -l v2/data/top-hotels-v1.php >/dev/null
          php -l v2/data/rollup-price-daily-v1.php >/dev/null
          php -l v2/data/build-seo-offer-snapshots-v1.php >/dev/null
          php tests/top500-daily-plan-smoke.php
          php tests/price-intelligence-smoke.php
          php -r "require 'v2/data/top-hotels-v1.php'; \$ids=v2_priority_hotel_ids(); if (count(\$ids)!==492 || count(array_unique(\$ids))!==492) exit(1); echo 'TOP500_PRIORITY_SET_OK count=492'.PHP_EOL;"
          grep -Fq "fresh-hours=72 --expires-hours=72" .github/workflows/collect-anytour-tours.yml
          grep -Fq "'fresh-hours'), 72, 72, 168" v2/data/build-seo-offer-snapshots-v1.php
          grep -Fq "'expires-hours'), 72, 72, 168" v2/data/build-seo-offer-snapshots-v1.php
          grep -Fq 'max_of_daily_min_exact_comparable_segment' v2/data/price-intelligence-v1.php
          grep -Fq 'segmentFingerprint' v2/data/build-seo-offer-snapshots-v1.php
          echo ANYTOUR_TOP500_DAILY_TOOLING_OK

  collect-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Collect full TOP500 and refresh production aggregates
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          BUDGET_VALUE: ${{ inputs.budget || '2' }}
          MATRIX_BUDGET_VALUE: ${{ inputs.matrix_budget || '9' }}
          MATRIX_MONTHS_VALUE: ${{ inputs.matrix_months || '12' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$MATRIX_BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$MATRIX_MONTHS_VALUE" =~ ^[0-9]+$ ]]
          test "$BUDGET_VALUE" -ge 0 && test "$BUDGET_VALUE" -le 20
          test "$MATRIX_BUDGET_VALUE" -ge 1 && test "$MATRIX_BUDGET_VALUE" -le 30
          test "$MATRIX_MONTHS_VALUE" -ge 1 && test "$MATRIX_MONTHS_VALUE" -le 18
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          scp "${opts[@]}" \
            v2/data/db-v1.php \
            v2/data/tourvisor-client-v1.php \
            v2/data/price-observer-v1.php \
            v2/data/price-segment-v1.php \
            v2/data/price-confidence-v1.php \
            v2/data/price-intelligence-v1.php \
            v2/data/migrate-price-daily-exact-v1.php \
            v2/data/rollup-price-daily-exact-v1.php \
            v2/data/migrate-collection-attempts-v1.php \
            v2/data/scheduled-collector-v1.php \
            v2/data/migrate-matrix-collection-v1.php \
            v2/data/top-hotels-v1.php \
            v2/data/sync-priority-hotels-v1.php \
            v2/data/top500-coverage-v1.php \
            v2/data/top500-daily-plan-v1.php \
            v2/data/top500-daily-collector-v1.php \
            v2/data/matrix-collector-v1.php \
            v2/data/rollup-price-daily-v1.php \
            v2/data/build-seo-offer-snapshots-v1.php \
            "$remote:$remote_dir/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru/data\"
            php -l \"\$root/sync-priority-hotels-v1.php\" >/dev/null
            php -l \"\$root/top500-daily-plan-v1.php\" >/dev/null
            php -l \"\$root/top500-daily-collector-v1.php\" >/dev/null
            php \"\$root/migrate-collection-attempts-v1.php\"
            php \"\$root/migrate-matrix-collection-v1.php\"
            php \"\$root/migrate-price-daily-exact-v1.php\"
            reconcile_status=0
            php \"\$root/sync-priority-hotels-v1.php\" --limit=500 || reconcile_status=\$?
            if [ \"\$reconcile_status\" -ne 0 ]; then echo \"PRIORITY_HOTEL_SYNC_WARNING status=\$reconcile_status\"; fi
            php \"\$root/top500-coverage-v1.php\"
            php \"\$root/top500-daily-collector-v1.php\" --preferred-departure-id=1 --start-days=1
            if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
              php \"\$root/scheduled-collector-v1.php\" --scheduled-search-budget='$BUDGET_VALUE'
              php \"\$root/matrix-collector-v1.php\" --budget='$MATRIX_BUDGET_VALUE' --months='$MATRIX_MONTHS_VALUE'
            fi
            php \"\$root/top500-coverage-v1.php\"
            php \"\$root/rollup-price-daily-v1.php\" --days=31
            php \"\$root/rollup-price-daily-exact-v1.php\" --days=31
            php \"\$root/build-seo-offer-snapshots-v1.php\" --fresh-hours=72 --expires-hours=72 --offers-per-page=10
          "
