name: Collect AnyTour tour observations

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/price-observer-v1.php'
      - 'v2/data/scheduled-collector-v1.php'
      - 'v2/data/migrate-collection-attempts-v1.php'
      - 'v2/data/migrate-matrix-collection-v1.php'
      - 'v2/data/matrix-collector-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/data/rollup-price-daily-v1.php'
      - '.github/workflows/collect-anytour-tours.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/price-observer-v1.php'
      - 'v2/data/scheduled-collector-v1.php'
      - 'v2/data/migrate-collection-attempts-v1.php'
      - 'v2/data/migrate-matrix-collection-v1.php'
      - 'v2/data/matrix-collector-v1.php'
      - 'v2/data/top-hotels-v1.php'
      - 'v2/data/rollup-price-daily-v1.php'
      - '.github/workflows/collect-anytour-tours.yml'
  schedule:
    - cron: '12 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Maximum broad Tourvisor searches in this run (0-20)'
        required: true
        default: '2'
        type: string
      matrix_budget:
        description: 'Hotel/resort/month Tourvisor searches in this run (1-30)'
        required: true
        default: '9'
        type: string
      matrix_months:
        description: 'Upcoming calendar months to rotate through (1-18)'
        required: true
        default: '12'
        type: string

concurrency:
  group: anytour-scheduled-tour-collector
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate collector contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/price-observer-v1.php
          php -l v2/data/scheduled-collector-v1.php
          php -l v2/data/migrate-collection-attempts-v1.php
          php -l v2/data/migrate-matrix-collection-v1.php
          php -l v2/data/top-hotels-v1.php
          php -l v2/data/matrix-collector-v1.php
          php -l v2/data/rollup-price-daily-v1.php
          grep -Fq "['user_search', 'scheduled_monitor', 'hot_tours']" v2/data/price-observer-v1.php
          grep -Fq "'source'=>'scheduled_monitor'" v2/data/scheduled-collector-v1.php
          grep -Fq "array_chunk(\$ids,30)" v2/data/matrix-collector-v1.php
          grep -Fq "v2_priority_hotel_ids()" v2/data/matrix-collector-v1.php
          grep -Fq "ceil(\$budget*0.55)" v2/data/matrix-collector-v1.php
          grep -Fq "\$search['hotelIds']=\$t['hotel_ids']" v2/data/matrix-collector-v1.php
          grep -Fq "\$search['regionIds']=[\$t['region_id']]" v2/data/matrix-collector-v1.php
          grep -Fq "modify('+20 days')" v2/data/matrix-collector-v1.php
          grep -Fq "'maxHotels'=>5000" v2/data/matrix-collector-v1.php
          grep -Fq "'maxTours'=>50000" v2/data/matrix-collector-v1.php
          grep -Fq 'PRICE_DAILY_ROLLUP_OK' v2/data/rollup-price-daily-v1.php
          php -r "require 'v2/data/top-hotels-v1.php'; \$ids=v2_priority_hotel_ids(); if (count(\$ids)!==492 || count(array_unique(\$ids))!==492 || \$ids[0]!==22879 || end(\$ids)!==42155) exit(1);"
          php -r "require 'v2/data/price-observer-v1.php'; if (v2_price_observer_source('scheduled_monitor') !== 'scheduled_monitor' || v2_price_observer_limit(99999,100,5000)!==5000) exit(1);"
          echo ANYTOUR_MATRIX_COLLECTOR_TOOLING_OK

  collect-production:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Collect and refresh production aggregates
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          BUDGET_VALUE: ${{ inputs.budget || '2' }}
          MATRIX_BUDGET_VALUE: ${{ inputs.matrix_budget || '9' }}
          MATRIX_MONTHS_VALUE: ${{ inputs.matrix_months || '12' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$MATRIX_BUDGET_VALUE" =~ ^[0-9]+$ ]] && [[ "$MATRIX_MONTHS_VALUE" =~ ^[0-9]+$ ]]
          test "$BUDGET_VALUE" -ge 0 && test "$BUDGET_VALUE" -le 20
          test "$MATRIX_BUDGET_VALUE" -ge 1 && test "$MATRIX_BUDGET_VALUE" -le 30
          test "$MATRIX_MONTHS_VALUE" -ge 1 && test "$MATRIX_MONTHS_VALUE" -le 18
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          scp "${opts[@]}" \
            v2/data/db-v1.php \
            v2/data/tourvisor-client-v1.php \
            v2/data/price-observer-v1.php \
            v2/data/migrate-collection-attempts-v1.php \
            v2/data/scheduled-collector-v1.php \
            v2/data/migrate-matrix-collection-v1.php \
            v2/data/top-hotels-v1.php \
            v2/data/matrix-collector-v1.php \
            v2/data/rollup-price-daily-v1.php \
            "$remote:$remote_dir/"
          ssh "${opts[@]}" "$remote" "
            set -euo pipefail
            root=\"\$HOME/www/anytoour.ru/data\"
            php -l \"\$root/tourvisor-client-v1.php\" >/dev/null
            php -l \"\$root/price-observer-v1.php\" >/dev/null
            php -l \"\$root/scheduled-collector-v1.php\" >/dev/null
            php -l \"\$root/top-hotels-v1.php\" >/dev/null
            php -l \"\$root/matrix-collector-v1.php\" >/dev/null
            php -l \"\$root/rollup-price-daily-v1.php\" >/dev/null
            php \"\$root/migrate-collection-attempts-v1.php\"
            php \"\$root/migrate-matrix-collection-v1.php\"
            php \"\$root/scheduled-collector-v1.php\" --scheduled-search-budget='$BUDGET_VALUE'
            php \"\$root/matrix-collector-v1.php\" --budget='$MATRIX_BUDGET_VALUE' --months='$MATRIX_MONTHS_VALUE'
            php \"\$root/rollup-price-daily-v1.php\" --days=31
          "
