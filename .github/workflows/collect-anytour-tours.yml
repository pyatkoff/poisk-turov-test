name: Validate expansion20 source and published priority without production
on:
  push:
    branches: ['source/1142-monitor628-20261116']
    paths: ['.github/workflows/collect-anytour-tours.yml']
permissions:
  contents: write
  actions: read
jobs:
  validate:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.before == '059f85afd18b5fa768e6c880bde7fd4a7fa18f2c' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: dfb72ea60bbc68036295787ec63de75fbfea581f
          path: accepted-base
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: db99af43e8ab11b3675fdbf7875da6e8ea6849ee
          path: hotel-price-publisher
          persist-credentials: false
      - name: Prepare reviewed cohort and workflow then bind published priority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 059f85afd18b5fa768e6c880bde7fd4a7fa18f2c
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/main --jq .object.sha)" = dfb72ea60bbc68036295787ec63de75fbfea581f
          umask 077
          mkdir "$RUNNER_TEMP/expansion20-source"
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,textwrap,os
          prior=subprocess.check_output(['git','show','059f85afd18b5fa768e6c880bde7fd4a7fa18f2c:.github/workflows/collect-anytour-tours.yml'])
          assert hashlib.sha1(b'blob '+str(len(prior)).encode()+b'\0'+prior).hexdigest()=='be1df8b49b41a4af39d6f7325c7338e89f043439'
          marker="          python3 - <<'PY'\n"
          generator=prior.decode().split(marker,1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(generator),'reviewed-expansion20-source-generator','exec'))
          p=pathlib.Path('v2/data/top500-daily-collector-v1.php');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='28490c87851581a9329e40e1cda8b9f66894a6ae'
          old="$queue=v2_top500_monthly_queue($plan['targets'],$attempts,$now,$freshHours,v2_sites_hotel_monitor_ids_20261111());"
          new="$queue=v2_top500_monthly_queue($plan['targets'],$attempts,$now,$freshHours,array_merge(v2_sites_hotel_monitor_ids_20261111(),v2_published_expansion20_monitor_ids_20261116()));"
          text=raw.decode();assert text.count(old)==1;p.write_text(text.replace(old,new))
          p=pathlib.Path('tests/published-expansion20-monitor-smoke.php');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='6789a6466f335d467ef09cb56bde2bfdfef0d8a9'
          text=raw.decode();marker="echo 'PUBLISHED_EXPANSION20_OK checks='";assert text.count(marker)==1
          extra="""// Actual caller must use the same published priority; incomplete searches still come first.
          $publishedIds=array_merge(v2_sites_hotel_monitor_ids_20261111(),v2_published_expansion20_monitor_ids_20261116());
          $prioritized=v2_top500_monthly_queue($full['targets'],[$attempt],$now,24,$publishedIds);
          expansion_check($prioritized['targets'][0]['resume_search_id']===123456,'published_priority_displaced_resume');
          $publishedTargets=0;
          foreach($prioritized['targets'] as $target){
              if(array_intersect($target['hotel_ids'],$ids)!==[]){$publishedTargets++;expansion_check($target['_published']===true,'new_published_target_has_stock_priority');}
          }
          expansion_check($publishedTargets>0,'published_priority_fixture_empty');
          $ordinary=v2_top500_monthly_queue($full['targets'],[],$now,24,$publishedIds);
          expansion_check(array_intersect($ordinary['targets'][0]['hotel_ids'],$ids)!==[],'unpublished_stock_before_new_publications');
          $caller=file_get_contents(__DIR__.'/../v2/data/top500-daily-collector-v1.php');
          expansion_check(str_contains($caller,'array_merge(v2_sites_hotel_monitor_ids_20261111(),v2_published_expansion20_monitor_ids_20261116())'),'canonical_caller_priority_missing');
          """
          p.write_text(text.replace(marker,textwrap.dedent(extra)+marker))
          print('PUBLISHED20_PRIORITY_WIRED old_target_keys=unchanged supplier_budget=unchanged')
          PY
      - name: Run actual final collector validation with published-priority regression
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/expansion20-source/validate.sh" | tee "$RUNNER_TEMP/expansion20-source/validate.log"
          git diff --check
      - name: Retain immutable final blobs without moving refs or production
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,base64,subprocess,os
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'expansion20-source';entries=[]
          for path in ['v2/data/published-hotels-monitor-v1.php','v2/data/top500-daily-collector-v1.php','.github/workflows/collect-anytour-tours.yml','tests/published-expansion20-monitor-smoke.php']:
            raw=pathlib.Path(path).read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/pyatkoff/poisk-turov-test/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),timeout=60))
            assert result['sha']==sha
            entries.append({'path':path,'sha':sha,'type':'blob','mode':'100644','sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
            target=w/'files'/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
          out={'source_head':os.environ['GITHUB_SHA'],'base':'dfb72ea60bbc68036295787ec63de75fbfea581f','publisher':'db99af43e8ab11b3675fdbf7875da6e8ea6849ee','files':entries,'branch_writes':0,'production_calls':0,'supplier_calls':0,'post_writes':0}
          (w/'git-blobs.json').write_text(json.dumps(out,indent=2)+'\n');print('EXPANSION20_CONSUMER_READY='+json.dumps(out,separators=(',',':')))
          PY
      - name: Retain tested final source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion20-collector-source-${{ github.run_id }}
          path: ${{ runner.temp }}/expansion20-source/
          if-no-files-found: error
          retention-days: 30
