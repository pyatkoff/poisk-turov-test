name: Validate exact660 consumer without production
on:
  push:
    branches: ['source/1142-monitor660-20261116']
    paths: ['.github/workflows/collect-anytour-tours.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: anytour-monitor660-source-preparation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '45fd075f2a2b89f3f4991ad95b709f19039aaefc' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fd8565b2286f8ba253c847e70970fbaea5ffa0e9
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: b3d5dca2a7c8cecee88db1404cb2a8c28d26841e
          path: consumer/hotel-price-publisher
          persist-credentials: false
      - name: Check exact base and generate five scoped consumer files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 45fd075f2a2b89f3f4991ad95b709f19039aaefc
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/main --jq .object.sha)" = fd8565b2286f8ba253c847e70970fbaea5ffa0e9
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/source/1142-monitor660-20261116 --jq .object.sha)" = "$GITHUB_SHA"
          test "$(git -C consumer/hotel-price-publisher rev-parse HEAD)" = b3d5dca2a7c8cecee88db1404cb2a8c28d26841e
          umask 077
          mkdir "$RUNNER_TEMP/consumer660"
          python3 -m py_compile tools/prepare_monitor660_consumer_20261116.py
          python3 tools/prepare_monitor660_consumer_20261116.py consumer "$RUNNER_TEMP/consumer660"
          git -C consumer diff --check
          git -C consumer diff --binary > "$RUNNER_TEMP/consumer660/consumer.patch"
      - name: Run the complete final canonical native validation shell
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          php -l tests/published-expansion32-monitor-smoke.php
          bash "$RUNNER_TEMP/consumer660/canonical-validate.sh" 2>&1 | tee "$RUNNER_TEMP/consumer660/native-validation.txt"
          python3 - <<'PY'
          import pathlib,hashlib,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          raw=(p/'monitor-price-hook.php').read_bytes()
          assert len(raw)==608018 and hashlib.sha256(raw).hexdigest()=='dd85c064745f77f2b72b637fa4b572562ffcc2a318c2f35578c016e6f5e88e72'
          print('CONSUMER_EXACT660_BUNDLE_VERIFIED production_calls=0')
          PY
      - name: Retain checked source objects without moving main or creating production runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,base64,subprocess,os
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'consumer660';m=json.loads((w/'manifest.json').read_bytes());rows=[]
          assert m['base']=='fd8565b2286f8ba253c847e70970fbaea5ffa0e9' and len(m['files'])==5
          for r in m['files']:
            raw=(w/'files'/r['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==r['sha256']
            data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode()
            result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/pyatkoff/poisk-turov-test/git/blobs','--input','-'],input=data,timeout=60));assert result['sha']==r['sha']
            rows.append({**r,'mode':'100644','type':'blob'})
          (w/'git-blobs.json').write_text(json.dumps({'base':m['base'],'publisher':m['publisher'],'blobs':rows,'branch_updates':0,'production_calls':0,'supplier_calls':0},indent=2)+'\n')
          print('CONSUMER660_SOURCE_READY='+json.dumps(rows,separators=(',',':')))
          PY
      - name: Preserve exact original result and generated source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer660-source-${{ github.run_id }}
          path: ${{ runner.temp }}/consumer660/
          retention-days: 30
          if-no-files-found: error
