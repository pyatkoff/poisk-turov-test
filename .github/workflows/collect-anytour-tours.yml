name: Validate coherent publisher pins in both reliability660 phases
on:
  push:
    branches: ['source/1142-monitor660-20261116']
    paths: ['.github/workflows/collect-anytour-tours.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: anytour-monitor660-source-preparation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == '352659602500ab308181cc86e570349db1ccbd2b' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e1b510bffc3c7f4214023a43528efbfe4915aaa3
          path: consumer
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 7bbbbe5143e689a794f05874ef4f4e1eebd63e88
          path: original-phases
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: a1dc3f6712dc74d97bf90ab46a747ed3b2db4e68
          path: consumer/hotel-price-publisher
          persist-credentials: false
      - name: Complete exact phase integration with the existing pin assertion retained
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 352659602500ab308181cc86e570349db1ccbd2b
          python3 - <<'PY'
          import pathlib,subprocess,hashlib,os
          original=subprocess.check_output(['git','show','352659602500ab308181cc86e570349db1ccbd2b:.github/workflows/collect-anytour-tours.yml'])
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='68275b03ee26248225a6dd31b11f4583b2943dd2'
          marker='      - name: Validate current660 with both original reader policies and preserve exact source trees\n'
          assert original.decode().count(marker)==1
          block=original.decode().split(marker,1)[1].split('        run: |\n',1)[1];lines=[]
          for line in block.splitlines():
            if line and not line.startswith('          '):break
            lines.append(line[10:] if line.startswith('          ') else '')
          script='\n'.join(lines)+'\n'
          assert script.count('dfaf746303b47f9cb9851683a2a70786f7548988')==1
          script=script.replace('dfaf746303b47f9cb9851683a2a70786f7548988','352659602500ab308181cc86e570349db1ccbd2b',1)
          anchor='(root/workflow_path).write_text(text);(root/test_path).write_bytes(show(a,test_path))'
          addition='''
          extra_path='tests/published-expansion32-monitor-smoke.php'
          extra=(root/extra_path).read_bytes()
          assert hashlib.sha1(b'blob '+str(len(extra)).encode()+b'\\0'+extra).hexdigest()=='68fcce391b6b7a7fce751e4b8fa944e82098c298','ORIGINAL32_TEST_CHANGED'
          assert extra.count(oldpin.encode())==1
          updated=extra.replace(oldpin.encode(),publisher.encode(),1)
          assert updated.replace(publisher.encode(),oldpin.encode(),1)==extra,'COHORT32_ASSERTIONS_CHANGED'
          (root/extra_path).write_bytes(updated)
          '''
          import textwrap
          assert script.count(anchor)==1;script=script.replace(anchor,anchor+'\n'+textwrap.dedent(addition).strip(),1)
          old="for phase,paths in [('A',[workflow_path,test_path]),('B',[workflow_path,test_path]+bpaths)]:"
          new="for phase,paths in [('A',[workflow_path,test_path,extra_path]),('B',[workflow_path,test_path,extra_path]+bpaths)]:"
          assert script.count(old)==1;script=script.replace(old,new,1)
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'complete-reliability-consumers660.sh';path.write_text(script)
          subprocess.run(['bash','-n',str(path)],check=True)
          subprocess.run(['bash',str(path)],check=True,timeout=420)
          PY
      - name: Preserve native outcomes and exact two-phase source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reliability-consumers660-${{ github.run_id }}
          path: ${{ runner.temp }}/reliability-consumers660/
          retention-days: 30
          if-no-files-found: error
