name: Prepare expansion20 source without collection or production writes
on:
  push:
    branches: ['source/1142-monitor628-20261116']
    paths: ['.github/workflows/collect-anytour-tours.yml']
permissions:
  contents: write
  actions: read
jobs:
  validate:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.before == 'b8e7749c8c8e56a0de53b59cf5a1b7085fbbe1ca' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: dfb72ea60bbc68036295787ec63de75fbfea581f
          path: accepted-base
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pyatkoff/max-search-bot
          ref: db99af43e8ab11b3675fdbf7875da6e8ea6849ee
          path: hotel-price-publisher
          persist-credentials: false
      - name: Prepare only canonical source files preserving old cohorts and collector policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = b8e7749c8c8e56a0de53b59cf5a1b7085fbbe1ca
          test "$(gh api repos/pyatkoff/poisk-turov-test/git/ref/heads/main --jq .object.sha)" = dfb72ea60bbc68036295787ec63de75fbfea581f
          umask 077
          mkdir "$RUNNER_TEMP/expansion20-source"
          python3 - <<'PY'
          import pathlib,json,hashlib,os,textwrap
          base=pathlib.Path('accepted-base');w=pathlib.Path(os.environ['RUNNER_TEMP'])/'expansion20-source'
          path='v2/data/published-hotels-monitor-v1.php';old=(base/path).read_bytes()
          assert hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()=='d46c7265475668a2ff4e40fb55c6cbc274c9497d'
          text=old.decode();marker='function v2_all_hotel_monitor_input_ids('
          assert text.count(marker)==1
          addition='/** Twenty published pairs: original43860879803, native read43871777544, accepted feeds43874344520.\n * Exact Tourvisor IDs; append AFTER all existing cohorts, never alter TOP500 exclusions.\n */\nfunction v2_published_expansion20_monitor_ids_20261116(): array\n{\n    return [88169,547,15774,12125,57335,2480,2417,2418,2468,12127,27481,23289,50262,72939,2489,85417,2466,2460,99713,43676];\n}\n\n'
          text=text.replace(marker,addition+marker)
          oldUnion='array_merge(v2_collection_priority_hotel_ids($registry),v2_sites_hotel_monitor_ids_20261111())'
          assert text.count(oldUnion)==1
          text=text.replace(oldUnion,'array_merge(v2_collection_priority_hotel_ids($registry),v2_sites_hotel_monitor_ids_20261111(),v2_published_expansion20_monitor_ids_20261116())')
          cohort="    if($includeSitesRoster)$cohorts['sites_registry217_20261111']=v2_sites_hotel_monitor_ids_20261111();"
          assert text.count(cohort)==1
          text=text.replace(cohort,cohort+"\n    if($includeSitesRoster)$cohorts['published_expansion20_20261116']=v2_published_expansion20_monitor_ids_20261116();")
          pathlib.Path(path).write_text(text)
          path='.github/workflows/collect-anytour-tours.yml';raw=(base/path).read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='720128ee8d022c134c3cbddde908c2c6cddf6a41'
          text=raw.decode();assert text.count('ref: 5873fe24ef5f0d6251f1c6bbf0b245ced28fc980')==2
          text=text.replace('ref: 5873fe24ef5f0d6251f1c6bbf0b245ced28fc980','ref: db99af43e8ab11b3675fdbf7875da6e8ea6849ee')
          oldFilter="      - 'tests/published-hotels-monitor-smoke.php'";assert text.count(oldFilter)==2
          text=text.replace(oldFilter,oldFilter+"\n      - 'tests/published-expansion20-monitor-smoke.php'")
          oldTest='          php tests/published-hotels-monitor-smoke.php';assert text.count(oldTest)==1
          text=text.replace(oldTest,oldTest+'\n          php tests/published-expansion20-monitor-smoke.php')
          oldLink='          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-link.php';assert text.count(oldLink)==1
          text=text.replace(oldLink,oldLink+'\n          php hotel-price-publisher/tools/direct_demand/operations/test-monitor-price-expansion20.php')
          pathlib.Path(path).write_text(text)
          marker='      - name: Validate daily freshness and full-month TOP500 coverage\n        shell: bash\n        run: |\n';assert text.count(marker)==1
          body=text.split(marker,1)[1].split('\n  collect-production:',1)[0]
          (w/'validate.sh').write_text(textwrap.dedent(body))
          assert "if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'" in text
          assert "- cron: '12 * * * *'" in text and text.count('ref: 8bb7336cfa8e6e702ea656c762fe331a1c8283c6')==1
          print('SOURCE_PREPARED existing_cohorts=unchanged current_callback_pacing=retained production_calls=0')
          PY
      - name: Run the actual final collector validation without collection
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/expansion20-source/validate.sh" | tee "$RUNNER_TEMP/expansion20-source/validate.log"
          git diff --check
      - name: Retain immutable source blobs only; no commit or ref updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,base64,subprocess,os
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'expansion20-source';entries=[]
          for path in ['v2/data/published-hotels-monitor-v1.php','.github/workflows/collect-anytour-tours.yml','tests/published-expansion20-monitor-smoke.php']:
            raw=pathlib.Path(path).read_bytes();sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            result=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/pyatkoff/poisk-turov-test/git/blobs','--input','-'],input=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),timeout=60))
            assert result['sha']==sha
            entries.append({'path':path,'sha':sha,'type':'blob','mode':'100644','sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
            target=w/'files'/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
          out={'source_head':os.environ['GITHUB_SHA'],'base':'dfb72ea60bbc68036295787ec63de75fbfea581f','publisher':'db99af43e8ab11b3675fdbf7875da6e8ea6849ee','files':entries,'branch_writes':0,'production_calls':0,'supplier_calls':0,'post_writes':0}
          (w/'git-blobs.json').write_text(json.dumps(out,indent=2)+'\n');print('EXPANSION20_CONSUMER_READY='+json.dumps(out,separators=(',',':')))
          PY
      - name: Retain tested source and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion20-collector-source-${{ github.run_id }}
          path: ${{ runner.temp }}/expansion20-source/
          if-no-files-found: error
          retention-days: 30
