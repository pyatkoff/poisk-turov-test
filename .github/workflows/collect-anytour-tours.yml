name: Read existing price release ownership without production
on:
  push:
    branches: ['source/1142-monitor660-20261116']
    paths: ['.github/workflows/collect-anytour-tours.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: anytour-monitor660-source-preparation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event_name == 'push' && github.event.before == 'fb6636bdbe5bb4ca3242a7b9e588ca204adc2127' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read bounded complete coordination inventory and current source status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/price-owner"
          python3 - <<'PY'
          import subprocess,json,pathlib,os,re,datetime
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'price-owner'
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/pyatkoff/max-search-bot/'+path],timeout=15))
          comments=[]
          for page in range(1,21):
            batch=api('issues/1122/comments?per_page=100&page='+str(page));assert isinstance(batch,list)
            comments.extend(batch)
            if len(batch)<100:break
          else:raise ValueError('incomplete_inventory')
          assert len({c['id'] for c in comments})==len(comments)
          publishers=[];candidates=[]
          for c in comments:
            b=c['body'];r={k:c[k] for k in ['id','created_at','updated_at','body']};r['owner_id']=c['user']['id']
            if re.fullmatch(r'PR\d+: (?:выпуск занят|установлено, выпуск свободен)',b):publishers.append(r)
            elif c['id']!=6633089481 and re.search(r'1575|1574|36.?h|36.?час|мониторинг.?цен|price.reliability|1142.owner|CONTENT33',b,re.I):candidates.append(r)
          result={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'main':api('git/ref/heads/main')['object']['sha'],'inventory_count':len(comments),'inventory_complete':True,'publishers':publishers,'price_candidates':candidates,'source':api('pulls/1575'),'production_calls':0,'writes':0}
          (out/'ownership.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print('OWNERSHIP_SUMMARY='+json.dumps({'count':len(comments),'active_publishers':[r for r in publishers if r['body'].endswith('выпуск занят')],'price_candidate_ids':[r['id'] for r in candidates]},ensure_ascii=True))
          PY
      - name: Retain bounded ownership snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: existing-price-owner-${{ github.run_id }}
          path: ${{ runner.temp }}/price-owner/
          retention-days: 14
          if-no-files-found: error
