name: MATCH ANEX-only retained SAMO audit v107
'on':
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-anexonly-retained-samo-v107
  cancel-in-progress: false
env:
  OP: hotel-match-anexonly-retained-samo-audit-1971-20260928-v107
  CLAIM: '5865689904'
jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/anexonly200-v107-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: ${{ github.event.pull_request.head.sha }}, persist-credentials: false}
      - name: Validate source and claim
        env: {GH_TOKEN: ${{ github.token }}, HEAD: ${{ github.event.pull_request.head.sha }}}
        run: |
          set -euo pipefail;umask 077;mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_anexonly_retained_samo_audit_v107.php)" = 23d4dad852e67ba45b96c101540cf23fb7540b73
          php -l scripts/diagnostics/hotel_match_anexonly_retained_samo_audit_v107.php
          python3 - <<'PY'
          import json,os,time,urllib.request
          def get(p):
            q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(q,timeout=30) as f:return json.load(f)
          c=get('/issues/comments/'+os.environ['CLAIM']);assert c['user']['id']==226193297 and c['author_association']=='OWNER' and 'v107' in c['body']
          pr=get('/pulls/'+str(get('/repos/'+os.environ['GITHUB_REPOSITORY'])['open_issues_count']) ) if False else get('/pulls/'+os.environ['GITHUB_REF_NAME'].split('/')[0]) if False else None
          for _ in range(100):
            xs=[x for x in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if x['name']=='Security guard']
            if xs:
              x=max(xs,key=lambda y:y['id'])
              if x['status']=='completed': assert x['conclusion']=='success';break
            time.sleep(3)
          else: raise SystemExit('security')
          PY
      - name: Run supplier-free CURRENT audit
        env: {KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}, HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}, USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}, HEAD: ${{ github.event.pull_request.head.sha }}}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";rel=".anytoour-match/operations/$OP";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$rel/payload\""
          git archive HEAD scripts/diagnostics app/integrations|ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=768M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_anexonly_retained_samo_audit_v107.php\" --execute">terminal/stdout.txt
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json;scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=json.load(open('terminal/result.json'));r=json.load(open('terminal/receipt.json'));assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest();assert d['state']=='completed_read_only_anexonly_retained_samo_audit' and d['provider_http_calls']==d['database_writes']==d['mapping_writes']==0
          print(json.dumps({k:d[k] for k in ['candidate_count','candidate_hotels','hold_count','coverage_current']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: match-anexonly-retained-samo-v107-${{ github.run_id }}, path: terminal/, retention-days: 90, if-no-files-found: warn}
