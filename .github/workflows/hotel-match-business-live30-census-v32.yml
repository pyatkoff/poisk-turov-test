name: MATCH business-live30 census v32
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_business_live30_census_v32.php'
      - 'tests/hotel_match_business_live30_census_v32_test.php'
      - '.github/workflows/hotel-match-business-live30-census-v32.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-business-live30-census-1971-20260925-v32, cancel-in-progress: false}
env:
  CENSUS_OP: hotel-match-business-live30-census-1971-20260925-v32
  BASE: c3b28595541ecb85286227aa146d70329bf324f3
  CLAIM: '5833850211'
  COVERAGE_ARTIFACT: '10868889646'
  COVERAGE_ARCHIVE_SHA: 86710ff8b4ce3f4e5da77e7564109ac592b5d3c40ec1e6d36c1006c255fff4f0
  COVERAGE_RESULT_SHA: 9805729debef3f16fd2e6e2051fec0f317349da67afd7e773519e47e7e30f7f3
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/business-live30-census-v32-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: php -l scripts/diagnostics/hotel_match_business_live30_census_v32.php
      - run: php tests/hotel_match_business_live30_census_v32_test.php
      - run: |
          ! grep -E 'curl_|https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' scripts/diagnostics/hotel_match_business_live30_census_v32.php
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/business-live30-census-v32-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate postwrite coverage, claim and Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/coverage terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-business-live30-census-v32.yml scripts/diagnostics/hotel_match_business_live30_census_v32.php tests/hotel_match_business_live30_census_v32_test.php "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['CENSUS_OP'],'AnyTourAnexSearchMappingRegistry','REPEATABLE READ / READ ONLY','TV ↔ SAMO ↔ direct ANEX']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$COVERAGE_ARTIFACT/zip" -o input/coverage.zip
          test "$(sha256sum input/coverage.zip|awk '{print $1}')" = "$COVERAGE_ARCHIVE_SHA"
          unzip -q input/coverage.zip -d input/coverage
          result="$(find input/coverage -type f -name result.json -print -quit)";receipt="$(find input/coverage -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt"
          python3 - "$result" "$receipt" <<'PY'
          import json,hashlib,pathlib,sys,os
          r=json.load(open(sys.argv[1]));q=json.load(open(sys.argv[2]))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()==os.environ['COVERAGE_RESULT_SHA']
          assert r['operation']=='hotel-match-samo-business-live30-common4-postwrite-1971-20260925-v31'
          assert r['state']=='samo_business_live30_common4_plan_ready' and q['readback_verified'] is True
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          PY
      - name: Run fresh business-live30 census v32
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          cdir=".anytoour-match/operations/$CENSUS_OP"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['CENSUS_OP'],'state':'reserved_before_db_read','provider_http_calls':0,'database_writes':0,'mapping_writes':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e "\$HOME/$cdir";mkdir -p "\$HOME/$cdir/payload/scripts/diagnostics" "\$HOME/$cdir/payload/app/integrations""
          scp "${opts[@]}" input/reservation.json "$remote:$cdir/reservation.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_business_live30_census_v32.php "$remote:$cdir/payload/scripts/diagnostics/"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_anex_effective_coverage.php "$remote:$cdir/payload/scripts/diagnostics/"
          scp "${opts[@]}" app/integrations/anex-search-mapping-registry.php "$remote:$cdir/payload/app/integrations/"
          ssh "${opts[@]}" "$remote" "set -eu;cd "\$HOME/www/anytoour.ru";ANYTOUR_ROOT="\$HOME/www/anytoour.ru" MATCH_OPERATION_DIR="\$HOME/$cdir" MATCH_SOURCE_SHA='$HEAD' php "\$HOME/$cdir/payload/scripts/diagnostics/hotel_match_business_live30_census_v32.php" --execute" >terminal/census.stdout 2>terminal/census.stderr
          ssh "${opts[@]}" "$remote" "cat "\$HOME/$cdir/result.json"" >terminal/result.json
          ssh "${opts[@]}" "$remote" "cat "\$HOME/$cdir/receipt.json"" >terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['operation']=='hotel-match-business-live30-census-1971-20260925-v32' and r['state']=='completed_read_only_business_live30_census'
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0 and q['readback_verified'] is True
          print(json.dumps({'tv':r['tv_live30'],'samo':r['samo_live30'],'anex':r['anex_live30'],'strict':r['strict_live30_overlap'],'registry':r['current_registry']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-business-live30-census-v32-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
