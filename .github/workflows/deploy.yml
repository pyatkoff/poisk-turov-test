name: Full rollback tour search changes

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Restore exact initial test tree and pre-fix production template
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            SITE="$HOME/www/anytour.online"
            TEST_DIR="$SITE/poisk-turov-test"
            INITIAL_SHA="13be0bb60f1822a5342fbaaeb35dd3d4c12ecc8a"
            PROD_TPL="$SITE/bitrix/templates/anytour/components/rhat.search/form/form/template.php"

            cd "$TEST_DIR"
            git fetch origin main
            git cat-file -e "${INITIAL_SHA}^{commit}"

            # Restore the test directory exactly to the first uploaded snapshot,
            # preserving only its .git metadata so the directory remains manageable.
            find "$TEST_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
            git archive "$INITIAL_SHA" | tar -x -C "$TEST_DIR"

            # Restore production template.php from the backup made immediately
            # before the explicit CSS/JS include change.
            BACKUP="$(ls -1t "$HOME"/backups/template.php-before-asset-fix-* 2>/dev/null | head -1 || true)"
            if [ -n "$BACKUP" ] && [ -f "$BACKUP" ]; then
              cp -a "$BACKUP" "$PROD_TPL"
              echo "PROD_TEMPLATE_RESTORED_FROM=$BACKUP"
            else
              echo "ERROR: pre-asset-fix backup not found"
              exit 1
            fi

            # Remove only temporary test artifacts created by this work.
            rm -rf "$SITE/local/components/rhat.search.test"
            rm -rf "$SITE/local/templates/anytour/components/rhat.search.test"
            rm -rf "$SITE/bitrix/templates/anytour/components/rhat.search.test"

            if command -v /opt/php81/bin/php >/dev/null 2>&1; then PHP_BIN=/opt/php81/bin/php; else PHP_BIN=php; fi
            "$PHP_BIN" -l "$TEST_DIR/index.php"
            "$PHP_BIN" -l "$PROD_TPL"

            # Verify exact test index hash against initial commit.
            EXPECTED="$(git show "$INITIAL_SHA:index.php" | sha256sum | awk '{print $1}')"
            ACTUAL="$(sha256sum "$TEST_DIR/index.php" | awk '{print $1}')"
            echo "TEST_INDEX_EXPECTED=$EXPECTED"
            echo "TEST_INDEX_ACTUAL=$ACTUAL"
            test "$EXPECTED" = "$ACTUAL"

            TEST_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov-test/)"
            PROD_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov/)"
            echo "TEST_HTTP_CODE=$TEST_CODE PROD_HTTP_CODE=$PROD_CODE"
            test "$TEST_CODE" = "200"
            test "$PROD_CODE" = "200"
            echo 'FULL_ROLLBACK=OK'
