name: Audit tour search backups

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-test-deploy
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              echo "DEPLOY_SSH_KEY is not a recognized private-key encoding"
              exit 1
            fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Read-only audit of production template and backups
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -u
            SITE_ROOT="$HOME/www/anytour.online"
            PROD="$SITE_ROOT/bitrix/templates/anytour/components/rhat.search/form/form"
            echo '=== CURRENT PROD ==='
            find "$PROD" -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort
            echo '=== CURRENT CHECKSUMS ==='
            for f in template.php style.css script.js ajax.php; do
              if [ -f "$PROD/$f" ]; then sha256sum "$PROD/$f"; fi
            done
            echo '=== HOME BACKUPS ==='
            find "$HOME/backups" -maxdepth 3 \( -type d -o -type f \) -iname '*rhat*' -o -iname '*search*' 2>/dev/null | sort | head -500
            echo '=== LIKELY TEMPLATE COPIES UNDER HOME ==='
            find "$HOME" -type f -path '*/rhat.search/form/form/template.php' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort | head -200
            echo '=== LIKELY TEMPLATE COPIES UNDER SITE ==='
            find "$SITE_ROOT" -type f -path '*/rhat.search/form/form/template.php' -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort | head -200
            echo '=== BACKUP TEMPLATE HASHES ==='
            find "$HOME/backups" -type f -name template.php 2>/dev/null | while read -r f; do
              case "$f" in *rhat*|*search*) printf '%s  ' "$f"; sha256sum "$f" | awk '{print $1}';; esac
            done | sort
