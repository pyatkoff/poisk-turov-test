name: Import template into test directory only

on:
  push:
    branches: [main]

concurrency:
  group: poisk-turov-test-template-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Copy template into poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            SITE="$HOME/www/anytour.online"
            TEST_DIR="$SITE/poisk-turov-test"
            SOURCE="$SITE/local/templates/anytour"
            DEST="$TEST_DIR/site-template"

            test -d "$TEST_DIR/.git"
            test -d "$SOURCE"

            cd "$TEST_DIR"
            git fetch origin main
            git reset --hard origin/main

            # All writes are strictly inside poisk-turov-test.
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp -a "$SOURCE"/. "$DEST"/

            echo "SOURCE=$SOURCE (read only)"
            echo "DEST=$DEST"
            echo "FILES=$(find "$DEST" -type f | wc -l)"
            du -sh "$DEST"

            git config user.name "poisk-turov-test importer"
            git config user.email "pavel@pyatkoff.com"
            git add site-template
            if git diff --cached --quiet; then
              echo "TEMPLATE_IMPORT_NO_CHANGES"
              exit 0
            fi
            git commit -m "Import working anytour template into test sandbox"
            git push origin main
            echo "TEMPLATE_IMPORTED_INSIDE_TEST_ONLY=OK"
