name: One-time test photo diagnostic
on:
  push:
    branches: [main]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Update and diagnose poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            TEST_DIR="$HOME/www/anytour.online/poisk-turov-test"
            cd "$TEST_DIR"
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
            from pathlib import Path
            p=Path('template/search/script.js')
            s=p.read_text(encoding='utf-8')
            old='$.ajax( "/include/ajax/aj.php", {'
            new='$.ajax( $("form[name=searchForm]").attr("action"), {'
            if old in s:
                p.write_text(s.replace(old,new,1), encoding='utf-8')
                print('OLD_AJAX_PATH_FIXED=1')
            else:
                print('OLD_AJAX_PATH_FIXED=0')
            PY
            git add template/search/script.js
            if ! git diff --cached --quiet; then
              git config user.name "OpenAI test maintenance"
              git config user.email "actions@users.noreply.github.com"
              git commit -m "Keep search AJAX inside test sandbox [skip ci]"
              git push origin main
            fi
            echo '--- PHOTO DIAGNOSTIC ---'
            curl -k -L -sS --max-time 40 https://anytour.online/poisk-turov-test/diagnostics/photo_check.php
            echo
            code="$(curl -k -L -sS -o /tmp/poisk-test.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/)"
            echo "HTTP_CODE=$code"
            echo "TEST_ONLY=OK"
