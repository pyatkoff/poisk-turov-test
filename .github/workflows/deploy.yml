name: Deploy override order fix
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Update poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            cd "$HOME/www/anytour.online/poisk-turov-test"
            git fetch origin main
            git reset --hard origin/main
            code="$(curl -k -L -sS -o /tmp/test.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/)"
            python3 - <<'PY'
            h=open('/tmp/test.html','r',encoding='utf-8').read()
            a=h.find('form-overrides.css?v=2')
            b=h.find('form-layout-fixes.css?v=2')
            c=h.find('card-overrides.css?v=3')
            assert a>=0 and b>a and c>b, (a,b,c)
            print('OVERRIDE_ORDER_OK',a,b,c)
            PY
            echo "HTTP_CODE=$code ORDER_FIX=OK"
