name: Deploy standalone test sandbox

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Update poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            TEST_DIR="$HOME/www/anytour.online/poisk-turov-test"
            cd "$TEST_DIR"
            test -d .git
            git fetch origin main
            git reset --hard origin/main
            php -l index.php
            php -l template/header.php
            php -l template/footer.php
            php -l template/search/ajax.php
            code="$(curl -k -L -sS -o /tmp/poisk-test.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/)"
            echo "HTTP_CODE=$code"
            grep -q 'tour-search-test' /tmp/poisk-test.html && echo 'OWN_TEMPLATE=OK' || true
            echo 'TEST_SANDBOX_DEPLOY=OK'
