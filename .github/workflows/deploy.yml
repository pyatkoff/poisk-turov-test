name: Inspect test search request
on:
  push:
    branches: [main]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Inspect poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            TEST_DIR="$HOME/www/anytour.online/poisk-turov-test"
            cd "$TEST_DIR"
            git fetch origin main
            git reset --hard origin/main
            echo '--- PREPARE DATA ---'
            grep -n -A120 -B5 'function prepareData' template/search/script.js | head -140 || true
            echo '--- FORM DEFAULTS ---'
            grep -nE 'name="(dateFrom|dateTo|daysFrom|daysTill|count_people|count_child)|id="(from|country)' template/search/template.php | head -80 || true
            echo 'INSPECT_ONLY=OK'
