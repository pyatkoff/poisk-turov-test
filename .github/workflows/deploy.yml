name: Deploy tour search test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              echo "DEPLOY_SSH_KEY is not a recognized private-key encoding"
              exit 1
            fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Deploy to poisk-turov-test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/poisk-turov-test
            git fetch origin main
            git reset --hard origin/main

            SITE_ROOT="$HOME/www/anytour.online"
            TEST_COMPONENT="$SITE_ROOT/local/components/rhat.search.test/form"
            TEST_TEMPLATE="$SITE_ROOT/bitrix/templates/anytour/components/rhat.search.test/form/form"
            STALE_LOCAL_TEMPLATE="$SITE_ROOT/local/templates/anytour/components/rhat.search.test"

            # Bitrix prefers /local/templates over /bitrix/templates. Remove the old
            # test copy so there is exactly one source of template assets.
            rm -rf "$STALE_LOCAL_TEMPLATE"

            mkdir -p "$TEST_COMPONENT" "$TEST_TEMPLATE"
            cp component/component.php "$TEST_COMPONENT/component.php"
            cp component/.description.php "$TEST_COMPONENT/.description.php"
            cp component/.parameters.php "$TEST_COMPONENT/.parameters.php"
            cp component/ajax.php "$TEST_COMPONENT/ajax.php"
            cp -a anytour/components/rhat.search/form/form/. "$TEST_TEMPLATE/"

            sed -i "s#'/bitrix/php_interface/tv_api/tvapi.php'#'/poisk-turov-test/tv_api/tvapi.php'#" "$TEST_COMPONENT/component.php"
            sed -i "s#'/bitrix/php_interface/tv_api/search.php'#'/poisk-turov-test/tv_api/search.php'#" "$TEST_TEMPLATE/ajax.php"
            sed -i "s#'/bitrix/php_interface/tv_api/tvapi.php'#'/poisk-turov-test/tv_api/tvapi.php'#" "$TEST_TEMPLATE/ajax.php"

            if command -v /opt/php81/bin/php >/dev/null 2>&1; then PHP_BIN=/opt/php81/bin/php; else PHP_BIN=php; fi
            "$PHP_BIN" -l index.php
            "$PHP_BIN" -l "$TEST_COMPONENT/component.php"
            "$PHP_BIN" -l "$TEST_TEMPLATE/ajax.php"
            "$PHP_BIN" -l "$TEST_TEMPLATE/template.php"
            "$PHP_BIN" -l tv_api/search.php
            "$PHP_BIN" -l tv_api/tvapi.php

            echo "--- Live smoke test ---"
            TEST_HTML="$(mktemp)"
            PROD_HTML="$(mktemp)"
            HTTP_CODE="$(curl -k -L -sS -o "$TEST_HTML" -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov-test/)"
            PROD_CODE="$(curl -k -L -sS -o "$PROD_HTML" -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov/)"
            echo "HTTP_CODE test=$HTTP_CODE prod=$PROD_CODE"
            test "$HTTP_CODE" = "200"
            grep -q 'searchMainWrap' "$TEST_HTML"
            grep -q 'rhat.search.test' index.php
            if grep -q '/local/templates/anytour/components/rhat.search.test' "$TEST_HTML"; then
              echo "ERROR: stale local test template is still active"
              exit 1
            fi
            echo "SMOKE_FORM=OK"

            CSS_URL='https://anytour.online/bitrix/templates/anytour/components/rhat.search.test/form/form/style.css?v=20260825-1'
            JS_URL='https://anytour.online/bitrix/templates/anytour/components/rhat.search.test/form/form/script.js?v=20260825-1'
            ICON_URL='https://anytour.online/bitrix/templates/anytour/components/rhat.search.test/form/form/images/icon_gstar.png'
            CSS_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$CSS_URL")"
            JS_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$JS_URL")"
            ICON_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "$ICON_URL")"
            echo "ASSET_CODES css=$CSS_CODE js=$JS_CODE icon=$ICON_CODE"

            echo "--- PROD stylesheets ---"
            grep -oE 'href="[^"]+\.css[^\"]*"' "$PROD_HTML" | sed 's/^/PROD /' | sort -u || true
            echo "--- TEST stylesheets ---"
            grep -oE 'href="[^"]+\.css[^\"]*"' "$TEST_HTML" | sed 's/^/TEST /' | sort -u || true

            rm -f "$TEST_HTML" "$PROD_HTML"
            echo "Deployed isolated test component: rhat.search.test:form"
            echo "Deployed commit: $(git rev-parse HEAD)"
