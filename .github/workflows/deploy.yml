name: Read-only Bitrix header quick audit

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect root Bitrix include files only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            SITE="$HOME/www/anytour.online"
            echo '=== BITRIX HEADER STAT ==='
            stat -c '%s bytes %y %n' "$SITE/bitrix/header.php" "$SITE/bitrix/footer.php"
            echo '=== BITRIX HEADER CONTENT ==='
            cat "$SITE/bitrix/header.php"
            echo '=== BITRIX FOOTER CONTENT ==='
            cat "$SITE/bitrix/footer.php"
            echo '=== ANYTOUR HEADER STAT ==='
            stat -c '%s bytes %y %n' "$SITE/bitrix/templates/anytour/header.php" "$SITE/bitrix/templates/anytour/footer.php"
            echo '=== SEARCH INDEX STAT ==='
            stat -c '%s bytes %y %n' "$SITE/poisk-turov/index.php" "$SITE/poisk-turov-test/index.php"
            echo '=== SEARCH INDEX FIRST 30 ==='
            sed -n '1,30p' "$SITE/poisk-turov/index.php"
            echo 'READ_ONLY_QUICK_AUDIT=OK'
