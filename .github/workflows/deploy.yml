name: Deploy V2 only
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
  workflow_dispatch:
jobs:
  deploy-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate active V2 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            v2/runtime-v3.js \
            v2/analytics.js \
            v2/analytics-v3.js \
            v2/results-renderer-v3.js \
            v2/search-continue-v5.js \
            v2/search-continue-v6.js \
            v2/hotel-actions-v2.js \
            v2/room-details-v2.js \
            v2/tour-controller-v3.js \
            v2/tour-controller-v4.js \
            v2/catalogs-v2.js \
            v2/search-lifecycle-v4.js \
            v2/search-lifecycle-v5.js \
            v2/search-lifecycle-v6.js \
            v2/accessibility.js
          do
            node --check "$file"
          done
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Copy V2 folder only
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" 'mkdir -p "$HOME/www/anytour.online/poisk-turov-test/v2"'
          scp "${ssh_opts[@]}" -r v2/. "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE:~/www/anytour.online/poisk-turov-test/v2/"
      - name: Verify V2
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "VERIFY_FAIL:$1"; exit 1; }
            root="$HOME/www/anytour.online/poisk-turov-test/v2"
            php -l "$root/index.php" >/dev/null || fail php_index
            php -l "$root/api-v2.php" >/dev/null || fail php_api
            php -l "$root/lead-adapter-v2.php" >/dev/null || fail php_lead
            php -l "$root/analytics-config.php" >/dev/null || fail php_analytics_config
            php -l "$root/form-defaults.php" >/dev/null || fail php_form_defaults
            page_code="$(curl -k -L -sS -o /tmp/v2.html -w "%{http_code}" --max-time 40 https://anytour.online/poisk-turov-test/v2/)"
            api_code="$(curl -k -L -sS -o /tmp/v2-health.json -w "%{http_code}" --max-time 45 "https://anytour.online/poisk-turov-test/v2/api-v2.php?action=health")"
            lead_code="$(curl -k -L -sS -o /tmp/v2-lead.json -w "%{http_code}" --max-time 30 "https://anytour.online/poisk-turov-test/v2/lead-adapter-v2.php")"
            echo "PAGE=$page_code API=$api_code LEAD=$lead_code"
            cat /tmp/v2-health.json
            test "$page_code" = "200" || fail page_http
            test "$api_code" = "200" || fail api_http
            test "$lead_code" = "200" || fail lead_http
            grep -q "Найти тур" /tmp/v2.html || fail page_marker
            grep -q "api-v2.php" /tmp/v2.html || fail active_api
            grep -q "runtime-v3.js" /tmp/v2.html || fail active_runtime
            grep -q "search-lifecycle-v6.js" /tmp/v2.html || fail active_search_lifecycle
            grep -q "search-continue-v6.js" /tmp/v2.html || fail active_search_continue
            grep -q "Layer_1.png" /tmp/v2.html || fail active_logo
            logo_url="$(grep -oE '/poisk-turov-test/v2/Layer_1\.png\?v=[0-9]+' /tmp/v2.html | head -1)"
            test -n "$logo_url" || fail logo_url
            logo_code="$(curl -k -L -sS -o /tmp/v2-logo.png -w "%{http_code}" --max-time 20 "https://anytour.online$logo_url")"
            test "$logo_code" = "200" || fail logo_http
            test -s /tmp/v2-logo.png || fail logo_empty
            if grep -Eq "metrikaCounter[[:space:]]*:[[:space:]]*[1-9][0-9]*" /tmp/v2.html; then
              echo "METRIKA_COUNTER=configured"
            elif grep -Eq "metrikaCounter[[:space:]]*:[[:space:]]*0" /tmp/v2.html; then
              echo "WARNING: METRIKA_COUNTER_ID is not configured"
            else
              fail metrika_config_shape
            fi
            ! grep -q "METRIKA_OAUTH_TOKEN" /tmp/v2.html || fail oauth_exposed
            grep -q "tourvisor-direct" /tmp/v2-health.json || fail api_source
            grep -q "gatewayVersion" /tmp/v2-health.json || fail api_version
            grep -q "v2-direct-bitrix-lead" /tmp/v2-lead.json || fail lead_adapter
            grep -q "version" /tmp/v2-lead.json || fail lead_version
          '
      - name: Live search smoke
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" '
            set -euo pipefail
            fail(){ echo "SEARCH_SMOKE_FAIL:$1"; exit 1; }
            base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
            from="$(date -d "+2 day" +%Y-%m-%d)"
            till="$(date -d "+9 day" +%Y-%m-%d)"
            curl -k -L -sS --max-time 45 "$base?action=departures" -o /tmp/v2-departures.json
            grep -q '"id"' /tmp/v2-departures.json || fail departures
            curl -k -L -sS --max-time 45 "$base?action=countries&departureId=1" -o /tmp/v2-countries.json
            grep -q '"id"' /tmp/v2-countries.json || fail countries
            start_url="$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB"
            start_code="$(curl -k -L -sS -o /tmp/v2-search-start.json -w "%{http_code}" --max-time 50 "$start_url")"
            echo "SEARCH_START_HTTP=$start_code"
            cat /tmp/v2-search-start.json
            test "$start_code" = "200" || fail search_start_http
            search_id="$(php -r '$d=json_decode(file_get_contents("/tmp/v2-search-start.json"),true); echo (int)($d["searchId"]??0);')"
            test "$search_id" -gt 0 || fail search_id
            status_code="$(curl -k -L -sS -o /tmp/v2-search-status.json -w "%{http_code}" --max-time 45 "$base?action=search_status&searchId=$search_id")"
            test "$status_code" = "200" || fail search_status_http
            results_code="$(curl -k -L -sS -o /tmp/v2-search-results.json -w "%{http_code}" --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25")"
            test "$results_code" = "200" || fail search_results_http
            php -r '$d=json_decode(file_get_contents("/tmp/v2-search-results.json"),true); if(!is_array($d)){exit(1);} echo "SEARCH_RESULTS=".count($d).PHP_EOL;' || fail search_results_json
          '
