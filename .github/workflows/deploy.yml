name: Read-only Bitrix template binding audit

on:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Read Bitrix site/template bindings only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            SITE="$HOME/www/anytour.online"
            phpbin=php
            [ -x /opt/php81/bin/php ] && phpbin=/opt/php81/bin/php
            "$phpbin" -d display_errors=1 -r '
              $root="'"$SITE"'";
              $settings=require $root."/bitrix/.settings.php";
              $c=$settings["connections"]["value"]["default"] ?? null;
              if(!$c){fwrite(STDERR,"NO_DB_CONFIG\n"); exit(2);}
              $db=new mysqli($c["host"],$c["login"],$c["password"],$c["database"]);
              if($db->connect_errno){fwrite(STDERR,"DB_CONNECT_FAIL\n"); exit(3);}
              $db->set_charset("utf8mb4");
              echo "=== SITES ===\n";
              $r=$db->query("SELECT LID,ACTIVE,SORT,NAME,DIR,SERVER_NAME FROM b_lang ORDER BY SORT,LID");
              while($x=$r->fetch_assoc()){echo implode(" | ",$x)."\n";}
              echo "=== SITE TEMPLATE BINDINGS ===\n";
              $r=$db->query("SELECT SITE_ID,SORT,CONDITION,TEMPLATE FROM b_site_template ORDER BY SITE_ID,SORT");
              while($x=$r->fetch_assoc()){echo "SITE_ID={$x["SITE_ID"]} SORT={$x["SORT"]} TEMPLATE={$x["TEMPLATE"]} CONDITION={$x["CONDITION"]}\n";}
              $db->close();
            '
            echo 'READ_ONLY_TEMPLATE_BINDING_AUDIT=OK'
