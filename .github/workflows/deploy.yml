name: Deploy mobile CTA and photo fixes
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Update poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            cd "$HOME/www/anytour.online/poisk-turov-test"
            git fetch origin main
            git reset --hard origin/main
            code="$(curl -k -L -sS -o /tmp/test.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/)"
            grep -q 'mobile-critical-fixes.css?v=1' /tmp/test.html
            grep -q 'layout-fixes.js?v=4' /tmp/test.html
            css="$(curl -k -sS -o /tmp/mobile-critical.css -w '%{http_code}' --max-time 40 'https://anytour.online/poisk-turov-test/template/mobile-critical-fixes.css?v=1')"
            js="$(curl -k -sS -o /tmp/layout4.js -w '%{http_code}' --max-time 40 'https://anytour.online/poisk-turov-test/template/layout-fixes.js?v=4')"
            grep -q 'additional-filters-collapsed > #sendBtnWrapWrap' /tmp/mobile-critical.css
            grep -q 'slick-slide' /tmp/mobile-critical.css
            grep -q 'insertBefore(buttonWrap, firstExtraColumn)' /tmp/layout4.js
            echo "HTTP_CODE=$code CSS_CODE=$css JS_CODE=$js MOBILE_CRITICAL_FIXES=OK"
