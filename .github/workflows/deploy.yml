name: Deploy V2 tour search sandbox
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Update poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            cd "$HOME/www/anytour.online/poisk-turov-test"
            git fetch origin main
            git reset --hard origin/main
            code="$(curl -k -L -sS -o /tmp/v2.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/v2/)"
            grep -q 'Найти тур' /tmp/v2.html
            grep -q 'app.js?v=2' /tmp/v2.html
            css="$(curl -k -sS -o /tmp/v2.css -w '%{http_code}' --max-time 40 'https://anytour.online/poisk-turov-test/v2/app.css?v=1')"
            js="$(curl -k -sS -o /tmp/v2.js -w '%{http_code}' --max-time 40 'https://anytour.online/poisk-turov-test/v2/app.js?v=2')"
            grep -q 'search_create' /tmp/v2.js
            grep -q 'search_update' /tmp/v2.js
            grep -q 'hotel-card' /tmp/v2.css
            echo "V2_HTTP=$code CSS_HTTP=$css JS_HTTP=$js V2_DEPLOY=OK"
