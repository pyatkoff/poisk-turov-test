name: Deploy verified interaction fixes
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Update poisk-turov-test only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            cd "$HOME/www/anytour.online/poisk-turov-test"
            git fetch origin main
            git reset --hard origin/main
            code="$(curl -k -L -sS -o /tmp/test.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/)"
            grep -q 'layout-fixes.js?v=7' /tmp/test.html
            grep -q 'results-controls.js?v=2' /tmp/test.html
            layout="$(curl -k -sS -o /tmp/layout7.js -w '%{http_code}' --max-time 40 'https://anytour.online/poisk-turov-test/template/layout-fixes.js?v=7')"
            results="$(curl -k -sS -o /tmp/results2.js -w '%{http_code}' --max-time 40 'https://anytour.online/poisk-turov-test/template/results-controls.js?v=2')"
            grep -q 'lastExtraColumn.insertAdjacentElement' /tmp/layout7.js
            grep -q 'lastTours.map(cloneTour)' /tmp/results2.js
            grep -q 'tour-choice-enhance.js?v=1' /tmp/test.html
            echo "HTTP_CODE=$code LAYOUT_CODE=$layout RESULTS_CODE=$results VERIFIED_INTERACTIONS=OK"
