name: Fast audit original Bitrix template

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-fast-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Fast read-only audit
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -u
            SITE="$HOME/www/anytour.online"
            BASE="$SITE/bitrix/templates/anytour/components/rhat.search"
            PROD="$BASE/form/form"
            echo '=== PROD FILES ==='
            ls -la --time-style=long-iso "$PROD" 2>&1 || true
            echo '=== RHAT TREE ==='
            find "$BASE" -maxdepth 5 -printf '%y %TY-%Tm-%Td %TH:%TM %s %p\n' 2>/dev/null | sort | head -400
            echo '=== BACKUP ROOT ==='
            ls -la --time-style=long-iso "$HOME/backups" 2>&1 || true
            echo '=== OUR BACKUP DIRS + FILE SIZES ==='
            for d in "$HOME"/backups/rhat-search-form-*; do
              [ -d "$d" ] || continue
              echo "--- $d ---"
              ls -la --time-style=long-iso "$d" 2>&1 || true
              for f in template.php style.css script.js ajax.php; do
                [ -f "$d/$f" ] && { wc -c "$d/$f"; sha256sum "$d/$f"; }
              done
            done
            echo '=== PROD KEY FILE SIZES/HASHES ==='
            for f in template.php style.css script.js ajax.php; do
              [ -f "$PROD/$f" ] && { wc -c "$PROD/$f"; sha256sum "$PROD/$f"; }
            done
            echo '=== NEARBY BACKUP-NAMED FILES ==='
            find "$SITE/bitrix/templates/anytour" -maxdepth 8 -type f \( -name '*.bak' -o -name '*.old' -o -name '*~' -o -name '*.orig' -o -name '*.save' \) -printf '%TY-%Tm-%Td %TH:%TM %s %p\n' 2>/dev/null | sort | head -300
