name: Deploy tour search test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              exit 1
            fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Deploy test directory only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            TEST_DIR="$HOME/www/anytour.online/poisk-turov-test"
            cd "$TEST_DIR"
            git fetch origin main
            git reset --hard origin/main
            if command -v /opt/php81/bin/php >/dev/null 2>&1; then PHP_BIN=/opt/php81/bin/php; else PHP_BIN=php; fi
            "$PHP_BIN" -l index.php
            TEST_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov-test/)"
            PROD_CODE="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov/)"
            echo "TEST_HTTP_CODE=$TEST_CODE PROD_HTTP_CODE=$PROD_CODE"
            test "$TEST_CODE" = "200"
            test "$PROD_CODE" = "200"
            echo "DEPLOY_SCOPE=$TEST_DIR"
