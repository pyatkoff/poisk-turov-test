name: Read-only tour search audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect live pages and assets only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            SITE="$HOME/www/anytour.online"
            PROD_HTML="$(mktemp)"
            TEST_HTML="$(mktemp)"
            trap 'rm -f "$PROD_HTML" "$TEST_HTML"' EXIT
            curl -k -L -sS --max-time 30 https://anytour.online/poisk-turov/ -o "$PROD_HTML"
            curl -k -L -sS --max-time 30 https://anytour.online/poisk-turov-test/ -o "$TEST_HTML"

            echo '=== PROD CSS ==='
            grep -oE 'href="[^"]+\.css[^\"]*"' "$PROD_HTML" | sort -u || true
            echo '=== TEST CSS ==='
            grep -oE 'href="[^"]+\.css[^\"]*"' "$TEST_HTML" | sort -u || true
            echo '=== PROD JS ==='
            grep -oE 'src="[^"]+\.js[^\"]*"' "$PROD_HTML" | sort -u || true
            echo '=== TEST JS ==='
            grep -oE 'src="[^"]+\.js[^\"]*"' "$TEST_HTML" | sort -u || true

            echo '=== SEARCH FORM ASSET HTTP ==='
            for u in \
              /bitrix/templates/anytour/components/rhat.search/form/form/style.css \
              /bitrix/templates/anytour/components/rhat.search/form/form/script.js \
              /bitrix/templates/anytour/components/rhat.search/form/form/slick/slick.css \
              /css/css_new.css \
              /js/script.js; do
              code="$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://anytour.online$u")"
              echo "$code $u"
            done

            echo '=== KEY CSS RULE COUNTS ==='
            CSS="$SITE/bitrix/templates/anytour/components/rhat.search/form/form/style.css"
            for key in searchMainWrap searchFormWrap searchSelect hotelItem hotelImg searchButton; do
              c="$(grep -c "$key" "$CSS" || true)"
              echo "$key=$c"
            done

            echo '=== HTML FORM CLASSES PROD ==='
            grep -oE 'class="[^"]*(searchMainWrap|searchFormWrap|searchSelect|hotelItem)[^"]*"' "$PROD_HTML" | head -30 || true
            echo '=== HTML FORM CLASSES TEST ==='
            grep -oE 'class="[^"]*(searchMainWrap|searchFormWrap|searchSelect|hotelItem)[^"]*"' "$TEST_HTML" | head -30 || true

            echo 'READ_ONLY_AUDIT=OK'
