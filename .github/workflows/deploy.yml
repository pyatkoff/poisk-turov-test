name: Restore original tour search template

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-test-deploy
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              echo "DEPLOY_SSH_KEY is not a recognized private-key encoding"
              exit 1
            fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Restore production Bitrix search template
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            SITE_ROOT="$HOME/www/anytour.online"
            REPO="$SITE_ROOT/poisk-turov-test"
            PROD_TEMPLATE="$SITE_ROOT/bitrix/templates/anytour/components/rhat.search/form/form"
            INITIAL_SHA="13be0bb60f1822a5342fbaaeb35dd3d4c12ecc8a"
            SNAPSHOT_PATH="anytour/components/rhat.search/form/form"

            cd "$REPO"
            git fetch origin main
            if ! git cat-file -e "${INITIAL_SHA}^{commit}" 2>/dev/null; then
              git fetch origin "$INITIAL_SHA"
            fi
            git cat-file -e "${INITIAL_SHA}^{commit}"

            BACKUP_ROOT="$HOME/backups"
            mkdir -p "$BACKUP_ROOT"
            BACKUP="$BACKUP_ROOT/rhat-search-form-before-restore-$(date +%Y%m%d-%H%M%S)"
            if [ -d "$PROD_TEMPLATE" ]; then
              cp -a "$PROD_TEMPLATE" "$BACKUP"
              echo "BACKUP=$BACKUP"
            fi

            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            git archive "$INITIAL_SHA" "$SNAPSHOT_PATH" | tar -x -C "$TMP"
            test -f "$TMP/$SNAPSHOT_PATH/template.php"
            test -f "$TMP/$SNAPSHOT_PATH/style.css"
            test -f "$TMP/$SNAPSHOT_PATH/script.js"
            test -f "$TMP/$SNAPSHOT_PATH/ajax.php"

            rm -rf "$PROD_TEMPLATE"
            mkdir -p "$(dirname "$PROD_TEMPLATE")"
            cp -a "$TMP/$SNAPSHOT_PATH" "$PROD_TEMPLATE"

            # Remove only temporary test artifacts created during this work.
            rm -rf "$SITE_ROOT/local/components/rhat.search.test"
            rm -rf "$SITE_ROOT/local/templates/anytour/components/rhat.search.test"
            rm -rf "$SITE_ROOT/bitrix/templates/anytour/components/rhat.search.test"

            if command -v /opt/php81/bin/php >/dev/null 2>&1; then PHP_BIN=/opt/php81/bin/php; else PHP_BIN=php; fi
            "$PHP_BIN" -l "$PROD_TEMPLATE/template.php"
            "$PHP_BIN" -l "$PROD_TEMPLATE/ajax.php"

            PROD_HTML="$(mktemp)"
            PROD_CODE="$(curl -k -L -sS -o "$PROD_HTML" -w '%{http_code}' --max-time 30 https://anytour.online/poisk-turov/)"
            echo "PROD_HTTP_CODE=$PROD_CODE"
            test "$PROD_CODE" = "200"
            grep -q '/bitrix/templates/anytour/components/rhat.search/form/form/' "$PROD_HTML"
            echo "PRODUCTION_TEMPLATE_RESTORED_FROM=$INITIAL_SHA"
            rm -f "$PROD_HTML"
