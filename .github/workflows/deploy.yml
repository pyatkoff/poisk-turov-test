name: Deploy V2 only
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
  workflow_dispatch:
jobs:
  deploy-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Copy V2 folder only
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: /github/workspace/deploy_key
          source: "v2/*"
          target: "~/www/anytour.online/poisk-turov-test/"
          overwrite: true
      - name: Verify V2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ github.workspace }}/deploy_key
          script: |
            set -euo pipefail
            page_code="$(curl -k -L -sS -o /tmp/v2.html -w '%{http_code}' --max-time 40 https://anytour.online/poisk-turov-test/v2/)"
            api_code="$(curl -k -L -sS -o /tmp/v2-health.json -w '%{http_code}' --max-time 45 'https://anytour.online/poisk-turov-test/v2/api.php?action=health')"
            echo "PAGE=$page_code API=$api_code"
            cat /tmp/v2-health.json
            grep -q 'Найти тур' /tmp/v2.html
            grep -q 'tourvisor-direct' /tmp/v2-health.json
