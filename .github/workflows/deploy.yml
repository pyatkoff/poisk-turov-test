name: Read-only active template audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then printf '%b\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"; else exit 1; fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Inspect response head and redirects only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -euo pipefail
            for url in https://anytour.online/poisk-turov/ https://anytour.online/poisk-turov-test/; do
              echo "=== $url HEADERS ==="
              curl -k -sS -I --max-time 30 "$url" | sed -n '1,30p'
              echo "=== $url FINAL ==="
              curl -k -L -sS -o /tmp/page.$$ -w 'FINAL_URL=%{url_effective}\nHTTP=%{http_code}\n' --max-time 30 "$url"
              echo '--- HEAD SNIPPET ---'
              sed -n '1,140p' /tmp/page.$$ | head -140
              echo '--- TEMPLATE MARKERS ---'
              grep -Eo '/(bitrix|local)/templates/[^"'"' ]+|/css/[^"'"' ]+|/js/[^"'"' ]+' /tmp/page.$$ | sort -u | head -120 || true
              rm -f /tmp/page.$$
            done
            echo '=== SITE TEMPLATE FILES ==='
            find "$HOME/www/anytour.online/bitrix/templates" -maxdepth 2 -type f \( -name header.php -o -name style.css -o -name template_styles.css \) -printf '%p %s bytes\n' | sort
            echo 'READ_ONLY_ACTIVE_TEMPLATE_AUDIT=OK'
