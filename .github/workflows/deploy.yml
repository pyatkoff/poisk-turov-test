name: Deploy tour search test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"

          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              echo "DEPLOY_SSH_KEY is not a recognized private-key encoding"
              exit 1
            fi
          fi

          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Deploy to poisk-turov-test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/poisk-turov-test

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: local tracked changes detected; refusing to overwrite"
              git status --short
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            if command -v /opt/php81/bin/php >/dev/null 2>&1; then
              PHP_BIN=/opt/php81/bin/php
            else
              PHP_BIN=php
            fi

            "$PHP_BIN" -l index.php
            if [ -f anytour/components/rhat.search/form/form/ajax.php ]; then
              "$PHP_BIN" -l anytour/components/rhat.search/form/form/ajax.php
            fi
            if [ -f anytour/components/rhat.search/form/form/template.php ]; then
              "$PHP_BIN" -l anytour/components/rhat.search/form/form/template.php
            fi
            if [ -f tv_api/search.php ]; then
              "$PHP_BIN" -l tv_api/search.php
            fi
            if [ -f tv_api/tvapi.php ]; then
              "$PHP_BIN" -l tv_api/tvapi.php
            fi

            SITE_ROOT="$HOME/www/anytour.online"
            echo "--- Bitrix search component diagnostics ---"
            for p in \
              "$SITE_ROOT/bitrix/components/rhat.search/form" \
              "$SITE_ROOT/local/components/rhat.search/form" \
              "$SITE_ROOT/bitrix/templates/anytour/components/rhat.search/form/form" \
              "$SITE_ROOT/local/templates/anytour/components/rhat.search/form/form"; do
              if [ -e "$p" ]; then
                echo "FOUND: $p"
                find "$p" -maxdepth 2 -type f | sort | head -80
              else
                echo "MISSING: $p"
              fi
            done

            echo "Deployed commit: $(git rev-parse HEAD)"
