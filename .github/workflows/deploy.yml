name: Deploy tour search test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poisk-turov-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH private key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          rm -f "$key_file"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then
            if [[ "$raw" == *'\\n'* ]]; then
              printf '%b\n' "$raw" | tr -d '\r' > "$key_file"
            else
              printf '%s\n' "$raw" | tr -d '\r' > "$key_file"
            fi
          else
            decoded="$(printf '%s' "$raw" | base64 --decode 2>/dev/null || true)"
            if [[ "$decoded" == *"PRIVATE KEY"* ]]; then
              printf '%s\n' "$decoded" | tr -d '\r' > "$key_file"
            else
              echo "DEPLOY_SSH_KEY is not a recognized private-key encoding"
              exit 1
            fi
          fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null

      - name: Deploy to poisk-turov-test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          script: |
            set -e
            cd ~/www/anytour.online/poisk-turov-test
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: local tracked changes detected; refusing to overwrite"
              git status --short
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main

            SITE_ROOT="$HOME/www/anytour.online"
            TEST_COMPONENT="$SITE_ROOT/local/components/rhat.search.test/form"
            TEST_TEMPLATE="$SITE_ROOT/local/templates/anytour/components/rhat.search.test/form/form"

            mkdir -p "$TEST_COMPONENT" "$TEST_TEMPLATE"
            cp component/component.php "$TEST_COMPONENT/component.php"
            cp component/.description.php "$TEST_COMPONENT/.description.php"
            cp component/.parameters.php "$TEST_COMPONENT/.parameters.php"
            cp component/ajax.php "$TEST_COMPONENT/ajax.php"
            cp -a anytour/components/rhat.search/form/form/. "$TEST_TEMPLATE/"

            # Isolate the test component from production Tourvisor PHP files.
            sed -i "s#'/bitrix/php_interface/tv_api/tvapi.php'#'/poisk-turov-test/tv_api/tvapi.php'#" "$TEST_COMPONENT/component.php"
            sed -i "s#'/bitrix/php_interface/tv_api/search.php'#'/poisk-turov-test/tv_api/search.php'#" "$TEST_TEMPLATE/ajax.php"
            sed -i "s#'/bitrix/php_interface/tv_api/tvapi.php'#'/poisk-turov-test/tv_api/tvapi.php'#" "$TEST_TEMPLATE/ajax.php"
            sed -i "s#'/bitrix/php_interface/tv_api/tourvisor/vendor/autoload.php'#'/poisk-turov-test/tv_api/tourvisor/vendor/autoload.php'#" tv_api/tvapi.php || true

            if command -v /opt/php81/bin/php >/dev/null 2>&1; then PHP_BIN=/opt/php81/bin/php; else PHP_BIN=php; fi
            "$PHP_BIN" -l index.php
            "$PHP_BIN" -l "$TEST_COMPONENT/component.php"
            "$PHP_BIN" -l "$TEST_TEMPLATE/ajax.php"
            "$PHP_BIN" -l "$TEST_TEMPLATE/template.php"
            "$PHP_BIN" -l tv_api/search.php
            "$PHP_BIN" -l tv_api/tvapi.php
            echo "Deployed isolated test component: rhat.search.test:form"
            echo "Deployed commit: $(git rev-parse HEAD)"
