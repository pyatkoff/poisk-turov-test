name: MATCH Tourvisor ANEX direct8 CURRENT review v1
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths: [.github/workflows/hotel-match-tv-anex-direct8-current-review-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-tv-anex-direct8-current-review-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tv-anex-direct8-current-review-1971-20260917-v1
  RETAINED_RESULT_SHA: 6d5b18584b31ac3b63774e547e5db2553d09aa8a2f31a7db18897a3ba4a4c76c
jobs:
  current-review:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify exact read-only diagnostic and reserve
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/diagnostics/hotel_match_tv_anex_direct8_current_review_v1.php
          test "$(git hash-object "$src")" = 76c98bb4385bb5bbc22cc0331e402cc47495c74c
          php -l "$src"
          php "$src" --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' "$src"
          ! grep -Eiq '(curl|wget|requests\.|urllib\.request|api\.tourvisor|gateway\.samo|parser\.anextour)' "$src"
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','retained_source_run':35140146825,'retained_result_sha256':os.environ['RETAINED_RESULT_SHA'],'expected_rows':8,'claim_comment_id':5713088707,'coordination_issue':2530,'queue_issue':1971,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tv-anex-direct8-current-review-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tv-anex-direct8-current-review-1971-20260917-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run one CURRENT read-only reconciliation
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < scripts/diagnostics/hotel_match_tv_anex_direct8_current_review_v1.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e; export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'; s.mkdir()
          if int(os.environ['TAR_RC']) != 0: raise SystemExit(2)
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size <= 2000000
                  (s/m.name).write_bytes(t.extractfile(m).read())
          r=json.loads((s/'result.json').read_text()); c=json.loads((s/'receipt.json').read_text())
          rh=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          ok=(int(os.environ['REMOTE_RC'])==0 and r.get('state')=='completed_read_only' and r.get('checked')==8
              and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('source_sha')==os.environ['GITHUB_SHA']
              and r.get('retained_result_sha256')==os.environ['RETAINED_RESULT_SHA'] and r.get('no_replay') is True
              and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls','booking_calls','lead_calls'])
              and c.get('readback_verified') is True and c.get('result_sha256')==rh and c.get('no_replay') is True)
          gate={'verified':ok,'checked':r.get('checked'),'safe_candidate_count':r.get('safe_candidate_count'),'existing_same_count':r.get('existing_same_count'),'held_count':r.get('held_count'),'pending_total':r.get('pending_total'),'pending_by_namespace':r.get('pending_by_namespace'),'result_sha256':rh,'remote_exit':int(os.environ['REMOTE_RC']),'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(gate,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-anex-direct8-current-review-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tv-anex-direct8-current-review-1971-20260917-v1/
          if-no-files-found: warn
          retention-days: 90
