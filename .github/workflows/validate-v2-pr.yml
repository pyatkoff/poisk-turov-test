name: Validate V2 pull request

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/validate-v2-pr.yml'

concurrency:
  group: ci-validate-v2-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v2-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in v2/*.php; do php -l "$file" >/dev/null; done
          echo V2_PHP_OK

      - name: Validate active JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(grep -oE "v2_asset\('[^']+\.js'\)" v2/index.php | sed -E "s/.*'([^']+)'.*/\1/" | sort -u)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            test -f "v2/$asset"
            node --check "v2/$asset"
          done
          echo V2_JS_OK

      - name: Validate lazy advanced catalog contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('v2/catalogs-v2.js','utf8');
          const required=[
            "extras=form&&form.querySelector('details.extras')",
            "criticalReady=false,advancedKey='',mealsLoaded=false",
            "function advancedOpen()",
            "async function ensureAdvanced(token,force)",
            "if(advancedOpen())await ensureAdvanced(token,true)",
            "extras.addEventListener('toggle'",
            "if(!extras.open||!criticalReady)return",
            "get advancedLoaded(){return !!advancedKey;}"
          ];
          required.forEach(token=>{if(!src.includes(token))throw new Error('lazy catalog contract missing: '+token);});
          const init=src.slice(src.indexOf('async function init()'),src.indexOf('function renderChildAges'));
          if(!init.includes('await loadCountries(token)'))throw new Error('critical countries load missing from init');
          if(init.includes('Promise.all([refreshDestination(token),loadMeals(token)])'))throw new Error('advanced catalogs leaked back into startup');
          console.log('V2_LAZY_ADVANCED_CATALOGS_OK');
          NODE

      - name: Validate C5 flight autoload contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('v2/tour-controller-v4.js','utf8');
          const required=[
            "flightLoadingTourId===expectedTourId",
            "renderFlightLoading();",
            "renderFlightError(tid",
            "emit('tour-selected',{tour:t});loadFlights(tid);",
            "class=\"load-flights secondary\"",
            "Попробовать загрузить рейсы ещё раз",
            "emit('flight-selected'"
          ];
          required.forEach(token=>{if(!src.includes(token))throw new Error('C5 autoload contract missing: '+token);});
          if(src.includes('>Показать рейсы</button>'))throw new Error('manual flight-load first step leaked back into selected tour');
          console.log('V2_C5_FLIGHT_AUTOLOAD_OK');
          NODE

      - name: Validate active asset closure
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib,re,sys
          root=pathlib.Path('v2')
          text=(root/'index.php').read_text(encoding='utf-8')
          assets=re.findall(r"v2_asset\('([^']+)'\)",text)
          missing=[asset for asset in assets if not (root/asset).is_file()]
          print('ACTIVE_ASSETS',len(assets),'MISSING',missing)
          if missing: sys.exit(1)
          PY

      - name: Validate B1 product-shell contract
        shell: bash
        run: |
          set -euo pipefail
          test -s v2/product-shell-v1.css
          grep -Fq "v2_asset('product-shell-v1.css')" v2/index.php
          grep -Fq 'class="v2-product-hero"' v2/index.php
          grep -Fq 'id="v2-search-title"' v2/index.php
          grep -Fq '<img src="/images/logo.svg" alt="AnyTour">' v2/index.php
          echo V2_B1_PRODUCT_SHELL_OK

      - name: Validate test-route SEO semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html,pathlib,re,sys
          text=pathlib.Path('v2/index.php').read_text(encoding='utf-8')
          h1s=re.findall(r'<h1\b[^>]*>(.*?)</h1>',text,re.I|re.S)
          if len(h1s)!=1:
              print('V2_PR_SEO_FAIL:h1_count')
              sys.exit(1)
          h1=html.unescape(re.sub(r'<[^>]+>',' ',h1s[0])).strip().lower()
          if 'поиск' not in h1 or 'тур' not in h1:
              print('V2_PR_SEO_FAIL:h1_text')
              sys.exit(2)
          if '<title>Поиск туров — AnyTour</title>' not in text:
              print('V2_PR_SEO_FAIL:title')
              sys.exit(3)
          if 'name="robots" content="noindex,follow' not in text:
              print('V2_PR_SEO_FAIL:robots')
              sys.exit(4)
          print('V2_PR_SEO_OK')
          PY
