name: MATCH V16 bgoperator writer V17
'on':
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_v16_bgoperator_writer_v17.php
      - tests/hotel_match_v16_bgoperator_writer_v17_test.php
      - .github/workflows/hotel-match-v16-bgoperator-writer-v17.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-v16-bgoperator-writer-1971-20260922-v17, cancel-in-progress: false}
env:
  OP: hotel-match-v16-bgoperator-writer-1971-20260922-v17
  BASE: a31154d9eabd5d3e3fbe14f0507efadd538aa33d
  CLAIM: '5783776340'
  INPUT_ARTIFACT: '10717868335'
jobs:
  unit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'feat/match-v16-bgoperator-writer-1971-20260922-v17'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: match_v17
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate isolated writer
        env: {MATCH_V17_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=match_v17;charset=utf8mb4'}
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_v16_bgoperator_writer_v17.php
          php -l tests/hotel_match_v16_bgoperator_writer_v17_test.php
          php tests/hotel_match_v16_bgoperator_writer_v17_test.php
  live:
    needs: unit
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'feat/match-v16-bgoperator-writer-1971-20260922-v17' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source, claim, input and reserve
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          expected=".github/workflows/hotel-match-v16-bgoperator-writer-v17.yml scripts/diagnostics/hotel_match_v16_bgoperator_writer_v17.php tests/hotel_match_v16_bgoperator_writer_v17_test.php "
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = "$expected"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,pathlib,datetime
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for t in [os.environ['OP'],'336','SERIALIZABLE','rollback entire batch','Provider/Tourvisor/SAMO/ANEX/Andromeda HTTP0']:
              assert t in b,t
          r={'operation':os.environ['OP'],'state':'reserved_before_write','source_sha':os.environ['HEAD'],
             'provider_calls':0,'database_writes':0,'mapping_writes':0,
             'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('reservation/reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$INPUT_ARTIFACT/zip" >input/v16.zip
          echo "c557146b0bef7d6b9a26b0984d36e2d3ce500a6ff16cd200b699451f84a30dd9  input/v16.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json
          with zipfile.ZipFile('input/v16.zip') as z:b=z.read('result.json')
          assert hashlib.sha256(b).hexdigest()=='2f8602c57c18343cd6c4388675528d55f214e35f91e43d4b71902b5207ce1b3c'
          r=json.loads(b); rows=[x for x in r['rows'] if x.get('writer_ready') is True]
          assert len(rows)==336 and len({(x['supplier_namespace'],x['external_hotel_id']) for x in rows})==336 and len({x['tv_hotel_id'] for x in rows})==336
          assert {x['supplier_namespace'] for x in rows}=={'bgoperator'}
          pathlib.Path('input/v16-result.json').write_bytes(b)
          PY
          rm input/v16.zip input/claim.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-v17-reservation-${{ github.run_id }}', path: reservation/, retention-days: 90}
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(90):
              req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(5)
          else:raise SystemExit('security_not_green')
          PY
      - name: Execute guarded 336-row writer
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail;umask 077;test -n "$KEY";test -n "$HOST";test -n "$USER"
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OP";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json input/v16-result.json scripts/diagnostics/hotel_match_v16_bgoperator_writer_v17.php "$remote:$op/payload/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\";cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_V16_RESULT=\"\$HOME/$op/payload/v16-result.json\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/payload/hotel_match_v16_bgoperator_writer_v17.php\" --execute" >terminal/remote.stdout 2>terminal/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";mkdir -p export;for f in reservation.json pre-commit.json commit-attempt.json result.json receipt.json;do test -f \"\$f\"&&cp \"\$f\" export/;done;tar -czf - -C export ." >terminal/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  n=m.name.lstrip('./')
                  if m.isfile():pathlib.Path('terminal',n).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          if r['state']!='committed_verified':
              print(json.dumps({'state':r['state'],'reason':r.get('reason'),'database_writes':r.get('database_writes')},sort_keys=True))
              raise SystemExit(2)
          assert r['inserted']==336 and r['database_writes']==r['mapping_writes']==336 and r['readback_verified'] is True
          assert q['state']=='committed_verified' and q['no_replay'] is True
          print(json.dumps({'state':r['state'],'inserted':336,'preexisting_rows_preserved':r['preexisting_rows_preserved'],'readback_verified':True},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-v17-terminal-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
