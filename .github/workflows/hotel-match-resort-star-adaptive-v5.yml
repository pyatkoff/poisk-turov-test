name: MATCH resort-star adaptive v5

on:
  push:
    branches:
      - ops/match-resort-star-adaptive-1971-20260911-v5
    paths:
      - .github/match-resort-star-adaptive-v5.arm

permissions:
  contents: read

concurrency:
  group: anytour-match-resort-star-adaptive-v5
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATION_ID: hotel-match-resort-star-adaptive-1971-20260911-v5
      OUT: /tmp/match-rs-v5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Verify and cooldown
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(cat .github/match-resort-star-adaptive-v5.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_resort_star_availability_v5.php
          mkdir -p "$OUT"
          sleep 30

      - name: Zero-supplier SSH preflight
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, subprocess, tempfile
          from pathlib import Path
          raw=os.environ['SSH_KEY'].strip()
          with tempfile.TemporaryDirectory() as td:
              k=Path(td)/'k'
              if 'PRIVATE KEY' in raw: k.write_text(raw.rstrip()+'\n')
              else: k.write_bytes(base64.b64decode(raw))
              k.chmod(0o600)
              cmd=['ssh','-T','-i',str(k),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'kh'),'-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['SSH_USER'],os.environ['SSH_HOST'],"cd \"$HOME/www/anytoour.ru\" && test -f config.php && php -r 'echo \"RSV5_OK\\n\";' "]
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=45)
          if p.returncode != 0 or 'RSV5_OK' not in p.stdout: raise SystemExit('ssh_preflight_failed')
          print('RSV5_OK')
          PY

      - name: Reserve before supplier access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          src=Path('scripts/diagnostics/hotel_match_resort_star_availability_v5.php').read_bytes()
          v={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'program_sha256':hashlib.sha256(src).hexdigest(),'country':'Turkey','resorts':['Анталья','Аланья','Кемер','Белек','Сиде','Бодрум','Мармарис'],'stars':[3,4,5],'dates':['2026-09-25','2026-10-02','2026-10-16','2026-11-06','2026-11-20'],'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          p=Path(os.environ['OUT'],'reservation.json'); raw=(json.dumps(v,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode(); p.write_bytes(raw)
          if p.read_bytes()!=raw: raise SystemExit('reservation_readback_failed')
          PY

      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: "hotel-match-resort-star-adaptive-v5-${{ github.run_id }}-reserved"
          path: /tmp/match-rs-v5/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute adaptive availability discovery
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          src=Path('scripts/diagnostics/hotel_match_resort_star_availability_v5.php').read_text(); raw=os.environ['SSH_KEY'].strip(); out=Path(os.environ['OUT'])/'result.json'
          with tempfile.TemporaryDirectory() as td:
              k=Path(td)/'k'
              if 'PRIVATE KEY' in raw: k.write_text(raw.rstrip()+'\n')
              else: k.write_bytes(base64.b64decode(raw))
              k.chmod(0o600)
              cmd=['ssh','-T','-i',str(k),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'kh'),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['SSH_USER'],os.environ['SSH_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              p=subprocess.run(cmd,input=src,text=True,capture_output=True,timeout=900)
          marker='MATCH_RS_JSON:'; line=next((x[len(marker):] for x in reversed(p.stdout.splitlines()) if x.startswith(marker)),None)
          if line is None:
              v={'status':'unknown','reason':'result_marker_missing','operation_id':os.environ['OPERATION_ID'],'remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(p.stderr.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}; out.write_text(json.dumps(v,sort_keys=True,indent=2)+'\n'); print(json.dumps(v,sort_keys=True)); raise SystemExit('unknown/no-replay')
          v=json.loads(line); v.update(source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),remote_exit=p.returncode,no_replay=True); out.write_text(json.dumps(v,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          rows=v.get('rows') or []
          print(json.dumps({'catalog_regions_total':v.get('catalog_regions_total'),'searches_started':v.get('searches_started'),'active_slices':sum(1 for r in rows if r.get('active_date')),'rows':rows},ensure_ascii=False))
          if p.returncode != 0 or v.get('status') != 'completed': raise SystemExit('failed')
          if any(int(v.get(k) or 0)!=0 for k in ('database_writes','mapping_writes','booking_calls','lead_calls')): raise SystemExit('unsafe_side_effect')
          PY

      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "hotel-match-resort-star-adaptive-v5-${{ github.run_id }}-final"
          path: |
            /tmp/match-rs-v5/reservation.json
            /tmp/match-rs-v5/result.json
          if-no-files-found: warn
          retention-days: 90
