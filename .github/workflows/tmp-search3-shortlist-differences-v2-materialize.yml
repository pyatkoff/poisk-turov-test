name: Temporary Search3 shortlist differences v2 materialize
on:
  push:
    branches: [ux/search3-shortlist-differences-v2-20260912]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-shortlist-differences-v2-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build canonical Search3 generated assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          python3 -B scripts/build/search3_assets.py --write
          python3 -B scripts/build/search3_assets.py --check
          node scripts/build/search3-js/shared-runtime.cjs --check
      - name: Sync reviewed JS hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('docs/project/search3-production-import.json')
          data = json.loads(p.read_text())
          name = 'search3-results-filters-v1.js'
          data['assets'][name]['productionSha256'] = hashlib.sha256((Path('v2') / name).read_bytes()).hexdigest()
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Focused source/generated checks
        shell: bash
        run: |
          set -euo pipefail
          node --check src/search3/behavior/results/shortlist.js
          node tests/search3-shortlist-trip-summary.test.js
          python3 -B scripts/build/search3_assets.py --check
          git diff --check
          git diff --exit-code -- src/search3/behavior/results/shortlist.js tests/search3-shortlist-trip-summary.test.js
      - name: Commit generated parity and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-search3-shortlist-differences-v2-materialize.yml
          git add v2/search3-results-filters-v1.js docs/project/search3-production-import.json .github/workflows/tmp-search3-shortlist-differences-v2-materialize.yml
          test -n "$(git status --porcelain)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'SEARCH: materialize shortlist decision bundle'
          git push origin HEAD:ux/search3-shortlist-differences-v2-20260912
