name: Prepare Search3 mobile toolbar owner cleanup

on:
  push:
    branches:
      - refactor/search3-mobile-toolbar-owner-35e2ae36
    paths:
      - '.github/workflows/search3-mobile-toolbar-prep.yml'

permissions:
  contents: read

concurrency:
  group: search3-mobile-toolbar-preparation
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact code and existing focused checks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cb2122aeb5a0bb8e2031532be629a6851e19594a
          test "$(git diff HEAD^ HEAD --name-only)" = .github/workflows/search3-mobile-toolbar-prep.yml
          python3 -B scripts/build/search3_assets.py --check
          python3 -B tests/search3_source_build_test.py
          python3 -B tests/search3_production_presentation_test.py
      - name: Install existing browser-test dependencies
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run existing five-width Search3 regression without deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p standalone-content-artifacts
          printf '%s\n' '<?php $_SERVER["HTTP_HOST"]="anytoour.ru"; $_SERVER["SCRIPT_NAME"]="/poisk-turov/index.php"; $_SERVER["REQUEST_URI"]="/poisk-turov/"; require __DIR__."/poisk-turov/index.php";' > v2/ci-search3.php
          php -S 127.0.0.1:8099 -t v2 >"$RUNNER_TEMP/search3-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do curl -fsS http://127.0.0.1:8099/ci-search3.php >/dev/null && break; sleep .2; done
          SEARCH3_VISUAL_BASE=http://127.0.0.1:8099 node tests/search3-card-readability-browser.cjs
      - name: Retain existing responsive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-toolbar-responsive-${{ github.run_id }}
          path: standalone-content-artifacts/
          if-no-files-found: warn
          retention-days: 7
