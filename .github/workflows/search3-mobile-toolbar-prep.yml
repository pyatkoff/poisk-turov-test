name: Prepare Search3 mobile toolbar owner cleanup
on:
  push:
    branches: [refactor/search3-mobile-toolbar-owner-35e2ae36]
    paths: ['.github/workflows/search3-mobile-toolbar-prep.yml']
permissions:
  contents: write
concurrency:
  group: search3-mobile-toolbar-preparation
  cancel-in-progress: false
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Continue only the unfinished boundary step on exact release
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/release/search3-production-ready-v1)" = 204b71046e113552aafea408368c17191982b53e
          test -z "$(git ls-remote --heads origin refs/heads/fix/search3-toolbar-desktop-boundary)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git worktree add --detach "$RUNNER_TEMP/toolbar-clean" 204b71046e113552aafea408368c17191982b53e
          python3 - <<'PY'
          import os
          import subprocess
          import textwrap
          from pathlib import Path
          # Reuse only the two reviewed, unfinished steps; completed queue changes are already in release.
          old = subprocess.check_output(['git','cat-file','blob','c72594769c7e96ccfa043a70b4d15efc84615f04'], text=True)
          def step(name):
              block = old.split('      - name: ' + name + '\n', 1)[1].split('\n      - name: ', 1)[0]
              return textwrap.dedent(block.split('        run: |\n', 1)[1])
          preparation = step('Prepare separate desktop visibility regression')
          before = "throw new Error('TOOLBAR_RESIZE_CHANGED_FORM ' + width);"
          after = "throw new Error('TOOLBAR_RESIZE_CHANGED_FORM ' + width + ' ' + JSON.stringify({ before: JSON.parse(before), after: await formValues() }));"
          assert preparation.count(before) == 1
          preparation = preparation.replace(before, after)
          anchor = "    await page.evaluate(html => {"
          assert preparation.count(anchor) == 1
          preparation = preparation.replace(anchor, '''    // Aborted catalogue requests finish asynchronously and clear loading options.
              // Wait for that fixture-only failure before capturing parameters for resize.
              await page.waitForFunction(() => document.getElementById('tourSearch').dataset.catalogSource === 'partial');
              await page.evaluate(() => {
                const form = document.getElementById('tourSearch');
                for (const [name, value, label] of [['from','1','Fixture departure'], ['country','4','Fixture country']]) {
                  const select = form.elements[name];
                  if (![...select.options].some(option => option.value === value)) select.add(new Option(label, value));
                  select.value = value;
                }
              });
          ''' + anchor)
          proof = step('Prove the desktop defect then verify the narrow CSS correction')
          proof = proof.replace(' | tee "$RUNNER_TEMP/toolbar-boundary-green.log"', ' 2>&1 | tee "$RUNNER_TEMP/toolbar-boundary-green.log"')
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp/'boundary-prepare.sh').write_text(preparation)
          (temp/'boundary-proof.sh').write_text(proof)
          PY
          bash "$RUNNER_TEMP/boundary-prepare.sh"
          bash "$RUNNER_TEMP/boundary-proof.sh"
      - name: Retain exact review and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-toolbar-boundary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/toolbar-boundary-code.txt
            ${{ runner.temp }}/toolbar-boundary-red.log
            ${{ runner.temp }}/toolbar-boundary-green.log
            ${{ runner.temp }}/toolbar-boundary-review.tar.gz
            ${{ runner.temp }}/toolbar-clean/tests/search3-card-readability-browser.cjs
            ${{ runner.temp }}/toolbar-clean/src/search3/styles/results-layout.css
            ${{ runner.temp }}/toolbar-clean/standalone-content-artifacts/
          if-no-files-found: error
          retention-days: 7
