name: MATCH ANEX current external evidence queue v3
on:
  push:
    branches: [ops/match-anex-current-external-evidence-queue-1971-20260916-v1]
    paths: ['.github/workflows/hotel-match-anex-current-external-evidence-queue-v3.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: anytour-match-anex-current-external-evidence-v3
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-current-external-evidence-queue-1971-20260916-v3
  OUT: /tmp/match-anex-current-external-evidence-v3
jobs:
  queue:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - name: Build corrected-country runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import pathlib,os
          src=pathlib.Path('scripts/diagnostics/hotel_match_anex_current_external_evidence_queue_v1.php').read_text()
          oldop='hotel-match-anex-current-external-evidence-queue-1971-20260916-v1'
          if src.count(oldop)!=1: raise SystemExit('operation_marker_changed')
          src=src.replace(oldop,'hotel-match-anex-current-external-evidence-queue-1971-20260916-v3')
          marker="str_replace(' ','',$f)"
          if src.count(marker)<1: raise SystemExit('compact_marker_missing')
          src=src.replace(marker,"str_replace(' ','',(string)$f)")
          old="['egypt'=>1,'египет'=>1,'turkey'=>2,'turkiye'=>2,'турция'=>2,'thailand'=>4,'таиланд'=>4,'uae'=>8,'unitedarabemirates'=>8,'оаэ'=>8,'объединенныеарабскиеэмираты'=>8,'vietnam'=>9,'вьетнам'=>9,'maldives'=>10,'мальдивы'=>10,'srilanka'=>12,'шриланка'=>12,'cuba'=>16,'куба'=>16]"
          new="['egypt'=>1,'египет'=>1,'thailand'=>2,'таиланд'=>2,'тайланд'=>2,'turkey'=>4,'turkiye'=>4,'турция'=>4,'maldives'=>8,'мальдивы'=>8,'uae'=>9,'unitedarabemirates'=>9,'оаэ'=>9,'объединенныеарабскиеэмираты'=>9,'cuba'=>10,'куба'=>10,'srilanka'=>12,'шриланка'=>12,'vietnam'=>16,'viet nam'=>16,'вьетнам'=>16]"
          if src.count(old)!=1: raise SystemExit('country_map_marker_changed')
          src=src.replace(old,new)
          (pathlib.Path(os.environ['OUT'])/'runtime-source.php').write_text(src)
          PY
          php -l "$OUT/runtime-source.php"
          php "$OUT/runtime-source.php" --self-test
          grep -Fq 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' "$OUT/runtime-source.php"
      - name: Reserve before SSH evidence DB
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT']);s=p/'runtime-source.php'
          (p/'runner-reservation.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_ssh_evidence_db','runtime_sha256':hashlib.sha256(s.read_bytes()).hexdigest(),'read_only':True,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 'match-anex-current-evidence-v3-reservation-${{ github.run_id }}'
          path: '${{ env.OUT }}/'
          retention-days: 90
      - name: Run immutable corrected-country queue
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi; chmod 600 "$key"; set +e
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M" < "$OUT/runtime-source.php" > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"; rc=$?
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"; trc=$?; set -e; rm -f "$key" "$known"; if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi; export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT']);load=lambda n:json.loads((p/n).read_text()) if (p/n).exists() else {};r=load('result.json');c=load('receipt.json');rr=load('runner-reservation.json');rh=hashlib.sha256((p/'result.json').read_bytes()).hexdigest() if (p/'result.json').exists() else None
          ok=(r.get('state')=='completed_read_only' and r.get('safe_to_write_now') is False and all(r.get(k)==0 for k in ('database_writes','mapping_writes','supplier_calls','tourvisor_calls','booking_calls','lead_calls')) and c.get('result_sha256')==rh and c.get('readback_verified') is True and rr.get('state')=='reserved_before_ssh_evidence_db' and int(os.environ['RC'])==0 and int(os.environ['TRC'])==0)
          g={'verified':ok,'examined':r.get('examined'),'queue_count':r.get('queue_count'),'saved_hotelcode_rows':r.get('saved_hotelcode_rows'),'direct_safe_prepared_count':r.get('direct_safe_prepared_count'),'operator_link_required_count':r.get('operator_link_required_count'),'reason_counts':r.get('reason_counts'),'direct_safe_prepared':r.get('direct_safe_prepared'),'operator_link_top':(r.get('operator_link_required') or [])[:30],'result_sha256':rh,'remote_exit':int(os.environ['RC']),'tar_exit':int(os.environ['TRC']),'no_replay':True};(p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps(g,ensure_ascii=False,sort_keys=True));raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'match-anex-current-evidence-v3-${{ github.run_id }}'
          path: '${{ env.OUT }}/'
          retention-days: 90
