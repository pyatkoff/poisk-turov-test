name: MATCH live offer evidence 1971
on:
  push:
    branches: [feat/match-live-offer-evidence-1971-20260912]
    paths: [.github/match-live-offer-evidence-1971-20260912-v1.arm]
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: anytour-match-live-offer-evidence-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-live-offer-evidence-1971-20260912-v1
  OUT: /tmp/match-live-offer-evidence-1971
jobs:
  evidence:
    if: github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline guards and derive exact server program
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live_offer_evidence.php
          php tests/hotel-match-live-offer-evidence-test.php
          mkdir -p "$OUT"
          cp scripts/diagnostics/hotel_match_live_offer_evidence.php "$OUT/program.php"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/match-live-offer-evidence-1971/program.php')
          s=p.read_text()
          old="$preview=$root.'/_preview/search3-anex-candidate';require_once $root.'/config.php';"
          new="$preview=$root.'/_preview/search3-anex-candidate';require_once $preview.'/api-anex-search3-preview.php';require_once $root.'/config.php';"
          if s.count(old)!=1: raise SystemExit('preview injection marker drift')
          p.write_text(s.replace(old,new,1))
          PY
          php -l "$OUT/program.php"
          test "$(head -n1 .github/match-live-offer-evidence-1971-20260912-v1.arm)" = "$OPERATION_ID"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT'])/'program.php'
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access','source_sha':os.environ['GITHUB_SHA'],'program_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'read_only':True,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'dates':['2026-10-05','2026-10-12'],'nights':7,'party':'2 adults','no_replay':True}
          (pathlib.Path(os.environ['OUT'])/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: reserve
        with: {name: 'match-live-offer-evidence-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '${{ steps.reserve.outputs.artifact-id }}', path: /tmp/match-live-offer-reservation, merge-multiple: true}
      - name: Execute bounded CURRENT live evidence pass
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail
          cmp "$OUT/reservation.json" /tmp/match-live-offer-reservation/reservation.json
          key="$RUNNER_TEMP/match-live-offer-key"; known="$RUNNER_TEMP/match-live-offer-known"; sock="$RUNNER_TEMP/match-live-offer.sock"
          cleanup(){ ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }; trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ok=0; for n in 1 2 3 4; do if ssh -M -S "$sock" -fnNT -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"; then ok=1; break; fi; sleep $((n*5)); done; test "$ok" = 1
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M' < "$OUT/program.php" > "$OUT/live.stdout" 2> "$OUT/live.stderr"
          rc=$?; set -e; export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          d=pathlib.Path(os.environ['OUT']); out=d.joinpath('live.stdout').read_text(errors='replace'); marker='HMOE_JSON:'; rows=[x[len(marker):] for x in out.splitlines() if x.startswith(marker)]
          data=json.loads(rows[-1]) if rows else {'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0}
          raw=(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode(); d.joinpath('result.json').write_bytes(raw)
          good=int(os.environ['RC'])==0 and data.get('status')=='completed' and data.get('operation_id')==os.environ['OPERATION_ID'] and all(data.get(k)==0 for k in ['database_writes','mapping_writes','booking_calls','lead_calls'])
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed' if good else data.get('status','unknown'),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'supplier_calls':data.get('supplier_calls'),'tourvisor_searches':data.get('tourvisor_calls'),'no_replay':True}
          d.joinpath('receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          top=(data.get('candidates') or [])[:12]
          summary=f"MATCH #1971 live-offer evidence `{os.environ['OPERATION_ID']}`: **{receipt['state']}** / NO-REPLAY. CURRENT unresolved {data.get('unresolved_count')} IDs / {data.get('unresolved_occurrences')} saved occurrences; synchronized candidate pairs {data.get('candidate_count')}, safe-review {data.get('safe_review_count')}. Supplier calls {data.get('supplier_calls')}; Tourvisor searches {data.get('tourvisor_calls')}; DB/mapping/booking/lead writes0. Price/rank are soft evidence only; no price arithmetic changed. Top candidate IDs `{[(r.get('anex_hotel_id'),r.get('tourvisor_hotel_id'),r.get('occurrences'),r.get('price_signal')) for r in top]}`. Run {os.environ['GITHUB_RUN_ID']}."
          d.joinpath('summary.md').write_text(summary+'\n'); print(summary)
          if not good: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-live-offer-evidence-${{ github.run_id }}-result
          path: |
            ${{ env.OUT }}/reservation.json
            ${{ env.OUT }}/result.json
            ${{ env.OUT }}/receipt.json
            ${{ env.OUT }}/summary.md
            ${{ env.OUT }}/live.stderr
          retention-days: 90
      - name: Record evidence result
        if: always() && hashFiles(format('{0}/summary.md', env.OUT)) != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
