name: Check AnyTour collection coverage

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/collection-coverage-v1.php'
      - '.github/workflows/check-anytour-collection-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/collection-coverage-v1.php'
      - '.github/workflows/check-anytour-collection-coverage.yml'
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of sparse/stale collection targets to print'
        required: true
        default: '25'
        type: string

concurrency:
  group: anytour-collection-coverage
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only planner
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/collection-coverage-v1.php
          grep -Fq "catalog_departure_countries_direct" v2/data/collection-coverage-v1.php
          grep -Fq "catalog_departure_countries_charter" v2/data/collection-coverage-v1.php
          grep -Fq "catalog_departure_countries_direct_charter" v2/data/collection-coverage-v1.php
          grep -Fq "COUNT(DISTINCT NULLIF(o.search_id" v2/data/collection-coverage-v1.php
          grep -Fq "COUNT(DISTINCT DATE(o.observed_at))" v2/data/collection-coverage-v1.php
          grep -Fq "'history_ready'" v2/data/collection-coverage-v1.php
          grep -Fq "'guarded_delta_ready'" v2/data/collection-coverage-v1.php
          grep -Fq "'good_price_only'" v2/data/collection-coverage-v1.php
          grep -Fq "ANYTOUR_COLLECTION_COVERAGE_V2_OK" v2/data/collection-coverage-v1.php
          grep -Fq "flight=%s" v2/data/collection-coverage-v1.php
          if grep -Eq '\b(INSERT|UPDATE|DELETE|REPLACE|TRUNCATE)\b' v2/data/collection-coverage-v1.php; then
            echo 'coverage planner must remain read-only' >&2
            exit 1
          fi
          echo ANYTOUR_COLLECTION_COVERAGE_TOOLING_OK

  production-coverage:
    if: github.event_name != 'pull_request'
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Report production coverage
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          LIMIT_VALUE: ${{ inputs.limit || '25' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          [[ "$LIMIT_VALUE" =~ ^[0-9]+$ ]]
          test "$LIMIT_VALUE" -ge 1 && test "$LIMIT_VALUE" -le 500
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_file='~/www/anytoour.ru/data/collection-coverage-v1.php'
          scp "${opts[@]}" v2/data/collection-coverage-v1.php "$remote:$remote_file"
          ssh "${opts[@]}" "$remote" "php \"\$HOME/www/anytoour.ru/data/collection-coverage-v1.php\" --limit='$LIMIT_VALUE'"
