name: MATCH ILKAY operator5 ANEX materialize v1
on:
  push:
    branches: [ops/match-ilkay-operator5-anex-materialize-1971-20260920-v1]
    paths: [.github/workflows/hotel-match-ilkay-operator5-anex-materialize-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-ilkay-operator5-anex-materialize-1971-20260920-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-ilkay-operator5-anex-materialize-1971-20260920-v1
jobs:
  apply:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '10603780117', run-id: 35504813279, github-token: '${{ github.token }}', path: retained, merge-multiple: true}
      - name: Validate immutable review and reserve max1 write
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p payload result
          test "$(git hash-object app/integrations/anex-search-mapping-registry.php)" = cc135a95d2a6e0f73ce50be2141c9b8a26fddc58
          cp scripts/diagnostics/hotel_match_ilkay_operator5_anex_materialize_v1.php payload/
          cp app/integrations/anex-search-mapping-registry.php payload/
          cp retained/server/result.json payload/review-result.json
          cp retained/server/receipt.json payload/review-receipt.json
          php -l payload/hotel_match_ilkay_operator5_anex_materialize_v1.php
          php payload/hotel_match_ilkay_operator5_anex_materialize_v1.php --self-test
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          raw=pathlib.Path('payload/review-result.json').read_bytes(); digest=hashlib.sha256(raw).hexdigest()
          assert digest=='0ccc10258c41496dff9d466354a32696dad9bee4c3a68a863c589124736da61e'
          d=json.loads(raw); r=json.loads(pathlib.Path('payload/review-receipt.json').read_bytes())
          assert d['state']=='completed_read_only' and d['safe_to_write_now'] is True and d['classification']=='safe_materialization_candidate'
          assert d['candidate']=={'local_hotel_id':17483,'samo_hotel_id':'4176','native_anex_id':32572,'operator5_evidence_sha256':'8b50ba11fd1907d0b43f2152e4fc10d8eb0e555d556e74a97f8065c1501f10dd'}
          assert r['state']=='completed_read_only' and r['result_sha256']==digest and r['readback_verified'] is True and r['mapping_writes']==0
          out={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_write','source_sha':os.environ['GITHUB_SHA'],'review_result_sha256':digest,'max_mapping_writes':1,'supplier_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True}
          p=pathlib.Path('result/reservation.json')
          with p.open('x') as f:
              json.dump(out,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          PY
          (cd payload && sha256sum *.php review-result.json review-receipt.json > SHA256SUMS)
      - name: Require exact-head Security before SSH
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(60):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f: runs=json.load(f)['workflow_runs']
              runs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
              if runs:
                  x=max(runs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success';print('SECURITY_OK',x['id']);break
              time.sleep(5)
          else: raise SystemExit('exact_security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'ilkay-anex-materialize-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Append exact operator-key mapping once and verify
        shell: bash
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/ilkay-key"; known="$RUNNER_TEMP/ilkay-known"; trap 'rm -f "$key" "$known"' EXIT
          test -n "$KEY"; test -n "$HOST"; test -n "$USER"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null; test -s "$known"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"; op=".anytour-operations/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytour-operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\";mkdir \"\$HOME/$op/payload\"" >result/setup.stdout 2>result/setup.stderr
          scp "${opts[@]}" result/reservation.json "$remote:$op/" >result/reserve.stdout 2>result/reserve.stderr
          scp "${opts[@]}" payload/hotel_match_ilkay_operator5_anex_materialize_v1.php payload/anex-search-mapping-registry.php payload/review-result.json payload/review-receipt.json payload/SHA256SUMS "$remote:$op/payload/" >result/copy.stdout 2>result/copy.stderr
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op/payload\" && sha256sum -c SHA256SUMS >/dev/null && cd \"\$HOME/www/anytoour.ru\" && umask 077 && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_OPERATION_ID=\"$OPERATION_ID\" MATCH_SOURCE_SHA=\"${GITHUB_SHA}\" php -d display_errors=0 -d log_errors=0 \"\$HOME/$op/payload/hotel_match_ilkay_operator5_anex_materialize_v1.php\"" >result/remote.stdout 2>result/remote.stderr
          rc=$?
          scp -r "${opts[@]}" "$remote:$op/." result/remote/ >result/readback.stdout 2>result/readback.stderr; rrc=$?
          set -e
          printf '{"remote":%s,"readback":%s}\n' "$rc" "$rrc">result/exit-codes.json
          test "$rrc" -eq 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('result/remote'); d=json.loads((p/'result.json').read_bytes()); r=json.loads((p/'receipt.json').read_bytes()); digest=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert d['operation_id']==r['operation_id']==os.environ['OPERATION_ID'] and d['source_sha']==os.environ['GITHUB_SHA']
          assert d['state']=='committed_verified' and r['state']=='committed_verified' and r['result_sha256']==digest and r['readback_verified'] is True
          assert d['supplier_calls']==0 and d['mapping_writes']==d['database_writes']==d['written_count']==1 and d['triple_increment']==1
          assert len(d['written'])==len(d['post_commit_readback'])==1
          w=d['written'][0]; row=d['post_commit_readback'][0]
          assert int(w['anex_hotel_id'])==int(row['anex_hotel_id'])==32572 and int(w['catalog_hotel_id'])==int(row['catalog_hotel_id'])==17483
          assert row['match_class']=='exact_operator_key' and row['approval_policy']=='owner_exact_operator_key_20260912_v2' and row['scope']=='preview' and int(row['enabled'])==1
          assert d['effective_resolver']=={'anex_32572':17483,'existing_alias_28711':17483}
          pathlib.Path('result/verified-summary.json').write_text(json.dumps({'state':d['state'],'mapping_writes':1,'triple_increment':1,'anex_hotel_id':32572,'local_hotel_id':17483,'result_sha256':digest},ensure_ascii=False,indent=2)+'\n')
          print('ILKAY_ANEX_MATERIALIZE_VERIFIED',digest)
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'ilkay-anex-materialize-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
