name: MATCH native fixed TV pair probe v1
on:
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-native-fixed-tv-pair-probe-1971-20260912-v1.arm']
permissions: {contents: read, issues: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: {OUT: '/tmp/match-native-fixed-tv-pair'}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Execute CURRENT fixed-pair probe
        env: {KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail;test "$GITHUB_RUN_ATTEMPT" = 1;test "$(cat .github/match-native-fixed-tv-pair-probe-1971-20260912-v1.arm)" = hotel-match-native-fixed-tv-pair-probe-1971-20260912-v1;php -l scripts/diagnostics/hotel_match_native_fixed_tv_pair_probe_v1.php;mkdir -p "$OUT";key="$RUNNER_TEMP/nftp-key";known="$RUNNER_TEMP/nftp-known";if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi;chmod 600 "$key";ok=0;for a in 1 2 3;do if ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < scripts/diagnostics/hotel_match_native_fixed_tv_pair_probe_v1.php > "$OUT/stdout" 2> "$OUT/stderr";then ok=1;break;fi;sleep $((a*3));done;test "$ok" = 1;grep '^NFTP:' "$OUT/stdout"|tail -1|sed 's/^NFTP://' > "$OUT/result.json";python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ['OUT']);x=json.loads((d/'result.json').read_text());s=f"MATCH #1971 fixed TV candidate CURRENT probe: **{x.get('status')}** / NO-REPLAY. Pairs {len(x.get('rows',[]))}; supplier/Tourvisor/DB writes/calls0.";(d/'summary.md').write_text(s+'\n');print(s)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-native-fixed-tv-pair-v1-${{ github.run_id }}', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record
        if: success()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md"
