      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Syntax check canonical shortlist owner and browser contract
        run: |
          node --check src/search3/behavior/results/shortlist.js
          node --check tests/search3-shortlist-browser.cjs
      - name: Verify shortlist trip summary contract
        run: node tests/search3-shortlist-trip-summary.test.js
      - name: Regenerate canonical Search3 assets
        run: python3 scripts/build/search3_assets.py --write
      - name: Reject unexpected generated drift
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- v2 docs/project/search3-production-import.json | grep -Ev '^(v2/search3-results-filters-v1\.(js|css)|docs/project/search3-production-import\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected generated drift:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Upload canonical generated candidate
        uses: actions/upload-artifact@v4
        with:
          name: search3-shortlist-trip-summary-generated
          path: |
            v2/search3-results-filters-v1.js
            v2/search3-results-filters-v1.css
            docs/project/search3-production-import.json
          if-no-files-found: error
          retention-days: 3
      - name: Materialize exact source, browser contract and generated parity on the PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          paths=(src/search3/behavior/results/shortlist.js tests/search3-shortlist-browser.cjs v2/search3-results-filters-v1.js v2/search3-results-filters-v1.css docs/project/search3-production-import.json)
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Mobile compare parity already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'SEARCH: cover mobile compare disclosure'
          git push origin "HEAD:${HEAD_REF}"
      - name: Require committed generated parity
        run: git diff --exit-code -- v2/search3-results-filters-v1.js v2/search3-results-filters-v1.css docs/project/search3-production-import.json
