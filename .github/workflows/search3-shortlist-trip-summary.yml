name: Search3 Shortlist Trip Summary

on:
  pull_request:
    paths:
      - 'src/search3/behavior/results/shortlist.js'
      - 'v2/search3-results-filters-v1.js'
      - 'docs/project/search3-production-import.json'
      - 'tests/search3-shortlist-trip-summary.test.js'
      - '.github/workflows/search3-shortlist-trip-summary.yml'

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Syntax check canonical shortlist owner
        run: node --check src/search3/behavior/results/shortlist.js
      - name: Verify shortlist trip summary contract
        run: node tests/search3-shortlist-trip-summary.test.js
      - name: Regenerate canonical Search3 assets
        run: python3 scripts/build/search3_assets.py --write
      - name: Reject unexpected generated drift
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- v2 docs/project/search3-production-import.json | grep -Ev '^(v2/search3-results-filters-v1\.js|docs/project/search3-production-import\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected generated drift:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Upload canonical generated candidate
        uses: actions/upload-artifact@v4
        with:
          name: search3-shortlist-trip-summary-generated
          path: |
            v2/search3-results-filters-v1.js
            docs/project/search3-production-import.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit canonical generated parity
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- v2/search3-results-filters-v1.js docs/project/search3-production-import.json; then
            echo 'Generated assets already match source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/search3-results-filters-v1.js docs/project/search3-production-import.json
          git commit -m 'SEARCH: sync shortlist generated assets'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Require committed generated parity
        run: git diff --exit-code -- v2/search3-results-filters-v1.js docs/project/search3-production-import.json
