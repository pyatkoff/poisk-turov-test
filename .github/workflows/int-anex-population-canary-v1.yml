name: INT direct ANEX DB population canary v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/int-anex-population-canary-v1.yml'

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: direct-anex-population-canary-2506-v1
  cancel-in-progress: false

env:
  SOURCE_SHA: d8a11376535f6ea44ba0e83694a449fa54f84ab1
  OPERATION_ID: direct-anex-population-canary-2506-20260918-v1

jobs:
  canary:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' && github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.head.ref == 'ops/int-anex-population-canary-20260918-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false

      - name: Verify fresh owner claim, published source and exact Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api repos/pyatkoff/poisk-turov-test/pulls/$PR_NUMBER --jq '.head.sha')" = "$HEAD_SHA"
          gh api repos/pyatkoff/poisk-turov-test/issues/comments/5722655376 > claim.json
          python3 - <<'PY'
          import datetime,json,os,subprocess
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          assert 'direct-anex-population-canary-2506-20260918-v1' in c['body'] and os.environ['SOURCE_SHA'] in c['body']
          assert 'Do NOT republish runtime' in c['body']
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(c['created_at'].replace('Z','+00:00'))
          assert 0<=age.total_seconds()<7200,'claim expired'
          # Prior publication job itself succeeded even though its attached pre-supplier canary failed.
          jobs=json.loads(subprocess.check_output(
              ['gh','api','repos/pyatkoff/poisk-turov-test/actions/runs/35287088336/jobs'],text=True))['jobs']
          pub=[j for j in jobs if j['name']=='publish']
          assert len(pub)==1 and pub[0]['status']=='completed' and pub[0]['conclusion']=='success'
          install=json.loads(subprocess.check_output(
              ['gh','api','repos/pyatkoff/poisk-turov-test/actions/runs/35286794911'],text=True))
          assert install['status']=='completed' and install['conclusion']=='success'
          PY
          ok=0
          for i in $(seq 1 36); do
            gh api repos/pyatkoff/poisk-turov-test/commits/$HEAD_SHA/check-runs > checks.json
            if python3 - <<'PY'
          import json
          rows=json.load(open('checks.json'))['check_runs']
          raise SystemExit(0 if any(x['name']=='guard' and x['conclusion']=='success' for x in rows) else 1)
          PY
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Prepare strict SSH transport
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          install -d -m 700 "$RUNNER_TEMP/canary-ssh" "$RUNNER_TEMP/canary-artifact"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/canary-ssh/key"
          else
            printf '%s' "$SSH_KEY" | base64 -d > "$RUNNER_TEMP/canary-ssh/key"
          fi
          chmod 600 "$RUNNER_TEMP/canary-ssh/key"
          ssh-keygen -y -f "$RUNNER_TEMP/canary-ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/canary-ssh/known_hosts" 2>/dev/null
          test "$(ssh-keygen -lf "$RUNNER_TEMP/canary-ssh/known_hosts" -E sha256 | awk '{print $2}' | sort -u | wc -l)" = 1

      - name: Read current scope and DB baseline, verify installed runtime, reserve canary
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REMOTE_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]]
          key="$RUNNER_TEMP/canary-ssh/key"; known="$RUNNER_TEMP/canary-ssh/known_hosts"; remote="$REMOTE_USER@$HOST"
          opts=(-T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o LogLevel=ERROR)

          # Exact installed source readback before supplier use.
          ssh "${opts[@]}" "$remote" 'set -eu; t="$HOME/www/anytoour.ru/_preview/search3-anex-candidate"; for f in api-anex-search3-preview.php app/integrations/anex-program-observation-runtime.php app/integrations/anex-apd-cache-runtime.php app/integrations/anex-additional-prices-batch.php; do sha256sum "$t/$f"; done' > "$RUNNER_TEMP/runtime-hashes.txt"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          files=[
            ('v2/api-anex-search3-preview.php','api-anex-search3-preview.php'),
            ('app/integrations/anex-program-observation-runtime.php','app/integrations/anex-program-observation-runtime.php'),
            ('app/integrations/anex-apd-cache-runtime.php','app/integrations/anex-apd-cache-runtime.php'),
            ('app/integrations/anex-additional-prices-batch.php','app/integrations/anex-additional-prices-batch.php'),
          ]
          exp={remote:hashlib.sha256((Path('source')/local).read_bytes()).hexdigest() for local,remote in files}
          rows=Path(os.environ['RUNNER_TEMP']+'/runtime-hashes.txt').read_text().splitlines()
          assert len(rows)==len(exp)
          for line in rows:
              digest,path=line.split(None,1); rel=path.split('search3-anex-candidate/',1)[-1]
              assert exp[rel]==digest,(rel,digest,exp.get(rel))
          PY

          ssh "${opts[@]}" "$remote" 'cd "$HOME/www/anytoour.ru" && php' > "$RUNNER_TEMP/canary-artifact/before.json" <<'PHP'
          <?php
          declare(strict_types=1);error_reporting(0);ini_set('display_errors','0');
          require_once 'config.php';require_once 'v2/data/db-v1.php';$db=v2_data_db();
          $d=$db->prepare("SELECT id,name FROM catalog_departures WHERE is_active=1 AND (name=? OR name LIKE ?) ORDER BY (name=?) DESC,id LIMIT 3");
          $d->execute(['Москва','Москва%','Москва']);$deps=$d->fetchAll(PDO::FETCH_ASSOC);
          $c=$db->prepare("SELECT id,name FROM catalog_countries WHERE is_active=1 AND (name=? OR name LIKE ?) ORDER BY (name=?) DESC,id LIMIT 3");
          $c->execute(['Турция','Турц%','Турция']);$countries=$c->fetchAll(PDO::FETCH_ASSOC);
          if(!$deps||!$countries)exit(2);
          $one=static fn(string $sql): int => (int)$db->query($sql)->fetchColumn();
          $classes=[];foreach($db->query("SELECT flight_class,COUNT(*) n,SUM(observation_count) obs FROM anytour_anex_program_contexts GROUP BY flight_class")->fetchAll(PDO::FETCH_ASSOC) as $r)$classes[$r['flight_class']]=['rows'=>(int)$r['n'],'observations'=>(int)$r['obs']];
          $out=[
            'departure_id'=>(int)$deps[0]['id'],'departure_name'=>(string)$deps[0]['name'],
            'country_id'=>(int)$countries[0]['id'],'country_name'=>(string)$countries[0]['name'],
            'programs'=>$one('SELECT COUNT(*) FROM anytour_anex_programs'),
            'program_observations'=>$one('SELECT COALESCE(SUM(observation_count),0) FROM anytour_anex_programs'),
            'contexts'=>$one('SELECT COUNT(*) FROM anytour_anex_program_contexts'),
            'context_observations'=>$one('SELECT COALESCE(SUM(observation_count),0) FROM anytour_anex_program_contexts'),
            'apd_rates'=>$one('SELECT COUNT(*) FROM anytour_anex_apd_rates'),
            'anex_offers'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex'"),
            'anex_active'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex' AND is_active=1"),
            'anex_ready'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex' AND final_price_ready=1"),
            'flight_classes'=>(object)$classes,
          ];
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
          PHP
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/canary-artifact/before.json'
          v=json.load(open(p))
          assert type(v['departure_id']) is int and v['departure_id']>0
          assert type(v['country_id']) is int and v['country_id']>0
          print(json.dumps(v,ensure_ascii=False,sort_keys=True))
          PY

          reservation="$(python3 - <<'PY'
          import json,os
          before=json.load(open(os.environ['RUNNER_TEMP']+'/canary-artifact/before.json'))
          print(json.dumps({
            'state':'reserved','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],
            'control_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),
            'departure_id':before['departure_id'],'country_id':before['country_id'],
            'date':'2026-10-12','nights':7,'adults':2,'meal':'AI','supplier_budget_max':6,
            'booking_calls':0,'lead_calls':0,'replay_allowed':False
          },separators=(',',':')))
          PY
          )"
          printf '%s\n' "$reservation" | ssh "${opts[@]}" "$remote" "set -eu; p=\"\$HOME/.anytoour-anex/$OPERATION_ID\"; test ! -e \"\$p\"; mkdir \"\$p\"; chmod 700 \"\$p\"; cat > \"\$p/reservation.json\"; chmod 600 \"\$p/reservation.json\""

      - name: Run one bounded HTTP search-expand-APD scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,traceback
          out=os.environ['RUNNER_TEMP']+'/canary-artifact/http-summary.json'
          before=json.load(open(os.environ['RUNNER_TEMP']+'/canary-artifact/before.json'))
          base='https://anytoour.ru/_preview/search3-anex-candidate/api-anex-search3-preview.php'
          jar=os.environ['RUNNER_TEMP']+'/anex-canary-cookie.txt'
          generation=25061811
          summary={
            'status':'unknown','phase':'before_search','logical_supplier_reservations':0,
            'search_hotels':0,'group_candidates':0,'expand_calls':0,'charter_candidates':0,
            'batch_items':0,'apd_complete_offers':0,'final_price_ready_offers':0,'retryable_offers':0,
            'booking_calls':0,'lead_calls':0
          }
          def save():
              open(out,'w').write(json.dumps(summary,sort_keys=True)+'\n')
          def post(payload,phase):
              summary['phase']=phase
              summary['logical_supplier_reservations']+=1
              p=subprocess.run([
                'curl','-sS','--max-time','90','-c',jar,'-b',jar,
                '-H','Content-Type: application/json','-H','X-Requested-With: AnyTourSearch3',
                '--data-binary',json.dumps(payload,separators=(',',':')),base
              ],capture_output=True,text=True,timeout=100)
              if p.returncode:
                  raise RuntimeError('http_transport_failed')
              try:v=json.loads(p.stdout)
              except Exception:raise RuntimeError('http_json_invalid')
              if v.get('ok') is not True:
                  error=v.get('error')
                  raise RuntimeError('api_'+str(error)[:64])
              return v['data']
          try:
              params={
                'departureId':str(before['departure_id']),'countryId':str(before['country_id']),
                'dateFrom':'2026-10-12','dateTo':'2026-10-12',
                'nightsFrom':7,'nightsTo':7,'adults':2,'childs':[],
                'meal':'7','hotelCategory':'','hotelRating':'','hotelTypes':[],'hotelIds':[],
                'hotelServices':[],'arrivalId':'','regionIds':[],'subregionIds':[],'operatorIds':[],
                'priceFrom':'','priceTo':'','currency':'RUB','onlyCharter':False,'onlyDirect':False,
              }
              search=post({'action':'search','generation':generation,'params':params},'search')
              summary['search_hotels']=len(search.get('hotels') or [])
              ref=search.get('search_ref')
              if not isinstance(ref,str):raise RuntimeError('search_ref_missing')
              groups=[]; candidates=[]
              for hotel in search.get('hotels') or []:
                  lid=hotel.get('local_id')
                  for tour in hotel.get('tours') or []:
                      if not isinstance(lid,int) or not isinstance(tour.get('offer_ref'),str):continue
                      if tour.get('kind')=='group_minimum':groups.append((tour['offer_ref'],lid))
                      elif tour.get('kind')=='concrete' and tour.get('flight_type')=='charter':
                          pair=(tour['offer_ref'],lid)
                          if pair not in candidates:candidates.append(pair)
              summary['group_candidates']=len(groups)
              for offer_ref,lid in groups[:2]:
                  if candidates:break
                  if summary['logical_supplier_reservations']>=3:break
                  expanded=post({
                    'action':'expand','generation':generation,'search_ref':ref,
                    'offer_ref':offer_ref,'local_hotel_id':lid
                  },'expand')
                  summary['expand_calls']+=1
                  for hotel in expanded.get('hotels') or []:
                      hlid=hotel.get('local_id')
                      for tour in hotel.get('tours') or []:
                          if isinstance(hlid,int) and isinstance(tour.get('offer_ref'),str) and tour.get('kind')=='concrete' and tour.get('flight_type')=='charter':
                              pair=(tour['offer_ref'],hlid)
                              if pair not in candidates:candidates.append(pair)
              summary['charter_candidates']=len(candidates)
              remaining=max(0,6-summary['logical_supplier_reservations'])
              items=[{'offer_ref':r,'local_hotel_id':lid} for r,lid in candidates[:remaining]]
              summary['batch_items']=len(items)
              if items:
                  # additional_prices_batch may reserve up to one supplier read per unique item/context.
                  # Count budget conservatively as the number of submitted items.
                  summary['phase']='additional_prices_batch'
                  summary['logical_supplier_reservations']+=len(items)
                  if summary['logical_supplier_reservations']>6:raise RuntimeError('budget_exceeded')
                  p=subprocess.run([
                    'curl','-sS','--max-time','120','-c',jar,'-b',jar,
                    '-H','Content-Type: application/json','-H','X-Requested-With: AnyTourSearch3',
                    '--data-binary',json.dumps({
                      'action':'additional_prices_batch','generation':generation,'search_ref':ref,'items':items
                    },separators=(',',':')),base
                  ],capture_output=True,text=True,timeout=130)
                  if p.returncode:raise RuntimeError('apd_http_transport_failed')
                  v=json.loads(p.stdout)
                  if v.get('ok') is not True:raise RuntimeError('apd_api_'+str(v.get('error'))[:64])
                  batch=v['data']
                  offers=batch.get('offers') or []
                  summary['apd_complete_offers']=sum(x.get('status')=='additional_prices' for x in offers)
                  summary['final_price_ready_offers']=sum(x.get('finalPriceReady') is True for x in offers)
                  summary['retryable_offers']=sum(x.get('retryable') is True for x in offers)
              summary['status']='complete'
              summary['phase']='complete'
          except Exception as e:
              summary['status']='terminal_error'
              summary['reason']=str(e)[:96]
          finally:
              save()
              print(json.dumps(summary,sort_keys=True))
          PY

      - name: Read DB after-state and classify terminal result
        if: always()
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/canary-ssh/key"; known="$RUNNER_TEMP/canary-ssh/known_hosts"; remote="$REMOTE_USER@$HOST"
          opts=(-T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o LogLevel=ERROR)
          ssh "${opts[@]}" "$remote" 'cd "$HOME/www/anytoour.ru" && php' > "$RUNNER_TEMP/canary-artifact/after.json" <<'PHP'
          <?php
          declare(strict_types=1);error_reporting(0);ini_set('display_errors','0');
          require_once 'config.php';require_once 'v2/data/db-v1.php';$db=v2_data_db();$db->exec('START TRANSACTION READ ONLY');
          $one=static fn(string $sql): int => (int)$db->query($sql)->fetchColumn();
          $classes=[];foreach($db->query("SELECT flight_class,COUNT(*) n,SUM(observation_count) obs FROM anytour_anex_program_contexts GROUP BY flight_class")->fetchAll(PDO::FETCH_ASSOC) as $r)$classes[$r['flight_class']]=['rows'=>(int)$r['n'],'observations'=>(int)$r['obs']];
          $out=[
            'programs'=>$one('SELECT COUNT(*) FROM anytour_anex_programs'),
            'program_observations'=>$one('SELECT COALESCE(SUM(observation_count),0) FROM anytour_anex_programs'),
            'contexts'=>$one('SELECT COUNT(*) FROM anytour_anex_program_contexts'),
            'context_observations'=>$one('SELECT COALESCE(SUM(observation_count),0) FROM anytour_anex_program_contexts'),
            'apd_rates'=>$one('SELECT COUNT(*) FROM anytour_anex_apd_rates'),
            'apd_rate_rows'=>$one("SELECT COUNT(*) FROM anytour_anex_apd_rates WHERE apd_state='rate'"),
            'apd_empty_rows'=>$one("SELECT COUNT(*) FROM anytour_anex_apd_rates WHERE apd_state='empty'"),
            'apd_ambiguous_rows'=>$one("SELECT COUNT(*) FROM anytour_anex_apd_rates WHERE apd_state='ambiguous'"),
            'anex_offers'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex'"),
            'anex_active'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex' AND is_active=1"),
            'anex_ready'=>$one("SELECT COUNT(*) FROM anytour_offers WHERE provider='anex' AND final_price_ready=1"),
            'flight_classes'=>(object)$classes,
          ];
          $db->rollBack();echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);
          PHP

          python3 - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP']+'/canary-artifact/'
          before=json.load(open(root+'before.json'))
          http=json.load(open(root+'http-summary.json'))
          after=json.load(open(root+'after.json'))
          progressed=(after['program_observations']>before['program_observations']
                      and after['context_observations']>before['context_observations'])
          terminal={
            'operation':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],
            'http':http,'before':before,'after':after,'program_context_progressed':progressed,
            'supplier_budget_reservations':http.get('logical_supplier_reservations',0),
            'booking_calls':0,'lead_calls':0,'replay_allowed':False,
          }
          if http.get('status')=='complete' and progressed:
              terminal['status']='complete'
              terminal['outcome']='program_context_population_verified'
          else:
              terminal['status']='terminal_unknown'
              terminal['outcome']='population_not_verified'
          open(root+'result.json','w').write(json.dumps(terminal,ensure_ascii=False,sort_keys=True)+'\n')
          print(json.dumps(terminal,ensure_ascii=False,sort_keys=True))
          PY

          # Close the private operation with the sanitized terminal result, whether complete or unknown.
          cat "$RUNNER_TEMP/canary-artifact/result.json" | ssh "${opts[@]}" "$remote" "set -eu; p=\"\$HOME/.anytoour-anex/$OPERATION_ID\"; test -f \"\$p/reservation.json\"; test ! -e \"\$p/result.json\"; cat > \"\$p/result.json\"; chmod 600 \"\$p/result.json\""

      - name: Require minimum canary success without replay
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/canary-artifact/result.json'
          v=json.load(open(p))
          assert v['supplier_budget_reservations']<=6
          assert v['booking_calls']==0 and v['lead_calls']==0 and v['replay_allowed'] is False
          assert v['status']=='complete',v
          assert v['program_context_progressed'] is True
          PY

      - name: Upload sanitized terminal canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-anex-population-canary-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/canary-artifact/
          if-no-files-found: warn
          retention-days: 30
