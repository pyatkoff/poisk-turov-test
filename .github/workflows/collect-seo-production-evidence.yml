name: Collect SEO production evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: ['Materialize SEO core resort review routes']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: seo-production-evidence
  cancel-in-progress: true

jobs:
  live-production-identity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/anytoour_key"
          else
            printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/anytoour_key"
          fi
          chmod 600 "$RUNNER_TEMP/anytoour_key"
          ssh-keygen -y -f "$RUNNER_TEMP/anytoour_key" >/dev/null

      - name: Import production resort launch manifest
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/data/generated
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$USER@$HOST"
          ssh "${opts[@]}" "$remote" 'cat "$HOME/www/anytoour.ru/data/generated/seo-core-resort-review-routes-v1.json"' > v2/data/generated/seo-core-resort-review-routes-v1.json
          ssh "${opts[@]}" "$remote" 'cat "$HOME/www/anytoour.ru/data/generated/seo-core-resort-review-registry-v1.php"' > v2/data/generated/seo-core-resort-review-registry-v1.php
          php -r '
            $j=json_decode(file_get_contents($argv[1]),true);
            $routes=(array)($j["generated_routes"]??[]);
            $resorts=(int)($j["generated_resorts"]??0);
            if(!is_array($j)||($j["state"]??"")!=="core_resort_review_routes_materialized"||$resorts<1||count($routes)!==$resorts*13)exit(1);
            foreach(["publication_allowed","indexation_allowed","sitemap_allowed","route_launch_allowed"] as $flag)if(($j[$flag]??false)!==true)exit(2);
            if(($j["hotel_tours_indexation_allowed"]??true)!==false)exit(3);
            echo "SEO_DYNAMIC_PRODUCTION_MANIFEST_OK resorts=$resorts routes=".count($routes).PHP_EOL;
          ' v2/data/generated/seo-core-resort-review-routes-v1.json
          php -l v2/data/generated/seo-core-resort-review-registry-v1.php >/dev/null

      - name: Collect live identity evidence
        id: collect
        shell: bash
        run: |
          set +e
          php v2/data/report-seo-production-identity-v1.php > seo-production-identity.json 2> seo-production-identity.err
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ -s seo-production-identity.err ]; then cat seo-production-identity.err >&2; fi
          exit 0

      - name: Verify dynamic scope was collected
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $m=json_decode(file_get_contents("v2/data/generated/seo-core-resort-review-routes-v1.json"),true);
            $e=json_decode(file_get_contents("seo-production-identity.json"),true);
            $dynamic=count((array)($m["generated_routes"]??[]));
            $expected=104+$dynamic+1;
            if(!is_array($e)||($e["page_count"]??0)!==$expected)exit(1);
            if(($e["type_counts"]["hotel_tours"]??0)!==1)exit(2);
            echo "SEO_DYNAMIC_PRODUCTION_IDENTITY_SCOPE_OK pages=$expected dynamic=$dynamic".PHP_EOL;
          '

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-production-identity-${{ github.run_id }}
          path: |
            seo-production-identity.json
            seo-production-identity.err
            v2/data/generated/seo-core-resort-review-routes-v1.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail on production identity drift
        if: always()
        shell: bash
        run: |
          test "${{ steps.collect.outputs.exit_code }}" = "0"
