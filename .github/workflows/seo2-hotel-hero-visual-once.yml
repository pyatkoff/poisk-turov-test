name: SEO2 hotel hero visual once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo2-hotel-hero-visual-once.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Prepare brand asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/images
          curl -fsSL --max-time 30 https://anytoour.ru/images/logo.svg -o v2/images/logo.svg
      - name: Start local runtime
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t v2 >/tmp/seo2-hotel-hero.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8099/country/maldives/hotel/the-westin-maldives-miriandhoo-resort-65108/ >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/seo2-hotel-hero.log >&2
          exit 1
      - name: Capture Westin and Kemer control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p seo2-hotel-hero-audit
          cat >/tmp/seo2-hotel-hero.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const refs = [
            ['westin','http://127.0.0.1:8099/country/maldives/hotel/the-westin-maldives-miriandhoo-resort-65108/'],
            ['kemer','http://127.0.0.1:8099/country/turkey/kemer/'],
          ];
          const vps = [['mobile-375',375,812],['desktop-1440',1440,1000]];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const report=[]; let failed=false;
            for(const [key,url] of refs) for(const [vp,width,height] of vps){
              const context=await browser.newContext({viewport:{width,height}});
              const page=await context.newPage();
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              const state=await page.evaluate(()=>({
                h1:document.querySelectorAll('h1').length,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                hotelHero:!!document.querySelector('.sp-hero--hotel-tour'),
                heroCta:!!document.querySelector('.sp-hero-actions .sp-primary'),
                robots:document.querySelector('meta[name="robots"]')?.content||'',
              }));
              await page.screenshot({path:`seo2-hotel-hero-audit/${key}-${vp}.png`,fullPage:true});
              report.push({key,vp,http:response?.status()||0,...state});
              if((response?.status()||0)!==200||state.h1!==1||state.overflow||!state.heroCta||(key==='westin'&&(!state.hotelHero||!state.robots.includes('noindex')))||(key==='kemer'&&state.hotelHero)) failed=true;
              await context.close();
            }
            fs.writeFileSync('seo2-hotel-hero-audit/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failed) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/seo2-hotel-hero.cjs
      - name: Upload disposable visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo2-hotel-hero-${{ github.event.pull_request.number }}
          path: seo2-hotel-hero-audit/
          retention-days: 3
