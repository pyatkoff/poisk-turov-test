name: Andromeda saved package runtime offline
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-saved-package-runtime.php'
      - 'app/integrations/andromeda-package-public.php'
      - 'app/integrations/andromeda-claiminc-contract.php'
      - 'app/integrations/andromeda-network-transport-failure.php'
      - 'app/integrations/andromeda-package-retry-policy.php'
      - 'app/integrations/andromeda-package-attempt-state.php'
      - 'app/integrations/andromeda-transport.php'
      - 'v2/api-andromeda-search3-preview.php'
      - 'tests/andromeda-saved-package-runtime-smoke.php'
      - 'tests/andromeda-saved-package-attempt-runtime-smoke.php'
      - 'tests/andromeda-retained-mapping-smoke.php'
      - 'tests/andromeda-package-public-smoke.php'
      - 'tests/andromeda-package-public-value-guards.php'
      - 'scripts/diagnostics/andromeda_package_evidence.php'
      - 'tests/andromeda-package-evidence-smoke.php'
      - 'scripts/diagnostics/andromeda-package-probe.php'
      - 'tests/andromeda-retained-cli-smoke.php'
      - 'scripts/diagnostics/andromeda_package_checkpoint_read.py'
      - 'tests/andromeda_package_checkpoint_read_test.py'
      - '.github/workflows/andromeda-saved-package-runtime-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: change
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7c3c5bb55c88e376d97c998d0ba77a46960584d6
          path: package
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1f628e4b172ce9706eabe875784ce2b226175a0d
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 163ef9eed9993c08558b84b7a0295e8b4295d2e8
          path: retained-base
          persist-credentials: false
      - name: Preserve exact retained/install regression, then exercise candidate runtime
        run: |
          cp package/app/integrations/andromeda-client.php package/app/integrations/andromeda-package-capture.php package/app/integrations/andromeda-selected-offer.php runtime/app/integrations/
          # The old installed six-file contract keeps its exact historical transport.
          cp transport/app/integrations/andromeda-transport.php runtime/app/integrations/

          # First exercise the exact retained/install contract. Do not silently repin it.
          cp retained-base/v2/api-andromeda-search3-preview.php runtime/v2/
          cp retained-base/app/integrations/andromeda-saved-package-runtime.php runtime/app/integrations/
          php -l change/tests/andromeda-retained-cli-smoke.php
          php -d allow_url_fopen=0 change/tests/andromeda-retained-cli-smoke.php runtime --installed-runtime

          # Only after the installed baseline is proven, assemble the current candidate.
          cp change/v2/api-andromeda-search3-preview.php runtime/v2/
          cp change/app/integrations/andromeda-saved-package-runtime.php runtime/app/integrations/
          cp change/app/integrations/andromeda-transport.php runtime/app/integrations/
          cp change/app/integrations/andromeda-claiminc-contract.php change/app/integrations/andromeda-network-transport-failure.php change/app/integrations/andromeda-package-retry-policy.php change/app/integrations/andromeda-package-attempt-state.php runtime/app/integrations/
          php -l runtime/v2/api-andromeda-search3-preview.php
          php -l runtime/app/integrations/andromeda-saved-package-runtime.php
          php -l runtime/app/integrations/andromeda-transport.php
          php -l runtime/app/integrations/andromeda-claiminc-contract.php
          php -l runtime/app/integrations/andromeda-network-transport-failure.php
          php -l runtime/app/integrations/andromeda-package-retry-policy.php
          php -l runtime/app/integrations/andromeda-package-attempt-state.php
          php change/tests/andromeda-saved-package-runtime-smoke.php runtime "$RUNNER_TEMP/saved-package-fixture"
          php change/tests/andromeda-saved-package-attempt-runtime-smoke.php runtime "$RUNNER_TEMP/saved-package-attempt-fixture"
          php change/tests/andromeda-retained-mapping-smoke.php runtime
          php -d allow_url_fopen=0 change/tests/andromeda-package-evidence-smoke.php
          php -l change/scripts/diagnostics/andromeda-package-probe.php
          php -l change/app/integrations/andromeda-package-public.php
          php -l change/tests/andromeda-package-public-smoke.php
          php -d allow_url_fopen=0 change/tests/andromeda-package-public-smoke.php runtime
          php -l change/tests/andromeda-package-public-value-guards.php
          php -d allow_url_fopen=0 change/tests/andromeda-package-public-value-guards.php
          python3 -B change/tests/andromeda_package_checkpoint_read_test.py
      - name: Record exact source handoff without private runtime state
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('runtime')
          out = pathlib.Path('source-handoff')
          paths = ['v2/api-andromeda-search3-preview.php'] + [
              'app/integrations/' + name + '.php' for name in [
                  'andromeda-client', 'andromeda-package-capture', 'andromeda-selected-offer',
                  'andromeda-transport', 'andromeda-saved-package-runtime',
                  'andromeda-claiminc-contract', 'andromeda-network-transport-failure',
                  'andromeda-package-retry-policy', 'andromeda-package-attempt-state']]
          files = {}
          for path in paths:
              data = (root / path).read_bytes()
              target = out / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              files[path] = hashlib.sha256(data).hexdigest()
              assert target.read_bytes() == data
          receipt = {'source': os.environ['SOURCE_SHA'], 'files_sha256': files,
              'dependencies': {'runtime': '95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa',
                  'package': '7c3c5bb55c88e376d97c998d0ba77a46960584d6',
                  'candidate_transport': os.environ['SOURCE_SHA'],
                  'retained_install_transport': '1f628e4b172ce9706eabe875784ce2b226175a0d',
                  'retained_install_baseline': '163ef9eed9993c08558b84b7a0295e8b4295d2e8'},
              'scope': 'private-source-handoff-only', 'supplier_calls': 0,
              'published': False, 'package_captured_live': False, 'quote_verified': False,
              'typed_transport_in_candidate': True, 'live_retry_enabled': False}
          manifest = out / 'receipt.json'
          manifest.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          assert json.loads(manifest.read_text()) == receipt
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-selected-package-source
          path: source-handoff/
          if-no-files-found: error
          retention-days: 30
