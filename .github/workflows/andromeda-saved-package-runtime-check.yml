name: Andromeda saved package runtime offline
on:
  pull_request:
    paths:
      - 'app/integrations/andromeda-saved-package-runtime.php'
      - 'app/integrations/andromeda-client.php'
      - 'app/integrations/andromeda-claim-actions.php'
      - 'app/integrations/andromeda-search-surcharge.php'
      - 'app/integrations/andromeda-price-observation.php'
      - 'app/integrations/andromeda-selected-quote.php'
      - 'app/integrations/andromeda-quote-attempt-state.php'
      - 'v2/api-andromeda-quote-preview.php'
      - 'scripts/diagnostics/andromeda_runtime_source_publish.py'
      - 'tests/andromeda_runtime_source_publish_test.py'
      - 'tests/andromeda-selected-quote-smoke.php'
      - 'tests/andromeda-quote-attempt-state-test.php'
      - 'tests/andromeda-price-observation-smoke.php'
      - 'tests/andromeda-saved-surcharge-runtime-smoke.php'
      - 'app/integrations/andromeda-package-public.php'
      - 'app/integrations/andromeda-claiminc-contract.php'
      - 'app/integrations/andromeda-network-transport-failure.php'
      - 'app/integrations/andromeda-package-retry-policy.php'
      - 'app/integrations/andromeda-package-attempt-state.php'
      - 'app/integrations/andromeda-transport.php'
      - 'v2/api-andromeda-search3-preview.php'
      - 'tests/andromeda-saved-package-runtime-smoke.php'
      - 'tests/andromeda-saved-package-attempt-runtime-smoke.php'
      - 'tests/andromeda-retained-mapping-smoke.php'
      - 'tests/andromeda-package-public-smoke.php'
      - 'tests/andromeda-package-public-value-guards.php'
      - 'scripts/diagnostics/andromeda_package_evidence.php'
      - 'tests/andromeda-package-evidence-smoke.php'
      - 'scripts/diagnostics/andromeda-package-probe.php'
      - 'scripts/diagnostics/andromeda_search_surcharge_e2e.php'
      - 'tests/andromeda_search_surcharge_e2e_smoke.php'
      - 'tests/andromeda-retained-cli-smoke.php'
      - 'tests/andromeda-current-surcharge-cli-smoke.php'
      - 'scripts/diagnostics/andromeda_package_checkpoint_read.py'
      - 'tests/andromeda_package_checkpoint_read_test.py'
      - '.github/workflows/andromeda-saved-package-runtime-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONPATH: change/scripts/diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: change
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7c3c5bb55c88e376d97c998d0ba77a46960584d6
          path: package
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1f628e4b172ce9706eabe875784ce2b226175a0d
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 163ef9eed9993c08558b84b7a0295e8b4295d2e8
          path: retained-base
          persist-credentials: false
      - name: Load the published source pin without expiring artifact dependencies
        uses: actions/checkout@v4
        with:
          ref: b32993261eb8657004e7d4fd146b65a95264d4bc
          path: published-surcharge
          persist-credentials: false
      - name: Exercise current surcharge CLI without supplier access
        run: |
          cp package/app/integrations/andromeda-package-capture.php package/app/integrations/andromeda-selected-offer.php published-surcharge/app/integrations/
          php -d allow_url_fopen=0 change/tests/andromeda-current-surcharge-cli-smoke.php published-surcharge
      - name: Preserve exact retained/install regression, then exercise candidate runtime
        run: |
          cp package/app/integrations/andromeda-client.php package/app/integrations/andromeda-package-capture.php package/app/integrations/andromeda-selected-offer.php runtime/app/integrations/
          # The old installed six-file contract keeps its exact historical transport.
          cp transport/app/integrations/andromeda-transport.php runtime/app/integrations/

          # First exercise the exact retained/install contract. Do not silently repin it.
          cp retained-base/v2/api-andromeda-search3-preview.php runtime/v2/
          cp retained-base/app/integrations/andromeda-saved-package-runtime.php runtime/app/integrations/
          php -l change/tests/andromeda-retained-cli-smoke.php
          php -d allow_url_fopen=0 change/tests/andromeda-retained-cli-smoke.php runtime --installed-runtime

          # The publisher inventory is also the candidate overlay; legacy tests above stay pinned.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          from andromeda_runtime_source_publish import assemble_runtime, SOURCE_PATHS
          assemble_runtime(Path('change'), Path('package'), Path('runtime'))
          for path in SOURCE_PATHS:
              subprocess.run(['php', '-l', str(Path('runtime') / path)], check=True)
          PY
          # Load both real entrypoints without invoking their HTTP/supplier handlers.
          php -d allow_url_fopen=0 -r 'require "runtime/v2/api-andromeda-quote-preview.php"; if (!function_exists("anytour_andromeda_quote_run") || !method_exists("AnyTourAndromedaPriceObservation", "resolveServed") || !class_exists("AnyTourAndromedaQuoteAttemptState")) exit(1);'
          cp change/tests/andromeda-selected-quote-smoke.php change/tests/andromeda-price-observation-smoke.php change/tests/andromeda-quote-attempt-state-test.php runtime/tests/
          php -d allow_url_fopen=0 runtime/tests/andromeda-selected-quote-smoke.php
          php -d allow_url_fopen=0 runtime/tests/andromeda-quote-attempt-state-test.php
          php change/tests/andromeda-saved-package-runtime-smoke.php runtime "$RUNNER_TEMP/saved-package-fixture"
          php change/tests/andromeda-saved-package-attempt-runtime-smoke.php runtime "$RUNNER_TEMP/saved-package-attempt-fixture"
          php -d allow_url_fopen=0 change/tests/andromeda-saved-surcharge-runtime-smoke.php runtime "$RUNNER_TEMP/saved-surcharge-fixture"
          php -d allow_url_fopen=0 runtime/tests/andromeda-price-observation-smoke.php runtime
          php -l change/scripts/diagnostics/andromeda_search_surcharge_e2e.php
          php -d allow_url_fopen=0 change/tests/andromeda_search_surcharge_e2e_smoke.php
          php change/tests/andromeda-retained-mapping-smoke.php runtime
          php -d allow_url_fopen=0 change/tests/andromeda-package-evidence-smoke.php
          php -l change/scripts/diagnostics/andromeda-package-probe.php
          php -l change/app/integrations/andromeda-package-public.php
          php -l change/tests/andromeda-package-public-smoke.php
          php -d allow_url_fopen=0 change/tests/andromeda-package-public-smoke.php runtime
          php -l change/tests/andromeda-package-public-value-guards.php
          php -d allow_url_fopen=0 change/tests/andromeda-package-public-value-guards.php
          python3 -B change/tests/andromeda_package_checkpoint_read_test.py
      - name: Record exact source handoff without private runtime state
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from andromeda_runtime_source_publish import export_handoff
          receipt = export_handoff(Path('change'), Path('package'), Path('runtime'),
                                   Path('source-handoff'), os.environ['SOURCE_SHA'])
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-selected-package-source
          path: source-handoff/
          if-no-files-found: error
          retention-days: 30
