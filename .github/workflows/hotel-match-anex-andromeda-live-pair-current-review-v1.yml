name: MATCH ANEX Andromeda live-pair current review v1
run-name: MATCH live-pair current review #1971 v1
on:
  push:
    branches: ['ops/match-anex-andromeda-live-pair-current-review-1971-20260911-v1']
    paths: ['.github/match-anex-andromeda-live-pair-current-review-1971-v1.arm']
permissions:
  contents: read
  actions: read
concurrency:
  group: match-anex-andromeda-live-pair-current-review-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-andromeda-live-pair-current-review-1971-20260911-v1
  EXPECTED_BASE_SHA: a18e2e8b4981832a260f2b6345b721ecb6191f48
  ARTIFACT_DIR: /tmp/match-anex-andromeda-live-pair-current-review-v1
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Verify isolated source and static guards
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/match-anex-andromeda-live-pair-current-review-1971-20260911-v1'
          test "$(cat .github/match-anex-andromeda-live-pair-current-review-1971-v1.arm)" = "$OPERATION_ID"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort > "$RUNNER_TEMP/actual-paths"
          printf '%s\n' \
            '.github/match-anex-andromeda-live-pair-current-review-1971-v1.arm' \
            '.github/workflows/hotel-match-anex-andromeda-live-pair-current-review-v1.yml' \
            'scripts/diagnostics/hotel_match_anex_andromeda_live_pair_current_review_v1.json' \
            'scripts/diagnostics/hotel_match_anex_andromeda_live_pair_current_review_v1.php' \
            'tests/hotel-match-anex-andromeda-live-pair-current-review-v1-test.php' | sort > "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          php -l scripts/diagnostics/hotel_match_anex_andromeda_live_pair_current_review_v1.php
          php tests/hotel-match-anex-andromeda-live-pair-current-review-v1-test.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]+' scripts/diagnostics/hotel_match_anex_andromeda_live_pair_current_review_v1.php
          mkdir -p "$ARTIFACT_DIR/package"
          cp scripts/diagnostics/hotel_full_catalog_reconcile.php "$ARTIFACT_DIR/package/"
          cp scripts/diagnostics/hotel_match_current_bulk_review.php "$ARTIFACT_DIR/package/"
          cp scripts/diagnostics/hotel_match_pending_candidate_bridge_review.php "$ARTIFACT_DIR/package/"
          cp scripts/diagnostics/hotel_match_live_priority_review.php "$ARTIFACT_DIR/package/"
          cp scripts/diagnostics/hotel_match_anex_andromeda_live_pair_current_review_v1.php "$ARTIFACT_DIR/package/"
          cp scripts/diagnostics/hotel_match_anex_andromeda_live_pair_current_review_v1.json "$ARTIFACT_DIR/package/"
      - name: Establish zero-DB SSH control master
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE" && test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          key="$RUNNER_TEMP/match-live-pair-key"; sock="$RUNNER_TEMP/match-live-pair.sock"; known="$RUNNER_TEMP/match-live-pair-known"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          export KEY_FILE="$key" SOCK_FILE="$sock" KNOWN_FILE="$known"
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -f "$sock"
            if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$USER_VALUE@$HOST_VALUE"; then
              if ssh -S "$sock" -o ControlMaster=no -o BatchMode=yes "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -s config.php && { test -s data/db-v1.php || test -s v2/data/db-v1.php; } && printf MATCH_LIVE_PAIR_PREFLIGHT_OK' | grep -qx MATCH_LIVE_PAIR_PREFLIGHT_OK; then ok=1; break; fi
            fi
            ssh -S "$sock" -O exit "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          test "$ok" = 1
          printf '%s\n' "$key" > "$RUNNER_TEMP/key-path"
          printf '%s\n' "$sock" > "$RUNNER_TEMP/sock-path"
          printf '%s\n' "$known" > "$RUNNER_TEMP/known-path"
      - name: Reserve immutable review before CURRENT DB read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ARTIFACT_DIR']); manifest=root/'package'/'hotel_match_anex_andromeda_live_pair_current_review_v1.json'; source=root/'package'/'hotel_match_anex_andromeda_live_pair_current_review_v1.php'
          value={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_read','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'review_source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'manifest_rows':75,'country_id':1,'mode':'server_current_read_only_live_pair_review','database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (root/'reservation.json').write_text(json.dumps(value,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve reservation before DB read
        uses: actions/upload-artifact@v4
        with:
          name: match-anex-andromeda-live-pair-current-review-v1-reservation
          path: ${{ env.ARTIFACT_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute server-current read-only review
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          sock="$(cat "$RUNNER_TEMP/sock-path")"; remote="/tmp/anytour-live-pair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup(){ ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote'" >/dev/null 2>&1 || true; ssh -S "$sock" -O exit "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          tar -C "$ARTIFACT_DIR/package" -czf - . | ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "mkdir -m 700 '$remote' && tar -xzf - -C '$remote'"
          set +e
          ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "cd \"\$HOME/www/anytoour.ru\" && php -d display_errors=0 -d log_errors=0 -r 'define(\"FC_LIBRARY_ONLY\",true); \$root=realpath(getcwd()); require \$root.\"/config.php\"; \$dbHelper=is_file(\$root.\"/data/db-v1.php\")?\$root.\"/data/db-v1.php\":\$root.\"/v2/data/db-v1.php\"; require \$dbHelper; require \"$remote/hotel_match_anex_andromeda_live_pair_current_review_v1.php\"; \$db=v2_data_db(); echo \"AALP_JSON:\".fc_json(aalp_review(\$db,\"$remote/hotel_match_anex_andromeda_live_pair_current_review_v1.json\",AALP_OPERATION)).PHP_EOL;'" > "$ARTIFACT_DIR/live.stdout" 2> "$ARTIFACT_DIR/live.stderr"
          rc=$?
          set -e
          export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ARTIFACT_DIR']); out=(root/'live.stdout').read_text(errors='replace'); err=(root/'live.stderr').read_text(errors='replace'); marker='AALP_JSON:'; line=next((x[len(marker):] for x in reversed(out.splitlines()) if x.startswith(marker)),None)
          if line is None:
              result={'operation_id':os.environ['OPERATION_ID'],'status':'unknown','reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stdout_sha256':hashlib.sha256(out.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          else:
              result=json.loads(line)
          (root/'result.json').write_text(json.dumps(result,sort_keys=True,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps({'status':result.get('status'),'operation_id':result.get('operation_id'),'safe_prepared_count':result.get('safe_prepared_count'),'stats':result.get('stats'),'coverage':result.get('coverage')},sort_keys=True,ensure_ascii=False))
          if line is None or result.get('status')!='completed': raise SystemExit(2)
          PY
      - name: Preserve final receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: match-anex-andromeda-live-pair-current-review-v1-final
          path: |
            ${{ env.ARTIFACT_DIR }}/reservation.json
            ${{ env.ARTIFACT_DIR }}/result.json
            ${{ env.ARTIFACT_DIR }}/live.stderr
          if-no-files-found: error
          retention-days: 90
