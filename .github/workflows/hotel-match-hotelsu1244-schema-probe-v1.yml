name: MATCH HOTEL SU 1244 schema probe v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_hotelsu1244_schema_probe_v1.php
      - .github/workflows/hotel-match-hotelsu1244-schema-probe-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency:
  group: hotel-match-hotelsu1244-schema-probe-1971-20260920-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-hotelsu1244-schema-probe-1971-20260920-v1
  BASE_SHA: d2bbc550031d9c91c0e0f58af86822e1dcc83e0e
  SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
  CLAIM: '5752010805'
jobs:
  probe:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/match-hotelsu1244-schema-probe-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and claim
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077
          mkdir -p payload/source/scripts/diagnostics result
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          php -l scripts/diagnostics/hotel_match_hotelsu1244_schema_probe_v1.php
          php scripts/diagnostics/hotel_match_hotelsu1244_schema_probe_v1.php --self-test
          python3 - <<'PY'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          expected={'scripts/diagnostics/hotel_match_hotelsu1244_schema_probe_v1.php','.github/workflows/hotel-match-hotelsu1244-schema-probe-v1.yml'}
          assert actual==expected,(actual,expected)
          PY
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > result/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('result/claim.json')); b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
          for s in (os.environ['OPERATION_ID'],os.environ['BASE_SHA'],'5752009901','Provider HTTP0','DB writes0','mapping writes0','quota mutations0','terminal/no-replay'):
              assert s in b,s
          PY
          cp scripts/diagnostics/hotel_match_hotelsu1244_schema_probe_v1.php payload/source/scripts/diagnostics/
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed':
                      assert r['conclusion']=='success',r
                      print('SECURITY_OK',r['id'])
                      break
              time.sleep(5)
          else:
              raise SystemExit('security_not_available')
          PY
      - name: Seal reservation before database access
        shell: bash
        run: |
          set -euo pipefail; umask 077
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('payload')
          digests={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in p.rglob('*') if x.is_file()}
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'base_sha':os.environ['BASE_SHA'],'claim_id':int(os.environ['CLAIM']),'state':'reserved_before_db_read','supplier_calls':0,'provider_calls':0,'tourvisor_calls':0,'database_writes':0,'mapping_writes':0,'quota_mutations':0,'safe_to_write_now':False,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True)+'\n').encode()
          f=(p/'reservation.json').open('xb');f.write(raw);f.flush();os.fsync(f.fileno());f.close()
          pathlib.Path('result/reservation.json').write_bytes(raw)
          digests['reservation.json']=hashlib.sha256(raw).hexdigest()
          (p/'SHA256SUMS').write_text(''.join(v+'  '+k+'\n' for k,v in sorted(digests.items())))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-hotelsu1244-schema-probe-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Probe CURRENT schema read-only
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail; umask 077
          test -n "$KEY_VALUE"; test -n "$HOST_VALUE"; test -n "$USER_VALUE"
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key"; else printf '%s' "$KEY_VALUE"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null; test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE"; op=".anytoour-match/operations/$OPERATION_ID"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" -r payload/source payload/reservation.json payload/SHA256SUMS "$remote:$op/"
          set +e
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";sha256sum -c SHA256SUMS >/dev/null;cd \"\$HOME/www/anytoour.ru\";MATCH_OPERATION_ID='$OPERATION_ID' MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$SOURCE_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M \"\$HOME/$op/source/scripts/diagnostics/hotel_match_hotelsu1244_schema_probe_v1.php\"" > result/remote.stdout 2> result/remote.stderr
          rc=$?
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";tar -czf - -- reservation.json execution-reservation.json result.json receipt.json" > result/server-operation.tgz 2>>result/remote.stderr
          trc=$?; set -e; printf '{"remote":%s,"tar":%s}\n' "$rc" "$trc">result/exit-codes.json; test "$trc" -eq 0
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path('result'); s=p/'server'; s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              names=sorted(t.getnames()); assert names==['execution-reservation.json','receipt.json','reservation.json','result.json'],names
              for m in t.getmembers():
                  assert m.isfile() and m.size<=2000000
                  s.joinpath(m.name).write_bytes(t.extractfile(m).read())
          assert p.joinpath('reservation.json').read_bytes()==s.joinpath('reservation.json').read_bytes()
          raw=s.joinpath('result.json').read_bytes(); r=json.loads(raw); q=json.loads(s.joinpath('receipt.json').read_bytes()); h=hashlib.sha256(raw).hexdigest()
          assert r['state']=='completed_read_only' and q['state']=='completed_read_only' and q['result_sha256']==h and q['readback_verified'] is True
          assert r['operation_id']==q['operation_id']==os.environ['OPERATION_ID'] and r['source_sha']==q['source_sha']==os.environ['SOURCE_SHA']
          for k in ('supplier_calls','provider_calls','tourvisor_calls','samo_calls','andromeda_calls','direct_anex_calls','database_writes','mapping_writes','quota_mutations'):
              assert r[k]==0,(k,r[k])
          assert r['safe_to_write_now'] is False and r['no_replay'] is True
          summary={k:r.get(k) for k in ('root_cause','id_column_present','table_engines','transaction_probes','select_probes')}
          summary['result_sha256']=h
          p.joinpath('verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-hotelsu1244-schema-probe-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
