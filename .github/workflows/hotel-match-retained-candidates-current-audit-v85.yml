name: MATCH retained candidates CURRENT audit v85
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hotel-match-retained-candidates-current-audit-v85.yml
      - scripts/diagnostics/hotel_match_retained_candidates_current_audit_v85.php
      - reports/hotel-match-retained-candidate-packet-20260927.json
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: hotel-match-retained-candidates-current-audit-v85
  cancel-in-progress: false
env:
  OP: hotel-match-retained-candidates-current-audit-1971-20260927-v85
  CLAIM: '5860050921'
jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.number == 4017 && github.event.pull_request.head.ref == 'match/samo31-reconcile-v72-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source, packet, owner claim and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail; umask 077; mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_retained_candidates_current_audit_v85.php)" = 33479887aab40a1882a0af44d0a1f8f7b4213dbd
          test "$(git rev-parse HEAD:reports/hotel-match-retained-candidate-packet-20260927.json)" = 757711a6fb7012a18743da1bc2bb4a7a67cb6232
          php -l scripts/diagnostics/hotel_match_retained_candidates_current_audit_v85.php
          python3 - <<'PY'
          import json,os,time,urllib.request
          def get(p):
              q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:return json.load(f)
          c=get('/issues/comments/'+os.environ['CLAIM']); b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in ['CURRENT audit','provider HTTP 0','DB/mapping writes 0','No replay']: assert x.lower() in b.lower(),x
          pr=get('/pulls/4017'); assert pr['state']=='open' and pr['draft'] is True and pr['head']['sha']==os.environ['HEAD']
          for _ in range(100):
              xs=[x for x in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if x['name']=='Security guard']
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success'; break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
      - name: Execute one supplier-free CURRENT audit
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key">/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"; rel=".anytoour-match/operations/$OP"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu; umask 077; test ! -e \"\$HOME/$rel\"; mkdir -p \"\$HOME/$rel/payload\""
          git archive HEAD scripts/diagnostics app/integrations reports/hotel-match-retained-candidate-packet-20260927.json | ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' MATCH_PAYLOAD_ROOT=\"\$HOME/$rel/payload\" php -d memory_limit=768M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_retained_candidates_current_audit_v85.php\" --execute" >terminal/stdout.txt
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          r=json.load(open('terminal/result.json')); q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert r['operation']==q['operation']==os.environ['OP']
          assert r['state']=='completed_read_only_current_candidates'
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          print(json.dumps({k:r[k] for k in ['safe_samo_count','safe_direct_anex_count','already_count','safe_total_count','coverage_current']},ensure_ascii=False))
          print(json.dumps({'samo_live30_current':{k:r['samo_live30_current'][k] for k in ['live30_sources','accepted_primary_sources','unresolved_primary_sources']}},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-retained-candidates-current-v85-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
