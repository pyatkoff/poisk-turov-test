name: TEMP Search3 shared runtime sync

on:
  push:
    branches:
      - fix/search3-meal-plus-identity-20260914

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search3-meal-plus-identity-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Regenerate exact shared runtime
        run: node scripts/build/search3-js/shared-runtime.cjs --write
      - name: Commit exact generated runtime if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- v2/search3-shared-runtime.json; then
            echo 'Shared runtime already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/search3-shared-runtime.json
          git commit -m 'build(search3): sync plus meal shared runtime'
          git push origin HEAD:fix/search3-meal-plus-identity-20260914
