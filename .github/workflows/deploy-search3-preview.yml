name: Deploy Search 3 preview

on:
  push:
    branches: [feature/search3-preview]
    paths:
      - 'v2/**'
      - 'search3-visual-qa.cjs'
      - 'search3-visual-desktop.cjs'
      - 'search3-visual-mobile.cjs'
      - 'search3-visual-tablet.cjs'
      - '.github/workflows/deploy-search3-preview.yml'
  workflow_dispatch:

concurrency:
  group: deploy-search3-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          path="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$path"; else printf '%s' "$KEY" | base64 --decode > "$path"; fi
          chmod 600 "$path"

      - name: Deploy isolated Search 3 preview
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ASSET_VERSION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"
          remote_home="$(ssh "${opts[@]}" "$remote" 'printf %s "$HOME"')"
          root="$remote_home/www/anytoour.ru/_preview/search3"
          tar -C v2 -czf - . | ssh "${opts[@]}" "$remote" "rm -rf '$root' && mkdir -p '$root/poisk-turov' && tar -xzf - -C '$root'"
          ssh "${opts[@]}" "$remote" "ASSET_VERSION='$ASSET_VERSION' bash -s" <<'REMOTE'
          set -e
          root="$HOME/www/anytoour.ru/_preview/search3"
          prod="$HOME/www/anytoour.ru"
          cp "$prod/config.php" "$root/config.php"
          chmod 600 "$root/config.php"
          cp "$root/index.php" "$root/search-page-v3.php"
          python3 - "$root/search-page-v3.php" <<'PY'
          from pathlib import Path
          import os
          import re
          import sys
          path=Path(sys.argv[1]); text=path.read_text()
          text=text.replace('</head>','<link rel="stylesheet" href="/_preview/search3/search3-preview.css?v=6"><link rel="stylesheet" href="/_preview/search3/search3-results-preview.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-results-width-fix.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-filter-rail-preview.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-mobile-filters.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-results-top.css?v=5"><link rel="stylesheet" href="/_preview/search3/search3-selected-tour.css?v=5"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration1.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration1b.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration1c.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration2.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration2b.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration2c.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-convergence.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-form-contract.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-full-cycle-contract.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-booking-summary.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-booking-stepper.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-flight-contract.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-final-total.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-final-sections.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-lead-review.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-tour-detail-rail.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-tour-details-convergence.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-final-review-convergence.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-lead-state-convergence.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-shell-convergence.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-screenshot-qa.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-results-convergence-v2.css?v=1"><link rel="stylesheet" href="/_preview/search3/search3-footer-preview.css?v=1"></head>',1)
          text=text.replace('</body>','<script src="/_preview/search3/search3-preview.js?v=6"></script><script src="/_preview/search3/search3-results-preview.js?v=6"></script><script src="/_preview/search3/search3-filter-rail-preview.js?v=4"></script><script src="/_preview/search3/search3-mobile-filters.js?v=4"></script><script src="/_preview/search3/search3-mobile-search-entry.js?v=1"></script><script src="/_preview/search3/search3-results-top.js?v=7"></script><script src="/_preview/search3/search3-selected-tour-mobile.js?v=3"></script><script src="/_preview/search3/search3-maket7-lock.js?v=4"></script><script src="/_preview/search3/search3-lead-flow.js?v=1"></script><script src="/_preview/search3/search3-booking-summary.js?v=2"></script><script src="/_preview/search3/search3-booking-stepper.js?v=4"></script><script src="/_preview/search3/search3-final-sections.js?v=1"></script><script src="/_preview/search3/search3-flight-continue.js?v=2"></script><script src="/_preview/search3/search3-review-heading.js?v=1"></script><script src="/_preview/search3/search3-summary-cta.js?v=2"></script><script src="/_preview/search3/search3-lead-note.js?v=3"></script><script src="/_preview/search3/search3-tour-detail-rail.js?v=1"></script><script src="/_preview/search3/search3-preview-state-simulator.js?v=1"></script><script src="/_preview/search3/search3-footer-preview.js?v=1"></script></body>',1)
          version=os.environ.get('ASSET_VERSION','dev')[:12]
          text=re.sub(r'(\?v=)[0-9]+', lambda m: m.group(1)+version, text)
          path.write_text(text)
          PY
          cat > "$root/poisk-turov/index.php" <<'PHP'
          <?php
          header('X-Robots-Tag: noindex, nofollow', true);
          if (!defined('V2_FORCE_SEARCH_PAGE')) define('V2_FORCE_SEARCH_PAGE', true);
          if (!defined('V2_CANONICAL_PATH')) define('V2_CANONICAL_PATH', '/_preview/search3/poisk-turov/');
          if (!defined('V2_PUBLIC_BASE_PATH')) define('V2_PUBLIC_BASE_PATH', '/_preview/search3');
          require dirname(__DIR__) . '/search-page-v3.php';
          PHP
          cat > "$root/lead-adapter-v2.php" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('X-Robots-Tag: noindex, nofollow', true);
          http_response_code(403);
          echo json_encode(['ok'=>false,'preview'=>true,'message'=>'Lead submission is disabled on Search 3 preview'], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          REMOTE

  visual-qa:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        mode: [desktop, tablet, mobile]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture Search3 ${{ matrix.mode }} states
        env:
          SEARCH3_PREVIEW_URL: https://anytoour.ru/_preview/search3/poisk-turov/
          SEARCH3_QA_OUT: search3-visual-${{ matrix.mode }}-artifacts
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 5m node "search3-visual-${{ matrix.mode }}.cjs"
      - name: Upload Search3 ${{ matrix.mode }} screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-visual-${{ matrix.mode }}-${{ github.run_number }}-${{ github.sha }}
          path: search3-visual-${{ matrix.mode }}-artifacts/
          retention-days: 30
