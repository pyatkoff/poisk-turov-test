name: Deploy Search 3 preview

on:
  push:
    branches: [feature/search3-preview]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-search3-preview.yml'
  workflow_dispatch:

concurrency:
  group: deploy-search3-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          path="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY" | tr -d '\r' > "$path"
          else
            printf '%s' "$KEY" | base64 --decode > "$path"
          fi
          chmod 600 "$path"

      - name: Deploy isolated Search 3 preview
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -e
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"
          remote_home="$(ssh "${opts[@]}" "$remote" 'printf %s "$HOME"')"
          root="$remote_home/www/anytoour.ru/_preview/search3"
          ssh "${opts[@]}" "$remote" "rm -rf '$root' && mkdir -p '$root/poisk-turov'"
          scp "${opts[@]}" -r v2/. "$remote:$root/"
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -e
          root="$HOME/www/anytoour.ru/_preview/search3"
          prod="$HOME/www/anytoour.ru"
          cp "$prod/config.php" "$root/config.php"
          chmod 600 "$root/config.php"
          cp "$root/index.php" "$root/search-page-v3.php"
          python3 - "$root/search-page-v3.php" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); text=path.read_text()
          text=text.replace('</head>','<link rel="stylesheet" href="/_preview/search3/search3-preview.css?v=6"><link rel="stylesheet" href="/_preview/search3/search3-results-preview.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-results-width-fix.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-filter-rail-preview.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-mobile-filters.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-results-top.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-selected-tour.css?v=5"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration1.css?v=1"></head>',1)
          text=text.replace('</body>','<script src="/_preview/search3/search3-preview.js?v=4"></script><script src="/_preview/search3/search3-results-preview.js?v=3"></script><script src="/_preview/search3/search3-filter-rail-preview.js?v=2"></script><script src="/_preview/search3/search3-mobile-filters.js?v=4"></script><script src="/_preview/search3/search3-results-top.js?v=2"></script><script src="/_preview/search3/search3-selected-tour-mobile.js?v=2"></script></body>',1)
          path.write_text(text)
          PY
          cat > "$root/poisk-turov/index.php" <<'PHP'
          <?php
          header('X-Robots-Tag: noindex, nofollow', true);
          if (!defined('V2_FORCE_SEARCH_PAGE')) define('V2_FORCE_SEARCH_PAGE', true);
          if (!defined('V2_CANONICAL_PATH')) define('V2_CANONICAL_PATH', '/_preview/search3/poisk-turov/');
          if (!defined('V2_PUBLIC_BASE_PATH')) define('V2_PUBLIC_BASE_PATH', '/_preview/search3');
          require dirname(__DIR__) . '/search-page-v3.php';
          PHP
          cat > "$root/lead-adapter-v2.php" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('X-Robots-Tag: noindex, nofollow', true);
          http_response_code(403);
          echo json_encode(['ok'=>false,'preview'=>true,'message'=>'Lead submission is disabled on Search 3 preview'], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          REMOTE

  desktop-visual:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Desktop Search3 visual smoke
        run: |
          set -euo pipefail
          mkdir -p search3-desktop-artifacts
          cat > search3-desktop.cjs <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs');
          const fixture=[{id:901,name:'AnyTour Coast Resort',category:5,rating:4.8,seaDistance:120,price:125000,picturelink:'',country:{name:'Турция'},region:{name:'Анталья'},subRegion:{name:'Лара'},tours:[{id:'tour-a',date:'10.09.2026',nights:7,price:125000,meal:{name:'Все включено'},roomType:'Standard Sea View',placement:'DBL',operator:{name:'ANEX'},isCharter:true},{id:'tour-b',date:'12.09.2026',nights:9,price:142000,meal:{name:'Ультра всё включено'},roomType:'Deluxe',placement:'DBL',operator:{name:'PEGAS'},isCharter:false}]},{id:902,name:'AnyTour Garden Hotel',category:4,rating:4.4,seaDistance:650,price:98000,picturelink:'',country:{name:'Турция'},region:{name:'Аланья'},tours:[{id:'tour-c',date:'11.09.2026',nights:7,price:98000,meal:{name:'Завтрак и ужин'},roomType:'Family Room',placement:'2ADL',operator:{name:'Coral Travel'},isCharter:false}]}];
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1000}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));const response=await page.goto('https://anytoour.ru/_preview/search3/poisk-turov/?dv='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(1500);const initial=await page.evaluate(()=>({form:!!document.querySelector('#tourSearch'),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));await page.screenshot({path:'search3-desktop-artifacts/desktop-1440-initial.png',fullPage:true});await page.evaluate(x=>window.V2Results.render(x),fixture);await page.waitForTimeout(250);const results=await page.evaluate(()=>({cards:document.querySelectorAll('#results .hotel-card').length,hotelCtas:[...document.querySelectorAll('.search3-show-tours')].map(x=>x.textContent.trim()),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));await page.screenshot({path:'search3-desktop-artifacts/desktop-1440-results.png',fullPage:true});await page.locator('.search3-show-tours').first().click();await page.waitForTimeout(180);const tours=await page.evaluate(()=>({visible:!!document.querySelector('#results .hotel-card .hotel-tours:not([hidden])'),rows:document.querySelectorAll('#results .hotel-card:first-child .tour-row').length,packageCtas:[...document.querySelectorAll('#results .hotel-card:first-child .direct-tour')].map(x=>x.textContent.trim()),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));await page.screenshot({path:'search3-desktop-artifacts/desktop-1440-tours.png',fullPage:true});const report={http:response?.status()||0,errors,initial,results,tours};fs.writeFileSync('search3-desktop-artifacts/report.json',JSON.stringify(report,null,2));await browser.close();if(report.http!==200||errors.length||!initial.form||initial.overflow||results.cards!==2||results.hotelCtas.some(x=>x!=='Показать туры')||results.overflow||!tours.visible||tours.rows<1||tours.packageCtas.some(x=>x!=='Подробнее о туре')||tours.overflow)process.exit(1);})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node search3-desktop.cjs
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-desktop-visual-${{ github.run_number }}
          path: search3-desktop-artifacts/
          retention-days: 7
