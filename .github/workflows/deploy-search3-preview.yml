name: Deploy Search 3 preview

on:
  push:
    branches: [feature/search3-preview]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-search3-preview.yml'
  workflow_dispatch:

concurrency:
  group: deploy-search3-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          path="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY" | tr -d '\r' > "$path"
          else
            printf '%s' "$KEY" | base64 --decode > "$path"
          fi
          chmod 600 "$path"

      - name: Deploy isolated Search 3 preview
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -e
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER@$HOST"
          remote_home="$(ssh "${opts[@]}" "$remote" 'printf %s "$HOME"')"
          root="$remote_home/www/anytoour.ru/_preview/search3"
          ssh "${opts[@]}" "$remote" "rm -rf '$root' && mkdir -p '$root/poisk-turov'"
          scp "${opts[@]}" -r v2/. "$remote:$root/"
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -e
          root="$HOME/www/anytoour.ru/_preview/search3"
          prod="$HOME/www/anytoour.ru"
          cp "$prod/config.php" "$root/config.php"
          chmod 600 "$root/config.php"
          cp "$root/index.php" "$root/search-page-v3.php"
          python3 - "$root/search-page-v3.php" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); text=path.read_text()
          text=text.replace('</head>','<link rel="stylesheet" href="/_preview/search3/search3-preview.css?v=6"><link rel="stylesheet" href="/_preview/search3/search3-results-preview.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-results-width-fix.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-filter-rail-preview.css?v=3"><link rel="stylesheet" href="/_preview/search3/search3-mobile-filters.css?v=2"><link rel="stylesheet" href="/_preview/search3/search3-results-top.css?v=4"><link rel="stylesheet" href="/_preview/search3/search3-selected-tour.css?v=5"><link rel="stylesheet" href="/_preview/search3/search3-batch-iteration1.css?v=1"></head>',1)
          text=text.replace('</body>','<script src="/_preview/search3/search3-preview.js?v=4"></script><script src="/_preview/search3/search3-results-preview.js?v=3"></script><script src="/_preview/search3/search3-filter-rail-preview.js?v=2"></script><script src="/_preview/search3/search3-mobile-filters.js?v=4"></script><script src="/_preview/search3/search3-results-top.js?v=2"></script><script src="/_preview/search3/search3-selected-tour-mobile.js?v=2"></script></body>',1)
          path.write_text(text)
          PY
          cat > "$root/poisk-turov/index.php" <<'PHP'
          <?php
          header('X-Robots-Tag: noindex, nofollow', true);
          if (!defined('V2_FORCE_SEARCH_PAGE')) define('V2_FORCE_SEARCH_PAGE', true);
          if (!defined('V2_CANONICAL_PATH')) define('V2_CANONICAL_PATH', '/_preview/search3/poisk-turov/');
          if (!defined('V2_PUBLIC_BASE_PATH')) define('V2_PUBLIC_BASE_PATH', '/_preview/search3');
          require dirname(__DIR__) . '/search-page-v3.php';
          PHP
          cat > "$root/lead-adapter-v2.php" <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('X-Robots-Tag: noindex, nofollow', true);
          http_response_code(403);
          echo json_encode(['ok'=>false,'preview'=>true,'message'=>'Lead submission is disabled on Search 3 preview'], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          PHP
          REMOTE
