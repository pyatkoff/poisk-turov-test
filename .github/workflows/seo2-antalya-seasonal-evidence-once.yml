name: SEO2 Antalya seasonal evidence once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/seo2-antalya-seasonal-evidence-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
      - name: Inspect Antalya September identity only
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          work="$RUNNER_TEMP/seo2-antalya-prod"
          mkdir -p "$work"
          root='~/www/anytoour.ru'
          ssh "${opts[@]}" "$remote" 'mkdir -p "$HOME/www/anytoour.ru/data/seo2-antalya-once" && test -s "$HOME/www/anytoour.ru/config.php"'
          scp "${opts[@]}" \
            v2/data/db-v1.php \
            v2/data/inspect-seo-seasonal-identities-v1.php \
            v2/seo-seasonal-identity-v1.php \
            "$remote:$root/data/seo2-antalya-once/"
          ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            base="$HOME/www/anytoour.ru"
            mkdir -p "$base/data/seo2-antalya-once/v2/data" "$base/data/seo2-antalya-once/v2"
            cp "$base/config.php" "$base/data/seo2-antalya-once/v2/config.php"
            chmod 600 "$base/data/seo2-antalya-once/v2/config.php"
            cp "$base/data/seo2-antalya-once/db-v1.php" "$base/data/seo2-antalya-once/v2/data/db-v1.php"
            cp "$base/data/seo2-antalya-once/inspect-seo-seasonal-identities-v1.php" "$base/data/seo2-antalya-once/v2/data/inspect-seo-seasonal-identities-v1.php"
            cp "$base/data/seo2-antalya-once/seo-seasonal-identity-v1.php" "$base/data/seo2-antalya-once/v2/seo-seasonal-identity-v1.php"
            php "$base/data/seo2-antalya-once/v2/data/inspect-seo-seasonal-identities-v1.php" --countries=4 --require-identities=1 > "$base/data/seo2-antalya-once/identities.json"
            rm -f "$base/data/seo2-antalya-once/v2/config.php"
          '
          scp "${opts[@]}" "$remote:$root/data/seo2-antalya-once/identities.json" "$work/identities.json"
          php -r '
            $j=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            $target="resort_month:1:4:20:2026-09";
            $matches=[];
            foreach(($j["identities"]??[]) as $row){ if(($row["page_key"]??"")===$target) $matches[]=$row; }
            $safe=["target_page_key"=>$target,"found_count"=>count($matches),"evidence_checked_at_epoch"=>$j["evidence_checked_at_epoch"]??0,"evidence_valid_until_epoch"=>$j["evidence_valid_until_epoch"]??0,"publication_allowed"=>false,"copy_allowed"=>false,"matches"=>[]];
            foreach($matches as $row){ $safe["matches"][]=["state"=>$row["state"]??null,"page_key"=>$row["page_key"]??null,"page_type"=>$row["page_type"]??null,"country_id"=>$row["country_id"]??null,"region_id"=>$row["region_id"]??null,"departure_id"=>$row["departure_id"]??null,"year"=>$row["year"]??null,"month"=>$row["month"]??null,"evidence_checked_at_epoch"=>$row["evidence_checked_at_epoch"]??null,"expires_at_epoch"=>$row["expires_at_epoch"]??null,"freshness_seconds"=>$row["freshness_seconds"]??null,"publication_allowed"=>false,"copy_allowed"=>false]; }
            file_put_contents($argv[2],json_encode($safe,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n");
            printf("SEO2_ANTALYA_SEPTEMBER found=%d valid_until=%d\n",count($matches),$j["evidence_valid_until_epoch"]??0);
            if(count($matches)!==1) exit(7);
          ' "$work/identities.json" "$work/antalya-september.json"
      - name: Upload disposable identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo2-antalya-seasonal-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/seo2-antalya-prod/antalya-september.json
          retention-days: 3
