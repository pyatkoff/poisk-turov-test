name: ANEX Egypt retained APD prerequisite preflight
on:
  push:
    branches:
      - 'ops/int-egypt-248-apd-preflight-v1-20260914'
    paths:
      - '.github/ops/anex-egypt-248-apd-preflight-20260914-v1'
permissions:
  contents: read
concurrency:
  group: anex-egypt-248-apd-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
      REQUESTED_OPERATION: anex-egypt-248-apd-preflight-20260914-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact reviewed preflight source
        id: control
        run: |
          MARKER='control/.github/ops/anex-egypt-248-apd-preflight-20260914-v1'
          test "$(git -C control diff-tree --no-commit-id --name-only -r HEAD)" = '.github/ops/anex-egypt-248-apd-preflight-20260914-v1'
          SOURCE_SHA="$(git -C control rev-parse HEAD^)"
          test "$(cat "$MARKER")" = "source=${SOURCE_SHA};operation=${REQUESTED_OPERATION};scenario=Egypt-local248-anex10449-pre-reservation-prerequisites;owner=2026-09-14"
          test -n "$ANYTOOUR_DEPLOY_SSH_KEY" && test -n "$ANYTOOUR_DEPLOY_HOST" && test -n "$ANYTOOUR_DEPLOY_USER"
          echo "source=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.control.outputs.source }}
          path: source
          persist-credentials: false
      - name: Read supplier-free prerequisite state
        env:
          SOURCE_SHA: ${{ steps.control.outputs.source }}
        run: |
          mkdir -m 700 "$RUNNER_TEMP/egypt-apd-preflight"
          python3 - <<'PY'
          import json, os, shlex, subprocess
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'egypt-apd-preflight'
          key=out/'key'; key.write_text(os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].rstrip()+'\n'); key.chmod(0o600)
          source=Path('source/scripts/diagnostics/anex_egypt_248_apd_preflight.php').read_text()
          assert source.startswith('<?php\n')
          body=source[6:]
          strict='declare(strict_types=1);\n'
          assert body.startswith(strict)
          code=strict+body[len(strict):]
          command=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none',
                   '-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(out/'known_hosts'),'-o','ConnectTimeout=15',
                   '-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],
                   'cd "$HOME/www/anytoour.ru" && php -r '+shlex.quote(code)]
          request={'operation_id':os.environ['REQUESTED_OPERATION'],'source_sha':os.environ['SOURCE_SHA']}
          value={'schema_version':1,'operation_id':os.environ['REQUESTED_OPERATION'],'status':'transport_unconfirmed'}
          rc=1
          try:
              result=subprocess.run(command,input=json.dumps(request),text=True,capture_output=True,timeout=180)
              rc=result.returncode
              if len(result.stdout.encode()) <= 65536:
                  parsed=json.loads(result.stdout)
                  if isinstance(parsed,dict): value=parsed
          finally:
              key.unlink(missing_ok=True)
          (out/'result.json').write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          valid=(rc==0 and value.get('operation_id')==os.environ['REQUESTED_OPERATION']
                 and value.get('status') in ('ready','blocked','semantic_operation_already_present')
                 and value.get('supplier_calls')==0 and value.get('additional_prices_calls')==0
                 and value.get('tourvisor_calls')==0 and value.get('andromeda_calls')==0
                 and value.get('booking_calls')==0 and value.get('broninit_calls')==0
                 and value.get('mapping_writes')==0 and value.get('semantic_reservation_written') is False)
          raise SystemExit(0 if valid else 1)
          PY
      - name: Show sanitized prerequisite classification
        if: always()
        run: cat "$RUNNER_TEMP/egypt-apd-preflight/result.json"
      - name: Preserve sanitized prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-egypt-248-apd-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/egypt-apd-preflight/result.json
          if-no-files-found: error
          retention-days: 30
