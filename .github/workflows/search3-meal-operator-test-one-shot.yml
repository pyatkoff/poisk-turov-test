name: Search3 meal operator test one-shot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/search3-meal-operator-test-one-shot.yml'
      - 'tests/search3-hotel-operator-card.test.js'

permissions:
  contents: write

jobs:
  update-test:
    if: github.head_ref == 'ops/search3-meal-operator-test-temp-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/search3-meal-operator-test-temp-20260917
          fetch-depth: 0
          persist-credentials: true
      - name: Replace stale meal display expectation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/search3-hotel-operator-card.test.js')
          s = p.read_text()
          old = "assert.ok(row.includes('<b>'+(offer===tour?'Завтрак':'Всё включено')+'</b>'),'known meals use the common Russian display label');"
          new = "assert.ok(row.includes('<b>'+(offer===tour?'Завтраки':'Всё включено')+'</b>'),'supplier-provided meal labels remain exact');"
          if s.count(old) != 1:
              raise SystemExit('stale operator-card meal expectation not found exactly once')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/search3-meal-operator-test-one-shot.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/search3-hotel-operator-card.test.js
          git commit -m 'test(search3): preserve supplier meal label in operator card'
          git push origin HEAD:ops/search3-meal-operator-test-temp-20260917
