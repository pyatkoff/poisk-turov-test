name: MATCH HOTEL SU owner-geo reconcile v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_hotelsu1244_manualgeo_reconcile_v1.php
      - .github/workflows/hotel-match-hotelsu1244-manualgeo-reconcile-v1.yml
permissions:
  contents: read
  actions: read
  issues: read
env:
  OPERATION_ID: hotel-match-hotelsu1244-manualgeo-reconcile-1971-20260920-v1
  BASE_SHA: e8b65edb650509a549d1e032a81eb594d038a75c
  SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
  CLAIM: '5752459548'
jobs:
  reconcile:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'ops/match-hotelsu1244-manualgeo-reconcile-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ env.SOURCE_SHA }}'
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source and reconciliation claim
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir -p payload/source/scripts/diagnostics payload/source/app/integrations result inputs
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import os,subprocess
          a=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert a=={'scripts/diagnostics/hotel_match_hotelsu1244_manualgeo_reconcile_v1.php','.github/workflows/hotel-match-hotelsu1244-manualgeo-reconcile-v1.yml'},a
          PY
          php -l scripts/diagnostics/hotel_match_hotelsu1244_manualgeo_reconcile_v1.php
          php scripts/diagnostics/hotel_match_hotelsu1244_manualgeo_reconcile_v1.php --self-test
          test "$(git rev-parse "$BASE_SHA:app/integrations/andromeda-hotel-resolver.php")" = d49d0eaf8d6abccefd84c0c3921edde94ef50a68
          test "$(git rev-parse "$BASE_SHA:app/integrations/anex-search-mapping-registry.php")" = cc135a95d2a6e0f73ce50be2141c9b8a26fddc58
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > inputs/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('inputs/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530')
          for s in (os.environ['OPERATION_ID'],'terminal UNKNOWN','NO-REPLAY','2000032277','read-only reconciliation'): assert s in b,s
          PY
          cp scripts/diagnostics/hotel_match_hotelsu1244_manualgeo_reconcile_v1.php payload/source/scripts/diagnostics/
          cp app/integrations/andromeda-hotel-resolver.php payload/source/app/integrations/
          cp app/integrations/anex-search-mapping-registry.php payload/source/app/integrations/
      - name: Require exact-head Security
        env:
          GH_TOKEN: '${{ github.token }}'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:r=json.load(f)['workflow_runs']
              xs=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  x=max(xs,key=lambda z:z['id'])
                  if x['status']=='completed': assert x['conclusion']=='success'; break
              time.sleep(5)
          else: raise SystemExit('security_not_available')
          PY
      - name: Seal reservation before DB read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('payload');d={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in sorted(p.rglob('*')) if x.is_file()}
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'state':'reserved_before_db_read','provider_calls':0,'database_writes':0,'mapping_writes':0,'quota_mutations':0,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True)+'\n').encode();(p/'reservation.json').write_bytes(raw);d['reservation.json']=hashlib.sha256(raw).hexdigest();(p/'SHA256SUMS').write_text(''.join(v+'  '+k+'\n' for k,v in sorted(d.items())));pathlib.Path('result/reservation.json').write_bytes(raw)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 'match-hotelsu-reconcile-reservation-${{ github.run_id }}'
          path: result/reservation.json
          retention-days: 90
      - name: Read CURRENT state only
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null;remote="$USER_VALUE@$HOST_VALUE";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" -r payload/source payload/reservation.json payload/SHA256SUMS "$remote:$op/"
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";sha256sum -c SHA256SUMS >/dev/null;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$SOURCE_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 \"\$HOME/$op/source/scripts/diagnostics/hotel_match_hotelsu1244_manualgeo_reconcile_v1.php\"" > result/remote.stdout 2> result/remote.stderr
          ssh "${opts[@]}" "$remote" "tar -C \"\$HOME/$op\" -czf - reservation.json result.json receipt.json" > result/server-operation.tgz
      - name: Verify reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          p=pathlib.Path('result');s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              for m in t.getmembers():(s/m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open(s/'result.json'));q=json.load(open(s/'receipt.json'));d=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert r['state'] in ['reconciled_committed_verified','reconciled_not_committed_exact_pending'] and q['result_sha256']==d and r['database_writes']==r['mapping_writes']==0
          assert r['canonical_anex15072_resolution']==1244
          print(json.dumps({'state':r['state'],'samo':r['canonical_samo_resolution'],'anex':r['canonical_anex15072_resolution'],'safe_to_reissue_write':r['safe_to_reissue_write'],'result_sha256':d}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'match-hotelsu-reconcile-result-${{ github.run_id }}'
          path: result/
          retention-days: 90
