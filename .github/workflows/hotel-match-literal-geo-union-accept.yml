name: MATCH literal+single-geo union guarded acceptance
run-name: MATCH literal+single-geo union guarded acceptance #1971
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_literal_geo_union_accept.php'
      - 'tests/hotel-match-literal-geo-union-accept-test.php'
      - '.github/workflows/hotel-match-literal-geo-union-accept.yml'
  push:
    branches: ['feat/match-anex-sellability-20260911']
    paths:
      - 'scripts/diagnostics/hotel_match_literal_geo_union_accept.php'
      - 'tests/hotel-match-literal-geo-union-accept-test.php'
      - '.github/workflows/hotel-match-literal-geo-union-accept.yml'
      - '.github/match-literal-geo-union-accept-1971-v1.arm'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-literal-geo-union-accept-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-literal-geo-union-accept-1971-20260912-v1
  SOURCE_RUN_ID: '34653886089'
  SOURCE_ARTIFACT_ID: '10284837108'
  SOURCE_RESULT_SHA256: 30fa82d99eeac0bdf97a39e9136ebcedc3c155eae7abbfe0170be76ba0413078
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate union writer
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_literal_geo_union_accept.php
          php -l tests/hotel-match-literal-geo-union-accept-test.php
          php tests/hotel-match-literal-geo-union-accept-test.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_literal_geo_union_accept.php').read_text()
          assert 'hotel-match-literal-geo-union-accept-1971-20260912-v1' in s
          assert 'HMLGUA_MAX_WRITES=120' in s
          assert 'HMLGUA_EXPECTED_SOURCE_ROWS=99' in s
          assert 'INSERT INTO anex_hotel_search_mappings' in s
          assert "UPDATE andromeda_hotel_identities SET local_hotel_id=?" in s
          assert 'post_commit_readback_failed' in s
          assert 'current_coordinate_conflict_gt_5km' in s
          assert 'pair_excluded' in s and 'manual_protected' in s and 'target_occupied' in s
          assert "'supplier_calls'=>0" in s
          assert 'search_start' not in s and 'Tourvisor' not in s and 'booking' not in s.lower() and 'lead' not in s.lower()
          print('union writer static guards: OK')
          PY
  apply:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1 && (contains(github.event.head_commit.added, '.github/match-literal-geo-union-accept-1971-v1.arm') || contains(github.event.head_commit.modified, '.github/match-literal-geo-union-accept-1971-v1.arm'))
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify one-shot arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-literal-geo-union-accept-1971-v1.arm)" = "$OPERATION_ID"
      - name: Fetch exact completed source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$STATE/artifact-meta.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['STATE']);m=json.loads((s/'artifact-meta.json').read_text())
          assert str(m['id'])==os.environ['SOURCE_ARTIFACT_ID']
          assert str(m['workflow_run']['id'])==os.environ['SOURCE_RUN_ID']
          assert m.get('expired') is False
          (s/'source-identity.json').write_text(json.dumps({'artifact_id':m['id'],'name':m['name'],'run_id':m['workflow_run']['id'],'digest':m.get('digest')},sort_keys=True)+'\n')
          PY
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$STATE/source.zip"
          mkdir "$STATE/source"; unzip -q "$STATE/source.zip" -d "$STATE/source"
          test -f "$STATE/source/result.json"
          echo "$SOURCE_RESULT_SHA256  $STATE/source/result.json" | sha256sum -c -
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=Path(os.environ['STATE']);r=json.loads((s/'source/result.json').read_text())
          assert r['operation_id']=='hotel-match-literal-geo-union-review-1971-20260911-v2'
          assert r['status']=='completed' and r['database_writes']==0 and r['mapping_writes']==0 and r['supplier_calls']==0
          assert r['historical_operations_replayed'] is False
          assert r['stats']['prepared']==99 and r['stats']['prepared_anex']==7 and r['stats']['prepared_andromeda']==92 and len(r['prepared'])==99
          print(json.dumps({'prepared':99,'anex':7,'andromeda':92,'live':r['stats']['prepared_live']},sort_keys=True))
          PY
      - name: Reserve immutable write operation before DB access
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE'])
          reservation={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),'source_result_sha256':os.environ['SOURCE_RESULT_SHA256'],'writer_sha256':hashlib.sha256(Path('scripts/diagnostics/hotel_match_literal_geo_union_accept.php').read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (s/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          PY
      - name: Preserve reservation before DB access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-literal-geo-union-accept-1971-20260912-v1-reservation
          path: |
            ${{ runner.temp }}/hotel-match-literal-geo-union-accept-1971-20260912-v1/source-identity.json
            ${{ runner.temp }}/hotel-match-literal-geo-union-accept-1971-20260912-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Apply one server-current guarded transaction
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          root=Path('scripts/diagnostics'); seen=set(); ordered=[]
          req_re=re.compile(r"^\s*require_once\s+__DIR__\s*\.\s*'/([^']+)'\s*;\s*$",re.M)
          def visit(path):
              path=Path(path)
              key=str(path)
              if key in seen:return
              text=path.read_text(encoding='utf-8')
              for rel in req_re.findall(text):visit(path.parent/rel)
              seen.add(key);ordered.append((path,text))
          visit(root/'hotel_match_literal_geo_union_accept.php')
          def body(text):
              text=re.sub(r'^<\?php\s*','',text,count=1)
              text=text.replace('declare(strict_types=1);','',1)
              text=re.sub(r"^\s*if \(!defined\('FC_LIBRARY_ONLY'\)\) define\('FC_LIBRARY_ONLY', true\);\s*$",'',text,flags=re.M)
              text=req_re.sub('',text)
              return text
          code="<?php\nif (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY',true);\n"+'\n'.join(body(t) for _,t in ordered)
          review64=base64.b64encode((state/'source/result.json').read_bytes()).decode()
          wrapper="""
          try{
            $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMLGUA_ROOT');
            $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMLGUA_DB_HELPER');require_once $dbHelper;
            $review=json_decode(base64_decode('REVIEW64'),true,128,JSON_THROW_ON_ERROR);
            echo fc_json(hmlgua_accept(v2_data_db(),$review,HMLGUA_OPERATION,HMLGUA_MAX_WRITES)),"\n";
          }catch(Throwable $e){$m=$e->getMessage();$reason=is_string($m)&&preg_match('/\A[A-Za-z0-9_:\-]{1,160}\z/D',$m)?$m:'HMLGUA_REMOTE_ERROR';echo json_encode(['status'=>'failed','operation_id'=>HMLGUA_OPERATION,'reason'=>$reason,'supplier_calls'=>0,'tourvisor_calls'=>0]),"\n";exit(2);}
          """.replace('REVIEW64',review64)
          code+=wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER');host=os.environ[req[1]].strip();user=os.environ[req[2]].strip();keytext=os.environ[req[0]].strip()
          if not host or not user or not keytext:raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-union-accept-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key';key.write_text(keytext.rstrip()+'\n');key.chmod(0o600);known=Path(tmp)/'known_hosts'
              cmd=['ssh','-vv','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=5','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
              p=subprocess.run(cmd,input=code,text=True,capture_output=True,timeout=960,env=clean)
          progress={'authenticated':'Authenticated to ' in p.stderr or 'Authentication succeeded' in p.stderr,'command_sent':'Sending command:' in p.stderr,'remote_exit_seen':'Exit status ' in p.stderr}
          try:r=json.loads(p.stdout)
          except Exception:r={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'output_unparseable'}
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw);(state/'ssh-result.json').write_text(json.dumps({'exit_code':p.returncode,'ssh':progress},sort_keys=True)+'\n')
          valid=p.returncode==0 and r.get('status')=='completed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('supplier_calls')==0 and r.get('tourvisor_calls')==0 and r.get('historical_operations_replayed') is False and isinstance(r.get('database_writes'),int) and 0<=r['database_writes']<=99 and r.get('mapping_writes')==r.get('database_writes') and r.get('post_commit_readback_verified') is True and len(r.get('rows') or [])==r.get('database_writes')
          if not valid:
              status='unknown_no_replay' if progress.get('command_sent') and not progress.get('remote_exit_seen') else 'failed_guarded'
              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':status,'reason':r.get('reason','acceptance_not_completed'),'exit_code':p.returncode,'ssh':progress},sort_keys=True)+'\n');raise RuntimeError('guarded_acceptance_not_completed')
          s=r['stats'];b=r['coverage_before'];a=r['coverage_after'];receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_committed_readback_verified','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),'source_result_sha256':os.environ['SOURCE_RESULT_SHA256'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':r['database_writes'],'mapping_writes':r['mapping_writes'],'supplier_calls':0,'tourvisor_calls':0,'post_commit_readback_verified':True,'historical_operations_replayed':False,'no_replay':True,'stats':s,'skipped_reason_counts':r.get('skipped_reason_counts',{}),'coverage_before':b,'coverage_after':a,'ssh':progress}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          summary=(f"MATCH #1971 literal+single-geo union guarded acceptance `{r['operation_id']}` committed **{r['database_writes']} mappings** = ANEX **{s['written_anex']}** + Andromeda **{s['written_andromeda']}**, with post-COMMIT readback **{s['post_commit_verified']}/{r['database_writes']} verified**. CURRENT recheck source 99; stale/protected/changed rows skipped: **{99-r['database_writes']}**. Live written **{s['written_live']}**. Coverage triple **{b['all_three']}→{a['all_three']}**, exactly-two **{b['exactly_two']}→{a['exactly_two']}**, ANEX links **{b['anex_links']}→{a['anex_links']}**, Andromeda unique local **{b['andromeda_unique_local']}→{a['andromeda_unique_local']}**. Supplier/Tourvisor calls **0**. Operation completed/NO-REPLAY.")
          (state/'summary.md').write_text(summary+'\n');print(summary)
          PY
      - name: Preserve result and durable receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-literal-geo-union-accept-1971-20260912-v1-result
          path: ${{ runner.temp }}/hotel-match-literal-geo-union-accept-1971-20260912-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH write result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf ' Result artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
