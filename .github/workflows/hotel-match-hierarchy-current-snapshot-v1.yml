name: MATCH hierarchy full-frontier CURRENT snapshot v1
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths: [.github/workflows/hotel-match-hierarchy-current-snapshot-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-hierarchy-current-snapshot-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-hierarchy-current-snapshot-1971-20260916-v1
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify source and all offline protections before private access
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_hierarchy_current_snapshot.php)" = 228c134542df077ed0d4546f0ce04413a150b702
          test "$(git hash-object scripts/diagnostics/hotel_match_frontier_geography_evidence.py)" = 850ef42aa529e314a46d9fd0f696b4d8d41f9a67
          test "$(git hash-object tests/hotel_match_frontier_geography_evidence_test.py)" = f61e81a3d8cef605aaafe1678fa451e157c4f13a
          php -l scripts/diagnostics/hotel_match_hierarchy_current_snapshot.php
          php scripts/diagnostics/hotel_match_hierarchy_current_snapshot.php --self-test
          mkdir "$RUNNER_TEMP/match-inputs"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10453259469/zip > "$RUNNER_TEMP/match-inputs/checked.zip"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10447857357/zip > "$RUNNER_TEMP/match-inputs/dossier.zip"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10394524643/zip > "$RUNNER_TEMP/match-inputs/census.zip"
          export MATCH_GEO_DOSSIER_ZIP="$RUNNER_TEMP/match-inputs/dossier.zip" MATCH_GEO_CENSUS_ZIP="$RUNNER_TEMP/match-inputs/census.zip"
          python3 tests/hotel_match_frontier_geography_evidence_test.py
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,re,zipfile
          t=pathlib.Path(os.environ['RUNNER_TEMP']);p=t/'match-inputs/checked.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='1bdf88a0b580a0526a946b69e5960f3f1351fb4143de514846daeb8502693318'
          with zipfile.ZipFile(p) as z:
              raw=z.read('identity.json');assert hashlib.sha256(raw).hexdigest()=='712aa93f1476ff6b0549d1f1ed606e4c999ef3076c8c6fce3dbd06614682da97'
              assert z.read('source-sha.txt').decode().strip()=='361161ce8a25abb322ff2a777bcca4bbd10a188c'
          r=json.loads(raw);assert len(r['dossiers'])==1321 and r['safe_to_write_now'] is False
          rows=[{'external_hotel_id':d['external_hotel_id'],**{k:d['frontier'][k] for k in ('evidence_sha256','country_id','state_key')}} for d in r['dossiers']]
          countries={str(d['frontier']['country_id']):d['frontier']['country_name'] for d in r['dossiers']}
          manifest=json.dumps({'input_identity_sha256':hashlib.sha256(raw).hexdigest(),'frontier':rows,'countries':countries},sort_keys=True,separators=(',',':')).encode()
          s=pathlib.Path('scripts/diagnostics/hotel_match_hierarchy_current_snapshot.php').read_text();needle='__CHECKED_FRONTIER_MANIFEST_BASE64__';assert s.count(needle)==1
          s=s.replace(needle,base64.b64encode(manifest).decode())
          assert 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in s
          assert not re.search(r'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',s,re.I)
          (t/'runtime.php').write_text(s)
          out=t/os.environ['OPERATION_ID'];out.mkdir(mode=0o700)
          reservation={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','run_id':os.environ['GITHUB_RUN_ID'],'claim_comment_id':5700048408,'coordination_issue':2530,'queue_issue':1971,'frontier_count':1321,'manifest_sha256':hashlib.sha256(manifest).hexdigest(),'runtime_sha256':hashlib.sha256(s.encode()).hexdigest(),'input_identity_sha256':hashlib.sha256(raw).hexdigest(),'no_replay':True,'database_writes':0,'supplier_calls':0}
          (out/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          PY
          php -l "$RUNNER_TEMP/runtime.php"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-hierarchy-current-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-hierarchy-current-snapshot-1971-20260916-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: One supplier-free CURRENT transaction and durable result readback
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID";key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key";ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < "$RUNNER_TEMP/runtime.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size<=64000000
                  b=t.extractfile(m).read();(s/m.name).write_bytes(b)
          r=json.loads((s/'result.json').read_bytes());receipt=json.loads((s/'receipt.json').read_bytes())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert receipt['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          for x in (r,receipt):
              assert x['operation_id']==os.environ['OPERATION_ID'] and x['source_sha']==os.environ['GITHUB_SHA'] and x['no_replay'] is True
          assert receipt['readback_verified'] is True
          assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==r['tourvisor_calls']==0
          (p/'workflow-readback.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':r['state'],'result_sha256':receipt['result_sha256'],'readback_verified':True,'no_replay':True,'remote_exit':int(os.environ['REMOTE_RC']),'tar_exit':int(os.environ['TAR_RC'])},sort_keys=True)+'\n')
          assert r['state']=='completed_read_only' and os.environ['REMOTE_RC']==os.environ['TAR_RC']=='0'
          PY
      - name: Reconcile the entire frontier to CURRENT without mapping writes
        run: |
          python3 - <<'PY'
          import collections,copy,json,os,pathlib,sys
          sys.path.insert(0,'scripts/diagnostics');import hotel_match_frontier_geography_evidence as m
          t=pathlib.Path(os.environ['RUNNER_TEMP']);p=t/os.environ['OPERATION_ID'];cur=m.decode((p/'server/result.json').read_bytes())
          d=m.read_input(t/'match-inputs/dossier.zip','dossier');c=m.read_input(t/'match-inputs/census.zip','census')
          c['local_hotels']=cur['current_local_hotels'];c['local_alias_forms']=cur['current_aliases']
          for row in d['dossiers']:
              current=cur['current_frontier'].get(row['external_hotel_id'])
              row['evidence_flags']+=current['holds'] if current else ['current_identity_missing']
              if current and (not current['names'] or not set(current['names'])<=set(row['frontier']['names'])):row['evidence_flags'].append('current_primary_names_changed')
          report=m.review_hotels(m.enrich(d,c),c)
          for row in report['dossiers']:
              r=row['hotel_identity_review'];others=cur['current_occupancy'].get(str(r['target']),[])
              if any(x!=row['external_hotel_id'] for x in others):
                  r['holds']=sorted(set(r['holds'])|{'current_same_provider_target_occupied'});r['route']='held'
              r['current_occupancy']=others
          ready=[x for x in report['dossiers'] if x['hotel_identity_review']['route']=='prepared_for_current_review']
          ready_ids={x['external_hotel_id'] for x in ready}
          report['prepared_candidates']=[x for x in report['prepared_candidates'] if x['external_hotel_id'] in ready_ids]
          report['identity_summary'].update(prepared_for_current_review=len(ready),held=1321-len(ready),prepared_by_country=dict(sorted(collections.Counter(x['frontier']['country_name'] for x in ready).items())),compound_prepared=sum(x['hotel_identity_review'].get('compound_segmentation',False) for x in ready),holds_overlapping=dict(sorted(collections.Counter(h for x in report['dossiers'] for h in x['hotel_identity_review']['holds']).items())))
          report['current_snapshot']={'operation_id':cur['operation_id'],'source_sha':cur['source_sha'],'read_at_utc':cur['read_at_utc'],'result_sha256':m.digest((p/'server/result.json').read_bytes()),'database_writes':0,'receipt_readback_verified':True}
          report['limitations'].append('Local catalogue and source status/digest/protection/occupancy checked in this CURRENT snapshot. Supplier dictionary and learned geography are retained evidence. Prepared-only; transaction-time final validation is still required for any acceptance.')
          raw=m.canonical(report);(p/'current-review.json').write_bytes(raw)
          print(json.dumps({'identity_summary':report['identity_summary'],'current_read_at_utc':cur['read_at_utc'],'current_review_sha256':m.digest(raw)},ensure_ascii=False))
          assert len(report['dossiers'])==1321 and report['safe_to_write_now'] is False
          assert all(x['hotel_identity_review']['safe_to_write_now'] is False for x in report['dossiers'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-hierarchy-current-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-hierarchy-current-snapshot-1971-20260916-v1/
          if-no-files-found: warn
          retention-days: 90
