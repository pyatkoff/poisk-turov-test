name: MATCH HOTEL SU retained token receipt v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - .github/workflows/hotel-match-hotelsu1244-retained-token-receipt-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency:
  group: hotel-match-hotelsu1244-retained-token-receipt-1971-20260920-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-hotelsu1244-retained-token-receipt-1971-20260920-v1
  BASE_SHA: d527fb1c60d964ba54206948c72d169e165bd334
  SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
  CLAIM: '5751194735'
  ARTIFACT_ID: '10608779382'
  ARTIFACT_ZIP_SHA: 216af9e3b13cf69f65c96f1183ba1c153fca4ffe18d5c771a7ca461b83907d9e
  TERMINAL_OPERATION: hotel-match-hotelsu1244-retained-samo-evidence-1971-20260920-v1
  TERMINAL_SOURCE: 84b69fa741bf64851b7184049a191ca41334cc88
  RETAINED_SOURCE_RESULT: 34c0f56d9640c0e29bc59d2c7355dad3728fe421e18db55e528eba013cb58e3b
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/match-hotelsu1244-retained-token-receipt-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    name: Read immutable HOTEL SU token receipt
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      token_count: '${{ steps.parse.outputs.token_count }}'
      source_count: '${{ steps.parse.outputs.source_count }}'
      tokens: '${{ steps.parse.outputs.tokens }}'
      source_items: '${{ steps.parse.outputs.source_items }}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact scope and owner claim
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert actual=={'.github/workflows/hotel-match-hotelsu1244-retained-token-receipt-v1.yml'},actual
          PY
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
          for s in (os.environ['OPERATION_ID'],os.environ['BASE_SHA'],os.environ['ARTIFACT_ID'],os.environ['ARTIFACT_ZIP_SHA'],os.environ['TERMINAL_SOURCE'],'Provider/Tourvisor/SAMO/Andromeda/direct-ANEX calls0','DB writes0','mapping writes0','day ledgers untouched','safe_to_write_now=false'):
              assert s in c['body'],s
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed': assert r['conclusion']=='success'; print('SECURITY_OK',r['id']); break
              time.sleep(5)
          else: raise SystemExit('security_not_available')
          PY
      - name: Download terminal evidence artifact only
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > terminal.zip
          test "$(sha256sum terminal.zip | awk '{print $1}')" = "$ARTIFACT_ZIP_SHA"
      - name: Verify and expose exact retained rows
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,zipfile
          p=pathlib.Path('terminal.zip'); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['ARTIFACT_ZIP_SHA']
          with zipfile.ZipFile(p) as z:
              names=z.namelist(); assert names==['evidence.json'] or 'evidence.json' in names
              evidence=json.loads(z.read('evidence.json'))
          assert evidence['operation_id']==os.environ['TERMINAL_OPERATION']
          assert evidence['source_artifact_id']==10588338849 and evidence['source_result_sha256']==os.environ['RETAINED_SOURCE_RESULT']
          assert evidence['source_state']=='completed_read_only' and evidence['safe_to_write_now'] is False and evidence['day_ledgers_touched'] is False
          for k in ('reader_provider_calls','reader_tourvisor_calls','reader_samo_calls','reader_andromeda_calls','reader_direct_anex_calls','reader_database_writes','reader_mapping_writes'): assert evidence[k]==0,(k,evidence[k])
          strong=evidence['strong_candidates']; rows=evidence['all_turkey_su_token_rows']; src=evidence['source_result_matches']
          assert len(strong)==0 and len(rows)==9 and len(src)==1
          def safe(v,n): return re.sub(r'[\r\n|]+',' ',str(v if v not in (None,'') else '-')).strip()[:n]
          token_items=[]
          for r in rows:
              token_items.append({'id':safe(r.get('id'),20),'name':safe(r.get('name'),70),'town':safe(r.get('town'),45),'star':safe(r.get('star'),20),'lat':safe(r.get('latitude'),18),'lon':safe(r.get('longitude'),18),'file':safe(r.get('file'),40)})
          source_items=[]
          for x in src:
              b=x.get('bridge') if isinstance(x.get('bridge'),dict) else {}
              sid=b.get('requested_samo_id') or b.get('samo_hotel_id') or b.get('hotel_id') or '-'
              source_items.append({'local':safe(x.get('local_hotel_id'),20),'name':safe(x.get('name'),60),'state':safe(x.get('state') or x.get('route'),45),'samo':safe(sid,30),'context':safe(json.dumps(x.get('context'),ensure_ascii=False,separators=(',',':')),90)})
          out=pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a',encoding='utf-8') as f:
              f.write('token_count='+str(len(token_items))+'\n')
              f.write('source_count='+str(len(source_items))+'\n')
              f.write('tokens='+json.dumps({'item':token_items},ensure_ascii=False,separators=(',',':'))+'\n')
              f.write('source_items='+json.dumps({'item':source_items},ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'token_rows':token_items,'source_matches':source_items},ensure_ascii=False))
          PY
  summary:
    needs: read
    if: always() && needs.read.result == 'success'
    name: 'SUMMARY exact-token-rows=${{ needs.read.outputs.token_count }} source-matches=${{ needs.read.outputs.source_count }}'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  token_rows:
    needs: read
    if: needs.read.result == 'success'
    strategy:
      fail-fast: false
      matrix: '${{ fromJSON(needs.read.outputs.tokens) }}'
    name: 'SU ${{ matrix.item.id }} ${{ matrix.item.name }} | ${{ matrix.item.town }} | ${{ matrix.item.star }} | ${{ matrix.item.lat }},${{ matrix.item.lon }}'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  source_match:
    needs: read
    if: needs.read.result == 'success'
    strategy:
      fail-fast: false
      matrix: '${{ fromJSON(needs.read.outputs.source_items) }}'
    name: 'SRC local=${{ matrix.item.local }} ${{ matrix.item.name }} | ${{ matrix.item.state }} | SAMO=${{ matrix.item.samo }}'
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
