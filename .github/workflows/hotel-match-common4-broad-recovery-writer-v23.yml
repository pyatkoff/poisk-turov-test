name: MATCH COMMON4 broad recovery writer v23
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php'
      - 'tests/hotel_match_common4_broad_recovery_writer_v23_test.php'
      - '.github/workflows/hotel-match-common4-broad-recovery-writer-v23.yml'
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-common4-broad-recovery-writer-v23, cancel-in-progress: false}
env:
  AUDIT_OP: hotel-match-common4-broad-recovery-current-1971-20260925-v22
  OP: hotel-match-common4-broad-recovery-writer-1971-20260925-v23
  BASE: c3b28595541ecb85286227aa146d70329bf324f3
  CLAIM: '5830915867'
  AUDIT_ARTIFACT: '10859956002'
  AUDIT_ARCHIVE_SHA: b9dadf52eae05c6bab0582a2c2e697967bd394018489459a183df21de95ad449
  AUDIT_RESULT_SHA: 9580aeac1eeaac21dd81004f9950ded26118ef63582cf5f8071787739c76e553
jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-broad-recovery-writer-v23-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - run: php -l scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php
      - run: php scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php --self-test
      - run: php tests/hotel_match_common4_broad_recovery_writer_v23_test.php
      - run: |
          ! grep -E 'curl_|https?://|Tourvisor|SearchTour|PRICES\?|package/getFlights' scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php
  live:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/common4-broad-recovery-writer-v23-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate claim Security and exact CURRENT audit
        env: {GH_TOKEN: '${{ github.token }}', HEAD: '${{ github.event.pull_request.head.sha }}'}
        run: |
          set -euo pipefail;umask 077;mkdir -p input/audit terminal/w1 terminal/w2
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-common4-broad-recovery-writer-v23.yml scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php tests/hotel_match_common4_broad_recovery_writer_v23_test.php "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'expected writes=68','offset0','operator_115=67','operator_342=1']: assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUDIT_ARTIFACT/zip" -o input/audit.zip
          test "$(sha256sum input/audit.zip|awk '{print $1}')" = "$AUDIT_ARCHIVE_SHA"
          unzip -q input/audit.zip -d input/audit
          result="$(find input/audit -type f -name result.json -print -quit)";receipt="$(find input/audit -type f -name receipt.json -print -quit)"
          test -n "$result";test -n "$receipt";cp "$result" input/audit-result.json;cp "$receipt" input/audit-receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          r=json.load(open('input/audit-result.json'));q=json.load(open('input/audit-receipt.json'))
          h=hashlib.sha256(pathlib.Path('input/audit-result.json').read_bytes()).hexdigest()
          assert q['result_sha256']==h==os.environ['AUDIT_RESULT_SHA']
          assert r['operation']==os.environ['AUDIT_OP'] and r['state']=='completed_read_only_samo_business_common4_current'
          assert r['captured_single_native_edge_count']==77 and r['writer_ready_total']==68
          assert r['writer_ready_counts']=={'operator_115':67,'operator_342':1}
          assert r['status_counts']=={'hold_input_target_namespace_collision':4,'hold_manual_target':5,'writer_ready':68}
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          pathlib.Path('input/audit.sha').write_text(h)
          PY
      - name: Commit 68 broad-recovery identities
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}', HEAD: '${{ github.event.pull_request.head.sha }}', OP: '${{ env.OP }}'}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          op=".anytoour-match/operations/$OP";asha="$(cat input/audit.sha)"
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('input/reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'state':'reserved_before_write','expected_writes':68,'write_offset':0,'audit_operation':os.environ['AUDIT_OP'],'provider_http_calls':0},sort_keys=True)+'\n')
          PY
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload/scripts/diagnostics\""
          scp "${opts[@]}" input/reservation.json "$remote:$op/reservation.json"
          scp "${opts[@]}" input/audit-result.json "$remote:$op/payload/audit-result.json"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php "$remote:$op/payload/scripts/diagnostics/"
          set +e
          ssh "${opts[@]}" "$remote" "set -eu;cd \"\$HOME/www/anytoour.ru\";ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_AUDIT_RESULT=\"\$HOME/$op/payload/audit-result.json\" MATCH_AUDIT_SHA='$asha' MATCH_SOURCE_SHA='$HEAD' MATCH_WRITER_OPERATION='$OP' MATCH_EXPECTED_WRITES=68 MATCH_WRITE_OFFSET=0 php \"\$HOME/$op/payload/scripts/diagnostics/hotel_match_common4_broad_recovery_writer_v23.php\" --execute" >terminal/w1/remote.stdout 2>terminal/w1/remote.stderr
          status=$?
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - reservation.json pre-commit.json commit-attempt.json result.json receipt.json" >terminal/w1/server.tgz
          set -e
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/w1/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile():pathlib.Path('terminal/w1',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/w1/result.json'));q=json.load(open('terminal/w1/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/w1/result.json').read_bytes()).hexdigest()
          assert r['state']=='committed_verified' and r['inserted']==68 and r['database_writes']==68 and r['mapping_writes']==68
          assert r['inserted_by_namespace']=={'operator_115':67,'operator_342':1} and r['readback_verified'] is True
          print(json.dumps({k:r[k] for k in ['state','inserted','inserted_by_namespace','unique_targets','readback_verified']},sort_keys=True))
          PY
          test "$status" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-common4-broad-recovery-writer-v23-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
