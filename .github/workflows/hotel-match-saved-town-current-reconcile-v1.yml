name: MATCH saved TOWNTO CURRENT reconcile v1
on:
  push:
    branches: [ops/match-saved-town-current-reconcile-1971-20260915-v1]
    paths: [.github/workflows/hotel-match-saved-town-current-reconcile-v1.yml]
permissions: {contents: read}
concurrency: {group: match-saved-town-current-reconcile-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-saved-town-current-reconcile-1971-20260915-v1
jobs:
  reconcile:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Verify exact source offline before reservation
        run: |
          set -euo pipefail
          php -d allow_url_fopen=0 tests/hotel_match_saved_town_current_reconcile_test.php
          php -l scripts/diagnostics/hotel_match_saved_town_current_reconcile.php
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('scripts/diagnostics/hotel_match_saved_town_current_reconcile.php').read_text()
          assert "START TRANSACTION READ ONLY" in s
          assert 'UPDATE andromeda_hotel_identities' not in s
          assert 'supplier_calls\'=>0' in s and 'tourvisor_calls\'=>0' in s
          assert 'MST_PARENT_RESULT_SHA' in s and 'e5cb4eeed062882779c37059e19f12b4e3e92badb45a6069b86d228d8d5534d7' in s
          assert 'typed_town_not_direct_target_region' in s and 'coordinate_conflict_gt5km' in s
          print('source guards PASS')
          PY
      - name: Reserve before SSH or DB access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];out.mkdir(mode=0o700)
          src=pathlib.Path('scripts/diagnostics/hotel_match_saved_town_current_reconcile.php').read_bytes()
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5682384436,'purpose':'CURRENT read-only reconciliation of 529 sealed HOTELS/TOWNTO dossiers','parent_operation_id':'hotel-match-saved-andromeda-evidence-1971-20260915-v1','parent_result_sha256':'e5cb4eeed062882779c37059e19f12b4e3e92badb45a6069b86d228d8d5534d7','bundle_sha256':hashlib.sha256(src).hexdigest(),'database_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          (out/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-saved-town-current-reconcile-v1-reservation
          path: ${{ runner.temp }}/hotel-match-saved-town-current-reconcile-1971-20260915-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute one server-CURRENT read-only pass
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/k"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test ! -e \"\$p\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_saved_town_current_reconcile.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - ." > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"; trc=$?
          set -e
          test $trc -eq 0; mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          export REMOTE_RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server'
          res=json.loads((s/'result.json').read_text());receipt=json.loads((s/'receipt.json').read_text())
          digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert receipt['result_sha256']==digest and receipt['readback_verified'] is True
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert res['operation_id']==os.environ['OPERATION_ID'] and res['source_sha']==os.environ['GITHUB_SHA']
          assert res['parent_dossiers']==529 and res['database_writes']==res['mapping_writes']==res['supplier_calls']==res['tourvisor_calls']==0
          assert os.environ['REMOTE_RC']=='0' and res['state']=='completed_read_only' and res['readback_verified'] is True
          gate={'operation_id':res['operation_id'],'state':res['state'],'result_sha256':digest,'examined':res['examined_current_pending'],'prepared':res['guard_passed_prepared'],'held':res['held'],'no_longer_pending':res['no_longer_pending'],'reason_counts':res['reason_counts'],'readback_verified':True}
          (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True)+'\n');print(json.dumps(gate,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-saved-town-current-reconcile-v1-result
          path: ${{ runner.temp }}/hotel-match-saved-town-current-reconcile-1971-20260915-v1/
          if-no-files-found: warn
          retention-days: 90
