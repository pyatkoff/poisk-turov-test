name: Visual V2 meal visibility

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/visual-v2-meal-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meal-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify every primary meal choice is visible without horizontal scrolling
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        shell: bash
        run: |
          set -euo pipefail
          cat > ./v2-meal-visibility.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('v2');
          const browserAsset = /\/poisk-turov-test\/v2\/([^/?]+\.(?:js|css))(?:\?.*)?$/i;
          const viewports = [375,430,768,901,1024,1100,1101,1440];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of viewports){
              const context=await browser.newContext({viewport:{width,height:900},ignoreHTTPSErrors:true});
              const page=await context.newPage();
              await page.route('**/*',async route=>{
                const match=new URL(route.request().url()).pathname.match(browserAsset);
                if(!match)return route.continue();
                const file=path.join(root,path.basename(match[1]));
                if(!fs.existsSync(file))return route.continue();
                const ext=path.extname(file).toLowerCase();
                return route.fulfill({status:200,contentType:ext==='.css'?'text/css':'application/javascript',body:fs.readFileSync(file)});
              });
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(5000);
              const state=await page.evaluate(()=>{
                const row=document.querySelector('.meal-quick');
                const buttons=[...document.querySelectorAll('.meal-choice')];
                if(!row)return {exists:false,count:buttons.length};
                const rr=row.getBoundingClientRect();
                const clipped=buttons.filter(btn=>{const r=btn.getBoundingClientRect();return r.left<rr.left-2||r.right>rr.right+2;}).length;
                return {exists:true,count:buttons.length,scrollWidth:row.scrollWidth,clientWidth:row.clientWidth,clipped,overflowX:getComputedStyle(row).overflowX};
              });
              console.log(`MEAL_VISIBILITY width=${width} http=${response?.status()||0} count=${state.count} clipped=${state.clipped} scroll=${state.scrollWidth}/${state.clientWidth} overflowX=${state.overflowX}`);
              if(response?.status()!==200||!state.exists||state.count<4||state.clipped||state.scrollWidth>state.clientWidth+2)process.exitCode=1;
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./v2-meal-visibility.cjs
