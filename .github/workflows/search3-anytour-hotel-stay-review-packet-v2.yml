name: Search3 hotel stay review packet V2
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'scripts/catalog/anytour_hotel_stay_review_packet_v2.php'
      - 'tests/anytour_hotel_stay_review_packet_v2_test.php'
      - '.github/workflows/search3-anytour-hotel-stay-review-packet-v2.yml'

permissions:
  contents: read

jobs:
  review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax and offline-only guards
        run: |
          set -euo pipefail
          php -l scripts/catalog/anytour_hotel_stay_review_packet_v2.php
          php -l tests/anytour_hotel_stay_review_packet_v2_test.php
          ! grep -Fq 'new PDO' scripts/catalog/anytour_hotel_stay_review_packet_v2.php
          ! grep -Fq 'curl_' scripts/catalog/anytour_hotel_stay_review_packet_v2.php
          ! grep -Fq 'http://' scripts/catalog/anytour_hotel_stay_review_packet_v2.php
          ! grep -Fq 'https://' scripts/catalog/anytour_hotel_stay_review_packet_v2.php
          grep -Fq "'rankedChoices'=>false" scripts/catalog/anytour_hotel_stay_review_packet_v2.php
          grep -Fq "'automaticDecisions'=>0" scripts/catalog/anytour_hotel_stay_review_packet_v2.php
      - name: Exercise packet and reviewed-manifest compiler
        run: php tests/anytour_hotel_stay_review_packet_v2_test.php
