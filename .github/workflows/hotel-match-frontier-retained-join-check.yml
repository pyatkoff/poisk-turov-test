name: MATCH offline frontier retained-evidence join
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths:
      - scripts/diagnostics/hotel_match_frontier_retained_join.py
      - tests/hotel_match_frontier_retained_join_test.py
      - .github/workflows/hotel-match-frontier-retained-join-check.yml
permissions: {contents: read, actions: read}
jobs:
  offline:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Read the two existing immutable artifacts only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/match-retained-input"
          timeout 60s gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10447056731/zip > "$RUNNER_TEMP/match-retained-input/frontier.zip"
          timeout 60s gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10400444968/zip > "$RUNNER_TEMP/match-retained-input/retained.zip"
      - name: Validate provenance and reproduce every dossier without DB or provider access
        env:
          MATCH_FRONTIER: ${{ runner.temp }}/match-retained-input/frontier.zip
          MATCH_RETAINED: ${{ runner.temp }}/match-retained-input/retained.zip
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/diagnostics/hotel_match_frontier_retained_join.py tests/hotel_match_frontier_retained_join_test.py
          python3 tests/hotel_match_frontier_retained_join_test.py -v
          python3 scripts/diagnostics/hotel_match_frontier_retained_join.py "$MATCH_FRONTIER" "$MATCH_RETAINED" "$RUNNER_TEMP/match-frontier-retained-20260916.json"
          echo "d2eff538a7587406460bea41cdd39aff7f6e25cc2cd87ec14d37fa918e63490d  $RUNNER_TEMP/match-frontier-retained-20260916.json" | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-frontier-retained-evidence-checked
          path: ${{ runner.temp }}/match-frontier-retained-20260916.json
          if-no-files-found: error
          retention-days: 90
