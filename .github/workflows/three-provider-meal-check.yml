name: Three-provider meal contract

on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-meal.php'
      - 'tests/three-provider-meal-test.php'
      - '.github/workflows/three-provider-meal-check.yml'

permissions:
  contents: read

jobs:
  meal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: PHP syntax
        run: |
          php -l app/integrations/three-provider-meal.php
          php -l tests/three-provider-meal-test.php

      - name: Focused contract checks
        run: php -d allow_url_fopen=0 tests/three-provider-meal-test.php

      - name: Static isolation boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('app/integrations/three-provider-meal.php').read_text()
          assert "'ai'" in source
          assert "'uai'" in source
          assert "'without_alcohol'" in source
          assert "'plus'" in source
          assert "'cross_provider_equivalence_verified' => false" in source
          assert "'package_equivalence_verified' => false" in source

          forbidden = ('curl_', 'PDO', 'bron', 'booking', 'supplier_id', 'provider_id')
          for token in forbidden:
              assert token not in source, token
          PY
