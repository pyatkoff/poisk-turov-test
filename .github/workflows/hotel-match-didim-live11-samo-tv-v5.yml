name: MATCH Didim live11 SAMO then TV v5
on:
  push:
    branches: [ops/match-didim-live11-samo-tv-1971-20260919-v5]
    paths:
      - scripts/diagnostics/hotel_match_didim_live11_samo_tv_v5.php
      - scripts/diagnostics/hotel_match_didim_live11_helpers_v5.php
      - .github/workflows/hotel-match-didim-live11-samo-tv-v5.yml
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-didim-live11-samo-tv-1971-20260919-v5, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-didim-live11-samo-tv-1971-20260919-v5
  BASE_SHA: e9d7bf349bfb601dff04b7fc47088c1eff38b369
  CLAIM: '5743096515'
  CLAIM_EXT: '5743042888'
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact scope and owner claim
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail; umask 077; mkdir -p reservation terminal
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA..HEAD")
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx scripts/diagnostics/hotel_match_didim_live11_samo_tv_v5.php
          printf '%s\n' "${changed[@]}" | grep -Fx scripts/diagnostics/hotel_match_didim_live11_helpers_v5.php
          printf '%s\n' "${changed[@]}" | grep -Fx .github/workflows/hotel-match-didim-live11-samo-tv-v5.yml
          php -l scripts/diagnostics/hotel_match_didim_live11_helpers_v5.php
          php -l scripts/diagnostics/hotel_match_didim_live11_samo_tv_v5.php
          php scripts/diagnostics/hotel_match_didim_live11_samo_tv_v5.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >reservation/claim.json
          python3 - <<'PY'
          import json,os
          a=json.load(open('reservation/claim.json'))
          assert a['user']['id']==226193297 and a['author_association']=='OWNER' and a['issue_url'].endswith('/issues/2530')
          assert os.environ['OPERATION_ID'] in a['body'] and '564da2af9cb248a6860b1705285f106d4f022ffbbac36a7fcfe2630d91a74b39' in a['body']
          assert '2026-09-22' in a['body'] and 'staging' in a['body']
          PY
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10586762164/zip >reservation/v1.zip
          python3 - <<'PY'
          import hashlib,zipfile,tarfile,io,pathlib
          p=pathlib.Path('reservation/v1.zip'); assert hashlib.sha256(p.read_bytes()).hexdigest()=='0869105678cc4551ae7b4a8eda1a9965479cd6da873195a96ae39b6dee04a980'
          with zipfile.ZipFile(p) as z: tb=z.read('server-operation.tgz')
          with tarfile.open(fileobj=io.BytesIO(tb),mode='r:gz') as t: b=t.extractfile(t.getmember('raw-samo-catalog-all.json')).read()
          assert hashlib.sha256(b).hexdigest()=='564da2af9cb248a6860b1705285f106d4f022ffbbac36a7fcfe2630d91a74b39'
          pathlib.Path('reservation/catalog.json').write_bytes(b)
          PY
      - name: Create durable pre-provider reservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,datetime
          files=['scripts/diagnostics/hotel_match_didim_live11_samo_tv_v5.php','scripts/diagnostics/hotel_match_didim_live11_helpers_v5.php','scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php','scripts/diagnostics/hotel_match_operator_fingerprint_room_evidence_v1.php','app/integrations/andromeda-client.php','app/integrations/andromeda-transport.php','app/integrations/andromeda-network-transport-failure.php','v2/data/tourvisor-client-v1.php']
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_before_provider_access','source_sha':os.environ['GITHUB_SHA'],'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'route':'Moscow-Turkey-Didim','samo_first':True,'exact_date_source':'SAMO catalog','nights':7,'adults':2,'children':0,'samo_call_cap':30,'tourvisor_call_cap':90,'database_writes':0,'mapping_writes':0,'no_replay_after_provider_access':True,'dependencies':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files}}
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n').encode()
          with open('reservation/reservation.json','xb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
           q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(q,timeout=30) as f:r=json.load(f)['workflow_runs']
           xs=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
           if xs:
            x=max(xs,key=lambda z:z['id'])
            if x['status']=='completed': assert x['conclusion']=='success'; print('SECURITY_OK',x['id']); break
           time.sleep(5)
          else: raise SystemExit('security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'didim-live11-reservation-${{ github.run_id }}', path: reservation/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Require existing credentials
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          AU: '${{ secrets.ANDROMEDA_USERNAME }}'
          AP: '${{ secrets.ANDROMEDA_PASSWORD }}'
        shell: bash
        run: test -n "$KEY" && test -n "$HOST" && test -n "$USER" && test -n "$AU" && test -n "$AP"
      - name: Stage exclusive operation
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail; umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null;test -s "$known"
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op/payload\""
          scp "${opts[@]}" reservation/reservation.json reservation/catalog.json "$remote:$op/payload/"
          ssh "${opts[@]}" "$remote" "set -eu;mv \"\$HOME/$op/payload/reservation.json\" \"\$HOME/$op/reservation.json\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_didim_live11_samo_tv_v5.php scripts/diagnostics/hotel_match_didim_live11_helpers_v5.php scripts/diagnostics/hotel_match_tv_samo_common4_full_drain_v1.php scripts/diagnostics/hotel_match_operator_fingerprint_room_evidence_v1.php app/integrations/andromeda-client.php app/integrations/andromeda-transport.php app/integrations/andromeda-network-transport-failure.php v2/data/tourvisor-client-v1.php "$remote:$op/payload/"
      - name: Run SAMO first then Tourvisor once
        env:
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          AU: '${{ secrets.ANDROMEDA_USERNAME }}'
          AP: '${{ secrets.ANDROMEDA_PASSWORD }}'
        shell: bash
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          set +e
          printf '%s\n%s\n' "$AU" "$AP" | ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$GITHUB_SHA' MATCH_CATALOG_PATH=\"\$HOME/$op/payload/catalog.json\" php -d display_errors=0 -d log_errors=1 -d zend.exception_ignore_args=1 -d error_log=\"\$HOME/$op/bootstrap-errors.log\" -d memory_limit=768M \"\$HOME/$op/payload/hotel_match_didim_live11_samo_tv_v5.php\"" >terminal/stdout.json 2>terminal/stderr.txt
          rc=$?;printf '%s\n' "$rc">terminal/remote-exit.txt
          ssh "${opts[@]}" "$remote" 'set -eu;cd "$HOME/'"$op"'";set -- reservation.json;for f in result.json receipt.json raw-manifest.json bootstrap-errors.log raw-*.json;do test ! -f "$f" || set -- "$@" "$f";done;tar -czf - -- "$@"' >terminal/server-operation.tgz 2>>terminal/stderr.txt
          trc=$?;printf '%s\n' "$trc">terminal/tar-exit.txt;set -e;test "$trc" -eq 0;test "$rc" -eq 0
      - name: Verify terminal live cohort
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,tarfile
          p=pathlib.Path('terminal');s=p/'server';s.mkdir(exist_ok=True);a=p/'server-operation.tgz'
          assert a.exists() and a.stat().st_size>0
          seen=set()
          with tarfile.open(a,'r:gz') as t:
           for m in t.getmembers():
            assert m.isfile() and m.name not in seen and re.fullmatch(r'[a-z0-9_.-]+',m.name) and m.size<64_000_000
            seen.add(m.name);(s/m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open(s/'result.json'));q=json.load(open(s/'receipt.json'))
          assert r['operation']==q['operation']==os.environ['OPERATION_ID'] and q['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert r['database_writes']==q['database_writes']==0 and r['mapping_writes']==q['mapping_writes']==0
          assert r['samo_calls']==q['samo_calls']<=30 and r['tourvisor_calls']==q['tourvisor_calls']<=90
          assert r['state'] in ['completed_read_only','completed_samo_empty']
          if r['state']=='completed_samo_empty': assert r['tourvisor_calls']==0 and r['samo_live_hotels']==0
          else:
           assert r['route']['resort']=='Дидим' and r['samo_live_hotels']>0 and r['tourvisor_fully_drained'] is True
           assert all(x['safe_to_write_now'] is False for x in r['join'])
          m=json.load(open(s/'raw-manifest.json'));assert q['raw_manifest_sha256']==hashlib.sha256((s/'raw-manifest.json').read_bytes()).hexdigest()
          for x in m['files']:
           b=(s/x['file']).read_bytes();assert len(b)==x['bytes'] and hashlib.sha256(b).hexdigest()==x['sha256']
          summary={k:r.get(k) for k in ['state','route','samo_calls','tourvisor_calls','samo_live_pairs','samo_live_hotels','tourvisor_live_hotels','tourvisor_hotel_operator_pairs','tourvisor_details','join_state_counts']};summary['result_sha256']=q['result_sha256'];(p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          PY
          test "$(cat terminal/remote-exit.txt)" -eq 0;test "$(cat terminal/tar-exit.txt)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-didim-live11-${{ github.run_id }}', path: terminal/, retention-days: 90, if-no-files-found: error}
      - name: Remove runner credential files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/known_hosts"
