name: Search3 mobile offer density materialize

on:
  push:
    branches:
      - ux/search3-mobile-offer-density-20260912
    paths:
      - 'scripts/ci/search3_mobile_offer_density_materialize.py'
      - '.github/workflows/search3-mobile-offer-density-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-mobile-offer-density-20260912
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Apply bounded source change
        run: python3 scripts/ci/search3_mobile_offer_density_materialize.py
      - name: Regenerate canonical Search3 assets
        run: python3 scripts/build/search3_assets.py --write
      - name: Restrict generated drift
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(src/search3/styles/results-layout\.css|v2/search3-results-filters-v1\.css|docs/project/search3-production-import\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected drift:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
      - name: Remove materializer and commit exact package
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/ci/search3_mobile_offer_density_materialize.py .github/workflows/search3-mobile-offer-density-materialize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/search3/styles/results-layout.css v2/search3-results-filters-v1.css docs/project/search3-production-import.json
          git commit -m 'SEARCH: compact mobile offer rows'
          git push origin HEAD:ux/search3-mobile-offer-density-20260912
