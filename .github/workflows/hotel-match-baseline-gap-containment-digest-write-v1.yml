name: MATCH baseline-gap containment digest write 1971
on:
  push:
    branches: [ops/match-baseline-gap-containment-digest-write-1971-20260912-v1]
    paths: [.github/match-baseline-gap-containment-digest-write-1971-20260912-v1.arm]
permissions: {contents: read, actions: read, issues: write}
concurrency: {group: anytour-match-baseline-gap-containment-digest-write-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-baseline-gap-containment-digest-write-1971-20260912-v1
  OUT: /tmp/match-baseline-gap-containment-digest-write-1971-v1
jobs:
  write:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline guards and immutable reservation
        run: |
          set -euo pipefail
          test "$(cat .github/match-baseline-gap-containment-digest-write-1971-20260912-v1.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_baseline_gap_containment_digest_write.php
          php tests/hotel-match-baseline-gap-containment-digest-write-test.php
          mkdir -p "$OUT/bundle/scripts/diagnostics" "$OUT/bundle/reports" "$OUT/bundle/app/integrations"
          cp scripts/diagnostics/hotel_match_baseline_gap_containment_digest_write.php "$OUT/bundle/scripts/diagnostics/program.php"
          cp scripts/diagnostics/hotel_match_baseline_gap_current_audit.php "$OUT/bundle/scripts/diagnostics/current.php"
          cp scripts/diagnostics/hotel_match_baseline_gap_containment_audit.php "$OUT/bundle/scripts/diagnostics/containment.php"
          cp reports/hotel-match-baseline-gap-containment-digest-write-1971.json "$OUT/bundle/reports/write.json"
          cp reports/hotel-match-baseline-gap-current-audit-1971.json "$OUT/bundle/reports/audit.json"
          cp app/integrations/anex-search-mapping-registry.php "$OUT/bundle/app/integrations/registry.php"
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['OUT'])/'bundle/scripts/diagnostics/program.php';s=p.read_text()
          repl={
            "require_once $root.'/scripts/diagnostics/hotel_match_baseline_gap_current_audit.php';":"require_once (string)getenv('HMBGCW_CURRENT_SOURCE_PATH');",
            "require_once $root.'/scripts/diagnostics/hotel_match_baseline_gap_containment_audit.php';":"require_once (string)getenv('HMBGCW_CONTAINMENT_SOURCE_PATH');",
            "require_once $root.'/app/integrations/anex-search-mapping-registry.php';":"require_once (string)getenv('HMBGCW_REGISTRY_PATH');",
          }
          for a,b in repl.items():
              if s.count(a)!=1: raise SystemExit('bundle patch marker drift: '+a)
              s=s.replace(a,b,1)
          p.write_text(s)
          PY
          php -l "$OUT/bundle/scripts/diagnostics/program.php"
          sha256sum "$OUT/bundle/scripts/diagnostics/program.php" "$OUT/bundle/scripts/diagnostics/current.php" "$OUT/bundle/scripts/diagnostics/containment.php" "$OUT/bundle/reports/write.json" "$OUT/bundle/reports/audit.json" "$OUT/bundle/app/integrations/registry.php" > "$OUT/input.sha256"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']);raw=d.joinpath('input.sha256').read_text()
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_db_access','source_sha':os.environ['GITHUB_SHA'],'input_digest':hashlib.sha256(raw.encode()).hexdigest(),'expected_writes':94,'expected_safe_set_sha256':'d1a529dc1e41057faf5a251ee0fabc4f129cd1882d1eb60909c65515ec2af7b5','supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          d.joinpath('reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: reserve
        with: {name: 'match-baseline-gap-containment-digest-write-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '${{ steps.reserve.outputs.artifact-id }}', path: /tmp/match-baseline-gap-containment-digest-write-reservation, merge-multiple: true}
      - name: Execute one 94-row digest-guarded transactional write
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail
          cmp "$OUT/reservation.json" /tmp/match-baseline-gap-containment-digest-write-reservation/reservation.json
          key="$RUNNER_TEMP/match-containment-write-key"; known="$RUNNER_TEMP/match-containment-write-known"; sock="$RUNNER_TEMP/match-containment-write.sock"
          cleanup(){ ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }; trap cleanup EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh -M -S "$sock" -fnNT -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"
          set +e
          tar -C "$OUT/bundle" -cf - . | ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" 'tmp=$(mktemp -d); trap "rm -rf $tmp" EXIT; tar -xf - -C "$tmp" || exit 91; cd "$HOME/www/anytoour.ru" || exit 92; HMBGCW_MANIFEST_PATH="$tmp/reports/write.json" HMBGCW_AUDIT_MANIFEST_PATH="$tmp/reports/audit.json" HMBGCW_CURRENT_SOURCE_PATH="$tmp/scripts/diagnostics/current.php" HMBGCW_CONTAINMENT_SOURCE_PATH="$tmp/scripts/diagnostics/containment.php" HMBGCW_REGISTRY_PATH="$tmp/app/integrations/registry.php" php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M "$tmp/scripts/diagnostics/program.php"' > "$OUT/live.stdout" 2> "$OUT/live.stderr"
          rc=$?; set -e; export RC="$rc"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          d=pathlib.Path(os.environ['OUT']);lines=d.joinpath('live.stdout').read_text(errors='replace').splitlines();rows=[x[12:] for x in lines if x.startswith('HMBGCW_JSON:')]
          data=json.loads(rows[-1]) if rows else {'status':'unknown_do_not_replay','operation_id':os.environ['OPERATION_ID'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0}
          raw=(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode();d.joinpath('result.json').write_bytes(raw)
          good=int(os.environ['RC'])==0 and data.get('status')=='completed' and data.get('operation_id')==os.environ['OPERATION_ID'] and data.get('committed') is True and data.get('readback_verified') is True and data.get('database_writes')==94 and data.get('mapping_writes')==94 and data.get('accepted_count')==94 and data.get('supplier_calls')==0 and data.get('tourvisor_calls')==0 and data.get('safe_set_sha256')=='d1a529dc1e41057faf5a251ee0fabc4f129cd1882d1eb60909c65515ec2af7b5'
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed' if good else data.get('status','unknown_do_not_replay'),'source_sha':os.environ['GITHUB_SHA'],'remote_exit_code':int(os.environ['RC']),'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':data.get('database_writes',0),'mapping_writes':data.get('mapping_writes',0),'accepted_by_lane':data.get('accepted_by_lane'),'safe_set_sha256':data.get('safe_set_sha256'),'mapping_digest':data.get('mapping_digest'),'supplier_calls':0,'tourvisor_calls':0,'no_replay':True};d.joinpath('receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          summary=f"MATCH #1971 containment digest write {receipt['state']}: writes={receipt['database_writes']} lanes={receipt['accepted_by_lane']} committed={data.get('committed')} readback={data.get('readback_verified')} rc={receipt['remote_exit_code']}; supplier/TV=0; op {os.environ['OPERATION_ID']} NO-REPLAY."
          d.joinpath('summary.md').write_text(summary+'\n');print(summary)
          if not good: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-baseline-gap-containment-digest-write-${{ github.run_id }}-result
          path: |
            ${{ env.OUT }}/reservation.json
            ${{ env.OUT }}/result.json
            ${{ env.OUT }}/receipt.json
            ${{ env.OUT }}/summary.md
            ${{ env.OUT }}/live.stdout
            ${{ env.OUT }}/live.stderr
          retention-days: 90
      - name: Record result
        if: always() && hashFiles(format('{0}/summary.md', env.OUT)) != ''
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md" || true
