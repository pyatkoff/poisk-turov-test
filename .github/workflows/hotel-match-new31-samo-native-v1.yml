name: MATCH new31 direct SAMO native acquisition v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_new31_samo_native_v1.php
      - .github/workflows/hotel-match-new31-samo-native-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency:
  group: hotel-match-new31-samo-native-1971-20260920-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-new31-samo-native-1971-20260920-v1
  BASE_SHA: 6cf5cc3e59e12ff02700056cee8f283f22142375
  SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
  CLAIM: '5750698780'
  INPUT_SHA: 3f7ffe8224ca0ca346fa24d00980ea46d54f9a7caf6ca2fd178c26995856695b
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/match-new31-samo-native-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and unchanged dependencies
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir -p inputs payload/inputs payload/source/scripts/diagnostics payload/source/app/integrations result
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import os,subprocess
          assert set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())=={'scripts/diagnostics/hotel_match_new31_samo_native_v1.php','.github/workflows/hotel-match-new31-samo-native-v1.yml'}
          pins={'scripts/diagnostics/hotel_match_anex_effective_coverage.php':'1b5190727690f50a4cdd606c48afa575978ec48e','app/integrations/anex-search-mapping-registry.php':'cc135a95d2a6e0f73ce50be2141c9b8a26fddc58','app/integrations/andromeda-client.php':'83e4bdd5a76979b1ab505cd165c95e6ff47cf648','app/integrations/andromeda-transport.php':'162e33d3f1997ec7e73e1ef276c586d4732f8957','app/integrations/andromeda-network-transport-failure.php':'df4402fa7d3da98363c8a579ff27587d8d91d917'}
          for p,s in pins.items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==s
          PY
          php -l scripts/diagnostics/hotel_match_new31_samo_native_v1.php
          php scripts/diagnostics/hotel_match_new31_samo_native_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > inputs/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('inputs/claim.json'));assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
          for s in (os.environ['OPERATION_ID'],os.environ['BASE_SHA'],os.environ['INPUT_SHA'],'total cap100','Tourvisor/direct-ANEX calls0','DB/mapping writes0','day ledgers untouched'):assert s in c['body'],s
          PY
          cp scripts/diagnostics/hotel_match_new31_samo_native_v1.php scripts/diagnostics/hotel_match_anex_effective_coverage.php payload/source/scripts/diagnostics/
          cp app/integrations/anex-search-mapping-registry.php app/integrations/andromeda-client.php app/integrations/andromeda-transport.php app/integrations/andromeda-network-transport-failure.php payload/source/app/integrations/
      - name: Reuse immutable input and saved catalog before HTTP
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10608051715/zip > inputs/intake.zip
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10588338849/zip > inputs/retained.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os
          p=pathlib.Path('payload/inputs');a=pathlib.Path('inputs/intake.zip');b=pathlib.Path('inputs/retained.zip')
          assert hashlib.sha256(a.read_bytes()).hexdigest()=='cfff3efec20fb8e1d6768836eee65ba6de3eab6a64c9ec89c2296bef90d2af60'
          assert hashlib.sha256(b.read_bytes()).hexdigest()=='f360237113f3c65003fc564efab5749f2ecc66fed41881a3043b526e7b3db5fc'
          with zipfile.ZipFile(a) as z:raw=z.read('server/result.json')
          assert hashlib.sha256(raw).hexdigest()==os.environ['INPUT_SHA'];(p/'intake.json').write_bytes(raw);intake=json.loads(raw);targets=[d for d in intake['dossiers'] if d['state']=='new_missing_samo_edge_needs_evidence_dedupe'];assert len(targets)==31 and all(d['local_hotel_id']!=420 for d in targets)
          natives={str(n) for d in targets for n in d['anex_native_ids']}
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values():yield from walk(v)
              elif isinstance(x,list):
                  for v in x:yield from walk(v)
          with zipfile.ZipFile(b) as z:
              raw=z.read('server/result.json');assert hashlib.sha256(raw).hexdigest()=='34c0f56d9640c0e29bc59d2c7355dad3728fe421e18db55e528eba013cb58e3b';(p/'retained153.json').write_bytes(raw)
              mraw=z.read('server/raw-manifest.json');assert hashlib.sha256(mraw).hexdigest()=='b875e632c53ef6f86b674f88a7067762ea846d0eaef600393623c1a2053521d3';manifest={x['file']:x for x in json.loads(mraw)['files']}
              names=['raw-state-d1.json','raw-state-d3.json','raw-state-d9.json','raw-catalog-23adc36e99d0.json']
              for n in names:
                  data=z.read('server/'+n);assert hashlib.sha256(data).hexdigest()==manifest[n]['sha256'];(p/n).write_bytes(data)
              for n in z.namelist():
                  if not(n.startswith('server/raw-price-') and n.endswith('.json')):continue
                  data=z.read(n);assert hashlib.sha256(data).hexdigest()==manifest[n.removeprefix('server/')]['sha256']
                  for row in walk(json.loads(data)):
                      o=row.get('original')
                      assert not(isinstance(o,dict) and str(row.get('operatorKey'))=='5' and str(o.get('hotelKey')) in natives),'saved_native_bridge_found_stop_before_new_HTTP'
          (p/'saved-evidence-readback.json').write_text(json.dumps({'intake_sha256':os.environ['INPUT_SHA'],'saved_native_hits':0,'reused_files':names,'tourvisor_calls':0},sort_keys=True)+'\n')
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed':assert r['conclusion']=='success';print('SECURITY_OK',r['id']);break
              time.sleep(5)
          else:raise SystemExit('security_not_available')
          PY
      - name: Reserve before supplier or database access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('payload');digests={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in p.rglob('*') if x.is_file()}
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'base_sha':os.environ['BASE_SHA'],'claim_id':int(os.environ['CLAIM']),'state':'reserved_before_access','input_sha256':os.environ['INPUT_SHA'],'file_sha256':digests,'provider_call_cap':100,'tourvisor_calls':0,'database_writes':0,'mapping_writes':0,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True)+'\n').encode()
          with (p/'reservation.json').open('xb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          pathlib.Path('result/reservation.json').write_bytes(raw);digests['reservation.json']=hashlib.sha256(raw).hexdigest();(p/'SHA256SUMS').write_text(''.join(v+'  '+k+'\n' for k,v in sorted(digests.items())))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-new31-native-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Acquire only needed SAMO native hotel evidence once
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          AU: '${{ secrets.ANDROMEDA_USERNAME }}'
          AP: '${{ secrets.ANDROMEDA_PASSWORD }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077;test -n "$KEY_VALUE";test -n "$HOST_VALUE";test -n "$USER_VALUE";test -n "$AU";test -n "$AP";key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null;test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" -r payload/source payload/inputs payload/reservation.json payload/SHA256SUMS "$remote:$op/"
          set +e
          printf '%s\n%s\n' "$AU" "$AP" | ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";sha256sum -c SHA256SUMS >/dev/null;cd \"\$HOME/www/anytoour.ru\";MATCH_OPERATION_ID='$OPERATION_ID' MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$SOURCE_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d zend.exception_ignore_args=1 -d memory_limit=768M \"\$HOME/$op/source/scripts/diagnostics/hotel_match_new31_samo_native_v1.php\"" > result/remote.stdout 2> result/remote.stderr
          rc=$?
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";tar -czf - -- *.json" > result/server-operation.tgz 2>>result/remote.stderr
          trc=$?;set -e;printf '{"remote":%s,"tar":%s}\n' "$rc" "$trc">result/exit-codes.json;test "$trc" -eq 0
      - name: Independently read back every response and physical reservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,re
          p=pathlib.Path('result');s=p/'server';s.mkdir(exist_ok=True)
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              seen=set()
              for m in t.getmembers():
                  assert m.isfile() and m.size<=64000000 and re.fullmatch(r'[a-z0-9.-]+\.json',m.name) and m.name not in seen
                  seen.add(m.name);(s/m.name).write_bytes(t.extractfile(m).read())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          r=json.loads((s/'result.json').read_bytes());q=json.loads((s/'receipt.json').read_bytes());digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert q['result_sha256']==digest and q['readback_verified'] is True and r['source_sha']==q['source_sha']==os.environ['SOURCE_SHA'] and r['operation_id']==q['operation_id']==os.environ['OPERATION_ID']
          assert r['tourvisor_calls']==r['direct_anex_calls']==r['database_writes']==r['mapping_writes']==0 and r['safe_to_write_now'] is False
          reservations=sorted(s.glob('call-*-reservation.json'));assert len(reservations)==r['provider_calls']<=100
          for i,f in enumerate(reservations,1):
              a=json.loads(f.read_bytes());assert a['seq']==i and a['state']=='reserved_unknown_before_http'
              receipt=s/f.name.replace('-reservation.json','-receipt.json')
              if receipt.exists():
                  b=json.loads(receipt.read_bytes());assert b['seq']==i
                  if a['action']!='login':
                      h=json.loads((s/f.name.replace('call-','raw-http-').replace('-reservation.json','.json')).read_bytes());assert h['status']==b['status'] and hashlib.sha256(h['body'].encode()).hexdigest()==b['body_sha256']
          summary={'state':r['state'],'provider_calls':r['provider_calls'],'state_counts':r.get('state_counts'),'reason':r.get('reason'),'result_sha256':digest};(p/'verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          assert r['state']==q['state']=='completed_read_only' and r['input_count']==31 and r['active_count']+r['skipped_count']==31 and len(r['dossiers'])==r['active_count']
          assert all(d['safe_to_write_now'] is False for d in r['dossiers'])
          assert json.loads((p/'exit-codes.json').read_bytes())=={'remote':0,'tar':0}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-new31-native-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
