name: TEMP Search3 no-photo generator
on:
  push:
    branches: [ux/search3-no-photo-density-20260912]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-no-photo-density-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix scripts/build/search3-js --ignore-scripts
      - name: Patch source and acceptance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/search3/styles/results-layout.css'); s=p.read_text()
          a="& .stars-badge{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;min-height:32px;padding:5px 11px;border-radius:999px;background:#fff;color:#2743cb;font-size:14px;font-weight:700;box-shadow:0 3px 12px #17233b1a}\n"
          b=a+"& .hotel-main:has(.photo-placeholder){grid-template-columns:1fr}\n& .hotel-photo:has(.photo-placeholder){min-height:0;padding:14px 20px 0;background:transparent;overflow:visible}\n& .hotel-photo:has(.photo-placeholder) .photo-placeholder{display:none}\n& .hotel-photo:has(.photo-placeholder) .stars-badge{position:static;box-shadow:none;background:var(--at-soft-blue,#eef2ff)}\n& .hotel-photo:has(.photo-placeholder):not(:has(.stars-badge)){display:none}\n"
          if b not in s:
            assert s.count(a)==1; s=s.replace(a,b)
          a="& .hotel-photo{flex:0 0 auto;width:100%;height:auto;min-height:0;aspect-ratio:16/7;max-height:190px}\n"
          b=a+"& .hotel-photo:has(.photo-placeholder){aspect-ratio:auto;max-height:none;padding:14px 18px 0}\n"
          if b not in s:
            assert s.count(a)==1; s=s.replace(a,b)
          a="@media(max-width:430px){\n& .hotel-body{padding:16px}\n"; b="@media(max-width:430px){\n& .hotel-photo:has(.photo-placeholder){padding-inline:16px}\n& .hotel-body{padding:16px}\n"
          if b not in s:
            assert s.count(a)==1; s=s.replace(a,b)
          p.write_text(s)
          p=Path('tests/search3-current-results-browser.cjs'); s=p.read_text()
          a="    await page.locator('#sortResults').selectOption('rating');\n    assert.equal(await page.locator('#results .hotel-card').first().getAttribute('data-hotel-id'), 'expensive', 'rating sorting retained');\n    await page.evaluate(() => window.dispatchEvent(new CustomEvent('v2:search-started', { detail: { searchId: 44 } })));\n"
          b="    await page.locator('#sortResults').selectOption('rating');\n    assert.equal(await page.locator('#results .hotel-card').first().getAttribute('data-hotel-id'), 'expensive', 'rating sorting retained');\n    await page.evaluate(items => window.V2Results.render([{ ...items[0], id: 'no-photo', name: 'Отель без фотографии', picturelink: '' }]), hotels);\n    const noPhoto = page.locator('#results [data-hotel-id=no-photo].hotel-card');\n    const noPhotoGeometry = await noPhoto.evaluate(node => { const box = element => { const r = element.getBoundingClientRect(); return { x:r.x, y:r.y, width:r.width, height:r.height }; }; return { main:box(node.querySelector('.hotel-main')), media:box(node.querySelector('.hotel-photo')), body:box(node.querySelector('.hotel-body')), placeholder:getComputedStyle(node.querySelector('.photo-placeholder')).display, stars:getComputedStyle(node.querySelector('.stars-badge')).display }; });\n    assert.equal(noPhotoGeometry.placeholder, 'none', 'missing photo never reserves a branded fake image');\n    assert.notEqual(noPhotoGeometry.stars, 'none', 'hotel category stays visible when photo is absent');\n    assert.ok(noPhotoGeometry.media.height < 64, 'missing-photo header stays compact instead of reserving media height: '+JSON.stringify({width,previous,noPhotoGeometry}));\n    assert.ok(noPhotoGeometry.body.width >= noPhotoGeometry.main.width - 2, 'missing-photo facts use the card content width');\n    assert.equal((await snapshot(page)).overflow, false, width + ': missing-photo card fits the viewport');\n    if (!previous && [375,1024,1440].includes(width)) await page.screenshot({ path: path.join(output, `results-no-photo-${width}.png`), fullPage: true });\n    await page.evaluate(() => window.dispatchEvent(new CustomEvent('v2:search-started', { detail: { searchId: 44 } })));\n"
          if b not in s:
            assert s.count(a)==1; s=s.replace(a,b)
          p.write_text(s)
          PY
      - run: python3 scripts/build/search3_assets.py --write
      - run: python3 scripts/build/search3_assets.py --check
      - name: Commit generated package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/search3/styles/results-layout.css v2/search3-results-filters-v1.css docs/project/search3-production-import.json tests/search3-current-results-browser.cjs
          git diff --cached --quiet && exit 0
          git commit -m 'SEARCH: compact cards without hotel photos [generated no-photo]'
          git push origin HEAD:ux/search3-no-photo-density-20260912
