name: Validate V2 SEO structure

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-page-primitives-v1.php'
      - 'v2/seo-page-registry-v1.php'
      - 'v2/seo-internal-links-v1.php'
      - 'v2/seo-page-graph-v1.php'
      - 'v2/seo-page-types-v1.php'
      - '.github/workflows/validate-v2-seo-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-v2-seo-structure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  seo-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate stable first-party path contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-page-primitives-v1.php
          php -l v2/seo-page-registry-v1.php
          php -l v2/seo-internal-links-v1.php
          php <<'PHP'
          <?php
          require 'v2/seo-page-registry-v1.php';
          function fail_stable($m){fwrite(STDERR,"SEO_STABLE_PATH_FAIL:$m\n"); exit(1);}

          if (v2_seo_stable_internal_href('/country/turkey/')!=='/country/turkey/') fail_stable('stable_path_rejected');
          foreach (['/country/turkey/?country=4','/country/turkey/#offers','https://example.com/','//example.com/'] as $unstable) {
              if (v2_seo_stable_internal_href($unstable)!==null) fail_stable('unstable_path_allowed');
          }

          $crumbs=v2_seo_render_breadcrumbs([
              ['label'=>'Главная','href'=>'/'],
              ['label'=>'Search state','href'=>'/country/turkey/?country=4'],
              ['label'=>'External','href'=>'https://example.com/'],
              ['label'=>'Анталья','href'=>'/resort/antalya/'],
          ]);
          if (str_contains($crumbs,'?country=4') || str_contains($crumbs,'example.com')) fail_stable('breadcrumbs_unstable_link');
          if (str_contains($crumbs,'href="/resort/antalya/"')) fail_stable('breadcrumbs_current_self_link');
          if (substr_count($crumbs,'aria-current="page"')!==1) fail_stable('breadcrumbs_single_current');

          $related=v2_seo_render_related_links('Популярные направления',[
              ['label'=>'Турция','href'=>'/country/turkey/'],
              ['label'=>'Search state','href'=>'/poisk-turov-test/v2/?country=4'],
          ]);
          if (!str_contains($related,'href="/country/turkey/"') || str_contains($related,'?country=4')) fail_stable('related_boundary');

          $groups=v2_seo_internal_link_groups([[
              'title'=>'Направления',
              'links'=>[
                  ['label'=>'Турция','href'=>'/country/turkey/'],
                  ['label'=>'Search state','href'=>'/poisk-turov-test/v2/?country=4'],
              ],
          ]]);
          if (count($groups)!==1 || count($groups[0]['links'])!==1) fail_stable('internal_group_boundary');

          foreach (['/poisk-turov-test/v2/?country=4','/poisk-turov-test/v2/#results'] as $badSearchPath) {
              try { v2_seo_search_handoff_url($badSearchPath,['country'=>4]); fail_stable('unstable_handoff_allowed'); }
              catch (InvalidArgumentException $e) {}
          }

          foreach (['/country/turkey/?country=4','/country/turkey/#offers'] as $badRegistryPath) {
              try {
                  v2_seo_page_registry([['path'=>$badRegistryPath,'type'=>'country','data'=>[
                      'name'=>'Турция','h1'=>'Туры в Турцию',
                      'description'=>'Достаточно длинное описание для проверки стабильного пути страницы.'
                  ]]]);
                  fail_stable('unstable_registry_allowed');
              } catch (InvalidArgumentException $e) {}
          }

          echo "V2_SEO_STABLE_PATHS_OK helper=1 breadcrumbs=1 related=1 groups=1 handoff=1 registry=1\n";
          PHP

      - name: Validate registered relationship graph
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-page-graph-v1.php
          php <<'PHP'
          <?php
          require 'v2/seo-page-graph-v1.php';
          function fail_graph($m){fwrite(STDERR,"SEO_GRAPH_FAIL:$m\n"); exit(1);}

          $registry=v2_seo_page_registry([
              ['path'=>'/country/turkey/','type'=>'country','data'=>[
                  'name'=>'Турция','h1'=>'Туры в Турцию','description'=>'Редакционная страница о турах в Турцию для проверки SEO-графа AnyTour.'
              ]],
              ['path'=>'/resort/antalya/','type'=>'resort','data'=>[
                  'name'=>'Анталья','h1'=>'Туры в Анталью','description'=>'Редакционная страница о турах в Анталью для проверки SEO-графа AnyTour.'
              ]],
              ['path'=>'/resort/alanya/','type'=>'resort','data'=>[
                  'name'=>'Аланья','h1'=>'Туры в Аланью','description'=>'Редакционная страница о турах в Аланью для проверки SEO-графа AnyTour.'
              ]],
          ]);

          $graph=v2_seo_page_graph($registry,[
              '/resort/antalya/'=>['parent'=>'/country/turkey/','related'=>['/resort/alanya/','/resort/alanya/','/resort/antalya/']],
              '/resort/alanya/'=>['parent'=>'/country/turkey/','related'=>['/resort/antalya/']],
          ]);
          if (($graph['/resort/antalya/']['parent']??null)!=='/country/turkey/') fail_graph('parent');
          if (($graph['/resort/antalya/']['related']??[])!==['/resort/alanya/']) fail_graph('related_dedupe');
          $group=v2_seo_graph_link_group($registry,$graph,'/resort/antalya/','Другие курорты Турции');
          if (($group['links'][0]['label']??'')!=='Аланья' || ($group['links'][0]['href']??'')!=='/resort/alanya/') fail_graph('link_group');

          try { v2_seo_page_graph($registry,['/resort/unknown/'=>[]]); fail_graph('unregistered_source_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_page_graph($registry,['/resort/antalya/'=>['parent'=>'/country/unknown/']]); fail_graph('unregistered_parent_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_page_graph($registry,['/resort/antalya/'=>['related'=>['/resort/unknown/']]]); fail_graph('unregistered_related_allowed'); }
          catch (InvalidArgumentException $e) {}
          try { v2_seo_page_graph($registry,[
              '/country/turkey/'=>['parent'=>'/resort/antalya/'],
              '/resort/antalya/'=>['parent'=>'/country/turkey/'],
          ]); fail_graph('cycle_allowed'); }
          catch (InvalidArgumentException $e) {}

          echo "V2_SEO_PAGE_GRAPH_OK registeredOnly=1 parents=1 related=1 cyclesRejected=1\n";
          PHP
