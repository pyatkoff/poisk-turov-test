name: Validate anytoour.ru migrated content

on:
  workflow_run:
    workflows: ["Deploy anytoour.ru"]
    types: [completed]
  workflow_dispatch:

jobs:
  live-content:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check migrated routes
        shell: bash
        run: |
          set -euo pipefail
          check_page(){
            local path="$1" marker="$2" canonical="$3" out code
            out="/tmp/page-$(echo "$path" | tr '/-' '__').html"
            code="$(curl -fsSL -o "$out" -w '%{http_code}' --max-time 45 "https://anytoour.ru$path")"
            echo "$path HTTP=$code"
            test "$code" = "200"
            grep -Fq "$marker" "$out"
            grep -Fq "<link rel=\"canonical\" href=\"$canonical\"" "$out"
            grep -Fq 'name="robots" content="noindex,follow' "$out"
            grep -Fq '/images/logo.svg' "$out"
          }
          check_country_handoff(){
            local slug="$1" country_id="$2" out
            out="/tmp/page__country_${slug}_.html"
            grep -Eq "href=['\"]\/poisk-turov\/\?country=${country_id}['\"]" "$out"
            echo "/country/$slug/ -> /poisk-turov/?country=$country_id OK"
          }
          check_page '/contacts/' 'Свяжитесь с AnyTour' 'https://anytoour.ru/contacts/'
          check_page '/how-to-buy/' 'Как купить тур онлайн' 'https://anytoour.ru/how-to-buy/'
          check_page '/hot/' 'Горящие туры без рекламной магии' 'https://anytoour.ru/hot/'
          check_page '/country/' 'Туры по странам' 'https://anytoour.ru/country/'
          check_page '/rb/' 'Раннее бронирование без спешки' 'https://anytoour.ru/rb/'
          check_page '/country/turkey/' 'Туры в Турцию' 'https://anytoour.ru/country/turkey/'
          check_page '/country/egypt/' 'Туры в Египет' 'https://anytoour.ru/country/egypt/'
          check_page '/country/oae/' 'Туры в ОАЭ' 'https://anytoour.ru/country/oae/'
          check_page '/country/tailand/' 'Туры в Таиланд' 'https://anytoour.ru/country/tailand/'
          check_page '/country/russia/' 'Туры в Россию' 'https://anytoour.ru/country/russia/'
          check_country_handoff turkey 4
          check_country_handoff egypt 1
          check_country_handoff oae 9
          check_country_handoff tailand 2
          check_country_handoff russia 47
          echo 'ANYTOOUR_MIGRATED_CONTENT_OK'
