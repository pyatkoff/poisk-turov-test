name: Validate anytoour.ru migrated content

on:
  workflow_run:
    workflows: ["Deploy anytoour.ru"]
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate-anytoour-content-live.yml'
      - 'v2/seo-launch-slice-v1.php'
      - 'v2/seo-controlled-launch-catalog-v1.php'
      - 'v2/seo-content-pilot-seasonal-september-v1.php'
      - 'v2/seo-seasonal-page-v1.php'
      - 'v2/country/turkey/antalya/september/**'
      - 'v2/country/maldives/september/**'
  workflow_dispatch:

jobs:
  live-content:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check migrated routes
        shell: bash
        run: |
          set -euo pipefail
          page_out(){ local path="$1"; printf '/tmp/page-%s.html' "$(echo "$path" | tr '/-' '__')"; }
          check_page(){
            local path="$1" marker="$2" canonical="$3" robots="${4:-noindex,follow}" out code
            out="$(page_out "$path")"
            code="$(curl -fsSL -o "$out" -w '%{http_code}' --max-time 45 "https://anytoour.ru$path")"
            echo "$path HTTP=$code robots=$robots"
            test "$code" = "200"
            grep -Fq "$marker" "$out"
            grep -Fq "<link rel=\"canonical\" href=\"$canonical\"" "$out"
            grep -Fq "name=\"robots\" content=\"$robots" "$out"
            grep -Fq '/images/logo.svg' "$out"
          }
          check_search_handoff(){
            local out="$1" country_id="$2" region_id="${3:-}"
            python3 - "$out" "$country_id" "$region_id" <<'PY'
          import sys
          from html.parser import HTMLParser
          from urllib.parse import parse_qs, urlparse
          file_name, expected_country, expected_region = sys.argv[1:4]
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.hrefs=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='a':
                      href=dict(attrs).get('href')
                      if href: self.hrefs.append(href)
          parser=Links()
          with open(file_name,encoding='utf-8') as fh: parser.feed(fh.read())
          candidates=[]
          for href in parser.hrefs:
              parsed=urlparse(href)
              if parsed.path!='/poisk-turov/': continue
              candidates.append(href); query=parse_qs(parsed.query)
              if query.get('country') != [expected_country]: continue
              if expected_region and query.get('region') != [expected_region]: continue
              sys.exit(0)
          print('SEARCH_HANDOFF_MISMATCH',f'expected_country={expected_country}',f'expected_region={expected_region or "-"}','candidates='+repr(candidates),file=sys.stderr)
          sys.exit(1)
          PY
          }
          check_country_handoff(){ local slug="$1" country_id="$2"; check_search_handoff "$(page_out "/country/$slug/")" "$country_id"; }
          check_resort_handoff(){
            local slug="$1" region_id="$2" out; out="$(page_out "/country/turkey/$slug/")"; check_search_handoff "$out" 4 "$region_id"
            if grep -Fq '<section class="sp-card sp-offer-snapshot"' "$out"; then grep -Fq 'Посмотреть туры' "$out"; fi
          }
          check_seasonal_handoff(){
            local path="$1" country_id="$2" region_id="${3:-}" out; out="$(page_out "$path")"; check_search_handoff "$out" "$country_id" "$region_id"
            if grep -Fq '<section class="sp-card sp-offer-snapshot"' "$out"; then grep -Fq 'Посмотреть туры' "$out"; fi
          }

          check_page '/contacts/' 'Свяжитесь с AnyTour' 'https://anytoour.ru/contacts/'
          check_page '/how-to-buy/' 'Как купить тур онлайн' 'https://anytoour.ru/how-to-buy/'
          check_page '/hot/' 'Горящие туры из живых поисков' 'https://anytoour.ru/hot/'
          check_page '/country/' 'Туры по странам' 'https://anytoour.ru/country/'
          check_page '/rb/' 'Раннее бронирование без спешки' 'https://anytoour.ru/rb/'
          check_page '/country/turkey/' 'Туры в Турцию' 'https://anytoour.ru/country/turkey/' 'index,follow'
          check_page '/country/egypt/' 'Туры в Египет' 'https://anytoour.ru/country/egypt/' 'index,follow'
          check_page '/country/maldives/' 'Туры на Мальдивы' 'https://anytoour.ru/country/maldives/' 'index,follow'
          check_page '/country/oae/' 'Туры в ОАЭ' 'https://anytoour.ru/country/oae/'
          check_page '/country/tailand/' 'Туры в Таиланд' 'https://anytoour.ru/country/tailand/'
          check_page '/country/russia/' 'Туры по России' 'https://anytoour.ru/country/russia/'
          check_page '/country/turkey/kemer/' 'Туры в Кемер' 'https://anytoour.ru/country/turkey/kemer/' 'index,follow'
          check_page '/country/turkey/antalya/' 'Туры в Анталью' 'https://anytoour.ru/country/turkey/antalya/' 'index,follow'
          check_page '/country/turkey/side/' 'Туры в Сиде' 'https://anytoour.ru/country/turkey/side/' 'index,follow'
          check_page '/country/turkey/belek/' 'Туры в Белек' 'https://anytoour.ru/country/turkey/belek/' 'index,follow'
          check_page '/country/turkey/alanya/' 'Туры в Аланью' 'https://anytoour.ru/country/turkey/alanya/' 'index,follow'
          check_page '/country/turkey/antalya/september/' 'Туры в Анталью в сентябре' 'https://anytoour.ru/country/turkey/antalya/september/' 'index,follow'
          check_page '/country/maldives/september/' 'Туры на Мальдивы в сентябре' 'https://anytoour.ru/country/maldives/september/' 'index,follow'

          check_country_handoff turkey 4
          check_country_handoff egypt 1
          check_country_handoff maldives 8
          check_country_handoff oae 9
          check_country_handoff tailand 2
          check_country_handoff russia 47
          check_resort_handoff kemer 22
          check_resort_handoff antalya 20
          check_resort_handoff side 23
          check_resort_handoff belek 21
          check_resort_handoff alanya 19
          check_seasonal_handoff '/country/turkey/antalya/september/' 4 20
          check_seasonal_handoff '/country/maldives/september/' 8
          echo 'ANYTOOUR_MIGRATED_CONTENT_OK controlled_indexable=10 seasonal=2'
