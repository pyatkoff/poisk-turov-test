name: INT read failed Andromeda local DB seed v3

on:
  push:
    branches:
      - 'ops/int-andromeda-local-db-seed-20260918-v3'
    paths:
      - '.github/workflows/int-andromeda-local-db-seed-v3-readback.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
      ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
      ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
    steps:
      - name: Read sealed v3 state without supplier access
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"
          if [[ "$ANYTOOUR_DEPLOY_SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$ANYTOOUR_DEPLOY_SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$ANYTOOUR_DEPLOY_SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          remote="$ANYTOOUR_DEPLOY_USER@$ANYTOOUR_DEPLOY_HOST"
          mkdir -p evidence
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 "$remote" 'bash -s' > evidence/readback.json <<'REMOTE'
          set -euo pipefail
          op="$HOME/.anytour-ops/int-andromeda-local-db-seed-1717-20260918-v3"
          site="$HOME/www/anytoour.ru"
          test -d "$op" && test -s "$op/state" && test -f "$op/error.log"
          state="$(cat "$op/state")"
          signature="$(python3 - "$op/error.log" <<'PY'
          import pathlib,re,sys,json
          s=pathlib.Path(sys.argv[1]).read_text(errors='ignore')
          codes=re.findall(r'ANDROMEDA_[A-Z0-9_]+|ANYTOUR_[A-Z0-9_]+|andromeda_[a-z0-9_]+',s)
          lines=[re.sub(r'\s+',' ',x).strip() for x in s.splitlines() if x.strip()]
          tail=' | '.join(lines[-5:])[:500]
          tail=re.sub(r'https?://\S+','<url>',tail)
          tail=re.sub(r'/(?:[^\s:|]+/)*[^\s:|]+','<path>',tail)
          tail=re.sub(r'[A-Fa-f0-9]{32,}','<digest>',tail)
          tail=re.sub(r'(?i)(token|password|sid|uid)=\S+',r'\1=<redacted>',tail)
          print(json.dumps({'code':codes[-1] if codes else 'NO_TYPED_CODE','tail':tail},sort_keys=True))
          PY
          )"
          cd "$site"
          php -d display_errors=0 <<'PHP' > /tmp/andromeda-v3-db.json
          <?php
          declare(strict_types=1);
          require 'config.php';
          $f=is_file('data/db-v1.php')?'data/db-v1.php':'v2/data/db-v1.php'; require $f;
          $db=v2_data_db();
          $q=$db->prepare('SELECT COUNT(*) FROM anytour_offers WHERE provider=?');$q->execute(['andromeda']);$offers=(int)$q->fetchColumn();
          $q=$db->prepare('SELECT COUNT(*) FROM anytour_offers WHERE provider=? AND is_active=1');$q->execute(['andromeda']);$active=(int)$q->fetchColumn();
          $q=$db->prepare('SELECT COUNT(*) FROM anytour_offers WHERE provider=? AND final_price_ready=1');$q->execute(['andromeda']);$ready=(int)$q->fetchColumn();
          echo json_encode(['andromeda_offers'=>$offers,'andromeda_active'=>$active,'andromeda_ready'=>$ready,
            'all_offers'=>(int)$db->query('SELECT COUNT(*) FROM anytour_offers')->fetchColumn()],JSON_THROW_ON_ERROR);
          PHP
          python3 - "$state" "$signature" /tmp/andromeda-v3-db.json <<'PY'
          import json,sys
          state,signature,path=sys.argv[1:]
          print(json.dumps({'operation_state':state,'error':json.loads(signature),'db':json.load(open(path)),
            'supplier_calls_in_readback':0,'db_writes_in_readback':0,'replay':False},sort_keys=True))
          PY
          rm -f /tmp/andromeda-v3-db.json
          REMOTE
          cat evidence/readback.json
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-local-seed-v3-readback-${{ github.run_id }}
          path: evidence/
          retention-days: 14
