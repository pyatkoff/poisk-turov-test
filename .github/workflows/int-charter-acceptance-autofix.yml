name: TEMP INT charter acceptance patch

on:
  push:
    branches:
      - fix/int-program-fuel-probe-charter-acceptance-20260924

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/int-program-fuel-probe-charter-acceptance-20260924
      - run: python3 tmp/int_charter_acceptance_patch.py
      - run: python3 -m py_compile scripts/deploy/int_server_executor.py
      - run: python3 tests/int_server_executor_test.py -v
      - run: git diff --check
      - name: Commit source changes when present
        run: |
          if git diff --quiet -- scripts/deploy/int_server_executor.py tests/int_server_executor_test.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/deploy/int_server_executor.py tests/int_server_executor_test.py
          git commit -m 'INT: accept strict Intourist charter probe samples'
          git push origin HEAD:fix/int-program-fuel-probe-charter-acceptance-20260924
