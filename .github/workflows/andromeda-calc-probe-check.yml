name: Andromeda calc probe offline
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/andromeda_calc_probe.py'
      - 'tests/andromeda_calc_probe_test.py'
      - '.github/workflows/andromeda-calc-probe-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact calc-only source offline
        run: |
          python3 -m py_compile scripts/diagnostics/andromeda_calc_probe.py tests/andromeda_calc_probe_test.py
          python3 tests/andromeda_calc_probe_test.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/andromeda_calc_probe.py').read_text()
          assert "action'=>'calc'" in s and "CURLOPT_POST=>true" in s
          assert "action'=>'get_flights'" not in s and "action'=>'changeservice'" not in s and "action'=>'bron'" not in s
          assert "booking_calls'=>0" in s and "automatic_retry'=>false" in s
          print('Andromeda calc static safety: PASS')
          PY
