name: MATCH current missing-third strict review v6
on:
  push:
    branches:
      - ops/match-current-missing-third-strict-review-1971-20260911-v6
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: match-current-missing-third-strict-review-v6
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-current-missing-third-strict-review-1971-20260911-v6
  SOURCE_OPERATION_ID: hotel-match-current-missing-third-strict-review-1971-20260911-v1
  EXPECTED_SCRIPT_BLOB: d26c98b3e7d37522e58425dacb97a7b163b41fbd
  EXPECTED_BASE_SHA: eba273417245a95324fc2ca86ca4249ed87e7821
  STATE: /tmp/m3review-v6
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify and prepare read-only payload
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$(cat .github/match-current-missing-third-strict-review-1971-v6.arm)" = "$OPERATION_ID"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git hash-object scripts/diagnostics/hotel_match_current_missing_third_strict_review.php)" = "$EXPECTED_SCRIPT_BLOB"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]+' scripts/diagnostics/hotel_match_current_missing_third_strict_review.php
          ! grep -Eiq 'https?://|/tours/|bookTour|createOrder|sendLead|curl_' scripts/diagnostics/hotel_match_current_missing_third_strict_review.php
          rm -rf "$STATE"; mkdir -m 700 -p "$STATE"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          src=Path('scripts/diagnostics/hotel_match_current_missing_third_strict_review.php').read_text()
          old=os.environ['SOURCE_OPERATION_ID']; new=os.environ['OPERATION_ID']
          if src.count(old)!=1: raise SystemExit('operation_shape_changed')
          src=src.replace(old,new,1); p=Path(os.environ['STATE']); (p/'live.php').write_text(src); (p/'payload_sha256.txt').write_text(hashlib.sha256(src.encode()).hexdigest()+'\n')
          PY
          php -l "$STATE/live.php"
          key="$RUNNER_TEMP/m3r6.key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Establish zero-DB SSH master
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/m3r6.key"; sock="$RUNNER_TEMP/m3r6.sock"; kh="$RUNNER_TEMP/m3r6.kh"
          ssh -M -S "$sock" -fnNT -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$kh" -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ControlPersist=300 -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE"
          ssh -S "$sock" -T -o ControlMaster=no -o BatchMode=yes -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && test -f config.php'
      - name: Reserve before CURRENT DB read
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE']); p=s/'live.php'; x={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_read','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'classifier_blob':os.environ['EXPECTED_SCRIPT_BLOB'],'payload_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}; raw=json.dumps(x,sort_keys=True,indent=2)+'\n'; (s/'reservation.json').write_text(raw)
          if (s/'reservation.json').read_text()!=raw: raise SystemExit('reservation_readback_failed')
          PY
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: match-current-missing-third-v6-${{ github.run_id }}-reserved
          path: ${{ env.STATE }}/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Execute CURRENT DB mass review
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          sock="$RUNNER_TEMP/m3r6.sock"
          set +e
          ssh -T -S "$sock" -o ControlMaster=no -o BatchMode=yes -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$STATE/live.php" > "$STATE/live.stdout" 2> "$STATE/live.stderr"
          rc=$?; set -e; export RC="$rc"
          ssh -S "$sock" -O exit -o LogLevel=ERROR -l "$USER_VALUE" "$HOST_VALUE" >/dev/null 2>&1 || true
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          s=Path(os.environ['STATE']); out=(s/'live.stdout').read_text(errors='replace'); err=(s/'live.stderr').read_text(errors='replace'); data=None
          for line in reversed([x for x in out.splitlines() if x.strip()]):
              try: obj=json.loads(line)
              except Exception: continue
              if isinstance(obj,dict): data=obj; break
          if not isinstance(data,dict): data={'operation_id':os.environ['OPERATION_ID'],'status':'unknown','reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stdout_sha256':hashlib.sha256(out.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(err.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          else:
              if data.get('operation_id')!=os.environ['OPERATION_ID']: raise SystemExit('operation_mismatch')
              if any(int(data.get(k,0))!=0 for k in ('database_writes','mapping_writes','supplier_calls')): raise SystemExit('readonly_guard')
              data.update(run_id=int(os.environ['GITHUB_RUN_ID']),source_sha=os.environ['GITHUB_SHA'],remote_exit=int(os.environ['RC']),no_replay=True)
          (s/'result.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          if int(os.environ['RC'])!=0 or data.get('status')!='completed': raise SystemExit(1)
          PY
      - name: Preserve final
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-current-missing-third-v6-${{ github.run_id }}-final
          path: ${{ env.STATE }}/
          if-no-files-found: error
          retention-days: 90
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['STATE'],'result.json').read_text()); c=r.get('coverage') or {}; p=r.get('safe_by_provider') or {}; msg=f"MATCH #1971 CURRENT strict cascade v6 COMPLETED read-only / NO-REPLAY after former-name +2. Coverage triple {c.get('all_three')}, exactly-two {c.get('exactly_two')}, ANEX links {c.get('anex_links')}, ANEX unique {c.get('anex_unique_local')}, Andromeda unique {c.get('andromeda_unique_local')}. Prepared SAFE **{r.get('safe_count')}** = ANEX **{p.get('anex',0)}** + Andromeda **{p.get('andromeda',0)}**, live-observed **{r.get('safe_observed')}**; deferred **{r.get('deferred_count')}**, hard conflicts **{r.get('hard_conflict_count')}**. DB/mapping/supplier/Tourvisor writes/calls0. Artifact `{os.environ['ARTIFACT_ID']}`."
          Path(os.environ['STATE'],'comment.md').write_text(msg+'\n')
          PY
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
          gh issue comment 996 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/comment.md"
