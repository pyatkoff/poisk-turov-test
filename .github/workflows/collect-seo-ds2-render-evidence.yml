name: Collect SEO DS2 render evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
  push:
    branches: [main]
    paths:
      - 'v2/seo-resort-page-v1.php'
      - 'v2/seo-hotel-tour-page-v1.php'
      - 'v2/seo-offer-snapshot-v1.php'
      - 'v2/seo-ds2-reference-*.php'
      - 'v2/site-page-shell-v1.php'
      - 'v2/site-page-v1.css'
      - 'v2/seo-editorial-reference-v1.css'
      - 'v2/editorial-ds2-convergence-v1.css'
      - 'v2/country/turkey/kemer/**'
      - 'v2/country/maldives/hotel/the-westin-maldives-miriandhoo-resort-65108/**'
      - 'tools/seo-ds2-live-evidence.cjs'
      - 'tests/seo-ds2-live-evidence-source-contract-smoke.php'
      - '.github/workflows/collect-seo-ds2-render-evidence.yml'

permissions:
  contents: read

concurrency:
  group: seo-ds2-render-evidence
  cancel-in-progress: true

jobs:
  ds2-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate snapshot and hotel review boundaries
        run: |
          set -euo pipefail
          php -l tests/seo-ds2-live-evidence-source-contract-smoke.php >/dev/null
          php tests/seo-ds2-live-evidence-source-contract-smoke.php
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture live DS2 reference evidence
        id: capture
        shell: bash
        run: |
          set +e
          node tools/seo-ds2-live-evidence.cjs
          node_status=$?
          if [ "$node_status" -eq 0 ]; then
            php v2/data/report-seo-ds2-render-evidence-v1.php --evidence=ds2-render-artifacts/raw-evidence.json --require-ready > ds2-render-artifacts/validated-evidence.json 2> ds2-render-artifacts/validation.err
            status=$?
          else
            status=$node_status
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload DS2 screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-ds2-render-evidence-${{ github.run_id }}
          path: ds2-render-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Fail on DS2 evidence drift
        if: always()
        run: test "${{ steps.capture.outputs.exit_code }}" = "0"
