name: Validate V2 primary meal responsive UX
on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/primary-meal-ux-v1.css'
      - 'v2/primary-meal-ux-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-v2-primary-meal-responsive.yml'

permissions:
  contents: read

jobs:
  meal-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build local PR CSS bundle
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "v2/bundle-manifest-v1.php"; foreach (v2_bundle_manifest()["css"] as $f) { echo "\n/* $f */\n"; readfile("v2/".$f); }' > "$RUNNER_TEMP/v2-pr.css"
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify every primary meal choice is visible at 1024px
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/meal-responsive.cjs" <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const css=fs.readFileSync(process.env.RUNNER_TEMP+'/v2-pr.css','utf8');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1024,height:900},ignoreHTTPSErrors:true});
            await page.route('**/poisk-turov-test/v2/bundle-v1.php*',async route=>{
              const u=new URL(route.request().url());
              if(u.searchParams.get('type')==='css')return route.fulfill({status:200,contentType:'text/css',body:css});
              return route.continue();
            });
            const res=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});
            if(!res||res.status()!==200)throw new Error('page http '+(res&&res.status()));
            await page.waitForFunction(()=>document.querySelectorAll('.meal-quick .meal-choice').length>=5,{timeout:15000});
            const state=await page.evaluate(()=>{
              const field=document.querySelector('.main-meal'),wrap=document.querySelector('.meal-quick'),buttons=[...document.querySelectorAll('.meal-quick .meal-choice')];
              const fr=field?.getBoundingClientRect(),wr=wrap?.getBoundingClientRect();
              const info=buttons.map(b=>{const r=b.getBoundingClientRect();return{text:(b.textContent||'').trim(),left:r.left,right:r.right,top:r.top,bottom:r.bottom,visible:r.left>=wr.left-1&&r.right<=wr.right+1};});
              const last=info[info.length-1]||null;
              return {fieldWidth:fr?.width||0,wrapWidth:wr?.width||0,wrapScrollWidth:wrap?.scrollWidth||0,wrapClientWidth:wrap?.clientWidth||0,overflowX:getComputedStyle(wrap).overflowX,flexWrap:getComputedStyle(wrap).flexWrap,buttons:info,last,documentOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};
            });
            console.log('MEAL_1024',JSON.stringify(state));
            await page.screenshot({path:'meal-1024.png',fullPage:true});
            if(state.documentOverflow)throw new Error('document horizontal overflow');
            if(state.flexWrap!=='wrap')throw new Error('meal row does not wrap at 1024');
            if(state.wrapScrollWidth>state.wrapClientWidth+2)throw new Error('meal row still horizontally scrolls');
            if(!state.last||state.last.text!=='Без питания'||!state.last.visible)throw new Error('last meal choice is not fully visible');
            if(state.buttons.some(x=>!x.visible))throw new Error('one or more meal choices are clipped');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node "$RUNNER_TEMP/meal-responsive.cjs"
      - name: Upload 1024 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-meal-responsive-1024-${{ github.event.pull_request.number }}
          path: meal-1024.png
          retention-days: 14
