name: MATCH CURRENT Tourvisor observation to ANEX direct-key check
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_current_tv_anex_observations.php'
      - 'tests/hotel_match_current_tv_anex_observations_test.php'
      - '.github/workflows/hotel-match-current-tv-anex-observations-check.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate pure CURRENT observation classifier
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_current_tv_anex_observations.php
          php -l tests/hotel_match_current_tv_anex_observations_test.php
          php tests/hotel_match_current_tv_anex_observations_test.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b' scripts/diagnostics/hotel_match_current_tv_anex_observations.php
          grep -Fq 'tour_operator_identity_observations' scripts/diagnostics/hotel_match_current_tv_anex_observations.php
          grep -Fq "['hotellist','hotelcode','hotel_code']" scripts/diagnostics/hotel_match_current_tv_anex_observations.php
