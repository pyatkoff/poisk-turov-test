name: Search3 Windows Firefox demo QA
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/search3-qa-windows-firefox-site233.yml
      - tests/search3_windows_firefox_site233/**

permissions:
  contents: read

concurrency:
  group: search3-site233-windows-firefox-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tour-selection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/search3-windows-firefox-site233-20261118'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium==4.36.0
      - name: Check the public tour selection in Firefox on Windows
        run: python -u tests/search3_windows_firefox_site233/run.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search3-windows-firefox-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
