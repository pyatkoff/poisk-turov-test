name: MATCH Tourvisor native ANEX currentize v1

on:
  push:
    branches:
      - ops/match-tv-native-anex-currentize-1971-20260918-v1
    paths:
      - scripts/diagnostics/hotel_match_tv_native_anex_currentize_v1.php
      - .github/workflows/hotel-match-tv-native-anex-currentize-v1.yml

permissions:
  contents: read
  issues: write

env:
  OPERATION_ID: hotel-match-tv-native-anex-currentize-1971-20260918-v1
  EXPECTED_BASE: 049f2f650b443a8dc404e518a32ef6b3d0242591
  CLAIM_COMMENT_ID: '5733933141'

concurrency:
  group: match-anex-direct-account-native-currentize-20260918
  cancel-in-progress: false

jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact targeted delta and owner claim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE..HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/diagnostics/hotel_match_tv_native_anex_currentize_v1.php'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/hotel-match-tv-native-anex-currentize-v1.yml'
          php -l scripts/diagnostics/hotel_match_tv_native_anex_currentize_v1.php
          php scripts/diagnostics/hotel_match_tv_native_anex_currentize_v1.php --self-test
          php -l app/integrations/anex-client.php
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          b=c['body']
          assert os.environ['OPERATION_ID'] in b
          assert 'exactly 40 rows' in b
          assert '60 requests/minute' in b
          assert 'known coordinates >5km' in b
          assert 'Tourvisor calls' in b
          PY

      - name: Require credentials and stage runtime
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"; test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$ANEX_TOKEN"
          umask 077; mkdir -p terminal
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$SSH_HOST" > "$known" 2>/dev/null
          test -s "$known"
          remote="$SSH_USER@$SSH_HOST"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          stage=".anytour-match/stages/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "umask 077; mkdir -p \"\$HOME/.anytour-match/stages\"; rm -rf \"\$HOME/$stage\"; mkdir -m 700 \"\$HOME/$stage\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_tv_native_anex_currentize_v1.php app/integrations/anex-client.php "$remote:$stage/"

      - name: CURRENT prepare before provider
        env:
          SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"; remote="$SSH_USER@$SSH_HOST"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          stage=".anytour-match/stages/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$stage\" HMTN_PREP_ONLY=1 php -d display_errors=1 -d log_errors=0 \"\$HOME/$stage/hotel_match_tv_native_anex_currentize_v1.php\"" > terminal/preflight.json 2> terminal/preflight.err
          python3 - <<'PY'
          import json
          d=json.load(open('terminal/preflight.json'))
          assert d['state']=='prepared_before_provider_access'
          assert d['input_count']==40
          assert 0 < d['eligible_count'] <= 40
          assert d['provider_attempts']==0 and d['database_writes']==0 and d['mapping_writes']==0
          print(json.dumps(d,ensure_ascii=False,sort_keys=True))
          PY

      - name: Reserve and execute targeted direct ANEX details
        env:
          SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known_hosts"; remote="$SSH_USER@$SSH_HOST"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          op=".anytour-match/operations/$OPERATION_ID"; stage=".anytour-match/stages/$OPERATION_ID"
          set -e
          ssh "${opts[@]}" "$remote" "umask 077; mkdir -p \"\$HOME/.anytour-match/operations\"; test ! -e \"\$HOME/$op\"; mkdir -m 700 \"\$HOME/$op\"; mkdir -m 700 \"\$HOME/$op/payload\"; cp \"\$HOME/$stage/\"* \"\$HOME/$op/payload/\""
          python3 - <<'PY' > terminal/reservation.json
          import json,os
          pre=json.load(open('terminal/preflight.json'))
          print(json.dumps({
            "operation":os.environ["OPERATION_ID"],"state":"reserved_before_provider_access",
            "source_sha":os.environ["HEAD_SHA"],"provider":"direct_anex",
            "source_reconcile_sha256":"06f1ad32e17e72bd5b2c1ad4fce69d3d765ea455926378710dfe8fc63954930b",
            "source_artifact_id":10559558054,"input_count":40,"eligible_count":pre["eligible_count"],
            "max_detail_calls":40,"supplier_limit_per_minute":60,"shared_default_token_rate_lock":True,
            "tourvisor_calls":0,"andromeda_calls":0,"database_writes":0,"mapping_writes":0,"no_replay":True
          },sort_keys=True))
          PY
          scp "${opts[@]}" terminal/reservation.json "$remote:$op/reservation.json"
          set +e
          printf '%s\n' "$ANEX_TOKEN" | ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" php -d display_errors=0 -d log_errors=0 \"\$HOME/$op/payload/hotel_match_tv_native_anex_currentize_v1.php\" > \"\$HOME/$op/result.json\""
          rc=$?
          set -e
          ssh "${opts[@]}" "$remote" bash -s -- "$OPERATION_ID" "$rc" <<'REMOTE'
          set -euo pipefail
          op="$1"; rc="$2"; p="$HOME/.anytour-match/operations/$op"; result="$p/result.json"
          if [ ! -s "$result" ]; then
            printf '{"operation":"%s","state":"terminal_failed_no_replay","reason":"runtime_failure","tourvisor_calls":0,"andromeda_calls":0,"database_writes":0,"mapping_writes":0}\n' "$op" > "$result"
          fi
          OP="$op" RC="$rc" RESULT="$result" RECEIPT="$p/receipt.json" php -r '
            $raw=file_get_contents(getenv("RESULT"));$j=json_decode($raw,true);$sha=hash("sha256",$raw);
            file_put_contents(getenv("RECEIPT"),json_encode([
              "operation"=>getenv("OP"),"state"=>is_array($j)?($j["state"]??"terminal_failed_no_replay"):"terminal_failed_no_replay",
              "remote_exit"=>(int)getenv("RC"),"result_sha256"=>$sha,"provider_access"=>true,
              "provider_attempts"=>(int)($j["provider_attempts"]??0),"detail_calls"=>(int)($j["detail_calls"]??0),
              "tourvisor_calls"=>0,"andromeda_calls"=>0,"database_writes"=>0,"mapping_writes"=>0,"no_replay"=>true
            ],JSON_UNESCAPED_SLASHES).PHP_EOL);
          '
          REMOTE
          ssh "${opts[@]}" "$remote" "tar -C \"\$HOME/$op\" -czf - reservation.json result.json receipt.json" > terminal/server-operation.tgz
          printf '%s\n' "$rc" > terminal/remote-exit.txt

      - name: Verify and summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,json,hashlib,pathlib
          p=pathlib.Path('terminal'); d=p/'server'; d.mkdir(exist_ok=True)
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
            for m in t.getmembers():
              assert m.isfile() and m.size<100_000_000
              (d/pathlib.Path(m.name).name).write_bytes(t.extractfile(m).read())
          r=json.loads((d/'result.json').read_text()); rec=json.loads((d/'receipt.json').read_text())
          sha=hashlib.sha256((d/'result.json').read_bytes()).hexdigest()
          assert rec['result_sha256']==sha
          assert rec['database_writes']==0 and rec['mapping_writes']==0 and rec['tourvisor_calls']==0 and rec['andromeda_calls']==0
          assert r.get('state') in ['completed_read_only','completed_partial_provider_stop']
          assert r['input_count']==40 and r['provider_attempts']<=40 and r['detail_calls']<=40
          summary={k:r.get(k) for k in ['state','stop_reason','input_count','eligible_count','provider_attempts','detail_calls','bucket_counts','current_safe_native_count']}
          summary['top_safe']=(r.get('current_safe_native') or [])[:20]; summary['result_sha256']=sha
          (p/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          msg=(f"MATCH #1971 targeted native-ANEX currentization {r['state']} / READ ONLY / NO-REPLAY. "
               f"Input40, eligible {r['eligible_count']}, direct ANEX DETAILS {r['detail_calls']}, safe {r['current_safe_native_count']}, "
               f"buckets {r['bucket_counts']}, stop={r.get('stop_reason')}. Tourvisor/Andromeda calls0, DB/mapping writes0. Result SHA256 {sha}.")
          (p/'summary.md').write_text(msg+'\n'); print(msg)
          PY
          test "$(cat terminal/remote-exit.txt)" -eq 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-native-anex-currentize-${{ github.run_id }}
          path: terminal/
          if-no-files-found: error
          retention-days: 90

      - name: Record result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file terminal/summary.md
          gh issue comment 2530 --repo "$GITHUB_REPOSITORY" --body-file terminal/summary.md
