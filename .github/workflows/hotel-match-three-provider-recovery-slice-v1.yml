name: MATCH three-provider recovery slice v1

on:
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-three-provider-recovery-slice-1971-20260912-v1.arm']

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: anytour-match-three-provider-recovery-1971-20260912-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-three-provider-111-recovery-1971-20260912-v1
  FROZEN_SOURCE_SHA: cf15ed59aecc19c2f24950868dcff9d9c99f4ee0
  SEARCH_DATE: '2026-10-30'
  SEARCH_NIGHTS: '7'
  ARTIFACT_DIR: /tmp/match-three-provider-recovery-v1

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify arm and derive exact frozen full-page program
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(cat .github/match-three-provider-recovery-slice-1971-20260912-v1.arm)" = "$OPERATION_ID"
          mkdir -p "$ARTIFACT_DIR"
          curl -fsSL --retry 2 --retry-delay 1 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$FROZEN_SOURCE_SHA/scripts/diagnostics/hotel_match_three_provider_111_full_pages_v6.php" \
            -o "$ARTIFACT_DIR/frozen.php"
          export FROZEN="$ARTIFACT_DIR/frozen.php" PROGRAM="$ARTIFACT_DIR/program.php"
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path(os.environ['FROZEN']).read_text()
          oldop='hotel-match-three-provider-111-full-pages-1971-20260911-v6'
          olddate="const M6_DATE = '2026-11-06';"
          newdate="const M6_DATE = '"+os.environ['SEARCH_DATE']+"';"
          if src.count(oldop)!=1 or src.count(olddate)!=1:
              raise SystemExit('frozen diagnostic identity changed')
          out=src.replace(oldop,os.environ['OPERATION_ID']).replace(olddate,newdate)
          if out.replace(os.environ['OPERATION_ID'],oldop).replace(newdate,olddate)!=src:
              raise SystemExit('unexpected derived-program change')
          required=[
              "const M6_NIGHTS = 7;",
              "const M6_TV_OPERATOR = 13;",
              "'departureId'=>1,'countryId'=>4",
              "'onlyDirect'=>false,'onlyCharter'=>false",
              "'operatorIds'=>[M6_TV_OPERATOR]",
              "if(!defined('TOURVISOR_ANEX_JWT'))",
              "putenv('TOURVISOR_JWT='.$tvToken)",
          ]
          for needle in required:
              if needle not in out: raise SystemExit('protected frozen contract missing: '+needle)
          Path(os.environ['PROGRAM']).write_text(out)
          print('MATCH_RECOVERY_FROZEN_DERIVATION_OK')
          PY
          php -l "$ARTIFACT_DIR/program.php"

      - name: Establish zero-supplier SSH control master and preflight
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess,time
          from pathlib import Path
          rt=Path(os.environ['RUNNER_TEMP']); key=rt/'match-recovery-v1-key'; sock=rt/'match-recovery-v1.sock'; known=rt/'match-recovery-v1-known'
          raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
          if 'PRIVATE KEY' in raw:key.write_text(raw.rstrip()+'\n')
          else:key.write_bytes(base64.b64decode(raw))
          key.chmod(0o600)
          common=['-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST']]
          ok=False
          for _ in range(3):
              try:sock.unlink()
              except FileNotFoundError:pass
              a=subprocess.run(['ssh','-M','-S',str(sock),'-fnNT','-o','ControlPersist=900']+common,text=True,capture_output=True,timeout=30)
              if a.returncode==0:
                  b=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-o','BatchMode=yes','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],"cd \"$HOME/www/anytoour.ru\" && test -f config.php && { test -f data/tourvisor-client-v1.php || test -f v2/data/tourvisor-client-v1.php; } && test -f _preview/search3-anex-candidate/api-andromeda-search3-preview.php && php -r 'echo \"MATCH_RECOVERY_PREFLIGHT_OK\\n\";'"],text=True,capture_output=True,timeout=30)
                  if b.returncode==0 and 'MATCH_RECOVERY_PREFLIGHT_OK' in b.stdout:ok=True;break
              if sock.exists():subprocess.run(['ssh','-S',str(sock),'-O','exit',os.environ['ANYTOOUR_DEPLOY_HOST']],text=True,capture_output=True,timeout=10)
              time.sleep(2)
          if not ok:raise SystemExit('zero-supplier control-master preflight failed')
          print('MATCH_RECOVERY_PREFLIGHT_OK')
          PY

      - name: Persist immutable reservation before supplier access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']); p=d/'program.php'
          value={
            'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier_access',
            'source_sha':os.environ['GITHUB_SHA'],'frozen_source_sha':os.environ['FROZEN_SOURCE_SHA'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,
            'program_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'criteria':{'departure':'Moscow','country':'Turkey','date':os.environ['SEARCH_DATE'],'nights':int(os.environ['SEARCH_NIGHTS']),'adults':2,'children':0,'currency':'RUB','tourvisor_operator_id':13},
            'first_supplier_call':'tourvisor_departures_smoke_separate_anex_credential','supplier_retry_budget':0,
            'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          raw=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode(); (d/'reservation.json').write_bytes(raw)
          if (d/'reservation.json').read_bytes()!=raw: raise SystemExit('reservation readback failed')
          PY

      - name: Preserve durable reservation
        uses: actions/upload-artifact@v4
        with:
          name: match-three-provider-recovery-v1-${{ github.run_id }}-reserved
          path: ${{ env.ARTIFACT_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: One-call Tourvisor ANEX credential smoke
        id: smoke
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']); sock=Path(os.environ['RUNNER_TEMP'])/'match-recovery-v1.sock'
          php=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0'); ini_set('log_errors','0');
          $r=['operation_id'=>'hotel-match-three-provider-111-recovery-1971-20260912-v1','stage'=>'tourvisor_departures_smoke','status'=>'unknown','tourvisor_http_calls'=>1,'search_starts'=>0,'anex_calls'=>0,'andromeda_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'booking_calls'=>0,'lead_calls'=>0,'ordinary_credential_substituted'=>false,'supplier_retry_count'=>0,'no_replay'=>true];
          try{
            $root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru') throw new RuntimeException('root');
            require_once $root.'/config.php';
            if(!defined('TOURVISOR_ANEX_JWT')) throw new RuntimeException('anex_credential_missing');
            $token=trim((string)constant('TOURVISOR_ANEX_JWT')); if(stripos($token,'Bearer ')===0)$token=trim(substr($token,7)); if($token==='') throw new RuntimeException('anex_credential_empty');
            putenv('TOURVISOR_JWT='.$token);
            $client=is_file($root.'/data/tourvisor-client-v1.php')?$root.'/data/tourvisor-client-v1.php':$root.'/v2/data/tourvisor-client-v1.php'; require_once $client;
            $x=v2_data_tv_get('/departures');
            $rows=array_is_list($x)?$x:((is_array($x['departures']??null))?$x['departures']:((is_array($x['data']??null))?$x['data']:[]));
            $r['status']='healthy'; $r['departure_rows']=count($rows);
          }catch(Throwable $e){
            $m=$e->getMessage();
            if(strpos($m,'429')!==false){$r['status']='blocked';$r['reason']='tourvisor_rate_limited_429';}
            else {$r['status']='failed';$r['reason']='tourvisor_smoke_failed'; if(preg_match('/HTTP\s+(\d{3})/',$m,$mm))$r['http_status']=(int)$mm[1];}
          }
          echo 'MATCH_RECOVERY_SMOKE:'.json_encode($r,JSON_UNESCAPED_SLASHES).PHP_EOL;
          ?>'''
          p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-o','BatchMode=yes','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0'],input=php,text=True,capture_output=True,timeout=90)
          marker='MATCH_RECOVERY_SMOKE:'; line=next((z[len(marker):] for z in reversed(p.stdout.splitlines()) if z.startswith(marker)),None)
          if line is None: data={'operation_id':os.environ['OPERATION_ID'],'stage':'tourvisor_departures_smoke','status':'unknown','reason':'smoke_result_marker_missing','remote_exit':p.returncode,'tourvisor_http_calls':'unknown','search_starts':0,'anex_calls':0,'andromeda_calls':0,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'ordinary_credential_substituted':False,'no_replay':True}
          else: data=json.loads(line)
          (d/'smoke.json').write_text(json.dumps(data,sort_keys=True,indent=2)+'\n')
          healthy=(p.returncode==0 and data.get('status')=='healthy' and data.get('ordinary_credential_substituted') is False and data.get('search_starts')==0 and data.get('anex_calls')==0 and data.get('andromeda_calls')==0)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('healthy='+('true' if healthy else 'false')+'\n')
          print(json.dumps({'status':data.get('status'),'reason':data.get('reason'),'departure_rows':data.get('departure_rows')},sort_keys=True))
          PY

      - name: Execute exact frozen synchronized full-page slice
        if: steps.smoke.outputs.healthy == 'true'
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']); sock=Path(os.environ['RUNNER_TEMP'])/'match-recovery-v1.sock'; program=(d/'program.php').read_text()
          p=subprocess.run(['ssh','-S',str(sock),'-T','-o','ControlMaster=no','-o','BatchMode=yes','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=2048M'],input=program,text=True,capture_output=True,timeout=780)
          marker='MATCH111FULL_JSON:'; line=next((z[len(marker):] for z in reversed(p.stdout.splitlines()) if z.startswith(marker)),None)
          if line is None:
            data={'status':'unknown','stage':'full_slice_remote_execution','reason':'result_marker_missing','operation_id':os.environ['OPERATION_ID'],'remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(p.stderr.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          else:
            data=json.loads(line); data.update(source_sha=os.environ['GITHUB_SHA'],frozen_source_sha=os.environ['FROZEN_SOURCE_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=1,no_replay=True)
          raw=(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode(); (d/'result.json').write_bytes(raw)
          if len(raw)>3000000: raise SystemExit('result too large')
          q=data.get('providers') or {}; print(json.dumps({'status':data.get('status'),'stage':data.get('stage'),'reason':data.get('reason'),'tourvisor_hotels':(q.get('tourvisor') or {}).get('hotel_count'),'tourvisor_continue_calls':(q.get('tourvisor') or {}).get('continue_calls'),'anex_hotels':(q.get('anex') or {}).get('hotel_count'),'andromeda_hotels':(q.get('andromeda') or {}).get('hotel_count'),'triples':(((data.get('comparison') or {}).get('unique_alias_triples') or {}).get('count'))},ensure_ascii=False,sort_keys=True))
          PY

      - name: Build immutable receipt and summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['ARTIFACT_DIR']); smoke=json.loads((d/'smoke.json').read_text()) if (d/'smoke.json').exists() else {'status':'unknown','reason':'smoke_missing'}
          full=json.loads((d/'result.json').read_text()) if (d/'result.json').exists() else None
          if smoke.get('status')=='blocked': status='blocked'; reason=smoke.get('reason'); body=smoke
          elif full is not None: status=full.get('status','unknown'); reason=full.get('reason'); body=full
          elif smoke.get('status')!='healthy': status=smoke.get('status','unknown'); reason=smoke.get('reason'); body=smoke
          else: status='unknown'; reason='full_result_missing_after_healthy_smoke'; body={}
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':status,'reason':reason,'source_sha':os.environ['GITHUB_SHA'],'frozen_source_sha':os.environ['FROZEN_SOURCE_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':1,'criteria':{'departure':'Moscow','country':'Turkey','date':os.environ['SEARCH_DATE'],'nights':7,'adults':2,'children':0,'tourvisor_operator_id':13},'smoke_status':smoke.get('status'),'ordinary_credential_substituted':False,'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
          if full is not None: receipt['result_sha256']=hashlib.sha256((d/'result.json').read_bytes()).hexdigest()
          raw=(json.dumps(receipt,sort_keys=True,indent=2)+'\n').encode(); (d/'receipt.json').write_bytes(raw)
          lines=[f"MATCH #1971 recovery slice `{os.environ['OPERATION_ID']}`: **{status}** / NO-REPLAY. Run `{os.environ['GITHUB_RUN_ID']}`, source `{os.environ['GITHUB_SHA']}`, frozen diagnostic `{os.environ['FROZEN_SOURCE_SHA']}`."]
          if status=='blocked': lines.append('Separate `TOURVISOR_ANEX_JWT` `/departures` smoke returned 429; search start 0, ANEX calls 0, Andromeda calls 0, retry 0, ordinary `TOURVISOR_JWT` substitution 0.')
          elif full is not None and status=='completed':
            p=full.get('providers') or {}; triples=(((full.get('comparison') or {}).get('unique_alias_triples') or {}).get('count'))
            lines.append(f"Turkey 2026-10-30/7n completed: Tourvisor hotels **{(p.get('tourvisor') or {}).get('hotel_count')}** (continue calls {(p.get('tourvisor') or {}).get('continue_calls')}), direct ANEX **{(p.get('anex') or {}).get('hotel_count')}**, Andromeda **{(p.get('andromeda') or {}).get('hotel_count')}**, unique exact alias triples **{triples}**. DB/mapping/booking/lead writes 0.")
          else: lines.append(f"Exact blocker: `{reason or 'unknown'}`. DB/mapping/booking/lead writes 0; do not replay this operation.")
          (d/'summary.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Preserve final evidence
        if: always()
        id: final_artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-three-provider-recovery-v1-${{ github.run_id }}-final
          path: |
            ${{ env.ARTIFACT_DIR }}/reservation.json
            ${{ env.ARTIFACT_DIR }}/smoke.json
            ${{ env.ARTIFACT_DIR }}/result.json
            ${{ env.ARTIFACT_DIR }}/receipt.json
            ${{ env.ARTIFACT_DIR }}/summary.md
          if-no-files-found: warn
          retention-days: 90

      - name: Record sanitized MATCH result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.final_artifact.outputs.artifact-id }}
        run: |
          if [ -f "$ARTIFACT_DIR/summary.md" ]; then
            printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$ARTIFACT_DIR/summary.md"
            gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$ARTIFACT_DIR/summary.md"
          fi

      - name: Enforce terminal state
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['ARTIFACT_DIR'],'receipt.json')
          if not p.exists(): raise SystemExit('receipt missing')
          state=json.loads(p.read_text()).get('state')
          if state not in ('completed','blocked'): raise SystemExit('operation ended '+str(state))
          PY

      - name: Close SSH control master
        if: always()
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
        run: |
          SOCK="$RUNNER_TEMP/match-recovery-v1.sock"
          if [ -S "$SOCK" ]; then ssh -S "$SOCK" -O exit "$ANYTOOUR_DEPLOY_HOST" >/dev/null 2>&1 || true; fi
          rm -f "$RUNNER_TEMP/match-recovery-v1-key" "$SOCK"
