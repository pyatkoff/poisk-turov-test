name: Temporary Search3 desktop workspace sync

on:
  push:
    branches:
      - ux/search3-desktop-results-workspace-20260912

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-desktop-results-workspace-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded desktop workspace change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/search3/styles/results-layout.css')
          s = p.read_text()
          needle = "& #results .tour-action>.hotel-price{font-size:26px}\n}\n@media(max-width:560px){"
          replacement = "& #results .tour-action>.hotel-price{font-size:26px}\n}\n@media(min-width:1200px){\n&:not(.search3-selected-open) .v2-shell{max-width:1360px;padding-inline:24px}\n& .results-layout:has(#results>*){grid-template-columns:250px minmax(0,1fr);gap:24px}\n& .results-filter-rail{gap:14px;padding:16px}\n}\n@media(max-width:560px){"
          if s.count(needle) != 1:
              raise SystemExit('results layout insertion point drifted')
          p.write_text(s.replace(needle, replacement, 1))

          t = Path('tests/search3-filter-rail-short-viewport-browser.cjs')
          s = t.read_text()
          old = """        viewportHeight: innerHeight\n      };\n    });"""
          new = """        viewportHeight: innerHeight,\n        shellWidth: document.querySelector('.v2-shell').getBoundingClientRect().width,\n        layoutWidth: document.querySelector('.results-layout').getBoundingClientRect().width,\n        railWidth: rect.width,\n        resultsWidth: document.querySelector('#results').getBoundingClientRect().width,\n        workspaceGap: document.querySelector('#results').getBoundingClientRect().left - rect.right\n      };\n    });"""
          if s.count(old) != 1:
              raise SystemExit('rail metrics insertion point drifted')
          s = s.replace(old, new, 1)
          old = """    assert.equal(initial.overflowX, false, `${width}: page has no horizontal overflow before keyboard traversal`);\n\n    const focusables"""
          new = """    assert.equal(initial.overflowX, false, `${width}: page has no horizontal overflow before keyboard traversal`);\n    if (width >= 1200) {\n      assert.ok(initial.shellWidth >= Math.min(width - 8, 1350), `${width}: wide desktop uses the available workspace: ${JSON.stringify(initial)}`);\n      assert.ok(initial.railWidth >= 245 && initial.railWidth <= 255, `${width}: OTA filter rail stays intentionally scannable: ${JSON.stringify(initial)}`);\n      assert.ok(initial.workspaceGap >= 20 && initial.workspaceGap <= 28, `${width}: rail/results gap stays balanced: ${JSON.stringify(initial)}`);\n      assert.ok(initial.resultsWidth >= initial.railWidth * 3.4, `${width}: results remain the dominant decision surface: ${JSON.stringify(initial)}`);\n    }\n\n    const focusables"""
          if s.count(old) != 1:
              raise SystemExit('rail assertions insertion point drifted')
          s = s.replace(old, new, 1)
          old = """    await exercise(browser, 1025, 520);\n    await exercise(browser, 1440, 560);"""
          new = """    await exercise(browser, 1025, 520);\n    await exercise(browser, 1200, 700);\n    await exercise(browser, 1366, 768);\n    await exercise(browser, 1440, 560);\n    await exercise(browser, 1600, 900);"""
          if s.count(old) != 1:
              raise SystemExit('rail width matrix insertion point drifted')
          s = s.replace(old, new, 1)
          s = s.replace("SEARCH3_FILTER_RAIL_SHORT_VIEWPORT_OK widths=1025x520,1440x560", "SEARCH3_FILTER_RAIL_SHORT_VIEWPORT_OK widths=1025x520,1200x700,1366x768,1440x560,1600x900")
          t.write_text(s)
          PY
      - name: Materialize canonical Search3 assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
          python3 -B scripts/build/search3_assets.py --write
          python3 -B scripts/build/search3_assets.py --check
          node scripts/build/search3-js/shared-runtime.cjs --check
      - name: Sync reviewed import hash
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          asset = Path('v2/search3-results-filters-v1.css')
          p = Path('docs/project/search3-production-import.json')
          data = json.loads(p.read_text())
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          data['assets']['search3-results-filters-v1.css']['productionSha256'] = digest
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          print(digest)
          PY
      - name: Commit bounded product package and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-search3-desktop-workspace-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/search3/styles/results-layout.css v2/search3-results-filters-v1.css docs/project/search3-production-import.json tests/search3-filter-rail-short-viewport-browser.cjs .github/workflows/tmp-search3-desktop-workspace-sync.yml
          git diff --cached --check
          git commit -m 'SEARCH: widen desktop results workspace'
          git push origin HEAD:ux/search3-desktop-results-workspace-20260912
