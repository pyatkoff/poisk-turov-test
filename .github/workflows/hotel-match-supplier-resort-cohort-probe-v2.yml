name: MATCH supplier resort cohort probe v2
on:
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-supplier-resort-cohort-probe-1971-20260912-v2.arm']
permissions: {contents: read, actions: read, issues: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: {OUT: /tmp/match-resort-cohort-probe-v2}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: CURRENT DB metadata probe
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(cat .github/match-supplier-resort-cohort-probe-1971-20260912-v2.arm)" = 'hotel-match-supplier-resort-cohort-probe-1971-20260912-v2'
          mkdir -p "$OUT"; key="$RUNNER_TEMP/mrc2-key"; known="$RUNNER_TEMP/mrc2-known"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi; chmod 600 "$key"
          cat > "$OUT/probe.php" <<'PHP'
          <?php declare(strict_types=1); require_once getcwd().'/config.php'; $db=is_file(getcwd().'/data/db-v1.php')?getcwd().'/data/db-v1.php':getcwd().'/v2/data/db-v1.php'; require_once $db; $pdo=v2_data_db();
          $all=$pdo->query('SHOW TABLES')->fetchAll(PDO::FETCH_COLUMN); $match=array_values(array_filter($all,fn($t)=>preg_match('/anex|andromeda|hotel/i',(string)$t))); $out=['operation_id'=>'hotel-match-supplier-resort-cohort-probe-1971-20260912-v2','status'=>'completed','tables'=>[],'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'no_replay'=>true];
          foreach($match as $t){$cols=$pdo->query('SHOW COLUMNS FROM `'.str_replace('`','``',(string)$t).'`')->fetchAll(PDO::FETCH_ASSOC);$names=array_values(array_filter(array_map(fn($r)=>(string)($r['Field']??''),$cols)));$interesting=array_values(array_filter($names,fn($x)=>preg_match('/provider|supplier|external|hotel|country|region|resort|town|city|geo|lat|lon|name|local|status/i',$x)));if($interesting)$out['tables'][]=['table'=>$t,'columns'=>$interesting];}
          echo 'MRC2:'.json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          PHP
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0' < "$OUT/probe.php" > "$OUT/stdout" 2> "$OUT/stderr"
          grep '^MRC2:' "$OUT/stdout" | tail -1 | sed 's/^MRC2://' > "$OUT/result.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ['OUT']);x=json.loads((d/'result.json').read_text());assert x['status']=='completed'
          lines=[f"MATCH #1971 corrected supplier cohort schema probe completed / NO-REPLAY. Relevant tables: {len(x['tables'])}. DB/mapping/supplier/Tourvisor writes/calls0."]+[f"- {t['table']}: {', '.join(t['columns'])}" for t in x['tables']]
          (d/'summary.md').write_text('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-supplier-resort-cohort-probe-v2-${{ github.run_id }}', path: '${{ env.OUT }}/', retention-days: 90}
      - name: Record
        if: success()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md"
