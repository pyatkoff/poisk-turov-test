name: MATCH userseen context schema v1
on:
  push:
    branches: [ops/match-userseen-context-schema-1971-20260919-v1]
    paths:
      - scripts/diagnostics/hotel_match_userseen_context_schema_v1.php
      - .github/workflows/hotel-match-userseen-context-schema-v1.yml
permissions: {contents: read, issues: read}
env: {OPERATION_ID: hotel-match-userseen-context-schema-1971-20260919-v1, CLAIM: '5743698994'}
jobs:
  probe:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Validate claim and source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail;mkdir -p terminal
          php -l scripts/diagnostics/hotel_match_userseen_context_schema_v1.php;php scripts/diagnostics/hotel_match_userseen_context_schema_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >terminal/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('terminal/claim.json'));assert c['user']['id']==226193297 and c['author_association']=='OWNER' and os.environ['OPERATION_ID'] in c['body']
          PY
      - name: Read schema metadata once
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_userseen_context_schema_v1.php "$remote:$op/"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" php \"\$HOME/$op/hotel_match_userseen_context_schema_v1.php\""
          ssh "${opts[@]}" "$remote" 'cd "$HOME/'"$op"'" && tar -czf - result.json receipt.json' >terminal/server.tgz
      - name: Verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
           for n in ['result.json','receipt.json']:pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'));assert r['state']==q['state']=='completed_read_only' and r['provider_calls']==r['database_writes']==0 and q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          print(json.dumps([(x['table'],x['score'],x['row_count']) for x in r['tables']],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-context-schema-${{ github.run_id }}', path: terminal/result.json, retention-days: 30, if-no-files-found: error}
