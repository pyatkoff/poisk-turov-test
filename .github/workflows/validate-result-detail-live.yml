name: Validate V2 result-detail live
on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/validate-result-detail-live.yml'
  workflow_dispatch:
concurrency:
  group: ci-validate-result-detail-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-result-detail-live:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Compare live result cards with tour detail
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "RESULT_DETAIL_LIVE_FAIL:$1"; exit 1; }
          base="https://anytour.online/poisk-turov-test/v2/api-v2.php"
          from="$(date -d "+2 day" +%Y-%m-%d)"
          till="$(date -d "+9 day" +%Y-%m-%d)"

          curl -k -L -fsS --max-time 50 "$base?action=search_start&departureId=1&countryId=4&dateFrom=$from&dateTo=$till&nightsFrom=7&nightsTo=10&adults=2&currency=RUB" >/tmp/v2-rd-start.json || fail search_start
          search_id="$(python3 -c "import json; d=json.load(open('/tmp/v2-rd-start.json')); print(d.get('searchId') or '')")"
          test -n "$search_id" || fail search_id

          complete=0
          for attempt in $(seq 1 20); do
            sleep 2
            if curl -k -L -fsS --max-time 45 "$base?action=search_status&searchId=$search_id" >/tmp/v2-rd-status.json && python3 -c "import json; d=json.load(open('/tmp/v2-rd-status.json')); raise SystemExit(0 if isinstance(d,dict) and (d.get('progress')==100 or d.get('status')=='complete') else 1)"; then complete=1; break; fi
          done
          test "$complete" = 1 || fail search_not_complete

          curl -k -L -fsS --max-time 45 "$base?action=search_results&searchId=$search_id&limit=25" >/tmp/v2-rd-results.json || fail search_results
          python3 - <<'PY' || fail result_map
          import json
          items=json.load(open('/tmp/v2-rd-results.json'))
          rows=[]
          for hotel in items if isinstance(items,list) else []:
              if not isinstance(hotel,dict): continue
              for tour in hotel.get('tours') or []:
                  if not isinstance(tour,dict) or tour.get('id') is None: continue
                  price=tour.get('price')
                  rows.append({'id':str(tour.get('id')),'hotelId':tour.get('hotelId') or hotel.get('id') or hotel.get('hotelId'),'hotelName':tour.get('hotelName') or hotel.get('name') or hotel.get('hotelName'),'date':tour.get('date') or tour.get('dateFrom') or tour.get('startDate'),'price':price.get('value') if isinstance(price,dict) else price,'currency':tour.get('currency') or (price.get('currency') if isinstance(price,dict) else None),'nights':tour.get('nights'),'adults':tour.get('adults'),'childs':tour.get('childs')})
                  if len(rows)>=8: break
              if len(rows)>=8: break
          json.dump(rows,open('/tmp/v2-rd-map.json','w'),ensure_ascii=False)
          print('RESULT_SAMPLE_ROWS='+str(len(rows)))
          assert len(rows)>=3, 'insufficient_result_rows'
          PY

          : >/tmp/v2-rd-details.jsonl
          while IFS= read -r tid; do
            test -n "$tid" || continue
            if curl -k -L -fsS --max-time 45 "$base?action=tour&tourId=$tid&currency=RUB" >/tmp/v2-rd-tour.json; then
              python3 -c "import json; d=json.load(open('/tmp/v2-rd-tour.json')); print(json.dumps(d,ensure_ascii=False))" >>/tmp/v2-rd-details.jsonl
            fi
            test "$(wc -l </tmp/v2-rd-details.jsonl)" -ge 5 && break
          done < <(python3 -c "import json; print('\n'.join(x['id'] for x in json.load(open('/tmp/v2-rd-map.json'))))")
          test "$(wc -l </tmp/v2-rd-details.jsonl)" -ge 3 || fail insufficient_detail_responses

          SEARCH_ID="$search_id" python3 - <<'PY' || fail result_detail_mismatch
          import json, os, math, datetime
          rows={x['id']:x for x in json.load(open('/tmp/v2-rd-map.json'))}
          details=[json.loads(line) for line in open('/tmp/v2-rd-details.jsonl') if line.strip()]
          def canonical_date(value):
              text=str(value or '').strip()
              for fmt in ('%Y-%m-%d','%d.%m.%Y','%d-%m-%Y'):
                  try: return datetime.datetime.strptime(text,fmt).date().isoformat()
                  except ValueError: pass
              return text
          def number(value):
              if isinstance(value,dict): value=value.get('value')
              try: return float(value)
              except (TypeError,ValueError): return None
          matched=0; repriced=0; max_abs=0.0; max_pct=0.0
          for detail in details:
              assert isinstance(detail,dict), 'detail_not_object'
              tid=str(detail.get('id') or '')
              assert tid in rows, f'unrequested_tour:{tid}'
              result=rows[tid]; stable=[]
              hotel=detail.get('hotel') if isinstance(detail.get('hotel'),dict) else {}
              if result.get('hotelId') not in (None,'') and hotel.get('id') not in (None,''): stable.append(('hotelId',str(result['hotelId'])==str(hotel['id'])))
              if result.get('hotelName') and hotel.get('name'): stable.append(('hotelName',str(result['hotelName']).strip().casefold()==str(hotel['name']).strip().casefold()))
              if result.get('date') and detail.get('date'): stable.append(('date',canonical_date(result['date'])==canonical_date(detail['date'])))
              if result.get('currency') and detail.get('currency'): stable.append(('currency',str(result['currency'])==str(detail['currency'])))
              for key in ('nights','adults','childs'):
                  if result.get(key) not in (None,'') and detail.get(key) not in (None,''): stable.append((key,str(result[key])==str(detail[key])))
              assert len(stable)>=2, f'insufficient_comparable_fields:{tid}'
              assert all(ok for _,ok in stable), f'stable_field_mismatch:{tid}:{stable}'
              rp,dp=number(result.get('price')),number(detail.get('price'))
              if rp is not None and dp is not None:
                  assert rp>0 and dp>0, f'nonpositive_price:{tid}:{rp}:{dp}'
                  delta=dp-rp; pct=(delta/rp*100.0) if rp else 0.0
                  max_abs=max(max_abs,abs(delta)); max_pct=max(max_pct,abs(pct))
                  same=math.isclose(rp,dp,abs_tol=0.01)
                  if not same: repriced+=1
                  print('RESULT_DETAIL_PRICE','tourId='+tid,'result='+str(rp),'detail='+str(dp),'delta='+str(delta),'pct='+format(pct,'.3f'),'repriced='+str(not same).lower())
              matched+=1
              print('RESULT_DETAIL_MATCH','tourId='+tid,'stableChecks='+str(len(stable)))
          assert matched>=3, 'insufficient_result_detail_matches'
          print('RESULT_DETAIL_LIVE_OK','searchId='+os.environ['SEARCH_ID'],'matched='+str(matched),'repriced='+str(repriced),'maxAbsDelta='+str(max_abs),'maxPctDelta='+format(max_pct,'.3f'))
          PY
