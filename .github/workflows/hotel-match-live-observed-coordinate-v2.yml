name: MATCH live observed coordinate v2
on:
  push:
    branches: [ops/match-learned-geo-global-2333-20260914-v1]
    paths: [.github/match-live-observed-coordinate-2333-20260914-v2.arm]
permissions: {contents: read}
env: {OPERATION_ID: hotel-match-live-observed-coordinate-review-2333-20260914-v2}
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_live_observed_coordinate_review_v2.php
          test "$(cat .github/match-live-observed-coordinate-2333-20260914-v2.arm)" = "$OPERATION_ID"
      - name: SSH preflight
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match_key"; if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          out="$(ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20 -l "$SSH_USER" "$SSH_HOST" 'cd "$HOME/www/anytoour.ru" && test -s config.php && printf MATCH_SSH_OK')"; test "$out" = MATCH_SSH_OK
      - name: Reserve immutable operation
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '%s\n' '{"operation_id":"hotel-match-live-observed-coordinate-review-2333-20260914-v2","state":"reserved_after_ssh_before_current_db_read","database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}' > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-live-observed-coordinate-v2-reservation, path: '${{ runner.temp }}/hotel-match-live-observed-coordinate-review-2333-20260914-v2/reservation.json', retention-days: 90}
      - name: Review current DB read-only
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path;state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(p):
            s=P(p).read_text();s=s[5:] if s.startswith('<?php') else s;return s.replace('declare(strict_types=1);','',1)
          files=['hotel_full_catalog_reconcile.php','hotel_match_current_bulk_review.php','hotel_match_learned_geo_global_review.php','hotel_match_fuzzy_learned_geo_global_review.php','hotel_match_direct_fuzzy_geo_global_review.php','hotel_match_andromeda_duplicate_bridge_global_review.php','hotel_match_andromeda_star_signal_bridge_review.php','hotel_match_many_to_one_direct_geo_review.php','hotel_match_live_observed_coordinate_review.php','hotel_match_live_observed_coordinate_review_v2.php']
          reqs=["if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\n"]+["require_once __DIR__ . '/%s';\n"%x for x in files]
          chunks=[]
          for f in files:
            s=body('scripts/diagnostics/'+f)
            for r in reqs:s=s.replace(r,'')
            chunks.append(s)
          wrapper="$root=realpath(getcwd());require_once $root.'/config.php';require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$o=hmloc_v2_review(v2_data_db(),'hotel-match-live-observed-coordinate-review-2333-20260914-v2');echo json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";"
          payload='<?php\ndefine("FC_LIBRARY_ONLY",true);\n'+'\n'.join(chunks)+'\n'+wrapper
          raw=os.environ['SSH_KEY'].strip()
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as td:
            k=P(td)/'k';known=P(td)/'known';k.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else k.write_bytes(base64.b64decode(raw));k.chmod(0o600)
            cmd=['ssh','-T','-i',str(k),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-l',os.environ['SSH_USER'],os.environ['SSH_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d memory_limit=1536M']
            p=subprocess.run(cmd,input=payload,text=True,capture_output=True,timeout=900)
          if p.returncode:
            state.joinpath('transport.json').write_text(json.dumps({'remote_exit':p.returncode,'stderr_tail':p.stderr[-1200:]},ensure_ascii=False)+'\n');raise SystemExit(p.returncode)
          v=json.loads(p.stdout);raw_result=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();state.joinpath('result.json').write_bytes(raw_result)
          ok=v.get('status')=='completed' and v.get('operation_id')==os.environ['OPERATION_ID'] and v.get('database_writes')==0 and v.get('mapping_writes')==0 and v.get('supplier_calls')==0 and v.get('tourvisor_calls')==0
          state.joinpath('receipt.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if ok else 'invalid_or_unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw_result).hexdigest(),'safe_count':v.get('safe_count'),'medium_count':v.get('medium_count'),'database_writes':0,'mapping_writes':0,'no_replay':True},ensure_ascii=False,sort_keys=True)+'\n')
          if not ok: raise SystemExit(3)
          print(json.dumps({'stats':v['stats'],'safe_count':v['safe_count'],'medium_count':v['medium_count'],'blocked_reasons':v['blocked_reasons']},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-live-observed-coordinate-v2-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-live-observed-coordinate-review-2333-20260914-v2/', retention-days: 90}
