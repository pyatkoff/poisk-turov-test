name: INT Andromeda current organic cohort
on:
  push:
    branches: ['feat/int-andromeda-current-organic-cohort-20260916']
    paths:
      - 'scripts/diagnostics/andromeda_current_organic_cohort.py'
      - 'tests/andromeda-current-organic-cohort-test.py'
      - '.github/workflows/int-andromeda-current-organic-cohort.yml'
      - 'runtime-control/int-andromeda-current-organic-cohort.txt'
  pull_request:
    paths:
      - 'scripts/diagnostics/andromeda_current_organic_cohort.py'
      - 'tests/andromeda-current-organic-cohort-test.py'
      - '.github/workflows/int-andromeda-current-organic-cohort.yml'
      - 'runtime-control/int-andromeda-current-organic-cohort.txt'
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Offline aggregate contract
        run: python3 tests/andromeda-current-organic-cohort-test.py
      - id: control
        name: Check exact one-shot control
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          expected=$'READ_ONLY_ANDROMEDA_CURRENT_ORGANIC_V1\nBASE=1a195a8795fa7108a4439fdc76167f5577ca4c48\n'
          actual=''; if [[ -f runtime-control/int-andromeda-current-organic-cohort.txt ]]; then actual="$(cat runtime-control/int-andromeda-current-organic-cohort.txt)"$'\n'; fi
          if [[ "$actual" == "$expected" ]]; then echo 'run_live=true' >> "$GITHUB_OUTPUT"; else echo 'run_live=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.control.outputs.run_live == 'true' && github.event_name == 'push'
        with:
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: helper
          persist-credentials: false
      - name: Measure current-producer organic cohort without writes or supplier calls
        if: steps.control.outputs.run_live == 'true' && github.event_name == 'push'
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          PYTHONPATH: helper/scripts/diagnostics
        run: python3 -B scripts/diagnostics/andromeda_current_organic_cohort.py --read-only
