name: Autopilot runtime state

on:
  workflow_run:
    workflows:
      - "Deploy V2 only"
      - "Validate active V2 contract"
      - "Measure V2 results DOM"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update-runtime-state:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Update persistent runtime issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[AUTOPILOT] Runtime state';
            const run = context.eventName === 'workflow_run' ? context.payload.workflow_run : null;
            const workflow = run ? run.name : 'manual refresh';
            const conclusion = run ? (run.conclusion || 'unknown') : 'manual';
            const runId = run ? run.id : context.runId;
            const headSha = run ? run.head_sha : context.sha;
            const runUrl = run ? run.html_url : `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let signal = 'CI_INFORMATIONAL';
            let next = 'Inspect AUTOPILOT_STATE.json and continue the highest-priority safe task.';
            if (conclusion === 'success') {
              signal = 'CI_SUCCESS';
              next = 'Collect DONE evidence and continue the current AUTOPILOT_STATE.json task or advance to the next queued task.';
            } else if (['failure','timed_out','cancelled','action_required'].includes(conclusion)) {
              signal = 'CI_NEEDS_ATTENTION';
              next = 'Diagnose this workflow result first. Fix it if it is within project scope; otherwise record the blocker and continue independent work.';
            }
            const updated = new Date().toISOString();
            const body = [
              '# Autopilot runtime state',
              '',
              '> Machine-maintained CI handoff. Product/queue authority remains in `AGENTS.md`, `AUTOPILOT.md`, and `AUTOPILOT_STATE.json`.',
              '',
              `- Updated: ${updated}`,
              `- Workflow: **${workflow}**`,
              `- Conclusion: **${conclusion}**`,
              `- Signal: **${signal}**`,
              `- Head SHA: \`${headSha}\``,
              `- Run ID: \`${runId}\``,
              `- Run: ${runUrl}`,
              '',
              '## Recommended next action',
              next,
              '',
              '## Continuation rule',
              'Read this runtime signal together with `AUTOPILOT_STATE.json`. A failed item should not stop unrelated safe work; record/defer an external blocker and continue the queue.'
            ].join('\n');
            const found = await github.rest.issues.listForRepo({owner, repo, state:'open', per_page:100});
            const issue = found.data.find(i => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body});
            }
