name: Autopilot runtime state

on:
  workflow_run:
    workflows:
      - "Visual V2 baseline"
      - "Deploy V2 only"
      - "Validate active V2 contract"
      - "Measure V2 results DOM"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  update-runtime-state:
    runs-on: ubuntu-latest
    steps:
      - name: Build runtime state
        id: state
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            workflow="manual refresh"
            conclusion="manual"
            run_id="${GITHUB_RUN_ID}"
            sha="${GITHUB_SHA}"
            url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            workflow="$WORKFLOW_NAME"
            conclusion="$WORKFLOW_CONCLUSION"
            run_id="$WORKFLOW_RUN_ID"
            sha="$WORKFLOW_SHA"
            url="$WORKFLOW_URL"
          fi

          case "$conclusion" in
            success) signal="CI_SUCCESS"; next="Collect DONE evidence and continue the current AUTOPILOT_STATE.json task or advance to the next queued task." ;;
            failure|timed_out|cancelled|action_required) signal="CI_NEEDS_ATTENTION"; next="Diagnose this workflow result first. Fix it if it is within project scope; otherwise record the blocker and continue independent work." ;;
            *) signal="CI_INFORMATIONAL"; next="Inspect the workflow result together with AUTOPILOT_STATE.json and continue the highest-priority safe task." ;;
          esac

          python3 - <<'PY'
          import json, os, datetime
          data = {
              "schema_version": 1,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow": os.environ.get("workflow", ""),
              "conclusion": os.environ.get("conclusion", ""),
              "run_id": os.environ.get("run_id", ""),
              "head_sha": os.environ.get("sha", ""),
              "run_url": os.environ.get("url", ""),
              "signal": os.environ.get("signal", ""),
              "recommended_next_action": os.environ.get("next", "")
          }
          with open('/tmp/autopilot-runtime.json','w') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          PY
        env:
          workflow: ${{ github.event_name == 'workflow_dispatch' && 'manual refresh' || github.event.workflow_run.name }}
          conclusion: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event.workflow_run.conclusion }}
          run_id: ${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.id }}
          sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          url: ${{ github.event_name == 'workflow_dispatch' && format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) || github.event.workflow_run.html_url }}
          signal: ${{ github.event_name == 'workflow_dispatch' && 'CI_INFORMATIONAL' || (github.event.workflow_run.conclusion == 'success' && 'CI_SUCCESS' || 'CI_NEEDS_ATTENTION') }}
          next: ${{ github.event_name == 'workflow_dispatch' && 'Inspect AUTOPILOT_STATE.json and continue the highest-priority safe task.' || (github.event.workflow_run.conclusion == 'success' && 'Collect DONE evidence and continue the current AUTOPILOT_STATE.json task or advance to the next queued task.' || 'Diagnose this workflow result first. Fix it if it is within project scope; otherwise record the blocker and continue independent work.') }}

      - name: Update persistent runtime issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const state = JSON.parse(fs.readFileSync('/tmp/autopilot-runtime.json','utf8'));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[AUTOPILOT] Runtime state';
            const body = [
              '# Autopilot runtime state',
              '',
              '> Machine-maintained CI handoff. Product/queue authority remains in `AGENTS.md`, `AUTOPILOT.md`, and `AUTOPILOT_STATE.json`.',
              '',
              `- Updated: ${state.updated_at}`,
              `- Workflow: **${state.workflow}**`,
              `- Conclusion: **${state.conclusion}**`,
              `- Signal: **${state.signal}**`,
              `- Head SHA: \`${state.head_sha}\``,
              `- Run: ${state.run_url}`,
              '',
              '## Recommended next action',
              state.recommended_next_action,
              '',
              '## Continuation rule',
              'Read this runtime signal together with `AUTOPILOT_STATE.json`. A failed item should not stop unrelated safe work; record/defer an external blocker and continue the queue.'
            ].join('\n');
            const found = await github.rest.issues.listForRepo({owner, repo, state:'open', per_page:100});
            const issue = found.data.find(i => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: []});
            }
