name: Autopilot runtime state

on:
  workflow_run:
    workflows:
      - "Fast CI"
      - "Deploy anytoour.ru"
      - "Production smoke"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: autopilot-runtime-state
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  update-runtime-state:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Update persistent runtime issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[AUTOPILOT] Runtime state';
            const run = context.eventName === 'workflow_run' ? context.payload.workflow_run : null;
            const workflow = run ? run.name : 'manual refresh';
            const conclusion = run ? (run.conclusion || 'unknown') : 'manual';
            const runId = run ? run.id : context.runId;
            const headSha = run ? run.head_sha : context.sha;
            const runUrl = run ? run.html_url : `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            let signal = 'CI_INFORMATIONAL';
            let next = 'Use autopilot-v2/controller.py status and continue the highest-priority ready task contract.';
            if (conclusion === 'success') {
              signal = 'CI_SUCCESS';
              next = 'Continue immediately from controller status; do not wait for redundant checks.';
            } else if (['failure','timed_out','cancelled','action_required'].includes(conclusion)) {
              signal = 'CI_NEEDS_ATTENTION';
              next = 'Inspect this single failed gate first; do not launch the retired full matrix.';
            }
            const body = [
              '# Autopilot runtime state', '',
              '> Lean CI handoff for Autopilot and Autopilot 2.0.', '',
              `- Updated: ${new Date().toISOString()}`,
              `- Workflow: **${workflow}**`,
              `- Conclusion: **${conclusion}**`,
              `- Signal: **${signal}**`,
              `- Head SHA: \`${headSha}\``,
              `- Run ID: \`${runId}\``,
              `- Run: ${runUrl}`, '',
              '## Recommended next action', next, '',
              '## Execution truth',
              '`autopilot-v2/tasks/*.json` + `autopilot-v2/outcomes/*.json`; derive live status with `python3 autopilot-v2/controller.py status`.', '',
              '## CI policy',
              'Normal development uses Fast CI only. Production uses Deploy + Production smoke. Deep visual/live audits are not automatic gates.'
            ].join('\n');
            const found = await github.rest.issues.listForRepo({owner, repo, state:'open', per_page:100});
            const issue = found.data.find(i => i.title === title && !i.pull_request);
            if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
            else await github.rest.issues.create({owner, repo, title, body});
