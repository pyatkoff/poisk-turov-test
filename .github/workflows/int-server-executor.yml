name: INT permanent server executor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/int-server-executor.yml'
      - 'scripts/deploy/int_server_executor.py'
      - 'scripts/deploy/int_server_executor_passive_fuel_readiness.py'
      - 'tests/int_server_executor_passive_fuel_install_test.py'
      - 'scripts/deploy/int_server_executor_anex_secret_transport.py'
      - 'scripts/deploy/int_server_executor_firstpage_readback.py'
      - 'scripts/deploy/int_server_executor_match_primary.py'
      - 'tests/int_server_executor_test.py'
      - 'tests/int_server_executor_anex_secret_transport_test.py'
      - 'tests/int_server_executor_firstpage_readback_test.py'
      - 'scripts/deploy/int_server_executor_search3_signing.py'
      - 'tests/int_server_executor_search3_signing_test.py'
      - 'tests/int_server_executor_match_primary_test.py'
      - 'scripts/deploy/int_server_executor_local_profile_plan.py'
      - 'scripts/diagnostics/local_profile_plan_4191.php'
      - 'tests/int_server_executor_local_profile_plan_test.py'
      - 'scripts/deploy/int_server_executor_local_profile_apply.py'
      - 'scripts/diagnostics/local_profile_apply_4191.php'
      - 'tests/int_server_executor_local_profile_apply_test.py'
      - 'scripts/deploy/int_server_executor_local_profile_acquire.py'
      - 'scripts/diagnostics/local_profile_acquire_4191.php'
      - 'tests/int_server_executor_local_profile_acquire_test.py'
      - 'scripts/deploy/int_server_executor_local_profile_apply_source320.py'
      - 'scripts/diagnostics/local_profile_apply_source320_4191.php'
      - 'tests/int_server_executor_local_profile_apply_source320_test.py'
      - 'scripts/diagnostics/int_funsun_direction_store_server_readback.py'
      - 'tests/int_funsun_direction_store_server_readback_test.py'
      - 'scripts/diagnostics/local_profile_mass_plan_4191.php'
      - 'tests/int_server_executor_local_profile_mass_plan_test.py'
      - 'scripts/diagnostics/local_profile_mass_plan2_4191.php'
      - 'tests/int_server_executor_local_profile_mass_plan2_test.py'
      - 'scripts/diagnostics/local_profile_mass_plan3_4191.php'
      - 'tests/int_server_executor_local_profile_mass_plan3_test.py'
      - 'scripts/diagnostics/local_profile_mass_apply_4191.php'
      - 'tests/int_server_executor_local_profile_mass_apply_test.py'
      - 'scripts/diagnostics/local_profile_mass_apply2_4191.php'
      - 'tests/int_server_executor_local_profile_mass_apply2_test.py'
      - 'scripts/deploy/int_server_executor_local_profile_recovery_plan.py'
      - 'tests/int_server_executor_local_profile_recovery_plan_test.py'
      - 'scripts/deploy/int_server_executor_local_tv_schema.py'
      - 'scripts/diagnostics/local_tv_schema_v1.php'
      - 'tests/int_server_executor_local_tv_schema_test.py'
      - 'scripts/deploy/int_server_executor_local_tv_seed.py'
      - 'scripts/diagnostics/local_tv_seed_v1.php'
      - 'tests/int_server_executor_local_tv_seed_test.py'
      - 'scripts/deploy/int_server_executor_local_tv_content.py'
      - 'scripts/diagnostics/local_tv_content_v1.php'
      - 'tests/int_server_executor_local_tv_content_test.py'
      - 'scripts/deploy/int_server_executor_local_tv_capture.py'
      - 'scripts/deploy/int_server_executor_local_stay_read.py'
      - 'tests/int_server_executor_local_stay_read_test.py'
      - 'scripts/diagnostics/local_tv_capture_v1.php'
      - 'tests/int_server_executor_local_tv_capture_test.py'
      - 'tests/local_tv_capture_workflow_test.py'
      - 'scripts/deploy/int_server_executor_match_retained.py'
      - 'scripts/deploy/fixtures/hotel_match_retained_scope_catalogue_v1.json'
      - 'tests/int_server_executor_match_retained_test.py'
  workflow_dispatch:
    inputs:
      owner_command:
        description: Exact /run-int-server-v1 command, including install-runtime
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local_tv_schema_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal_tv_schema_test_only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: PHP for native schema acceptance
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring
      - name: Exact accepted LOCAL stay read source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 516ab32e7ea3f23e0d071343143e207e3d9bbefe
          path: local-stay-source
          persist-credentials: false
      - name: LOCAL fixed anchor read controller and actual read-only terminal
        env:
          LOCAL_STAY_SOURCE_ROOT: ${{ github.workspace }}/local-stay-source
          LOCAL_STAY_TEST_PASSWORD: local_tv_schema_test_only
        run: |
          python3 -m py_compile scripts/deploy/int_server_executor_local_stay_read.py
          python3 tests/int_server_executor_local_stay_read_test.py -v
      - name: Exact reviewed private TV session gateway source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f4d4dcae0c09b92a7e4024fc202ea3e23d7822db
          path: tv-session-source
          persist-credentials: false
      - name: Exact reviewed TV diagnostic client source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 771e3834ed8b232b21a33e68cc0dda97a82a32f0
          path: tv-diagnostic-source
          persist-credentials: false
      - name: Exact merged TV cache revocation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a4a12e6a84d39397b2457bc3acdde0a738b8b744
          path: tv-cache-source
          persist-credentials: false
      - name: Exact merged TV context revocation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 95b70987966675e385809ee04cb2e2ea8ea4f4b6
          path: tv-context-source
          persist-credentials: false
      - name: Exact merged TV mismatch fields source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: d0c32007278f3d9d4af262776f99c76d432ddaa9
          path: tv-fields-source
          persist-credentials: false
      - name: Exact merged TV calendar-day source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f902864fcbba3c69f1d7d5404a577c17c462ec66
          path: tv-day-source
          persist-credentials: false
      - name: Exact merged TV limit diagnostics source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 02ebc7d4391f73307fc3a8dc737507101aa5f2b1
          path: tv-limit-source
          persist-credentials: false
      - name: Exact merged owner-authorized TV640 capacity source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f7218b974e2c4dfa0f7ea97119898e2cdcbf2486
          path: tv-cap-source
          persist-credentials: false
      - name: Exact merged owner-authorized TV20MiB capacity source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 0348c66a3deff138e47096b81c958a33ff7354df
          path: tv-bytes-source
          persist-credentials: false
      - name: Exact merged TV scoped checkpoint source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: e57c2fba33e4df1bcd0a70efdab10a2e7a81a081
          path: tv-checkpoint-source
          persist-credentials: false
      - name: Exact merged TV party and listing retirement source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 343fe6a263ce9e728481916d6b2d56448f544952
          path: tv-party-source
          persist-credentials: false
      - name: Exact merged TV numeric admission source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9fc116b4cd26695c3a4d5f4b9ed1bf6b9e1f1e44
          path: tv-numeric-source
          persist-credentials: false
      - name: Exact reviewed LOCAL schema source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 3cc3d29595c8a9ec71a0435ee2efeb939c40adb6
          path: local-tv-source
          persist-credentials: false
      - name: New LOCAL schema actual MySQL and executor contract
        env:
          LOCAL_TV_SCHEMA_SOURCE_ROOT: ${{ github.workspace }}/local-tv-source
          LOCAL_TV_SCHEMA_NATIVE_CI: '1'
          LOCAL_TV_SCHEMA_TEST_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          LOCAL_TV_SCHEMA_TEST_PASSWORD: local_tv_schema_test_only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy/int_server_executor_local_tv_schema.py
          php -l scripts/diagnostics/local_tv_schema_v1.php
          python3 tests/int_server_executor_local_tv_schema_test.py -v
      - name: Retained initialization and current LOCAL frontier MySQL acceptance
        env:
          LOCAL_TV_SCHEMA_SOURCE_ROOT: ${{ github.workspace }}/local-tv-source
          LOCAL_TV_SCHEMA_NATIVE_CI: '1'
          LOCAL_TV_SCHEMA_TEST_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          LOCAL_TV_SCHEMA_TEST_PASSWORD: local_tv_schema_test_only
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/local_tv_seed_v1.php
          python3 tests/int_server_executor_local_tv_seed_test.py -v
      - name: Independent new LOCAL content actual MySQL acceptance
        env:
          LOCAL_TV_SCHEMA_SOURCE_ROOT: ${{ github.workspace }}/local-tv-source
          LOCAL_TV_SCHEMA_NATIVE_CI: '1'
          LOCAL_TV_SCHEMA_TEST_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          LOCAL_TV_SCHEMA_TEST_PASSWORD: local_tv_schema_test_only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy/int_server_executor_local_tv_content.py
          php -l scripts/diagnostics/local_tv_content_v1.php
          python3 tests/int_server_executor_local_tv_content_test.py -v
      - name: Exact permanent LOCAL capture source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8af3e190588bf61b067f81838aec3f0201205ec9
          path: local-tv-capture-source
          persist-credentials: false
      - name: Permanent LOCAL capture and retained-only native acceptance
        env:
          LOCAL_TV_CAPTURE_SOURCE_ROOT: ${{ github.workspace }}/local-tv-capture-source
          LOCAL_TV_SCHEMA_NATIVE_CI: '1'
          LOCAL_TV_SCHEMA_TEST_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          LOCAL_TV_SCHEMA_TEST_PASSWORD: local_tv_schema_test_only
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy/int_server_executor_local_tv_capture.py
          php -l scripts/diagnostics/local_tv_capture_v1.php
          python3 tests/int_server_executor_local_tv_capture_test.py -v
          python3 tests/local_tv_capture_workflow_test.py -v
      - name: Exact reviewed MATCH retained source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: df27fbaff4d0be8945f3ccce2791205c3dbc82ec
          path: match-retained-source
          persist-credentials: false
      - name: MATCH retained intake and shared quota native acceptance
        env:
          MATCH_RETAINED_SOURCE_ROOT: ${{ github.workspace }}/match-retained-source
          MATCH_RETAINED_NATIVE_CI: '1'
          MATCH_RETAINED_TEST_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          MATCH_RETAINED_TEST_PASSWORD: local_tv_schema_test_only
        run: |
          set -euo pipefail
          php -l match-retained-source/scripts/diagnostics/hotel_match_retained_intake_v1.php
          php -l match-retained-source/scripts/diagnostics/hotel_match_retained_current_v1.php
          php -l match-retained-source/scripts/diagnostics/hotel_match_retained_anex_write_v1.php
          python3 tests/int_server_executor_match_retained_test.py -v
      - name: Exact passive fuel capture installation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 04c0647ac30e1fd195aaf78d3d538178dcd59ebb
          path: passive-fuel-install-source
          fetch-depth: 2
          persist-credentials: false
      - name: Exact prior-tour diagnostic application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fdcbccc87f9b22c32e74c6c1e4f64f52fbd49767
          path: prior-tour-install-source
          persist-credentials: false
      - name: One-helper passive fuel native stock install and rollback
        env:
          PASSIVE_FUEL_INSTALL_SOURCE_ROOT: ${{ github.workspace }}/passive-fuel-install-source
          PRIOR_TOUR_INSTALL_SOURCE_ROOT: ${{ github.workspace }}/prior-tour-install-source
        run: python3 tests/int_server_executor_passive_fuel_install_test.py -v
      - name: Validate permanent INT executor contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy/int_server_executor.py
          python3 tests/int_server_executor_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_anex_secret_transport.py
          python3 tests/int_server_executor_anex_secret_transport_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_firstpage_readback.py
          python3 tests/int_server_executor_firstpage_readback_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_search3_signing.py
          TV_SESSION_GATEWAY_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-session-source" TV_DIAGNOSTIC_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-diagnostic-source" TV_CACHE_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-cache-source" TV_CONTEXT_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-context-source" TV_FIELDS_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-fields-source" TV_DAY_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-day-source" TV_LIMIT_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-limit-source" TV_CAP_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-cap-source" TV_BYTES_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-bytes-source" TV_CHECKPOINT_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-checkpoint-source" TV_PARTY_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-party-source" TV_NUMERIC_SOURCE_ROOT="$GITHUB_WORKSPACE/tv-numeric-source" python3 tests/int_server_executor_search3_signing_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_match_primary.py
          python3 tests/int_server_executor_match_primary_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_plan.py
          php -l scripts/diagnostics/local_profile_plan_4191.php
          python3 tests/int_server_executor_local_profile_plan_test.py -v
          php -l scripts/diagnostics/local_profile_mass_plan_4191.php
          python3 tests/int_server_executor_local_profile_mass_plan_test.py -v
          php -l scripts/diagnostics/local_profile_mass_plan2_4191.php
          python3 tests/int_server_executor_local_profile_mass_plan2_test.py -v
          php -l scripts/diagnostics/local_profile_mass_plan3_4191.php
          python3 tests/int_server_executor_local_profile_mass_plan3_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_apply.py
          php -l scripts/diagnostics/local_profile_apply_4191.php
          python3 tests/int_server_executor_local_profile_apply_test.py -v
          php -l scripts/diagnostics/local_profile_mass_apply_4191.php
          python3 tests/int_server_executor_local_profile_mass_apply_test.py -v
          php -l scripts/diagnostics/local_profile_mass_apply2_4191.php
          python3 tests/int_server_executor_local_profile_mass_apply2_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_acquire.py
          php -l scripts/diagnostics/local_profile_acquire_4191.php
          python3 tests/int_server_executor_local_profile_acquire_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_apply_source320.py
          php -l scripts/diagnostics/local_profile_apply_source320_4191.php
          python3 tests/int_server_executor_local_profile_apply_source320_test.py -v
          python3 -m py_compile scripts/diagnostics/int_funsun_direction_store_server_readback.py
          python3 tests/int_funsun_direction_store_server_readback_test.py -v

  execute:
    concurrency:
      group: anytoour-int-server-executor
      cancel-in-progress: false
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      ((github.event_name == 'issue_comment' && github.event.action == 'created' &&
        github.event.issue.number == 4709 && !github.event.issue.pull_request &&
        github.event.comment.user.id == 226193297 && github.event.comment.author_association == 'OWNER' &&
        startsWith(github.event.comment.body, '/run-int-server-v1 ')) ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Trusted main control code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck executor contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/deploy/int_server_executor_local_tv_seed.py
          php -l scripts/diagnostics/local_tv_seed_v1.php
          python3 -m py_compile scripts/deploy/int_server_executor_local_tv_content.py
          php -l scripts/diagnostics/local_tv_content_v1.php
          python3 -m py_compile scripts/deploy/int_server_executor_local_tv_schema.py
          php -l scripts/diagnostics/local_tv_schema_v1.php
          python3 -m py_compile scripts/deploy/int_server_executor.py
          python3 tests/int_server_executor_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_anex_secret_transport.py
          python3 tests/int_server_executor_anex_secret_transport_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_firstpage_readback.py
          python3 tests/int_server_executor_firstpage_readback_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_search3_signing.py
          python3 tests/int_server_executor_search3_signing_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_match_primary.py
          python3 tests/int_server_executor_match_primary_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_plan.py
          php -l scripts/diagnostics/local_profile_plan_4191.php
          python3 tests/int_server_executor_local_profile_plan_test.py -v
          php -l scripts/diagnostics/local_profile_mass_plan_4191.php
          python3 tests/int_server_executor_local_profile_mass_plan_test.py -v
          php -l scripts/diagnostics/local_profile_mass_plan2_4191.php
          python3 tests/int_server_executor_local_profile_mass_plan2_test.py -v
          php -l scripts/diagnostics/local_profile_mass_plan3_4191.php
          python3 tests/int_server_executor_local_profile_mass_plan3_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_apply.py
          php -l scripts/diagnostics/local_profile_apply_4191.php
          python3 tests/int_server_executor_local_profile_apply_test.py -v
          php -l scripts/diagnostics/local_profile_mass_apply_4191.php
          python3 tests/int_server_executor_local_profile_mass_apply_test.py -v
          php -l scripts/diagnostics/local_profile_mass_apply2_4191.php
          python3 tests/int_server_executor_local_profile_mass_apply2_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_acquire.py
          php -l scripts/diagnostics/local_profile_acquire_4191.php
          python3 tests/int_server_executor_local_profile_acquire_test.py -v
          python3 -m py_compile scripts/deploy/int_server_executor_local_profile_apply_source320.py
          php -l scripts/diagnostics/local_profile_apply_source320_4191.php
          python3 tests/int_server_executor_local_profile_apply_source320_test.py -v
      - name: Parse and authorize exact current-source command
        id: command
        env:
          GH_TOKEN: ${{ github.token }}
          INT_OWNER_COMMAND: ${{ inputs.owner_command }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/int_server_executor_anex_secret_transport.py --parse-only > "$RUNNER_TEMP/int-command.txt"
          source_sha="$(sed -n 's/^source_sha=//p' "$RUNNER_TEMP/int-command.txt")"
          test "${#source_sha}" = 40
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          mode="$(sed -n 's/^mode=//p' "$RUNNER_TEMP/int-command.txt")"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Checkout exact authorized INT source privately on runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.command.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Recheck new MATCH source contract before its operation
        if: steps.command.outputs.mode == 'match-retained-intake' || steps.command.outputs.mode == 'match-tourvisor-quota-policy' || steps.command.outputs.mode == 'match-retained-readback' || steps.command.outputs.mode == 'match-retained-project' || steps.command.outputs.mode == 'match-retained-current' || steps.command.outputs.mode == 'match-retained-acquire' || steps.command.outputs.mode == 'match-retained-anex-write' || steps.command.outputs.mode == 'match-retained-anex-write-v2'
        env:
          MATCH_RETAINED_SOURCE_ROOT: ${{ github.workspace }}/source
        run: python3 tests/int_server_executor_match_retained_test.py -q
      - name: Execute bounded private INT operation, install, or DB/LOCAL readback
        env:
          GH_TOKEN: ${{ github.token }}
          INT_OWNER_COMMAND: ${{ inputs.owner_command }}
          INT_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          INT_SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          INT_SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          ANEX_API_TOKEN: ${{ secrets.ANEX_API_TOKEN }}
          ANEX_B2B_TOKEN: ${{ secrets.ANEX_B2B_TOKEN }}
        run: python3 scripts/deploy/int_server_executor_anex_secret_transport.py --source-root source
      - name: Preserve sanitized terminal receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: int-server-executor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/int-server-executor/result.json
          if-no-files-found: warn
          retention-days: 30

  direction-store-readback:
    concurrency:
      group: anytoour-int-server-executor
      cancel-in-progress: false
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      github.event_name == 'issue_comment' && github.event.action == 'created' &&
      github.event.issue.number == 4709 && !github.event.issue.pull_request &&
      github.event.comment.user.id == 226193297 && github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/run-int-direction-store-readback-v1 ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trusted main readback control only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck direction-store readback contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/diagnostics/int_funsun_direction_store_server_readback.py
          python3 tests/int_funsun_direction_store_server_readback_test.py -v
      - name: Read sanitized FUN&SUN direction store
        env:
          GH_TOKEN: ${{ github.token }}
          INT_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          INT_SSH_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          INT_SSH_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: python3 scripts/diagnostics/int_funsun_direction_store_server_readback.py
      - name: Preserve sanitized direction-store receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: int-direction-store-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/int-direction-store-readback/result.json
          if-no-files-found: warn
          retention-days: 30



