name: Search3 meal provider mapping activation contract
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'scripts/deploy/search3_meal_provider_mapping_activate_v1.php'
      - 'tests/search3_meal_provider_mapping_activate_v1_test.php'
      - 'v2/data/migrations/20260923-anytour-search-meal-provider-mappings-v1.sql'
      - '.github/workflows/search3-meal-provider-mapping-activation-contract.yml'

permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: search3_meal_activation_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Static dormant-operation guard
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/deploy/search3_meal_provider_mapping_activate_v1.php
          php -l tests/search3_meal_provider_mapping_activate_v1_test.php
          ! grep -Eq 'issue_comment:|workflow_dispatch:|repository_dispatch:|schedule:' .github/workflows/search3-meal-provider-mapping-activation-contract.yml
          ! grep -Eq 'secrets\.|ssh-action|scp-action|ssh[[:space:]]+-' .github/workflows/search3-meal-provider-mapping-activation-contract.yml
          ! grep -Eq 'curl[[:space:]]|file_get_contents\([[:space:]]*["'"']https?://' scripts/deploy/search3_meal_provider_mapping_activate_v1.php
          grep -Fq 'SEARCH3_MEAL_WRITE_NOT_AUTHORIZED' scripts/deploy/search3_meal_provider_mapping_activate_v1.php
          grep -Fq '20260923-anytour-search-meal-provider-mappings-v1.sql' scripts/deploy/search3_meal_provider_mapping_activate_v1.php
          ! grep -Fq 'anytour_search_meal_memberships_v1' v2/data/migrations/20260923-anytour-search-meal-provider-mappings-v1.sql
      - name: Exercise disposable MySQL activation contract
        env:
          SEARCH3_MEAL_ACTIVATION_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=search3_meal_activation_fixture;charset=utf8mb4'
          SEARCH3_MEAL_ACTIVATION_TEST_USER: root
          SEARCH3_MEAL_ACTIVATION_TEST_PASSWORD: fixture-only-password
        run: php tests/search3_meal_provider_mapping_activate_v1_test.php
