name: Search3 meal provider mapping activation contract
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'scripts/deploy/search3_meal_provider_mapping_activate_v1.php'
      - 'tests/search3_meal_provider_mapping_activate_v1_test.php'
      - 'v2/data/migrations/20260923-anytour-search-meal-provider-mappings-v1.sql'
      - '.github/workflows/search3-meal-provider-mapping-activation-contract.yml'

permissions:
  contents: read

jobs:
  activation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-only-password
          MYSQL_DATABASE: anytour_search3_meal_activate_fixture
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - name: Guard dormant activation surface
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/deploy/search3_meal_provider_mapping_activate_v1.php
          php -l tests/search3_meal_provider_mapping_activate_v1_test.php
          ! grep -REn 'secrets\.|ssh|scp|rsync|curl|https?://' \
            scripts/deploy/search3_meal_provider_mapping_activate_v1.php \
            tests/search3_meal_provider_mapping_activate_v1_test.php
          ! grep -En 'workflow_dis''patch|issue_com''ment|sched''ule:' \
            .github/workflows/search3-meal-provider-mapping-activation-contract.yml
          grep -Fq "MEAL_ACTIVATE_MIGRATION_SHA256 = 'fded346b412df53640e64910fe92ff8bb6d0cf92c892170de89b185479b1653b'" scripts/deploy/search3_meal_provider_mapping_activate_v1.php
          grep -Fq "MEAL_ACTIVATE_EVIDENCE_SHA256 = 'a0755910d8e46c4f85021de5cae1ec88f29a2a811d4cc4f5c02d6c8ea0dfa4fa'" scripts/deploy/search3_meal_provider_mapping_activate_v1.php
      - name: Exercise plan schema seed and fail-closed cases in disposable MySQL
        env:
          ANYTOUR_SEARCH3_MEAL_ACTIVATE_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_search3_meal_activate_fixture;charset=utf8mb4'
          ANYTOUR_SEARCH3_MEAL_ACTIVATE_USER: root
          ANYTOUR_SEARCH3_MEAL_ACTIVATE_PASSWORD: fixture-only-password
          ANYTOUR_SEARCH3_MEAL_ACTIVATE_EXPECTED_DB: anytour_search3_meal_activate_fixture
        run: php tests/search3_meal_provider_mapping_activate_v1_test.php
