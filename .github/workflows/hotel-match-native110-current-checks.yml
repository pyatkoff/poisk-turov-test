name: MATCH native110 current review checks
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_native110_current_v1.php'
      - 'scripts/diagnostics/fixtures/hotel_match_native110_current_v1.json'
      - 'tests/hotel_match_native110_current_v1_test.php'
      - '.github/workflows/hotel-match-native110-current-checks.yml'
permissions:
  contents: read
jobs:
  offline-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate read-only source and isolated holds
        run: |
          php -l scripts/diagnostics/hotel_match_native110_current_v1.php
          php -l tests/hotel_match_native110_current_v1_test.php
          php tests/hotel_match_native110_current_v1_test.php
