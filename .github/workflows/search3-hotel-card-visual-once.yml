name: Search3 hotel-card visual acceptance once

on:
  push:
    branches:
      - ux/search3-hotel-card-summary-20260912
    paths:
      - '.github/workflows/search3-hotel-card-visual-once.yml'

permissions:
  contents: read

jobs:
  current-results-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-hotel-card-summary-20260912
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/search3-browser-tools" --no-audit --no-fund --no-save playwright@1.55.0
          "$RUNNER_TEMP/search3-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run exact current-results browser acceptance
        shell: bash
        env:
          SEARCH3_VISUAL_BASE: http://127.0.0.1:8098
          SEARCH3_RESULTS_OUTPUT: ${{ runner.temp }}/search3-current-results
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8098 -t v2 >"$RUNNER_TEMP/search3-visual-php.log" 2>&1 &
          php_pid=$!
          trap 'kill "$php_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:8098/poisk-turov/ -o /dev/null && break
            sleep 0.25
          done
          mkdir -p "$SEARCH3_RESULTS_OUTPUT"
          NODE_PATH="$RUNNER_TEMP/search3-browser-tools/node_modules" node tests/search3-current-results-browser.cjs
          test -s "$SEARCH3_RESULTS_OUTPUT/current-375.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/current-1024.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/current-1440.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-collapsed-375.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-expanded-375.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-collapsed-1440.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-expanded-1440.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-no-photo-375.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-no-photo-1024.png"
          test -s "$SEARCH3_RESULTS_OUTPUT/results-no-photo-1440.png"
          kill "$php_pid" >/dev/null 2>&1 || true
          trap - EXIT
      - name: Upload exact browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: search3-hotel-card-visual-${{ github.sha }}
          path: ${{ runner.temp }}/search3-current-results
          if-no-files-found: error
          retention-days: 7
