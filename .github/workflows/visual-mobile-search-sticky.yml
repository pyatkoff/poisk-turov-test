name: Visual mobile search sticky

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/mobile-search-summary-v1.css'
      - 'v2/mobile-search-summary-v1.js'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/visual-mobile-search-sticky.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sticky-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build branch bundles
        shell: bash
        run: |
          set -euo pipefail
          php -r '$_GET=["type"=>"css"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/branch-bundle.css"
          php -r '$_GET=["type"=>"js"]; include "v2/bundle-v1.php";' > "$RUNNER_TEMP/branch-bundle.js"
      - name: Capture mobile sticky evidence
        shell: bash
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
          BRANCH_CSS: ${{ runner.temp }}/branch-bundle.css
          BRANCH_JS: ${{ runner.temp }}/branch-bundle.js
        run: |
          set -euo pipefail
          mkdir -p mobile-sticky-artifacts
          cat > mobile-sticky-visual.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const css=fs.readFileSync(process.env.BRANCH_CSS),js=fs.readFileSync(process.env.BRANCH_JS);
          const sizes=[['mobile-375',375,812],['mobile-430',430,932]];
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
            for(const [name,width,height] of sizes){const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              await page.route('**/*',route=>{const u=new URL(route.request().url());if(u.pathname.endsWith('/bundle-v1.php')){const t=u.searchParams.get('type');if(t==='css')return route.fulfill({status:200,contentType:'text/css; charset=UTF-8',body:css});if(t==='js')return route.fulfill({status:200,contentType:'application/javascript; charset=UTF-8',body:js});}return route.continue();});
              const response=await page.goto(process.env.V2_URL,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(4000);
              await page.screenshot({path:`mobile-sticky-artifacts/${name}-top.png`,fullPage:false,animations:'disabled'});
              const top=await page.evaluate(()=>{const s=document.querySelector('.mobile-search-sticky'),b=document.querySelector('.search-submit');const r=s?.getBoundingClientRect(),br=b?.getBoundingClientRect();const inlineDisplayed=!!b&&getComputedStyle(b).display!=='none';return{visible:!!s&&!s.hidden&&getComputedStyle(s).display!=='none',height:r?.height||0,bottom:r?innerHeight-r.bottom:null,rightClearance:r?innerWidth-r.right:0,inlineInViewport:inlineDisplayed&&!!br&&br.bottom>0&&br.top<innerHeight,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2};});
              await page.evaluate(()=>document.querySelector('.mobile-search-submit-sentinel')?.scrollIntoView({block:'center'}));await page.waitForTimeout(250);
              await page.screenshot({path:`mobile-sticky-artifacts/${name}-boundary.png`,fullPage:false,animations:'disabled'});
              const boundary=await page.evaluate(()=>{const s=document.querySelector('.mobile-search-sticky'),b=document.querySelector('.search-submit');return{stickyVisible:!!s&&!s.hidden&&getComputedStyle(s).display!=='none',inlineVisible:!!b&&getComputedStyle(b).display!=='none'};});
              const topStickyWrong=top.inlineInViewport?top.visible:(!top.visible||top.height>64||top.rightClearance<72);
              const bad=(response?.status()||0)!==200||errors.length||topStickyWrong||top.overflow||boundary.stickyVisible||!boundary.inlineVisible;report.push({name,top,boundary,errors,bad});if(bad)failed=true;await context.close();}
            fs.writeFileSync('mobile-sticky-artifacts/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node mobile-sticky-visual.cjs
      - name: Upload mobile sticky screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-search-sticky-${{ github.event.pull_request.number || github.sha }}
          path: mobile-sticky-artifacts/
          retention-days: 30
