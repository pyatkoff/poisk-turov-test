name: MATCH old Tourvisor JWT ANEX evidence probe
on:
  push:
    branches: [match/manual-live-review-queue-1971-20260914]
    paths:
      - 'scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php'
      - '.github/workflows/hotel-match-old-tv-jwt-anex-probe.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-old-tv-jwt-anex-probe-1971-20260914-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-old-tv-jwt-anex-probe-1971-20260914-v1-egypt-2026-10-27
  MATCH_COUNTRY: egypt
  MATCH_DATE: '2026-10-27'
  OUT: /tmp/match-old-tv-jwt-anex-probe-v1
jobs:
  probe:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Offline scope checks
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php
          php scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php --self-test
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php
          grep -Fq "tourvisor_credential_identifier'=>'TOURVISOR_JWT" scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php
          grep -Fq "v2_data_tv_get('/tours/search'" scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php
      - name: Prepare SSH and execute one immutable server-CURRENT evidence slice
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          key="$RUNNER_TEMP/match-old-tv-key"; known="$RUNNER_TEMP/match-old-tv-known"; sock="$RUNNER_TEMP/match-old-tv.sock"
          cleanup() { ssh -S "$sock" -O exit "$USER@$HOST" >/dev/null 2>&1 || true; rm -f "$key" "$known"; }
          trap cleanup EXIT
          test -n "$KEY" && test -n "$HOST" && test -n "$USER"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          ok=0
          for n in 1 2 3; do
            rm -f "$sock"
            if ssh -M -S "$sock" -fnNT -o ControlPersist=600 -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$USER@$HOST"; then ok=1; break; fi
            sleep $((n*8))
          done
          test "$ok" = 1
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" 'cd "$HOME/www/anytoour.ru" && test -f config.php && printf OK' | grep -qx OK
          set +e
          ssh -S "$sock" -T -o ControlMaster=no -o ServerAliveInterval=15 -o ServerAliveCountMax=6 "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' MATCH_COUNTRY='$MATCH_COUNTRY' MATCH_DATE='$MATCH_DATE' php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M -" < scripts/diagnostics/hotel_match_old_tv_jwt_anex_probe.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"
          trc=$?
          set -e
          if [[ $trc -eq 0 && -s "$OUT/server-operation.tgz" ]]; then tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; fi
          export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['OUT'])
          def load(n):
              try:return json.loads((out/n).read_text())
              except Exception:return {}
          reservation=load('reservation.json'); result=load('result.json'); receipt=load('receipt.json')
          rh=hashlib.sha256((out/'result.json').read_bytes()).hexdigest() if (out/'result.json').exists() else None
          terminal=result.get('status') in {'completed','blocked'}
          ok=(terminal and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('tourvisor_credential_identifier')=='TOURVISOR_JWT'
              and reservation.get('state')=='reserved_before_db_and_supplier_access' and reservation.get('source_sha')==os.environ['GITHUB_SHA']
              and receipt.get('readback_verified') is True and receipt.get('result_sha256')==rh
              and all(result.get(k)==0 for k in ('database_writes','mapping_writes','booking_calls','lead_calls')))
          gate={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'verified':ok,'status':result.get('status'),'reason':result.get('reason'),
                'remote_exit':int(os.environ['RC']),'tar_exit':int(os.environ['TRC']),'tourvisor_credential_identifier':result.get('tourvisor_credential_identifier'),
                'tourvisor_calls':result.get('tourvisor_calls'),'anex_operator_rows':result.get('anex_operator_rows'),'strict_operator_identities':result.get('strict_operator_identities'),
                'safe_current_candidates':result.get('safe_current_candidates'),'result_sha256':rh,'no_replay':True}
          (out/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-old-tv-jwt-anex-probe-${{ github.run_id }}
          path: ${{ env.OUT }}/
          retention-days: 90
