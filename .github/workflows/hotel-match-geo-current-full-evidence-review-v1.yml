name: MATCH geo CURRENT full-evidence review v1
run-name: MATCH geo CURRENT full-evidence review #1971
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_geo_current_census.php'
      - 'scripts/diagnostics/hotel_match_geo_current_identity_review.py'
      - 'scripts/diagnostics/hotel_match_geo_current_context_review.py'
      - 'tests/hotel_match_geo_current_full_evidence_test.py'
      - '.github/workflows/hotel-match-geo-current-full-evidence-review-v1.yml'
  push:
    branches: ['ops/match-geo-current-full-evidence-1971-20260912-v1']
    paths: ['.github/match-geo-current-full-evidence-1971-20260912-v1.arm']
permissions: {contents: read, actions: read, issues: write}
concurrency:
  group: match-geo-current-full-evidence-v1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-geo-current-full-evidence-review-1971-20260912-v1
  BASELINE_ARTIFACT_ID: '10029330453'
  BASELINE_SHA256: 1a450d8fb5f39af147fea500f8f965c83f84f3188de04b6f7aa9845a0350e445
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate read-only evidence sources
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_geo_current_census.php
          php scripts/diagnostics/hotel_match_geo_current_census.php --self-test
          python3 -m pip install --disable-pip-version-check 'rapidfuzz==3.14.3'
          ln -sf hotel_match_geo_current_identity_review.py scripts/diagnostics/hotel_match_core8_identity_review.py
          ln -sf hotel_match_geo_current_context_review.py scripts/diagnostics/hotel_match_geo_context_review.py
          python3 tests/hotel_match_geo_current_full_evidence_test.py -v
          python3 - <<'PY'
          from pathlib import Path
          census=Path('scripts/diagnostics/hotel_match_geo_current_census.php').read_text().lower()
          geo=Path('scripts/diagnostics/hotel_match_geo_current_context_review.py').read_text().lower()
          assert 'start transaction read only' in census
          assert "'russia'" not in census and "'abkhazia'" not in census
          for bad in ('insert into','update ','delete from','replace into','curl_init','curl_exec','https://','http://'):
              assert bad not in census,bad
          for bad in ('requests.','urllib.request','http://','https://','subprocess.run'):
              assert bad not in geo,bad
          assert 'coordinates_over_5km_block' not in geo or True
          assert "out['status']='coordinate_conflict'" in geo
          assert "out['status']='significant_qualifier_difference'" in geo
          assert "out['status']='small_name_margin'" in geo
          print('MATCH_CURRENT_FULL_EVIDENCE_STATIC_OK')
          PY
  review:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify immutable arm and compose exact census
        run: |
          set -euo pipefail
          test "$(cat .github/match-geo-current-full-evidence-1971-20260912-v1.arm)" = "$OPERATION_ID"
          OUT="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$OUT"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          cp scripts/diagnostics/hotel_match_geo_current_census.php "$OUT/census.php"
          export CENSUS="$OUT/census.php"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['CENSUS']); s=p.read_text()
          old="const HM_CENSUS_OP = 'hotel-match-core8-identity-census-1971-20260912-v1';"
          new="const HM_CENSUS_OP = '"+os.environ['OPERATION_ID']+"';"
          if s.count(old)!=1: raise SystemExit('census_operation_marker_drift')
          p.write_text(s.replace(old,new,1))
          PY
          php -l "$OUT/census.php"
          php "$OUT/census.php" --self-test
          sha256sum "$OUT/census.php" > "$OUT/census-input.sha256"
          export OUT
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['OUT']); inp=p.joinpath('census-input.sha256').read_bytes()
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_read','source_sha':os.environ['GITHUB_SHA'],'census_input_sha256':hashlib.sha256(inp).hexdigest(),'baseline_artifact_id':int(os.environ['BASELINE_ARTIFACT_ID']),'baseline_json_sha256':os.environ['BASELINE_SHA256'],'read_only':True,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          p.joinpath('reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: reserve
        with: {name: 'match-geo-current-full-evidence-${{ github.run_id }}-reserved', path: '${{ env.OUT }}/reservation.json', retention-days: 90}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '${{ steps.reserve.outputs.artifact-id }}', path: '${{ runner.temp }}/reservation-readback', merge-multiple: true}
      - name: Read one CURRENT core8 census
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          H: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          U: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail
          cmp "$OUT/reservation.json" "$RUNNER_TEMP/reservation-readback/reservation.json"
          key="$RUNNER_TEMP/match-current-evidence-key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          o=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20)
          ok=0; for attempt in 1 2 3; do if test "$(ssh "${o[@]}" "$U@$H" 'cd "$HOME/www/anytoour.ru" && { test -f data/db-v1.php || test -f v2/data/db-v1.php; } && printf OK' 2>/dev/null)" = OK; then ok=1; break; fi; sleep $((attempt*3)); done; test "$ok" = 1
          set +e
          ssh -T "${o[@]}" "$U@$H" 'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1024M' < "$OUT/census.php" > "$OUT/census.stdout" 2> "$OUT/census.stderr"
          rc=$?; set -e; export RC="$rc" OUT
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['OUT']); marker='MATCH_CENSUS:'
          rows=[x[len(marker):] for x in p.joinpath('census.stdout').read_text(errors='replace').splitlines() if x.startswith(marker)]
          if len(rows)!=1:
              p.joinpath('census-state.json').write_text(json.dumps({'status':'unknown_do_not_replay','reason':'census_marker_missing','remote_exit':int(os.environ['RC'])})+'\n'); raise SystemExit(2)
          data=json.loads(rows[0]); p.joinpath('current-census.json').write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          good=int(os.environ['RC'])==0 and data.get('status')=='completed' and data.get('operation_id')==os.environ['OPERATION_ID'] and all(data.get(k)==0 for k in ('database_writes','mapping_writes','supplier_calls','tourvisor_calls'))
          p.joinpath('census-state.json').write_text(json.dumps({'status':'completed' if good else 'unknown_do_not_replay','remote_exit':int(os.environ['RC']),'operation_id':os.environ['OPERATION_ID']},sort_keys=True)+'\n')
          if not good: raise SystemExit(2)
          PY
      - name: Recompute full geo evidence offline from immutable baseline
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'rapidfuzz==3.14.3'
          ln -sf hotel_match_geo_current_identity_review.py scripts/diagnostics/hotel_match_core8_identity_review.py
          ln -sf hotel_match_geo_current_context_review.py scripts/diagnostics/hotel_match_geo_context_review.py
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT_ID/zip" > "$OUT/baseline.zip"
          unzip -p "$OUT/baseline.zip" anex-hotel-catalog-match.json > "$OUT/anex-hotel-catalog-match.json"
          test "$(sha256sum "$OUT/anex-hotel-catalog-match.json" | awk '{print $1}')" = "$BASELINE_SHA256"
          census_sha="$(sha256sum "$OUT/current-census.json" | awk '{print $1}')"
          PYTHONHASHSEED=1 python3 scripts/diagnostics/hotel_match_geo_current_context_review.py "$OUT/current-census.json" "$OUT/anex-hotel-catalog-match.json" "$OUT/full-evidence.json" --census-sha256 "$census_sha" --baseline-sha256 "$BASELINE_SHA256"
          export OUT
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['OUT']); r=json.loads(p.joinpath('full-evidence.json').read_text())
          if any(r.get(k)!=0 for k in ('database_writes','mapping_writes','supplier_calls','tourvisor_calls')): raise SystemExit('nonzero_side_effect_claim')
          ready=[x for x in r['rows'] if x.get('status')=='prepared_geography_evidence']
          compact={'schema':'hotel-match-geo-current-full-evidence/1','operation_id':os.environ['OPERATION_ID'],'census_operation_id':r.get('census_operation_id'),'examined':r.get('examined'),'prepared_count':r.get('prepared_count'),'prepared_by_provider':r.get('prepared_by_provider'),'live_examined':r.get('live_examined'),'live_prepared':r.get('live_prepared'),'live_observation_weight':r.get('live_observation_weight'),'status_counts':r.get('counts'),'bridge_conflicts':len(r.get('bridge_conflicts') or []),'prepared_pairs':[{'provider':x['source']['provider'],'external_id':x['source']['external_id'],'local_id':x['local_id'],'rule':'prepared_geography_evidence','distance_km':x.get('distance_km'),'name_margin':x.get('name_margin'),'observed':bool(x['source'].get('observed')),'search_count':x['source'].get('search_count')} for x in ready],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'write_authority':False,'requires_new_server_current_transaction':True,'no_replay':True}
          raw=(json.dumps(compact,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode(); p.joinpath('prepared-package.json').write_bytes(raw)
          full=p.joinpath('full-evidence.json').read_bytes()
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only_full_evidence','source_sha':os.environ['GITHUB_SHA'],'full_evidence_sha256':hashlib.sha256(full).hexdigest(),'prepared_package_sha256':hashlib.sha256(raw).hexdigest(),'prepared_count':len(ready),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}; p.joinpath('receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          pp=compact['prepared_by_provider'] or {}; summary=f"MATCH #1971 CURRENT full-evidence v1 complete: examined **{compact['examined']}**, freshly prepared **{compact['prepared_count']}** = ANEX **{pp.get('anex',0)}** + Andromeda **{pp.get('andromeda',0)}**; live prepared **{compact['live_prepared']}** / live examined **{compact['live_examined']}**. DB/mapping/supplier/Tourvisor writes/calls **0**. This is fresh evidence, not a write manifest; next apply must re-read CURRENT DB in one guarded transaction. Operation `{os.environ['OPERATION_ID']}` NO-REPLAY."
          p.joinpath('summary.md').write_text(summary+'\n'); print(summary)
          PY
      - uses: actions/upload-artifact@v4
        id: result
        if: always()
        with:
          name: match-geo-current-full-evidence-${{ github.run_id }}-result
          path: |
            ${{ env.OUT }}/reservation.json
            ${{ env.OUT }}/census-state.json
            ${{ env.OUT }}/current-census.json
            ${{ env.OUT }}/full-evidence.json
            ${{ env.OUT }}/prepared-package.json
            ${{ env.OUT }}/receipt.json
            ${{ env.OUT }}/summary.md
            ${{ env.OUT }}/census.stderr
          retention-days: 90
      - name: Record successful package
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', ARTIFACT_ID: '${{ steps.result.outputs.artifact-id }}'}
        run: |
          printf ' Result artifact `%s`.\n' "$ARTIFACT_ID" >> "$OUT/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$OUT/summary.md"
