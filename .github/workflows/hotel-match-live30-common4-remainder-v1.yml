name: MATCH live30 COMMON4 remainder v1
on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_live30_common4_remainder_v1.py'
      - 'tests/hotel_match_live30_common4_remainder_v1_test.py'
      - '.github/workflows/hotel-match-live30-common4-remainder-v1.yml'
permissions: {contents: read}
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/diagnostics/hotel_match_live30_common4_remainder_v1.py
      - run: python3 scripts/diagnostics/hotel_match_live30_common4_remainder_v1.py --self-test
      - run: python3 tests/hotel_match_live30_common4_remainder_v1_test.py
