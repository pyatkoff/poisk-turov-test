          print(json.dumps({'counts':result.get('counts'),'coverage':result.get('coverage'),'safe':safe},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-anex-public-evidence-current-reconcile-v2-result
          path: ${{ runner.temp }}/hotel-match-anex-public-evidence-current-reconcile-1971-20260914-v2/
          retention-days: 90
