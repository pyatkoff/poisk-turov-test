name: Validate anytoour.ru standalone

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/validate-anytoour-standalone.yml'
      - '.github/workflows/deploy-anytoour.yml'
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/validate-anytoour-standalone.yml'
      - '.github/workflows/deploy-anytoour.yml'

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -euo pipefail
          for f in v2/index.php v2/home-entry-v1.php v2/home-v1.php v2/poisk-turov/index.php v2/hot/index.php v2/contacts/index.php v2/how-to-buy/index.php v2/rb/index.php v2/site-page-shell-v1.php v2/assets.php v2/api-v2.php v2/lead-bridge-v1.php v2/bundle-v1.php v2/analytics-config.php v2/privacy-config.php v2/seo-config.php; do
            php -l "$f"
          done
      - name: Render standalone homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/empty-document-root
          php -d display_errors=1 -r '
            $_SERVER["DOCUMENT_ROOT"]="/tmp/empty-document-root";
            $_SERVER["SCRIPT_NAME"]="/index.php";
            $_SERVER["HTTP_HOST"]="anytoour.ru";
            $_GET=[];
            ob_start(); include "v2/home-entry-v1.php"; $html=ob_get_clean();
            if (strpos($html, "AnyTour — поиск и подбор туров онлайн") === false) exit(10);
            if (strpos($html, "action=\"/poisk-turov/\"") === false) exit(11);
            if (strpos($html, "<link rel=\"canonical\" href=\"https://anytoour.ru/\"") === false) exit(12);
            if (strpos($html, "content=\"noindex,follow,max-image-preview:large\"") === false) exit(13);
            if (strpos($html, "https://schema.org") === false || strpos($html, "TravelAgency") === false || strpos($html, "WebSite") === false) exit(14);
            if (strpos($html, "href=\"/rb/\"") === false || strpos($html, "Раннее бронирование") === false) exit(15);
            if (strpos($html, "Мы переносим") !== false || strpos($html, "Разделы нового AnyTour") !== false) exit(16);
            echo "STANDALONE_HOME_RENDER_OK\n";
          '
      - name: Render hot-tour handoff
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=1 -r '
            $_SERVER["DOCUMENT_ROOT"]="/tmp/empty-document-root";
            $_SERVER["SCRIPT_NAME"]="/hot/index.php";
            $_SERVER["HTTP_HOST"]="anytoour.ru";
            $_GET=[];
            ob_start(); include "v2/hot/index.php"; $html=ob_get_clean();
            if (strpos($html, "/poisk-turov/?dateFrom=") === false || strpos($html, "&amp;dateTo=") === false) exit(17);
            if (strpos($html, "Старый раздел") !== false || strpos($html, "следующий этап") !== false) exit(18);
            if (strpos($html, "Искать на ближайшие даты") === false) exit(19);
            echo "STANDALONE_HOT_HANDOFF_OK\n";
          '
      - name: Render standalone full search route
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=1 -r '
            $_SERVER["DOCUMENT_ROOT"]="/tmp/empty-document-root";
            $_SERVER["SCRIPT_NAME"]="/poisk-turov/index.php";
            $_SERVER["HTTP_HOST"]="anytoour.ru";
            $_GET=[];
            ob_start(); include "v2/poisk-turov/index.php"; $html=ob_get_clean();
            if (strpos($html, "window.V2_CONFIG") === false) exit(20);
            if (strpos($html, "api:\"/api-v2.php\"") === false) exit(21);
            if (strpos($html, "leadApi:\"/lead-adapter-v2.php\"") === false) exit(22);
            if (strpos($html, "bundle-v1.php?type=css") === false) exit(23);
            if (strpos($html, "privacyUrl:\"https://anytour.online/politika-konfidentsialnosti/\"") === false) exit(24);
            if (strpos($html, "<link rel=\"canonical\" href=\"https://anytoour.ru/poisk-turov/\"") === false) exit(25);
            if (strpos($html, "content=\"noindex,follow,max-image-preview:large\"") === false) exit(26);
            if (strpos($html, "property=\"og:url\" content=\"https://anytoour.ru/poisk-turov/\"") === false) exit(27);
            echo "STANDALONE_SEARCH_RENDER_OK\n";
          '
      - name: Preserve legacy subdirectory paths
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=1 -r '
            $_SERVER["DOCUMENT_ROOT"]="/tmp/empty-document-root";
            $_SERVER["SCRIPT_NAME"]="/poisk-turov-test/v2/index.php";
            $_SERVER["HTTP_HOST"]="anytour.online";
            $_GET=[];
            ob_start(); include "v2/index.php"; $html=ob_get_clean();
            if (strpos($html, "api:\"/poisk-turov-test/v2/api-v2.php\"") === false) exit(30);
            if (strpos($html, "leadApi:\"/poisk-turov-test/v2/lead-adapter-v2.php\"") === false) exit(31);
            if (strpos($html, "privacyUrl:\"/politika-konfidentsialnosti/\"") === false) exit(32);
            if (strpos($html, "content=\"noindex,follow,max-image-preview:large\"") === false) exit(33);
            echo "LEGACY_PATH_COMPAT_OK\n";
          '
      - name: Validate SEO launch scaffold
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Sitemap: https://anytoour.ru/sitemap.xml' v2/robots.txt
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' v2/sitemap.xml
          if grep -Fq '<url>' v2/sitemap.xml; then
            echo 'Sitemap must stay empty while the site is noindex' >&2
            exit 40
          fi
          grep -Fq "return !empty(\$siteParams['SEO_INDEXABLE']);" v2/seo-config.php
          echo "SEO_LAUNCH_SCAFFOLD_OK"
      - name: Keep standalone shell assets and routing reachable
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/header-current-site.js
          grep -Fq "runtimePath('phone-config.php')" v2/header-current-site.js
          grep -Fq "runtimePath('footer-current-site.css')" v2/header-current-site.js
          grep -Fq "legacyOrigin=standalone?'https://anytour.online':''" v2/header-current-site.js
          grep -Fq "if(standalone&&path==='/poisk-turov/')return path;" v2/header-current-site.js
          if grep -Fq "fetch('/poisk-turov-test/v2/phone-config.php'" v2/header-current-site.js; then exit 41; fi
          if grep -Fq "css.href='/poisk-turov-test/v2/footer-current-site.css'" v2/header-current-site.js; then exit 42; fi
          echo "STANDALONE_SITE_SHELL_PATHS_OK"
