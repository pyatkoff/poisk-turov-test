name: Validate SEO seasonal evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-seasonal-evidence-v1.php'
      - 'v2/seo-seasonal-candidate-v1.php'
      - 'v2/seo-feed-evidence-v1.php'
      - 'v2/data/report-seo-seasonal-evidence-v1.php'
      - 'tests/seo-seasonal-evidence-smoke.php'
      - 'tests/seo-seasonal-candidate-smoke.php'
      - 'tests/seo-feed-evidence-smoke.php'
      - '.github/workflows/validate-seo-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seasonal-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate seasonal and feed evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-seasonal-evidence-v1.php >/dev/null
          php -l v2/seo-seasonal-candidate-v1.php >/dev/null
          php -l v2/seo-feed-evidence-v1.php >/dev/null
          php -l v2/data/report-seo-seasonal-evidence-v1.php >/dev/null
          php -l tests/seo-seasonal-evidence-smoke.php >/dev/null
          php -l tests/seo-seasonal-candidate-smoke.php >/dev/null
          php -l tests/seo-feed-evidence-smoke.php >/dev/null
          php tests/seo-seasonal-evidence-smoke.php
          php tests/seo-seasonal-candidate-smoke.php
          php tests/seo-feed-evidence-smoke.php

      - name: Validate seasonal evidence CLI fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          observed=$((now-600))
          expires=$((now+3600))
          cat > /tmp/seasonal-evidence.json <<JSON
          [{"source":"seo_offer_snapshot","scope":"country_month","page_key":"month:1:4:2026-10","country_id":4,"region_id":null,"departure_id":1,"year":2026,"month":10,"offer_count":5,"observed_at":${observed},"expires_at":${expires}}]
          JSON
          php v2/data/report-seo-seasonal-evidence-v1.php --file=/tmp/seasonal-evidence.json --require-usable=1 > /tmp/seasonal-report.json
          php -r '$x=json_decode(file_get_contents("/tmp/seasonal-report.json"),true); if(($x["state"]??"")!=="review_only_seasonal_evidence_report") exit(1); if(($x["usable"]??0)!==1||($x["blocked"]??-1)!==0) exit(2); echo "SEO_SEASONAL_EVIDENCE_CLI_OK\n";'
          stale=$((now-1))
          sed "s/\"expires_at\":${expires}/\"expires_at\":${stale}/" /tmp/seasonal-evidence.json > /tmp/seasonal-stale.json
          if php v2/data/report-seo-seasonal-evidence-v1.php --file=/tmp/seasonal-stale.json --require-usable=1 >/tmp/seasonal-stale-report.json 2>/tmp/seasonal-stale.err; then
            echo 'SEO_SEASONAL_EVIDENCE_CLI_FAIL:stale evidence passed require-usable' >&2
            exit 1
          fi
