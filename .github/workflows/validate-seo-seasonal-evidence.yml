name: Validate SEO seasonal evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/seo-seasonal-evidence-v1.php'
      - 'v2/seo-seasonal-candidate-v1.php'
      - 'v2/seo-feed-evidence-v1.php'
      - 'v2/seo-data-readiness-v1.php'
      - 'v2/seo-seasonal-coverage-readiness-v1.php'
      - 'v2/seo-seasonal-identity-v1.php'
      - 'v2/seo-seasonal-family-binding-v1.php'
      - 'v2/data/report-seo-seasonal-evidence-v1.php'
      - 'v2/data/report-seo-seasonal-coverage-v1.php'
      - 'v2/data/inspect-seo-data-readiness-v1.php'
      - 'v2/data/inspect-seo-seasonal-identities-v1.php'
      - 'tests/seo-seasonal-evidence-smoke.php'
      - 'tests/seo-seasonal-candidate-smoke.php'
      - 'tests/seo-feed-evidence-smoke.php'
      - 'tests/seo-data-readiness-smoke.php'
      - 'tests/seo-seasonal-coverage-readiness-smoke.php'
      - 'tests/seo-seasonal-identity-smoke.php'
      - 'tests/seo-seasonal-family-binding-smoke.php'
      - '.github/workflows/validate-seo-seasonal-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seasonal-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate seasonal, feed and data readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-seasonal-evidence-v1.php >/dev/null
          php -l v2/seo-seasonal-candidate-v1.php >/dev/null
          php -l v2/seo-feed-evidence-v1.php >/dev/null
          php -l v2/seo-data-readiness-v1.php >/dev/null
          php -l v2/seo-seasonal-coverage-readiness-v1.php >/dev/null
          php -l v2/seo-seasonal-identity-v1.php >/dev/null
          php -l v2/seo-seasonal-family-binding-v1.php >/dev/null
          php -l v2/data/report-seo-seasonal-evidence-v1.php >/dev/null
          php -l v2/data/report-seo-seasonal-coverage-v1.php >/dev/null
          php -l v2/data/inspect-seo-data-readiness-v1.php >/dev/null
          php -l v2/data/inspect-seo-seasonal-identities-v1.php >/dev/null
          php -l tests/seo-seasonal-evidence-smoke.php >/dev/null
          php -l tests/seo-seasonal-candidate-smoke.php >/dev/null
          php -l tests/seo-feed-evidence-smoke.php >/dev/null
          php -l tests/seo-data-readiness-smoke.php >/dev/null
          php -l tests/seo-seasonal-coverage-readiness-smoke.php >/dev/null
          php -l tests/seo-seasonal-identity-smoke.php >/dev/null
          php -l tests/seo-seasonal-family-binding-smoke.php >/dev/null
          php tests/seo-seasonal-evidence-smoke.php
          php tests/seo-seasonal-candidate-smoke.php
          php tests/seo-feed-evidence-smoke.php
          php tests/seo-data-readiness-smoke.php
          php tests/seo-seasonal-coverage-readiness-smoke.php
          php tests/seo-seasonal-identity-smoke.php
          php tests/seo-seasonal-family-binding-smoke.php
          grep -Fq "s.page_type IN ('month','resort_month')" v2/data/inspect-seo-data-readiness-v1.php
          grep -Fq 's.expires_at > NOW()' v2/data/inspect-seo-data-readiness-v1.php
          grep -Fq 'UNIX_TIMESTAMP(NOW()) AS evidence_checked_at_epoch' v2/data/inspect-seo-data-readiness-v1.php
          grep -Fq 'UNIX_TIMESTAMP(MIN(s.expires_at)) AS earliest_expires_epoch' v2/data/inspect-seo-data-readiness-v1.php
          ! grep -Fq 'min_price' v2/data/inspect-seo-data-readiness-v1.php
          ! grep -Fq 'offers_json' v2/data/inspect-seo-data-readiness-v1.php
          grep -Fq "s.page_type IN ('month','resort_month')" v2/data/inspect-seo-seasonal-identities-v1.php
          grep -Fq 's.expires_at > NOW()' v2/data/inspect-seo-seasonal-identities-v1.php
          ! grep -Fq 'min_price' v2/data/inspect-seo-seasonal-identities-v1.php
          ! grep -Fq 'offers_json' v2/data/inspect-seo-seasonal-identities-v1.php

      - name: Validate seasonal evidence CLI fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          observed=$((now-600))
          expires=$((now+3600))
          cat > /tmp/seasonal-evidence.json <<JSON
          [{"source":"seo_offer_snapshot","scope":"country_month","page_key":"month:1:4:2026-10","country_id":4,"region_id":null,"departure_id":1,"year":2026,"month":10,"offer_count":5,"observed_at":${observed},"expires_at":${expires}}]
          JSON
          php v2/data/report-seo-seasonal-evidence-v1.php --file=/tmp/seasonal-evidence.json --require-usable=1 > /tmp/seasonal-report.json
          php -r '$x=json_decode(file_get_contents("/tmp/seasonal-report.json"),true); if(($x["state"]??"")!=="review_only_seasonal_evidence_report") exit(1); if(($x["usable"]??0)!==1||($x["blocked"]??-1)!==0) exit(2); echo "SEO_SEASONAL_EVIDENCE_CLI_OK\n";'
          stale=$((now-1))
          sed "s/\"expires_at\":${expires}/\"expires_at\":${stale}/" /tmp/seasonal-evidence.json > /tmp/seasonal-stale.json
          if php v2/data/report-seo-seasonal-evidence-v1.php --file=/tmp/seasonal-stale.json --require-usable=1 >/tmp/seasonal-stale-report.json 2>/tmp/seasonal-stale.err; then
            echo 'SEO_SEASONAL_EVIDENCE_CLI_FAIL:stale evidence passed require-usable' >&2
            exit 1
          fi

      - name: Validate seasonal coverage CLI explicit policy
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          expires=$((now+7200))
          cat > /tmp/data-readiness.json <<JSON
          {"state":"review_only_data_readiness","evidence_checked_at_epoch":${now},"evidence_valid_until_epoch":${expires},"evidence_clock_valid":true,"countries":[{"country_id":4,"snapshot_count":12,"usable_snapshot_count":12,"types":[{"page_type":"month","snapshot_count":4,"usable_snapshot_count":4,"identity_count":4,"min_offer_count":3,"min_freshness_seconds":7200},{"page_type":"resort_month","snapshot_count":8,"usable_snapshot_count":8,"identity_count":8,"min_offer_count":1,"min_freshness_seconds":7200}]}]}
          JSON
          php v2/data/report-seo-seasonal-coverage-v1.php --file=/tmp/data-readiness.json --country=4 --min-month-identities=3 --min-resort-month-identities=3 --min-freshness-seconds=3600 --min-offers-per-snapshot=1 --require-review-ready=1 > /tmp/coverage.json
          php -r '$x=json_decode(file_get_contents("/tmp/coverage.json"),true); if(($x["state"]??"")!=="review_ready"||($x["publication_allowed"]??true)!==false||($x["checks"]["evidence_clock"]["pass"]??false)!==true) exit(1); echo "SEO_SEASONAL_COVERAGE_CLI_OK\n";'
          if php v2/data/report-seo-seasonal-coverage-v1.php --file=/tmp/data-readiness.json --country=4 --min-month-identities=6 --min-resort-month-identities=10 --min-freshness-seconds=3600 --min-offers-per-snapshot=1 --require-review-ready=1 >/tmp/coverage-blocked.json 2>/tmp/coverage-blocked.err; then
            echo 'SEO_SEASONAL_COVERAGE_CLI_FAIL:insufficient coverage passed' >&2
            exit 1
          fi
          expired=$((now-1))
          sed "s/\"evidence_valid_until_epoch\":${expires}/\"evidence_valid_until_epoch\":${expired}/" /tmp/data-readiness.json > /tmp/data-readiness-expired.json
          if php v2/data/report-seo-seasonal-coverage-v1.php --file=/tmp/data-readiness-expired.json --country=4 --min-month-identities=3 --min-resort-month-identities=3 --min-freshness-seconds=3600 --min-offers-per-snapshot=1 --require-review-ready=1 >/tmp/coverage-expired.json 2>/tmp/coverage-expired.err; then
            echo 'SEO_SEASONAL_COVERAGE_CLI_FAIL:expired evidence replay passed' >&2
            exit 1
          fi
