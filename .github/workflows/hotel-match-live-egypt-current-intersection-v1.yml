name: MATCH live Egypt CURRENT intersection v1
on:
  push:
    branches: [match/live-egypt-current-intersection-1971-20260917-v1]
    paths: [.github/workflows/hotel-match-live-egypt-current-intersection-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-live-egypt-current-intersection-v1, cancel-in-progress: false}
env: {OPERATION_ID: hotel-match-live-egypt-current-intersection-1971-20260917-v1}
jobs:
  intersect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify exact read-only source and reserve
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/diagnostics/hotel_match_live_egypt_current_intersection_v1.php
          test "$(git hash-object "$src")" = f7dc7d61c0e131e3574b3422370f091ac415fb30
          php -l "$src"
          php "$src" --self-test
          grep -Fq 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' "$src"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' "$src"
          ! grep -Eiq '(curl|wget|gateway\.samo|api\.tourvisor|parser\.anextour)' "$src"
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({
            'operation_id':os.environ['OPERATION_ID'],
            'source_sha':os.environ['GITHUB_SHA'],
            'state':'reserved_before_db_access',
            'coordination_issue':2530,
            'queue_issue':1971,
            'claim_comment_id':5713730542,
            'provider_run':'35216050140',
            'provider_artifact':'10495055930',
            'provider_result_sha256':'8fb85ed48256be2cf05a56e81d13ac1926990034ccab58498ce8485e50eb2012',
            'live_ids_sha256':'012558163d35e48bae13abec1317f1fc7fc0816acf10d6ed34c5cf3b529bcd00',
            'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,
            'no_replay':True
          },sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-live-egypt-current-intersection-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-live-egypt-current-intersection-1971-20260917-v1/reservation.json
          retention-days: 90
      - name: Run CURRENT read-only intersection
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; base=\"\$HOME/.anytoour-match/operations\"; mkdir -p \"\$base\"; p=\"\$base/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < scripts/diagnostics/hotel_match_live_egypt_current_intersection_v1.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; s=p/'server'
          r=json.loads((s/'result.json').read_text()); c=json.loads((s/'receipt.json').read_text()); h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          ok=(r.get('state')=='completed_read_only' and r.get('live_input_count')==175 and c.get('result_sha256')==h and c.get('readback_verified') is True and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']))
          g={
            'verified':ok,'live_input_count':r.get('live_input_count'),'live_catalog_found':r.get('live_catalog_found'),'live_egypt_active':r.get('live_egypt_active'),
            'live_andromeda_accepted_coverage':r.get('live_andromeda_accepted_coverage'),'live_andromeda_uncovered':r.get('live_andromeda_uncovered'),
            'pending_andromeda_total':r.get('pending_andromeda_total'),'pending_egypt_by_proved_state':r.get('pending_egypt_by_proved_state'),
            'strict_evidence_candidate_count':r.get('strict_evidence_candidate_count'),'name_only_live_candidate_count':r.get('name_only_live_candidate_count'),
            'reason_counts':r.get('reason_counts'),'strict_evidence_candidates':r.get('strict_evidence_candidates'),'current_pending_total':r.get('current_pending_total'),
            'result_sha256':h,'no_replay':True
          }
          (p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(g,ensure_ascii=False,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-live-egypt-current-intersection-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-live-egypt-current-intersection-1971-20260917-v1/
          retention-days: 90
