name: Visual V2 recovery pull request

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/search-progress-ux-v1.js'
      - 'v2/search-progress-ux-v1.css'
      - '.github/workflows/visual-v2-recovery-pr.yml'
  workflow_dispatch:

concurrency:
  group: ci-visual-v2-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-v2-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Audit empty-result recovery at five viewports
        env:
          V2_URL: https://anytour.online/poisk-turov-test/v2/
        run: |
          set -euo pipefail
          mkdir -p recovery-visual-artifacts
          cat > recovery-visual.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'),path=require('path');
          const url=process.env.V2_URL,root=path.resolve('v2');
          const viewports=[['mobile-375',375,812],['mobile-430',430,932],['tablet-768',768,1024],['intermediate-1024',1024,900],['desktop-1440',1440,1000]];
          const js=fs.readFileSync(path.join(root,'search-progress-ux-v1.js'),'utf8');
          const css=fs.readFileSync(path.join(root,'search-progress-ux-v1.css'),'utf8');
          (async()=>{const browser=await chromium.launch({headless:true});let failed=false;const report=[];
            for(const [name,width,height] of viewports){const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(2500);
              await page.addStyleTag({content:css});await page.evaluate(()=>{window.V2SearchProgressUXV1=null;});await page.addScriptTag({content:js});
              const state=await page.evaluate(()=>{window.dispatchEvent(new CustomEvent('v2:search-complete',{detail:{items:[]}}));const empty=document.querySelector('.search-progress-empty');return{empty:!!empty,edit:!!empty?.querySelector('.search-progress-edit'),filters:!!empty?.querySelector('.search-progress-filters'),copy:String(empty?.textContent||''),overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2||document.body.scrollWidth>document.documentElement.clientWidth+2};});
              await page.screenshot({path:`recovery-visual-artifacts/${name}-empty.png`,fullPage:true});
              await page.locator('.search-progress-filters').click();await page.waitForTimeout(100);const actionState=await page.evaluate(()=>({filtersOpen:!!document.querySelector('#tourSearch details.extras')?.open,form:!!document.getElementById('tourSearch')}));
              const item={name,http:response?.status()||0,errors,state,actionState};report.push(item);const bad=item.http!==200||errors.length||!state.empty||!state.edit||!state.filters||!state.copy.includes('туров не нашли')||state.overflow||!actionState.form||!actionState.filtersOpen;if(bad)failed=true;console.log('RECOVERY_VISUAL',name,JSON.stringify(item));await context.close();}
            fs.writeFileSync('recovery-visual-artifacts/report.json',JSON.stringify(report,null,2));await browser.close();if(failed)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node recovery-visual.cjs
      - name: Upload recovery visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-recovery-visual-${{ github.event.pull_request.number || 'manual' }}
          path: recovery-visual-artifacts/
          retention-days: 14
