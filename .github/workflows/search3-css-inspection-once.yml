name: Inspect pinned Search3 sources once
on:
  push:
    branches: [refactor/search3-css-compatibility-91a7ff5d]
    paths: [.github/workflows/search3-css-inspection-once.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'pyatkoff/poisk-turov-test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91a7ff5df1fb117af972f517bc188e7597a6ee33
          persist-credentials: false
      - name: Archive exact tracked source without credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 91a7ff5df1fb117af972f517bc188e7597a6ee33
          python3 -B scripts/build/search3_assets.py --check
          git archive --format=zip --output="$RUNNER_TEMP/search3-source.zip" HEAD
          sha256sum "$RUNNER_TEMP/search3-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: search3-source-91a7ff5d
          path: ${{ runner.temp }}/search3-source.zip
          retention-days: 3
