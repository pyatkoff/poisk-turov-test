name: MATCH recurrence accept reconcile v1

on:
  pull_request:
    paths:
      - 'reports/match-three-provider-recurrence-evidence-20260912.json'
      - 'scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept_reconcile.php'
      - '.github/workflows/hotel-match-three-provider-recurrence-current-accept-reconcile-v1.yml'
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-three-provider-recurrence-current-accept-reconcile-1971-20260912-v1.arm']

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: match-three-provider-recurrence-current-accept-reconcile-v1-${{ github.event_name }}
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-three-provider-recurrence-current-accept-reconcile-1971-20260912-v1
  UNKNOWN_OPERATION_ID: hotel-match-three-provider-recurrence-current-accept-1971-20260912-v1
  EVIDENCE_SHA256: e78a092225a3d976345cc6f1eafd9d5d170bcfe34dd608c66de1cd99f843d98f
  STATE_DIR: /tmp/match-three-provider-recurrence-accept-reconcile-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate read-only reconciliation
        run: |
          set -euo pipefail
          test "$(sha256sum reports/match-three-provider-recurrence-evidence-20260912.json | awk '{print $1}')" = "$EVIDENCE_SHA256"
          php -l scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept_reconcile.php
          php scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept_reconcile.php --self-test
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept_reconcile.php').read_text()
          stripped=re.sub(r'/\*.*?\*/|//[^\n]*','',s,flags=re.S)
          for p in [r'\bINSERT\s+INTO\b',r'\bUPDATE\s+[A-Za-z_]',r'\bDELETE\s+FROM\b',r'\bcurl_\w+\s*\(',r'\bfile_put_contents\s*\(']: assert not re.search(p,stripped,re.I),p
          assert 'START TRANSACTION READ ONLY' in s
          assert "HMRCRX_UNKNOWN_OPERATION = 'hotel-match-three-provider-recurrence-current-accept-1971-20260912-v1'" in s
          assert "'reconciled_committed':'reconciled_no_write'" in s
          print('MATCH_RECURRENCE_ACCEPT_RECONCILE_SOURCE_OK')
          PY

  reconcile:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify arm and zero-DB preflight
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$(cat .github/match-three-provider-recurrence-current-accept-reconcile-1971-20260912-v1.arm)" = "$OPERATION_ID"
          test -n "$KEY_VALUE" && test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          KEY="$RUNNER_TEMP/match-recurrence-reconcile-key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$KEY"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$KEY"; fi
          chmod 600 "$KEY"; ssh-keygen -y -f "$KEY" >/dev/null
          OUT=""
          for attempt in 1 2 3; do
            set +e; OUT="$(ssh -T -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && { test -f data/db-v1.php || test -f v2/data/db-v1.php; } && printf MATCH_RECURRENCE_RECONCILE_PREFLIGHT_OK' 2>/dev/null)"; rc=$?; set -e
            [[ $rc -eq 0 && "$OUT" == MATCH_RECURRENCE_RECONCILE_PREFLIGHT_OK ]] && break
            sleep $((attempt * 2))
          done
          test "$OUT" = MATCH_RECURRENCE_RECONCILE_PREFLIGHT_OK
      - name: Persist reservation before CURRENT DB read
        run: |
          set -euo pipefail; mkdir -m 700 -p "$STATE_DIR"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=Path(os.environ['STATE_DIR']);r={'operation_id':os.environ['OPERATION_ID'],'reconciles_operation_id':os.environ['UNKNOWN_OPERATION_ID'],'state':'reserved_before_current_db_reconciliation','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'evidence_sha256':os.environ['EVIDENCE_SHA256'],'transaction':'REPEATABLE READ / READ ONLY','database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True};(d/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: match-three-provider-recurrence-accept-reconcile-v1-${{ github.run_id }}-reserved
          path: ${{ env.STATE_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Attribute UNKNOWN operation from CURRENT DB provenance
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          state=Path(os.environ['STATE_DIR']);script=Path('scripts/diagnostics/hotel_match_three_provider_recurrence_current_accept_reconcile.php').read_text();evidence=Path('reports/match-three-provider-recurrence-evidence-20260912.json').read_bytes();assert hashlib.sha256(evidence).hexdigest()==os.environ['EVIDENCE_SHA256']
          marker='declare(strict_types=1);';assert script.count(marker)==1;code=script.replace(marker,marker+"\ndefine('HMRCRX_EVIDENCE_B64','"+base64.b64encode(evidence).decode()+"');",1)
          key=Path(os.environ['RUNNER_TEMP'])/'match-recurrence-reconcile-key'
          p=subprocess.run(['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',os.environ['USER_VALUE']+'@'+os.environ['HOST_VALUE'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=512M -- --live'],input=code,text=True,capture_output=True,timeout=300)
          prefix='HMRCRX_RESULT:';lines=[x[len(prefix):] for x in p.stdout.splitlines() if x.startswith(prefix)]
          if len(lines)!=1: result={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(p.stderr.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True}
          else: result=json.loads(lines[0])
          raw=(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode();(state/'result.json').write_bytes(raw)
          valid=(p.returncode==0 and result.get('status')=='completed' and result.get('operation_id')==os.environ['OPERATION_ID'] and result.get('reconciles_operation_id')==os.environ['UNKNOWN_OPERATION_ID'] and result.get('examined_tuples')==71 and result.get('evidence_sha256')==os.environ['EVIDENCE_SHA256'] and result.get('reconciliation') in ('reconciled_no_write','reconciled_committed') and not result.get('unexpected_operation_rows') and all(result.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','anex_calls','andromeda_calls','booking_calls','lead_calls']))
          receipt={'operation_id':os.environ['OPERATION_ID'],'reconciles_operation_id':os.environ['UNKNOWN_OPERATION_ID'],'state':'completed' if valid else 'unknown','reconciliation':result.get('reconciliation'),'operation_owned_rows':result.get('operation_owned_rows'),'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'no_replay':True};(state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          rows=result.get('owned_rows',[]);safe=result.get('safe_target_current',{});summary=[f"MATCH #1971 reconciliation `{os.environ['OPERATION_ID']}`: **{receipt['state']}** / NO-REPLAY. UNKNOWN writer `{os.environ['UNKNOWN_OPERATION_ID']}` resolved as **{result.get('reconciliation','unknown')}**.",f"Scanned immutable **71** tuple provider IDs in CURRENT DB. Operation-owned rows **{result.get('operation_owned_rows',0)}** (ANEX {result.get('operation_owned_anex',0)}, Andromeda {result.get('operation_owned_andromeda',0)}); unexpected provenance rows **{len(result.get('unexpected_operation_rows',[]))}**. This reconciliation itself wrote 0 rows and made 0 supplier/Tourvisor calls."]
          if rows: summary.append('Attributed committed rows: '+', '.join(f"{x['provider']}:{x['external_id']}→local/TV{x['local_hotel_id']}" for x in rows)+'.')
          a=safe.get('anex_8280_mappings',[]);b=safe.get('andromeda_2000034099',[]);summary.append(f"Prior safe target readback: ANEX8280 mappings={[(x.get('catalog_hotel_id'),x.get('enabled')) for x in a]}; Andromeda2000034099={[(x.get('local_hotel_id'),x.get('decision_status')) for x in b]}.")
          (state/'summary.md').write_text('\n'.join(summary)+'\n');print('\n'.join(summary))
          if not valid: raise SystemExit(2)
          PY
      - name: Preserve immutable reconciliation
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-three-provider-recurrence-accept-reconcile-v1-${{ github.run_id }}-final
          path: ${{ env.STATE_DIR }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Record reconciliation
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', ARTIFACT_ID: '${{ steps.artifact.outputs.artifact-id }}'}
        run: |
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE_DIR/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE_DIR/summary.md"
      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/match-recurrence-reconcile-key"