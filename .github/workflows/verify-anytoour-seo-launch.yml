name: Verify anytoour.ru SEO launch

on:
  workflow_run:
    workflows: ['Deploy anytoour.ru']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-anytoour-seo-launch.yml'
      - 'v2/seo-launch-slice-v1.php'
      - 'v2/seo-controlled-launch-catalog-v1.php'
      - 'v2/seo-core-month-*.php'
      - 'v2/seo-core-resort-*.php'
      - 'v2/data/materialize-seo-core-resort-review-routes-v1.php'
      - 'v2/sitemap.xml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-anytoour-seo-launch.yml'
      - 'v2/seo-launch-slice-v1.php'
      - 'v2/seo-controlled-launch-catalog-v1.php'
      - 'v2/seo-core-month-*.php'
      - 'v2/seo-core-resort-*.php'
      - 'v2/data/materialize-seo-core-resort-review-routes-v1.php'
      - 'v2/sitemap.xml'
      - 'tests/seo-launch-slice-smoke.php'
      - 'tests/seo-core-resort-launch-state-smoke.php'
      - 'tests/seo-core-resort-review-materializer-smoke.php'

permissions:
  contents: read

concurrency:
  group: verify-anytoour-seo-launch-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  predeploy-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate scalable launch contract
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/seo-launch-slice-v1.php >/dev/null
          php -l v2/seo-core-resort-launch-state-v1.php >/dev/null
          php -l v2/seo-core-resort-review-runtime-v1.php >/dev/null
          php -l v2/data/materialize-seo-core-resort-review-routes-v1.php >/dev/null
          php tests/seo-core-month-content-smoke.php
          php tests/seo-core-resort-launch-state-smoke.php
          php tests/seo-core-resort-review-materializer-smoke.php
          php tests/seo-launch-slice-smoke.php
          php tests/seo-production-identity-collector-smoke.php
          php -r "require 'v2/seo-launch-slice-v1.php'; foreach(v2_seo_static_controlled_launch_paths() as \$p) echo 'https://anytoour.ru'.\$p,PHP_EOL;" | sort > /tmp/expected-sitemap.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          expected={x.strip() for x in open('/tmp/expected-sitemap.txt',encoding='utf-8') if x.strip()}
          actual={n.text.strip() for n in ET.parse('v2/sitemap.xml').getroot().iter() if n.tag.endswith('loc') and n.text}
          assert actual == expected, (len(actual),len(expected),sorted(actual^expected)[:20])
          assert len(actual)==104
          assert not any('/hotel/' in u or '/poisk-turov/' in u for u in actual)
          print('ANYTOOUR_PREDEPLOY_SEO_CONTRACT_OK static_paths=104 dynamic_resorts=manifest_gated hotel_tours=0')
          PY

  production-seo:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'workflow_dispatch') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify sitemap and representative public pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://anytoour.ru'
          curl -fsSL --max-time 30 "$base/robots.txt" -o /tmp/robots.txt
          grep -Fq 'Sitemap: https://anytoour.ru/sitemap.xml' /tmp/robots.txt
          curl -fsSL --max-time 30 "$base/sitemap.xml" -o /tmp/sitemap.xml
          php -r "require 'v2/seo-launch-slice-v1.php'; foreach(v2_seo_static_controlled_launch_paths() as \$p) echo 'https://anytoour.ru'.\$p,PHP_EOL;" | sort > /tmp/static-sitemap.txt
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          static={x.strip() for x in open('/tmp/static-sitemap.txt',encoding='utf-8') if x.strip()}
          actual={n.text.strip() for n in ET.parse('/tmp/sitemap.xml').getroot().iter() if n.tag.endswith('loc') and n.text}
          assert static <= actual, (len(static),len(actual),sorted(static-actual)[:20])
          assert not any('/hotel/' in u or '/poisk-turov/' in u for u in actual)
          extras=sorted(actual-static)
          month_re=re.compile(r'^https://anytoour\.ru/country/(egypt|maldives)/([a-z0-9-]+)/(january|february|march|april|may|june|july|august|september|october|november|december)/$')
          base_re=re.compile(r'^https://anytoour\.ru/country/(egypt|maldives)/([a-z0-9-]+)/$')
          groups={}
          for url in extras:
              m=base_re.match(url)
              if m:
                  assert m.group(2) not in {'hotel','january','february','march','april','may','june','july','august','september','october','november','december'}
                  groups.setdefault(m.group(1,2),{'base':False,'months':set()})['base']=True
                  continue
              m=month_re.match(url)
              assert m, url
              groups.setdefault(m.group(1,2),{'base':False,'months':set()})['months'].add(m.group(3))
          for key,g in groups.items():
              assert g['base'] and len(g['months'])==12, (key,g)
          assert len(extras)==13*len(groups)
          print(f'ANYTOOUR_SEO_SITEMAP_OK paths={len(actual)} static=104 generated_resorts={len(groups)} generated_routes={len(extras)}')
          with open('/tmp/generated-samples.txt','w',encoding='utf-8') as f:
              for url in extras:
                  if base_re.match(url): f.write(url.removeprefix('https://anytoour.ru')+'\n'); break
              for url in extras:
                  if month_re.match(url): f.write(url.removeprefix('https://anytoour.ru')+'\n'); break
          PY

          samples=(
            '/country/turkey/'
            '/country/egypt/'
            '/country/maldives/'
            '/country/turkey/kemer/'
            '/country/turkey/january/'
            '/country/egypt/december/'
            '/country/maldives/september/'
            '/country/turkey/kemer/june/'
            '/country/turkey/antalya/october/'
          )
          while IFS= read -r path; do test -z "$path" || samples+=("$path"); done < /tmp/generated-samples.txt
          for path in "${samples[@]}"; do
            file="/tmp/page.html"
            code="$(curl -fsSL -o "$file" -w '%{http_code}' --max-time 35 "$base$path")"
            test "$code" = '200'
            grep -Eq '<meta name="robots" content="index,follow[^\"]*"' "$file"
            grep -Fq "<link rel=\"canonical\" href=\"${base}${path}\">" "$file"
          done

          protected='/country/maldives/hotel/the-westin-maldives-miriandhoo-resort-65108/'
          code="$(curl -fsSL -o /tmp/hotel-review.html -w '%{http_code}' --max-time 35 "$base$protected")"
          test "$code" = '200'
          grep -Eq '<meta name="robots" content="noindex,follow[^\"]*"' /tmp/hotel-review.html
          if grep -Fq "${base}${protected}" /tmp/sitemap.xml; then echo 'HOTEL_TOUR_SITEMAP_LEAK' >&2; exit 1; fi
          echo "ANYTOOUR_CONTROLLED_SEO_LAUNCH_OK static=104 generated_samples=${#samples[@]} hotel_tours_indexed=0"
