name: INT ANEX current page2 v1
on:
  push:
    branches: ['ops/int-anex-hotel15851-current-20260919-v1']
    paths: ['.github/workflows/int-anex-current-page2-v1.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SOURCE_SHA: 9ce46b89e6decba99da1d64434da9e583a9f4f39
      SECURITY_RUN: '35453181065'
      OPERATION_ID: int-anex-page2-current-20260919-v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9ce46b89e6decba99da1d64434da9e583a9f4f39
          persist-credentials: false
      - name: Verify source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SECURITY_RUN" | jq -e --arg s "$SOURCE_SHA" '.head_sha==$s and .conclusion=="success"' >/dev/null
          php -l scripts/diagnostics/anex_current_page2_v1.php
          cp scripts/diagnostics/anex_current_page2_v1.php "$RUNNER_TEMP/probe.php"
      - name: Read only ANEX page2
        env:
          SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/result"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/ssh/key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/ssh/key"; fi
          chmod 600 "$RUNNER_TEMP/ssh/key"; ssh-keygen -y -f "$RUNNER_TEMP/ssh/key" >/dev/null
          ssh-keyscan -T 15 -t ed25519 "$HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          opts=(-i "$RUNNER_TEMP/ssh/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=30)
          remote="/tmp/$OPERATION_ID.$GITHUB_RUN_ID.php"; scp "${opts[@]}" "$RUNNER_TEMP/probe.php" "$REMOTE_USER@$HOST:$remote"
          ssh -T "${opts[@]}" "$REMOTE_USER@$HOST" bash -s -- "$OPERATION_ID" "$remote" > "$RUNNER_TEMP/result/receipt.json" <<'REMOTE'
          set -euo pipefail
          umask 077
          operation="$1"; probe="$2"; ledger="$HOME/.anytour-ops/$operation"; test ! -e "$ledger"
          mkdir -p "$HOME/.anytour-ops"; mkdir -m 700 "$ledger"; trap 'rm -f "$probe"' EXIT
          site=$(realpath "$HOME/www/anytoour.ru")
          php -d display_errors=0 -d zend.exception_ignore_args=1 "$probe" "$site" "$ledger" > "$ledger/result.json" 2> "$ledger/error.log"
          php -r '$d=json_decode(file_get_contents($argv[1]),true,64,JSON_THROW_ON_ERROR);$d["replay_allowed"]=false;file_put_contents($argv[2],json_encode($d,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n");' "$ledger/result.json" "$ledger/receipt.json"
          cat "$ledger/receipt.json"
          REMOTE
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.environ['RUNNER_TEMP']+'/result/receipt.json'))
          assert d['supplier_calls']<=4 and d['page1_replayed'] is False and d['db_writes']==0
          for k in ['apd_calls','expand_calls','get_flights_calls','changeservice_calls','calc_calls','booking_calls']: assert d[k]==0
          print('ANEX_CURRENT_PAGE2 '+json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: int-anex-current-page2-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/result/receipt.json
          if-no-files-found: warn
          retention-days: 30
