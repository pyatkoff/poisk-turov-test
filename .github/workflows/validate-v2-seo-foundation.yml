name: Validate V2 SEO foundation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.php'
      - 'v2/form-defaults.php'
      - 'v2/seo-config.php'
      - 'v2/site-footer-v1.php'
      - 'v2/site-footer-v1.css'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-v2-seo-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'v2/index.php'
      - 'v2/form-defaults.php'
      - 'v2/seo-config.php'
      - 'v2/site-footer-v1.php'
      - 'v2/site-footer-v1.css'
      - 'v2/bundle-manifest-v1.php'
      - '.github/workflows/validate-v2-seo-foundation.yml'

concurrency:
  group: ci-validate-v2-seo-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate SEO config contract
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            $_SERVER["HTTP_HOST"]="anytour.online";
            $_SERVER["SCRIPT_NAME"]="/poisk-turov-test/v2/index.php";
            require "v2/seo-config.php";
            if (v2_seo_indexable([]) !== false) { fwrite(STDERR,"SEO_SOURCE_FAIL:legacy_indexable\n"); exit(1); }
            if (v2_seo_canonical_url() !== "https://anytoour.ru/poisk-turov/") { fwrite(STDERR,"SEO_SOURCE_FAIL:legacy_canonical\n"); exit(1); }
            $_SERVER["HTTP_HOST"]="anytoour.ru";
            if (v2_seo_canonical_url() !== "https://anytoour.ru/") { fwrite(STDERR,"SEO_SOURCE_FAIL:standalone_canonical\n"); exit(1); }
            if (v2_seo_robots_content(false) !== "noindex,follow,max-image-preview:large") { fwrite(STDERR,"SEO_SOURCE_FAIL:robots\n"); exit(1); }
            echo "V2_SEO_SOURCE_OK legacy=noindex canonical=standalone_search\n";
          '

      - name: Validate test-route SEO contract live
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "SEO_FOUNDATION_FAIL:$1"; exit 1; }
          base="https://anytour.online/poisk-turov-test/v2/"
          canonical="https://anytoour.ru/poisk-turov/"
          code="$(curl -k -L -sS -o /tmp/v2-seo.html -w "%{http_code}" --max-time 45 "$base")"
          test "$code" = "200" || fail page_http

          CANONICAL="$canonical" python3 - <<'PY' || exit 1
          import os, re, html
          text=open('/tmp/v2-seo.html',encoding='utf-8').read()
          canonical=os.environ['CANONICAL']
          def fail(msg):
              print('SEO_FOUNDATION_FAIL:'+msg)
              raise SystemExit(1)
          titles=re.findall(r'<title\b[^>]*>(.*?)</title>',text,re.I|re.S)
          if len(titles)!=1 or not re.sub(r'<[^>]+>','',titles[0]).strip(): fail('title')
          descriptions=re.findall(r'<meta\b[^>]*name=["\']description["\'][^>]*>',text,re.I)
          if len(descriptions)!=1 or not re.search(r'content=["\'][^"\']{20,}["\']',descriptions[0],re.I): fail('description')
          robots=re.findall(r'<meta\b[^>]*name=["\']robots["\'][^>]*>',text,re.I)
          if len(robots)!=1: fail('robots_count')
          robot_tag=robots[0].lower()
          if 'noindex' not in robot_tag or 'follow' not in robot_tag: fail('test_route_must_noindex_follow')
          canonicals=re.findall(r'<link\b[^>]*rel=["\']canonical["\'][^>]*>',text,re.I)
          if len(canonicals)!=1 or ('href="'+canonical+'"') not in canonicals[0] and ("href='"+canonical+"'") not in canonicals[0]: fail('compatibility_canonical')
          h1s=re.findall(r'<h1\b[^>]*>(.*?)</h1>',text,re.I|re.S)
          if len(h1s)!=1: fail('h1_count')
          h1=html.unescape(re.sub(r'<[^>]+>',' ',h1s[0])).strip().lower()
          if 'поиск' not in h1 or 'тур' not in h1: fail('h1_text')
          required_links=['/country/','/poisk-turov/','/hot/','/contacts/']
          for href in required_links:
              if not re.search(r'href=["\']'+re.escape(href)+r'["\']',text,re.I): fail('internal_link_'+href)
          if re.search(r'<footer\b[^>]*class=["\'][^"\']*v2-site-footer',text,re.I): fail('duplicate_v2_footer')
          community=re.search(r'<section\b[^>]*class=["\'][^"\']*v2-site-community[^"\']*["\'][^>]*>(.*?)</section>',text,re.I|re.S)
          if not community: fail('community_block')
          community_html=community.group(1)
          for href in ['https://max.ru/anytour','https://t.me/+gGloLUt4d8s3NDcy','https://vk.com/anytour_online','https://play.google.com/store/apps/details?id=online.anytour']:
              if href not in community_html: fail('community_link_'+href)
          if 'apps.apple.com/ru/app/' not in community_html: fail('community_link_app_store')
          if not re.search(r'<link\b[^>]*id=["\']v2-primary-search-ux-style["\'][^>]*rel=["\']stylesheet["\']',text,re.I): fail('bundled_stylesheet_link')
          for marker in ['results-renderer-v5.js','tour-controller-v4.js','lead-form-guard-v1.js']:
              if marker not in text: fail('active_marker_'+marker)
          print('V2_SEO_FOUNDATION_OK title=1 description=1 robots=noindex_follow h1=1 internalLinks='+str(len(required_links))+' duplicateV2Footer=0 communityBlock=1 bundledStyle=1 canonical=standalone_search')
          PY

      - name: Validate search-state URLs stay non-indexable
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          fail(){ echo "SEO_SEARCH_STATE_FAIL:$1"; exit 1; }
          base="https://anytour.online/poisk-turov-test/v2/"
          canonical="https://anytoour.ru/poisk-turov/"

          curl -k -L -sS --max-time 45 --get \
            --data-urlencode 'from=2' \
            --data-urlencode 'country=9' \
            --data-urlencode 'dateFrom=2026-09-15' \
            --data-urlencode 'dateTo=2026-09-24' \
            --data-urlencode 'daysFrom=6' \
            --data-urlencode 'daysTill=11' \
            --data-urlencode 'count_people=3' \
            "$base" -o /tmp/v2-seo-valid-state.html

          curl -k -L -sS --max-time 45 --get \
            --data-urlencode 'from=-5' \
            --data-urlencode 'country=abc' \
            --data-urlencode 'dateFrom=not-a-date' \
            --data-urlencode 'dateTo=2020-01-01' \
            --data-urlencode 'daysFrom=999' \
            --data-urlencode 'daysTill=-1' \
            --data-urlencode 'count_people=99' \
            "$base" -o /tmp/v2-seo-invalid-state.html

          CANONICAL="$canonical" python3 - <<'PY' || exit 1
          import os, re
          canonical=os.environ['CANONICAL']
          def fail(msg):
              print('SEO_SEARCH_STATE_FAIL:'+msg)
              raise SystemExit(1)
          def check_policy(text,label):
              robots=re.findall(r'<meta\b[^>]*name=["\']robots["\'][^>]*>',text,re.I)
              if len(robots)!=1 or 'noindex' not in robots[0].lower() or 'follow' not in robots[0].lower(): fail(label+'_robots')
              canonicals=re.findall(r'<link\b[^>]*rel=["\']canonical["\'][^>]*>',text,re.I)
              if len(canonicals)!=1 or ('href="'+canonical+'"') not in canonicals[0] and ("href='"+canonical+"'") not in canonicals[0]: fail(label+'_canonical')
              if len(re.findall(r'<h1\b[^>]*>',text,re.I))!=1: fail(label+'_h1')
          valid=open('/tmp/v2-seo-valid-state.html',encoding='utf-8').read()
          invalid=open('/tmp/v2-seo-invalid-state.html',encoding='utf-8').read()
          check_policy(valid,'valid')
          check_policy(invalid,'invalid')
          expected=[
              'name="from" data-v2-catalog="departures"><option value="2" selected>',
              'name="country" data-v2-catalog="countries"><option value="9" selected>',
              'name="dateFrom" value="2026-09-15"',
              'name="dateTo" value="2026-09-24"',
              'name="daysFrom" value="6"',
              'name="daysTill" value="11"',
              '<option value="3" selected>3</option>',
          ]
          for marker in expected:
              if marker not in valid: fail('valid_prefill_'+marker[:24])
          if 'name="from" data-v2-catalog="departures"><option value="-5" selected>' in invalid: fail('invalid_from_leaked')
          if 'name="country" data-v2-catalog="countries"><option value="abc" selected>' in invalid: fail('invalid_country_leaked')
          if 'value="not-a-date"' in invalid or 'value="999"' in invalid or '<option value="99" selected>' in invalid: fail('invalid_value_leaked')
          print('V2_SEO_SEARCH_STATE_OK valid_prefill=7 invalid_normalized=1 robots=noindex_follow canonical=standalone_search')
          PY
