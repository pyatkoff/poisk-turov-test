name: Validate results renderer v4
on:
  push:
    branches: [main]
    paths:
      - 'v2/results-renderer-v4.js'
      - '.github/workflows/validate-results-renderer-v4.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check renderer
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/results-renderer-v4.js
          grep -q "hotelPhotoAlt" v2/results-renderer-v4.js
          grep -q "tourCountLabel" v2/results-renderer-v4.js
          grep -q "Цена уточняется" v2/results-renderer-v4.js
