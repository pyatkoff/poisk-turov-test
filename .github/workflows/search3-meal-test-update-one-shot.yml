name: Search3 meal test update one-shot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/search3-meal-test-update-one-shot.yml'
      - 'tests/search3-hotel-card-summary.test.js'

permissions:
  contents: write

jobs:
  update-test:
    if: github.head_ref == 'ops/search3-meal-test-update-temp-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out writable exact head
        uses: actions/checkout@v4
        with:
          ref: ops/search3-meal-test-update-temp-20260917
          fetch-depth: 0
          persist-credentials: true
      - name: Replace stale meal-family expectations and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/search3-hotel-card-summary.test.js')
          s = p.read_text()
          replacements = {
            "assert.equal(api.priceContext(multi),'16.09.2026 · 7 ноч. · Завтрак');": "assert.equal(api.priceContext(multi),'16.09.2026 · 7 ноч. · Завтраки');",
            "assert.match(compact,/<b>Завтрак<\\/b>/);": "assert.match(compact,/<b>Завтраки<\\/b>/);",
            "for(const meal of [{name:'AI',fullName:'Всё включено'},{fullName:'All Inclusive'},'Всё включено'])assert.equal(api.mealIdentity({meal}).key,'meal:all-inclusive');": "assert.equal(api.mealIdentity({meal:{name:'AI',fullName:'Всё включено'}}).key,'meal:label:всё включено');\nassert.equal(api.mealIdentity({meal:{fullName:'All Inclusive'}}).key,'meal:label:all inclusive');\nassert.equal(api.mealIdentity({meal:'Всё включено'}).key,'meal:label:всё включено');",
            "assert.deepEqual(api.mealIdentity({meal:{name:'HB+',fullName:'Полупансион'}}),{key:'meal:label:hb+',label:'HB+'});": "assert.deepEqual(api.mealIdentity({meal:{name:'HB+',fullName:'Полупансион'}}),{key:'meal:label:полупансион',label:'Полупансион'});",
          }
          for old, new in replacements.items():
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one stale contract, found {count}: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
          git rm .github/workflows/search3-meal-test-update-one-shot.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/search3-hotel-card-summary.test.js
          git commit -m 'test(search3): align card summary with supplier meal facts'
          git push origin HEAD:ops/search3-meal-test-update-temp-20260917
