name: MATCH whole-frontier reconciler audit v114d
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-result28-v95-tests.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-whole-frontier-v114d
  cancel-in-progress: false
env:
  OP: hotel-match-mass-current-reconcile-audit-1971-20260928-v114d
  CLAIM: '5866408551'
jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate source claim and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_mass_current_reconcile_audit_v114d.php)" = cf040a973b7a6e065c0599e43204ef2505b7dc86
          php -l scripts/diagnostics/hotel_match_mass_current_reconcile_audit_v114d.php
          echo MATCH_V114D_SOURCE_OK\n
      - name: Audit entire CURRENT frontier once
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known"
          trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key">/dev/null
          ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST"
          rel=".anytoour-match/operations/$OP"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$rel/payload\""
          git archive HEAD scripts/diagnostics app/integrations | ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=1024M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_mass_current_reconcile_audit_v114d.php\" --execute" >terminal/stdout.txt 2>terminal/stderr.txt
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=json.load(open('terminal/result.json'))
          r=json.load(open('terminal/receipt.json'))
          assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert d['state']=='completed_read_only_mass_reconcile_audit'
          assert d['provider_http_calls']==d['database_writes']==d['mapping_writes']==0
          print(json.dumps({k:d[k] for k in ['coverage_current','tv_hotels_with_exact_evidence','ready_samo_count','ready_direct_anex_count','ready_total','hold_count']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-whole-frontier-v114d-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
