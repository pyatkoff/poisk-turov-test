name: MATCH ANEX-only 200 acquisition v108-v109
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-result28-v95-tests.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-anexonly200-v108-v109
  cancel-in-progress: false
env:
  PLAN: hotel-match-anexonly200-plan-1971-20260928-v108
  ACQ: hotel-match-anexonly200-acquire-1971-20260928-v109
  CLAIM: '5865689904'
jobs:
  acquire:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact new source and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_anexonly200_plan_v108.php)" = 7767e84b27cf4d9e197682928ce47daca4c7e15c
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_anexonly200_acquire_v109.py)" = aa22eb94428d441392883f2b462355edd795fa0e
          php -l scripts/diagnostics/hotel_match_anexonly200_plan_v108.php
          python3 scripts/diagnostics/hotel_match_anexonly200_acquire_v109.py --self-test
          python3 - <<'PY'
          import json,os,time,urllib.request
          def get(p):
              q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:return json.load(f)
          c=get('/issues/comments/'+os.environ['CLAIM'])
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for s in ['ANEX-only','v107/v108','TOURVISOR_ANEX_JWT','no operator filter','continue0/dates0']: assert s.lower() in c['body'].lower(),s
          for _ in range(100):
              xs=[x for x in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if x['name']=='Security guard']
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success'
                      break
              time.sleep(3)
          else: raise SystemExit('security')
          PY
      - name: Plan CURRENT ANEX-only scope and acquire missing native IDs
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";base=".anytoour-match/operations";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$base/$PLAN\";test ! -e \"\$HOME/$base/$ACQ\";mkdir -p \"\$HOME/$base/$PLAN\" \"\$HOME/$base/$ACQ/payload\""
          git archive HEAD scripts/diagnostics app/integrations | ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$base/$ACQ/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$base/$PLAN\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=768M \"\$HOME/$base/$ACQ/payload/scripts/diagnostics/hotel_match_anexonly200_plan_v108.php\" --execute"
          scp "${opts[@]}" "$remote:$base/$PLAN/result.json" terminal/plan.json
          PLAN_SHA="$(sha256sum terminal/plan.json|awk '{print $1}')"
          COUNT="$(python3 -c 'import json;print(json.load(open("terminal/plan.json"))["scope_count"])')"
          python3 - "$HEAD" <<'PY'
          import json,sys
          json.dump({'operation':'hotel-match-anexonly200-acquire-1971-20260928-v109','source_sha':sys.argv[1],'state':'reserved_before_provider_access','maximum_hotels':200,'daily_limit':3000,'operation_call_cap':900,'operator_filter_sent':False,'continue_calls':0,'dates_calls':0},open('terminal/reservation.json','w'))
          PY
          scp "${opts[@]}" terminal/reservation.json "$remote:$base/$ACQ/reservation.json"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$base/$ACQ\" MATCH_PLAN_PATH=\"\$HOME/$base/$PLAN/result.json\" MATCH_PLAN_SHA256='$PLAN_SHA' MATCH_CALL_CAP=900 php -r 'exit(0);' >/dev/null && ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$base/$ACQ\" MATCH_PLAN_PATH=\"\$HOME/$base/$PLAN/result.json\" MATCH_PLAN_SHA256='$PLAN_SHA' MATCH_CALL_CAP=900 python3 \"\$HOME/$base/$ACQ/payload/scripts/diagnostics/hotel_match_anexonly200_acquire_v109.py\" --execute"
          scp "${opts[@]}" "$remote:$base/$ACQ/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$base/$ACQ/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=json.load(open('terminal/plan.json'));d=json.load(open('terminal/result.json'));r=json.load(open('terminal/receipt.json'))
          assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert d['state'] in ('completed_read_only','terminal_quota_stop_no_replay') and d['database_writes']==d['mapping_writes']==0 and d['continue_calls']==d['dates_calls']==0 and d['operator_filter_sent'] is False
          print(json.dumps({'scope':p['scope_count'],'countries':p['country_counts'],'provider_calls':d['provider_calls'],'daily_after':d['daily_accounted_after_local_ledger'],'single_native':d['single_native_chunk_unique_count'],'by_operator':d['single_native_by_operator']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-anexonly200-v108-v109-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
