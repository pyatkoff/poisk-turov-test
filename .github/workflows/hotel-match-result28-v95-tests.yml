name: MATCH acquire SAMO unresolved111 v118b
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-result28-v95-tests.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-samo-unresolved111-v118b
  cancel-in-progress: false
env:
  OP: hotel-match-samo-unresolved111-acquire-1971-20260928-v118b
jobs:
  refresh:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact source
        run: |
          set -euo pipefail;umask 077;mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_samo_unresolved111_acquire_v118b.php)" = 0b2cef1c9d7e919725e8e1d1a241fcb7ab571efc
          php -l scripts/diagnostics/hotel_match_samo_unresolved111_acquire_v118b.php
      - name: Acquire exact native IDs for all unresolved SAMO live30 sources
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";rel=".anytoour-match/operations/$OP";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$rel/payload\""
          python3 - "$HEAD" <<'PY'
          import json,sys
          json.dump({'operation':'hotel-match-samo-unresolved111-acquire-1971-20260928-v118b','source_sha':sys.argv[1],'state':'reserved_before_provider','maximum_sources':111,'planned_pairs':127,'planned_groups':14,'http_cap':500,'database_writes':0},open('terminal/reservation.json','w'))
          PY
          scp "${opts[@]}" terminal/reservation.json "$remote:$rel/reservation.json"
          git archive HEAD scripts/diagnostics app/integrations | ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=1024M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_samo_unresolved111_acquire_v118b.php\" --execute" >terminal/stdout.txt 2>terminal/stderr.txt
          rc=$?
          set -e
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - "$rc" <<'PY'
          import json,hashlib,pathlib,sys
          d=json.load(open('terminal/result.json'));r=json.load(open('terminal/receipt.json'))
          assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert d['database_writes']==d['mapping_writes']==0
          print(json.dumps({k:d.get(k) for k in ['state','reason','unresolved_source_count','planned_pair_count','planned_group_count','samo_http_calls','batch_error_count','edge_state_counts','captured_single_native_count']},ensure_ascii=False))
          assert d['state'] in ('completed_read_only','completed_read_only_partial') and int(sys.argv[1])==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-samo-unresolved111-v118b-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
