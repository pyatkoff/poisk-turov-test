name: MATCH retrieve sealed SAMO refresh v117e
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-result28-v95-tests.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-retrieve-samo-v117e
  cancel-in-progress: false
env:
  OP: hotel-match-samo-live30-native-refresh-1971-20260928-v117e
jobs:
  refresh:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact source
        run: |
          set -euo pipefail;umask 077;mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_samo_live30_native_refresh_v117e.php)" = f8ad866aeeff99872ceca7ba2a1dbbedf72def92
          php -l scripts/diagnostics/hotel_match_samo_live30_native_refresh_v117e.php
      - name: Retrieve sealed v117e result without execution
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";rel=".anytoour-match/operations/hotel-match-samo-live30-native-refresh-1971-20260928-v117e";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=json.load(open('terminal/result.json'));r=json.load(open('terminal/receipt.json'))
          assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          print(json.dumps({k:d.get(k) for k in ['state','reason','error_class','files_examined','bytes_examined','live30_page_files','live30_catalog_sources','live30_unmapped_catalog_sources','raw_native_facts','provider_http_calls','database_writes','mapping_writes']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-retrieve-samo-v117e-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
