name: MATCH acquire CURRENT neither600 v119-v120
'on':
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/hotel-match-result28-v95-tests.yml
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: match-neither600-v119-v120
  cancel-in-progress: false
env:
  OP: hotel-match-neither600-acquire-1971-20260928-v120
jobs:
  refresh:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.event.pull_request.number == 4061 && github.event.pull_request.head.ref == 'match/request-ledger-v93-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate exact source
        run: |
          set -euo pipefail;umask 077;mkdir terminal
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_neither600_plan_v119.php)" = 457efe9386158a0677bf8ab14036e66f16053b66
          test "$(git rev-parse HEAD:scripts/diagnostics/hotel_match_neither600_acquire_v120.py)" = 789e861ce2d4d716e49e424944808b81b8cc0748
          php -l scripts/diagnostics/hotel_match_neither600_plan_v119.php
          python3 scripts/diagnostics/hotel_match_neither600_acquire_v120.py --self-test
      - name: Plan and acquire exact native IDs for CURRENT neither600
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail;umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";base=".anytoour-match/operations";plan="hotel-match-neither600-plan-1971-20260928-v119";rel="$base/$OP";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$base/$plan\";test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$base/$plan\" \"\$HOME/$rel/payload\""
          git archive HEAD scripts/diagnostics app/integrations | ssh "${opts[@]}" "$remote" "tar -xf - -C \"\$HOME/$rel/payload\""
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$base/$plan\" MATCH_SOURCE_SHA='$HEAD' php -d memory_limit=1024M \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_neither600_plan_v119.php\" --execute"
          scp "${opts[@]}" "$remote:$base/$plan/result.json" terminal/plan.json
          PLAN_SHA="$(sha256sum terminal/plan.json|awk '{print $1}')"
          COUNT="$(python3 -c 'import json;print(json.load(open("terminal/plan.json"))["scope_count"])')"
          python3 - "$HEAD" "$COUNT" <<'PY'
          import json,sys
          json.dump({'operation':'hotel-match-neither600-acquire-1971-20260928-v120','source_sha':sys.argv[1],'state':'reserved_before_provider_access','maximum_hotels':int(sys.argv[2]),'daily_limit':3000,'operation_call_cap':1200,'operator_filter_sent':False,'continue_calls':0,'dates_calls':0},open('terminal/reservation.json','w'))
          PY
          scp "${opts[@]}" terminal/reservation.json "$remote:$rel/reservation.json"
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\"&&ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_PLAN_PATH=\"\$HOME/$base/$plan/result.json\" MATCH_PLAN_SHA256='$PLAN_SHA' MATCH_CALL_CAP=1200 python3 \"\$HOME/$rel/payload/scripts/diagnostics/hotel_match_neither600_acquire_v120.py\" --execute" >terminal/stdout.txt 2>terminal/stderr.txt
          rc=$?
          set -e
          scp "${opts[@]}" "$remote:$rel/result.json" terminal/result.json
          scp "${opts[@]}" "$remote:$rel/receipt.json" terminal/receipt.json
          python3 - "$rc" <<'PY'
          import json,hashlib,pathlib,sys
          p=json.load(open('terminal/plan.json'));d=json.load(open('terminal/result.json'));r=json.load(open('terminal/receipt.json'))
          assert r['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          assert d['database_writes']==d['mapping_writes']==0 and d['continue_calls']==d['dates_calls']==0 and d['operator_filter_sent'] is False
          print(json.dumps({'scope':p['scope_count'],'eligible':p['eligible_neither_new_context'],'countries':p['country_counts'],'state':d['state'],'provider_calls':d['provider_calls'],'daily_after':d['daily_accounted_after_local_ledger'],'single_native':d['single_native_chunk_unique_count'],'by_operator':d['single_native_by_operator']},ensure_ascii=False))
          assert d['state'] in ('completed_read_only','terminal_quota_stop_no_replay') and int(sys.argv[1])==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-neither600-v119-v120-${{ github.run_id }}
          path: terminal/
          retention-days: 90
          if-no-files-found: warn
