name: MATCH owner write state reconcile

on:
  push:
    branches:
      - ops/match-owner-write-state-reconcile-1971-20260911-v1
    paths:
      - '.github/workflows/hotel-match-owner-write-state-reconcile.yml'

permissions:
  contents: read

concurrency:
  group: anytour-match-owner-write-state-reconcile
  cancel-in-progress: false

jobs:
  inspect:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPERATION_ID: hotel-match-owner-write-state-reconcile-1971-20260911-v1
      EXPECTED_BASE_SHA: 2a230f5d9fb211e516735a38a625a943c0d4bb24
      UNKNOWN_SOURCE_SHA: 00c7a8ef50cd05b8254be7f16af4de2d99ce9bee

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact read-only source
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'pyatkoff/poisk-turov-test'
          test "$GITHUB_REF" = 'refs/heads/ops/match-owner-write-state-reconcile-1971-20260911-v1'
          test "$GITHUB_ACTOR" = 'pyatkoff'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/hotel-match-owner-write-state-reconcile.yml'

      - name: Create immutable read-only reservation
        run: |
          set -euo pipefail
          mkdir -p .owner-state
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          value={'operation_id':os.environ['OPERATION_ID'],'state':'reserved','source_sha':os.environ['GITHUB_SHA'],'base_sha':os.environ['EXPECTED_BASE_SHA'],'unknown_source_sha':os.environ['UNKNOWN_SOURCE_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'scope':'sanitized_owner_write_reconciliation_only','database_calls':0,'supplier_requests':0,'data_writes':0}
          p=Path('.owner-state/reservation.json');raw=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode();p.write_bytes(raw)
          if p.read_bytes()!=raw: raise SystemExit('reservation readback')
          PY

      - name: Preserve reservation before SSH
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-owner-write-state-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: .owner-state/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Inspect current owner write state read-only
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          names=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          if any(not os.environ.get(n,'').strip() for n in names): raise SystemExit('missing ssh configuration')
          host=os.environ['ANYTOOUR_DEPLOY_HOST'].strip();user=os.environ['ANYTOOUR_DEPLOY_USER'].strip()
          php=r'''<?php
          function h($p){return is_file($p)&&!is_link($p)&&filesize($p)<=1000000?hash_file('sha256',$p):null;}
          function j($p){if(!is_file($p)||is_link($p)||filesize($p)>1000000)return null;$x=json_decode(file_get_contents($p),true,32);return is_array($x)?$x:null;}
          function ps($x){if(!is_array($x))return null;return ['state'=>$x['state']??null,'source_sha'=>$x['source_sha']??null,'manifest_sha256'=>$x['manifest_sha256']??null];}
          $root=realpath(getcwd());$home=realpath((string)getenv('HOME'));
          if(!$root||!$home||$root!==$home.'/www/anytoour.ru'){echo json_encode(['status'=>'failed','reason'=>'root']);exit(2);}
          $private=$home.'/.anytoour-anex/review-owner';$target=$root.'/_preview/search3-anex-candidate';
          if(realpath($private)!==$private||!is_dir($private)||(fileperms($private)&0777)!==0700){echo json_encode(['status'=>'failed','reason'=>'private']);exit(3);}
          $m=j($private.'/manifest.json');$pub=j($target.'/anex-owner-panel-manifest.json');$acct=j($private.'/owner.json');
          if(!is_array($m)||!is_array($pub)||!is_array($acct)){echo json_encode(['status'=>'failed','reason'=>'metadata']);exit(4);}
          $out=['status'=>'ok','database_calls'=>0,'supplier_requests'=>0,'data_writes'=>0];
          $out['manifest']=['sha256'=>h($private.'/manifest.json'),'status'=>$m['status']??null,'source_sha'=>$m['source_sha']??null,'previous_source_sha'=>$m['previous_source_sha']??null,'upgrade_action'=>$m['upgrade_action']??null,'write_enabled'=>$m['write_enabled']??null,'owner_activated'=>$m['owner_activated']??null,'runtime_files'=>$m['runtime_files']??null,'after'=>$m['after']??null,'htaccess_reconciled'=>$m['htaccess_reconciled']??null];
          $out['public_manifest']=['sha256'=>h($target.'/anex-owner-panel-manifest.json'),'source_sha'=>$pub['source_sha']??null,'write_enabled'=>$pub['write_enabled']??null,'files'=>$pub['files']??null];
          $out['owner']=['activated'=>is_string($acct['password_hash']??null)&&($acct['password_hash']??'')!==''];
          $sessions=0;$sd=$private.'/sessions';if(is_dir($sd)){foreach(scandir($sd) as $n){$p=$sd.'/'.$n;if($n!=='.'&&$n!=='..'&&is_file($p)&&!is_link($p))$sessions++;}}$out['owner']['session_files']=$sessions;
          $states=[];foreach(glob($private.'/*-state.json')?:[] as $p){$states[basename($p)]=ps(j($p));}ksort($states);$out['states']=$states;
          $sources=[];foreach(glob($private.'/runtime-*',GLOB_ONLYDIR)?:[] as $p){if(preg_match('/runtime-([0-9a-f]{40})$/',basename($p),$mm))$sources[]=$mm[1];}sort($sources);$out['runtime_sources']=$sources;
          $entries=[];foreach(['login','panel'] as $kind){$p=$private.'/entry-'.$kind.'.php';$raw=is_file($p)&&!is_link($p)&&filesize($p)<10000?file_get_contents($p):'';$src=null;if(preg_match('/runtime-([0-9a-f]{40})/',$raw,$mm))$src=$mm[1];$entries[$kind]=['sha256'=>h($p),'runtime_source'=>$src];}$out['entries']=$entries;
          $out['public_files']=['.htaccess'=>h($target.'/.htaccess'),'anex-owner-login.php'=>h($target.'/anex-owner-login.php'),'anex-hotel-review.php'=>h($target.'/anex-hotel-review.php')];
          $actual=[];$ms=$m['source_sha']??'';if(preg_match('/^[0-9a-f]{40}$/',$ms)&&is_array($m['runtime_files']??null)){foreach($m['runtime_files'] as $name=>$expected){$a=h($private.'/runtime-'.$ms.'/'.$name);$actual[$name]=['expected'=>$expected,'actual'=>$a,'match'=>$a===$expected];}}$out['runtime_readback']=$actual;
          echo json_encode($out,JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR).PHP_EOL;
          ?>'''
          with tempfile.TemporaryDirectory() as td:
              key=Path(td)/'key';raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
              if 'PRIVATE KEY' in raw:key.write_text(raw.rstrip()+'\n')
              else:
                  import base64;key.write_bytes(base64.b64decode(raw))
              key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'known_hosts'),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              result=subprocess.run(cmd,input=php,text=True,capture_output=True,timeout=60)
          if result.returncode!=0: raise SystemExit('ssh/readback failed')
          if len(result.stdout)>200000: raise SystemExit('readback bound')
          data=json.loads(result.stdout)
          if data.get('status')!='ok' or any(data.get(k)!=0 for k in ('database_calls','supplier_requests','data_writes')): raise SystemExit('unsafe readback')
          data.update(operation_id=os.environ['OPERATION_ID'],source_sha=os.environ['GITHUB_SHA'],unknown_source_sha=os.environ['UNKNOWN_SOURCE_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
          unknown=os.environ['UNKNOWN_SOURCE_SHA'];m=data['manifest'];states=data.get('states',{});entries=data.get('entries',{});pub=data['public_manifest']
          if m.get('source_sha')==unknown and m.get('write_enabled') is True and pub.get('source_sha')==unknown and pub.get('write_enabled') is True and states.get('write-state.json',{}).get('state')=='completed' and entries.get('panel',{}).get('runtime_source')==unknown and entries.get('login',{}).get('runtime_source')==unknown:
              outcome='completed'
          elif m.get('source_sha')!=unknown and unknown not in data.get('runtime_sources',[]) and states.get('write-state.json') is None:
              outcome='not_started'
          else:
              outcome='partial_or_unknown'
          data['reconciliation_outcome']=outcome
          p=Path('.owner-state/result.json');raw=(json.dumps(data,sort_keys=True,indent=2)+'\n').encode();p.write_bytes(raw)
          if p.read_bytes()!=raw: raise SystemExit('result readback')
          print(json.dumps({'status':'ok','outcome':outcome,'manifest_source':m.get('source_sha'),'write_enabled':m.get('write_enabled'),'write_state':states.get('write-state.json'),'panel_source':entries.get('panel',{}).get('runtime_source'),'public_write_enabled':pub.get('write_enabled')},sort_keys=True))
          PY

      - name: Preserve sanitized reconciliation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-owner-write-state-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            .owner-state/reservation.json
            .owner-state/result.json
          if-no-files-found: warn
          retention-days: 90
