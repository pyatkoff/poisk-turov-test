name: Search3 regenerate derived one-shot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'v2/results-renderer-v5.js'
      - '.github/workflows/search3-regenerate-derived-one-shot.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'ops/search3-generated-regenerator-temp-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out writable exact head
        uses: actions/checkout@v4
        with:
          ref: ops/search3-generated-regenerator-temp-20260917
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Regenerate checked shared runtime and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node scripts/build/search3-js/shared-runtime.cjs --write
          git rm .github/workflows/search3-regenerate-derived-one-shot.yml
          test -n "$(git status --porcelain=v1)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/search3-shared-runtime.json
          git commit -m 'build(search3): refresh shared runtime after meal cleanup'
          git push origin HEAD:ops/search3-generated-regenerator-temp-20260917
