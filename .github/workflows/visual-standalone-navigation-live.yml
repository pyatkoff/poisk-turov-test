name: Visual standalone navigation live

on:
  workflow_run:
    workflows: ['Deploy anytoour.ru']
    types: [completed]
  workflow_dispatch:

jobs:
  navigation-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify responsive navigation on production
        shell: bash
        run: |
          set -euo pipefail
          cat > ./standalone-navigation-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const cases = [
            ['mobile-375',375,812],
            ['mobile-430',430,932],
            ['tablet-768',768,1024],
            ['intermediate-1024',1024,900],
            ['desktop-1440',1440,1000],
          ];
          const pages = [
            ['home','https://anytoour.ru/','shared'],
            ['search','https://anytoour.ru/poisk-turov/','search-legacy'],
            ['hot','https://anytoour.ru/hot/','shared'],
            ['country','https://anytoour.ru/country/','shared'],
            ['contacts','https://anytoour.ru/contacts/','shared'],
          ];
          const isVisible = async locator => {
            if(await locator.count()!==1) return false;
            return locator.evaluate(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0;});
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const [vp,w,h] of cases){
                for(const [name,url,kind] of pages){
                  const context=await browser.newContext({viewport:{width:w,height:h},ignoreHTTPSErrors:true});
                  const page=await context.newPage();
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  if(!response||response.status()!==200) throw new Error(`${vp}/${name}: HTTP ${response&&response.status()}`);
                  if(kind==='shared'){
                    await page.waitForSelector('.at-global-header',{timeout:15000});
                    const headers=await page.locator('.at-global-header').count();
                    if(headers!==1) throw new Error(`${vp}/${name}: shared header count ${headers}`);
                    const desktopNav=page.locator('.at-global-header__nav');
                    const mobileMenu=page.locator('.at-global-header__mobile');
                    if(w<=1024){
                      if(await isVisible(desktopNav)) throw new Error(`${vp}/${name}: desktop nav should be hidden`);
                      if(!(await isVisible(mobileMenu))) throw new Error(`${vp}/${name}: mobile menu missing`);
                      await mobileMenu.locator('summary').click();
                      const panel=mobileMenu.locator('.at-global-header__mobile-panel');
                      if(!(await isVisible(panel))) throw new Error(`${vp}/${name}: mobile panel did not open`);
                      const links=await panel.locator('a').evaluateAll(as=>as.map(a=>({href:a.getAttribute('href'),text:(a.textContent||'').trim()})));
                      if(!links.some(x=>x.href==='/rb/'&&x.text.includes('Раннее'))) throw new Error(`${vp}/${name}: early-booking link missing in mobile menu`);
                      if(!links.some(x=>x.href==='/how-to-buy/'&&x.text.includes('Как купить'))) throw new Error(`${vp}/${name}: purchase-guide link missing in mobile menu`);
                    }else{
                      if(!(await isVisible(desktopNav))) throw new Error(`${vp}/${name}: desktop nav hidden`);
                      if(await isVisible(mobileMenu)) throw new Error(`${vp}/${name}: mobile menu should be hidden`);
                      const links=await desktopNav.locator('a').evaluateAll(as=>as.map(a=>({href:a.getAttribute('href'),text:(a.textContent||'').trim()})));
                      if(!links.some(x=>x.href==='/rb/'&&x.text.includes('Раннее'))) throw new Error(`${vp}/${name}: early-booking link missing in desktop nav`);
                      if(!links.some(x=>x.href==='/how-to-buy/'&&x.text.includes('Как купить'))) throw new Error(`${vp}/${name}: purchase-guide link missing in desktop nav`);
                    }
                  }else{
                    await page.waitForSelector('.at-site-header',{timeout:15000});
                    const headers=await page.locator('.at-site-header').count();
                    if(headers!==1) throw new Error(`${vp}/${name}: search header count ${headers}`);
                    const links=await page.locator('.at-site-header a').evaluateAll(as=>as.map(a=>({href:a.getAttribute('href'),text:(a.textContent||'').trim()})));
                    if(!links.some(x=>x.href==='/rb/'&&x.text.includes('Раннее'))) throw new Error(`${vp}/${name}: early-booking link missing`);
                    if(!links.some(x=>x.href==='/country/'&&x.text.includes('стран'))) throw new Error(`${vp}/${name}: country link missing`);
                  }
                  const pageOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
                  if(pageOverflow) throw new Error(`${vp}/${name}: page horizontal overflow`);
                  console.log('NAV_OK',vp,name,kind);
                  await context.close();
                }
              }
            } finally { await browser.close(); }
            console.log('NAVIGATION_LIVE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./standalone-navigation-live.cjs
