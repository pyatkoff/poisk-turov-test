name: Visual standalone navigation live

on:
  pull_request:
    paths:
      - '.github/workflows/visual-standalone-navigation-live.yml'
  workflow_run:
    workflows: ['Deploy anytoour.ru']
    types: [completed]
  workflow_dispatch:

jobs:
  navigation-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify responsive navigation on production
        shell: bash
        run: |
          set -euo pipefail
          cat > ./standalone-navigation-live.cjs <<'JS'
          const { chromium } = require('playwright');
          const cases = [
            ['mobile',375,812],
            ['tablet',768,1024],
            ['intermediate',1024,900],
            ['desktop',1440,1000],
          ];
          const pages = [
            ['home','https://anytoour.ru/','.at-home-nav',false],
            ['hot','https://anytoour.ru/hot/','.sp-nav',true],
          ];
          const visible = async (page, selector) => page.locator(selector).evaluate(el => {
            const s=getComputedStyle(el), r=el.getBoundingClientRect();
            return s.display!=='none' && s.visibility!=='hidden' && r.width>0 && r.height>0;
          });
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              for(const [vp,w,h] of cases){
                for(const [name,url,selector,expectRb] of pages){
                  const context=await browser.newContext({viewport:{width:w,height:h},ignoreHTTPSErrors:true});
                  const page=await context.newPage();
                  const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
                  if(!response || response.status()!==200) throw new Error(`${vp}/${name}: HTTP ${response&&response.status()}`);
                  await page.waitForSelector(selector,{timeout:15000});
                  if(!(await visible(page,selector))) throw new Error(`${vp}/${name}: navigation hidden`);
                  const state=await page.locator(selector).evaluate(el=>({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,links:[...el.querySelectorAll('a')].map(a=>({href:a.getAttribute('href'),text:(a.textContent||'').trim()}))}));
                  if(w<=1024 && state.scrollWidth < state.clientWidth) console.log(`${vp}/${name}: navigation fits without scrolling`);
                  if(expectRb && !state.links.some(x=>x.href==='/rb/' && x.text.includes('Раннее'))) throw new Error(`${vp}/${name}: early-booking link missing`);
                  const pageOverflow=await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+2);
                  if(pageOverflow) throw new Error(`${vp}/${name}: page horizontal overflow`);
                  console.log('NAV_OK',vp,name,JSON.stringify(state));
                  await context.close();
                }
              }
            } finally { await browser.close(); }
            console.log('STANDALONE_NAVIGATION_LIVE_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./standalone-navigation-live.cjs
