name: MATCH Tourvisor account CURRENT preflight 20260916
on:
  push:
    branches: [match/manual-live-review-queue-1971-20260914]
    paths: [.github/workflows/hotel-match-tv-account-preflight-20260916.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-tv-account-preflight-1971-20260916, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tv-account-preflight-1971-20260916-v1
jobs:
  preflight:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Check exact read-only source before private access
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_tv_account_preflight_20260916.php)" = 9c59fd2c44fc77132fe93a57ca172a1f0d1e4b01
          php -n -l scripts/diagnostics/hotel_match_tv_account_preflight_20260916.php
          php -n scripts/diagnostics/hotel_match_tv_account_preflight_20260916.php --self-test
          mkdir "$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          source=pathlib.Path('scripts/diagnostics/hotel_match_tv_account_preflight_20260916.php').read_bytes()
          assert b'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' in source
          assert not re.search(rb'\b(?:INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)\s',source,re.I)
          assert b'curl_exec' not in source and b'v2_data_tv_get(' not in source
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(source).hexdigest(),'run_id':os.environ['GITHUB_RUN_ID'],'state':'reserved_before_private_access','claim_comment_id':5703010111,'coordination_issue':2530,'queue_issue':1971,'no_replay':True,'database_writes':0,'supplier_calls':0}
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          with p.open('x') as f: json.dump(r,f,sort_keys=True);f.write('\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-tv-account-preflight-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tv-account-preflight-1971-20260916-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: One read-only account and identity snapshot
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_tv_account_preflight_20260916.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz" 2>> "$out/remote-stderr.txt"
          trc=$?
          set -e
          export REMOTE_RC="$rc" TAR_RC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';s.mkdir()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              assert sorted(t.getnames())==['receipt.json','reservation.json','result.json']
              for m in t.getmembers():
                  assert m.isfile() and m.size<=64000000
                  (s/m.name).write_bytes(t.extractfile(m).read())
          result=json.loads((s/'result.json').read_bytes());receipt=json.loads((s/'receipt.json').read_bytes())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert receipt['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          for r in (result,receipt):
              assert r['operation_id']==os.environ['OPERATION_ID'] and r['source_sha']==os.environ['GITHUB_SHA'] and r['no_replay'] is True
              assert r['database_writes']==r['mapping_writes']==r['supplier_calls']==0
          assert receipt['readback_verified'] is True
          summary={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':result['state'],'result_sha256':receipt['result_sha256'],'remote_exit':int(os.environ['REMOTE_RC']),'tar_exit':int(os.environ['TAR_RC']),'readback_verified':True,'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(summary,sort_keys=True)+'\n')
          print(json.dumps(summary,sort_keys=True))
          assert result['state']=='completed_read_only' and os.environ['REMOTE_RC']==os.environ['TAR_RC']=='0'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-tv-account-preflight-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-tv-account-preflight-1971-20260916-v1/
          if-no-files-found: warn
          retention-days: 90
