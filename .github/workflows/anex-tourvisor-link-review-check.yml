name: Saved Tourvisor ANEX link review (offline)
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_tourvisor_link_*.py'
      - 'scripts/diagnostics/anex_search_mapping_import.py'
      - 'scripts/diagnostics/anex_search_mapping_writer.php'
      - 'scripts/diagnostics/anex_saved_strong_batch.py'
      - 'tests/anex_saved_strong_batch_test.py'
      - 'tests/anex-saved-strong-writer-test.php'
      - 'scripts/diagnostics/andromeda_bridge_review.py'
      - 'scripts/diagnostics/andromeda_country_pending.php'
      - 'scripts/diagnostics/andromeda_country_pending.py'
      - 'tests/andromeda-country-pending-test.php'
      - 'tests/andromeda_country_pending_test.py'
      - 'scripts/diagnostics/andromeda_identity_batch_accept.py'
      - 'scripts/diagnostics/andromeda_identity_batch_accept.php'
      - 'scripts/diagnostics/andromeda_country_expansion.py'
      - 'scripts/diagnostics/andromeda_country_expansion.php'
      - 'scripts/diagnostics/andromeda_saved_bridge.py'
      - 'scripts/diagnostics/andromeda_saved_bridge.php'
      - 'tests/andromeda_saved_bridge_test.py'
      - 'tests/andromeda-saved-bridge-writer-test.php'
      - 'tests/andromeda_country_expansion_test.py'
      - 'tests/andromeda-country-expansion-test.php'
      - 'tests/andromeda_bridge_review_test.py'
      - 'tests/andromeda_identity_batch_accept_test.py'
      - 'tests/andromeda-identity-batch-writer-test.php'
      - 'reports/hotel-matching-scale-20260910.json'
      - 'tests/anex_tourvisor_link_*_test.py'
      - 'tests/anex-tourvisor-link-writer-test.php'
      - 'reports/anex-tourvisor-link-review-20260910.json'
      - '.github/workflows/anex-tourvisor-link-review-check.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: anex_link_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP --host=127.0.0.1 --port=3306 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test existing pure policy and writer syntax
        run: |
          python3 -B tests/anex_tourvisor_link_review_test.py
          python3 -B tests/anex_search_mapping_import_test.py
          python3 -B tests/andromeda_bridge_review_test.py
          python3 -B tests/andromeda_country_expansion_test.py
          php -l scripts/diagnostics/andromeda_country_pending.php
          php -l tests/andromeda-country-pending-test.php
          php -l scripts/diagnostics/anex_search_mapping_writer.php
          php -l scripts/diagnostics/andromeda_identity_batch_accept.php
          php -l tests/andromeda-identity-batch-writer-test.php
          php -l scripts/diagnostics/andromeda_country_expansion.php
          php -l tests/andromeda-country-expansion-test.php
          php -l scripts/diagnostics/andromeda_saved_bridge.php
          php -l tests/andromeda-saved-bridge-writer-test.php
          php -l tests/anex-saved-strong-writer-test.php
      - name: Read exact completed artifact and saved proof blobs (no suppliers)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/link-review"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10097668551/zip" > "$RUNNER_TEMP/link-review/archive.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10113498830/zip" > "$RUNNER_TEMP/link-review/egypt.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10118184869/zip" > "$RUNNER_TEMP/link-review/turkey.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10164620676/zip" > "$RUNNER_TEMP/link-review/pending.zip"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/4a0b0a9b4b8f02ea77c3a099639148ec69eac6d4" --jq .content | base64 --decode > "$RUNNER_TEMP/link-review/batch1.json"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/1e936d060bdbbba660450b69b28ee6338fc9919c" --jq .content | base64 --decode > "$RUNNER_TEMP/link-review/batch2.json"
      - name: Reproduce all ten links and six unknowns without database writes
        run: |
          python3 -B scripts/diagnostics/anex_tourvisor_link_review.py --archive "$RUNNER_TEMP/link-review/archive.zip" --batch1 "$RUNNER_TEMP/link-review/batch1.json" --batch2 "$RUNNER_TEMP/link-review/batch2.json" --output "$RUNNER_TEMP/link-review/review.json"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads(Path('reports/anex-tourvisor-link-review-20260910.json').read_text())
          actual = (Path(os.environ['RUNNER_TEMP']) / 'link-review/review.json').read_bytes()
          assert hashlib.sha256(actual).hexdigest() == expected['full_report_sha256']
          PYTHON
      - name: Reproduce complete saved unresolved inventory and stable batches
        run: |
          python3 -B scripts/diagnostics/andromeda_bridge_review.py --scope all --anex "$RUNNER_TEMP/link-review/archive.zip" --egypt "$RUNNER_TEMP/link-review/egypt.zip" --turkey "$RUNNER_TEMP/link-review/turkey.zip" --output "$RUNNER_TEMP/link-review/scale-full.json" --summary "$RUNNER_TEMP/link-review/scale-summary.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          expected = json.loads(Path('reports/hotel-matching-scale-20260910.json').read_text())
          actual = json.loads((Path(os.environ['RUNNER_TEMP']) / 'link-review/scale-summary.json').read_text())
          assert actual == expected
          assert actual['previous_report_canonical_sha256'] == '97411f0e6fbd7400342456a5affab0082c39e24a51c28b94a6bdcd3ece890382'
          PYTHON
      - name: Verify exact 92-row Andromeda batch and no-replay receipt
        env:
          ANDROMEDA_SCALE_FULL_REPORT: ${{ runner.temp }}/link-review/scale-full.json
        run: |
          python3 -B tests/andromeda_identity_batch_accept_test.py
          python3 -B scripts/diagnostics/andromeda_identity_batch_accept.py --report "$ANDROMEDA_SCALE_FULL_REPORT" --output "$RUNNER_TEMP/link-review/andromeda-92-request.json"
      - name: Checked-report adapter and no-replay receipt (synthetic transport)
        env:
          ANEX_LINK_REVIEW_REPORT: ${{ runner.temp }}/link-review/review.json
        run: python3 -B tests/anex_tourvisor_link_import_test.py
      - name: Existing SQL writer against isolated MySQL, no application credentials
        env:
          ANEX_LINK_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anex_link_test;charset=utf8mb4'
          ANEX_LINK_TEST_PROTOCOL: ${{ runner.temp }}/link-review/protocol.ndjson
        run: php tests/anex-tourvisor-link-writer-test.php
      - name: Actual 92-identity transaction, rollback and current guards on disposable MySQL
        env:
          ANEX_LINK_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anex_link_test;charset=utf8mb4'
          ANDROMEDA_BATCH_FIXTURE: ${{ runner.temp }}/link-review/andromeda-92-fixture.json
        run: php tests/andromeda-identity-batch-writer-test.php
      - name: New-country import of 1000 identities and late rollback on disposable MySQL
        env:
          ANEX_LINK_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anex_link_test;charset=utf8mb4'
        run: php tests/andromeda-country-expansion-test.php
      - name: Prepare exact saved Maldives bridge and verify durable receipt behavior
        env:
          BRIDGE_PENDING_ZIP: ${{ runner.temp }}/link-review/pending.zip
          BRIDGE_ANEX_ZIP: ${{ runner.temp }}/link-review/archive.zip
          BRIDGE_FIXTURE: ${{ runner.temp }}/link-review/bridge61-fixture.json
        run: |
          python3 -B tests/andromeda_saved_bridge_test.py
          python3 -B scripts/diagnostics/andromeda_saved_bridge.py --pending "$BRIDGE_PENDING_ZIP" --anex "$BRIDGE_ANEX_ZIP" --output "$RUNNER_TEMP/link-review/bridge61-request.json"
      - name: Execute 61-row bridge transaction and rollback on disposable MySQL
        env:
          ANEX_LINK_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anex_link_test;charset=utf8mb4'
          BRIDGE_FIXTURE: ${{ runner.temp }}/link-review/bridge61-fixture.json
        run: php tests/andromeda-saved-bridge-writer-test.php
      - name: Reproduce complete 403-row pending delta with real PHP Unicode support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10165733820/zip" > "$RUNNER_TEMP/link-review/complete-catalogues.zip"
          python3 -B scripts/diagnostics/andromeda_country_pending.py --archive "$RUNNER_TEMP/link-review/complete-catalogues.zip" --output "$RUNNER_TEMP/link-review/pending-request.json" --fixture "$RUNNER_TEMP/link-review/pending-bundle.json"
      - name: Durable pending receipt and exact manifest tests
        env:
          ANDROMEDA_PENDING_REQUEST: ${{ runner.temp }}/link-review/pending-request.json
        run: python3 -B tests/andromeda_country_pending_test.py
      - name: Actual403 promotions, full19229 competitors, current guards and late rollback
        env:
          ANEX_LINK_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anex_link_test;charset=utf8mb4'
          ANDROMEDA_PENDING_REQUEST: ${{ runner.temp }}/link-review/pending-request.json
          ANDROMEDA_PENDING_BUNDLE: ${{ runner.temp }}/link-review/pending-bundle.json
        run: php tests/andromeda-country-pending-test.php
      - name: Reproduce saved ANEX strong25 and durable receipt boundaries
        env:
          ANEX_SAVED_DIR: ${{ runner.temp }}/link-review
        run: python3 -B tests/anex_saved_strong_batch_test.py
      - name: Existing ANEX writer with25 actual pairs and full country competition
        env:
          ANEX_LINK_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anex_link_test;charset=utf8mb4'
          ANEX_SAVED_DIR: ${{ runner.temp }}/link-review
        run: php tests/anex-saved-strong-writer-test.php
      - uses: actions/upload-artifact@v4
        with:
          name: anex-tourvisor-link-review
          path: |
            ${{ runner.temp }}/link-review/review.json
            ${{ runner.temp }}/link-review/protocol.ndjson
            ${{ runner.temp }}/link-review/scale-full.json
            ${{ runner.temp }}/link-review/scale-summary.json
            ${{ runner.temp }}/link-review/andromeda-92-request.json
            ${{ runner.temp }}/link-review/pending-request.json
            ${{ runner.temp }}/link-review/bridge61-request.json
            ${{ runner.temp }}/link-review/strong-report.json
            ${{ runner.temp }}/link-review/strong-protocol.ndjson
          if-no-files-found: error
          retention-days: 90
