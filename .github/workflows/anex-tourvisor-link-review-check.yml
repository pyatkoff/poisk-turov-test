name: Saved Tourvisor ANEX link review (offline)
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/anex_tourvisor_link_review.py'
      - 'tests/anex_tourvisor_link_review_test.py'
      - 'reports/anex-tourvisor-link-review-20260910.json'
      - '.github/workflows/anex-tourvisor-link-review-check.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test existing pure policy and former-name boundaries
        run: python3 -B tests/anex_tourvisor_link_review_test.py
      - name: Read exact completed artifact and saved proof blobs (no suppliers)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/link-review"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/10097668551/zip" > "$RUNNER_TEMP/link-review/archive.zip"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/4a0b0a9b4b8f02ea77c3a099639148ec69eac6d4" --jq .content | base64 --decode > "$RUNNER_TEMP/link-review/batch1.json"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/1e936d060bdbbba660450b69b28ee6338fc9919c" --jq .content | base64 --decode > "$RUNNER_TEMP/link-review/batch2.json"
      - name: Reproduce all ten links and six unknowns without database writes
        run: |
          python3 -B scripts/diagnostics/anex_tourvisor_link_review.py --archive "$RUNNER_TEMP/link-review/archive.zip" --batch1 "$RUNNER_TEMP/link-review/batch1.json" --batch2 "$RUNNER_TEMP/link-review/batch2.json" --output "$RUNNER_TEMP/link-review/review.json"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          expected = json.loads(Path('reports/anex-tourvisor-link-review-20260910.json').read_text())
          actual = (Path(os.environ['RUNNER_TEMP']) / 'link-review/review.json').read_bytes()
          assert hashlib.sha256(actual).hexdigest() == expected['full_report_sha256']
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: anex-tourvisor-link-review
          path: ${{ runner.temp }}/link-review/review.json
          if-no-files-found: error
          retention-days: 90
