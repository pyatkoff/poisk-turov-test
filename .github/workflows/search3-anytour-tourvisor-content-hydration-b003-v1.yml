name: Search3 AnyTour Tourvisor identity-only content B003 v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [release/search3-production-ready-v1]
    paths:
      - '.github/workflows/search3-anytour-tourvisor-content-hydration-b003-v1.yml'

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: anytour-tourvisor-hotel-content-hydration
  cancel-in-progress: false

env:
  EXPECTED_BASE_RELEASE: 5b21e7f554da8da4f49f92e4fe67842fd1fbeff0
  OPERATION_ID: anytour-tourvisor-hotel-content-2690-20260917-b003-v1
  CLAIM_COMMENT_ID: '5721994364'
  CANDIDATE_SCOPE: canonical
  HOTEL_LIMIT: '100'
  MAX_ATTEMPTS: '1'
  HTTP_BUDGET: '100'
  FRESH_DAYS: '1'
  MIN_INTERVAL_MS: '550'

jobs:
  hydrate-current:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.actor == 'pyatkoff' && github.triggering_actor == 'pyatkoff' &&
      github.run_attempt == 1 &&
      github.event.pull_request.head.repo.full_name == 'pyatkoff/poisk-turov-test' &&
      github.event.pull_request.head.ref == 'ops/local-tourvisor-content-identityonly-2690-20260917-b003-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin operation and merged collector
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "$EXPECTED_BASE_RELEASE"
          test "$(git merge-base "$HEAD_SHA" "$BASE_SHA")" = "$EXPECTED_BASE_RELEASE"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          test "${#changed[@]}" = 1
          test "${changed[0]}" = '.github/workflows/search3-anytour-tourvisor-content-hydration-b003-v1.yml'
          for path in v2/data/db-v1.php v2/data/tourvisor-client-v1.php v2/data/hotel-details-v1.php v2/data/collect-hotel-details-v1.php; do
            test "$(git rev-parse "$HEAD_SHA:$path")" = "$(git rev-parse "$EXPECTED_BASE_RELEASE:$path")"
          done
          test "$CANDIDATE_SCOPE" = canonical && test "$HOTEL_LIMIT" = 100 && test "$MAX_ATTEMPTS" = 1 && test "$HTTP_BUDGET" = 100 && test "$FRESH_DAYS" = 1
          test $(( HOTEL_LIMIT * MAX_ATTEMPTS )) -le "$HTTP_BUDGET"
          php -l v2/data/tourvisor-client-v1.php >/dev/null
          php -l v2/data/hotel-details-v1.php >/dev/null
          php -l v2/data/collect-hotel-details-v1.php >/dev/null
          grep -Fq "v2_data_tv_get('/hotels/' . \$hotelId)" v2/data/collect-hotel-details-v1.php
          grep -Fq 'identity_only_selected=' v2/data/collect-hotel-details-v1.php
          grep -Fq 'v2_hotel_detail_is_generic_product_name' v2/data/collect-hotel-details-v1.php

      - name: Verify owner claim
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_COMMENT_ID" > claim.json
          python3 - <<'PY'
          import datetime,json,os
          c=json.load(open('claim.json'))
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          body=c['body']; assert os.environ['OPERATION_ID'] in body and 'fresh-days=1' in body and 'limit100' in body and 'http-budget100' in body
          created=datetime.datetime.fromisoformat(c['created_at'].replace('Z','+00:00'))
          assert 0 <= (datetime.datetime.now(datetime.timezone.utc)-created).total_seconds() < 7200
          PY

      - name: Retain reservation before provider access
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reservation
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          files=['v2/data/db-v1.php','v2/data/tourvisor-client-v1.php','v2/data/hotel-details-v1.php','v2/data/collect-hotel-details-v1.php']
          r={'operation':os.environ['OPERATION_ID'],'baseRelease':os.environ['EXPECTED_BASE_RELEASE'],'executionSource':os.environ['HEAD_SHA'],
             'pr':int(os.environ['PR_NUMBER']),'run':int(os.environ['GITHUB_RUN_ID']),'attempt':1,'claimCommentId':int(os.environ['CLAIM_COMMENT_ID']),
             'candidateScope':'canonical','hotelLimit':100,'maxAttemptsPerHotel':1,'httpBudget':100,'freshDays':1,'minIntervalMs':550,
             'dependencies':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files},
             'supplierContract':'GET https://api.tourvisor.ru/search/api/v1/hotels/{hotelId}','genericAccommodationProductsExcluded':True,
             'allowedDbWrites':['catalog_hotel_details','catalog_hotels'],'canonicalProfileWrites':0,'mappingWrites':0,'noReplayAfterProviderAccess':True}
          raw=(json.dumps(r,sort_keys=True,ensure_ascii=False)+'\n').encode(); pathlib.Path('reservation/reservation.json').write_bytes(raw)
          pathlib.Path('reservation/reservation.sha256').write_text(hashlib.sha256(raw).hexdigest()+'  reservation.json\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anytour-tourvisor-content-b003-reservation-${{ github.run_id }}
          path: reservation/
          if-no-files-found: error
          retention-days: 90

      - name: Require exact-head Security green
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            gh api "repos/pyatkoff/poisk-turov-test/commits/$HEAD_SHA/check-runs" > checks.json
            python3 - <<'PY' && exit 0 || true
          import json,sys
          r=json.load(open('checks.json'))['check_runs']; sys.exit(0 if any(x['name']=='guard' and x['conclusion']=='success' for x in r) else 1)
          PY
            sleep 5
          done
          exit 1

      - name: Prepare SSH and stage exact collector
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"
          if [[ "$KEY_VALUE" == *'PRIVATE KEY'* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 -d > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null; ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE" > "$known" 2>/dev/null
          opts=(-i "$key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"; op=".anytour-operations/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "umask 077; mkdir -p \"\$HOME/.anytour-operations\"; mkdir \"\$HOME/$op\"; mkdir \"\$HOME/$op/payload\""
          scp "${opts[@]}" v2/data/{db-v1.php,tourvisor-client-v1.php,hotel-details-v1.php,collect-hotel-details-v1.php} reservation/reservation.json "$remote:$op/payload/"

      - name: Collect identity-only canary once
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -uo pipefail; mkdir -p terminal
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; opts=(-i "$key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"; op=".anytour-operations/$OPERATION_ID"
          set +e
          ssh "${opts[@]}" "$remote" "OPERATION_ID='$OPERATION_ID' bash -s" <<'REMOTE' > terminal/collector.log 2>&1
          set -euo pipefail; op="$HOME/.anytour-operations/$OPERATION_ID"; root="$HOME/www/anytoour.ru"; cd "$op"
          test -f "$root/config.php"
          export ANYTOUR_ROOT="$root"
          php -d display_errors=0 -r '$root=getenv("ANYTOUR_ROOT"); require $root."/config.php"; $_SERVER["DOCUMENT_ROOT"]=$root; require "payload/collect-hotel-details-v1.php";' -- \
            --candidate-scope=canonical --limit=100 --fresh-days=1 --min-interval-ms=550 --max-attempts=1 --http-budget=100
          REMOTE
          rc=$?; set -e; printf '%s\n' "$rc" > terminal/ssh-exit.txt

      - name: Seal and verify terminal receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          log=pathlib.Path('terminal/collector.log').read_text(errors='replace') if pathlib.Path('terminal/collector.log').exists() else ''
          rc=int(pathlib.Path('terminal/ssh-exit.txt').read_text().strip()) if pathlib.Path('terminal/ssh-exit.txt').exists() else 999
          lines=[x.strip() for x in log.splitlines() if x.startswith('ANYTOUR_HOTEL_DETAILS_DONE ')]
          metrics={}
          if len(lines)==1:
            for token in lines[0].split()[1:]:
              if '=' in token:
                k,v=token.split('=',1); metrics[k]=int(v) if re.fullmatch(r'-?\d+',v) else v
          attempts=int(metrics.get('http_attempts',0)); selected=int(metrics.get('selected',0)); identity=int(metrics.get('identity_only_selected',0))
          assert 0 <= attempts <= 100 and 0 <= selected <= 100
          if metrics: assert metrics.get('candidate_scope')=='canonical'
          receipt={'operation':os.environ['OPERATION_ID'],'baseRelease':os.environ['EXPECTED_BASE_RELEASE'],'run':int(os.environ['GITHUB_RUN_ID']),
                   'sshExit':rc,'providerAccessed':attempts>0,'noReplay':attempts>0,'maxHttpAttempts':100,'metrics':metrics,
                   'collectorLogSha256':hashlib.sha256(log.encode()).hexdigest(),
                   'status':'completed_identity_only_confirmed' if rc==0 and len(lines)==1 and identity>0 else 'terminal_stop_do_not_scale',
                   'canonicalProfileWrites':0,'mappingWrites':0}
          pathlib.Path('terminal/receipt.json').write_text(json.dumps(receipt,sort_keys=True,ensure_ascii=False)+'\n')
          print('CONTENT_HYDRATION_B003_TERMINAL '+json.dumps(receipt,sort_keys=True,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: anytour-tourvisor-content-b003-terminal-${{ github.run_id }}
          path: terminal/
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup remote operation
        if: always()
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -u; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"
          if [[ -s "$key" && -s "$known" ]]; then opts=(-i "$key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15); ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" "rm -rf \"\$HOME/.anytour-operations/$OPERATION_ID\"" || true; fi
      - name: Require identity-only selection before scaling
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('terminal/receipt.json')); assert r['status']=='completed_identity_only_confirmed',r
          PY
