name: Validate lead recovery UX

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/lead-form-guard-v1.js'
      - 'v2/lead-ui-race-guard-v1.js'
      - '.github/workflows/validate-lead-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lead-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify error retry success and duplicate-success UX
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > lead-recovery.cjs <<'JS'
          const { chromium }=require('playwright'); const path=require('path');
          (async()=>{const browser=await chromium.launch({headless:true});
          for(const width of [375,768,1440]) for(const duplicate of [false,true]){
            const page=await browser.newPage({viewport:{width,height:900}});
            await page.setContent(`<div id="results"></div><section id="selectedTour"><div class="selected-head"></div><div class="facts"></div><div class="tour-flights"><div class="flight-variants"><div class="flight-variant is-selected"><label class="flight-choice"><input type="radio" name="v2flight" checked><span>Вариант 1</span></label></div><div class="flight-variant"><label class="flight-choice"><input type="radio" name="v2flight"><span>Вариант 2</span></label></div></div></div><form class="lead-form"><div class="section-heading"><strong>Заявка</strong><span></span></div><div class="lead-fields"><label>Имя<input name="name" value="Павел"></label><label>Телефон<input name="phone" value="+7 900 123-45-67"></label></div><label>Комментарий<textarea name="comment">Позвонить вечером</textarea></label><label class="lead-consent"><input type="checkbox" checked>Согласен</label><button type="submit">Отправить</button><div class="lead-message"></div></form></section><footer class="ds2-site-footer"><div class="ds2-site-footer__socials"><a href="https://max.ru/anytour">MAX</a><a href="https://t.me/+gGloLUt4d8s3NDcy">Telegram</a></div></footer>`);
            await page.addScriptTag({path:path.resolve('v2/lead-form-guard-v1.js')});
            await page.evaluate(()=>document.dispatchEvent(new Event('DOMContentLoaded')));
            const emit=(name,detail={})=>page.evaluate(({name,detail})=>window.dispatchEvent(new CustomEvent('v2:'+name,{detail})),{name,detail});
            await emit('lead-started',{tourId:'t1'});
            let lock=await page.evaluate(()=>({inert:document.querySelector('.flight-variants').inert,aria:document.querySelector('.flight-variants').getAttribute('aria-busy')}));
            if(!lock.inert||lock.aria!=='true')throw new Error(`flight selection not locked while lead is pending ${width}: ${JSON.stringify(lock)}`);
            await emit('lead-error',{tourId:'t1'});
            lock=await page.evaluate(()=>({inert:document.querySelector('.flight-variants').inert,aria:document.querySelector('.flight-variants').getAttribute('aria-busy')}));
            if(lock.inert||lock.aria==='true')throw new Error(`flight selection not restored after lead error ${width}: ${JSON.stringify(lock)}`);
            let s=await page.evaluate(()=>({name:document.querySelector('[name=name]').value,phone:document.querySelector('[name=phone]').value,comment:document.querySelector('[name=comment]').value,button:document.querySelector('button[type=submit]').textContent,msg:document.querySelector('.lead-message').textContent,role:document.querySelector('.lead-message').getAttribute('role')}));
            if(s.name!=='Павел'||!s.phone.includes('900')||s.comment!=='Позвонить вечером'||s.button!=='Повторить отправку'||s.role!=='alert'||!s.msg.includes('Данные остались'))throw new Error(`error recovery failed ${width}: ${JSON.stringify(s)}`);
            await emit('lead-started',{tourId:'t1'}); await emit('lead-success',{tourId:'t1',leadId:42,deduplicated:duplicate});
            lock=await page.evaluate(()=>({inert:document.querySelector('.flight-variants').inert,aria:document.querySelector('.flight-variants').getAttribute('aria-busy')}));
            if(!lock.inert||lock.aria!=='true')throw new Error(`submitted flight selection should remain frozen after success ${width}: ${JSON.stringify(lock)}`);
            s=await page.evaluate(()=>({heading:document.querySelector('.section-heading strong').textContent,panel:document.querySelector('.lead-success-panel')?.textContent||'',fieldsHidden:document.querySelector('.lead-fields').hidden,submitHidden:document.querySelector('button[type=submit]').hidden,back:!!document.querySelector('.lead-success-back'),handoff:Array.from(document.querySelectorAll('.lead-success-messenger')).map(a=>({text:a.textContent,href:a.getAttribute('href')}))}));
            const expected=duplicate?'Заявка уже отправлена':'Заявка отправлена'; if(s.heading!==expected||!s.panel.includes('42')||!s.fieldsHidden||!s.submitHidden||!s.back)throw new Error(`success recovery failed ${width}/${duplicate}: ${JSON.stringify(s)}`);
            if(s.handoff.length!==2||s.handoff[0].text!=='MAX'||s.handoff[0].href!=='https://max.ru/anytour'||s.handoff[1].text!=='Telegram'||!s.handoff[1].href.startsWith('https://t.me/'))throw new Error(`DS2 messenger handoff failed ${width}/${duplicate}: ${JSON.stringify(s.handoff)}`);
            console.log(`LEAD_RECOVERY_OK width=${width} duplicate=${duplicate}`); await page.close();
          } await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node lead-recovery.cjs
