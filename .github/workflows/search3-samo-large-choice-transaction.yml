name: SEARCH isolated source transaction
on:
  push:
    branches: [fix/search3-samo-large-flight-choice-20260927]
    paths: [.github/workflows/search3-samo-large-choice-transaction.yml]
permissions:
  contents: read
jobs:
  exact-source-fix:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/fix/search3-samo-large-flight-choice-20260927' &&
      github.actor == 'pyatkoff' && github.event.sender.id == 226193297 &&
      github.event.head_commit.message == 'SEARCH: run bounded source transaction'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Require exact source and test blobs before any edit
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 98c92902c85bc1f44c6ccff042420c4af67c4238
          test "$(git hash-object v2/prototype-search/data.js)" = 02bbcb3da1b7025f0ba0fdd022df4aaed7292c03
          test "$(git hash-object tests/search3-visual-live-browser.cjs)" = 63c2b40d71b644c80ef14078e87a67fb147a377b
          test "$(git hash-object tests/search3-visual-large-flight-choices.cjs)" = 0592046096a7c1ba6df5d702deb3a5bd3cbb679e
          test "$(git hash-object tests/search3-visual-live-fixture.cjs)" = af3454274a255c3add5295595030c77d1379607e
      - name: Install pinned offline browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/search3-node" --no-audit --no-fund playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/search3-node/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/search3-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Reproduce the exact 132-choice rejection then apply only the two-file change
        run: |
          if SAMO_TEST_PARSER_ONLY=1 node tests/search3-visual-large-flight-choices.cjs > "$RUNNER_TEMP/samo-before.log" 2>&1; then
            echo 'Expected pre-fix rejection was not reproduced'; exit 1
          fi
          grep -F 'valid 132-option SAMO response rejected' "$RUNNER_TEMP/samo-before.log"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v2/prototype-search/data.js');s=p.read_text()
          before="||value.selection_enabled!==true||value.booking_enabled!==false||!Array.isArray(value.flights)||value.flights.length>100)return null;"
          after="||value.selection_enabled!==true||value.booking_enabled!==false||!Array.isArray(value.flights)\n      ||value.flights.length>(value.state==='flight_selection_required'?1000:100))return null;"
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          p=Path('tests/search3-visual-live-browser.cjs');s=p.read_text()
          marker='})().catch(e=>{console.error(e);server.close();process.exitCode=1;});'
          assert s.count(marker)==1
          p.write_text(s.replace(marker," await require('./search3-visual-large-flight-choices.cjs')();\n"+marker))
          PY
          test "$(git hash-object v2/prototype-search/data.js)" = 3d1eca3748e5302a12ceef8c318f1ca789f53fc0
          node --check v2/prototype-search/data.js
          git diff --check
      - name: Run existing and large-choice browser journeys with fictional data only
        run: node tests/search3-visual-live-browser.cjs
      - name: Commit the checked delta only to the exact unmerged work branch
        run: |
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(paths)=={'v2/prototype-search/data.js','tests/search3-visual-live-browser.cjs'},paths
          PY
          branch=fix/search3-samo-large-flight-choice-20260927
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'pyatkoff'
          git config user.email '226193297+pyatkoff@users.noreply.github.com'
          git add v2/prototype-search/data.js tests/search3-visual-live-browser.cjs
          git commit -m 'fix(SEARCH): accept large SAMO flight choices in NEXT'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - name: Retain offline browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: search3-large-choice-offline-${{ github.run_id }}
          path: visual-live-evidence/
          if-no-files-found: warn
          retention-days: 7
