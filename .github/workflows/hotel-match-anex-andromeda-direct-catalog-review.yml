name: MATCH direct ANEX-Andromeda catalog review
run-name: MATCH direct ANEX-Andromeda catalog review #1971
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php'
      - 'scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_hardened.php'
      - 'tests/hotel-match-anex-andromeda-direct-catalog-review-test.php'
      - 'tests/hotel-match-anex-andromeda-direct-catalog-hardened-test.php'
      - '.github/workflows/hotel-match-anex-andromeda-direct-catalog-review.yml'
  push:
    branches: ['feat/match-anex-sellability-20260911']
    paths:
      - '.github/match-anex-andromeda-direct-catalog-review-1971-v1.arm'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-anex-andromeda-direct-catalog-review-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-andromeda-direct-catalog-review-1971-20260911-v1
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate direct supplier catalog scope
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php
          php -l scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_hardened.php
          php -l tests/hotel-match-anex-andromeda-direct-catalog-review-test.php
          php -l tests/hotel-match-anex-andromeda-direct-catalog-hardened-test.php
          php tests/hotel-match-anex-andromeda-direct-catalog-review-test.php
          php tests/hotel-match-anex-andromeda-direct-catalog-hardened-test.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php').read_text()
          h=Path('scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_hardened.php').read_text()
          assert 'START TRANSACTION READ ONLY' in s and 'START TRANSACTION READ ONLY' in h
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert "'database_writes'=>0" in h and "'mapping_writes'=>0" in h and "'supplier_calls'=>0" in h
          assert 'HMADCR_COORD_BLOCK_M = 5000.0' in s
          assert 'HMADCR_FUZZY_MIN = 0.82' in s and 'HMADCR_CHAR_MIN = 0.86' in s and 'HMADCR_MARGIN_MIN = 0.15' in s
          assert "'tourvisor_local_not_required_for_discovery'=>true" in s
          assert "'existing_local_used_as_validation_only'=>true" in s
          assert "['ANNEX','BEACH','GARDEN','NORTH','SOUTH']" in s
          assert "'coordinate_only_auto_accept'=>false" in s and "'stars_not_identity'=>true" in s
          assert 'HMADCRH_LOCALITY_MIN_DOCS = 5' in h and 'HMADCRH_LOCALITY_MIN_SHARE = 0.03' in h
          assert "'demotion_only'=>true" in h and "'new_pair_min_non_local_identity_anchors'=>2" in h
          for text in (s,h):
              for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl_init','https://','http://'):
                  assert bad.lower() not in text.lower(), bad
          print('direct supplier catalog locality-hardened read-only scope verified')
          PYTHON
  review:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify immutable arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-andromeda-direct-catalog-review-1971-v1.arm)" = "$OPERATION_ID"
      - name: Prepare SSH key
        env: {KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"; key="$RUNNER_TEMP/anytoour_match_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: SSH/runtime preflight before reservation
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_match_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          out="$(ssh "${opts[@]}" "$USER_VALUE@$HOST_VALUE" 'root="$HOME/www/anytoour.ru"; cd "$root"; { test -f data/db-v1.php || test -f v2/data/db-v1.php; }; printf MATCH_SSH_OK')"
          test "$out" = MATCH_SSH_OK
      - name: Reserve before CURRENT DB access
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          r={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (Path(os.environ['STATE'])/'reservation.json').write_text(json.dumps(r,sort_keys=True)+'\n')
          PYTHON
      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-andromeda-direct-catalog-review-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-andromeda-direct-catalog-review-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run CURRENT direct full-catalog reconciliation
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PYTHON'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[5:]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          cross=body('scripts/diagnostics/hotel_match_global_cross_provider_rescue.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          tour=body('scripts/diagnostics/hotel_match_global_tourvisor_rescue.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_cross_provider_rescue.php';\n",'',1)
          approx=body('scripts/diagnostics/hotel_match_global_approx_name_rescue.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_tourvisor_rescue.php';\n",'',1)
          review=body('scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_approx_name_rescue.php';\n",'',1)
          hardened=body('scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_hardened.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_anex_andromeda_direct_catalog_review.php';\n",'',1)
          wrapper=r'''
          try{$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMADCR_ROOT');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMADCR_DB_HELPER');require_once $dbHelper;echo fc_json(hmadcrh_review(v2_data_db(),HMADCR_OPERATION)),"\n";}catch(Throwable $e){echo json_encode(['status'=>'failed','operation_id'=>HMADCR_OPERATION,'reason'=>'HMADCR_REMOTE_ERROR','message'=>$e->getMessage(),'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0]),"\n";exit(2);}
          '''
          code="<?php\ndefine('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+cross+'\n'+tour+'\n'+approx+'\n'+review+'\n'+hardened+'\n'+wrapper
          key=os.path.join(os.environ['RUNNER_TEMP'],'anytoour_match_key')
          p=subprocess.run(['ssh','-T','-i',key,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',f"{os.environ['ANYTOOUR_DEPLOY_USER'].strip()}@{os.environ['ANYTOOUR_DEPLOY_HOST'].strip()}",'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M'],input=code,text=True,capture_output=True,timeout=1740)
          state=Path(os.environ['STATE'])
          try:r=json.loads(p.stdout)
          except Exception:raise RuntimeError('direct_catalog_output_unparseable:'+p.stderr[-1200:])
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw)
          if p.returncode!=0 or r.get('status')!='completed' or r.get('operation_id')!=os.environ['OPERATION_ID'] or r.get('database_writes')!=0 or r.get('mapping_writes')!=0 or r.get('supplier_calls')!=0 or r.get('historical_operations_replayed') is not False: raise RuntimeError('direct_catalog_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True,'stats':r['stats'],'coverage':r['coverage']};(state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          s=r['stats'];c=r['coverage'];summary=f"MATCH #1971 DIRECT ANEX↔Andromeda full-catalog review `{r['operation_id']}` completed locality-hardened read-only / NO-REPLAY. Core8 supplier rows: ANEX **{s['anex_catalog_core8']}**, Andromeda **{s['andromeda_catalog_core8']}**. Base/hardened direct pairs **{s['base_pairs']}/{s['hardened_pairs']}**, locality demoted **{s['locality_demoted']}**. Hardened high-confidence **{s['high_confidence']}**, strong **{s['strong_candidate']}**; existing same-local validation **{s['validated_same_local']}**; NEW high/strong **{s['new_high_confidence']}/{s['new_strong_candidate']}**, including both-unlinked **{s['both_unlinked']}** and one-side-only **{s['one_side_only']}**. Existing-local conflicts **{s['existing_local_conflicts']}**, hard conflicts **{s['hard_conflict']}**, ambiguous **{s['ambiguous']}**, unmatched ANEX **{s['unmatched_anex']}**, target-collision demotions **{s['target_collisions']}**. Coverage ANEX links {c['anex_links']}, ANEX unique {c['anex_unique_local']}, Andromeda unique {c['andromeda_unique_local']}, triple {c['all_three']}. Supplier calls 0; DB/mapping writes 0."
          (state/'summary.md').write_text(summary+'\n');print(summary)
          PYTHON
      - name: Preserve result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-andromeda-direct-catalog-review-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-andromeda-direct-catalog-review-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH result
        if: success()
        env: {GH_TOKEN: '${{ github.token }}', ARTIFACT_ID: '${{ steps.artifact.outputs.artifact-id }}'}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"; gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
