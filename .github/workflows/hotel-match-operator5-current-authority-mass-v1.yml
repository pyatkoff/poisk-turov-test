name: MATCH operator5 CURRENT accepted authority mass v1

on:
  push:
    branches: [diag/match-operator5-current-authority-mass-1971-20260917-v1]
    paths: [.github/workflows/hotel-match-operator5-current-authority-mass-v1.yml]

permissions: {contents: read, actions: read}

concurrency:
  group: hotel-match-operator5-current-authority-mass-1971-20260917-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-operator5-current-authority-mass-1971-20260917-v1

