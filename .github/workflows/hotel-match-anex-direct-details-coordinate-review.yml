name: MATCH ANEX direct-details coordinate review
run-name: MATCH ANEX direct-details coordinate review #1971
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/hotel_match_anex_direct_details_coordinate_review.php'
      - 'tests/hotel-match-anex-direct-details-coordinate-review-test.php'
      - '.github/workflows/hotel-match-anex-direct-details-coordinate-review.yml'
  push:
    branches: ['feat/match-anex-sellability-20260911']
    paths:
      - '.github/match-anex-direct-details-coordinate-review-1971-v1.arm'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-anex-direct-details-coordinate-review-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1
  SOURCE_RUN_ID: '34584484738'
  SOURCE_ARTIFACT_ID: '10193131262'
  SOURCE_ARTIFACT_NAME: hotel-match-anex-sold-details-review-1971-20260911-v2-result
  SOURCE_RESULT_SHA256: 86f3cbe232a262fa6c6bcd5d87a56af8167ce52f1dc7b589c7d4605fd57cc7fa
  SOURCE_PLAN_SHA256: 18ebd5b63c9a5043a9fd573390a0b06331cd099f1956e3d9eea7eb1c2bd9bad0
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate read-only coordinate review
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_anex_direct_details_coordinate_review.php
          php -l tests/hotel-match-anex-direct-details-coordinate-review-test.php
          php tests/hotel-match-anex-direct-details-coordinate-review-test.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_anex_direct_details_coordinate_review.php').read_text(encoding='utf-8')
          assert 'hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1' in s
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'supplier_calls'=>0" in s
          assert 'HMADDCR_COORDINATE_CONFLICT_BLOCK_M = 5000.0' in s
          assert "['annex'=>1,'beach'=>1,'garden'=>1,'north'=>1,'south'=>1]" in Path('scripts/diagnostics/hotel_match_anex_sold_details_strong_review.php').read_text(encoding='utf-8')
          assert 'target_already_claimed' in s and 'target_collision' in s and 'physical_near_count' in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO','curl_init','https://','http://'):
              assert bad.lower() not in s.lower(), bad
          print('direct-details coordinate review scope verified')
          PYTHON

  review:
    needs: validate
    if: github.event_name == 'push' && github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable arm
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-direct-details-coordinate-review-1971-v1.arm)" = "$OPERATION_ID"
      - name: Fetch exact completed direct-details artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$STATE/artifact-meta.json"
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          state=Path(os.environ['STATE']);m=json.loads((state/'artifact-meta.json').read_text())
          assert str(m['id'])==os.environ['SOURCE_ARTIFACT_ID']
          assert m['name']==os.environ['SOURCE_ARTIFACT_NAME']
          assert str(m['workflow_run']['id'])==os.environ['SOURCE_RUN_ID']
          assert m.get('expired') is False
          (state/'source-identity.json').write_text(json.dumps({'artifact_id':m['id'],'name':m['name'],'run_id':m['workflow_run']['id'],'digest':m.get('digest')},sort_keys=True)+'\n')
          PYTHON
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$STATE/source.zip"
          mkdir "$STATE/source"; unzip -q "$STATE/source.zip" -d "$STATE/source"
          test -f "$STATE/source/result.json"; test -f "$STATE/source/plan.json"
          echo "$SOURCE_RESULT_SHA256  $STATE/source/result.json" | sha256sum -c -
          echo "$SOURCE_PLAN_SHA256  $STATE/source/plan.json" | sha256sum -c -
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          state=Path(os.environ['STATE']);r=json.loads((state/'source/result.json').read_text());p=json.loads((state/'source/plan.json').read_text())
          assert r['operation_id']=='hotel-match-anex-sold-details-review-1971-20260911-v2' and r['status']=='completed'
          assert r['database_writes']==0 and r['mapping_writes']==0 and r['details']['ok']==208
          assert p['operation_id']=='hotel-match-anex-sold-details-review-1971-20260911-v2' and p['status']=='ready'
          assert r['target_sha256']==p['target_sha256']
          print(json.dumps({'details_ok':208,'target_sha256':r['target_sha256']},sort_keys=True))
          PYTHON
      - name: Prepare normalized SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_match_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
      - name: Reserve immutable CURRENT read operation before SSH
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          state=Path(os.environ['STATE']);rr=(state/'source/result.json').read_bytes();pp=(state/'source/plan.json').read_bytes()
          reservation={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_current_db_access','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),'source_result_sha256':hashlib.sha256(rr).hexdigest(),'source_plan_sha256':hashlib.sha256(pp).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True}
          (state/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n')
          PYTHON
      - name: Preserve reservation before CURRENT DB access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1-reservation
          path: |
            ${{ runner.temp }}/hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1/source-identity.json
            ${{ runner.temp }}/hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run one CURRENT read-only coordinate review
        env:
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; export STATE
          python3 - <<'PYTHON'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          state=Path(os.environ['STATE'])
          def body(path):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'): s=s[len('<?php'):]
              return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          strong=body('scripts/diagnostics/hotel_match_anex_sold_details_strong_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          review=body('scripts/diagnostics/hotel_match_anex_direct_details_coordinate_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_anex_sold_details_strong_review.php';\n",'',1)
          result64=base64.b64encode((state/'source/result.json').read_bytes()).decode();plan64=base64.b64encode((state/'source/plan.json').read_bytes()).decode()
          wrapper=r'''
          try{
            $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMADDCR_ROOT');
            $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMADDCR_DB_HELPER');require_once $dbHelper;
            $result=json_decode(base64_decode('''+repr(result64)+r'''),true,64,JSON_THROW_ON_ERROR);$plan=json_decode(base64_decode('''+repr(plan64)+r'''),true,64,JSON_THROW_ON_ERROR);
            echo fc_json(hmaddcr_review(v2_data_db(),$result,$plan,HMADDCR_OPERATION)),"\n";
          }catch(Throwable $e){$m=$e->getMessage();$reason=is_string($m)&&preg_match('/\A[A-Z0-9_:-]{1,100}\z/D',$m)?$m:'HMADDCR_REMOTE_ERROR';echo json_encode(['status'=>'failed','operation_id'=>HMADDCR_OPERATION,'reason'=>$reason,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0]),"\n";exit(2);}
          '''
          code="define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+strong+'\n'+review+'\n'+wrapper
          key=os.path.join(os.environ['RUNNER_TEMP'],'anytoour_match_key');host=os.environ['ANYTOOUR_DEPLOY_HOST'].strip();user=os.environ['ANYTOOUR_DEPLOY_USER'].strip()
          if not host or not user: raise RuntimeError('ssh_secret_missing')
          cmd=['ssh','-T','-i',key,'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=/dev/null','-o','ConnectTimeout=15',f'{user}@{host}','cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
          p=subprocess.run(cmd,input='<?php\n'+code,text=True,capture_output=True,timeout=600)
          try:r=json.loads(p.stdout)
          except Exception: raise RuntimeError('coordinate_output_unparseable')
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw)
          if p.returncode!=0 or r.get('status')!='completed' or r.get('operation_id')!=os.environ['OPERATION_ID'] or r.get('database_writes')!=0 or r.get('mapping_writes')!=0 or r.get('supplier_calls')!=0 or r.get('historical_operations_replayed') is not False: raise RuntimeError('coordinate_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True,'stats':r['stats'],'coverage':r['coverage']}
          (state/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n');s=r['stats'];c=r['coverage']
          summary=(f"MATCH #1971 direct ANEX DETAILS coordinate CURRENT review `{r['operation_id']}` completed **read-only / NO-REPLAY**. Immutable direct-details rows **{s['immutable_details']}**, source coordinates **{s['with_source_coordinates']}**. Prepared **{s['prepared']}** coordinate+identity candidates / live **{s['prepared_live']}** / existing Andromeda bridge **{s['prepared_andromeda_bridge']}**. Routes: exact-token **{s['route_exact_tokens']}**, two-token **{s['route_two_token']}**, one-token bridge **{s['route_one_token_bridge']}**, one-token country-unique **{s['route_one_token_unique']}**. Blocked/filtered: protected {s['protected']}, target already claimed {s['target_already_claimed']}, pair excluded {s['pair_excluded']}, ambiguous safe targets {s['ambiguous_safe_targets']}, target collisions {s['target_collision']}. Coverage: ANEX links {c['anex_links']}, ANEX unique local {c['anex_unique_local']}, Andromeda unique local {c['andromeda_unique_local']}, triple {c['all_three']}. Supplier calls **0**, DB/mapping writes **0**. Any acceptance requires a distinct NEW server-current guarded write.")
          (state/'summary.md').write_text(summary+'\n');print(summary)
          PYTHON
      - name: Preserve result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-direct-details-coordinate-review-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"; gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
