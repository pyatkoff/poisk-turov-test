name: Audit V2 live traffic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-v2-live-traffic.yml'
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

concurrency:
  group: ci-audit-v2-live-traffic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY_VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$GITHUB_WORKSPACE/deploy_key"
          raw="$DEPLOY_SSH_KEY_VALUE"
          if [[ "$raw" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$raw" | tr -d '\r' > "$key_file"; else printf '%s' "$raw" | base64 --decode > "$key_file"; fi
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
      - name: Build privacy-safe audit script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/v2-live-audit.py" <<'PY'
          import os,re,collections,subprocess
          home=os.path.expanduser("~")
          access=os.path.join(home,"logs","anytour.online.access.log")
          error=os.path.join(home,"logs","anytour.online.error.log")
          project="/poisk-turov-test"
          v2=project+"/v2"
          safe_outside_paths={"/images/logo.svg","/images/pay_icons.png","/images/mir-logo-h229px.png"}
          def tail(path,count):
              if not os.path.isfile(path) or not os.access(path,os.R_OK): return []
              p=subprocess.Popen(["tail","-n",str(count),"--",path],stdout=subprocess.PIPE,stderr=subprocess.PIPE,universal_newlines=True)
              out,_=p.communicate()
              return (out or "").splitlines()
          def actor(line):
              l=line.lower()
              if "headlesschrome" in l or "playwright" in l: return "headless"
              if "bot" in l or "spider" in l or "crawler" in l: return "bot"
              if "curl/" in l: return "curl"
              if "python-requests" in l or "python/" in l: return "python"
              if "mozilla/" in l: return "browser"
              return "other"
          def safe_signature(line):
              core=line.split(", client:",1)[0]
              core=re.sub(r'^.*?\]\s+\d+#\d+:\s+\*\d+\s+','',core)
              core=re.sub(r'"[^"]*"', '<quoted>', core)
              core=re.sub(r"'[^']*'", '<quoted>', core)
              core=re.sub(r'(?<![A-Za-z0-9_])/(?:[^\s,;:()]+/?)+', '<path>', core)
              core=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','<addr>',core)
              core=re.sub(r'\b[0-9a-f]{2,}:[0-9a-f:]+\b','<addr>',core,flags=re.I)
              core=re.sub(r'\b\d+\b','<n>',core)
              return re.sub(r'\s+',' ',core).strip()[:180] or '(empty)'
          def error_request(line):
              m=re.search(r'request:\s+"[A-Z]+\s+([^\s"]+)',line)
              if not m: return '(none)','(none)'
              target=m.group(1); clean=target.split('?',1)[0]
              if not clean.startswith(project) and clean not in safe_outside_paths: clean='(outside-project)'
              action='(none)'
              if '?' in target:
                  am=re.search(r'(?:^|&)action=([^&]+)',target.split('?',1)[1])
                  if am: action=am.group(1)
              return clean,action
          def summarize(lines,needle,label):
              req=re.compile(r'"([A-Z]+)\s+([^\s"]+)\s+HTTP/[^"]+"\s+(\d{3})')
              total=0; methods=collections.Counter(); status=collections.Counter(); paths=collections.Counter(); actions=collections.Counter(); bad=collections.Counter(); bad_actions=collections.Counter(); bad_actors=collections.Counter(); actors=collections.Counter(); browser_actions=collections.Counter()
              for line in lines:
                  if needle not in line: continue
                  m=req.search(line)
                  if not m: continue
                  method,target,code=m.groups(); total+=1; methods[method]+=1; status[code]+=1
                  who=actor(line); actors[who]+=1
                  clean=target.split("?",1)[0]; paths[clean]+=1
                  action="(none)"
                  if "?" in target:
                      am=re.search(r'(?:^|&)action=([^&]+)',target.split("?",1)[1])
                      if am: action=am.group(1); actions[action]+=1
                  if who=="browser" and action!="(none)": browser_actions[action]+=1
                  if code.startswith(("4","5")):
                      bad[(code,clean)]+=1; bad_actions[(code,action)]+=1; bad_actors[(code,who,action)]+=1
              print(label+"_REQUESTS",total)
              print(label+"_METHODS",dict(methods))
              print(label+"_STATUS",dict(status))
              print(label+"_ACTORS",dict(actors))
              print(label+"_TOP_PATHS",paths.most_common(20))
              print(label+"_TOP_ACTIONS",actions.most_common(20))
              print(label+"_BROWSER_ACTIONS",browser_actions.most_common(20))
              print(label+"_4XX_5XX",bad.most_common(20))
              print(label+"_4XX_5XX_ACTIONS",bad_actions.most_common(20))
              print(label+"_4XX_5XX_ACTORS",bad_actors.most_common(20))
              return total
          print("ACCESS_SOURCE",os.path.relpath(access,home),os.path.getsize(access) if os.path.isfile(access) else 0,int(os.path.getmtime(access)) if os.path.isfile(access) else 0)
          lines=tail(access,50000)
          actor_by_ip={}
          for line in lines:
              parts=line.split(None,1)
              if parts: actor_by_ip[parts[0]]=actor(line)
          root_total=summarize(lines,project,"PROJECT_LIVE")
          v2_total=summarize(lines,v2,"V2_LIVE")
          print("PROJECT_NON_V2_REQUESTS",max(0,root_total-v2_total))
          err=collections.Counter(); severities=collections.Counter(); signatures=collections.Counter(); class_paths=collections.Counter(); class_actions=collections.Counter(); class_actors=collections.Counter(); matched=0
          severity_rx=re.compile(r'\[(debug|info|notice|warn|error|crit|alert|emerg)\]',re.I)
          client_rx=re.compile(r', client:\s*([^,\s]+)')
          classes=[
              ("php_fatal",re.compile(r'PHP Fatal error|Uncaught',re.I)),
              ("php_warning",re.compile(r'PHP Warning',re.I)),
              ("fastcgi_stderr",re.compile(r'FastCGI sent in stderr',re.I)),
              ("upstream_timeout",re.compile(r'upstream timed out|timed out.*upstream',re.I)),
              ("upstream_premature_close",re.compile(r'upstream prematurely closed',re.I)),
              ("upstream_connect_fail",re.compile(r'connect\(\) failed.*upstream|no live upstreams',re.I)),
              ("upstream_recv_fail",re.compile(r'recv\(\) failed.*upstream|readv\(\) failed.*upstream',re.I)),
              ("upstream_big_header",re.compile(r'upstream sent too big header',re.I)),
              ("upstream_buffered",re.compile(r'upstream response is buffered to a temporary file',re.I)),
              ("client_closed",re.compile(r'client closed connection|client prematurely closed connection',re.I)),
              ("client_body_too_large",re.compile(r'client intended to send too large body',re.I)),
              ("request_header_too_large",re.compile(r'client sent too large request|request header or cookie too large',re.I)),
              ("ssl_handshake",re.compile(r'SSL_do_handshake\(\) failed|SSL handshaking',re.I)),
              ("rate_limited",re.compile(r'limiting requests|limiting connections|delaying request, excess',re.I)),
              ("filesystem_symlink_loop",re.compile(r'openat\(\).*Too many levels of symbolic links',re.I)),
              ("open_failed",re.compile(r'open(?:at)?\(\).*failed',re.I)),
              ("access_forbidden",re.compile(r'forbidden|permission denied',re.I)),
              ("internal_redirect",re.compile(r'internal redirection cycle',re.I)),
          ]
          for line in tail(error,30000):
              if project not in line: continue
              matched+=1
              sm=severity_rx.search(line); severities[(sm.group(1).lower() if sm else "unknown")]+=1
              signatures[safe_signature(line)]+=1
              path,action=error_request(line); cm=client_rx.search(line); who=actor_by_ip.get(cm.group(1),'unknown') if cm else 'unknown'; hit=False
              for name,rx in classes:
                  if rx.search(line):
                      err[name]+=1; class_paths[(name,path)]+=1; class_actions[(name,action)]+=1; class_actors[(name,who)]+=1; hit=True; break
              if not hit: err["other_project_error_line"]+=1
          print("PROJECT_ERROR_SOURCE",os.path.relpath(error,home),os.path.getsize(error) if os.path.isfile(error) else 0)
          print("PROJECT_ERROR_LINES",matched)
          print("PROJECT_ERROR_SEVERITIES",dict(severities))
          print("PROJECT_ERROR_CLASSES",dict(err))
          print("PROJECT_ERROR_SAFE_SIGNATURES",signatures.most_common(15))
          print("PROJECT_ERROR_CLASS_PATHS",class_paths.most_common(20))
          print("PROJECT_ERROR_CLASS_ACTIONS",class_actions.most_common(20))
          print("PROJECT_ERROR_CLASS_ACTORS",class_actors.most_common(20))
          PY
          python3 -m py_compile "$RUNNER_TEMP/v2-live-audit.py"
      - name: Aggregate exact vhost production signals
        env:
          DEPLOY_HOST_VALUE: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER_VALUE: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$GITHUB_WORKSPACE/deploy_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          remote="/tmp/v2-live-audit-${GITHUB_RUN_ID}.py"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/v2-live-audit.py" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE:$remote"
          ssh "${ssh_opts[@]}" "$DEPLOY_USER_VALUE@$DEPLOY_HOST_VALUE" "timeout 45s python3 '$remote'; rc=\$?; rm -f '$remote'; exit \$rc"
