name: Search3 AnyTour destination identities
on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'v2/data/migrations/20260921-anytour-destination-identities-v1.sql'
      - 'v2/data/anytour-destination-catalog-v1.php'
      - 'v2/data/search3-destination-read-v1.php'
      - 'v2/prototype-search/data.js'
      - 'tests/anytour-destination-catalog-v1.php'
      - 'tests/search3-destination-read-v1-test.php'
      - 'tests/search3-prototype-canonical-destination-scope.cjs'
      - '.github/workflows/search3-anytour-destination-identities.yml'
permissions: {contents: read}
jobs:
  destination-identities:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: fixture-only-password, MYSQL_DATABASE: anytour_destination_fixture}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: '8.3', extensions: pdo_mysql, coverage: none}
      - name: Exact ID bridge contract
        env:
          ANYTOUR_DESTINATION_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=anytour_destination_fixture;charset=utf8mb4'
          ANYTOUR_DESTINATION_TEST_PASSWORD: fixture-only-password
        run: |
          set -euo pipefail
          php -l v2/data/anytour-destination-catalog-v1.php
          php -l tests/anytour-destination-catalog-v1.php
          php -l v2/data/search3-destination-read-v1.php
          php -l tests/search3-destination-read-v1-test.php
          node --check v2/prototype-search/data.js
          node --check tests/search3-prototype-canonical-destination-scope.cjs
          php tests/anytour-destination-catalog-v1.php
          php tests/search3-destination-read-v1-test.php
          node --test tests/search3-prototype-canonical-destination-scope.cjs
          ! grep -Eq 'LOWER\(|LIKE|normalized|levenshtein|similar' v2/data/anytour-destination-catalog-v1.php
