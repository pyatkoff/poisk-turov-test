name: MATCH offline retained geography evidence
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths:
      - scripts/diagnostics/hotel_match_frontier_geography_evidence.py
      - tests/hotel_match_frontier_geography_evidence_test.py
      - .github/workflows/hotel-match-frontier-geography-evidence-check.yml
permissions: {contents: read, actions: read}
jobs:
  offline:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify exact offline source
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_frontier_geography_evidence.py)" = a433f6c46fddd03e42b5a2a4fc5083c646b3e9af
          test "$(git hash-object tests/hotel_match_frontier_geography_evidence_test.py)" = 914e44ef7f94f0e458bfc29f6fe370a267824bd2
          python3 -m py_compile scripts/diagnostics/hotel_match_frontier_geography_evidence.py tests/hotel_match_frontier_geography_evidence_test.py
      - name: Download only two existing evidence artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/match-geo-inputs"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10447857357/zip > "$RUNNER_TEMP/match-geo-inputs/dossier.zip"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10394524643/zip > "$RUNNER_TEMP/match-geo-inputs/census.zip"
      - name: Test full frontier and reproduce geography support
        run: |
          set -euo pipefail
          export MATCH_GEO_DOSSIER_ZIP="$RUNNER_TEMP/match-geo-inputs/dossier.zip"
          export MATCH_GEO_CENSUS_ZIP="$RUNNER_TEMP/match-geo-inputs/census.zip"
          python3 tests/hotel_match_frontier_geography_evidence_test.py
          python3 scripts/diagnostics/hotel_match_frontier_geography_evidence.py "$MATCH_GEO_DOSSIER_ZIP" "$MATCH_GEO_CENSUS_ZIP" "$RUNNER_TEMP/match-frontier-geography-20260916.json"
          echo "a7e32249fd1a63e8783e92f8871314644ef5cf3fa1c6593b23be87c0b1dd75e8  $RUNNER_TEMP/match-frontier-geography-20260916.json" | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-frontier-geography-${{ github.sha }}
          path: ${{ runner.temp }}/match-frontier-geography-20260916.json
          if-no-files-found: error
          retention-days: 90
