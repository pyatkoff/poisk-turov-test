name: MATCH offline retained geography evidence
on:
  push:
    branches: [match/frontier-retained-join-1971-20260916-v1]
    paths:
      - scripts/diagnostics/hotel_match_frontier_geography_evidence.py
      - scripts/diagnostics/hotel_match_hierarchy_current_apply.php
      - scripts/diagnostics/hotel_match_name_evidence_recovery.py
      - tests/hotel_match_frontier_geography_evidence_test.py
      - tests/hotel_match_name_evidence_recovery_test.py
      - .github/workflows/hotel-match-frontier-geography-evidence-check.yml
permissions: {contents: read, actions: read}
jobs:
  offline:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Verify exact offline source
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_frontier_geography_evidence.py)" = 850ef42aa529e314a46d9fd0f696b4d8d41f9a67
          test "$(git hash-object tests/hotel_match_frontier_geography_evidence_test.py)" = f61e81a3d8cef605aaafe1678fa451e157c4f13a
          python3 -m py_compile scripts/diagnostics/hotel_match_frontier_geography_evidence.py tests/hotel_match_frontier_geography_evidence_test.py
      - name: Test structured protection with synthetic data only
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_hierarchy_current_apply.php)" = 1a2eba434aaf76810641e6851e0224a986b1c23d
          python3 - <<'PY'
          import hashlib,pathlib
          s=pathlib.Path('scripts/diagnostics/hotel_match_hierarchy_current_apply.php').read_text()
          tail=s[s.index('function hmha_source('):s.index("if(in_array('--self-test'")]
          assert hashlib.sha256(tail.encode()).hexdigest()=='acb3bf430755781f1a9f645b083ced3e4856e835372b19a981e4bcea7ee3573a'
          assert s.count('__SEALED_CURRENT_PLAN_BASE64__')==1
          assert not pathlib.Path('.github/workflows/hotel-match-hierarchy-current-apply-v1.yml').exists()
          PY
          php -n -l scripts/diagnostics/hotel_match_hierarchy_current_apply.php
          cd "$RUNNER_TEMP"
          php -n -d allow_url_fopen=0 "$GITHUB_WORKSPACE/scripts/diagnostics/hotel_match_hierarchy_current_apply.php" --self-test | tee "$RUNNER_TEMP/match-protection-tests.txt"
          grep -Fxq '285 guarded apply self-tests PASS' "$RUNNER_TEMP/match-protection-tests.txt"
      - name: Download only two existing evidence artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/match-geo-inputs"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10447857357/zip > "$RUNNER_TEMP/match-geo-inputs/dossier.zip"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10394524643/zip > "$RUNNER_TEMP/match-geo-inputs/census.zip"
      - name: Test hierarchy and compound cases then review the full frontier
        run: |
          set -euo pipefail
          export MATCH_GEO_DOSSIER_ZIP="$RUNNER_TEMP/match-geo-inputs/dossier.zip"
          export MATCH_GEO_CENSUS_ZIP="$RUNNER_TEMP/match-geo-inputs/census.zip"
          mkdir "$RUNNER_TEMP/match-hierarchy-output"
          cp "$RUNNER_TEMP/match-protection-tests.txt" "$RUNNER_TEMP/match-hierarchy-output/protection-tests.txt"
          python3 tests/hotel_match_frontier_geography_evidence_test.py 2>&1 | tee "$RUNNER_TEMP/match-hierarchy-output/tests.txt"
          python3 scripts/diagnostics/hotel_match_frontier_geography_evidence.py "$MATCH_GEO_DOSSIER_ZIP" "$MATCH_GEO_CENSUS_ZIP" "$RUNNER_TEMP/match-hierarchy-output/geography.json"
          python3 scripts/diagnostics/hotel_match_frontier_geography_evidence.py "$MATCH_GEO_DOSSIER_ZIP" "$MATCH_GEO_CENSUS_ZIP" "$RUNNER_TEMP/match-hierarchy-output/identity.json" --review-hotels
          echo "07acd60e176baa601041b18caf8da49a6514e87ac7d1043a61bed669a21a539a  $RUNNER_TEMP/match-hierarchy-output/geography.json" | sha256sum -c -
          echo "712aa93f1476ff6b0549d1f1ed606e4c999ef3076c8c6fce3dbd06614682da97  $RUNNER_TEMP/match-hierarchy-output/identity.json" | sha256sum -c -
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/match-hierarchy-output/source-sha.txt"
      - name: Read completed CURRENT artifact for offline recovery only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/match-recovery-inputs"
          cp "$RUNNER_TEMP/match-geo-inputs/census.zip" "$RUNNER_TEMP/match-recovery-inputs/match-census-10394524643.zip"
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10455217564/zip > "$RUNNER_TEMP/match-recovery-inputs/match-hierarchy-current-35116182779.zip"
      - name: Audit all recovered pairs without supplier or database access
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_match_name_evidence_recovery.py)" = d08adf50e5d48ae674594e87d058afb345d0e6c3
          test "$(git hash-object tests/hotel_match_name_evidence_recovery_test.py)" = 810c419f92e718aa8fb0a8adbeaf3cf143cb18c3
          export MATCH_RECOVERY_INPUT_DIR="$RUNNER_TEMP/match-recovery-inputs"
          python3 -m py_compile scripts/diagnostics/hotel_match_name_evidence_recovery.py tests/hotel_match_name_evidence_recovery_test.py
          python3 tests/hotel_match_name_evidence_recovery_test.py 2>&1 | tee "$RUNNER_TEMP/match-hierarchy-output/recovery-tests.txt"
          python3 scripts/diagnostics/hotel_match_name_evidence_recovery.py "$MATCH_RECOVERY_INPUT_DIR/match-hierarchy-current-35116182779.zip" "$MATCH_RECOVERY_INPUT_DIR/match-census-10394524643.zip" "$RUNNER_TEMP/match-hierarchy-output/recovery.json" --audit-output "$RUNNER_TEMP/match-hierarchy-output/pair-audit.json"
          echo "73a6d537ed852e85bcf6601792a226f6a552ed9e7e690f64245297838ebc929c  $RUNNER_TEMP/match-hierarchy-output/recovery.json" | sha256sum -c -
          echo "d9ee55245c3bc442659d373ff280e773603da74c29e7301b0395abcfa457f1b6  $RUNNER_TEMP/match-hierarchy-output/pair-audit.json" | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-frontier-hierarchy-identity-${{ github.sha }}
          path: ${{ runner.temp }}/match-hierarchy-output/
          if-no-files-found: error
          retention-days: 90
