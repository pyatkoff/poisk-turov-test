name: MATCH supplier-component CURRENT v3

on:
  push:
    branches: ['ops/match-residual-ensemble-current-1971-v2']
    paths: ['.github/match-anex-andromeda-component-consensus-current-1971-20260912-v3.arm']

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: match-supplier-component-current-1971-20260912-v3
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-anex-andromeda-component-consensus-current-1971-20260912-v3
  STATE_DIR: /tmp/match-supplier-component-current-v3

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate unchanged component algorithm and derive v3 runtime package
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-andromeda-component-consensus-current-1971-20260912-v3.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_anex_andromeda_component_consensus_review.php
          php -l tests/hotel-match-anex-andromeda-component-consensus-review-test.php
          php tests/hotel-match-anex-andromeda-component-consensus-review-test.php
          mkdir -m 700 -p "$STATE_DIR/package"
          export OUT="$STATE_DIR/package/review.php"
          python3 - <<'PY'
          import os,re
          from pathlib import Path

          def body(path, require_line=None):
              s=Path(path).read_text(encoding='utf-8')
              if s.startswith('<?php'):
                  s=s[5:]
              s=s.replace('declare(strict_types=1);','',1)
              if require_line:
                  assert s.count(require_line)==1,(path,'require',s.count(require_line))
                  s=s.replace(require_line,'',1)
              lines=[]; removed=0
              for line in s.splitlines(True):
                  if "PHP_SAPI==='cli'" in line and 'library_only:' in line and 'exit(64)' in line:
                      removed+=1
                      continue
                  lines.append(line)
              return ''.join(lines),removed

          specs=[
            ('scripts/diagnostics/hotel_full_catalog_reconcile.php',None),
            ('scripts/diagnostics/hotel_match_current_bulk_review.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n"),
            ('scripts/diagnostics/hotel_match_global_cross_provider_rescue.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n"),
            ('scripts/diagnostics/hotel_match_global_tourvisor_rescue.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_cross_provider_rescue.php';\n"),
            ('scripts/diagnostics/hotel_match_global_approx_name_rescue.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_tourvisor_rescue.php';\n"),
            ('scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_review.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_global_approx_name_rescue.php';\n"),
            ('scripts/diagnostics/hotel_match_anex_andromeda_direct_catalog_hardened.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_anex_andromeda_direct_catalog_review.php';\n"),
            ('scripts/diagnostics/hotel_match_anex_andromeda_mutual_graph_review.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_anex_andromeda_direct_catalog_hardened.php';\n"),
            ('scripts/diagnostics/hotel_match_anex_andromeda_cluster_local_review.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_anex_andromeda_mutual_graph_review.php';\n"),
            ('scripts/diagnostics/hotel_match_anex_andromeda_component_consensus_review.php',"if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_anex_andromeda_cluster_local_review.php';\n"),
          ]

          parts=[]; removed_total=0
          for path,req in specs:
              x,n=body(path,req)
              if path.endswith('hotel_match_global_cross_provider_rescue.php'):
                  old="foreach(array_keys($places) as $p){if(strlen($p)<4)continue;"
                  new="foreach(array_keys($places) as $p){$p=(string)$p;if(strlen($p)<4)continue;"
                  assert x.count(old)==1,(path,'numeric_place_cast_target',x.count(old))
                  x=x.replace(old,new,1)
                  assert new in x
              parts.append(x); removed_total+=n

          review=parts[-1]
          oldop="const HMACCR_OPERATION='hotel-match-anex-andromeda-component-consensus-review-1971-20260911-v1';"
          newop="const HMACCR_OPERATION='"+os.environ['OPERATION_ID']+"';"
          assert review.count(oldop)==1
          parts[-1]=review.replace(oldop,newop,1)
          algorithm=parts[-1]
          stripped=re.sub(r'/\*.*?\*/|//[^\n]*','',algorithm,flags=re.S)
          for pat in [r'\bINSERT\s+INTO\b',r'\bUPDATE\s+[A-Za-z_]',r'\bDELETE\s+FROM\b',r'\bREPLACE\s+INTO\b',r'\bcurl_\w+\s*\(',r'https?://']:
              assert not re.search(pat,stripped,re.I),pat
          for needle in [
              "'connected_component_single_local_label_required'=>true",
              "'direct_labeled_neighbor_required'=>true",
              "'transitive_only_inference_forbidden'=>true",
              "'provider_local_target_uniqueness_required'=>true",
              "'source_local_coordinate_conflict_block_m'=>HMACCR_COORD_BLOCK_M",
              "'stars_not_identity'=>true",
              'START TRANSACTION READ ONLY',
          ]:
              assert needle in algorithm,needle

          wrapper=r'''
          try{
            $root=realpath(getcwd());
            if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMACCR_ROOT');
            $dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));
            if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('HMACCR_DB_HELPER');
            require_once $dbHelper;
            echo 'HMACCR_RESULT:'.fc_json(hmaccr_review(v2_data_db(),HMACCR_OPERATION))."\n";
          }catch(Throwable $e){
            echo 'HMACCR_RESULT:'.json_encode([
              'status'=>'failed','operation_id'=>HMACCR_OPERATION,
              'reason'=>'HMACCR_REMOTE_ERROR','error_class'=>get_class($e),
              'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,
              'historical_operations_replayed'=>false
            ])."\n";
            exit(2);
          }
          '''
          code="<?php\ndeclare(strict_types=1);\ndefine('FC_LIBRARY_ONLY',true);\n"+'\n'.join(parts)+'\n'+wrapper
          assert 'library_only:' not in code
          assert newop in code and oldop not in code
          assert '$p=(string)$p;if(strlen($p)<4)' in code
          assert removed_total>=1,removed_total
          Path(os.environ['OUT']).write_text(code,encoding='utf-8')
          print('MATCH_COMPONENT_CURRENT_V3_PACKAGE_OK guards_removed='+str(removed_total))
          PY
          php -l "$OUT"

      - name: Persist durable reservation before CURRENT DB access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['STATE_DIR']);p=d/'package'/'review.php'
          r={
            'operation_id':os.environ['OPERATION_ID'],
            'state':'reserved_before_current_db_access',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'source_sha':os.environ['GITHUB_SHA'],
            'package_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'scope':'entire_current_core8_supplier_component_graph',
            'transaction':'REPEATABLE READ / READ ONLY',
            'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,
            'runtime_numeric_place_key_cast':True,'no_replay':True
          }
          (d/'reservation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY

      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: match-supplier-component-current-v3-${{ github.run_id }}-reserved
          path: ${{ env.STATE_DIR }}/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute CURRENT component review over persistent SSH
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/hmaccr-key";sock="$RUNNER_TEMP/hmaccr.sock";known="$RUNNER_TEMP/hmaccr-known";remote="/tmp/hmaccr-${GITHUB_RUN_ID}"
          test -n "$KEY_VALUE" && test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key";ssh-keygen -y -f "$key" >/dev/null
          ok=0
          for attempt in 1 2 3 4 5;do
            rm -f "$sock"
            if ssh -M -S "$sock" -fnNT -o ControlPersist=900 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$USER_VALUE@$HOST_VALUE";then ok=1;break;fi
            sleep $((attempt*3))
          done
          test "$ok" = 1
          cleanup(){ ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote'" >/dev/null 2>&1||true;ssh -S "$sock" -O exit "$USER_VALUE@$HOST_VALUE" >/dev/null 2>&1||true;rm -f "$key";};trap cleanup EXIT
          ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" 'cd "$HOME/www/anytoour.ru" && { test -s data/db-v1.php || test -s v2/data/db-v1.php; } && printf HMACCR_PREFLIGHT_OK' | grep -qx HMACCR_PREFLIGHT_OK
          tar -C "$STATE_DIR/package" -czf - . | ssh -S "$sock" -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "rm -rf '$remote' && mkdir -m 700 '$remote' && tar -xzf - -C '$remote'"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$USER_VALUE@$HOST_VALUE" "cd \"\$HOME/www/anytoour.ru\" && php -d display_errors=0 -d log_errors=1 -d memory_limit=2048M '$remote/review.php'" > "$STATE_DIR/live.stdout" 2> "$STATE_DIR/live.stderr";rc=$?
          set -e;export RC="$rc"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path(os.environ['STATE_DIR']);out=(d/'live.stdout').read_text(errors='replace');err=(d/'live.stderr').read_text(errors='replace');prefix='HMACCR_RESULT:'
          lines=[x[len(prefix):] for x in out.splitlines() if x.startswith(prefix)]
          if len(lines)!=1:
              r={'status':'unknown','operation_id':os.environ['OPERATION_ID'],'reason':'result_marker_missing','remote_exit':int(os.environ['RC']),'stderr_tail':err[-1500:],'database_writes':0,'mapping_writes':0,'supplier_calls':0,'historical_operations_replayed':False,'no_replay':True}
          else:
              r=json.loads(lines[0])
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(d/'result.json').write_bytes(raw)
          valid=(int(os.environ['RC'])==0 and r.get('status')=='completed' and r.get('operation_id')==os.environ['OPERATION_ID'] and r.get('mode')=='current_core8_supplier_component_local_consensus_read_only' and all(r.get(k)==0 for k in ['database_writes','mapping_writes','supplier_calls']) and r.get('historical_operations_replayed') is False)
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if valid else 'unknown','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'runtime_numeric_place_key_cast':True,'no_replay':True}
          if valid:receipt['stats']=r.get('stats',{});receipt['coverage']=r.get('coverage',{})
          (d/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          if valid:
              s=r['stats'];c=r['coverage'];summary=(f"MATCH #1971 CURRENT supplier-component consensus `{r['operation_id']}` completed read-only / NO-REPLAY. "
                f"ANEX **{s['anex_rows']}** / Andromeda **{s['andromeda_rows']}**; supplier edges examined/safe **{s['supplier_edges_examined']}/{s['supplier_edges_safe']}**; components **{s['components']}** = single-local **{s['components_single_local']}**, no-local **{s['components_no_local']}**, multi-local **{s['components_multi_local']}**. "
                f"Unresolved nodes **{s['unresolved_nodes_examined']}**, direct labeled-edge candidates **{s['direct_labeled_edge_candidates']}**. Prepared **{s['prepared']}** = ANEX **{s['prepared_anex']}** + Andromeda **{s['prepared_andromeda']}**, live **{s['prepared_live']}** / observation-weight **{s['prepared_live_observations']}**; raw **{s['prepared_raw']}**, target-collision demotions **{s['provider_target_collision_demotions']}**, local hard/near **{s['local_guard_hard']}/{s['local_guard_near']}**. "
                f"Coverage ANEX links {c['anex_links']}, ANEX unique {c['anex_unique_local']}, Andromeda unique {c['andromeda_unique_local']}, triple {c['all_three']}. Supplier/Tourvisor calls0; DB/mapping writes0.")
              if r.get('prepared'):
                  summary+=' Prepared targets: '+', '.join(f"{x['provider']}:{x['source_id']}→TV{x['target_local_hotel_id']} ({x['source_observation_count']} obs)" for x in r['prepared'][:20])+'.'
          else:
              summary=f"MATCH #1971 CURRENT supplier-component consensus `{os.environ['OPERATION_ID']}` UNKNOWN / NO-REPLAY after durable reservation; reason `{r.get('reason')}`, class `{r.get('error_class','unknown')}`."
          (d/'summary.md').write_text(summary+'\n');print(summary)
          if not valid:raise SystemExit(2)
          PY

      - name: Preserve immutable result
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: match-supplier-component-current-v3-${{ github.run_id }}-final
          path: ${{ env.STATE_DIR }}/
          if-no-files-found: warn
          retention-days: 90

      - name: Record MATCH result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE_DIR/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE_DIR/summary.md"
