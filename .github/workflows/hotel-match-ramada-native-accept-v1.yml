name: MATCH Ramada native acceptance v1
on:
  push:
    branches: [ops/match-ramada-native-accept-1971-20260919-v1]
    paths: [scripts/diagnostics/hotel_match_ramada_native_accept_v1.php, .github/workflows/hotel-match-ramada-native-accept-v1.yml]
permissions: {contents: read, actions: read, issues: read}
concurrency: {group: hotel-match-ramada-native-accept-1971-20260919-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-ramada-native-accept-1971-20260919-v1
  BASE_SHA: e9d7bf349bfb601dff04b7fc47088c1eff38b369
  CLAIM: '5741842511'
jobs:
  current:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact scope, saved inputs and transaction guards
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir payload result
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l)" -eq 2
          git diff --name-only "$BASE_SHA..HEAD" | grep -Fx 'scripts/diagnostics/hotel_match_ramada_native_accept_v1.php'
          git diff --name-only "$BASE_SHA..HEAD" | grep -Fx '.github/workflows/hotel-match-ramada-native-accept-v1.yml'
          printf '%s\n' '98fcb47760ea332490d793c75288121247e12859a13a670deeb2c91f7768e203  scripts/diagnostics/hotel_match_ramada_native_accept_v1.php' | sha256sum -c -
          test "$(git rev-parse HEAD:app/integrations/andromeda-hotel-resolver.php)" = d49d0eaf8d6abccefd84c0c3921edde94ef50a68
          test "$(git rev-parse HEAD:app/integrations/anex-search-mapping-registry.php)" = cc135a95d2a6e0f73ce50be2141c9b8a26fddc58
          php -l scripts/diagnostics/hotel_match_ramada_native_accept_v1.php
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >payload/claim.json
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10583849131/zip >payload/current.zip
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10582147904/zip >payload/catalog.zip
          python3 - <<'PYINPUT'
          import hashlib,pathlib,zipfile,stat
          specs=[('current.zip','72e565595fc50accbb2c948b4988166bf70116a69f99f2821f2944ddff385128','server/result.json','current.json','abbc4d63c90fb08111bddceb8b84a6f5183315246244807b5d307454d60d29ae'),('catalog.zip','323b7f97c4786475892ad3bceecae052279520011fbd7745cf3fee4f67a4a6a1','server/raw-catalog-all.json','catalog.json','45fe75aca798b5e66fc2422206fa9620cc09c0a4711c014598e696e9a4d60606')]
          for name,zh,member,out,dh in specs:
           p=pathlib.Path('payload',name);assert hashlib.sha256(p.read_bytes()).hexdigest()==zh
           with zipfile.ZipFile(p) as z:
            seen=set()
            for m in z.infolist():
             assert m.filename not in seen and not m.is_dir() and not stat.S_ISLNK(m.external_attr>>16) and not m.filename.startswith('/') and '..' not in pathlib.PurePosixPath(m.filename).parts and m.file_size<64000000
             seen.add(m.filename)
            b=z.read(member)
           assert hashlib.sha256(b).hexdigest()==dh
           with open(pathlib.Path('payload',out),'xb') as f:f.write(b)
          PYINPUT
          MATCH_OPERATION_DIR="$PWD/payload" php scripts/diagnostics/hotel_match_ramada_native_accept_v1.php --self-test
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          c=json.loads(pathlib.Path('payload/claim.json').read_bytes())
          assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and os.environ['OPERATION_ID'] in c['body']
          p=pathlib.Path('scripts/diagnostics/hotel_match_ramada_native_accept_v1.php')
          assert p.read_text().count('UPDATE andromeda_hotel_identities SET')==1 and 'INSERT INTO' not in p.read_text() and 'DELETE FROM' not in p.read_text()
          names=['andromeda-hotel-resolver.php','anex-search-mapping-registry.php']
          deps={n:hashlib.sha256(pathlib.Path('app/integrations',n).read_bytes()).hexdigest() for n in names}
          v={'operation':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'dependencies':deps,'provider_calls':0,'max_mapping_writes':1,'claim_id':int(os.environ['CLAIM']),'current_sha256':hashlib.sha256(pathlib.Path('payload/current.json').read_bytes()).hexdigest(),'catalog_sha256':hashlib.sha256(pathlib.Path('payload/catalog.json').read_bytes()).hexdigest()}
          with open('result/reservation.json','xb') as f:f.write((json.dumps(v,sort_keys=True)+'\n').encode());f.flush();os.fsync(f.fileno())
          PY
      - name: Require exact-head Security before server access
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
           q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
           xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['GITHUB_SHA']]
           if xs:
            r=max(xs,key=lambda x:x['id'])
            if r['status']=='completed':assert r['conclusion']=='success';print('SECURITY_OK',r['id']);break
           time.sleep(5)
          else:raise SystemExit('security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-ramada-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Accept one pending canonical identity with full CURRENT guards
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077
          test -n "$KEY_VALUE";test -n "$HOST_VALUE";test -n "$USER_VALUE"
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null;test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE";op=".anytoour-match/operations/$OPERATION_ID"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" result/reservation.json payload/current.json payload/catalog.json scripts/diagnostics/hotel_match_ramada_native_accept_v1.php app/integrations/andromeda-hotel-resolver.php app/integrations/anex-search-mapping-registry.php "$remote:$op/"
          set +e
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/www/anytoour.ru\" && ANYTOOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=1 -d zend.exception_ignore_args=1 -d error_log=\"\$HOME/$op/bootstrap-errors.log\" -d memory_limit=768M \"\$HOME/$op/hotel_match_ramada_native_accept_v1.php\"" >result/stdout.json 2>result/stderr.txt
          rc=$?;printf '%s\n' "$rc">result/remote-exit.txt
          ssh "${opts[@]}" "$remote" 'set -eu;cd "$HOME/'"$op"'";set -- reservation.json;for f in pre-commit.json result.json receipt.json;do test ! -f "$f" || set -- "$@" "$f";done;tar -czf - -- "$@"' >result/server-operation.tgz 2>>result/stderr.txt
          trc=$?;printf '%s\n' "$trc">result/tar-exit.txt;set -e;test "$trc" -eq 0;test "$rc" -eq 0
      - name: Verify committed row, immutable evidence and resolver readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          p=pathlib.Path('result');s=p/'server';s.mkdir(exist_ok=True);seen=set()
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
           for m in t.getmembers():
            assert m.isfile() and 0<=m.size<64000000 and m.name in {'reservation.json','result.json','receipt.json','pre-commit.json'} and m.name not in seen
            seen.add(m.name);(s/m.name).write_bytes(t.extractfile(m).read())
          assert seen=={'reservation.json','result.json','receipt.json','pre-commit.json'}
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          assert (p/'remote-exit.txt').read_text().strip()=='0' and (p/'tar-exit.txt').read_text().strip()=='0' and not (p/'stderr.txt').read_bytes()
          r=json.loads((s/'result.json').read_bytes());q=json.loads((s/'receipt.json').read_bytes());c=json.loads((s/'pre-commit.json').read_bytes())
          assert q['result_sha256']==hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert all(x['operation']==os.environ['OPERATION_ID'] and x['source_sha']==os.environ['GITHUB_SHA'] and x['provider_calls']==0 for x in [r,q,c])
          assert r['state']==q['state']=='committed_verified' and r['readback_verified'] is q['readback_verified'] is True
          assert r['mapping_writes']==q['mapping_writes']==r['database_writes']==c['updated_uncommitted']==1
          assert r['accepted_delta']==r['unique_samo_local_delta']==r['triple_delta']==1 and r['pending_delta']==-1
          row=r['row'];assert row['supplier_namespace']=='andromeda_catalog' and row['external_hotel_id']=='190031' and row['local_hotel_id']==1441 and row['decision_status']=='accepted'
          assert row['catalog_sha256']=='45fe75aca798b5e66fc2422206fa9620cc09c0a4711c014598e696e9a4d60606' and hashlib.sha256(row['evidence_json'].encode()).hexdigest()==row['evidence_sha256']==c['evidence_sha256']
          assert r['effective_resolver_target']==r['anex_effective_target']==1441 and r['bridge_preserved'] is True
          assert r['prior_identities_preserved']==c['prior_identities_preserved']>=10922 and r['prior_identity_hashes_sha256']==c['prior_identity_hashes_sha256']
          summary={k:r[k] for k in ['operation','source_sha','state','committed_at_utc','mapping_writes','accepted_delta','triple_delta','prior_identities_preserved','identity_status_counts','effective_resolver_target','anex_effective_target','bridge_preserved','readback_verified']}
          summary['result_sha256']=q['result_sha256'];summary['evidence_sha256']=row['evidence_sha256'];(p/'verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-ramada-result-${{ github.run_id }}', path: result, retention-days: 90, if-no-files-found: error}
