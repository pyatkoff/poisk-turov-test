name: INT Andromeda PRICE supplier facts
on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'app/integrations/andromeda-client.php'
      - 'tests/andromeda-price-supplier-facts-test.php'
      - '.github/workflows/int-andromeda-price-supplier-facts.yml'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.event.pull_request.head.sha }}', persist-credentials: false}
      - run: php -l app/integrations/andromeda-client.php
      - run: php tests/andromeda-price-supplier-facts-test.php
      - run: |
          ! grep -E 'curl_|https?://|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' tests/andromeda-price-supplier-facts-test.php
