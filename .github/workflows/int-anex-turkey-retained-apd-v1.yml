name: INT ANEX Turkey retained-APD acceptance v1

on:
  push:
    branches:
      - 'ops/int-anex-turkey-retained-apd-20260917-v1'
    paths:
      - '.github/workflows/int-anex-turkey-retained-apd-v1.yml'
      - 'scripts/ops/int_anex_turkey_retained_apd_v1.py'

permissions:
  contents: read

concurrency:
  group: int-anex-turkey-retained-apd-20260917-v1
  cancel-in-progress: false

env:
  BASE_SHA: 1ba0efc3ea5a129b8dc0123abcde56f3ec456009
  SOURCE_SHA: 7d21538b56a463ced185dd893361469e92911c77
  OPERATION_ID: int-anex-turkey-retained-apd-20260917-v1

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Bind exact operation and deployed source
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/int-anex-turkey-retained-apd-v1.yml'
          test "${changed[1]}" = 'scripts/ops/int_anex_turkey_retained_apd_v1.py'
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m py_compile scripts/ops/int_anex_turkey_retained_apd_v1.py
          php -l source/v2/api-anex-search3-preview.php >/dev/null
          php -l source/app/integrations/anex-anytour-offer-autosave.php >/dev/null
          grep -Fq 'anytour_anex_anytour_offer_autosave_runtime($plan, $state, $results);' source/app/integrations/anex-additional-prices-batch.php
      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/key"; else printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/key"; fi
          chmod 600 "$RUNNER_TEMP/key"; ssh-keygen -y -f "$RUNNER_TEMP/key" >/dev/null
      - name: Reserve operation and capture ANEX DB baseline
        id: baseline
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          api_sha="$(sha256sum source/v2/api-anex-search3-preview.php | awk '{print $1}')"
          helper_sha="$(sha256sum source/app/integrations/anex-anytour-offer-autosave.php | awk '{print $1}')"
          opts=(-T -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 -o LogLevel=ERROR)
          ssh "${opts[@]}" "$USER@$HOST" bash -s -- "$OPERATION_ID" "$api_sha" "$helper_sha" <<'REMOTE' > "$RUNNER_TEMP/before.json"
          set -euo pipefail
          op="$1"; api_sha="$2"; helper_sha="$3"; root="$HOME/www/anytoour.ru"; preview="$root/_preview/search3-anex-candidate"; ledger="$HOME/.anytour-ops/$op"
          test ! -e "$ledger"
          test "$(sha256sum "$preview/api-anex-search3-preview.php" | awk '{print $1}')" = "$api_sha"
          test "$(sha256sum "$preview/app/integrations/anex-anytour-offer-autosave.php" | awk '{print $1}')" = "$helper_sha"
          test -s "$root/_preview/search3-local-candidate/data/anytour-offer-snapshot-ingest-v1.php"
          mkdir -p "$HOME/.anytour-ops"; mkdir -m 700 "$ledger"; printf '%s\n' reserved > "$ledger/state"
          ROOT="$root" php -r '
            $_SERVER["DOCUMENT_ROOT"]=getenv("ROOT"); require $_SERVER["DOCUMENT_ROOT"]."/data/db-v1.php"; $db=v2_data_db();
            $q=function($sql)use($db){return (int)$db->query($sql)->fetchColumn();};
            echo json_encode(["completed_refreshes"=>$q("SELECT COUNT(*) FROM anytour_offer_refreshes WHERE provider=\"anex\" AND status=\"completed\""),"active_offers"=>$q("SELECT COUNT(*) FROM anytour_offers WHERE provider=\"anex\" AND is_active=1"),"ready_rub"=>$q("SELECT COUNT(*) FROM anytour_offers WHERE provider=\"anex\" AND is_active=1 AND final_price_ready=1 AND currency=\"RUB\""),"hotels"=>$q("SELECT COUNT(DISTINCT anytour_hotel_id) FROM anytour_offers WHERE provider=\"anex\" AND is_active=1"),"latest_scopes"=>$q("SELECT COUNT(*) FROM anytour_offer_scope_state WHERE provider=\"anex\" AND latest_complete_refresh_token IS NOT NULL")],JSON_THROW_ON_ERROR),"\n";
          ' | tee "$ledger/before.json"
          REMOTE
          echo "before=$(jq -c . "$RUNNER_TEMP/before.json")" >> "$GITHUB_OUTPUT"
      - name: Respect supplier minute window
        run: sleep 65
      - name: Run one narrow Turkey natural search, optional expand, one APD context
        run: python3 -B scripts/ops/int_anex_turkey_retained_apd_v1.py
      - name: Read ANEX DB after operation
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          BEFORE: ${{ steps.baseline.outputs.before }}
        run: |
          set -euo pipefail
          opts=(-T -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 -o LogLevel=ERROR)
          ssh "${opts[@]}" "$USER@$HOST" bash -s -- "$OPERATION_ID" <<'REMOTE' > "$RUNNER_TEMP/after.json"
          set -euo pipefail
          op="$1"; root="$HOME/www/anytoour.ru"; ledger="$HOME/.anytour-ops/$op"; test "$(cat "$ledger/state")" = reserved
          ROOT="$root" php -r '
            $_SERVER["DOCUMENT_ROOT"]=getenv("ROOT"); require $_SERVER["DOCUMENT_ROOT"]."/data/db-v1.php"; $db=v2_data_db();
            $q=function($sql)use($db){return (int)$db->query($sql)->fetchColumn();};
            echo json_encode(["completed_refreshes"=>$q("SELECT COUNT(*) FROM anytour_offer_refreshes WHERE provider=\"anex\" AND status=\"completed\""),"active_offers"=>$q("SELECT COUNT(*) FROM anytour_offers WHERE provider=\"anex\" AND is_active=1"),"ready_rub"=>$q("SELECT COUNT(*) FROM anytour_offers WHERE provider=\"anex\" AND is_active=1 AND final_price_ready=1 AND currency=\"RUB\""),"hotels"=>$q("SELECT COUNT(DISTINCT anytour_hotel_id) FROM anytour_offers WHERE provider=\"anex\" AND is_active=1"),"latest_scopes"=>$q("SELECT COUNT(*) FROM anytour_offer_scope_state WHERE provider=\"anex\" AND latest_complete_refresh_token IS NOT NULL")],JSON_THROW_ON_ERROR),"\n";
          ' | tee "$ledger/after.json"
          REMOTE
          BEFORE="$BEFORE" AFTER="$(cat "$RUNNER_TEMP/after.json")" python3 - <<'PY'
          import json, os
          b=json.loads(os.environ['BEFORE']); a=json.loads(os.environ['AFTER'])
          assert a['completed_refreshes'] > b['completed_refreshes'], (b,a)
          assert a['active_offers'] > 0 and a['ready_rub'] > 0 and a['hotels'] > 0 and a['latest_scopes'] > 0, a
          print('ANEX_TURKEY_LIVE_DB_OK',b,'->',a)
          PY
      - name: Seal completed receipt
        if: success()
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          receipt={'schema_version':1,'operation':os.environ['OPERATION_ID'],'status':'completed','source_sha':os.environ['SOURCE_SHA'],'route':'/_preview/search3-anex-candidate/','before':json.loads((root/'before.json').read_text()),'after':json.loads((root/'after.json').read_text()),'http':json.loads((root/'anex-turkey-live.json').read_text()),'lead_calls':0,'booking_calls':0,'metrika_writes':0,'mapping_writes':0,'production_entry_changes':False}
          (root/'receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
          opts=(-T -i "$RUNNER_TEMP/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 -o LogLevel=ERROR)
          cat "$RUNNER_TEMP/receipt.json" | ssh "${opts[@]}" "$USER@$HOST" "set -eu; ledger=\"\$HOME/.anytour-ops/$OPERATION_ID\"; test \"\$(cat \"\$ledger/state\")\" = reserved; cat > \"\$ledger/receipt.json\"; chmod 600 \"\$ledger/receipt.json\"; printf '%s\\n' completed > \"\$ledger/state\""
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int-anex-turkey-retained-apd-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/before.json
            ${{ runner.temp }}/after.json
            ${{ runner.temp }}/anex-turkey-live.json
            ${{ runner.temp }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/key"
