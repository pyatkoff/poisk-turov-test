name: MATCH new28 guarded SAMO append v1
on:
  pull_request:
    types: [opened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_new28_samo_accept_v1.php
      - .github/workflows/hotel-match-new28-samo-accept-v1.yml
permissions: {contents: read, actions: read, issues: read}
concurrency:
  group: hotel-match-new28-samo-accept-1971-20260920-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-new28-samo-accept-1971-20260920-v1
  BASE_SHA: f70c74fc5f3020f50c6493c31db140c4978c0265
  SOURCE_SHA: '${{ github.event.pull_request.head.sha }}'
  CLAIM: '5750803631'
  INPUT_SHA: d84a73ac32edcd8a3390b8e643f01ed140d263ca11ceba67e97874b85089c936
jobs:
  accept:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ops/match-new28-samo-accept-1971-20260920-v1' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ env.SOURCE_SHA }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source and unchanged canonical resolvers
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;umask 077;mkdir -p inputs payload/input payload/source/scripts/diagnostics payload/source/app/integrations result
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          python3 - <<'PY'
          import os,subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA']+'..HEAD'],text=True).splitlines())
          assert actual=={'scripts/diagnostics/hotel_match_new28_samo_accept_v1.php','.github/workflows/hotel-match-new28-samo-accept-v1.yml'}
          pins={'app/integrations/anex-search-mapping-registry.php':'cc135a95d2a6e0f73ce50be2141c9b8a26fddc58','app/integrations/andromeda-hotel-resolver.php':'d49d0eaf8d6abccefd84c0c3921edde94ef50a68'}
          for p,s in pins.items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==s
          PY
          php -l scripts/diagnostics/hotel_match_new28_samo_accept_v1.php
          php scripts/diagnostics/hotel_match_new28_samo_accept_v1.php --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" > inputs/claim.json
          python3 - <<'PY'
          import json,os
          c=json.load(open('inputs/claim.json'));assert c['user']['id']==226193297 and c['author_association']=='OWNER' and c['issue_url'].endswith('/issues/2530') and c['created_at']==c['updated_at']
          for s in (os.environ['OPERATION_ID'],os.environ['BASE_SHA'],os.environ['INPUT_SHA'],'Maximum28 inserts','Supplier/Tourvisor/SAMO/Andromeda/direct-ANEX calls0','only absent canonical andromeda_catalog source rows','pre-COMMIT checkpoint'):assert s in c['body'],s
          PY
          cp scripts/diagnostics/hotel_match_new28_samo_accept_v1.php payload/source/scripts/diagnostics/
          cp app/integrations/anex-search-mapping-registry.php app/integrations/andromeda-hotel-resolver.php payload/source/app/integrations/
      - name: Verify terminal acquisition and retained country catalogs
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10607703828/zip > inputs/acquisition.zip
          gh api repos/pyatkoff/poisk-turov-test/actions/artifacts/10588338849/zip > inputs/retained.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile,os,re
          p=pathlib.Path('payload/input');a=pathlib.Path('inputs/acquisition.zip');b=pathlib.Path('inputs/retained.zip')
          assert hashlib.sha256(a.read_bytes()).hexdigest()=='f478b06fbbebfa28f04feb54861976b05323829c68e78906e5472c38d6705a3c'
          assert hashlib.sha256(b.read_bytes()).hexdigest()=='f360237113f3c65003fc564efab5749f2ecc66fed41881a3043b526e7b3db5fc'
          with zipfile.ZipFile(a) as z:
              raw=z.read('server/result.json');assert hashlib.sha256(raw).hexdigest()==os.environ['INPUT_SHA']
              assert json.loads(z.read('server/receipt.json'))['result_sha256']==os.environ['INPUT_SHA']
              seen=set()
              for i in z.infolist():
                  if not i.filename.startswith('server/'):continue
                  n=i.filename[7:];assert re.fullmatch(r'[a-z0-9.-]+\.json',n) and n not in seen and i.file_size<64000000;seen.add(n);(p/n).write_bytes(z.read(i))
          with zipfile.ZipFile(b) as z:
              raw=z.read('server/raw-catalog-23adc36e99d0.json');assert hashlib.sha256(raw).hexdigest()=='8409bc681cb9976c59956adc91ffd10db87182e0f21d97cc170e65a5cae5f8ec';(p/'raw-catalog-23adc36e99d0.json').write_bytes(raw)
          calls=sorted(p.glob('call-*-reservation.json'));assert len(calls)==38
          for i,f in enumerate(calls,1):
              r=json.loads(f.read_bytes());q=json.loads(f.with_name(f.name.replace('-reservation','-receipt')).read_bytes());assert r['seq']==q['seq']==i and q['status']==200
              if r['action']!='login':
                  h=json.loads((p/f.name.replace('call-','raw-http-').replace('-reservation','')).read_bytes());assert h['status']==200 and hashlib.sha256(h['body'].encode()).hexdigest()==q['body_sha256']
          PY
          php scripts/diagnostics/hotel_match_new28_samo_accept_v1.php --inspect payload/input > result/offline-proof-check.json
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['SOURCE_SHA']+'&per_page=100'
          for _ in range(72):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[r for r in runs if r['name']=='Security guard' and r['head_sha']==os.environ['SOURCE_SHA']]
              if xs:
                  r=max(xs,key=lambda x:x['id'])
                  if r['status']=='completed':assert r['conclusion']=='success';print('SECURITY_OK',r['id']);break
              time.sleep(5)
          else:raise SystemExit('security_not_available')
          PY
      - name: Seal durable reservation before DB access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('payload');digests={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in p.rglob('*') if x.is_file()}
          r={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'base_sha':os.environ['BASE_SHA'],'claim_id':int(os.environ['CLAIM']),'state':'reserved_before_db_access','input_sha256':os.environ['INPUT_SHA'],'file_sha256':digests,'mapping_write_cap':28,'provider_calls':0,'tourvisor_calls':0,'anex_mapping_writes':0,'no_replay':True}
          raw=(json.dumps(r,sort_keys=True)+'\n').encode()
          with (p/'reservation.json').open('xb') as f:f.write(raw);f.flush();os.fsync(f.fileno())
          pathlib.Path('result/reservation.json').write_bytes(raw);digests['reservation.json']=hashlib.sha256(raw).hexdigest();(p/'SHA256SUMS').write_text(''.join(v+'  '+k+'\n' for k,v in sorted(digests.items())))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-new28-accept-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Execute CURRENT guarded append exactly once
        env:
          KEY_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER_VALUE: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077;test -n "$KEY_VALUE";test -n "$HOST_VALUE";test -n "$USER_VALUE";key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known_hosts";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY_VALUE"|tr -d '\r'>"$key";else printf '%s' "$KEY_VALUE"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST_VALUE">"$known" 2>/dev/null;test -s "$known"
          remote="$USER_VALUE@$HOST_VALUE";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytoour-match/operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\""
          scp "${opts[@]}" -r payload/source payload/input payload/reservation.json payload/SHA256SUMS "$remote:$op/"
          set +e
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";sha256sum -c SHA256SUMS >/dev/null;cd \"\$HOME/www/anytoour.ru\";MATCH_OPERATION_ID='$OPERATION_ID' MATCH_OPERATION_DIR=\"\$HOME/$op\" MATCH_SOURCE_SHA='$SOURCE_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d zend.exception_ignore_args=1 -d memory_limit=768M \"\$HOME/$op/source/scripts/diagnostics/hotel_match_new28_samo_accept_v1.php\"" > result/remote.stdout 2> result/remote.stderr
          rc=$?
          ssh "${opts[@]}" "$remote" "set -e;cd \"\$HOME/$op\";tar -czf - -- *.json" > result/server-operation.tgz 2>>result/remote.stderr
          trc=$?;set -e;printf '{"remote":%s,"tar":%s}\n' "$rc" "$trc">result/exit-codes.json;test "$trc" -eq 0
      - name: Verify immutable plan and post-COMMIT per-row readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,re
          p=pathlib.Path('result');s=p/'server';s.mkdir(exist_ok=True)
          with tarfile.open(p/'server-operation.tgz','r:gz') as t:
              seen=set()
              for m in t.getmembers():
                  assert m.isfile() and m.size<=64000000 and re.fullmatch(r'[a-z0-9.-]+\.json',m.name) and m.name not in seen;seen.add(m.name);(s/m.name).write_bytes(t.extractfile(m).read())
          assert (p/'reservation.json').read_bytes()==(s/'reservation.json').read_bytes()
          r=json.loads((s/'result.json').read_bytes());q=json.loads((s/'receipt.json').read_bytes());digest=hashlib.sha256((s/'result.json').read_bytes()).hexdigest()
          assert q['result_sha256']==digest and r['source_sha']==q['source_sha']==os.environ['SOURCE_SHA'] and r['operation_id']==q['operation_id']==os.environ['OPERATION_ID']
          assert r['provider_calls']==r['tourvisor_calls']==r['samo_calls']==r['direct_anex_calls']==r['anex_mapping_writes']==0
          summary={'state':r['state'],'mapping_writes':r['mapping_writes'],'reason':r.get('reason'),'skipped_count':len(r.get('skipped',[])),'result_sha256':digest};(p/'verified-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary,ensure_ascii=False))
          assert r['state']==q['state'] and r['state'] in ['committed_verified','completed_no_safe_delta'] and r['readback_verified'] is q['readback_verified'] is True
          plan=json.loads((s/'plan.json').read_bytes());assert r['plan_sha256']==hashlib.sha256((s/'plan.json').read_bytes()).hexdigest()
          assert r['mapping_writes']==r['database_writes']==q['mapping_writes']==q['database_writes']==len(plan['safe_writes'])<=28
          if r['mapping_writes']:
              assert r['state']=='committed_verified';pre=json.loads((s/'pre-commit.json').read_bytes());read=json.loads((s/'readback.json').read_bytes())
              assert hashlib.sha256((s/'pre-commit.json').read_bytes()).hexdigest()==r['precommit_sha256'] and pre['plan_sha256']==r['plan_sha256'] and pre['writes_uncommitted']==r['mapping_writes']
              assert read['verified_rows']==r['written'] and len(r['written'])==r['mapping_writes']
              for w in r['written']:
                  e=plan['safe_writes'][w['samo_hotel_id']];assert e['local_hotel_id']==w['local_hotel_id'] and e['native_ids']==w['native_ids'] and e['evidence_sha256']==w['evidence_sha256']==hashlib.sha256(e['evidence_json'].encode()).hexdigest()
          assert json.loads((p/'exit-codes.json').read_bytes())=={'remote':0,'tar':0}
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-new28-accept-result-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
