name: MATCH direct ANEX sellability review
run-name: MATCH direct ANEX sellability review #1971
on:
  push:
    branches: ['feat/match-anex-sellability-20260911']
    paths:
      - '.github/match-anex-sellability-review-1971-v1.arm'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: match-anex-sellability-review-1971-v1
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-anex-sellability-review-1971-20260911-v1
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify evidence-only MATCH source
        run: |
          set -euo pipefail
          test "$(cat .github/match-anex-sellability-review-1971-v1.arm)" = "$OPERATION_ID"
          php -l scripts/diagnostics/hotel_match_anex_sellability_review.php
          python3 - <<'PYTHON'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_anex_sellability_review.php').read_text(encoding='utf-8')
          assert 'hotel-match-anex-sellability-review-1971-20260911-v1' in s
          assert 'START TRANSACTION READ ONLY' in s
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s and "'bookings'=>0" in s
          assert 'array_chunk($hotelIds,30)' in s
          assert "new AnyTourAnexSearch" in s and "'hotel_ids'=>$chunk" in s
          for bad in ('INSERT INTO','UPDATE ','DELETE FROM','REPLACE INTO'):
              assert bad.lower() not in s.lower(), bad
          print('sellability evidence-only scope verified')
          PYTHON
      - name: Reserve immutable supplier evidence operation
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"; export STATE
          python3 - <<'PYTHON'
          import json,os
          from pathlib import Path
          state=Path(os.environ['STATE'])
          reservation={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_supplier','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'mode':'direct_anex_sellability_evidence_only','database_writes':0,'mapping_writes':0,'bookings':0,'historical_operations_replayed':False,'no_replay':True}
          (state/'reservation.json').write_text(json.dumps(reservation,sort_keys=True)+'\n',encoding='utf-8')
          PYTHON
      - name: Preserve reservation before supplier access
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-sellability-review-1971-20260911-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-sellability-review-1971-20260911-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Run bounded direct ANEX sellability evidence pass
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib,json,os,shlex,subprocess,tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          source=Path('scripts/diagnostics/hotel_match_anex_sellability_review.php').read_text(encoding='utf-8')
          if source.startswith('<?php'): source=source[len('<?php'):]
          source=source.replace('declare(strict_types=1);','',1)
          wrapper=r'''
          $root=realpath(getcwd()); if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('HMAS_ROOT');
          foreach([$root.'/v2/config.php',$root.'/config.php'] as $cfg){$real=realpath($cfg);if($real&&is_file($real)&&strpos($real,$root.DIRECTORY_SEPARATOR)===0){require_once $real;break;}}
          $dbHelper=false;foreach([$root.'/data/db-v1.php',$root.'/v2/data/db-v1.php'] as $p){$real=realpath($p);if($real&&is_file($real)&&strpos($real,$root.DIRECTORY_SEPARATOR)===0){$dbHelper=$real;break;}}
          if(!$dbHelper)throw new RuntimeException('HMAS_DB_HELPER'); require_once $dbHelper;
          require_once $root.'/app/integrations/anex-search.php';
          $token=trim((string)getenv('ANEX_API_TOKEN')); if($token===''&&defined('ANEX_API_TOKEN'))$token=trim((string)ANEX_API_TOKEN);
          try{$db=v2_data_db();$result=hmas_review($db,$token,HMAS_OPERATION);echo json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES),"\n";}
          catch(Throwable $e){$m=$e->getMessage();$reason=is_string($m)&&preg_match('/\A[A-Z0-9_]{1,80}\z/D',$m)?$m:'HMAS_REMOTE_ERROR';echo json_encode(['status'=>'failed','operation_id'=>HMAS_OPERATION,'reason'=>$reason,'database_writes'=>0,'mapping_writes'=>0,'bookings'=>0],JSON_UNESCAPED_SLASHES),"\n";exit(2);}
          '''
          code=source+'\n'+wrapper
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER')
          host=os.environ[req[1]].strip();user=os.environ[req[2]].strip();keytext=os.environ[req[0]].strip()
          if not host or not user or not keytext: raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(prefix='match-anex-sellability-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key';key.write_text(keytext.rstrip()+'\n');key.chmod(0o600);known=Path(tmp)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=3','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
              try:p=subprocess.run(cmd,text=True,capture_output=True,timeout=1050,env=clean)
              except subprocess.TimeoutExpired:
                  (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'ssh_supplier_timeout','database_writes':0,'mapping_writes':0,'bookings':0},sort_keys=True)+'\n');raise
          try:r=json.loads(p.stdout)
          except Exception:
              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'live_output_unparseable','exit_code':p.returncode,'database_writes':0,'mapping_writes':0,'bookings':0},sort_keys=True)+'\n');raise RuntimeError('live_output_unparseable')
          raw=(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode();(state/'result.json').write_bytes(raw)
          stats=r.get('stats') or {}
          calls=stats.get('supplier_calls')
          if p.returncode!=0 or r.get('status')!='completed' or r.get('operation_id')!=os.environ['OPERATION_ID'] or r.get('database_writes')!=0 or r.get('mapping_writes')!=0 or r.get('bookings')!=0 or r.get('search_continuations')!=0 or r.get('historical_operations_replayed') is not False or not isinstance(calls,int) or calls<0 or calls>200:
              (state/'blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'status':'failed','reason':'sellability_review_not_completed','exit_code':p.returncode,'result_status':r.get('status'),'database_writes':r.get('database_writes'),'mapping_writes':r.get('mapping_writes'),'bookings':r.get('bookings'),'supplier_calls':calls},sort_keys=True)+'\n');raise RuntimeError('sellability_review_not_completed')
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_evidence_only','run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw).hexdigest(),'database_writes':0,'mapping_writes':0,'bookings':0,'supplier_calls':calls,'historical_operations_replayed':False,'no_replay':True,'stats':stats}
          (state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n',encoding='utf-8')
          s=stats
          summary=(f"MATCH #1971 direct ANEX sellability evidence `{r['operation_id']}` completed **evidence-only / NO-REPLAY**. CURRENT unresolved ANEX queue **{s['queue']}** (live **{s['live_queue']}**), countries **{s['countries']}**; supplier-advertised one-day slices **{s['date_slices']}**, HOTELS<=30 price batches **{s['price_batches']}**, supplier calls **{s['supplier_calls']}**. Seen with a real offer on probed dates **{s['sold_on_probe']}** (live **{s['sold_live_on_probe']}**); not seen on those bounded dates **{s['not_seen_on_probed_dates']}** and explicitly **not** classified as globally unsellable. Batch errors **{s['batch_errors']}**. DB/mapping writes **0**, bookings **0**, continuations **0**.")
          (state/'summary.md').write_text(summary+'\n',encoding='utf-8');print(json.dumps({'stats':s},ensure_ascii=False,sort_keys=True))
          PYTHON
      - name: Preserve result and receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-anex-sellability-review-1971-20260911-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-sellability-review-1971-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Record MATCH evidence result
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          printf ' Artifact `%s`.\n' "$ARTIFACT_ID" >> "$STATE/summary.md"
          gh issue comment 1971 --repo "$GITHUB_REPOSITORY" --body-file "$STATE/summary.md"
