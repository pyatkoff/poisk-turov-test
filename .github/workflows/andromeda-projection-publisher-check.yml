name: Andromeda projection publisher offline
on:
  pull_request:
    paths:
      - 'scripts/diagnostics/andromeda_projection_publish.py'
      - 'tests/andromeda_projection_publish_test.py'
      - '.github/workflows/andromeda-projection-publisher-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: change
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 95fa11f5a1cb7e18c905c9760a1eae7f2c0ee7aa
          path: previous
      - run: python3 -B change/tests/andromeda_projection_publish_test.py previous
