name: Search3 hotel-card runtime sync once

on:
  push:
    branches:
      - ux/search3-hotel-card-summary-20260912
    paths:
      - '.github/workflows/search3-hotel-card-runtime-sync-once.yml'

permissions:
  contents: write

jobs:
  sync-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/search3-hotel-card-summary-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Search3 build tools
        run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - name: Generate canonical shared runtime
        run: node scripts/build/search3-js/shared-runtime.cjs --write
      - name: Require runtime-only generated diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "v2/search3-shared-runtime.json"
          node scripts/build/search3-js/shared-runtime.cjs --check
      - name: Commit canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- v2/search3-shared-runtime.json
          git commit -m "SEARCH: sync hotel-card shared runtime"
          git push origin HEAD:ux/search3-hotel-card-summary-20260912
