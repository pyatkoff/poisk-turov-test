name: Publish checked Search3 site preview

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact successful source SHA (40 lowercase hex)
        required: true
        type: string
      release_sha:
        description: Current release/search3-production-ready-v1 SHA
        required: true
        type: string
      build_run:
        description: Successful whole-site source build run ID
        required: true
        type: string
      artifact_id:
        description: Exact retained whole-site artifact ID
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-search3-whole-site-preview.yml'
      - 'scripts/deploy/search3_preview_publish.py'
      - 'scripts/deploy/search3_preview_remote.py'
      - 'tests/search3_preview_publish_test.py'

permissions:
  contents: read

jobs:
  preview-publisher-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Offline authorization, archive and transaction contracts
        run: |
          python3 -m py_compile scripts/deploy/search3_preview_publish.py scripts/deploy/search3_preview_remote.py
          python3 tests/search3_preview_publish_test.py -v

  publish-preview:
    if: >-
      github.repository == 'pyatkoff/poisk-turov-test' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'pyatkoff' &&
      github.triggering_actor == 'pyatkoff' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 996 &&
      !github.event.issue.pull_request && github.event.comment.user.id == 226193297 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/publish-search3-preview ')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
    concurrency:
      group: deploy-anytoour-production
      cancel-in-progress: false
    steps:
      - name: Trusted main control code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck offline publisher contracts
        run: python3 tests/search3_preview_publish_test.py
      - name: Publish exact artifact only to the isolated preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          PREVIEW_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          PREVIEW_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        run: python3 scripts/deploy/search3_preview_publish.py
      - name: Retain publication receipt (no secrets or source payload)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search3-site-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/search3-preview-publish/evidence.json
          if-no-files-found: warn
          retention-days: 30
