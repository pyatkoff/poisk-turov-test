name: MATCH SAMO live30 original hotelKey calibration v1

on:
  pull_request:
    types: [opened, synchronize]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - '.github/workflows/hotel-match-samo-live30-original-hotelkey-calibration-v1.yml'

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: hotel-match-samo-live30-original-hotelkey-calibration-1971-20260924-v1
  cancel-in-progress: false

env:
  OP: hotel-match-samo-live30-original-hotelkey-calibration-1971-20260924-v1
  SOURCE_OP: hotel-match-samo-live30-keyshape-canary-1971-20260924-v2
  SOURCE_RESULT_SHA256: 99236dd288d19e84a154ed7a56a515f03fc03cc2a4390e88ca2723033c14a6ff
  BASE: a237c6d5992a2d5fa677f0636084749a45e6ee7e
  CLAIM: '5808233230'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authority, exact scope and Security
        env:
          GH_TOKEN: '${{ github.token }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p input terminal
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')" = ".github/workflows/hotel-match-samo-live30-original-hotelkey-calibration-v1.yml "
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" > input/claim.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json')); b=c['body']
          assert c['user']['id']==226193297 and c['author_association']=='OWNER'
          for x in [os.environ['OP'],os.environ['SOURCE_OP'],'DB READ ONLY','Andromeda/Tourvisor/direct-ANEX HTTP0','database writes0','mapping writes0','safe_to_write_now=false']:
              assert x in b,x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(100):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda y:y['id'])
                  if x['status']=='completed': assert x['conclusion']=='success',x['conclusion']; break
              time.sleep(3)
          else: raise SystemExit('security_not_green')
          PY

      - name: Build supplier-free calibration
        run: |
          cat > input/audit.php <<'PHP'
          <?php
          declare(strict_types=1);
          const OP='hotel-match-samo-live30-original-hotelkey-calibration-1971-20260924-v1';
          const SRC='hotel-match-samo-live30-keyshape-canary-1971-20260924-v2';
          const SRC_SHA='99236dd288d19e84a154ed7a56a515f03fc03cc2a4390e88ca2723033c14a6ff';
          function need(bool $v,string $m):void{if(!$v)throw new RuntimeException($m);}
          function j(mixed $v):string{return json_encode($v,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);}
          function loadj(string $p):array{$v=json_decode((string)file_get_contents($p),true,256,JSON_THROW_ON_ERROR);need(is_array($v),'json_shape');return $v;}
          function savej(string $p,array $v):string{$raw=j($v)."\n";$f=@fopen($p,'x+b');need($f!==false,'exclusive_create');try{need(fwrite($f,$raw)===strlen($raw)&&fflush($f),'durable_write');if(function_exists('fsync'))need(fsync($f),'durable_sync');}finally{fclose($f);}return hash('sha256',$raw);}
          function idv(mixed $v):?string{$s=trim((string)$v);return preg_match('/^[1-9][0-9]{0,21}$/D',$s)===1?$s:null;}
          function bump(array &$a,string $k,int $n=1):void{$a[$k]=($a[$k]??0)+$n;}
          $ops=(string)getenv('MATCH_OPERATIONS_ROOT');$dir=(string)getenv('MATCH_OPERATION_DIR');$site=(string)getenv('ANYTOUR_ROOT');$sha=(string)getenv('MATCH_SOURCE_SHA');
          need(is_dir($ops)&&is_dir($dir)&&basename($dir)===OP&&is_dir($site)&&basename($site)==='anytoour.ru'&&preg_match('/^[a-f0-9]{40}$/D',$sha)===1,'runtime_scope');
          $src=$ops.'/'.SRC;foreach(['result.json','receipt.json','response-private.json'] as $f)need(is_file($src.'/'.$f)&&!is_link($src.'/'.$f),'source_'.$f);$rr=(string)file_get_contents($src.'/result.json');need(hash('sha256',$rr)===SRC_SHA,'source_hash');$r=json_decode($rr,true,128,JSON_THROW_ON_ERROR);$q=loadj($src.'/receipt.json');need(($r['state']??'')==='completed_read_only_keyshape_canary'&&($q['result_sha256']??'')===SRC_SHA&&($q['no_replay']??false)===true,'source_terminal');
          $reply=loadj($src.'/response-private.json');$rows=$reply['PRICES']??[];need(is_array($rows)&&count($rows)===50,'prices_shape');
          require_once $site.(is_file($site.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');
          try{
            $st=$db->query("SELECT supplier_namespace,external_hotel_id,local_hotel_id FROM andromeda_hotel_identities WHERE decision_status='accepted' AND local_hotel_id IS NOT NULL AND supplier_namespace IN ('andromeda_catalog','operator_115') ORDER BY supplier_namespace,external_hotel_id,local_hotel_id");
            $cat=[];$opByExt=[];$opByLocal=[];foreach($st->fetchAll(PDO::FETCH_ASSOC)?:[] as $x){$ns=(string)$x['supplier_namespace'];$ext=idv($x['external_hotel_id']);$local=(int)$x['local_hotel_id'];if($ext===null||$local<=0)continue;if($ns==='andromeda_catalog')$cat[$ext][$local]=true;elseif($ns==='operator_115'){$opByExt[$ext][$local]=true;$opByLocal[$local][$ext]=true;}}
            $counts=['rows_total'=>0,'operator_scope_115'=>0,'key_shape_valid'=>0,'catalog_exact_one'=>0,'catalog_unresolved'=>0,'catalog_collision'=>0,'known_exact'=>0,'known_exact_target_multi'=>0,'source_conflict'=>0,'target_conflict'=>0,'source_and_target_conflict'=>0,'candidate_preliminary'=>0];$private=[];
            foreach($rows as $x){if(!is_array($x))continue;$counts['rows_total']++;if((int)($x['operatorKey']??0)!==115)continue;$counts['operator_scope_115']++;$catId=idv($x['hotelKey']??null);$o=is_array($x['original']??null)?$x['original']:[];$native=idv($o['hotelKey']??null);if($catId===null||$native===null)continue;$counts['key_shape_valid']++;$locals=array_keys($cat[$catId]??[]);if(count($locals)===0){$counts['catalog_unresolved']++;continue;}if(count($locals)!==1){$counts['catalog_collision']++;continue;}$counts['catalog_exact_one']++;$local=(int)$locals[0];$srcLocals=array_keys($opByExt[$native]??[]);$targetExts=array_keys($opByLocal[$local]??[]);$srcSame=in_array($local,array_map('intval',$srcLocals),true);$targetSame=in_array($native,array_map('strval',$targetExts),true);$srcOther=(bool)array_filter(array_map('intval',$srcLocals),fn($v)=>$v!==$local);$targetOther=(bool)array_filter(array_map('strval',$targetExts),fn($v)=>$v!==$native);
              if($srcSame&&$targetSame){$counts['known_exact']++;if($targetOther)$counts['known_exact_target_multi']++;continue;}
              if($srcOther&&$targetOther){$counts['source_and_target_conflict']++;continue;}if($srcOther){$counts['source_conflict']++;continue;}if($targetOther){$counts['target_conflict']++;continue;}
              $counts['candidate_preliminary']++;$private[]=['catalog_external_id'=>$catId,'local_hotel_id'=>$local,'operator_namespace'=>'operator_115','operator_external_id'=>$native,'is_operator_hotel_key'=>(int)($x['isOperatorHotelKey']??-1),'top_operator_key'=>115,'source_response_sha256'=>hash_file('sha256',$src.'/response-private.json')];
            }
            $db->rollBack();
            usort($private,fn($a,$b)=>[$a['local_hotel_id'],$a['operator_external_id']]<=>[$b['local_hotel_id'],$b['operator_external_id']]);$srcTargets=[];$targetSources=[];foreach($private as $p){$srcTargets[$p['operator_external_id']][$p['local_hotel_id']]=true;$targetSources[$p['local_hotel_id']][$p['operator_external_id']]=true;}$unique=[];$sourceCollision=0;$targetCollision=0;foreach($private as $p){$sc=count($srcTargets[$p['operator_external_id']]??[])!==1;$tc=count($targetSources[$p['local_hotel_id']]??[])!==1;if($sc)$sourceCollision++;if($tc)$targetCollision++;if(!$sc&&!$tc)$unique[]=$p;}$counts['candidate_source_collision_rows']=$sourceCollision;$counts['candidate_target_collision_rows']=$targetCollision;$counts['candidate_unique_rows']=count($unique);
            $privateHash=savej($dir.'/candidate-private.json',['operation'=>OP,'state'=>'private_candidates_not_writer_ready','source_operation'=>SRC,'source_result_sha256'=>SRC_SHA,'rows'=>$unique,'safe_to_write_now'=>false]);
            $out=['operation'=>OP,'state'=>'completed_read_only_original_hotelkey_calibration','source_sha'=>$sha,'source_operation'=>SRC,'source_result_sha256'=>SRC_SHA,'source_response_sha256'=>hash_file('sha256',$src.'/response-private.json'),'counts'=>$counts,'private_candidate_manifest_sha256'=>$privateHash,'private_candidate_count'=>count($unique),'provider_http_calls'=>0,'andromeda_calls'=>0,'tourvisor_calls'=>0,'direct_anex_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'safe_to_write_now'=>false];$h=savej($dir.'/result.json',$out);savej($dir.'/receipt.json',['operation'=>OP,'state'=>$out['state'],'result_sha256'=>$h,'readback_verified'=>hash_file('sha256',$dir.'/result.json')===$h,'provider_accessed'=>false,'provider_http_calls'=>0,'database_writes'=>0,'mapping_writes'=>0,'no_replay'=>true]);echo j($out)."\n";
          }catch(Throwable $e){if($db->inTransaction())$db->rollBack();throw $e;}
          PHP
          php -l input/audit.php
          ! grep -E 'curl|wget|AndromedaClient|Transport|INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' input/audit.php

      - name: Execute CURRENT calibration
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
          HEAD: '${{ github.event.pull_request.head.sha }}'
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$key"; else printf '%s' "$KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null; ssh-keyscan -T15 -t ed25519 "$HOST" > "$known" 2>/dev/null
          remote="$USER@$HOST"; opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15); op=".anytoour-match/operations/$OP"
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op\""
          scp "${opts[@]}" input/audit.php "$remote:$op/"
          ssh "${opts[@]}" "$remote" "set -eu;MATCH_OPERATIONS_ROOT=\"\$HOME/.anytoour-match/operations\" MATCH_OPERATION_DIR=\"\$HOME/$op\" ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$op/audit.php\"" > terminal/remote.stdout 2> terminal/remote.stderr
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$op\";tar -czf - result.json receipt.json" > terminal/server.tgz
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
              for m in t.getmembers():
                  if m.isfile(): pathlib.Path('terminal',m.name).write_bytes(t.extractfile(m).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'));assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest();assert r['state']=='completed_read_only_original_hotelkey_calibration'
          for k in ['provider_http_calls','andromeda_calls','tourvisor_calls','direct_anex_calls','database_writes','mapping_writes']: assert r[k]==0,(k,r[k])
          assert r['safe_to_write_now'] is False;print(json.dumps(r,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'match-samo-live30-original-hotelkey-calibration-v1-${{ github.run_id }}'
          path: terminal/
          retention-days: 90
          if-no-files-found: error
