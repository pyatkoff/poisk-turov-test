name: MATCH Andromeda all ID bridge probe
on:
  push:
    branches: ['match/andromeda-all-id-bridge-1971-20260914']
    paths:
      - 'scripts/diagnostics/hotel_match_andromeda_all_id_bridge.php'
      - '.github/workflows/hotel-match-andromeda-all-id-bridge.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anytour-match-andromeda-all-id-bridge-1971-v2
  cancel-in-progress: false
env:
  OPERATION_ID: hotel-match-andromeda-all-id-bridge-1971-20260914-v2
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Offline scope checks
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_andromeda_all_id_bridge.php
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' scripts/diagnostics/hotel_match_andromeda_all_id_bridge.php
          ! grep -Eiq '(price\(|broninit|booking|lead|tourvisor)' scripts/diagnostics/hotel_match_andromeda_all_id_bridge.php
      - name: Reserve immutable operation before supplier access
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/hotel-match-andromeda-all-id-bridge"
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo REPLAY_REFUSED; exit 2; }
          mkdir -m 700 "$OUT"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['OUT'])/'reservation.json'
          value={'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_supplier_access','supplier_calls_max':2,'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'no_replay':True}
          with p.open('x') as f: json.dump(value,f,sort_keys=True,indent=2); f.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-andromeda-all-id-bridge-reservation-v2
          path: ${{ runner.temp }}/hotel-match-andromeda-all-id-bridge/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Fresh documented all probe
        env:
          ANDROMEDA_USERNAME: ${{ secrets.ANDROMEDA_USERNAME }}
          ANDROMEDA_PASSWORD: ${{ secrets.ANDROMEDA_PASSWORD }}
        run: |
          export OUT="$RUNNER_TEMP/hotel-match-andromeda-all-id-bridge"
          php scripts/diagnostics/hotel_match_andromeda_all_id_bridge.php --execute "$OUT"
      - name: Verify durable readback
        if: always()
        run: |
          export OUT="$RUNNER_TEMP/hotel-match-andromeda-all-id-bridge"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT'])
          result=json.loads((p/'result.json').read_text()) if (p/'result.json').exists() else {}
          receipt=json.loads((p/'receipt.json').read_text()) if (p/'receipt.json').exists() else {}
          reservation=json.loads((p/'reservation.json').read_text())
          digest=hashlib.sha256((p/'result.json').read_bytes()).hexdigest() if (p/'result.json').exists() else None
          ok=(reservation.get('state')=='reserved_before_supplier_access' and reservation.get('operation_id')==os.environ['OPERATION_ID'] and receipt.get('result_sha256')==digest and receipt.get('readback_verified') is True and all(receipt.get(k)==0 for k in ('database_writes','mapping_writes','tourvisor_calls')))
          gate={'operation_id':os.environ['OPERATION_ID'],'verified':ok,'state':result.get('state'),'hotel_count':result.get('hotel_count'),'mapping_like_fields':result.get('mapping_like_fields'),'mapping_like_row_count':result.get('mapping_like_row_count'),'supplier_calls':result.get('supplier_calls'),'result_sha256':digest,'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(gate,sort_keys=True,indent=2)+'\n')
          print(json.dumps(gate,sort_keys=True))
          if not ok: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-andromeda-all-id-bridge-evidence-v2
          path: ${{ runner.temp }}/hotel-match-andromeda-all-id-bridge/
          if-no-files-found: error
          retention-days: 90
