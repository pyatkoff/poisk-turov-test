name: Three-provider room and placement
on:
  pull_request:
    paths:
      - 'app/integrations/three-provider-room-placement.php'
      - 'tests/three-provider-room-placement-test.php'
      - '.github/workflows/three-provider-room-placement-check.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate room/placement labels without network
        run: |
          php -l app/integrations/three-provider-room-placement.php
          php -l tests/three-provider-room-placement-test.php
          php -d allow_url_fopen=0 tests/three-provider-room-placement-test.php
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/integrations/three-provider-room-placement.php').read_text()
          assert "'room_placement_separate' => true" in src
          assert "'cross_provider_equivalence_verified' => false" in src
          assert "'package_identity_verified' => false" in src
          for forbidden in ('curl_', 'PDO', 'supplier_offer_id', 'hotel_id', 'bron', 'booking'):
              assert forbidden not in src
          print('Room/placement static boundary: PASS')
          PY

