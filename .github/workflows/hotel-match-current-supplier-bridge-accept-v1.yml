name: MATCH CURRENT supplier bridge accept v1
on:
  push:
    branches: [ops/match-current-supplier-bridge-accept-1971-20260913-v1]
    paths: [.github/match-current-supplier-bridge-accept-1971-20260913-v1.arm]
permissions: {contents: read}
concurrency: {group: match-current-supplier-bridge-accept-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-current-supplier-bridge-accept-1971-20260913-v1
jobs:
  accept:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate immutable writer
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/diagnostics/hotel_full_catalog_reconcile.php)" = 'f551c9dd4c9365799a8728f29a9881dd3e3256d7'
          test "$(git hash-object scripts/diagnostics/hotel_match_current_supplier_bridge.php)" = 'ca393057939aa427b92d43a42cdcd83cfad8df48'
          test "$(git hash-object scripts/diagnostics/hotel_match_current_supplier_bridge_accept.php)" = '85cf1f58f21476b519c817c7902dfacab6da97b0'
          php -l scripts/diagnostics/hotel_match_current_supplier_bridge_accept.php
          test "$(cat .github/match-current-supplier-bridge-accept-1971-20260913-v1.arm)" = "$OPERATION_ID"
      - name: Reserve immutable operation before SSH
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          x={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_ssh','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'review_operation':'hotel-match-current-supplier-bridge-review-1971-20260913-v2','review_run':34755142403,'review_artifact':10317120572,'manifest_count':9,'planned':{'anex':1,'andromeda':8},'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          d.joinpath('reservation.json').write_text(json.dumps(x,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-current-supplier-bridge-accept-v1-reservation
          path: ${{ runner.temp }}/hotel-match-current-supplier-bridge-accept-1971-20260913-v1/reservation.json
          retention-days: 90
      - name: Apply server-CURRENT guarded bridge
        id: write
        continue-on-error: true
        env:
          SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path; state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(text):
              if text.startswith('<?php'): text=text[5:]
              return text.replace('declare(strict_types=1);','',1)
          helper=body(P('scripts/diagnostics/hotel_full_catalog_reconcile.php').read_text())
          review=body(P('scripts/diagnostics/hotel_match_current_supplier_bridge.php').read_text()).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          writer=body(P('scripts/diagnostics/hotel_match_current_supplier_bridge_accept.php').read_text()).replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_supplier_bridge.php';\n",'',1)
          wrapper="$stage='bootstrap';try{$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$dbHelper||strpos($dbHelper,$root.DIRECTORY_SEPARATOR)!==0)throw new RuntimeException('db_helper');require_once $dbHelper;$db=v2_data_db();$stage='accept';$out=hmsba_accept($db);echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";}catch(Throwable $e){echo json_encode(['status'=>'failed','operation_id'=>'hotel-match-current-supplier-bridge-accept-1971-20260913-v1','stage'=>$stage,'reason'=>$e->getMessage(),'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'committed'=>false,'readback_verified'=>false,'no_replay'=>true],JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";}"
          source='<?php\n'+"define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+review+'\n'+writer+'\n'+wrapper
          req=('SSH_KEY','SSH_HOST','SSH_USER')
          if any(not os.environ.get(k,'').strip() for k in req): raise RuntimeError('ssh_secret_missing')
          host=os.environ['SSH_HOST'].strip(); user=os.environ['SSH_USER'].strip(); raw=os.environ['SSH_KEY'].strip()
          with tempfile.TemporaryDirectory(prefix='match-bridge-accept-',dir=os.environ['RUNNER_TEMP']) as td:
              key=P(td)/'key'; known=P(td)/'known_hosts'
              if 'PRIVATE KEY' in raw: key.write_text(raw.rstrip()+'\n')
              else: key.write_bytes(base64.b64decode(raw))
              key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=768M']
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_') and not k.startswith('ANDROMEDA_')}
              p=subprocess.run(cmd,input=source,text=True,capture_output=True,timeout=480,env=clean)
          if p.returncode!=0:
              low=p.stderr.lower(); cls='authentication_denied' if 'permission denied' in low else ('timeout' if 'timed out' in low else 'ssh_failed_other')
              state.joinpath('blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'transport_failure_no_replay','exit_code':p.returncode,'classification':cls,'database_writes':'unknown','mapping_writes':'unknown','supplier_calls':0,'tourvisor_calls':0,'no_replay':True},sort_keys=True)+'\n'); raise SystemExit(2)
          try: value=json.loads(p.stdout)
          except Exception: value=None
          if not isinstance(value,dict):
              state.joinpath('blocker.json').write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'state':'unknown_after_ssh','reason':'result_unparseable_do_not_replay','stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'database_writes':'unknown','mapping_writes':'unknown','supplier_calls':0,'tourvisor_calls':0,'no_replay':True},sort_keys=True)+'\n'); raise SystemExit(3)
          raw_result=(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); state.joinpath('result.json').write_bytes(raw_result)
          ok=value.get('status')=='completed' and value.get('committed') is True and value.get('readback_verified') is True and value.get('database_writes')==9 and value.get('mapping_writes')==9 and value.get('supplier_calls')==0 and value.get('tourvisor_calls')==0
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_committed_readback_verified' if ok else ('unknown_committed' if value.get('committed') is True else 'known_rolled_back'),'run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw_result).hexdigest(),'application_status':value.get('status'),'database_writes':value.get('database_writes'),'mapping_writes':value.get('mapping_writes'),'planned':value.get('planned'),'committed':value.get('committed'),'readback_verified':value.get('readback_verified'),'supplier_calls':0,'tourvisor_calls':0,'no_replay':True}
          state.joinpath('receipt.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
          if not ok: raise SystemExit(4)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-current-supplier-bridge-accept-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-current-supplier-bridge-accept-1971-20260913-v1/
          retention-days: 90
      - name: Terminal gate
        if: steps.write.outcome != 'success'
        run: exit 1
