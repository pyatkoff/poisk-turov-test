name: MATCH Andromeda state116 evidence census v1
on:
  push:
    branches: [ops/match-andromeda-state116-evidence-census-1971-20260916-v1]
    paths: ['.github/workflows/hotel-match-andromeda-state116-evidence-census-v1.yml']
permissions: {contents: read, actions: read}
env: {OPERATION_ID: hotel-match-andromeda-state116-evidence-census-1971-20260916-v1, OUT: /tmp/match-state116-evidence-v1}
jobs:
  census:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: false}
      - name: Validate
        run: |
          set -euo pipefail; php -l scripts/diagnostics/hotel_match_andromeda_state116_evidence_census_v1.php; php scripts/diagnostics/hotel_match_andromeda_state116_evidence_census_v1.php --self-test; grep -Fq 'START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY' scripts/diagnostics/hotel_match_andromeda_state116_evidence_census_v1.php
      - name: Reserve
        run: |
          mkdir -p "$OUT"; printf '{"operation_id":"%s","source_sha":"%s","state":"reserved_before_ssh_evidence_db","read_only":true,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_SHA" > "$OUT/runner-reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: 'match-state116-evidence-reservation-${{ github.run_id }}', path: '${{ env.OUT }}/runner-reservation.json', retention-days: 90}
      - name: Run census
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY"|tr -d '\r'>"$key"; else printf '%s' "$KEY"|base64 --decode>"$key"; fi; chmod 600 "$key"; set +e
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST" "cd \"\$HOME/www/anytoour.ru\" && OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0" < scripts/diagnostics/hotel_match_andromeda_state116_evidence_census_v1.php > "$OUT/remote-stdout.txt" 2> "$OUT/remote-stderr.txt"; rc=$?; ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" "$USER@$HOST" "p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; test -d \"\$p\" && tar -C \"\$p\" -czf - ." > "$OUT/server-operation.tgz" 2>> "$OUT/remote-stderr.txt"; trc=$?; set -e; rm -f "$key" "$known"; [[ $trc -eq 0 ]] && tar -xzf "$OUT/server-operation.tgz" -C "$OUT"; export RC="$rc" TRC="$trc"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['OUT']);r=json.loads((p/'result.json').read_text());c=json.loads((p/'receipt.json').read_text());h=hashlib.sha256((p/'result.json').read_bytes()).hexdigest();ok=r.get('state')=='completed_read_only' and r.get('pending_state116')==96 and all(r.get(k)==0 for k in ('database_writes','mapping_writes','supplier_calls','tourvisor_calls','booking_calls','lead_calls')) and c.get('result_sha256')==h and c.get('readback_verified') is True and int(os.environ['RC'])==0 and int(os.environ['TRC'])==0;print(json.dumps({'verified':ok,'pending':r.get('pending_state116'),'route_counts':r.get('route_counts'),'result_sha256':h},sort_keys=True));raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-state116-evidence-${{ github.run_id }}', path: '${{ env.OUT }}/', retention-days: 90}
