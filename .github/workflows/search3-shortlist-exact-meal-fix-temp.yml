name: Search3 shortlist exact meal fix temp

on:
  push:
    branches:
      - refactor/search3-drop-meal-normalization-20260917
    paths:
      - .github/workflows/search3-shortlist-exact-meal-fix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/search3-drop-meal-normalization-20260917
          fetch-depth: 0
      - name: Replace retired shortlist meal selectors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/search3-shortlist-browser.cjs')
          text = path.read_text(encoding='utf-8')
          old = 'meal:all-inclusive'
          new = 'meal:label:всё включено'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'expected 4 retired selectors, found {count}')
          text = text.replace(old, new)
          if old in text or text.count(new) < 4:
              raise SystemExit('selector replacement incomplete')
          path.write_text(text, encoding='utf-8')
          PY
          node --check tests/search3-shortlist-browser.cjs
          git diff --check
          git diff -- tests/search3-shortlist-browser.cjs
      - name: Commit test-only fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/search3-shortlist-browser.cjs; then
            echo 'No test change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/search3-shortlist-browser.cjs
          git commit -m 'test(search3): align shortlist meal identity'
          git push origin HEAD:refactor/search3-drop-meal-normalization-20260917
