name: MATCH Andromeda evidence schema CURRENT v1

on:
  push:
    branches: [diag/match-live-frequency-exact-local-current-1971-20260917-v1]
    paths: [.github/workflows/hotel-match-andromeda-evidence-schema-current-v1.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: match-andromeda-evidence-schema-current-v1
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-andromeda-evidence-schema-current-1971-20260917-v1

jobs:
  audit:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}
      - name: Reserve before DB access
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,'claim_comment_id':5714139149,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,'no_replay':True},sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-andromeda-evidence-schema-current-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-andromeda-evidence-schema-current-1971-20260917-v1/reservation.json
          retention-days: 90
      - name: Inspect CURRENT evidence key paths
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          cat > "$RUNNER_TEMP/audit.php" <<'PHP'
          <?php
          declare(strict_types=1);
          const OP='hotel-match-andromeda-evidence-schema-current-1971-20260917-v1';
          function req($v,$m){if(!$v)throw new RuntimeException($m);} function q(PDO $d,string $s):array{$r=$d->query($s)->fetchAll(PDO::FETCH_ASSOC);req(count($r)<=5000,'row_budget');return$r;}
          function walk($v,array &$paths,array $path=[],int $d=0):void{if($d>20)return;if(is_array($v)){foreach($v as$k=>$x){$p=$path;$p[]=(string)$k;walk($x,$paths,$p,$d+1);}return;}$p=implode('.',$path);if($p==='')return;$type=$v===null?'null':(is_bool($v)?'bool':(is_int($v)?'int':(is_float($v)?'float':'string')));$paths[$p]['count']=($paths[$p]['count']??0)+1;$paths[$p]['types'][$type]=($paths[$p]['types'][$type]??0)+1;}
          function relevant(string $p):bool{return preg_match('/(^|\.)(name|hotel|country|region|state|resort|place|latitude|longitude|lat|lon|lng|schema|operator)(_|\.|$)/i',$p)===1;}
          $sha=(string)getenv('MATCH_SOURCE_SHA');req(PHP_SAPI==='cli'&&getenv('MATCH_OPERATION_ID')===OP&&preg_match('/^[a-f0-9]{40}$/D',$sha),'guard');$dir=(string)getenv('HOME').'/.anytoour-match/operations/'.OP;$rv=json_decode((string)file_get_contents($dir.'/reservation.json'),true,32,JSON_THROW_ON_ERROR);req(($rv['state']??'')==='reserved_before_db_access'&&($rv['source_sha']??'')===$sha,'reservation');$db=null;$o=['operation_id'=>OP,'source_sha'=>$sha,'state'=>'failed_no_replay','no_replay'=>true,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0];
          try{$root=realpath(getcwd());req(is_string($root)&&basename($root)==='anytoour.ru','root');require_once $root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php');$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY');$rows=q($db,"SELECT evidence_json FROM andromeda_hotel_identities WHERE supplier_namespace='andromeda_catalog' AND decision_status='pending' AND local_hotel_id IS NULL");$paths=[];$schemas=[];foreach($rows as$r){$e=json_decode((string)$r['evidence_json'],true,64,JSON_THROW_ON_ERROR);req(is_array($e),'shape');$sc=(string)($e['schema']??'<none>');$schemas[$sc]=($schemas[$sc]??0)+1;walk($e,$paths);}ksort($schemas);$rel=[];foreach($paths as$p=>$m)if(relevant($p)){$types=$m['types']??[];ksort($types);$rel[$p]=['count'=>$m['count'],'types'=>$types];}uksort($rel,'strnatcasecmp');$db->exec('ROLLBACK');$o['state']='completed_read_only';$o['rows']=count($rows);$o['schemas']=$schemas;$o['relevant_paths']=$rel;$o['relevant_path_count']=count($rel);$o['all_path_count']=count($paths);$o['read_at_utc']=gmdate('c');}catch(Throwable $e){if($db instanceof PDO&&$db->inTransaction())$db->rollBack();$o['error_code']=preg_match('/^[a-z_]{2,100}$/D',$e->getMessage())?$e->getMessage():'sanitized_failure';}
          $j=json_encode($o,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR)."\n";file_put_contents($dir.'/result.json',$j,LOCK_EX);$h=hash('sha256',$j);file_put_contents($dir.'/receipt.json',json_encode(['operation_id'=>OP,'source_sha'=>$sha,'state'=>$o['state'],'result_sha256'=>$h,'readback_verified'=>true,'no_replay'=>true,'database_writes'=>0,'mapping_writes'=>0,'supplier_calls'=>0,'tourvisor_calls'=>0,'samo_andromeda_calls'=>0],JSON_UNESCAPED_SLASHES|JSON_PRETTY_PRINT)."\n",LOCK_EX);echo json_encode(['state'=>$o['state'],'rows'=>$o['rows']??null,'schemas'=>$o['schemas']??[],'relevant_paths'=>$o['relevant_paths']??[],'result_sha256'=>$h],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR)."\n";if($o['state']!=='completed_read_only')exit(2);
          PHP
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=256M" < "$RUNNER_TEMP/audit.php" > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server';r=json.loads((s/'result.json').read_text());c=json.loads((s/'receipt.json').read_text());h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest();ok=(r.get('state')=='completed_read_only' and r.get('rows')==1385 and c.get('result_sha256')==h and c.get('readback_verified') is True);print(json.dumps({'verified':ok,'rows':r.get('rows'),'schemas':r.get('schemas'),'relevant_paths':r.get('relevant_paths'),'result_sha256':h},ensure_ascii=False,sort_keys=True));(p/'workflow-readback.json').write_text(json.dumps({'verified':ok,'rows':r.get('rows'),'schemas':r.get('schemas'),'relevant_paths':r.get('relevant_paths'),'result_sha256':h},ensure_ascii=False,sort_keys=True,indent=2)+'\n');raise SystemExit(0 if ok else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-andromeda-evidence-schema-current-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-andromeda-evidence-schema-current-1971-20260917-v1/
          retention-days: 90
