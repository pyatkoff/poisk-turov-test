name: ANEX preview B2B live 20260917 v3

on:
  push:
    branches: ['ops/int-anex-preview-b2b-live-20260917-v3']
    paths: ['.github/workflows/anex-preview-b2b-live-20260917-v3.yml']

permissions:
  contents: read

concurrency:
  group: anex-preview-b2b-live-20260917-v3
  cancel-in-progress: false

jobs:
  one-shot-live:
    if: github.run_attempt == 1 && github.actor == 'pyatkoff'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Bind exact published source parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}",headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r: c=json.load(r)
          p=c.get('parents') or []
          if len(p)!=1 or p[0].get('sha')!='19b246e92659d92cdd6ffce9f8bd511b8a90c5b8': raise SystemExit('published_source_parent_mismatch')
          print('ANEX_B2B_LIVE_V3_SOURCE_BOUND')
          PY
      - name: Search once, expand up to three groups, APD batch once
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/anex-b2b-live-v3
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 - <<'PY'
          import http.cookiejar,json,os,socket,urllib.error,urllib.request
          from pathlib import Path
          OP='anex-preview-b2b-live-20260917-v3'; ENDPOINT='https://anytoour.ru/_preview/search3-anex-candidate/api-anex-search3-preview.php'
          out=Path(os.environ['EVIDENCE_DIR'])/'summary.json'; jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          summary={'schema_version':1,'operation_id':OP,'published_source':'19b246e92659d92cdd6ffce9f8bd511b8a90c5b8','scenario':{'departureId':1,'countryId':4,'country':'Turkey','date':'2026-10-22','nights':7,'adults':2,'children':0,'currency':'RUB'},'supplier_replay_allowed':False,'booking_calls':0,'mapping_writes':0,'search':{'attempted':False},'expands':[],'additional_prices':{'attempted':False}}
          def save():
              t=out.with_suffix('.tmp'); t.write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8'); t.replace(out)
          def post(payload):
              raw=json.dumps(payload,separators=(',',':'),ensure_ascii=False).encode()
              req=urllib.request.Request(ENDPOINT,data=raw,method='POST',headers={'Content-Type':'application/json','Accept':'application/json','Sec-Fetch-Site':'none','User-Agent':'AnyTour-ANEX-B2B-live-20260917-v3'})
              try:
                  with opener.open(req,timeout=120) as r:
                      body=r.read(2000001)
                      if len(body)>2000000: raise RuntimeError('response_too_large')
                      return r.status,json.loads(body.decode('utf-8','strict'))
              except urllib.error.HTTPError as e:
                  b=e.read(200001)
                  try:d=json.loads(b.decode('utf-8','strict'))
                  except Exception:d={'ok':False,'error':'non_json_http_error'}
                  return e.code,d
          def live(stage,payload):
              try:return post(payload)
              except (TimeoutError,socket.timeout,urllib.error.URLError,OSError) as e:
                  summary['status']=stage+'_transport_unknown_no_replay'; summary[stage if stage in summary else 'additional_prices']={'attempted':True,'result':'transport_unknown','error_kind':type(e).__name__}; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
          save()
          params={'departureId':1,'countryId':4,'dateFrom':'2026-10-22','dateTo':'2026-10-22','nightsFrom':7,'nightsTo':7,'adults':2,'childs':[],'currency':'RUB','meal':'','hotelIds':[],'regionIds':[],'subregionIds':[],'operatorIds':[],'hotelServices':[],'hotelTypes':[],'arrivalId':'','hotelCategory':'','hotelRating':'','priceFrom':'','priceTo':'','onlyDirect':False,'onlyCharter':False}
          summary['search']={'attempted':True,'completed':False}; save(); status,data=live('search',{'action':'search','generation':1,'params':params})
          if status!=200 or not isinstance(data,dict) or data.get('ok') is not True or not isinstance(data.get('data'),dict):
              summary['status']='search_http_failed_no_replay'; summary['search'].update({'http_status':status,'public_error':data.get('error') if isinstance(data,dict) else 'invalid_response'}); save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
          result=data['data']; hotels=result.get('hotels'); ref=result.get('search_ref')
          if result.get('provider')!='anex' or result.get('generation')!=1 or not isinstance(hotels,list) or not isinstance(ref,str) or len(ref)!=32: raise SystemExit('invalid_search_response')
          groups=[]; tours=0; seen=set()
          for h in hotels:
              if not isinstance(h,dict) or not isinstance(h.get('local_id'),int): continue
              ts=h.get('tours') if isinstance(h.get('tours'),list) else []; tours+=len(ts)
              if h['local_id'] in seen: continue
              for t in ts:
                  if isinstance(t,dict) and t.get('kind')=='group_minimum' and isinstance(t.get('offer_ref'),str) and t.get('search_ref')==ref:
                      groups.append((h['local_id'],t['offer_ref'])); seen.add(h['local_id']); break
          summary['search'].update({'completed':True,'http_status':200,'mapped_hotels':len(hotels),'mapped_tours':tours,'distinct_group_candidates':len(groups),'external_search_pending':bool(result.get('external_search_pending'))}); save()
          concrete=[]
          for local_id,offer_ref in groups[:3]:
              row={'attempted':True,'local_hotel_id':local_id,'completed':False}; summary['expands'].append(row); save()
              try: status,data=post({'action':'expand','generation':1,'search_ref':ref,'offer_ref':offer_ref,'local_hotel_id':local_id})
              except (TimeoutError,socket.timeout,urllib.error.URLError,OSError) as e:
                  row.update({'result':'transport_unknown','error_kind':type(e).__name__}); summary['status']='expand_transport_unknown_no_replay'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
              if status!=200 or not isinstance(data,dict) or data.get('ok') is not True or not isinstance(data.get('data'),dict):
                  row.update({'http_status':status,'public_error':data.get('error') if isinstance(data,dict) else 'invalid_response'}); summary['status']='expand_http_failed_no_replay'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
              x=data['data']; hs=x.get('hotels'); cs=[]
              if x.get('status')!='expanded' or not isinstance(hs,list):
                  row.update({'http_status':200,'status':x.get('status')}); summary['status']='expand_not_completed_no_replay'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
              for h in hs:
                  if not isinstance(h,dict) or h.get('local_id')!=local_id: continue
                  for t in h.get('tours') or []:
                      if isinstance(t,dict) and t.get('kind')=='concrete' and isinstance(t.get('offer_ref'),str) and t.get('search_ref')==ref: cs.append(t)
              row.update({'completed':True,'http_status':200,'concrete_tours':len(cs),'external_search_pending':bool(x.get('external_search_pending'))}); save()
              if cs: concrete.append({'offer_ref':cs[0]['offer_ref'],'local_hotel_id':local_id})
          if not concrete:
              summary['status']='expands_completed_no_concrete_offer'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
          summary['additional_prices']={'attempted':True,'completed':False,'requested_offers':len(concrete)}; save()
          try: status,data=post({'action':'additional_prices_batch','generation':1,'search_ref':ref,'items':concrete})
          except (TimeoutError,socket.timeout,urllib.error.URLError,OSError) as e:
              summary['additional_prices'].update({'result':'transport_unknown','error_kind':type(e).__name__}); summary['status']='apd_transport_unknown_no_replay'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
          if status!=200 or not isinstance(data,dict) or data.get('ok') is not True or not isinstance(data.get('data'),dict):
              summary['additional_prices'].update({'http_status':status,'public_error':data.get('error') if isinstance(data,dict) else 'invalid_response'}); summary['status']='apd_http_failed_no_replay'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(1)
          batch=data['data']; items=batch.get('offers')
          if batch.get('status')!='additional_prices_batch' or not isinstance(items,list) or len(items)!=len(concrete): raise SystemExit('invalid_apd_response')
          public=[]; complete=0; nonzero=0; ready=0
          for item in items:
              ev=item.get('additional_prices') if isinstance(item,dict) else None
              row={'local_hotel_id':item.get('local_hotel_id') if isinstance(item,dict) else None,'status':item.get('status') if isinstance(item,dict) else None,'retryable':bool(item.get('retryable')) if isinstance(item,dict) else False,'final_price_ready':bool(item.get('finalPriceReady')) if isinstance(item,dict) else False}
              if isinstance(ev,dict):
                  row.update({'source':ev.get('source'),'application_state':ev.get('application_state'),'total_count':ev.get('total_count'),'arithmetic_applied':bool(ev.get('arithmetic_applied')),'final_price_verified':bool(ev.get('final_price_verified')),'search_price':ev.get('search_price'),'party_surcharge':ev.get('party_surcharge'),'search_plus_additional':ev.get('search_plus_additional')})
              if row['status']=='additional_prices' and row.get('source')=='anex_b2b_additional_prices_daily': complete+=1
              if isinstance(row.get('total_count'),int) and row['total_count']>0: nonzero+=1
              if row['final_price_ready']: ready+=1
              public.append(row)
          summary['additional_prices'].update({'completed':complete==len(items),'http_status':200,'completed_offers':complete,'nonzero_row_offers':nonzero,'final_price_ready_offers':ready,'offers':public})
          summary['status']='completed' if complete==len(items) else 'apd_not_completed_no_replay'; save(); print(json.dumps(summary,ensure_ascii=False,sort_keys=True)); raise SystemExit(0 if complete==len(items) else 1)
          PY
      - name: Preserve sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anex-preview-b2b-live-20260917-v3-${{ github.run_id }}
          path: ${{ runner.temp }}/anex-b2b-live-v3/summary.json
          if-no-files-found: error
          retention-days: 30
