name: Materialize SEO core resort review routes

on:
  workflow_run:
    workflows: ['Deploy anytoour.ru']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: seo-core-resort-review-materialize-production
  cancel-in-progress: true

jobs:
  review-routes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate generated resort launch materializer
        run: |
          set -euo pipefail
          php -l v2/data/sync-catalog-v1.php >/dev/null
          php -l v2/data/sync-observed-hotel-taxonomy-v1.php >/dev/null
          php -l v2/seo-core-resort-launch-state-v1.php >/dev/null
          php -l v2/seo-core-resort-review-runtime-v1.php >/dev/null
          php -l v2/data/materialize-seo-core-resort-review-routes-v1.php >/dev/null
          php tests/sync-catalog-hotel-taxonomy-contract-smoke.php
          php tests/sync-observed-hotel-taxonomy-contract-smoke.php
          php tests/seo-core-resort-cohort-smoke.php
          php tests/seo-core-resort-source-contract-smoke.php
          php tests/seo-core-resort-review-materializer-smoke.php
      - name: Prepare SSH key
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY"
          if [[ "$KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/anytoour_key"; else printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/anytoour_key"; fi
          chmod 600 "$RUNNER_TEMP/anytoour_key"
          ssh-keygen -y -f "$RUNNER_TEMP/anytoour_key" >/dev/null
      - name: Refresh catalog and publish Egypt and Maldives resort family
        env:
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          remote="$USER@$HOST"
          ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            root="$HOME/www/anytoour.ru"
            manifest="$root/data/generated/seo-core-resort-review-routes-v1.json"
            php "$root/data/sync-catalog-v1.php" --country=1,8
            php "$root/data/sync-observed-hotel-taxonomy-v1.php" --country=1,8 --days=30 --limit=500
            php "$root/data/materialize-seo-core-resort-review-routes-v1.php" --root="$root" --limit=80 --require-count=1 --apply
            php -r '\''$j=json_decode(file_get_contents($argv[1]),true); $r=(array)($j["generated_routes"]??[]); if(!is_array($j)||($j["state"]??"")!=="core_resort_review_routes_materialized"||($j["generated_resorts"]??0)<1||count($r)!==13*(int)$j["generated_resorts"]||($j["public_total_count"]??0)!==104+count($r)||($j["publication_allowed"]??false)!==true||($j["indexation_allowed"]??false)!==true||($j["sitemap_allowed"]??false)!==true||($j["route_launch_allowed"]??false)!==true||($j["hotel_tours_indexation_allowed"]??true)!==false)exit(1); echo "SEO_CORE_RESORT_LAUNCH_MANIFEST_OK resorts=".$j["generated_resorts"]." routes=".count($r)." public_total=".$j["public_total_count"].PHP_EOL;'\'' "$manifest"
            php -r '\''$j=json_decode(file_get_contents($argv[1]),true); $xml=file_get_contents($argv[2]); $r=(array)$j["generated_routes"]; foreach($r as $p){if(strpos($xml,"https://anytoour.ru".$p)===false)exit(2);} if(substr_count($xml,"<loc>")!==(int)$j["public_total_count"]||strpos($xml,"/hotel/")!==false||strpos($xml,"/poisk-turov/")!==false)exit(3); echo "SEO_CORE_RESORT_SITEMAP_OK paths=".$j["public_total_count"].PHP_EOL;'\'' "$manifest" "$root/sitemap.xml"
            base_path="$(php -r '\''$j=json_decode(file_get_contents($argv[1]),true); foreach((array)$j["generated_routes"] as $p){if(preg_match("#^/country/(egypt|maldives)/[a-z0-9-]+/$#",$p)){echo $p;break;}}'\'' "$manifest")"
            month_path="$(php -r '\''$j=json_decode(file_get_contents($argv[1]),true); foreach((array)$j["generated_routes"] as $p){if(preg_match("#/(january|february|march|april|may|june|july|august|september|october|november|december)/$#",$p)){echo $p;break;}}'\'' "$manifest")"
            test -n "$base_path" && test -n "$month_path"
            for path in "$base_path" "$month_path"; do
              curl -fsSL --max-time 45 "https://anytoour.ru$path" -o /tmp/core-resort-page.html
              grep -Eq '\''<meta name="robots" content="index,follow[^\"]*"'\'' /tmp/core-resort-page.html
              grep -Fq "<link rel=\"canonical\" href=\"https://anytoour.ru${path}\">" /tmp/core-resort-page.html
            done
            echo "SEO_CORE_RESORT_PUBLIC_SAMPLE_OK base=$base_path month=$month_path"
          '
      - name: Verify public sitemap has no protected hotel routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 https://anytoour.ru/sitemap.xml -o /tmp/sitemap.xml
          grep -q '<urlset' /tmp/sitemap.xml
          if grep -Fq '/hotel/' /tmp/sitemap.xml; then echo 'HOTEL_TOUR_SITEMAP_LEAK' >&2; exit 1; fi
          if grep -Fq '/poisk-turov/' /tmp/sitemap.xml; then echo 'SEARCH_ROUTE_SITEMAP_LEAK' >&2; exit 1; fi
          echo "SEO_CORE_RESORT_PUBLIC_BOUNDARY_OK hotel_tours=0 search=0"
