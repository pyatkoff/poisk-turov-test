name: MATCH three-provider 1-1-1 full pages v7

on:
  push:
    branches: [ops/match-three-provider-111-full-pages-1971-20260911-v7]

permissions:
  contents: read

concurrency:
  group: anytour-match-three-provider-111-full-pages-v7
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATION_ID: hotel-match-three-provider-111-full-pages-1971-20260911-v7
      EXPECTED_BASE_SHA: b5d8d68829cdeef70c841a4758a1072a26b4e3ee
      ARTIFACT_DIR: /tmp/match-three-provider-111-full-pages-v7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
          persist-credentials: false

      - name: Verify source and derive fresh full-page program
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/match-three-provider-111-full-pages-1971-20260911-v7'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$(cat .github/match-three-provider-111-full-pages-v7.arm)" = "$OPERATION_ID"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort > "$RUNNER_TEMP/paths"
          printf '%s\n' '.github/match-three-provider-111-full-pages-v7.arm' '.github/workflows/hotel-match-three-provider-111-full-pages-v7.yml' | sort > "$RUNNER_TEMP/expected"
          diff -u "$RUNNER_TEMP/expected" "$RUNNER_TEMP/paths"
          mkdir -p "$ARTIFACT_DIR"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/diagnostics/hotel_match_three_provider_111_full_pages_v6.php').read_text()
          oldop='hotel-match-three-provider-111-full-pages-1971-20260911-v6'
          olddate="const M6_DATE = '2026-11-06';"
          if p.count(oldop)!=1 or p.count(olddate)!=1: raise SystemExit('frozen v6 diagnostic changed')
          p=p.replace(oldop,os.environ['OPERATION_ID']).replace(olddate,"const M6_DATE = '2026-11-13';")
          needle="declare(strict_types=1);\n"
          fatal=(
              "register_shutdown_function(static function(): void {\n"
              "    $e=error_get_last();\n"
              "    if(!is_array($e) || !in_array((int)($e['type']??0),[E_ERROR,E_PARSE,E_CORE_ERROR,E_COMPILE_ERROR,E_USER_ERROR],true)) return;\n"
              "    echo 'MATCH111FULL_JSON:'.json_encode([\n"
              "        'status'=>'failed','stage'=>'fatal','reason'=>'php_fatal',\n"
              "        'operation_id'=>'hotel-match-three-provider-111-full-pages-1971-20260911-v7',\n"
              "        'database_writes'=>0,'mapping_writes'=>0,'booking_calls'=>0,'lead_calls'=>0,\n"
              "        'token_values_recorded'=>false,'raw_provider_bodies_recorded'=>false,\n"
              "    ],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES).PHP_EOL;\n"
              "});\n"
          )
          if p.count(needle)!=1: raise SystemExit('strict-types insertion point changed')
          p=p.replace(needle,needle+fatal,1)
          Path(os.environ['ARTIFACT_DIR'],'program.php').write_text(p)
          PY
          php -l "$ARTIFACT_DIR/program.php"

      - name: Zero-supplier SSH and bootstrap preflight
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,os,subprocess,tempfile
          from pathlib import Path
          raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
          with tempfile.TemporaryDirectory(prefix='match111preflight-') as td:
              key=Path(td)/'key'
              if 'PRIVATE KEY' in raw:key.write_text(raw.rstrip()+'\n')
              else:key.write_bytes(base64.b64decode(raw))
              key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'known_hosts'),'-o','ConnectTimeout=15','-o','LogLevel=ERROR','-l',os.environ['ANYTOOUR_DEPLOY_USER'],os.environ['ANYTOOUR_DEPLOY_HOST'],"cd \"$HOME/www/anytoour.ru\" && test -f config.php && test -f _preview/search3-anex-candidate/api-andromeda-search3-preview.php && php -r 'echo \"MATCH111FULL_PREFLIGHT_OK\\n\";' "]
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=45)
          if p.returncode!=0 or 'MATCH111FULL_PREFLIGHT_OK' not in p.stdout: raise SystemExit('zero-supplier ssh/bootstrap preflight failed')
          print('MATCH111FULL_PREFLIGHT_OK')
          PY

      - name: Persist immutable reservation after preflight and before supplier access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          source=Path(os.environ['ARTIFACT_DIR'],'program.php').read_bytes()
          value={
            'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_live_access',
            'source_sha':os.environ['GITHUB_SHA'],'base_sha':os.environ['EXPECTED_BASE_SHA'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'program_sha256':hashlib.sha256(source).hexdigest(),
            'criteria':{'departure':'Moscow','country':'Turkey','date':'2026-11-13','nights':7,'adults':2,'children':0,'currency':'RUB'},
            'providers':['tourvisor_anex_only_full','direct_anex_anchor','andromeda_anex_only_all_pages'],
            'tourvisor_continue_cap':8,'andromeda_page_cap':100,
            'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True,
          }
          p=Path(os.environ['ARTIFACT_DIR'],'reservation.json');raw=(json.dumps(value,sort_keys=True,indent=2)+'\n').encode();p.write_bytes(raw)
          if p.read_bytes()!=raw: raise SystemExit('reservation readback failed')
          PY

      - name: Preserve reservation
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-three-provider-111-full-pages-v7-${{ github.run_id }}-${{ github.run_attempt }}-reserved
          path: /tmp/match-three-provider-111-full-pages-v7/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute synchronized full-page evidence
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          program=Path(os.environ['ARTIFACT_DIR'],'program.php').read_text();raw=os.environ['ANYTOOUR_DEPLOY_SSH_KEY'].strip()
          with tempfile.TemporaryDirectory(prefix='match111full-') as td:
              key=Path(td)/'key'
              if 'PRIVATE KEY' in raw:key.write_text(raw.rstrip()+'\n')
              else:key.write_bytes(base64.b64decode(raw))
              key.chmod(0o600)
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(Path(td)/'known_hosts'),'-o','ConnectTimeout=15','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=2','-o','LogLevel=ERROR','-l',os.environ['ANYTOUR_DEPLOY_USER'],os.environ['ANYTOUR_DEPLOY_HOST'],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0']
              p=subprocess.run(cmd,input=program,text=True,capture_output=True,timeout=600)
          marker='MATCH111FULL_JSON:';line=next((x[len(marker):] for x in reversed(p.stdout.splitlines()) if x.startswith(marker)),None)
          out=Path(os.environ['ARTIFACT_DIR'],'result.json')
          if line is None:
              data={'status':'unknown','stage':'remote_execution','reason':'result_marker_missing','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'remote_exit':p.returncode,'stdout_sha256':hashlib.sha256(p.stdout.encode()).hexdigest(),'stderr_sha256':hashlib.sha256(p.stderr.encode()).hexdigest(),'database_writes':0,'mapping_writes':0,'booking_calls':0,'lead_calls':0,'no_replay':True}
              out.write_text(json.dumps(data,sort_keys=True,indent=2)+'\n');print(json.dumps(data,sort_keys=True));raise SystemExit('remote result unknown; no replay')
          data=json.loads(line);data.update(source_sha=os.environ['GITHUB_SHA'],run_id=int(os.environ['GITHUB_RUN_ID']),run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),remote_exit=p.returncode,no_replay=True)
          rawout=(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode();out.write_bytes(rawout)
          if len(rawout)>3000000: raise SystemExit('result too large')
          providers=data.get('providers') or {}
          summary={'status':data.get('status'),'stage':data.get('stage'),'reason':data.get('reason'),'remote_exit':p.returncode,
            'tourvisor':{k:(providers.get('tourvisor') or {}).get(k) for k in ('hotel_count','initial_result_limit','continue_calls','stop_reason','rounds')},
            'anex':{k:(providers.get('anex') or {}).get(k) for k in ('hotel_count','external_search_pending')},
            'andromeda':{k:(providers.get('andromeda') or {}).get(k) for k in ('hotel_count','offer_count','pages_consumed','final_pages_count','pages')},
            'unique_alias_triples':(((data.get('comparison') or {}).get('unique_alias_triples') or {}).get('count'))}
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          if p.returncode!=0 or data.get('status')!='completed': raise SystemExit('full-page 1-1-1 failed')
          if any(int(data.get(k) or 0)!=0 for k in ('database_writes','mapping_writes','booking_calls','lead_calls')): raise SystemExit('unsafe side effect')
          PY

      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-match-three-provider-111-full-pages-v7-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: |
            /tmp/match-three-provider-111-full-pages-v7/reservation.json
            /tmp/match-three-provider-111-full-pages-v7/result.json
          if-no-files-found: warn
          retention-days: 90
