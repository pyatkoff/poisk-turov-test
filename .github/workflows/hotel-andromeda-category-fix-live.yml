name: Andromeda category fix 1759 v1 live
run-name: Andromeda category fix 1759 v1 live
on:
  push:
    branches: ['feat/int-andromeda-live-20260909']
    paths: ['.github/workflows/hotel-andromeda-category-fix-live.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: andromeda-identity-writes
  cancel-in-progress: false
env:
  SOURCE_SHA: 8fbc474c0e842c52062539aaa876edfb0ddc2ba7
  MERGE_SHA: 8863682935487a5f5e1a57729d52191f6d8d9f5d
  OPERATION_ID: hotel-andromeda-category-fix-1759-20260911-v1
jobs:
  accept:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: 8fbc474c0e842c52062539aaa876edfb0ddc2ba7, path: reviewed}
      - name: Verify source and reserve before SSH
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          test "$(git -C reviewed rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -m 700 "$RUNNER_TEMP/$OPERATION_ID"; export STATE="$RUNNER_TEMP/$OPERATION_ID"
          gh api "repos/$GITHUB_REPOSITORY/pulls/1968" > "$STATE/pr.json"
          for id in 34543013998 34543013918; do gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" > "$STATE/check-$id.json"; done
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$OPERATION_ID-reservation&per_page=100" > "$STATE/prior.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          s=Path(os.environ['STATE']);pr=json.loads((s/'pr.json').read_bytes())
          if pr.get('merged_at') is None or pr.get('merge_commit_sha')!=os.environ['MERGE_SHA'] or pr.get('head',{}).get('sha')!=os.environ['SOURCE_SHA']: raise ValueError('source_not_merged')
          for rid in (34543013998,34543013918):
              r=json.loads((s/f'check-{rid}.json').read_bytes())
              if r.get('head_sha')!=os.environ['SOURCE_SHA'] or r.get('conclusion')!='success': raise ValueError('source_not_green')
          prior=json.loads((s/'prior.json').read_bytes())
          if prior.get('total_count')!=0 or prior.get('artifacts')!=[]: raise ValueError('operation_already_reserved')
          src=Path('reviewed/scripts/diagnostics/hotel_andromeda_category_fix_reconcile.php').read_text()
          if "ACF_OPERATION = 'hotel-andromeda-category-fix-1759-20260911-v1'" not in src or 'starKey' not in src: raise ValueError('source_scope')
          (s/'reservation.json').write_text(json.dumps({'state':'reserved_before_ssh','operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['SOURCE_SHA'],'merge_sha':os.environ['MERGE_SHA'],'run_id':int(os.environ['GITHUB_RUN_ID']),'apply_exactly_once':True,'supplier_calls':0},sort_keys=True)+'\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with: {name: hotel-andromeda-category-fix-1759-20260911-v1-reservation, path: '${{ runner.temp }}/hotel-andromeda-category-fix-1759-20260911-v1/reservation.json', if-no-files-found: error, retention-days: 90}
      - name: Apply once and verify receipt
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 - <<'PYTHON'
          import json, os, shlex, subprocess, tempfile
          from pathlib import Path
          state=Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          helper=Path('reviewed/scripts/diagnostics/hotel_full_catalog_reconcile.php').read_text();fix=Path('reviewed/scripts/diagnostics/hotel_andromeda_category_fix_reconcile.php').read_text()
          def body(text):
              text=text[len('<?php'):] if text.startswith('<?php') else text
              return text.replace("declare(strict_types=1);",'',1)
          code="define('FC_LIBRARY_ONLY',true);\n"+body(helper)+"\ndefine('ACF_LIBRARY_ONLY',true);\n"+body(fix)+"\ntry{$out=acf_main();}catch(Throwable $e){$out=['status'=>'failed','operation_id'=>ACF_OPERATION,'reason'=>'runtime_failure','supplier_calls'=>0];}echo fc_json($out),\"\\n\";"
          req=('ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER');host=os.environ[req[1]].strip();user=os.environ[req[2]].strip()
          with tempfile.TemporaryDirectory(prefix='acf-live-',dir=os.environ.get('RUNNER_TEMP')) as tmp:
              key=Path(tmp)/'key';key.write_text(os.environ[req[0]].rstrip()+'\n');key.chmod(0o600);known=Path(tmp)/'known_hosts'
              cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(code)]
              clean={k:v for k,v in os.environ.items() if k not in req and not k.startswith('ANEX_')}
              def call(phase,t):
                  p=subprocess.run(cmd,input=json.dumps({'operation_id':os.environ['OPERATION_ID'],'phase':phase}),text=True,capture_output=True,timeout=t,env=clean)
                  try:v=json.loads(p.stdout)
                  except:v={'status':'transport_unparseable'}
                  return p.returncode,v
              _,before=call('receipt',60);(state/'server-before.json').write_text(json.dumps(before,sort_keys=True)+'\n')
              if before.get('status')!='not_started': raise ValueError('not_pristine')
              try:arc,apply=call('apply',180)
              except subprocess.TimeoutExpired:arc=124;apply={'status':'apply_reply_timeout'}
              (state/'apply-response.json').write_text(json.dumps({'exit_code':arc,'result':apply},ensure_ascii=False,sort_keys=True)+'\n')
              _,receipt=call('receipt',60);(state/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
              if receipt.get('status') not in ('completed','empty') or receipt.get('supplier_calls')!=0 or (receipt.get('status')=='completed' and receipt.get('readback_verified') is not True): raise ValueError('receipt_unconfirmed')
              print(json.dumps(receipt,ensure_ascii=False,sort_keys=True));(state/'summary.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          PYTHON
      - name: Preserve result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-andromeda-category-fix-1759-20260911-v1-result
          path: ${{ runner.temp }}/hotel-andromeda-category-fix-1759-20260911-v1/
          if-no-files-found: warn
          retention-days: 90
