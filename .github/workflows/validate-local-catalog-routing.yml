name: Validate local catalog routing
on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/hotels-select-v1.php'
      - 'v2/data/destinations-v1.php'
      - 'v2/data/sync-departures-v1.php'
      - 'v2/data/migrate-departure-countries-v1.php'
      - 'v2/catalog-local-routing-v1.js'
      - 'v2/country-matrix-routing-v1.js'
      - '.github/workflows/validate-local-catalog-routing.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local catalog endpoints and routing
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/hotels-select-v1.php >/dev/null
          php -l v2/data/destinations-v1.php >/dev/null
          php -l v2/data/sync-departures-v1.php >/dev/null
          php -l v2/data/migrate-departure-countries-v1.php >/dev/null
          node --check v2/catalog-local-routing-v1.js
          node --check v2/country-matrix-routing-v1.js
          grep -Fq "action==='countries'" v2/catalog-local-routing-v1.js
          grep -Fq "!params.onlyDirect&&!params.onlyCharter" v2/country-matrix-routing-v1.js
          grep -Fq "return upstream(action,params,options)" v2/country-matrix-routing-v1.js
          grep -Fq 'catalog_departure_countries' v2/data/destinations-v1.php
          grep -Fq "v2_data_tv_get('/countries'" v2/data/sync-departures-v1.php
          echo 'LOCAL_DEPARTURE_COUNTRY_ROUTING_OK'
