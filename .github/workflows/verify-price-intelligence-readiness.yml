name: Verify price intelligence readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/data/price-confidence-v1.php'
      - 'v2/data/price-intelligence-v1.php'
      - 'v2/data/inspect-price-intelligence-readiness-v1.php'
      - 'tests/price-intelligence-smoke.php'
      - '.github/workflows/verify-price-intelligence-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'v2/data/price-confidence-v1.php'
      - 'v2/data/price-intelligence-v1.php'
      - 'v2/data/inspect-price-intelligence-readiness-v1.php'
      - 'tests/price-intelligence-smoke.php'
      - '.github/workflows/verify-price-intelligence-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-intelligence-readiness
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate readiness inspector
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/price-confidence-v1.php >/dev/null
          php -l v2/data/price-intelligence-v1.php >/dev/null
          php -l v2/data/inspect-price-intelligence-readiness-v1.php >/dev/null
          php -l tests/price-intelligence-smoke.php >/dev/null
          php tests/price-intelligence-smoke.php
          grep -Fq 'max_observed_price_exact_comparable_segment' v2/data/inspect-price-intelligence-readiness-v1.php
          grep -Fq "'promo_drop_gate'" v2/data/inspect-price-intelligence-readiness-v1.php
          grep -Fq "'minimum_exact_observations' => 2" v2/data/inspect-price-intelligence-readiness-v1.php
          grep -Fq "'historical_drop_gate'" v2/data/inspect-price-intelligence-readiness-v1.php
          grep -Fq "'full_history_gate'" v2/data/inspect-price-intelligence-readiness-v1.php
          grep -Fq "'minimum_independent_searches' => 30" v2/data/inspect-price-intelligence-readiness-v1.php
          grep -Fq "'minimum_observed_days' => 7" v2/data/inspect-price-intelligence-readiness-v1.php
          echo PRICE_INTELLIGENCE_READINESS_CONTRACT_OK

  production-readiness:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEY_VALUE"
          key="$RUNNER_TEMP/anytoour_key"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null

      - name: Collect read-only production readiness
        env:
          HOST_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST_VALUE" && test -n "$USER_VALUE"
          opts=(-i "$RUNNER_TEMP/anytoour_key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          remote="$USER_VALUE@$HOST_VALUE"
          remote_dir='~/www/anytoour.ru/data'
          scp "${opts[@]}" \
            v2/data/db-v1.php \
            v2/data/price-confidence-v1.php \
            v2/data/price-intelligence-v1.php \
            v2/data/inspect-price-intelligence-readiness-v1.php \
            "$remote:$remote_dir/"
          ssh "${opts[@]}" "$remote" '
            set -euo pipefail
            root="$HOME/www/anytoour.ru/data"
            php -l "$root/inspect-price-intelligence-readiness-v1.php" >/dev/null
            php "$root/inspect-price-intelligence-readiness-v1.php" --days=30 --examples=10
          ' > price-intelligence-readiness.json
          python3 - <<'PY'
          import json
          p='price-intelligence-readiness.json'
          data=json.load(open(p,encoding='utf-8'))
          assert data.get('state') == 'price_intelligence_readiness'
          assert data.get('reference_method') == 'max_observed_price_exact_comparable_segment'
          assert data.get('cached_price_is_final') is False
          print('PRICE_INTELLIGENCE_PRODUCTION_READINESS_OK',
                'current_segments='+str(data.get('unique_current_exact_segments')),
                'history_segments='+str(data.get('segments_with_exact_history')),
                'promo_ready='+str(data.get('promo_drop_ready')),
                'historical_ready='+str(data.get('historical_drop_ready')))
          PY
          cat price-intelligence-readiness.json

      - name: Upload production readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: price-intelligence-readiness-${{ github.run_id }}
          path: price-intelligence-readiness.json
          if-no-files-found: error
          retention-days: 14
