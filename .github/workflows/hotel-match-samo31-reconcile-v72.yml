name: MATCH pending11 origin read
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/hotel-match-samo31-reconcile-v72.yml]
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
concurrency:
  group: hotel-match-samo31-reconcile-v72
  cancel-in-progress: false
env:
  OP: hotel-match-pending11-origin-read-1971-20260927-v78
jobs:
  read:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.number == 4017 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'match/samo31-reconcile-v72-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and current-head Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir terminal
          test "$(git hash-object scripts/diagnostics/hotel_match_pending11_origin_read_v78.php)" = c0a1e81eedc362970f223c52f34b47bbb6712ec9
          php -l scripts/diagnostics/hotel_match_pending11_origin_read_v78.php
          php scripts/diagnostics/hotel_match_pending11_origin_read_v78.php --self-test
          python3 - <<'PY'
          import json,os,time,urllib.request,subprocess,pathlib
          assert set(subprocess.check_output(['git','diff','--name-only','e50f35361599aef128a9b1deb69cba9536244e5c','HEAD'],text=True).splitlines())=={'.github/workflows/hotel-match-samo31-reconcile-v72.yml','scripts/diagnostics/hotel_match_pending11_origin_read_v78.php'}
          def get(p):
              q=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:return json.load(f)
          assert get('/pulls/4017')['head']['sha']==os.environ['HEAD']
          for _ in range(80):
              c=[x for x in get('/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100')['workflow_runs'] if x['name']=='Security guard']
              if c and max(c,key=lambda x:x['id'])['status']=='completed':
                  assert max(c,key=lambda x:x['id'])['conclusion']=='success';break
              time.sleep(3)
          else:raise SystemExit('security')
          pathlib.Path('reservation.json').write_text(json.dumps({'operation':os.environ['OP'],'source_sha':os.environ['HEAD'],'database_writes':0})+'\n')
          PY
      - name: Read pending row provenance fields only
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";rel=".anytoour-match/operations/$OP";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test ! -e \"\$HOME/$rel\";mkdir \"\$HOME/$rel\""
          scp "${opts[@]}" reservation.json scripts/diagnostics/hotel_match_pending11_origin_read_v78.php "$remote:$rel/"
          ssh "${opts[@]}" "$remote" "ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$rel\" MATCH_SOURCE_SHA='$HEAD' php \"\$HOME/$rel/hotel_match_pending11_origin_read_v78.php\" --execute"
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$rel/result.json\"" >terminal/result.json
          ssh "${opts[@]}" "$remote" "cat \"\$HOME/$rel/receipt.json\"" >terminal/receipt.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          b=pathlib.Path('terminal/result.json').read_bytes();r=json.loads(b);q=json.load(open('terminal/receipt.json'))
          assert q['result_sha256']==hashlib.sha256(b).hexdigest() and r['state']=='completed_read_only' and r['database_writes']==0
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-pending11-origin-read-${{ github.run_id }}
          path: terminal/
          retention-days: 90
