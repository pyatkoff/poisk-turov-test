name: MATCH v84 isolated tests - no server execution
'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/hotel-match-samo31-reconcile-v72.yml
      - scripts/diagnostics/hotel_match_retained93_primary_write_v84.php
      - tests/hotel_match_retained93_primary_write_v84_test.php
permissions:
  contents: read
concurrency:
  group: hotel-match-v84-fixture-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: false
# The v83 server operation is terminal/no-replay. Its execution job is retired.
# This workflow has no server keys, production configuration, supplier clients,
# remote execution, database acquisition, deployment or production writer step.
# MySQL below is a disposable fixture database on this GitHub-hosted runner only.
jobs:
  isolated-tests:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.number == 4017 && github.event.pull_request.head.ref == 'match/samo31-reconcile-v72-20260927' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: match84-test
          MYSQL_DATABASE: match84_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmatch84-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check fixture prerequisites and PHP syntax
        run: |
          set -euo pipefail
          php -r 'foreach (["mbstring", "pdo_mysql"] as $extension) { if (!extension_loaded($extension)) { fwrite(STDERR, "Missing test extension: $extension\n"); exit(1); } }'
          php -l scripts/diagnostics/hotel_match_retained93_primary_write_v84.php
          php -l tests/hotel_match_retained93_primary_write_v84_test.php
      - name: Run pure fixtures without any database
        run: php tests/hotel_match_retained93_primary_write_v84_test.php
      - name: Run transaction rollback, conflict isolation and readback fixtures
        env:
          MATCH84_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=match84_test;charset=utf8mb4
        run: php tests/hotel_match_retained93_primary_write_v84_test.php
