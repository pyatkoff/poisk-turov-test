name: MATCH observed PAGE1 identity readonly v1

on:
  pull_request:
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - 'scripts/diagnostics/hotel_match_observed_page1_identity_readonly_v1.py'
      - 'scripts/diagnostics/fixtures/hotel_match_observed_page1_identity_readonly_v1.json'
      - 'tests/hotel_match_observed_page1_identity_readonly_v1_test.py'
      - '.github/workflows/hotel-match-observed-page1-identity-readonly-v1.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile scripts/diagnostics/hotel_match_observed_page1_identity_readonly_v1.py
      - name: Require real PHP for config binding
        run: php -v
      - name: Saved PAGE1 contract tests
        run: python3 tests/hotel_match_observed_page1_identity_readonly_v1_test.py
      - name: Offline self test
        run: python3 scripts/diagnostics/hotel_match_observed_page1_identity_readonly_v1.py --self-test
      - name: No supplier or DB client imports
        run: |
          ! grep -E 'import (requests|socket|pymysql)|from (requests|socket|pymysql)' scripts/diagnostics/hotel_match_observed_page1_identity_readonly_v1.py
