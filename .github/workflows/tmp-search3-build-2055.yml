name: Temporary Search3 generated assets 2055

on:
  pull_request:
    branches:
      - release/search3-production-ready-v1
    paths:
      - '.github/workflows/tmp-search3-build-2055.yml'
      - 'src/search3/**'
      - 'scripts/build/search3_assets.py'
      - 'scripts/build/search3-js/**'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix scripts/build/search3-js --ignore-scripts --no-audit --no-fund
      - run: |
          mkdir -p /tmp/search3-2055
          cp v2/search3-results-cards-v2.js /tmp/search3-2055/checked.js
          python3 -B scripts/build/search3_assets.py --write
          cp v2/search3-results-cards-v2.js /tmp/search3-2055/generated.js
          sha256sum /tmp/search3-2055/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: search3-generated-2055
          path: /tmp/search3-2055/*.js
          if-no-files-found: error
          retention-days: 1
