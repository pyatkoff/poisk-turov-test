name: MATCH public ANEX gallery asset evidence v1
on:
  push:
    branches: [match/anex-media-chain-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-gallery-assets-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-anex-gallery-assets-1971-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-anex-gallery-assets-1971-20260914-v1
jobs:
  public-static-evidence:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve new immutable static-only operation
        run: |
          python3 - <<'PY'
          import os,pathlib,json
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];p.mkdir(mode=0o700)
          d={'operation_id':os.environ['OPERATION_ID'],'state':'reserved_before_public_access','source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'input_run_id':34891092743,'input_result_sha256':'55d5ee912d3dae36554a61097b16ff965b79243837dbe48fc338441451b73c3e','mapping_writes':0,'database_access':False,'supplier_search_calls':0,'tourvisor_calls':0,'no_replay':True}
          (p/'reservation.json').write_text(json.dumps(d,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-anex-gallery-assets-v1-reservation
          path: ${{ runner.temp }}/hotel-match-anex-gallery-assets-1971-20260914-v1/reservation.json
          if-no-files-found: error
          retention-days: 90
      - name: Read previously captured HTML artifact (not live pages)
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 34891092743 --repo "$GITHUB_REPOSITORY" --name match-anex-media-chain-v1-result -D "$RUNNER_TEMP/source"
      - name: Inspect only observed same-origin static scripts, never execute them
        run: |
          python3 - <<'PY'
          import hashlib,html,json,os,pathlib,re,time
          from urllib.parse import urljoin,urlsplit
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError
          root=pathlib.Path(os.environ['RUNNER_TEMP']);src=root/'source';out=root/os.environ['OPERATION_ID']
          raw=(src/'result.json').read_bytes();assert hashlib.sha256(raw).hexdigest()=='55d5ee912d3dae36554a61097b16ff965b79243837dbe48fc338441451b73c3e'
          source=json.loads(raw);receipt=json.loads((src/'receipt.json').read_text());assert receipt['result_sha256']==hashlib.sha256(raw).hexdigest()
          urls=set()
          def approved(u):
            try:
              p=urlsplit(u)
              return p.scheme=='https' and p.hostname=='anextour.ru' and p.port in (None,443) and not p.username and not p.password and not p.query and p.path.startswith('/_next/static/') and p.path.endswith('.js')
            except ValueError:return False
          assert not approved('https://anextour.ru.evil.test/_next/static/a.js')
          assert not approved('https://anextour.ru/api/search')
          assert not approved('https://user:pass@anextour.ru/_next/static/a.js')
          for row in source['rows']:
            if row['kind']!='card':continue
            final=row['chain'][-1];name=final['body_file'];assert pathlib.Path(name).name==name
            body=(src/name).read_bytes();assert hashlib.sha256(body).hexdigest()==receipt['files'][name]
            for candidate in re.findall(r'<script[^>]+src="([^"]+)"',body.decode()):
              u=urljoin(final['url'],html.unescape(candidate))
              if approved(u):urls.add(u)
          assert 1<=len(urls)<=80
          (out/'seeds.json').write_text(json.dumps(sorted(urls),indent=2)+'\n')
          class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self,*args,**kwargs):return None
          opener=build_opener(NoRedirect());rows=[];total=0;state='completed_read_only'
          for i,url in enumerate(sorted(urls)):
            row={'url':url};rows.append(row)
            try:
              try:r=opener.open(Request(url,headers={'User-Agent':'AnyTour-MATCH-PublicEvidence/1.0'}),timeout=18)
              except HTTPError as e:r=e
              with r:
                row['status']=r.code
                if r.code!=200:
                  state='public_static_read_blocked_no_retry';row['location']=r.headers.get('Location');break
                b=r.read(4*1024*1024+1);total+=len(b)
                assert len(b)<=4*1024*1024 and total<=40*1024*1024
                name=f'asset-{i:02d}.js';(out/name).write_bytes(b)
                row.update(file=name,bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
                text=b.decode('utf-8','replace')
                row['contexts']=[text[max(0,m.start()-250):m.end()+400] for m in list(re.finditer(r'fetchHotelPhoto|hotelCode|hotelImage|hotelKey|photo\.samo|samoHotel|/hotelphoto|hotel/photos|hotelGallery',text,re.I))[:50]]
            except Exception as e:row['error']=type(e).__name__+': '+str(e)[:400];state='public_static_read_failed_no_retry';break
            finally:
              (out/'partial.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
              time.sleep(0.15)
            print(json.dumps(row,ensure_ascii=False),flush=True)
          result={'operation_id':os.environ['OPERATION_ID'],'state':state,'input_run':34891092743,'seed_count':len(urls),'public_static_requests':len(rows),'bytes':total,'rows':rows,'database_access':False,'mapping_writes':0,'supplier_search_calls':0,'tourvisor_calls':0,'no_replay':True}
          payload=(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+'\n').encode();(out/'result.json').write_bytes(payload)
          rc={'operation_id':os.environ['OPERATION_ID'],'state':state,'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'result_sha256':hashlib.sha256(payload).hexdigest(),'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()},'no_replay':True}
          (out/'receipt.json').write_text(json.dumps(rc,sort_keys=True,indent=2)+'\n');print('RECEIPT '+json.dumps(rc,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-anex-gallery-assets-v1-result
          path: ${{ runner.temp }}/hotel-match-anex-gallery-assets-1971-20260914-v1/
          if-no-files-found: warn
          retention-days: 90
