name: MATCH ANEX child sitemap hotelCode v13
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-rendered-child-sitemap-hotelcode-v11.yml]
permissions: {contents: read, actions: read}
env: {OPERATION_ID: hotel-match-anex-child-sitemap-hotelcode-1971-20260914-v13}
jobs:
  recover:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Mass recover native hotelCode from actual child-sitemap hotel URLs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; S="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$S" "$RUNNER_TEMP/s" "$RUNNER_TEMP/e"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_browser","database_writes":0,"mapping_writes":0,"tourvisor_calls":0,"supplier_search_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$S/reservation.json"
          gh run download 34843349184 --repo "$GITHUB_REPOSITORY" --name match-anex-rendered-sitemap-discovery-v10-result -D "$RUNNER_TEMP/s"
          gh run download 34839217307 --repo "$GITHUB_REPOSITORY" --name match-anex-public-full-current-v3-result -D "$RUNNER_TEMP/e"
          npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');const root=process.env.RUNNER_TEMP,S=root+'/'+process.env.OPERATION_ID,sm=JSON.parse(fs.readFileSync(root+'/s/result.json')),ev=JSON.parse(fs.readFileSync(root+'/e/evidence.json'));const media=/^https?:\/\/(?:files\.anextour\.(?:ru|com)|cdn\.anextour\.ru)\//i;
          const toks=v=>String(v||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[];const generic=new Set(['hotel','hotels','resort','resorts','spa']);const norm=v=>toks(v).filter(x=>!generic.has(x)).join(' ');function score(a,b){const A=new Set(norm(a).split(' ').filter(Boolean)),B=new Set(norm(b).split(' ').filter(Boolean));let i=0;for(const x of A)if(B.has(x))i++;return i/Math.max(1,new Set([...A,...B]).size)}
          (async()=>{const child=[...new Set(sm.rows.flatMap(r=>r.sitemap_links||[]))],browser=await chromium.launch({headless:true}),ctx=await browser.newContext({userAgent:'Mozilla/5.0 AnyTour-MATCH-child-source/1.0'});let ci=0;const all=new Set();async function cw(){while(true){const i=ci++;if(i>=child.length)break;const p=await ctx.newPage();try{await p.goto(child[i],{waitUntil:'domcontentloaded',timeout:12000});await p.waitForTimeout(1800);const html=await p.content();for(const m of html.matchAll(/https?:\\?\/\\?\/(?:www\\?\.)?anextour\\?\.ru\\?\/tours\\?\/([a-z0-9-]+)\\?\/([a-z0-9-]+)/gi)){all.add(('https://anextour.ru/tours/'+m[1]+'/'+m[2]).replace(/\\/g,''))}for(const m of html.matchAll(/href=["']([^"']*\/tours\/[a-z0-9-]+\/[a-z0-9-]+[^"']*)["']/gi)){try{all.add(new URL(m[1].replace(/&amp;/g,'&'),p.url()).origin+new URL(m[1].replace(/&amp;/g,'&'),p.url()).pathname)}catch{}}}catch{}await p.close()}}
          await Promise.all(Array.from({length:14},()=>cw()));const urls=[...all];const candidates=[];for(const r of ev.unmatched||[]){const ranked=urls.map(u=>({url:u,s:Math.max(...(r.source_names||[]).map(n=>score(n,u.split('/').pop().replace(/-/g,' '))),0)})).filter(x=>x.s>=0.42).sort((a,b)=>b.s-a.s).slice(0,5);if(ranked.length)candidates.push({aid:Number(r.anex_hotel_id),cid:Number(r.country_id),source_names:r.source_names||[],ranked})}
          let ri=0;const rows=[];async function rw(){while(true){const i=ri++;if(i>=candidates.length)break;const c=candidates[i];let hit=null,attempts=[];for(const q of c.ranked){const p=await ctx.newPage(),found=new Set();p.on('request',x=>{if(media.test(x.url())&&/hotelCode=/i.test(x.url()))found.add(x.url())});p.on('response',x=>{if(media.test(x.url())&&/hotelCode=/i.test(x.url()))found.add(x.url())});let err=null;try{await p.goto(q.url,{waitUntil:'domcontentloaded',timeout:12000});await p.waitForTimeout(1800)}catch(e){err=String(e).slice(0,120)}await p.close();const codes=[...new Set([...found].map(u=>{try{return Number(new URL(u).searchParams.get('hotelCode')||0)}catch{return 0}}).filter(Boolean))];attempts.push({url:q.url,score:q.s,photo_url_count:found.size,hotel_codes:codes,error:err});if(codes.length===1&&codes[0]===c.aid){hit={page_url:q.url,photo_url_count:found.size,hotel_code:c.aid};break}}rows.push({...c,confirmed:!!hit,hit,attempts})}}
          await Promise.all(Array.from({length:10},()=>rw()));await browser.close();const ok=rows.filter(r=>r.confirmed);const out={status:'completed',operation_id:process.env.OPERATION_ID,child_sitemap_pages:child.length,actual_hotel_urls:urls.length,unresolved_source:86,candidate_rows:candidates.length,confirmed_by_photo_hotelcode:ok.length,confirmed_ids:ok.map(r=>r.aid),still_unmatched:86-ok.length,rows,database_writes:0,mapping_writes:0,tourvisor_calls:0,supplier_search_calls:0,no_replay:true};fs.writeFileSync(S+'/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify({child_sitemap_pages:out.child_sitemap_pages,actual_hotel_urls:out.actual_hotel_urls,candidate_rows:out.candidate_rows,confirmed_by_photo_hotelcode:out.confirmed_by_photo_hotelcode,still_unmatched:out.still_unmatched}));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          S=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];x=json.loads((S/'result.json').read_text());r={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'child_sitemap_pages':x['child_sitemap_pages'],'actual_hotel_urls':x['actual_hotel_urls'],'candidate_rows':x['candidate_rows'],'confirmed_by_photo_hotelcode':x['confirmed_by_photo_hotelcode'],'still_unmatched':x['still_unmatched'],'result_sha256':hashlib.sha256((S/'result.json').read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'supplier_search_calls':0,'no_replay':True};(S/'receipt.json').write_text(json.dumps(r,sort_keys=True)+'\n');print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: match-anex-child-sitemap-hotelcode-v13-result, path: '${{ runner.temp }}/hotel-match-anex-child-sitemap-hotelcode-1971-20260914-v13/', retention-days: 90}
