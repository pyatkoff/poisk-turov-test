name: MATCH ANEX mass photo hotelCode v14
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-rendered-child-sitemap-hotelcode-v11.yml]
permissions: {contents: read, actions: read}
env: {OPERATION_ID: hotel-match-anex-mass-photo-hotelcode-1971-20260914-v14}
jobs:
  crawl:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Mass crawl actual ANEX hotel pages and collect photo hotelCode
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; S="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$S" "$RUNNER_TEMP/s" "$RUNNER_TEMP/e"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_browser","database_writes":0,"mapping_writes":0,"tourvisor_calls":0,"supplier_search_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$S/reservation.json"
          gh run download 34843349184 --repo "$GITHUB_REPOSITORY" --name match-anex-rendered-sitemap-discovery-v10-result -D "$RUNNER_TEMP/s"
          gh run download 34839217307 --repo "$GITHUB_REPOSITORY" --name match-anex-public-full-current-v3-result -D "$RUNNER_TEMP/e"
          npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');const root=process.env.RUNNER_TEMP,S=root+'/'+process.env.OPERATION_ID,sm=JSON.parse(fs.readFileSync(root+'/s/result.json')),ev=JSON.parse(fs.readFileSync(root+'/e/evidence.json'));const media=/^https?:\/\/(?:files\.anextour\.(?:ru|com)|cdn\.anextour\.ru)\//i;
          (async()=>{const child=[...new Set(sm.rows.flatMap(r=>r.sitemap_links||[]))],browser=await chromium.launch({headless:true}),ctx=await browser.newContext({userAgent:'Mozilla/5.0 AnyTour-MATCH-mass-photo-hotelCode/1.0'});let ci=0;const all=new Set();async function cw(){while(true){const i=ci++;if(i>=child.length)break;const p=await ctx.newPage();try{await p.goto(child[i],{waitUntil:'domcontentloaded',timeout:12000});await p.waitForTimeout(900);const html=await p.content();for(const m of html.matchAll(/https?:\\?\/\\?\/(?:www\\?\.)?anextour\\?\.ru\\?\/tours\\?\/([a-z0-9-]+)\\?\/([a-z0-9-]+)/gi))all.add(('https://anextour.ru/tours/'+m[1]+'/'+m[2]).replace(/\\/g,''));for(const m of html.matchAll(/href=["']([^"']*\/tours\/[a-z0-9-]+\/[a-z0-9-]+[^"']*)["']/gi)){try{const u=new URL(m[1].replace(/&amp;/g,'&'),p.url());all.add(u.origin+u.pathname)}catch{}}}catch{}await p.close()}}
          await Promise.all(Array.from({length:16},()=>cw()));const urls=[...all].sort(),rows=[];let pi=0;async function pw(){while(true){const i=pi++;if(i>=urls.length)break;const url=urls[i],p=await ctx.newPage(),found=new Set();p.on('request',x=>{if(media.test(x.url())&&/hotelCode=/i.test(x.url()))found.add(x.url())});p.on('response',x=>{if(media.test(x.url())&&/hotelCode=/i.test(x.url()))found.add(x.url())});let err=null;try{await p.goto(url,{waitUntil:'domcontentloaded',timeout:10000});await p.waitForTimeout(900)}catch(e){err=String(e).slice(0,100)}await p.close();const codes=[...new Set([...found].map(u=>{try{return Number(new URL(u).searchParams.get('hotelCode')||0)}catch{return 0}}).filter(Boolean))].sort((a,b)=>a-b);rows.push({page_url:url,photo_url_count:found.size,hotel_codes:codes,error:err});if((i+1)%250===0)console.log('progress',i+1,'/',urls.length)}}
          await Promise.all(Array.from({length:16},()=>pw()));await browser.close();rows.sort((a,b)=>a.page_url.localeCompare(b.page_url));const unique=new Map();for(const r of rows)if(r.hotel_codes.length===1){const c=r.hotel_codes[0];if(!unique.has(c))unique.set(c,[]);unique.get(c).push(r.page_url)}const unresolved=new Set((ev.unmatched||[]).map(r=>Number(r.anex_hotel_id)));const recovered=[...unique.keys()].filter(x=>unresolved.has(x)).sort((a,b)=>a-b);const out={status:'completed',operation_id:process.env.OPERATION_ID,child_sitemap_pages:child.length,actual_hotel_pages:urls.length,pages_with_photo_hotelcode:rows.filter(r=>r.hotel_codes.length>0).length,unique_photo_hotelcodes:unique.size,total_photo_urls:rows.reduce((n,r)=>n+r.photo_url_count,0),multi_code_pages:rows.filter(r=>r.hotel_codes.length>1).length,current_unmatched_source:unresolved.size,recovered_current_unmatched:recovered.length,recovered_current_unmatched_ids:recovered,rows,database_writes:0,mapping_writes:0,tourvisor_calls:0,supplier_search_calls:0,no_replay:true};fs.writeFileSync(S+'/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify({actual_hotel_pages:out.actual_hotel_pages,pages_with_photo_hotelcode:out.pages_with_photo_hotelcode,unique_photo_hotelcodes:out.unique_photo_hotelcodes,total_photo_urls:out.total_photo_urls,multi_code_pages:out.multi_code_pages,recovered_current_unmatched:out.recovered_current_unmatched}));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          S=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];x=json.loads((S/'result.json').read_text());r={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'actual_hotel_pages':x['actual_hotel_pages'],'pages_with_photo_hotelcode':x['pages_with_photo_hotelcode'],'unique_photo_hotelcodes':x['unique_photo_hotelcodes'],'total_photo_urls':x['total_photo_urls'],'multi_code_pages':x['multi_code_pages'],'recovered_current_unmatched':x['recovered_current_unmatched'],'result_sha256':hashlib.sha256((S/'result.json').read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'supplier_search_calls':0,'no_replay':True};(S/'receipt.json').write_text(json.dumps(r,sort_keys=True)+'\n');print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: match-anex-mass-photo-hotelcode-v14-result, path: '${{ runner.temp }}/hotel-match-anex-mass-photo-hotelcode-1971-20260914-v14/', retention-days: 90}
