name: MATCH ANEX corrected-country full media v17
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-anex-rendered-child-sitemap-hotelcode-v11.yml]
permissions: {contents: read, actions: read}
env:
  OPERATION_ID: hotel-match-anex-corrected-country-full-media-1971-20260914-v17
  PAGES_RUN: '34846841892'
  EVIDENCE_RUN: '34839217307'
jobs:
  recover:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve corrected-country read-only operation
        run: |
          set -euo pipefail; S="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$S"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_browser","database_writes":0,"mapping_writes":0,"tourvisor_calls":0,"supplier_search_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$S/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-anex-corrected-country-v17-reservation, path: '${{ runner.temp }}/hotel-match-anex-corrected-country-full-media-1971-20260914-v17/reservation.json', retention-days: 90}
      - name: Recover remaining ANEX IDs using authoritative country IDs and native media
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail; S="$RUNNER_TEMP/$OPERATION_ID"; mkdir -p "$RUNNER_TEMP/p" "$RUNNER_TEMP/e"
          gh run download "$PAGES_RUN" --repo "$GITHUB_REPOSITORY" --name match-anex-v15-pages -D "$RUNNER_TEMP/p"
          gh run download "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --name match-anex-public-full-current-v3-result -D "$RUNNER_TEMP/e"
          npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install --with-deps chromium >/dev/null
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');const root=process.env.RUNNER_TEMP,S=root+'/'+process.env.OPERATION_ID,pages=JSON.parse(fs.readFileSync(root+'/p/pages.json')),ev=JSON.parse(fs.readFileSync(root+'/e/evidence.json'));
          const COUNTRY={1:'egypt',2:'thailand',4:'turkey',8:'maldives',9:'uae',10:'cuba',12:'sri-lanka',16:'vietnam'},generic=new Set(['hotel','hotels','resort','resorts','spa']),done=new Set([44562,32692,32742,20646,16605,32567,32743,32745,32822,32880,32937,35275]);
          const tok=v=>(String(v||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>!generic.has(x)&&!['ex','former','formerly'].includes(x));function score(a,b){const A=new Set(tok(a)),B=new Set(tok(b));if(!A.size||!B.size)return 0;let n=0;for(const x of A)if(B.has(x))n++;return Math.max(n/new Set([...A,...B]).size,n/A.size*.92)}
          const by={};for(const u of pages.urls){const m=u.match(/\/tours\/([^/]+)\/([^/?#]+)/);if(m)(by[m[1]]??=[]).push({url:u,slug:m[2]})}const source=(ev.unmatched||[]).filter(r=>!done.has(Number(r.anex_hotel_id))),candidateRows=[],wanted=new Map();
          for(const r of source){const aid=Number(r.anex_hotel_id),q=[];for(const p of by[COUNTRY[Number(r.country_id)]]||[]){const sc=Math.max(0,...(r.source_names||[]).map(n=>score(n,p.slug.replace(/-/g,' ')))),exact=p.slug.endsWith('-'+aid);if(exact||sc>=.32)q.push({url:p.url,score:sc,exact})}q.sort((a,b)=>(b.exact-a.exact)||(b.score-a.score));const top=q.slice(0,8);if(top.length){candidateRows.push({aid,country_id:Number(r.country_id),source_names:r.source_names||[],candidates:top});for(const c of top){if(!wanted.has(c.url))wanted.set(c.url,new Set());wanted.get(c.url).add(aid)}}}
          const media=/https?:\/\/(?:files\.anextour\.(?:ru|com)|cdn\.anextour\.ru)\/[^\s"'<>]+/ig;function cap(set,x){const s=String(x||'').replaceAll('\\/','/').replace(/&amp;/g,'&');for(const m of s.match(media)||[])if(/hotelCode=/i.test(m))set.add(m)}function fields(html){const out=new Set(),s=String(html||'').replaceAll('\\/','/');for(const rx of [/hotelCode["']?\s*[:=]\s*["']?(\d+)/ig,/hotelcode=(\d+)/ig])for(const m of s.matchAll(rx))out.add(Number(m[1]));return [...out].filter(Boolean).sort((a,b)=>a-b)}
          (async()=>{const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({userAgent:'Mozilla/5.0 AnyTour-MATCH-v17-correct-country/1.0'}),urls=[...wanted.keys()],rows=[];let idx=0;async function w(){while(true){const i=idx++;if(i>=urls.length)break;const url=urls[i],p=await ctx.newPage(),found=new Set();p.on('request',x=>cap(found,x.url()));p.on('response',x=>cap(found,x.url()));let err=null,html='',final=null;try{await p.goto(url,{waitUntil:'domcontentloaded',timeout:12000});await p.waitForTimeout(1800);final=p.url();html=await p.content();cap(found,html);for(const x of await p.locator('img').evaluateAll(xs=>xs.flatMap(n=>[n.src,n.currentSrc,n.getAttribute('data-src'),n.getAttribute('data-lazy-src'),n.getAttribute('srcset')].filter(Boolean))))cap(found,x);await p.evaluate(()=>window.scrollTo(0,Math.max(700,document.body.scrollHeight*.65)));await p.waitForTimeout(800);html+='\n'+await p.content();cap(found,html)}catch(e){err=String(e).slice(0,140)}await p.close();const codes=[...new Set([...found].map(u=>{try{const q=new URL(u).searchParams;return Number(q.get('hotelCode')||q.get('hotelcode')||0)}catch{return 0}}).filter(Boolean))].sort((a,b)=>a-b);rows.push({page_url:url,final_url:final,target_ids:[...wanted.get(url)].sort((a,b)=>a-b),media_hotel_codes:codes,page_field_codes:fields(html),photo_url_count:found.size,error:err})}}
          await Promise.all(Array.from({length:20},()=>w()));await browser.close();const map=new Map(rows.map(r=>[r.page_url,r])),confirmed=[],conflicts=[];for(const c of candidateRows)for(const q of c.candidates){const r=map.get(q.url);if(!r)continue;const mediaOk=r.media_hotel_codes.length===1&&r.media_hotel_codes[0]===c.aid,fieldOk=q.exact&&r.page_field_codes.length===1&&r.page_field_codes[0]===c.aid;if(mediaOk||fieldOk){confirmed.push({anex_hotel_id:c.aid,country_id:c.country_id,source_names:c.source_names,page_url:q.url,score:q.score,exact_id_slug:q.exact,hotelcode:c.aid,evidence:mediaOk?'official_anex_page_native_media_hotelCode':'official_anex_page_hotelCode_field'});break}if(r.media_hotel_codes.length&&!r.media_hotel_codes.includes(c.aid))conflicts.push({anex_hotel_id:c.aid,page_url:q.url,observed_hotel_codes:r.media_hotel_codes,score:q.score})}
          const ids=[...new Set(confirmed.map(x=>x.anex_hotel_id))].sort((a,b)=>a-b),out={status:'completed',operation_id:process.env.OPERATION_ID,country_map:COUNTRY,unresolved_source:source.length,candidate_rows:candidateRows.length,unique_candidate_pages:urls.length,pages_with_media_hotelcode:rows.filter(r=>r.media_hotel_codes.length).length,pages_with_page_field_hotelcode:rows.filter(r=>r.page_field_codes.length).length,confirmed_by_hotelcode:ids.length,confirmed_ids:ids,still_unconfirmed:source.length-ids.length,conflict_observations:conflicts.length,confirmed,conflicts,page_rows:rows,database_writes:0,mapping_writes:0,tourvisor_calls:0,supplier_search_calls:0,no_replay:true};fs.writeFileSync(S+'/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify({unresolved_source:out.unresolved_source,candidate_rows:out.candidate_rows,unique_candidate_pages:out.unique_candidate_pages,pages_with_media_hotelcode:out.pages_with_media_hotelcode,pages_with_page_field_hotelcode:out.pages_with_page_field_hotelcode,confirmed_by_hotelcode:out.confirmed_by_hotelcode,still_unconfirmed:out.still_unconfirmed,conflict_observations:out.conflict_observations}));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          S=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];x=json.loads((S/'result.json').read_text());r={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'unresolved_source':x['unresolved_source'],'candidate_rows':x['candidate_rows'],'unique_candidate_pages':x['unique_candidate_pages'],'confirmed_by_hotelcode':x['confirmed_by_hotelcode'],'still_unconfirmed':x['still_unconfirmed'],'conflict_observations':x['conflict_observations'],'result_sha256':hashlib.sha256((S/'result.json').read_bytes()).hexdigest(),'database_writes':0,'mapping_writes':0,'tourvisor_calls':0,'supplier_search_calls':0,'no_replay':True};(S/'receipt.json').write_text(json.dumps(r,sort_keys=True)+'\n');print(json.dumps(r,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: match-anex-corrected-country-v17-result, path: '${{ runner.temp }}/hotel-match-anex-corrected-country-full-media-1971-20260914-v17/', retention-days: 90}
