jobs:
  focused:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/live-samo-missing-anex-operator13-acquire-v57-20260926'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m py_compile scripts/diagnostics/hotel_match_live_samo_missing_anex_operator13_acquire_v57.py
      - run: python3 scripts/diagnostics/hotel_match_live_samo_missing_anex_operator13_acquire_v57.py --self-test
      - run: python3 tests/hotel_match_live_samo_missing_anex_operator13_acquire_v57_test.py
      - name: Guard boundaries
        run: |
          set -euo pipefail
          f=scripts/diagnostics/hotel_match_live_samo_missing_anex_operator13_acquire_v57.py
          ! grep -E 'INSERT INTO|UPDATE .* SET|DELETE FROM|->commit\(' "$f"
          grep -Fq "ACCOUNT='TOURVISOR_ANEX_JWT'" "$f"
          grep -Fq "ACCOUNT_LEDGER='tourvisor-anex'" "$f"
          grep -Fq "CALL_CAP=1000" "$f"
          grep -Fq "MAX_BATCHES=90" "$f"
          grep -Fq "EXPECTED_DAY='2026-09-26'" "$f"
          grep -Fq "len(consumed)!=171" "$f"
          grep -Fq "len(candidates)!=90" "$f"
          grep -Fq "load_consumed_v49" "$f"
          grep -Fq "load_consumed_v53" "$f"
          grep -Fq "AnyTourMatchAnexEffectiveCoverage::fromPdo" "$f"
          grep -Fq "operatorIds':[13]" "$f"

  acquire:
    needs: focused
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.event.pull_request.head.ref == 'match/live-samo-missing-anex-operator13-acquire-v57-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate authority, immutable inputs and Security
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p input/router input/v45 input/v49 input/v53 input/v52b reservation terminal
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          test "$actual" = ".github/workflows/hotel-match-live-samo-missing-anex-operator13-acquire-v57.yml scripts/diagnostics/hotel_match_live_samo_missing_anex_operator13_acquire_v57.py tests/hotel_match_live_samo_missing_anex_operator13_acquire_v57_test.py "

          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM" >input/claim.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$CLAIM_AMEND" >input/claim-amend.json
          python3 - <<'PY'
          import json,os,time,urllib.request
          c=json.load(open('input/claim.json'));a=json.load(open('input/claim-amend.json'));b=c['body']+'\n'+a['body']
          for x in (c,a):
              assert x['user']['id']==226193297 and x['author_association']=='OWNER' and x['issue_url'].endswith('/issues/3419')
          for x in [os.environ['OP'],'MASS successor','171','90','CALL_CAP1000','TOURVISOR_ANEX_JWT','tourvisor-anex','daily tariff limit3000','DB/schema/mapping writes0']:
              assert x in b,x
          for x in [os.environ['V41B_OP'],os.environ['V45_OP'],os.environ['V49_OP'],os.environ['V53_OP'],'31','90']:
              assert x.lower() in b.lower(),x
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['HEAD']+'&per_page=100'
          for _ in range(120):
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:runs=json.load(f)['workflow_runs']
              xs=[x for x in runs if x['name']=='Security guard' and x['head_sha']==os.environ['HEAD']]
              if xs:
                  x=max(xs,key=lambda z:z['id'])
                  if x['status']=='completed':
                      assert x['conclusion']=='success',x['conclusion'];break
              time.sleep(3)
          else:raise SystemExit('security_not_green')
          PY

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ROUTER_ARTIFACT/zip" -o input/router.zip
          test "$(sha256sum input/router.zip|awk '{print $1}')" = "$ROUTER_ARTIFACT_SHA"
          python3 - <<'PY'
          import zipfile,json,pathlib,os
          hits=[]
          with zipfile.ZipFile('input/router.zip') as z:
              for i in z.infolist():
                  if i.is_dir() or i.file_size>64_000_000 or not i.filename.endswith('result.json'):continue
                  raw=z.read(i)
                  try:r=json.loads(raw)
                  except Exception:continue
                  if r.get('operation_id')=='hotel-match-live-samo-missing-direct-anex-router-1971-20260925-v35':hits.append((raw,r))
          assert len(hits)==1
          raw,r=hits[0]
          assert r['state']=='completed_read_only' and r['source_sha']==os.environ['ROUTER_HEAD']
          assert r['input_count']==777 and r['routed_future_context_count']==659 and r['no_future_context_count']==118 and r['batch_count']==261
          assert r['supplier_calls']==r['database_writes']==r['mapping_writes']==0
          pathlib.Path('input/router-result.json').write_bytes(raw)
          PY

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V45_ARTIFACT/zip" -o input/v45.zip
          test "$(sha256sum input/v45.zip|awk '{print $1}')" = "$V45_ARTIFACT_SHA"
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib,os
          results=[];receipts=[]
          with zipfile.ZipFile('input/v45.zip') as z:
              for i in z.infolist():
                  if i.is_dir() or i.file_size>64_000_000:continue
                  raw=z.read(i)
                  try:x=json.loads(raw)
                  except Exception:continue
                  if i.filename.endswith('result.json') and x.get('operation')==os.environ['V45_OP']:results.append((raw,x))
                  if i.filename.endswith('receipt.json') and x.get('operation')==os.environ['V45_OP']:receipts.append((raw,x))
          assert len(results)==len(receipts)==1
          rraw,r=results[0];qraw,q=receipts[0];rsha=hashlib.sha256(rraw).hexdigest();qsha=hashlib.sha256(qraw).hexdigest()
          assert r['state']=='completed_read_only' and q['state']=='completed_read_only' and q['result_sha256']==rsha and q['no_replay'] is True
          assert r['selected_batch_count']==50 and r['selected_hotel_count']==160 and r['provider_calls']==192 and r['captured_single_native_count']==17 and r['operation_tariff_units']==50
          pathlib.Path('input/v45-result.json').write_bytes(rraw);pathlib.Path('input/v45-receipt.json').write_bytes(qraw)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('V45_RESULT_SHA_CALC='+rsha+'\n');f.write('V45_RECEIPT_SHA_CALC='+qsha+'\n')
          PY

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V49_ARTIFACT/zip" -o input/v49.zip
          test "$(sha256sum input/v49.zip|awk '{print $1}')" = "$V49_ARTIFACT_SHA"
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib,os
