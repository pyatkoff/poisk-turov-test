name: MATCH mass untouched ANEX acquisition v57

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [feature/anex-search-adapter-20260907]
    paths:
      - scripts/diagnostics/hotel_match_live_samo_missing_anex_operator13_acquire_v57.py
      - tests/hotel_match_live_samo_missing_anex_operator13_acquire_v57_test.py
