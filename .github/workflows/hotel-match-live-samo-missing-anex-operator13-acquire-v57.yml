                  if i.filename.endswith('receipt.json') and x.get('operation')==os.environ['V49_OP']:receipts.append((raw,x))
          assert len(results)==len(receipts)==1
          rraw,r=results[0];qraw,q=receipts[0]
          assert hashlib.sha256(rraw).hexdigest()==os.environ['V49_RESULT_SHA']
          assert hashlib.sha256(qraw).hexdigest()==os.environ['V49_RECEIPT_SHA']
          assert q['result_sha256']==os.environ['V49_RESULT_SHA'] and q['no_replay'] is True
          assert r['state']=='completed_read_only' and r['selected_batch_count']==50 and r['selected_hotel_count']==78 and r['provider_calls']==179 and r['captured_single_native_count']==12 and r['operation_tariff_units']==50
          pathlib.Path('input/v49-result.json').write_bytes(rraw);pathlib.Path('input/v49-receipt.json').write_bytes(qraw)
          PY


          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V53_ARTIFACT/zip" -o input/v53.zip
          test "$(sha256sum input/v53.zip|awk '{print $1}')" = "$V53_ARTIFACT_SHA"
          python3 - <<'PY'
          import zipfile,json,hashlib,pathlib,os
          results=[];receipts=[]
          with zipfile.ZipFile('input/v53.zip') as z:
              for i in z.infolist():
                  if i.is_dir() or i.file_size>64_000_000:continue
                  raw=z.read(i)
                  try:x=json.loads(raw)
                  except Exception:continue
                  if i.filename.endswith('result.json') and x.get('operation')==os.environ['V53_OP']:results.append((raw,x))
                  if i.filename.endswith('receipt.json') and x.get('operation')==os.environ['V53_OP']:receipts.append((raw,x))
          assert len(results)==len(receipts)==1
          rraw,r=results[0];qraw,q=receipts[0]
          assert hashlib.sha256(rraw).hexdigest()==os.environ['V53_RESULT_SHA']
          assert hashlib.sha256(qraw).hexdigest()==os.environ['V53_RECEIPT_SHA']
          assert q['result_sha256']==os.environ['V53_RESULT_SHA'] and q['no_replay'] is True
          assert r['state']=='terminal_failed_no_replay' and r['reason']=='RuntimeError:http_400'
          assert r['selected_batch_count']==121 and r['selected_hotel_count']==121 and r['provider_calls']==98 and r['operation_tariff_units']==31
          assert r['completed_batches']==30 and r['returned_edge_count']==3 and r['captured_single_native_count']==2
          assert r['link_state_counts']=={'captured_ambiguous_native':1,'captured_single_native':2}
          assert r['continue_calls']==r['dates_calls']==r['database_writes']==r['mapping_writes']==0
          pathlib.Path('input/v53-result.json').write_bytes(rraw);pathlib.Path('input/v53-receipt.json').write_bytes(qraw)
          PY

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V52B_ARTIFACT/zip" -o input/v52b.zip
          test "$(sha256sum input/v52b.zip|awk '{print $1}')" = "$V52B_ARTIFACT_SHA"
          python3 - <<'PY'
          import zipfile,json,hashlib,os
          results=[];receipts=[]
          with zipfile.ZipFile('input/v52b.zip') as z:
              for i in z.infolist():
                  if i.is_dir() or i.file_size>8_000_000:continue
                  raw=z.read(i)
                  try:x=json.loads(raw)
                  except Exception:continue
                  if i.filename.endswith('result.json') and x.get('operation')=='hotel-match-business-live30-post-anex-writer-census-1971-20260926-v52b':results.append((raw,x))
                  if i.filename.endswith('receipt.json') and x.get('operation')=='hotel-match-business-live30-post-anex-writer-census-1971-20260926-v52b':receipts.append((raw,x))
          assert len(results)==len(receipts)==1
          rraw,r=results[0];qraw,q=receipts[0]
          assert hashlib.sha256(rraw).hexdigest()==os.environ['V52B_RESULT_SHA']
          assert hashlib.sha256(qraw).hexdigest()==os.environ['V52B_RECEIPT_SHA']
          assert q['result_sha256']==os.environ['V52B_RESULT_SHA'] and q['readback_verified'] is True
          assert r['state']=='completed_read_only_post_anex_writer_census'
          assert r['current']=={'tv_live30_total':4399,'full_triple_total':2707,'tv_samo_missing_anex':732,'tv_anex_missing_samo':234,'tv_only_missing_both':726}
          assert r['v51_target_count']==r['v51_targets_full_triple']==12 and r['v51_target_states']=={'full_triple':12}
          assert r['provider_http_calls']==r['database_writes']==r['mapping_writes']==0
          PY

          python3 - <<'PY'
          import json,os,pathlib,datetime,hashlib
          router=pathlib.Path('input/router-result.json')
          pathlib.Path('reservation/reservation.json').write_text(json.dumps({
            'operation':os.environ['OP'],'state':'reserved_before_provider_access','source_sha':os.environ['HEAD'],
            'router_artifact':int(os.environ['ROUTER_ARTIFACT']),'router_result_sha256':hashlib.sha256(router.read_bytes()).hexdigest(),
            'predecessor_operations':[os.environ['V41B_OP'],os.environ['V45_OP'],os.environ['V49_OP'],os.environ['V53_OP']],
            'v45_result_sha256':hashlib.sha256(pathlib.Path('input/v45-result.json').read_bytes()).hexdigest(),
            'v45_receipt_sha256':hashlib.sha256(pathlib.Path('input/v45-receipt.json').read_bytes()).hexdigest(),
            'v49_result_sha256':os.environ['V49_RESULT_SHA'],'v49_receipt_sha256':os.environ['V49_RECEIPT_SHA'],
            'v52b_result_sha256':os.environ['V52B_RESULT_SHA'],
            'tourvisor_account':'TOURVISOR_ANEX_JWT','daily_limit':3000,'operation_call_cap':1000,'max_batches':90,
            'reserved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'database_writes':0,'mapping_writes':0
          },sort_keys=True)+'\n')
          PY

      - name: Require clear supplier lane
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$LANE_AMEND" >input/lane-amend.json
          python3 - <<'PY'
          import json,os,urllib.request,datetime
          claim=json.load(open('input/lane-amend.json'));body=claim['body']
          assert claim['user']['id']==226193297 and claim['author_association']=='OWNER'
          assert 'within the last 2 hours' in body and 'in_progress' in body
          now=datetime.datetime.now(datetime.timezone.utc);bad=[];stale=[]
          for status in ('in_progress','queued'):
              u=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?status={status}&per_page=100"
              q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(q,timeout=30) as f:rows=json.load(f)['workflow_runs']
              for r in rows:
                  if str(r['id'])==os.environ['RUN_ID']:continue
                  n=(r.get('name') or '').lower()
                  if not any(k in n for k in ('match','int server','andromeda','anex','tourvisor')):continue
                  if status=='queued':
                      created=datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
                      if (now-created).total_seconds()>7200:stale.append((r['id'],r.get('name')));continue
                  bad.append((r['id'],r.get('name'),r.get('status')))
          print(json.dumps({'stale_queued_ignored':stale,'blocking':bad},ensure_ascii=False))
          assert not bad,bad
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-v53-reservation-${{ github.run_id }}
          path: reservation/reservation.json
          retention-days: 90
          if-no-files-found: error

      - name: Execute mass remaining operator13 router
        env:
          KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";trap 'rm -f "$key" "$known"' EXIT
          if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";rel=".anytoour-match/operations/$OP";prev1=".anytoour-match/operations/$V41B_OP";prev2=".anytoour-match/operations/$V45_OP";prev3=".anytoour-match/operations/$V49_OP";prev4=".anytoour-match/operations/$V53_OP"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${opts[@]}" "$remote" "set -eu;umask 077;test -d \"\$HOME/$prev1\";test -d \"\$HOME/$prev2\";test -d \"\$HOME/$prev3\";test -d \"\$HOME/$prev4\";test \"\$(sha256sum \"\$HOME/$prev2/result.json\"|awk '{print \$1}')\" = '$V45_RESULT_SHA_CALC';test \"\$(sha256sum \"\$HOME/$prev2/receipt.json\"|awk '{print \$1}')\" = '$V45_RECEIPT_SHA_CALC';test \"\$(sha256sum \"\$HOME/$prev3/result.json\"|awk '{print \$1}')\" = '$V49_RESULT_SHA';test \"\$(sha256sum \"\$HOME/$prev3/receipt.json\"|awk '{print \$1}')\" = '$V49_RECEIPT_SHA';test \"\$(sha256sum \"\$HOME/$prev4/result.json\"|awk '{print \$1}')\" = '$V53_RESULT_SHA';test \"\$(sha256sum \"\$HOME/$prev4/receipt.json\"|awk '{print \$1}')\" = '$V53_RECEIPT_SHA';test ! -e \"\$HOME/$rel\";mkdir -p \"\$HOME/$rel/payload/scripts/diagnostics\" \"\$HOME/$rel/payload/app/integrations\""
          scp "${opts[@]}" reservation/reservation.json "$remote:$rel/reservation.json"
          scp "${opts[@]}" input/router-result.json scripts/diagnostics/hotel_match_live_samo_missing_anex_operator13_acquire_v57.py "$remote:$rel/payload/"
          scp "${opts[@]}" scripts/diagnostics/hotel_match_anex_effective_coverage.php "$remote:$rel/payload/scripts/diagnostics/"
