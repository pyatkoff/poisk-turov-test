name: MATCH Tourvisor ANEX operator identity review v3
on:
  push:
    branches: [ops/match-learned-geo-global-2333-20260914-v1]
    paths: [.github/match-tourvisor-anex-operator-identity-review-2333-20260914-v3.arm]
permissions: {contents: read}
env:
  OPERATION_ID: hotel-match-tourvisor-anex-operator-identity-review-2333-20260914-v3
jobs:
  review:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Validate saved operator identity review
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_full_catalog_reconcile.php
          php -l scripts/diagnostics/hotel_match_current_bulk_review.php
          php -l scripts/diagnostics/hotel_match_tourvisor_anex_operator_identity_review.php
          test "$(cat .github/match-tourvisor-anex-operator-identity-review-2333-20260914-v3.arm)" = "$OPERATION_ID"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_tourvisor_anex_operator_identity_review.php').read_text()
          assert "'database_writes'=>0" in s and "'mapping_writes'=>0" in s
          assert "'supplier_calls'=>0" in s and "'tourvisor_calls'=>0" in s
          assert 'tour_operator_identity_observations' in s
          assert 'hotelcode' in s.lower() and 'hotellist' in s.lower()
          assert 'coordinate_conflict_gt_5km' in s
          assert 'pair_exclusion' in s
          print('saved operator identity read-only scope verified')
          PY
      - name: SSH preflight
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/match_key"
          if [[ "$SSH_KEY" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$key"; else printf '%s' "$SSH_KEY" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          out="$(ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known" -o ConnectTimeout=20 -o LogLevel=ERROR -l "$SSH_USER" "$SSH_HOST" 'cd "$HOME/www/anytoour.ru" && test -s config.php && { test -f data/db-v1.php || test -f v2/data/db-v1.php; } && printf MATCH_SSH_OK')"
          test "$out" = MATCH_SSH_OK
      - name: Reserve immutable operation
        run: |
          STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '%s\n' '{"operation_id":"hotel-match-tourvisor-anex-operator-identity-review-2333-20260914-v3","state":"reserved_after_ssh_before_current_db_read","database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_calls":0,"no_replay":true}' > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-tourvisor-anex-operator-identity-v3-reservation, path: '${{ runner.temp }}/hotel-match-tourvisor-anex-operator-identity-review-2333-20260914-v3/reservation.json', retention-days: 90}
      - name: Run CURRENT saved operator identity review
        env: {SSH_KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', SSH_HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', SSH_USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,tempfile
          P=pathlib.Path; state=P(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          def body(path):
            s=P(path).read_text(); s=s[5:] if s.startswith('<?php') else s
            return s.replace('declare(strict_types=1);','',1)
          helper=body('scripts/diagnostics/hotel_full_catalog_reconcile.php')
          bulk=body('scripts/diagnostics/hotel_match_current_bulk_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_full_catalog_reconcile.php';\n",'',1)
          review=body('scripts/diagnostics/hotel_match_tourvisor_anex_operator_identity_review.php').replace("if (!defined('FC_LIBRARY_ONLY')) define('FC_LIBRARY_ONLY', true);\nrequire_once __DIR__ . '/hotel_match_current_bulk_review.php';\n",'',1)
          wrapper="$root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$config=realpath($root.'/config.php');$dbHelper=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once $config;require_once $dbHelper;$out=hmtoi_review(v2_data_db(),'hotel-match-tourvisor-anex-operator-identity-review-2333-20260914-v3');echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),\"\\n\";"
          payload='<?php\n'+"define('FC_LIBRARY_ONLY',true);\n"+helper+'\n'+bulk+'\n'+review+'\n'+wrapper
          raw=os.environ['SSH_KEY'].strip(); host=os.environ['SSH_HOST'].strip(); user=os.environ['SSH_USER'].strip()
          with tempfile.TemporaryDirectory(prefix='match-toi-',dir=os.environ['RUNNER_TEMP']) as td:
            key=P(td)/'key'; known=P(td)/'known'
            key.write_text(raw.rstrip()+'\n') if 'PRIVATE KEY' in raw else key.write_bytes(base64.b64decode(raw)); key.chmod(0o600)
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','ControlMaster=no','-o','ControlPath=none','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=20','-o','ServerAliveInterval=15','-o','ServerAliveCountMax=3','-o','LogLevel=ERROR','-l',user,host,'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -d memory_limit=1536M']
            p=subprocess.run(cmd,input=payload,text=True,capture_output=True,timeout=900)
          if p.returncode!=0:
            state.joinpath('transport.json').write_text(json.dumps({'remote_exit':p.returncode,'stdout_bytes':len(p.stdout.encode()),'stderr_tail':p.stderr[-1600:]},ensure_ascii=False,sort_keys=True)+'\n')
            raise SystemExit(2)
          v=json.loads(p.stdout); raw_result=(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode(); state.joinpath('result.json').write_bytes(raw_result)
          ok=v.get('status')=='completed' and v.get('operation_id')==os.environ['OPERATION_ID'] and v.get('database_writes')==0 and v.get('mapping_writes')==0 and v.get('supplier_calls')==0 and v.get('tourvisor_calls')==0
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if ok else 'invalid_or_unknown_no_replay','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'result_sha256':hashlib.sha256(raw_result).hexdigest(),'safe_count':v.get('safe_count'),'direct_anex_safe_count':v.get('direct_anex_safe_count'),'live_andromeda_safe_count':v.get('live_andromeda_safe_count'),'operator_anchor_locals':v.get('operator_anchor_locals'),'database_writes':0,'mapping_writes':0,'no_replay':True}
          state.joinpath('receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n')
          if not ok: raise SystemExit(3)
          print(json.dumps({'stats':v.get('stats'),'safe_count':v.get('safe_count'),'direct_anex_safe_count':v.get('direct_anex_safe_count'),'live_andromeda_safe_count':v.get('live_andromeda_safe_count'),'live_andromeda_medium_count':v.get('live_andromeda_medium_count'),'operator_anchor_locals':v.get('operator_anchor_locals'),'blocked_reasons':v.get('blocked_reasons')},ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'match-tourvisor-anex-operator-identity-v3-${{ github.run_id }}', path: '${{ runner.temp }}/hotel-match-tourvisor-anex-operator-identity-review-2333-20260914-v3/', retention-days: 90}
