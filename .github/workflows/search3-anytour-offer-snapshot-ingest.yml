name: Search3 AnyTour offer snapshot ingest

on:
  pull_request:
    branches: [release/search3-production-ready-v1]
    paths:
      - 'v2/data/anytour-offer-snapshot-ingest-v1.php'
      - 'tests/anytour-offer-snapshot-ingest-v1-test.php'
      - '.github/workflows/search3-anytour-offer-snapshot-ingest.yml'

permissions:
  contents: read

jobs:
  snapshot-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anytour_offer_snapshot_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
      - name: Lint isolated LOCAL source
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/data/anytour-offer-snapshot-ingest-v1.php
          php -l tests/anytour-offer-snapshot-ingest-v1-test.php
      - name: Exercise complete snapshot visibility against disposable MySQL
        env:
          ANYTOUR_OFFER_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=anytour_offer_snapshot_test;charset=utf8mb4
          ANYTOUR_OFFER_TEST_USER: root
          ANYTOUR_OFFER_TEST_PASSWORD: root
        shell: bash
        run: |
          set -euo pipefail
          php tests/anytour-offer-snapshot-ingest-v1-test.php
