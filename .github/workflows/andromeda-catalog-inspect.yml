name: Andromeda saved catalog inspection
on:
  push:
    branches: ['feat/int-andromeda-candidates-20260909']
    paths: ['.github/workflows/andromeda-catalog-inspect.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: andromeda-candidate-read-20260909
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refuse repeat or ambiguous executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/andromeda-catalog-inspect.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f per_page=100 > "$RUNNER_TEMP/candidate-runs.json"
          python3 - <<'PY'
          import json, os, pathlib
          runs=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate-runs.json').read_text())
          assert runs['total_count']==1
          assert len(runs['workflow_runs'])==1
          assert str(runs['workflow_runs'][0]['id'])==os.environ['GITHUB_RUN_ID']
          PY
      - uses: actions/checkout@v4
        with:
          ref: 68f4bb80c0a46424b00bb23deef44c04810cf47a
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: pyatkoff/poisk-turov-test
          run-id: 34370610832
          artifact-ids: 10111736453
          merge-multiple: true
          path: ${{ runner.temp }}/saved-evidence
      - name: Verify pinned evidence and reserve seven read-only batches
        run: |
          python3 -B scripts/diagnostics/andromeda_hotel_candidates.py prepare \
            --source "$RUNNER_TEMP/saved-evidence/andromeda-hotel-evidence.json" \
            --checkpoint "$RUNNER_TEMP/andromeda-hotel-candidates.json"
      - uses: actions/upload-artifact@v4
        with:
          name: andromeda-candidate-read-reservation
          path: ${{ runner.temp }}/andromeda-hotel-candidates.json
          if-no-files-found: error
      - name: Read AnyTour candidates with unchanged read-only catalog reader
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          python3 -B scripts/diagnostics/andromeda_hotel_candidates.py capture \
            --checkpoint "$RUNNER_TEMP/andromeda-hotel-candidates.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: andromeda-hotel-candidates
          path: ${{ runner.temp }}/andromeda-hotel-candidates.json
          if-no-files-found: warn
