name: MATCH Tourvisor ANEX hotelCode CURRENT v3
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-persisted-files-dual-id-current-v1.yml]
permissions: {contents: read}
concurrency: {group: match-tv-anex-hotelcode-current-1971-v3, cancel-in-progress: false}
env: {OPERATION_ID: hotel-match-tv-anex-hotelcode-current-1971-20260914-v3}
jobs:
  resolve:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable CURRENT operation
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_db","database_writes":0,"mapping_writes":0,"tourvisor_http_calls":0,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with: {name: match-tv-anex-hotelcode-current-v3-reservation, path: '${{ runner.temp }}/hotel-match-tv-anex-hotelcode-current-1971-20260914-v3/reservation.json', retention-days: 90}
      - name: Read CURRENT Tourvisor rows where operator is ANEX
        id: current
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,tempfile
          s=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          php=r'''$root=realpath(getcwd());$h=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));require_once$h;$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');try{$exists=(bool)$db->query("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'")->fetchColumn();$rows=[];if($exists){$rows=$db->query("SELECT hotel_id,hotel_name,country_id,region_id,subregion_id,region_name,subregion_name,latitude,longitude,operator_id,operator_name,observation_count,last_seen_at FROM tour_operator_identity_observations WHERE country_id IN (1,2,4,8,9,10,12,16) AND UPPER(COALESCE(operator_name,'')) LIKE '%ANEX%' ORDER BY observation_count DESC,last_seen_at DESC LIMIT 5000")->fetchAll(PDO::FETCH_ASSOC);}$db->commit();echo json_encode(['status'=>'completed','table_exists'=>$exists,'rows'=>$rows,'database_writes'=>0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";}catch(Throwable$e){if($db->inTransaction())$db->rollBack();throw$e;}'''
          v=[os.environ.get(k,'').strip() for k in ['ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER']]
          if not all(v):raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as td:
            key=pathlib.Path(td)/'key';key.write_text(v[0]+'\n');key.chmod(0o600);known=pathlib.Path(td)/'known';cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',v[2],v[1],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(php)];p=subprocess.run(cmd,text=True,capture_output=True,timeout=180)
          if p.returncode:raise RuntimeError('current_read_failed:'+p.stderr[-500:])
          x=json.loads(p.stdout);best={}
          for r in x.get('rows') or []:
            hid=int(r.get('hotel_id') or 0)
            if hid and (hid not in best or int(r.get('observation_count') or 0)>int(best[hid].get('observation_count') or 0)):best[hid]=r
          rows=sorted(best.values(),key=lambda r:(-int(r.get('observation_count') or 0),int(r.get('hotel_id') or 0)));out={'status':'completed','operation_id':os.environ['OPERATION_ID'],'table_exists':bool(x.get('table_exists')),'raw_anex_rows':len(x.get('rows') or []),'unique_tv_hotels':len(rows),'rows':rows,'database_writes':0,'mapping_writes':0,'tourvisor_http_calls':0,'no_replay':True};(s/'current.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n');print(json.dumps({k:out[k] for k in ('table_exists','raw_anex_rows','unique_tv_hotels')},ensure_ascii=False));open(os.environ['GITHUB_OUTPUT'],'a').write('count='+str(len(rows))+'\n')
          PY
      - name: Resolve exact-name ANEX public pages
        if: steps.current.outputs.count != '0'
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import concurrent.futures,json,math,os,pathlib,re,unicodedata,urllib.parse,urllib.request
          s=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];src=json.loads((s/'current.json').read_text());slugs={1:'egypt',2:'thailand',4:'turkey',8:'maldives',9:'uae',10:'cuba',12:'sri-lanka',16:'vietnam'};countries={1:['egypt'],2:['thailand'],4:['turkey'],8:['maldives'],9:['uae','united arab emirates'],10:['cuba'],12:['sri lanka'],16:['vietnam']};generic={'hotel','hotels','resort','resorts','spa'}
          def norm(v):
            v=unicodedata.normalize('NFKD',str(v or '')).encode('ascii','ignore').decode().lower();v=re.sub(r'\b(?:ex|former|formerly)\b',' ',v);return ' '.join(x for x in re.findall(r'[a-z0-9]+',v) if x not in generic)
          def slug(v):return re.sub(r'[^a-z0-9]+','-',norm(v)).strip('-')
          def dist(a,b,c,d):
            try:a,b,c,d=map(float,(a,b,c,d))
            except:return None
            R=6371;pa,pc=math.radians(a),math.radians(c);dp=math.radians(c-a);dl=math.radians(d-b);q=math.sin(dp/2)**2+math.cos(pa)*math.cos(pc)*math.sin(dl/2)**2;return 2*R*math.asin(math.sqrt(q))
          def one(row):
            cid=int(row['country_id']);g=slug(row.get('hotel_name'))
            if not g:return {'row':row,'reason':'no_latin_slug'}
            cur=f'/hotels/{slugs[cid]}/{g}'
            for _ in range(3):
              url='https://api.anextour.ru/b2c/hotel?hotel='+urllib.parse.quote(cur,safe='');req=urllib.request.Request(url,headers={'User-Agent':'AnyTour-MATCH-tv-photo-hotelcode/1.0','Accept':'application/json'})
              try:
                with urllib.request.urlopen(req,timeout=10) as rr:data=json.loads(rr.read(3*1024*1024))
              except Exception as e:return {'row':row,'reason':'public_detail_error','error':type(e).__name__}
              if isinstance(data,list) and len(data)==1 and isinstance(data[0],dict) and data[0].get('code')==301 and isinstance(data[0].get('url'),str):cur=data[0]['url'];continue
              if not(isinstance(data,list) and data and isinstance(data[0],dict) and isinstance(data[0].get('info'),dict)):return {'row':row,'reason':'no_detail'}
              info=data[0]['info'];state=data[0].get('state') if isinstance(data[0].get('state'),dict) else {};names=[info.get(k) for k in ('name','lname','exName','exLName')];exact=norm(row.get('hotel_name')) in {norm(x) for x in names if x};st=' '.join(str(state.get(k) or '') for k in ('name','lname')).lower();country_ok=any(x in st for x in countries[cid]);km=dist(row.get('latitude'),row.get('longitude'),info.get('latitude'),info.get('longitude'))
              if not exact:return {'row':row,'reason':'name_not_exact'}
              if not country_ok:return {'row':row,'reason':'country_mismatch'}
              if km is not None and km>5:return {'row':row,'reason':'coordinate_conflict','distance_km':round(km,2)}
              return {'row':row,'reason':'candidate','anex_inc':int(info.get('inc') or 0),'anex_name':info.get('name'),'b2cLink':info.get('b2cLink'),'distance_km':None if km is None else round(km,3)}
            return {'row':row,'reason':'redirect_loop'}
          rows=src['rows'][:1500]
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:out=list(ex.map(one,rows))
          cand=[x for x in out if x.get('reason')=='candidate' and x.get('anex_inc') and x.get('b2cLink')];res={'status':'completed','operation_id':os.environ['OPERATION_ID'],'tv_rows_examined':len(rows),'exact_public_candidates':len(cand),'candidates':cand,'rejections':{k:sum(1 for x in out if x.get('reason')==k) for k in sorted({x.get('reason') for x in out})},'database_writes':0,'mapping_writes':0,'tourvisor_http_calls':0,'no_replay':True};(s/'candidates.json').write_text(json.dumps(res,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n');print(json.dumps({'tv_rows_examined':len(rows),'exact_public_candidates':len(cand),'rejections':res['rejections']},ensure_ascii=False))
          PY
      - name: Install Chromium
        if: steps.current.outputs.count != '0'
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Confirm from rendered ANEX photo URLs hotelCode
        if: steps.current.outputs.count != '0'
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');const state=process.env.RUNNER_TEMP+'/'+process.env.OPERATION_ID,src=JSON.parse(fs.readFileSync(state+'/candidates.json'));const hc=/[?&]hotelCode=([1-9][0-9]*)/i,media=/^https?:\/\/(?:files\.anextour\.(?:ru|com)|cdn\.anextour\.ru)\//i;(async()=>{const browser=await chromium.launch({headless:true});let idx=0,rows=[];async function worker(){const p=await browser.newPage();while(true){const i=idx++;if(i>=src.candidates.length)break;const c=src.candidates[i],urls=new Set();p.removeAllListeners('request');p.on('request',q=>{if(media.test(q.url()))urls.add(q.url())});let err=null;try{await p.goto(c.b2cLink,{waitUntil:'domcontentloaded',timeout:12000});await p.waitForTimeout(1600);for(const u of await p.evaluate(()=>Array.from(document.querySelectorAll('[src],[srcset],a[href]')).flatMap(e=>[e.src,e.href,e.srcset].filter(Boolean))))if(media.test(u))urls.add(u)}catch(e){err=String(e).slice(0,160)}const codes=[...new Set([...urls].map(u=>(u.match(hc)||[])[1]).filter(Boolean).map(Number))];rows.push({tourvisor_hotel_id:Number(c.row.hotel_id),tourvisor_hotel_name:c.row.hotel_name,country_id:Number(c.row.country_id),region_name:c.row.region_name,subregion_name:c.row.subregion_name,latitude:c.row.latitude,longitude:c.row.longitude,observation_count:Number(c.row.observation_count||0),anex_api_inc:Number(c.anex_inc),anex_name:c.anex_name,b2cLink:c.b2cLink,photo_hotel_codes:codes,media_url_count:urls.size,error:err,distance_km:c.distance_km});}await p.close()}await Promise.all(Array.from({length:Math.min(8,Math.max(1,src.candidates.length))},()=>worker()));await browser.close();const safe=rows.filter(r=>r.photo_hotel_codes.length===1&&r.photo_hotel_codes[0]===r.anex_api_inc).map(r=>({...r,anex_hotel_code:r.photo_hotel_codes[0],evidence:'exact_name_country_coord_guard_plus_rendered_anex_photo_hotelCode'}));const conflicts=rows.filter(r=>r.photo_hotel_codes.length>1||(r.photo_hotel_codes.length===1&&r.photo_hotel_codes[0]!==r.anex_api_inc));const out={status:'completed',operation_id:process.env.OPERATION_ID,rendered_candidates:rows.length,rows_with_media:rows.filter(r=>r.media_url_count>0).length,photo_confirmed_safe:safe.length,conflicts:conflicts.length,safe_pairs:safe,conflict_rows:conflicts,rows,database_writes:0,mapping_writes:0,tourvisor_http_calls:0,no_replay:true};fs.writeFileSync(state+'/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify({rendered_candidates:out.rendered_candidates,rows_with_media:out.rows_with_media,photo_confirmed_safe:out.photo_confirmed_safe,conflicts:out.conflicts}));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Finalize receipt
        if: always()
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          s=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];cur=json.loads((s/'current.json').read_text());rp=s/'result.json';r=json.loads(rp.read_text()) if rp.exists() else None;receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if r is not None or cur['unique_tv_hotels']==0 else 'failed_before_result','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'current_unique_tv_hotels':cur['unique_tv_hotels'],'photo_confirmed_safe':0 if r is None else r['photo_confirmed_safe'],'conflicts':0 if r is None else r['conflicts'],'database_writes':0,'mapping_writes':0,'tourvisor_http_calls':0,'historical_operations_replayed':False