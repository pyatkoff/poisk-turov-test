name: MATCH Tourvisor ANEX hotelCode CURRENT v2
on:
  push:
    branches: [match/anex-photo-url-extractor-1971-20260914]
    paths: [.github/workflows/hotel-match-persisted-files-dual-id-current-v1.yml]
permissions: {contents: read}
concurrency: {group: match-tv-anex-hotelcode-current-1971-v2, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-tv-anex-hotelcode-current-1971-20260914-v2
jobs:
  scan:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - name: Reserve immutable CURRENT operation
        run: |
          set -euo pipefail; STATE="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$STATE"
          printf '{"operation_id":"%s","run_id":%s,"source_sha":"%s","state":"reserved_before_db","database_writes":0,"mapping_writes":0,"supplier_calls":0,"tourvisor_http_calls":0,"historical_operations_replayed":false,"no_replay":true}\n' "$OPERATION_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$STATE/reservation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: match-tv-anex-hotelcode-current-v2-reservation
          path: ${{ runner.temp }}/hotel-match-tv-anex-hotelcode-current-1971-20260914-v2/reservation.json
          retention-days: 90
      - name: Read CURRENT persisted Tourvisor ANEX operator links
        id: links
        env:
          ANYTOOUR_DEPLOY_SSH_KEY: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          ANYTOOUR_DEPLOY_HOST: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          ANYTOOUR_DEPLOY_USER: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,shlex,subprocess,tempfile
          state=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']
          php=r'''
          $root=realpath(getcwd());if(!$root||basename($root)!=='anytoour.ru')throw new RuntimeException('root');$h=realpath($root.(is_file($root.'/data/db-v1.php')?'/data/db-v1.php':'/v2/data/db-v1.php'));if(!$h)throw new RuntimeException('db_helper');require_once$h;$db=v2_data_db();$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ');$db->exec('START TRANSACTION READ ONLY');
          try{$exists=(bool)$db->query("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='tour_operator_identity_observations'")->fetchColumn();if(!$exists){$db->commit();echo json_encode(['status'=>'completed','table_exists'=>false,'rows'=>[],'database_writes'=>0]);exit;}
          $sql="SELECT hotel_id,hotel_name,country_id,region_id,subregion_id,region_name,subregion_name,latitude,longitude,operator_id,operator_name,operator_link,operator_link_host,operator_link_path,operator_link_query,observation_count,last_seen_at FROM tour_operator_identity_observations WHERE country_id IN (1,2,4,8,9,10,12,16) AND operator_link IS NOT NULL AND operator_link<>'' AND (UPPER(COALESCE(operator_name,'')) LIKE '%ANEX%' OR LOWER(COALESCE(operator_link_host,'')) LIKE '%anex%') ORDER BY observation_count DESC,last_seen_at DESC LIMIT 5000";$rows=$db->query($sql)->fetchAll(PDO::FETCH_ASSOC);$db->commit();echo json_encode(['status'=>'completed','table_exists'=>true,'rows'=>$rows,'database_writes'=>0],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR),"\n";}catch(Throwable$e){if($db->inTransaction())$db->rollBack();throw$e;}
          '''
          req=['ANYTOOUR_DEPLOY_SSH_KEY','ANYTOOUR_DEPLOY_HOST','ANYTOOUR_DEPLOY_USER'];v=[os.environ.get(k,'').strip() for k in req]
          if not all(v): raise RuntimeError('ssh_secret_missing')
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as td:
            key=pathlib.Path(td)/'key';key.write_text(v[0]+'\n');key.chmod(0o600);known=pathlib.Path(td)/'known'
            cmd=['ssh','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=accept-new','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=15','-l',v[2],v[1],'cd "$HOME/www/anytoour.ru" && php -d display_errors=0 -d log_errors=0 -r '+shlex.quote(php)]
            p=subprocess.run(cmd,text=True,capture_output=True,timeout=180)
          if p.returncode: raise RuntimeError('current_read_failed:'+p.stderr[-500:])
          x=json.loads(p.stdout); rows=x.get('rows') or []
          # Deduplicate by Tourvisor hotel + exact operator link; never invent a link.
          seen=set();out=[]
          for r in rows:
            k=(int(r.get('hotel_id') or 0),str(r.get('operator_link') or ''))
            if not k[0] or not k[1] or k in seen: continue
            seen.add(k);out.append(r)
          payload={'status':'completed','operation_id':os.environ['OPERATION_ID'],'table_exists':bool(x.get('table_exists')),'raw_rows':len(rows),'unique_rows':len(out),'rows':out,'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'no_replay':True}
          (state/'operator-links.json').write_text(json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('count='+str(len(out))+'\n')
          print(json.dumps({'table_exists':payload['table_exists'],'raw_rows':len(rows),'unique_rows':len(out)},ensure_ascii=False))
          PY
      - name: Install browser only when CURRENT operator links exist
        if: steps.links.outputs.count != '0'
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Render Tourvisor-linked ANEX pages and extract native hotelCode
        if: steps.links.outputs.count != '0'
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright');
          const state=process.env.RUNNER_TEMP+'/'+process.env.OPERATION_ID;
          const src=JSON.parse(fs.readFileSync(state+'/operator-links.json','utf8'));
          const hc=/[?&]hotelCode=([1-9][0-9]*)/i;
          const media=/^https?:\/\/(?:files\.anextour\.(?:ru|com)|cdn\.anextour\.ru)\//i;
          (async()=>{const browser=await chromium.launch({headless:true});const rows=[];let idx=0;
            async function worker(){const page=await browser.newPage();while(true){const i=idx++;if(i>=src.rows.length)break;const r=src.rows[i],urls=new Set();page.removeAllListeners('request');page.on('request',q=>{const u=q.url();if(media.test(u))urls.add(u)});let err=null,final=null;try{await page.goto(r.operator_link,{waitUntil:'domcontentloaded',timeout:12000});await page.waitForTimeout(1800);final=page.url();for(const u of await page.evaluate(()=>Array.from(document.querySelectorAll('[src],[srcset],a[href]')).flatMap(e=>[e.src,e.href,e.srcset].filter(Boolean))))if(media.test(u))urls.add(u);}catch(e){err=String(e).slice(0,180)}
              const codes=[...new Set([...urls].map(u=>(u.match(hc)||[])[1]).filter(Boolean).map(Number))];rows.push({hotel_id:Number(r.hotel_id),hotel_name:r.hotel_name,country_id:Number(r.country_id),region_name:r.region_name,subregion_name:r.subregion_name,latitude:r.latitude,longitude:r.longitude,operator_id:Number(r.operator_id),operator_name:r.operator_name,operator_link:r.operator_link,final_url:final,observation_count:Number(r.observation_count||0),last_seen_at:r.last_seen_at,media_url_count:urls.size,hotel_codes:codes,error:err});}await page.close()}
            await Promise.all(Array.from({length:Math.min(8,src.rows.length)},()=>worker()));await browser.close();rows.sort((a,b)=>b.observation_count-a.observation_count||a.hotel_id-b.hotel_id);
            const byHotel=new Map();for(const r of rows){if(!byHotel.has(r.hotel_id))byHotel.set(r.hotel_id,new Set());for(const c of r.hotel_codes)byHotel.get(r.hotel_id).add(c)}
            const direct=[];const conflicts=[];for(const [hotel_id,s] of byHotel){const codes=[...s].sort((a,b)=>a-b);if(codes.length===1){const r=rows.find(x=>x.hotel_id===hotel_id);direct.push({tourvisor_hotel_id:hotel_id,tourvisor_hotel_name:r.hotel_name,country_id:r.country_id,region_name:r.region_name,subregion_name:r.subregion_name,latitude:r.latitude,longitude:r.longitude,anex_hotel_code:codes[0],evidence:'tourvisor_operator_link_to_anex_page_media_hotelCode'});}else if(codes.length>1)conflicts.push({tourvisor_hotel_id:hotel_id,hotel_codes:codes});}
            const out={status:'completed',operation_id:process.env.OPERATION_ID,operator_link_rows:src.unique_rows,rendered_rows:rows.length,rows_with_media:rows.filter(r=>r.media_url_count>0).length,rows_with_hotelcode:rows.filter(r=>r.hotel_codes.length>0).length,direct_unique_pairs:direct.length,conflicts,direct_pairs:direct,rows,database_writes:0,mapping_writes:0,supplier_calls:0,tourvisor_http_calls:0,no_replay:true};fs.writeFileSync(state+'/result.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify({operator_link_rows:out.operator_link_rows,rendered_rows:out.rendered_rows,rows_with_media:out.rows_with_media,rows_with_hotelcode:out.rows_with_hotelcode,direct_unique_pairs:out.direct_unique_pairs,conflicts:out.conflicts.length}));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Finalize durable receipt
        if: always()
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          s=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']; links=json.loads((s/'operator-links.json').read_text())
          rp=s/'result.json'; result=json.loads(rp.read_text()) if rp.exists() else None
          receipt={'operation_id':os.environ['OPERATION_ID'],'state':'completed_read_only' if result is not None or links['unique_rows']==0 else 'failed_before_result','run_id':int(os.environ['GITHUB_RUN_ID']),'source_sha':os.environ['GITHUB_SHA'],'operator_link_rows':links['unique_rows'],'direct_unique_pairs':0 if result is None else result['direct_unique_pairs'],'conflicts':0 if result is None else len(result['conflicts']),'database_writes':0,'mapping_writes':0,'supplier_calls':0,'tourvisor_http_calls':0,'historical_operations_replayed':False,'no_replay':True}
          if rp.exists():receipt['result_sha256']=hashlib.sha256(rp.read_bytes()).hexdigest()
          (s/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True)+'\n');print(json.dumps(receipt,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-tv-anex-hotelcode-current-v2-result
          path: ${{ runner.temp }}/hotel-match-tv-anex-hotelcode-current-1971-20260914-v2/
          retention-days: 90
