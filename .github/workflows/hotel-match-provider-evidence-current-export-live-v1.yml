name: MATCH provider evidence CURRENT export live v1

on:
  push:
    branches: [ops/match-provider-evidence-current-export-live-v1-1971-20260917]
    paths: [.github/workflows/hotel-match-provider-evidence-current-export-live-v1.yml]

permissions: {contents: read, actions: read}
concurrency: {group: match-provider-evidence-current-export-live-v1, cancel-in-progress: false}

env:
  OPERATION_ID: hotel-match-provider-evidence-current-export-1971-20260917-v1

jobs:
  export:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}

      - name: Verify exact read-only sources and reserve
        shell: bash
        run: |
          set -euo pipefail
          exporter=scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php
          graph=scripts/diagnostics/hotel_match_provider_evidence_graph_v1.py
          test "$(git hash-object "$exporter")" = 8de6a84af536405c857f5afe039fc7cc7317bbbc
          test "$(git hash-object "$graph")" = 6623292528119af71cf03bb3cbc9b7e4d811d846
          php -l "$exporter"
          php "$exporter" --self-test
          python3 -m py_compile "$graph"
          grep -Fq "START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY" "$exporter"
          ! grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|CREATE|TRUNCATE)\b[[:space:]]' "$exporter"
          ! grep -Eiq '(curl|wget|gateway\.samo|api\.tourvisor|parser\.anextour|AdditionalPricesDaily)' "$exporter"
          out="$RUNNER_TEMP/$OPERATION_ID"
          mkdir -m 700 "$out"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['OPERATION_ID'] / 'reservation.json'
          p.write_text(json.dumps({
              'operation_id': os.environ['OPERATION_ID'],
              'source_sha': os.environ['GITHUB_SHA'],
              'state': 'reserved_before_db_access',
              'coordination_issue': 2530,
              'queue_issue': 1971,
              'claim_comment_id': 5718186418,
              'database_writes': 0,
              'mapping_writes': 0,
              'supplier_calls': 0,
              'tourvisor_calls': 0,
              'samo_andromeda_calls': 0,
              'no_replay': True,
          }, sort_keys=True) + '\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-provider-evidence-current-export-live-v1-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-provider-evidence-current-export-1971-20260917-v1/reservation.json
          retention-days: 90

      - name: Run CURRENT read-only export
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"
          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known"
          sock="$RUNNER_TEMP/sock"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"
          else
            printf '%s' "$KEY_VALUE" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          set +e
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d allow_url_fopen=0 -d display_errors=0 -d log_errors=0 -d memory_limit=512M" < scripts/diagnostics/hotel_match_provider_evidence_current_export_v1.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$out/remote-exit.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json provider-evidence.jsonl census.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"
          tar -xzf "$out/server-operation.tgz" -C "$out/server"

      - name: Independently verify and compile CURRENT graph
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['OPERATION_ID']
          s = p / 'server'
          assert (p / 'reservation.json').read_bytes() == (s / 'reservation.json').read_bytes()
          result_b = (s / 'result.json').read_bytes()
          result = json.loads(result_b)
          receipt = json.loads((s / 'receipt.json').read_text())
          census_b = (s / 'census.json').read_bytes()
          census = json.loads(census_b)
          evidence_b = (s / 'provider-evidence.jsonl').read_bytes()
          result_sha = hashlib.sha256(result_b).hexdigest()
          evidence_sha = hashlib.sha256(evidence_b).hexdigest()
          census_sha = hashlib.sha256(census_b).hexdigest()
          zero = ['database_writes','mapping_writes','supplier_calls','tourvisor_calls','samo_andromeda_calls']
          inputs = result.get('input_counts') or {}
          ok = (
              result.get('state') == 'completed_read_only'
              and result.get('operation_id') == os.environ['OPERATION_ID']
              and result.get('source_sha') == os.environ['GITHUB_SHA']
              and int(result.get('edge_count') or 0) > 1000
              and int(inputs.get('tourvisor_identity_rows') or 0) > 1000
              and int(inputs.get('andromeda_identity_rows') or 0) > 1000
              and int(inputs.get('anex_enabled_mapping_rows') or 0) > 1000
              and result.get('provider_evidence_sha256') == evidence_sha
              and result.get('census_sha256') == census_sha
              and int(census.get('edge_count') or -1) == int(result.get('edge_count') or -2)
              and receipt.get('result_sha256') == result_sha
              and receipt.get('readback_verified') is True
              and all(int(result.get(k) or 0) == 0 for k in zero)
              and all(int(receipt.get(k) or 0) == 0 for k in zero)
          )
          gate = {
              'verified': ok,
              'state': result.get('state'),
              'edge_count': result.get('edge_count'),
              'input_counts': inputs,
              'census': result.get('census'),
              'provider_evidence_sha256': evidence_sha,
              'census_sha256': census_sha,
              'result_sha256': result_sha,
              'no_replay': True,
          }
          (p / 'workflow-readback.json').write_text(json.dumps(gate, ensure_ascii=False, sort_keys=True, indent=2) + '\n')
          print(json.dumps(gate, ensure_ascii=False, sort_keys=True))
          if not ok:
              raise SystemExit(2)
          PY
          python3 scripts/diagnostics/hotel_match_provider_evidence_graph_v1.py \
            --input "$out/server/provider-evidence.jsonl" \
            --output "$out/current-provider-evidence-graph.json"
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['OPERATION_ID']
          g = json.loads((p / 'current-provider-evidence-graph.json').read_text())
          r = json.loads((p / 'workflow-readback.json').read_text())
          assert int(g['edge_count']) == int(r['edge_count'])
          summary = {'schema': g['schema'], 'node_count': g['node_count'], 'edge_count': g['edge_count']}
          (p / 'graph-summary.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-provider-evidence-current-export-live-v1-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-provider-evidence-current-export-1971-20260917-v1/
          retention-days: 90
