name: Validate standalone navigation

on:
  pull_request:
    paths:
      - 'v2/home-v1.php'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/header-current-site.css'
      - '.github/workflows/validate-standalone-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'v2/home-v1.php'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/header-current-site.css'
      - '.github/workflows/validate-standalone-navigation.yml'

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep shared navigation available below desktop
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/site-header-v2.php >/dev/null
          php -l v2/site-page-shell-v1.php >/dev/null
          php -l v2/home-v1.php >/dev/null
          grep -Fq "require_once __DIR__ . '/site-header-v2.php';" v2/home-v1.php
          grep -Fq "require_once __DIR__ . '/site-header-v2.php';" v2/site-page-shell-v1.php
          grep -Fq 'v2_render_site_header($homePhone, $homePhoneHref' v2/home-v1.php
          grep -Fq "v2_render_site_header(\$c['phone'],\$c['phoneHref'],\$c['path'])" v2/site-page-shell-v1.php
          grep -Fq "['/rb/', 'Раннее бронирование']" v2/site-header-v2.php
          grep -Fq "['/how-to-buy/', 'Как купить']" v2/site-header-v2.php
          grep -Fq "['/country/', 'Страны']" v2/site-header-v2.php
          grep -Fq '@media(max-width:1024px)' v2/site-header-v2.css
          grep -Fq '.at-global-header__mobile{display:block' v2/site-header-v2.css
          grep -Fq '.at-global-header__nav,.at-global-header__cta{display:none}' v2/site-header-v2.css
          grep -Fq '.at-mobile-menu.is-open{display:block}' v2/header-current-site.css
          php <<'PHP'
          <?php
          require 'v2/site-header-v2.php';
          ob_start();
          v2_render_site_header('8 (800) 100-61-50', '+78001006150', '/country/turkey/');
          $html = ob_get_clean();
          if (substr_count($html, 'href="/country/" aria-current="page"') !== 2) {
              fwrite(STDERR, "nested country page must mark Countries in desktop and mobile navigation\n");
              exit(1);
          }
          if (substr_count($html, 'href="/how-to-buy/"') !== 2) {
              fwrite(STDERR, "purchase guide must exist in both desktop and mobile navigation\n");
              exit(2);
          }
          if (str_contains($html, 'href="/poisk-turov/" aria-current="page"')) {
              fwrite(STDERR, "nested country page must not mark Search as current\n");
              exit(3);
          }
          if (!v2_header_path_is_active('/country/turkey/', '/country/') || v2_header_path_is_active('/contacts/', '/country/')) {
              fwrite(STDERR, "section active-state helper contract failed\n");
              exit(4);
          }
          echo "NESTED_NAVIGATION_STATE_OK\n";
          PHP
          echo 'STANDALONE_NAVIGATION_OK'
