name: Validate standalone navigation

on:
  pull_request:
    paths:
      - 'v2/home-v1.php'
      - 'v2/home-v1.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/site-page-v1.css'
      - '.github/workflows/validate-standalone-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'v2/home-v1.php'
      - 'v2/home-v1.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/site-page-v1.css'
      - '.github/workflows/validate-standalone-navigation.yml'

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep section navigation available below desktop
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '.at-home-nav{display:none}' v2/home-v1.css; then
            echo 'Homepage navigation must not disappear on tablet/mobile' >&2
            exit 1
          fi
          if grep -Fq '.sp-nav{display:none}' v2/site-page-v1.css; then
            echo 'Content-page navigation must not disappear on tablet/mobile' >&2
            exit 2
          fi
          grep -Fq '.at-home-nav{order:4;width:100%;margin-left:0;gap:8px;overflow-x:auto' v2/home-v1.css
          grep -Fq '.sp-nav{order:4;width:100%;gap:8px;overflow-x:auto' v2/site-page-v1.css
          grep -Fq '<a href="/rb/">Раннее бронирование</a>' v2/site-page-shell-v1.php
          echo 'STANDALONE_NAVIGATION_OK'
