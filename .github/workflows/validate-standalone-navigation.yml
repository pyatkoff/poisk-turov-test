name: Validate standalone navigation

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.php'
      - 'v2/home-v1.php'
      - 'v2/home-v1.css'
      - 'v2/home-entry-v1.php'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/site-path-v1.php'
      - 'v2/site-page-shell-v1.php'
      - 'v2/form-defaults.php'
      - 'v2/poisk-turov/**'
      - 'v2/header-current-site.js'
      - 'tests/home-search-loading-handoff.cjs'
      - 'tests/home-native-artifact-fixture.py'
      - 'scripts/deploy/search3_public_install.py'
      - '.github/workflows/validate-standalone-navigation.yml'

permissions:
  contents: read
  actions: read

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set native HOME fixture path
        shell: bash
        run: echo "HOME_NATIVE_FIXTURE=$RUNNER_TEMP/home-native-navigation" >> "$GITHUB_ENV"
      - name: Keep one canonical navigation renderer
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/index.php >/dev/null
          php -l v2/site-header-v2.php >/dev/null
          php -l v2/site-page-shell-v1.php >/dev/null
          php -l v2/home-v1.php >/dev/null
          grep -Fq "require_once(__DIR__.'/site-header-v2.php');" v2/index.php
          grep -Fq "require_once __DIR__ . '/site-header-v2.php';" v2/home-v1.php
          grep -Fq "require_once __DIR__ . '/site-header-v2.php';" v2/site-page-shell-v1.php
          grep -Fq "v2_render_site_header(\$sitePhone, \$phoneHref, '/poisk-turov/');" v2/index.php
          grep -Fq 'v2_render_site_header($homePhone, $homePhoneHref' v2/home-v1.php
          grep -Fq "v2_render_site_header(\$c['phone'],\$c['phoneHref'],\$c['path'])" v2/site-page-shell-v1.php
          if grep -Fq '<header class="at-site-header"' v2/index.php; then exit 1; fi
          grep -Fq "['/rb/', 'Раннее бронирование']" v2/site-header-v2.php
          grep -Fq "['/how-to-buy/', 'Как купить']" v2/site-header-v2.php
          grep -Fq "['/country/', 'Страны']" v2/site-header-v2.php
          grep -Fq '@media(max-width:1024px)' v2/site-header-v2.css
          grep -Fq '.at-global-header__mobile{display:block' v2/site-header-v2.css
          grep -Fq '.at-global-header__nav{display:none}' v2/site-header-v2.css
          grep -Fq '.at-global-header.header .at-global-header__actions{display:none}' v2/site-header-v2.css
          grep -Fq 'max-height:calc(100dvh - 84px);overflow-y:auto' v2/site-header-v2.css
          php <<'PHP'
          <?php
          require 'v2/site-header-v2.php';
          ob_start();
          v2_render_site_header('8 (800) 100-61-50', '+78001006150', '/country/turkey/');
          $html = ob_get_clean();
          if (substr_count($html, 'href="/country/" aria-current="page"') !== 2) {
              fwrite(STDERR, "nested country page must mark Countries in desktop and mobile navigation\n");
              exit(1);
          }
          if (substr_count($html, 'href="/how-to-buy/"') !== 2) {
              fwrite(STDERR, "purchase guide must be present in desktop and mobile canonical navigation\n");
              exit(2);
          }
          if (str_contains($html, 'href="/poisk-turov/" aria-current="page"')) {
              fwrite(STDERR, "nested country page must not mark Search as current\n");
              exit(3);
          }
          if (!v2_header_path_is_active('/country/turkey/', '/country/') || v2_header_path_is_active('/contacts/', '/country/')) {
              fwrite(STDERR, "section active-state helper contract failed\n");
              exit(4);
          }
          ob_start();
          v2_render_site_header('8 (800) 100-61-50', '+78001006150', '/how-to-buy/');
          $purchaseHtml = ob_get_clean();
          if (substr_count($purchaseHtml, 'href="/how-to-buy/" aria-current="page"') !== 2) {
              fwrite(STDERR, "purchase guide must mark itself current in desktop and mobile navigation\n");
              exit(5);
          }
          if (substr_count($purchaseHtml, 'class="at-global-header__cta"') !== 1) {
              fwrite(STDERR, "ordinary pages retain one quick search CTA\n");
              exit(6);
          }
          ob_start();
          v2_render_site_header('8 (800) 100-61-50', '+78001006150', '/poisk-turov/', true);
          $searchHtml = ob_get_clean();
          if (substr_count($searchHtml, '<button type="button" data-action="top" aria-current="page">Поиск туров</button>') !== 2
              || str_contains($searchHtml, 'at-global-header__cta')
              || str_contains($searchHtml, 'data-anytour-favicon-bootstrap')) {
              fwrite(STDERR, "Search3 navigation must edit retained state, omit the duplicate CTA and preserve its favicon\n");
              exit(7);
          }
          echo "NESTED_NAVIGATION_STATE_OK\n";
          PHP
          echo 'STANDALONE_NAVIGATION_OK'

      - name: Prepare exact controller-pinned native HOME fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/home-native-artifact-fixture.py --output "$HOME_NATIVE_FIXTURE"

      - name: Validate native homepage and receiving form composition
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/home-v1.php >/dev/null
          php -l v2/home-entry-v1.php >/dev/null
          php -l v2/site-header-v2.php >/dev/null
          php -l v2/poisk-turov/index.php >/dev/null
          node --check v2/header-current-site.js
          node tests/home-search-loading-handoff.cjs
          grep -Fq "'/country/'" v2/header-current-site.js
          grep -Fq "'/hot/'" v2/header-current-site.js
          grep -Fq "'/contacts/'" v2/header-current-site.js
          grep -Fq "'/how-to-buy/'" v2/header-current-site.js
          grep -Fq "'/payment/'" v2/header-current-site.js
          echo HOME_SEARCH_HANDOFF_OK
