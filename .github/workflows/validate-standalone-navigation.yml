name: Validate standalone navigation

on:
  pull_request:
    paths:
      - 'v2/home-v1.php'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/header-current-site.css'
      - '.github/workflows/validate-standalone-navigation.yml'
  push:
    branches: [main]
    paths:
      - 'v2/home-v1.php'
      - 'v2/site-header-v2.php'
      - 'v2/site-header-v2.css'
      - 'v2/site-page-shell-v1.php'
      - 'v2/header-current-site.css'
      - '.github/workflows/validate-standalone-navigation.yml'

jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep shared navigation available below desktop
        shell: bash
        run: |
          set -euo pipefail
          php -l v2/site-header-v2.php >/dev/null
          php -l v2/site-page-shell-v1.php >/dev/null
          php -l v2/home-v1.php >/dev/null
          grep -Fq "require_once __DIR__ . '/site-header-v2.php';" v2/home-v1.php
          grep -Fq "require_once __DIR__ . '/site-header-v2.php';" v2/site-page-shell-v1.php
          grep -Fq 'v2_render_site_header($homePhone, $homePhoneHref' v2/home-v1.php
          grep -Fq "v2_render_site_header(\$c['phone'],\$c['phoneHref'],\$c['path'])" v2/site-page-shell-v1.php
          grep -Fq "['/rb/', 'Раннее бронирование']" v2/site-header-v2.php
          grep -Fq "['/country/', 'Страны']" v2/site-header-v2.php
          grep -Fq '.at-global-header__mobile{display:block' v2/site-header-v2.css
          grep -Fq '.at-global-header__nav,.at-global-header__cta{display:none}' v2/site-header-v2.css
          grep -Fq '.at-mobile-menu.is-open{display:block}' v2/header-current-site.css
          echo 'STANDALONE_NAVIGATION_OK'
