name: Visual anytoour.ru root

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/visual-anytoour-root.yml'
  workflow_run:
    workflows: ['Deploy anytoour.ru']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: visual-anytoour-root-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  visual-root:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit standalone home and search at five viewports
        shell: bash
        env:
          ROOT_URL: https://anytoour.ru/
          SEARCH_URL: https://anytoour.ru/poisk-turov/
        run: |
          set -euo pipefail
          mkdir -p anytoour-root-visual
          cat > ./visual-anytoour-root.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const viewports = [
            ['mobile-375',375,812],
            ['mobile-430',430,932],
            ['tablet-768',768,1024],
            ['intermediate-1024',1024,900],
            ['desktop-1440',1440,1000],
          ];
          const rootUrl = process.env.ROOT_URL;
          const searchUrl = process.env.SEARCH_URL;
          function fail(name, message){ throw new Error(`${name}: ${message}`); }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const report=[];
            try {
              for(const [name,width,height] of viewports){
                const context=await browser.newContext({viewport:{width,height},ignoreHTTPSErrors:true});
                const page=await context.newPage();
                const pageErrors=[];
                page.on('pageerror',e=>pageErrors.push(String(e).slice(0,400)));

                const homeResponse=await page.goto(rootUrl,{waitUntil:'domcontentloaded',timeout:45000});
                if(!homeResponse || homeResponse.status()!==200) fail(name,`home HTTP ${homeResponse&&homeResponse.status()}`);
                await page.waitForSelector('[data-home-search]',{timeout:20000});
                await page.waitForTimeout(900);
                await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}html{scroll-behavior:auto!important}'});
                const home=await page.evaluate(()=>{
                  const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0;
                  return {
                    hero:visible(document.querySelector('.at-home-hero')),
                    search:visible(document.querySelector('[data-home-search]')),
                    searchAction:document.querySelector('[data-home-search]')?.getAttribute('action')||'',
                    nights:document.querySelector('[data-home-nights]')?.value||'',
                    nightsTill:document.querySelector('[data-home-nights-till]')?.value||'',
                    community:document.querySelectorAll('.v2-site-community').length,
                    canonicalFooter:document.querySelectorAll('.at-site-footer').length,
                    overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                  };
                });
                console.log('HOME_VISUAL_STATE',name,JSON.stringify(home));
                await page.screenshot({path:`anytoour-root-visual/${name}-home.png`,fullPage:true,animations:'disabled'});
                if(!home.hero||!home.search) fail(name,'homepage hero/search not visible');
                if(home.searchAction!=='/poisk-turov/') fail(name,`homepage search action ${home.searchAction}`);
                if(home.nights!==home.nightsTill) fail(name,`homepage nights handoff mismatch ${home.nights}/${home.nightsTill}`);
                if(home.community!==1||home.canonicalFooter!==1) fail(name,`homepage footer contract ${home.community}/${home.canonicalFooter}`);
                if(home.overflow) fail(name,'homepage horizontal overflow');

                const searchResponse=await page.goto(searchUrl,{waitUntil:'domcontentloaded',timeout:45000});
                if(!searchResponse || searchResponse.status()!==200) fail(name,`search HTTP ${searchResponse&&searchResponse.status()}`);
                await page.waitForFunction(()=>window.V2_CONFIG && document.querySelector('.search-card') && document.querySelector('.main-fields .nights-ux'),null,{timeout:20000});
                await page.waitForTimeout(1200);
                await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important}html{scroll-behavior:auto!important}'});
                const search=await page.evaluate(()=>{
                  const visible=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0;
                  const nights=document.querySelector('.main-fields .nights-ux');
                  const nightsQuick=nights&&nights.querySelector('.nights-quick');
                  const nightNodes=[...(nights?.querySelectorAll('.nights-choice')||[])];
                  return {
                    hero:visible(document.querySelector('.v2-product-hero')),
                    search:visible(document.querySelector('.search-card')),
                    nightsPrimary:visible(nights),
                    nightChoices:nightNodes.filter(visible).length,
                    nightsOverflow:!!nightsQuick&&nightsQuick.scrollWidth>nightsQuick.clientWidth+2,
                    community:document.querySelectorAll('.v2-site-community').length,
                    canonicalFooter:document.querySelectorAll('.at-site-footer').length,
                    privacy:String(window.V2_CONFIG&&window.V2_CONFIG.privacyUrl||''),
                    overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                  };
                });
                console.log('SEARCH_VISUAL_STATE',name,JSON.stringify(search));
                await page.screenshot({path:`anytoour-root-visual/${name}-search.png`,fullPage:true,animations:'disabled'});
                if(!search.hero||!search.search) fail(name,'full search hero/form not visible');
                if(!search.nightsPrimary||search.nightChoices<5) fail(name,`primary duration missing choices=${search.nightChoices}`);
                if(width<=430&&search.nightsOverflow) fail(name,'trip duration overflows');
                if(search.community!==1||search.canonicalFooter!==1) fail(name,`search footer contract ${search.community}/${search.canonicalFooter}`);
                if(search.privacy!=='https://anytour.online/politika-konfidentsialnosti/') fail(name,`privacy URL ${search.privacy}`);
                if(search.overflow) fail(name,'search horizontal overflow');

                const extras=page.locator('details.extras > summary');
                if(await extras.count()){
                  await extras.click();
                  await page.waitForTimeout(150);
                  const advanced=await page.evaluate(()=>({open:!!document.querySelector('details.extras')?.open,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2}));
                  if(!advanced.open) fail(name,'advanced filters did not open');
                  if(advanced.overflow) fail(name,'horizontal overflow in advanced filters');
                  await page.screenshot({path:`anytoour-root-visual/${name}-search-filters.png`,fullPage:true,animations:'disabled'});
                }

                if(pageErrors.length) fail(name,`page errors: ${pageErrors.join(' | ')}`);
                report.push({name,width,height,home,search});
                await context.close();
              }
            } finally { await browser.close(); }
            fs.writeFileSync('anytoour-root-visual/report.json',JSON.stringify(report,null,2));
            console.log('ANYTOOUR_HOME_SEARCH_FIVE_VIEWPORT_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node ./visual-anytoour-root.cjs

      - name: Upload root visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anytoour-root-visual-${{ github.run_id }}
          path: anytoour-root-visual/
          if-no-files-found: warn
          retention-days: 7
