name: MATCH Tourvisor ledger floor1180 v1
on:
  push:
    branches: [ops/match-tv-ledger-floor1180-1971-20260919-v1]
    paths:
      - scripts/diagnostics/hotel_match_tv_ledger_floor1180_v1.py
      - .github/workflows/hotel-match-tv-ledger-floor1180-v1.yml
permissions: {contents: read, issues: read}
env:
  OPERATION_ID: hotel-match-tv-ledger-floor1180-1971-20260919-v1
  BASE_SHA: 93915088f169716d89e2e6426d6d8700dbcf0416
  CLAIM: '5744778175'
  CLAIM_EXT: '5744779410'
jobs:
  reconcile:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', fetch-depth: 0, persist-credentials: false}
      - name: Validate exact claim and source
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail;mkdir -p terminal
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA";test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l)" -eq 2
          python3 -m py_compile scripts/diagnostics/hotel_match_tv_ledger_floor1180_v1.py
          python3 scripts/diagnostics/hotel_match_tv_ledger_floor1180_v1.py --self-test
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM" >terminal/claim.json
          gh api "repos/pyatkoff/poisk-turov-test/issues/comments/$CLAIM_EXT" >terminal/claim-ext.json
          python3 - <<'PY'
          import json,os
          a=json.load(open('terminal/claim.json'));b=json.load(open('terminal/claim-ext.json'))
          assert a['user']['id']==b['user']['id']==226193297 and a['author_association']==b['author_association']=='OWNER'
          assert os.environ['OPERATION_ID'] in a['body'] and '10590198805' in a['body'] and 'exactly120' in a['body']
          assert 'accounted_requests = max' in b['body'] and 'Preserve' in b['body']
          PY
      - name: Require exact-head Security
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request
          u='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(72):
           q=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
           with urllib.request.urlopen(q) as f:r=json.load(f)['workflow_runs']
           xs=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
           if xs and max(xs,key=lambda z:z['id'])['status']=='completed':assert max(xs,key=lambda z:z['id'])['conclusion']=='success';break
           time.sleep(5)
          else:raise SystemExit(2)
          PY
      - name: Reconcile shared ledger only
        env:
          KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}'
          HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}'
          USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'
        shell: bash
        run: |
          set -euo pipefail;umask 077;key="$RUNNER_TEMP/key";known="$RUNNER_TEMP/known";if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi;chmod 600 "$key";ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null
          remote="$USER@$HOST";op=".anytoour-match/operations/$OPERATION_ID";opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known")
          ssh "${opts[@]}" "$remote" "set -eu;test ! -e \"\$HOME/$op\";mkdir -p \"\$HOME/$op\""
          scp "${opts[@]}" scripts/diagnostics/hotel_match_tv_ledger_floor1180_v1.py "$remote:$op/"
          ssh "${opts[@]}" "$remote" "MATCH_OPERATION_DIR=\"\$HOME/$op\" python3 \"\$HOME/$op/hotel_match_tv_ledger_floor1180_v1.py\" --execute"
          ssh "${opts[@]}" "$remote" 'cd "$HOME/'"$op"'" && tar -czf - result.json receipt.json' >terminal/server.tgz
      - name: Verify accounting receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tarfile,pathlib,json,hashlib
          with tarfile.open('terminal/server.tgz','r:gz') as t:
           for n in ['result.json','receipt.json']:pathlib.Path('terminal',n).write_bytes(t.extractfile(n).read())
          r=json.load(open('terminal/result.json'));q=json.load(open('terminal/receipt.json'))
          assert r['state']==q['state']=='completed_accounting_reconcile' and r['provider_calls']==r['database_writes']==r['mapping_writes']==0
          assert r['after_accounted_requests']>=1180 and r['after_accounted_requests']<=3000 and r['fields_preserved'] is True
          assert q['result_sha256']==hashlib.sha256(pathlib.Path('terminal/result.json').read_bytes()).hexdigest()
          print(json.dumps(r,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-tv-ledger-floor1180-${{ github.run_id }}', path: terminal/result.json, retention-days: 90, if-no-files-found: error}
