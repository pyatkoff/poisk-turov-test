name: MATCH user-seen420 retained detail v1
on:
  push:
    branches: [ops/match-user-seen420-retained-detail-1971-20260919-v1]
    paths: [.github/workflows/hotel-match-user-seen420-retained-detail-v1.yml]
permissions: {contents: read, actions: read}
concurrency: {group: match-user-seen420-retained-detail-1971-20260919-v1, cancel-in-progress: false}
env:
  OPERATION_ID: hotel-match-user-seen420-retained-detail-1971-20260919-v1
jobs:
  acquire:
    if: github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Build immutable one-call payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p payload result
          test "$(git hash-object scripts/diagnostics/hotel_match_mauritius11771_retained_detail_v1.py)" = f6527a6e0eee3b4d7ded3dd2527576d166a9a502
          test "$(git hash-object app/integrations/anex-search-mapping-registry.php)" = cc135a95d2a6e0f73ce50be2141c9b8a26fddc58
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/diagnostics/hotel_match_mauritius11771_retained_detail_v1.py').read_text()
          repl={
            "OP='hotel-match-mauritius11771-retained-detail-1971-20260919-v1'":"OP='hotel-match-user-seen420-retained-detail-1971-20260919-v1'",
            "FLOOR=595; LOCAL_ID=11771; TOUR_ID='13278420158714'":"FLOOR=798; LOCAL_ID=420; TOUR_ID='13271979542549'",
            "detail-11771.raw":"detail-420.raw",
            "M11771_SELFTEST_OK":"USER_SEEN420_RETAINED_SELFTEST_OK",
          }
          for a,b in repl.items(): assert s.count(a)==1,(a,s.count(a));s=s.replace(a,b)
          Path('payload/acquire.py').write_text(s)
          Path('payload/anex-search-mapping-registry.php').write_bytes(Path('app/integrations/anex-search-mapping-registry.php').read_bytes())
          PY
          python3 -m py_compile payload/acquire.py
          python3 payload/acquire.py --self-test
          rm -rf payload/__pycache__
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          r={'operation':os.environ['OPERATION_ID'],'state':'reserved_input_before_provider_access','source_sha':os.environ['GITHUB_SHA'],'local_id':420,'tour_id':'13271979542549','daily_floor':798,'daily_limit':3000,'provider_call_cap':1,'frontier_result_sha256':'db562d9c8cf05e46d2744bd93c32f0383ccd57f16488053481655ed85b84ac3b','observed_context':{'departure_id':1,'country_id':1,'departure_date':'2026-12-24','nights':9,'operator_id':13,'hotel_name':'SHAMS ALAM RESORT'},'no_search_start':True,'no_continue':True,'mapping_writes':0,'no_replay_after_first_http':True}
          p=pathlib.Path('payload/reservation.json')
          with p.open('x') as f:json.dump(r,f,sort_keys=True);f.write('\n');f.flush();os.fsync(f.fileno())
          pathlib.Path('result/reservation.json').write_bytes(p.read_bytes())
          pathlib.Path('payload/source-sha256.json').write_text(json.dumps({'acquire.py':hashlib.sha256(pathlib.Path('payload/acquire.py').read_bytes()).hexdigest(),'registry':hashlib.sha256(pathlib.Path('payload/anex-search-mapping-registry.php').read_bytes()).hexdigest()},sort_keys=True)+'\n')
          PY
      - name: Require exact-head Security before provider access
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          for _ in range(60):
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as f:r=json.load(f)['workflow_runs']
            r=[x for x in r if x['name']=='Security guard' and x['head_sha']==os.environ['GITHUB_SHA']]
            if r:
              x=max(r,key=lambda x:x['id'])
              if x['status']=='completed':assert x['conclusion']=='success';print('SECURITY_OK',x['id']);break
            time.sleep(5)
          else:raise SystemExit('exact_security_not_available')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'match-user-seen420-reservation-${{ github.run_id }}', path: result/reservation.json, retention-days: 90, if-no-files-found: error}
      - name: Execute exactly one retained detail call
        shell: bash
        env: {KEY: '${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}', HOST: '${{ secrets.ANYTOOUR_DEPLOY_HOST }}', USER: '${{ secrets.ANYTOOUR_DEPLOY_USER }}'}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/u420-key";known="$RUNNER_TEMP/u420-known";trap 'rm -f "$key" "$known"' EXIT
          test -n "$KEY";test -n "$HOST";test -n "$USER";if [[ "$KEY" == *"PRIVATE KEY"* ]];then printf '%s\n' "$KEY"|tr -d '\r'>"$key";else printf '%s' "$KEY"|base64 --decode>"$key";fi
          chmod 600 "$key";ssh-keygen -y -f "$key">/dev/null;ssh-keyscan -T 15 -t ed25519 "$HOST">"$known" 2>/dev/null;test -s "$known"
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15);remote="$USER@$HOST";op=".anytour-operations/$OPERATION_ID"
          ssh "${opts[@]}" "$remote" "set -e;umask 077;mkdir -p \"\$HOME/.anytour-operations\";test ! -e \"\$HOME/$op\";mkdir \"\$HOME/$op\";mkdir \"\$HOME/$op/payload\"" >result/setup.stdout 2>result/setup.stderr
          scp "${opts[@]}" payload/* "$remote:$op/payload/" >result/copy.stdout 2>result/copy.stderr
          set +e;ssh "${opts[@]}" "$remote" "umask 077;ANYTOUR_ROOT=\"\$HOME/www/anytoour.ru\" MATCH_OPERATION_DIR=\"\$HOME/$op\" python3 \"\$HOME/$op/payload/acquire.py\" --execute" >result/remote.stdout 2>result/remote.stderr;rc=$?;scp -r "${opts[@]}" "$remote:$op/." result/remote/ >result/readback.stdout 2>result/readback.stderr;trc=$?;set -e
          printf '{"remote":%s,"readback":%s}\n' "$rc" "$trc">result/exit-codes.json;test "$trc" -eq 0
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('result/remote');d=json.loads((p/'result.json').read_bytes());r=json.loads((p/'receipt.json').read_bytes());digest=hashlib.sha256((p/'result.json').read_bytes()).hexdigest()
          assert d['operation']==r['operation']=='hotel-match-user-seen420-retained-detail-1971-20260919-v1' and r['result_sha256']==digest and r['no_replay'] is True
          assert d['provider_calls']==1 and d['database_writes']==d['mapping_writes']==0 and d['no_search_start'] is True and d['no_continue'] is True
          assert d['state'] in ('completed_anchor','completed_hold','terminal_failed_no_replay')
          if d['state']=='completed_anchor':
            e=d['evidence'];assert e['local_id']==420 and e['tour_id']=='13271979542549' and e['http_status']==200 and e['operator_id'] in (None,13) and e['returned_hotel_id'] in (None,420) and isinstance(e['native_anex_id'],int) and e['native_anex_id']>0
          pathlib.Path('result/verified-summary.json').write_text(json.dumps({'state':d['state'],'provider_calls':1,'evidence':d.get('evidence'),'result_sha256':digest},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'state':d['state'],'native':(d.get('evidence') or {}).get('native_anex_id'),'reason':(d.get('evidence') or {}).get('reason'),'result_sha256':digest},ensure_ascii=False))
          PY
          test "$rc" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'match-user-seen420-retained-${{ github.run_id }}', path: result/, retention-days: 90, if-no-files-found: error}
