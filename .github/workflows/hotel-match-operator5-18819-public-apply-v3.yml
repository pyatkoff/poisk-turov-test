name: MATCH operator5 18819 sealed evidence apply v3

on:
  push:
    branches: [diag/match-current-live-frequency-dossier-1971-20260917-v1]
    paths:
      - scripts/diagnostics/hotel_match_operator5_18819_public_apply_v3.php
      - reports/hotel-match-operator5-18819-public-validated-v2-20260917.json
      - .github/workflows/hotel-match-operator5-18819-public-apply-v3.yml

permissions: {contents: read, actions: read}

concurrency:
  group: hotel-match-operator5-18819-public-apply-1971-20260917-v3
  cancel-in-progress: false

env:
  OPERATION_ID: hotel-match-operator5-18819-public-apply-1971-20260917-v3

jobs:
  apply:
    if: github.repository == 'pyatkoff/poisk-turov-test' && github.actor == 'pyatkoff' && github.run_attempt == 1 && github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ github.sha }}', persist-credentials: false, fetch-depth: 1}

      - name: Validate exact sealed inputs
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/diagnostics/hotel_match_operator5_18819_public_apply_v3.php >/dev/null
          test "$(git hash-object scripts/diagnostics/hotel_match_operator5_18819_public_apply_v3.php)" = aec6d4aaec7082ddc0a9ea5d70018d524f1878b6
          test "$(git hash-object reports/hotel-match-operator5-18819-public-validated-v2-20260917.json)" = 447bb1ae2fdd8828dcf08fffa011b56c2732d761
          python3 - <<'PY'
          import json
          d=json.load(open('reports/hotel-match-operator5-18819-public-validated-v2-20260917.json',encoding='utf-8'))
          assert d['verified'] is True and d['supplier']=='ANEX' and d['native_hotel_id']=='18819'
          assert d['page_sha256']=='45f5fad8097dc417ec9e5e1fe8b69947bec25456df100f5690b36be600385ffa'
          assert d['provenance']['run_id']=='35225665006' and d['provenance']['result_artifact_id']=='10498759630'
          assert d['provenance']['result_artifact_zip_sha256']=='eb00d345c5fda79926cb93ef81cbe4e22122ab1f163a42e77ef376c33851631e'
          assert d['candidate_local']['local_hotel_id']==56551
          PY

      - name: Reserve before DB access
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; mkdir -m 700 "$out"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID']/'reservation.json'
          p.write_text(json.dumps({
            'operation_id':os.environ['OPERATION_ID'],'source_sha':os.environ['GITHUB_SHA'],
            'state':'reserved_before_db_access','coordination_issue':2530,'queue_issue':1971,
            'claim_comment_id':5714955454,'database_writes':0,'mapping_writes':0,
            'supplier_calls':0,'tourvisor_calls':0,'samo_andromeda_calls':0,
            'public_http_calls':0,'no_replay':True
          },sort_keys=True)+'\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: match-operator5-18819-public-apply-v3-reservation-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-operator5-18819-public-apply-1971-20260917-v3/reservation.json
          retention-days: 90

      - name: Apply exact CURRENT guarded mapping from sealed evidence
        env:
          KEY_VALUE: ${{ secrets.ANYTOOUR_DEPLOY_SSH_KEY }}
          H: ${{ secrets.ANYTOOUR_DEPLOY_HOST }}
          U: ${{ secrets.ANYTOOUR_DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$OPERATION_ID"; key="$RUNNER_TEMP/key"; known="$RUNNER_TEMP/known"; sock="$RUNNER_TEMP/sock"
          cp reports/hotel-match-operator5-18819-public-validated-v2-20260917.json "$out/public-evidence.json"
          if [[ "$KEY_VALUE" == *"PRIVATE KEY"* ]]; then printf '%s\n' "$KEY_VALUE" | tr -d '\r' > "$key"; else printf '%s' "$KEY_VALUE" | base64 --decode > "$key"; fi
          chmod 600 "$key"; ssh-keygen -y -f "$key" >/dev/null
          trap 'ssh -S "$sock" -O exit "$U@$H" >/dev/null 2>&1 || true; rm -f "$key" "$known"' EXIT
          ssh -M -S "$sock" -fnNT -o ControlPersist=300 -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$known" -o ConnectTimeout=20 "$U@$H"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; p=\"\$HOME/.anytoour-match/operations/$OPERATION_ID\"; mkdir \"\$p\"; cat > \"\$p/reservation.json\"; sync" < "$out/reservation.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "set -e; umask 077; cat > \"\$HOME/.anytoour-match/operations/$OPERATION_ID/public-evidence.json\"; sync" < "$out/public-evidence.json"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "cd \"\$HOME/www/anytoour.ru\" && MATCH_OPERATION_ID='$OPERATION_ID' MATCH_SOURCE_SHA='$GITHUB_SHA' php -d display_errors=0 -d log_errors=0" < scripts/diagnostics/hotel_match_operator5_18819_public_apply_v3.php > "$out/remote-stdout.txt" 2> "$out/remote-stderr.txt"
          ssh -S "$sock" -T -o ControlMaster=no "$U@$H" "tar -C \"\$HOME/.anytoour-match/operations/$OPERATION_ID\" -czf - reservation.json public-evidence.json result.json receipt.json" > "$out/server-operation.tgz"
          mkdir "$out/server"; tar -xzf "$out/server-operation.tgz" -C "$out/server"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/os.environ['OPERATION_ID'];s=p/'server'
          r=json.loads((s/'result.json').read_text());c=json.loads((s/'receipt.json').read_text());h=hashlib.sha256((s/'result.json').read_bytes()).hexdigest();state=r.get('state')
          counts_ok=((state=='committed_verified' and r.get('database_writes')==1 and r.get('mapping_writes')==1) or (state=='completed_no_write' and r.get('database_writes')==0 and r.get('mapping_writes')==0))
          ok=state in ('committed_verified','completed_no_write') and counts_ok and c.get('result_sha256')==h and c.get('readback_verified') is True and c.get('supplier_calls')==0 and c.get('tourvisor_calls')==0 and c.get('samo_andromeda_calls')==0 and c.get('public_http_calls')==0
          g={'verified':ok,'state':state,'error_code':r.get('error_code'),'mapping':r.get('mapping'),'held_118706_preserved':r.get('held_118706_preserved'),'pending_after':r.get('pending_after'),'result_sha256':h,'no_replay':True}
          (p/'workflow-readback.json').write_text(json.dumps(g,ensure_ascii=False,sort_keys=True,indent=2)+'\n');print(json.dumps(g,ensure_ascii=False,sort_keys=True));raise SystemExit(0 if ok else 2)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: match-operator5-18819-public-apply-v3-result-${{ github.run_id }}
          path: ${{ runner.temp }}/hotel-match-operator5-18819-public-apply-1971-20260917-v3/
          retention-days: 90
